<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="프리라이팅">
<title>프리라이팅 · 모바일</title>
<style>
:root{
  --bg:#fbfbfa; --fg:#1c1c1a; --muted:#8b8b85; --faint:#c4c4bd;
  --line:#e6e5e0; --card:#ffffff; --accent:#1c1c1a;
  --ok:#3d7a5a; --warn:#b06a2c; --bad:#a8443a;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#141413; --fg:#e8e6e1; --muted:#7d7c76; --faint:#4a4945;
    --line:#2a2926; --card:#1b1b19; --accent:#e8e6e1; --ok:#6fae8a; --warn:#d99a5b; --bad:#d4796e; }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}

#shell{max-width:640px;margin:0 auto;padding:0 20px 110px}
header{display:flex;align-items:baseline;padding:22px 0 18px}
h1{font-size:15px;font-weight:600}
h1 small{font-weight:400;color:var(--faint);font-size:12px;margin-left:7px}

/* bottom tab */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);
  border-top:1px solid var(--line);display:flex;z-index:40;
  padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;padding:13px 0 11px;font-size:13px;color:var(--muted)}
#tabs button.on{color:var(--fg);font-weight:600}
.badge{display:inline-block;min-width:16px;height:16px;line-height:16px;padding:0 4px;
  border-radius:8px;background:var(--bad);color:#fff;font-size:10px;text-align:center;margin-left:4px;vertical-align:2px}
.view{display:none}.view.on{display:block}

.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:10px}
.mut{color:var(--muted)}.fnt{color:var(--faint)}.sm{font-size:14px}.xs{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13.5px;line-height:1.7}
.empty{color:var(--muted);font-size:14px;padding:32px 0;text-align:center;
  border:1px dashed var(--line);border-radius:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
hr{border:none;border-top:1px solid var(--line);margin:16px 0}

input,select{background:transparent;border:1px solid var(--line);border-radius:9px;
  padding:11px 12px;outline:none;width:100%;font-size:16px;-webkit-appearance:none;appearance:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
label.f>*{color:var(--fg)}
.btn{border:1px solid var(--line);border-radius:9px;padding:12px 18px;font-size:15px}
.btn.pri{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.ghost{border-color:transparent;color:var(--muted);padding:10px 8px}
.btn.blk{width:100%;text-align:center}
.btn:disabled{opacity:.35}

.big{font-size:24px;font-weight:500;letter-spacing:-.02em;margin-bottom:6px}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.chip{border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-size:14px;color:var(--muted)}
.chip.on{border-color:var(--fg);color:var(--fg)}
.tg{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-bottom:12px}
.tg input{-webkit-appearance:checkbox;appearance:auto;width:19px;height:19px;
  margin-top:3px;padding:0;border:none;flex:none;accent-color:var(--fg)}
.tg small{display:block;color:var(--muted);font-size:12.5px}

/* stage */
#stage{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;
  padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom)}
#stage.on{display:flex}
#clock{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.1em;
  color:var(--faint);text-align:center;padding:16px 0 6px}
#clock.low{color:var(--warn)}
#bar{height:1px;background:var(--line);margin-bottom:16px}
#bar>i{display:block;height:100%;background:var(--fg);width:0;transition:width 1s linear}
#pad{flex:1;background:transparent;border:none;outline:none;resize:none;
  font-size:17px;line-height:1.9;font-family:inherit}
#pad.blind{color:transparent;text-shadow:0 0 11px rgba(128,128,128,.55);caret-color:var(--fg)}
#stagefoot{display:flex;justify-content:space-between;align-items:center;padding:10px 0;
  font-size:12.5px;color:var(--faint)}

.item{border-bottom:1px solid var(--line);padding:15px 2px}
.item:last-child{border-bottom:none}
.top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.prev{color:var(--muted);font-size:13.5px;margin-top:6px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.body{white-space:pre-wrap;line-height:1.9;font-size:16px;margin:14px 0}
.dot::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--bad);vertical-align:3px;margin-left:6px}

#veil{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;z-index:60;
  align-items:flex-end;justify-content:center}
#veil.on{display:flex}
#modal{background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  padding:24px 22px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:640px;max-height:85vh;overflow:auto}
#modal h3{font-size:15px;font-weight:600;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--fg);color:var(--bg);font-size:13px;padding:9px 16px;border-radius:20px;
  z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.on{opacity:1}
.stat{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:none}
.banner{border:1px solid var(--fg);border-radius:12px;padding:13px 15px;margin-bottom:20px;
  display:flex;align-items:center;gap:12px;font-size:14px;line-height:1.5}
.banner .btn{margin-left:auto;flex:none}
</style>
</head>
<body>
<div id="shell">
  <header><h1>프리라이팅<small>모바일</small></h1></header>

  <!-- 쓰기 -->
  <section class="view on" id="v-write">
    <div id="banner"></div>
    <div class="big" id="greet">15분.</div>
    <div class="hint">여기서는 쓰기만 합니다. 쓴 글은 데스크톱으로 가져가 병합합니다.</div>
    <div class="opts" id="durs"></div>
    <label class="f">프로젝트<select id="wproj"></select></label>
    <label class="f">열리는 시각
      <select id="wlock">
        <option value="1">내일 아침</option><option value="2">이틀 뒤</option>
        <option value="3">사흘 뒤</option><option value="7">일주일 뒤</option>
      </select></label>
    <div style="margin:18px 0 22px">
      <label class="tg"><input type="checkbox" id="tNoDel"><span>지우기 금지<small>백스페이스를 막습니다.</small></span></label>
      <label class="tg"><input type="checkbox" id="tBlind"><span>안 보고 쓰기<small>글자를 흐리게 가립니다.</small></span></label>
    </div>
    <button class="btn pri blk" id="go" style="padding:14px">시작</button>
    <div class="hint xs" style="margin-top:12px" id="resume"></div>
    <div class="hint xs" id="setupwarn" style="margin-top:18px"></div>
  </section>

  <!-- 서랍 -->
  <section class="view" id="v-drawer"><div id="list"></div></section>

  <!-- 동기화 -->
  <section class="view" id="v-sync">
    <div class="lbl">데스크톱으로 보내기</div>
    <div class="card">
      <div class="hint" id="syncinfo"></div>
      <button class="btn pri blk" id="exp" style="margin-top:14px">글 내보내기</button>
      <div class="hint xs" style="margin-top:10px">파일을 AirDrop이나 iCloud로 데스크톱에 옮긴 뒤,
        데스크톱 앱 설정 → <b>모바일 글 가져오기</b>로 병합합니다. 같은 글은 중복되지 않습니다.</div>
      <hr>
      <button class="btn blk" id="clean">데스크톱에 옮긴 글 정리</button>
      <div class="hint xs" style="margin-top:8px">병합을 마친 뒤에만 누르세요. 내보낸 적 있는 글을 이 기기에서 지웁니다.</div>
    </div>

    <div class="lbl">데스크톱에서 가져오기</div>
    <div class="card">
      <div class="hint">프로젝트 목록과 기본 설정은 데스크톱이 원본입니다.
        데스크톱 앱 설정 → <b>모바일로 설정 내보내기</b>로 만든 파일을 여기서 불러옵니다.</div>
      <button class="btn blk" id="imp" style="margin-top:14px">설정 파일 불러오기</button>
      <input type="file" id="impf" accept=".json,application/json" hidden>
      <div class="hint xs num" id="lastimp" style="margin-top:10px"></div>
    </div>

    <div class="lbl">이 기기</div>
    <div class="card"><div id="mstats"></div></div>
  </section>
</div>

<nav id="tabs">
  <button data-v="write" class="on">쓰기</button>
  <button data-v="drawer">서랍<span id="nbadge"></span></button>
  <button data-v="sync">동기화<span id="sbadge"></span></button>
</nav>

<div id="stage">
  <div id="clock">15:00</div>
  <div id="bar"><i></i></div>
  <textarea id="pad" spellcheck="false" autocapitalize="sentences" placeholder="…"></textarea>
  <div id="stagefoot"><span id="cnt">0자</span><button class="btn ghost" id="stop">종료</button></div>
</div>

<div id="veil"><div id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='freewrite.mobile.v1';
const DEF={entries:[],draft:null,projects:[],device:null,lastImport:null,
  settings:{dur:15,hour:6,noDel:true,blind:false}};
let D=load();
function load(){ try{ const r=JSON.parse(localStorage.getItem(KEY));
  if(r&&r.settings) return Object.assign({},DEF,r,{settings:Object.assign({},DEF.settings,r.settings)});}catch(e){}
  return JSON.parse(JSON.stringify(DEF)); }
function save(){ localStorage.setItem(KEY,JSON.stringify(D)); }
const S=()=>D.settings;
if(!D.device){ D.device='m-'+Math.random().toString(36).slice(2,8); save(); }
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7)+'.'+D.device;

const pad2=n=>String(n).padStart(2,'0');
const DAY=86400000;
function ymd(t){const d=new Date(t);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
function fmtD(t){const d=new Date(t);return `${d.getMonth()+1}. ${d.getDate()}.`;}
function until(t){let s=Math.max(0,Math.round((t-Date.now())/1000));
  const d=Math.floor(s/86400);s-=d*86400;const h=Math.floor(s/3600);s-=h*3600;const m=Math.floor(s/60);
  if(d>0)return`${d}일 ${h}시간 뒤`; if(h>0)return`${h}시간 ${m}분 뒤`; return`${m}분 뒤`;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function chars(t){return t.replace(/\s/g,'').length;}
const isOpen=e=>Date.now()>=e.unlockAt;
const pname=id=>{const p=D.projects.find(p=>p.id===id);return p?p.name:'분류 없음';};
let tmr;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('on');
  clearTimeout(tmr);tmr=setTimeout(()=>el.classList.remove('on'),2100);}

/* tabs */
$$('#tabs button').forEach(b=>b.onclick=()=>{
  $$('#tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  $$('.view').forEach(v=>v.classList.remove('on'));$('#v-'+b.dataset.v).classList.add('on');
  if(b.dataset.v==='drawer')renderList();
  if(b.dataset.v==='sync')renderSync();
  window.scrollTo(0,0);});

/* write */
let dur=null,blind=false,noDel=false;
function renderSetup(){
  dur=dur||S().dur;
  const opts=[...new Set([5,10,15,20,30,S().dur,dur])].sort((a,b)=>a-b);
  $('#durs').innerHTML=opts.map(m=>`<button class="chip${m===dur?' on':''}" data-m="${m}">${m}분</button>`).join('');
  $$('#durs .chip').forEach(c=>c.onclick=()=>{dur=+c.dataset.m;$('#greet').textContent=`${dur}분.`;renderSetup();});
  $('#greet').textContent=`${dur}분.`;
  $('#wproj').innerHTML=`<option value="">분류 없음</option>`+
    D.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  const lp=localStorage.getItem('fwm.lastproj'); if(lp)$('#wproj').value=lp;
  $('#tNoDel').checked=noDel=S().noDel; $('#tBlind').checked=blind=S().blind;
  $('#setupwarn').innerHTML=D.projects.length?'':'프로젝트가 비어 있습니다. 동기화 탭에서 데스크톱 설정 파일을 불러오면 채워집니다.';
  const dr=D.draft;
  $('#resume').innerHTML=dr&&dr.text&&dr.text.trim()
    ?`저장하지 않은 글이 있습니다 (${chars(dr.text)}자). <button class="btn ghost xs" id="rsm" style="padding:0">이어 쓰기</button> · <button class="btn ghost xs" id="dsc" style="padding:0">버리기</button>`:'';
  if($('#rsm'))$('#rsm').onclick=()=>start(D.draft.text);
  if($('#dsc'))$('#dsc').onclick=()=>{D.draft=null;save();renderSetup();};
}
$('#tNoDel').onchange=e=>{noDel=S().noDel=e.target.checked;save();};
$('#tBlind').onchange=e=>{blind=S().blind=e.target.checked;save();};

function unlockTime(){const d=new Date();d.setDate(d.getDate()+(+$('#wlock').value||1));
  d.setHours(S().hour,0,0,0);if(d.getTime()<=Date.now())d.setTime(d.getTime()+DAY);return d.getTime();}

let endAt=0,tick=null,startedAt=0;
function start(pre){
  startedAt=Date.now();endAt=Date.now()+dur*60000;
  const pd=$('#pad');pd.value=pre||'';pd.classList.toggle('blind',blind);
  $('#stage').classList.add('on');pd.focus();
  run();tick=setInterval(run,1000);}
function run(){
  const left=Math.max(0,endAt-Date.now());
  $('#clock').textContent=`${pad2(Math.floor(left/60000))}:${pad2(Math.floor(left%60000/1000))}`;
  $('#clock').classList.toggle('low',left<60000&&left>0);
  $('#bar>i').style.width=(100-left/(dur*60000)*100)+'%';
  D.draft={text:$('#pad').value,at:Date.now()};
  if(Date.now()%5000<1100)save();
  if(left<=0){clearInterval(tick);tick=null;$('#clock').textContent='끝';finish();}}
$('#pad').oninput=e=>{$('#cnt').textContent=chars(e.target.value)+'자';};
let composing=false;
$('#pad').addEventListener('compositionstart',()=>composing=true);
$('#pad').addEventListener('compositionend',()=>composing=false);
$('#pad').onkeydown=e=>{
  if(noDel&&!composing&&!e.isComposing&&e.keyCode!==229&&(e.key==='Backspace'||e.key==='Delete'))e.preventDefault();};
$('#pad').addEventListener('beforeinput',e=>{
  if(!noDel)return;
  if(e.inputType==='insertFromPaste'){e.preventDefault();toast('붙여넣기는 막혀 있습니다');return;}
  if(composing||e.isComposing)return; /* 한글 조합 중에는 IME가 지우기 신호를 쓰므로 막지 않는다 */
  if(e.inputType&&e.inputType.startsWith('delete'))e.preventDefault();
});
$('#pad').onpaste=e=>{if(noDel){e.preventDefault();toast('붙여넣기는 막혀 있습니다');}};
$('#stop').onclick=()=>finish();
$('#go').onclick=()=>start('');

function finish(){
  if(tick){clearInterval(tick);tick=null;}
  const text=$('#pad').value;
  const spent=Math.round((Date.now()-startedAt)/1000);
  $('#stage').classList.remove('on');
  if(!text.trim()){D.draft=null;save();renderSetup();return;}
  const ut=unlockTime();
  D.entries.unshift({id:uid(),projectId:$('#wproj').value||null,text,createdAt:Date.now(),
    unlockAt:ut,sec:spent,seen:false,src:'mobile',exported:false});
  D.draft=null;localStorage.setItem('fwm.lastproj',$('#wproj').value||'');save();
  $('#pad').value='';$('#cnt').textContent='0자';
  renderSetup();refreshBadge();
  modal(`<h3>넣어 두었습니다</h3>
    <div class="hint" style="line-height:1.8">${chars(text)}자 · ${Math.floor(spent/60)}분<br>
    ${until(ut)} 열립니다. 데스크톱에 병합해도 잠금 시각은 그대로 갑니다.</div>
    <button class="btn pri blk" id="okm" style="margin-top:18px">닫기</button>`);
  $('#okm').onclick=closeModal;
}

/* drawer */
function refreshBadge(){
  const n=D.entries.filter(e=>isOpen(e)&&!e.seen).length;
  $('#nbadge').innerHTML=n?`<span class="badge">${n}</span>`:'';
  const x=D.entries.filter(e=>!e.exported).length;
  const hot=D.entries.some(e=>isOpen(e)&&!e.exported);
  $('#sbadge').innerHTML=x?`<span class="badge"${hot?'':' style="background:var(--muted)"'}>${x}</span>`:'';
  renderBanner();}
function renderBanner(){
  const el=$('#banner'); if(!el)return;
  const n=D.entries.filter(e=>isOpen(e)&&!e.exported).length;
  el.innerHTML=n?`<div class="banner"><span>열린 글 <b>${n}편</b> —<br>데스크톱으로 옮길 시간입니다.</span>
    <button class="btn pri" id="bexp">내보내기</button></div>`:'';
  if($('#bexp'))$('#bexp').onclick=doExport;}
function renderList(){
  if(!D.entries.length){$('#list').innerHTML=`<div class="empty">아직 없습니다.</div>`;return;}
  const open=D.entries.filter(isOpen),lock=D.entries.filter(e=>!isOpen(e)).sort((a,b)=>a.unlockAt-b.unlockAt);
  let h='';
  if(open.length)h+=`<div class="lbl">열린 글 ${open.length}</div>`+open.map(card).join('');
  if(lock.length)h+=`<div class="lbl">잠긴 글 ${lock.length}</div>`+lock.map(card).join('');
  $('#list').innerHTML=h;
  $$('#list [data-act]').forEach(b=>b.onclick=()=>{
    const e=D.entries.find(x=>x.id===b.dataset.id);if(!e)return;
    const a=b.dataset.act;
    if(a==='open'){e._exp=true;e.seen=true;save();renderList();refreshBadge();}
    if(a==='fold'){e._exp=false;renderList();}
    if(a==='copy')navigator.clipboard.writeText(e.text).then(()=>toast('복사했습니다'));
    if(a==='del'&&confirm('버립니다. 되돌릴 수 없습니다.')){
      D.entries=D.entries.filter(x=>x.id!==e.id);save();renderList();refreshBadge();}});}
function card(e){
  const o=isOpen(e);
  const head=`<div class="top"><strong class="sm">${fmtD(e.createdAt)}</strong>
    <span class="tag">${esc(pname(e.projectId))}</span>
    <span class="xs fnt num">${chars(e.text)}자</span>
    <span style="margin-left:auto" class="xs mut num">${o?(e.exported?'옮김':'미전송'):'🔒 '+until(e.unlockAt)}</span></div>`;
  if(!o)return`<div class="item">${head}<div class="prev fnt">잠겨 있습니다. 데스크톱에 병합해도 시각은 유지됩니다.</div></div>`;
  return`<div class="item"><div class="${e.seen?'':'dot'}"></div>${head}
    ${e._exp?`<div class="body">${esc(e.text)}</div>
      <div class="row"><button class="btn" data-act="copy" data-id="${e.id}">복사</button>
      <button class="btn ghost" data-act="fold" data-id="${e.id}">접기</button>
      <button class="btn ghost" data-act="del" data-id="${e.id}">버리기</button></div>`
    :`<div class="prev">${esc(e.text.slice(0,100))}</div>
      <button class="btn ghost xs" data-act="open" data-id="${e.id}" style="padding-left:0">펼치기</button>`}</div>`;}

/* sync */
function renderSync(){
  const pend=D.entries.filter(e=>!e.exported);
  $('#syncinfo').innerHTML=pend.length
    ?`아직 옮기지 않은 글이 <b>${pend.length}편</b> 있습니다. (총 ${D.entries.length}편)`
    :`모든 글을 옮겼습니다. (총 ${D.entries.length}편)`;
  $('#lastimp').textContent=D.lastImport
    ?`마지막 설정 불러오기: ${new Date(D.lastImport).toLocaleString('ko-KR')} · 프로젝트 ${D.projects.length}개`
    :`아직 설정을 불러온 적이 없습니다.`;
  const tot=D.entries.reduce((s,e)=>s+chars(e.text),0);
  $('#mstats').innerHTML=`
    <div class="stat"><span class="mut">글</span><span class="num">${D.entries.length}편</span></div>
    <div class="stat"><span class="mut">총 글자</span><span class="num">${tot.toLocaleString()}자</span></div>
    <div class="stat"><span class="mut">기기 ID</span><span class="num">${D.device}</span></div>`;}
function doExport(){
  if(!D.entries.length){toast('내보낼 글이 없습니다');return;}
  const payload={type:'fw.mobile',v:1,device:D.device,exportedAt:Date.now(),
    entries:D.entries.map(({_exp,...e})=>e)};
  const name=`fw-mobile-${D.device}-${ymd(Date.now())}.json`;
  const b=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');
  a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
  D.entries.forEach(e=>e.exported=true);save();renderSync();refreshBadge();
  toast('내보냈습니다 · 데스크톱에서 병합하세요');}
$('#exp').onclick=doExport;
$('#clean').onclick=()=>{
  const ex=D.entries.filter(e=>e.exported);
  if(!ex.length){toast('정리할 글이 없습니다');return;}
  if(confirm(`내보낸 적 있는 ${ex.length}편을 이 기기에서 지웁니다. 데스크톱 병합을 마쳤을 때만 계속하세요.`)){
    D.entries=D.entries.filter(e=>!e.exported);save();renderSync();renderList();refreshBadge();
    toast('정리했습니다');}};
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);
    if(j.type!=='fw.settings')throw new Error('형식');
    D.projects=(j.projects||[]).map(p=>({id:p.id,name:p.name}));
    if(j.settings){['dur','hour'].forEach(k=>{if(j.settings[k]!=null)S()[k]=j.settings[k];});}
    D.lastImport=Date.now();save();
    renderSync();renderSetup();
    toast(`프로젝트 ${D.projects.length}개를 불러왔습니다`);
  }catch(x){toast('데스크톱의 ‘모바일로 설정 내보내기’ 파일이 아닙니다');}};
  r.readAsText(f);e.target.value='';};

/* modal */
function modal(h){$('#modal').innerHTML=h;$('#veil').classList.add('on');}
function closeModal(){$('#veil').classList.remove('on');}
$('#veil').onclick=e=>{if(e.target.id==='veil')closeModal();};

renderSetup();refreshBadge();
setInterval(refreshBadge,30000);
})();
</script>
</body>
</html>
