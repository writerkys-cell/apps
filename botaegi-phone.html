<style>
:root{
  --hanji:#efe9dc;
  --meok:#23201c;
  --meok-2:#6b6259;
  --meok-3:#9a9084;
  --seon:#d6cdba;
  --inju:#a8322d;
  --jongi:#fcfcfa;
  --ui:'Gowun Dodum',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  --top:env(safe-area-inset-top);
  --bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--hanji);color:var(--meok);
  font-family:var(--ui);font-size:16px;line-height:1.8;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;font-size:inherit}

header{
  position:fixed;top:0;left:0;right:0;z-index:10;
  padding:calc(var(--top) + .8rem) 1.1rem .7rem;
  background:var(--hanji);border-bottom:1px solid var(--seon);
  display:flex;align-items:baseline;gap:.8rem;
}
header .ttl{font-size:1rem;flex:1;min-width:1.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .act{font-size:.85rem;color:var(--meok-2)}
#doneBtn{color:var(--inju)}
#doneBtn:disabled{color:var(--meok-3);opacity:.7}
.card .fin{color:var(--inju)}
header .act:active{color:var(--inju)}
#state{font-size:.75rem;color:var(--meok-3);white-space:nowrap}
#cnt{font-size:.75rem;color:var(--meok-2);white-space:nowrap;font-variant-numeric:tabular-nums}
#cnt:empty{display:none}
#state.warn{color:var(--inju)}

main{height:var(--vvh,100%);padding-top:calc(var(--top) + 3.1rem);overflow:hidden}
.view{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.on{display:block}
.pad{padding:1.2rem 1.1rem calc(var(--bot) + 3rem)}

.card{
  display:block;width:100%;text-align:left;
  padding:1rem 0;border-bottom:1px solid var(--seon);
}
.card:first-child{border-top:1px solid var(--seon)}
.card .nm{font-size:1rem;margin-bottom:.15rem}
.card .sub{font-size:.78rem;color:var(--meok-3)}
.card .mark{color:var(--inju)}
.blank{color:var(--meok-3);font-size:.9rem;text-align:center;padding:4rem 1rem;line-height:2}
/* 작품 고르기 — 고른 작품만 불러오고 기억해 둔다 */
.wsel{width:100%;margin:0 0 1rem;font-family:var(--ui);font-size:16px;color:var(--meok);background:var(--jongi);
  border:1px solid var(--seon);border-radius:2px;padding:.5rem .6rem}
.acth{font-size:.78rem;color:var(--meok-2);margin:1.2rem 0 .4rem;font-weight:600}
.acth:first-of-type{margin-top:.2rem}
.wsel + .card,.acth + .card{border-top:1px solid var(--seon)}

#edit{background:var(--jongi)}
#paper{
  display:block;width:100%;min-height:100%;
  border:0;background:transparent;resize:none;
  font-family:'Gowun Batang',serif;
  font-size:var(--fz,17px);line-height:var(--lh,1.95);color:var(--meok);
  padding:1.4rem 1.2rem calc(var(--bot) + 6rem);
  -webkit-user-select:text;
}
#paper:focus{outline:none}

.fld{display:flex;align-items:center;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--seon);font-size:.85rem;color:var(--meok-2)}
.fld span:first-child{flex:1}
.fld input{width:5rem;text-align:right}
.fld .u{font-size:.75rem;color:var(--meok-3);width:1.8rem}
label{display:block;font-size:.8rem;color:var(--meok-2);margin:1.4rem 0 .35rem}
input[type=number]{
  font-family:var(--ui);font-size:16px;color:var(--meok);
  background:var(--jongi);border:1px solid var(--seon);border-radius:2px;
  padding:.45rem .55rem;
}
input[type=text],input[type=password]{
  width:100%;font-family:var(--ui);font-size:16px;color:var(--meok);
  background:var(--jongi);border:1px solid var(--seon);border-radius:2px;
  padding:.6rem .7rem;
}
input:focus{outline:none;border-color:var(--inju)}
.note{font-size:.78rem;color:var(--meok-3);line-height:1.8;margin:.7rem 0 0}
.btn{
  display:inline-block;margin-top:1.4rem;font-size:.9rem;color:var(--meok-2);
  border-bottom:1px solid var(--seon);padding-bottom:1px;
}
.btn:active{color:var(--inju);border-bottom-color:var(--inju)}
.btn + .btn{margin-left:1.4rem}
pre{
  background:var(--jongi);border:1px solid var(--seon);border-radius:2px;
  padding:.8rem;font-size:11px;line-height:1.6;overflow-x:auto;
  color:var(--meok-2);white-space:pre;margin:.6rem 0 0;
}
#toast{
  position:fixed;left:50%;bottom:calc(var(--bot) + 1.6rem);transform:translateX(-50%);
  background:var(--meok);color:var(--jongi);padding:.5rem 1rem;border-radius:2px;
  font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;
}
#toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <button class="act" id="back" hidden>목록</button>
  <span class="ttl" id="title">보태기</span>
  <span id="cnt"></span>
  <span id="state"></span>
  <button class="act" id="doneBtn" hidden>원고 완성</button>
  <button class="act" id="gear">설정</button>
</header>

<main>
  <section id="list" class="view on"><div class="pad" id="listPad"></div></section>

  <section id="edit" class="view">
    <textarea id="paper" spellcheck="false" autocorrect="off" autocapitalize="sentences"></textarea>
  </section>

  <section id="setup" class="view"><div class="pad">
    <label for="url">수파베이스 주소</label>
    <input type="text" id="url" placeholder="https://xxxx.supabase.co" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="key">열쇠</label>
    <input type="password" id="key" placeholder="sb_publishable_..." autocomplete="off" autocapitalize="off" spellcheck="false">
    <p class="note">주소와 열쇠는 보태기 설정의 '아이폰과 잇기'에 있는 것과 같습니다. 이 기기에만 저장되며 파일에는 들어 있지 않습니다. 이 열쇠로 원고를 읽고 쓸 수 있으니 다른 곳에 적어 두지 마세요.</p>

    <button class="btn" id="save">저장하고 불러오기</button>

    <label>글 보기</label>
    <div class="fld"><span>글자 크기</span><input type="number" id="fz" min="13" max="28" step="1"><span class="u">px</span></div>
    <div class="fld"><span>줄 간격</span><input type="number" id="lh" min="1.2" max="3" step="0.05"><span class="u">배</span></div>
    <p class="note">보이는 그대로가 보태기 원고가 됩니다. 엔터 한 번은 새 문단, 빈 줄은 빈 줄입니다. 스크리브너에서 쓴 글을 통째로 붙여 넣어도 문단이 그대로 맞습니다.</p>
    <p class="note">맥에서 원고를 새로 보내면, 그 전 원고를 보고 손본 것은 버려집니다. 목록을 다시 불러와 새 원고에서 손보세요.</p>

  </div></section>
</main>

<div id="toast"></div>

<script>
(function(){
"use strict";

var KEY = "botaegi-phone-v1";
var TABLE = "botaegi_ms";
var CHS = {};   /* 작품마다 장 목록 {id, no, name, done, ms:[원고 id]} */
function chOfRow(r){
  var cs = CHS[r.work_id]; if(!cs) return null;
  return cs.filter(function(c){ return (c.ms || []).indexOf(r.id) > -1; })[0]
      || cs.filter(function(c){ return c.no === r.act; })[0] || null;
}
/* 주소와 열쇠는 파일에 넣지 않는다(깃허브 페이지는 누구나 볼 수 있다). 설정에서 넣으면 이 기기에만 저장된다 */

var S = load();
function fresh(){ return { url:"", key:"", rows:[], drafts:{}, fz:17, lh:1.95, work:null, works:[] }; }
function load(){
  var d = fresh();
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var p = JSON.parse(raw);
      for(var k in d) if(p[k]!==undefined && p[k]!==null) d[k]=p[k];
    }
  }catch(e){}
  if(!Array.isArray(d.rows)) d.rows = [];
  if(!d.drafts || typeof d.drafts !== "object") d.drafts = {};
  if(!Array.isArray(d.works)) d.works = [];
  return d;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

var $ = function(s){ return document.querySelector(s); };
var elList=$("#listPad"), elPaper=$("#paper"), elTitle=$("#title"),
    elBack=$("#back"), elGear=$("#gear"), elState=$("#state"), elToast=$("#toast"),
    elCnt=$("#cnt");
var openId = null, saveT = null, pushT = null;

function toast(m){
  elToast.textContent = m;
  elToast.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(function(){ elToast.classList.remove("on"); }, 1600);
}
function state(t, warn){
  elState.textContent = t || "";
  elState.classList.toggle("warn", !!warn);
}
function show(v){
  ["list","edit","setup"].forEach(function(x){
    document.getElementById(x).classList.toggle("on", x===v);
  });
  elBack.hidden = (v === "list");
  elGear.hidden = (v !== "list");
  document.getElementById("doneBtn").hidden = (v !== "edit");
  doneArmed = null;
  if(v === "edit") renderDone();
}
function mae(n){ return (n/200).toFixed(1); }
function curRow(){
  return S.rows.filter(function(x){ return x.id===openId; })[0] || null;
}
function renderCnt(){
  var r = curRow();
  if(!r){ elCnt.textContent = ""; return; }
  var n = paperGet().replace(/\n/g, "").length;
  var base = r.piece || 0;
  elCnt.textContent = mae(n) + "매" + (base ? " · " + Math.round(n/base*100) + "%" : "");
}
function stamp(t){
  var d = new Date(t), z = function(n){ return (n<10?"0":"")+n; };
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 "+z(d.getHours())+":"+z(d.getMinutes());
}

/* 화면에서는 문단 사이를 한 줄 벌려 보여주고, 올릴 때 도로 붙인다 */
/* 보이는 그대로가 원고다 — 엔터 한 번은 새 문단, 빈 줄은 빈 줄.
   스크리브너에서 쓴 글을 붙여 넣어도 그대로 맞는다. 줄 앞뒤 공백과 글 앞뒤의 빈 줄만 걷어낸다 */
function spread(t){ return t; }
function tighten(t){
  var x = t.replace(/\r\n?/g, "\n").split("\n").map(function(l){ return l.trim(); }).join("\n");
  return x.replace(/^\n+|\n+$/g, "");
}

function paperSet(t){ elPaper.value = spread(t); }
function paperGet(){ return tighten(elPaper.value); }

function applyLook(){
  var r = document.documentElement.style;
  r.setProperty("--fz", (S.fz||17) + "px");
  r.setProperty("--lh", String(S.lh||1.95));
}

/* ---------- 서버 ---------- */
function ready(){ return !!(S.url && S.key); }
function api(path, opt){
  opt = opt || {};
  opt.headers = Object.assign({
    "apikey": S.key,
    "Authorization": "Bearer " + S.key,
    "Content-Type": "application/json"
  }, opt.headers || {});
  return fetch(S.url.replace(/\/+$/,"") + "/rest/v1/" + path, opt);
}

function same(a, b){ return !!a && !!b && Date.parse(a) === Date.parse(b); }
/* 손본 글이 지금 원고를 보고 고친 것인가 */
function reviewFits(r){ return r.review != null && r.review !== "" && same(r.review_base, r.updated_at); }

function pull(){
  if(!ready()){ state("설정 필요", true); return Promise.resolve(); }
  state("불러오는 중");
  return loadWorks().then(function(){
      var w = S.work, q;
      if(!w) q = "?select=*&order=updated_at.desc";
      else if(/^t:/.test(w)) q = "?select=*&work_title=eq." + encodeURIComponent(w.slice(2)) + "&order=ord.asc";
      else q = "?select=*&work_id=eq." + encodeURIComponent(w) + "&order=ord.asc";
      return api(TABLE + q);
    })
    .then(function(r){
      if(!r.ok) throw new Error(r.status + "");
      return r.json();
    })
    .then(function(rows){
      /* 빈 원고도 보여준다 — 보태기에는 이제 입력창이 없어, 첫 글도 여기서 붙여 넣는다 */
      /* 장이 있는 작품 — 책의 순서(장, 그 안의 순서)대로 */
      if(S.work && CHS[S.work]){
        rows.sort(function(a, b){
          var ca = chOfRow(a), cb = chOfRow(b);
          return ((ca ? ca.no : 1e6) - (cb ? cb.no : 1e6)) || ((a.ord || 0) - (b.ord || 0));
        });
      }
      S.rows = rows;
      var gone = 0, whole = !S.work;
      Object.keys(S.drafts).forEach(function(id){
        var d = S.drafts[id];
        var r = S.rows.filter(function(x){ return x.id===id; })[0];
        /* 다른 작품을 보는 중이면 그 작품의 손본 글은 그대로 두고 올리기만 한다 */
        if(!r){ if(whole) delete S.drafts[id]; return; }
        /* 맥에서 원고를 새로 보냈으면 옛 원고를 보고 손본 것은 버린다 */
        if(!same(d.base, r.updated_at)){ delete S.drafts[id]; if(!d.sent) gone++; return; }
        var sv = r.review_at ? Date.parse(r.review_at) : 0;
        if(d.sent && sv >= d.at) delete S.drafts[id];
      });
      save(); renderList(); state("");
      if(gone) toast("맥에서 원고가 바뀌어 손본 것 " + gone + "편을 버렸습니다");
      return pushAll();
    })
    .catch(function(e){
      state("연결 안 됨", true);
      renderList();
    });
}

/* 작품 목록 — 원고 표에서 작품만 가볍게 읽는다. work_id 칸이 없으면 작품 이름으로 */
function loadWorks(){
  function build(rows, useId){
    var seen = {}, out = [];
    rows.forEach(function(r){
      var id = useId && r.work_id ? r.work_id : "t:" + (r.work_title || "");
      if(!r.work_title || seen[id]) return;
      seen[id] = 1; out.push({ id:id, title:r.work_title, kind:r.work_kind || "" });
    });
    S.works = out;
    if(S.work && !seen[S.work]) S.work = null;   /* 끝난 작품은 목록에서 내려갔다 */
    save();
  }
  /* 장 — 보태기가 올린 작품 목록에서(장편·중편). 못 읽으면 예전처럼 막 번호로 */
  var kvp = api("botaegi_kv?select=data&id=eq.works").then(function(r){ return r.ok ? r.json() : []; }).then(function(kv){
    var m = {}; ((kv[0] && kv[0].data) || []).forEach(function(w){ if(Array.isArray(w.chapters)) m[w.id] = w.chapters; });
    CHS = m;
  }).catch(function(){});
  return kvp.then(function(){ return api(TABLE + "?select=work_id,work_title,work_kind"); }).then(function(r){
    if(r.status === 400) return api(TABLE + "?select=work_title,work_kind").then(function(r2){ return r2.ok ? r2.json() : []; }).then(function(rows){ build(rows, false); });
    if(!r.ok) throw new Error(r.status + "");
    return r.json().then(function(rows){ build(rows, true); });
  });
}
function pushOne(id){
  var d = S.drafts[id];
  if(!d || !ready()) return Promise.resolve();
  var at = new Date(d.at).toISOString();
  /* 맥의 원고가 그대로일 때만 쓴다 */
  return api(TABLE + "?id=eq." + encodeURIComponent(id) + "&updated_at=eq." + encodeURIComponent(new Date(Date.parse(d.base)).toISOString()), {
    method: "PATCH",
    headers: { "Prefer": "return=representation" },
    body: JSON.stringify({ review: d.text, review_at: at, review_base: d.base, review_src: "phone" })
  }).then(function(r){
    /* 표에 review_src 칸이 아직 없으면 그 칸 없이 다시 보낸다 */
    if(r.status === 400) return api(TABLE + "?id=eq." + encodeURIComponent(id) + "&updated_at=eq." + encodeURIComponent(new Date(Date.parse(d.base)).toISOString()), {
      method:"PATCH", headers:{ "Prefer":"return=representation" }, body: JSON.stringify({ review: d.text, review_at: at, review_base: d.base }) });
    return r;
  }).then(function(r){
    if(!r.ok) throw new Error(r.status + "");
    return r.json();
  }).then(function(out){
    if(!out || !out.length){
      delete S.drafts[id]; save();
      toast("맥에서 원고가 바뀌어 손본 것을 올리지 못했습니다");
      if(openId === id){ openId = null; elCnt.textContent = ""; show("list"); }
      pull();
      return;
    }
    d.sent = true;
    var row = S.rows.filter(function(x){ return x.id===id; })[0];
    if(row){ row.review = d.text; row.review_at = at; row.review_base = d.base; }
    save(); state("");
  }).catch(function(){
    state("저장 대기", true);
  });
}
function pushAll(){
  var ids = Object.keys(S.drafts).filter(function(id){ return !S.drafts[id].sent; });
  return ids.reduce(function(chain, id){
    return chain.then(function(){ return pushOne(id); });
  }, Promise.resolve());
}

/* ---------- 화면 ---------- */
function bodyOf(r){
  var d = S.drafts[r.id];
  if(d) return d.text;
  return reviewFits(r) ? r.review : r.text;
}
function touched(r){
  return bodyOf(r) !== r.text;
}

function renderList(){
  elTitle.textContent = "보태기";
  elList.innerHTML = "";
  if(!ready()){
    elList.innerHTML = '<p class="blank">설정에서 수파베이스 주소와<br>익명 열쇠를 넣어주세요.</p>';
    return;
  }
  if(S.works.length){
    var ws = document.createElement("select"); ws.className = "wsel";
    [["", "모든 작품"]].concat(S.works.map(function(w){ return [w.id, w.title + (w.kind ? " · " + w.kind : "")]; })).forEach(function(o){
      var op = document.createElement("option"); op.value = o[0]; op.textContent = o[1]; ws.appendChild(op);
    });
    ws.value = S.work || "";
    ws.onchange = function(){ S.work = this.value || null; S.rows = []; save(); renderList(); pull(); };
    elList.appendChild(ws);
  }
  if(!S.rows.length){
    var bl = document.createElement("p"); bl.className = "blank"; bl.textContent = "아직 올라온 원고가 없습니다.";
    elList.appendChild(bl);
    return;
  }
  var lastAct = null, novel = !!S.work && S.rows.some(function(r){ return r.work_kind === "장편"; });
  var chw = !!S.work && !!CHS[S.work];
  S.rows.forEach(function(r){
    /* 장편·중편을 골랐으면 장마다 머리를 단다 */
    if(chw){
      var c = chOfRow(r), key = c ? c.id : "?";
      if(key !== lastAct){
        lastAct = key;
        var hc = document.createElement("div"); hc.className = "acth";
        hc.textContent = c ? c.no + "장 · " + c.name + (c.done ? " · 완성" : "") : "장을 정하는 중";
        elList.appendChild(hc);
      }
    }else if(novel && (r.act || 1) !== lastAct){
      lastAct = r.act || 1;
      var h = document.createElement("div"); h.className = "acth"; h.textContent = lastAct + "막";
      elList.appendChild(h);
    }
    var b = document.createElement("button");
    b.className = "card";
    var nm = document.createElement("div");
    nm.className = "nm"; nm.textContent = r.title;
    var sub = document.createElement("div");
    sub.className = "sub";
    var t = bodyOf(r);
    var n = t.replace(/\n/g, "").length;
    sub.textContent = mae(n) + "매" + (r.piece ? " · " + Math.round(n/r.piece*100) + "%" : "") + " · " + stamp(r.updated_at);
    if(r.unit_done || r.done_req){
      var f = document.createElement("span"); f.className = "fin"; f.textContent = " · 완성";
      nm.appendChild(f);
    }
    b.appendChild(nm); b.appendChild(sub);
    if(touched(r)){
      var m = document.createElement("span");
      m.className = "sub mark"; m.textContent = " · 손봄";
      sub.appendChild(m);
    }
    b.onclick = function(){ openVersion(r.id); };
    elList.appendChild(b);
  });
}

/* 원고 완성 — 붙여 넣고 판단해서 누른다. 보태기가 받아 완성으로 표시하고, 작은 마감이 다시 나뉜다 */
/* 확인 창 대신 두 번 누르기 — 스크리브너 인스펙터 안에서는 확인 창이 뜨지 않는다 */
var doneArmed = null, doneArmT = null;
function renderDone(){
  var b = document.getElementById("doneBtn"), r = curRow();
  if(!r){ b.hidden = true; return; }
  var done = r.unit_done || r.done_req;
  var armed = !done && doneArmed === r.id;
  b.textContent = done ? "완성함" : armed ? "한 번 더 누르면 완성" : "원고 완성";
  b.disabled = !!done;
}
document.getElementById("doneBtn").addEventListener("click", function(){
  var r = curRow();
  if(!r || r.unit_done || r.done_req) return;
  if(doneArmed !== r.id){
    doneArmed = r.id; renderDone();
    clearTimeout(doneArmT);
    doneArmT = setTimeout(function(){ doneArmed = null; renderDone(); }, 4000);   /* 4초 안에 다시 누르지 않으면 풀린다 */
    return;
  }
  doneArmed = null; clearTimeout(doneArmT);
  var b0 = document.getElementById("doneBtn"); b0.textContent = "보내는 중…"; b0.disabled = true;
  var at = new Date().toISOString();
  /* 붙여 넣은 글이 먼저 올라가도록 */
  var go = S.drafts[r.id] && !S.drafts[r.id].sent ? pushOne(r.id) : Promise.resolve();
  Promise.resolve(go).then(function(){
    return api(TABLE + "?id=eq." + encodeURIComponent(r.id), {
      method:"PATCH", headers:{ "Prefer":"return=minimal" }, body:JSON.stringify({ done_req: at })
    });
  }).then(function(res){
    if(!res.ok) throw new Error(res.status + "");
    r.done_req = at; save(); renderDone();
    toast("완성으로 보냈습니다");
  }).catch(function(){ renderDone(); toast("보내지 못했습니다. 연결을 확인해 주세요"); });
});

function openVersion(id){
  var r = S.rows.filter(function(x){ return x.id===id; })[0];
  if(!r) return;
  openId = id;
  elTitle.textContent = r.title;
  paperSet(bodyOf(r));
  renderCnt();
  show("edit");
  elPaper.scrollTop = 0;
}

function stash(){
  if(!openId) return;
  var r = S.rows.filter(function(x){ return x.id===openId; })[0];
  if(!r) return;
  var t = paperGet();
  var prev = S.drafts[openId];
  if(t === bodyOf(r) && !prev) return;
  if(prev && prev.text === t) return;
  /* 원문으로 되돌려 놓아도 올려서 서버의 손본 글을 비운다 */
  S.drafts[openId] = { text:t, at:Date.now(), sent:false, base:r.updated_at };
  save();
}

elPaper.addEventListener("input", function(){
  renderCnt();
  state("쓰는 중");
  clearTimeout(saveT); clearTimeout(pushT);
  saveT = setTimeout(function(){ stash(); state("저장됨"); }, 600);
  pushT = setTimeout(function(){ stash(); pushOne(openId); }, 2600);
});

elBack.addEventListener("click", function(){
  if(document.getElementById("edit").classList.contains("on")){
    clearTimeout(saveT); clearTimeout(pushT);
    stash();
    pushOne(openId);
  }
  openId = null;
  elCnt.textContent = "";
  renderList();
  show("list");
});

elGear.addEventListener("click", function(){
  $("#url").value = S.url;
  $("#key").value = S.key;
  $("#fz").value = S.fz;
  $("#lh").value = S.lh;

  elTitle.textContent = "설정";
  elCnt.textContent = "";
  show("setup");
});

function num(el, key, min, max, fb){
  el.addEventListener("change", function(){
    var n = parseFloat(this.value);
    S[key] = (!isNaN(n) && n>=min && n<=max) ? n : fb;
    this.value = S[key];
    save(); applyLook();
  });
}
num($("#fz"), "fz", 13, 28, 17);
num($("#lh"), "lh", 1.2, 3, 1.95);

$("#save").addEventListener("click", function(){
  S.url = $("#url").value.trim();
  S.key = $("#key").value.trim();
  save();
  show("list");
  pull().then(function(){ toast("불러왔습니다"); });
});

window.addEventListener("online", function(){ pull(); });
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible"){
    if(openId){ pushAll(); }
    else pull();
  }else{
    stash(); pushAll();
  }
});
window.addEventListener("pagehide", function(){ stash(); });

/* 시작 */
applyLook();
renderList();
show("list");
if(ready()) pull();
else state("설정 필요", true);

})();

/* ---------- 키보드가 올라와도 헤드는 제자리에 ----------
   아이폰 사파리는 커서가 키보드에 가려지면 페이지째 밀어 올려 헤드까지 사라진다.
   보이는 영역(visualViewport)의 높이로 본문만 줄이고, 밀려 올라간 페이지는 제자리로 돌린다.
   손가락으로 만지는 기기에서만 켜진다 — 맥과 스크리브너 안에서는 아무것도 바꾸지 않는다 */
(function(){
  var vv = window.visualViewport;
  var touch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  if(!vv || !touch) return;
  var root = document.documentElement;
  var elPaper = document.getElementById("paper");
  function nearEnd(){
    return document.activeElement === elPaper &&
           (elPaper.value.length - (elPaper.selectionStart || 0)) < 200;
  }
  function fit(){
    root.style.setProperty("--vvh", Math.round(vv.height) + "px");
    if(window.scrollY || vv.offsetTop) window.scrollTo(0, 0);
    /* 끝부분을 쓰는 중이면, 줄어든 편집창 안에서 끝이 보이게 */
    if(nearEnd()) elPaper.scrollTop = elPaper.scrollHeight;
  }
  vv.addEventListener("resize", fit);
  vv.addEventListener("scroll", fit);
  window.addEventListener("scroll", function(){ if(window.scrollY) window.scrollTo(0, 0); });
  document.addEventListener("focusin", function(){ setTimeout(fit, 60); setTimeout(fit, 350); });
  document.addEventListener("focusout", function(){ setTimeout(fit, 60); });
  fit();
})();
</script>
</body>
</html>
