<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🪴 물주기</title>
<style>
  :root{
    --green:#3a7d44; --green-dark:#2c5e34; --green-light:#e8f3ea;
    --bg:#f6f8f4; --card:#ffffff; --text:#26332a; --muted:#8a988e;
    --border:#e4ebe3; --danger:#c0564f; --amber:#b98a2e;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    font-family:"Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif;
    background:var(--bg); color:var(--text);
    padding-bottom:calc(40px + env(safe-area-inset-bottom));
  }
  header{
    position:sticky; top:0; z-index:5;
    background:var(--green); color:#fff;
    padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  }
  .today{font-size:.78rem; opacity:.85; letter-spacing:.02em;}
  .today-big{font-size:1.3rem; font-weight:700; margin-top:2px;}
  .header-btns{display:flex; gap:6px; margin-top:10px;}
  main{max-width:560px; margin:0 auto; padding:14px 12px 40px;}

  .btn{border:none; border-radius:10px; padding:10px 14px; font-size:.88rem; cursor:pointer; font-weight:600; -webkit-appearance:none;}
  .btn:active{opacity:.7;}
  .btn-primary{background:var(--green); color:#fff;}
  .btn-water{background:#2f6cb0; color:#fff;}
  .btn-skip{background:#eef1ec; color:var(--text);}
  .btn-outline{background:#fff; color:var(--green); border:1.3px solid var(--green);}
  .btn-light{background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.4);}
  .btn-danger{background:none; color:var(--danger); font-size:.78rem; padding:6px 4px;}
  .btn-text{background:none; color:var(--muted); font-size:.78rem; padding:6px 4px; text-decoration:underline;}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 10px; font-size:.8rem;}
  .row-btns{display:flex; gap:8px;}
  .row-btns .btn{flex:1;}

  input,select,textarea{border:1px solid var(--border); border-radius:9px; padding:10px 11px; font-size:1rem; font-family:inherit; background:#fff; color:var(--text); width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--green); outline-offset:0; border-color:transparent;}
  textarea{resize:vertical; min-height:56px;}

  .add-card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:14px;}
  .add-toggle{display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .add-toggle b{font-size:.92rem;}
  .add-form{display:none; gap:8px; flex-direction:column; margin-top:10px;}
  .add-form.open{display:flex;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px;}
  .plant-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .plant-name{font-size:1.05rem; font-weight:700; color:var(--green-dark);}
  .plant-species{font-size:.78rem; color:var(--muted); margin-top:1px;}
  .plant-menu{display:flex; gap:2px;}

  .badge{display:inline-block; margin-top:8px; font-size:.8rem; font-weight:700; padding:4px 10px; border-radius:20px;}
  .badge-now{background:#e3f1e6; color:var(--green-dark);}
  .badge-over{background:#fbe6e4; color:var(--danger);}
  .badge-wait{background:#f0f2ee; color:var(--muted);}
  .badge-need{background:#faf1dd; color:var(--amber);}

  .meta{font-size:.78rem; color:var(--muted); margin-top:6px; line-height:1.5;}
  .schedule-line{font-size:.8rem; color:var(--text); margin-top:4px;}
  .schedule-line b{color:var(--green-dark);}

  .actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .actions .btn{flex:1; min-width:100px;}

  .panel{background:var(--green-light); border-radius:11px; padding:12px; margin-top:12px; display:none;}
  .panel.open{display:block;}
  .panel label{font-size:.78rem; color:var(--muted); display:block; margin:8px 0 4px;}
  .panel label:first-child{margin-top:0;}
  .cond-row{display:flex; gap:8px;}
  .cond-row select{flex:1;}

  .sched-row{display:flex; gap:8px; align-items:flex-end;}
  .sched-field{flex:1;}
  .sched-field span{font-size:.72rem; color:var(--muted);}

  .logs{margin-top:10px; display:none;}
  .logs.open{display:block;}
  .log-item{padding:8px 2px; border-top:1px dashed var(--border); font-size:.83rem;}
  .log-top{display:flex; justify-content:space-between; align-items:center;}
  .log-date{font-weight:700;}
  .log-tag{font-size:.7rem; font-weight:700; padding:1px 8px; border-radius:20px; margin-left:6px;}
  .tag-watered{background:#dfeaf6; color:#2f6cb0;}
  .tag-obs{background:#eef1ec; color:var(--muted);}
  .log-cond{font-size:.72rem; color:var(--muted); margin-left:6px;}
  .log-note{color:var(--muted); margin-top:2px;}

  .empty{text-align:center; color:var(--muted); padding:50px 16px; font-size:.9rem; line-height:1.6;}

  .modal-bg{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:10; padding:16px; overflow-y:auto;}
  .modal-bg.open{display:flex; align-items:flex-start; justify-content:center;}
  .modal{background:#fff; border-radius:14px; max-width:560px; width:100%; padding:18px; margin-top:6vh;}
  .modal h2{font-size:1rem; margin-bottom:8px; color:var(--green-dark);}
  .modal p{font-size:.8rem; color:var(--muted); margin-bottom:10px; line-height:1.5;}
  .modal textarea{min-height:300px; font-size:.8rem; line-height:1.5;}
  .modal-btns{display:flex; gap:8px; justify-content:flex-end; margin-top:12px; align-items:center;}
  .copy-ok{color:var(--green); font-size:.8rem; margin-right:auto; display:none;}

  .toast{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:10px 18px; border-radius:24px; font-size:.85rem; opacity:0; transition:opacity .3s; pointer-events:none; z-index:20; max-width:90vw; text-align:center;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="today" id="todayLabel"></div>
  <div class="today-big" id="todayBig"></div>
  <div class="header-btns">
    <button class="btn btn-light btn-sm" onclick="exportData()">내보내기</button>
    <button class="btn btn-light btn-sm" onclick="document.getElementById('importFile').click()">불러오기</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
  </div>
</header>

<main>
  <div class="add-card">
    <div class="add-toggle" onclick="document.getElementById('addForm').classList.toggle('open')">
      <b>+ 화분 추가</b><span style="color:var(--muted); font-size:.8rem;">탭해서 열기</span>
    </div>
    <div class="add-form" id="addForm">
      <input id="newName" placeholder="화분 이름 (예: 몬스테라)">
      <input id="newSpecies" placeholder="식물 종류 (선택)">
      <button class="btn btn-primary" onclick="addPlant()">추가</button>
    </div>
  </div>
  <div id="plantList"></div>
</main>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2>🤖 AI 조언용 프롬프트</h2>
    <p>아래 내용을 복사해서 AI에게 붙여넣으면 물주기 조언과 다음 물주기 권장 기간을 받을 수 있어요. 받은 답을 보고 아래 "다음 물주기 입력" 칸에 며칠 후~며칠 후인지 적어주세요.</p>
    <textarea id="promptText" readonly></textarea>
    <div class="modal-btns">
      <span class="copy-ok" id="copyOk">✓ 복사됨</span>
      <button class="btn btn-outline btn-sm" onclick="closeModal()">닫기</button>
      <button class="btn btn-primary btn-sm" onclick="copyPrompt()">복사</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'plantWateringData';
let data = { plants: [] };
let editingPlantId = null;
let editingLogId = null;
let openObserve = null;   // id of plant currently showing observe form
let openSchedule = null;  // id of plant currently showing schedule-setter
const openLogs = new Set();

/* ---------- 저장 / 불러오기 ---------- */
// 이전 버전 데이터 보정: watered 필드, nextStart/nextEnd 필드 없으면 채워줌
function normalize(d){
  if(!d || !Array.isArray(d.plants)) return { plants: [] };
  d.plants.forEach(p=>{
    if(!Array.isArray(p.logs)) p.logs = [];
    p.logs.sort((a,b)=> String(a.date).localeCompare(String(b.date)));
    p.logs.forEach(l=>{ if(l.watered === undefined) l.watered = true; });
    if(p.nextStart === undefined) p.nextStart = null;
    if(p.nextEnd === undefined) p.nextEnd = null;
  });
  return d;
}
function load(){
  let parsed = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) parsed = JSON.parse(raw);
  }catch(e){ parsed = null; }
  data = normalize(parsed || { plants: [] });
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
function exportData(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '화분물주기_백업_' + todayStr() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('JSON 파일로 내보냈습니다');
}
function importData(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const imported = JSON.parse(e.target.result);
      if(!imported.plants || !Array.isArray(imported.plants)) throw new Error();
      if(data.plants.length && !confirm('현재 데이터를 불러온 데이터로 교체할까요?')) return;
      data = normalize(imported);
      save(); render();
      toast('데이터를 불러왔습니다');
    }catch(err){ alert('올바른 백업 파일이 아닙니다.'); }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ---------- 유틸 ---------- */
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDays(dateStr, n){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + Number(n));
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function daysBetween(a, b){
  return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
}
function fmtDate(s){
  const d = new Date(s+'T00:00:00');
  const w = ['일','월','화','수','목','금','토'][d.getDay()];
  return (d.getMonth()+1) + '/' + d.getDate() + ' (' + w + ')';
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

/* ---------- 화분 ---------- */
function addPlant(){
  const name = document.getElementById('newName').value.trim();
  if(!name){ toast('화분 이름을 입력하세요'); return; }
  const species = document.getElementById('newSpecies').value.trim();
  data.plants.push({ id: Date.now(), name, species, logs: [], nextStart: null, nextEnd: null });
  document.getElementById('newName').value = '';
  document.getElementById('newSpecies').value = '';
  document.getElementById('addForm').classList.remove('open');
  save(); render();
  toast('화분을 추가했어요');
}
function deletePlant(id){
  const p = data.plants.find(p=>p.id===id);
  if(!confirm('"' + p.name + '" 화분과 모든 기록을 삭제할까요?')) return;
  data.plants = data.plants.filter(p=>p.id!==id);
  save(); render();
}
function startEditPlant(id){
  editingPlantId = id; editingLogId = null;
  render();
}
function savePlantEdit(id){
  const p = data.plants.find(p=>p.id===id);
  const name = document.getElementById('editname-'+id).value.trim();
  if(!name){ toast('화분 이름을 입력하세요'); return; }
  p.name = name;
  p.species = document.getElementById('editspecies-'+id).value.trim();
  editingPlantId = null;
  save(); render();
}
function cancelEdits(){
  editingPlantId = null; editingLogId = null;
  render();
}

/* ---------- 관찰 / 물주기 ---------- */
function toggleObserve(id){
  openObserve = (openObserve === id) ? null : id;
  if(openSchedule !== id) openSchedule = null;
  render();
}
function saveObservation(id, watered){
  const p = data.plants.find(p=>p.id===id);
  const condition = document.getElementById('obscond-'+id).value;
  const note = document.getElementById('obsnote-'+id).value.trim();
  const date = todayStr();
  p.logs.push({ id: Date.now(), date, watered, condition, note });
  p.logs.sort((a,b)=> a.date.localeCompare(b.date) || a.id-b.id);
  openObserve = null;
  if(watered){
    // 새로 물을 줬으므로 다음 물주기 일정은 다시 입력해야 함
    p.nextStart = null;
    p.nextEnd = null;
    openSchedule = id;
    toast('물주기를 기록했어요 💧 다음 물주기 기간을 입력해 주세요');
  } else {
    openSchedule = null;
    toast('관찰 내용을 기록했어요 👀');
  }
  save(); render();
}
function deleteLog(pid, lid){
  const p = data.plants.find(p=>p.id===pid);
  p.logs = p.logs.filter(l=>l.id!==lid);
  save(); render();
}
function startEditLog(pid, lid){
  editingLogId = lid; editingPlantId = null;
  openLogs.add(pid);
  render();
}
function saveLogEdit(pid, lid){
  const p = data.plants.find(p=>p.id===pid);
  const l = p.logs.find(l=>l.id===lid);
  const date = document.getElementById('editdate-'+lid).value;
  if(!date){ toast('날짜를 선택하세요'); return; }
  l.date = date;
  l.condition = document.getElementById('editcond-'+lid).value;
  l.note = document.getElementById('editnote-'+lid).value.trim();
  p.logs.sort((a,b)=> a.date.localeCompare(b.date) || a.id-b.id);
  editingLogId = null;
  save(); render();
}
function toggleLogs(id){
  if(openLogs.has(id)) openLogs.delete(id); else openLogs.add(id);
  render();
}

/* ---------- 다음 물주기 일정 ---------- */
function toggleSchedule(id){
  openSchedule = (openSchedule === id) ? null : id;
  if(openObserve !== id) openObserve = null;
  render();
}
function saveSchedule(id){
  const p = data.plants.find(p=>p.id===id);
  const from = document.getElementById('schedfrom-'+id).value;
  const to = document.getElementById('schedto-'+id).value;
  if(from === ''){ toast('며칠 후부터인지 입력하세요'); return; }
  const base = lastWateredDate(p) || todayStr();
  p.nextStart = addDays(base, from);
  p.nextEnd = (to !== '' && Number(to) >= Number(from)) ? addDays(base, to) : null;
  openSchedule = null;
  save(); render();
  toast('다음 물주기 일정을 저장했어요');
}
function clearSchedule(id){
  openSchedule = null;
  render();
}
function lastWateredDate(p){
  const w = p.logs.filter(l=>l.watered);
  return w.length ? w[w.length-1].date : null;
}

/* ---------- 통계 / 상태 ---------- */
function stats(p){
  const w = p.logs.filter(l=>l.watered);
  if(w.length === 0) return null;
  const dates = w.map(l=>l.date);
  const last = dates[dates.length-1];
  const sinceLast = daysBetween(last, todayStr());
  let avg = null;
  if(dates.length >= 2){
    let total = 0;
    for(let i=1;i<dates.length;i++) total += daysBetween(dates[i-1], dates[i]);
    avg = (total/(dates.length-1)).toFixed(1);
  }
  return { last, sinceLast, avg, count: w.length };
}
function dueKey(p){
  // 정렬 기준: 다음 물주기 시작일이 이른 화분부터. 일정 미설정은 최우선(맨 위).
  if(!p.logs.some(l=>l.watered)) return '0000-00-00'; // 첫 기록 필요
  if(!p.nextStart) return '0000-00-01'; // 일정 설정 필요
  return p.nextStart;
}
function badgeInfo(p){
  const today = todayStr();
  if(!p.logs.some(l=>l.watered)) return {label:'첫 물주기 기록이 필요해요', cls:'badge-need'};
  if(!p.nextStart) return {label:'다음 물주기 일정을 입력해 주세요', cls:'badge-need'};
  if(p.nextEnd){
    if(today > p.nextEnd) return {label:daysBetween(p.nextEnd, today)+'일 지났어요', cls:'badge-over'};
    if(today >= p.nextStart) return {label:'지금 물 줄 시기예요', cls:'badge-now'};
    return {label:'D-'+daysBetween(today, p.nextStart), cls:'badge-wait'};
  }
  if(today >= p.nextStart){
    const d = daysBetween(p.nextStart, today);
    return d===0 ? {label:'지금 물 줄 시기예요', cls:'badge-now'} : {label:d+'일 지났어요', cls:'badge-over'};
  }
  return {label:'D-'+daysBetween(today, p.nextStart), cls:'badge-wait'};
}

/* ---------- AI 프롬프트 ---------- */
function buildPrompt(id){
  const p = data.plants.find(p=>p.id===id);
  const s = stats(p);
  let t = '나는 화분을 키우면서 관찰/물주기 기록을 남기고 있어. 아래 기록을 보고 조언해줘.\n\n';
  t += '## 화분 정보\n';
  t += '- 이름: ' + p.name + '\n';
  if(p.species) t += '- 식물 종류: ' + p.species + '\n';
  t += '- 오늘 날짜: ' + todayStr() + '\n';
  if(s){
    t += '- 총 물주기 횟수: ' + s.count + '회\n';
    if(s.avg) t += '- 평균 물주기 간격: 약 ' + s.avg + '일\n';
    t += '- 마지막 물 준 날: ' + s.last + ' (' + s.sinceLast + '일 전)\n';
  }
  t += '\n## 기록 (날짜순, 물줌/관찰만 구분)\n';
  const wateredDates = p.logs.filter(l=>l.watered).map(l=>l.date);
  p.logs.forEach((l) => {
    let line = '- ' + l.date + ' | ' + (l.watered ? '물줌' : '관찰만') + ' | 상태: ' + l.condition;
    if(l.watered){
      const idx = wateredDates.indexOf(l.date);
      if(idx > 0) line += ' | 이전 물주기로부터 ' + daysBetween(wateredDates[idx-1], l.date) + '일 경과';
    }
    if(l.note) line += ' | 메모: ' + l.note;
    t += line + '\n';
  });
  t += '\n## 질문\n';
  t += '1. 기록된 물주기 간격이 이 식물에게 적절한지 평가해줘.\n';
  t += '2. 상태 변화(좋음/보통/나쁨)와 메모 내용을 볼 때, 물을 너무 자주 주거나 너무 뜸하게 주는 징후가 있는지 알려줘.\n';
  t += '3. 오늘(' + todayStr() + ') 물을 준 것을 기준으로, 다음 물주기를 며칠 후부터 며칠 후 사이에 하면 좋을지 "며칠 후 ~ 며칠 후" 형식으로 명확히 알려줘. (예: 7일 후 ~ 10일 후)\n';
  t += '4. 물주기 외에 상태 개선을 위해 확인해볼 것(빛, 통풍, 분갈이 등)이 있다면 알려줘.\n';
  document.getElementById('promptText').value = t;
  document.getElementById('copyOk').style.display = 'none';
  document.getElementById('modalBg').classList.add('open');
}
function copyPrompt(){
  const ta = document.getElementById('promptText');
  ta.select();
  navigator.clipboard.writeText(ta.value)
    .then(()=>{ document.getElementById('copyOk').style.display='inline'; })
    .catch(()=>{ document.execCommand('copy'); document.getElementById('copyOk').style.display='inline'; });
}
function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
}

/* ---------- 렌더링 ---------- */
function renderHeader(){
  const today = todayStr();
  const d = new Date(today+'T00:00:00');
  const w = ['일','월','화','수','목','금','토'][d.getDay()];
  document.getElementById('todayLabel').textContent = '오늘';
  document.getElementById('todayBig').textContent = today + ' (' + w + ')';
}

function render(){
  renderHeader();
  const list = document.getElementById('plantList');
  if(data.plants.length === 0){
    list.innerHTML = '<div class="empty">아직 등록된 화분이 없어요.<br>위에서 첫 화분을 추가해 보세요 🌱</div>';
    return;
  }
  const sorted = data.plants.slice().sort((a,b)=> dueKey(a).localeCompare(dueKey(b)) || a.name.localeCompare(b.name));

  list.innerHTML = sorted.map(p => {
    const s = stats(p);
    const badge = badgeInfo(p);

    let headerHtml;
    if(editingPlantId === p.id){
      headerHtml = '<div class="plant-top" style="width:100%; flex-direction:column; gap:6px;">'
        + '<input id="editname-' + p.id + '" value="' + esc(p.name) + '" placeholder="화분 이름">'
        + '<input id="editspecies-' + p.id + '" value="' + esc(p.species || '') + '" placeholder="식물 종류 (선택)">'
        + '<div class="row-btns"><button class="btn btn-outline btn-sm" onclick="cancelEdits()">취소</button>'
        + '<button class="btn btn-primary btn-sm" onclick="savePlantEdit(' + p.id + ')">저장</button></div></div>';
    } else {
      headerHtml = '<div class="plant-top">'
        + '<div><span class="plant-name">' + esc(p.name) + '</span>'
        + (p.species ? '<div class="plant-species">' + esc(p.species) + '</div>' : '') + '</div>'
        + '<div class="plant-menu">'
        + '<button class="btn-text" onclick="startEditPlant(' + p.id + ')">수정</button>'
        + '<button class="btn-danger" onclick="deletePlant(' + p.id + ')">삭제</button></div></div>';
    }

    let scheduleLine = '';
    if(p.nextStart){
      scheduleLine = '<div class="schedule-line">다음 물주기 <b>' + fmtDate(p.nextStart) + (p.nextEnd ? ' ~ ' + fmtDate(p.nextEnd) : '') + '</b></div>';
    }
    let metaLine = '';
    if(s){
      metaLine = '<div class="meta">마지막 물주기 ' + s.sinceLast + '일 전' + (s.avg ? ' · 평균 간격 ' + s.avg + '일' : '') + ' · 총 ' + s.count + '회</div>';
    }

    const obsOpen = openObserve === p.id;
    const obsPanel = '<div class="panel' + (obsOpen ? ' open' : '') + '">'
      + '<label>화분 상태</label>'
      + '<div class="cond-row"><select id="obscond-' + p.id + '">'
      +   '<option value="좋음">좋음 🌿</option><option value="보통">보통 🌱</option><option value="나쁨">나쁨 🥀</option>'
      + '</select></div>'
      + '<label>메모 (잎 색, 흙 상태, 새순 등)</label>'
      + '<textarea id="obsnote-' + p.id + '" placeholder="예: 잎 끝이 살짝 노랗게 변함, 흙은 아직 촉촉함"></textarea>'
      + '<div class="row-btns" style="margin-top:10px;">'
      +   '<button class="btn btn-skip" onclick="saveObservation(' + p.id + ', false)">👀 아직 괜찮아요</button>'
      +   '<button class="btn btn-water" onclick="saveObservation(' + p.id + ', true)">💧 물 줬어요</button>'
      + '</div></div>';

    const schedOpen = openSchedule === p.id;
    const schedPanel = '<div class="panel' + (schedOpen ? ' open' : '') + '">'
      + '<div class="meta" style="margin-bottom:6px;">AI에게 받은 조언을 참고해서 다음 물주기까지 며칠 후인지 입력하세요.</div>'
      + '<button class="btn btn-outline btn-sm btn-block" onclick="buildPrompt(' + p.id + ')">🤖 AI 조언 프롬프트 만들기</button>'
      + '<div class="sched-row" style="margin-top:10px;">'
      +   '<div class="sched-field"><span>며칠 후부터</span><input type="number" min="0" id="schedfrom-' + p.id + '" placeholder="예: 7"></div>'
      +   '<div class="sched-field"><span>며칠 후까지 (선택)</span><input type="number" min="0" id="schedto-' + p.id + '" placeholder="예: 10"></div>'
      + '</div>'
      + '<div class="row-btns" style="margin-top:10px;">'
      +   '<button class="btn btn-skip" onclick="clearSchedule(' + p.id + ')">나중에</button>'
      +   '<button class="btn btn-primary" onclick="saveSchedule(' + p.id + ')">저장</button>'
      + '</div></div>';

    const logsHtml = p.logs.slice().reverse().map((l) => {
      if(editingLogId === l.id){
        const conds = ['좋음','보통','나쁨'].map(c =>
          '<option value="' + c + '"' + (l.condition===c ? ' selected' : '') + '>' + c + '</option>').join('');
        return '<div class="log-item">'
          + '<div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;">'
          + '<input type="date" id="editdate-' + l.id + '" value="' + l.date + '">'
          + '<select id="editcond-' + l.id + '">' + conds + '</select></div>'
          + '<textarea id="editnote-' + l.id + '" placeholder="메모">' + esc(l.note || '') + '</textarea>'
          + '<div class="row-btns" style="margin-top:6px;">'
          + '<button class="btn btn-outline btn-sm" onclick="cancelEdits()">취소</button>'
          + '<button class="btn btn-primary btn-sm" onclick="saveLogEdit(' + p.id + ',' + l.id + ')">저장</button>'
          + '</div></div>';
      }
      return '<div class="log-item"><div class="log-top">'
        + '<span><span class="log-date">' + fmtDate(l.date) + '</span>'
        + '<span class="log-tag ' + (l.watered ? 'tag-watered' : 'tag-obs') + '">' + (l.watered ? '물줌' : '관찰') + '</span>'
        + '<span class="log-cond">' + l.condition + '</span></span>'
        + '<span><button class="btn-text" onclick="startEditLog(' + p.id + ',' + l.id + ')">수정</button>'
        + '<button class="btn-danger" onclick="deleteLog(' + p.id + ',' + l.id + ')">삭제</button></span>'
        + '</div>' + (l.note ? '<div class="log-note">' + esc(l.note) + '</div>' : '') + '</div>';
    }).join('');

    return '<div class="card">'
      + headerHtml
      + '<span class="badge ' + badge.cls + '">' + badge.label + '</span>'
      + scheduleLine
      + metaLine
      + '<div class="actions">'
      +   '<button class="btn btn-primary" onclick="toggleObserve(' + p.id + ')">' + (obsOpen ? '접기' : '👀 관찰하기') + '</button>'
      +   (p.logs.some(l=>l.watered) ? '<button class="btn btn-outline" onclick="toggleSchedule(' + p.id + ')">' + (schedOpen ? '접기' : (p.nextStart ? '일정 수정' : '일정 입력')) + '</button>' : '')
      +   (p.logs.length ? '<button class="btn btn-outline" onclick="toggleLogs(' + p.id + ')">' + (openLogs.has(p.id) ? '기록 접기' : '기록 보기') + '</button>' : '')
      + '</div>'
      + obsPanel
      + schedPanel
      + '<div class="logs' + (openLogs.has(p.id) ? ' open' : '') + '">' + logsHtml + '</div>'
      + '</div>';
  }).join('');
}

load();
render();
</script>
</body>
</html>
