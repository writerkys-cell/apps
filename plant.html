<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="화분 노트">
<meta name="theme-color" content="#f3eee4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
<title>화분 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3eee4; --card:#faf7f0; --text:#2b2824; --muted:#8c8277;
    --line:#e1d8c8; --soft:#ebe4d6;
    --accent:#3e6b49; --accent-soft:#dde7dd; --warn:#b4623d; --warn-soft:#f1dfd4;
    --serif:"Noto Serif KR","Apple Myungjo","AppleMyungjo","Nanum Myeongjo",Georgia,"Times New Roman",serif;
    --sans:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1b1916; --card:#23201b; --text:#ebe5d9; --muted:#968c7e;
      --line:#36302a; --soft:#2a2621;
      --accent:#8db898; --accent-soft:#263226; --warn:#d9906b; --warn-soft:#3a2a22;
    }
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);}
  body{
    font-family:var(--sans); color:var(--text); line-height:1.5; font-size:15px;
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
  }
  header{padding:calc(18px + env(safe-area-inset-top)) 20px 4px; max-width:640px; margin:0 auto;}
  .hd-row{display:flex; justify-content:space-between; align-items:flex-end; gap:12px;}
  .hd-title{font-family:var(--serif); font-size:1.65rem; font-weight:700; letter-spacing:-.02em; line-height:1.2;}
  .hd-sub{font-size:.8rem; color:var(--muted); margin-top:4px;}
  .hd-right{font-size:.78rem; color:var(--muted); text-align:right; line-height:1.5; padding-bottom:3px;}
  .hd-right b{color:var(--text); font-weight:700;}
  main{max-width:640px; margin:0 auto; padding:8px 20px 24px;}

  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:6;
    background:var(--bg); border-top:1px solid var(--line);
    display:flex; justify-content:center; gap:4px;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom));
  }
  .tab{flex:1; max-width:170px; text-align:center; font-size:.86rem; color:var(--muted); padding:7px 0 9px; cursor:pointer; border:none; background:none; font-family:inherit; position:relative;}
  .tab .ic{display:none;}
  .tab.on{color:var(--text); font-weight:700;}
  .tab.on::after{content:""; position:absolute; left:50%; bottom:1px; width:4px; height:4px; border-radius:50%; background:var(--accent); transform:translateX(-50%);}

  .btn{border:1px solid var(--line); border-radius:999px; padding:9px 16px; font-size:.86rem; cursor:pointer; font-weight:600; font-family:inherit; -webkit-appearance:none; color:var(--text); background:transparent;}
  .btn:active{opacity:.6;}
  .btn-primary,.btn-water{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn-outline{color:var(--accent); border-color:var(--accent);}
  .btn-light{color:var(--text); border-color:var(--line);}
  .btn-danger{background:none; border:none; color:var(--warn); font-size:.78rem; padding:4px 6px; font-weight:500;}
  .btn-text{background:none; border:none; color:var(--muted); font-size:.78rem; padding:4px 6px; font-weight:500;}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 12px; font-size:.8rem;}
  .row-btns{display:flex; gap:8px;}
  .row-btns .btn{flex:1;}

  input,select,textarea{border:none; border-bottom:1px solid var(--line); border-radius:0; padding:9px 2px; font-size:1rem; font-family:inherit; background:transparent; color:var(--text); width:100%; -webkit-appearance:none; appearance:none;}
  input:focus,select:focus,textarea:focus{outline:none; border-bottom-color:var(--accent);}
  textarea{resize:vertical; min-height:60px; line-height:1.5;}
  input[type=date],select{min-height:42px;}
  label.lbl{font-size:.74rem; color:var(--muted); display:block; margin:14px 0 0; letter-spacing:.02em;}

  .card{background:transparent; border:none; border-top:1px solid var(--line); border-radius:0; padding:18px 0; margin:0;}
  .card.tap{cursor:pointer; padding:14px 0;}
  .card.tap:active{opacity:.6;}
  .group-head + .card{border-top:none;}
  .sec-title{font-family:var(--serif); font-size:1.05rem; font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .sec-title small{font-family:var(--sans); font-weight:500; color:var(--muted); font-size:.74rem; text-align:right;}

  .plant-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .plant-name{font-family:var(--serif); font-size:1.2rem; font-weight:700; letter-spacing:-.01em;}
  .plant-sub{font-size:.76rem; color:var(--muted); margin-top:1px;}
  .badge{display:inline-flex; align-items:center; gap:6px; font-size:.8rem; font-weight:600; color:var(--muted); white-space:nowrap; padding-top:4px;}
  .badge::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--muted); flex:none;}
  .badge-now{color:var(--accent);} .badge-now::before{background:var(--accent);}
  .badge-over{color:var(--warn);} .badge-over::before{background:var(--warn);}
  .badge-need{color:var(--warn);} .badge-need::before{background:transparent; border:1.5px solid var(--warn);}
  .badge-wait{color:var(--muted);}
  .meta{font-size:.77rem; color:var(--muted); margin-top:5px; line-height:1.55;}
  .sched-line{font-size:.82rem; margin-top:4px;}
  .sched-line b{color:var(--text); font-weight:600;}
  .last-note{font-size:.8rem; color:var(--muted); margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-style:italic;}

  .group-head{font-family:var(--serif); font-size:.9rem; color:var(--text); font-weight:700; margin:22px 0 4px; display:flex; align-items:center; gap:8px;}
  .group-head::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--muted);}
  .group-head.g-over::before{background:var(--warn);} .group-head.g-now::before{background:var(--accent);}
  .group-head.g-need::before{background:transparent; border:1.5px solid var(--warn);}
  .group-head:first-child{margin-top:6px;}

  .actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
  .actions .btn{flex:1; min-width:90px;}
  .panel{background:var(--soft); border-radius:14px; padding:4px 16px 16px; margin-top:14px; display:none;}
  .panel.open{display:block;}

  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .chip{border:1px solid var(--line); background:transparent; color:var(--text); border-radius:999px; padding:6px 12px; font-size:.8rem; cursor:pointer; font-family:inherit;}
  .chip.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .li-tags{font-size:.74rem; color:var(--muted); margin-top:2px;}

  .sched-row{display:flex; gap:14px;}
  .sched-row > div{flex:1;}
  .suggest{font-size:.82rem; background:var(--card); border-radius:10px; padding:10px 12px; margin:12px 0 4px; line-height:1.55;}
  .suggest b{color:var(--accent);}

  .spark-wrap{position:relative; height:88px; margin-top:4px;}
  .spark{position:absolute; inset:0; width:100%; height:100%; display:block; overflow:visible;}
  .spark .med{stroke:var(--line); stroke-dasharray:3 4;}
  .spark-lbl span{position:absolute; top:62px; transform:translateX(-50%); font-size:.7rem; color:var(--muted); font-variant-numeric:tabular-nums;}
  .spark-lbl span.recent{color:var(--text); font-weight:600;}
  .spark .ln{fill:none; stroke:var(--accent); stroke-width:1.5; stroke-linejoin:round;}
  .spark .pt{stroke:var(--muted); stroke-width:7; stroke-linecap:round;}
  .spark .pt.recent{stroke:var(--accent);}
  .spark .base{stroke:var(--line); stroke-width:1;}
  .spark text{fill:var(--muted); font-size:10px; font-family:var(--sans);}
  .bar-foot{display:flex; justify-content:space-between; font-size:.74rem; color:var(--muted); margin-top:4px;}

  .tl{position:relative; margin-top:4px;}
  .tl::before{content:""; position:absolute; left:3px; top:8px; bottom:8px; border-left:1px solid var(--line);}
  .list-item{display:grid; grid-template-columns:72px 1fr; gap:0 10px; padding:9px 0; font-size:.86rem; position:relative;}
  .li-date{position:relative; padding-left:16px; font-size:.76rem; color:var(--muted); font-weight:600; padding-top:2px; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .li-date i{position:absolute; left:0; top:7px; width:7px; height:7px; border-radius:50%; border:1.5px solid var(--accent); background:var(--bg);}
  .li-date i.w{background:var(--accent);}
  .li-top{display:flex; justify-content:space-between; align-items:flex-start; gap:6px;}
  .li-meta{font-size:.76rem; color:var(--muted);}
  .li-meta b{color:var(--text); font-weight:600;}
  .li-meta .bad{color:var(--warn);}
  .li-note{color:var(--text); margin-top:2px; white-space:pre-wrap; line-height:1.55;}
  .li-acts{white-space:nowrap; margin-top:-3px;}
  .learn{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px dashed var(--line); font-size:.88rem; line-height:1.5;}
  .learn:first-child{border-top:none;}
  .learn .dot{color:var(--accent); line-height:1.5;}
  .learn .tx{flex:1;}
  .learn .dt{font-size:.7rem; color:var(--muted); margin-left:6px; white-space:nowrap;}
  .adv-item{border-top:1px dashed var(--line); padding:9px 0;}
  .adv-item:first-child{border-top:none;}
  .adv-head{display:flex; justify-content:space-between; align-items:center; cursor:pointer; font-size:.84rem; gap:8px;}
  .adv-head b{font-weight:600;}
  .adv-body{display:none; margin-top:8px; font-size:.84rem; white-space:pre-wrap; line-height:1.6; padding-left:10px; border-left:2px solid var(--line);}
  .adv-item.open .adv-body{display:block;}
  .adv-prev{font-size:.76rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .dots{display:inline-flex; gap:3px; vertical-align:middle;}
  .dots i{width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--line);}
  .dots i.g{background:var(--accent);} .dots i.n{background:var(--muted); opacity:.55;} .dots i.b{background:var(--warn);}

  .rv-row{display:grid; grid-template-columns:auto 1fr; gap:5px 14px; font-size:.82rem; align-items:baseline;}
  .rv-k{color:var(--muted); white-space:nowrap;}
  .rv-v{text-align:right;}
  .trend-up{color:var(--muted);} .trend-down{color:var(--warn);}

  .empty{text-align:center; color:var(--muted); padding:48px 16px; font-size:.9rem; line-height:1.6;}
  .back{display:inline-block; color:var(--muted); font-size:.84rem; margin:4px 0 6px; cursor:pointer; background:none; border:none; font-family:inherit; padding:4px 0;}
  .hint{font-size:.78rem; color:var(--muted); line-height:1.55;}

  .modal-bg{display:none; position:fixed; inset:0; background:rgba(30,25,20,.45); z-index:10; padding:14px; overflow-y:auto;}
  .modal-bg.open{display:flex; align-items:flex-start; justify-content:center;}
  .modal{background:var(--card); border-radius:16px; max-width:640px; width:100%; padding:20px; margin-top:4vh; margin-bottom:40px;}
  .modal h2{font-family:var(--serif); font-size:1.1rem; margin-bottom:6px;}
  .modal p{font-size:.8rem; color:var(--muted); margin-bottom:10px; line-height:1.55;}
  .modal textarea{min-height:260px; font-size:.78rem; line-height:1.55; border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--bg);}
  .modal-btns{display:flex; gap:8px; justify-content:flex-end; margin-top:12px; align-items:center; flex-wrap:wrap;}
  .copy-ok{color:var(--accent); font-size:.8rem; margin-right:auto; display:none;}

  .toast{position:fixed; bottom:calc(76px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 18px; border-radius:24px; font-size:.84rem; opacity:0; transition:opacity .3s; pointer-events:none; z-index:20; max-width:90vw; text-align:center;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header>
  <div class="hd-row">
    <div>
      <div class="hd-title" id="hdTitle">화분 노트</div>
      <div class="hd-sub" id="hdSub"></div>
    </div>
    <div class="hd-right" id="hdRight"></div>
  </div>
</header>

<main id="view"></main>

<nav class="tabbar">
  <button class="tab" data-route="home" onclick="go('home')">오늘</button>
  <button class="tab" data-route="review" onclick="go('review')">돌아보기</button>
  <button class="tab" data-route="settings" onclick="go('settings')">설정</button>
</nav>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2 id="modalTitle">Claude에게 물어볼 프롬프트</h2>
    <p id="modalHint">복사해서 Claude에 붙여 넣으세요. 받은 답은 화분 화면의 "Claude 조언" 칸에 붙여 넣어 저장하고, "배운 것" 세 줄은 "알게 된 것"에 넣으면 다음 프롬프트에 함께 담겨요.</p>
    <textarea id="promptText" readonly></textarea>
    <div class="modal-btns">
      <span class="copy-ok" id="copyOk">✓ 복사됨</span>
      <button class="btn btn-sm" onclick="closeModal()">닫기</button>
      <button class="btn btn-outline btn-sm" onclick="openClaude()">Claude 열기</button>
      <button class="btn btn-primary btn-sm" onclick="copyPrompt()">복사</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

/* ============ 상수 ============ */
const KEY = 'plantNoteV2';
const CONDS = ['좋음','보통','나쁨'];
const TAGS = [
  {k:'soilDeep', label:'속흙 마름',   re:/속[흙]?.{0,8}?(말라|마른|마름|바싹)/},
  {k:'soilTop',  label:'겉흙만 마름', re:/겉흙.{0,4}(말|마)/},
  {k:'soilWet',  label:'흙 아직 촉촉', re:/촉촉|젖어/},
  {k:'light',    label:'화분 가벼움', re:/가벼/},
  {k:'droop',    label:'잎 처짐',     re:/처[지져짐]|쳐[지져짐]|늘어[져짐]/},
  {k:'newLeaf',  label:'새잎',        re:/새\s?잎|새촉|새\s?순/},
  {k:'yellow',   label:'잎 노랗게',   re:/노랗|노란|누렇|노래/},
  {k:'burn',     label:'잎끝 탐',     re:/타들|탔|타버|검게|까맣/},
  {k:'drop',     label:'잎 떨어짐',   re:/떨어|낙엽/},
  {k:'pest',     label:'진딧물',      re:/진딧물/},
  {k:'repot',    label:'분갈이·흙보강', re:/보강|옮기|옮겨|심었/},
];
const TAG_LABEL = Object.fromEntries(TAGS.map(t=>[t.k,t.label]));

/* ============ 상태 ============ */
let data = { version:2, plants:[], speciesNotes:{} };
let route = { name:'home', id:null };

/* ============ 유틸 ============ */
function todayStr(){ return toYMD(new Date()); }
function toYMD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+Number(n)); return toYMD(d); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function fmtDate(s){ const d=new Date(s+'T00:00:00'); const w='일월화수목금토'[d.getDay()]; return (d.getMonth()+1)+'/'+d.getDate()+' ('+w+')'; }
function fmtShort(s){ return s.slice(5).replace('-','/'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function median(a){ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y); const m=Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
function season(s){ const m=Number(s.slice(5,7)); return m>=3&&m<=5?'봄':m>=6&&m<=8?'여름':m>=9&&m<=11?'가을':'겨울'; }
function uid(){ return Date.now()+Math.floor(Math.random()*1000); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2200); }
function autoTags(note){ return TAGS.filter(t=>t.re.test(note||'')).map(t=>t.k); }
function plant(id){ return data.plants.find(p=>p.id===id); }
function groupKey(p){ return (p.species||p.name).trim(); }

/* ============ 저장 / 불러오기 / 이전 버전 변환 ============ */
function normalize(d){
  if(!d || !Array.isArray(d.plants)) d={plants:[]};
  d.version=2;
  d.speciesNotes = d.speciesNotes && typeof d.speciesNotes==='object' ? d.speciesNotes : {};
  d.plants.forEach(p=>{
    p.species = p.species||''; p.location = p.location||'';
    p.profile = Object.assign({pot:'',light:'',drainage:'',memo:''}, p.profile||{});
    p.logs = Array.isArray(p.logs)?p.logs:[];
    p.logs.forEach(l=>{
      if(l.watered===undefined) l.watered=true;
      l.condition = l.condition||'보통'; l.note=l.note||'';
      if(!Array.isArray(l.tags)) l.tags = autoTags(l.note);
    });
    p.logs.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
    if(p.nextStart===undefined) p.nextStart=null;
    if(p.nextEnd===undefined) p.nextEnd=null;
    p.learnings = Array.isArray(p.learnings)?p.learnings:[];
    p.advice = Array.isArray(p.advice)?p.advice:[];
  });
  return d;
}
// 이전 앱(물주기 v1) 백업: species 칸에 적은 "벽/창/큰나무"는 위치로 옮긴다.
function migrateV1(d){
  return normalize({ version:2, speciesNotes:{}, plants:(d.plants||[]).map(p=>({
    id:p.id, name:p.name, species:'', location:p.species||'',
    profile:{pot:'',light:'',drainage:'',memo:''},
    logs:(p.logs||[]).map(l=>({id:l.id,date:l.date,watered:l.watered!==false,condition:l.condition,note:l.note||'',tags:autoTags(l.note||'')})),
    nextStart:p.nextStart||null, nextEnd:p.nextEnd||null, learnings:[], advice:[]
  }))});
}
function fromAny(d){ return (d && d.version===2) ? normalize(d) : migrateV1(d); }
function load(){
  let parsed=null;
  try{ const raw=localStorage.getItem(KEY); if(raw) parsed=JSON.parse(raw); }catch(e){ parsed=null; }
  if(parsed && Array.isArray(parsed.plants)){ data=normalize(parsed); return; }
  data = migrateV1(SEED); save();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){ toast('저장에 실패했어요 (저장 공간 확인)'); } }
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='화분노트_백업_'+todayStr()+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('JSON 파일로 내보냈어요');
}
function importData(input){
  const file=input.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const imported=JSON.parse(e.target.result);
      if(!imported.plants||!Array.isArray(imported.plants)) throw new Error();
      if(data.plants.length && !confirm('현재 데이터를 불러온 데이터로 교체할까요?')) return;
      data=fromAny(imported); save(); render();
      toast('데이터를 불러왔어요 (화분 '+data.plants.length+'개)');
    }catch(err){ alert('올바른 백업 파일이 아니에요.'); }
  };
  reader.readAsText(file); input.value='';
}

/* ============ 통계 ============ */
function wateredLogs(p){ return p.logs.filter(l=>l.watered); }
function intervals(p){ const d=wateredLogs(p).map(l=>l.date); const g=[]; for(let i=1;i<d.length;i++) g.push({from:d[i-1],to:d[i],days:daysBetween(d[i-1],d[i])}); return g; }
function stats(p){
  const w=wateredLogs(p); if(!w.length) return null;
  const last=w[w.length-1].date; const gaps=intervals(p).map(g=>g.days);
  const recent=gaps.slice(-3);
  return {
    count:w.length, first:w[0].date, last, sinceLast:daysBetween(last,todayStr()),
    avg: gaps.length ? gaps.reduce((a,b)=>a+b,0)/gaps.length : null,
    recent, recentMed: median(recent), gaps
  };
}
function suggest(p){
  const s=stats(p); if(!s||!s.recent.length) return null;
  const m=Math.round(s.recentMed);
  return { from:Math.max(1,m-1), to:m+2, basis:s.recent, med:m };
}
function tagCounts(p){ const c={}; p.logs.forEach(l=>(l.tags||[]).forEach(t=>c[t]=(c[t]||0)+1)); return Object.entries(c).sort((a,b)=>b[1]-a[1]); }
function lastWateredDate(p){ const w=wateredLogs(p); return w.length?w[w.length-1].date:null; }
function dueKey(p){
  if(!wateredLogs(p).length) return '0000-00-00';
  if(!p.nextStart) return '0000-00-01';
  return p.nextStart;
}
function badgeInfo(p){
  const today=todayStr();
  if(!wateredLogs(p).length) return {label:'첫 물주기 기록이 필요해요', cls:'badge-need', st:'need'};
  if(!p.nextStart) return {label:'다음 물주기 일정을 정해 주세요', cls:'badge-need', st:'need'};
  const end=p.nextEnd||p.nextStart;
  if(today>end) return {label:daysBetween(end,today)+'일 지났어요', cls:'badge-over', st:'over'};
  if(today>=p.nextStart) return {label:'지금 물 줄 시기', cls:'badge-now', st:'now'};
  return {label:'D-'+daysBetween(today,p.nextStart), cls:'badge-wait', st:'wait'};
}
function condDots(p,n){
  return '<span class="dots">'+p.logs.slice(-n).map(l=>'<i class="'+(l.condition==='좋음'?'g':l.condition==='나쁨'?'b':'n')+'" title="'+l.date+' '+l.condition+'"></i>').join('')+'</span>';
}

/* ============ 라우팅 ============ */
function go(name,id){ location.hash = name==='plant' ? 'plant/'+id : name; }
function parseHash(){
  const h=location.hash.replace(/^#/,'');
  if(h.startsWith('plant/')) return {name:'plant', id:Number(h.slice(6))};
  if(['home','review','settings'].includes(h)) return {name:h, id:null};
  return {name:'home', id:null};
}
window.addEventListener('hashchange',()=>{ route=parseHash(); render(); window.scrollTo(0,0); });

/* ============ 렌더링: 공통 ============ */
function render(){
  route=parseHash(); closeModal();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.route===route.name || (route.name==='plant'&&t.dataset.route==='home')));
  if(route.name==='plant'){ const p=plant(route.id); if(!p){ go('home'); return; } renderDetail(p); }
  else if(route.name==='review') renderReview();
  else if(route.name==='settings') renderSettings();
  else renderHome();
}
function setHeader(title,sub,right){

  document.getElementById('hdRight').innerHTML=right||'';
}

/* ============ 홈 (오늘) ============ */
function renderHome(){
  const today=todayStr();
  const counts={over:0,now:0,need:0,wait:0};
  data.plants.forEach(p=>counts[badgeInfo(p).st]++);
  const parts=[]; if(counts.over) parts.push('<b>'+counts.over+'</b> 넘김'); if(counts.now) parts.push('<b>'+counts.now+'</b> 오늘'); if(counts.need) parts.push('<b>'+counts.need+'</b> 일정 필요');
  setHeader('화분 노트', today+' ('+'일월화수목금토'[new Date().getDay()]+') · '+season(today), parts.length?parts.join(' · '):'오늘은 물 줄 화분이 없어요');

  const v=document.getElementById('view');
  if(!data.plants.length){ v.innerHTML='<div class="empty">아직 등록된 화분이 없어요.<br>아래에서 첫 화분을 추가해 보세요.</div>'+addPlantHtml(); return; }

  const sorted=data.plants.slice().sort((a,b)=>dueKey(a).localeCompare(dueKey(b))||a.name.localeCompare(b.name));
  const groups=[['over','기간이 지났어요'],['now','지금 물 줄 시기'],['need','일정이 필요해요'],['wait','기다리는 중']];
  let html='';
  groups.forEach(([st,title])=>{
    const list=sorted.filter(p=>badgeInfo(p).st===st); if(!list.length) return;
    html+='<div class="group-head g-'+st+'">'+title+' <small style="color:var(--muted);font-family:var(--sans);font-weight:500">'+list.length+'</small></div>'+list.map(cardHtml).join('');

function logItemHtml(p,l,wd){

  if(l.watered){ const i=wd.indexOf(l.date); if(i>0) gap=' · +'+daysBetween(wd[i-1],l.date)+'일'; }

  return '<div class="list-item" id="log-'+l.id+'"><div class="li-date"><i class="'+(l.watered?'w':'')+'"></i>'+fmtDate(l.date)+'</div>'
    +'<div><div class="li-top"><span class="li-meta"><b>'+(l.watered?'물 줌':'관찰')+'</b> · '+cond+gap+'</span>'
    +'<span class="li-acts"><button class="btn-text" onclick="toLearning('+p.id+','+l.id+')">배움으로</button><button class="btn-text" onclick="editLog('+p.id+','+l.id+')">수정</button><button class="btn-danger" onclick="deleteLog('+p.id+','+l.id+')">삭제</button></span></div>'
    +((l.tags||[]).length?'<div class="li-tags">'+l.tags.map(t=>TAG_LABEL[t]).join(' · ')+'</div>':'')
    +(l.note?'<div class="li-note">'+esc(l.note)+'</div>':'')+'</div></div>';

function sparkHtml(gs, med){
  const H=88, y0=10, y1=54;
  const days=gs.map(g=>g.days); const mx=Math.max(...days), mn=Math.min(...days); const range=Math.max(mx-mn,2);
  const n=days.length; const x=i=> n===1?50:4+92*i/(n-1); const y=d=> +(y0+(y1-y0)*(1-(d-mn)/range)).toFixed(2);
  let h='<div class="spark-wrap"><svg class="spark" viewBox="0 0 100 '+H+'" preserveAspectRatio="none">';
  if(med!=null && med>=mn && med<=mx) h+='<line class="med" x1="0" x2="100" y1="'+y(med)+'" y2="'+y(med)+'" vector-effect="non-scaling-stroke"/>';
  if(n>1) h+='<polyline class="ln" vector-effect="non-scaling-stroke" points="'+days.map((d,i)=>x(i)+','+y(d)).join(' ')+'"/>';
  h+=days.map((d,i)=>'<line class="pt'+(i>=n-3?' recent':'')+'" vector-effect="non-scaling-stroke" x1="'+x(i)+'" y1="'+y(d)+'" x2="'+x(i)+'" y2="'+y(d)+'"/>').join('');
  h+='</svg><div class="spark-lbl">'+days.map((d,i)=>'<span class="'+(i>=n-3?'recent':'')+'" style="left:'+x(i)+'%">'+d+'</span>').join('')+'</div></div>';
  return h;
}
function togglePanel(id){
  const el=document.getElementById(id); const open=el.classList.contains('open');
  ['recPanel','schedPanel'].forEach(x=>{ const e=document.getElementById(x); if(e) e.classList.remove('open'); });
  if(!open){ el.classList.add('open'); el.scrollIntoView({behavior:'smooth',block:'nearest'}); }
}

/* ---- 기록 저장 ---- */
function saveRecord(id,watered){
  const p=plant(id);
  const date=document.getElementById('recDate').value; if(!date){ toast('날짜를 선택하세요'); return; }
  const condition=document.getElementById('recCond').value;
  const note=document.getElementById('recNote').value.trim();
  const tags=[...document.querySelectorAll('#recTags .chip.on')].map(c=>c.dataset.k);
  autoTags(note).forEach(t=>{ if(!tags.includes(t)) tags.push(t); });
  p.logs.push({id:uid(), date, watered, condition, note, tags});
  p.logs.sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  if(watered){
    if(date>=lastWateredDate(p)){ p.nextStart=null; p.nextEnd=null; p._openSched=true; }
    save(); render();
    toast('물주기를 기록했어요. 다음 일정을 정해 주세요');
  } else {
    let bumped=false;
    const today=todayStr();
    const needsWater = tags.includes('soilDeep') || tags.includes('light') || tags.includes('droop');
    if(p.nextStart && p.nextStart<=today && (tags.includes('soilWet') || !needsWater)){
      const shift=daysBetween(p.nextStart,today)+1;
      p.nextStart=addDays(p.nextStart,shift); if(p.nextEnd) p.nextEnd=addDays(p.nextEnd,shift); bumped=true;
    }
    save(); render();
    toast(bumped?'관찰을 기록했어요. 물주기를 내일로 미뤘어요':'관찰을 기록했어요');
  }
}

/* ============ Claude 프롬프트 ============ */
function plantSummaryLines(p){
  const s=stats(p); const pf=p.profile; const out=[];
  out.push('- 이름: '+p.name+(p.species?' / 종: '+p.species:'')+(p.location?' / 위치·구분: '+p.location:''));
  const prof=[pf.pot&&'화분·흙: '+pf.pot, pf.light&&'빛: '+pf.light, pf.drainage&&'물빠짐: '+pf.drainage, pf.memo&&'메모: '+pf.memo].filter(Boolean);
  if(prof.length) out.push('- '+prof.join(' / '));
  if(s){
    out.push('- 물 준 횟수 '+s.count+'회 ('+s.first+' ~ '+s.last+'), 마지막 물 준 날 '+s.last+' ('+s.sinceLast+'일 전)');
    if(s.avg!=null) out.push('- 물주기 간격: 전체 평균 '+s.avg.toFixed(1)+'일, 최근 3회 '+s.recent.join(', ')+'일 (중앙값 '+s.recentMed+'일)');
  }
  if(p.nextStart) out.push('- 현재 잡아둔 다음 물주기: '+p.nextStart+(p.nextEnd?' ~ '+p.nextEnd:''));
  const tc=tagCounts(p); if(tc.length) out.push('- 기록에 자주 보인 신호: '+tc.slice(0,5).map(([k,n])=>TAG_LABEL[k]+' '+n+'회').join(', '));
  out.push('- 최근 상태 흐름: '+p.logs.slice(-8).map(l=>l.condition).join(' → '));
  return out;
}
function buildPrompt(id){
  const p=plant(id); const s=stats(p); const today=todayStr(); const gk=groupKey(p);
  let t='나는 집에서 화분을 키우며 관찰과 물주기를 기록하고 있어. 아래는 "'+p.name+'" 화분의 기록이야. 이 기록을 바탕으로 조언해줘.\n\n';
  t+='## 화분 정보\n'+plantSummaryLines(p).join('\n')+'\n- 오늘: '+today+' ('+season(today)+')\n';
  if(data.speciesNotes[gk]) t+='\n## '+gk+'에 대해 내가 적어둔 공통 메모\n'+data.speciesNotes[gk]+'\n';
  t+='\n## 지금까지 이 화분에 대해 내가 알게 된 것\n'+(p.learnings.length?p.learnings.map(l=>'- ('+l.date+') '+l.text).join('\n'):'- 아직 없음')+'\n';
  if(p.advice.length){
    t+='\n## 이전에 받은 조언 (최근 2건 요약)\n';
    p.advice.slice(-2).forEach(a=>{ t+='- ('+a.date+') '+a.text.replace(/\s+/g,' ').slice(0,300)+(a.text.length>300?'…':'')+'\n'; });
  }
  t+='\n## 기록 (날짜 | 물줌/관찰 | 상태 | 이전 물주기로부터 | 신호 | 메모)\n';
  const wd=wateredLogs(p).map(l=>l.date);
  p.logs.forEach(l=>{
    let line='- '+l.date+' | '+(l.watered?'물줌':'관찰만')+' | '+l.condition;
    if(l.watered){ const i=wd.indexOf(l.date); line+=' | '+(i>0?'+'+daysBetween(wd[i-1],l.date)+'일':'첫 기록'); } else line+=' | -';
    line+=' | '+((l.tags||[]).map(k=>TAG_LABEL[k]).join(', ')||'-');
    if(l.note) line+=' | '+l.note.replace(/\s+/g,' ');
    t+=line+'\n';
  });
  t+='\n## 요청\n';
  t+='1. 전반 평가: 이 화분이 지금 어떤 상태인지, 기록에서 읽히는 흐름(좋아지는지, 나빠지는지, 반복되는 문제)을 짧게 정리해줘.\n';
  t+='2. 물주기: 기록된 간격이 이 식물에게 적절한지, 너무 자주 또는 너무 뜸하게 주는 징후가 있는지 알려줘. 그리고 마지막 물 준 날('+(s?s.last:today)+')을 기준으로 지금 계절('+season(today)+')을 고려해 다음 물주기를 "N일 후 ~ M일 후" 형식으로 명확히 제안해줘. (예: 10일 후 ~ 13일 후)\n';
  t+='3. 이 식물 돌보기 정리: 이 종의 일반적인 특성과 내 기록을 합쳐서, 빛 / 물 / 흙·분갈이 / 온도·겨울나기 / 병충해 / 주의해서 볼 신호 항목별로 짧고 구체적으로 정리해줘. 앱에 저장해두고 다음에 다시 볼 거야.\n';
  t+='4. 배운 것 세 줄: 내 기록에서 끌어낼 수 있는, 이 화분에 대해 기억해둘 사실을 "- "로 시작하는 짧은 문장 3개로 적어줘. 그대로 앱의 "알게 된 것"에 붙여 넣을 거야.'+(p.learnings.length?' 이미 적어둔 것과 겹치지 않게.':'')+'\n';
  t+='5. 다음 기록 때 더 눈여겨볼 관찰 포인트가 있으면 한두 가지만 알려줘.\n';
  openModal(p.name+' · Claude에게 묻기', t);
}
function buildOverallPrompt(){
  const today=todayStr();
  let t='나는 집에서 화분 '+data.plants.length+'개를 키우며 관찰과 물주기를 기록하고 있어. 오늘은 '+today+' ('+season(today)+')이야. 아래는 화분별 요약이야. 전체를 보고 조언해줘.\n\n';
  data.plants.slice().sort((a,b)=>dueKey(a).localeCompare(dueKey(b))).forEach(p=>{
    t+='## '+p.name+(p.location?' ('+p.location+')':'')+'\n'+plantSummaryLines(p).slice(1).join('\n')+'\n';
    const recent=p.logs.slice(-3); if(recent.length) t+='- 최근 메모: '+recent.map(l=>l.date.slice(5)+' '+(l.note||l.condition).replace(/\s+/g,' ')).join(' / ')+'\n';
    if(p.learnings.length) t+='- 내가 알게 된 것: '+p.learnings.slice(-3).map(l=>l.text).join(' / ')+'\n';
    t+='\n';
  });
  t+='## 요청\n';
  t+='1. 전체적으로 잘 되고 있는 것과 걱정되는 화분을 짚어줘. 특히 상태가 나쁨/보통이 반복되거나 문제가 재발하는 화분은 왜 그런지 추정해줘.\n';
  t+='2. 지금 계절('+season(today)+')에 맞춰 물주기 간격을 조정해야 할 화분이 있으면 화분별로 "N일 후 ~ M일 후"로 알려줘.\n';
  t+='3. 이 시기에 전체 화분에 공통으로 챙길 것(빛, 온도, 통풍, 습도, 병충해 예방)을 정리해줘.\n';
  t+='4. 내 기록 습관에 대해: 더 적어두면 좋을 것, 빠져 있는 정보가 있으면 알려줘.\n';
  openModal('전체 화분 · Claude에게 묻기', t);
}

function renderReview(){
  const today=todayStr();
  const totalLogs=data.plants.reduce((a,p)=>a+p.logs.length,0);
  const totalLearn=data.plants.reduce((a,p)=>a+p.learnings.length,0);
  setHeader('돌아보기', season(today)+' · 화분 '+data.plants.length+'개', '기록 <b>'+totalLogs+'</b>건<br>알게 된 것 <b>'+totalLearn+'</b>개');
  const v=document.getElementById('view');
  if(!data.plants.length){ v.innerHTML='<div class="empty">화분을 먼저 추가해 주세요.</div>'; return; }
  let html='<div class="card"><div class="sec-title">전체 화분 조언 받기</div><div class="hint">모든 화분의 요약을 한 프롬프트로 묶어요. 계절이 바뀔 때나 한 달에 한 번 전체 흐름을 물어보기 좋아요.</div>'
    +'<div class="row-btns" style="margin-top:10px"><button class="btn btn-outline" onclick="buildOverallPrompt()">전체 화분 프롬프트</button></div></div>';
  const order=data.plants.slice().sort((a,b)=>{
    const sa=stats(a), sb=stats(b);
    const wa=a.logs.slice(-5).filter(l=>l.condition!=='좋음').length, wb=b.logs.slice(-5).filter(l=>l.condition!=='좋음').length;
    return wb-wa || a.name.localeCompare(b.name);

  order.forEach(p=>{
    const s=stats(p); const tc=tagCounts(p).slice(0,3); const lastAdv=p.advice[p.advice.length-1];
    let trend='';
    if(s && s.avg!=null && s.recentMed!=null){
      const diff=s.recentMed-s.avg;
      trend = Math.abs(diff)<1 ? '비슷' : diff>0 ? '<span class="trend-up">+'+diff.toFixed(1)+'일 길어짐</span>' : '<span class="trend-down">'+diff.toFixed(1)+'일 짧아짐</span>';

      +'<div class="rv-row" style="margin-top:8px">'
      +(s&&s.avg!=null?'<span class="rv-k">간격</span><span class="rv-v">전체 '+s.avg.toFixed(1)+'일 → 최근 '+s.recentMed+'일 '+trend+'</span>':'<span class="rv-k">간격</span><span class="rv-v">물 준 기록이 더 필요해요</span>')
      +'<span class="rv-k">기록 / 상태</span><span class="rv-v">'+p.logs.length+'건 · 최근 5회 중 좋음 '+p.logs.slice(-5).filter(l=>l.condition==='좋음').length+'</span>'
      +(tc.length?'<span class="rv-k">자주 보인 신호</span><span class="rv-v">'+tc.map(([k,n])=>TAG_LABEL[k]+' '+n).join(', ')+'</span>':'')

      +'<span class="rv-k">Claude 조언</span><span class="rv-v">'+(lastAdv?fmtDate(lastAdv.date)+' 받음':'아직 없음')+'</span>'
      +'</div>'
