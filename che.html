<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>체</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2efe6;
  --paper2:#e9e4d7;
  --line:#d6cfbe;
  --line2:#c3baa4;
  --ink:#1f1c19;
  --ink2:#6b6357;
  --ink3:#948a79;
  --seal:#9c3b30;       /* 인주 */
  --moss:#46654f;       /* 청태 */
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Gowun Batang","Nanum Myeongjo",serif;
  --r:2px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#1a1815;--paper2:#232019;--line:#3a352c;--line2:#4a4438;
    --ink:#ece7db;--ink2:#a79e8c;--ink3:#7d7566;--seal:#c9645a;--moss:#7fa88b;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.7;
  -webkit-text-size-adjust:100%;
  padding-bottom:180px;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;padding:0}
a{color:var(--seal);text-decoration:none;border-bottom:1px solid var(--line2)}
.applink{font-family:var(--mono);font-size:12px;border:1px solid var(--line2);border-radius:var(--r);
  padding:0 6px;white-space:nowrap;display:inline-block;line-height:1.5;vertical-align:1px}
.applink:hover,.applink:focus{background:var(--seal);color:var(--paper);border-color:var(--seal)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

/* ── 머리 ── */
header{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:baseline;gap:12px;padding:18px 0 10px}
.brand h1{font-size:26px;margin:0;letter-spacing:.28em;font-weight:700}
.brand .sub{font-size:12px;color:var(--ink3);letter-spacing:.08em}
.brand .grow{flex:1}
.search{border:1px solid var(--line);background:transparent;border-radius:var(--r);
  padding:5px 10px;width:150px;outline:none;font-size:13px;transition:width .2s}
.search:focus{width:210px;border-color:var(--line2)}
nav{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;padding-bottom:0;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;padding:7px 9px 9px;font-size:14px;color:var(--ink2);
  border-bottom:2px solid transparent;letter-spacing:0}
nav button .m{font-family:var(--mono);font-size:11px;margin-right:4px;opacity:.6}
nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--seal)}
nav button .n{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-left:3px}
@media (min-width:560px){
  nav{overflow:visible;flex-wrap:wrap}
}

/* ── 본문 ── */
main{padding:22px 0 40px}
section+section{margin-top:34px}
h2{font-size:13px;font-weight:400;letter-spacing:.22em;color:var(--ink3);
  margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:8px}
h2 .aside{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:0}
.month-h{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.1em;
  margin:26px 0 6px;padding-bottom:4px;border-bottom:1px dotted var(--line)}
.empty{color:var(--ink3);font-size:14px;padding:16px 0;line-height:1.9}
.empty b{font-weight:400;color:var(--ink2);border-bottom:1px solid var(--line2)}

/* ── 항목 ── */
.it{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.it:hover{background:linear-gradient(90deg,transparent,rgba(156,59,48,.045) 30%,transparent)}
.mk{font-family:var(--mono);font-size:13px;color:var(--ink3);width:1.4em;flex:none;
  text-align:center;line-height:1.7;cursor:pointer;border-radius:var(--r)}
.mk:hover{color:var(--seal);background:var(--paper2)}
.bd{flex:1;min-width:0}
.tx{word-break:break-word;white-space:pre-wrap}
.it.done .tx{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--line2)}
.mt{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.02em;
  margin-top:2px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mt .tag{color:var(--ink2)}
.mt .due{color:var(--seal)}
.mt .amt{color:var(--ink);font-size:12px}
.mt .amt.in{color:var(--moss)}
.act{display:flex;gap:8px;flex:none;flex-wrap:wrap;justify-content:flex-end;opacity:0;transition:opacity .15s}
.it:hover .act,.it:focus-within .act{opacity:1}
.act button{font-family:var(--mono);font-size:11px;color:var(--ink3);padding:2px 4px}
.act button:hover{color:var(--seal)}
@media (hover:none){.act{opacity:.55}}

/* ── 카드/집계 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line)}
.cell{background:var(--paper);padding:12px 14px}
.cell .k{font-size:11px;letter-spacing:.16em;color:var(--ink3)}
.cell .v{font-family:var(--mono);font-size:19px;margin-top:3px;letter-spacing:-.02em}
.cell .v.in{color:var(--moss)} .cell .v.out{color:var(--seal)}
.cell .sub{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:3px;letter-spacing:0}
.cell.tap{cursor:pointer}
.cell.tap:hover{background:var(--paper2)}
.cell.tap .k::after{content:' ✎';color:var(--ink3);font-size:9px}
.bar{height:3px;background:var(--paper2);margin-top:8px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;background:var(--seal);opacity:.55}
.rowline{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line);font-size:14px}
.rowline .g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowline .n{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin:6px 0 2px}
.spark i{flex:1;background:var(--line2);min-height:1px}
.spark i.last{background:var(--seal)}
.nav-month{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:13px;margin-bottom:12px}
.nav-month button{color:var(--ink2);padding:2px 8px;border:1px solid var(--line)}
.pill{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:2px 7px;color:var(--ink2)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dd{font-family:var(--mono);font-size:12px}
.cal{margin-bottom:20px}
.cal-h{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:13px;margin-bottom:9px}
.cal-h button{border:1px solid var(--line);padding:2px 9px;color:var(--ink2)}
.cal-h button:hover{border-color:var(--seal);color:var(--seal)}
.cal-h .sum{margin-left:auto;font-size:11px;color:var(--ink3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.cal-w{background:var(--paper);text-align:center;font-family:var(--mono);font-size:10px;
  color:var(--ink3);padding:5px 0;letter-spacing:.06em}
.cal-d{background:var(--paper);min-height:46px;padding:4px 6px;text-align:left;position:relative;
  font-family:var(--mono);font-size:12px;color:var(--ink2);display:block;width:100%}
.cal-d.sun{color:var(--seal)}
.cal-d.blank{background:var(--paper2);opacity:.45;cursor:default}
.cal-d.today{box-shadow:inset 0 0 0 1px var(--line2)}
.cal-d:not(.blank):hover{background:var(--paper2)}
.cal-d[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.cal-d[aria-pressed="true"].sun{color:var(--paper)}
.cal-d .dots{position:absolute;left:6px;bottom:6px;display:flex;gap:2px;align-items:center}
.cal-d .dots i{width:4px;height:4px;border-radius:50%;background:var(--seal);display:block}
.cal-d .dots i.plan{background:transparent;box-shadow:inset 0 0 0 1px var(--seal)}
.cal-d[aria-pressed="true"] .dots i.plan{background:transparent;box-shadow:inset 0 0 0 1px var(--paper)}
.cal-d .dots b{font-size:9px;font-weight:400;color:var(--ink3);margin-left:1px}
.cal-d[aria-pressed="true"] .dots i{background:var(--paper)}
.cal-d[aria-pressed="true"] .dots b{color:var(--paper)}
.trace{font-family:var(--mono);font-size:11px;color:var(--ink3);padding:6px 0 2px;line-height:1.9}
.rgrid{display:flex;gap:2px;margin:7px 0 3px;flex-wrap:wrap}
.rgrid i{width:9px;height:9px;display:block;background:var(--paper2);box-shadow:inset 0 0 0 1px var(--line)}
.rgrid i.ok{background:var(--seal);box-shadow:none}
.rgrid i.off{background:transparent;box-shadow:none}
.rgrid i.today{box-shadow:inset 0 0 0 1px var(--ink)}
.mk.star{color:var(--seal)}
.wdpick{display:flex;gap:5px;margin:10px 0}
.wdpick button{flex:1;border:1px solid var(--line);padding:7px 0;font-size:14px;text-align:center}
.wdpick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dd.over{color:var(--seal)} .dd.soon{color:var(--ink)} .dd.far{color:var(--ink3)}
.more{display:block;width:100%;text-align:center;padding:14px;font-size:13px;
  color:var(--ink3);border:1px dashed var(--line);margin-top:14px}
.more:hover{color:var(--seal);border-color:var(--line2)}

/* ── 입력(체) ── */
.composer{position:fixed;left:0;right:0;bottom:0;background:var(--paper);
  border-top:1px solid var(--line2);z-index:40;padding-bottom:env(safe-area-inset-bottom);
  will-change:transform;transform:translate3d(0,0,0)}
.composer.lifted{padding-bottom:0}
.composer .wrap{padding-top:10px;padding-bottom:12px}
.mesh{height:0;border-top:1px dashed var(--line);margin-bottom:8px;opacity:0;transition:opacity .2s}
.mesh.on{opacity:1}
.cmdmenu{border:1px solid var(--line2);background:var(--paper);margin-bottom:10px;
  max-height:44vh;overflow:auto;box-shadow:0 -4px 18px rgba(0,0,0,.06)}
.cmdmenu[hidden]{display:none}
.cmdmenu button{display:flex;width:100%;gap:10px;align-items:baseline;
  padding:8px 12px;text-align:left;border-bottom:1px solid var(--line)}
.cmdmenu button:last-child{border-bottom:none}
.cmdmenu button[aria-selected="true"]{background:var(--paper2)}
.cmdmenu button[aria-selected="true"] .cn{color:var(--seal)}
.cmdmenu .cm{font-family:var(--mono);font-size:12px;color:var(--ink3);width:1.4em;text-align:center;flex:none}
.cmdmenu .cn{font-size:15px}
.cmdmenu .ce{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px}
#in{width:100%;border:none;outline:none;background:transparent;resize:none;
  font-size:17px;line-height:1.6;min-height:30px;max-height:160px;padding:0}
#in::placeholder{color:var(--ink3)}
.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px;min-height:20px}
.chip{font-family:var(--mono);font-size:11px;color:var(--ink2);border:1px solid var(--line);
  padding:1px 7px;letter-spacing:.02em}
.chip.cat{border-color:var(--seal);color:var(--seal)}
.chip.hint{border:none;color:var(--ink3);padding-left:0}
.chips .grow{flex:1}
.send{font-family:var(--mono);font-size:11px;color:var(--ink3);border:1px solid var(--line);padding:2px 9px}
.send:hover{color:var(--seal);border-color:var(--seal)}

/* ── 팝오버/토스트 ── */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:20px}
.sheet{background:var(--paper);border:1px solid var(--line2);max-width:340px;width:100%;padding:18px 20px}
.sheet h3{margin:0 0 4px;font-size:15px;font-weight:400;letter-spacing:.1em}
.sheet p{margin:0 0 14px;font-size:13px;color:var(--ink2);word-break:break-word}
.sheet .opts{display:flex;flex-wrap:wrap;gap:6px}
.sheet .opts button{border:1px solid var(--line);padding:6px 11px;font-size:14px}
.sheet .opts button:hover{border-color:var(--seal);color:var(--seal)}
.etext{width:100%;min-height:110px;max-height:48vh;border:1px solid var(--line);
  background:var(--paper2);color:var(--ink);padding:10px 11px;
  font-family:var(--serif);font-size:15px;line-height:1.7;resize:vertical;outline:none;
  white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;overflow-y:auto}
.etext:focus{border-color:var(--seal)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:70;
  background:var(--ink);color:var(--paper);font-size:13px;padding:9px 14px;
  display:flex;gap:14px;align-items:center;box-shadow:0 6px 22px rgba(0,0,0,.22)}
.toast button{color:var(--paper);font-family:var(--mono);font-size:11px;
  border-bottom:1px solid rgba(255,255,255,.5)}

/* ── 설정 ── */
.set-row{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.set-row .lbl{flex:1;font-size:14px}
.set-row .lbl small{display:block;color:var(--ink3);font-size:12px;line-height:1.6}
.btn{border:1px solid var(--line);padding:5px 12px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--seal);color:var(--seal)}
.btn.danger:hover{border-color:var(--seal);color:var(--seal)}
.notice{border-left:2px solid var(--seal);padding:8px 0 8px 12px;font-size:13px;color:var(--ink2);margin-bottom:18px}
.dayhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding-bottom:11px;margin-bottom:22px;border-bottom:1px solid var(--line2)}
.dayhead .d{font-size:23px;letter-spacing:.01em}
.dayhead .w{font-size:13px;color:var(--ink2);letter-spacing:.1em}
.dayhead .s{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3);
  letter-spacing:.02em;text-align:right;line-height:1.7}
.dayhead .s b{font-weight:400;color:var(--ink2)}
.dfield{display:flex;gap:8px;margin-bottom:10px}
.dfield input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper2);
  padding:7px 9px;font-family:var(--mono);font-size:13px;color:var(--ink);border-radius:0}
.dfield input:focus{outline:none;border-color:var(--seal)}
.sheet.wide{max-width:680px}
.ptext{width:100%;height:44vh;font-family:var(--mono);font-size:12px;line-height:1.55;
  border:1px solid var(--line);background:var(--paper2);color:var(--ink);padding:10px;
  resize:vertical;outline:none;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.ask-row{display:flex;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.ask-row .lbl{flex:1}
.ask-row .lbl b{font-weight:400}
.ask-row .lbl small{display:block;color:var(--ink3);font-size:12px;line-height:1.65;margin-top:1px}
.ask-row .n{font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  .wrap{padding:0 15px}
  .brand h1{font-size:22px}
  .search{width:100px}.search:focus{width:140px}
  body{padding-bottom:200px}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <h1>체</h1>
      <span class="sub">부으면 갈라진다</span>
      <span class="grow"></span>
      <input id="q" class="search" type="search" placeholder="찾기 ⌘K" autocomplete="off">
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<main><div class="wrap" id="view"></div></main>

<div class="composer">
  <div class="wrap">
    <div class="cmdmenu" id="menu" hidden></div>
    <div class="mesh" id="mesh"></div>
    <textarea id="in" rows="1" placeholder="무엇이든 한 줄로 적으세요" autocomplete="off"></textarea>
    <div class="chips" id="chips"></div>
  </div>
</div>

<script>
"use strict";
/* ═══════════════ 0. 분류 정의 ═══════════════ */
const CATS = {
  todo :{name:'할일',  mk:'○'},
  plan :{name:'일정',  mk:'◇'},
  money:{name:'금전',  mk:'₩'},
  ref  :{name:'참조',  mk:'※'},
  cycle:{name:'주기',  mk:'↻'},
  rec  :{name:'기록',  mk:'△'},
  note :{name:'메모',  mk:'·'},
};
const TABS = [
  {k:'today',  name:'오늘', mk:'◎'},
  {k:'cal',    name:'달력', mk:'▦'},
  {k:'todo',   name:'할일', mk:'○'},
  {k:'plan',   name:'일정', mk:'◇'},
  {k:'money',  name:'금전', mk:'₩'},
  {k:'ref',    name:'참조', mk:'※'},
  {k:'cycle',  name:'주기', mk:'↻'},
  {k:'rec',    name:'기록', mk:'△'},
  {k:'ask',    name:'물음', mk:'✎'},
  {k:'all',    name:'전체', mk:'≡'},
  {k:'set',    name:'설정', mk:'⚙'},
];

/* ═══════════════ 1. 저장소 (IndexedDB) ═══════════════ */
let db=null, E=[], RULES={}, META={}, GRAVES={};
const MT=e=>e.mt||e.ts||0;
const touch=e=>{ e.mt=Date.now(); return e; };
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('che',1);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('entries')){
        const s=d.createObjectStore('entries',{keyPath:'id'});
        s.createIndex('ts','ts');
      }
      if(!d.objectStoreNames.contains('meta')) d.createObjectStore('meta',{keyPath:'k'});
    };
    r.onsuccess=e=>{db=e.target.result;res()};
    r.onerror=()=>rej(r.error);
  });
}
function put(list){
  return new Promise(res=>{
    const t=db.transaction('entries','readwrite'), s=t.objectStore('entries');
    (Array.isArray(list)?list:[list]).forEach(x=>s.put(x));
    t.oncomplete=res;
  });
}
function del(ids){
  return new Promise(res=>{
    const t=db.transaction('entries','readwrite'), s=t.objectStore('entries');
    (Array.isArray(ids)?ids:[ids]).forEach(i=>s.delete(i));
    t.oncomplete=res;
  });
}
function loadAll(){
  return new Promise(res=>{
    const r=db.transaction('entries').objectStore('entries').getAll();
    r.onsuccess=()=>res(r.result||[]);
  });
}
function metaSet(k,v){
  META[k]=v;
  return new Promise(res=>{
    const t=db.transaction('meta','readwrite');
    t.objectStore('meta').put({k,v}); t.oncomplete=res;
  });
}
function metaLoad(){
  return new Promise(res=>{
    const r=db.transaction('meta').objectStore('meta').getAll();
    r.onsuccess=()=>{ (r.result||[]).forEach(o=>META[o.k]=o.v); res(); };
  });
}
function clearAll(){
  return new Promise(res=>{
    const t=db.transaction(['entries','meta'],'readwrite');
    t.objectStore('entries').clear(); t.objectStore('meta').clear();
    t.oncomplete=res;
  });
}

/* ═══════════════ 2. 날짜 도구 ═══════════════ */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=()=>iso(new Date());
const WDN=['일','월','화','수','목','금','토'];
function dObj(s){return new Date(s+'T00:00:00')}
function dday(s){ if(!s) return null; return Math.round((dObj(s)-dObj(TODAY()))/86400000); }
function fmtD(s,withYear){
  if(!s) return '';
  const d=dObj(s), y=new Date().getFullYear();
  const head=(withYear||d.getFullYear()!==y)? d.getFullYear()+'.' : '';
  return head+(d.getMonth()+1)+'.'+d.getDate()+'('+WDN[d.getDay()]+')';
}
function fmtDD(n){
  if(n===null||n===undefined) return '';
  if(n===0) return '오늘'; if(n===1) return '내일'; if(n===-1) return '어제';
  return n>0? 'D-'+n : 'D+'+(-n);
}
function ddClass(n){ return n<0?'over':(n<=7?'soon':'far'); }
function ym(s){ return (s||'').slice(0,7); }
function fmtWon(n){ return (n<0?'-':'')+Math.abs(n).toLocaleString('ko-KR')+'원'; }

function schemeOf(u){
  const m=String(u).match(/^([a-z0-9+.\-]+):/i); if(!m) return null;
  const k=m[1].toLowerCase();
  if(k==='http'||k==='https') return {n:null,web:true};
  return SCHEMES.find(s=>s.k===k)||null;
}

function tokens(t){ return (t.match(/[가-힣A-Za-z]{2,}/g)||[]); }

function parseDate(t){
  const now=new Date(); now.setHours(0,0,0,0);
  const mk=(d,label)=>({date:iso(d),label});
  let m;
  if(/오늘/.test(t)) return mk(now,'오늘');
  if(/내일|낼/.test(t)){const d=new Date(now);d.setDate(d.getDate()+1);return mk(d,'내일')}
  if(/모레/.test(t)){const d=new Date(now);d.setDate(d.getDate()+2);return mk(d,'모레')}
  if(/글피/.test(t)){const d=new Date(now);d.setDate(d.getDate()+3);return mk(d,'글피')}
  if(/어제/.test(t)){const d=new Date(now);d.setDate(d.getDate()-1);return mk(d,'어제')}
  if(/그제|그저께/.test(t)){const d=new Date(now);d.setDate(d.getDate()-2);return mk(d,'그제')}
  // 다음 주 X요일 / 이번 주 X요일 / X요일
  m=t.match(/(다음|담|이번|다다음)?\s*주?\s*([월화수목금토일])요일/);
  if(m){
    const want=WDN.indexOf(m[2]); const d=new Date(now);
    let diff=(want-d.getDay()+7)%7;
    if(m[1]&&/다음|담/.test(m[1])) diff+=7;
    if(m[1]&&/다다음/.test(m[1])) diff+=14;
    if(!m[1]&&diff===0) diff=7;
    d.setDate(d.getDate()+diff); return mk(d,m[0]);
  }
  if(/다음\s*주|담주/.test(t)){const d=new Date(now);d.setDate(d.getDate()+7);return mk(d,'다음 주')}
  if(/이번\s*주말|주말/.test(t)){const d=new Date(now);d.setDate(d.getDate()+((6-d.getDay()+7)%7||7));return mk(d,'주말')}
  if(/다음\s*달/.test(t)){const d=new Date(now);d.setMonth(d.getMonth()+1);return mk(d,'다음 달')}
  // N월 M일
  m=t.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(m){
    const d=new Date(now); d.setMonth(+m[1]-1, +m[2]);
    if(d-now < -180*86400000) d.setFullYear(d.getFullYear()+1);
    return mk(d,m[0]);
  }
  // M/D  M.D
  m=t.match(/(?:^|\s)(\d{1,2})[\/.](\d{1,2})(?![\d.])/);
  if(m){
    const d=new Date(now); d.setMonth(+m[1]-1, +m[2]);
    if(d-now < -180*86400000) d.setFullYear(d.getFullYear()+1);
    return mk(d,m[1]+'/'+m[2]);
  }
  // N일 뒤 / N일 후
  m=t.match(/(\d{1,3})\s*일\s*(뒤|후|후에)/);
  if(m){const d=new Date(now);d.setDate(d.getDate()+ +m[1]);return mk(d,m[0])}
  // 그냥 N일 (1~31)
  m=t.match(/(?:^|\s)(\d{1,2})\s*일(?![간동째분초])/);
  if(m && +m[1]>=1 && +m[1]<=31){
    const d=new Date(now); d.setDate(+m[1]);
    if(d<now) d.setMonth(d.getMonth()+1);
    return mk(d,m[1]+'일');
  }
  return null;
}
function parseTime(t){
  let m=t.match(/(오전|오후|저녁|아침|밤)?\s*(\d{1,2})\s*시\s*(?:(\d{1,2})\s*분)?(?!간)/);
  if(m){
    let h=+m[2]; const mi=m[3]?+m[3]:0;
    if(m[1]&&/오후|저녁|밤/.test(m[1])&&h<12) h+=12;
    if(h>23) return null;
    return pad(h)+':'+pad(mi);
  }
  m=t.match(/(?:^|\s)(\d{1,2}):(\d{2})(?!\d)/);
  if(m) return pad(+m[1])+':'+m[2];
  return null;
}
function parseMoney(t){
  const m=t.match(MONEY_RE); if(!m) return null;
  let v=parseFloat(m[2].replace(/,/g,''));
  if(m[3]==='억') v*=1e8; else if(m[3]==='만') v*=1e4; else if(m[3]==='천') v*=1e3;
  let flow = m[1]==='+' ? 'in' : (m[1]==='-' ? 'out' : (IN_KW.test(t)?'in':'out'));
  if(!m[1] && !IN_KW.test(t) && !OUT_KW.test(t)) flow='out';
  const dict = flow==='in'?INCOME_DICT:SPEND_DICT;
  let group='기타';
  outer: for(const g in dict) for(const w of dict[g]) if(t.toLowerCase().includes(w)){group=g;break outer;}
  return {amount:Math.round(v), flow, group};
}
function cycleKey(t){
  for(const w of CYCLE_KW) if(t.includes(w)) return w;
  return null;
}
function recKey(t,matched){
  const before=t.split(matched)[0].trim();
  const w=(before.match(/[가-힣A-Za-z]{2,}/g)||[]).pop();
  return w || (t.match(/[가-힣A-Za-z]{2,}/)||['기록'])[0];
}

function parse(raw){
  let text=raw.trim();
  const o={raw:raw.trim(),text,cat:null,date:null,time:null,amount:null,flow:null,
           group:null,url:null,page:null,num:null,unit:null,key:null,tags:[],people:[],forced:false};
  if(!text) return o;

  // 명시 지정: /할일 …  또는 //todo
  const cmdMap={'할일':'todo','일정':'plan','금전':'money','참조':'ref','주기':'cycle','기록':'rec','메모':'note',
                t:'todo',s:'plan',m:'money',r:'ref',c:'cycle',g:'rec',n:'note'};
  const cm=text.match(/^\/(할일|일정|금전|참조|주기|기록|메모|[tsmrcgn])\s+([\s\S]+)/);
  if(cm){ o.cat=cmdMap[cm[1]]; o.forced=true; text=cm[2].trim(); o.text=text; }

  // 태그 / 사람
  o.tags   = (text.match(/#[^\s#@]+/g)||[]).map(s=>s.slice(1));
  o.people = (text.match(/@[^\s#@]+/g)||[]).map(s=>s.slice(1));

  const u=text.match(URL_RE); if(u) o.url=u[0];
  const dt=parseDate(text); if(dt) o.date=dt.date;
  o.time=parseTime(text);
  const mo=parseMoney(text);
  if(mo){ o.amount=mo.amount; o.flow=mo.flow; o.group=mo.group; }
  const nm=text.match(NUM_RE);
  if(nm){ o.num=parseFloat(nm[1]); o.unit=nm[2]; }
  const pg=text.match(/(?:p\.?|pp\.?|쪽|페이지)\s*(\d{1,4})/i); if(pg) o.page=+pg[1];
  const ck=cycleKey(text);
  const future = o.date && dday(o.date)>=0;

  if(o.cat) { finishKey(o,text,ck,nm); return o; }

  // 학습된 규칙 우선
  for(const tk of tokens(text)) if(RULES[tk]){ o.cat=RULES[tk]; finishKey(o,text,ck,nm); return o; }

  const sc = o.url? schemeOf(o.url) : null;
  if(sc && sc.todo) o.cat='todo';
  else if(sc && !sc.web && TODO_KW.test(text)) o.cat='todo';
  else if(o.url || REF_KW.test(text) || o.page || /[「『""].+[」』""]/.test(text)) o.cat='ref';
  else if(o.amount!==null) o.cat='money';
  else if(ck && future) o.cat='plan';
  else if(ck) o.cat='cycle';
  else if(TODO_KW.test(text) || /(기|것)\s*$/.test(text)) o.cat='todo';
  else if(o.num!==null && !/^\s*\d/.test(text)) o.cat='rec';
  else if(future) o.cat='plan';
  else o.cat='note';

  finishKey(o,text,ck,nm);
  return o;
}
function finishKey(o,text,ck,nm){
  if(o.cat==='cycle') o.key = ck || tokens(text)[0] || '주기';
  if(o.cat==='rec')   o.key = nm ? recKey(text,nm[0]) : (tokens(text)[0]||'기록');
  if(o.cat==='plan' && ck) o.key=ck;
}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function linkify(s){
  return esc(s).replace(LINK_G,m=>{
    const sc=schemeOf(m);
    if(!sc||sc.web)
      return '<a href="'+m+'" target="_blank" rel="noopener">'+(m.length>46?m.slice(0,44)+'…':m)+'</a>';
    return '<a class="applink" href="'+m+'" title="'+m+'">⟨'+sc.n+'⟩</a>';
  });
}

function match(e,q){
  if(!q) return true; const s=q.toLowerCase();
  return (e.raw||'').toLowerCase().includes(s) || (e.tags||[]).some(t=>t.toLowerCase().includes(s));
}

const $bar=document.querySelector('.composer');
const vv=window.visualViewport;
let lastLift=-1, lastPad=-1, fitRaf=null;
function fitBar(){
  fitRaf=null;
  let lift=0, vh=window.innerHeight;
  if(vv){
    vh=vv.height;
    lift=Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  }
  if(lift!==lastLift){
    lastLift=lift;
    $bar.style.transform='translate3d(0,'+(-lift)+'px,0)';
    $bar.classList.toggle('lifted', lift>0);
  }
  if(!$menu.hidden) $menu.style.maxHeight=Math.max(140,Math.round(vh*0.42))+'px';
  const pad=$bar.offsetHeight+lift+56;
  if(Math.abs(pad-lastPad)>4){ lastPad=pad; document.body.style.paddingBottom=pad+'px'; }
}
function schedFit(){ if(fitRaf) return; fitRaf=requestAnimationFrame(fitBar); }
if(vv){
  vv.addEventListener('resize',schedFit);
  vv.addEventListener('scroll',schedFit);
}
window.addEventListener('scroll',schedFit,{passive:true});

let menuOpen=false, menuIdx=0, menuList=[];
function menuQuery(){
  const m=$in.value.match(/^\/([^\s]*)$/);
  return m? m[1] : null;
}
function closeMenu(){ $menu.hidden=true; menuOpen=false; menuIdx=0; menuList=[]; fitBar(); }
function renderMenu(){
  const q=menuQuery();
  if(q===null){ closeMenu(); return; }
  const s=q.toLowerCase();
  menuList = s? CMDS.filter(c=>c.c.startsWith(s)||c.a===s||c.cat.startsWith(s)) : CMDS.slice();
  if(!menuList.length){ closeMenu(); return; }
  if(menuIdx>=menuList.length) menuIdx=0;
  $menu.innerHTML=menuList.map((c,i)=>
    '<button data-i="'+i+'" aria-selected="'+(i===menuIdx)+'">'+
      '<span class="cm">'+CATS[c.cat].mk+'</span><span class="cn">'+c.c+'</span>'+
      '<span class="ce">/'+c.a+' · '+esc(c.ex)+'</span></button>').join('');
  $menu.hidden=false; menuOpen=true; fitBar();
}
function pickCmd(i){
  const c=menuList[i]; if(!c) return;
  closeMenu(); $in.value='/'+c.c+' '; $in.focus();
  $in.setSelectionRange($in.value.length,$in.value.length);
  autosize(); preview();
}
$menu.addEventListener('mousedown',e=>e.preventDefault());
$menu.addEventListener('click',e=>{
  const b=e.target.closest('[data-i]'); if(b) pickCmd(+b.dataset.i);
});

  const pin = state.pinDate
    ? '<button class="chip cat" id="unpin" title="눌러서 풉니다">'+fmtD(state.pinDate,true)+
      (pc==='plan'?' 일정':pc==='note'?' 메모':'')+'으로 ✕</button>'
    : '';
  $mesh.classList.toggle('on', !!v.trim()||!!state.pinDate);
  if(!v.trim()){
    $chips.innerHTML=pin+'<span class="chip hint">엔터로 담기 · 줄바꿈은 ⇧엔터 · <b>/</b>를 치면 분류를 고를 수 있습니다</span>';
    return;
  }
  const only=v.match(/^\/(할일|일정|금전|참조|주기|기록|메모|[tsmrcgn])\s*$/);
  if(only||menuOpen){
    const c=only? CMDS.find(x=>x.c===only[1]||x.a===only[1]) : null;
    $chips.innerHTML = pin + (c
      ? '<span class="chip cat">'+CATS[c.cat].mk+' '+c.c+' 지정</span><span class="chip hint">무엇을 담을까요</span>'
      : '<span class="chip hint">↑↓로 고르고 엔터 · 그냥 이어 적어도 됩니다</span>');
    return;
  }

async function commit(){
  const v=$in.value.trim(); if(!v) return;
  if(/^\/(할일|일정|금전|참조|주기|기록|메모|[tsmrcgn])\s*$/.test(v)){
    toast('분류만 골랐습니다. 담을 내용을 이어 적으세요'); return;
  }
  const lines=v.split('\n').map(s=>s.trim()).filter(Boolean);
  const now=Date.now();
  const items=lines.map((l,i)=>{
    const p=applyTab(applyPin(parse(l)));
    if(state.pinDate && !p.date) p.date=state.pinDate;
    delete p.tabbed;
    return {id:uid(), ts:now+i, mt:now+i, ...p, done:false, doneAt:null, archived:false};
  });
  E=E.concat(items); await put(items);
  $in.value=''; closeMenu(); autosize(); preview(); render();
  toast((state.pinDate? fmtD(state.pinDate)+' ':'')+
    (items.length===1? CATS[items[0].cat].name+'으로 담았습니다' : items.length+'개를 담았습니다'));
}

  if(menuOpen){
    if(e.key==='ArrowDown'){e.preventDefault();menuIdx=(menuIdx+1)%menuList.length;renderMenu();return;}
    if(e.key==='ArrowUp'){e.preventDefault();menuIdx=(menuIdx-1+menuList.length)%menuList.length;renderMenu();return;}
    if(e.key==='Tab'){e.preventDefault();pickCmd(menuIdx);return;}
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();pickCmd(menuIdx);return;}
    if(e.key==='Escape'){e.preventDefault();closeMenu();preview();return;}
  }
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();commit();}
  if(e.key==='Escape'){$in.value='';closeMenu();autosize();preview();}
});

/* ═══════════════ 7. 주기 계산 ═══════════════ */
function cycleGroups(){
  const g={};
  visible().filter(e=>e.cat==='cycle').forEach(e=>{
    const k=e.key||'주기'; (g[k]=g[k]||[]).push(e);
  });
  return Object.keys(g).map(k=>{
    const list=g[k].sort((a,b)=>(a.date?dObj(a.date):new Date(a.ts))-(b.date?dObj(b.date):new Date(b.ts)));
    const dates=list.map(e=>e.date||iso(new Date(e.ts)));
    const gaps=[];
    for(let i=1;i<dates.length;i++) gaps.push(Math.round((dObj(dates[i])-dObj(dates[i-1]))/86400000));
    const recent=gaps.slice(-5).filter(x=>x>0);
    const avg=recent.length? Math.round(recent.reduce((a,b)=>a+b,0)/recent.length) : null;
    const last=dates[dates.length-1];
    let next=null;
    if(avg){ const d=dObj(last); d.setDate(d.getDate()+avg); next=iso(d); }
    return {key:k,list,last,avg,next,n:list.length};
  }).sort((a,b)=>{
    const x=a.next?dday(a.next):9999, y=b.next?dday(b.next):9999; return x-y;
  });
}
function recGroups(){
  const g={};
  visible().filter(e=>e.cat==='rec').forEach(e=>{ const k=e.key||'기록'; (g[k]=g[k]||[]).push(e); });
  return Object.keys(g).map(k=>{
    const list=g[k].sort((a,b)=>a.ts-b.ts);
    const nums=list.filter(e=>typeof e.num==='number');
    const unit=(nums[nums.length-1]||{}).unit||'';
    const last30=nums.filter(e=>Date.now()-e.ts<30*86400000);
    return {key:k,list,nums,unit,
      latest:nums.length?nums[nums.length-1].num:null,
      sum30:last30.reduce((a,b)=>a+b.num,0), n30:last30.length};
  }).sort((a,b)=>b.list[b.list.length-1].ts-a.list[a.list.length-1].ts);
}

/* ═══════════════ 7-c. 루틴 ═══════════════ */
const isRt=e=>e.cat==='todo'&&e.rt;
const rtDone=(e,d)=>(e.hist||[]).indexOf(d||TODAY())>=0;
function rtLabel(r){
  if(!r) return '';
  if(r.mode==='day') return '매일';
  if(r.mode==='wd'){
    const d=(r.d||[]).slice().sort();
    if(!d.length) return '요일 미정';
    if(d.join()==='1,2,3,4,5') return '평일';
    if(d.join()==='0,6') return '주말';
    return d.map(i=>WDN[i]).join('');
  }
  if(r.mode==='n') return (r.n||2)+'일마다';
  return '';
}
function rtOn(e,s){                       // 그날이 해당되는 날인가
  const r=e.rt; if(!r) return false;
  if(r.mode==='day') return true;
  if(r.mode==='wd') return (r.d||[]).indexOf(dObj(s).getDay())>=0;
  if(r.mode==='n'){
    const h=(e.hist||[]).filter(x=>x<s).sort();
    if(!h.length) return true;
    return Math.round((dObj(s)-dObj(h[h.length-1]))/86400000) >= (r.n||2);
  }
  return false;
}
function rtStreak(e){
  if(e.rt.mode==='n'){
    const h=(e.hist||[]).slice().sort(); if(!h.length) return 0;
    let n=1;
    for(let i=h.length-1;i>0;i--){
      const gap=Math.round((dObj(h[i])-dObj(h[i-1]))/86400000);
      if(gap<=(e.rt.n||2)+1) n++; else break;
    }
    return n;
  }
  const set=new Set(e.hist||[]);
  const d=new Date(); d.setHours(0,0,0,0);
  if(!set.has(iso(d))) d.setDate(d.getDate()-1);
  let n=0, guard=0;
  while(guard++<800){
    const s=iso(d);
    if(!rtOn(e,s)){ d.setDate(d.getDate()-1); continue; }
    if(set.has(s)){ n++; d.setDate(d.getDate()-1); } else break;
  }
  return n;
}
function rtStat(e,span){
  span=span||30;
  const set=new Set(e.hist||[]), days=[];
  let due=0, hit=0;
  for(let i=span-1;i>=0;i--){
    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const s=iso(d), on=(e.rt.mode==='n')? true : rtOn(e,s), ok=set.has(s);
    if(on) due++; if(ok) hit++;
    days.push({s,on,ok});
  }
  if(e.rt.mode==='n') due=Math.max(1,Math.round(span/(e.rt.n||2)));
  return {days, due, hit, rate: due? Math.round(hit/due*100):0, streak:rtStreak(e)};
}
function routines(){ return visible().filter(isRt); }
function rtDueToday(e){ return rtOn(e,TODAY()); }

/* ═══════════════ 7-b. 전체 잔액 ═══════════════ */
function calcBalance(){
  const b=META.balance; if(!b) return null;
  const t=TODAY();
  let v=b.amount;
  E.forEach(e=>{
    if(e.cat!=='money'||typeof e.amount!=='number') return;
    const d=e.date||iso(new Date(e.ts));
    if(d>t) return;
    if(d>b.date || (d===b.date && e.ts>(b.ts||0)))
      v += (e.flow==='in'? e.amount : -e.amount);
  });
  return v;
}
function sinceAnchor(){
  const b=META.balance; if(!b) return {in:0,out:0,n:0};
  const t=TODAY(); const o={in:0,out:0,n:0};
  E.forEach(e=>{
    if(e.cat!=='money'||typeof e.amount!=='number') return;
    const d=e.date||iso(new Date(e.ts));
    if(d>t) return;
    if(d>b.date || (d===b.date && e.ts>(b.ts||0))){
      if(e.flow==='in') o.in+=e.amount; else o.out+=e.amount; o.n++;
    }
  });
  return o;
}

/* ═══════════════ 8. 화면들 ═══════════════ */
function vToday(){
  const t=TODAY(), q=state.q, now=new Date();
  const byTime=(a,b)=>((a.time||'99:99')<(b.time||'99:99')?-1:1);

  const todosAll=byCat('todo').filter(e=>!e.done&&!isRt(e)&&match(e,q))
      .sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:1);
  const dueNow=todosAll.filter(e=>!e.date||dday(e.date)<=0);
  const late=todosAll.filter(e=>e.date&&dday(e.date)<0);
  const rtToday=routines().filter(e=>rtDueToday(e)&&match(e,q));
  const rtLeft=rtToday.filter(e=>!rtDone(e));
  const planToday=visible().filter(e=>e.cat==='plan'&&!e.dl&&e.date===t&&match(e,q)).sort(byTime);
  const planWeek=visible().filter(e=>e.cat==='plan'&&!e.dl&&e.date&&dday(e.date)>0&&dday(e.date)<=7&&match(e,q))
      .sort((a,b)=>a.date===b.date?byTime(a,b):(a.date<b.date?-1:1));
  const dls=deadlines().filter(e=>match(e,q));
  const dlDue=dls.filter(e=>!e.date||dday(e.date)<=0).length;
  const dlLeft=dls.filter(e=>e.date&&dday(e.date)>0&&!dlProgToday(e)).length;
  const cy=cycleGroups().filter(g=>g.next&&dday(g.next)<=14);

function applyTab(p){
  const c=TAB_CAT[state.tab];
  if(!c || p.forced || state.pinDate || p.cat===c) return p;
  if(c==='money' && p.amount===null) return p;   // 금액이 없으면 금전으로 몰지 않는다
  if(c==='rec'   && p.num===null)    return p;   // 숫자가 없으면 기록으로 몰지 않는다
  p.cat=c; p.tabbed=true;
  if(c==='cycle'&&!p.key) p.key=cycleKey(p.text)||tokens(p.text)[0]||'주기';
  if(c==='rec'  &&!p.key) p.key=tokens(p.text)[0]||'기록';
  return p;
}
function pinCat(){
  if(!state.pinDate) return null;
  const n=dday(state.pinDate);

function applyPin(p){
  const pc=pinCat(); if(!pc||p.forced) return p;

function monthRange(mon){

const RANGES=[['week','이번 주'],['lastweek','지난주'],['month','이번 달'],['prev','지난달'],
              ['quarter','이번 분기'],['year','올해'],['lastyear','지난해'],['all','전체']];
function rangeOf(k){
  const n=new Date(), y=n.getFullYear(), m=n.getMonth();
  const f=(a,b,label)=>({from:iso(a),to:iso(b),label});
  if(k==='week'||k==='lastweek'){
    const a=new Date(y,m,n.getDate());
    a.setDate(a.getDate()-((a.getDay()+6)%7)-(k==='lastweek'?7:0));
    const b=new Date(a); b.setDate(a.getDate()+6);
    return f(a,b,(k==='week'?'이번 주 ':'지난주 ')+
      (a.getMonth()+1)+'.'+a.getDate()+'~'+(b.getMonth()+1)+'.'+b.getDate());
  }
  if(k==='month')    return f(new Date(y,m,1), new Date(y,m+1,0), y+'년 '+(m+1)+'월');
  if(k==='prev')     return f(new Date(y,m-1,1), new Date(y,m,0), y+'년 '+(m||12)+'월');
  if(k==='quarter'){ const q=Math.floor(m/3)*3;
                     return f(new Date(y,q,1), new Date(y,q+3,0), y+'년 '+(q/3+1)+'분기'); }
  if(k==='year')     return f(new Date(y,0,1), new Date(y,11,31), y+'년');
  if(k==='lastyear') return f(new Date(y-1,0,1), new Date(y-1,11,31), (y-1)+'년');
  return {from:null,to:null,label:'전체 기간'};
}

  if(gi.length){
    s+='\n## 수입 갈래\n갈래 | 합계 | 건수 | 비중\n';

  }
  if(go.length){
    s+='\n## 지출 갈래\n갈래 | 합계 | 건수 | 비중 | 건당평균\n';
    go.forEach(([k,v])=>s+=k+' | '+nf(v.sum)+' | '+v.n+' | '+Math.round(v.sum/tout*100)+'% | '+nf(v.sum/v.n)+'\n');
  }

    const top=go.slice(0,8).map(x=>x[0]);

  if(bigs.length){
    s+='\n## 큰 지출 '+bigs.length+'\n날짜 | 금액 | 갈래 | 내용\n';
    bigs.forEach(e=>s+=eDate(e)+' | '+nf(e.amount)+' | '+(e.group||'')+' | '+e.raw.replace(/\n/g,' ')+'\n');
  }
  if(outs.length<=300){
    s+='\n## 지출 전체 내역\n날짜 | 금액 | 갈래 | 내용\n';
    outs.forEach(e=>s+=eDate(e)+' | '+nf(e.amount)+' | '+(e.group||'')+' | '+e.raw.replace(/\n/g,' ')+'\n');
  }else s+='\n(지출 '+outs.length+'건은 많아 갈래 집계와 큰 지출만 실었다.)\n';

  s+='\n\n# 물음\n'+
    '너는 불규칙한 수입으로 사는 사람의 살림을 오래 봐온 분석가다. 다음 차례로 답해라.\n\n'+
    '1. 사실 요약 — 숫자로 확인되는 것만 네댓 문장.\n'+
    '2. 흐름 — 늘고 준 갈래, 계절이나 달마다의 쏠림. 한 번뿐인 큰 항목과 매달 되풀이되는 항목을 갈라서 봐라. 되풀이되는 고정비의 합이 얼마인지 계산해라.\n'+
    '3. 수입의 성질 — 어느 갈래에 얼마나 기대고 있는지, 들어오는 간격은 얼마이며 가장 마른 달과 가장 나은 달의 차이가 어느 정도인지. 잔액이 적혀 있다면, 수입이 끊긴 채 지금 잔액으로 버틸 수 있는 달수를 지출 평균으로 계산해라. 「조정」 갈래는 잔액을 실제와 맞추며 생긴 오차이니 지출이나 수입으로 세지 말고, 그 크기가 크면 기록이 새고 있다는 뜻으로 지적해라.\n'+
    '4. 걱정되는 지점 두셋 — 왜 그렇게 보는지 근거를 붙여라.\n'+
    '5. 자료만으로는 알 수 없어 내게 물어야 할 질문 셋.\n\n'+
    '갈래가 「기타」인 항목이 많으면 그 사실을 먼저 지적하고, 어떻게 나누면 좋을지 제안해라.\n'+
    '절약하라는 훈계나 투자·세무 조언은 하지 마라. 나는 판단할 재료를 원하는 것이지 처방을 원하는 게 아니다.'+TAIL;
  return s;
}

/* ─ 기록 ─ */
function bRec(r){
  const arr=E.filter(e=>e.cat==='rec'&&inR(eDate(e),r));
  const rts=E.filter(e=>isRt(e)&&!e.archived);
  if(!arr.length&&!rts.length) return null;
  const gs={};
  arr.forEach(e=>{const k=e.key||'기록';(gs[k]=gs[k]||[]).push(e)});
  let s=HEAD+'# 자료 · 기록 ('+r.label+')\n총 '+arr.length+'건 · 항목 '+Object.keys(gs).length+'\n\n';
  s+='## 항목 요약\n항목 | 단위 | 횟수 | 첫 기록 | 마지막 | 최근값 | 평균 | 합\n';
  Object.keys(gs).forEach(k=>{
    const l=gs[k].sort((a,b)=>a.ts-b.ts), n=l.filter(e=>typeof e.num==='number');
    const sum=n.reduce((a,b)=>a+b.num,0);
    s+=k+' | '+((n[0]||{}).unit||'')+' | '+l.length+' | '+eDate(l[0])+' | '+eDate(l[l.length-1])+' | '+
       (n.length?n[n.length-1].num:'-')+' | '+(n.length?Math.round(sum/n.length*100)/100:'-')+' | '+
       (n.length?Math.round(sum*100)/100:'-')+'\n';
  });
  Object.keys(gs).forEach(k=>{
    const l=gs[k].sort((a,b)=>a.ts-b.ts).slice(-180);
    s+='\n## '+k+' — 날짜별\n날짜 | 요일 | 값 | 원문\n';
    l.forEach(e=>{const d=eDate(e);
      s+=d+' | '+WDN[dObj(d).getDay()]+' | '+(e.num!==null&&e.num!==undefined?e.num+(e.unit||''):'-')+
         ' | '+e.raw.replace(/\n/g,' ')+'\n';});
  });
  if(rts.length){
    s+='\n## 루틴 (되풀이하기로 정한 할일)\n이름 | 주기 | 연속 | 30일 해당 | 30일 이행 | 이행률\n';
    rts.forEach(e=>{ const t=rtStat(e,30);
      s+=(e.text||e.raw).replace(/\n/g,' ')+' | '+rtLabel(e.rt)+' | '+t.streak+' | '+t.due+' | '+t.hit+' | '+t.rate+'%\n'; });
    rts.forEach(e=>{
      const h2=(e.hist||[]).slice(-120);
      s+='\n### '+(e.text||e.raw).replace(/\n/g,' ')+' — 해낸 날\n'+(h2.length? h2.join(', '):'(아직 없음)')+'\n';
    });
  }
  s+='\n\n# 물음\n'+
    '너는 오랜 기록을 읽고 흐름을 짚어주는 사람이다. 다음 차례로 답해라.\n\n'+
    '1. 항목마다 무엇이 늘고 무엇이 줄었는지. 기간을 앞뒤로 갈라 견주어라.\n'+
    '2. 끊긴 자리 — 며칠 이상 비어 있는 구간을 찾아 언제였는지 짚어라. 그 무렵 다른 항목은 어땠는지도 함께 봐라.\n'+
    '3. 요일과 주기 — 특정 요일에 몰리거나 비는 패턴이 있는지.\n'+
    '4. 항목끼리의 관계 — 함께 늘거나 서로 밀어내는 항목이 있는지. 있다면 몇 건을 근거로 그렇게 보는지 밝히고, 우연일 가능성도 함께 말해라.\n'+
    '5. 기록 자체에 대한 지적 — 재는 방식이 들쭉날쭉하거나 단위가 섞였다면 알려라.\n'+
    '6. 루틴이 적혀 있다면, 끊긴 자리가 언제였고 어떤 요일이나 시기에 자주 무너지는지 짚어라. '+
    '이행률이 낮은 것은 의지의 문제로 몰지 말고, 주기 설정 자체가 무리인지 먼저 따져라. '+
    '루틴의 이행과 수치 기록이 함께 움직이는지도 봐라.\n\n'+
    '몸에 관한 수치(체중, 식사, 운동량 따위)가 있어도 목표치나 감량·증량 계획을 세워주지 마라.\n'+
    '무엇이 더 나은 값인지 판정하지 말고, 관찰된 흐름과 그 흐름이 무엇을 시사하는지만 말해라.'+TAIL;
  return s;
}

/* ─ 할일 ─ */
function bTodo(){
  const un=E.filter(e=>e.cat==='todo'&&!e.done&&!e.archived&&!isRt(e));
  const done=E.filter(e=>((e.cat==='todo'&&e.done)||e.wasTodo)&&Date.now()-(e.doneAt||e.ts)<90*86400000);
  if(!un.length&&!done.length) return null;
  const age=e=>Math.round((Date.now()-e.ts)/86400000);
  let s=HEAD+'# 자료 · 할일\n남은 일 '+un.length+' · 최근 90일에 끝낸 일 '+done.length+'\n\n';
  s+='## 남은 일\n적은 날 | 묵은 날수 | 기한 | 내용\n';
  un.sort((a,b)=>a.ts-b.ts).forEach(e=>
    s+=iso(new Date(e.ts))+' | '+age(e)+'일 | '+(e.date||'-')+' | '+e.raw.replace(/\n/g,' ')+'\n');
  if(done.length){
    s+='\n## 끝낸 일 (최근 90일)\n적은 날 | 끝낸 날 | 걸린 날수 | 내용\n';
    done.sort((a,b)=>(a.doneAt||a.ts)-(b.doneAt||b.ts)).forEach(e=>
      s+=iso(new Date(e.ts))+' | '+iso(new Date(e.doneAt||e.ts))+' | '+
         Math.round(((e.doneAt||e.ts)-e.ts)/86400000)+'일 | '+e.raw.replace(/\n/g,' ')+'\n');
  }
  s+='\n\n# 물음\n'+
    '1. 오래 묵은 일들을 골라 왜 안 되고 있는지 성질별로 묶어라. (남에게 달린 일 / 첫 걸음이 무거운 일 / 사실은 하기 싫은 일 / 이미 지나가버린 일)\n'+
    '2. 되풀이해 밀리는 종류가 있는지. 끝낸 일과 견주어 어떤 일은 빨리 끝나고 어떤 일은 늘 남는지 말해라.\n'+
    '3. 지금 지워도 되는 일을 골라라. 왜 그런지 한 줄씩.\n'+
    '4. 가장 무거워 보이는 셋을 골라, 각각 30분 안에 끝낼 수 있는 첫 조각으로 쪼개라.\n'+
    '5. 목록 전체를 보고 내가 요즘 무엇에 매여 있는지 한 문단으로 말해라.'+TAIL;
  return s;
}

/* ─ 주기 ─ */
function bCycle(){
  const gs=cycleGroups(); if(!gs.length) return null;
  let s=HEAD+'# 자료 · 주기\n오늘 '+TODAY()+' · 항목 '+gs.length+'\n\n';
  s+='## 요약\n항목 | 횟수 | 마지막 | 평균주기(일) | 예상 다음 | D\n';
  gs.forEach(g=>s+=g.key+' | '+g.n+' | '+g.last+' | '+(g.avg||'-')+' | '+(g.next||'-')+' | '+
    (g.next?fmtDD(dday(g.next)):'-')+'\n');
  gs.forEach(g=>{
    s+='\n## '+g.key+' — 이력\n';
    g.list.forEach((e,i)=>{
      const d=eDate(e), prev=i?eDate(g.list[i-1]):null;
      s+=d+(prev?' (+'+Math.round((dObj(d)-dObj(prev))/86400000)+'일)':'')+' | '+e.raw.replace(/\n/g,' ')+'\n';
    });
  });
  const others=E.filter(e=>['note','rec','plan'].includes(e.cat)&&!e.archived).slice(-400)
    .map(e=>eDate(e)+' | '+e.cat+' | '+e.raw.replace(/\n/g,' ')).join('\n');
  if(others) s+='\n## 아직 주기로 잡히지 않은 최근 기록\n'+others+'\n';
  s+='\n\n# 물음\n'+
    '1. 항목마다 주기가 고른지 들쭉날쭉한지 보고, 평균보다 중앙값이 나은 경우가 있으면 다시 셈해라.\n'+
    '2. 앞으로 석 달 안에 돌아올 것들을 날짜순 목록으로 만들어라. 이미 지난 것은 맨 위에 따로 세워라.\n'+
    '3. 「아직 주기로 잡히지 않은 최근 기록」에서 사실은 되풀이되고 있는 일을 찾아내라. 몇 번, 어떤 간격으로 나타났는지 근거를 대고, 주기 항목으로 삼을 만한 것을 추려라.\n'+
    '4. 살면서 흔히 챙기는 일 가운데 내 기록에 아예 없는 것이 있으면 일러라. 다만 넘겨짚지 말고 후보로만 말해라.'+TAIL;
  return s;
}

/* ─ 참조 ─ */
function bRef(r){
  const arr=E.filter(e=>e.cat==='ref'&&inR(eDate(e),r)).sort((a,b)=>a.ts-b.ts);
  if(!arr.length) return null;
  let s=HEAD+'# 자료 · 참조 ('+r.label+')\n'+arr.length+'건 · ★은 내가 위에 고정해 둔 것\n\n날짜 | 내용\n';
  arr.forEach(e=>s+=eDate(e)+' | '+(e.star?'★ ':'')+e.raw.replace(/\n/g,' ')+'\n');
  s+='\n\n# 물음\n'+
    '이것은 내가 지나가다 붙들어 둔 주소, 인용, 출처들이다.\n\n'+
    '1. 주제별로 묶어라. 내가 붙인 이름이 아니라 내용을 보고 묶고, 묶음마다 이름을 새로 지어라.\n'+
    '2. 시간에 따라 관심이 어떻게 옮겨갔는지 짚어라. 사그라든 갈래와 자라고 있는 갈래를 갈라라.\n'+
    '3. 서로 멀어 보이지만 이어 붙이면 글감이 될 만한 조합 셋을 찾아 각각 왜 그런지 말해라.\n'+
    '4. 한 묶음 안에서 자료가 얕은 곳, 곧 더 찾아봐야 할 구석을 일러라.\n'+
    '5. 다시 들춰볼 일이 없어 보이는 것을 골라라. 다만 ★이 붙은 것은 빼라.\n'+
    '6. ★이 붙지 않았는데 자주 쓰일 것 같아 고정할 만한 것을 셋 골라라.'+TAIL;
  return s;
}

/* ─ 회고 ─ */
function bReview(r){
  const arr=E.filter(e=>inR(eDate(e),r)&&!e.archived).sort((a,b)=>eDate(a)<eDate(b)?-1:1);
  if(!arr.length) return null;
  const span=(r.from&&r.to)? Math.round((dObj(r.to)-dObj(r.from))/86400000)+1 : 9999;
  let s=HEAD+'# 자료 · '+r.label+'의 기록 전부\n'+arr.length+'건'+(span<9999?' · '+span+'일':'')+'\n\n';
  Object.keys(CATS).forEach(c=>{
    const l=arr.filter(e=>e.cat===c); if(!l.length) return;
    s+='\n## '+CATS[c].name+' ('+l.length+')\n';
    if(c==='money'){
      const i=l.filter(e=>e.flow==='in').reduce((a,b)=>a+b.amount,0);
      const o=l.filter(e=>e.flow!=='in').reduce((a,b)=>a+b.amount,0);
      s+='수입 '+nf(i)+'원 / 지출 '+nf(o)+'원 / 남음 '+nf(i-o)+'원\n';
      const g={}; l.filter(e=>e.flow!=='in').forEach(e=>{const k=e.group||'기타';g[k]=(g[k]||0)+e.amount});
      s+=Object.entries(g).sort((a,b)=>b[1]-a[1]).map(x=>x[0]+' '+nf(x[1])).join(' · ')+'\n';
    }else{
      l.forEach(e=>s+=eDate(e)+' | '+(c==='todo'?(e.done?'[끝] ':'[남음] '):'')+e.raw.replace(/\n/g,' ')+'\n');
    }
  });
  if(span>45){
    const sums=E.filter(e=>e.cat==='ref'&&(e.tags||[]).some(t=>/요약|되짚|정리/.test(t))&&inR(eDate(e),r))
      .sort((a,b)=>eDate(a)<eDate(b)?-1:1);
    if(sums.length){
      s+='\n## 앞서 만들어 참조로 담아둔 요약 ('+sums.length+')\n'+
         '이것은 내가 더 짧은 기간마다 정리해 둔 글이다. 날것의 기록보다 이쪽을 먼저 읽어라.\n';
      sums.forEach(e=>s+='\n['+eDate(e)+']\n'+e.raw+'\n');
    }
  }
  s+='\n\n# 물음\n'+
    '이것은 '+r.label+' 동안 내가 살면서 적어둔 것 전부다. 잘잘못을 매기지 말고 다음처럼 답해라.\n\n'+
    (span<=10
      ? '1. 이 기간을 한 문단으로 서술해라. 날이 며칠뿐이니 날짜별로 짚어도 좋다. 사실만으로.\n'
      : '1. 이 기간을 한 문단으로 서술해라. 무슨 일이 있었고 나는 무엇에 시간을 썼는가. 사실만으로.\n')+
    '2. 되풀이해 나타난 말, 이름, 장소, 걱정을 뽑아 빈도와 함께 보여라.\n'+
    '3. 앞뒤가 달라진 대목 — 기간 초와 말을 견주어 무엇이 바뀌었는지.\n'+
    '4. 기록에 남지 않은 자리 — 유난히 비어 있는 날들이나, 있을 법한데 한 줄도 없는 영역을 짚어라.\n'+
    '5. 이 기록에서 글로 쓸 만한 대목 셋. 왜 그것이 글이 될 수 있는지 각각 두어 줄로.\n\n'+
    '5번은 소재만 골라 주면 된다. 대신 써주지 말고, 문장을 지어 보이지도 마라.\n\n'+
    '마지막에 「갈무리」라는 제목으로, 이 기간을 열 줄 안쪽으로 압축한 글을 따로 붙여라. '+
    '나는 이것을 참조로 담아 두었다가 더 긴 기간을 되짚을 때 재료로 쓸 것이다. '+
    '그러니 이 기간에만 통하는 대명사나 앞뒤 맥락에 기대는 표현은 피하고, 날짜와 이름을 밝혀 적어라.'+TAIL;
  return s;
}

/* ─ 정돈 ─ */
function bTidy(){
  const notes=E.filter(e=>e.cat==='note'&&!e.archived).sort((a,b)=>a.ts-b.ts);
  if(!notes.length&&!E.length) return null;
  let s=HEAD+'# 자료 · 분류 점검\n'+
    '지금 쓰는 분류는 일곱이다. 할일, 일정, 금전(수입·지출), 참조(주소·인용·출처), '+
    '주기(이발·검진처럼 되풀이되는 일), 기록(숫자가 붙은 것), 메모(어디에도 안 걸린 것).\n'+
    '분류는 낱말 규칙으로 자동 처리되고, 내가 고칠 때마다 그 낱말을 기억한다.\n\n';
  s+='## 지금 익힌 규칙\n'+(Object.keys(RULES).length?
    Object.entries(RULES).map(([k,v])=>k+' → '+CATS[v].name).join('\n'):'(없음)')+'\n';
  s+='\n## 메모함에 남은 것 ('+notes.length+')\n날짜 | 내용\n';
  notes.slice(-300).forEach(e=>s+=eDate(e)+' | '+e.raw.replace(/\n/g,' ')+'\n');
  s+='\n## 분류별 건수\n'+Object.keys(CATS).map(c=>CATS[c].name+' '+E.filter(e=>e.cat===c).length).join(' · ')+'\n';
  s+='\n\n# 물음\n'+
    '1. 메모함에 남은 것 가운데 사실은 일곱 분류 중 하나에 속하는 것을 골라라. '+
    '「내용 → 분류」 형식의 목록으로, 확실한 것만.\n'+
    '2. 어느 분류에도 잘 안 맞는데 여러 번 되풀이되는 성질의 글이 있는지 봐라. '+
    '있다면 새 분류를 제안하고, 이름과 무엇을 담을지, 지금 자료에서 몇 건이 해당하는지 말해라. '+
    '억지로 만들지는 마라. 없으면 없다고 하면 된다.\n'+

    '4. 지금 익힌 규칙 가운데 잘못됐거나 위험해 보이는 것이 있으면 지적해라.'+TAIL;

/* ─ 그날의 일기 ─ */
function bDiary(day){
  const byT=(a,b)=>((a.time||'zz')===(b.time||'zz')? a.ts-b.ts : ((a.time||'zz')<(b.time||'zz')?-1:1));
  const list=visible().filter(e=>eDate(e)===day).sort(byT);
  const rtd=visible().filter(e=>isRt(e)&&(e.hist||[]).indexOf(day)>=0);
  const dld=visible().filter(e=>isDL(e)&&(e.hist||[]).indexOf(day)>=0);
  if(!list.length&&!rtd.length&&!dld.length) return null;
  const d=dObj(day);
  let s=HEAD+'# 자료 · '+d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+WDN[d.getDay()]+'요일\n\n';

  s+='## 그날 담긴 것 (시각순)\n시각 | 갈래 | 내용\n';
  list.forEach(e=>{
    let tag=CATS[e.cat].name;
    if(e.wasTodo) tag='끝낸 일';
    else if(isDL(e)) tag='마감';
    s+=(e.time||'-')+' | '+tag+' | '+e.raw.replace(/\n/g,' ')+'\n';
  });

  const money=list.filter(e=>e.cat==='money');
  if(money.length){
    const o=money.filter(e=>e.flow!=='in').reduce((a,b)=>a+b.amount,0);
    const i=money.filter(e=>e.flow==='in').reduce((a,b)=>a+b.amount,0);
    s+='\n## 그날 오간 돈\n'+(i?'수입 '+nf(i)+'원 · ':'')+(o?'지출 '+nf(o)+'원':'')+'\n';
    money.forEach(e=>s+=(e.flow==='in'?'+':'−')+nf(e.amount)+' | '+(e.group||'')+' | '+e.raw.replace(/\n/g,' ')+'\n');
  }
  const rec=list.filter(e=>e.cat==='rec');
  if(rec.length){
    s+='\n## 그날의 수치\n';
    rec.forEach(e=>s+=(e.key||'')+' '+(e.num!==null&&e.num!==undefined?e.num+(e.unit||''):'')+' | '+e.raw.replace(/\n/g,' ')+'\n');
  }
  if(rtd.length) s+='\n## 그날 해낸 루틴\n'+rtd.map(e=>(e.text||e.raw)+'('+rtLabel(e.rt)+')').join(' · ')+'\n';
  if(dld.length){
    s+='\n## 그날 손댄 마감\n';
    dld.forEach(e=>{ const n=e.date?dday(e.date):null;
      s+=(e.text||e.raw)+(e.date? ' — 마감 '+e.date+(n!==null?' ('+fmtDD(n)+')':''):'')+'\n'; });
  }

  const ctx=[];
  for(let k=3;k>=1;k--){
    const dd=new Date(d); dd.setDate(dd.getDate()-k); const ds=iso(dd);
    visible().filter(e=>eDate(e)===ds&&(e.cat==='note'||e.cat==='plan')).slice(0,3)
      .forEach(e=>ctx.push(ds+' | '+e.raw.replace(/\n/g,' ').slice(0,60)));
  }
  if(ctx.length)
    s+='\n## 앞선 사흘 (흐름을 알기 위한 참고일 뿐이다. 이 날의 일기에 이 일들을 쓰지 마라)\n'+ctx.join('\n')+'\n';

  s+='\n\n# 물음\n'+
    '위 자료는 그 하루 동안 내가 적어둔 것 전부다. 이것으로 그날의 일기 초고를 써라.\n\n'+
    '- 자료에 없는 일, 없는 감정, 없는 사람을 만들어 넣지 마라. 비어 있는 시간은 비어 있는 채로 두어라. '+
    '「~했을 것이다」 「~했으리라」처럼 짐작으로 메우지도 마라.\n'+
    '- 아름답게 쓰려 하지 마라. 나는 내가 고쳐 쓸 초고를 원하는 것이지 완성된 글을 원하는 게 아니다. '+
    '비유, 미문, 교훈으로 맺는 마지막 문장은 넣지 마라. 문체를 흉내 내려 하지 말고 사실을 시간 순으로 꿰어 놓는 데 집중해라.\n'+
    '- 1인칭 과거형 한국어 산문. 서너 문단, 길어도 열두 문장.\n'+
    '- 시각이 적힌 것은 그 순서를 지키고, 시각이 없는 것에는 억지로 시간을 붙이지 마라.\n'+
    '- 돈은 액수를 그대로 쓰되 영수증처럼 나열하지 말고 그날의 움직임 속에 녹여라.\n'+
    '- 내가 적은 문장이 이미 일기의 문장인 경우에는 고치지 말고 그대로 살려라.\n\n'+
    '다 쓴 뒤에 「덧」이라는 제목을 달고 세 줄을 더해라. '+
    '첫째, 자료에 있으나 초고에 담지 못한 것. 둘째, 앞뒤가 비어 내가 채워야 할 자리. '+
    '셋째, 이 날의 기록에서 걸리는 것 하나.'+TAIL;
  return s;
}

async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(err){
    const ta=document.createElement('textarea');
    ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e2){}
    ta.remove(); return ok;
  }
}
function promptSheet(title,text){
  const v=document.createElement('div'); v.className='veil';
  v.innerHTML='<div class="sheet wide"><h3>'+esc(title)+'</h3>'+
    '<p>'+text.length.toLocaleString('ko-KR')+'자'+
    (text.length>60000?' · 꽤 깁니다. 기간을 좁히면 답이 촘촘해집니다':'')+' · 고쳐서 쓰셔도 됩니다</p>'+
    '<textarea class="ptext" spellcheck="false"></textarea>'+
    '<div class="opts" style="margin-top:12px">'+
      '<button data-k="copy">복사</button>'+
      '<button data-k="open">복사하고 Claude 열기</button>'+
      '<button data-k="save">파일로</button>'+
      '<button data-k="">닫기</button></div></div>';
  document.body.appendChild(v);
  const ta=v.querySelector('.ptext'); ta.value=text;
  v.addEventListener('click',async ev=>{
    if(ev.target===v){ v.remove(); return; }
    const b=ev.target.closest('[data-k]'); if(!b) return;
    const k=b.dataset.k;
    if(k==='copy'){ toast(await copyText(ta.value)?'복사했습니다':'복사가 막혔습니다. 글을 직접 선택해 주세요'); return; }
    if(k==='open'){ copyText(ta.value); window.open('https://claude.ai/new','_blank','noopener');
                    v.remove(); toast('복사했습니다. 새 대화에 붙여 넣으세요'); return; }
    if(k==='save'){ download('체_물음_'+TODAY()+'.md',ta.value,'text/markdown;charset=utf-8',true);
                    v.remove(); return; }
    v.remove();
  });
}
function buildAsk(kind,range){
  const a=ASKS.find(x=>x.k===kind); if(!a) return;
  const r=range||rangeOf(state.askRange);
  const t=a.build(a.ranged?r:{from:null,to:null,label:'전체 기간'});
  if(!t){ toast('그 기간에는 엮을 자료가 없습니다'); return; }
  promptSheet(a.name+(a.ranged?' · '+r.label:''), t);
}

      const {usage,quota}=await navigator.storage.estimate();
      s='쓴 용량 '+(usage/1048576).toFixed(2)+'MB / 쓸 수 있는 양 약 '+(quota/1048576).toFixed(0)+'MB';

document.getElementById('nav').addEventListener('click',e=>{

$view.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id, ent=E.find(x=>x.id===id);
  if(act==='more'){ state.limit+=60; render(); return; }
  if(act==='toggle'){ state[b.dataset.k]=!state[b.dataset.k]; render(); return; }
  if(act==='mon'){
    const d=+b.dataset.d;
    if(d===0) state.month=TODAY().slice(0,7);
    else{ const p=state.month.split('-'); const x=new Date(+p[0],+p[1]-1+d,1); state.month=iso(x).slice(0,7); }
    render(); return;
  }
  if(act==='diary'){
    const day=b.dataset.d, t=bDiary(day);
    if(!t){ toast('그날 담긴 것이 없습니다'); return; }
    promptSheet('그날의 일기 · '+fmtD(day,true), t); return;
  }
  if(act==='nday'){ state.noteDay=b.dataset.d; state.limit=60; render(); return; }
  if(act==='nmon'){
    const d=+b.dataset.d;
    if(d===0){ state.noteMonth=TODAY().slice(0,7); state.noteDay=TODAY(); }
    else{
      const p=state.noteMonth.split('-'), x=new Date(+p[0],+p[1]-1+d,1);
      state.noteMonth=iso(x).slice(0,7);
      const days=visible().filter(e=>e.cat==='note'||e.cat==='plan')
        .map(e=>eDate(e)).filter(s=>ym(s)===state.noteMonth).sort();
      state.noteDay=days.length? days[days.length-1] : state.noteMonth+'-01';
    }
    render(); return;
  }
  if(act==='pin'){
    state.pinDate = state.pinDate===b.dataset.d ? null : b.dataset.d;
    render(); preview(); if(state.pinDate) $in.focus();
    return;
  }
  if(act==='bal'){ balanceSheet(); return; }
  if(act==='range'){ state.askRange=b.dataset.k; render(); return; }
  if(act==='build'){ buildAsk(b.dataset.k); return; }
  if(act==='askk'){ buildAsk(b.dataset.k); return; }
  if(act==='askm'){ buildAsk('money', monthRange(state.month)); return; }
  if(act==='rule-del'){ delete RULES[b.dataset.k]; await metaSet('rules',RULES); render(); return; }
  if(act==='exp-json') return expJSON();
  if(act==='exp-md') return expMD();
  if(act==='exp-csv') return expCSV();
  if(act==='imp') return impFile();
  if(act==='arch') return archiveOld();
  if(act==='unarch'){
    const c=E.filter(x=>x.archived); c.forEach(x=>{x.archived=false;touch(x)});
    await put(c); render(); toast(c.length+'개를 되돌렸습니다'); return;
  }
  if(act==='wipe') return wipe();
  if(!ent) return;
  if(act==='done'){
    if(isRt(ent)){
      const t=TODAY(); ent.hist=(ent.hist||[]).slice();
      const i=ent.hist.indexOf(t);
      if(i>=0) ent.hist.splice(i,1); else ent.hist.push(t);
      ent.hist.sort(); ent.done=false; touch(ent); await put(ent); render(); return;
    }
    if(ent.cat==='todo'&&!ent.done) return finishItem(ent);
    ent.done=!ent.done; ent.doneAt=ent.done?Date.now():null; touch(ent);
    await put(ent); render(); return;
  }
  if(act==='fin')  return finishItem(ent);
  if(act==='prog') return progressSheet(ent);
  if(act==='dl'){
    ent.dl=!ent.dl; if(ent.dl) ent.hist=ent.hist||[];
    touch(ent); await put(ent); render();
    toast(ent.dl? (ent.date? '마감으로 삼았습니다':'마감으로 삼았습니다. 마감일을 정해 주세요')
                : '마감을 풀었습니다');
    if(ent.dl&&!ent.date) dateSheet(ent);
    return;
  }
  if(act==='star'){
    ent.star=!ent.star; touch(ent); await put(ent); render();
    toast(ent.star?'위에 고정했습니다':'고정을 풀었습니다'); return;
  }
  if(act==='rt') return routineSheet(ent);
  if(act==='again'){
    const n={...ent,id:uid(),ts:Date.now(),mt:Date.now(),date:TODAY(),done:false,archived:false};
    E.push(n); await put(n); render(); toast(esc(ent.key||'주기')+'을(를) 오늘로 기록했습니다'); return;
  }
  if(act==='del'){
    lastDeleted=ent; E=E.filter(x=>x.id!==id);
    GRAVES[id]=Date.now(); await metaSet('graves',GRAVES);
    await del(id); render();
    toast('지웠습니다','되돌리기',async()=>{
      const r=lastDeleted; delete GRAVES[r.id]; await metaSet('graves',GRAVES);
      touch(r); E.push(r); await put(r); render();
    });
    return;
  }
  if(act==='edit') return editEntry(ent);
  if(act==='date') return dateSheet(ent);
  if(act==='cat')  return catSheet(ent);
});

function editEntry(ent){
  sheet('고쳐 적기', ent.raw, null, async v=>{
    if(v===null) return;
    const t=v.trim(); if(!t) return;
    const p=parse(t);
    // 글에서 새로 읽어내는 것
    ent.raw=t; ent.text=p.text;
    ent.tags=p.tags; ent.people=p.people; ent.url=p.url; ent.page=p.page;
    // 새로 적은 것이 있을 때만 갈아끼운다. 없으면 원래 것을 지킨다.
    if(p.date){ ent.date=p.date; ent.time=p.time; }
    else if(p.time) ent.time=p.time;
    if(p.amount!==null){ ent.amount=p.amount; ent.flow=p.flow; ent.group=p.group; }
    if(p.num!==null){ ent.num=p.num; ent.unit=p.unit; if(p.key) ent.key=p.key; }
    if(p.forced) ent.cat=p.cat;            // /분류 로 지정했을 때만 분류를 옮긴다
    touch(ent); await put(ent); render(); toast('고쳤습니다');
  }, true,
  '분류와 날짜, 마감·루틴·별표는 그대로 둡니다. 새로 적은 날짜나 금액이 있으면 그것만 바뀝니다. '+
  '분류를 옮기려면 왼쪽 기호를 누르거나 앞에 /분류를 붙이세요.');
}
function routineSheet(ent){
  const cur=ent.rt||null;
  let wd = cur&&cur.mode==='wd'? (cur.d||[]).slice() : [];
  const v=document.createElement('div'); v.className='veil';
  v.innerHTML='<div class="sheet"><h3>루틴으로 삼기</h3>'+
    '<p>'+esc(ent.text||ent.raw)+(cur?'<br><span style="font-size:12px;color:var(--ink3)">지금 '+rtLabel(cur)+'</span>':'')+'</p>'+
    '<div class="opts"><button data-m="day">매일</button><button data-m="weekday">평일</button>'+
      '<button data-m="weekend">주말</button></div>'+
    '<div class="wdpick">'+WDN.map((w,i)=>'<button data-w="'+i+'" aria-pressed="'+(wd.indexOf(i)>=0)+'">'+w+'</button>').join('')+'</div>'+
    '<div class="opts"><button data-n="2">이틀마다</button><button data-n="3">사흘마다</button>'+
      '<button data-n="7">이레마다</button></div>'+
    '<div class="opts" style="margin-top:14px"><button data-k="wd">고른 요일로</button>'+
      (cur?'<button data-k="off">루틴 풀기</button>':'')+'<button data-k="">닫기</button></div></div>';
  document.body.appendChild(v);
  const save=async r=>{
    if(r){ ent.rt=r; ent.hist=ent.hist||[]; ent.done=false; ent.doneAt=null; }
    else { delete ent.rt; }
    touch(ent); await put(ent); render();
    toast(r? '루틴 · '+rtLabel(r) : '루틴을 풀었습니다');
  };
  v.addEventListener('click',async ev=>{
    if(ev.target===v){ v.remove(); return; }
    const w=ev.target.closest('[data-w]');
    if(w){ const i=+w.dataset.w, k=wd.indexOf(i);
      if(k>=0) wd.splice(k,1); else wd.push(i);
      w.setAttribute('aria-pressed', wd.indexOf(i)>=0); return; }
    const m=ev.target.closest('[data-m]');
    if(m){ v.remove();
      const mo=m.dataset.m;
      await save(mo==='day'? {mode:'day'} : {mode:'wd', d: mo==='weekday'?[1,2,3,4,5]:[0,6]});
      return; }
    const n=ev.target.closest('[data-n]');
    if(n){ v.remove(); await save({mode:'n', n:+n.dataset.n}); return; }
    const b=ev.target.closest('[data-k]'); if(!b) return;
    const k=b.dataset.k; v.remove();
    if(k==='wd'){ if(!wd.length){ toast('요일을 하나 이상 고르세요'); return; } await save({mode:'wd',d:wd}); }
    else if(k==='off') await save(null);
  });
}
function dateSheet(ent){
  const v=document.createElement('div'); v.className='veil';
  v.innerHTML='<div class="sheet"><h3>날짜 정하기</h3>'+
    '<p>'+esc(ent.text||ent.raw)+'</p>'+
    '<div class="dfield"><input type="date" class="di"><input type="time" class="ti"></div>'+
    '<div class="opts"><button data-q="0">오늘</button><button data-q="1">내일</button>'+
      '<button data-q="2">모레</button><button data-q="7">이레 뒤</button></div>'+
    '<div class="opts" style="margin-top:14px"><button data-k="ok">저장</button>'+
      '<button data-k="clear">날짜 지움</button><button data-k="">닫기</button></div></div>';
  document.body.appendChild(v);
  const di=v.querySelector('.di'), ti=v.querySelector('.ti');
  di.value=ent.date||''; ti.value=ent.time||'';
  if(!di.value){ const d=new Date(); di.value=iso(d); }
  v.addEventListener('click',async ev=>{
    if(ev.target===v){ v.remove(); return; }
    const qb=ev.target.closest('[data-q]');
    if(qb){ const d=new Date(); d.setDate(d.getDate()+ +qb.dataset.q); di.value=iso(d); return; }
    const b=ev.target.closest('[data-k]'); if(!b) return;
    const k=b.dataset.k; v.remove();
    if(k==='ok'){
      ent.date=di.value||null; ent.time=ti.value||null; touch(ent);
      await put(ent); render();
      toast(ent.date? fmtD(ent.date,true)+(ent.time?' '+ent.time:'')+'로 정했습니다' : '날짜를 지웠습니다');
    }else if(k==='clear'){
      ent.date=null; ent.time=null; touch(ent); await put(ent); render(); toast('날짜를 지웠습니다');
    }
  });
}
function catSheet(ent){
  const opts=Object.keys(CATS).map(k=>({k,label:CATS[k].mk+' '+CATS[k].name}));
  sheet('어디로 담을까요', ent.text||ent.raw, opts, async k=>{
    if(!k||k===ent.cat) return;
    ent.cat=k;
    if(k==='cycle'&&!ent.key) ent.key=cycleKey(ent.text)||tokens(ent.text)[0]||'주기';
    if(k==='rec'&&!ent.key) ent.key=tokens(ent.text)[0]||'기록';
    if(k==='money'&&ent.amount===null){ const m=parseMoney(ent.text); if(m) Object.assign(ent,m); }
    touch(ent); await put(ent);
    const tk=tokens(ent.text)[0];
    if(tk){ RULES[tk]=k; await metaSet('rules',RULES); }
    render(); toast(CATS[k].name+'으로 옮겼습니다'+(tk?' · “'+tk+'”를 익혔습니다':''));
  });
}
function sheet(title,body,opts,cb,isInput,hint){
  const v=document.createElement('div'); v.className='veil';
  v.innerHTML='<div class="sheet'+(isInput?' wide':'')+'"><h3>'+esc(title)+'</h3>'+
    (isInput? '<p>'+esc(hint||'새로 적은 날짜나 금액이 있으면 그것만 바뀝니다.')+'</p><textarea class="etext" spellcheck="false"></textarea>'
            : '<p>'+esc(body)+'</p>')+
    '<div class="opts" style="margin-top:12px">'+
      (opts? opts.map(o=>'<button data-k="'+o.k+'">'+esc(o.label)+'</button>').join('')
           : '<button data-k="ok">저장</button>')+
      '<button data-k="">닫기</button></div></div>';
  document.body.appendChild(v);
  const ta=v.querySelector('.etext');
  if(ta){
    ta.value=body||'';
    const grow=()=>{ ta.style.height='auto';
      ta.style.height=Math.min(ta.scrollHeight+2, Math.round(window.innerHeight*0.48))+'px'; };
    ta.addEventListener('input',grow); grow();
    ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);
  }
  v.addEventListener('click',ev=>{
    if(ev.target===v){v.remove();return;}
    const b=ev.target.closest('[data-k]'); if(!b) return;
    const k=b.dataset.k; v.remove();
    if(isInput) cb(k==='ok'? ta.value : null); else cb(k);
  });
}
function toast(msg,label,cb){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast';
  t.innerHTML='<span>'+esc(msg)+'</span>'+(label?'<button>'+esc(label)+'</button>':'');
  document.body.appendChild(t);
  if(label) t.querySelector('button').onclick=()=>{t.remove();cb()};
  setTimeout(()=>t.remove(),label?6000:2600);
}

/* ═══════════════ 11. 들이고 내보내기 ═══════════════ */
function download(name,text,type,noStamp){
  const b=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  if(!noStamp) metaSet('lastExport',TODAY());
}
function pruneGraves(){
  const cut=Date.now()-365*86400000;
  Object.keys(GRAVES).forEach(id=>{ if(GRAVES[id]<cut) delete GRAVES[id]; });
}
function expJSON(){
  pruneGraves();
  download('체_'+TODAY()+'.json',
    JSON.stringify({app:'che',v:2,exported:new Date().toISOString(),
      rules:RULES, balance:META.balance||null, graves:GRAVES, entries:E},null,1),
    'application/json');
  toast('한 벌 내보냈습니다');
}
function expMD(){
  let s='# 체 — '+TODAY()+'\n';
  Object.keys(CATS).forEach(c=>{
    const arr=E.filter(e=>e.cat===c).sort((a,b)=>a.ts-b.ts);
    if(!arr.length) return;
    s+='\n## '+CATS[c].name+' ('+arr.length+')\n\n';
    arr.forEach(e=>{
      const d=e.date||iso(new Date(e.ts));
      s+='- '+(c==='todo'?(e.done?'[x] ':'[ ] '):'')+d+' · '+e.raw+'\n';
    });
  });
  download('체_'+TODAY()+'.md',s,'text/markdown;charset=utf-8');
  toast('마크다운으로 내보냈습니다');
}
function expCSV(){
  const rows=[['날짜','구분','갈래','금액','내용']];
  E.filter(e=>e.cat==='money').sort((a,b)=>a.ts-b.ts).forEach(e=>{
    rows.push([e.date||iso(new Date(e.ts)), e.flow==='in'?'수입':'지출', e.group||'', e.amount, e.raw]);
  });
  const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  download('체_금전_'+TODAY()+'.csv',csv,'text/csv;charset=utf-8');
  toast('CSV로 내보냈습니다');
}
async function mergeIn(d){
  const inc = Array.isArray(d)? d : (d.entries||[]);
  const incG = (d && d.graves) || {};
  const cur = new Map(E.map(e=>[e.id,e]));
  const add=[], upd=[], gone=[];

  inc.forEach(e=>{
    if(!e||!e.id) return;
    const ig=incG[e.id];        if(ig && ig>=MT(e)) return;   // 저쪽에서 나중에 지운 것
    const mg=GRAVES[e.id];      if(mg && mg>=MT(e)) return;   // 이쪽에서 나중에 지운 것
    const me=cur.get(e.id);
    if(!me) add.push(e);
    else if(MT(e)>MT(me)) upd.push(e);
  });

  Object.keys(incG).forEach(id=>{
    const t=incG[id];
    if(!GRAVES[id]||GRAVES[id]<t) GRAVES[id]=t;
    const me=cur.get(id);
    if(me && MT(me)<=t) gone.push(id);          // 지운 뒤로 손대지 않았으면 지움
  });

  const write=add.concat(upd);
  if(write.length){
    const m=new Map(E.map(e=>[e.id,e]));
    write.forEach(e=>m.set(e.id,e));
    E=[...m.values()];
    await put(write);
  }
  if(gone.length){
    const g=new Set(gone);
    E=E.filter(e=>!g.has(e.id));
    await del(gone);
  }
  pruneGraves(); await metaSet('graves',GRAVES);
  return {add:add.length, upd:upd.length, gone:gone.length,
          same:inc.length-add.length-upd.length};
}
function impFile(){
  const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json';
  i.onchange=async()=>{
    const f=i.files[0]; if(!f) return;
    try{
      const d=JSON.parse(await f.text());
      if(d.rules){ RULES={...d.rules,...RULES}; await metaSet('rules',RULES); }
      if(d.balance && (!META.balance || (d.balance.ts||0)>(META.balance.ts||0)))
        await metaSet('balance',d.balance);
      const r=await mergeIn(d);
      render();
      toast('새로 '+r.add+' · 고쳐 맞춘 것 '+r.upd+' · 지움 반영 '+r.gone+' · 그대로 '+Math.max(0,r.same));
    }catch(err){ toast('파일을 읽지 못했습니다. JSON인지 확인하세요'); }
  };
  i.click();
}
async function archiveOld(){
  const cut=Date.now()-365*86400000;
  const c=E.filter(e=>!e.archived&&e.ts<cut&&!(e.cat==='todo'&&!e.done));
  c.forEach(e=>{e.archived=true;touch(e)});
  await put(c); render(); toast(c.length+'개를 보관했습니다');
}
function wipe(){
  sheet('전부 지울까요','담긴 '+E.length+'개가 모두 사라집니다. 되돌릴 수 없습니다.',
    [{k:'yes',label:'네, 지웁니다'}], async k=>{
      if(k!=='yes') return;
      await clearAll(); E=[]; RULES={}; META={}; GRAVES={}; render(); toast('모두 지웠습니다');
    });
}

/* ═══════════════ 12. 시작 ═══════════════ */
(async function(){
  try{
    await openDB(); await metaLoad();
    RULES=META.rules||{}; GRAVES=META.graves||{};
    E=await loadAll();
  }catch(err){
    document.getElementById('view').innerHTML=
      '<div class="empty">저장소를 열지 못했습니다. 시크릿 창이나 저장이 막힌 환경이 아닌지 확인해 주세요.</div>';
    return;
  }
  render(); preview(); autosize(); fitBar();
  setTimeout(()=>{ if(window.innerWidth>640) $in.focus(); },100);
})();
</script>
