<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세팅 — 새 작품을 쓰기 전에</title>
<style>
/* 세팅 — 새 작품을 쓰기 전에 차례대로 확인하며 세팅하는 앱 (2026년 11월 24일)
   기준 문서는 writerKYS/글쓰기_세팅.md. 차례가 바뀌면 둘을 함께 고친다.
   이 앱은 아무것도 만들지 않는다. 할 일을 차례로 보여 주고, 했다고 누른 것을 이 브라우저에 기억할 뿐이다.
   폴더를 만드는 일은 클로드 코드(또는 터미널)가 하고, 이 앱은 거기에 붙여 넣을 말을 만들어 준다.
   저장: localStorage "seting.v1" = {cur, works:[{id, name, folder, tag, done:{s1..s7, s7b, s8}, chk:{c1, c2, c2b, c3..c6}, at,
     end:{mode:"fin"|"del", chk:{e…}} — 끝낼 때·지울 때(2026년 11월 25일)}]}
   다른 앱의 저장소는 읽지도 쓰지도 않는다. */
:root{
  --hanji:#efe9dc; --jong:#f8f4ea; --meok:#23201c; --meok-2:#6b6259; --meok-3:#9a9186;
  --seon:#d8cfbf; --inju:#b23a2b; --inju-soft:#f3dcd5; --sol:#2f6b57; --sol-soft:#dcebe3;
  --ui:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --body:"Gowun Batang","Nanum Myeongjo","AppleMyungjo",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--hanji)}
body{font-family:var(--ui);color:var(--meok);line-height:1.6;word-break:keep-all;
  max-width:760px;margin:0 auto;padding:28px 20px 80px;font-size:16px}
button,input{font:inherit;color:inherit}
h1{font-family:var(--body);font-size:1.9rem;letter-spacing:-.01em;line-height:1.2}
.sub{color:var(--meok-2);font-size:.92rem;margin-top:4px}
header{border-bottom:2px solid var(--meok);padding-bottom:14px;margin-bottom:18px}

/* 작품 고르기 */
.works{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.works button{border:1.5px solid var(--seon);background:transparent;border-radius:999px;padding:5px 14px;cursor:pointer;font-size:.9rem}
.works button.on{background:var(--meok);color:var(--hanji);border-color:var(--meok)}
.works button.fin::after{content:" ✓";color:var(--sol)}
.works button.on.fin::after{color:#bfe3d2}
.works button.add{border-style:dashed;color:var(--meok-2)}

/* 세 갈래 */
details.gal{background:var(--jong);border:1.5px solid var(--seon);border-radius:12px;margin-bottom:18px}
details.gal summary{cursor:pointer;padding:11px 16px;font-weight:700;list-style:none}
details.gal summary::-webkit-details-marker{display:none}
details.gal summary::after{content:"펼치기";float:right;font-weight:400;font-size:.82rem;color:var(--meok-3)}
details.gal[open] summary::after{content:"접기"}
.gal .in{padding:0 16px 14px}
.gal table{width:100%;border-collapse:collapse;font-size:.92rem}
.gal td{padding:7px 8px 7px 0;border-top:1px solid var(--seon);vertical-align:top}
.gal td:first-child{white-space:nowrap;font-weight:700}
.gal td:nth-child(2){white-space:nowrap;color:var(--inju);font-weight:700}
.gal p{font-size:.88rem;color:var(--meok-2);margin-top:8px}

/* 이름 셋 */
.names{background:var(--jong);border:1.5px solid var(--seon);border-radius:12px;padding:16px;margin-bottom:18px}
.names h2{font-size:1rem;margin-bottom:10px}
.names .row{display:grid;grid-template-columns:7.2em 1fr;gap:10px;align-items:center;margin-top:8px}
.names label{font-weight:700;font-size:.92rem}
.names input{width:100%;border:1.5px solid var(--seon);border-radius:8px;padding:8px 10px;background:#fff}
.names input:focus{outline:2px solid var(--meok);outline-offset:1px}
.names small{grid-column:2;color:var(--meok-3);font-size:.8rem;margin-top:-4px}
.names small.bad{color:var(--inju)}
.names .act{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;align-items:center}

/* 진척 */
.prog{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.prog .bar{flex:1;height:8px;background:var(--seon);border-radius:99px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--sol);border-radius:99px;transition:width .25s}
.prog b{font-size:.9rem;white-space:nowrap}

/* 단계 */
.step{background:var(--jong);border:1.5px solid var(--seon);border-radius:12px;margin-bottom:10px;overflow:hidden}
.step .head{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left}
.step .n{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--meok-3);color:var(--meok-2);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem}
.step .t{flex:1;font-weight:700}
.step .st{font-size:.8rem;color:var(--meok-3);white-space:nowrap}
.step.now{border-color:var(--meok);box-shadow:0 2px 0 var(--meok)}
.step.now .n{border-color:var(--inju);background:var(--inju);color:#fff}
.step.now .st{color:var(--inju);font-weight:700}
.step.done .n{border-color:var(--sol);background:var(--sol);color:#fff}
.step.done .t{color:var(--meok-2)}
.step.done .st{color:var(--sol)}
.step.lock{opacity:.55}
.step .body{padding:2px 16px 16px 58px;display:none}
.step.open .body{display:block}
.step ol{padding-left:1.25em}
.step ol li{margin-top:5px}
.step p{margin-top:8px}
.step .note{font-size:.88rem;color:var(--meok-2)}
.step .ok{margin-top:12px;background:var(--sol-soft);border-radius:8px;padding:9px 12px;font-size:.92rem}
.step .ok b{color:var(--sol)}
.step .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;align-items:center}
.step .foot span{font-size:.82rem;color:var(--meok-3);margin-right:auto}
kbd,.mono{font-family:"SF Mono",Menlo,monospace;font-size:.86em;background:#fff;border:1px solid var(--seon);border-radius:5px;padding:1px 6px;word-break:break-all}
.menu{font-weight:700}
.menu small{font-weight:400;color:var(--meok-3)}

/* 베껴 쓰는 칸 */
.copy{margin-top:10px;border:1.5px solid var(--meok);border-radius:10px;background:#fff;overflow:hidden}
.copy .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 6px 6px 12px;background:var(--meok);color:var(--hanji);font-size:.82rem}
.copy .cap button{border:0;background:var(--hanji);color:var(--meok);border-radius:6px;padding:3px 12px;cursor:pointer;font-weight:700;font-size:.82rem}
.copy pre{padding:10px 12px;white-space:pre-wrap;word-break:break-word;font-family:var(--ui);font-size:.92rem;line-height:1.55}
.copy pre.code{font-family:"SF Mono",Menlo,monospace;font-size:.82rem}
.how{margin-top:12px;border-left:3px solid var(--inju);padding-left:12px}
.how h4{font-size:.92rem;color:var(--inju)}
details.hand{margin-top:12px;font-size:.92rem}
details.hand summary{cursor:pointer;color:var(--meok-2)}

.btn{border:1.5px solid var(--meok);background:var(--meok);color:var(--hanji);border-radius:8px;padding:7px 18px;cursor:pointer;font-weight:700}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--meok)}
.btn.soft{border-color:var(--seon);background:transparent;color:var(--meok-2);font-weight:400;font-size:.88rem;padding:5px 12px}
a.go{display:inline-block;margin-top:8px;border:1.5px solid var(--meok);border-radius:8px;padding:5px 14px;text-decoration:none;color:var(--meok);font-weight:700;font-size:.92rem}
a.go::after{content:" ↗"}

/* 마지막 확인 */
.final{background:var(--jong);border:1.5px solid var(--seon);border-radius:12px;padding:16px;margin-top:18px}
.final.lock{opacity:.55}
.final h2{font-size:1.05rem}
.final h3{font-size:.9rem;color:var(--inju);margin-top:14px}
.final label{display:flex;gap:10px;align-items:flex-start;margin-top:8px;cursor:pointer}
.final input{margin-top:5px;width:17px;height:17px;accent-color:var(--sol);flex:none}
.final .say{display:inline-flex;gap:6px;align-items:center}
.final .say button{border:1px solid var(--seon);background:#fff;border-radius:6px;padding:0 8px;font-size:.78rem;cursor:pointer}
.finbox{margin-top:16px;background:var(--sol);color:#fff;border-radius:12px;padding:16px;text-align:center}
.finbox b{font-family:var(--body);font-size:1.25rem;display:block}
.end{display:flex;justify-content:space-between;margin-top:22px;font-size:.85rem;color:var(--meok-3)}
.end button{border:0;background:transparent;color:var(--meok-3);text-decoration:underline;cursor:pointer}

/* 끝낼 때 · 지울 때 — 세팅을 거꾸로 */
details.close{background:var(--jong);border:1.5px solid var(--seon);border-radius:12px;margin-top:18px}
details.close summary{cursor:pointer;padding:12px 16px;font-weight:700;list-style:none}
details.close summary::-webkit-details-marker{display:none}
details.close summary::after{content:"펼치기";float:right;font-weight:400;font-size:.82rem;color:var(--meok-3)}
details.close[open] summary::after{content:"접기"}
.close .in{padding:0 16px 16px}
.close .lead{font-size:.9rem;color:var(--meok-2)}
.close .modes{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.close .modes button{flex:1;min-width:12em;border:1.5px solid var(--seon);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left}
.close .modes button b{display:block}
.close .modes button small{color:var(--meok-3);font-size:.8rem}
.close .modes button.on{border-color:var(--meok);box-shadow:0 2px 0 var(--meok)}
.close .modes button.on.del{border-color:var(--inju);box-shadow:0 2px 0 var(--inju)}
.close h3{font-size:.9rem;color:var(--inju);margin-top:14px}
.close label{display:flex;gap:10px;align-items:flex-start;margin-top:10px;cursor:pointer}
.close label input{margin-top:5px;width:17px;height:17px;accent-color:var(--sol);flex:none}
.close label .where{font-weight:700}
.close label .note{display:block;font-size:.86rem;color:var(--meok-2)}
.close .copy{margin-left:27px}
.close .warn{margin-top:12px;background:var(--inju-soft);border-radius:8px;padding:9px 12px;font-size:.9rem}
.closed{margin-top:14px;border-radius:10px;padding:12px 14px;background:var(--meok);color:var(--hanji);font-size:.92rem}
.closed b{font-family:var(--body);font-size:1.1rem;display:block}
.works button[data-end]::after{content:" · " attr(data-end);color:var(--meok-3);font-size:.8em}
.works button.on[data-end]::after{color:#cfc6b8}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--meok);color:var(--hanji);
  padding:9px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (max-width:520px){ .step .body{padding-left:16px} .names .row{grid-template-columns:1fr} .names small{grid-column:1} }
</style>
</head>
<body>

<header>
  <h1>세팅</h1>
  <p class="sub">새 작품을 쓰기 전에. 위에서부터 하나씩 하고, 됐으면 누른다.</p>
</header>

<div id="app"></div>
<div id="toast"></div>

<script>
"use strict";
var KEY = "seting.v1";
var S = load();
var openId = null;      // 펼쳐 본 단계(지금 단계 말고)
var editing = false;    // 이름 셋을 고치는 중

function load(){
  try{ var v = JSON.parse(localStorage.getItem(KEY)); if(v && Array.isArray(v.works)) return v; }catch(e){}
  return {cur:null, works:[]};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function cur(){ for(var i=0;i<S.works.length;i++) if(S.works[i].id===S.cur) return S.works[i]; return null; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function toast(t){ var el=document.getElementById("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(function(){ el.classList.remove("on"); }, 1800); }
function copyText(t){
  function fb(){ var a=document.createElement("textarea"); a.value=t; a.style.position="fixed"; a.style.opacity="0"; document.body.appendChild(a); a.select(); try{document.execCommand("copy");}catch(e){} a.remove(); }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(fb); else fb();
  toast("복사했습니다");
}
/* 올려 둔 곳(깃허브 페이지)에서는 옆의 앱을, 파일로 열었을 때는 올려 둔 주소의 앱을 연다 */
function appUrl(f){ return (/^https?:$/.test(location.protocol) && location.hostname!=="localhost" ? "./" : "https://writerkys-cell.github.io/apps/") + f; }

/* ---- 붙여 넣을 말들 ---- */
function claudeSay(w){
  return "새 작품 폴더를 만들어 줘.\n"
    + "- 폴더 이름: " + w.folder + "\n"
    + "- 작품 이름: " + w.name + "\n"
    + "- 꼬리표: " + w.tag + "\n"
    + "- 스크리브너 원본: Dropbox/Apps/Scrivener/" + w.folder + ".scriv\n\n"
    + "글쓰기_세팅.md의 2번과 5번대로 해 줘. "
    + "writerKYS/" + w.folder + "/ 안에 도구 · 자료 · 메모 · 정리 · 스크리브너동기화 폴더 다섯을 만들고, "
    + "suwon/도구의 분량세기.py와 rtf_덧붙이기.py를 " + w.folder + "/도구로 복사하고, "
    + "README.md의 작품 표에 이 작품을 한 줄 더해 줘. "
    + "같은 이름의 폴더가 이미 있으면 덮어쓰지 말고 알려 줘. 끝나면 작업일지에 적어 줘.";
}
function handCmd(w){
  return "cd ~/writerKYS && mkdir -p " + w.folder + "/{도구,자료,메모,정리,스크리브너동기화} && cp -n suwon/도구/분량세기.py suwon/도구/rtf_덧붙이기.py " + w.folder + "/도구/";
}
function readmeRow(w){ return "  | `" + w.folder + "/` | " + w.name + " | " + w.tag + " | `" + w.folder + ".scriv` |"; }
function copyBox(cap, text, code){
  return '<div class="copy"><div class="cap"><span>' + esc(cap) + '</span><button type="button" data-copy="' + esc(text) + '">복사</button></div><pre' + (code?' class="code"':'') + '>' + esc(text) + '</pre></div>';
}
function menu(ko, en){ return '<span class="menu">' + ko + ' <small>(' + en + ')</small></span>'; }

/* ---- 차례 아홉 (2026년 11월 25일에 오전타이핑 단축어 확인 s7b를 더함 — 저장된 열쇠가 어긋나지 않게 뒤의 id는 그대로 둔다.
   같은 날 오후 쓰기를 4baek에서 타이핑으로 옮김: s7·s7b·s8과 c1·c2의 글만 바꾸고 id는 그대로) ---- */
var STEPS = [
  { id:"s1", t:"스크리브너에서 새 프로젝트를 드롭박스에 만든다",
    body:function(w){ return '<ol>'
      + '<li>스크리브너를 연다.</li>'
      + '<li>' + menu("파일 → 새 프로젝트","File → New Project") + '를 고른다.</li>'
      + '<li>서식은 ' + menu("빈 서식","Blank") + '을 고른다.</li>'
      + '<li>저장할 곳을 <b>Dropbox → Apps → Scrivener</b>로 고른다.</li>'
      + '<li>이름을 <kbd>' + esc(w.folder) + '</kbd>로 적고 만든다.</li>'
      + '<li>바인더의 원고(Draft) 폴더 안에 <b>첫 문서를 하나 만들고 이름을 붙인다</b>(예: 1). 7번에서 타이핑에 연결할 원고다.</li>'
      + '</ol>'
      + '<p class="note">두 기기에서 같은 프로젝트를 동시에 열지 않는다. 한쪽에서 닫고 드롭박스가 다 올린 뒤에 다른 쪽에서 연다.</p>'; },
    ok:function(w){ return '파인더의 <span class="mono">Dropbox/Apps/Scrivener/</span>에 <span class="mono">' + esc(w.folder) + '.scriv</span>가 보인다.'; } },

  { id:"s2", t:"writerKYS에 작품 폴더를 만든다 — 클로드에게 시킨다",
    body:function(w){ return '<p>이 단계는 클로드가 한다. <b>writerKYS 폴더를 연 세션</b>이어야 한다. 다른 폴더에서 열면 규칙(README)을 모른다.</p>'
      + '<div class="how"><h4>① 맥의 Claude 앱에서 writerKYS를 연다</h4>'
      + '<ol><li>맥의 Claude 앱을 열고 <b>Code</b> 탭으로 간다.</li>'
      + '<li>새 세션을 만들고, 폴더를 <b>writerKYS</b>로 고른다.</li></ol>'
      + '<p class="note">터미널은 열지 않아도 된다.</p></div>'
      + '<div class="how"><h4>② 클로드에게 이렇게 말한다</h4>'
      + copyBox("클로드에게 붙여 넣기", claudeSay(w)) + '</div>'
      + '<p class="note">이 말에는 5번(README에 한 줄)도 들어 있다. 클로드가 폴더를 만들었다고 답하면 다음으로 간다.</p>'
      + '<details class="hand"><summary>터미널을 쓰는 다른 길 (하지 않아도 된다)</summary>'
      + '<p><b>터미널에서 클로드 코드를 열려면</b> 아래를 붙여 넣는다. 그 뒤에 ②의 말을 똑같이 붙여 넣는다.</p>'
      + copyBox("터미널에 붙여 넣기", "cd ~/writerKYS && claude", true)
      + '<p style="margin-top:14px"><b>클로드 없이 손으로 하려면</b> 터미널에 아래를 붙여 넣는다. 폴더 다섯을 만들고 도구 둘을 복사한다(이미 있는 파일은 덮어쓰지 않는다). README는 5번에서 손으로 적는다.</p>'
      + copyBox("터미널에 붙여 넣기", handCmd(w), true) + '</details>'; },
    ok:function(w){ return '<span class="mono">writerKYS/' + esc(w.folder) + '/</span> 안에 <b>도구 · 자료 · 메모 · 정리 · 스크리브너동기화</b>가 있고, <b>도구</b> 안에 분량세기.py와 rtf_덧붙이기.py가 있다.'; } },

  { id:"s3", t:"스크리브너에서 동기화를 켠다",
    body:function(w){ return '<p>폴더를 만든 것만으로는 아무 일도 일어나지 않는다. 스크리브너에 그 폴더를 알려 준다.</p><ol>'
      + '<li>스크리브너에서 <kbd>' + esc(w.folder) + '</kbd> 프로젝트를 연다.</li>'
      + '<li>' + menu("파일 → 동기화 → 외부 폴더와","File → Sync → with External Folder…") + '를 고른다.</li>'
      + '<li>폴더 고르기에서 아래 폴더를 고른다.' + copyBox("고를 폴더", "~/writerKYS/" + w.folder + "/스크리브너동기화", true) + '</li>'
      + '<li>원고(Draft) 폴더를 동기화하는 칸이 켜져 있는지 본다.</li>'
      + '<li>내보내는 형식을 ' + menu("일반 텍스트","Plain text, .txt") + '로 고른다.</li>'

  var d = doneCount(w), ni = nowIdx(w);
  h += '<div class="names"><h2>' + esc(w.name) + '</h2>'
    + '<p class="note" style="font-size:.9rem;color:var(--meok-2)">폴더 <span class="mono">' + esc(w.folder) + '</span> · 꼬리표 <b>' + esc(w.tag) + '</b> · 스크리브너 <span class="mono">' + esc(w.folder) + '.scriv</span></p>'
    + '<div class="act"><button type="button" class="btn soft" data-edit="1">이름 고치기</button></div></div>';
  h += '<div class="prog"><b>' + d + ' / ' + STEPS.length + '</b><div class="bar"><i style="width:' + (d/STEPS.length*100) + '%"></i></div></div>';

  STEPS.forEach(function(s, i){
    var isDone = !!w.done[s.id], isNow = i===ni, lock = i>ni;
    var open = (openId===s.id) || (isNow && openId===null);
    h += '<section class="step ' + (isDone?'done ':'') + (isNow?'now ':'') + (lock?'lock ':'') + (open?'open':'') + '">'
      + '<button type="button" class="head" data-open="' + s.id + '"><span class="n">' + (isDone?'✓':(i+1)) + '</span><span class="t">' + esc(s.t) + '</span>'
      + '<span class="st">' + (isDone?'했다':(isNow?'지금 할 일':'앞 단계 먼저')) + '</span></button>'
      + '<div class="body">' + s.body(w)
      + '<div class="ok"><b>된 것</b> — ' + s.ok(w) + '</div>'
      + '<div class="foot">'
      + (isDone ? '<span>잘못 눌렀으면 되돌린다. 뒤의 단계도 함께 풀린다.</span><button type="button" class="btn soft" data-undo="' + s.id + '">되돌리기</button>'
                : (lock ? '<span>앞 단계를 먼저 끝내야 누를 수 있다.</span><button type="button" class="btn" disabled>됐다</button>'
                        : '<span>위의 \'된 것\'을 눈으로 본 뒤에 누른다.</span><button type="button" class="btn" data-done="' + s.id + '">됐다 — 다음으로</button>'))
      + '</div></div></section>';
  });

  var allSteps = d===STEPS.length;
  h += '<section class="final' + (allSteps?'':' lock') + '"><h2>다 되었는지 — 세 갈래를 하나씩 지나가 본다</h2>'
    + (allSteps?'':'<p class="note" style="font-size:.88rem;color:var(--meok-2)">모든 단계를 마친 뒤에 확인한다.</p>');
  CHECKS.forEach(function(g){
    h += '<h3>' + esc(g.h) + '</h3>';
    g.items.forEach(function(c){
      h += '<label><input type="checkbox" data-chk="' + c.id + '"' + (w.chk[c.id]?' checked':'') + (allSteps?'':' disabled') + '><span>' + c.t(w)
        + (c.say ? '<br><span class="say"><span class="mono">' + esc(c.say(w)) + '</span><button type="button" data-copy="' + esc(c.say(w)) + '">복사</button></span>' : '')
        + '</span></label>';
    });
  });
  h += '</section>';
  if(finished(w)) h += '<div class="finbox"><b>' + esc(w.name) + ', 쓸 수 있다.</b>내일 오전, 방점의 카드에 이 일이 뜬다.</div>';
  h += closeHtml(w);
  h += '<div class="end"><span>기준 문서: writerKYS/글쓰기_세팅.md</span><button type="button" data-del="1">이 작품의 세팅 기록 지우기</button></div>';
  document.getElementById("app").innerHTML = h;
}

function closeHtml(w){
  var m = w.end && ENDS[w.end.mode] ? w.end.mode : null, h = '';
  h += '<details class="close"' + (m?' open':'') + '><summary>이 작품을 끝내거나 지울 때 — 세팅을 거꾸로</summary><div class="in">'
    + '<p class="lead">헷갈리면 <b>끝냈다</b>를 고른다. 목록에서 빠지는 것은 같고, 기록이 남고 되돌릴 수 있다. 지우기는 다시 볼 일이 없을 때만.</p>'
    + '<div class="modes">';
  ["fin","del"].forEach(function(k){ var e = ENDS[k];
    h += '<button type="button" data-endmode="' + k + '" class="' + (m===k?'on ':'') + k + '"><b>' + e.label + '</b><small>' + e.sub + '</small></button>'; });
  h += '</div>';
  if(m){
    var e = ENDS[m];
    h += '<h3>차례대로 — 한 것에 표시한다</h3>';
    e.items.forEach(function(c, i){
      h += '<label><input type="checkbox" data-endchk="' + c.id + '"' + (w.end.chk[c.id]?' checked':'') + '><span>' + (i+1) + '. ' + c.t(w) + '</span></label>';
      if(c.say) h += copyBox("클로드에게 붙여 넣기", c.say(w));
    });
    h += '<p class="note" style="margin-top:12px;font-size:.86rem;color:var(--meok-2)">' + e.keep + '</p>';
    if(m==="del") h += '<div class="warn">이 앱은 아무것도 지우지 않는다. 위의 일은 각 앱에서 직접 한다.</div>';
    if(endDone(w)) h += '<div class="closed"><b>' + esc(w.name) + ', ' + (m==="fin"?'끝냈다.':'접었다.') + '</b>'
      + (m==="fin" ? '위의 작품 단추에 \'끝\'이 붙는다. 개정하게 되면 표시를 풀고 타이핑에서 \'개정 시작\'.' : '이 앱의 기록도 지우려면 아래의 \'이 작품의 세팅 기록 지우기\'.') + '</div>';
  }
  return h + '</div></details>';
}

function namesForm(w){
  var v = w || {name:"", folder:"", tag:""};
  return '<form class="names" id="names"><h2>' + (w?'이름 고치기':'시작하기 전에 정할 것 셋') + '</h2>'
    + '<div class="row"><label for="fName">작품 이름</label><input id="fName" value="' + esc(v.name) + '" placeholder="예: 보보담 수원" autocomplete="off"><small>타이핑의 작품 이름과 방점의 할 일에 쓰인다.</small></div>'
    + '<div class="row"><label for="fFolder">폴더 이름</label><input id="fFolder" value="' + esc(v.folder) + '" placeholder="예: suwon" autocomplete="off" spellcheck="false"><small id="fFolderNote">짧은 영문. writerKYS의 폴더와 스크리브너 파일의 이름이 된다.</small></div>'
    + '<div class="row"><label for="fTag">꼬리표 이름</label><input id="fTag" value="' + esc(v.tag) + '" placeholder="비우면 작품 이름과 같게" autocomplete="off"><small>메모함에서 메모에 붙이는 이름.</small></div>'
    + '<div class="act">' + ((w || S.works.length)?'<button type="button" class="btn ghost" data-cancel="1">그만두기</button>':'') + '<button class="btn">' + (w?'고치기':'이 이름으로 시작') + '</button></div></form>';
}

/* ---- 누르기 ---- */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-endmode],[data-copy],[data-work],[data-new],[data-edit],[data-cancel],[data-open],[data-done],[data-undo],[data-del]");
  if(!t) return;
  var w = cur();
  if(t.dataset.endmode){ var k = t.dataset.endmode;
    if(w.end && w.end.mode === k){ if(Object.keys(w.end.chk).length && !confirm("표시한 것을 모두 풀고 고르기 전으로 돌아갑니다.")) return; delete w.end; }
    else { if(w.end && Object.keys(w.end.chk).length && !confirm("'" + ENDS[w.end.mode].label + "'에 표시한 것을 풀고 '" + ENDS[k].label + "'로 바꿉니다.")) return; w.end = {mode:k, chk:{}}; }
    save(); render(); return; }
  if(t.dataset.copy !== undefined){ e.preventDefault(); copyText(t.dataset.copy); return; }
  if(t.dataset.work){ S.cur = t.dataset.work; editing = false; openId = null; save(); render(); return; }
  if(t.dataset.new){ editing = {id:null}; render(); document.getElementById("fName").focus(); return; }
  if(t.dataset.edit){ editing = {id:w.id}; render(); return; }
  if(t.dataset.cancel){ editing = false; render(); return; }
  if(t.dataset.open){ var id=t.dataset.open, ni=nowIdx(w), isNow = STEPS[ni] && STEPS[ni].id===id;
    var shown = (openId===id) || (isNow && openId===null);
    openId = shown ? "none" : id; render(); return; }
  if(t.dataset.done){ w.done[t.dataset.done] = Date.now(); openId = null; save(); render();
    var nx = document.querySelector(".step.now"); if(nx) nx.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if(t.dataset.undo){ var k = STEPS.map(function(s){return s.id;}).indexOf(t.dataset.undo);
    for(var i=k;i<STEPS.length;i++) delete w.done[STEPS[i].id];
    openId = null; save(); render(); return; }
  if(t.dataset.del){ if(!confirm("'" + w.name + "'의 세팅 기록을 지웁니다.\n이 앱의 표시만 지워지고, 만든 폴더나 스크리브너 파일은 그대로입니다.")) return;
    S.works = S.works.filter(function(x){ return x.id!==w.id; }); S.cur = S.works.length ? S.works[S.works.length-1].id : null; openId = null; save(); render(); return; }
});
document.addEventListener("change", function(e){
  var ec = e.target.closest("[data-endchk]");
  if(ec){ var we = cur(); if(ec.checked) we.end.chk[ec.dataset.endchk] = Date.now(); else delete we.end.chk[ec.dataset.endchk]; save(); render(); return; }
  var c = e.target.closest("[data-chk]"); if(!c) return;
  var w = cur(); if(c.checked) w.chk[c.dataset.chk] = Date.now(); else delete w.chk[c.dataset.chk];
  save(); render();
});
document.addEventListener("input", function(e){
  if(e.target.id !== "fFolder") return;
  var n = document.getElementById("fFolderNote"), v = e.target.value.trim();
  var bad = v && !/^[A-Za-z0-9][A-Za-z0-9_-]*$/.test(v);
  n.textContent = bad ? "영문·숫자·-·_ 만 쓴다. 띄어쓰기와 한글은 안 된다." : "짧은 영문. writerKYS의 폴더와 스크리브너 파일의 이름이 된다.";
  n.classList.toggle("bad", !!bad);
});
document.addEventListener("submit", function(e){
  if(e.target.id !== "names") return; e.preventDefault();
  var name = document.getElementById("fName").value.trim(), folder = document.getElementById("fFolder").value.trim(), tag = document.getElementById("fTag").value.trim() || name;
  if(!name){ document.getElementById("fName").focus(); toast("작품 이름을 적어 주세요"); return; }
  if(!/^[A-Za-z0-9][A-Za-z0-9_-]*$/.test(folder)){ document.getElementById("fFolder").focus(); toast("폴더 이름은 영문·숫자·-·_ 로 적어 주세요"); return; }
  var same = S.works.filter(function(x){ return x.folder.toLowerCase()===folder.toLowerCase() && !(editing && editing.id===x.id); })[0];
  if(same){ toast("'" + same.name + "'이 이미 그 폴더 이름을 씁니다"); return; }
  if(editing && editing.id){ var w = cur(); w.name = name; w.folder = folder; w.tag = tag; }
  else { var nw = {id:"w" + Date.now().toString(36), name:name, folder:folder, tag:tag, done:{}, chk:{}, at:Date.now()}; S.works.push(nw); S.cur = nw.id; }
  editing = false; openId = null; save(); render();
});
window.addEventListener("storage", function(e){ if(e.key===KEY){ S = load(); render(); } });

render();
</script>
</body>
</html>
