<style>
:root{
  --paper:#F7F5F0; --paper-2:#EFECE4; --paper-3:#E5E1D6;
  --ink:#1C1E22; --ink-2:#4A4E56; --ink-3:#8A8F98;
  --indigo:#2E4F7D; --indigo-soft:#5B7CA8; --cinnabar:#B23A2E;
  --line:#DAD5C8; --line-soft:#E7E3D8; --sel:#DDE5EF;
  --serif:"Iowan Old Style","Apple Garamond",Garamond,Georgia,"AppleMyungjo","Batang",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --top:env(safe-area-inset-top);
  --bot:env(safe-area-inset-bottom);
}
html[data-theme="dark"]{
  --paper:#16181B; --paper-2:#1D2024; --paper-3:#262A2F;
  --ink:#E6E3DC; --ink-2:#B3AFA6; --ink-3:#7C8189;
  --indigo:#8FB3DE; --indigo-soft:#6E90BB; --cinnabar:#D96A5C;
  --line:#31353B; --line-soft:#272B30; --sel:#2A3543;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior-y:contain}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  padding:var(--top) 0 var(--bot);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

/* ── 머리 ── */
header{
  display:flex;align-items:baseline;gap:9px;padding:12px 18px 8px;flex:0 0 auto;
}
header h1{margin:0;font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.06em}
header .sub{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
header .grow{flex:1}
header button{
  font-size:12px;color:var(--ink-3);border:1px solid var(--line);border-radius:99px;padding:4px 11px;
}

/* ── 적는 자리 ── */
.compose{padding:4px 14px 10px;flex:0 0 auto}
.field{
  display:flex;align-items:flex-end;gap:8px;
  border:1px solid var(--line);border-radius:14px;background:var(--paper-2);
  padding:9px 9px 9px 14px;
}
.field:focus-within{border-color:var(--indigo-soft);background:var(--paper)}
#in{
  flex:1;min-width:0;border:none;background:transparent;color:var(--ink);
  font:inherit;font-size:17px;line-height:1.45;resize:none;overflow:hidden;
  max-height:38vh;padding:5px 0;outline:none;
}
#in::placeholder{color:var(--ink-3)}
#save{
  flex:0 0 auto;background:var(--indigo);color:#fff;border-radius:11px;
  padding:10px 16px;font-size:15px;font-weight:600;min-height:42px;
}
#save:disabled{opacity:.32}
.hint{
  display:flex;gap:12px;padding:7px 4px 0;font-size:11.5px;color:var(--ink-3);font-family:var(--mono);
}
.hint .grow{flex:1}

/* ── 목록 ── */
.bar{
  display:flex;align-items:center;gap:8px;padding:6px 18px 6px;
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
}
.bar .grow{flex:1}
.bar button{font-size:11.5px;letter-spacing:0;text-transform:none;color:var(--ink-3);padding:3px 8px;border-radius:6px}
.bar button:active{background:var(--paper-3)}
#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(120px + var(--bot))}
.day{
  font-family:var(--mono);font-size:11px;color:var(--ink-3);
  padding:14px 4px 4px;position:sticky;top:0;background:var(--paper);
}
.item{
  display:flex;gap:11px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line-soft);
}
.item .t{
  flex:0 0 42px;font-family:var(--mono);font-size:12px;color:var(--ink-3);padding-top:2px;
}
.item .x{flex:1;min-width:0;word-break:break-word;white-space:pre-wrap}
.item.sent{opacity:.42}
.item.sent .x{text-decoration:line-through;text-decoration-thickness:1px}
.item .del{
  flex:0 0 auto;color:var(--ink-3);font-size:17px;padding:2px 8px;border-radius:8px;line-height:1;
}
.item .del:active{background:var(--paper-3);color:var(--cinnabar)}
.blank{
  text-align:center;color:var(--ink-3);font-size:14px;line-height:1.9;padding:56px 24px;
}
.blank .big{font-family:var(--serif);font-size:19px;color:var(--ink-2);display:block;margin-bottom:6px}

/* ── 아래 보내기 ── */
footer{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:10px 14px calc(10px + var(--bot));
  background:linear-gradient(to top, var(--paper) 62%, transparent);
  display:flex;gap:8px;
}
footer button{
  flex:1;border:1px solid var(--line);border-radius:12px;background:var(--paper-2);
  padding:12px 8px;font-size:14.5px;color:var(--ink-2);min-height:46px;
}
footer button.main{border-color:var(--indigo);color:var(--indigo);font-weight:600;background:var(--paper)}
footer button:disabled{opacity:.35}
footer .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:5px}

#toast{
  position:fixed;left:50%;bottom:calc(86px + var(--bot));transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:99px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>조각</h1><span class="sub">capture</span>
  <span class="grow"></span>
  <button id="theme">테마</button>
</header>

<div class="compose">
  <div class="field">
    <textarea id="in" rows="1" placeholder="떠오른 것 한 조각"
      enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    <button id="save" disabled>담기</button>
  </div>
  <div class="hint">
    <span id="stat">아직 담은 것이 없습니다</span>
    <span class="grow"></span>
    <span id="clock"></span>
  </div>
</div>

<div class="bar">
  <span>담아 둔 것</span>
  <span class="grow"></span>
  <button id="clear-sent">보낸 것 비우기</button>
</div>
<div id="list"></div>

<footer>
  <button id="copy">복사<span class="n" id="n1"></span></button>
  <button id="share" class="main">보내기<span class="n" id="n2"></span></button>
</footer>
<div id="toast"></div>

<script>
"use strict";
/* ============================================================
   조각 — 아이폰에서 줍고, 맥북의 쪽글에서 편다
   · 데이터는 이 기기 안에만 (IndexedDB, 안 되면 localStorage)
   · 내보낼 때 { id, at, text } 목록을 JSON 으로 넘긴다
   ============================================================ */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const now = () => Date.now();
const WD = ["일","월","화","수","목","금","토"];
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hhmm  = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const uid = () => "f-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

let items = [];                 // { id, at, text, sent }

/* ---------- 저장소 ---------- */
const DB = "jogak-db", ST = "bag", KEY = "items";
let _db = null, useLS = false;
function openDB(){
  return new Promise((res, rej) => {
    let r;
    try{ r = indexedDB.open(DB, 1); }catch(e){ return rej(e); }
    r.onupgradeneeded = e => e.target.result.createObjectStore(ST);
    r.onsuccess = e => res(e.target.result);
    r.onerror  = () => rej(r.error);
  });
}
async function load(){
  try{
    _db = await openDB();
    const v = await new Promise((res, rej) => {
      const rq = _db.transaction(ST, "readonly").objectStore(ST).get(KEY);
      rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
    });
    return Array.isArray(v) ? v : [];
  }catch(e){
    useLS = true;                                   // 사파리 비공개 모드 등
    try{ return JSON.parse(localStorage.getItem("jogak") || "[]"); }catch{ return []; }
  }
}
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 250);
}
async function doSave(){
  try{
    if(useLS || !_db){ localStorage.setItem("jogak", JSON.stringify(items)); return; }
    await new Promise((res, rej) => {
      const tx = _db.transaction(ST, "readwrite");
      tx.objectStore(ST).put(items, KEY);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }catch(e){
    try{ localStorage.setItem("jogak", JSON.stringify(items)); useLS = true; }
    catch{ toast("저장하지 못했습니다. 지금 보내 두세요"); }
  }
}

/* ---------- 담기 ---------- */
function add(text){
  const t = String(text).replace(/\s+$/, "");
  if(!t.trim()) return null;
  const it = { id: uid(), at: now(), text: t, sent: false };
  items.unshift(it);
  save(); paint();
  return it;
}
function del(id){
  const i = items.findIndex(x => x.id === id);
  if(i < 0) return;
  items.splice(i, 1);
  save(); paint();
}
const unsent = () => items.filter(x => !x.sent);

/* ---------- 그리기 ---------- */
function paint(){
  const list = $("#list");
  list.innerHTML = "";
  const n = unsent().length;
  $("#n1").textContent = n ? n : "";
  $("#n2").textContent = n ? n : "";
  $("#copy").disabled = $("#share").disabled = items.length === 0;
  $("#clear-sent").style.display = items.some(x => x.sent) ? "" : "none";
  $("#stat").textContent = items.length
    ? (n ? `안 보낸 조각 ${n}개` : `모두 보냈습니다 · ${items.length}개 보관 중`)
    : "아직 담은 것이 없습니다";

  if(!items.length){
    list.innerHTML = `<div class="blank"><span class="big">한 낱말이면 됩니다</span>
      떠오른 것을 적어 두면<br>맥북의 쪽글에서 그날 노트로 들어갑니다.</div>`;
    return;
  }
  let lastDay = "";
  items.forEach(it => {
    const d = new Date(it.at);
    const key = dayKey(d);
    if(key !== lastDay){
      lastDay = key;
      const h = document.createElement("div");
      h.className = "day";
      h.textContent = `${key} ${WD[d.getDay()]}`;
      list.appendChild(h);
    }
    const row = document.createElement("div");
    row.className = "item" + (it.sent ? " sent" : "");
    const t = document.createElement("span");
    t.className = "t"; t.textContent = hhmm(d);
    const x = document.createElement("span");
    x.className = "x"; x.textContent = it.text;
    const b = document.createElement("button");
    b.className = "del"; b.textContent = "×";
    b.setAttribute("aria-label", "지우기");
    b.onclick = () => del(it.id);
    row.append(t, x, b);
    list.appendChild(row);
  });
}
function toast(msg){
  const el = $("#toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2100);
}

/* ---------- 내보내기 ---------- */
function bundle(all){
  const pick = all ? items : (unsent().length ? unsent() : items);
  return {
    payload: {
      app: "jjokgeul-fragments",
      v: 1,
      sentAt: now(),
      items: pick.slice().sort((a, b) => a.at - b.at).map(x => ({ id:x.id, at:x.at, text:x.text }))
    },
    count: pick.length
  };
}
function markSent(){
  items.forEach(x => x.sent = true);
  save(); paint();
}
async function doCopy(){
  const { payload, count } = bundle(false);
  if(!count) return;
  const text = JSON.stringify(payload);
  try{
    await navigator.clipboard.writeText(text);
  }catch{
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch{}
    ta.remove();
  }
  markSent();
  toast(`${count}개를 복사했습니다 · 맥북에 붙여 넣으세요`);
}
async function doShare(){
  const { payload, count } = bundle(false);
  if(!count) return;
  const text = JSON.stringify(payload, null, 1);
  const name = `jogak-${dayKey(new Date())}.json`;
  try{
    const file = new File([text], name, { type:"application/json" });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:"조각" });
      markSent();
      toast(`${count}개를 보냈습니다`);
      return;
    }
    if(navigator.share){
      await navigator.share({ text });
      markSent();
      toast(`${count}개를 보냈습니다`);
      return;
    }
  }catch(e){
    if(e && e.name === "AbortError") return;        // 사용자가 취소
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type:"application/json" }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  markSent();
  toast(`${count}개를 파일로 내려받았습니다`);
}

/* ---------- 입력 ---------- */
const inp = $("#in");
let composing = false;
function grow(){
  inp.style.height = "auto";
  inp.style.height = Math.min(inp.scrollHeight, window.innerHeight * 0.38) + "px";
}
function submit(){
  const v = inp.value;
  if(!v.trim()) return;
  add(v);
  inp.value = "";
  grow();
  $("#save").disabled = true;
  toast("담았습니다");
}
inp.addEventListener("input", () => {
  grow();
  $("#save").disabled = !inp.value.trim();
});
inp.addEventListener("compositionstart", () => composing = true);
inp.addEventListener("compositionend", () => composing = false);
inp.addEventListener("keydown", e => {
  // 한글이 아직 조합 중이면 입력기에 먼저 넘긴다
  if(composing || e.isComposing || e.keyCode === 229) return;
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); submit(); }
});
$("#save").onclick = submit;
$("#copy").onclick = doCopy;
$("#share").onclick = doShare;
$("#clear-sent").onclick = () => {
  const n = items.filter(x => x.sent).length;
  if(!n) return;
  if(!confirm(`보낸 조각 ${n}개를 지웁니다. 계속할까요?`)) return;
  items = items.filter(x => !x.sent);
  save(); paint();
  toast("비웠습니다");
};
$("#theme").onclick = () => {
  const cur = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = cur;
  try{ localStorage.setItem("jogak-theme", cur); }catch{}
};

/* ---------- 시계 ---------- */
function tick(){
  const d = new Date();
  $("#clock").textContent = `${hhmm(d)}`;
}

/* ---------- 시작 ---------- */
(async function boot(){
  let saved = "auto";
  try{ saved = localStorage.getItem("jogak-theme") || "auto"; }catch{}
  document.documentElement.dataset.theme = saved !== "auto" ? saved
    : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  items = await load();
  paint();
  tick();
  setInterval(tick, 20000);
  // 홈 화면에서 열었을 때 곧바로 적을 수 있게 — 다만 키보드가 화면을 가리지 않도록 데스크톱에서만
  if(!/iPhone|iPad|Android/i.test(navigator.userAgent)) inp.focus();
  document.addEventListener("visibilitychange", () => { if(document.hidden) doSave(); });
  window.addEventListener("pagehide", doSave);
})();
</script>
</body>
</html>
