<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="하루">
<meta name="theme-color" content="#000000">
<title>하루</title>
<style>
  :root{
    --bg:#020603;
    --g:#39ff7a;          /* 형광 초록 */
    --g2:#7dffa6;         /* 밝은 줄 */
    --gd:#1f9e4a;         /* 흐린 줄 */
    --gx:#0f4a24;         /* 아주 흐림 */
    --y:#c9ff5a;          /* 노란 초록 — 돈 */
    --o:#ffb347;          /* 주황 — 못 보낸 것 */
    --fs:17px;
  }
  @media (min-width:700px){ :root{ --fs:20px } }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;overflow:hidden}
  body{
    font-family:"D2Coding","Menlo","Apple SD Gothic Neo",monospace;
    font-size:var(--fs);line-height:1.65;color:var(--g);
    -webkit-font-smoothing:antialiased;
  }

  /* ── 브라운관 ── */
  .crt{
    position:fixed;inset:0;height:100dvh;
    padding:calc(env(safe-area-inset-top) + 2.2vh) max(5vw, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 1.4vh) max(5vw, env(safe-area-inset-left));
    background:radial-gradient(ellipse at center,#06140a 0%,var(--bg) 70%,#000 100%);
    display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;
    grid-template-areas:"head" "setup" "day" "screen" "foot";
    text-shadow:0 0 2px currentColor,0 0 10px rgba(57,255,122,.35);
  }
  .crt::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.28) 3px)}
  .crt::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
    box-shadow:inset 0 0 90px 22px #000;border-radius:18px}

  header{display:flex;justify-content:space-between;gap:1em;color:var(--gd);font-size:.72em;letter-spacing:.06em;
         border-bottom:1px dashed var(--gx);padding-bottom:.5em;margin-bottom:.7em}
  header a{color:var(--gd);text-decoration:none;border-bottom:1px dotted var(--gx)}
  header a.on{color:var(--g)}
  header .warn{color:var(--o)}

  /* 날짜 줄 */
  #dayBar{display:flex;align-items:baseline;gap:.8em;flex-wrap:wrap;margin-bottom:.5em}
  #dayBar .nav{background:transparent;color:var(--g);box-shadow:inset 0 0 0 1px var(--gx);text-shadow:inherit;padding:.05em .7em;font-size:.9em}
  #dayLbl{font-size:1.25em;color:var(--g2);position:relative;cursor:pointer}
  #dayLbl input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
  #todayBtn{font-size:.7em}
  #sum{flex-basis:100%;font-size:.75em;color:var(--gd)}
  #sum b{font-weight:normal;color:var(--y)}

  #setup{display:grid;gap:.5em;font-size:.82em;border:1px dashed var(--gx);padding:.9em 1em;margin-bottom:.7em}
  #setup label{display:flex;gap:.8em;color:var(--gd)}
  #setup input{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--gx);outline:0;
               font:inherit;font-size:16px;color:var(--g2);text-shadow:inherit;caret-color:var(--g)}
  #setup input::placeholder{color:var(--gx)}

  /* 쌓이는 줄 */
  #screen{overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:.2em 0 .6em}
  #screen::-webkit-scrollbar{display:none}
  .ln{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;display:grid;grid-template-columns:3.4em 3.6em minmax(0,1fr);
      column-gap:.5em;padding:.12em 0;border-radius:3px}
  .ln .t{color:var(--gd)}
  .ln .k{color:var(--g2)}
  .ln .x .won{color:var(--y)}
  .ln .src{color:var(--gd);font-size:.8em}
  .ln .wait{color:var(--o);font-size:.75em;margin-left:.4em}
  .ln.mine{cursor:pointer}
  .ln.sel{background:rgba(57,255,122,.12)}
  .ln.mac{color:var(--gd)}
  .ln.mac .k{color:var(--gd)}
  .ln.note{display:block;color:var(--gd)}
  .ln.rule{display:block;color:var(--gx);font-size:.8em;margin-top:.6em}
  .ln.new{animation:on .5s ease-out}
  @keyframes on{from{opacity:0;filter:brightness(2.5)}to{opacity:1;filter:none}}

  /* 아래 */
  footer{border-top:1px dashed var(--gx);padding-top:.7em;display:grid;grid-template-columns:minmax(0,1fr);gap:.55em}
  #chips{display:flex;flex-wrap:wrap;gap:.4em}
  #chips button{font-size:.8em;background:transparent;color:var(--g);box-shadow:inset 0 0 0 1px var(--gx);text-shadow:inherit;padding:.2em .75em}
  #chips button.sel{background:var(--g);color:var(--bg);text-shadow:none;box-shadow:0 0 14px rgba(57,255,122,.55)}
  #editNote{font-size:.75em;color:var(--y)}
  #editNote a{color:var(--g);text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-left:.8em}
  #editNote a.del{color:var(--o)}
  .prompt{display:flex;gap:.6em;align-items:flex-end}
  .prompt .ps{color:var(--gd);white-space:nowrap;padding-bottom:.15em}
  textarea{
    flex:1;width:0;min-width:0;background:transparent;border:0;outline:0;resize:none;
    font:inherit;font-size:max(16px,1em);color:var(--g2);text-shadow:inherit;caret-color:var(--g);
    line-height:1.6;max-height:30vh;
  }
  textarea::placeholder{color:var(--gx)}
  button{
    font:inherit;font-size:.9em;color:var(--bg);background:var(--g);border:0;cursor:pointer;
    padding:.35em 1.1em;letter-spacing:.06em;white-space:nowrap;
    box-shadow:0 0 14px rgba(57,255,122,.55);text-shadow:none;
  }
  button:active{transform:translateY(1px)}
  button.ghost{background:transparent;color:var(--g);box-shadow:inset 0 0 0 1px var(--g),0 0 14px rgba(57,255,122,.3);text-shadow:inherit}
  #toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 9.5em);transform:translateX(-50%);z-index:9;
         font-size:.8em;color:var(--bg);background:var(--g);padding:.25em 1em;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:none}
  #toast.on{opacity:1}
  header{grid-area:head} #setup{grid-area:setup} #dayBar{grid-area:day} #screen{grid-area:screen} footer{grid-area:foot}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="crt">
  <header>
    <span>하루 · 기록기</span>
    <span><a id="bjLink" href="#">연결 없음</a> <span id="outN" class="warn"></span> &nbsp;<span id="clock"></span></span>
  </header>

  <form id="setup" hidden>
    <div class="ln note">수파베이스 연결 — 방점과 같은 주소·키를 넣습니다. 기록은 방점의 요청 표(bangjeom_act)에 log로 남고, 맥의 다녀올게가 읽어 갑니다.</div>
    <label>주소 <input id="cfUrl" placeholder="https://xxxx.supabase.co" autocomplete="off" autocapitalize="off"></label>
    <label>키 &nbsp; <input id="cfKey" type="password" placeholder="방점 설정에 넣은 것과 같은 키" autocomplete="off"></label>
    <label>목록 <input id="cfList" placeholder="bangjeom" autocomplete="off" autocapitalize="off"></label>
    <div class="ln note">비워 두면 같은 주소(깃허브 apps/)에 있는 방점의 설정을 빌립니다. 홈 화면에 올린 앱은 사파리와 저장소가 따로라 한 번 넣어야 합니다.</div>
    <div><button type="submit">저장하고 읽어 오기</button> <button type="button" class="ghost" id="cfClose">닫기</button></div>
  </form>

  <div id="dayBar">
    <button class="nav" id="prev" aria-label="전날">‹</button>
    <span id="dayLbl"><span id="dayTxt"></span><input type="date" id="dayPick" aria-label="날짜 고르기"></span>
    <button class="nav" id="next" aria-label="다음날">›</button>
    <button class="ghost" id="todayBtn" hidden>오늘로</button>
    <div id="sum"></div>
  </div>

  <main id="screen"></main>

  <footer>
    <div id="chips"></div>
    <div id="editNote" hidden></div>
    <div class="prompt">
      <span class="ps" id="ps">기록 &gt;</span>
      <textarea id="what" rows="1" enterkeyhint="send" placeholder="적고 Enter"></textarea>
      <button id="go">적기</button>
    </div>
  </footer>
</div>
<div id="toast"></div>

<script>
/* ═════════ 하루 (2026년 11월 28일, 작가가 정함) ═════════
   다녀올게의 초록 화면을 옮긴 아이폰·아이패드용 하루 기록기. 종류를 고르고 적으면 시각과 함께 그날 줄에 쌓인다.
   보내기: bangjeom_act에 kind 'log' 한 줄 = 기록 하나. target = 기록 id, text = {"at":ms,"tag":종류,"t":글,"dev":기기,"v":고친 ms,"del":1?}
     고치기·지우기는 같은 줄을 PATCH(지우기는 del:1). 방점은 log를 모르므로 taken_at만 달고 남겨 둔다.
   읽기: 내 log 전부(처음엔 120일, 다음부터 14일, 지난 날을 볼 땐 그 언저리) + 맥 다녀올게의 memo·away(그날 것, 흐리게) */
const KEY = 'haru.v1', CFG = 'haru.bj';
const TAGS = ['기록','메모','사람','지출','수입','식사','건강','예술'];
const OLD_TAG = { '먹은 것':'식사', '몸':'건강', '본 것':'예술' };   // 첫날 잠깐 쓴 이름(11월 28일 낮에 바꿈)
const tagOf = t => { t = String(t || '기록'); return OLD_TAG[t] || t; };
const MONEY = new Set(['지출','수입']);
const $ = id => document.getElementById(id);
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null } catch { return null } };
let S = Object.assign({ items:{}, out:[], tag:'기록', first:0, mac:{} }, load() || {});
S.tag = tagOf(S.tag); if (!TAGS.includes(S.tag)) S.tag = '기록';
Object.values(S.items).forEach(e => { e.tag = tagOf(e.tag); });
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

const DEV = /iPad/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1) ? 'ipad'
          : /iPhone|iPod/.test(navigator.userAgent) ? 'iphone' : /Android/.test(navigator.userAgent) ? 'phone' : 'mac';
const DEV_KO = { ipad:'패드', iphone:'폰', phone:'폰', mac:'맥' };

/* ═════════ 시간 말 ═════════ */
const pad = n => String(n).padStart(2,'0');
const hm  = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}` };
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayKey = t => keyOf(new Date(t == null ? Date.now() : t));
const dayStart = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d).getTime(); };
const shift = (k, n) => { const [y,m,d] = k.split('-').map(Number); return keyOf(new Date(y, m-1, d+n)); };
const WD = '일월화수목금토';
const dayName = k => { const d = new Date(dayStart(k)); return `${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})`; };
const one = s => String(s || '').replace(/\s+/g,' ').trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

/* ═════════ 돈 읽기 ═════════  9000 · 9,000원 · 1.2만 · 3만5천원 · 만원 — 지출·수입 줄의 마지막 금액 하나 */
const MONEY_RE = /(\d[\d,]*(?:\.\d+)?\s*만(?:\s*\d[\d,]*\s*천?)?|\d[\d,]*(?:\.\d+)?\s*천|\d[\d,]*(?:\.\d+)?)\s*원?|(?:^|\s)(만)\s*원/g;
function wonOf(s){
  let last = null, m;
  MONEY_RE.lastIndex = 0;
  while ((m = MONEY_RE.exec(s))) last = m;
  if (!last) return 0;
  if (last[2]) return 10000;
  const v = last[1].replace(/[,\s]/g,'');
  const mm = v.match(/^([\d.]+)만(?:(\d+)(천)?)?$/);
  if (mm) return Math.round(parseFloat(mm[1]) * 10000 + (mm[2] ? +mm[2] * (mm[3] ? 1000 : 1) : 0));
  const ch = v.match(/^([\d.]+)천$/);
  if (ch) return Math.round(parseFloat(ch[1]) * 1000);
  return Math.round(parseFloat(v)) || 0;
}
const won = n => n.toLocaleString('ko-KR');
// 금액 부분을 노란 초록으로
function moneyHtml(s){
  let last = null, m; MONEY_RE.lastIndex = 0;
  while ((m = MONEY_RE.exec(s))) last = m;
  if (!last) return esc(s);
  const a = last.index + (last[0].length - last[0].trimStart().length), b = last.index + last[0].length;
  return esc(s.slice(0,a)) + `<span class="won">${esc(s.slice(a,b))}</span>` + esc(s.slice(b));
}

/* ═════════ 연결 ═════════ */
function cfg(){
  let own = {}, b = {};
  try{ own = JSON.parse(localStorage.getItem(CFG) || '{}') || {}; }catch(e){}
  try{ b = JSON.parse(localStorage.getItem('bangjeom.cfg') || '{}') || {}; }catch(e){}
  const url = own.url || b.url || '', key = own.key || b.key || '', list = own.list || b.list || 'bangjeom';
  return url && key ? { url:String(url).replace(/\/+$/,''), key, list } : null;
}
const hdr = (c, more) => Object.assign({ apikey:c.key, Authorization:'Bearer ' + c.key }, more || {});
let net = 'none', pulledAt = 0;

async function getRows(c, kinds, from, to){
  const out = [];
  for (let off = 0; off < 20000; off += 1000){
    let q = `${c.url}/rest/v1/bangjeom_act?select=kind,target,text,device,created_at&list=eq.${encodeURIComponent(c.list)}` +
            `&kind=in.(${kinds})&created_at=gte.${encodeURIComponent(new Date(from).toISOString())}`;
    if (to) q += `&created_at=lt.${encodeURIComponent(new Date(to).toISOString())}`;
    q += `&order=created_at.asc&limit=1000&offset=${off}`;
    const r = await fetch(q, { headers:hdr(c) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = await r.json();
    out.push(...rows);
    if (rows.length < 1000) break;
  }
  return out;
}
function takeLog(rows){
  const waiting = new Set(S.out);
  let n = 0;
  for (const r of rows){
    let o = null; try{ o = JSON.parse(r.text); }catch(e){}
    if (!o || !+o.at || !r.target || waiting.has(r.target)) continue;
    const old = S.items[r.target];
    if (old && (+old.v || 0) > (+o.v || 0)) continue;
    S.items[r.target] = { id:r.target, at:+o.at, tag:tagOf(o.tag), t:String(o.t || ''), dev:String(o.dev || ''), v:+o.v || 0, del:!!o.del, sent:true };
    n++;
  }
  return n;
}
function takeMac(rows){
  for (const r of rows){
    let o = null; try{ o = JSON.parse(r.text); }catch(e){}
    if (!o || !+o.at) continue;
    const k = dayKey(+o.at), id = `${r.kind}|${o.at}`;
    const day = S.mac[k] = S.mac[k] || {};
    day[id] = r.kind === 'memo' ? { kind:'memo', at:+o.at, tag:String(o.tag || '메모'), t:one(o.t), task:one(o.task) }
                                : { kind:'away', at:+o.at, back:+o.back || 0, why:one(o.why), t:one(o.t) };
  }
  const cut = shift(dayKey(), -60);
  Object.keys(S.mac).forEach(k => { if (k < cut) delete S.mac[k]; });
}
let pulling = false;
async function pull(around){
  const c = cfg();
  if (!c){ net = 'none'; paint(); return; }
  if (pulling) return; pulling = true;
  try{
    const now = Date.now();
    const from = !S.first ? now - 120*86400000 : now - 14*86400000;
    takeLog(await getRows(c, 'log', from));
    if (!S.first) S.first = now;
    takeMac(await getRows(c, 'memo,away', dayStart(shift(dayKey(), -2))));
    if (around && around < dayKey(now - 12*86400000)){    // 지난 날을 볼 때: 그날 앞뒤로 적은 것(늦게 보낸 것까지)
      const s = dayStart(shift(around, -1)), e = dayStart(shift(around, 10));
      takeLog(await getRows(c, 'log', s, e));
      takeMac(await getRows(c, 'memo,away', s, dayStart(shift(around, 2))));
    }
    save(); net = 'on'; pulledAt = Date.now();
  }catch(e){ net = 'err'; }
  pulling = false;
  render(); flush();
}

/* 보내기 — S.out은 보낼 기록 id. 보낼 때의 모양을 그대로 보낸다(그 사이 고친 것까지). 처음이면 POST, 그다음은 PATCH */
let flushing = false;
async function flush(){
  const c = cfg();
  if (flushing || !S.out.length || !c){ paint(); return; }
  flushing = true;
  try{
    while (S.out.length){
      const id = S.out[0], e = S.items[id];
      if (e){
        const text = JSON.stringify({ at:e.at, tag:e.tag, t:e.t, dev:e.dev, v:e.v, ...(e.del ? { del:1 } : {}) });
        let r;
        if (!e.sent){
          r = await fetch(`${c.url}/rest/v1/bangjeom_act`, { method:'POST', headers:hdr(c, { 'Content-Type':'application/json', Prefer:'return=minimal' }),
            body: JSON.stringify({ list:c.list, kind:'log', target:id, text, device:'haru-' + e.dev }) });
        }else{
          r = await fetch(`${c.url}/rest/v1/bangjeom_act?list=eq.${encodeURIComponent(c.list)}&kind=eq.log&target=eq.${encodeURIComponent(id)}`,
            { method:'PATCH', headers:hdr(c, { 'Content-Type':'application/json', Prefer:'return=minimal' }), body: JSON.stringify({ text }) });
        }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        e.sent = true;
      }
      S.out.shift(); save();
    }
    net = 'on';
  }catch(e){ net = 'err'; }
  flushing = false;
  paint(); render();
}
const queue = id => { S.out = S.out.filter(x => x !== id); S.out.push(id); save(); flush(); };

/* ═════════ 적기 ═════════ */
let view = dayKey(), editId = null;
const TIME_RE = /^(\d{1,2})[:시]\s?(\d{2})?분?\s+/;   // 줄 앞에 "14:20 " 또는 "9시 "를 붙이면 그 시각으로
function atFor(text, base){
  const m = text.match(TIME_RE);
  const today = view === dayKey();
  if (m && +m[1] < 24 && (!m[2] || +m[2] < 60)){
    const d = new Date(base != null ? base : (today ? Date.now() : dayStart(view)));
    if (base == null && !today) d.setTime(dayStart(view));
    d.setHours(+m[1], +(m[2] || 0), 0, 0);
    return { at:d.getTime(), text:text.slice(m[0].length) };
  }
  if (base != null) return { at:base, text };
  if (today) return { at:Date.now(), text };
  const d = new Date(Date.now()); const s = new Date(dayStart(view));   // 지난 날에 적으면: 지금 시각을 그날로
  s.setHours(d.getHours(), d.getMinutes(), 0, 0);
  return { at:s.getTime(), text };
}
function write(){
  const raw = $('what').value.trim();
  if (!raw) return;
  if (editId){
    const e = S.items[editId];
    if (e){ const r = atFor(raw, e.at); Object.assign(e, { t:one(r.text) || e.t, at:r.at, tag:S.tag, v:Date.now() }); queue(e.id); toast('고쳤습니다'); }
    endEdit();
  }else{
    const r = atFor(raw);
    if (!one(r.text)) return;
    const e = { id:uid(), at:r.at, tag:S.tag, t:one(r.text), dev:DEV, v:Date.now(), del:false, sent:false };
    S.items[e.id] = e; fresh = e.id; queue(e.id);
    if (dayKey(e.at) !== view){ view = dayKey(e.at); }
  }
  $('what').value = ''; grow(); render(true);
}
function startEdit(id){
  const e = S.items[id]; if (!e) return;
  editId = id; S.tag = TAGS.includes(e.tag) ? e.tag : '기록';
  $('what').value = `${hm(e.at)} ${e.t}`; grow();
  $('editNote').hidden = false;
  $('editNote').innerHTML = `${hm(e.at)}의 [${esc(e.tag)}] 고치는 중 <a id="eDel" class="del">지우기</a><a id="eStop">그만</a>`;
  $('eDel').onclick = () => { if (confirm('이 기록을 지울까요?')){ e.del = true; e.v = Date.now(); queue(e.id); toast('지웠습니다'); endEdit(); $('what').value=''; grow(); render(); } };
  $('eStop').onclick = () => { endEdit(); $('what').value = ''; grow(); render(); };
  $('go').textContent = '고치기';
  chips(); render(); $('what').focus();
}
function endEdit(){ editId = null; $('editNote').hidden = true; $('go').textContent = '적기'; chips(); }

/* ═════════ 그리기 ═════════ */
let fresh = null;
function chips(){
  $('chips').innerHTML = TAGS.map(t => `<button type="button" class="${t === S.tag ? 'sel' : ''}" data-t="${esc(t)}">${esc(t)}</button>`).join('');
  $('ps').textContent = `${S.tag} >`;
  $('what').placeholder = MONEY.has(S.tag) ? '무엇에 · 얼마 (예: 점심 김밥 9,000원)' : S.tag === '사람' ? '누구와 · 무엇을' : S.tag === '식사' ? '무엇을 · 어디서 · 누구와' : S.tag === '건강' ? '잠 · 운동 · 컨디션 · 약' : S.tag === '예술' ? '읽은 책 · 본 영화 · 들은 음악' : '적고 Enter';
}
function dayLines(k){
  const s = dayStart(k), e = dayStart(shift(k, 1));
  const mine = Object.values(S.items).filter(x => !x.del && x.at >= s && x.at < e);
  const mac = Object.values(S.mac[k] || {});
  const waiting = new Set(S.out);
  const L = mine.map(x => ({ at:x.at, mine:true, id:x.id, tag:x.tag,
    html:(MONEY.has(x.tag) ? moneyHtml(x.t) : esc(x.t)) + (x.dev && x.dev !== DEV ? ` <span class="src">· ${DEV_KO[x.dev] || x.dev}</span>` : '') + (waiting.has(x.id) ? '<span class="wait">못 보냄</span>' : '') }));
  for (const m of mac){
    if (m.kind === 'memo') L.push({ at:m.at, mac:true, tag:'맥', html:`[${esc(m.tag)}] ${esc(m.t)}${m.task ? ` <span class="src">· ${esc(m.task)} 하던 중</span>` : ''}` });
    else L.push({ at:m.at, mac:true, tag:'맥', html:`자리 비움${m.back ? ` ${hm(m.at)}–${hm(m.back)} · ${Math.round((m.back - m.at)/60000)}분` : ''}${m.t ? ` <span class="src">· ${esc(m.t)}</span>` : ''}` });
  }
  return { L: L.sort((a,b) => a.at - b.at), mine };
}
function render(scroll){
  const { L, mine } = dayLines(view);
  const sc = $('screen'), atBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 40;
  let html = '';
  if (!L.length) html = `<div class="ln note">${view === dayKey() ? '아직 없음. 종류를 고르고 적으면 시각과 함께 쌓입니다.' : '이날은 기록이 없습니다.'}</div>`;
  let lastH = -1;
  for (const o of L){
    const h = new Date(o.at).getHours();
    if (lastH >= 0 && h - lastH >= 3) html += `<div class="ln rule">· · ·</div>`;
    lastH = h;
    html += `<div class="ln ${o.mine ? 'mine' : 'mac'}${o.id && o.id === editId ? ' sel' : ''}${o.id && o.id === fresh ? ' new' : ''}"${o.id ? ` data-id="${o.id}"` : ''}>` +
            `<span class="t">${hm(o.at)}</span><span class="k">${esc(o.tag)}</span><span class="x">${o.html}</span></div>`;
  }
  sc.innerHTML = html;
  fresh = null;
  if (scroll || atBottom) sc.scrollTop = sc.scrollHeight;
  // 머리
  $('dayTxt').textContent = dayName(view) + (view === dayKey() ? ' · 오늘' : '');
  $('dayPick').value = view;
  $('todayBtn').hidden = view === dayKey();
  $('next').disabled = view >= dayKey(); $('next').style.opacity = view >= dayKey() ? .3 : 1;
  const out = mine.filter(x => x.tag === '지출').reduce((a,x) => a + wonOf(x.t), 0);
  const inn = mine.filter(x => x.tag === '수입').reduce((a,x) => a + wonOf(x.t), 0);
  const cnt = {}; mine.forEach(x => cnt[x.tag] = (cnt[x.tag] || 0) + 1);
  const parts = [`${mine.length}줄`];
  if (out) parts.push(`지출 <b>${won(out)}원</b>`);
  if (inn) parts.push(`수입 <b>${won(inn)}원</b>`);
  const rest = TAGS.filter(t => !MONEY.has(t) && cnt[t]).map(t => `${t} ${cnt[t]}`);
  $('sum').innerHTML = parts.join(' · ') + (rest.length ? ` &nbsp;<span style="color:var(--gx)">${rest.join(' · ')}</span>` : '');
  paint();
}
function paint(){
  const a = $('bjLink');
  a.textContent = net === 'on' ? '연결됨' : net === 'err' ? '연결 안 됨' : cfg() ? '연결 중' : '연결 없음';
  a.className = net === 'on' ? 'on' : '';
  $('outN').textContent = S.out.length ? `· 못 보낸 것 ${S.out.length}개` : '';
  $('clock').textContent = hm(Date.now());
}
let tt = 0;
function toast(s){ const t = $('toast'); t.textContent = s; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1400); }
function grow(){ const w = $('what'); w.style.height = 'auto'; w.style.height = w.scrollHeight + 'px'; }
function go(k){ view = k > dayKey() ? dayKey() : k; if (editId){ endEdit(); $('what').value=''; grow(); } render(true); pull(view); }

/* ═════════ 손 ═════════ */
$('chips').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.tag = b.dataset.t; save(); chips(); $('what').focus(); };
$('go').onclick = e => { e.preventDefault(); write(); $('what').focus(); };
$('what').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); write(); }
  else if (e.key === 'Escape' && editId){ endEdit(); $('what').value=''; grow(); render(); }
});
$('what').addEventListener('input', grow);
$('screen').onclick = e => { const l = e.target.closest('.ln.mine'); if (l) startEdit(l.dataset.id); };
$('prev').onclick = () => go(shift(view, -1));
$('next').onclick = () => go(shift(view, 1));
$('todayBtn').onclick = () => go(dayKey());
$('dayPick').onchange = e => { if (e.target.value) go(e.target.value); };
$('bjLink').onclick = e => {
  e.preventDefault();
  const f = $('setup'); f.hidden = !f.hidden;
  let own = {}; try{ own = JSON.parse(localStorage.getItem(CFG) || '{}') || {}; }catch(x){}
  $('cfUrl').value = own.url || ''; $('cfKey').value = own.key || ''; $('cfList').value = own.list || '';
};
$('cfClose').onclick = () => $('setup').hidden = true;
$('setup').onsubmit = e => {
  e.preventDefault();
  const v = { url:$('cfUrl').value.trim(), key:$('cfKey').value.trim(), list:$('cfList').value.trim() };
  if (v.url || v.key || v.list) localStorage.setItem(CFG, JSON.stringify(v)); else localStorage.removeItem(CFG);
  $('setup').hidden = true; S.first = 0; save(); pull(view);
};
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (view !== dayKey() && !editId && Date.now() - pulledAt > 6*3600000) view = dayKey();   // 오래 덮어 뒀다 열면 오늘로
  render(); if (Date.now() - pulledAt > 20000) pull(view);
});
setInterval(() => { paint(); if (!document.hidden) pull(view); }, 60000);
setInterval(paint, 10000);

chips(); render(true); pull(view);
</script>
</body>
</html>
