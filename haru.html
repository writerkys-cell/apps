<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>haru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2EDE1;
  --paper-hi:#FAF7EF;
  --paper-lo:#E5DDCA;
  --ink:#2A2622;
  --ink-2:#6E6559;
  --ink-3:#9A9081;
  --line:rgba(42,38,34,.14);
  --seal:#A33A2E;
  --seal-soft:rgba(163,58,46,.10);
  --rail:26px;
}
/* 하루의 빛: 시간대에 따라 종이 색이 바뀐다 */
body.t-dawn   {--paper:#F5F1E7;--paper-hi:#FCFAF4;--paper-lo:#E9E2D1;}
body.t-day    {--paper:#F2EDE1;--paper-hi:#FAF7EF;--paper-lo:#E5DDCA;}
body.t-after  {--paper:#EFE7D8;--paper-hi:#F7F2E7;--paper-lo:#DFD5BF;}
body.t-dusk   {--paper:#E3DACA;--paper-hi:#EDE6D8;--paper-lo:#D2C7B1;--ink:#332E28;}
body.t-night  {--paper:#D9D0BF;--paper-hi:#E4DCCC;--paper-lo:#C7BCA6;--ink:#332E28;--ink-2:#655C51;}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Gowun Batang',"Apple SD Gothic Neo",serif;
  font-size:16px; line-height:1.75;
  -webkit-text-size-adjust:100%;
  transition:background-color 1.2s linear, color 1.2s linear;
  padding-bottom:60px;
}
.wrap{max-width:920px;margin:0 auto;padding:0 20px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
textarea,input,select{font-family:inherit;color:inherit}

/* ─── 머리 ─── */
header{padding:30px 0 14px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{
  font-size:34px;margin:0;font-weight:700;letter-spacing:.22em;
  text-indent:.22em;
}
.brand .sub{color:var(--ink-3);font-size:13px;letter-spacing:.14em}
.meta{
  display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;
  margin-top:10px;font-size:13.5px;color:var(--ink-2);
}
.meta .clock{font-variant-numeric:tabular-nums}
.meta .cd{color:var(--seal)}
.meta .cd.closed{color:var(--ink-3)}

/* ─── 궤도 ─── */
nav.orbit{
  display:flex;gap:0;margin:22px 0 26px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
nav.orbit button{
  flex:1;background:none;border:0;padding:11px 4px 10px;
  font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;
  border-right:1px solid var(--line);position:relative;text-align:center;
  transition:color .25s, background-color .25s;
}
nav.orbit button:last-child{border-right:0}
nav.orbit button .n{display:block;font-size:10px;letter-spacing:.2em;opacity:.55;margin-bottom:2px}
nav.orbit button.done{color:var(--ink-2)}
nav.orbit button.done .n::after{content:"·"}
nav.orbit button.on{color:var(--ink);background:var(--seal-soft)}
nav.orbit button.on::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--seal);
}
nav.orbit button:disabled{opacity:.4;cursor:default}

/* ─── 단계 판 ─── */
.stage{animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stage{animation:none}}
.stage h2{
  font-size:21px;margin:0 0 4px;font-weight:700;letter-spacing:.02em;
}
.stage .lead{color:var(--ink-2);font-size:14px;margin:0 0 20px;max-width:52ch}
.hint{color:var(--ink-3);font-size:12.5px;line-height:1.7}

.sheet{
  background:var(--paper-hi);
  border:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 2px 10px rgba(42,38,34,.045);
  padding:18px;
}
textarea.field{
  width:100%;background:transparent;border:0;outline:none;resize:vertical;
  font-size:16.5px;line-height:2.05;min-height:300px;color:var(--ink);
  background-image:linear-gradient(to bottom, transparent 0, transparent calc(2.05em - 1px), var(--line) calc(2.05em - 1px), var(--line) 2.05em);
  background-size:100% 2.05em;
  background-attachment:local;
}
textarea.field:disabled{color:var(--ink-2);opacity:.85}
textarea.small{min-height:110px;background-image:none}

.bar{
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  margin-top:14px;font-size:13px;color:var(--ink-2);
}
.bar .grow{flex:1}
.count{font-variant-numeric:tabular-nums}
.gauge{height:3px;background:var(--paper-lo);width:150px;position:relative;overflow:hidden}
.gauge i{position:absolute;left:0;top:0;bottom:0;background:var(--seal);transition:width .4s}

.btn{
  background:transparent;border:1px solid var(--ink);padding:8px 18px;
  letter-spacing:.06em;font-size:14px;transition:background-color .2s,color .2s;
}
.btn:hover{background:var(--ink);color:var(--paper-hi)}
.btn.seal{border-color:var(--seal);color:var(--seal)}
.btn.seal:hover{background:var(--seal);color:var(--paper-hi)}
.btn.ghost{border-color:var(--line);color:var(--ink-2);padding:7px 14px;font-size:13px}
.btn.ghost:hover{background:var(--paper-lo);color:var(--ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn:disabled:hover{background:transparent;color:inherit}
.btn.seal:disabled:hover{color:var(--seal)}

/* 어제의 씨앗 */
.seedbox{
  border-left:2px solid var(--seal);padding:4px 0 4px 16px;margin:0 0 22px;
}
.seedbox .lbl{font-size:11px;letter-spacing:.2em;color:var(--seal);display:block;margin-bottom:5px}
.seedbox p{margin:0;font-size:17px;line-height:1.7}
.seedbox p.none{color:var(--ink-3);font-size:14px}

/* 음악 */
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.timer .album{
  font-size:17px;letter-spacing:.02em;
  border-bottom:1px solid var(--line);padding-bottom:2px;
}
.timer .state{font-size:12.5px;color:var(--seal)}

/* 조각 */
.scrap-in{display:flex;gap:8px;margin-bottom:16px}
.scrap-in input{
  flex:1;background:var(--paper-hi);border:1px solid var(--line);
  padding:11px 13px;font-size:15px;outline:none;
}
.scrap-in input:focus{border-color:var(--ink-3)}
ul.scraps{list-style:none;margin:0;padding:0}
ul.scraps li{
  display:flex;gap:12px;padding:9px 0;border-bottom:1px dotted var(--line);font-size:15px;
}
ul.scraps li time{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums;padding-top:4px;flex:0 0 42px}
ul.scraps li span{flex:1}
ul.scraps li button{background:none;border:0;color:var(--ink-3);font-size:12px;opacity:0;transition:opacity .2s}
ul.scraps li:hover button{opacity:1}

/* 닫기 */
.shutdown{text-align:center;padding:34px 0 10px}
.shutdown .big{font-size:26px;margin:0 0 10px;letter-spacing:.02em}
.shutdown .lead{margin:0 auto 26px}
.box{
  width:190px;height:112px;margin:0 auto 26px;position:relative;
}
.box .lid{
  position:absolute;left:0;right:0;top:0;height:26px;
  background:var(--paper-lo);border:1px solid var(--line);
  transform-origin:top center;transition:transform .8s ease;
}
.box .body{
  position:absolute;left:0;right:0;top:22px;bottom:0;
  background:var(--paper-hi);border:1px solid var(--line);
}
.box.closed .lid{transform:none}
.box.open .lid{transform:rotateX(115deg) translateY(-6px)}

/* 날마다 쌓기 */
.grid{margin:44px 0 10px;padding-top:26px;border-top:1px solid var(--line)}
.grid h3{
  font-size:13px;letter-spacing:.16em;color:var(--ink-2);
  margin:0 0 18px;font-weight:400;
}
.gscroll{overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
.gdays{display:flex;gap:3px;min-width:min-content;align-items:flex-end}
.gday{display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
.gday .c{
  width:12px;height:12px;border-radius:2px;
  border:1px solid rgba(42,38,34,.13);background:transparent;
}
.gday .c.on{border-color:transparent}
.c.on.s5{background:rgba(42,38,34,.16)}
.c.on.s4{background:rgba(42,38,34,.30)}
.c.on.s3{background:rgba(42,38,34,.46)}
.c.on.s2{background:rgba(42,38,34,.62)}
.c.on.s1{background:rgba(42,38,34,.80)}
.gday .gdate{
  font-style:normal;font-size:9px;line-height:1;margin-top:4px;
  text-align:center;color:var(--ink-3);font-variant-numeric:tabular-nums;
}
.gday.first .gdate{color:var(--ink-2)}
.gday.today .gdate{color:var(--seal)}
.gday.today .c{border-color:rgba(163,58,46,.30)}
.gday.today .c.on{border-color:transparent}
.glegend{
  display:flex;align-items:center;gap:14px;margin-top:14px;
  font-size:11px;color:var(--ink-3);letter-spacing:.02em;
}
.glegend .grow{flex:1}
.glegend .lg{display:inline-flex;align-items:center;gap:5px;margin-right:11px}
.glegend .lg i{
  width:9px;height:9px;border-radius:2px;display:inline-block;
  border:1px solid rgba(42,38,34,.13);
}
.gempty{font-size:13px;color:var(--ink-3);padding:8px 0}

/* 서고 */
.archive{margin-top:44px;padding-top:22px;border-top:1px solid var(--line)}
.archive h3{font-size:13px;letter-spacing:.16em;color:var(--ink-2);margin:0 0 14px;font-weight:400}
table.arch{width:100%;border-collapse:collapse;font-size:13.5px}
table.arch th{
  text-align:left;font-weight:400;color:var(--ink-3);font-size:11.5px;letter-spacing:.1em;
  padding:0 8px 7px 0;border-bottom:1px solid var(--line);
}
table.arch td{padding:9px 8px 9px 0;border-bottom:1px dotted var(--line);vertical-align:top}
table.arch td.num{font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
table.arch td.seed{color:var(--ink)}
table.arch tr.empty td{color:var(--ink-3);text-align:center;padding:22px 0}
.arch-open{background:none;border:0;padding:0;color:var(--seal);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.arch-detail td{background:rgba(42,38,34,.025);font-size:14px;line-height:1.9;white-space:pre-wrap}
.arch-detail .warn{color:var(--ink-3);font-size:12px}

footer.tools{
  margin-top:40px;padding-top:18px;border-top:1px solid var(--line);
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;
}
footer.tools .grow{flex:1}
footer.tools .note{font-size:11.5px;color:var(--ink-3)}
.pgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pgroup label{margin-left:6px}
.pgroup label:first-child{margin-left:0}
select.ptsel{
  background:transparent;border:0;border-bottom:1px solid var(--line);
  padding:5px 2px;font-size:13px;color:var(--ink-2);outline:none;
}
.pnote{font-size:11.5px;color:var(--ink-3);width:100%;margin-top:8px}

.inline-ask{
  margin-top:14px;padding:14px 16px;border:1px solid var(--seal);background:var(--seal-soft);
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;
}
.inline-ask input{
  width:70px;background:var(--paper-hi);border:1px solid var(--line);padding:6px 8px;
  font-size:15px;text-align:center;font-variant-numeric:tabular-nums;outline:none;
}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper-hi);padding:10px 20px;font-size:13.5px;
  letter-spacing:.04em;opacity:0;pointer-events:none;transition:opacity .3s;z-index:50;
}
.toast.on{opacity:.95}

@media (max-width:640px){
  .wrap{padding:0 15px}
  .brand h1{font-size:28px}
  nav.orbit button{font-size:11px;padding:9px 2px}
  .towers{grid-template-columns:1fr;gap:34px}
  .stackwrap{height:190px}
  .timer .disp{font-size:27px}
  table.arch .hide-s{display:none}
}

/* ─── 인쇄: 가로 A4 ─── */
#print{display:none}
@media print{
  @page{size:A4 landscape;margin:13mm 10mm 10mm;}
  html,body{background:#fff;color:#000;margin:0;padding:0}
  body > *{display:none !important}
  #print{display:block !important}
  .pg{page-break-after:always;break-after:page}
  .pg:last-child{page-break-after:auto;break-after:auto}
  .pg-head{
    position:relative;text-align:center;margin:0 0 9mm;
    font-size:9.5pt;color:#8e8e8e;letter-spacing:.04em;line-height:1.2;
  }
  .pg-head .tag{
    position:absolute;left:0;top:.6mm;
    font-size:7.5pt;color:#a8a8a8;letter-spacing:.22em;
  }
  .pg-body{width:var(--pw,140mm);margin:0 auto}
  .pg-body .ln{
    font-size:var(--pfs,13pt);
    line-height:var(--plh,6mm);
    min-height:var(--plh,6mm);
    white-space:pre-wrap;
    overflow-wrap:break-word;
  }
  .pg-body .ln.seed{color:#666}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>haru</h1>
      <span class="sub">하루 한 켜씩</span>
    </div>
    <div class="meta">
      <span id="mDate"></span>
      <span class="clock" id="mClock"></span>
      <span class="cd" id="mCount"></span>
      <span id="mDays"></span>
    </div>
  </header>

  <nav class="orbit" id="orbit"></nav>

  <main id="stage"></main>

  <section class="grid">
    <h3>날마다 쌓기</h3>
    <div class="gscroll" id="gScroll"><div class="gdays" id="gDays"></div></div>
    <div class="glegend">
      <span id="gKeys"></span>
      <span class="grow"></span>
      <span id="gFull"></span>
    </div>
  </section>

  <section class="archive">
    <h3>지나간 하루</h3>
    <table class="arch"><thead>
      <tr><th>날짜</th><th class="hide-s">모닝</th><th class="hide-s">원고</th><th>씨앗</th><th></th></tr>
    </thead><tbody id="archBody"></tbody></table>
  </section>

  <footer class="tools">
    <span class="note">하루는 새벽 4시에 바뀝니다 · 5시에 닫힙니다</span>
    <span class="grow"></span>
    <span class="pgroup">
      <label class="note" for="ptSel">글자</label><select id="ptSel" class="ptsel"></select>
      <label class="note" for="lhSel">행간</label><select id="lhSel" class="ptsel"></select>
      <label class="note" for="pwSel">본문폭</label><select id="pwSel" class="ptsel"></select>
    </span>
    <button class="btn ghost" id="btnExport">내보내기</button>
    <button class="btn ghost" id="btnImport">불러오기</button>
    <input type="file" id="fileIn" accept="application/json" hidden>
  </footer>
</div>

<div id="print"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ══════════ 상수 ══════════ */
const KEY = 'kyeo.v1';
const DAY_START = 4;      // 새벽 4시에 하루가 바뀐다
const SHUTDOWN  = 17;     // 오후 5시 셧다운

const STAGES = [
  {k:'mp',   n:'1', t:'모닝페이지', when:'아침'},
  {k:'ms',   n:'2', t:'타이핑 · 출력', when:'아침'},
  {k:'walk', n:'3', t:'산책 · 숙성', when:'낮'},
  {k:'shut', n:'4', t:'닫기', when:'5시'},
  {k:'seed', n:'5', t:'씨앗', when:'밤'}
];

/* ══════════ 저장소 ══════════ */
let db = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const o = JSON.parse(raw); if(o && o.days) return o; }
  }catch(e){}
  return {days:{}, settings:{mpGoalWords:750, timer:38}};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ toast('저장하지 못했습니다. 브라우저 저장 공간을 확인해 주세요.'); }
}

function ymd(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayKey(){
  const t = new Date();
  if(t.getHours() < DAY_START) t.setDate(t.getDate()-1);
  return ymd(t);
}
function prevKeyOf(k){
  const [y,m,d] = k.split('-').map(Number);
  const t = new Date(y, m-1, d-1);
  return ymd(t);
}
function blankDay(k){
  return {date:k, stage:0,
    mp:{text:'', closed:false, sheets:0, byHand:false},
    ms:{text:'', closed:false, sheets:0, minutes:0},
    scraps:[], closedAt:null, seed:''};
}

/* 매일 아침 새 인스턴스 */
let TODAY = todayKey();
if(!db.days[TODAY]){ db.days[TODAY] = blankDay(TODAY); save(); }
let day = db.days[TODAY];

/* ══════════ 유틸 ══════════ */
const $ = s => document.querySelector(s);
const el = (t,c,x) => { const n=document.createElement(t); if(c)n.className=c; if(x!==undefined)n.textContent=x; return n; };
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sheetsFor(text, seed){
  return (text && text.trim()) ? layoutPages(text, seed || '').length : 0;
}
function nowClosedByClock(){
  const n = new Date();
  const h = n.getHours();
  return h >= SHUTDOWN || h < DAY_START;
}
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2400);
}

/* ══════════ 머리 · 시계 ══════════ */
const WD = ['일','월','화','수','목','금','토'];
function tick(){
  const n = new Date();

  // 날이 바뀌면 새 인스턴스
  const k = todayKey();
  if(k !== TODAY){
    TODAY = k;
    if(!db.days[TODAY]) db.days[TODAY] = blankDay(TODAY);
    day = db.days[TODAY]; save();
    stopTimer();
    renderAll();
    toast('새 하루가 열렸습니다. 1단계부터입니다.');
  }

  // 시간대에 따른 종이 색
  const h = n.getHours() + n.getMinutes()/60;
  let tone = 't-night';
  if(h >= DAY_START && h < 8) tone='t-dawn';
  else if(h >= 8 && h < 13) tone='t-day';
  else if(h >= 13 && h < SHUTDOWN) tone='t-after';
  else if(h >= SHUTDOWN && h < 20) tone='t-dusk';
  document.body.className = tone;

  $('#mClock').textContent =
    String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');

  const [Y,M,D] = TODAY.split('-').map(Number);
  const dd = new Date(Y,M-1,D);
  $('#mDate').textContent = `${M}월 ${D}일 ${WD[dd.getDay()]}요일`;

  const cd = $('#mCount');
  if(nowClosedByClock() || day.closedAt){
    cd.textContent = '창구 닫힘';
    cd.classList.add('closed');
  }else{
    const mins = (SHUTDOWN*60) - (n.getHours()*60 + n.getMinutes());
    cd.textContent = `닫기까지 ${Math.floor(mins/60)}시간 ${mins%60}분`;
    cd.classList.remove('closed');
  }

  $('#mDays').textContent = `쌓인 날 ${Object.keys(db.days).length}`;

  // 강제 셧다운
  if(nowClosedByClock() && day.stage < 3){
    day.stage = 3; save(); renderStage(); renderOrbit();
  }
}

/* ══════════ 궤도 ══════════ */
function stageDone(i){
  if(i===0) return day.mp.closed;
  if(i===1) return day.ms.closed;
  if(i===2) return day.stage > 2;
  if(i===3) return !!day.closedAt;
  if(i===4) return !!day.seed;
  return false;
}
let viewing = null; // 지나간 단계 열람
function renderOrbit(){
  const nav = $('#orbit'); nav.innerHTML='';
  STAGES.forEach((s,i)=>{
    const b = el('button');
    b.innerHTML = `<span class="n">${s.n} ${s.when}</span>${s.t}`;
    const cur = (viewing===null ? day.stage : viewing);
    if(i === cur) b.className = 'on';
    else if(stageDone(i)) b.className = 'done';
    b.disabled = i > day.stage;
    b.onclick = ()=>{ viewing = (i===day.stage ? null : i); renderStage(); renderOrbit(); };
    nav.appendChild(b);
  });
}

/* ══════════ 단계 ══════════ */
let saveT;
function autosave(){ clearTimeout(saveT); saveT = setTimeout(save, 400); }

function renderStage(){
  const i = (viewing===null ? day.stage : viewing);
  const host = $('#stage'); host.innerHTML='';
  const box = el('section','stage');
  ({0:sMorning,1:sTyping,2:sWalk,3:sShut,4:sSeed})[i](box, i !== day.stage);
  host.appendChild(box);
}

function confirmStep(box, which, hand){
  const old = box.querySelector('.inline-ask'); if(old) old.remove();
  const w = el('div','inline-ask');
  w.appendChild(el('span',null,
    hand        ? '노트에 손으로 썼습니다. 오늘 아침은 종이에서 끝냅니다.' :
    which==='mp'? '모닝페이지를 덮습니다. 다시 열 수 없습니다.' :
                  '원고를 종이로 들고 나갑니다. 화면에서는 잠깁니다.'));
  const b = el('button','btn seal','그렇게');
  b.onclick = ()=>{
    if(which==='mp'){
      day.mp.closed = true; day.mp.byHand = !!hand;
      day.stage = Math.max(day.stage, 1);
    }else{
      day.ms.closed = true;
      day.stage = Math.max(day.stage, 2);
    }
    viewing = null; save(); renderAll();
    toast(hand ? '노트로 끝냈습니다.' : (which==='mp' ? '덮었습니다.' : '들고 나가세요.'));
  };
  const s = el('button','btn ghost','아직');
  s.onclick = ()=> w.remove();
  w.append(b, s);
  box.appendChild(w);
  b.focus();
}

function closeDay(){
  const n = new Date();
  day.closedAt = String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  day.stage = Math.max(day.stage, 3);
  stopTimer();
  save(); viewing=null; renderAll();
}

const GRID_DAYS = 56;   // 여덟 주. 리듬이 보이면서 한 화면에 들어가는 길이

function stageDoneOf(d, i){
  if(i===0) return !!d.mp.closed;
  if(i===1) return !!d.ms.closed;
  if(i===2) return (d.stage||0) > 2;
  if(i===3) return !!d.closedAt;
  if(i===4) return !!d.seed;
  return false;
}
function stackOf(d){
  let n = 0;
  for(let i=0;i<5;i++) if(stageDoneOf(d,i)) n++;
  return n;
}
function renderGrid(){
  const track = $('#gDays'), scroll = $('#gScroll');

  const [ty,tm,td] = TODAY.split('-').map(Number);
  const end = new Date(ty, tm-1, td);
  let start = new Date(end); start.setDate(end.getDate() - (GRID_DAYS-1));
  const keys = Object.keys(db.days).sort();
  if(keys.length){                       // 첫 기록 이전은 그리지 않는다
    const [fy,fm,fd] = keys[0].split('-').map(Number);
    const first = new Date(fy, fm-1, fd);
    if(first > start) start = first;
  }

  const out = []; let full = 0;
  for(const d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    const k = ymd(d), rec = db.days[k];
    const n = rec ? stackOf(rec) : 0;
    if(n === 5) full++;
    let cells = '';
    for(let lv=5; lv>=1; lv--) cells += `<span class="c${n>=lv ? ' on s'+lv : ''}"></span>`;
    const cls = (k===TODAY ? ' today' : '') + (d.getDate()===1 ? ' first' : '');
    out.push(`<div class="gday${cls}">${cells}<em class="gdate">${d.getDate()}</em></div>`);
  }
  track.innerHTML = out.join('');
  scroll.scrollLeft = scroll.scrollWidth;   // 오늘이 오른쪽 끝

  $('#gKeys').innerHTML = STAGES.map((s,i)=>
    `<span class="lg"><i class="on s${i+1}" style="background:rgba(42,38,34,${[.80,.62,.46,.30,.16][i]});border-color:transparent"></i>${s.t.split(' ')[0]}</span>`
  ).join('');
  $('#gFull').textContent = full ? `다섯 칸 다 채운 날 ${full}` : '';
}

/* ══════════ 인쇄 조판 ══════════ */
/* A4 가로 297×210mm. 본문은 폭 고정 + 가운데 정렬이라
   프린터가 여백을 어떻게 잡든 좌우 손글씨 자리가 대칭으로 남는다. */
const PAGE_W = 297, BODY_H = 168;
const mm2px = mm => mm / 25.4 * 96;

function pset(){
  const s = db.settings;
  const pt = s.printPt || 13;
  const lh = s.printLh || 6;
  const w  = s.printW  || 140;
  return {pt, lh, w, side:(PAGE_W - w)/2, lines:Math.max(1, Math.floor(BODY_H/lh))};
}

const _cv = document.createElement('canvas').getContext('2d');
function wrapLines(text, widthMm, pt){
  _cv.font = `${pt}pt "Gowun Batang", serif`;
  const max = mm2px(widthMm) * 0.98;   // 서체 오차만큼 여유를 둔다
  const out = [];
  const put = (s, wrapped)=>{
    const t = s.replace(/\s+$/,'');
    out.push({t, wrapped, w: t ? _cv.measureText(t).width : 0});
  };
  String(text).replace(/\r/g,'').split('\n').forEach(para=>{
    if(!para){ out.push({t:'', wrapped:false, w:0}); return; }
    let line = '';
    for(const ch of para){
      const test = line + ch;
      if(line && _cv.measureText(test).width > max){
        // 알파벳 단어 한가운데는 자르지 않는다
        if(/[A-Za-z0-9]/.test(ch) && /[A-Za-z0-9]$/.test(line)){
          const sp = line.lastIndexOf(' ');
          if(sp > 0){ put(line.slice(0,sp), true); line = line.slice(sp+1) + ch; continue; }
        }
        put(line, true);
        line = (ch === ' ') ? '' : ch;
      }else line = test;
    }
    put(line, false);   // 문단의 마지막 줄은 늘이지 않는다
  });
  return out;
}

function layoutPages(text, seedText){
  const p = pset();
  let lines = [];
  if(seedText){
    lines = lines.concat(wrapLines('씨앗 · ' + seedText, p.w, p.pt).map(l=>({...l, seed:true})));
    lines.push({t:'', wrapped:false, w:0, seed:false});
  }
  lines = lines.concat(wrapLines(text||'', p.w, p.pt).map(l=>({...l, seed:false})));
  const pages = [];
  for(let i=0;i<lines.length;i+=p.lines) pages.push(lines.slice(i,i+p.lines));
  if(!pages.length) pages.push([]);
  return pages;
}

function doPrint(which){
  const p = $('#print'), cfg = pset();
  const [Y,M,D] = TODAY.split('-').map(Number);
  const dd = new Date(Y,M-1,D);
  const dstr = `${Y}년 ${M}월 ${D}일 ${WD[dd.getDay()]}요일`;
  const tag = which==='mp' ? '모닝페이지' : '원고';
  const prev = db.days[prevKeyOf(TODAY)];
  const seed = (which==='ms' && prev && prev.seed) ? prev.seed : '';
  const pages = layoutPages(which==='mp' ? day.mp.text : day.ms.text, seed);

  // 좌우 정렬: 넘겨서 끊긴 줄만 자간을 벌려 오른쪽 끝을 맞춘다.
  // 폭에 꼭 맞추면 마지막 글자가 다음 줄로 흘러내리므로 1.5px 여유를 둔다.
  const target = mm2px(cfg.w) - 1.5;
  const justify = l => {
    const n = [...l.t].length;
    if(!l.wrapped || n < 2 || !l.w || l.w >= target) return '';
    const ls = (target - l.w) / n;
    if(ls <= 0 || ls > mm2px(cfg.w)/n) return '';
    return ` style="letter-spacing:${ls.toFixed(3)}px"`;
  };

  p.innerHTML = pages.map((lines,i)=>`
    <div class="pg">
      <div class="pg-head"><span class="tag">${tag}</span>${dstr} ${i+1}/${pages.length}</div>
      <div class="pg-body">${
        lines.map(l=>`<div class="ln${l.seed?' seed':''}"${justify(l)}>${esc(l.t) || '&nbsp;'}</div>`).join('')
      }</div>
    </div>`).join('');

  p.style.setProperty('--pfs', cfg.pt+'pt');
  p.style.setProperty('--plh', cfg.lh+'mm');
  p.style.setProperty('--pw', cfg.w+'mm');
  window.print();
}

/* ══════════ 인쇄 설정 ══════════ */
const pnote = el('div','pnote');
document.querySelector('footer.tools').appendChild(pnote);

function fillSel(id, key, vals, suffix, def){
  const sel = $('#'+id);
  if(!db.settings[key]) db.settings[key] = def;
  vals.forEach(v=>{
    const o = document.createElement('option');
    o.value = v; o.textContent = v + suffix;
    if(v === db.settings[key]) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = ()=>{
    db.settings[key] = parseFloat(sel.value);
    save(); paintPnote(); renderStage();
  };
}
function paintPnote(){
  const c = pset();
  pnote.textContent =
    `가로 A4 · 본문 ${c.w}mm 가운데 · 한 면 ${c.lines}줄 · 좌우 손글씨 여백 각 ${c.side.toFixed(1)}mm`;
}
fillSel('ptSel','printPt',[11,12,13,14,15,16],'pt',13);
fillSel('lhSel','printLh',[5,5.5,6,6.5,7,8,9],'mm',6);
fillSel('pwSel','printW',[110,120,130,140,150,160,180],'mm',140);
paintPnote();

/* ══════════ 내보내기 · 불러오기 ══════════ */
$('#btnExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `haru_${TODAY}.json`;
  a.click(); URL.revokeObjectURL(a.href);
};
$('#btnImport').onclick = ()=> $('#fileIn').click();
$('#fileIn').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(r.result);
      if(!o.days) throw 0;
      db = o;
      if(!db.settings) db.settings = {mpGoalWords:750, timer:38};
      if(!db.days[TODAY]) db.days[TODAY] = blankDay(TODAY);
      day = db.days[TODAY];
      save(); renderAll(); toast('불러왔습니다.');
    }catch(err){ toast('읽을 수 없는 파일입니다.'); }
  };
  r.readAsText(f);
  e.target.value='';
};

/* ══════════ 실행 ══════════ */
function renderAll(){ renderOrbit(); renderStage(); renderGrid(); renderArchive(); }
tick(); renderAll();
/* 본문 서체가 실제로 로드된 뒤에 장수를 다시 센다 */
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=>{ paintPnote(); renderStage(); });
}
setInterval(tick, 15000);
window.addEventListener('beforeunload', save);
</script>
</body>
</html>
