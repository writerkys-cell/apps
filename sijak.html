<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>시작</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="시작">
<meta name="theme-color" content="#f2ede1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2ede1; --paper-2:#e8e0cf; --ink:#23201c; --ink-soft:#736a59; --faint:#a39a88; --line:#d6ccb6;
  --seal:#9b3b32; --seal-faint:#efd9d2; --deep:#3f5566; --deep-faint:#d9dfe3; --gold:#b8904a;
  --serif:'Gowun Batang',AppleMyungjo,"Apple SD Gothic Neo",Batang,serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
a{color:inherit;text-decoration:none}

/* ── 머리 ── */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:16px 20px 0}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:10px}
.brand h1{margin:0;font-size:22px;letter-spacing:.3em;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block;transform:translateY(-3px)}
.dot.ok{background:#6f8a5c}.dot.busy{background:var(--gold)}.dot.err{background:var(--seal)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{border-bottom:2px solid transparent;padding:6px 11px 9px;color:var(--ink-soft);font-size:15px;letter-spacing:.04em}
nav button.on{color:var(--ink);border-bottom-color:var(--seal)}
main{max-width:720px;margin:0 auto;padding:26px 20px 110px}
section[data-v]{display:none}
section[data-v].on{display:block}

/* ── 오늘 ── */
.day{margin:4px 0 26px}
.day .d{font-size:34px;line-height:1.25;letter-spacing:.04em}
.day .w{font-size:15px;color:var(--ink-soft);margin-left:10px;letter-spacing:.1em}
.day .mp{display:block;margin-top:6px;font-size:14px;color:var(--ink-soft)}
.day .mp button{color:var(--deep);border-bottom:1px solid var(--deep)}

.strip{display:block;border-top:1px solid var(--line);padding:22px 2px 24px;position:relative}
.strip:last-of-type{border-bottom:1px solid var(--line)}
a.strip:hover{background:rgba(155,59,50,.035)}
.strip-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.strip-name{font-size:20px;letter-spacing:.24em}
.strip-num{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.strip-num .of{color:var(--ink-soft);font-size:14px}
.gauge{position:relative;height:5px;background:var(--paper-2);margin:14px 0 10px;overflow:hidden;border-radius:1px}
.gauge i{position:absolute;top:0;bottom:0;left:0;display:block}
.gauge .done{background:var(--seal)}
.gauge .run{background:repeating-linear-gradient(90deg,var(--seal) 0 3px,transparent 3px 6px);opacity:.55}
.strip.met .gauge .done{background:var(--ink)}
.strip-sub{font-size:14px;color:var(--ink-soft);min-height:1.6em}
.strip-sub .live{color:var(--seal)}
.stamp{position:absolute;right:-6px;top:10px;width:46px;height:46px;border:2px solid var(--seal);border-radius:50%;
  color:var(--seal);font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:.05em;
  transform:rotate(-12deg);opacity:.82;pointer-events:none;background:rgba(242,237,225,.7)}
.strip.met .strip-num{padding-right:52px}

.todo{list-style:none;margin:12px 0 0;padding:0}
.todo li a{display:grid;grid-template-columns:3.2em 1fr auto;gap:10px;align-items:baseline;padding:8px 2px;border-bottom:1px dotted var(--line)}
.todo li:last-child a{border-bottom:none}
.todo li a:hover{background:rgba(155,59,50,.035)}
.todo .k{font-size:12.5px;color:var(--ink-soft);letter-spacing:.08em}
.todo .t{font-size:16.5px;line-height:1.5}
.todo .m{font-size:13px;color:var(--ink-soft);white-space:nowrap}
.todo .m.due{color:var(--seal)}
.todo li.now .k{color:var(--seal)}
.todo li.now .t{font-size:18px}
.more{font-size:13.5px;color:var(--ink-soft);margin-top:8px}
.empty{font-size:14.5px;color:var(--ink-soft)}
.err{font-size:13.5px;color:var(--seal)}
.linkish{color:var(--seal);border-bottom:1px solid var(--seal)}
.foot{font-size:12.5px;color:var(--faint);margin-top:18px}

/* ── 모닝페이지 ── */
.horizon{position:relative;height:3px;background:var(--line);border-radius:2px;margin:0 0 28px;overflow:hidden}
.horizon .sun{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,var(--deep) 0%,#8496b3 70%,#c8a15a 100%);transition:width .4s ease}
.horizon.done .sun{background:linear-gradient(90deg,#c8a15a,#d9b35e)}
.datehead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.datehead h2{font-size:21px;font-weight:700;margin:0;letter-spacing:.02em}
.datehead .sub{font-size:13px;color:var(--ink-soft)}
.pages{display:flex;gap:8px;align-items:center;margin:14px 0 20px}
.page{width:22px;height:30px;border:1px solid var(--line);border-radius:2px;
  background:linear-gradient(to top,var(--deep-faint) var(--fill,0%),transparent var(--fill,0%))}
.page.full{border-color:var(--deep);background:var(--deep)}
.pages .count{font-size:13px;color:var(--ink-soft);margin-left:6px}
.pages .count b{color:var(--ink)}
.mpnote{font-size:13.5px;color:var(--seal);margin:-8px 0 14px}
textarea#editor{width:100%;min-height:55vh;resize:vertical;border:none;background:transparent;color:var(--ink);
  font-size:17px;line-height:2.05;padding:4px 0}
textarea#editor:focus-visible{outline:none}
textarea#editor::placeholder{color:#b4ad9c}
.statusline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.doneNote{display:none;margin:24px 0 8px;padding:16px 20px;border-left:3px solid #c8a15a;background:var(--paper-2);font-size:15px;color:var(--ink-soft)}
.doneNote.show{display:block}
.doneNote b{color:var(--ink)}
.doneNote .row{margin-top:10px;display:flex;gap:18px;flex-wrap:wrap}
.doneNote button{font-size:14px;color:var(--deep);border-bottom:1px solid var(--deep)}

/* ── 하루 정리 ── */
.navx{display:flex;align-items:center;justify-content:space-between;margin:0 0 26px}
.navx button.arrow{font-size:20px;line-height:1;padding:8px 14px;color:var(--ink-soft);border:1px solid var(--line);border-radius:2px;background:var(--paper-2)}
.navx button.arrow:disabled{opacity:.3;cursor:default}
.navmid{text-align:center}
.navmid .ago{font-size:12.5px;letter-spacing:.2em;color:var(--seal)}
.navmid h2{font-size:19px;margin:0}
select#dateJump{font-size:12.5px;color:var(--ink-soft);background:transparent;border:none;border-bottom:1px solid var(--line);margin-top:4px;max-width:200px}
.entryBody{font-size:16.5px;line-height:2.1;white-space:pre-wrap;word-break:break-word}
.entryBody .anchor{background:var(--seal-faint);border-bottom:1px solid var(--seal);cursor:pointer}
.entryBody .note{color:var(--seal);font-size:14.5px;white-space:normal}
.entryBody .note .ndate{font-size:11.5px;opacity:.75}
.entryBody .note .ndel{font-size:11.5px;color:var(--faint);margin-left:6px;border-bottom:1px dotted var(--faint)}
.emptyDay{padding:56px 0;text-align:center;color:var(--ink-soft);font-size:14.5px;line-height:2}
.emptyDay button{color:var(--deep);border-bottom:1px solid var(--deep);font-size:14px}
.archMeta{font-size:12.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:10px;margin-top:34px}
#annPop{position:absolute;display:none;z-index:30;background:var(--ink);color:var(--paper);font-size:13px;padding:6px 12px;border-radius:2px}
#annPop button{color:var(--paper)}
#annBox{display:none;position:fixed;inset:0;z-index:40;background:rgba(35,32,28,.35);align-items:center;justify-content:center;padding:20px}
#annBox.show{display:flex}
#annBox .card{background:var(--paper);width:100%;max-width:520px;padding:24px 26px;border-top:3px solid var(--seal);box-shadow:0 12px 40px rgba(0,0,0,.18)}
#annBox .quoted{font-size:14px;color:var(--ink-soft);border-left:2px solid var(--line);padding-left:12px;margin-bottom:14px;max-height:90px;overflow:auto}
#annBox textarea{width:100%;min-height:90px;resize:vertical;font-size:15px;line-height:1.9;color:var(--seal);background:transparent;border:1px solid var(--line);border-radius:2px;padding:10px 12px}
#annBox .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px}
#annBox .row .today{color:var(--faint)}
#annBox .btns button{padding:7px 16px;border-radius:2px}
#annBox .btns .save{background:var(--seal);color:#fff}
#annBox .btns .cancel{color:var(--ink-soft);margin-right:6px}

/* ── 설정 ── */
.set h3{font-size:16px;font-weight:700;margin:30px 0 8px;letter-spacing:.06em}
.set h3:first-child{margin-top:0}
.set .note{font-size:13.5px;color:var(--ink-soft);line-height:1.8;margin:0 0 10px}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:3px}
.field input{width:100%;background:#f8f5ec;border:1px solid var(--line);border-radius:2px;padding:8px 10px;font-size:15px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--ink-soft);border-radius:2px;padding:7px 14px;font-size:14px}
.btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
pre.sql{background:var(--paper-2);border:1px solid var(--line);padding:12px;font-size:12px;line-height:1.5;overflow-x:auto;white-space:pre}
.probe{font-size:13px;color:var(--ink-soft);white-space:pre-wrap;margin-top:8px}

#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:var(--paper);font-size:13.5px;padding:10px 18px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){
  .top{padding:12px 14px 0} main{padding:20px 16px 100px}
  .day .d{font-size:28px} .strip-name{font-size:18px} textarea#editor{font-size:16px}
  nav button{padding:6px 8px 9px;font-size:14.5px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><h1>시작</h1><span class="dot" id="dot" title=""></span></div>
  <nav id="nav">
    <button data-go="today">오늘</button>
    <button data-go="morning">모닝페이지</button>
    <button data-go="close">하루 정리</button>
    <button data-go="set">설정</button>
  </nav>
</div></header>

<main>
  <!-- 오늘 -->
  <section data-v="today">
    <div class="day"><span class="d" id="dayD"></span><span class="w" id="dayW"></span><span class="mp" id="dayMp"></span></div>
    <a class="strip" id="stripW" target="sijak_write" rel="opener"></a>
    <a class="strip" id="stripR" target="sijak_read" rel="opener"></a>
    <div class="strip" id="stripT"></div>
    <p class="foot" id="foot"></p>
  </section>

  <!-- 모닝페이지 -->
  <section data-v="morning">
    <div class="horizon" id="horizon"><div class="sun" id="sun"></div></div>
    <div class="datehead"><h2 id="mpDate"></h2><span class="sub">아침의 세 쪽</span></div>
    <div class="pages">
      <div class="page"></div><div class="page"></div><div class="page"></div>
      <span class="count"><b id="wc">0</b> / 750 단어</span>
    </div>
    <p class="mpnote" id="mpNote" hidden></p>
    <textarea id="editor" placeholder="생각하지 말고, 멈추지 말고, 그냥 쓰세요." spellcheck="false"></textarea>
    <div class="doneNote" id="doneNote">
      <b>오늘 세 쪽을 채웠습니다.</b> 750단어를 넘겼으니 손을 놓아도 좋습니다.
      <div class="row"><button id="toToday">오늘 할 일 보기</button></div>
    </div>
    <div class="statusline"><span id="saveStat">아직 쓴 것이 없습니다</span><span id="charStat"></span></div>
  </section>

  <!-- 하루 정리 -->
  <section data-v="close">
    <div class="navx">
      <button class="arrow" id="navOlder" title="한 달 더 이전">←</button>
      <div class="navmid">
        <div class="ago" id="agoLabel"></div>
        <h2 id="archDate"></h2>
        <select id="dateJump" title="저장된 다른 날짜로 이동"></select>
      </div>
      <button class="arrow" id="navNewer" title="한 달 더 최근">→</button>
    </div>
    <div id="entryHost"></div>
    <div class="archMeta" id="archMeta"></div>
  </section>

  <!-- 설정 -->
  <section data-v="set" class="set" id="setHost"></section>
</main>

<div id="annPop"><button id="annPopBtn">붉은 주석 달기</button></div>
<div id="annBox" role="dialog" aria-modal="true">
  <div class="card">
    <div class="quoted" id="annQuoted"></div>
    <textarea id="annText" placeholder="그때의 문장에게, 지금의 내가."></textarea>
    <div class="row">
      <span class="today" id="annToday"></span>
      <span class="btns"><button class="cancel" id="annCancel">취소</button><button class="save" id="annSave">주석 저장</button></span>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ═════════ 시작 ═════════
   글쓰기(보태기)·독서(서가)·할 일(미래)의 오늘 상태를 읽기만 하고,
   모닝페이지(아침 쓰기와 저녁의 하루 정리)만 스스로 적는다.
   하루는 새벽 4시에 바뀐다. */

const DAY_H = 4;
const GOAL_WORDS = 750;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['일','월','화','수','목','금','토'];
function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayKey(t){ return keyOf(new Date((t==null?Date.now():t) - DAY_H*3600000)); }
function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function dayRange(k){ const d=parseKey(k); return [new Date(d.getFullYear(),d.getMonth(),d.getDate(),DAY_H), new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,DAY_H)]; }
function fmtLong(d){ return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'; }
function fmtShort(d){ return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.'; }
function fmtMin(n){ n=Math.max(0,Math.round(n)); if(n<60) return n+'분'; return Math.floor(n/60)+'시간'+(n%60?' '+(n%60)+'분':''); }
function daysBetween(a,b){ return Math.round((parseKey(b)-parseKey(a))/86400000); }
function countWords(t){ const m=String(t||'').trim().match(/\S+/g); return m?m.length:0; }
let toastT; function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2800); }
function lsGet(k,fb){ try{ const v=localStorage.getItem(k); return v==null?fb:JSON.parse(v); }catch(e){ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

const isTouch = /iPhone|iPad|Android/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints>1);
function myDevice(){
  const s=lsGet('sijak.device',''); if(s) return s;
  const u=navigator.userAgent;
  if(/iPhone/.test(u)) return '아이폰';
  if(/iPad/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)) return '아이패드';
  if(/Macintosh/.test(u)) return '맥북';
  return '이 기기';
}

/* ─────────── 설정 ─────────── */
const CFG_KEY='sijak.cfg';
const DEF_LINKS={ write:'./botaegi.html', writePhone:'./botaegi-phone.html', read:'./seoga.html#read', todo:'./mirae.html' };
let cfg = Object.assign({ bt:{url:'',key:''}, mr:{url:'',key:''}, links:Object.assign({},DEF_LINKS) }, lsGet(CFG_KEY,{}));
cfg.links = Object.assign({}, DEF_LINKS, cfg.links||{});
let autoNote = '';
/* 같은 주소 아래의 다른 앱이 이 기기에 남긴 연결 정보를 빌려 온다(비어 있을 때만) */
(function borrow(){
  const got=[];
  if(!cfg.mr.url||!cfg.mr.key){
    const s=lsGet('seoga.sb',null);
    let u='',k='';
    if(s&&s.url&&s.key){ u=s.url; k=s.key; }
    else { try{ u=localStorage.getItem('mirae.url')||''; k=localStorage.getItem('mirae.key')||''; }catch(e){} }
    if(u&&k){ cfg.mr={url:u,key:k}; got.push('미래·서가'); }
  }
  if(!cfg.bt.url||!cfg.bt.key){
    const b=lsGet('botaegi-v1',null);
    if(b&&b.sbUrl&&b.sbKey){ cfg.bt={url:b.sbUrl,key:b.sbKey}; got.push('보태기'); }
  }
  if(got.length){ lsSet(CFG_KEY,cfg); autoNote='이 기기의 '+got.join('와 ')+' 설정에서 연결 정보를 찾아 넣었습니다.'; }
})();
function saveCfg(){ lsSet(CFG_KEY,cfg); }
const btOn=()=>!!(cfg.bt.url&&cfg.bt.key), mrOn=()=>!!(cfg.mr.url&&cfg.mr.key);

/* ─────────── Supabase REST ─────────── */
async function rest(p, path, opt){
  opt=opt||{};
  const r=await fetch(p.url.replace(/\/+$/,'')+'/rest/v1/'+path,{
    method:opt.method||'GET', body:opt.body,
    headers:Object.assign({apikey:p.key, Authorization:'Bearer '+p.key, 'Content-Type':'application/json'}, opt.headers||{})
  });
  const t=await r.text();
  if(!r.ok){ let m=t; try{ const j=JSON.parse(t); m=j.message||j.hint||t; }catch(e){} const er=new Error(m||('HTTP '+r.status)); er.status=r.status; er.body=t; throw er; }
  return t?JSON.parse(t):null;
}
const enc=encodeURIComponent;
function upsert(p, table, rows){
  return rest(p, table, {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(rows)});
}
function missingTable(e){ return e && (e.status===404 || /does not exist|schema cache|Could not find the table/i.test(e.message||'')); }

/* ─────────── 상태 표시 ─────────── */
let dotState={};
function setDot(part,state,msg){
  dotState[part]={state,msg};
  const vals=Object.values(dotState);
  const d=$('dot');
  d.className='dot '+(vals.some(v=>v.state==='err')?'err':vals.some(v=>v.state==='busy')?'busy':vals.length?'ok':'');
  d.title=vals.filter(v=>v.msg).map(v=>v.msg).join(' / ');
}

/* ═════════ 오늘 — 세 가지를 읽어 온다 ═════════ */
let W=null, R=null, T=null;   /* 마지막으로 읽은 결과 */
let Werr='', Rerr='', Terr='';

async function loadWrite(k){
  if(!btOn()){ W=null; Werr='setup'; return; }
  const [s,e]=dayRange(k);
  try{
    const [rows,kv]=await Promise.all([
      rest(cfg.bt,'botaegi_sessions?select=type,start_at,end_at,ms_title&start_at=gte.'+enc(s.toISOString())+'&start_at=lt.'+enc(e.toISOString())),
      rest(cfg.bt,'botaegi_kv?select=id,data&id=in.(now,conf)')
    ]);
    let ms=0;
    (rows||[]).forEach(r=>{ if(/^(focus|ty)/.test(r.type||'')){ const a=Date.parse(r.start_at), b=Date.parse(r.end_at); if(b>a) ms+=b-a; } });
    const now=(kv||[]).find(x=>x.id==='now'), conf=(kv||[]).find(x=>x.id==='conf');
    const c=conf&&conf.data||{};
    const goal=(c.goalH!=null||c.goalM!=null)? ((+c.goalH||0)*60+(+c.goalM||0)) : null;
    W={min:ms/60000, goal, goalKnown:goal!=null, now:now&&now.data||null, at:Date.now()};
    Werr='';
  }catch(er){ Werr=er.message||'불러오지 못했습니다'; }
}
function writeRunning(){
  const d=W&&W.now; if(!d) return null;
  const t=Date.now(), [s]=dayRange(dayKey());
  if(d.phase==='focus' && t<d.ends_at && d.start>=s.getTime()) return {min:(t-d.start)/60000, label:'몰입 중', title:d.ms_title};
  if(d.phase==='type' && d.start){ const left=(d.cap||0)-(d.used||0), el=t-d.start; if(el<left && d.start>=s.getTime()) return {min:el/60000, label:'타이핑 중', title:d.ms_title}; }
  if(d.phase==='pause') return {min:0, label:'타이핑을 멈춰 둠', title:d.ms_title};
  return null;
}

async function loadRead(k){
  if(!mrOn()){ R=null; Rerr='setup'; return; }
  try{
    const [rows,meta]=await Promise.all([
      rest(cfg.mr,'seoga_reads?select=data&data->>kind=eq.read&data->>date=eq.'+enc(k)),
      rest(cfg.mr,'seoga_meta?select=id,data&id=in.(active,settings)')
    ]);
    let min=0; const titles=[];
    (rows||[]).forEach(r=>{ const d=r.data||{}; if(d.gone) return; min+=(+d.minutes||0); if(d.title&&!titles.includes(d.title)) titles.push(d.title); });
    const act=(meta||[]).find(x=>x.id==='active'), st=(meta||[]).find(x=>x.id==='settings');
    R={min, titles, goal:(st&&st.data&&+st.data.target)||120, active:act&&act.data&&act.data.active||null};
    Rerr='';
  }catch(er){ Rerr=missingTable(er)?'Supabase에 서가 표가 없습니다. 서가에서 동기화를 먼저 켜세요.':(er.message||'불러오지 못했습니다'); }
}
function readRunning(){
  const a=R&&R.active; if(!a) return null;
  if(a.closing) return {min:0, label:(a.device&&a.device!==myDevice()?a.device+'에서 ':'')+'읽기를 끝냄 · 쪽을 적어야 합니다', title:a.title};
  const [s]=dayRange(dayKey());
  if(a.startedAt && a.startedAt>=s.getTime()) return {min:(Date.now()-a.startedAt)/60000, label:(a.device&&a.device!==myDevice()?a.device+'에서 ':'')+'읽는 중', title:a.title};
  return {min:0, label:(a.device?a.device+'에서 ':'')+'어제부터 읽는 중', title:a.title};
}

async function loadTodo(k){
  if(!mrOn()){ T=null; Terr='setup'; return; }
  try{
    const [rows,stt]=await Promise.all([
      rest(cfg.mr,'items?select=data&data->>status=eq.open'),
      rest(cfg.mr,'app_state?select=data&id=eq.1')
    ]);
    const items=(rows||[]).map(r=>r.data).filter(x=>x&&x.id&&!x.probe);
    const as=(stt&&stt[0]&&stt[0].data)||{};
    const cur=as.currentId?items.find(i=>i.id===as.currentId):null;
    const dailies=items.filter(i=>i.kind==='daily' && i!==cur && !(i.dailyDone||[]).includes(k));
    const dues=items.filter(i=>i.kind!=='daily'&&i.kind!=='future'&&i!==cur&&i.deadline&&daysBetween(k,i.deadline)<=7)
      .sort((a,b)=>a.deadline.localeCompare(b.deadline));
    const shown=new Set([cur,...dailies,...dues].filter(Boolean).map(i=>i.id));
    const rest_=items.filter(i=>i.kind!=='future'&&!shown.has(i.id)&&!(i.kind==='daily'&&(i.dailyDone||[]).includes(k))).length;
    T={cur, curAt:as.startedAt, curDev:as.device, dailies, dues, rest:rest_};
    Terr='';
  }catch(er){ Terr=missingTable(er)?'Supabase에 미래 표가 없습니다.':(er.message||'불러오지 못했습니다'); }
}

/* ═════════ 모닝페이지 ═════════ */
const MP_KEY='sijak.mp';
let MP=Object.assign({entries:{}, dirty:{}, since:'', soundOn:true}, lsGet(MP_KEY,{}));
if(!MP.entries) MP.entries={}; if(!MP.dirty) MP.dirty={};
function mpPersist(){ lsSet(MP_KEY,MP); }
function touchEntry(k){ const e=MP.entries[k]; e.updatedAt=new Date().toISOString(); e.device=myDevice(); MP.dirty[k]=1; mpPersist(); queuePush(); }

let pushT=null, pushing=false, mpTableMissing=false;
function queuePush(){ clearTimeout(pushT); pushT=setTimeout(pushMP,1200); }
async function pushMP(){
  if(!mrOn()||pushing) return;
  const ks=Object.keys(MP.dirty); if(!ks.length) return;
  pushing=true; setDot('mp','busy','모닝페이지 올리는 중');
  try{
    for(let i=0;i<ks.length;i+=100){
      const part=ks.slice(i,i+100);
      await upsert(cfg.mr,'mp_entries',part.map(k=>({id:k, data:MP.entries[k], updated_at:MP.entries[k].updatedAt||new Date().toISOString()})));
      part.forEach(k=>{ if(MP.entries[k]&&MP.dirty[k]) delete MP.dirty[k]; });
      mpPersist();
    }
    mpTableMissing=false; setDot('mp','ok','');
    stamp('저장·동기화됨');
  }catch(er){
    mpTableMissing=missingTable(er);
    setDot('mp','err', mpTableMissing?'Supabase에 모닝페이지 표가 없습니다 · 설정에서 SQL을 실행하세요':'모닝페이지를 올리지 못했습니다 · '+er.message);
    stamp(mpTableMissing?'이 기기에만 저장됨 · 설정에서 표를 만드세요':'이 기기에만 저장됨 · 연결되면 올립니다');
  }
  pushing=false;
  if(Object.keys(MP.dirty).length && !mpTableMissing) queuePush();
}
/* 더 나중에 고친 쪽이 이긴다. 이 기기에서 아직 못 올린 것은 덮지 않는다. */
async function pullMP(full){
  if(!mrOn()) return;
  try{
    let q='mp_entries?select=id,data,updated_at&order=updated_at.asc';
    if(!full && MP.since){ const s=new Date(Date.parse(MP.since)-10*60000).toISOString(); q+='&updated_at=gte.'+enc(s); }
    let off=0, max=MP.since||'', changed=[];
    for(;;){
      const rows=await rest(cfg.mr,q+'&limit=500&offset='+off);
      (rows||[]).forEach(r=>{
        if(r.updated_at>max) max=r.updated_at;
        const loc=MP.entries[r.id], rem=r.data||{};
        if(MP.dirty[r.id]) return;
        if(!loc || (rem.updatedAt||'')>(loc.updatedAt||'')){ MP.entries[r.id]=rem; changed.push(r.id); }
      });
      if(!rows||rows.length<500) break; off+=500;
    }
    MP.since=max; mpPersist(); mpTableMissing=false;
    if(Object.keys(MP.dirty).length) queuePush();
    return changed;
  }catch(er){
    mpTableMissing=missingTable(er);
    setDot('mp','err', mpTableMissing?'Supabase에 모닝페이지 표가 없습니다 · 설정에서 SQL을 실행하세요':'모닝페이지를 받지 못했습니다');
    return [];
  }
}

/* 예전 모닝페이지 앱(같은 주소, morningpages_v1)에서 가져오기: 없는 날은 더하고, 있는 날은 주석을 합친다 */
function mergeOld(data){
  if(!data||!data.entries) return 0;
  let n=0;
  Object.keys(data.entries).forEach(k=>{
    const o=data.entries[k]; if(!o||!(o.text||'').trim()) return;
    const c=MP.entries[k];
    if(!c){ MP.entries[k]={text:o.text, words:countWords(o.text), completedAt:o.completedAt||null, annotations:(o.annotations||[]).slice(), updatedAt:o.updatedAt||new Date(parseKey(k).getTime()+12*3600000).toISOString(), device:'맥북', from:'모닝페이지'}; MP.dirty[k]=1; n++; return; }
    let ch=false;
    if((o.text||'').length>(c.text||'').length && (o.updatedAt||'')>=(c.updatedAt||'')){ c.text=o.text; c.words=countWords(o.text); ch=true; }
    const have=new Set((c.annotations||[]).map(a=>a.id));
    (o.annotations||[]).forEach(a=>{ if(!have.has(a.id)){ (c.annotations=c.annotations||[]).push(a); ch=true; } });
    if(ch){ c.updatedAt=new Date().toISOString(); MP.dirty[k]=1; n++; }
  });
  mpPersist(); queuePush();
  return n;
}
(function autoImport(){
  if(lsGet('sijak.mpImported',false)) return;
  const old=lsGet('morningpages_v1',null);
  if(old&&old.entries&&Object.keys(old.entries).length){
    const n=mergeOld(old);
    lsSet('sijak.mpImported',true);
    if(typeof old.soundOn==='boolean'){ MP.soundOn=old.soundOn; mpPersist(); }
    if(n) setTimeout(()=>toast('예전 모닝페이지 '+n+'일치를 옮겨 왔습니다'),600);
  }
})();

function mpProgress(live){

  $('wc').textContent=n;
  $('charStat').textContent=editor.value.length?editor.value.length.toLocaleString()+'자':'';
  $('sun').style.width=Math.min(n/GOAL_WORDS,1)*100+'%';

  document.querySelectorAll('.page').forEach((p,i)=>{ const seg=Math.max(0,Math.min(1,(n-i*250)/250)); p.style.setProperty('--fill',seg*100+'%'); p.classList.toggle('full',seg>=1); });
  const done=n>=GOAL_WORDS;

function chime(){
  if(MP.soundOn===false) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [[523.25,0],[783.99,.28]].forEach(([f,t])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,ctx.currentTime+t);
      g.gain.linearRampToValueAtTime(.18,ctx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+1.4);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+1.5);
    });
  }catch(e){}
}
$('toToday').onclick=()=>go('today');

/* ═════════ 하루 정리 — 지난 모닝페이지에 붉은 주석 ═════════ */
let agoN=1, anchorDay=parseKey(dayKey()).getDate(), curKey=null;
function agoText(n){ return n===12?'1년 전':(n>12?Math.floor(n/12)+'년 '+(n%12?n%12+'개월 ':'')+'전':n+'개월 전'); }
function monthsBack(base,n){ const d=new Date(base.getFullYear(),base.getMonth()-n,1); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(base.getDate(),last)); return d; }
function hasText(k){ const e=MP.entries[k]; return e&&e.text&&e.text.trim(); }
function renderClose(){
  const today=parseKey(dayKey());
  const lastOf=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();
  const base=new Date(today.getFullYear(),today.getMonth(),Math.min(anchorDay,lastOf));
  const d=monthsBack(base,agoN);
  curKey=keyOf(d);
  $('agoLabel').textContent=agoText(agoN);
  $('archDate').textContent=fmtLong(d);
  $('navNewer').disabled=agoN<=1;
  buildJump();
  const host=$('entryHost');
  if(!hasText(curKey)){
    const near=nearestBefore(curKey);
    host.innerHTML=`<div class="emptyDay">이 날의 모닝페이지는 없습니다.<br><br>${near?`<button id="nearBtn">가장 가까운 기록으로 · ${near}</button>`:''}</div>`;
    if(near) $('nearBtn').onclick=()=>jumpTo(near);
    $('archMeta').textContent=''; return;
  }
  renderEntry(host,curKey);
}
function nearestBefore(k){ const t=dayKey(); const ks=Object.keys(MP.entries).filter(x=>x<k&&x!==t&&hasText(x)).sort(); return ks.length?ks[ks.length-1]:null; }
function buildJump(){
  const sel=$('dateJump'), t=dayKey();
  const ks=Object.keys(MP.entries).filter(k=>k!==t&&hasText(k)).sort().reverse();
  sel.innerHTML='<option value="">저장된 날짜로 이동…</option>'+ks.map(k=>{ const e=MP.entries[k], an=(e.annotations||[]).length;
    return `<option value="${k}"${k===curKey?' selected':''}>${k} (${an?'주석 '+an:(e.words||countWords(e.text))+'단어'})</option>`; }).join('');
  sel.onchange=()=>{ if(sel.value) jumpTo(sel.value); };
}
function jumpTo(k){
  const d=parseKey(k), today=parseKey(dayKey());
  agoN=Math.max(1,(today.getFullYear()-d.getFullYear())*12+(today.getMonth()-d.getMonth()));
  anchorDay=d.getDate(); curKey=k; renderDirect(k);
}
function renderDirect(k){
  const d=parseKey(k), today=parseKey(dayKey());
  $('agoLabel').textContent=agoText(Math.max(1,(today.getFullYear()-d.getFullYear())*12+(today.getMonth()-d.getMonth())));
  $('archDate').textContent=fmtLong(d);
  $('navNewer').disabled=false;
  buildJump();
  renderEntry($('entryHost'),k);
}
function renderEntry(host,k){
  const e=MP.entries[k];
  host.innerHTML='';
  const body=document.createElement('div'); body.className='entryBody'; body.dataset.key=k;
  const text=e.text, anns=(e.annotations||[]).slice().sort((a,b)=>a.start-b.start);
  let pos=0;
  anns.forEach(a=>{
    if(a.start>pos) body.appendChild(document.createTextNode(text.slice(pos,a.start)));
    const an=document.createElement('span'); an.className='anchor'; an.textContent=text.slice(a.start,a.end); body.appendChild(an);
    const note=document.createElement('span'); note.className='note'; note.contentEditable='false';
    const nd=document.createElement('span'); nd.className='ndate'; nd.textContent=' 〔'+a.date+'〕 '; note.appendChild(nd);
    note.appendChild(document.createTextNode(a.note+' '));
    const del=document.createElement('button'); del.className='ndel'; del.textContent='지움';
    del.onclick=ev=>{ ev.stopPropagation(); if(confirm('이 주석을 지울까요?')){ e.annotations=e.annotations.filter(x=>x.id!==a.id); touchEntry(k); renderDirect(k); } };
    note.appendChild(del); body.appendChild(note);
    pos=Math.max(pos,a.end);
  });
  if(pos<text.length) body.appendChild(document.createTextNode(text.slice(pos)));
  host.appendChild(body);
  body.addEventListener('mouseup',()=>maybePop(body));
  body.addEventListener('touchend',()=>setTimeout(()=>maybePop(body),10));
  $('archMeta').textContent=(e.words||countWords(text))+'단어 · 주석 '+(e.annotations||[]).length+'개 · 본문은 고칠 수 없고, 붉은 주석만 덧붙일 수 있습니다. 문장을 골라 보세요.';
}
$('navOlder').onclick=()=>{ agoN++; renderClose(); };
$('navNewer').onclick=()=>{ if(agoN>1){ agoN--; renderClose(); } };
document.addEventListener('keydown',e=>{
  if(view==='close' && !$('annBox').classList.contains('show') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    if(e.key==='ArrowLeft') $('navOlder').click();
    if(e.key==='ArrowRight') $('navNewer').click();
  }
});
function offsetIn(body,node,off){
  let acc=0;
  const w=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,{acceptNode(n){ return n.parentElement&&n.parentElement.closest('.note')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT; }});
  let c; while((c=w.nextNode())){ if(c===node) return acc+off; acc+=c.nodeValue.length; }
  return null;
}
let pendingSel=null;
function maybePop(body){
  const pop=$('annPop'), sel=window.getSelection();
  pop.style.display='none'; pendingSel=null;
  if(!sel||sel.isCollapsed||!sel.rangeCount) return;
  const r=sel.getRangeAt(0);
  if(!body.contains(r.startContainer)||!body.contains(r.endContainer)) return;
  if(r.startContainer.nodeType!==3||r.endContainer.nodeType!==3) return;
  if(r.startContainer.parentElement.closest('.note')||r.endContainer.parentElement.closest('.note')) return;
  const s=offsetIn(body,r.startContainer,r.startOffset), en=offsetIn(body,r.endContainer,r.endOffset);
  if(s==null||en==null||en<=s) return;
  const k=body.dataset.key, e=MP.entries[k];
  if((e.annotations||[]).some(a=>s<a.end&&en>a.start)){ toast('이미 주석이 달린 부분과 겹칩니다'); return; }
  pendingSel={key:k,start:s,end:en,text:e.text.slice(s,en)};
  const rc=r.getBoundingClientRect();
  pop.style.display='block';
  pop.style.left=Math.max(12,rc.left+rc.width/2-pop.offsetWidth/2+window.scrollX)+'px';
  pop.style.top=(rc.top+window.scrollY-pop.offsetHeight-10)+'px';
}
document.addEventListener('mousedown',e=>{ if(!e.target.closest('#annPop')) $('annPop').style.display='none'; });
$('annPopBtn').onclick=()=>{
  if(!pendingSel) return;
  $('annPop').style.display='none';
  $('annQuoted').textContent='“'+(pendingSel.text.length>160?pendingSel.text.slice(0,160)+'…':pendingSel.text)+'”';
  $('annText').value='';
  $('annToday').textContent='주석 날짜 · '+fmtShort(new Date());
  $('annBox').classList.add('show');
  setTimeout(()=>$('annText').focus(),30);
};
$('annCancel').onclick=()=>$('annBox').classList.remove('show');
$('annBox').addEventListener('mousedown',e=>{ if(e.target===$('annBox')) $('annBox').classList.remove('show'); });
$('annSave').onclick=()=>{
  if(!pendingSel) return;
  const note=$('annText').value.trim(); if(!note){ $('annText').focus(); return; }
  const k=pendingSel.key, e=MP.entries[k];
  (e.annotations=e.annotations||[]).push({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),start:pendingSel.start,end:pendingSel.end,note,date:fmtShort(new Date())});
  touchEntry(k);
  $('annBox').classList.remove('show');
  renderDirect(k); toast('붉은 주석을 남겼습니다'); pendingSel=null;
};

/* ═════════ 설정 ═════════ */
const MP_SQL=`create table if not exists mp_entries (id text primary key, data jsonb not null, updated_at timestamptz not null default now());
alter table mp_entries enable row level security;
drop policy if exists "mp open" on mp_entries;
create policy "mp open" on mp_entries for all using (true) with check (true);`;
function renderSet(){
  const L=cfg.links;
  $('setHost').innerHTML=`
  <h3>보태기 프로젝트</h3>
  <p class="note">글쓰기 시간만 읽어 옵니다. 여기에는 아무것도 쓰지 않습니다.</p>
  <div class="field"><label>프로젝트 주소</label><input id="btUrl" value="${esc(cfg.bt.url)}" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
  <div class="field"><label>키</label><input id="btKey" type="password" value="${esc(cfg.bt.key)}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>

  <h3>미래 프로젝트</h3>
  <p class="note">서가의 독서 기록과 미래의 할 일을 읽어 오고, 모닝페이지를 이곳의 mp_entries 표에 적습니다.</p>
  <div class="field"><label>프로젝트 주소</label><input id="mrUrl" value="${esc(cfg.mr.url)}" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
  <div class="field"><label>키</label><input id="mrKey" type="password" value="${esc(cfg.mr.key)}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
  ${autoNote?`<p class="note">${esc(autoNote)}</p>`:''}
  <p class="note">주소와 키는 이 기기에만 남고 파일에는 들어가지 않습니다.</p>
  <div class="btnrow"><button class="btn solid" id="saveConn">저장하고 확인</button></div>
  <div class="probe" id="probe"></div>

  <h3>모닝페이지 표</h3>
  <p class="note">처음 한 번, 미래 프로젝트의 SQL Editor에 붙여 넣고 실행하세요. 여러 번 실행해도 탈이 없고 서가·미래의 표는 건드리지 않습니다.</p>
  <pre class="sql">${esc(MP_SQL)}</pre>
  <div class="btnrow"><button class="btn" id="copySql">SQL 복사</button></div>

  <h3>여는 앱</h3>
  <p class="note">칸을 누르면 새 탭으로 엽니다. 같은 앱이 이미 열려 있으면 그 탭으로 돌아갑니다. 일을 마치고 그 탭을 닫으면 여기로 돌아와 다시 불러옵니다.</p>
  <div class="field"><label>글쓰기 · 맥</label><input id="lkW" value="${esc(L.write)}" autocapitalize="off" spellcheck="false"></div>
  <div class="field"><label>글쓰기 · 아이폰·아이패드</label><input id="lkWP" value="${esc(L.writePhone)}" autocapitalize="off" spellcheck="false"></div>
  <div class="field"><label>독서</label><input id="lkR" value="${esc(L.read)}" autocapitalize="off" spellcheck="false"></div>
  <div class="field"><label>할 일</label><input id="lkT" value="${esc(L.todo)}" autocapitalize="off" spellcheck="false"></div>
  <div class="btnrow"><button class="btn" id="saveLinks">저장</button><button class="btn" id="resetLinks">처음 값으로</button></div>

  <h3>모닝페이지</h3>
  <p class="note">하루는 새벽 4시에 바뀝니다. 이 기기 이름은 ‘${esc(myDevice())}’입니다.</p>
  <div class="btnrow">
    <button class="btn" id="sound">${MP.soundOn===false?'750단어 종소리 켜기':'750단어 종소리 끄기'}</button>
    <button class="btn" id="reImport">예전 모닝페이지 앱에서 다시 가져오기</button>
    <button class="btn" id="expMp">모닝페이지 내보내기</button>
    <button class="btn" id="impMp">파일에서 가져오기</button>
    <input type="file" id="impFile" accept=".json" hidden>
  </div>
  <p class="note" style="margin-top:10px">${Object.keys(MP.entries).filter(hasText).length}일치가 있고, ${Object.keys(MP.dirty).length?Object.keys(MP.dirty).length+'일치를 아직 올리지 못했습니다':'모두 올라가 있습니다'}.</p>`;
  $('saveConn').onclick=async()=>{
    cfg.bt={url:$('btUrl').value.trim(),key:$('btKey').value.trim()};
    cfg.mr={url:$('mrUrl').value.trim(),key:$('mrKey').value.trim()};
    saveCfg(); await probe();
  };
  $('copySql').onclick=()=>navigator.clipboard.writeText(MP_SQL).then(()=>toast('복사했습니다'),()=>toast('복사하지 못했습니다'));
  $('saveLinks').onclick=()=>{ cfg.links={write:$('lkW').value.trim()||DEF_LINKS.write, writePhone:$('lkWP').value.trim()||DEF_LINKS.writePhone, read:$('lkR').value.trim()||DEF_LINKS.read, todo:$('lkT').value.trim()||DEF_LINKS.todo}; saveCfg(); toast('저장했습니다'); };
  $('resetLinks').onclick=()=>{ cfg.links=Object.assign({},DEF_LINKS); saveCfg(); renderSet(); toast('처음 값으로 돌렸습니다'); };
  $('sound').onclick=()=>{ MP.soundOn=MP.soundOn===false; mpPersist(); renderSet(); };
  $('reImport').onclick=()=>{ const old=lsGet('morningpages_v1',null); if(!old){ toast('이 기기에는 예전 모닝페이지 기록이 없습니다'); return; } const n=mergeOld(old); toast(n?n+'일치를 더하거나 합쳤습니다':'새로 가져올 것이 없습니다'); renderSet(); };
  $('expMp').onclick=()=>{ const b=new Blob([JSON.stringify({entries:MP.entries},null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='모닝페이지_'+dayKey()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); };
  $('impMp').onclick=()=>$('impFile').click();
  $('impFile').onchange=ev=>{ const f=ev.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); const n=mergeOld(d); toast(n?n+'일치를 더하거나 합쳤습니다':'새로 가져올 것이 없습니다'); renderSet(); }catch(e){ toast('모닝페이지 파일이 아닙니다'); } }; r.readAsText(f); ev.target.value=''; };
}
async function probe(){
  const out=[]; const p=$('probe'); p.textContent='확인하는 중…';
  if(btOn()){ try{ await rest(cfg.bt,'botaegi_sessions?select=id&limit=1'); out.push('✓ 보태기 기록을 읽을 수 있습니다'); }catch(e){ out.push('✕ 보태기: '+e.message); } } else out.push('· 보태기 프로젝트가 비어 있습니다');
  if(mrOn()){
    for(const [t,n] of [['seoga_reads','서가'],['items','미래'],['mp_entries','모닝페이지 표']]){
      try{ await rest(cfg.mr,t+'?select=id&limit=1'); out.push('✓ '+n+'을(를) 읽을 수 있습니다'); }
      catch(e){ out.push('✕ '+n+': '+(missingTable(e)?'표가 없습니다':e.message)); }
    }
  } else out.push('· 미래 프로젝트가 비어 있습니다');
  p.textContent=out.join('\n');
  lastLoad=0; await pullMP(true); queuePush(); refreshToday(true);
}

/* ═════════ 화면 전환과 돌아옴 ═════════ */
let view='today';
function go(v){
  view=v;
  document.querySelectorAll('section[data-v]').forEach(s=>s.classList.toggle('on',s.dataset.v===v));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===v));
  $('annPop').style.display='none';
  if(v==='today') refreshToday(false);
  if(v==='morning'){ mpLoadEditor(); if(!isTouch) setTimeout(()=>{ editor.focus(); editor.setSelectionRange(editor.value.length,editor.value.length); },30); }
  if(v==='close'){ agoN=Math.max(agoN,1); anchorDay=parseKey(dayKey()).getDate(); renderClose(); }
  if(v==='set') renderSet();
  window.scrollTo(0,0);
}
window.go=go;
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));

/* 그날 처음 열면(새벽 4시가 지나 처음) 모닝페이지부터 */
function firstOpenCheck(){
  const k=dayKey();
  if(lsGet('sijak.lastDay','')!==k){
    lsSet('sijak.lastDay',k);
    const e=MP.entries[k];
    if(!(e&&countWords(e.text)>=GOAL_WORDS)){ go('morning'); return true; }
  }
  return false;
}

/* 다른 탭에서 일을 마치고 돌아오면 다시 불러온다 */
let backT=0;
async function onBack(){
  if(document.visibilityState!=='visible') return;
  if(Date.now()-backT<1500) return; backT=Date.now();
  const changed=await pullMP(false)||[];
  if(Object.keys(MP.dirty).length) queuePush();
  if(firstOpenCheck()) { refreshToday(true); return; }
  if(view==='today') refreshToday(true);
  else { lastLoad=0; }
  if(view==='morning' && (changed.includes(mpDay) || mpDay!==dayKey()) && document.activeElement!==editor) mpLoadEditor();
  if(view==='close' && changed.includes(curKey)) renderDirect(curKey);
}
document.addEventListener('visibilitychange',onBack);
window.addEventListener('focus',onBack);
window.addEventListener('pageshow',e=>{ if(e.persisted) onBack(); });
window.addEventListener('pagehide',()=>{ if(view==='morning'){ clearTimeout(saveT); if(editor.value!==(MP.entries[mpDay]&&MP.entries[mpDay].text||'')) saveToday(); } });

/* 켜 둔 채: 30초마다 흐르는 시간만 다시 그리고, 2분마다 불러온다 */
setInterval(()=>{
  if(document.visibilityState!=='visible') return;
  if(view==='today'){ if(Date.now()-lastLoad>120000) refreshToday(true); else renderToday(); }
},30000);

/* ─── 시작 ─── */
(async function boot(){
  if(!firstOpenCheck()) go('today');
  setDot('mp', mrOn()?'busy':'', '');
  await pullMP(!MP.since);
  if(Object.keys(MP.dirty).length) queuePush();
  if(view==='morning' && document.activeElement!==editor) mpLoadEditor();
  if(!mpTableMissing) setDot('mp', mrOn()?'ok':'', '');
  refreshToday(true);
})();
</script>
