<meta name="theme-color" content="#f2ede1">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --paper:#f2ede1; --paper-2:#e8e0cf; --ink:#23201c; --ink-soft:#736a59; --faint:#a39a88; --line:#d6ccb6;
  --seal:#9b3b32; --seal-faint:#efd9d2; --deep:#3f5566; --deep-faint:#d9dfe3; --gold:#b8904a;
  --serif:'Gowun Batang',AppleMyungjo,"Apple SD Gothic Neo",Batang,serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
a{color:inherit;text-decoration:none}

/* ── 머리 ── */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:16px 20px 0}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:10px}
.brand h1{margin:0;font-size:22px;letter-spacing:.3em;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block;transform:translateY(-3px)}
.dot.ok{background:#6f8a5c}.dot.busy{background:var(--gold)}.dot.err{background:var(--seal)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{border-bottom:2px solid transparent;padding:6px 11px 9px;color:var(--ink-soft);font-size:15px;letter-spacing:.04em}
nav button.on{color:var(--ink);border-bottom-color:var(--seal)}
main{max-width:720px;margin:0 auto;padding:26px 20px 110px}
section[data-v]{display:none}
section[data-v].on{display:block}

/* ── 오늘 ── */
.day{margin:4px 0 26px}
.day .d{font-size:34px;line-height:1.25;letter-spacing:.04em}
.day .w{font-size:15px;color:var(--ink-soft);margin-left:10px;letter-spacing:.1em}
.day .mp{display:block;margin-top:6px;font-size:14px;color:var(--ink-soft)}
.day .mp button{color:var(--deep);border-bottom:1px solid var(--deep)}

.strip{display:block;border-top:1px solid var(--line);padding:22px 2px 24px;position:relative}
/* 맨 아래 칸에만 아래 테두리 — 칸마다 위 테두리가 있으니 중간에 겹치지 않게 */
#stripI{border-bottom:1px solid var(--line)}
a.strip:hover{background:rgba(155,59,50,.035)}
.strip-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.strip-name{font-size:20px;letter-spacing:.24em}
.strip-num{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.strip-num .of{color:var(--ink-soft);font-size:14px}
.gauge{position:relative;height:5px;background:var(--paper-2);margin:14px 0 10px;overflow:hidden;border-radius:1px}
.gauge i{position:absolute;top:0;bottom:0;left:0;display:block}
.gauge .done{background:var(--seal)}
.gauge .run{background:repeating-linear-gradient(90deg,var(--seal) 0 3px,transparent 3px 6px);opacity:.55}
.strip.met .gauge .done{background:var(--ink)}
.strip-sub{font-size:14px;color:var(--ink-soft);min-height:1.6em}
/* 글쓰기 칸 — 칸 전체는 보태기로, 오른쪽 아래의 '떠들기'만 떠들기로 (링크 안에 링크를 둘 수 없어 겹쳐 놓는다) */
.wbox{position:relative}
.wbox #stripW .strip-sub{padding-right:8.5em}
.wbox .wlinks{position:absolute;right:2px;bottom:24px;display:flex;gap:.9em;font-size:14px;line-height:1.6}
.wbox .wlinks a{color:var(--ink-soft);border-bottom:1px solid var(--line);text-decoration:none}
.wbox .wlinks a:hover{color:var(--seal);border-bottom-color:var(--seal)}
.strip-sub .live{color:var(--seal)}
.stamp{position:absolute;right:-6px;top:10px;width:46px;height:46px;border:2px solid var(--seal);border-radius:50%;
  color:var(--seal);font-size:13px;display:flex;align-items:center;justify-content:center;letter-spacing:.05em;
  transform:rotate(-12deg);opacity:.82;pointer-events:none;background:rgba(242,237,225,.7)}
.strip.met .strip-num{padding-right:52px}

.todo{list-style:none;margin:12px 0 0;padding:0}
.todo li a{display:grid;grid-template-columns:3.2em 1fr auto;gap:10px;align-items:baseline;padding:8px 2px;border-bottom:1px dotted var(--line)}
.todo li:last-child a{border-bottom:none}
.todo li a:hover{background:rgba(155,59,50,.035)}
.todo .k{font-size:12.5px;color:var(--ink-soft);letter-spacing:.08em}
.todo .t{font-size:16.5px;line-height:1.5}
.todo .m{font-size:13px;color:var(--ink-soft);white-space:nowrap}
.todo .m.due{color:var(--seal)}
.todo li.now .k{color:var(--seal)}
.todo li.now .t{font-size:18px}
.more{font-size:13.5px;color:var(--ink-soft);margin-top:8px}
.empty{font-size:14.5px;color:var(--ink-soft)}
.err{font-size:13.5px;color:var(--seal)}
.linkish{color:var(--seal);border-bottom:1px solid var(--seal)}
.foot{font-size:12.5px;color:var(--faint);margin-top:18px}

/* ── 모닝페이지 ── */
.horizon{position:relative;height:3px;background:var(--line);border-radius:2px;margin:0 0 28px;overflow:hidden}
.horizon .sun{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,var(--deep) 0%,#8496b3 70%,#c8a15a 100%);transition:width .4s ease}
.horizon.done .sun{background:linear-gradient(90deg,#c8a15a,#d9b35e)}
.datehead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.datehead h2{font-size:21px;font-weight:700;margin:0;letter-spacing:.02em}
.datehead .sub{font-size:13px;color:var(--ink-soft)}
.pages{display:flex;gap:8px;align-items:center;margin:14px 0 20px}

.mpnote{font-size:13.5px;color:var(--seal);margin:-8px 0 14px}

textarea#editor::placeholder{color:#b4ad9c}
.statusline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.doneNote{display:none;margin:24px 0 8px;padding:16px 20px;border-left:3px solid #c8a15a;background:var(--paper-2);font-size:15px;color:var(--ink-soft)}
.doneNote.show{display:block}
.doneNote b{color:var(--ink)}
.doneNote .row{margin-top:10px;display:flex;gap:18px;flex-wrap:wrap}
.doneNote button{font-size:14px;color:var(--deep);border-bottom:1px solid var(--deep)}

/* ── 하루 정리 ── */
.navx{display:flex;align-items:center;justify-content:space-between;margin:0 0 26px}
.navx button.arrow{font-size:20px;line-height:1;padding:8px 14px;color:var(--ink-soft);border:1px solid var(--line);border-radius:2px;background:var(--paper-2)}
.navx button.arrow:disabled{opacity:.3;cursor:default}
.navmid{text-align:center}
.navmid .ago{font-size:12.5px;letter-spacing:.2em;color:var(--seal)}
.navmid h2{font-size:19px;margin:0}
select#dateJump{font-size:12.5px;color:var(--ink-soft);background:transparent;border:none;border-bottom:1px solid var(--line);margin-top:4px;max-width:200px}
.entryBody{font-size:16.5px;line-height:2.1;white-space:pre-wrap;word-break:break-word}
.entryBody .anchor{background:var(--seal-faint);border-bottom:1px solid var(--seal);cursor:pointer}
.entryBody .note{color:var(--seal);font-size:14.5px;white-space:normal}
.entryBody .note .ndate{font-size:11.5px;opacity:.75}
.entryBody .note .ndel{font-size:11.5px;color:var(--faint);margin-left:6px;border-bottom:1px dotted var(--faint)}
.emptyDay{padding:56px 0;text-align:center;color:var(--ink-soft);font-size:14.5px;line-height:2}
.emptyDay button{color:var(--deep);border-bottom:1px solid var(--deep);font-size:14px}
.archMeta{font-size:12.5px;color:var(--faint);border-top:1px solid var(--line);padding-top:10px;margin-top:34px}
#annPop{position:absolute;display:none;z-index:30;background:var(--ink);color:var(--paper);font-size:13px;padding:6px 12px;border-radius:2px}
#annPop button{color:var(--paper)}
#annBox{display:none;position:fixed;inset:0;z-index:40;background:rgba(35,32,28,.35);align-items:center;justify-content:center;padding:20px}
#annBox.show{display:flex}
#annBox .card{background:var(--paper);width:100%;max-width:520px;padding:24px 26px;border-top:3px solid var(--seal);box-shadow:0 12px 40px rgba(0,0,0,.18)}
#annBox .quoted{font-size:14px;color:var(--ink-soft);border-left:2px solid var(--line);padding-left:12px;margin-bottom:14px;max-height:90px;overflow:auto}
#annBox textarea{width:100%;min-height:90px;resize:vertical;font-size:15px;line-height:1.9;color:var(--seal);background:transparent;border:1px solid var(--line);border-radius:2px;padding:10px 12px}
#annBox .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px}
#annBox .row .today{color:var(--faint)}
#annBox .btns button{padding:7px 16px;border-radius:2px}
#annBox .btns .save{background:var(--seal);color:#fff}
#annBox .btns .cancel{color:var(--ink-soft);margin-right:6px}

/* ── 오늘의 일정 (날짜 아래) ── */
.agenda{margin:-8px 0 26px}
.agenda:empty{display:none}
.ag{list-style:none;margin:0;padding:0}
.ag + .ag{margin-top:6px}
.ag li{display:grid;grid-template-columns:calc(7.3em + 12px) 1fr;gap:12px;align-items:baseline;padding:6px 2px;border-bottom:1px dotted var(--line)}
.ag li:last-child{border-bottom:none}
.ag.daily li{grid-template-columns:1.3em 6em 1fr}
.ag .when{font-size:13.5px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
.ag .when.due{color:var(--seal);letter-spacing:.06em}
.ag .what{font-size:16px;line-height:1.5}
.ag .pl{font-size:13.5px;color:var(--ink-soft)}
.ag .tag{font-size:12px;color:var(--seal);letter-spacing:.06em;margin-right:6px}
.ag .tag.rp{color:var(--deep)}
.ag .memo{display:block;font-size:13.5px;color:var(--ink-soft);white-space:pre-wrap}
.ag a.row,.ag button.row{display:contents;text-align:left}
.ag li.go{cursor:pointer}
.ag li.go:hover{background:rgba(155,59,50,.035)}
.ag .later{color:var(--faint)}
.ck{width:16px;height:16px;border:1.5px solid var(--ink-soft);border-radius:2px;align-self:center;position:relative;transition:background .2s,border-color .2s}
.ck:hover{border-color:var(--seal)}
.ck.on{background:var(--seal);border-color:var(--seal)}
.ck.on::after{content:"";position:absolute;left:4px;top:0;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.ck:disabled{opacity:.35;cursor:default}
.agnote{font-size:13px;color:var(--ink-soft);margin:8px 2px 0}
.agnote button{color:var(--ink-soft);border-bottom:1px dotted var(--ink-soft);font-size:13px}

/* ── 달력 ── */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
.calhead h2{font-size:21px;margin:0;letter-spacing:.04em;font-weight:700}
.calhead .arrow{font-size:18px;line-height:1;padding:7px 13px;color:var(--ink-soft);border:1px solid var(--line);border-radius:2px;background:var(--paper-2)}
.calhead .mid{display:flex;align-items:baseline;gap:14px}
.calhead .mid button{font-size:13px;color:var(--ink-soft);border-bottom:1px dotted var(--ink-soft)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line)}
.grid .wd{font-size:12.5px;color:var(--ink-soft);text-align:center;padding:4px 0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper-2)}
.grid .wd.sun{color:var(--seal)} .grid .wd.sat{color:var(--deep)}
.cell{display:block;min-height:88px;padding:4px 5px 5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;overflow:hidden;cursor:pointer;min-width:0}
.cell:hover{background:rgba(155,59,50,.035)}
.cell.out{background:rgba(232,224,207,.4)}
.cell.out .n{color:var(--faint)}
.cell .n{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;font-size:13px;font-variant-numeric:tabular-nums}
.cell.sun .n{color:var(--seal)} .cell.sat .n{color:var(--deep)}
.cell.today .n{background:var(--seal);color:#fff;border-radius:50%}
.cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.ct{display:block;margin-top:2px}
.ct .c{display:block;font-size:11.5px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct .c.due{color:var(--seal)}
.ct .c.more{color:var(--faint)}
.dd{margin-top:26px}
.dd-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px}
.dd-head h3{margin:0;font-size:18px;letter-spacing:.04em}
.dd-btns{display:flex;gap:8px;flex-wrap:wrap}
.dd .empty{padding:10px 2px}
.dd .ag li{grid-template-columns:1.3em minmax(4em,auto) 1fr}
.calmsg{font-size:13.5px;color:var(--seal);margin:12px 0 0}
.evform{margin-top:18px;padding:16px 18px 18px;background:var(--paper-2);border-top:2px solid var(--seal)}
.evform .field input,.evform .field textarea,.evform .field select{width:100%;background:#f8f5ec;border:1px solid var(--line);border-radius:2px;padding:8px 10px;font-size:15px}
.evform .field textarea{min-height:70px;resize:vertical;line-height:1.7}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.evform .hint{font-size:12.5px;color:var(--ink-soft);margin:6px 0 0}
.btn.warn{color:var(--seal);border-color:var(--seal)}
@media (max-width:520px){
  .cell{min-height:52px;padding:3px 3px 4px}
  .ct{line-height:0}
  .ct .c{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink-soft);font-size:0;margin:0 2px 0 0}
  .ct .c.due{background:var(--seal)}
  .ct .c.more{display:none}
  .frow{grid-template-columns:1fr}
  .ag .what{font-size:15.5px}
}

/* ── 수입 ── */
div.strip.inc{cursor:pointer}
div.strip.inc:hover{background:rgba(155,59,50,.035)}
.inc h3{font-size:16px;font-weight:700;margin:34px 0 8px;letter-spacing:.06em}
.inc .note{font-size:13.5px;color:var(--ink-soft);line-height:1.8;margin:6px 0 0}
.inc-top{margin:4px 0 8px}
.inc-top .lbl{font-size:14px;color:var(--ink-soft);letter-spacing:.06em}
.inc-top .big{font-size:40px;line-height:1.25;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.inc-top .big small{font-size:17px;color:var(--ink-soft);margin-left:8px}
.inc-top.met .big{color:var(--seal)}
.inc-top .sub{font-size:14.5px;color:var(--ink-soft)}
.inc-top .now{font-size:14.5px;margin-top:10px;padding-top:10px;border-top:1px dotted var(--line)}
.incform{display:grid;grid-template-columns:10.5em 1fr auto;gap:10px;align-items:end}
.incform label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:3px}
.incform input{width:100%;background:#f8f5ec;border:1px solid var(--line);border-radius:2px;padding:8px 10px;font-size:15px;font-variant-numeric:tabular-nums}
.incform .btn{height:40px}
.incform .btn.warn{background:var(--seal);color:#fff;border-color:var(--seal)}
.incwarn{font-size:14px;color:var(--seal);margin:10px 0 0;line-height:1.7}
.incwarn:empty{display:none}
.incchart{margin-top:6px}
.incchart svg{display:block;width:100%;height:auto}
.inclist{list-style:none;margin:0;padding:0}
.inclist li{display:grid;grid-template-columns:7.5em 1fr auto;gap:12px;align-items:baseline;padding:7px 2px;border-bottom:1px dotted var(--line);font-variant-numeric:tabular-nums}
.inclist .d{font-size:14px;color:var(--ink-soft)}
.inclist .a{font-size:16px;text-align:right}
.inclist button{font-size:12.5px;color:var(--faint);border-bottom:1px dotted var(--faint)}
.inctab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.inctab th,.inctab td{padding:6px 2px;border-bottom:1px dotted var(--line);text-align:right;font-weight:400}
.inctab th{font-size:12.5px;color:var(--ink-soft)}
.inctab th:first-child,.inctab td:first-child{text-align:left}
.inctab td.low{color:var(--ink-soft)}
.inctab td.hi{color:var(--seal)}
.inctab tr.part td{color:var(--faint)}
.advold{margin-top:6px}
.advold summary{cursor:pointer;font-size:14px;color:var(--ink-soft);padding:8px 2px;list-style:none}
.advold summary::-webkit-details-marker{display:none}
.advold summary::before{content:'▸ '}
.advold[open] summary::before{content:'▾ '}
@media (max-width:520px){
  .incform{grid-template-columns:1fr 1fr}
  .incform .btn{grid-column:1/-1}
  .inc-top .big{font-size:32px}
}

/* ── 설정 ── */
.set h3{font-size:16px;font-weight:700;margin:30px 0 8px;letter-spacing:.06em}
.set h3:first-child{margin-top:0}
.set .note{font-size:13.5px;color:var(--ink-soft);line-height:1.8;margin:0 0 10px}
.field{margin:10px 0}
.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:3px}
.field input{width:100%;background:#f8f5ec;border:1px solid var(--line);border-radius:2px;padding:8px 10px;font-size:15px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--ink-soft);border-radius:2px;padding:7px 14px;font-size:14px}
.btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
pre.sql{background:var(--paper-2);border:1px solid var(--line);padding:12px;font-size:12px;line-height:1.5;overflow-x:auto;white-space:pre}
.probe{font-size:13px;color:var(--ink-soft);white-space:pre-wrap;margin-top:8px}

#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:var(--paper);font-size:13.5px;padding:10px 18px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){
  .top{padding:12px 14px 0} main{padding:20px 16px 100px}
  .day .d{font-size:28px} .strip-name{font-size:18px} textarea#editor{font-size:16px}
  nav button{padding:6px 8px 9px;font-size:14.5px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><h1>시작</h1><span class="dot" id="dot" title=""></span></div>
  <nav id="nav">
    <button data-go="today">오늘</button>
    <button data-go="cal">달력</button>
    <button data-go="morning">모닝페이지</button>
    <button data-go="close">하루 정리</button>
    <button data-go="set">설정</button>
  </nav>
</div></header>

<main>
  <!-- 오늘 -->
  <section data-v="today">
    <div class="day"><span class="d" id="dayD"></span><span class="w" id="dayW"></span><span class="mp" id="dayMp"></span></div>
    <div class="agenda" id="agenda"></div>
    <div class="wbox"><a class="strip" id="stripW" target="sijak_write" rel="opener"></a><span class="wlinks"><a id="tteoLink" target="sijak_tteo" rel="opener">떠들기</a><a id="typeLink" target="sijak_typewriter" rel="opener">타자기</a></span></div>
    <div class="strip inc" id="stripA" role="button" tabindex="0" title="원고 보기"></div>
    <a class="strip" id="stripR" target="sijak_read" rel="opener"></a>
    <div class="strip inc" id="stripP" role="button" tabindex="0" title="쪽수 보기"></div>
    <a class="strip" id="stripE" target="sijak_run" rel="opener"></a>
    <div class="strip inc" id="stripD" role="button" tabindex="0" title="거리 보기"></div>
    <div class="strip" id="stripT"></div>
    <div class="strip inc" id="stripI" role="button" tabindex="0" title="수입 보기와 적기"></div>
    <p class="foot" id="foot"></p>
  </section>

  <!-- 달력 -->
  <section data-v="cal" id="calHost"></section>

  <!-- 모닝페이지 -->
  <section data-v="morning">
    <div class="horizon" id="horizon"><div class="sun" id="sun"></div></div>
    <div class="datehead"><h2 id="mpDate"></h2><span class="sub">아침의 세 쪽</span></div>
    <div class="pages">
      <div class="page"></div><div class="page"></div><div class="page"></div>
      <span class="count"><b id="wc">0</b> / 750 단어</span>
    </div>
    <p class="mpnote" id="mpNote" hidden></p>
    <textarea id="editor" placeholder="생각하지 말고, 멈추지 말고, 그냥 쓰세요." spellcheck="false"></textarea>
    <div class="doneNote" id="doneNote">
      <b>오늘 세 쪽을 채웠습니다.</b> 750단어를 넘겼으니 손을 놓아도 좋습니다.
      <div class="row"><button id="toToday">오늘 할 일 보기</button></div>
    </div>
    <div class="statusline"><span id="saveStat">아직 쓴 것이 없습니다</span><span id="charStat"></span></div>
  </section>

  <!-- 하루 정리 -->
  <section data-v="close">
    <div class="navx">
      <button class="arrow" id="navOlder" title="한 달 더 이전">←</button>
      <div class="navmid">
        <div class="ago" id="agoLabel"></div>
        <h2 id="archDate"></h2>
        <select id="dateJump" title="저장된 다른 날짜로 이동"></select>
      </div>
      <button class="arrow" id="navNewer" title="한 달 더 최근">→</button>
    </div>
    <div id="entryHost"></div>
    <div class="archMeta" id="archMeta"></div>
  </section>

  <!-- 수입 (오늘의 수입 칸을 누르면) -->
  <section data-v="inc" class="inc" id="incHost"></section>
  <section data-v="adv" class="inc" id="advHost"></section>
  <section data-v="pg" class="inc" id="pgHost"></section>
  <section data-v="dist" class="inc" id="distHost"></section>

  <!-- 설정 -->
  <section data-v="set" class="set" id="setHost"></section>
</main>

<div id="annPop"><button id="annPopBtn">붉은 주석 달기</button></div>
<div id="annBox" role="dialog" aria-modal="true">
  <div class="card">
    <div class="quoted" id="annQuoted"></div>
    <textarea id="annText" placeholder="그때의 문장에게, 지금의 내가."></textarea>
    <div class="row">
      <span class="today" id="annToday"></span>
      <span class="btns"><button class="cancel" id="annCancel">취소</button><button class="save" id="annSave">주석 저장</button></span>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ═════════ 시작 ═════════
   글쓰기(보태기)·독서(서가)·할 일(미래)·운동(달리기)의 오늘 상태를 읽기만 하고,
   모닝페이지(아침 쓰기와 저녁의 하루 정리)·달력 일정·수입(월별 합계)만 스스로 적는다.
   하루는 새벽 4시에 바뀐다. */

const DAY_H = 4;
const GOAL_WORDS = 750;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['일','월','화','수','목','금','토'];
function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayKey(t){ return keyOf(new Date((t==null?Date.now():t) - DAY_H*3600000)); }
function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function dayRange(k){ const d=parseKey(k); return [new Date(d.getFullYear(),d.getMonth(),d.getDate(),DAY_H), new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,DAY_H)]; }
function fmtLong(d){ return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'; }
function fmtShort(d){ return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.'; }
function fmtMin(n){ n=Math.max(0,Math.round(n)); if(n<60) return n+'분'; return Math.floor(n/60)+'시간'+(n%60?' '+(n%60)+'분':''); }
function daysBetween(a,b){ return Math.round((parseKey(b)-parseKey(a))/86400000); }
function countWords(t){ const m=String(t||'').trim().match(/\S+/g); return m?m.length:0; }
let toastT; function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2800); }
function lsGet(k,fb){ try{ const v=localStorage.getItem(k); return v==null?fb:JSON.parse(v); }catch(e){ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

const isTouch = /iPhone|iPad|Android/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints>1);
function myDevice(){
  const s=lsGet('sijak.device',''); if(s) return s;
  const u=navigator.userAgent;
  if(/iPhone/.test(u)) return '아이폰';
  if(/iPad/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)) return '아이패드';
  if(/Macintosh/.test(u)) return '맥북';
  return '이 기기';
}

/* ─────────── 설정 ─────────── */
const CFG_KEY='sijak.cfg';

/* ─────────── Supabase REST ─────────── */
async function rest(p, path, opt){
  opt=opt||{};
  const r=await fetch(p.url.replace(/\/+$/,'')+'/rest/v1/'+path,{
    method:opt.method||'GET', body:opt.body,
    headers:Object.assign({apikey:p.key, Authorization:'Bearer '+p.key, 'Content-Type':'application/json'}, opt.headers||{})
  });
  const t=await r.text();
  if(!r.ok){ let m=t; try{ const j=JSON.parse(t); m=j.message||j.hint||t; }catch(e){} const er=new Error(m||('HTTP '+r.status)); er.status=r.status; er.body=t; throw er; }
  return t?JSON.parse(t):null;
}
const enc=encodeURIComponent;
function upsert(p, table, rows){
  return rest(p, table, {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(rows)});
}
function missingTable(e){ return e && (e.status===404 || /does not exist|schema cache|Could not find the table/i.test(e.message||'')); }

/* ─────────── 상태 표시 ─────────── */
let dotState={};
function setDot(part,state,msg){
  dotState[part]={state,msg};
  const vals=Object.values(dotState);
  const d=$('dot');
  d.className='dot '+(vals.some(v=>v.state==='err')?'err':vals.some(v=>v.state==='busy')?'busy':vals.length?'ok':'');
  d.title=vals.filter(v=>v.msg).map(v=>v.msg).join(' / ');
}

/* ═════════ 오늘 — 세 가지를 읽어 온다 ═════════ */
let W=null, R=null, T=null;   /* 마지막으로 읽은 결과 */
let Werr='', Rerr='', Terr='';

async function loadWrite(k){
  if(!btOn()){ W=null; Werr='setup'; return; }
  const [s,e]=dayRange(k);
  try{
    const [rows,kv]=await Promise.all([
      rest(cfg.bt,'botaegi_sessions?select=type,start_at,end_at,ms_title,source&start_at=gte.'+enc(s.toISOString())+'&start_at=lt.'+enc(e.toISOString())),
      rest(cfg.bt,'botaegi_kv?select=id,data&id=in.(now,conf,days)')
    ]);
    let ms=0, tt=0;
    (rows||[]).forEach(r=>{ if(/^(focus|ty|gyo)/.test(r.type||'')){  /* 몰입(책 고치기 포함)·타이핑·교열 — 보태기의 하루 몰입과 같은 기준 */ const a=Date.parse(r.start_at), b=Date.parse(r.end_at); if(b>a){ ms+=b-a; if(r.source==='tteodeulgi') tt+=b-a; } } });
    const now=(kv||[]).find(x=>x.id==='now'), conf=(kv||[]).find(x=>x.id==='conf'), days=(kv||[]).find(x=>x.id==='days');
    const c=conf&&conf.data||{};
    const goal=(c.goalH!=null||c.goalM!=null)? ((+c.goalH||0)*60+(+c.goalM||0)) : null;
    W={min:ms/60000, tteo:tt/60000, goal, goalKnown:goal!=null, now:now&&now.data||null, adv:days&&days.data&&days.data.adv||null, since:days&&days.data&&days.data.since||'', first:days&&days.data&&days.data.first||'', at:Date.now()};
    Werr='';
  }catch(er){ Werr=er.message||'불러오지 못했습니다'; }
}
function writeRunning(){
  const d=W&&W.now; if(!d) return null;
  const t=Date.now(), [s]=dayRange(dayKey());
  if(d.phase==='focus' && t<d.ends_at && d.start>=s.getTime()) return {min:(t-d.start)/60000, label:d.type==='gyo'?'교열 중':'몰입 중', title:(d.type==='gyo'?String(d.ms_title||'').replace(/^교열 · /,''):d.ms_title)};
  if(d.phase==='type' && d.start){ const left=(d.cap||0)-(d.used||0), el=t-d.start; if(el<left && d.start>=s.getTime()) return {min:el/60000, label:'타이핑 중', title:d.ms_title}; }
  if(d.phase==='pause') return {min:0, label:'타이핑을 멈춰 둠', title:d.ms_title};
  return null;
}

async function loadRead(k){
  if(!mrOn()){ R=null; Rerr='setup'; return; }
  try{
    const [rows,meta]=await Promise.all([
      rest(cfg.mr,'seoga_reads?select=data&data->>kind=eq.read&data->>date=eq.'+enc(k)),
      rest(cfg.mr,'seoga_meta?select=id,data&id=in.(active,settings)')
    ]);
    let min=0; const titles=[];
    (rows||[]).forEach(r=>{ const d=r.data||{}; if(d.gone) return; min+=(+d.minutes||0); if(d.title&&!titles.includes(d.title)) titles.push(d.title); });
    const act=(meta||[]).find(x=>x.id==='active'), st=(meta||[]).find(x=>x.id==='settings');
    R={min, titles, goal:(st&&st.data&&+st.data.target)||120, active:act&&act.data&&act.data.active||null};
    Rerr='';
  }catch(er){ Rerr=missingTable(er)?'Supabase에 서가 표가 없습니다. 서가에서 동기화를 먼저 켜세요.':(er.message||'불러오지 못했습니다'); }
}
function readRunning(){
  const a=R&&R.active; if(!a) return null;
  if(a.closing) return {min:0, label:(a.device&&a.device!==myDevice()?a.device+'에서 ':'')+'읽기를 끝냄 · 쪽을 적어야 합니다', title:a.title};
  const [s]=dayRange(dayKey());
  if(a.startedAt && a.startedAt>=s.getTime()) return {min:(Date.now()-a.startedAt)/60000, label:(a.device&&a.device!==myDevice()?a.device+'에서 ':'')+'읽는 중', title:a.title};
  return {min:0, label:(a.device?a.device+'에서 ':'')+'어제부터 읽는 중', title:a.title};
}

async function loadTodo(k){
  if(!mrOn()){ T=null; Terr='setup'; return; }
  try{
    const [rows,stt]=await Promise.all([
      rest(cfg.mr,'items?select=data&data->>status=eq.open'),
      rest(cfg.mr,'app_state?select=data&id=eq.1')
    ]);
    const items=(rows||[]).map(r=>r.data).filter(x=>x&&x.id&&!x.probe);
    const as=(stt&&stt[0]&&stt[0].data)||{};
    const cur=as.currentId?items.find(i=>i.id===as.currentId):null;
    const dailies=items.filter(i=>i.kind==='daily' && i!==cur && !(i.dailyDone||[]).includes(k));
    const dues=items.filter(i=>i.kind!=='daily'&&i.kind!=='future'&&i!==cur&&i.deadline&&daysBetween(k,i.deadline)<=7)
      .sort((a,b)=>a.deadline.localeCompare(b.deadline));
    const shown=new Set([cur,...dailies,...dues].filter(Boolean).map(i=>i.id));
    const rest_=items.filter(i=>i.kind!=='future'&&!shown.has(i.id)&&!(i.kind==='daily'&&(i.dailyDone||[]).includes(k))).length;
    const deadlines=items.filter(i=>i.kind!=='daily'&&i.kind!=='future'&&i.deadline).map(i=>({id:i.id,title:i.title,deadline:i.deadline}));
    T={cur, curAt:as.startedAt, curDev:as.device, dailies, dues, rest:rest_, deadlines};
    Terr='';
  }catch(er){ Terr=missingTable(er)?'Supabase에 미래 표가 없습니다.':(er.message||'불러오지 못했습니다'); }
}

let loading=false, lastLoad=0;
async function refreshToday(force){
  if(loading) return;
  if(!force && Date.now()-lastLoad<4000) { renderToday(); return; }
  loading=true; setDot('today','busy','불러오는 중');
  const k=dayKey();
  await Promise.all([loadWrite(k),loadRead(k),loadReads(false),loadTodo(k),loadRun(false),pullCal(),pullInc()]);
  lastLoad=Date.now(); loading=false;
  const errs=[Werr,Rerr,Terr,RNerr==='table'?'':RNerr].filter(x=>x&&x!=='setup');
  setDot('today', errs.length?'err':'ok', errs.length?errs[0]:'');
  renderToday();
}

// 일기 쓰기: 고른 날짜를 클립보드에 넣고 스크리브너 주소를 연다.
// 사파리는 클릭한 그 순간에만 클립보드 쓰기를 허락하므로 복사를 먼저 시작하고 곧바로 연다.
function diaryText(k){ const d=parseKey(k); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`; }
function copyPlain(text){
  const old=()=>{ try{ const t=document.createElement('textarea'); t.value=text; t.setAttribute('readonly',''); t.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(t); t.select(); t.setSelectionRange(0,text.length); const ok=document.execCommand('copy'); t.remove(); return ok; }catch(e){ return false; } };
  if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(()=>true,()=>old());
  return Promise.resolve(old());
}
function openDiary(k){
  const text=diaryText(k), url=(cfg.links.diary||'').trim();
  const done=copyPlain(text);
  if(!url){ done.then(ok=>toast(ok?`‘${text}’를 복사했습니다. 설정에 스크리브너 주소를 적어 주세요`:'복사하지 못했습니다. 설정에 스크리브너 주소를 적어 주세요')); return; }
  if(/^https?:/i.test(url)) window.open(url,'sijak_diary'); else location.href=url;
  done.then(ok=>toast(ok?`‘${text}’를 복사했습니다`:'날짜를 복사하지 못했습니다'));
}
function linkFor(which){
  if(which==='write') return isTouch?cfg.links.writePhone:cfg.links.write;
  return cfg.links[which]||DEF_LINKS[which];
}
function stripHTML(name, doneMin, runMin, goal, sub, met){
  const pct=v=>Math.max(0,Math.min(100,goal?v/goal*100:0));
  const d=pct(doneMin), r=Math.max(0,Math.min(100-d,pct(runMin)));
  return `<div class="strip-head"><span class="strip-name">${name}</span>
    <span class="strip-num">${fmtMin(doneMin+runMin)} <span class="of">/ ${fmtMin(goal)}</span></span></div>
    <div class="gauge"><i class="done" style="width:${d}%"></i><i class="run" style="left:${d}%;width:${r}%"></i></div>
    <div class="strip-sub">${sub}</div>${met?'<span class="stamp">채움</span>':''}`;
}
function setupMsg(){ return `<span class="empty">Supabase를 아직 잇지 않았습니다 · <button class="linkish" onclick="go('set')">설정</button></span>`; }

function renderToday(){
  const k=dayKey(), d=parseKey(k);
  $('dayD').textContent=(d.getMonth()+1)+'월 '+d.getDate()+'일';
  $('dayW').textContent=WD[d.getDay()]+'요일';
  const e=MP.entries[k], w=e?countWords(e.text):0;
  $('dayMp').innerHTML = w>=GOAL_WORDS ? '모닝페이지 '+w+'단어를 썼습니다'
    : `<button onclick="go('morning')">${w?'모닝페이지 '+w+'단어 · 이어 쓰기':'모닝페이지를 아직 쓰지 않았습니다'}</button>`;
  renderAgenda();

  /* 글쓰기 */
  const sw=$('stripW'); sw.href=linkFor('write'); $('tteoLink').href=linkFor('tteo'); $('typeLink').href=linkFor('typewriter');
  if(Werr==='setup'){ sw.removeAttribute('href'); sw.innerHTML=`<div class="strip-head"><span class="strip-name">글쓰기</span></div><div class="strip-sub">${setupMsg()}</div>`; sw.classList.remove('met'); }
  else if(!W){ sw.innerHTML=`<div class="strip-head"><span class="strip-name">글쓰기</span></div><div class="strip-sub">${Werr?'<span class="err">'+esc(Werr)+'</span>':'불러오는 중'}</div>`; }
  else{
    const run=writeRunning(), goal=W.goal||180, tot=W.min+(run?run.min:0), met=tot>=goal;
    let sub = run ? `<span class="live">${run.label}${run.min>=1?' · '+fmtMin(run.min)+'째':''}</span>${run.title?' · '+esc(run.title):''}`
      : (W.min? '오늘 '+fmtMin(W.min)+' 몰입·타이핑했습니다' : '아직 쓰지 않았습니다');
    if(W.tteo>=1) sub+=' · 떠들기 '+fmtMin(W.tteo);   /* 합계 안의 떠들기 몫 */
    if(!W.goalKnown) sub+=' <span class="of">(목표는 보태기에서 올라오면 바뀝니다)</span>';
    if(Werr) sub+=` <span class="err">· ${esc(Werr)}</span>`;
    sw.innerHTML=stripHTML('글쓰기', W.min, run?run.min:0, goal, sub, met);
    sw.classList.toggle('met',met);
  }

  /* 원고 — 보태기의 나아감(완성 전 원고에서 늘어난 글자), 최근 30일 하루 평균 */
  const sa=$('stripA');
  const aHead=num=>`<div class="strip-head"><span class="strip-name">원고</span>${num||''}</div>`;
  if(Werr==='setup'){ sa.innerHTML=aHead()+`<div class="strip-sub">${setupMsg()}</div>`; sa.classList.remove('met'); }
  else if(!W){ sa.innerHTML=aHead()+`<div class="strip-sub">${Werr?'<span class="err">'+esc(Werr)+'</span>':'불러오는 중'}</div>`; }
  else if(!W.adv){ sa.innerHTML=aHead()+`<div class="strip-sub">날짜별 분량이 아직 올라오지 않았습니다 · 맥의 보태기를 한 번 열어 주세요</div>`; sa.classList.remove('met'); }
  else{
    const a=advAvg(W.adv,W.first), g=writeGoal(), met=a.mae>=g;
    sa.innerHTML=aHead(`<span class="strip-num">${a.mae.toFixed(1)}매 <span class="of">/ ${maeTxt(g)}매</span></span>`)
      +`<div class="gauge"><i class="done" style="width:${Math.max(0,Math.min(100,a.mae/g*100))}%"></i></div>`
      +`<div class="strip-sub">최근 ${a.n}일 하루 평균 · 쓴 날 ${a.days}일</div>`
      +(met?'<span class="stamp">채움</span>':'');
    sa.classList.toggle('met',met);
  }

  /* 독서 */
  const sr=$('stripR'); sr.href=linkFor('read');
  if(Rerr==='setup'){ sr.removeAttribute('href'); sr.innerHTML=`<div class="strip-head"><span class="strip-name">독서</span></div><div class="strip-sub">${setupMsg()}</div>`; sr.classList.remove('met'); }
  else if(!R){ sr.innerHTML=`<div class="strip-head"><span class="strip-name">독서</span></div><div class="strip-sub">${Rerr?'<span class="err">'+esc(Rerr)+'</span>':'불러오는 중'}</div>`; }
  else{
    const run=readRunning(), tot=R.min+(run?run.min:0), met=tot>=R.goal;
    let sub = run ? `<span class="live">${esc(run.label)}${run.min>=1?' · '+fmtMin(run.min)+'째':''}</span>${run.title?' · 『'+esc(run.title)+'』':''}`
      : (R.titles.length? R.titles.map(t=>'『'+esc(t)+'』').join(' ')+'을 읽었습니다' : '아직 읽지 않았습니다');
    if(Rerr) sub+=` <span class="err">· ${esc(Rerr)}</span>`;
    sr.innerHTML=stripHTML('독서', R.min, run?run.min:0, R.goal, sub, met);
    sr.classList.toggle('met',met);
  }

  renderPgStrip();
  renderRunStrips();

  /* 할 일 */
  const st=$('stripT'), href=esc(linkFor('todo'));
  const a=(inner,cls)=>`<li${cls?' class="'+cls+'"':''}><a href="${href}" target="sijak_todo" rel="opener">${inner}</a></li>`;
  let h=`<div class="strip-head"><span class="strip-name">할 일</span><span class="strip-num"><a class="of" href="${href}" target="sijak_todo" rel="opener">미래 열기</a></span></div>`;
  if(Terr==='setup') h+=`<div class="strip-sub">${setupMsg()}</div>`;
  else if(!T) h+=`<div class="strip-sub">${Terr?'<span class="err">'+esc(Terr)+'</span>':'불러오는 중'}</div>`;
  else{
    const li=[];
    if(T.cur){
      const since=T.curAt?Math.max(0,(Date.now()-Date.parse(T.curAt))/60000):0;
      li.push(a(`<span class="k">지금</span><span class="t">${esc(T.cur.title)}</span><span class="m">${T.curDev&&T.curDev!==myDevice()?esc(T.curDev)+' · ':''}${since>=1?fmtMin(since)+'째':''}</span>`,'now'));
    }
    T.dailies.forEach(i=>li.push(a(`<span class="k">매일</span><span class="t">${esc(i.title)}</span><span class="m"></span>`)));
    T.dues.forEach(i=>{ const n=daysBetween(dayKey(),i.deadline);
      li.push(a(`<span class="k">마감</span><span class="t">${esc(i.title)}</span><span class="m due">${n<0?(-n)+'일 지남':n===0?'오늘까지':n+'일 남음'}</span>`)); });
    if(li.length) h+=`<ul class="todo">${li.join('')}</ul>`;
    else h+=`<div class="strip-sub">오늘 매일 하는 일을 모두 마쳤고, 이레 안에 닥친 마감도 없습니다.</div>`;
    if(T.rest) h+=`<p class="more">그 밖에 리스트에 ${T.rest}가지가 있습니다.</p>`;
    if(Terr) h+=`<p class="err">${esc(Terr)}</p>`;
  }
  st.innerHTML=h;

  /* 수입 */
  renderIncStrip();

  const t=new Date(lastLoad||Date.now());
  $('foot').textContent = lastLoad ? pad(t.getHours())+':'+pad(t.getMinutes())+'에 불러왔습니다 · 앱을 닫고 돌아오면 다시 불러옵니다' : '';
}

/* ═════════ 모닝페이지 ═════════ */
const MP_KEY='sijak.mp';
let MP=Object.assign({entries:{}, dirty:{}, since:'', soundOn:true}, lsGet(MP_KEY,{}));
if(!MP.entries) MP.entries={}; if(!MP.dirty) MP.dirty={};
function mpPersist(){ lsSet(MP_KEY,MP); }
function touchEntry(k){ const e=MP.entries[k]; e.updatedAt=new Date().toISOString(); e.device=myDevice(); MP.dirty[k]=1; mpPersist(); queuePush(); }

let pushT=null, pushing=false, mpTableMissing=false;
function queuePush(){ clearTimeout(pushT); pushT=setTimeout(pushMP,1200); }
async function pushMP(){
  if(!mrOn()||pushing) return;
  const ks=Object.keys(MP.dirty); if(!ks.length) return;
  pushing=true; setDot('mp','busy','모닝페이지 올리는 중');
  try{
    for(let i=0;i<ks.length;i+=100){
      const part=ks.slice(i,i+100);
      await upsert(cfg.mr,'mp_entries',part.map(k=>({id:k, data:MP.entries[k], updated_at:MP.entries[k].updatedAt||new Date().toISOString()})));
      part.forEach(k=>{ if(MP.entries[k]&&MP.dirty[k]) delete MP.dirty[k]; });
      mpPersist();
    }
    mpTableMissing=false; setDot('mp','ok','');
    stamp('저장·동기화됨');
  }catch(er){
    mpTableMissing=missingTable(er);
    setDot('mp','err', mpTableMissing?'Supabase에 모닝페이지 표가 없습니다 · 설정에서 SQL을 실행하세요':'모닝페이지를 올리지 못했습니다 · '+er.message);
    stamp(mpTableMissing?'이 기기에만 저장됨 · 설정에서 표를 만드세요':'이 기기에만 저장됨 · 연결되면 올립니다');
  }
  pushing=false;
  if(Object.keys(MP.dirty).length && !mpTableMissing) queuePush();
}
/* 더 나중에 고친 쪽이 이긴다. 이 기기에서 아직 못 올린 것은 덮지 않는다. */
async function pullMP(full){
  if(!mrOn()) return;
  try{
    let q='mp_entries?select=id,data,updated_at&order=updated_at.asc';
    if(!full && MP.since){ const s=new Date(Date.parse(MP.since)-10*60000).toISOString(); q+='&updated_at=gte.'+enc(s); }
    let off=0, max=MP.since||'', changed=[];
    for(;;){
      const rows=await rest(cfg.mr,q+'&limit=500&offset='+off);
      (rows||[]).forEach(r=>{
        if(r.updated_at>max) max=r.updated_at;
        const loc=MP.entries[r.id], rem=r.data||{};
        if(MP.dirty[r.id]) return;
        if(!loc || (rem.updatedAt||'')>(loc.updatedAt||'')){ MP.entries[r.id]=rem; changed.push(r.id); }
      });
      if(!rows||rows.length<500) break; off+=500;
    }
    MP.since=max; mpPersist(); mpTableMissing=false;
    if(Object.keys(MP.dirty).length) queuePush();
    return changed;
  }catch(er){
    mpTableMissing=missingTable(er);
    setDot('mp','err', mpTableMissing?'Supabase에 모닝페이지 표가 없습니다 · 설정에서 SQL을 실행하세요':'모닝페이지를 받지 못했습니다');
    return [];
  }
}

/* 예전 모닝페이지 앱(같은 주소, morningpages_v1)에서 가져오기: 없는 날은 더하고, 있는 날은 주석을 합친다 */
function mergeOld(data){
  if(!data||!data.entries) return 0;
  let n=0;
  Object.keys(data.entries).forEach(k=>{
    const o=data.entries[k]; if(!o||!(o.text||'').trim()) return;
    const c=MP.entries[k];
    if(!c){ MP.entries[k]={text:o.text, words:countWords(o.text), completedAt:o.completedAt||null, annotations:(o.annotations||[]).slice(), updatedAt:o.updatedAt||new Date(parseKey(k).getTime()+12*3600000).toISOString(), device:'맥북', from:'모닝페이지'}; MP.dirty[k]=1; n++; return; }
    let ch=false;
    if((o.text||'').length>(c.text||'').length && (o.updatedAt||'')>=(c.updatedAt||'')){ c.text=o.text; c.words=countWords(o.text); ch=true; }
    const have=new Set((c.annotations||[]).map(a=>a.id));
    (o.annotations||[]).forEach(a=>{ if(!have.has(a.id)){ (c.annotations=c.annotations||[]).push(a); ch=true; } });
    if(ch){ c.updatedAt=new Date().toISOString(); MP.dirty[k]=1; n++; }
  });
  mpPersist(); queuePush();
  return n;
}
(function autoImport(){
  if(lsGet('sijak.mpImported',false)) return;
  const old=lsGet('morningpages_v1',null);
  if(old&&old.entries&&Object.keys(old.entries).length){
    const n=mergeOld(old);
    lsSet('sijak.mpImported',true);
    if(typeof old.soundOn==='boolean'){ MP.soundOn=old.soundOn; mpPersist(); }
    if(n) setTimeout(()=>toast('예전 모닝페이지 '+n+'일치를 옮겨 왔습니다'),600);
  }
})();

function chime(){
  if(MP.soundOn===false) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [[523.25,0],[783.99,.28]].forEach(([f,t])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,ctx.currentTime+t);
      g.gain.linearRampToValueAtTime(.18,ctx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+1.4);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+1.5);
    });
  }catch(e){}
}

/* ═════════ 하루 정리 — 지난 모닝페이지에 붉은 주석 ═════════ */
let agoN=1, anchorDay=parseKey(dayKey()).getDate(), curKey=null;
function agoText(n){ return n===12?'1년 전':(n>12?Math.floor(n/12)+'년 '+(n%12?n%12+'개월 ':'')+'전':n+'개월 전'); }
function monthsBack(base,n){ const d=new Date(base.getFullYear(),base.getMonth()-n,1); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(base.getDate(),last)); return d; }
function hasText(k){ const e=MP.entries[k]; return e&&e.text&&e.text.trim(); }
function renderClose(){

function nearestBefore(k){ const t=dayKey(); const ks=Object.keys(MP.entries).filter(x=>x<k&&x!==t&&hasText(x)).sort(); return ks.length?ks[ks.length-1]:null; }
function buildJump(){
  const sel=$('dateJump'), t=dayKey();

  sel.onchange=()=>{ if(sel.value) jumpTo(sel.value); };

function jumpTo(k){

function renderDirect(k){

function renderEntry(host,k){
  const e=MP.entries[k];
  host.innerHTML='';

  const text=e.text, anns=(e.annotations||[]).slice().sort((a,b)=>a.start-b.start);

    if(a.start>pos) body.appendChild(document.createTextNode(text.slice(pos,a.start)));

    del.onclick=ev=>{ ev.stopPropagation(); if(confirm('이 주석을 지울까요?')){ e.annotations=e.annotations.filter(x=>x.id!==a.id); touchEntry(k); renderDirect(k); } };
    note.appendChild(del); body.appendChild(note);

  });

function offsetIn(body,node,off){
  let acc=0;
  const w=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,{acceptNode(n){ return n.parentElement&&n.parentElement.closest('.note')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT; }});
  let c; while((c=w.nextNode())){ if(c===node) return acc+off; acc+=c.nodeValue.length; }
  return null;
}
let pendingSel=null;
function maybePop(body){
  const pop=$('annPop'), sel=window.getSelection();
  pop.style.display='none'; pendingSel=null;
  if(!sel||sel.isCollapsed||!sel.rangeCount) return;
  const r=sel.getRangeAt(0);
  if(!body.contains(r.startContainer)||!body.contains(r.endContainer)) return;
  if(r.startContainer.nodeType!==3||r.endContainer.nodeType!==3) return;
  if(r.startContainer.parentElement.closest('.note')||r.endContainer.parentElement.closest('.note')) return;
  const s=offsetIn(body,r.startContainer,r.startOffset), en=offsetIn(body,r.endContainer,r.endOffset);
  if(s==null||en==null||en<=s) return;
  const k=body.dataset.key, e=MP.entries[k];
  if((e.annotations||[]).some(a=>s<a.end&&en>a.start)){ toast('이미 주석이 달린 부분과 겹칩니다'); return; }
  pendingSel={key:k,start:s,end:en,text:e.text.slice(s,en)};
  const rc=r.getBoundingClientRect();
  pop.style.display='block';
  pop.style.left=Math.max(12,rc.left+rc.width/2-pop.offsetWidth/2+window.scrollX)+'px';
  pop.style.top=(rc.top+window.scrollY-pop.offsetHeight-10)+'px';
}

$('annPopBtn').onclick=()=>{

/* ═════════ 달력 — 일정을 적고, 오늘 화면에 매일 일정과 다가오는 일정을 보인다 ═════════
   일정 하나 = cal_events 한 줄. data: { id, title, date, time, place, memo,
   repeat:'none'|'daily'|'weekly'|'monthly', until, done:{날짜키:1|0}, deleted, updatedAt, device }
   달력 칸은 실제 날짜, ‘오늘’과 매일 일정의 체크는 새벽 4시 기준. */
const CAL_KEY='sijak.cal';
let CAL=Object.assign({events:{}, dirty:{}, since:''}, lsGet(CAL_KEY,{}));
if(!CAL.events) CAL.events={}; if(!CAL.dirty) CAL.dirty={};
let calTableMissing=false, calPushT=null, calPushing=false;
function calPersist(){ lsSet(CAL_KEY,CAL); }
function liveEvents(){ return Object.values(CAL.events).filter(e=>e&&!e.deleted&&e.date&&e.title); }
function touchEv(ev){
  ev.updatedAt=new Date().toISOString(); ev.device=myDevice();
  if(ev.done){ const cut=keyOf(new Date(Date.now()-120*86400000)); Object.keys(ev.done).forEach(k=>{ if(k<cut) delete ev.done[k]; }); }
  CAL.events[ev.id]=ev; CAL.dirty[ev.id]=1; calPersist();
  clearTimeout(calPushT); calPushT=setTimeout(pushCal,800);
}
async function pushCal(){
  if(!mrOn()||calPushing) return;
  const ids=Object.keys(CAL.dirty); if(!ids.length) return;
  calPushing=true; setDot('cal','busy','일정 올리는 중');
  try{
    for(let i=0;i<ids.length;i+=100){
      const part=ids.slice(i,i+100), sent={};
      part.forEach(id=>sent[id]=CAL.events[id].updatedAt);
      await upsert(cfg.mr,'cal_events',part.map(id=>({id, data:CAL.events[id], updated_at:CAL.events[id].updatedAt||new Date().toISOString()})));
      part.forEach(id=>{ if(CAL.events[id]&&CAL.events[id].updatedAt===sent[id]) delete CAL.dirty[id]; });
      calPersist();
    }
    calTableMissing=false; setDot('cal','ok','');
  }catch(er){
    calTableMissing=missingTable(er);
    setDot('cal','err', calTableMissing?'Supabase에 일정 표가 없습니다 · 설정에서 SQL을 실행하세요':'일정을 올리지 못했습니다 · '+er.message);
  }
  calPushing=false;
  if(Object.keys(CAL.dirty).length && !calTableMissing){ clearTimeout(calPushT); calPushT=setTimeout(pushCal,calTableMissing?60000:15000); }
}
/* 더 나중에 고친 쪽이 이긴다. 이 기기에서 아직 못 올린 일정은 덮지 않고, 체크만 합친다(이 기기 쪽이 우선). */
async function pullCal(){
  if(!mrOn()) return false;
  try{
    let q='cal_events?select=id,data,updated_at&order=updated_at.asc';
    if(CAL.since) q+='&updated_at=gte.'+enc(new Date(Date.parse(CAL.since)-10*60000).toISOString());
    let off=0, max=CAL.since||'', changed=false;
    for(;;){
      const rows=await rest(cfg.mr,q+'&limit=500&offset='+off);
      (rows||[]).forEach(r=>{
        if(r.updated_at>max) max=r.updated_at;
        const rem=r.data; if(!rem||!rem.id) return;
        const loc=CAL.events[r.id];
        if(CAL.dirty[r.id]){ if(loc&&rem.done){ loc.done=Object.assign({},rem.done,loc.done||{}); } return; }
        if(!loc||(rem.updatedAt||'')>(loc.updatedAt||'')){ CAL.events[r.id]=rem; changed=true; }
      });
      if(!rows||rows.length<500) break; off+=500;
    }
    CAL.since=max; calPersist(); calTableMissing=false;
    if(Object.keys(CAL.dirty).length) pushCal(); else setDot('cal','ok','');
    return changed;
  }catch(er){
    calTableMissing=missingTable(er);
    if(calTableMissing && !Object.keys(CAL.events).length) setDot('cal','','');
    else setDot('cal','err', calTableMissing?'Supabase에 일정 표가 없습니다 · 설정에서 SQL을 실행하세요':'일정을 받지 못했습니다');
    return false;
  }
}

/* 되풀이 계산 */
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); }
function lastDayOf(y,m){ return new Date(y,m+1,0).getDate(); }
function occursOn(ev,k){
  if(k<ev.date) return false;
  if(ev.until && k>ev.until) return false;
  const r=ev.repeat||'none';
  if(r==='none') return k===ev.date;
  if(r==='daily') return true;
  const d=parseKey(k), s=parseKey(ev.date);
  if(r==='weekly') return d.getDay()===s.getDay();
  if(r==='monthly') return d.getDate()===Math.min(s.getDate(), lastDayOf(d.getFullYear(),d.getMonth()));
  return false;
}
function evAt(ev,k){ const [h,m]=(ev.time||'0:0').split(':').map(Number); const d=parseKey(k); d.setHours(h||0,m||0,0,0); return d; }
function nextOcc(ev,today,now){
  const ok=k=>!ev.time || evAt(ev,k)>now;
  if((ev.repeat||'none')==='none') return (ev.date>=today && ok(ev.date))?ev.date:null;
  let k=ev.date>today?ev.date:today;
  for(let i=0;i<400;i++){ if(ev.until&&k>ev.until) return null; if(occursOn(ev,k)&&ok(k)) return k; k=addDays(k,1); }
  return null;
}
const byTime=(a,b)=>(a.time||'').localeCompare(b.time||'');
function isDone(ev,k){ return !!(ev.done&&ev.done[k]===1); }
function repeatText(ev){
  const r=ev.repeat||'none', s=parseKey(ev.date);
  if(r==='daily') return '매일';
  if(r==='weekly') return '매주 '+WD[s.getDay()]+'요일';
  if(r==='monthly') return '매달 '+s.getDate()+'일';
  return '';
}
function relDay(k){
  const n=daysBetween(dayKey(),k);
  if(n===0) return '오늘'; if(n===1) return '내일'; if(n===2) return '모레';
  const d=parseKey(k); return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+WD[d.getDay()];
}
function upcoming(n){
  const today=dayKey(), now=new Date(), out=[];
  liveEvents().filter(e=>e.repeat!=='daily').forEach(ev=>{ const k=nextOcc(ev,today,now); if(k) out.push({k, time:ev.time||'', title:ev.title, place:ev.place||'', id:ev.id}); });
  ((T&&T.deadlines)||[]).forEach(i=>{ if(i.deadline>=today) out.push({k:i.deadline, time:'', title:i.title, due:true}); });
  out.sort((a,b)=>a.k.localeCompare(b.k)||byTime(a,b));
  return out.slice(0,n);
}
function toggleDone(id,k){
  const ev=CAL.events[id]; if(!ev) return;
  ev.done=ev.done||{};
  ev.done[k]=isDone(ev,k)?0:1;
  touchEv(ev);
}

/* 오늘 화면: 날짜 아래 */
function renderAgenda(){
  const host=$('agenda'); if(!host) return;
  const today=dayKey();
  const daily=liveEvents().filter(e=>e.repeat==='daily'&&occursOn(e,today)).sort(byTime);
  const pend=daily.filter(e=>!isDone(e,today)), doneN=daily.length-pend.length;
  const up=upcoming(3);
  const place=o=>o.place?`<span class="pl"> · ${esc(o.place)}</span>`:'';
  let h='';
  if(pend.length) h+='<ul class="ag daily">'+pend.map(e=>
    `<li><button class="ck" data-ck="${esc(e.id)}" aria-label="${esc(e.title)} 마침"></button><span class="when">${esc(e.time||'')}</span><span class="what">${esc(e.title)}${place(e)}</span></li>`).join('')+'</ul>';
  if(up.length) h+='<ul class="ag up">'+up.map(o=>{
    const when=`<span class="when">${relDay(o.k)}${o.time?' '+esc(o.time):''}</span>`;
    if(o.due) return `<li class="go"><a class="row" href="${esc(linkFor('todo'))}" target="sijak_todo" rel="opener">${when}<span class="what"><span class="tag">마감</span>${esc(o.title)}</span></a></li>`;
    return `<li class="go" data-open="${esc(o.id)}" data-k="${o.k}">${when}<span class="what">${esc(o.title)}${place(o)}</span></li>`;
  }).join('')+'</ul>';
  const notes=[];
  if(doneN) notes.push(`<button data-cal="today">오늘의 매일 일정 ${doneN}가지를 마쳤습니다</button>`);
  if(!daily.length && !up.length) notes.push(`다가오는 일정이 없습니다 · <button data-cal="today">달력에 적기</button>`);

let calMonth=null, calSel=null, calEdit=null;
function calOpen(k,id){ calSel=k||dayKey(); calMonth=null; calEdit=id||null; go('cal'); }
window.calOpen=calOpen;
function itemsOn(k,withDaily){
  const list=liveEvents().filter(e=>(withDaily||e.repeat!=='daily')&&occursOn(e,k)).map(e=>({ev:e,time:e.time||'',title:e.title}));
  list.sort(byTime);
  const dues=((T&&T.deadlines)||[]).filter(i=>i.deadline===k).map(i=>({due:true,time:'',title:i.title}));
  return dues.concat(list);
}
function renderCal(){
  const host=$('calHost'), today=dayKey();
  if(!calSel) calSel=today;
  if(!calMonth){ const d=parseKey(calSel); calMonth=new Date(d.getFullYear(),d.getMonth(),1); }
  const y=calMonth.getFullYear(), m=calMonth.getMonth();
  const first=new Date(y,m,1).getDay(), weeks=Math.ceil((first+lastDayOf(y,m))/7);
  let g=WD.map((w,i)=>`<div class="wd${i===0?' sun':i===6?' sat':''}">${w}</div>`).join('');
  for(let i=0;i<weeks*7;i++){
    const d=new Date(y,m,1-first+i), k=keyOf(d), its=itemsOn(k,false);
    const cls=['cell']; if(d.getMonth()!==m) cls.push('out'); if(k===today) cls.push('today'); if(k===calSel) cls.push('sel');
    if(d.getDay()===0) cls.push('sun'); if(d.getDay()===6) cls.push('sat');
    const shown=its.slice(0,3).map(o=>`<span class="c${o.due?' due':''}">${o.time?esc(o.time)+' ':''}${esc(o.title)}</span>`).join('')
      + (its.length>3?`<span class="c more">+${its.length-3}</span>`:'');
    g+=`<div class="${cls.join(' ')}" role="button" tabindex="0" data-k="${k}" aria-label="${d.getMonth()+1}월 ${d.getDate()}일${its.length?', 일정 '+its.length+'개':''}"><span class="n">${d.getDate()}</span><span class="ct">${shown}</span></div>`;
  }
  const sd=parseKey(calSel);
  const dayItems=itemsOn(calSel,true);
  const rows=dayItems.map(o=>{
    if(o.due) return `<li class="go"><a class="row" href="${esc(linkFor('todo'))}" target="sijak_todo" rel="opener"><span></span><span class="when due">마감</span><span class="what">${esc(o.title)}</span></a></li>`;
    const e=o.ev, daily=e.repeat==='daily', rp=repeatText(e);
    const box=daily?`<button class="ck${isDone(e,calSel)?' on':''}" data-ck="${esc(e.id)}"${calSel>today?' disabled':''} aria-label="${esc(e.title)} 마침"></button>`:'<span></span>';
    return `<li class="go" data-edit="${esc(e.id)}">${box}<span class="when">${esc(e.time||'메모')}</span><span class="what">${rp?`<span class="tag rp">${rp}</span>`:''}${esc(e.title)}${e.place?`<span class="pl"> · ${esc(e.place)}</span>`:''}${e.memo?`<span class="memo">${esc(e.memo)}</span>`:''}</span></li>`;
  }).join('');
  host.innerHTML=`
  <div class="calhead">
    <button class="arrow" id="calPrev" aria-label="지난달">←</button>
    <div class="mid"><h2>${y}년 ${m+1}월</h2><button id="calToday">오늘</button></div>
    <button class="arrow" id="calNext" aria-label="다음 달">→</button>
  </div>
  <div class="grid">${g}</div>
  ${calTableMissing&&mrOn()?`<p class="calmsg">Supabase에 일정 표가 없어 일정이 이 기기에만 저장됩니다. <button class="linkish" onclick="go('set')">설정</button>에서 일정 표 SQL을 한 번 실행하세요.</p>`:''}
  ${!mrOn()?`<p class="calmsg">미래 프로젝트를 잇지 않아 일정이 이 기기에만 저장됩니다. <button class="linkish" onclick="go('set')">설정</button></p>`:''}
  <div class="dd">
    <div class="dd-head"><h3>${sd.getMonth()+1}월 ${sd.getDate()}일 ${WD[sd.getDay()]}요일${calSel===today?' · 오늘':''}</h3><span class="dd-btns"><button class="btn" id="calDiary">일기 쓰기</button><button class="btn" id="calNew">이 날에 일정 적기</button></span></div>
    ${rows?`<ul class="ag dd-list">${rows}</ul>`:'<p class="empty">이 날에 적힌 일정이 없습니다.</p>'}
    <div id="calForm"></div>
  </div>`;
  $('calPrev').onclick=()=>{ calMonth=new Date(y,m-1,1); calEdit=null; renderCal(); };
  $('calNext').onclick=()=>{ calMonth=new Date(y,m+1,1); calEdit=null; renderCal(); };
  $('calToday').onclick=()=>{ calSel=today; calMonth=null; calEdit=null; renderCal(); };
  $('calNew').onclick=()=>{ calEdit='new'; renderCal(); };
  $('calDiary').onclick=()=>openDiary(calSel);
  host.querySelector('.grid').onclick=ev=>{ const c=ev.target.closest('.cell'); if(!c) return; calSel=c.dataset.k; calEdit=null;
    const d=parseKey(calSel); if(d.getMonth()!==m||d.getFullYear()!==y) calMonth=null; renderCal(); };
  host.querySelector('.grid').onkeydown=ev=>{ if((ev.key==='Enter'||ev.key===' ')&&ev.target.classList.contains('cell')){ ev.preventDefault(); ev.target.click(); } };
  const list=host.querySelector('.dd-list');
  if(list) list.onclick=ev=>{
    const ck=ev.target.closest('[data-ck]');
    if(ck){ ev.stopPropagation(); toggleDone(ck.dataset.ck, calSel); renderCal(); return; }
    const li=ev.target.closest('[data-edit]'); if(li){ calEdit=li.dataset.edit; renderCal(); }
  };
  if(calEdit) renderForm();
}
function renderForm(){
  const isNew=calEdit==='new', e=isNew?{title:'',date:calSel,time:'',place:'',memo:'',repeat:'none',until:''}:CAL.events[calEdit];
  if(!e){ calEdit=null; return; }
  const box=$('calForm'), rep=e.repeat||'none';
  box.innerHTML=`<div class="evform">
    <div class="field"><label for="fT">제목</label><input id="fT" value="${esc(e.title)}"></div>
    <div class="frow">
      <div class="field"><label for="fD">날짜</label><input id="fD" type="date" value="${esc(e.date)}"></div>
      <div class="field"><label for="fH">시간 (비우면 메모)</label><input id="fH" type="time" value="${esc(e.time||'')}"></div>
    </div>
    <div class="field"><label for="fP">장소</label><input id="fP" value="${esc(e.place||'')}"></div>
    <div class="field"><label for="fM">메모</label><textarea id="fM">${esc(e.memo||'')}</textarea></div>
    <div class="frow">
      <div class="field"><label for="fR">되풀이</label><select id="fR"></select></div>
      <div class="field" id="fUw"><label for="fU">끝나는 날 (비우면 계속)</label><input id="fU" type="date" value="${esc(e.until||'')}"></div>
    </div>
    ${!isNew&&rep!=='none'?'<p class="hint">되풀이 일정을 고치면 모든 날에 함께 바뀝니다. 날짜는 되풀이가 시작된 날입니다.</p>':''}
    <div class="btnrow">
      <button class="btn solid" id="fSave">저장</button>
      <button class="btn" id="fCancel">취소</button>
      ${!isNew&&rep!=='none'&&calSel>e.date?'<button class="btn warn" id="fStop">이 날부터 그만두기</button>':''}
      ${!isNew?'<button class="btn warn" id="fDel">지우기</button>':''}
    </div></div>`;
  const fillRepeat=()=>{
    const d=$('fD').value||calSel, s=parseKey(d), cur=$('fR').value||rep;
    $('fR').innerHTML=[['none','없음'],['daily','매일 (체크하면 오늘 화면에서 사라짐)'],['weekly','매주 '+WD[s.getDay()]+'요일'],['monthly','매달 '+s.getDate()+'일']]
      .map(([v,t])=>`<option value="${v}"${v===cur?' selected':''}>${t}</option>`).join('');
    $('fUw').style.visibility=$('fR').value==='none'?'hidden':'visible';
  };
  fillRepeat();
  $('fD').onchange=fillRepeat; $('fR').onchange=fillRepeat;
  if(isNew) setTimeout(()=>$('fT').focus(),30);
  $('fCancel').onclick=()=>{ calEdit=null; renderCal(); };
  $('fSave').onclick=()=>{
    const title=$('fT').value.trim(), date=$('fD').value;
    if(!title){ $('fT').focus(); toast('제목을 적어 주세요'); return; }
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){ $('fD').focus(); toast('날짜를 골라 주세요'); return; }
    const repeat=$('fR').value, until=repeat==='none'?'':($('fU').value||'');
    if(until&&until<date){ $('fU').focus(); toast('끝나는 날이 시작하는 날보다 앞섭니다'); return; }
    const ev=isNew?{id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), done:{}}:CAL.events[calEdit];
    Object.assign(ev,{title, date, time:$('fH').value||'', place:$('fP').value.trim(), memo:$('fM').value.trim(), repeat, until});
    touchEv(ev);
    calSel=isNew?date:calSel; if(isNew){ const d=parseKey(date); calMonth=new Date(d.getFullYear(),d.getMonth(),1); }
    calEdit=null; renderCal(); toast(isNew?'일정을 적었습니다':'일정을 고쳤습니다');
  };
  if($('fStop')) $('fStop').onclick=()=>{
    if(!confirm('‘'+e.title+'’을 '+relDay(calSel)+'부터 그만둘까요? 지난 날의 기록은 남습니다.')) return;
    e.until=addDays(calSel,-1); touchEv(e); calEdit=null; renderCal(); toast('이 날부터 그만두었습니다');
  };
  if($('fDel')) $('fDel').onclick=()=>{
    if(!confirm(rep==='none'?'이 일정을 지울까요?':'이 되풀이 일정을 모든 날에서 지울까요?')) return;
    e.deleted=true; touchEv(e); calEdit=null; renderCal(); toast('일정을 지웠습니다');
  };
}

async function probe(){

/* ═════════ 수입 — 달마다의 합계로 최근 12개월 한 달 평균을 본다 ═════════
   income_log 한 줄 = 적은 것 하나. data: { id, date:'YYYY-MM-DD', amount(원, 실수령), seed?, deleted, updatedAt, device }
   seed:true는 수입 장부 CSV에서 채운 그 달의 합계(id 'm'+YYYY-MM, date는 그달 1일). 지급처·메모는 두지 않는다.
   id 'conf'는 { goal(평균의 기준선, 원), writeGoal(원고 칸의 기준선, 매), readGoal(쪽수 칸의 기준선, 쪽) } — 저장할 때 touchIncConf로 제 칸만 바꾼다.
   평균은 지난달까지 끝난 12개월로 낸다. 이번 달은 평균에 넣지 않고 따로 보인다. 달은 적은 날짜 그대로 가른다. */
const INC_KEY='sijak.inc', INC_DEF_GOAL=7000000;
let INC=Object.assign({rows:{}, dirty:{}, since:''}, lsGet(INC_KEY,{}));
if(!INC.rows) INC.rows={}; if(!INC.dirty) INC.dirty={};
let incTableMissing=false, incPushT=null, incPushing=false;
let incDraft={date:'', amount:'', warned:false};
function incPersist(){ lsSet(INC_KEY,INC); }
function incGoal(){ const c=INC.rows.conf; return (c&&+c.goal>0)?+c.goal:INC_DEF_GOAL; }
/* 원고 칸의 기준선(매) — 표를 새로 만들지 않고 income_log의 conf 줄에 함께 둔다 */
const WRITE_DEF_GOAL=4;
function writeGoal(){ const c=INC.rows.conf; return (c&&+c.writeGoal>0)?+c.writeGoal:WRITE_DEF_GOAL; }
function maeTxt(v){ return String(Math.round(v*10)/10); }
/* conf 줄은 수입 기준선과 원고 기준선이 함께 쓴다 — 통째로 덮지 않고 제 칸만 바꾼다 */
function touchIncConf(p){ const c=INC.rows.conf||{}; const r=Object.assign({},c,p,{id:'conf'}); delete r.deleted; touchInc(r); }
function incLive(){ return Object.values(INC.rows).filter(r=>r&&r.id!=='conf'&&!r.deleted&&/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')&&+r.amount); }
function touchInc(r){
  r.updatedAt=new Date().toISOString(); r.device=myDevice();
  INC.rows[r.id]=r; INC.dirty[r.id]=1; incPersist();
  clearTimeout(incPushT); incPushT=setTimeout(pushInc,800);
}
async function pushInc(){
  if(!mrOn()||incPushing) return;
  const ids=Object.keys(INC.dirty); if(!ids.length) return;
  incPushing=true; setDot('inc','busy','수입 올리는 중');
  try{
    for(let i=0;i<ids.length;i+=100){
      const part=ids.slice(i,i+100), sent={};
      part.forEach(id=>sent[id]=INC.rows[id].updatedAt);
      await upsert(cfg.mr,'income_log',part.map(id=>({id, data:INC.rows[id], updated_at:INC.rows[id].updatedAt||new Date().toISOString()})));
      part.forEach(id=>{ if(INC.rows[id]&&INC.rows[id].updatedAt===sent[id]) delete INC.dirty[id]; });
      incPersist();
    }
    incTableMissing=false; setDot('inc','ok','');
  }catch(er){
    incTableMissing=missingTable(er);
    setDot('inc','err', incTableMissing?'Supabase에 수입 표가 없습니다 · 설정에서 SQL을 실행하세요':'수입을 올리지 못했습니다 · '+er.message);
  }
  incPushing=false;
  if(Object.keys(INC.dirty).length && !incTableMissing){ clearTimeout(incPushT); incPushT=setTimeout(pushInc,15000); }
}
/* 더 나중에 고친 쪽이 이긴다. 이 기기에서 아직 못 올린 줄은 덮지 않는다. */
async function pullInc(){
  if(!mrOn()) return false;
  try{
    let q='income_log?select=id,data,updated_at&order=updated_at.asc';
    if(INC.since) q+='&updated_at=gte.'+enc(new Date(Date.parse(INC.since)-10*60000).toISOString());
    let off=0, max=INC.since||'', changed=false;
    for(;;){
      const rows=await rest(cfg.mr,q+'&limit=500&offset='+off);
      (rows||[]).forEach(r=>{
        if(r.updated_at>max) max=r.updated_at;
        const rem=r.data; if(!rem||!rem.id||INC.dirty[r.id]) return;
        const loc=INC.rows[r.id];
        if(!loc||(rem.updatedAt||'')>(loc.updatedAt||'')){ INC.rows[r.id]=rem; changed=true; }
      });
      if(!rows||rows.length<500) break; off+=500;
    }
    INC.since=max; incPersist(); incTableMissing=false;
    if(Object.keys(INC.dirty).length) pushInc(); else setDot('inc','ok','');
    return changed;
  }catch(er){
    incTableMissing=missingTable(er);
    if(incTableMissing && !incLive().length) setDot('inc','','');
    else setDot('inc','err', incTableMissing?'Supabase에 수입 표가 없습니다 · 설정에서 SQL을 실행하세요':'수입을 받지 못했습니다');
    return false;
  }
}

/* 계산 */
function monthAdd(m,n){ const [y,mo]=m.split('-').map(Number); const d=new Date(y,mo-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function monthLabel(m){ const [y,mo]=m.split('-').map(Number); return y+'년 '+mo+'월'; }
const man=n=>{ const v=Math.round(n/10000); return v.toLocaleString('ko-KR')+'만 원'; };
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
function incStats(){
  const sums={};
  incLive().forEach(r=>{ const m=r.date.slice(0,7); sums[m]=(sums[m]||0)+(+r.amount); });
  const ms=Object.keys(sums).sort(), cur=dayKey().slice(0,7), last=monthAdd(cur,-1);
  const out={sums, cur, last, first:ms[0]||null, series:[], avg:null, now:sums[cur]||0};
  if(!ms.length||ms[0]>last) return out;
  for(let m=ms[0]; m<=last; m=monthAdd(m,1)){
    let s=0,n=0; for(let i=0;i<12;i++){ const k=monthAdd(m,-i); if(k<ms[0]) break; s+=sums[k]||0; n++; }
    out.series.push({m, total:sums[m]||0, avg:s/n, n});
  }
  out.avg=out.series[out.series.length-1];
  return out;
}
function incPeriod(a){ return monthLabel(monthAdd(a.m,-(a.n-1)))+'–'+(a.m.slice(0,4)===monthAdd(a.m,-(a.n-1)).slice(0,4)?(+a.m.slice(5))+'월':monthLabel(a.m)); }
function incCompare(avg,g){
  const d=avg-g;
  if(Math.abs(d)<5000) return '기준선 '+man(g)+'과 같습니다';
  return '기준선 '+man(g)+'보다 '+man(Math.abs(d))+' '+(d>0?'많습니다':'적습니다');
}

/* 오늘 화면 — 평균만 */
function renderIncStrip(){
  const el=$('stripI'); if(!el) return;
  const head=num=>`<div class="strip-head"><span class="strip-name">수입</span>${num||''}</div>`;
  if(!mrOn()){ el.innerHTML=head()+`<div class="strip-sub">${setupMsg()}</div>`; el.classList.remove('met'); return; }
  const st=incStats(), g=incGoal(), a=st.avg;
  if(!a){
    el.innerHTML=head()+`<div class="strip-sub">${incTableMissing?'<span class="err">Supabase에 수입 표가 없습니다 · <button class="linkish" onclick="go(\'set\')">설정</button>에서 SQL을 실행하세요</span>':'아직 평균을 낼 수입이 없습니다 · <button class="linkish" onclick="go(\'set\')">설정</button>에서 장부 CSV로 채우세요'}</div>`;
    el.classList.remove('met'); return;
  }
  const met=a.avg>=g;
  el.innerHTML=head(`<span class="strip-num">${man(a.avg)} <span class="of">/ ${man(g)}</span></span>`)
    +`<div class="gauge"><i class="done" style="width:${Math.max(0,Math.min(100,a.avg/g*100))}%"></i></div>`
    +`<div class="strip-sub">${a.n<12?'최근 '+a.n+'개월':'최근 12개월'} 한 달 평균 · ${incCompare(a.avg,g)}</div>`
    +(met?'<span class="stamp">채움</span>':'');
  el.classList.toggle('met',met);
}

/* ═════════ 날마다 쌓이는 숫자의 평균 — 원고(보태기의 나아감)와 독서 쪽수가 함께 쓴다 ═════════
   map = { 'YYYY-MM-DD': 값 }. 값은 원고는 글자, 쪽수는 쪽. div로 나눠 보이는 단위(매·쪽)로 바꾼다 */
const mae1=c=>(c/200).toFixed(1);
function kLabel(k){ const d=parseKey(k); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }
function kLabelY(k){ return k.slice(0,4)+'년 '+kLabel(k); }
/* 오늘(4시 기준)을 넣은 최근 30일. 쉰 날도 나눈다. 기록(first)이 30일이 안 되면 있는 날만큼으로 */
function avgN(map,first,end){
  const k0=end||dayKey(); let sum=0, days=0, n=0;
  for(let i=0;i<30;i++){ const k=addDays(k0,-i); if(first&&k<first) break; const v=+map[k]||0; sum+=v; n++; if(v>0) days++; }
  n=Math.max(1,n);
  return {v:sum/n, days, n, from:addDays(k0,-(n-1)), to:k0};
}
function goalCompare(v,g,fmt,unit){
  const d=v-g, eps=unit==='매'?0.05:0.5;
  if(Math.abs(d)<eps) return '기준선 '+fmt(g)+unit+'와 같습니다';
  return '기준선 '+fmt(g)+unit+'보다 '+fmt(Math.abs(d))+unit+' '+(d>0?'많습니다':'적습니다');
}
/* 최근 30일 날마다 — 쉰 날은 빈칸. tip(k)는 막대에 올렸을 때의 말 */
function barsSVG(map,first,o){
  const k0=dayKey(), ks=[]; for(let i=29;i>=0;i--) ks.push(addDays(k0,-i));
  const vs=ks.map(k=>Math.max(0,+map[k]||0)/o.div), top=Math.max(1,...vs)*1.15;
  const narrow=window.innerWidth<520;
  const W_=narrow?360:640,H=narrow?150:160,L=4,R=4,T=14,B=26,w=W_-L-R,h=H-T-B, bw=w/30;
  let svg=`<svg viewBox="0 0 ${W_} ${H}" role="img" aria-label="최근 30일 날마다">`;
  svg+=`<line x1="${L}" x2="${L+w}" y1="${T+h}" y2="${T+h}" stroke="#d6ccb6"/>`;
  ks.forEach((k,i)=>{ const v=vs[i], x=L+i*bw, before=first&&k<first, tip=esc(o.tip(k,before));
    if(v>0){ const bh=Math.max(1.5,v/top*h); svg+=`<rect x="${x+bw*0.18}" y="${T+h-bh}" width="${bw*0.64}" height="${bh}" fill="${k===k0?'#9b3b32':'#23201c'}"><title>${tip}</title></rect>`; }
    else svg+=`<rect x="${x}" y="${T}" width="${bw}" height="${h}" fill="transparent"><title>${tip}</title></rect>`;
    const d=parseKey(k);
    if(i===0||d.getDate()===1||(i%(narrow?7:5)===0&&i<27)) svg+=`<text x="${x+bw/2}" y="${H-8}" font-size="11.5" fill="#736a59" text-anchor="middle">${i===0||d.getDate()===1?(d.getMonth()+1)+'/':''}${d.getDate()}</text>`;
  });
  const mx=Math.max(...vs); if(mx>0){ const i=vs.indexOf(mx); svg+=`<text x="${L+i*bw+bw/2}" y="${T+h-mx/top*h-4}" font-size="11.5" fill="#736a59" text-anchor="middle">${o.fmt(mx)}</text>`; }
  return svg+'</svg>';
}
/* 평균의 흐름 — 날마다 그날까지의 30일 평균, 30일이 다 찬 것만, 최근 1년. since가 있으면 그날에 옅은 세로 금 */
function flowSVG(map,first,g,o){
  const k0=dayKey(), start0=addDays(first,29); if(start0>k0) return '<p class="note">기록이 30일 쌓이면 흐름을 그립니다.</p>';
  let from=addDays(k0,-364); if(from<start0) from=start0;
  const pts=[]; for(let k=from;k<=k0;k=addDays(k,1)) pts.push({k, v:avgN(map,first,k).v/o.div});
  if(pts.length<2) return '<p class="note">내일부터 흐름을 그립니다.</p>';
  const narrow=window.innerWidth<520;
  const W_=narrow?360:640,H=narrow?190:210,L=8,R=narrow?70:74,T=18,B=30, w=W_-L-R, h=H-T-B;
  const hiV=Math.max(g,...pts.map(p=>p.v))*1.2, loV=Math.max(0,Math.min(g,...pts.map(p=>p.v))*0.7);
  const x=i=>L+i*w/(pts.length-1), y=v=>T+h-(v-loV)/(hiV-loV)*h;
  let svg=`<svg viewBox="0 0 ${W_} ${H}" role="img" aria-label="최근 30일 하루 평균의 흐름">`;
  pts.forEach((p,i)=>{ const d=parseKey(p.k);
    if(d.getDate()===1||i===0){ const long=pts.length>70;
      if(!long||d.getDate()===1) svg+=`<line x1="${x(i)}" x2="${x(i)}" y1="${T+h}" y2="${T+h+4}" stroke="#d6ccb6"/>`;
      if(d.getDate()===1&&(!long||d.getMonth()%(narrow?3:2)===0)||i===0&&(d.getDate()<20)) svg+=`<text x="${x(i)}" y="${H-8}" font-size="11.5" fill="#736a59" text-anchor="${i===0||x(i)-L<24?'start':'middle'}">${(d.getMonth()===0||i===0)?String(d.getFullYear()).slice(2)+'년 ':''}${d.getMonth()+1}월${d.getDate()!==1?' '+d.getDate()+'일':''}</text>`;
    }
    if(o.since&&p.k===o.since&&i>0) svg+=`<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${T+h}" stroke="#d6ccb6" stroke-dasharray="2 3"><title>${esc(o.sinceTip||'')}</title></line>`;
  });
  const gy=y(g);
  svg+=`<line x1="${L}" x2="${L+w}" y1="${gy}" y2="${gy}" stroke="#9b3b32" stroke-width="1" stroke-dasharray="4 4"/>`;
  svg+=`<text x="${L+w+8}" y="${gy+4}" font-size="12" fill="#9b3b32">기준 ${o.fmtG(g)}${o.unit}</text>`;
  svg+=`<polyline fill="none" stroke="#23201c" stroke-width="${pts.length>120?1.6:2}" stroke-linejoin="round" points="${pts.map((p,i)=>x(i).toFixed(1)+','+y(p.v).toFixed(1)).join(' ')}"/>`;
  const lp=pts[pts.length-1], ly=y(lp.v);
  svg+=`<circle cx="${x(pts.length-1)}" cy="${ly}" r="4" fill="${lp.v>=g?'#9b3b32':'#23201c'}"><title>${kLabel(lp.k)}까지 30일 평균 ${o.fmt(lp.v)}${o.unit}</title></circle>`;
  svg+=`<text x="${x(pts.length-1)+8}" y="${ly+(Math.abs(ly-gy)<14?(ly<gy?-6:16):4)}" font-size="13" fill="#23201c">${o.fmt(lp.v)}${o.unit}</text>`;
  return svg+'</svg>';
}
/* 달마다 — 합계, 쓴(읽은) 날, 그달의 날 수(첫 달은 first부터, 이번 달은 오늘까지). extra에 있으면 그 합도 */
function monthsOf(map,first,extra){
  const k0=dayKey(), cur=k0.slice(0,7), out=[];
  for(let m=first.slice(0,7); m<=cur; m=monthAdd(m,1)){
    let sum=0, days=0, n=0, ex=0;
    for(let k=m+'-01'; k.slice(0,7)===m && k<=k0; k=addDays(k,1)){ if(k<first) continue; const v=+map[k]||0; sum+=v; n++; if(v>0) days++; if(extra) ex+=+extra[k]||0; }
    out.push({m, sum, days, n, ex, part:m===cur});
  }
  return out.reverse();
}
function monthTable(ms,head,row){
  const t=`<table class="inctab"><thead><tr>${head}</tr></thead><tbody>`;
  let h=`<h3>달마다</h3>`+t+ms.slice(0,12).map(row).join('')+`</tbody></table>`;
  if(ms.length>12) h+=`<details class="advold"><summary>이전 ${ms.length-12}달 보기</summary>`+t+ms.slice(12).map(row).join('')+`</tbody></table></details>`;

}
function monthNote(first){

    : `<p class="note">하루 평균은 그달의 날 수로 나눕니다. 이번 달은 오늘까지로 나눕니다.</p>`;

/* ═════════ 원고 화면 — 보태기의 나아감(날짜별 글자)을 읽기만 한다 ═════════ */
function advAvg(adv,first,end){ const r=avgN(adv,first,end); r.mae=r.v/200; return r; }

/* ═════════ 쪽수 — 서가의 읽기 기록(seoga_reads)을 읽기만 한다 ═════════
   한 읽기의 쪽 = max(0, toPage − fromPage). 읽은 날 = 그날의 읽은 시간이 있는 날.
   시작 쪽이 0(서가에 쪽이 적히지 않은 책)인데 한 번에 너무 많이 나온 읽기는 중간부터 읽은 책을 처음부터 센 것일 수 있어 뺀다 */
const PG_DEF_GOAL=100, PG_SUSPECT={pages:150, perMin:3};
let RD=null, RDerr='', RDat=0;
function readGoal(){ const c=INC.rows.conf; return (c&&+c.readGoal>0)?+c.readGoal:PG_DEF_GOAL; }
function pgSuspect(x){ return x.fp===0 && x.pages>0 && (x.pages>PG_SUSPECT.pages || x.pages/Math.max(1,x.min)>PG_SUSPECT.perMin); }
async function loadReads(force){
  if(!mrOn()){ RD=null; RDerr='setup'; return; }
  if(!force && RD && Date.now()-RDat<20000) return;
  try{
    const all=[], step=1000;
    for(let off=0; off<50000; off+=step){
      const rows=await rest(cfg.mr,'seoga_reads?select=id,date:data->>date,fp:data->>fromPage,tp:data->>toPage,min:data->>minutes,title:data->>title,gone:data->>gone&data->>kind=eq.read&order=id&limit='+step+'&offset='+off);
      all.push(...(rows||[])); if(!rows||rows.length<step) break;
    }
    const pages={}, mins={}, titles={}, cut=[]; let first='';
    all.forEach(r=>{
      if(r.gone==='true'||!/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')) return;
      const x={date:r.date, fp:+r.fp||0, tp:+r.tp||0, min:+r.min||0, title:r.title||''};
      x.pages=Math.max(0,x.tp-x.fp);
      if(!first||x.date<first) first=x.date;
      mins[x.date]=(mins[x.date]||0)+x.min;
      (titles[x.date]=titles[x.date]||[]); if(x.title&&!titles[x.date].includes(x.title)) titles[x.date].push(x.title);
      if(pgSuspect(x)){ cut.push(x); return; }
      pages[x.date]=(pages[x.date]||0)+x.pages;
    });
    cut.sort((a,b)=>b.date.localeCompare(a.date));
    RD={pages, mins, titles, cut, first:first||dayKey(), n:all.length}; RDat=Date.now(); RDerr='';
  }catch(er){ RDerr=missingTable(er)?'Supabase에 서가 표가 없습니다.':(er.message||'불러오지 못했습니다'); }
}
/* 최근 30일 하루 평균 쪽·시간, 읽은 날(시간이 있는 날) */
function pgAvg(end){
  const a=avgN(RD.pages,RD.first,end), m=avgN(RD.mins,RD.first,end);

/* ═════════ 운동·거리 — 달리기(dalligi.html)의 run_log를 읽기만 한다 ═════════
   act 줄: { kind:'run'|'walk', day(4시 기준), km, sec(러닝 시간), deleted }. conf 줄: { goal(거리 기준선 km), timeGoal(하루 운동 시간 목표, 분) }.
   운동 칸 = 오늘 운동한 시간(러닝 시간의 합). 거리 칸 = 최근 30일 하루 평균 거리(달리기+걷기, 쉰 날 포함). 목표와 기준선은 달리기 앱에서 바꾼다 */
const RUN_DEF_TIME=60, RUN_DEF_KM=4, C_WALK='#8597a4';
let RN=null, RNerr='', RNat=0;
const kmG=v=>String(Math.round(v*10)/10);
async function loadRun(force){
  if(!mrOn()){ RN=null; RNerr='setup'; return; }
  if(!force && RN && Date.now()-RNat<20000) return;
  try{
    const all=[];
    for(let off=0; off<50000; off+=1000){
      const rows=await rest(cfg.mr,'run_log?select=id,data&order=id&limit=1000&offset='+off);
      all.push(...(rows||[])); if(!rows||rows.length<1000) break;
    }
    const km={}, run={}, sec={}, rsec={}; let conf={}, first=null;
    all.forEach(r=>{ const d=r.data; if(!d||d.deleted) return;
      if(d.type==='conf') conf=d;
      else if(d.type==='act' && /^\d{4}-\d{2}-\d{2}$/.test(d.day||'') && +d.km>0){
        km[d.day]=(km[d.day]||0)+(+d.km); sec[d.day]=(sec[d.day]||0)+(+d.sec||0);
        if(d.kind!=='walk'){ run[d.day]=(run[d.day]||0)+(+d.km); rsec[d.day]=(rsec[d.day]||0)+(+d.sec||0); }
        if(!first||d.day<first) first=d.day; } });
    RN={km, run, sec, rsec, first, goalKm:+conf.goal>0?+conf.goal:RUN_DEF_KM, goalMin:+conf.timeGoal>0?+conf.timeGoal:RUN_DEF_TIME}; RNat=Date.now(); RNerr='';
  }catch(er){ RNerr=missingTable(er)?'table':(er.message||'불러오지 못했습니다'); }
}
function runErrMsg(){ return RNerr==='table'?'Supabase에 달리기 표가 아직 없습니다 · 달리기 앱의 설정에서 SQL을 실행하세요':esc(RNerr); }
function distAvg(end){ const a=avgN(RN.km,RN.first,end), r=avgN(RN.run,RN.first,end), t=avgN(RN.sec,RN.first,end); return {v:a.v, run:r.v, walk:Math.max(0,a.v-r.v), min:t.v/60, days:a.days, n:a.n, from:a.from, to:a.to}; }
function distCompare(v,g){ const d=v-g; return Math.abs(d)<0.005?'기준선 '+kmG(g)+'km와 같습니다':'기준선 '+kmG(g)+'km보다 '+Math.abs(d).toFixed(2)+'km '+(d>0?'많습니다':'적습니다'); }
function renderRunStrips(){
  const se=$('stripE'), sd=$('stripD'); if(!se||!sd) return;

  if(RNerr==='setup'){ se.removeAttribute('href'); se.innerHTML=eHead+`<div class="strip-sub">${setupMsg()}</div>`; sd.innerHTML=dHead()+`<div class="strip-sub">${setupMsg()}</div>`; se.classList.remove('met'); sd.classList.remove('met'); return; }
  if(!RN){ const m=`<div class="strip-sub">${RNerr?'<span class="err">'+runErrMsg()+'</span>':'불러오는 중'}</div>`; se.innerHTML=eHead+m; sd.innerHTML=dHead()+m; se.classList.remove('met'); sd.classList.remove('met'); return; }
  /* 운동 — 오늘의 시간 */
  const k=dayKey(), min=(RN.sec[k]||0)/60, rmin=(RN.rsec[k]||0)/60, wmin=Math.max(0,min-rmin), kmT=RN.km[k]||0, gm=RN.goalMin, met=min>=gm;
  let sub = min>0 ? [rmin>=0.5?'달리기 '+fmtMin(rmin):'', wmin>=0.5?'걷기 '+fmtMin(wmin):''].filter(Boolean).join(' · ')+' · '+kmT.toFixed(2)+'km' : '오늘은 아직 적은 운동이 없습니다';
  if(RNerr) sub+=` <span class="err">· ${runErrMsg()}</span>`;
  se.innerHTML=stripHTML('운동', min, 0, gm, sub, met); se.classList.toggle('met',met);
  /* 거리 — 최근 30일 하루 평균 */
  if(!RN.first){ sd.innerHTML=dHead()+`<div class="strip-sub">아직 적은 운동이 없습니다</div>`; sd.classList.remove('met'); return; }
  const a=distAvg(), g=RN.goalKm, dm=a.v>=g;
  sd.innerHTML=dHead(`<span class="strip-num">${a.v.toFixed(2)}km <span class="of">/ ${kmG(g)}km</span></span>`)
    +`<div class="gauge"><i class="done" style="width:${Math.max(0,Math.min(100,a.v/g*100))}%"></i></div>`
    +`<div class="strip-sub">최근 ${a.n}일 하루 평균 · 달리기 ${a.run.toFixed(1)}km · 걷기 ${a.walk.toFixed(1)}km · 운동한 날 ${a.days}일</div>`
    +(dm?'<span class="stamp">채움</span>':'');
  sd.classList.toggle('met',dm);

/* 쌓은 막대 — items: [{a(달리기), b(걷기), lab, tip, hi, top}] */
function stackSVG(items,o){
  const narrow=window.innerWidth<520, W_=narrow?360:640, H=narrow?150:160, L=4, R=4, T=16, B=26, w=W_-L-R, h=H-T-B, bw=w/items.length, gp=o.gap||0.18;
  const top=Math.max(o.min||1, ...items.map(x=>x.a+x.b))*1.15;
  let s=`<svg viewBox="0 0 ${W_} ${H}" role="img" aria-label="${esc(o.label)}"><line x1="${L}" x2="${L+w}" y1="${T+h}" y2="${T+h}" stroke="#d6ccb6"/>`;
  items.forEach((it,i)=>{ const x=L+i*bw, bx=x+bw*gp, bwd=bw*(1-2*gp), ha=it.a/top*h, hb=it.b/top*h;
    if(it.a>0) s+=`<rect x="${bx}" y="${T+h-ha}" width="${bwd}" height="${Math.max(1.5,ha)}" fill="${it.hi?'#9b3b32':'#23201c'}"/>`;
    if(it.b>0) s+=`<rect x="${bx}" y="${T+h-ha-hb}" width="${bwd}" height="${Math.max(1.5,hb)}" fill="${C_WALK}"/>`;
    s+=`<rect x="${x}" y="${T}" width="${bw}" height="${h}" fill="transparent"><title>${esc(it.tip)}</title></rect>`;
    if(it.lab) s+=`<text x="${x+bw/2}" y="${H-8}" font-size="11.5" fill="#736a59" text-anchor="middle">${esc(it.lab)}</text>`;
    if(it.top) s+=`<text x="${x+bw/2}" y="${T+h-ha-hb-4}" font-size="11" fill="#736a59" text-anchor="middle">${esc(it.top)}</text>`; });
  return s+'</svg>';
}
function renderDist(){
  const host=$('distHost'), open=`<p class="note" style="margin-top:28px"><a class="linkish" href="${esc(linkFor('run').replace(/#.*$/,'')+'#flow')}" target="sijak_run" rel="opener">달리기 열기</a> — 페이스·케이던스·같은 힘 비교·코스·신발은 달리기 앱의 흐름에 있습니다.</p>`;

  </div>

  /* 최근 30일 날마다 */
  const items=[]; for(let i=29;i>=0;i--){ const k=addDays(k0,-i), dt=parseKey(k), r=run[k]||0, t=km[k]||0, before=k<first;
    items.push({a:r, b:Math.max(0,t-r), hi:k===k0, lab:(i===29||dt.getDate()===1)?(dt.getMonth()+1)+'/'+dt.getDate():(i%(window.innerWidth<520?7:5)===0&&i>2?String(dt.getDate()):''),

  h+=`<h3>최근 30일 날마다</h3><div class="incchart">${stackSVG(items,{label:'최근 30일 날마다 거리'})}</div>
    <p class="note"><span style="display:inline-block;width:10px;height:10px;background:#23201c;vertical-align:-1px"></span> 달리기 &nbsp;<span style="display:inline-block;width:10px;height:10px;background:${C_WALK};vertical-align:-1px"></span> 걷기</p>`;

}
