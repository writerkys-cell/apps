/* 수입 화면 */
function incChart(st,g){
  /* 12개월이 다 찬 평균만 그린다(그 전의 짧은 평균은 흐름을 흐린다). 모자라면 있는 대로 */
  const fulls=st.series.filter(p=>p.n>=12);
  const pts=(fulls.length>=2?fulls:st.series).slice(-24); if(pts.length<2) return '<p class="note">두 달 이상이 쌓이면 흐름을 그립니다.</p>';
  const narrow=window.innerWidth<520;   /* 좁은 화면은 그림 폭을 줄여 글자를 키운다 */
  const W=narrow?360:640,H=narrow?190:210,L=8,R=narrow?62:78,T=18,B=30, w=W-L-R, h=H-T-B;
  const qs=pts.map((p,i)=>i).filter(i=>[1,4,7,10].includes(+pts[i].m.slice(5)));
  const ticks=new Set(qs); if(!qs.length||qs[0]>=3) ticks.add(0);
  const hiV=Math.max(g,...pts.map(p=>p.avg))*1.2, loV=Math.max(0,Math.min(g,...pts.map(p=>p.avg))*0.7);
  const x=i=>L+(pts.length===1?w/2:i*w/(pts.length-1)), y=v=>T+h-(v-loV)/(hiV-loV)*h;
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 12개월 한 달 평균의 흐름">`;
  const gy=y(g);
  svg+=`<line x1="${L}" x2="${L+w}" y1="${gy}" y2="${gy}" stroke="#9b3b32" stroke-width="1" stroke-dasharray="4 4"/>`;
  svg+=`<text x="${L+w+8}" y="${gy+4}" font-size="12" fill="#9b3b32">기준 ${Math.round(g/10000).toLocaleString('ko-KR')}만</text>`;
  pts.forEach((p,i)=>{ const mo=+p.m.slice(5);
    if(ticks.has(i)) svg+=`<text x="${x(i)}" y="${H-8}" font-size="11.5" fill="#736a59" text-anchor="${i===0?'start':'middle'}">${mo===1||i===0?p.m.slice(2,4)+'년 ':''}${mo}월</text>`;
    svg+=`<line x1="${x(i)}" x2="${x(i)}" y1="${T+h}" y2="${T+h+4}" stroke="#d6ccb6"/>`;
  });
  const seg=(arr,dash,col)=>arr.length>1?`<polyline fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" ${dash?'stroke-dasharray="3 4"':''} points="${arr.map(([i,p])=>x(i)+','+y(p.avg)).join(' ')}"/>`:'';
  const idx=pts.map((p,i)=>[i,p]), part=idx.filter(([i,p])=>p.n<12), full=idx.filter(([i,p])=>p.n>=12);
  if(part.length&&full.length) part.push(full[0]);
  svg+=seg(part,true,'#a39a88')+seg(full,false,'#23201c');
  idx.forEach(([i,p])=>{ svg+=`<circle cx="${x(i)}" cy="${y(p.avg)}" r="${i===pts.length-1?4:2.2}" fill="${p.avg>=g?'#9b3b32':(p.n<12?'#a39a88':'#23201c')}"><title>${monthLabel(p.m)}까지 ${p.n}개월 평균 ${man(p.avg)}</title></circle>`; });
  const lp=pts[pts.length-1];
  svg+=`<text x="${x(pts.length-1)+8}" y="${y(lp.avg)+(Math.abs(y(lp.avg)-gy)<14?(y(lp.avg)<gy?-6:16):4)}" font-size="13" fill="#23201c">${Math.round(lp.avg/10000).toLocaleString('ko-KR')}만</text>`;
  return svg+'</svg>';
}

/* 수입 장부 CSV → 달마다의 합계만 */
function parseCSV(t){
  const rows=[]; let row=[], f='', q=false; t=String(t).replace(/^\uFEFF/,'');
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); f=''; rows.push(row); row=[]; }
    else f+=c;
  }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows;
}
async function importIncCSV(files){
  const sums={}; let n=0;
  for(const file of files){
    const rows=parseCSV(await file.text());
    rows.slice(1).forEach(r=>{
      const d=String(r[0]||'').trim(), amt=parseInt(String(r[3]||'').replace(/[^\d]/g,''),10);
      if(/^\d{4}-\d{2}-\d{2}$/.test(d)&&amt>0){ const m=d.slice(0,7); sums[m]=(sums[m]||0)+amt; n++; }
    });
  }
  const ms=Object.keys(sums).sort();
  if(!ms.length){ toast('수입 장부에서 내려받은 CSV가 아닌 것 같습니다'); return; }
  if(!confirm(`${monthLabel(ms[0])}부터 ${monthLabel(ms[ms.length-1])}까지 ${ms.length}달의 합계(${n}건)를 넣습니다.\n지급처와 메모는 올리지 않습니다. 이미 채운 달은 새 합계로 바뀝니다.`)) return;
  const overlap=incLive().filter(r=>!r.seed&&sums[r.date.slice(0,7)]);
  let drop=false;
  if(overlap.length) drop=confirm(`이 달들에 시작에서 따로 적은 수입이 ${overlap.length}건 있습니다.\n\n[확인] 그 기록을 지우고 CSV 합계만 남깁니다. 장부에도 적어 두었다면 이쪽입니다.\n[취소] 그대로 둡니다. 같은 돈이 두 번 셈해질 수 있습니다.`);
  ms.forEach(m=>{ const id='m'+m; touchInc(Object.assign({},INC.rows[id]||{},{id, date:m+'-01', amount:sums[m], seed:true, deleted:false})); });
  if(drop) overlap.forEach(r=>touchInc(Object.assign({},r,{deleted:true})));
  toast(ms.length+'달의 합계를 넣었습니다'+(drop?' · 겹친 '+overlap.length+'건을 지웠습니다':''));
  renderSet(); renderIncStrip();
}

  if(Date.now()-backT<1500) return; backT=Date.now();
  const changed=await pullMP(false)||[];
  if(Object.keys(MP.dirty).length) queuePush();
  if(firstOpenCheck()) { refreshToday(true); return; }
  if(view==='today') refreshToday(true);
  else { lastLoad=0; }
  if(view==='morning' && (changed.includes(mpDay) || mpDay!==dayKey()) && document.activeElement!==editor) mpLoadEditor();
  if(view==='close' && changed.includes(curKey)) renderDirect(curKey);
  if(view==='inc'){ const c=await pullInc(); if(c&&!$('incHost').contains(document.activeElement)) renderInc(); }
  if(view==='adv') openAdv();
  if(view==='pg') openPg();
  if(view==='dist') openDist();
  if(view==='cal'){ const c=await pullCal(); if(!T&&mrOn()) await loadTodo(dayKey()); if(calEdit==null) renderCal(); }
}
document.addEventListener('visibilitychange',onBack);
window.addEventListener('focus',onBack);
window.addEventListener('pageshow',e=>{ if(e.persisted) onBack(); });
window.addEventListener('pagehide',()=>{ if(view==='morning'){ clearTimeout(saveT); if(editor.value!==(MP.entries[mpDay]&&MP.entries[mpDay].text||'')) saveToday(); } });

/* 켜 둔 채: 30초마다 흐르는 시간만 다시 그리고, 2분마다 불러온다 */
setInterval(()=>{
  if(document.visibilityState!=='visible') return;
  if(view==='today'){ if(Date.now()-lastLoad>120000) refreshToday(true); else renderToday(); }
},30000);

/* ─── 시작 ─── */
(async function boot(){
  if(!firstOpenCheck()) go('today');
  setDot('mp', mrOn()?'busy':'', '');
  await pullMP(!MP.since);
  if(Object.keys(MP.dirty).length) queuePush();
  if(Object.keys(CAL.dirty).length) pushCal();
  if(Object.keys(INC.dirty).length) pushInc();
  if(view==='morning' && document.activeElement!==editor) mpLoadEditor();
  if(!mpTableMissing) setDot('mp', mrOn()?'ok':'', '');
  refreshToday(true);
})();
</script>
