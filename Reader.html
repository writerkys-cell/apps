<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reader</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf8; --panel2:#f1ede4; --line:#e2dccf;
  --tx:#232019; --tx2:#6d6557; --tx3:#9c9384;
  --acc:#8a5a2b; --acc-soft:#e9dcc9;
  --ok:#3f7d52; --warn:#b4791f; --bad:#a8452f;
  --core:#8a5a2b; --free:#5a6b8a;
  --r:14px; --sh:0 1px 2px rgba(35,32,25,.05), 0 6px 20px rgba(35,32,25,.05);
}
html[data-theme="dark"]{
  --bg:#16150f; --panel:#1f1e16; --panel2:#272519; --line:#35322a;
  --tx:#eee9dd; --tx2:#a49b8a; --tx3:#756d5f;
  --acc:#d3a06a; --acc-soft:#3a2f22;
  --ok:#69ab7f; --warn:#d6a44a; --bad:#d8735a;
  --core:#d3a06a; --free:#8fa4c9;
  --sh:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:60px;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.02em}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--tx)}
a{color:var(--acc)}

/* header */
header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;height:56px}
.logo{font-size:20px;font-weight:700;letter-spacing:-.04em}
.logo em{font-style:normal;color:var(--acc)}
.hd .date{color:var(--tx3);font-size:13px;font-variant-numeric:tabular-nums}
.hd .sp{flex:1}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--tx2);font-size:15px}
.iconbtn:hover{background:var(--panel2);color:var(--tx)}

/* generic */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sec-h h2{font-size:15px;letter-spacing:-.01em}
.sec-h .sub{font-size:12.5px;color:var(--tx3)}
.sec-h .sp{flex:1}
.muted{color:var(--tx2)}
.tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}

.btn{padding:9px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:550;font-size:13.5px;transition:.12s}
.btn:hover{background:var(--acc-soft)}
.btn.pri{background:var(--acc);color:#fff;border-color:transparent}
html[data-theme="dark"] .btn.pri{color:#1a1610}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;letter-spacing:-.01em}
.b-core{background:color-mix(in srgb,var(--core) 16%,transparent);color:var(--core)}
.b-free{background:color-mix(in srgb,var(--free) 16%,transparent);color:var(--free)}
.b-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.b-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.b-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}

.bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.bar.ok>i{background:var(--ok)}

/* action bar */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.bigbtn{padding:20px 16px;border-radius:16px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--sh);text-align:left;transition:.14s}
.bigbtn:hover{transform:translateY(-1px);border-color:var(--acc)}
.bigbtn .t{font-size:19px;font-weight:680;letter-spacing:-.03em}
.bigbtn .d{font-size:12.5px;color:var(--tx3);margin-top:2px}
.bigbtn.go .t{color:var(--acc)}
.bigbtn.stop{background:var(--acc);border-color:transparent}
.bigbtn.stop .t{color:#fff}.bigbtn.stop .d{color:rgba(255,255,255,.72)}
html[data-theme="dark"] .bigbtn.stop .t{color:#1a1610}
html[data-theme="dark"] .bigbtn.stop .d{color:rgba(26,22,16,.66)}

/* live session */
.live{margin-top:16px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--panel));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.live .dot{width:8px;height:8px;border-radius:99px;background:var(--acc);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.live .tm{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}

/* today */
.today{padding:18px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media(max-width:620px){.today{grid-template-columns:1fr;gap:14px}}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.ring .v{font-size:27px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.05}
.ring .l{font-size:11px;color:var(--tx3)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px 4px}
.st .v{font-size:19px;font-weight:660;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.st .l{font-size:11.5px;color:var(--tx3);margin-top:-2px}
.st .v small{font-size:12px;font-weight:500;color:var(--tx3)}

.floorline{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--panel2);font-size:12.5px;color:var(--tx2);line-height:1.5}
.floorline b{color:var(--tx);font-weight:650}

/* today per book */
.tb{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.tb:first-child{border-top:none}
.tb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* book grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.bk{padding:14px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:.14s;position:relative;overflow:hidden}
.bk:hover{transform:translateY(-2px);border-color:var(--acc)}
.bk .spine{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--free)}
.bk.core .spine{background:var(--core)}
.bk .ttl{font-size:15px;font-weight:640;letter-spacing:-.02em;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bk .au{font-size:12px;color:var(--tx3);margin-top:-4px}
.bk .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bk .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums}
.bk.empty{border-style:dashed;align-items:center;justify-content:center;min-height:150px;color:var(--tx3);box-shadow:none;background:transparent}
.bk.empty:hover{color:var(--acc)}
.bk.empty .plus{font-size:26px;line-height:1}
.bk.dragging{opacity:.35}
.bk.over{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.bk[draggable="true"]{cursor:grab}
.bk .movers{display:flex;align-items:center;gap:4px;margin:-2px 0 -4px}
.bk .movers .btn{padding:2px 8px;line-height:1.3}
.sortsel{width:auto;padding:5px 26px 5px 9px;font-size:12.5px;border-radius:8px;background:var(--panel2);
  appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);
  background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px;background-size:5px 5px;background-repeat:no-repeat}
.sortsel:focus{border-color:var(--acc)}

/* 보관함 */
.arbar{position:sticky;top:56px;z-index:20;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  padding:9px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel);
  font-size:12.5px;font-weight:550;color:var(--tx2);transition:.12s;white-space:nowrap}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--acc);color:#fff;border-color:transparent}
html[data-theme="dark"] .chip.on{color:#1a1610}
.chip .num{opacity:.6;font-size:11.5px}
.yearh{display:flex;align-items:center;gap:8px;width:100%;padding:9px 2px;border-bottom:1px solid var(--line);
  font-size:14px;letter-spacing:-.02em;text-align:left}
.yearh:hover{color:var(--acc)}
.yearh .ar{color:var(--tx3);font-size:11px;width:11px}
.yearh b{font-weight:660}
.arow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer}
.arow:first-child{border-top:none}
.arow:hover{color:var(--acc)}
.arow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.arow .num{flex:none;text-align:right}
.arow .num:nth-of-type(1){width:38px}
@media(max-width:640px){.arow .num{display:none}.arow .num:last-of-type{display:inline;width:74px}}

/* AI 리포트 미리보기 */
.aiprev{margin:0;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
  max-height:190px;overflow:auto;font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--tx2)}

/* heatmap */
.heat{display:flex;gap:3px;overflow-x:auto;padding:2px 0}
.heat .col{display:flex;flex-direction:column;gap:3px}
.heat i{width:11px;height:11px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);display:block}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--acc) 25%,var(--panel2));border-color:transparent}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--acc) 50%,var(--panel2));border-color:transparent}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--acc) 75%,var(--panel2));border-color:transparent}
.heat i[data-l="4"]{background:var(--acc);border-color:transparent}
.heat i.today{outline:2px solid var(--tx);outline-offset:1px}

/* detail */
.dt-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.dt-head .sp{flex:1}
.dt-title{font-size:25px;font-weight:700;letter-spacing:-.035em;line-height:1.2}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--panel);padding:12px 13px}
.kpi .l{font-size:11.5px;color:var(--tx3)}
.kpi .v{font-size:19px;font-weight:660;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:1px}
.kpi .v small{font-size:12px;font-weight:500;color:var(--tx3)}

.note{padding:11px 13px;border-radius:11px;background:var(--panel);border:1px solid var(--line);margin-top:8px}
.note .nh{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx3);margin-bottom:3px}
.note .nh .sp{flex:1}
.note .tx{white-space:pre-wrap;font-size:14px;line-height:1.6}
.note.quote .tx{font-style:italic;padding-left:10px;border-left:2px solid var(--acc-soft)}

.field{margin-top:11px}
.field label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px;font-weight:550}
.inp{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);outline:none;transition:.12s}
.inp:focus{border-color:var(--acc);background:var(--panel)}
textarea.inp{resize:vertical;min-height:76px;line-height:1.6}
.two{display:grid;grid-template-columns:110px 1fr;gap:10px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;padding:7px 0}
.chk input{width:17px;height:17px;accent-color:var(--acc)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,17,12,.42);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.mdl{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.28);width:100%;max-width:470px;padding:20px;max-height:92vh;overflow-y:auto;animation:pop .18s ease-out}
.mdl.wide{max-width:640px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.mdl h3{font-size:18px;letter-spacing:-.03em;margin-bottom:3px}
.mdl .mh-sub{font-size:12.5px;color:var(--tx3);margin-bottom:12px}
.mdl-ft{display:flex;gap:8px;margin-top:18px}
.mdl-ft .sp{flex:1}

.pick{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);margin-top:7px;text-align:left;transition:.12s}
.pick:hover{border-color:var(--acc);background:var(--panel2)}
.pick .sp{flex:1;min-width:0}
.pick .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .s{font-size:11.5px;color:var(--tx3)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:550;z-index:200;box-shadow:0 8px 26px rgba(0,0,0,.25);animation:up .2s}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}

.notice{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--panel));font-size:13px;line-height:1.55}
.notice b{font-weight:650}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{padding:8px 12px;font-size:13.5px;color:var(--tx3);border-bottom:2px solid transparent;font-weight:550}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
.hide{display:none!important}
.empty-txt{padding:26px;text-align:center;color:var(--tx3);font-size:13.5px}
.sess{display:flex;gap:10px;font-size:12.5px;color:var(--tx2);padding:7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.sess .sp{flex:1}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <div class="logo">R<em>e</em>ader</div>
    <div class="date" id="hdDate"></div>
    <div class="sp"></div>
    <button class="iconbtn" id="btnArchive" title="보관함">▤</button>
    <button class="iconbtn" id="btnTheme" title="테마">◐</button>
    <button class="iconbtn" id="btnSettings" title="설정">⚙</button>
  </div>
</header>

<main class="wrap" id="viewMain">
  <div id="liveWrap"></div>

  <div class="actions">
    <button class="bigbtn go" id="btnRead">
      <div class="t">독서</div>
      <div class="d">단축어 실행 · 세션 시작</div>
    </button>
    <button class="bigbtn stop" id="btnReadEnd">
      <div class="t">독서 끝</div>
      <div class="d">단축어 실행 · 페이지·메모 기록</div>
    </button>
  </div>

  <div id="noticeWrap"></div>

  <div class="sec">
    <div class="sec-h"><h2>오늘의 독서</h2><span class="sub" id="todaySub"></span></div>
    <div class="card today">
      <div class="ring" id="ring"></div>
      <div style="min-width:0">
        <div class="stats" id="todayStats"></div>
        <div class="floorline" id="floorLine"></div>
      </div>
    </div>
    <div class="card" style="margin-top:10px;padding:4px 16px" id="todayBooks"></div>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>전체 현황</h2><span class="sub" id="allSub"></span>
      <div class="sp"></div>
      <button class="btn sm" id="btnAI">✦ AI 조언</button></div>
    <div class="card" style="padding:18px">
      <div class="stats" id="allStats"></div>
      <div style="margin-top:16px">
        <div class="tiny muted" style="margin-bottom:6px">최근 18주</div>
        <div class="heat" id="heat"></div>
      </div>
    </div>
  </div>

  <div class="sec">
    <div class="sec-h">
      <h2>서가</h2><span class="sub" id="shelfSub"></span>
      <div class="sp"></div>
      <span id="shelfSort" style="display:flex;gap:5px;align-items:center"></span>
      <button class="btn sm" id="btnAddBook">+ 책 추가</button>
    </div>
    <div class="grid" id="shelf"></div>
  </div>
</main>

<main class="wrap hide" id="viewBook"></main>
<main class="wrap hide" id="viewArchive"></main>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
"use strict";
/* ============================ 저장소 ============================ */
const KEY = "reader.v1";
const DEFAULTS = {
  settings:{
    pageUnit:30,        // 필독서 1권당 하루 페이지
    baseFloor:100,      // 총량 하한 (병렬 독서 보호)
    listCap:7,          // 목록 최대 권수
    autoDropDays:14,    // 무독서 자동 내림 기준
    scStart:"독서",
    scEnd:"독서끝",
    theme:"light",
    shelfSort:"core", shelfFlip:false,
    arcSort:"closed",  arcFlip:false, arcView:"grid"
  },
  books:[], sessions:[], notes:[], active:null, dayFloor:{}
};
let S = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(DEFAULTS);
    const d = JSON.parse(raw);
    return Object.assign(structuredClone(DEFAULTS), d,
      {settings:Object.assign({}, DEFAULTS.settings, d.settings||{})});
  }catch(e){ return structuredClone(DEFAULTS); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("저장 실패: 저장 공간을 확인하세요"); } }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ============================ 날짜/유틸 ============================ */
const pad = n => String(n).padStart(2,"0");
function dkey(d){ d = d?new Date(d):new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function today(){ return dkey(); }
function dayDiff(a,b){ // b - a in days (date strings)
  const A=new Date(a+"T00:00:00"), B=new Date(b+"T00:00:00");
  return Math.round((B-A)/86400000);
}
function addDays(k,n){ const d=new Date(k+"T00:00:00"); d.setDate(d.getDate()+n); return dkey(d); }
function fmtDate(k){ if(!k) return "—"; const d=new Date(k+"T00:00:00");
  return (d.getMonth()+1)+"월 "+d.getDate()+"일"; }
function fmtMin(m){ m=Math.round(m||0); if(m<60) return m+"분"; const h=Math.floor(m/60); return h+"시간"+(m%60?" "+(m%60)+"분":""); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function toast(msg){
  const r=document.getElementById("toastRoot"); r.innerHTML=`<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t=setTimeout(()=>r.innerHTML="",2200);
}
function copyText(t,label){
  const done=()=>toast((label||"복사")+" 완료 · "+t.length.toLocaleString()+"자");
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(t).then(done,fallback); } else fallback();
  function fallback(){
    const ta=document.createElement("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();

}
function runShortcut(name){

/* ============================ 조회 ============================ */
const reading = () => S.books.filter(b=>b.status==="reading");
const coreBooks = () => reading().filter(b=>b.isCore);
const book = id => S.books.find(b=>b.id===id);
const bookSessions = id => S.sessions.filter(s=>s.bookId===id);
const daySessions = k => S.sessions.filter(s=>s.date===k);

function floorToday(){
  return Math.max(S.settings.pageUnit * coreBooks().length, S.settings.baseFloor);
}
function dayPages(k){ return daySessions(k).reduce((a,s)=>a+s.pages,0); }
function dayMinutes(k){ return daySessions(k).reduce((a,s)=>a+s.minutes,0); }
function bookDayPages(id,k){ return S.sessions.filter(s=>s.bookId===id&&s.date===k).reduce((a,s)=>a+s.pages,0); }

function lastReadDate(b){
  const ss=bookSessions(b.id);
  if(!ss.length) return b.addedAt;
  return ss.reduce((m,s)=>s.date>m?s.date:m, ss[0].date);
}
function idleDays(b){ return dayDiff(lastReadDate(b), today()); }

function bookStats(b){
  const ss = bookSessions(b.id);
  const pages = b.currentPage - b.startPage;
  const total = Math.max(1, b.endPage - b.startPage);
  const left  = Math.max(0, b.endPage - b.currentPage);
  const minutes = ss.reduce((a,s)=>a+s.minutes,0);
  const readPages = ss.reduce((a,s)=>a+s.pages,0);
  const pph = minutes>0 ? readPages/(minutes/60) : 0;              // 시간당 페이지
  // 최근 14일 실측 일평균 (읽은 날만이 아니라 경과일 기준)
  const span = Math.max(1, Math.min(14, dayDiff(b.addedAt,today())+1));
  let recent=0; for(let i=0;i<span;i++) recent += bookDayPages(b.id, addDays(today(),-i));
  const avgDay = recent/span;
  const eta = avgDay>0 ? addDays(today(), Math.ceil(left/avgDay)) : null; // 예상 완독일
  let needDaily=null, dleft=null, onTrack=null;
  if(b.targetDate){
    dleft = dayDiff(today(), b.targetDate)+1;   // 오늘 포함
    needDaily = dleft>0 ? Math.ceil(left/dleft) : left;
    const todayP = bookDayPages(b.id, today());
    onTrack = left===0 ? true : todayP >= (b.isCore?Math.max(needDaily,S.settings.pageUnit):needDaily);
  }
  return {pages,total,left,minutes,readPages,pph,avgDay,eta,needDaily,dleft,onTrack,
          pct: clamp(Math.round(pages/total*100),0,100),
          todayPages: bookDayPages(b.id,today()),
          quota: b.isCore ? Math.max(S.settings.pageUnit, b.targetDate&&needDaily?needDaily:0) : 0};
}

/* ============================ 정렬 ============================ */
// v: 정렬 값 (null이면 항상 뒤로) · desc: 기본 내림차순 · only: 표시할 화면
const SORTS = {
  manual:  {label:"직접 배치",        only:"shelf"},
  core:    {label:"필독서 우선",      v:b=>b.isCore?0:1, only:"shelf"},
  progress:{label:"완독률",           v:b=>bookStats(b).pct, desc:true},
  left:    {label:"남은 페이지 적은 순", v:b=>bookStats(b).left, only:"shelf"},
  due:     {label:"완독 기한 임박 순",  v:b=>b.targetDate||null, only:"shelf"},
  eta:     {label:"예상 완독일",       v:b=>bookStats(b).eta||null, only:"shelf"},
  todayp:  {label:"오늘 읽은 양",      v:b=>bookStats(b).todayPages, desc:true, only:"shelf"},
  speed:   {label:"읽기 속도",         v:b=>bookStats(b).pph||null, desc:true},
  idle:    {label:"오래 쉰 순",        v:b=>idleDays(b), desc:true, only:"shelf"},
  pages:   {label:"읽은 페이지",       v:b=>bookStats(b).readPages, desc:true, only:"arc"},
  closed:  {label:"완독·내림 날짜",    v:b=>b.finishedAt||b.droppedAt||null, desc:true, only:"arc"},
  added:   {label:"추가한 순",         v:b=>b.addedAt},
  notes:   {label:"메모 수",           v:b=>S.notes.filter(n=>n.bookId===b.id).length, desc:true},
  title:   {label:"제목",              v:b=>b.title}
};
const sortOpts = scope => Object.entries(SORTS).filter(([,s])=>!s.only||s.only===scope);

function sortBooks(arr, key, flip){
  // 기본 배열: 직접 배치 순 → 추가 순 (안정 정렬이라 동점일 때 이 순서가 유지됨)
  const base = arr.slice().sort((a,b)=>
    ((a.order??1e9)-(b.order??1e9)) || String(a.addedAt).localeCompare(String(b.addedAt)));
  const s = SORTS[key];
  if(!s || !s.v) return base;
  const dir = (s.desc?-1:1) * (flip?-1:1);
  return base.sort((a,b)=>{
    const x=s.v(a), y=s.v(b);
    const nx = x==null||x===""||(typeof x==="number"&&!isFinite(x));
    const ny = y==null||y===""||(typeof y==="number"&&!isFinite(y));
    if(nx&&ny) return 0; if(nx) return 1; if(ny) return -1;   // 값 없는 항목은 항상 뒤로
    return (typeof x==="string" ? x.localeCompare(y,"ko") : x-y) * dir;
  });
}
function sortBar(scope){
  const key = scope==="shelf"?S.settings.shelfSort:S.settings.arcSort;
  const flip= scope==="shelf"?S.settings.shelfFlip:S.settings.arcFlip;
  const s=SORTS[key]||{};
  const asc=(s.desc?!flip:flip)?"내림차순":"오름차순";
  return `<select class="inp sortsel" data-scope="${scope}">
      ${sortOpts(scope).map(([k,o])=>`<option value="${k}" ${k===key?"selected":""}>${o.label}</option>`).join("")}
    </select>
    <button class="btn sm" data-flip="${scope}" title="${asc}" ${s.v?"":"disabled"}>${
      s.v ? ((s.desc?!flip:flip) ? "↓" : "↑") : "↕"}</button>`;
}
function bindSortBar(root){
  root.querySelectorAll(".sortsel").forEach(el=>el.onchange=()=>{
    const sc=el.dataset.scope;
    if(sc==="shelf"){ S.settings.shelfSort=el.value; S.settings.shelfFlip=false; }
    else{ S.settings.arcSort=el.value; S.settings.arcFlip=false; }
    save(); render();
  });
  root.querySelectorAll("[data-flip]").forEach(el=>el.onclick=()=>{
    const sc=el.dataset.flip;
    if(sc==="shelf") S.settings.shelfFlip=!S.settings.shelfFlip;
    else S.settings.arcFlip=!S.settings.arcFlip;
    save(); render();
  });
}
function nextOrder(){ return S.books.reduce((m,b)=>Math.max(m, (b.order??-1)+1), 0); }
function reorderShelf(fromId,toId){
  const list=sortBooks(reading(),"manual");
  const f=list.findIndex(b=>b.id===fromId), t=list.findIndex(b=>b.id===toId);
  if(f<0||t<0) return;
  const [m]=list.splice(f,1); list.splice(t,0,m);
  list.forEach((b,i)=>b.order=i);
  save(); render();
}
function moveShelf(id,step){
  const list=sortBooks(reading(),"manual");
  const i=list.findIndex(b=>b.id===id), j=i+step;
  if(i<0||j<0||j>=list.length) return;
  [list[i],list[j]]=[list[j],list[i]];
  list.forEach((b,k)=>b.order=k);
  save(); render();
}

function streak(){
  let n=0,k=today();
  // 오늘이 미달이면 어제부터 센다
  if(dayPages(k)<floorToday()) k=addDays(k,-1);
  for(let i=0;i<400;i++){
    const f=S.dayFloor[k]||S.settings.baseFloor;
    if(dayPages(k)>=f && dayPages(k)>0){ n++; k=addDays(k,-1); } else break;
  }
  return n;
}
function renderHeat(){

  end.setDate(end.getDate()+(6-end.getDay()));
  const start=new Date(end); start.setDate(start.getDate()-(weeks*7-1));
  const f=Math.max(1,S.settings.baseFloor);
  let html="";
  for(let w=0;w<weeks;w++){
    html+='<div class="col">';
    for(let d=0;d<7;d++){
      const dt=new Date(start); dt.setDate(dt.getDate()+w*7+d);

      html+=`<i data-l="${l}" class="${k===today()?'today':''}" style="${fut?'opacity:.3':''}" title="${k} · ${p}p"></i>`;
    }
    html+="</div>";
  }
  document.getElementById("heat").innerHTML=html;
}

    <div class="sp" style="min-width:220px">
      <div class="row" style="display:flex;gap:6px;margin-bottom:6px">

        ${b.targetDate?`<span class="badge ${dd<0?'b-bad':dd<=3?'b-warn':'b-ok'}">${fmtDate(b.targetDate)}까지 ${dd<0?'· 초과':'· D-'+dd}</span>`:""}
        ${st.left===0?`<span class="badge b-ok">완독 가능</span>`:""}
      </div>
      <div class="dt-title">${esc(b.title)}</div>
      ${b.author?`<div class="muted" style="font-size:13.5px">${esc(b.author)}</div>`:""}
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn" id="bkAI">✦ AI 조언</button>
      <button class="btn" id="bkEdit">설정</button>
      <button class="btn pri" id="bkRead">독서</button>
      <button class="btn" id="bkEnd">독서 끝</button>
    </div>
  </div>

  <div class="sec">
    <div class="bar ${st.pct>=100?'ok':''}" style="height:10px"><i style="width:${st.pct}%"></i></div>
    <div style="display:flex;justify-content:space-between;margin-top:6px" class="tiny muted num">
      <span>${b.startPage}p</span><span>${b.currentPage}p 읽는 중 · ${st.pct}%</span><span>${b.endPage}p</span>
    </div>
  </div>

  <div class="sec kpis">
    ${[
      ["오늘 읽음", st.todayPages+"<small>p</small>"],
      ["남은 페이지", st.left+"<small>p</small>"],
      ["기한까지 하루", st.needDaily!=null?st.needDaily+"<small>p</small>":"—"],
      ["오늘 목표", b.isCore?Math.max(S.settings.pageUnit,st.needDaily||0)+"<small>p</small>":"자유"],
      ["달성", st.onTrack==null?(st.todayPages>0?"읽음":"—"):(st.onTrack?"✓":"✗")],
      ["최근 일평균", Math.round(st.avgDay)+"<small>p</small>"],
      ["예상 완독일", st.eta?fmtDate(st.eta):"—"],
      ["시간당", st.pph?Math.round(st.pph)+"<small>p/h</small>":"—"],
      ["누적 시간", st.minutes?fmtMin(st.minutes):"—"],
      ["세션", ss.length+"<small>회</small>"]
    ].map(([l,v])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("")}
  </div>

  ${st.needDaily!=null&&st.eta?`<div class="floorline" style="margin-top:12px">
    현재 속도(일평균 ${Math.round(st.avgDay)}p)라면 <b>${fmtDate(st.eta)}</b> 완독 예상.

      dayDiff(st.eta,b.targetDate)>=0?dayDiff(st.eta,b.targetDate)+"일 여유":Math.abs(dayDiff(st.eta,b.targetDate))+"일 초과"}</b>.
  </div>`:""}

  <div class="sec">
    <div class="sec-h"><h2>메모 · 구절</h2><span class="sub">${notes.length}개</span>

      <button class="btn sm" id="copyAll">전체 복사</button>
    </div>
    <div class="card" style="padding:14px">
      <div class="two">
        <div><label class="tiny muted">페이지</label>
          <input class="inp" id="nPage" type="number" inputmode="numeric" value="${b.currentPage}"></div>
        <div><label class="tiny muted">내용</label>
          <textarea class="inp" id="nText" placeholder="구절이나 떠오른 생각"></textarea></div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-top:10px">
        <label class="chk"><input type="checkbox" id="nQuote"> 인용 구절</label>
        <div class="sp" style="flex:1"></div>

      </div>
    </div>
    <div id="noteList">${notes.length?notes.map(n=>`
      <div class="note ${n.quote?'quote':''}">
        <div class="nh"><b class="num">${n.page}p</b>${n.quote?'<span class="badge b-core">구절</span>':''}
          ${n.fromSession?'<span class="badge b-free">세션 종료</span>':''}
          <span class="sp"></span>
          <span>${new Date(n.createdAt).toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})}</span>
          <button class="btn sm" data-copy="${n.id}">복사</button>
          <button class="btn sm danger" data-del="${n.id}">삭제</button>
        </div>
        <div class="tx">${esc(n.text)}</div>
      </div>`).join(""):`<div class="empty-txt">아직 메모가 없습니다.</div>`}</div>
  </div>

  <div class="sec">
    <div class="sec-h"><h2>세션 기록</h2><span class="sub">${ss.length}회</span></div>
    <div class="card" style="padding:4px 16px 10px">
      ${ss.length?ss.slice(0,40).map(s=>`<div class="sess">
        <span>${s.date}</span><span>${s.startPage}→${s.endPage}p</span>
        <span><b style="color:var(--tx)">${s.pages}p</b></span><span>${fmtMin(s.minutes)}</span>
        <span>${s.minutes>0?Math.round(s.pages/(s.minutes/60)):0}p/h</span>
        <span class="sp"></span><button class="btn sm danger" data-dels="${s.id}">삭제</button>
      </div>`).join(""):`<div class="empty-txt">기록 없음</div>`}
    </div>
  </div>

  <div class="sec" style="display:flex;gap:8px;flex-wrap:wrap;padding-bottom:20px">
    <button class="btn" id="bkDone">완독 처리</button>
    <button class="btn" id="bkDrop">포기 · 목록에서 내리기</button>
    <div style="flex:1"></div>
    <button class="btn danger" id="bkDel">기록째 삭제</button>
  </div>`;

  const $=id=>document.getElementById(id);
  $("bkBack").onclick=()=>{view="main";noteFilter="";window.scrollTo(0,0);render();};
  $("bkAI").onclick=()=>openAI(b.id);
  $("bkEdit").onclick=()=>openBookForm(b.id);
  $("bkRead").onclick=()=>startSession(b.id);
  $("bkEnd").onclick=()=>endSession();
  $("noteSearch").oninput=e=>{noteFilter=e.target.value;renderBook();
    const el=document.getElementById("noteSearch"); el.focus(); el.setSelectionRange(el.value.length,el.value.length);};
  $("nSave").onclick=()=>{
    const t=$("nText").value.trim(); if(!t) return toast("내용을 입력하세요");
    const pg=parseInt($("nPage").value)||b.currentPage;
    S.notes.push({id:uid(),bookId:b.id,page:pg,text:t,quote:$("nQuote").checked,createdAt:Date.now()});
    save(); toast("메모 기록"); renderBook();
  };
  $("nText").addEventListener("keydown",e=>{ if((e.metaKey||e.ctrlKey)&&e.key==="Enter") $("nSave").click(); });
  $("copyAll").onclick=()=>copyText(notesText(b.id),"전체 메모 복사");
  document.querySelectorAll("[data-copy]").forEach(el=>el.onclick=()=>{
    const n=S.notes.find(x=>x.id===el.dataset.copy);
    copyText(`${n.text}\n— ${b.title}${b.author?", "+b.author:""}, ${n.page}p`,"메모 복사");
  });
  document.querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>{
    S.notes=S.notes.filter(x=>x.id!==el.dataset.del); save(); renderBook();
  });
  document.querySelectorAll("[data-dels]").forEach(el=>el.onclick=()=>{
    if(!confirm("이 세션 기록을 삭제할까요? 진행 페이지는 그대로 유지됩니다.")) return;
    S.sessions=S.sessions.filter(x=>x.id!==el.dataset.dels); save(); renderBook();
  });
  $("bkDone").onclick=()=>{
    b.status="done"; b.finishedAt=today(); b.currentPage=b.endPage; save();
    toast("완독 처리 · 슬롯이 비었습니다"); view="main"; render();
  };
  $("bkDrop").onclick=()=>{
    if(!confirm("목록에서 내릴까요? 기록과 메모는 보관함에 남습니다.")) return;
    b.status="dropped"; b.droppedAt=today(); b.droppedReason="manual"; save(); view="main"; render();
  };
  $("bkDel").onclick=()=>{
    if(!confirm("이 책과 모든 세션·메모를 영구 삭제할까요?")) return;
    S.books=S.books.filter(x=>x.id!==b.id);
    S.sessions=S.sessions.filter(x=>x.bookId!==b.id);
    S.notes=S.notes.filter(x=>x.bookId!==b.id);
    if(S.active&&S.active.bookId===b.id) S.active=null;
    save(); view="main"; render();
  };
}

function notesText(bookId){
  const b=book(bookId);
  const ns=S.notes.filter(n=>n.bookId===bookId).sort((a,c)=>a.page-c.page||a.createdAt-c.createdAt);
  return `${b.title}${b.author?" · "+b.author:""}\n${"-".repeat(28)}\n\n`+
    ns.map(n=>`[${n.page}p]${n.quote?" (인용)":""}\n${n.text}`).join("\n\n")+"\n";
}

function aiReport(o){
  const L=[], P=s=>L.push(s);
  const days=o.days===0?0:(o.days||30), from=days?addDays(today(),-(days-1)):null;
  const inRange=s=>!from||s.date>=from;
  const st=S.settings;

  P("# 나의 독서 기록");
  P("기준일: "+today()+" ("+dowOf(today())+")"+(days?" · 최근 "+days+"일":" · 전체 기간"));
  P("");
  P("## 내가 정한 규칙");
  P("- 여러 책을 함께 읽는 병렬 독서를 하고, 읽은 것이 매일 쓰는 글에 반영되기를 바란다.");
  P("- 하루 하한선 = max("+st.pageUnit+"p × 필독서 권수, "+st.baseFloor+"p). 상한이 아니라 하한이고, 잘 읽히는 날은 더 읽는다.");
  P("- 필독서에는 완독 기한을 정하고 매일 최소 "+st.pageUnit+"p를 배정한다. 나머지는 자유 독서.");
  P("- 목록은 최대 "+st.listCap+"권. 완독하거나 포기해야 새 책을 추가할 수 있다.");
  P("- "+st.autoDropDays+"일 동안 한 페이지도 읽지 않은 책은 자동으로 목록에서 내린다.");
  P("");

  if(o.scope==="book"){
    const b=book(o.bookId), s=bookStats(b), ss=bookSessions(b.id).filter(inRange)
      .sort((a,c)=>String(a.date).localeCompare(String(c.date)));
    P("## 이 책");
    P("- 제목: "+b.title+(b.author?" / "+b.author:""));
    P("- 구분: "+(b.isCore?"필독서":"자유 독서")+(b.targetDate?" · 완독 기한 "+b.targetDate+" (D-"+dayDiff(today(),b.targetDate)+")":""));
    P("- 범위: "+b.startPage+"–"+b.endPage+"p (총 "+(b.endPage-b.startPage)+"p)");
    P("- 진도: "+b.currentPage+"p · "+s.pct+"% · 남은 "+s.left+"p");
    P("- 목록에 올린 날: "+b.addedAt+" ("+(dayDiff(b.addedAt,today())+1)+"일째)");
    P("- 누적: "+s.readPages+"p / "+fmtMin(s.minutes)+" · 시간당 "+Math.round(s.pph)+"p · 세션 "+bookSessions(b.id).length+"회");
    P("- 최근 14일 일평균: "+Math.round(s.avgDay)+"p · 마지막으로 읽은 날: "+lastReadDate(b)+" ("+idleDays(b)+"일 전)");
    if(s.needDaily!=null) P("- 기한을 지키려면 하루 "+s.needDaily+"p · 현재 속도 기준 예상 완독일 "+(s.eta||"산출 불가"));
    P("");
    P("### 세션 기록");
    P("| 날짜 | 요일 | 구간 | 페이지 | 시간 | 속도 |");
    P("|---|---|---|---|---|---|");
    ss.forEach(x=>P("| "+x.date+" | "+dowOf(x.date)+" | "+x.startPage+"→"+x.endPage+" | "+x.pages+"p | "+x.minutes+"분 | "+
      (x.minutes?Math.round(x.pages/(x.minutes/60)):0)+"p/h |"));
    if(!ss.length) P("| (기록 없음) | | | | | |");
    P("");
    P("### 같은 기간 다른 책들 (배분 비교)");
    reading().filter(x=>x.id!==b.id).forEach(x=>{
      const p=S.sessions.filter(s2=>s2.bookId===x.id&&inRange(s2)).reduce((a,s2)=>a+s2.pages,0);
      P("- "+x.title+" ("+(x.isCore?"필독":"자유")+"): 같은 기간 "+p+"p · 진도 "+bookStats(x).pct+"%");
    });
    P("");
    if(o.notes){
      const ns=S.notes.filter(n=>n.bookId===b.id).sort((a,c)=>a.page-c.page).slice(0,150);
      P("### 이 책에 남긴 메모 ("+ns.length+"개)");
      ns.forEach(n=>P("- ["+n.page+"p]"+(n.quote?" (인용)":"")+" "+n.text.replace(/\n+/g," ")));
      if(!ns.length) P("- (없음)");
      P("");
    }
  }else{
    // ---- 전체 ----
    const dates=[]; for(let i=days-1;i>=0;i--) dates.push(addDays(today(),-i));
    let range=days?dates:[...new Set(S.sessions.map(s=>s.date))].sort();
    if(!range.length) range=[today()];
    const tot=range.reduce((a,k)=>a+dayPages(k),0);
    const mins=range.reduce((a,k)=>a+dayMinutes(k),0);
    const met=range.filter(k=>dayPages(k)>=(S.dayFloor[k]||st.baseFloor)&&dayPages(k)>0).length;
    const zero=range.filter(k=>dayPages(k)===0).length;
    const cores=coreBooks();

    P("## 최근 요약");
    P("- 기간: "+range[0]+" ~ "+range[range.length-1]+" ("+range.length+"일)");
    P("- 총 "+tot+"p / "+fmtMin(mins)+" · 일평균 "+Math.round(tot/range.length)+"p · 시간당 "+(mins?Math.round(tot/(mins/60)):0)+"p");
    P("- 오늘의 하한선: "+floorToday()+"p (필독서 "+cores.length+"권)");
    P("- 하한선 달성: "+met+"/"+range.length+"일 ("+Math.round(met/range.length*100)+"%) · 한 페이지도 안 읽은 날: "+zero+"일");
    P("- 현재 연속 달성: "+streak()+"일");
    P("");
    P("### 요일별 평균");
    P("| 요일 | 일수 | 평균 페이지 | 평균 시간(분) |");
    P("|---|---|---|---|");
    DOW.forEach((d,i)=>{
      const ks=range.filter(k=>new Date(k+"T00:00:00").getDay()===i);
      if(!ks.length) return;
      P("| "+d+" | "+ks.length+" | "+Math.round(ks.reduce((a,k)=>a+dayPages(k),0)/ks.length)+
        "p | "+Math.round(ks.reduce((a,k)=>a+dayMinutes(k),0)/ks.length)+" |");
    });
    P("");
    const cp=S.sessions.filter(inRange).filter(s=>{const b=book(s.bookId);return b&&b.isCore;}).reduce((a,s)=>a+s.pages,0);
    P("### 필독서 vs 자유 독서");
    P("- 필독서 "+cp+"p / 자유 독서 "+(tot-cp)+"p"+(tot?" ("+Math.round(cp/tot*100)+"% : "+(100-Math.round(cp/tot*100))+"%)":""));
    P("- 참고: 필독서에 배정된 하한선은 "+(st.pageUnit*cores.length)+"p, 자유 독서 몫은 "+Math.max(0,st.baseFloor-st.pageUnit*cores.length)+"p로 설계되어 있다.");
    P("");
    P("## 지금 읽는 중인 책 ("+reading().length+"/"+st.listCap+"권)");
    P("| 책 | 구분 | 기한 | 진도 | 남은 | 기간 내 | 마지막 읽은 날 | 쉼 | 필요 페이스 | 예상 완독 |");
    P("|---|---|---|---|---|---|---|---|---|---|");
    reading().forEach(b=>{
      const s=bookStats(b), p=S.sessions.filter(x=>x.bookId===b.id&&inRange(x)).reduce((a,x)=>a+x.pages,0);
      P("| "+b.title+(b.author?" / "+b.author:"")+" | "+(b.isCore?"필독":"자유")+" | "+(b.targetDate||"—")+" | "+
        s.pct+"% | "+s.left+"p | "+p+"p | "+lastReadDate(b)+" | "+idleDays(b)+"일 | "+
        (s.needDaily!=null?s.needDaily+"p/일":"—")+" | "+(s.eta||"—")+" |");
    });
    if(!reading().length) P("| (없음) | | | | | | | | | |");
    P("");
    const arc=S.books.filter(b=>b.status!=="reading")
      .sort((a,c)=>String(c.finishedAt||c.droppedAt||"").localeCompare(String(a.finishedAt||a.droppedAt||""))).slice(0,25);
    P("## 최근 완독·내린 책 (최대 25권)");
    P("| 책 | 결과 | 날짜 | 진도 | 읽은 양 | 걸린 기간 | 속도 |");
    P("|---|---|---|---|---|---|---|");
    arc.forEach(b=>{
      const s=bookStats(b), end=b.finishedAt||b.droppedAt||"";
      P("| "+b.title+(b.author?" / "+b.author:"")+" | "+(b.status==="done"?"완독":b.droppedReason==="auto"?"자동 내림":"포기")+
        " | "+end+" | "+s.pct+"% | "+s.readPages+"p | "+(end&&b.addedAt?(dayDiff(b.addedAt,end)+1)+"일":"—")+" | "+
        (s.pph?Math.round(s.pph)+"p/h":"—")+" |");
    });
    if(!arc.length) P("| (없음) | | | | | | |");
    P("");
    if(o.daily){
      P("## 일별 기록");
      P("| 날짜 | 요일 | 페이지 | 하한선 | 달성 | 시간(분) | 읽은 책 |");
      P("|---|---|---|---|---|---|---|");
      range.forEach(k=>{
        const p=dayPages(k), f=S.dayFloor[k]||st.baseFloor;
        const bs=[...new Set(daySessions(k).map(s=>{const b=book(s.bookId);return b?b.title:"?";}))];
        P("| "+k+" | "+dowOf(k)+" | "+p+" | "+f+" | "+(p>=f&&p>0?"O":"X")+" | "+dayMinutes(k)+" | "+(bs.join(", ")||"—")+" |");
      });
      P("");
    }
    if(o.notes){
      const ns=S.notes.slice().sort((a,c)=>c.createdAt-a.createdAt).slice(0,120);
      P("## 최근 메모·구절 ("+ns.length+"개)");
      let last=null;
      ns.slice().reverse().forEach(n=>{
        const b=book(n.bookId); const t=b?b.title:"(삭제된 책)";
        if(t!==last){ P(""); P("**"+t+"**"); last=t; }
        P("- ["+n.page+"p]"+(n.quote?" (인용)":"")+" "+n.text.replace(/\n+/g," "));
      });
      if(!ns.length) P("- (없음)");
      P("");
    }
  }

  P("---");
  P("");
  P("## 부탁");
  P("위 기록은 내가 직접 쌓은 것이고, 숫자는 모두 실제 값이야. 아래 질문에 답해줘.");
  P("- 근거로 삼은 숫자나 책 제목을 반드시 인용해서 말해줘. 일반론은 필요 없어.");
  P("- 잘하고 있다는 격려보다, 내가 놓치고 있는 것을 정확히 짚어주는 게 더 도움이 돼.");
  P("- 규칙을 바꾸자고 제안할 때는 무엇을 근거로 그렇게 판단했는지 함께 말해줘.");
  P("");
  let i=1;
  Object.entries(FOCUS).forEach(([k,f])=>{
    if(!o.focus.includes(k)) return;
    P("### "+f.label);
    (o.scope==="book"?f.book:f.all).forEach(q=>P(i+++". "+q));
    P("");
  });
  if(o.custom&&o.custom.trim()){
    P("### 추가로 묻고 싶은 것");
    o.custom.trim().split("\n").filter(x=>x.trim()).forEach(x=>P(i+++". "+x.trim()));
    P("");
  }
  return L.join("\n");
}

      </div>
      <label class="chk"><input type="checkbox" id="aiDaily" ${o.daily?"checked":""}> 일별 기록 표${b?" <span class='muted'>(전체 리포트에만 적용)</span>":""}</label>
      <label class="chk"><input type="checkbox" id="aiNotes" ${o.notes?"checked":""}> 메모·구절 본문</label>

    <div class="mdl-ft">
      <button class="btn" id="aiFile">.md 파일로</button>
      <div class="sp"></div>
      <button class="btn" onclick="closeModal()">닫기</button>
      <button class="btn pri" id="aiCopy">클립보드에 복사</button>
    </div>`,{wide:true});

/* --- 보관함 --- */
const ARC_PAGE=30;               // 한 번에 보여줄 권수
let arcQ="", arcFilter="all", arcShown=ARC_PAGE, arcFold={};
const closedAt = b => b.finishedAt||b.droppedAt||b.addedAt||"";
const yearOf   = b => (closedAt(b)||"----").slice(0,4);

function renderArchive(){
  const all=S.books.filter(b=>b.status!=="reading");
  const q=arcQ.trim().toLowerCase();
  const list=sortBooks(all.filter(b=>{
    if(arcFilter==="done"&&b.status!=="done") return false;
    if(arcFilter==="manual"&&!(b.status==="dropped"&&b.droppedReason!=="auto")) return false;
    if(arcFilter==="auto"&&!(b.status==="dropped"&&b.droppedReason==="auto")) return false;
    if(!q) return true;
    return (b.title+" "+(b.author||"")).toLowerCase().includes(q)
        || S.notes.some(n=>n.bookId===b.id&&n.text.toLowerCase().includes(q));
  }), S.settings.arcSort, S.settings.arcFlip);

  const byYear = S.settings.arcSort==="closed" && !q;   // 날짜순일 때만 연도로 묶는다
  const shown  = byYear ? list : list.slice(0, arcShown);
  const rest   = Math.max(0, list.length-shown.length);
  const doneN  = all.filter(b=>b.status==="done").length;
  const autoN  = all.filter(b=>b.status==="dropped"&&b.droppedReason==="auto").length;
  const manN   = all.filter(b=>b.status==="dropped"&&b.droppedReason!=="auto").length;
  const totalP = all.reduce((a,b)=>a+bookStats(b).readPages,0);
  const thisY  = all.filter(b=>b.status==="done"&&yearOf(b)===String(new Date().getFullYear())).length;
  const compact= S.settings.arcView==="list";

  const card=b=>{
    const st=bookStats(b), nn=S.notes.filter(n=>n.bookId===b.id).length;
    const kind=b.status==="done"?["완독","b-ok"]:b.droppedReason==="auto"?["자동 내림","b-warn"]:["포기","b-bad"];
    if(compact) return `<div class="arow" data-open="${b.id}">
      <span class="badge ${kind[1]}">${kind[0]}</span>
      <span class="t">${esc(b.title)}${b.author?`<span class="muted"> · ${esc(b.author)}</span>`:""}</span>
      <span class="tiny muted num">${st.pct}%</span>
      <span class="tiny muted num">${st.readPages}p</span>
      <span class="tiny muted num">${nn?`메모 ${nn}`:""}</span>
      <span class="tiny muted num">${closedAt(b)}</span>
      <button class="btn sm" data-restore="${b.id}">올리기</button></div>`;
    return `<div class="card bk" style="cursor:default">
      <div class="spine" style="background:${b.status==="done"?"var(--ok)":"var(--tx3)"}"></div>
      <div class="row"><span class="badge ${kind[1]}">${kind[0]}</span>
        <span class="tiny muted">${closedAt(b)}</span></div>
      <div class="ttl">${esc(b.title)}</div>
      ${b.author?`<div class="au">${esc(b.author)}</div>`:""}
      <div class="meta"><span>${st.pct}% · ${st.readPages}p 읽음</span><span>메모 ${nn}개</span></div>
      <div style="display:flex;gap:6px;margin-top:2px">
        <button class="btn sm" data-restore="${b.id}">목록에 다시 올리기</button>
        <button class="btn sm" data-open="${b.id}">열기</button></div>
    </div>`;
  };
  const wrap = items => compact
    ? `<div class="card" style="padding:2px 14px">${items}</div>`
    : `<div class="grid">${items}</div>`;

  let body="";
  if(!list.length){
    body=`<div class="empty-txt">${all.length?"조건에 맞는 책이 없습니다.":"비어 있습니다."}</div>`;
  }else if(byYear){
    const years=[...new Set(shown.map(yearOf))];
    body=years.map(y=>{
      const bs=shown.filter(b=>yearOf(b)===y);
      const open=arcFold[y]!==undefined?arcFold[y]:(y===years[0]);
      const p=bs.reduce((a,b)=>a+bookStats(b).readPages,0);
      return `<div style="margin-top:14px">
        <button class="yearh" data-y="${y}">
          <span class="ar">${open?"▾":"▸"}</span>
          <b>${y==="----"?"날짜 없음":y+"년"}</b>
          <span class="tiny muted">완독 ${bs.filter(b=>b.status==="done").length} · 총 ${bs.length}권 · ${p.toLocaleString()}p</span>
        </button>
        ${open?wrap(bs.map(card).join("")):""}
      </div>`;
    }).join("");
  }else{
    body=wrap(shown.map(card).join(""))+
      (rest?`<div style="text-align:center;margin-top:14px">
        <button class="btn" id="arMore">더 보기 · ${rest}권 남음</button></div>`:"");
  }

  document.getElementById("viewArchive").innerHTML=`
  <div style="margin-top:16px"><button class="btn sm" id="arBack">← 메인</button></div>
  <div class="sec">
    <div class="sec-h"><h2>보관함</h2>
      <span class="sub">완독 ${doneN} · 포기 ${manN} · 자동 내림 ${autoN} · 누적 ${totalP.toLocaleString()}p${thisY?` · 올해 ${thisY}권`:""}</span>
    </div>
    <div class="arbar">
      <input class="inp" id="arQ" placeholder="제목 · 저자 · 메모 검색" value="${esc(arcQ)}" style="flex:1;min-width:150px;padding:6px 11px;font-size:13px">
      <span class="chips">
        ${[["all","전체",all.length],["done","완독",doneN],["manual","포기",manN],["auto","자동 내림",autoN]]
          .map(([k,l,n])=>`<button class="chip ${arcFilter===k?"on":""}" data-f="${k}">${l} <span class="num">${n}</span></button>`).join("")}
      </span>
      <span id="arSort" style="display:flex;gap:5px;align-items:center"></span>
      <button class="btn sm" id="arView" title="보기 전환">${compact?"▦ 카드":"☰ 목록"}</button>
      <button class="btn sm" id="arCopy">메모 복사</button>
    </div>
    ${q||arcFilter!=="all"?`<div class="tiny muted" style="margin-top:8px">${list.length}권 표시 중${q?` · "${esc(arcQ)}"`:""}</div>`:""}
    ${body}
    <div style="height:30px"></div>
  </div>`;

  const $=x=>document.getElementById(x);
  $("arSort").innerHTML=sortBar("arc"); bindSortBar($("arSort"));
  $("arBack").onclick=()=>{view="main";render();};
  $("arView").onclick=()=>{ S.settings.arcView=compact?"grid":"list"; save(); render(); };
  $("arQ").oninput=e=>{ arcQ=e.target.value; arcShown=ARC_PAGE; renderArchive();
    const el=$("arQ"); el.focus(); el.setSelectionRange(el.value.length,el.value.length); };
  if($("arMore")) $("arMore").onclick=()=>{ arcShown+=ARC_PAGE; renderArchive(); };
  document.querySelectorAll("[data-f]").forEach(el=>el.onclick=()=>{
    arcFilter=el.dataset.f; arcShown=ARC_PAGE; renderArchive(); });
  document.querySelectorAll("[data-y]").forEach(el=>el.onclick=()=>{
    const y=el.dataset.y, cur=arcFold[y]!==undefined?arcFold[y]:(y===yearOf(shown[0]));
    arcFold[y]=!cur; renderArchive(); });
  $("arCopy").onclick=()=>{
    const src=list.filter(b=>S.notes.some(n=>n.bookId===b.id));
    if(!src.length) return toast("메모가 없습니다");
    copyText(src.map(b=>notesText(b.id)).join("\n\n"), `${src.length}권 메모 복사`);
  };
  document.querySelectorAll("[data-restore]").forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    if(reading().length>=S.settings.listCap) return toast(`목록이 가득 찼습니다 (${S.settings.listCap}권)`);
    const b=book(el.dataset.restore);
    b.status="reading"; b.addedAt=today(); b.order=nextOrder();
    delete b.droppedAt; delete b.finishedAt; delete b.droppedReason;
    save(); toast("목록에 올렸습니다"); render();
  });
  document.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{curBook=el.dataset.open;view="book";window.scrollTo(0,0);render();});
}

/* ============================ 모달 ============================ */
function modal(html, opt={}){
  const r=document.getElementById("modalRoot");
  r.innerHTML=`<div class="ov"><div class="mdl ${opt.wide?'wide':''}">${html}</div></div>`;
  r.querySelector(".ov").onclick=e=>{ if(e.target===r.querySelector(".ov")&&!opt.sticky) closeModal(); };
  return r;
}
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }

/* --- 책 추가/편집 --- */
function openBookForm(id){
  const b=id?book(id):null;
  if(!b && reading().length>=S.settings.listCap){
    return modal(`<h3>목록이 가득 찼습니다</h3>
      <div class="mh-sub">${S.settings.listCap}권 상한입니다. 완독하거나 포기해서 슬롯을 비운 뒤에 새 책을 추가할 수 있습니다.</div>
      <div class="mdl-ft"><div class="sp"></div><button class="btn" onclick="closeModal()">확인</button></div>`);
  }
  modal(`
    <h3>${b?"책 설정":"책 추가"}</h3>
    <div class="mh-sub">${b?"":`빈 슬롯 ${S.settings.listCap-reading().length}개`}</div>
    <div class="field"><label>제목</label><input class="inp" id="fT" value="${esc(b?b.title:"")}" placeholder="책 제목"></div>
    <div class="field"><label>저자</label><input class="inp" id="fA" value="${esc(b?b.author||"":"")}" placeholder="선택"></div>
    <div class="field two">
      <div><label>시작 페이지</label><input class="inp" id="fS" type="number" inputmode="numeric" value="${b?b.startPage:1}"></div>
      <div><label>마지막 페이지</label><input class="inp" id="fE" type="number" inputmode="numeric" value="${b?b.endPage:""}" placeholder="본문 마지막 쪽"></div>
    </div>
    ${b?`<div class="field"><label>현재 페이지</label><input class="inp" id="fC" type="number" inputmode="numeric" value="${b.currentPage}"></div>`:""}
    <label class="chk" style="margin-top:12px"><input type="checkbox" id="fCore" ${b&&b.isCore?"checked":""}> 필독서로 지정</label>
    <div id="coreBox" class="${b&&b.isCore?"":"hide"}">
      <div class="field"><label>완독 기한</label><input class="inp" id="fD" type="date" value="${b&&b.targetDate?b.targetDate:""}"></div>
      <div class="floorline" id="coreWarn"></div>
    </div>
    <div class="mdl-ft">
      <div class="sp"></div>
      <button class="btn" onclick="closeModal()">취소</button>
      <button class="btn pri" id="fSave">${b?"저장":"추가"}</button>
    </div>`);

  const $=x=>document.getElementById(x);
  const upd=()=>{
    const on=$("fCore").checked;
    $("coreBox").classList.toggle("hide",!on);
    if(on){
      const n=coreBooks().filter(x=>!b||x.id!==b.id).length+1;
      const nf=Math.max(S.settings.pageUnit*n, S.settings.baseFloor);
      const of_=floorToday();
      $("coreWarn").innerHTML=`필독서를 추가하면 <b>완독할 때까지 매일 ${S.settings.pageUnit}p를 추가로 약속</b>하는 것입니다.<br>
        하한선 <b>${of_}p → ${nf}p</b> (필독서 ${n}권)`;
    }
  };
  $("fCore").onchange=upd; upd();
  $("fSave").onclick=()=>{
    const t=$("fT").value.trim(); if(!t) return toast("제목을 입력하세요");
    const sp=parseInt($("fS").value)||1, ep=parseInt($("fE").value)||0;
    if(ep<=sp) return toast("마지막 페이지가 시작 페이지보다 커야 합니다");
    const core=$("fCore").checked, td=core?($("fD").value||""):"";
    if(core&&!td) return toast("완독 기한을 정하세요");
    if(b){
      Object.assign(b,{title:t,author:$("fA").value.trim(),startPage:sp,endPage:ep,isCore:core,targetDate:td,
        currentPage:clamp(parseInt($("fC").value)||b.currentPage,sp,ep)});
    }else{
      S.books.push({id:uid(),title:t,author:$("fA").value.trim(),startPage:sp,endPage:ep,currentPage:sp,
        isCore:core,targetDate:td,status:"reading",addedAt:today(),order:nextOrder()});
    }
    stampFloor(); save(); closeModal(); toast(b?"저장":"추가되었습니다"); render();
  };
}

/* --- 세션 시작 --- */
function startSession(bookId){
  if(S.active){ return toast("이미 진행 중인 세션이 있습니다"); }
  const rb=reading();
  if(!rb.length) return toast("먼저 책을 추가하세요");
  const go=id=>{
    const b=book(id);
    S.active={bookId:id,startAt:Date.now(),startPage:b.currentPage};
    stampFloor(); save(); closeModal(); runShortcut(S.settings.scStart);
    toast(`단축어 '${S.settings.scStart}' 실행 · 세션 시작`); render();
  };
  if(bookId) return go(bookId);
  // 필독서 먼저, 미달 먼저
  const sorted=rb.slice().sort((a,b)=>{
    const A=bookStats(a),B=bookStats(b);
    return (b.isCore-a.isCore) || (A.todayPages-B.todayPages);
  });
  modal(`<h3>어떤 책을 읽나요?</h3>
    <div class="mh-sub">오늘 ${dayPages(today())}p / 하한선 ${floorToday()}p</div>
    ${sorted.map(b=>{const st=bookStats(b);const q=b.isCore?Math.max(S.settings.pageUnit,st.needDaily||0):0;
      return `<button class="pick" data-p="${b.id}">
        <span class="badge ${b.isCore?'b-core':'b-free'}">${b.isCore?'필독':'자유'}</span>
        <span class="sp"><span class="t">${esc(b.title)}</span>
        <span class="s">${b.currentPage}p부터 · 오늘 ${st.todayPages}p${q?` / ${q}p`:""}${st.left?` · 남은 ${st.left}p`:""}</span></span>
        ${q&&st.todayPages>=q?'<span class="badge b-ok">달성</span>':""}
      </button>`;}).join("")}
    <div class="mdl-ft"><div class="sp"></div><button class="btn" onclick="closeModal()">취소</button></div>`);
  document.querySelectorAll("[data-p]").forEach(el=>el.onclick=()=>go(el.dataset.p));
}

/* --- 세션 종료 --- */
function endSession(){
  runShortcut(S.settings.scEnd);
  if(!S.active){
    // 진행 중 세션이 없으면 수동 기록
    const rb=reading();
    if(!rb.length){ toast("기록할 책이 없습니다"); return; }
    modal(`<h3>진행 중인 세션이 없습니다</h3>
      <div class="mh-sub">단축어 '${esc(S.settings.scEnd)}'는 실행했습니다. 지금 읽은 분량을 직접 기록할까요?</div>
      ${rb.map(b=>`<button class="pick" data-m="${b.id}"><span class="sp"><span class="t">${esc(b.title)}</span>
        <span class="s">${b.currentPage}p부터</span></span></button>`).join("")}
      <div class="mdl-ft"><div class="sp"></div><button class="btn" onclick="closeModal()">닫기</button></div>`);
    document.querySelectorAll("[data-m]").forEach(el=>el.onclick=()=>{
      const b=book(el.dataset.m);
      S.active={bookId:b.id,startAt:Date.now(),startPage:b.currentPage,manual:true};
      endModal();
    });
    return;
  }
  endModal();
}

/* --- 세션 중 빠른 메모 --- */
function quickNote(){
  if(!S.active){ toast("진행 중인 세션이 없습니다"); return; }
  const a=S.active, b=book(a.bookId);
  const recent=S.notes.filter(n=>n.bookId===b.id&&n.createdAt>=a.startAt)
    .sort((x,y)=>y.createdAt-x.createdAt);
  const def=a.lastPage||Math.max(b.currentPage,a.startPage);
  modal(`
    <h3>메모 · 구절</h3>
    <div class="mh-sub">${esc(b.title)} · 읽는 중 (${fmtMin((Date.now()-a.startAt)/60000)} 경과)</div>
    <div class="two">
      <div><label class="tiny muted">페이지</label>
        <input class="inp" id="qP" type="number" inputmode="numeric" value="${def}"></div>
      <div><label class="tiny muted">내용</label>
        <textarea class="inp" id="qT" placeholder="구절이나 떠오른 생각" style="min-height:110px"></textarea></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:10px">
      <label class="chk"><input type="checkbox" id="qQ"> 인용 구절</label>
      <span class="tiny muted">⌘↵ 저장</span>
      <div style="flex:1"></div>
      <label class="chk"><input type="checkbox" id="qMore" checked> 계속 쓰기</label>
    </div>
    ${recent.length?`<div style="margin-top:14px">
      <div class="tiny muted" style="margin-bottom:2px">이번 세션 메모 ${recent.length}개</div>
      ${recent.slice(0,3).map(n=>`<div class="note ${n.quote?'quote':''}" style="padding:9px 11px">
        <div class="nh"><b class="num">${n.page}p</b><span class="sp"></span>
          <button class="btn sm danger" data-qd="${n.id}">삭제</button></div>
        <div class="tx" style="font-size:13px">${esc(n.text)}</div></div>`).join("")}
    </div>`:""}
    <div class="mdl-ft"><div class="sp"></div>
      <button class="btn" onclick="closeModal()">닫기</button>
      <button class="btn pri" id="qSave">기록</button></div>`,{sticky:true});

  const $=x=>document.getElementById(x);
  const doSave=()=>{
    const t=$("qT").value.trim(); if(!t){ toast("내용을 입력하세요"); return; }
    const pg=clamp(parseInt($("qP").value)||def, b.startPage, b.endPage);
    S.notes.push({id:uid(),bookId:b.id,page:pg,text:t,quote:$("qQ").checked,createdAt:Date.now(),fromSession:true});
    S.active.lastPage=pg; save();
    if($("qMore").checked){ closeModal(); quickNote(); toast("메모 기록"); }
    else { closeModal(); toast("메모 기록"); render(); }
  };
  $("qSave").onclick=doSave;
  $("qT").addEventListener("keydown",e=>{ if((e.metaKey||e.ctrlKey)&&e.key==="Enter") doSave(); });
  document.querySelectorAll("[data-qd]").forEach(el=>el.onclick=()=>{
    S.notes=S.notes.filter(x=>x.id!==el.dataset.qd); save(); closeModal(); quickNote();
  });
  setTimeout(()=>$("qT").focus(),60);
}

function endModal(){
  const a=S.active, b=book(a.bookId);
  const mins=Math.max(0,Math.round((Date.now()-a.startAt)/60000));
  const others=reading().filter(x=>x.id!==a.bookId);
  modal(`
    <h3>독서 끝</h3>
    <div class="mh-sub">${esc(b.title)} · ${a.startPage}p에서 시작 · ${a.manual?"시간 직접 입력":fmtMin(mins)+" 경과"}</div>

    <div class="field two">
      <div><label>독서 시간(분)</label><input class="inp" id="eM" type="number" inputmode="numeric" value="${a.manual?"":mins}"></div>
      <div><label>지금 몇 페이지까지 읽었나요</label>
        <input class="inp" id="eP" type="number" inputmode="numeric" value="${Math.max(a.startPage,a.lastPage||0)}" style="font-size:19px;font-weight:650"></div>
    </div>
    ${a.lastPage?`<div class="tiny muted" style="margin-top:5px">세션 중 마지막 메모는 ${a.lastPage}p였습니다.</div>`:""}
    <div class="tiny muted num" id="ePreview" style="margin-top:6px"></div>

    <div class="field"><label>기록할 만한 것 <span class="muted">(선택 · 메모와 함께 저장됩니다)</span></label>
      <textarea class="inp" id="eN" placeholder="오늘 읽으며 남은 것, 글로 옮기고 싶은 생각" style="min-height:92px"></textarea></div>
    <label class="chk"><input type="checkbox" id="eQ"> 인용 구절로 표시</label>

    ${others.length?`<div class="field"><label>같은 자리에서 읽은 다른 책 <span class="muted">(선택)</span></label>
      <div id="extraBox">${others.map(o=>`<div style="display:flex;gap:8px;align-items:center;margin-top:6px">
        <span style="flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(o.title)}</span>
        <span class="tiny muted num">${o.currentPage}p →</span>
        <input class="inp x-extra" data-b="${o.id}" type="number" inputmode="numeric" placeholder="—" style="width:86px;padding:6px 9px">
      </div>`).join("")}</div>
      <div class="tiny muted" style="margin-top:6px">시간은 페이지 비율로 나눠 배분됩니다.</div></div>`:""}

    <div class="mdl-ft">
      <button class="btn danger" id="eDiscard">기록 안 함</button>
      <div class="sp"></div>
      <button class="btn pri" id="eSave">기록</button>
    </div>`,{sticky:true});

  const $=x=>document.getElementById(x);
  const prev=()=>{
    const p=(parseInt($("eP").value)||a.startPage)-a.startPage;
    const m=parseInt($("eM").value)||0;
    $("ePreview").innerHTML = p>0
      ? `<b style="color:var(--tx)">${p}p</b> 읽음${m?` · ${Math.round(p/(m/60))}p/h`:""} · 오늘 합계 ${dayPages(today())+p}p / 하한선 ${floorToday()}p`
      : `<span style="color:var(--warn)">페이지 변화 없음 — 시간만 기록됩니다.</span>`;
  };
  $("eP").oninput=prev; $("eM").oninput=prev; prev();
  setTimeout(()=>{$("eP").focus();$("eP").select();},60);

  $("eDiscard").onclick=()=>{ if(confirm("이 세션을 기록하지 않고 버릴까요?")){ S.active=null;save();closeModal();render(); } };
  $("eSave").onclick=()=>{
    const end=clamp(parseInt($("eP").value)||a.startPage, b.startPage, b.endPage);
    const m=Math.max(0,parseInt($("eM").value)||0);
    const extras=[...document.querySelectorAll(".x-extra")].map(el=>({b:book(el.dataset.b),v:parseInt(el.value)||0}))
      .filter(x=>x.v>x.b.currentPage);
    const mainP=Math.max(0,end-a.startPage);
    const totalP=mainP+extras.reduce((s,x)=>s+(x.v-x.b.currentPage),0);
    const share=p=>totalP>0?Math.round(m*p/totalP):0;

    if(mainP>0||m>0){
      S.sessions.push({id:uid(),bookId:b.id,date:today(),startAt:a.startAt,endAt:Date.now(),
        startPage:a.startPage,endPage:end,pages:mainP,minutes:extras.length?share(mainP):m});
      b.currentPage=Math.max(b.currentPage,end);
    }
    extras.forEach(x=>{
      const p=x.v-x.b.currentPage;
      S.sessions.push({id:uid(),bookId:x.b.id,date:today(),startAt:a.startAt,endAt:Date.now(),
        startPage:x.b.currentPage,endPage:x.v,pages:p,minutes:share(p)});
      x.b.currentPage=x.v;
    });

    const t=$("eN").value.trim();
    if(t) S.notes.push({id:uid(),bookId:b.id,page:end,text:t,quote:$("eQ").checked,createdAt:Date.now(),fromSession:true});

    S.active=null; stampFloor(); save(); closeModal();
    const p=dayPages(today()), f=floorToday();
    toast(p>=f?`기록 완료 · 오늘 ${p}p — 하한선 달성`:`기록 완료 · 오늘 ${p}p (${f-p}p 남음)`);
    render();
    if(b.currentPage>=b.endPage) setTimeout(()=>{
      if(confirm(`'${b.title}' 마지막 페이지에 도달했습니다. 완독 처리할까요?`)){
        b.status="done"; b.finishedAt=today(); save(); view="main"; render();
      }
    },400);
  };
}
function stampFloor(){ S.dayFloor[today()]=floorToday(); }

/* --- 설정 --- */
function openSettings(){
  const st=S.settings;
  modal(`<h3>설정</h3><div class="mh-sub">하한선 = max(권당 페이지 × 필독서 권수, 총량 하한)</div>
    <div class="field two">
      <div><label>필독서 권당/일</label><input class="inp" id="sU" type="number" value="${st.pageUnit}"></div>
      <div><label>총량 하한(자유 독서 보호)</label><input class="inp" id="sB" type="number" value="${st.baseFloor}"></div>
    </div>
    <div class="field two">
      <div><label>목록 최대 권수</label><input class="inp" id="sC" type="number" value="${st.listCap}"></div>
      <div><label>자동 내림 기준(일)</label><input class="inp" id="sA" type="number" value="${st.autoDropDays}"></div>
    </div>
    <div class="field two">
      <div><label>단축어 · 시작</label><input class="inp" id="sS" value="${esc(st.scStart)}"></div>
      <div><label>단축어 · 종료</label><input class="inp" id="sE" value="${esc(st.scEnd)}"></div>
    </div>
    <div class="floorline" id="sPrev"></div>
    <div class="field"><label>데이터</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" id="sExp">내보내기 (JSON)</button>
        <button class="btn sm" id="sImp">불러오기</button>
        <button class="btn sm" id="sMd">전체 메모 복사</button>
        <button class="btn sm danger" id="sReset">전체 초기화</button>
      </div>
      <input type="file" id="sFile" accept="application/json" style="display:none">
      <div class="tiny muted" style="margin-top:7px">데이터는 이 브라우저에만 저장됩니다. 정기적으로 내보내 백업하세요.</div>
    </div>
    <div class="mdl-ft"><div class="sp"></div><button class="btn" onclick="closeModal()">취소</button>
      <button class="btn pri" id="sSave">저장</button></div>`);
  const $=x=>document.getElementById(x);
  const prev=()=>{const u=+$("sU").value||0,bs=+$("sB").value||0,n=coreBooks().length;
    $("sPrev").innerHTML=`현재 필독서 ${n}권 → 하한선 <b>${Math.max(u*n,bs)}p</b>`;};
  ["sU","sB"].forEach(i=>$(i).oninput=prev); prev();
  $("sSave").onclick=()=>{
    Object.assign(S.settings,{pageUnit:+$("sU").value||30,baseFloor:+$("sB").value||0,
      listCap:Math.max(1,+$("sC").value||7),autoDropDays:Math.max(1,+$("sA").value||14),
      scStart:$("sS").value.trim(),scEnd:$("sE").value.trim()});
    stampFloor(); save(); closeModal(); toast("저장"); render();
  };
  $("sExp").onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="reader-backup-"+today()+".json"; a.click(); URL.revokeObjectURL(a.href);
    toast("내보내기 완료");
  };
  $("sImp").onclick=()=>$("sFile").click();
  $("sFile").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const d=JSON.parse(r.result);
      if(!d.books) throw 0;
      if(!confirm("현재 데이터를 덮어씁니다. 계속할까요?")) return;
      S=Object.assign(structuredClone(DEFAULTS),d,{settings:Object.assign({},DEFAULTS.settings,d.settings||{})});
      save(); closeModal(); toast("불러오기 완료"); render();
    }catch(err){ toast("올바른 백업 파일이 아닙니다"); } };
    r.readAsText(f);
  };
  $("sMd").onclick=()=>{
    const t=S.books.filter(b=>S.notes.some(n=>n.bookId===b.id)).map(b=>notesText(b.id)).join("\n\n");
    t?copyText(t,"전체 메모 복사"):toast("메모가 없습니다");
  };
  $("sReset").onclick=()=>{
    if(!confirm("모든 책·기록·메모를 삭제합니다. 되돌릴 수 없습니다. 계속할까요?")) return;
    if(!confirm("정말 초기화할까요?")) return;
    S=structuredClone(DEFAULTS); save(); closeModal(); render();
  };
}

/* ============================ 이벤트 ============================ */
document.getElementById("btnRead").onclick=()=>startSession();
document.getElementById("btnReadEnd").onclick=()=>endSession();
document.getElementById("btnAddBook").onclick=()=>openBookForm();
document.getElementById("btnAI").onclick=()=>openAI();
document.getElementById("btnSettings").onclick=openSettings;
document.getElementById("btnArchive").onclick=()=>{
  if(view!=="archive"){ arcQ=""; arcFilter="all"; arcShown=ARC_PAGE; arcFold={}; view="archive"; }
  else view="main";
  window.scrollTo(0,0); render();
};
document.getElementById("btnTheme").onclick=()=>{
  S.settings.theme=S.settings.theme==="dark"?"light":"dark"; save(); render();
};
document.addEventListener("keydown",e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="r"||e.key==="ㄱ"){ e.preventDefault(); startSession(); }
  if(e.key==="e"||e.key==="ㄷ"){ e.preventDefault(); endSession(); }
  if((e.key==="n"||e.key==="ㅜ")&&S.active){ e.preventDefault(); quickNote(); }
  if(e.key==="Escape") closeModal();
});
window.addEventListener("beforeunload",e=>{ if(S.active){ e.preventDefault(); e.returnValue=""; } });

/* ============================ 시작 ============================ */
runAutoDrop();
stampFloor();
save();
render();
</script>
</body>
</html>
