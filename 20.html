<style>
:root{
  --paper:#EFEAE3;
  --paper-deep:#E7E0D5;
  --ink:#201B15;
  --ink-faded:#6F675B;
  --rule:#D9D1C2;
  --seal:#B23227;
  --seal-soft:#B2322715;
  --goal:20;
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  font-family:'Gowun Batang', serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100%;
  line-height:1.9;
}
/* ---------- header ---------- */
header{
  position:fixed; top:0; left:0; right:0; z-index:10;
  background:linear-gradient(var(--paper) 82%, transparent);
  padding:14px 20px 20px;
  padding-top:calc(14px + env(safe-area-inset-top));
  will-change:transform;
}
.head-inner{
  max-width:680px; margin:0 auto;
  display:flex; align-items:baseline; gap:18px;
}
.stats{
  margin-left:auto; display:flex; gap:16px; align-items:baseline;
  font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-faded);
}
.stats b{color:var(--ink); font-weight:500; font-size:13px}
.stats .done b{color:var(--seal)}
.progress{
  max-width:680px; margin:10px auto 0; height:2px; background:var(--rule);
  position:relative; overflow:visible;
}
.progress .fill{
  height:100%; width:0%; background:var(--ink);
  transition:width .5s ease, background .5s ease;
}
.progress.done .fill{background:var(--seal)}
/* ---------- manuscript ---------- */
main{
  max-width:680px; margin:0 auto;
  padding:88px 20px 200px;          /* 아래 여백은 dock 높이에 맞춰 JS가 다시 잡는다 */
}
.prose{
  font-size:17px;
  /* 좌우정렬: 어절 중간에서도 줄을 바꿔 각 줄을 고르게 채운다 */
  word-break:normal; line-break:normal; overflow-wrap:anywhere;
  text-align:justify; text-justify:auto;
  hanging-punctuation:allow-end;
}
.frag{animation:setink .9s ease}
@keyframes setink{
  0%{opacity:0; filter:blur(2px); transform:translateY(4px)}
  55%{opacity:1; filter:blur(.4px)}
  100%{opacity:1; filter:none; transform:none}
}
/* ---------- input dock ---------- */
.dock{
  position:fixed; bottom:0; left:0; right:0; z-index:10;
  background:linear-gradient(transparent, var(--paper) 22%);
  padding:28px 20px 18px;
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
  will-change:transform;
}
.dock-inner{max-width:680px; margin:0 auto}
.input-row{
  border-top:1px solid var(--ink);
  padding-top:14px;
  display:flex; align-items:flex-end; gap:12px;
}
textarea#lineInput{
  flex:1; border:none; background:transparent; resize:none;
  font-family:'Gowun Batang', serif; font-size:17px; line-height:1.8;
  color:var(--ink); outline:none; height:auto; min-height:34px; max-height:180px;
  word-break:normal; overflow-wrap:anywhere;
}
textarea#lineInput::placeholder{color:var(--ink-faded); opacity:.6}
.line-no{
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  color:var(--rule); white-space:nowrap; padding-bottom:6px;
  width:20px; text-align:right;
}
.live-count{
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  color:var(--ink-faded); white-space:nowrap; padding-bottom:6px;
}
.dock-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
button{
  font-family:'Gowun Batang', serif; font-size:13px;
  padding:8px 16px; cursor:pointer;
  border:1px solid var(--ink); background:transparent; color:var(--ink);
  border-radius:2px; transition:all .15s;
}
button:hover:not(:disabled){background:var(--ink); color:var(--paper)}
button:disabled{
  border-color:var(--rule); color:var(--ink-faded); cursor:not-allowed; opacity:.7;
}
button.seal-btn{border-color:var(--seal); color:var(--seal)}
button.seal-btn:hover:not(:disabled){background:var(--seal); color:var(--paper)}
button:focus-visible{outline:2px solid var(--seal); outline-offset:2px}
/* ---------- 안내 ---------- */
.guide{
  color:var(--ink-faded); font-size:14px; line-height:2.3;
  padding:16px 0 8px; word-break:keep-all;
}
.guide ol{list-style:none; counter-reset:g}
.guide li{
  counter-increment:g; position:relative; padding-left:30px;
}
.guide li::before{
  content:counter(g); position:absolute; left:0; top:0; width:20px;
  font-family:'IBM Plex Mono', monospace; font-size:11px;
  color:var(--rule); text-align:right; line-height:2.6;
}
.guide.hide{display:none}
.toast{
  position:fixed; bottom:200px; left:50%; transform:translateX(-50%) translateY(8px);
  background:var(--ink); color:var(--paper); font-size:13px;
  padding:8px 18px; border-radius:2px; opacity:0; pointer-events:none;
  transition:all .25s; z-index:40;
}
.toast.show{opacity:1; transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important; transition:none!important}
}
@media (max-width:560px){
  .stats{gap:10px; font-size:11px}
}
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="stats">
      <div>자수 <b id="charCount">0</b></div>
      <div>매수 <b id="pageCount">0.0</b></div>
      <div>시간 <b id="timer">00:00</b></div>
      <div class="done" id="remainWrap">남은 줄 <b id="remain">20</b></div>
    </div>
  </div>
  <div class="progress" id="progress"><div class="fill" id="progressFill"></div></div>
</header>

<main id="manuscript">
  <div class="guide" id="guide">
    <ol>
      <li>프린트를 보며 다음 문장을 한 줄씩 2매 이상 쓴다.</li>
      <li>다 쓰고 나면, ‘보내기’를 눌러 그 문장을 데본씽크 인박스에 붙인다.</li>
      <li>다음 날, 타이핑 시간에 이 문장들을 검토한다.</li>
    </ol>
  </div>
  <div class="prose" id="prose"></div>
</main>

<div class="dock">
  <div class="dock-inner">
    <div class="input-row">
      <div class="line-no" id="lineNo">1</div>
      <textarea id="lineInput" rows="1" placeholder="한 줄을 쓰고 엔터 —" autofocus></textarea>
      <div class="live-count" id="liveCount">+0</div>
    </div>
    <div class="dock-actions">
      <button id="sendBtn" class="seal-btn" disabled>보내기 (20줄부터)</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const GOAL = 20;              // 채워야 하는 줄 수
  const SHORTCUT = '데본저장';   // 실행할 애플 단축어 이름

  // ----- state -----
  // 열 때마다 항상 새 세션으로 시작한다 (임시 보관 복원 없음)
  let draft = newDraft();
  let timerInt = null;
  let sent = false;             // 보내기를 끝냈는지

  function newDraft(){
    return { lines: [], startedAt: null, elapsed: 0 };
  }

  // ----- elements -----
  const $ = id => document.getElementById(id);
  const input = $('lineInput');
  const manuscript = $('manuscript');
  const prose = $('prose');

  // ----- text helpers -----
  // 확정된 문장들은 공백 하나를 두고 모두 이어붙인다.
  function fullText(){ return draft.lines.join(' '); }
  function charLen(){ return fullText().length; }
  function lineCount(){ return draft.lines.length; }

  // 스마트 인용부호: " → “ ”, ' → ‘ ’ (영문 축약형의 '는 ’로)
  function smartQuotes(s){
    const openBefore = p => p==='' || /[\s(\[{<“‘「『—–\-]/.test(p);
    let out='';
    for(let i=0;i<s.length;i++){
      const c=s[i], prev=out[out.length-1]||'', next=s[i+1]||'';
      if(c==='"'){
        out += openBefore(prev) ? '“' : '”';
      }else if(c==="'"){
        if(/[A-Za-z0-9]/.test(prev) && /[A-Za-z]/.test(next)) out += '’';   // don't, I'm
        else out += openBefore(prev) ? '‘' : '’';
      }else out += c;
    }
    return out;
  }

  // ----- render -----
  function renderLines(){
    prose.innerHTML='';
    draft.lines.forEach((t,i)=>appendFrag(t, i, false));
    updateStats(false);
  }
  function appendFrag(text, index, animate){
    const span = document.createElement('span');
    span.className = 'frag';
    span.textContent = (index>0 ? ' ' : '') + text;
    if(!animate) span.style.animation = 'none';
    prose.appendChild(span);
  }
  function updateStats(scroll){
    const n = charLen(), l = lineCount();
    $('charCount').textContent = n.toLocaleString();
    $('pageCount').textContent = (n/200).toFixed(1);
    const remain = Math.max(0, GOAL - l);
    $('remain').textContent = remain;
    $('remainWrap').firstChild.textContent = remain===0 ? '완성 ' : '남은 줄 ';
    $('lineNo').textContent = l + 1;
    const pct = Math.min(100, l/GOAL*100);
    $('progressFill').style.width = pct + '%';
    $('progress').classList.toggle('done', l>=GOAL);
    $('guide').classList.toggle('hide', l>0);
    const btn = $('sendBtn');
    if(sent){
      btn.disabled = false;
      btn.textContent = '새로 시작';
    }else{
      btn.disabled = l<GOAL;
      btn.textContent = l>=GOAL ? '보내기' : '보내기 (20줄부터)';
    }
    if(scroll) window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
  }

  // ----- timer -----
  function fmt(s){ const m=Math.floor(s/60), ss=s%60;
    return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
  function startTimer(){
    if(timerInt) return;
    if(!draft.startedAt) draft.startedAt = Date.now();
    timerInt = setInterval(()=>{
      draft.elapsed++;
      $('timer').textContent = fmt(draft.elapsed);
    }, 1000);
  }
  $('timer').textContent = fmt(draft.elapsed||0);

  // ----- commit (the point of no return) -----
  function commit(){
    const t = smartQuotes(input.value.replace(/\s+/g,' ').trim());
    if(t===''){ return; }                     // 빈 줄은 한 줄로 세지 않는다
    draft.lines.push(t);
    appendFrag(t, draft.lines.length-1, true);
    input.value=''; autosize();
    $('liveCount').textContent = '+0';
    updateStats(true);
    if(lineCount()===GOAL){
      toast('스무 줄을 채웠습니다. 이제 보낼 수 있습니다.');
    }
  }

  input.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.isComposing && !e.shiftKey){
      e.preventDefault(); commit();
    }
    // Backspace는 입력 중인 줄에서만 작동한다 (기본 동작). 확정된 줄은 DOM상 편집 불가.
  });
  input.addEventListener('input', ()=>{
    startTimer(); autosize();
    $('liveCount').textContent = '+' + input.value.length;
  });
  function autosize(){
    input.style.height='auto';
    input.style.height = Math.min(180, input.scrollHeight) + 'px';
  }

  // ----- 보내기 -----
  // 단축어 입력으로 본문을 보낸 뒤 애플 단축어 '데본저장'을 실행한다.
  function runShortcut(text){
    const url = 'shortcuts://run-shortcut?name=' + encodeURIComponent(SHORTCUT) +
                '&input=text&text=' + encodeURIComponent(text);
    try{
      const a = document.createElement('a');
      a.href = url; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
    }catch(e){
      window.location.href = url;
    }
  }

  $('sendBtn').addEventListener('click', ()=>{
    if(sent){ resetSession(); return; }
    if(lineCount()<GOAL) return;
    if(timerInt){ clearInterval(timerInt); timerInt=null; }

    runShortcut(fullText());
    sent = true;
    updateStats(false);
    toast('단축어 ‘' + SHORTCUT + '’으로 보냈습니다.');
  });

  function resetSession(){
    if(timerInt){ clearInterval(timerInt); timerInt=null; }
    draft = newDraft();
    sent = false;
    $('timer').textContent='00:00';
    renderLines(); input.focus();
    window.scrollTo({top:0, behavior:'smooth'});
  }


  // ----- 키보드 대응 -----
  // iOS 사파리는 키보드가 올라와도 position:fixed 요소를 레이아웃 뷰포트에 붙여 두어
  // 입력란과 버튼이 키보드 밑에 깔린다. 실제로 보이는 영역(visualViewport)을 따라 옮긴다.
  const dockEl = document.querySelector('.dock');
  const headEl = document.querySelector('header');

  function fitViewport(){
    const vv = window.visualViewport;
    let hidden = 0;
    if(vv){
      hidden = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      dockEl.style.transform = 'translateY(-' + hidden + 'px)';
      headEl.style.transform = 'translateY(' + vv.offsetTop + 'px)';
    }
    // 본문이 dock이나 키보드 뒤로 숨지 않도록 아래 여백을 그만큼 벌린다
    document.querySelector('main').style.paddingBottom =
      (dockEl.offsetHeight + hidden + 24) + 'px';
  }

  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', fitViewport);
    window.visualViewport.addEventListener('scroll', fitViewport);
  }
  window.addEventListener('resize', fitViewport);
  window.addEventListener('orientationchange', ()=>setTimeout(fitViewport, 250));
  input.addEventListener('focus', ()=>setTimeout(fitViewport, 300));

  // ----- toast -----
  let toastT=null;
  function toast(msg){
    const t=$('toast'); t.textContent=msg; t.classList.add('show');
    clearTimeout(toastT);
    toastT=setTimeout(()=>t.classList.remove('show'), 2400);
  }

  // ----- leave guard -----
  window.addEventListener('beforeunload', e=>{
    if(lineCount() && !sent){
      e.preventDefault(); e.returnValue='';
    }
  });

  // ----- boot -----
  renderLines();
  fitViewport();
  input.focus();
})();
</script>
</body>
</html>
