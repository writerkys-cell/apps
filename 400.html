<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한 문장</title>
<style>
  :root{
    --paper:#F6F2E9;
    --ink:#22201C;
    --faint:#A8A196;
    --line:#DFD8C8;
    --mark:#9C3D33;
    --panel:#F1ECE0;
    --size:19px;
  }
  html[data-theme="dark"]{
    --paper:#1A1917;
    --ink:#E7E2D6;
    --faint:#6E6A61;
    --line:#33312B;
    --mark:#C96A5E;
    --panel:#211F1C;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .4s ease,color .4s ease;
  }
  button{
    font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  :focus-visible{outline:1px solid var(--mark);outline-offset:3px;}

  /* ── 상단 ── */
  .top{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:flex-end;gap:22px;
    padding:22px 26px;
    font-size:13px;color:var(--faint);
    z-index:5;
  }
  .top button{transition:color .2s;}
  .top button:hover{color:var(--ink);}

  /* ── 집필면 ── */
  main{
    min-height:100%;
    display:flex;flex-direction:column;justify-content:center;
    padding:96px 24px 120px;
  }
  .stack{width:100%;max-width:34em;margin:0 auto;}

  .acc{
    max-height:40vh;overflow-y:auto;
    font-size:var(--size);line-height:1.9;
    letter-spacing:-.005em;
    white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;
    color:var(--ink);opacity:.42;
    margin-bottom:1.15em;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 4.5em);
    mask-image:linear-gradient(to bottom,transparent 0,#000 4.5em);
    scrollbar-width:none;
  }
  .acc::-webkit-scrollbar{display:none;}
  .acc:empty{display:none;}

  #input{
    display:block;width:100%;
    background:none;border:0;padding:0;margin:0;resize:none;
    font:inherit;font-size:var(--size);line-height:1.9;
    letter-spacing:-.005em;color:var(--ink);
    word-break:keep-all;overflow:hidden;
    caret-color:var(--mark);
  }
  #input::placeholder{color:var(--faint);}
  #input:focus{outline:none;}

  .rule{position:relative;height:1px;background:var(--line);margin-top:1.15em;}
  .rule span{
    position:absolute;inset:0 auto 0 0;width:0;
    background:var(--ink);opacity:.5;
    transition:width .25s ease,background .5s ease;
  }
  body.full .rule span{background:var(--mark);opacity:1;}
  @media (prefers-reduced-motion:reduce){.rule span{transition:none;}}

  /* ── 하단 상태줄 ── */
  .foot{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding:22px 26px calc(22px + env(safe-area-inset-bottom));
    font-size:12px;color:var(--faint);
    font-variant-numeric:tabular-nums;
    pointer-events:none;
  }
  .foot > *{pointer-events:auto;}
  .count{flex:1;}
  .foot .mid{flex:1;text-align:center;}
  .count b{font-weight:400;color:var(--ink);opacity:.55;}
  body.full .count b{color:var(--mark);opacity:1;}
  #sync{margin-left:10px;cursor:pointer;}
  #sync:hover{color:var(--ink);}
  #toScriv{
    color:var(--mark);font-size:13px;letter-spacing:-.01em;
    opacity:0;transform:translateY(3px);
    transition:opacity .35s ease,transform .35s ease;
    pointer-events:none;
  }
  body.full #toScriv{opacity:1;transform:none;pointer-events:auto;}
  #toScriv:hover{text-decoration:underline;text-underline-offset:4px;}
  @media (prefers-reduced-motion:reduce){#toScriv{transition:none;}}
  .foot .right{flex:1;text-align:right;}

  /* ── 서랍 ── */
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);
    background:var(--panel);
    display:flex;flex-direction:column;
    transform:translateX(100%);
    transition:transform .32s cubic-bezier(.32,.72,0,1);
    z-index:10;
  }
  .drawer.open{transform:none;}
  @media (prefers-reduced-motion:reduce){.drawer{transition:none;}}
  .drawer header{
    display:flex;align-items:baseline;justify-content:space-between;
    padding:24px 26px 18px;font-size:13px;color:var(--faint);
  }
  .list{flex:1;overflow-y:auto;padding:0 26px 26px;}
  .card{padding:20px 0;border-top:1px solid var(--line);}
  .card:first-child{border-top:0;}
  .meta{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;}
  .body{
    margin:.6em 0 .8em;font-size:14.5px;line-height:1.8;
    white-space:pre-wrap;word-break:keep-all;cursor:pointer;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
  }
  .body.open{-webkit-line-clamp:unset;display:block;}
  .acts{display:flex;gap:16px;font-size:12px;color:var(--faint);}
  .acts button:hover{color:var(--ink);}
  .acts .send{color:var(--mark);}
  .acts .send:hover{color:var(--mark);text-decoration:underline;text-underline-offset:4px;}
  .empty{padding:8px 0;font-size:13.5px;line-height:1.9;color:var(--faint);}
  .scrim{
    position:fixed;inset:0;background:rgba(0,0,0,.18);
    opacity:0;pointer-events:none;transition:opacity .3s;z-index:9;
  }
  .scrim.on{opacity:1;pointer-events:auto;}

  /* ── 열쇠말 ── */
  .gate{
    position:fixed;inset:0;background:var(--paper);z-index:20;
    display:none;flex-direction:column;justify-content:center;align-items:center;
    padding:24px;text-align:center;
  }
  .gate.on{display:flex;}
  .gate p{max-width:26em;font-size:14px;line-height:1.9;color:var(--faint);margin:0 0 1.8em;}
  .gate input{
    width:min(22em,100%);background:none;border:0;border-bottom:1px solid var(--line);
    font:inherit;font-size:17px;color:var(--ink);padding:.4em 0;text-align:center;
  }
  .gate input:focus{outline:none;border-bottom-color:var(--mark);}
  .gate .row{margin-top:2em;display:flex;gap:24px;font-size:13px;color:var(--faint);}
  .gate .row button:hover{color:var(--ink);}
  .gate .go{color:var(--mark);}
  .gate .note{margin-top:1.4em;font-size:12px;color:var(--faint);min-height:1.4em;}

  @media (max-width:640px){
    :root{--size:17px;}
    main{padding:88px 20px 108px;}
    .top,.foot{padding-left:20px;padding-right:20px;}
    #input{font-size:17px;}
  }
</style>
</head>
<body>

<nav class="top">
  <button id="themeBtn" type="button">어둡게</button>
  <button id="drawerBtn" type="button">서랍</button>
</nav>

<main id="field">
  <div class="stack">
    <div class="acc" id="acc"></div>
    <textarea id="input" rows="1" placeholder="한 문장을 쓰고 엔터." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="rule"><span id="fill"></span></div>
  </div>
</main>

<div class="foot">
  <div class="count">공백 포함 <b id="c1">0</b>자 · <b id="c2">0.0</b>매<span id="sync">동기화 꺼짐</span></div>
  <div class="mid"><button id="toScriv" type="button" disabled>스크리브너로</button></div>
  <div class="right"><button id="stash" type="button">서랍에 넣기</button></div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <header>
    <span id="dcount">서랍</span>
    <span><button id="clearAll" type="button">전체 비우기</button> &nbsp; <button id="close" type="button">닫기</button></span>
  </header>
  <div class="list" id="list"></div>
</aside>

<div class="gate" id="gate">
  <p>세 기기에 같은 열쇠말을 넣으면 쓰던 글과 서랍이 따라옵니다.<br>여덟 자 이상, 잊지 않을 문장으로.</p>
  <input id="secretInput" type="password" placeholder="열쇠말" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="note" id="gateNote"></div>
  <div class="row">
    <button class="go" id="gateOk" type="button">연결</button>
    <button id="gateSkip" type="button">이 기기에만 저장</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var KEY  = "hanmunjang.v1";
  var GOAL = 400;
  var SB_URL = "https://uohlhyqopsljymxwlfnj.supabase.co";
  var SB_KEY = "sb_publishable_btYdJmNqhQqdhe4THIgRRA_O9qqzrU2";

  var el = {
    acc: document.getElementById("acc"),
    input: document.getElementById("input"),
    fill: document.getElementById("fill"),
    c1: document.getElementById("c1"),
    c2: document.getElementById("c2"),
    sync: document.getElementById("sync"),
    stash: document.getElementById("stash"),
    toScriv: document.getElementById("toScriv"),
    drawer: document.getElementById("drawer"),
    scrim: document.getElementById("scrim"),
    list: document.getElementById("list"),
    dcount: document.getElementById("dcount"),
    themeBtn: document.getElementById("themeBtn"),
    gate: document.getElementById("gate"),
    secretInput: document.getElementById("secretInput"),
    gateNote: document.getElementById("gateNote")
  };

  var state = { sentences:[], draft:"", draftAt:null, drawer:[], theme:"light", secret:null };
  var confirmTimer = null, lastKey = 0, syncing = false, pending = null, pendingTimer = null;

  /* ── 저장 ── */
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return;
      var d = JSON.parse(raw);
      if(Array.isArray(d.sentences)) state.sentences = d.sentences;
      if(typeof d.draft === "string") state.draft = d.draft;
      if(typeof d.draftAt === "string") state.draftAt = d.draftAt;
      if(Array.isArray(d.drawer)) state.drawer = d.drawer;
      if(d.theme === "dark" || d.theme === "light") state.theme = d.theme;
      if(typeof d.secret === "string") state.secret = d.secret;
    }catch(e){}
  }
  var saveTimer = null;
  function writeNow(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(writeNow, 120);
  }
  function touch(){ state.draftAt = new Date().toISOString(); }

  /* ── 계산 ── */
  function accText(){ return state.sentences.join(" "); }
  function fullText(){
    var a = accText(), b = el.input.value.trim();
    if(!b) return a;
    return a ? a + " " + b : b;
  }
  function sheets(n){ return (n / 200).toFixed(1); }
  function live(){ return state.drawer.filter(function(x){ return !x.deleted_at; }); }

  /* ── 그리기 ── */
  function paint(){
    var acc = accText();
    el.acc.textContent = acc;
    el.acc.scrollTop = el.acc.scrollHeight;

    var t = fullText();
    var withSpace = t.length;
    el.c1.textContent = withSpace;
    el.c2.textContent = sheets(withSpace);

    var ratio = Math.min(1, withSpace / GOAL);
    el.fill.style.width = (ratio * 100) + "%";
    var reached = withSpace >= GOAL;
    document.body.classList.toggle("full", reached);
    el.toScriv.disabled = !reached;

    grow();
  }

  function grow(){
    el.input.style.height = "auto";
    el.input.style.height = el.input.scrollHeight + "px";
  }

  /* ── 문장 밀어 올리기 ── */
  function push(){
    var s = el.input.value.trim();
    if(!s) return;
    state.sentences.push(s);
    el.input.value = "";
    state.draft = "";
    touch();
    resetConfirm();
    paint(); save(); syncSoon(400);
  }

  function pull(){
    if(!state.sentences.length) return;
    el.input.value = state.sentences.pop();
    state.draft = el.input.value;
    touch();
    paint(); save(); syncSoon(1500);
    var n = el.input.value.length;
    el.input.setSelectionRange(n, n);
  }

  /* ── 서랍 ── */
  function resetConfirm(){
    clearTimeout(confirmTimer);
    confirmTimer = null;
    el.stash.textContent = "서랍에 넣기";
  }

  function archive(text){
    state.drawer.unshift({
      id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
          : Date.now() + "-" + Math.random().toString(36).slice(2,9),
      text: text,
      at: new Date().toISOString(),
      chars: text.length,
      deleted_at: null,
      updated_at: new Date().toISOString()
    });
    state.sentences = [];
    el.input.value = "";
    state.draft = "";
    touch();
    resetConfirm();
    paint(); save(); renderDrawer(); syncSoon(200);
  }

  function stash(){
    push();
    var text = accText();
    if(!text){
      flash(el.stash, "쓴 글이 없습니다", "서랍에 넣기");
      return;
    }
    var chars = text.length;
    if(chars < GOAL && !confirmTimer){
      el.stash.textContent = "아직 " + chars + "자 · 그래도 넣기";
      confirmTimer = setTimeout(resetConfirm, 4000);
      return;
    }
    archive(text);
    flash(el.stash, "서랍에 넣었습니다", "서랍에 넣기");
    el.input.focus();
  }

  function flash(node, msg, back){
    node.textContent = msg;
    setTimeout(function(){ if(!confirmTimer) node.textContent = back; }, 1600);
  }

  function fmt(iso){
    var d = new Date(iso);
    var p = function(n){ return n < 10 ? "0" + n : "" + n; };
    return d.getFullYear() + "." + p(d.getMonth()+1) + "." + p(d.getDate()) +
           " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }

  function renderDrawer(){
    var items = live();
    el.dcount.textContent = items.length ? "서랍 " + items.length + "편" : "서랍";
    el.list.innerHTML = "";
    if(!items.length){
      var e = document.createElement("p");
      e.className = "empty";
      e.textContent = "아직 비어 있습니다. 400자를 채우면 한 편이 여기 쌓입니다.";
      el.list.appendChild(e);
      return;
    }
    items.sort(function(a,b){ return a.at < b.at ? 1 : -1; });
    items.forEach(function(item){
      var card = document.createElement("article");
      card.className = "card";

      var meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = fmt(item.at) + " · " + item.chars + "자 · " + sheets(item.chars) + "매";

      var body = document.createElement("p");
      body.className = "body";
      body.textContent = item.text;
      body.title = "눌러서 펼치기";
      body.addEventListener("click", function(){ body.classList.toggle("open"); });

      var acts = document.createElement("div");
      acts.className = "acts";

      var copy = document.createElement("button");
      copy.type = "button";
      copy.textContent = "복사";
      copy.addEventListener("click", function(){
        toClipboard(item.text, function(ok){
          copy.textContent = ok ? "복사됨" : "복사 실패";
          setTimeout(function(){ copy.textContent = "복사"; }, 1500);
        });
      });

      var send = document.createElement("button");
      send.type = "button";
      send.className = "send";
      send.textContent = "스크리브너로";
      send.addEventListener("click", function(){
        toScrivener(item.text, function(ok){
          send.textContent = ok ? "보냈습니다" : "복사 실패";
          setTimeout(function(){ send.textContent = "스크리브너로"; }, 1800);
        });
      });

      var del = document.createElement("button");
      del.type = "button";
      del.textContent = "삭제";
      var armed = false, t = null;
      del.addEventListener("click", function(){
        if(!armed){
          armed = true;
          del.textContent = "한 번 더";
          t = setTimeout(function(){ armed = false; del.textContent = "삭제"; }, 3000);
          return;
        }
        clearTimeout(t);
        item.deleted_at = new Date().toISOString();
        item.updated_at = item.deleted_at;
        save(); renderDrawer(); syncSoon(200);
      });

      acts.appendChild(copy);
      acts.appendChild(send);
      acts.appendChild(del);
      card.appendChild(meta);
      card.appendChild(body);
      card.appendChild(acts);
      el.list.appendChild(card);
    });
  }

  /* ── 클립보드 · 단축어 ── */
  function toScrivener(text, done){
    toClipboard(text, function(ok){
      if(ok) window.location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent("스크리브너");
      done(ok);
    });
  }

  function toClipboard(text, done){
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, legacy);
    }else{ legacy(); }
    function legacy(){
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly","");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try{ ok = document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
      done(ok);
    }
  }

  /* ── 동기화 ── */
  function status(msg){ el.sync.textContent = " · " + msg; }

  function syncSoon(ms){
    if(!state.secret) return;
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(function(){ syncNow(false); }, ms || 1200);
  }

  function syncNow(closing){
    if(!state.secret) return Promise.resolve();
    if(syncing && !closing) return Promise.resolve();
    syncing = true;
    if(!closing) status("동기화 중");
    var payload = {
      secret: state.secret,
      draft: { sentences: state.sentences, line: state.draft, updated_at: state.draftAt },
      pieces: state.drawer
    };
    var opts = {
      method: "POST",
      headers: {
        "apikey": SB_KEY,
        "Authorization": "Bearer " + SB_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    };
    if(closing) opts.keepalive = true;
    return fetch(SB_URL + "/rest/v1/rpc/sync", opts)
      .then(function(r){
        if(!r.ok) return r.text().then(function(t){ throw new Error(t); });
        return r.json();
      })
      .then(function(data){
        syncing = false;
        if(closing) return;
        mergePieces(data.pieces || []);
        applyDraft(data.draft || {});
        status("동기화 " + fmt(new Date().toISOString()).slice(11));
      })
      .catch(function(err){
        syncing = false;
        if(!closing) status(navigator.onLine ? "동기화 실패" : "오프라인");
        console.warn("sync:", err && err.message);
      });
  }

  function mergePieces(remote){
    var byId = {};
    state.drawer.forEach(function(p){ byId[p.id] = p; });
    remote.forEach(function(r){
      var localP = byId[r.id];
      if(!localP || (r.updated_at || "") > (localP.updated_at || "")){
        byId[r.id] = {
          id: r.id, text: r.text, chars: r.chars, at: r.at,
          deleted_at: r.deleted_at || null,
          updated_at: r.updated_at || r.at
        };
      }else if(r.deleted_at && !localP.deleted_at){
        localP.deleted_at = r.deleted_at;
      }
    });
    state.drawer = Object.keys(byId).map(function(k){ return byId[k]; })
      .sort(function(a,b){ return a.at < b.at ? 1 : -1; });
    save(); renderDrawer();
  }

  function applyDraft(d){
    if(!d || !d.updated_at) return;
    if(state.draftAt && d.updated_at <= state.draftAt) return;
    if(el.input.value.trim() || Date.now() - lastKey < 4000){
      pending = d;
      setTimeout(function(){ if(pending){ var p = pending; pending = null; applyDraft(p); } }, 5000);
      return;
    }
    var localText = fullText().trim();
    var remoteText = ((d.sentences || []).join(" ") + " " + (d.line || "")).trim();
    if(localText && localText !== remoteText) archive(localText);
    state.sentences = Array.isArray(d.sentences) ? d.sentences : [];
    el.input.value = d.line || "";
    state.draft = el.input.value;
    state.draftAt = d.updated_at;
    paint(); save();
  }

  /* ── 열쇠말 ── */
  function openGate(){
    el.gate.classList.add("on");
    el.gateNote.textContent = "";
    el.secretInput.value = state.secret || "";
    setTimeout(function(){ el.secretInput.focus(); }, 60);
  }
  function closeGate(){
    el.gate.classList.remove("on");
    el.input.focus();
  }
  document.getElementById("gateOk").addEventListener("click", function(){
    var v = el.secretInput.value.trim();
    if(v.length < 8){ el.gateNote.textContent = "여덟 자 이상이어야 합니다."; return; }
    state.secret = v;
    writeNow();
    closeGate();
    status("동기화 중");
    syncNow(false);
  });
  document.getElementById("gateSkip").addEventListener("click", function(){
    closeGate();
    status(state.secret ? "동기화 켜짐" : "동기화 꺼짐");
  });
  el.secretInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); document.getElementById("gateOk").click(); }
  });
  el.sync.addEventListener("click", openGate);

  /* ── 테마 ── */
  function applyTheme(){
    document.documentElement.setAttribute("data-theme", state.theme);
    el.themeBtn.textContent = state.theme === "dark" ? "밝게" : "어둡게";
  }

  /* ── 이벤트 ── */
  el.input.addEventListener("keydown", function(e){
    lastKey = Date.now();
    if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); stash(); return; }
    if(e.key === "Enter"){
      if(e.isComposing || e.keyCode === 229) return;
      e.preventDefault(); push(); return;
    }
    if(e.key === "Backspace" && el.input.value === "" && state.sentences.length){
      e.preventDefault(); pull();
    }
  });

  el.input.addEventListener("input", function(){
    lastKey = Date.now();
    state.draft = el.input.value;
    touch();
    resetConfirm();
    paint(); save(); syncSoon(2000);
  });

  document.getElementById("field").addEventListener("mousedown", function(e){
    if(e.target === el.input) return;
    if(window.getSelection && String(window.getSelection())) return;
    setTimeout(function(){ el.input.focus(); }, 0);
  });

  function openDrawer(v){
    el.drawer.classList.toggle("open", v);
    el.scrim.classList.toggle("on", v);
    el.drawer.setAttribute("aria-hidden", v ? "false" : "true");
    if(!v) el.input.focus();
  }
  document.getElementById("drawerBtn").addEventListener("click", function(){ openDrawer(true); });
  document.getElementById("close").addEventListener("click", function(){ openDrawer(false); });
  el.scrim.addEventListener("click", function(){ openDrawer(false); });
  el.stash.addEventListener("click", stash);

  el.toScriv.addEventListener("click", function(){
    push();
    var text = accText();
    if(text.length < GOAL) return;
    toClipboard(text, function(ok){
      if(!ok){
        el.toScriv.textContent = "복사 실패";
        setTimeout(function(){ el.toScriv.textContent = "스크리브너로"; }, 2000);
        return;
      }
      archive(text);
      el.toScriv.textContent = "서랍에 넣고 스크리브너로";
      setTimeout(function(){ el.toScriv.textContent = "스크리브너로"; }, 2000);
      window.location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent("스크리브너");
      el.input.focus();
    });
  });

  var clearBtn = document.getElementById("clearAll"), clearArmed = false, clearT = null;
  clearBtn.addEventListener("click", function(){
    if(!live().length) return;
    if(!clearArmed){
      clearArmed = true;
      clearBtn.textContent = "한 번 더 누르면 비웁니다";
      clearT = setTimeout(function(){ clearArmed = false; clearBtn.textContent = "전체 비우기"; }, 3500);
      return;
    }
    clearTimeout(clearT);
    clearArmed = false;
    clearBtn.textContent = "전체 비우기";
    var now = new Date().toISOString();
    state.drawer.forEach(function(p){ if(!p.deleted_at){ p.deleted_at = now; p.updated_at = now; } });
    save(); renderDrawer(); syncSoon(200);
  });

  el.themeBtn.addEventListener("click", function(){
    state.theme = state.theme === "dark" ? "light" : "dark";
    applyTheme(); save();
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(el.gate.classList.contains("on")) closeGate();
      else if(el.drawer.classList.contains("open")) openDrawer(false);
    }
    if((e.metaKey || e.ctrlKey) && e.key === "Enter" && document.activeElement !== el.input){
      e.preventDefault(); stash();
    }
  });

  document.addEventListener("visibilitychange", function(){
    if(document.hidden){ writeNow(); syncNow(true); }
    else syncNow(false);
  });
  window.addEventListener("focus", function(){ syncNow(false); });
  window.addEventListener("online", function(){ syncNow(false); });
  window.addEventListener("pagehide", function(){ writeNow(); syncNow(true); });
  window.addEventListener("beforeunload", writeNow);
  setInterval(function(){ if(!document.hidden) syncNow(false); }, 30000);
  window.addEventListener("resize", grow);

  /* ── 시작 ── */
  load();
  applyTheme();
  el.input.value = state.draft || "";
  paint();
  renderDrawer();
  if(state.secret){ status("동기화 중"); syncNow(false); el.input.focus(); }
  else { status("동기화 꺼짐"); openGate(); }
})();
</script>
</body>
</html>
