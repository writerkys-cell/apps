<style>
  :root{
    --paper:#F6F2E9;
    --ink:#22201C;
    --faint:#A8A196;
    --line:#DFD8C8;
    --mark:#9C3D33;
    --panel:#F1ECE0;
    --size:19px;
  }
  html[data-theme="dark"]{
    --paper:#1A1917;
    --ink:#E7E2D6;
    --faint:#6E6A61;
    --line:#33312B;
    --mark:#C96A5E;
    --panel:#211F1C;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .4s ease,color .4s ease;
  }
  button{
    font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  :focus-visible{outline:1px solid var(--mark);outline-offset:3px;}

  .top{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:flex-end;gap:20px;
    padding:calc(22px + env(safe-area-inset-top)) 26px 22px;
    font-size:13px;color:var(--faint);
    z-index:5;
  }
  .top button{transition:color .2s;}
  .top button:hover{color:var(--ink);}

  main{
    min-height:100%;
    display:flex;flex-direction:column;justify-content:center;
    padding:calc(96px + env(safe-area-inset-top)) 24px 120px;
  }
  .stack{width:100%;max-width:34em;margin:0 auto;}

  .acc{
    max-height:40vh;overflow-y:auto;
    font-size:var(--size);line-height:1.9;
    letter-spacing:-.005em;
    white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;
    color:var(--ink);opacity:.62;
    margin-bottom:1.15em;
    -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.35) 0,#000 1.8em);
    mask-image:linear-gradient(to bottom,rgba(0,0,0,.35) 0,#000 1.8em);
    scrollbar-width:none;
  }
  .acc::-webkit-scrollbar{display:none;}
  .acc:empty{display:none;}

  #ghost{
    font-size:var(--size);line-height:1.9;letter-spacing:-.005em;
    color:var(--ink);opacity:.22;word-break:keep-all;
    margin-bottom:1.15em;display:none;
  }
  #ghost.on{display:block;}

  #input{
    display:block;width:100%;
    background:none;border:0;padding:0;margin:0;resize:none;
    font:inherit;font-size:var(--size);line-height:1.9;
    letter-spacing:-.005em;color:var(--ink);
    word-break:keep-all;overflow:hidden;
    caret-color:var(--mark);
  }
  #input::placeholder{color:var(--faint);}
  #input:focus{outline:none;}

  .rule{position:relative;height:1px;background:var(--line);margin-top:1.15em;}
  .rule span{
    position:absolute;inset:0 auto 0 0;width:0;
    background:var(--ink);opacity:.5;
    transition:width .25s ease,background .5s ease;
  }
  body.full .rule span{background:var(--mark);opacity:1;}
  @media (prefers-reduced-motion:reduce){.rule span{transition:none;}}

  .foot{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;align-items:baseline;justify-content:space-between;gap:16px;
    padding:22px 26px calc(22px + env(safe-area-inset-bottom));
    font-size:12px;color:var(--faint);
    font-variant-numeric:tabular-nums;
    pointer-events:none;
  }
  .foot > *{pointer-events:auto;}
  .count{flex:1;}
  .foot .mid{flex:1;text-align:center;}
  .foot .right{flex:1;text-align:right;}
  .count b{font-weight:400;color:var(--ink);opacity:.55;}
  body.full .count b{color:var(--mark);opacity:1;}
  #sync{margin-left:10px;cursor:pointer;}
  #sync:hover{color:var(--ink);}
  #toScriv{
    color:var(--mark);font-size:13px;letter-spacing:-.01em;
    opacity:0;transform:translateY(3px);
    transition:opacity .35s ease,transform .35s ease;
    pointer-events:none;
  }
  body.full #toScriv{opacity:1;transform:none;pointer-events:auto;}
  #toScriv:hover{text-decoration:underline;text-underline-offset:4px;}
  @media (prefers-reduced-motion:reduce){#toScriv{transition:none;}}

  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);
    background:var(--panel);
    display:flex;flex-direction:column;
    transform:translateX(100%);
    transition:transform .32s cubic-bezier(.32,.72,0,1);
    z-index:10;
  }
  .drawer.open{transform:none;}
  @media (prefers-reduced-motion:reduce){.drawer{transition:none;}}
  .drawer header{
    display:flex;align-items:baseline;justify-content:space-between;
    flex-wrap:wrap;gap:10px;
    padding:calc(24px + env(safe-area-inset-top)) 26px 16px;
    font-size:13px;color:var(--faint);
  }
  .tools{display:flex;gap:15px;font-size:12px;}
  .tools button:hover{color:var(--ink);}
  .list{flex:1;overflow-y:auto;padding:0 26px 26px;}
  .card{padding:20px 0;border-top:1px solid var(--line);}
  .card:first-child{border-top:0;}
  .card.sel{background:rgba(156,61,51,.05);}
  .meta{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;}
  .body{
    margin:.6em 0 .8em;font-size:14.5px;line-height:1.8;
    white-space:pre-wrap;word-break:keep-all;cursor:pointer;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
  }
  .body.open{-webkit-line-clamp:unset;display:block;}
  .strip{display:flex;gap:2px;height:10px;margin:0 0 .5em;}
  .strip i{background:var(--faint);opacity:.45;border-radius:2px;cursor:pointer;transition:opacity .2s;}
  .strip i:hover{opacity:.8;}
  .strip i.long{background:var(--mark);opacity:.85;}
  .strip i.pause{background:none;border-left:1px dotted var(--faint);border-radius:0;}
  .heldline{font-size:12.5px;line-height:1.75;color:var(--faint);margin:0 0 .8em;word-break:keep-all;}
  .acts{display:flex;gap:15px;font-size:12px;color:var(--faint);flex-wrap:wrap;}
  .acts button:hover{color:var(--ink);}
  .acts .send{color:var(--mark);}
  .acts .send:hover{color:var(--mark);text-decoration:underline;text-underline-offset:4px;}
  .empty{padding:8px 0;font-size:13.5px;line-height:1.9;color:var(--faint);}
  .bundle{
    display:none;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;
    border-top:1px solid var(--line);
    padding:16px 26px calc(20px + env(safe-area-inset-bottom));
    font-size:12px;color:var(--faint);
  }
  .bundle.on{display:flex;}
  .bundle .acts{gap:15px;}

  .scrim{
    position:fixed;inset:0;background:rgba(0,0,0,.18);
    opacity:0;pointer-events:none;transition:opacity .3s;z-index:9;
  }
  .scrim.on{opacity:1;pointer-events:auto;}

  .gate{
    position:fixed;inset:0;background:var(--paper);z-index:20;
    display:none;flex-direction:column;justify-content:center;align-items:center;
    padding:24px;text-align:center;
  }
  .gate.on{display:flex;}
  .gate p{max-width:26em;font-size:14px;line-height:1.9;color:var(--faint);margin:0 0 1.8em;}
  .gate input{
    width:min(22em,100%);background:none;border:0;border-bottom:1px solid var(--line);
    font:inherit;font-size:17px;color:var(--ink);padding:.4em 0;text-align:center;
  }
  .gate input:focus{outline:none;border-bottom-color:var(--mark);}
  .gate .row{margin-top:2em;display:flex;gap:24px;font-size:13px;color:var(--faint);}
  .gate .row button:hover{color:var(--ink);}
  .gate .go{color:var(--mark);}
  .gate .note{margin-top:1.4em;font-size:12px;color:var(--faint);min-height:1.4em;}

  @media (max-width:640px){
    :root{--size:17px;}
    main{padding:calc(88px + env(safe-area-inset-top)) 20px 108px;}
    .top{gap:16px;padding-left:20px;padding-right:20px;}
    .foot{padding-left:20px;padding-right:20px;}
    #input{font-size:17px;}
  }
</style>
</head>
<body>

<nav class="top">
  <button id="openScriv" type="button">스크리브너</button>
  <button id="modeBtn" type="button">400자</button>
  <button id="themeBtn" type="button">어둡게</button>
  <button id="drawerBtn" type="button">서랍</button>
</nav>

<main id="field">
  <div class="stack">
    <div class="acc" id="acc"></div>
    <div id="ghost"></div>
    <textarea id="input" rows="1" placeholder="한 문장을 쓰고 엔터." autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="rule"><span id="fill"></span></div>
  </div>
</main>

<div class="foot">
  <div class="count"><span id="counts">공백 포함 <b>0</b>자 · <b>0.0</b>매</span><span id="sync">동기화 꺼짐</span></div>
  <div class="mid"><button id="toScriv" type="button" disabled>스크리브너로</button></div>
  <div class="right"><button id="stash" type="button">서랍에 넣기</button></div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <header>
    <span id="dcount">서랍</span>
    <span class="tools">
      <button id="pick" type="button">묶기</button>
      <button id="tidy" type="button">중복 정리</button>
      <button id="clearAll" type="button">전체 비우기</button>
      <button id="close" type="button">닫기</button>
    </span>
  </header>
  <div class="list" id="list"></div>
  <div class="bundle" id="bundle">
    <span id="bsum">0편</span>
    <span class="acts">
      <button id="bcopy" type="button">복사</button>
      <button id="bscriv" class="send" type="button">스크리브너로</button>
      <button id="bmail" type="button">메일로</button>
      <button id="bcancel" type="button">그만</button>
    </span>
  </div>
</aside>

<div class="gate" id="gate">
  <p>세 기기에 같은 열쇠말을 넣으면 쓰던 글과 서랍이 따라옵니다.<br>여덟 자 이상, 잊지 않을 문장으로.</p>
  <input id="secretInput" type="password" placeholder="열쇠말" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="note" id="gateNote"></div>
  <div class="row">
    <button class="go" id="gateOk" type="button">연결</button>
    <button id="gateSkip" type="button">이 기기에만 저장</button>
  </div>
</div>
<script>
(function(){
  "use strict";
  var KEY   = "hanmunjang.v1";
  var GOAL  = 400;
  var MINS  = 25;
  var BREAK = 30 * 60 * 1000;
  var SB_URL = "https://uohlhyqopsljymxwlfnj.supabase.co";
  var SB_KEY = "sb_publishable_btYdJmNqhQqdhe4THIgRRA_O9qqzrU2";

  var el = {
    acc: document.getElementById("acc"),
    ghost: document.getElementById("ghost"),
    input: document.getElementById("input"),
    fill: document.getElementById("fill"),
    counts: document.getElementById("counts"),
    sync: document.getElementById("sync"),
    stash: document.getElementById("stash"),
    toScriv: document.getElementById("toScriv"),
    modeBtn: document.getElementById("modeBtn"),
    themeBtn: document.getElementById("themeBtn"),
    drawer: document.getElementById("drawer"),
    scrim: document.getElementById("scrim"),
    list: document.getElementById("list"),
    dcount: document.getElementById("dcount"),
    bundle: document.getElementById("bundle"),
    bsum: document.getElementById("bsum"),
    gate: document.getElementById("gate"),
    secretInput: document.getElementById("secretInput"),
    gateNote: document.getElementById("gateNote")
  };

  var state = {
    sentences:[], stamps:[], startedAt:null,
    draft:"", draftAt:null, lastSentence:"",
    drawer:[], theme:"light", mode:"chars", secret:null
  };
  var confirmTimer = null, lastKey = 0, syncing = false, pending = null, pendingTimer = null;
  var picking = false, picked = {};

  /* ── 저장 ── */
  function load(){
    try{
      var d = JSON.parse(localStorage.getItem(KEY) || "{}");
      if(Array.isArray(d.sentences)) state.sentences = d.sentences;
      if(Array.isArray(d.stamps)) state.stamps = d.stamps;
      if(typeof d.startedAt === "number") state.startedAt = d.startedAt;
      if(typeof d.draft === "string") state.draft = d.draft;
      if(typeof d.draftAt === "string") state.draftAt = d.draftAt;
      if(typeof d.lastSentence === "string") state.lastSentence = d.lastSentence;
      if(Array.isArray(d.drawer)) state.drawer = d.drawer;
      if(d.theme === "dark" || d.theme === "light") state.theme = d.theme;
      if(d.mode === "time" || d.mode === "chars") state.mode = d.mode;
      if(typeof d.secret === "string") state.secret = d.secret;
    }catch(e){}
  }
  var saveTimer = null;
  function writeNow(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(writeNow, 120); }
  function touch(){ state.draftAt = new Date().toISOString(); }

  /* ── 계산 ── */
  function smart(s){
    return s
      .replace(/(^|[\s([{<\u2018\u201C\u2014\u2013-])"/g, "$1\u201C")
      .replace(/"/g, "\u201D")
      .replace(/(^|[\s([{<\u201C\u2014\u2013-])'/g, "$1\u2018")
      .replace(/'/g, "\u2019");
  }

  function accText(){ return state.sentences.join(" "); }
  function fullText(){
    var a = accText(), b = el.input.value.trim();
    if(!b) return a;
    return a ? a + " " + b : b;
  }
  function sheets(n){ return (n / 200).toFixed(1); }
  function live(){ return state.drawer.filter(function(x){ return !x.deleted_at; }); }

  /* 문장마다 머문 시간. 5분 넘게 손을 놓은 구간은 뺍니다. */
  function spans(sentences, stamps, startedAt){
    var prev = startedAt, out = [];
    (sentences || []).forEach(function(s, i){
      var t = (stamps || [])[i];
      var raw = (t && prev) ? t - prev : 0;
      prev = t || prev;
      var away = raw > BREAK;
      out.push({ text:s, ms: away ? 0 : raw, paused: away, gap: away ? raw : 0 });
    });
    return out;
  }
  function activeMs(sp, openSince){
    var sum = 0;
    sp.forEach(function(x){ sum += x.ms; });
    if(openSince){
      var raw = Date.now() - openSince;
      if(raw <= BREAK) sum += raw;
    }
    return sum;
  }
  function mins(ms){ return Math.round(ms / 60000); }
  function clock(ms){
    var s = Math.round(ms / 1000);
    if(s < 60) return s + "초";
    return Math.floor(s/60) + "분 " + (s % 60) + "초";
  }
  function gapText(ms){
    var m = Math.round(ms / 60000);
    if(m < 60) return m + "분";
    var h = Math.floor(m / 60), r = m % 60;
    return h + "시간" + (r ? " " + r + "분" : "");
  }
  var TIMES = ["","한","두","세","네","다섯","여섯","일곱","여덟","아홉"];
  function times(n){ return (TIMES[n] || n) + "번에 걸쳐"; }
  function nowSpans(){ return spans(state.sentences, state.stamps, state.startedAt); }
  function openSince(){
    if(!state.startedAt) return 0;
    return state.stamps.length ? state.stamps[state.stamps.length-1] : state.startedAt;
  }

  /* ── 그리기 ── */
  function paint(){
    el.acc.textContent = accText();
    el.acc.scrollTop = el.acc.scrollHeight;

    var showGhost = !state.sentences.length && !el.input.value && state.lastSentence;
    el.ghost.classList.toggle("on", !!showGhost);
    if(showGhost) el.ghost.textContent = state.lastSentence;

    var t = fullText();
    var chars = t.length;
    var ms = activeMs(nowSpans(), el.input.value.trim() ? openSince() : 0);
    var line = "공백 포함 <b>" + chars + "</b>자 · <b>" + sheets(chars) + "</b>매";
    if(state.startedAt) line += " · <b>" + mins(ms) + "</b>분";
    el.counts.innerHTML = line;

    var ratio = state.mode === "time"
      ? Math.min(1, ms / (MINS * 60000))
      : Math.min(1, chars / GOAL);
    el.fill.style.width = (ratio * 100) + "%";
    var reached = ratio >= 1 && chars > 0;
    document.body.classList.toggle("full", reached);
    el.toScriv.disabled = !reached;

    grow();
  }
  function grow(){
    el.input.style.height = "auto";
    el.input.style.height = el.input.scrollHeight + "px";
  }

  /* ── 문장 밀어 올리기 ── */
  function push(){
    var s = smart(el.input.value.trim());
    if(!s) return;
    if(!state.startedAt) state.startedAt = Date.now();
    state.sentences.push(s);
    state.stamps.push(Date.now());
    el.input.value = "";
    state.draft = "";
    touch(); resetConfirm();
    paint(); save(); syncSoon(400);
  }
  function pullBack(){
    if(!state.sentences.length) return;
    el.input.value = state.sentences.pop();
    state.stamps.pop();
    state.draft = el.input.value;
    touch();
    paint(); save(); syncSoon(1500);
    var n = el.input.value.length;
    el.input.setSelectionRange(n, n);
  }

  /* ── 서랍 ── */
  function resetConfirm(){
    clearTimeout(confirmTimer); confirmTimer = null;
    el.stash.textContent = "서랍에 넣기";
  }
  function samePiece(text){
    var t = text.trim();
    return state.drawer.some(function(p){ return !p.deleted_at && p.text.trim() === t; });
  }
  function archive(text, auto){
    var now = new Date().toISOString();
    state.drawer.unshift({
      id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
          : Date.now() + "-" + Math.random().toString(36).slice(2,9),
      text: text, at: now, chars: text.length,
      sentences: state.sentences.slice(),
      stamps: state.stamps.slice(),
      startedAt: state.startedAt,
      auto: !!auto, deleted_at: null, updated_at: now
    });
    if(state.sentences.length) state.lastSentence = state.sentences[state.sentences.length-1];
    state.sentences = []; state.stamps = []; state.startedAt = null;
    el.input.value = ""; state.draft = "";
    touch(); resetConfirm();
    paint(); save(); renderDrawer(); syncSoon(200);
  }
  function stash(){
    push();
    var text = accText();
    if(!text){ flash(el.stash, "쓴 글이 없습니다", "서랍에 넣기"); return; }
    var short = state.mode === "time"
      ? activeMs(nowSpans(), 0) < MINS * 60000
      : text.length < GOAL;
    if(short && !confirmTimer){
      el.stash.textContent = state.mode === "time"
        ? "아직 " + mins(activeMs(nowSpans(),0)) + "분 · 그래도 넣기"
        : "아직 " + text.length + "자 · 그래도 넣기";
      confirmTimer = setTimeout(resetConfirm, 4000);
      return;
    }
    archive(text);
    flash(el.stash, "서랍에 넣었습니다", "서랍에 넣기");
    el.input.focus();
  }
  function flash(node, msg, back){
    node.textContent = msg;
    setTimeout(function(){ if(!confirmTimer) node.textContent = back; }, 1600);
  }
  function fmt(iso){
    var d = new Date(iso), p = function(n){ return n < 10 ? "0"+n : ""+n; };
    return d.getFullYear()+"."+p(d.getMonth()+1)+"."+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
  }

  function renderDrawer(){
    var items = live().sort(function(a,b){ return a.at < b.at ? 1 : -1; });
    el.dcount.textContent = items.length ? "서랍 " + items.length + "편" : "서랍";
    el.list.innerHTML = "";
    if(!items.length){
      var e = document.createElement("p");
      e.className = "empty";
      e.textContent = "아직 비어 있습니다. 한 편을 마치면 여기 쌓입니다.";
      el.list.appendChild(e);
      updateBundle();
      return;
    }
    items.forEach(function(item){
      var card = document.createElement("article");
      card.className = "card" + (picked[item.id] ? " sel" : "");

      var sp = spans(item.sentences, item.stamps, item.startedAt);
      var total = activeMs(sp, 0);

      var meta = document.createElement("div");
      meta.className = "meta";
      var breaks = sp.filter(function(x){ return x.paused; }).length;
      meta.textContent = fmt(item.at) + " · " + item.chars + "자 · " + sheets(item.chars) + "매"
        + (total ? " · " + mins(total) + "분 · 문장 " + sp.length + "개" : "")
        + (breaks ? " · " + times(breaks + 1) : "");

      var body = document.createElement("p");
      body.className = "body";
      body.textContent = item.text;
      body.addEventListener("click", function(){
        if(picking){ togglePick(item.id, card); return; }
        body.classList.toggle("open");
      });

      card.appendChild(meta);
      card.appendChild(body);

      var held = null;
      if(total > 0){
        var max = 0;
        sp.forEach(function(x){ if(x.ms > max) max = x.ms; });
        var strip = document.createElement("div");
        strip.className = "strip";
        held = document.createElement("p");
        held.className = "heldline";
        var longest = sp.filter(function(x){ return x.ms === max; })[0];
        held.textContent = longest ? "가장 오래 머문 문장 · " + clock(max) + " — " + longest.text : "";
        sp.forEach(function(x){
          var seg = document.createElement("i");
          if(x.paused){ seg.className = "pause"; seg.style.flex = "0 0 6px"; }
          else{
            seg.style.flex = (Math.max(x.ms, 1)) + " 1 0";
            if(x.ms === max && max > 0) seg.className = "long";
          }
          seg.title = x.paused ? gapText(x.gap) + " 뒤에 이어 씀" : clock(x.ms);
          seg.addEventListener("click", function(){
            held.textContent = x.paused
              ? gapText(x.gap) + " 뒤에 이어 씀 — " + x.text
              : clock(x.ms) + " — " + x.text;
          });
          strip.appendChild(seg);
        });
        card.appendChild(strip);
        card.appendChild(held);
      }

      var acts = document.createElement("div");
      acts.className = "acts";

      if(picking){
        var mark = document.createElement("button");
        mark.type = "button";
        mark.textContent = picked[item.id] ? "선택됨" : "선택";
        mark.addEventListener("click", function(){ togglePick(item.id, card, mark); });
        acts.appendChild(mark);
      }else{
        acts.appendChild(actBtn("복사", function(done){ toClipboard(item.text, done); }, "복사됨"));
        var s = actBtn("스크리브너로", function(done){ sendTo("스크리브너", item.text, done); }, "보냈습니다");
        s.className = "send";
        acts.appendChild(s);
        acts.appendChild(actBtn("메일로", function(done){ sendTo("메일", item.text, done); }, "보냈습니다"));

        var del = document.createElement("button");
        del.type = "button"; del.textContent = "삭제";
        var armed = false, t = null;
        del.addEventListener("click", function(){
          if(!armed){
            armed = true; del.textContent = "한 번 더";
            t = setTimeout(function(){ armed = false; del.textContent = "삭제"; }, 3000);
            return;
          }
          clearTimeout(t);
          item.deleted_at = new Date().toISOString();
          item.updated_at = item.deleted_at;
          save(); renderDrawer(); syncSoon(200);
        });
        acts.appendChild(del);
      }
      card.appendChild(acts);
      el.list.appendChild(card);
    });
    updateBundle();
  }

  function actBtn(label, run, okText){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    b.addEventListener("click", function(){
      run(function(ok){
        b.textContent = ok ? okText : "복사 실패";
        setTimeout(function(){ b.textContent = label; }, 1700);
      });
    });
    return b;
  }

  /* ── 묶기 ── */
  function togglePick(id, card, btn){
    if(picked[id]) delete picked[id]; else picked[id] = true;
    card.classList.toggle("sel", !!picked[id]);
    if(btn) btn.textContent = picked[id] ? "선택됨" : "선택";
    updateBundle();
  }
  function pickedPieces(){
    return live().filter(function(p){ return picked[p.id]; })
                 .sort(function(a,b){ return a.at < b.at ? -1 : 1; });
  }
  function bundleText(){
    return pickedPieces().map(function(p){ return p.text; }).join("\n\n");
  }
  function updateBundle(){
    el.bundle.classList.toggle("on", picking);
    var ps = pickedPieces();
    var chars = ps.reduce(function(n,p){ return n + p.chars; }, 0);
    el.bsum.textContent = ps.length ? ps.length + "편 · " + chars + "자 · " + sheets(chars) + "매" : "카드를 골라주세요";
  }
  document.getElementById("pick").addEventListener("click", function(){
    picking = !picking;
    if(!picking) picked = {};
    this.textContent = picking ? "묶기 끝" : "묶기";
    renderDrawer();
  });
  document.getElementById("bcancel").addEventListener("click", function(){
    picking = false; picked = {};
    document.getElementById("pick").textContent = "묶기";
    renderDrawer();
  });
  function bundleAct(btnId, run, okText){
    var b = document.getElementById(btnId), label = b.textContent;
    b.addEventListener("click", function(){
      var text = bundleText();
      if(!text){ b.textContent = "고른 글이 없습니다"; setTimeout(function(){ b.textContent = label; }, 1600); return; }
      run(text, function(ok){
        b.textContent = ok ? okText : "복사 실패";
        setTimeout(function(){ b.textContent = label; }, 1700);
      });
    });
  }
  bundleAct("bcopy", function(t, d){ toClipboard(t, d); }, "복사됨");
  bundleAct("bscriv", function(t, d){ sendTo("스크리브너", t, d); }, "보냈습니다");
  bundleAct("bmail", function(t, d){ sendTo("메일", t, d); }, "보냈습니다");

  /* ── 클립보드 · 단축어 ── */
  function runShortcut(name){
    window.location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(name);
  }
  function sendTo(name, text, done){
    toClipboard(text, function(ok){ if(ok) runShortcut(name); done(ok); });
  }
  function toClipboard(text, done){
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, legacy);
    }else legacy();
    function legacy(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly","");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try{ ok = document.execCommand("copy"); }catch(e){}
      document.body.removeChild(ta);
      done(ok);
    }
  }

  /* ── 동기화 ── */
  function status(msg){ el.sync.textContent = " · " + msg; }
  function syncSoon(ms){
    if(!state.secret) return;
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(function(){ syncNow(false); }, ms || 1200);
  }
  function syncNow(closing){
    if(!state.secret) return Promise.resolve();
    if(syncing && !closing) return Promise.resolve();
    syncing = true;
    if(!closing) status("동기화 중");
    var payload = {
      secret: state.secret,
      draft: {
        sentences: state.sentences, stamps: state.stamps, startedAt: state.startedAt,
        line: state.draft, last: state.lastSentence, updated_at: state.draftAt
      },
      pieces: state.drawer.map(function(p){
        return {
          id: p.id, text: p.text, chars: p.chars, at: p.at,
          deleted_at: p.deleted_at, updated_at: p.updated_at,
          meta: { sentences: p.sentences || [], stamps: p.stamps || [], startedAt: p.startedAt || null }
        };
      })
    };
    var opts = {
      method: "POST",
      headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    };
    if(closing) opts.keepalive = true;
    return fetch(SB_URL + "/rest/v1/rpc/sync", opts)
      .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(t); }); return r.json(); })
      .then(function(data){
        syncing = false;
        if(closing) return;
        mergePieces(data.pieces || []);
        applyDraft(data.draft || {});
        status("동기화 " + fmt(new Date().toISOString()).slice(11));
      })
      .catch(function(err){
        syncing = false;
        if(!closing) status(navigator.onLine ? "동기화 실패" : "오프라인");
        console.warn("sync:", err && err.message);
      });
  }
  function mergePieces(remote){
    var byId = {};
    state.drawer.forEach(function(p){ byId[p.id] = p; });
    remote.forEach(function(r){
      var lp = byId[r.id];
      var m = r.meta || {};
      if(!lp || (r.updated_at || "") > (lp.updated_at || "")){
        byId[r.id] = {
          id:r.id, text:r.text, chars:r.chars, at:r.at,
          sentences: m.sentences || (lp && lp.sentences) || [],
          stamps: m.stamps || (lp && lp.stamps) || [],
          startedAt: m.startedAt || (lp && lp.startedAt) || null,
          auto: lp ? !!lp.auto : false,
          deleted_at: r.deleted_at || null,
          updated_at: r.updated_at || r.at
        };
      }else if(r.deleted_at && !lp.deleted_at){
        lp.deleted_at = r.deleted_at;
      }
    });
    state.drawer = Object.keys(byId).map(function(k){ return byId[k]; })
      .sort(function(a,b){ return a.at < b.at ? 1 : -1; });
    save(); renderDrawer();
  }
  function applyDraft(d){
    if(!d || !d.updated_at) return;
    if(state.draftAt && d.updated_at <= state.draftAt) return;
    if(el.input.value.trim() || Date.now() - lastKey < 4000){
      pending = d;
      setTimeout(function(){ if(pending){ var p = pending; pending = null; applyDraft(p); } }, 5000);
      return;
    }
    var localText = fullText().trim();
    var remoteText = ((d.sentences || []).join(" ") + " " + (d.line || "")).trim();
    var ancestor = !localText || remoteText.indexOf(localText) === 0;
    if(localText && !ancestor && !samePiece(localText)){
      push();
      archive(accText(), true);
    }
    state.sentences = Array.isArray(d.sentences) ? d.sentences : [];
    state.stamps = Array.isArray(d.stamps) ? d.stamps : [];
    state.startedAt = typeof d.startedAt === "number" ? d.startedAt : null;
    if(typeof d.last === "string" && d.last) state.lastSentence = d.last;
    el.input.value = d.line || "";
    state.draft = el.input.value;
    state.draftAt = d.updated_at;
    paint(); save();
  }

  /* ── 열쇠말 ── */
  function openGate(){
    el.gate.classList.add("on");
    el.gateNote.textContent = "";
    el.secretInput.value = state.secret || "";
    setTimeout(function(){ el.secretInput.focus(); }, 60);
  }
  function closeGate(){ el.gate.classList.remove("on"); el.input.focus(); }
  document.getElementById("gateOk").addEventListener("click", function(){
    var v = el.secretInput.value.trim();
    if(v.length < 8){ el.gateNote.textContent = "여덟 자 이상이어야 합니다."; return; }
    state.secret = v; writeNow(); closeGate();
    status("동기화 중"); syncNow(false);
  });
  document.getElementById("gateSkip").addEventListener("click", function(){
    closeGate();
    status(state.secret ? "동기화 켜짐" : "동기화 꺼짐");
  });
  el.secretInput.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); document.getElementById("gateOk").click(); }
  });
  el.sync.addEventListener("click", openGate);

  /* ── 모드 · 테마 ── */
  function applyMode(){
    el.modeBtn.textContent = state.mode === "time" ? MINS + "분" : GOAL + "자";
    paint();
  }
  function applyTheme(){
    document.documentElement.setAttribute("data-theme", state.theme);
    el.themeBtn.textContent = state.theme === "dark" ? "밝게" : "어둡게";
  }
  el.modeBtn.addEventListener("click", function(){
    state.mode = state.mode === "time" ? "chars" : "time";
    applyMode(); save();
  });
  el.themeBtn.addEventListener("click", function(){
    state.theme = state.theme === "dark" ? "light" : "dark";
    applyTheme(); save();
  });

  /* ── 이벤트 ── */
  el.input.addEventListener("keydown", function(e){
    lastKey = Date.now();
    if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); stash(); return; }
    if(e.key === "Enter"){
      if(e.isComposing || e.keyCode === 229) return;
      e.preventDefault(); push(); return;
    }
    if(e.key === "Backspace" && el.input.value === "" && state.sentences.length){
      e.preventDefault(); pullBack();
    }
  });
  el.input.addEventListener("input", function(){
    lastKey = Date.now();
    if(!state.startedAt && el.input.value) state.startedAt = Date.now();
    state.draft = el.input.value;
    touch(); resetConfirm();
    paint(); save(); syncSoon(2000);
  });
  document.getElementById("field").addEventListener("mousedown", function(e){
    if(e.target === el.input) return;
    if(window.getSelection && String(window.getSelection())) return;
    setTimeout(function(){ el.input.focus(); }, 0);
  });

  function openDrawer(v){
    el.drawer.classList.toggle("open", v);
    el.scrim.classList.toggle("on", v);
    el.drawer.setAttribute("aria-hidden", v ? "false" : "true");
    if(!v) el.input.focus();
  }
  document.getElementById("drawerBtn").addEventListener("click", function(){ openDrawer(true); });
  document.getElementById("close").addEventListener("click", function(){ openDrawer(false); });
  el.scrim.addEventListener("click", function(){ openDrawer(false); });
  el.stash.addEventListener("click", stash);
  document.getElementById("openScriv").addEventListener("click", function(){ runShortcut("스크리브너"); });

  el.toScriv.addEventListener("click", function(){
    push();
    var text = accText();
    if(!text) return;
    toClipboard(text, function(ok){
      if(!ok){
        el.toScriv.textContent = "복사 실패";
        setTimeout(function(){ el.toScriv.textContent = "스크리브너로"; }, 2000);
        return;
      }
      archive(text);
      el.toScriv.textContent = "서랍에 넣고 스크리브너로";
      setTimeout(function(){ el.toScriv.textContent = "스크리브너로"; }, 2000);
      runShortcut("스크리브너");
      el.input.focus();
    });
  });

  var tidyBtn = document.getElementById("tidy"), tidyArmed = false, tidyT = null;
  tidyBtn.addEventListener("click", function(){
    var items = live().slice().sort(function(a,b){ return b.text.length - a.text.length; });
    var kept = [], doomed = [];
    items.forEach(function(p){
      var t = p.text.trim();
      if(kept.some(function(k){ return k.text.trim().indexOf(t) === 0; })) doomed.push(p);
      else kept.push(p);
    });
    if(!doomed.length){
      tidyBtn.textContent = "겹치는 글 없음";
      setTimeout(function(){ tidyBtn.textContent = "중복 정리"; }, 1800);
      return;
    }
    if(!tidyArmed){
      tidyArmed = true;
      tidyBtn.textContent = doomed.length + "편 지웁니다 · 한 번 더";
      tidyT = setTimeout(function(){ tidyArmed = false; tidyBtn.textContent = "중복 정리"; }, 4000);
      return;
    }
    clearTimeout(tidyT); tidyArmed = false; tidyBtn.textContent = "중복 정리";
    var now = new Date().toISOString();
    doomed.forEach(function(p){ p.deleted_at = now; p.updated_at = now; });
    save(); renderDrawer(); syncSoon(200);
  });

  var clearBtn = document.getElementById("clearAll"), clearArmed = false, clearT = null;
  clearBtn.addEventListener("click", function(){
    if(!live().length) return;
    if(!clearArmed){
      clearArmed = true;
      clearBtn.textContent = "한 번 더 누르면 비웁니다";
      clearT = setTimeout(function(){ clearArmed = false; clearBtn.textContent = "전체 비우기"; }, 3500);
      return;
    }
    clearTimeout(clearT); clearArmed = false; clearBtn.textContent = "전체 비우기";
    var now = new Date().toISOString();
    state.drawer.forEach(function(p){ if(!p.deleted_at){ p.deleted_at = now; p.updated_at = now; } });
    save(); renderDrawer(); syncSoon(200);
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(el.gate.classList.contains("on")) closeGate();
      else if(el.drawer.classList.contains("open")) openDrawer(false);
    }
    if((e.metaKey || e.ctrlKey) && e.key === "Enter" && document.activeElement !== el.input){
      e.preventDefault(); stash();
    }
  });

  document.addEventListener("visibilitychange", function(){
    if(document.hidden){ writeNow(); syncNow(true); }
    else { syncNow(false); paint(); }
  });
  window.addEventListener("focus", function(){ syncNow(false); });
  window.addEventListener("online", function(){ syncNow(false); });
  window.addEventListener("pagehide", function(){ writeNow(); syncNow(true); });
  window.addEventListener("beforeunload", writeNow);
  window.addEventListener("resize", grow);
  setInterval(function(){ if(!document.hidden) syncNow(false); }, 30000);
  setInterval(function(){ if(!document.hidden && state.startedAt) paint(); }, 15000);

  /* ── 시작 ── */
  load();
  applyTheme();
  el.input.value = state.draft || "";
  applyMode();
  paint();
  renderDrawer();
  if(state.secret){ status("동기화 중"); syncNow(false); el.input.focus(); }
  else { status("동기화 꺼짐"); openGate(); }
})();
</script>
</body>
</html>
