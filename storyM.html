<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>storyM</title>
<style>
:root{
  --bg:#f6f5f0; --panel:#ffffff; --panel2:#f1efe8; --ink:#1f1f1d; --ink2:#5f5e5a; --muted:#8a8984;
  --line:#e2e0d8; --line2:#c9c7bf;
  --accent:#534ab7; --accent-bg:#eeedfe;
  --ok:#0f6e56; --ok-bg:#e1f5ee; --warn:#854f0b; --warn-bg:#faeeda; --bad:#a32d2d; --bad-bg:#fcebeb;
  --radius:8px;
  --font:-apple-system,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
button:hover{background:var(--panel2)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.primary:hover{background:#3a3a37}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--panel2)}
button.danger{color:var(--bad)}
input,textarea,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:6px 10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
textarea{resize:none;line-height:1.7}
.muted{color:var(--muted)}
.small{font-size:12px}
details.menu{position:relative}
details.menu>summary{list-style:none;cursor:pointer;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:6px 12px;user-select:none}
details.menu>summary::-webkit-details-marker{display:none}
details.menu>summary:hover{background:var(--panel2)}
details.menu>div{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:6px;min-width:220px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.08)}
details.menu>div button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:8px 10px;border-radius:6px}
details.menu>div button:hover{background:var(--panel2)}
details.menu>div .sep{border-top:1px solid var(--line);margin:6px 0}
details.menu>div label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;font-size:13px}
details.menu>div label input{width:72px;padding:3px 6px}

/* home */
.home{max-width:880px;margin:0 auto;padding:48px 24px}
.home h1{font-size:28px;font-weight:500;margin:0 0 6px;letter-spacing:-.01em}
.home .lead{color:var(--ink2);margin:0 0 28px}
.home-actions{display:flex;gap:8px;margin-bottom:24px}
.lect-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lect{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;position:relative}
.lect:hover{border-color:var(--line2)}
.lect h3{margin:0 0 6px;font-size:16px;font-weight:500}
.lect .meta{color:var(--ink2);font-size:13px}
.lect .del{position:absolute;top:10px;right:10px;opacity:0;font-size:12px}
.lect:hover .del{opacity:1}
.syncbox{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.syncbox h3{font-size:14px;font-weight:500;margin:0 0 8px}
.syncform{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.syncform input{width:200px}
.syncform.compact{flex-direction:column;align-items:stretch}
.syncform.compact input{width:100%}
.syncstat{font-size:12px;color:var(--muted);margin-top:6px}
.syncstat.err{color:var(--bad)}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:40px;text-align:center;color:var(--ink2)}

/* editor */
.editor{display:flex;flex-direction:column;height:100vh}
.ed-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.ed-head .title{font-size:17px;font-weight:500;border:1px solid transparent;background:transparent;min-width:260px;flex:1}
.ed-head .title:hover{border-color:var(--line2)}
.ed-head .title:focus{background:var(--panel)}
.ed-meta{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--ink2);flex-wrap:wrap}
.ed-meta label{display:flex;align-items:center;gap:6px}
.ed-meta input{padding:4px 8px;font-size:13px}
.ed-meta input.n{width:64px}
.ed-meta input.logline{flex:1;min-width:240px}
.ed-meta .spacer{flex:1}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.timebar{display:flex;gap:2px;height:8px;margin:10px 16px 0;border-radius:4px;overflow:hidden}
.timebar div{min-width:2px}
.timebar .rest{background:transparent;border:1px dashed var(--line2);border-radius:4px}
.ed-body{display:grid;grid-template-columns:300px minmax(0,1fr);flex:1;min-height:0}
.sidebar{overflow:auto;border-right:1px solid var(--line);padding:12px}
.sidebar .hd{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin:4px 6px 8px}
.trow{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-radius:var(--radius);cursor:pointer;border:1px solid transparent;margin-bottom:4px;background:var(--panel)}
.trow:hover{border-color:var(--line)}
.trow.sel{border-color:var(--line2);background:var(--panel2)}
.trow.dragover{border-top:2px solid var(--accent)}
.trow .dot{width:8px;height:8px;border-radius:2px;margin-top:6px;flex:none}
.trow .mins{color:var(--muted);font-size:12px;min-width:40px;margin-top:2px;text-align:right}
.trow .tt{flex:1;min-width:0}
.trow .tt .name{font-size:13px;line-height:1.4;word-break:break-word}
.trow .tt .name.ph{color:var(--muted)}
.trow .tt .st{font-size:11px;margin-top:2px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--line);margin-bottom:12px;background:var(--panel);font-size:13px}
.srow:hover{border-color:var(--line2)}
.srow.sel{background:var(--panel2);border-color:var(--line2)}
.srow .c{font-size:11px;color:var(--warn)}
.scratch textarea{width:100%;min-height:46vh;font-size:15px}
.scratch .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.scratch .bar .reader{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden}
.scratch .bar .reader button{border:none;border-radius:0}
.scratch .bar .reader select{border:none;border-left:1px solid var(--line2);border-radius:0;padding:6px 8px;max-width:220px;background:var(--panel2);font-size:13px}
.card.draft{border-left:3px solid #c9b8ff}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:11px;background:var(--accent-bg);color:var(--accent);margin-left:6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border-radius:12px;width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column;padding:18px 20px}
.modal h2{font-size:16px;font-weight:500;margin:0 0 6px}
.modal textarea{width:100%;min-height:180px;flex:none;font-size:13px}
.modal .prev{overflow:auto;flex:1;margin:12px 0;font-size:13px;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--panel2);min-height:56px}
.modal .prev li{margin:3px 0}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.st-empty{color:var(--muted)} .st-memo{color:var(--warn)} .st-wip{color:var(--accent)} .st-done{color:var(--ok)}
.detail{overflow:auto;padding:18px 24px 80px}
.detail .row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.detail .ttl{font-size:18px;font-weight:500;flex:1;min-width:0}
.detail .lbl{font-size:12px;color:var(--muted);margin:14px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.detail input.full{width:100%}
.detail textarea.memo{width:100%;min-height:64px;background:var(--panel2);border-color:transparent}
.detail textarea.memo:focus{background:var(--panel)}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 8px}
.card.over{border-color:#e9b56a}
.card textarea{width:100%;min-height:72px;border:none;padding:2px 0;font-size:15px;background:transparent}
.card textarea:focus{outline:none}
.card .ft{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.card .ft .tools{display:flex;gap:2px;opacity:0}
.card:hover .ft .tools,.card:focus-within .ft .tools{opacity:1}
.card .ft .tools button{padding:2px 7px;font-size:12px;border-color:transparent}
.card .ft .warn{color:var(--warn)}
.addcard{border:1px dashed var(--line2);background:transparent;color:var(--ink2);width:100%;padding:10px}
.detail .bottom{display:flex;justify-content:space-between;margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}
.nodetail{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;padding:40px}

/* print */
#print-root{display:none}
@media print{
  body>*:not(#print-root){display:none !important}
  #print-root{display:block}
  html,body{margin:0;padding:0;height:auto;background:#fff;color:#000}
}
/* A6 가로는 148×105mm. Safari는 @page를 무시하고 자기 기본 여백(약 12.7mm)을 쓰기도 하므로, 그 안(약 122×79mm)에도 들어가게 카드를 120×78mm로 잡는다. 1mm라도 넘치면 카드마다 빈 장이 끼어든다. */
/* --fs: 넘치는 카드만 인쇄 직전에 fitA6Cards()가 1 → 0.72까지 줄이는 글자 배율 */
.a6 .pcard{--fs:1;width:120mm;height:78mm;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;page-break-after:always;break-after:page;page-break-inside:avoid;break-inside:avoid;font-size:calc(12.5pt * var(--fs));line-height:1.55;color:#000}
#print-root.measuring{display:block;position:absolute;left:-10000px;top:0;width:148mm}
.a6 .pcard:last-child{page-break-after:auto;break-after:auto}
.a6 .ph{display:flex;justify-content:space-between;font-size:8.5pt;color:#666;border-bottom:.5pt solid #999;padding-bottom:1.5mm;margin-bottom:3mm}
.a6 .pb{flex:1;white-space:pre-wrap;word-break:keep-all;overflow:hidden}
.a6 .pf{display:flex;justify-content:space-between;align-items:flex-end;font-size:8pt;color:#777;margin-top:2mm}
.a6 .pf .m{white-space:pre-wrap;max-width:85%;font-size:8.5pt;color:#555}
.a6 .cover{justify-content:center;text-align:center}
.a6 .cover .k{font-size:9pt;color:#666;letter-spacing:.06em;margin-bottom:3mm}
.a6 .cover h2{font-size:calc(19pt * var(--fs));font-weight:600;margin:0 0 3mm;line-height:1.3;word-break:keep-all}
.a6 .cover p{font-size:calc(12pt * var(--fs));color:#333;margin:0;line-height:1.45}
.a6 .cover .m{font-size:calc(9pt * var(--fs));color:#555;white-space:pre-wrap;margin-top:5mm;text-align:left}
.a6 .cover .pf{position:absolute;left:0;right:0;bottom:0}
.a6 .pcard.cover{position:relative}
.a6 .title{justify-content:center;text-align:center}
.a6 .title h1{font-size:calc(22pt * var(--fs));font-weight:600;margin:0 0 4mm;line-height:1.3;word-break:keep-all}
.a6 .title p{margin:0;font-size:calc(10pt * var(--fs));color:#555}
.a6 .title p.lg{font-size:calc(11pt * var(--fs));color:#333;margin-bottom:3mm}
.a4{font-size:11pt;line-height:1.75;color:#000}
.a4 h1{font-size:20pt;font-weight:600;margin:0 0 2mm;line-height:1.3}
.a4 .meta{color:#555;font-size:10pt;margin-bottom:8mm}
.a4 .meta .lg{color:#222;font-size:11pt;margin-bottom:1mm}
.a4 h3{font-size:11pt;color:#444;margin:0 0 2mm;font-weight:600}
.a4 table{width:100%;border-collapse:collapse;font-size:10pt;margin-bottom:4mm}
.a4 th,.a4 td{border-bottom:.5pt solid #aaa;padding:1.6mm 2mm;text-align:left;vertical-align:top}
.a4 th{border-bottom:1pt solid #333;font-weight:600;color:#333}
.a4 td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.a4 .sec{display:grid;grid-template-columns:24mm minmax(0,1fr);column-gap:6mm;margin-top:9mm}
.a4 .sec .lt{font-size:9pt;color:#555;border-top:1pt solid #333;padding-top:2mm;line-height:1.5}
.a4 .sec .rt{border-top:1pt solid #333;padding-top:2mm;min-width:0}
.a4 .sec h2{font-size:14pt;font-weight:600;margin:0 0 1mm;line-height:1.3}
.a4 .sec .sum{color:#444;margin:0 0 3mm;font-size:10.5pt}
.a4 .sec .memo{font-size:9.5pt;color:#555;background:#f3f2ee;padding:2mm 3mm;margin:0 0 3mm;white-space:pre-wrap;border-left:1pt solid #999}
.a4 p{margin:0 0 3mm;white-space:pre-wrap;word-break:keep-all;page-break-inside:avoid;break-inside:avoid}
.a4 p.draft{color:#555}
.a4 .none{color:#888;font-style:italic}

/* 줄거리 — 정해진 것의 나무 */
.srow .c.q{color:var(--accent)}
.ghead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.ghead .ttl{font-size:18px;font-weight:500}
.ghead .gsw{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.ghead .gsw button{padding:3px 9px;font-size:12px}
.ghead .gsw button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ghead .gsw label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-left:8px}
.ghead .gsw input{width:64px;padding:3px 6px;font-size:12px}
.gtime{display:flex;flex-direction:column;gap:2px}
.gtime .gi .yr{flex:none;width:92px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;margin-top:1px}
.gtime .gi .yr b{color:var(--ink);font-weight:500}
.gshelf .gi{cursor:default;flex-wrap:wrap}
.gshelf .gi .why{flex-basis:100%;font-size:12px;color:var(--muted);padding-left:22px}
.gshelf .gi .tools{flex-basis:100%;display:flex;gap:6px;padding-left:22px}
.gshelf .gi .tools button{padding:2px 8px;font-size:12px}
.gtree{display:flex;flex-direction:column;gap:2px}
.gnode{margin-left:calc(var(--d,0)*22px)}
.grow{display:flex;align-items:flex-start;gap:6px;padding:6px 8px;border-radius:var(--radius);cursor:pointer;border:1px solid transparent}
.grow:hover{background:var(--panel)}
.grow.open{background:var(--panel);border-color:var(--line2);border-bottom-left-radius:0;border-bottom-right-radius:0}
.grow .fold{width:16px;flex:none;color:var(--muted);font-size:11px;text-align:center;margin-top:3px}
.grow .glyph{width:16px;flex:none;text-align:center;color:var(--muted);margin-top:1px;font-size:13px}
.grow .gt{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.grow .gt.ph{color:var(--muted)}
.grow .gm{flex:none;font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
.grow .gm a{color:var(--accent);text-decoration:none;padding:0 2px}
.gnode.q .gt{color:var(--ink2)}
.gnode.q .glyph{color:var(--warn);font-weight:600}
.gnode.h .grow{border-left:2px dotted var(--line2);border-radius:0 var(--radius) var(--radius) 0}
.gnode.f .glyph{color:var(--ok);font-size:11px}
.gpanel{background:var(--panel);border:1px solid var(--line2);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:10px 12px;margin-bottom:6px}
.gpanel textarea{width:100%;min-height:56px;font-size:15px}
.gpanel .grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.gpanel .grid input,.gpanel .grid select{width:100%;padding:4px 8px;font-size:13px}
.gpanel .grid .with{display:flex;gap:6px;align-items:center}
.gpanel .grid .with input{flex:1}
.gpanel .grid .with a{text-decoration:none}
.gpanel .grid .with button{padding:4px 9px;font-size:12px;white-space:nowrap}
.gpanel .tools{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.gpanel .tools button{padding:3px 9px;font-size:12px}
.glist{display:flex;flex-direction:column;gap:4px}
.glist .gi{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;background:var(--panel2);border-radius:var(--radius);font-size:13px;cursor:pointer}
.glist .gi:hover{background:var(--panel);outline:1px solid var(--line)}
.glist .gi .glyph{flex:none;color:var(--muted);width:14px;text-align:center}
.glist .gi.q .glyph{color:var(--warn);font-weight:600}
.glist .gi .gt{flex:1;min-width:0;white-space:pre-wrap}
.glist .gi a{color:var(--accent);text-decoration:none;flex:none}
.tpinfo{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tpinfo button{padding:1px 7px;font-size:11px}
.tptext{white-space:pre-wrap;font-size:14px;line-height:1.8;background:var(--panel2);border-radius:var(--radius);padding:12px 14px;max-height:50vh;overflow:auto;margin-top:6px;word-break:keep-all}
.lbl button.small{padding:2px 8px;font-size:11px}
details.menu>div label input.wide{width:150px}

/* 카드 작업대 — 종류·채움·바퀴·찾기 (2026-11-13) */
.ed-body{grid-template-columns:232px minmax(0,1fr)}
.sidebar .srow{margin-bottom:6px}
.ksub{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px 2px}
.ksub button{padding:2px 8px;font-size:12px;border-color:var(--line);color:var(--ink2)}
.ksub button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kd{display:inline-block;flex:none;font-size:11px;padding:0 6px;border:1px solid var(--line2);border-radius:5px;color:var(--ink2);line-height:1.6;margin-top:1px;background:var(--panel)}
.em{display:inline-block;flex:none;font-size:11px;padding:0 6px;border-radius:5px;background:var(--warn-bg);color:var(--warn);line-height:1.7}
.round{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.round .rh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px}
.round .rh b{font-weight:500}
.scratch .round textarea{width:100%;min-height:30vh;font-size:15px;border:none;padding:2px 0;background:transparent}
.scratch .round textarea:focus{outline:none}
.scratch .round.old textarea{min-height:60px;font-size:14px;color:var(--ink2)}
details.rold{margin-bottom:6px}
details.rold>summary{cursor:pointer;font-size:13px;color:var(--ink2);padding:6px 4px}
.asks{font-size:13px;color:var(--ink2);margin:0 0 10px;padding:8px 12px;background:var(--panel2);border-radius:var(--radius)}
.asks ul{margin:4px 0 0;padding-left:18px}
.asks li{margin:2px 0}
.prop{display:flex;gap:8px;align-items:flex-start;padding:6px 2px;border-bottom:1px solid var(--line)}
.prop:last-child{border-bottom:none}
.prop input{margin-top:4px;flex:none}
.prop .pt{flex:1;min-width:0}
.findbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0}
.findbar button{padding:3px 9px;font-size:12px}
.findbar a{text-decoration:none}
.ed-meta input.find{width:210px}
.glist .gi .em{margin-top:1px}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200}
#toast.show{opacity:1}
@media (max-width:760px){
  .ed-body{grid-template-columns:1fr}
  .sidebar{border-right:none;border-bottom:1px solid var(--line);max-height:40vh}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print-root"></div>
<style id="pageStyle"></style>
<input type="file" id="importFile" accept="application/json" hidden>
<div id="toast"></div>

<script>
'use strict';
const STORE_KEY='storyM.v1';
const PAGE=200; /* 원고지 한 장 = 200자 */
const COLORS=['#7F77DD','#5DCAA5','#F0997B','#85B7EB','#FAC775','#ED93B1','#97C459','#B4B2A9'];
const app=document.getElementById('app');
const printRoot=document.getElementById('print-root');
const pageStyle=document.getElementById('pageStyle');

let db=load();
const ui={view:'home',storyId:null,sceneId:null,pane:'todo',a4memo:false,gview:'tree',gkind:'',find:''};

/* ---------- data ---------- */
function load(){try{const r=localStorage.getItem(STORE_KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.stories)){d.deleted=d.deleted||[];return d;}}}catch(e){}return{stories:[],deleted:[]};}
let saveT=null;
function save(now){
  const l=cur();if(l){l.updatedAt=Date.now();markDirty(l.id);}
  clearTimeout(saveT);
  const f=()=>localStorage.setItem(STORE_KEY,JSON.stringify(db));
  if(now)f();else saveT=setTimeout(f,250);
}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const newStory=(title='')=>({id:uid(),title,logline:'',targetPages:600,cardChars:500,scratch:'',readerUpto:0,scenes:[],guide:{born:null,cards:[]},createdAt:Date.now(),updatedAt:Date.now()});
const newScene=()=>({id:uid(),title:'',summary:'',memo:'',pages:10,tp:'',cards:[newCard()]});
const newCard=()=>({id:uid(),text:''});
/* 줄거리 카드 — 정해진 것 하나. parent로 나무를 만들고, 순서는 배열 순서 */
const STATES=['궁금함','가설','확정','사실'];
/* 2026-11-13부터: 카드는 "집필을 위한 아이디어·자료의 최소 단위"다. 종류(kind)와 채움(filled)을 가진다.
   예전의 상태(state)는 읽지 않는다 — ensure()가 한 번 옮긴다(궁금함→조사·비어 있음, 가설→구상·비어 있음, 확정→구상·채움, 사실→조사·채움) */
const KINDS=['자료','조사','구상','초고'];
const KIND_TIP={자료:'찾아 읽을 것',조사:'알아내야 할 것',구상:'내가 정해야 할 것',초고:'이미 쓴 글. 메모만 적고 본문은 데본씽크에 둡니다'};
const newGuide=(parent=null,kind='구상')=>({id:uid(),parent,text:'',kind:KINDS.includes(kind)?kind:'구상',filled:false,round:null,year:null,dt:'',sceneId:null,shelved:false,why:'',fold:false});
/* 생각 모으기의 바퀴 — 한 번 적고, 카드를 받고, 닫는다. 맨 끝 바퀴가 지금 쓰는 바퀴 */
const newRound=()=>({id:uid(),at:Date.now(),text:'',closed:false,got:0,asks:[]});
const rCur=l=>l.rounds[l.rounds.length-1];
const rNo=(l,r)=>l.rounds.indexOf(r)+1;
const rDate=r=>{const d=new Date(r.at);return `${d.getMonth()+1}월 ${d.getDate()}일`;};
const roundForNew=l=>l.rounds.length;
/* 옛 소설에 줄거리 칸과 타이핑 칸이 없으면 채운다 — 더하기만 하고 있는 것은 건드리지 않는다 */
function ensure(l){if(!l)return l;if(!l.guide||!Array.isArray(l.guide.cards))l.guide={born:(l.guide&&l.guide.born)||null,cards:[]};if(!Array.isArray(l.scenes))l.scenes=[];l.scenes.forEach(t=>{if(t.tp==null)t.tp='';});
  /* 예전의 생각 모으기 글(scratch)은 1차 바퀴가 된다. scratch 칸과 장면·토막은 지우지 않고 그대로 둔다 */
  if(!Array.isArray(l.rounds))l.rounds=[Object.assign(newRound(),{at:l.createdAt||Date.now(),text:l.scratch||''})];
  if(!l.rounds.length||l.rounds[l.rounds.length-1].closed)l.rounds.push(newRound());
  l.guide.cards.forEach(c=>{if(!KINDS.includes(c.kind)){c.kind=(c.state==='궁금함'||c.state==='사실')?'조사':'구상';if(c.filled==null)c.filled=(c.state==='확정'||c.state==='사실');}if(c.filled==null)c.filled=false;});
  return l;}
const cur=()=>ensure(db.stories.find(l=>l.id===ui.storyId));
const DIV_SRC='── .*? 정리에 보냄 ──';
const cleanScratch=s=>s.split('\n').filter(x=>!/^›/.test(x.trim())&&!/^──.*──$/.test(x.trim())).join('\n').replace(/\n{3,}/g,'\n\n').trim();
function scratchBatches(l){return (l.scratch||'').split(new RegExp(DIV_SRC)).map(cleanScratch);}
function unsentScratch(l){const b=scratchBatches(l);return b[b.length-1];}
function lastSentScratch(l){const b=scratchBatches(l);for(let i=b.length-2;i>=0;i--)if(b[i])return b[i];return '';}
function freshForPrompt(l){const u=unsentScratch(l);if(u)return{text:u,resend:false};return{text:lastSentScratch(l),resend:true};}
const stampNow=()=>{const n=new Date();return `${n.getMonth()+1}월 ${n.getDate()}일 ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;};
const hasContent=l=>l.scenes.some(t=>t.title.trim()||t.cards.some(c=>c.text.trim()));
const curScene=()=>{const l=cur();return l&&l.scenes.find(t=>t.id===ui.sceneId);};

function sample(){
  const l=newStory('겨울 호수');
  l.logline='얼어붙은 호수에서 아버지의 낚시 의자를 찾아낸 딸이, 그 의자를 집에 들이기까지의 하루.';
  l.rounds=[Object.assign(newRound(),{text:'아버지는 말이 없는 사람이었고, 호수는 아버지가 유일하게 오래 앉아 있던 곳이다.\n정윤은 아버지를 이해한 적이 없다고 생각한다. 의자에 앉는 순간 그게 처음으로 흔들린다.\n낚시 가게 주인이 하는 말이 이 소설의 반전이 될지, 그냥 지나가는 말이 될지 아직 모르겠다.',closed:true,got:6}),newRound()];
  const g=(text,kind,filled,parent,year)=>{const c=newGuide(parent?parent.id:null,kind);c.text=text;c.filled=!!filled;c.round=1;if(year)c.year=year;l.guide.cards.push(c);return c;};
  const root=g('정윤이 아버지의 낚시 의자를 집에 들이기까지의 하루','구상',true);
  g('의자는 아버지가 직접 만든 나무 접이식 의자다\n접었을 때 한 손에 들린다','구상',true,root);
  g('낚시 가게 주인이 아버지의 마지막 날에 대해 아는 것','구상',false,root);
  const ice=g('2월의 호수는 사람이 걸어 들어갈 만큼 어는가','조사',false,root);
  g('얼음낚시를 다룬 책이나 수기','자료',false,ice);
  g('호수에 간 아침 — 첫 장면을 써 둔 초고\n본문은 데본씽크에 있다','초고',false,root);
  return l;
}

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chars=t=>(t||'').replace(/\n/g,'').length;
const pagesOf=t=>chars(t)/PAGE;
const ownCards=t=>t.cards.filter(c=>!c.draft&&c.text.trim());
const cardChars=t=>ownCards(t).reduce((a,c)=>a+chars(c.text),0);
/* 초고 글자 수 — 타이핑 원고가 이어져 있으면 그 글이 실제다. 아니면 내 토막 */
const sceneChars=(t,l)=>{const r=tpRowFor(t,l);return r?chars(r.text):cardChars(t);};
const sceneEst=(t,l)=>sceneChars(t,l)/PAGE;
const allocated=l=>l.scenes.reduce((a,t)=>a+(+t.pages||0),0);
const storyEst=l=>l.scenes.reduce((a,t)=>a+sceneEst(t,l),0);
const col=i=>COLORS[i%COLORS.length];
function fmtPages(p){if(!p||p<=0)return'0매';if(p<1)return(Math.round(p*10)/10)+'매';return Math.round(p)+'매';}
function sceneStatus(l,t){
  const r=tpRowFor(t,l);
  if(r){const est=chars(r.text)/PAGE;const ok=t.pages>0&&est>=t.pages*0.8;return{label:'타이핑 · '+fmtPages(est)+(r.handed?' · 스크리브너':''),cls:ok?'st-done':'st-wip'};}
  const filled=t.cards.filter(c=>c.text.trim()).length;
  if(!filled)return t.memo.trim()?{label:'메모만',cls:'st-memo'}:{label:'뼈대만',cls:'st-empty'};
  if(t.cards.some(c=>c.draft&&c.text.trim()))return{label:'트리트먼트',cls:'st-wip'};
  const est=sceneEst(t);
  if(t.pages>0&&est>=t.pages*0.8)return{label:'내 것 · '+fmtPages(est),cls:'st-done'};
  return{label:'내 것 · '+fmtPages(est),cls:'st-wip'};
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function download(name,text,type='text/plain'){const b=new Blob([text],{type:type+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true;}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();return ok;}}
function autogrow(ta){ta.style.height='auto';ta.style.height=(ta.scrollHeight+2)+'px';}
const safeName=s=>(s||'storyM').replace(/[\\/:*?"<>|]+/g,'_').trim()||'storyM';
/* 독자가 읽은 데까지: 저장된 값이 없거나 범위를 벗어나면 카드가 있는 마지막 장면 */
function readerUpto(l){
  const n=l.scenes.length;if(!n)return 0;
  if(l.readerUpto>=1&&l.readerUpto<=n)return l.readerUpto;
  let last=0;l.scenes.forEach((t,i)=>{if(t.cards.some(c=>c.text.trim())||tpRowFor(t,l))last=i+1;});
  return last||n;
}

/* ---------- render ---------- */
function render(){
  if(ui.view==='home')renderHome();else renderEditor();
}
function homeMeta(l){ensure(l);const cs=gCards(l);const todo=cs.filter(c=>!c.filled).length;return `카드 ${cs.length}장${todo?` · 준비할 것 ${todo}장`:''} · 생각 ${l.rounds.length}차`;}
function renderHome(){
  const ls=[...db.stories].sort((a,b)=>b.updatedAt-a.updatedAt);
  app.innerHTML=`<div class="home">
    <h1>storyM</h1>
    <p class="lead">소설을 쓰려면 무엇을 준비해야 하는지 알아내고, 조사하고, 플롯을 궁리합니다. 생각을 적으면 카드가 되고, 카드를 채우는 일이 글쓰기의 시작입니다.</p>
    <div class="home-actions">
      <button class="primary" data-act="new">새 소설</button>
      <button data-act="import">JSON 불러오기</button>
      ${ls.length?'':'<button data-act="sample">예시 소설 만들기</button>'}
    </div>
    ${ls.length?`<div class="lect-grid">${ls.map(l=>`
      <div class="lect" data-act="open" data-id="${l.id}">
        <h3>${esc(l.title)||'<span class="muted">제목 없음</span>'}</h3>
        <div class="meta">${homeMeta(l)}</div>
        <div class="meta small">${l.logline?esc(l.logline)+' · ':''}수정 ${new Date(l.updatedAt).toLocaleDateString('ko-KR')}</div>
        <button class="ghost del" data-act="delete" data-id="${l.id}">삭제</button>
      </div>`).join('')}</div>`
    :`<div class="empty">아직 소설이 없습니다. 제목 하나만 정하고 시작해 보세요.</div>`}
    <div class="syncbox">${syncPanelHtml()}</div>
    <p class="muted small" style="margin-top:20px">자료는 이 브라우저 안에 저장되고, 로그인하면 수파베이스를 통해 다른 기기와 맞춰집니다. JSON 백업은 편집 화면의 내보내기에 있습니다.</p>
  </div>`;
}

  const l=cur();if(!l){ui.view='home';return renderHome();}
  if(!['scratch','todo','guide','find'].includes(ui.pane))ui.pane='todo';
  app.innerHTML=`<div class="editor">
    <div class="ed-head">
      <button class="ghost" data-act="home">← 목록</button>
      <input class="title" data-lf="title" value="${esc(l.title)}" placeholder="소설 제목">

        <div class="muted small" style="padding:0 10px 6px">카드마다 한 장(서랍 제외). 들고 다니며 채우거나 바닥에 늘어놓고 묶어 보는 용도입니다. 인쇄 창에서 용지 크기 A6, 방향 가로를 골라 주세요. PDF로 저장을 고르면 PDF가 됩니다.</div>
      </div></details>
      <details class="menu"><summary>내보내기 ▾</summary><div>
        <button data-act="copyMd">마크다운 복사</button>
        <button data-act="dlMd">마크다운 파일 저장</button>
        ${hasContent(l)?'<button data-act="dlOldMd">예전 장면·토막 마크다운 저장</button>':''}
        <div class="sep"></div>
        <button data-act="dlJson">JSON 백업 저장</button>
        <button data-act="dlJsonAs">JSON 백업을 다른 위치에 저장…</button>
        <div class="muted small" style="padding:4px 10px">처음 한 번 저장 위치를 고르면(앱 파일이 있는 폴더를 권합니다) 다음부터는 같은 파일에 바로 덮어씁니다. 크롬, 엣지에서 되고, 다른 브라우저는 다운로드 폴더에 저장됩니다.</div>
      </div></details>
      <details class="menu"><summary>설정 ▾</summary><div>

      </div></details>
    </div>
    <div class="ed-meta">
      <input class="logline" data-lf="logline" value="${esc(l.logline||'')}" placeholder="한 줄 요약: 이 소설은 누가 무엇을 하는 이야기인가">
      <input class="find" type="search" data-find="1" value="${esc(ui.find||'')}" placeholder="카드 찾기 ⏎" title="찾을 말을 넣고 ⏎. 카드와 생각 모으기에서 찾습니다">
    </div>
    <div class="ed-body">
      <div class="sidebar" id="side"></div>
      <div class="detail" id="detail"></div>
    </div>
  </div>`;
  renderDerived();renderDetail();
}
function markPanes(){renderDerived();}
/* 왼쪽 목록 — 생각 모으기 · 준비할 것 · 카드(종류별) · 서랍. 숫자가 바뀔 때마다 통째로 다시 그린다 */
function sideHtml(l){
  const k=gCounts(l);const r=rCur(l);const g=ui.pane==='guide';
  return `<div class="srow ${ui.pane==='scratch'?'sel':''}" data-act="scratch" title="떠오르는 생각과 플롯을 바퀴마다 적고, 카드를 제안받습니다"><span>생각 모으기</span><span class="c" style="color:var(--muted)">${l.rounds.length}차${chars(r.text)?` · ${chars(r.text)}자`:''}</span></div>
    <div class="srow ${ui.pane==='todo'?'sel':''}" data-act="todo" title="아직 채우지 않은 카드. 지금 준비해야 할 것"><span>준비할 것</span><span class="c">${k.todo||''}</span></div>
    <div class="srow ${g&&ui.gview!=='shelf'&&!ui.gkind?'sel':''}" data-act="guide" title="카드 전체의 나무"><span>카드</span><span class="c q">${k.n||''}</span></div>
    <div class="ksub">${KINDS.map(x=>`<button class="${g&&ui.gview!=='shelf'&&ui.gkind===x?'on':''}" data-act="gKind" data-k="${x}" title="${KIND_TIP[x]}">${x} ${k.kinds[x]||0}</button>`).join('')}</div>
    <div class="srow ${g&&ui.gview==='shelf'?'sel':''}" data-act="shelf" title="쓰지 않기로 한 카드"><span>서랍</span><span class="c" style="color:var(--muted)">${k.shelf||''}</span></div>`;
}
function renderDerived(){const l=cur();if(!l)return;const s=document.getElementById('side');if(s)s.innerHTML=sideHtml(l);}
function updateSendHint(){const l=cur();const h=document.getElementById('sendHint');if(!l||!h)return;const un=chars(unsentScratch(l));const ls=lastSentScratch(l);h.textContent=un?`보낼 새 생각 ${un}자`:ls?`새 생각 없음. 마지막에 보낸 생각(${chars(ls)}자)을 다시 담습니다.`:'적은 생각이 없습니다.';}
function renderScratch(){
  const l=cur();const d=document.getElementById('detail');if(!l||!d)return;
  const r=rCur(l);const olds=l.rounds.slice(0,-1).reverse();const n=gCards(l).filter(c=>gFirst(c)).length;
  d.innerHTML=`<div class="scratch">
    <div class="row"><div class="ttl" style="font-size:18px;font-weight:500">생각 모으기</div></div>
    <p class="muted small" style="margin:0 0 10px">이 소설에 대해 지금 떠오르는 것, 궁리하는 플롯을 형식 없이 적습니다. "카드 제안 프롬프트 복사"로 클로드에게 보내면, 이 생각으로 소설을 쓰려면 무엇을 준비해야 하는지를 카드로 제안받습니다. 받은 카드를 채우고, 타이핑에서 소설을 쓰고, 쓰면서 더 알게 된 것과 더 상세한 플롯을 다음 바퀴에 적습니다. 그러면 더 잔 카드가 제안됩니다.</p>
    ${r.asks&&r.asks.length?`<div class="asks"><div class="muted small">지난 바퀴에 클로드가 물은 것 (참고용. 클로드에게 다시 보내지 않습니다)</div><ul>${r.asks.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>`:''}
    <div class="round"><div class="rh"><b>${rNo(l,r)}차 · ${rDate(r)}</b><span class="muted small" id="roundCnt">${chars(r.text)}자</span></div>
      <textarea data-rf="text" data-id="${r.id}" placeholder="이 소설이 무엇에 관한 이야기인지, 인물, 떠오르는 장면, 플롯, 꼭 넣고 싶은 것, 아직 모르는 것...">${esc(r.text)}</textarea></div>
    <div class="bar"><button class="primary" data-act="rCopy">카드 제안 프롬프트 복사</button><button data-act="importOpen">클로드 답 가져오기</button><button data-act="rClose" title="카드를 받지 않고 이 바퀴를 닫고, 새 바퀴를 엽니다">이 바퀴 닫고 새 바퀴</button><span class="muted small">이번 바퀴의 생각과, 앞 바퀴의 생각, 이미 있는 카드 ${n}장의 목록을 함께 보냅니다.</span></div>

const gSiblings=(l,c)=>gCards(l).filter(x=>(x.parent||null)===(c.parent||null));

function gCounts(l){const cs=gCards(l);const kinds={};cs.forEach(c=>{kinds[c.kind]=(kinds[c.kind]||0)+1;});const todo=cs.filter(c=>!c.filled).length;return{todo,q:todo,unused:0,n:cs.length,shelf:gShelfRoots(l).length,kinds};}
/* 나이는 세는 나이(태어난 해를 한 살로). 주인공 생년(guide.born)이 있을 때만 */

const gDesc=(l,c)=>{const out=[];const walk=id=>(l.guide.cards||[]).filter(x=>x.parent===id).forEach(k=>{out.push(k);walk(k.id);});walk(c.id);return out;};
const gShelfParent=(l,c)=>{const p=c.parent?gById(l,c.parent):null;return p&&p.shelved?p:null;};
const gShelfRoots=l=>(l.guide.cards||[]).filter(c=>c.shelved&&!gShelfParent(l,c));
function gShelve(l,c,why){c.shelved=true;c.why=why||'';c.shelfAt=Date.now();gDesc(l,c).forEach(k=>{k.shelved=true;});}

const dtSearchUrl=c=>'x-devonthink://search?query='+encodeURIComponent(gFirst(c));

function findRounds(l,q){const ws=findWords(q);const out=[];if(!ws.length)return out;l.rounds.forEach((r,i)=>{(r.text||'').split('\n').forEach(line=>{const t=line.toLowerCase();if(line.trim()&&ws.every(w=>t.includes(w))&&out.length<12)out.push({no:i+1,line:line.trim()});});});return out;}

  const prev=l.rounds.slice(0,-1).filter(x=>cleanScratch(x.text||''));
  let budget=6000;const keep=[];for(let i=prev.length-1;i>=0;i--){const n=chars(prev[i].text);if(keep.length&&budget-n<0)break;keep.unshift(prev[i]);budget-=n;}
  const cutNote=keep.length<prev.length?`(더 앞의 ${prev.length-keep.length}개 바퀴는 길어서 뺐습니다. 그 내용은 "이미 있는 카드"에 남아 있습니다.)\n\n`:'';

const normKey=t=>String(t||'').toLowerCase().replace(/[\s.,·:;!?"'“”‘’()\[\]<>《》〈〉「」『』\-–—~…]/g,'');
function similar(a,b){a=normKey(a);b=normKey(b);if(!a||!b)return 0;if(a===b)return 1;if(a.length>=4&&b.length>=4&&(a.includes(b)||b.includes(a)))return .9;
  const bg=x=>{const o=new Set();for(let i=0;i<x.length-1;i++)o.add(x.slice(i,i+2));return o;};const A=bg(a),B=bg(b);if(!A.size||!B.size)return 0;let n=0;A.forEach(x=>{if(B.has(x))n++;});return n/(A.size+B.size-n);}
/* 클로드의 답 → 제안 카드와 물음. "- [종류] 첫 줄" 다음의 "풀이:"·"밑에:" 줄을 그 카드에 붙인다 */
function parseCards(text){
  const cards=[],asks=[];let c=null,inAsk=false;
  String(text||'').replace(/\r/g,'').split('\n').forEach(raw=>{
    const t=raw.replace(/\*\*/g,'').replace(/`/g,'').trim();if(!t)return;
    if(/^#{1,6}\s/.test(t)){inAsk=/물음|질문|제안/.test(t);c=null;return;}
    const m=t.match(/^(?:[-*•]|\d+[.)])?\s*\[\s*(자료|조사|구상|초고)\s*\]\s*(.+)$/);
    if(m){inAsk=false;c={kind:m[1],text:m[2].trim(),note:'',under:''};cards.push(c);return;}
    if(c){const u=t.match(/^(?:[-*•]\s*)?밑에\s*[:：]\s*(.+)$/);if(u){c.under=u[1].trim().replace(/^[■□]\s*/,'').replace(/^\[\s*(자료|조사|구상|초고)\s*\]\s*/,'');return;}
      const n=t.match(/^(?:[-*•]\s*)?풀이\s*[:：]\s*(.+)$/);if(n){c.note=(c.note?c.note+'\n':'')+n[1].trim();return;}}
    if(inAsk){const a=t.replace(/^(?:[-*•]|\d+[.)])\s*/,'');if(a)asks.push(a);}
  });
  return{cards,asks};
}
/* 있는 카드와 견준다 — 닮은 것(0.6 이상)은 표시하고 처음에는 받지 않는 쪽으로 둔다. 같은 답 안에서 겹치는 것은 뺀다 */
function planCards(l,parsed){
  const exist=(l.guide.cards||[]).filter(c=>gFirst(c));const out=[];
  parsed.cards.forEach(p=>{
    if(out.some(o=>similar(o.text,p.text)>=.9))return;
    let dup=null,sc=0;exist.forEach(c=>{const v=similar(p.text,gFirst(c));if(v>sc){sc=v;dup=c;}});
    let parent=null;if(p.under){let ps=0;gCards(l).forEach(c=>{const v=similar(p.under,gFirst(c));if(v>ps){ps=v;parent=c;}});if(ps<.7)parent=null;}
    out.push(Object.assign({},p,{dup:sc>=.6?dup:null,parent,on:sc<.6}));
  });
  return out;
}

const NOTE_TITLE=/(독자|질문|궁금|예측|일어날|헷갈|늘어진|여기까지|제안|빠지|빠진|보충|지적|피드백)/;
function parseStructure(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n');
  const out={title:'',logline:'',scenes:[],notes:[]};let t=null,mode='',para=[];
  const flush=()=>{if(t&&para.length){const s=para.join('\n').trim();if(s&&!/^\((토막|트리트먼트|대본) 없음\)$/.test(s)){const m=s.match(/^\(재료 부족[^)]*\)$/);if(m)t.short.push(s);else t.cards.push(s);}}para=[];};
  for(const raw of lines){
    const line=raw.replace(/\s+$/,'');
    const h=line.match(/^##\s+(.+)$/);
    if(h){flush();let title=h[1].trim();let pages=0;const m=title.match(/[(（]([^()（）]*)[)）]\s*$/);if(m){const mm=m[1].match(/(\d+)\s*매/);if(mm){pages=+mm[1];title=title.slice(0,m.index).trim();}}title=title.replace(/^\d+[.)]\s*/,'').replace(/\*\*/g,'').trim();
      t={title,pages,summary:'',memo:'',cards:[],short:[],note:/^(제안|순서 제안|조정 제안|매수 조정 제안)$/.test(title)||(!pages&&NOTE_TITLE.test(title))};out.scenes.push(t);mode='';continue;}
    const h1=line.match(/^#\s+(.+)$/);if(h1){if(!t)out.title=h1[1].replace(/\*\*/g,'').trim();continue;}
    if(!t){const lg=line.trim().match(/^\*{0,2}한 줄 요약\*{0,2}\s*[:：]\s*(.+)$/);if(lg)out.logline=lg[1].trim();continue;}
    if(line.startsWith('|')||/^(-{3,}|\*{3,})$/.test(line.trim()))continue;
    const ref=line.trim().match(/^\[기존\s*(\d+)\]$/);if(ref){flush();mode='';t.cards.push({ref:+ref[1]});continue;}
    if(/^>\s?/.test(line)){t.summary=(t.summary?t.summary+' ':'')+line.replace(/^>\s?/,'').trim();mode='';continue;}
    if(/^\*{0,2}메모\*{0,2}\s*[:：]/.test(line.trim())){flush();mode='memo';const rest=line.trim().replace(/^\*{0,2}메모\*{0,2}\s*[:：]\s*/,'');if(rest)t.memo+=rest.replace(/^[-*•·]\s*/,'· ')+'\n';continue;}
    if(mode==='memo'){if(!line.trim()){mode='';continue;}t.memo+=line.trim().replace(/^[-*•·]\s*/,'· ')+'\n';continue;}
    if(/^\(재료 부족[^)]*\)\s*$/.test(line.trim())){flush();t.short.push(line.trim());continue;}
    if(!line.trim()){flush();continue;}
    para.push(line.trim());
  }
  flush();
  out.scenes.forEach(x=>x.memo=x.memo.trim());
  out.notes=out.scenes.filter(x=>x.note).map(x=>({title:x.title,text:[x.summary,x.memo,...x.cards.filter(c=>typeof c==='string')].filter(Boolean).join('\n')}));

}
const normTitle=s=>String(s||'').toLowerCase().replace(/^\d+[.)]\s*/,'').replace(/[\s\p{P}\p{S}]/gu,'');
const memoLines=m=>(m||'').split('\n').map(x=>x.trim()).filter(Boolean);
const isReaderNote=n=>/(궁금|일어날|헷갈|늘어진|여기까지|독자)/.test(n.title);
function planImport(l,parsed){
  const plan={adds:[],news:[],notes:parsed.notes,title:(!l.title.trim()&&parsed.title)?parsed.title:'',logline:(!(l.logline||'').trim()&&parsed.logline)?parsed.logline:''};
  for(const p of parsed.scenes){
    const key=normTitle(p.title);
    const ex=key?l.scenes.find(t=>normTitle(t.title)===key):null;
    if(ex){
      const have=new Set(memoLines(ex.memo).map(x=>x.replace(/^[·\-•*]\s*/,'')));
      const newMemo=memoLines(p.memo).filter(x=>!have.has(x.replace(/^[·\-•*]\s*/,'')));
      const newCards=p.cards.filter(c=>typeof c==='string');
      plan.adds.push({scene:ex,p,cards:p.cards,newCards,refs:p.cards.some(c=>typeof c==='object'),fillSummary:!ex.summary.trim()&&!!p.summary,newMemo,short:p.short});
    }else plan.news.push(p);
  }
  return plan;
}
function applyImport(l,plan){
  if(plan.title)l.title=plan.title;
  if(plan.logline)l.logline=plan.logline;
  if(plan.notes.length){
    const reader=plan.notes.some(isReaderNote);
    const label=reader&&l.readerUpto?`${l.readerUpto}번째 장면까지 읽은 독자`:'클로드 제안';
    const block=plan.notes.map(n=>`› [${n.title}]\n`+n.text.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>'› '+x).join('\n')).join('\n\n');
    l.scratch=(l.scratch||'').replace(/\s+$/,'')+`\n\n── ${stampNow()} ${label} ──\n${block}\n\n`;}
  l.scenes=l.scenes.filter(t=>t.title.trim()||t.summary.trim()||t.memo.trim()||t.cards.some(c=>c.text.trim()));
  let first=null;
  for(const a of plan.adds){const t=a.scene;if(!l.scenes.includes(t))continue;
    if(a.fillSummary)t.summary=a.p.summary;
    if(a.newMemo.length)t.memo=[...memoLines(t.memo),...a.newMemo].join('\n');
    if(a.short.length)t.memo=[...memoLines(t.memo),...a.short.map(x=>'· '+x)].join('\n');
    const existing=t.cards.filter(c=>c.text.trim());
    if(a.refs){const used=new Set();const seq=[];for(const x of a.cards){if(typeof x==='object'){const c=existing[x.ref-1];if(c&&!used.has(c)){seq.push(c);used.add(c);}}else seq.push({id:uid(),text:x,draft:true});}existing.forEach(c=>{if(!used.has(c))seq.push(c);});t.cards=seq;}
    else{t.cards=existing;a.newCards.forEach(x=>t.cards.push({id:uid(),text:x,draft:true}));}
    if(!t.cards.length)t.cards.push(newCard());first=first||t;}
  for(const p of plan.news){const t=newScene();t.title=p.title;t.pages=p.pages||10;t.summary=p.summary;t.memo=[...memoLines(p.memo),...p.short.map(x=>'· '+x)].join('\n');t.cards=p.cards.filter(c=>typeof c==='string').map(x=>({id:uid(),text:x,draft:true}));if(!t.cards.length)t.cards=[newCard()];l.scenes.push(t);first=first||t;}
  return first;
}

/* ---------- backup to a chosen file ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('storyM.handles',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function hGet(k){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('h','readonly').objectStore('h').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}
async function hSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('h','readwrite').objectStore('h').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}

/* 넘치는 카드 처리: 본문이 카드에 안 들어가면 글자 배율을 0.04씩 0.72(약 9pt)까지 줄이고,
   그래도 안 들어가는 토막 카드는 자연스러운 경계(빈 줄 > 문장 끝 > 띄어쓰기)에서 둘로 나눠 "이어서" 카드를 만든다.
   화면에서 재지만 카드 크기(mm)와 글자(pt)가 모두 절대 단위라 인쇄와 같은 배치가 된다. */
function fitA6Cards(){
  const MIN=0.72,STEP=0.04,SLACK=2;
  const contentH=el=>{const r=document.createRange();r.selectNodeContents(el);return r.getBoundingClientRect().height;};
  const fits=el=>contentH(el)<=el.clientHeight-SLACK;
  printRoot.classList.add('measuring');
  const queue=[...printRoot.querySelectorAll('.pcard')];
  let guard=0;
  while(queue.length&&guard++<2000){
    const card=queue.shift();const pb=card.querySelector('.pb');const box=pb||card;
    let f=1;card.style.setProperty('--fs',f);
    while(!fits(box)&&f-STEP>=MIN-1e-9){f=+(f-STEP).toFixed(2);card.style.setProperty('--fs',f);}
    if(fits(box)||!pb)continue;
    const text=pb.textContent;const cut=splitPoint(text);
    if(cut<=0||cut>=text.length)continue;
    const next=card.cloneNode(true);
    pb.textContent=text.slice(0,cut).replace(/\s+$/,'');
    next.querySelector('.pb').textContent=text.slice(cut).replace(/^\s+/,'');
    const hs=next.querySelectorAll('.ph span');if(hs[1]&&!/이어서$/.test(hs[1].textContent))hs[1].textContent+=' · 이어서';
    card.after(next);
    queue.unshift(card,next);
  }
  let n=0;printRoot.querySelectorAll('.pcard .pf span:last-child').forEach(s=>{s.textContent=++n;});
  printRoot.classList.remove('measuring');
}
function splitPoint(text){
  const mid=text.length/2,win=text.length*0.3;
  const pats=[/\n\s*\n/g,/\n/g,/[.!?。]\s+/g,/\s+/g];
  for(const re of pats){
    let best=-1,m;
    while((m=re.exec(text))){const at=m.index+m[0].length;if(Math.abs(at-mid)<=win&&(best<0||Math.abs(at-mid)<Math.abs(best-mid)))best=at;}
    if(best>0&&best<text.length)return best;
  }
  return Math.floor(mid);
}

function setSyncMsg(m,err){sync.msg=m;sync.err=!!err;document.querySelectorAll('.syncstat').forEach(e=>{e.textContent=m;e.classList.toggle('err',!!err);});}
function fmtTime(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function markDirty(id){if(!id)return;sync.dirty.add(id);if(!sess)return;clearTimeout(sync.timer);sync.timer=setTimeout(flushSync,1500);}
async function pushStories(ids){
  const rows=[];for(const id of ids){const l=db.stories.find(x=>x.id===id);if(l)rows.push({id:l.id,user_id:sess.user,data:l,updated_at:l.updatedAt||Date.now(),deleted:false});else{const d=(db.deleted||[]).find(x=>x.id===id);if(d)rows.push({id,user_id:sess.user,data:{},updated_at:d.at,deleted:true});}}
  if(!rows.length)return;
  await rest(`/${SB_TABLE}?on_conflict=user_id,id`,{method:'POST',keepalive:true,headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});
}
async function flushSync(){
  if(!sess||sync.busy)return;const ids=[...sync.dirty];if(!ids.length)return;sync.dirty.clear();sync.busy=true;
  try{await pushStories(ids);sync.last=Date.now();setSyncMsg(`동기화됨 ${fmtTime(sync.last)}`);}
  catch(e){ids.forEach(i=>sync.dirty.add(i));setSyncMsg('보내기 실패: '+e.message,true);}
  finally{sync.busy=false;}
}
async function pullStories(force){
  if(!sess||sync.busy)return;if(!force&&Date.now()-sync.lastPull<10000)return;sync.busy=true;
  try{
    const rows=await rest(`/${SB_TABLE}?select=id,data,updated_at,deleted`);sync.lastPull=Date.now();
    let changed=false;const toPush=new Set();const seen=new Set();db.deleted=db.deleted||[];
    for(const r of rows){seen.add(r.id);const local=db.stories.find(x=>x.id===r.id);const tomb=db.deleted.find(d=>d.id===r.id);
      if(r.deleted){if(local){if((local.updatedAt||0)<=r.updated_at){db.stories=db.stories.filter(x=>x.id!==r.id);changed=true;}else toPush.add(r.id);}continue;}
      if(tomb){if(tomb.at>=r.updated_at){toPush.add(r.id);continue;}db.deleted=db.deleted.filter(d=>d.id!==r.id);}
      if(!r.data||!Array.isArray(r.data.scenes))continue;
      if(!local){db.stories.push(r.data);changed=true;}
      else if(r.updated_at>(local.updatedAt||0)){for(const k of Object.keys(local))delete local[k];Object.assign(local,r.data);changed=true;}
      else if(r.updated_at<(local.updatedAt||0))toPush.add(r.id);}
    for(const l of db.stories)if(!seen.has(l.id))toPush.add(l.id);
    for(const d of db.deleted)if(!seen.has(d.id))toPush.add(d.id);
    if(changed){localStorage.setItem(STORE_KEY,JSON.stringify(db));if(!document.querySelector('.modal-bg')){render();if(hashPending&&applyHash())hashPending=false;}}
    sync.busy=false;
    if(toPush.size){toPush.forEach(i=>sync.dirty.add(i));await flushSync();}
    else{sync.last=Date.now();setSyncMsg(`동기화됨 ${fmtTime(sync.last)}`);}
  }catch(e){setSyncMsg('받기 실패: '+e.message,true);}
  finally{sync.busy=false;}
}
