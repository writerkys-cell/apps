<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>storyM</title>
<style>
:root{
  --bg:#f6f5f0; --panel:#ffffff; --panel2:#f1efe8; --ink:#1f1f1d; --ink2:#5f5e5a; --muted:#8a8984;
  --line:#e2e0d8; --line2:#c9c7bf;
  --accent:#534ab7; --accent-bg:#eeedfe;
  --ok:#0f6e56; --ok-bg:#e1f5ee; --warn:#854f0b; --warn-bg:#faeeda; --bad:#a32d2d; --bad-bg:#fcebeb;
  --radius:8px;
  --font:-apple-system,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
button:hover{background:var(--panel2)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.primary:hover{background:#3a3a37}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--panel2)}
button.danger{color:var(--bad)}
input,textarea,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:6px 10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
textarea{resize:none;line-height:1.7}
.muted{color:var(--muted)}
.small{font-size:12px}
details.menu{position:relative}
details.menu>summary{list-style:none;cursor:pointer;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:6px 12px;user-select:none}
details.menu>summary::-webkit-details-marker{display:none}
details.menu>summary:hover{background:var(--panel2)}
details.menu>div{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:6px;min-width:220px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.08)}
details.menu>div button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:8px 10px;border-radius:6px}
details.menu>div button:hover{background:var(--panel2)}
details.menu>div .sep{border-top:1px solid var(--line);margin:6px 0}
details.menu>div label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;font-size:13px}
details.menu>div label input{width:72px;padding:3px 6px}

/* home */
.home{max-width:880px;margin:0 auto;padding:48px 24px}
.home h1{font-size:28px;font-weight:500;margin:0 0 6px;letter-spacing:-.01em}
.home .lead{color:var(--ink2);margin:0 0 28px}
.home-actions{display:flex;gap:8px;margin-bottom:24px}
.lect-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lect{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;position:relative}
.lect:hover{border-color:var(--line2)}
.lect h3{margin:0 0 6px;font-size:16px;font-weight:500}
.lect .meta{color:var(--ink2);font-size:13px}
.lect .del{position:absolute;top:10px;right:10px;opacity:0;font-size:12px}
.lect:hover .del{opacity:1}
.syncbox{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.syncbox h3{font-size:14px;font-weight:500;margin:0 0 8px}
.syncform{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.syncform input{width:200px}
.syncform.compact{flex-direction:column;align-items:stretch}
.syncform.compact input{width:100%}
.syncstat{font-size:12px;color:var(--muted);margin-top:6px}
.syncstat.err{color:var(--bad)}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:40px;text-align:center;color:var(--ink2)}

/* editor */
.editor{display:flex;flex-direction:column;height:100vh}
.ed-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.ed-head .title{font-size:17px;font-weight:500;border:1px solid transparent;background:transparent;min-width:260px;flex:1}
.ed-head .title:hover{border-color:var(--line2)}
.ed-head .title:focus{background:var(--panel)}
.ed-meta{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--ink2);flex-wrap:wrap}
.ed-meta label{display:flex;align-items:center;gap:6px}
.ed-meta input{padding:4px 8px;font-size:13px}
.ed-meta input.n{width:64px}
.ed-meta input.logline{flex:1;min-width:240px}
.ed-meta .spacer{flex:1}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.timebar{display:flex;gap:2px;height:8px;margin:10px 16px 0;border-radius:4px;overflow:hidden}
.timebar div{min-width:2px}
.timebar .rest{background:transparent;border:1px dashed var(--line2);border-radius:4px}
.ed-body{display:grid;grid-template-columns:300px minmax(0,1fr);flex:1;min-height:0}
.sidebar{overflow:auto;border-right:1px solid var(--line);padding:12px}
.sidebar .hd{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin:4px 6px 8px}
.trow{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-radius:var(--radius);cursor:pointer;border:1px solid transparent;margin-bottom:4px;background:var(--panel)}
.trow:hover{border-color:var(--line)}
.trow.sel{border-color:var(--line2);background:var(--panel2)}
.trow.dragover{border-top:2px solid var(--accent)}
.trow .dot{width:8px;height:8px;border-radius:2px;margin-top:6px;flex:none}
.trow .mins{color:var(--muted);font-size:12px;min-width:40px;margin-top:2px;text-align:right}
.trow .tt{flex:1;min-width:0}
.trow .tt .name{font-size:13px;line-height:1.4;word-break:break-word}
.trow .tt .name.ph{color:var(--muted)}
.trow .tt .st{font-size:11px;margin-top:2px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--line);margin-bottom:12px;background:var(--panel);font-size:13px}
.srow:hover{border-color:var(--line2)}
.srow.sel{background:var(--panel2);border-color:var(--line2)}
.srow .c{font-size:11px;color:var(--warn)}
.scratch textarea{width:100%;min-height:46vh;font-size:15px}
.scratch .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.scratch .bar .reader{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden}
.scratch .bar .reader button{border:none;border-radius:0}
.scratch .bar .reader select{border:none;border-left:1px solid var(--line2);border-radius:0;padding:6px 8px;max-width:220px;background:var(--panel2);font-size:13px}
.card.draft{border-left:3px solid #c9b8ff}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:11px;background:var(--accent-bg);color:var(--accent);margin-left:6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border-radius:12px;width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column;padding:18px 20px}
.modal h2{font-size:16px;font-weight:500;margin:0 0 6px}
.modal textarea{width:100%;min-height:180px;flex:none;font-size:13px}
.modal .prev{overflow:auto;flex:1;margin:12px 0;font-size:13px;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--panel2);min-height:56px}
.modal .prev li{margin:3px 0}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.st-empty{color:var(--muted)} .st-memo{color:var(--warn)} .st-wip{color:var(--accent)} .st-done{color:var(--ok)}
.detail{overflow:auto;padding:18px 24px 80px}
.detail .row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.detail .ttl{font-size:18px;font-weight:500;flex:1;min-width:0}
.detail .lbl{font-size:12px;color:var(--muted);margin:14px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.detail input.full{width:100%}
.detail textarea.memo{width:100%;min-height:64px;background:var(--panel2);border-color:transparent}
.detail textarea.memo:focus{background:var(--panel)}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 8px}
.card.over{border-color:#e9b56a}
.card textarea{width:100%;min-height:72px;border:none;padding:2px 0;font-size:15px;background:transparent}
.card textarea:focus{outline:none}
.card .ft{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.card .ft .tools{display:flex;gap:2px;opacity:0}
.card:hover .ft .tools,.card:focus-within .ft .tools{opacity:1}
.card .ft .tools button{padding:2px 7px;font-size:12px;border-color:transparent}
.card .ft .warn{color:var(--warn)}
.addcard{border:1px dashed var(--line2);background:transparent;color:var(--ink2);width:100%;padding:10px}
.detail .bottom{display:flex;justify-content:space-between;margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}
.nodetail{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;padding:40px}

/* print */
#print-root{display:none}
@media print{
  body>*:not(#print-root){display:none !important}
  #print-root{display:block}
  html,body{margin:0;padding:0;height:auto;background:#fff;color:#000}
}
/* A6 가로는 148×105mm. Safari는 @page를 무시하고 자기 기본 여백(약 12.7mm)을 쓰기도 하므로, 그 안(약 122×79mm)에도 들어가게 카드를 120×78mm로 잡는다. 1mm라도 넘치면 카드마다 빈 장이 끼어든다. */
/* --fs: 넘치는 카드만 인쇄 직전에 fitA6Cards()가 1 → 0.72까지 줄이는 글자 배율 */
.a6 .pcard{--fs:1;width:120mm;height:78mm;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;page-break-after:always;break-after:page;page-break-inside:avoid;break-inside:avoid;font-size:calc(12.5pt * var(--fs));line-height:1.55;color:#000}
#print-root.measuring{display:block;position:absolute;left:-10000px;top:0;width:148mm}
.a6 .pcard:last-child{page-break-after:auto;break-after:auto}
.a6 .ph{display:flex;justify-content:space-between;font-size:8.5pt;color:#666;border-bottom:.5pt solid #999;padding-bottom:1.5mm;margin-bottom:3mm}
.a6 .pb{flex:1;white-space:pre-wrap;word-break:keep-all;overflow:hidden}
.a6 .pf{display:flex;justify-content:space-between;align-items:flex-end;font-size:8pt;color:#777;margin-top:2mm}
.a6 .pf .m{white-space:pre-wrap;max-width:85%;font-size:8.5pt;color:#555}
.a6 .cover{justify-content:center;text-align:center}
.a6 .cover .k{font-size:9pt;color:#666;letter-spacing:.06em;margin-bottom:3mm}
.a6 .cover h2{font-size:calc(19pt * var(--fs));font-weight:600;margin:0 0 3mm;line-height:1.3;word-break:keep-all}
.a6 .cover p{font-size:calc(12pt * var(--fs));color:#333;margin:0;line-height:1.45}
.a6 .cover .m{font-size:calc(9pt * var(--fs));color:#555;white-space:pre-wrap;margin-top:5mm;text-align:left}
.a6 .cover .pf{position:absolute;left:0;right:0;bottom:0}
.a6 .pcard.cover{position:relative}
.a6 .title{justify-content:center;text-align:center}
.a6 .title h1{font-size:calc(22pt * var(--fs));font-weight:600;margin:0 0 4mm;line-height:1.3;word-break:keep-all}
.a6 .title p{margin:0;font-size:calc(10pt * var(--fs));color:#555}
.a6 .title p.lg{font-size:calc(11pt * var(--fs));color:#333;margin-bottom:3mm}
.a4{font-size:11pt;line-height:1.75;color:#000}
.a4 h1{font-size:20pt;font-weight:600;margin:0 0 2mm;line-height:1.3}
.a4 .meta{color:#555;font-size:10pt;margin-bottom:8mm}
.a4 .meta .lg{color:#222;font-size:11pt;margin-bottom:1mm}
.a4 h3{font-size:11pt;color:#444;margin:0 0 2mm;font-weight:600}
.a4 table{width:100%;border-collapse:collapse;font-size:10pt;margin-bottom:4mm}
.a4 th,.a4 td{border-bottom:.5pt solid #aaa;padding:1.6mm 2mm;text-align:left;vertical-align:top}
.a4 th{border-bottom:1pt solid #333;font-weight:600;color:#333}
.a4 td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.a4 .sec{display:grid;grid-template-columns:24mm minmax(0,1fr);column-gap:6mm;margin-top:9mm}
.a4 .sec .lt{font-size:9pt;color:#555;border-top:1pt solid #333;padding-top:2mm;line-height:1.5}
.a4 .sec .rt{border-top:1pt solid #333;padding-top:2mm;min-width:0}
.a4 .sec h2{font-size:14pt;font-weight:600;margin:0 0 1mm;line-height:1.3}
.a4 .sec .sum{color:#444;margin:0 0 3mm;font-size:10.5pt}
.a4 .sec .memo{font-size:9.5pt;color:#555;background:#f3f2ee;padding:2mm 3mm;margin:0 0 3mm;white-space:pre-wrap;border-left:1pt solid #999}
.a4 p{margin:0 0 3mm;white-space:pre-wrap;word-break:keep-all;page-break-inside:avoid;break-inside:avoid}
.a4 p.draft{color:#555}
.a4 .none{color:#888;font-style:italic}

/* 줄거리 — 정해진 것의 나무 */
.srow .c.q{color:var(--accent)}
.ghead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.ghead .ttl{font-size:18px;font-weight:500}
.ghead .gsw{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.ghead .gsw button{padding:3px 9px;font-size:12px}
.ghead .gsw button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ghead .gsw label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-left:8px}
.ghead .gsw input{width:64px;padding:3px 6px;font-size:12px}
.gtime{display:flex;flex-direction:column;gap:2px}
.gtime .gi .yr{flex:none;width:92px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;margin-top:1px}
.gtime .gi .yr b{color:var(--ink);font-weight:500}
.gshelf .gi{cursor:default;flex-wrap:wrap}
.gshelf .gi .why{flex-basis:100%;font-size:12px;color:var(--muted);padding-left:22px}
.gshelf .gi .tools{flex-basis:100%;display:flex;gap:6px;padding-left:22px}
.gshelf .gi .tools button{padding:2px 8px;font-size:12px}
.gtree{display:flex;flex-direction:column;gap:2px}
.gnode{margin-left:calc(var(--d,0)*22px)}
.grow{display:flex;align-items:flex-start;gap:6px;padding:6px 8px;border-radius:var(--radius);cursor:pointer;border:1px solid transparent}
.grow:hover{background:var(--panel)}
.grow.open{background:var(--panel);border-color:var(--line2);border-bottom-left-radius:0;border-bottom-right-radius:0}
.grow .fold{width:16px;flex:none;color:var(--muted);font-size:11px;text-align:center;margin-top:3px}
.grow .glyph{width:16px;flex:none;text-align:center;color:var(--muted);margin-top:1px;font-size:13px}
.grow .gt{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word}
.grow .gt.ph{color:var(--muted)}
.grow .gm{flex:none;font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap}
.grow .gm a{color:var(--accent);text-decoration:none;padding:0 2px}
.gnode.q .gt{color:var(--ink2)}
.gnode.q .glyph{color:var(--warn);font-weight:600}
.gnode.h .grow{border-left:2px dotted var(--line2);border-radius:0 var(--radius) var(--radius) 0}
.gnode.f .glyph{color:var(--ok);font-size:11px}
.gpanel{background:var(--panel);border:1px solid var(--line2);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:10px 12px;margin-bottom:6px}
.gpanel textarea{width:100%;min-height:56px;font-size:15px}
.gpanel .grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.gpanel .grid input,.gpanel .grid select{width:100%;padding:4px 8px;font-size:13px}
.gpanel .grid .with{display:flex;gap:6px;align-items:center}
.gpanel .grid .with input{flex:1}
.gpanel .grid .with a{text-decoration:none}
.gpanel .grid .with button{padding:4px 9px;font-size:12px;white-space:nowrap}
.gpanel .tools{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.gpanel .tools button{padding:3px 9px;font-size:12px}
.glist{display:flex;flex-direction:column;gap:4px}
.glist .gi{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;background:var(--panel2);border-radius:var(--radius);font-size:13px;cursor:pointer}
.glist .gi:hover{background:var(--panel);outline:1px solid var(--line)}
.glist .gi .glyph{flex:none;color:var(--muted);width:14px;text-align:center}
.glist .gi.q .glyph{color:var(--warn);font-weight:600}
.glist .gi .gt{flex:1;min-width:0;white-space:pre-wrap}
.glist .gi a{color:var(--accent);text-decoration:none;flex:none}
.tpinfo{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tpinfo button{padding:1px 7px;font-size:11px}
.tptext{white-space:pre-wrap;font-size:14px;line-height:1.8;background:var(--panel2);border-radius:var(--radius);padding:12px 14px;max-height:50vh;overflow:auto;margin-top:6px;word-break:keep-all}
.lbl button.small{padding:2px 8px;font-size:11px}
details.menu>div label input.wide{width:150px}

/* 카드 작업대 — 종류·채움·바퀴·찾기 (2026-11-13) */
.ed-body{grid-template-columns:232px minmax(0,1fr)}
.sidebar .srow{margin-bottom:6px}
.ksub{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px 2px}
.ksub button{padding:2px 8px;font-size:12px;border-color:var(--line);color:var(--ink2)}
.ksub button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kd{display:inline-block;flex:none;font-size:11px;padding:0 6px;border:1px solid var(--line2);border-radius:5px;color:var(--ink2);line-height:1.6;margin-top:1px;background:var(--panel)}
.em{display:inline-block;flex:none;font-size:11px;padding:0 6px;border-radius:5px;background:var(--warn-bg);color:var(--warn);line-height:1.7}
.round{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.round .rh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px}
.round .rh b{font-weight:500}
.scratch .round textarea{width:100%;min-height:30vh;font-size:15px;border:none;padding:2px 0;background:transparent}
.scratch .round textarea:focus{outline:none}
.scratch .round.old textarea{min-height:60px;font-size:14px;color:var(--ink2)}
details.rold{margin-bottom:6px}
details.rold>summary{cursor:pointer;font-size:13px;color:var(--ink2);padding:6px 4px}
.asks{font-size:13px;color:var(--ink2);margin:0 0 10px;padding:8px 12px;background:var(--panel2);border-radius:var(--radius)}
.asks ul{margin:4px 0 0;padding-left:18px}
.asks li{margin:2px 0}
.prop{display:flex;gap:8px;align-items:flex-start;padding:6px 2px;border-bottom:1px solid var(--line)}
.prop:last-child{border-bottom:none}
.prop input{margin-top:4px;flex:none}
.prop .pt{flex:1;min-width:0}
.findbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0}
.findbar button{padding:3px 9px;font-size:12px}
.findbar a{text-decoration:none}
.ed-meta input.find{width:210px}
.glist .gi .em{margin-top:1px}
/* 자료 링크 여러 개 · 이어진 카드 · 없던 말 */
.gpanel .grid{align-items:start}
.gpanel .grid>span{padding-top:5px}
.gpanel .srcs,.gpanel .lks{display:flex;flex-direction:column;gap:5px;min-width:0}
.gpanel .grid .with input.sn{flex:0 0 160px}
.gpanel .grid .with button.ghost{padding:2px 7px}
.lkl{display:flex;flex-wrap:wrap;gap:5px}
.lk{display:inline-flex;align-items:center;gap:2px;background:var(--panel2);border-radius:6px;padding:1px 2px 1px 8px;font-size:12px;color:var(--ink)}
.lk>span{cursor:pointer}
.lk.q>span{color:var(--ink2)}

<body>
<div id="app"></div>
<div id="print-root"></div>
<style id="pageStyle"></style>
<input type="file" id="importFile" accept="application/json" hidden>
<div id="toast"></div>

<script>
'use strict';
const STORE_KEY='storyM.v1';
const IDEA_IN_KEY='storyM.ideas.in'; /* 타이핑이 "아이디어 보내기"로 적어 두는 받은편지함. storyM이 가져가 아이디어로 만든다 */
const PAGE=200; /* 원고지 한 장 = 200자 */
const app=document.getElementById('app');
const printRoot=document.getElementById('print-root');
const pageStyle=document.getElementById('pageStyle');

let db=load();
const ui={view:'home',storyId:null,pane:'idea',cat:null,item:null,tfilter:0,itab:'new',find:'',cardOpen:null,cardAt:'',focusCard:false,tpShow:null,helpMode:null,ideaDraft:'',ideaLink:'',linkOn:false,homeStory:null,editOrig:null,dragId:null};

/* ---------- data ---------- */
function load(){try{const r=localStorage.getItem(STORE_KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.stories)){d.deleted=d.deleted||[];d.ideas=Array.isArray(d.ideas)?d.ideas:[];return d;}}}catch(e){}return{stories:[],deleted:[],ideas:[]};}
let saveT=null;
/* persist: 저장소에 쓰기만 한다(아이디어처럼 소설 줄과 따로 맞추는 것). save: 지금 소설을 고친 것으로 표시하고 쓴다 */
function persist(now){clearTimeout(saveT);const f=()=>localStorage.setItem(STORE_KEY,JSON.stringify(db));if(now)f();else saveT=setTimeout(f,250);}
function save(now){const l=cur();if(l){l.updatedAt=Date.now();markDirty(l.id);}persist(now);}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
/* 5판(2026-11-16): 소설 = 아이디어(db.ideas, 소설 줄과 따로 한 줄에 하나) → 정리 프롬프트 → 카테고리 › 항목 › 카드(guide.cats, guide.cards) = 매뉴얼.
   트리트먼트 자리는 연보(때가 붙은 사건 카드)와 중심 글(cores, 맨 끝이 지금 판)이 맡는다.
   4판까지의 것(guide.cards4, guide.cardsOld, treatments, rounds, scenes, scratch)은 지우지 않고 보관만 한다 */
const DEF_CATS=[['세팅',''],['캐릭터',''],['관계',''],['사건','event'],['주제',''],['모티프',''],['목소리',''],['자료','src'],['물음','ask']];
const DEF_WORDS={3:'터닝포인트',2:'놀라움/깨달음',1:'인상적'};
const STAR_NAME={3:'터닝포인트',2:'놀라움/깨달음',1:'인상적'};
const newCats=()=>DEF_CATS.map(([name,fixed])=>({id:uid(),name,fixed:fixed||'',items:[]}));
const newStory=(title='')=>({id:uid(),title,logline:'',scenes:[],rounds:[],treatments:[],misses:[],cores:[],guide:{born:null,cards:[],cats:newCats(),conf:{words:{...DEF_WORDS},batch:30},ideaNo:{},ideaSeq:0,v4:Date.now(),v5:Date.now(),moved4:'none'},createdAt:Date.now(),updatedAt:Date.now()});
/* 카드 — 문장 하나(또는 짧은 몇 문장). cats: 놓인 자리 여러 개 [{c:카테고리 id, i:항목 id 또는 null}]. stars 0~3. when: 때(사건 카드는 연보에 선다), tord: 연보 순서.
   srcs: 자료 링크, book: 이 대목이 나온 자료 카드, links: 이어진 카드, from: 출처 아이디어 id, tp: 타이핑 원고, hist: 고친 내역, draft: 클로드가 덧붙인 말이 있음,
   tpChanged: 원고를 쓴 뒤에 카드를 고친 때, kind: ''(매뉴얼 카드) · 'ask'(물음) · 'clash'(충돌), dropped: 버림 */
const newCard=(o)=>Object.assign({id:uid(),text:'',cats:[],stars:0,dropped:false,why:'',when:'',tord:0,srcs:[],dt:'',links:[],book:null,from:[],tp:'',hist:[],draft:false,tpChanged:0,kind:'',leads:[],at:Date.now()},o||{});
const newCore=(text='')=>({id:uid(),at:Date.now(),text});
const cCur=l=>l.cores.length?l.cores[l.cores.length-1]:null;
const coreText=l=>{const t=cCur(l);return t?(t.text||'').trim():'';};
const dateTxt=ts=>{const d=new Date(ts);return `${d.getMonth()+1}월 ${d.getDate()}일`;};
const cleanScratch=s=>String(s||'').split('\n').filter(x=>!/^›/.test(x.trim())&&!/^──.*──$/.test(x.trim())).join('\n').replace(/\n{3,}/g,'\n\n').trim();
const hasContent=l=>(l.scenes||[]).some(t=>(t.title||'').trim()||(t.cards||[]).some(c=>(c.text||'').trim()));
const old4Cards=l=>((l.guide&&l.guide.cards4)||[]).filter(c=>(c.text||'').trim());
const old4Rounds=l=>(l.rounds||[]).filter(r=>cleanScratch(r.text));
const hasOld4=l=>old4Cards(l).length>0||old4Rounds(l).length>0;
const hasOld=l=>hasOld4(l)||(l.treatments||[]).some(t=>(t.text||'').trim())||((l.guide.cardsOld||[]).length>0)||hasContent(l);
/* 옛 소설을 열 때 한 번 옮긴다 — 더하기만 하고 있는 것은 지우지 않는다 */
function ensure(l){if(!l)return l;
  if(!l.guide||!Array.isArray(l.guide.cards))l.guide={born:(l.guide&&l.guide.born)||null,cards:[]};
  if(!Array.isArray(l.scenes))l.scenes=[];
  if(!Array.isArray(l.rounds))l.rounds=(l.scratch||'').trim()?[{id:uid(),at:l.createdAt||Date.now(),text:l.scratch,closed:true,got:0,asks:[]}]:[];
  if(!Array.isArray(l.treatments))l.treatments=[];if(!Array.isArray(l.misses))l.misses=[];if(!Array.isArray(l.cores))l.cores=[];
  const g=l.guide;
  /* 3판까지의 카드는 cardsOld로(4판 때 하던 일), 4판 카드는 cards4로. 화면의 게시판은 비어서 시작한다 */
  if(!g.v4){g.cardsOld=(g.cardsOld||[]).concat(g.cards);g.cards=[];g.v4=Date.now();}
  if(!g.v5){g.cards4=(g.cards4||[]).concat(g.cards);g.cards=[];g.v5=Date.now();g.moved4=hasOld4(l)?'':'none';}
  if(!Array.isArray(g.cats)||!g.cats.length)g.cats=newCats();
  ['event','src','ask'].forEach(f=>{if(!g.cats.some(c=>c.fixed===f)){const d=DEF_CATS.find(x=>x[1]===f);g.cats.push({id:uid(),name:d[0],fixed:f,items:[]});}});
  g.cats.forEach(c=>{if(!Array.isArray(c.items))c.items=[];});
  if(!g.conf)g.conf={};if(!g.conf.words)g.conf.words={...DEF_WORDS};if(!(g.conf.batch>0))g.conf.batch=30;
  if(!g.ideaNo)g.ideaNo={};if(!g.ideaSeq)g.ideaSeq=0;if(g.moved4==null)g.moved4='none';
  g.cards.forEach(c=>{if(!Array.isArray(c.cats))c.cats=[];if(!Array.isArray(c.srcs))c.srcs=[];if(!Array.isArray(c.links))c.links=[];if(!Array.isArray(c.leads))c.leads=[];if(!Array.isArray(c.from))c.from=[];if(!Array.isArray(c.hist))c.hist=[];if(c.tp==null)c.tp='';if(c.when==null)c.when='';if(c.stars==null)c.stars=0;if(c.kind==null)c.kind='';});
  return l;}
const cur=()=>ensure(db.stories.find(l=>l.id===ui.storyId));

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chars=t=>(t||'').replace(/\n/g,'').length;
const oneLine=t=>String(t||'').replace(/\s*\n\s*/g,' ').trim();
function fmtPages(p){if(!p||p<=0)return'0매';if(p<1)return(Math.round(p*10)/10)+'매';return Math.round(p)+'매';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600);}
function download(name,text,type='text/plain'){const b=new Blob([text],{type:type+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true;}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();return ok;}}
function autogrow(ta){ta.style.height='auto';ta.style.height=(ta.scrollHeight+2)+'px';}
const safeName=s=>(s||'storyM').replace(/[\\/:*?"<>|]+/g,'_').trim()||'storyM';
const normKey=t=>String(t||'').toLowerCase().replace(/[\s.,·:;!?"'“”‘’()\[\]<>《》〈〉「」『』\-–—~…]/g,'');
function similar(a,b){a=normKey(a);b=normKey(b);if(!a||!b)return 0;if(a===b)return 1;if(a.length>=4&&b.length>=4&&(a.includes(b)||b.includes(a)))return .9;
  const bg=x=>{const o=new Set();for(let i=0;i<x.length-1;i++)o.add(x.slice(i,i+2));return o;};const A=bg(a),B=bg(b);if(!A.size||!B.size)return 0;let n=0;A.forEach(x=>{if(B.has(x))n++;});return n/(A.size+B.size-n);}
const fmtN=n=>Number(n).toLocaleString('ko-KR');
const maeTxt=n=>(n/200).toFixed(1)+'매';

/* ---------- 카테고리 · 항목 · 카드 ---------- */
const cats=l=>l.guide.cats;
const catBy=(l,id)=>cats(l).find(c=>c.id===id)||null;
const catFixed=(l,f)=>cats(l).find(c=>c.fixed===f);
const itemBy=(cat,id)=>(cat&&id)?(cat.items.find(i=>i.id===id)||null):null;
const inCat=(c,catId)=>(c.cats||[]).some(p=>p.c===catId);
const isEvent=(l,c)=>inCat(c,catFixed(l,'event').id);
const isSrcCard=(l,c)=>inCat(c,catFixed(l,'src').id);
const gById=(l,id)=>(l.guide&&l.guide.cards||[]).find(c=>c.id===id);
const liveCards=l=>l.guide.cards.filter(c=>!c.dropped);
const mCards=l=>liveCards(l).filter(c=>!c.kind);            /* 매뉴얼 카드 — 물음·충돌·버림 빼고 */
const askCards=l=>liveCards(l).filter(c=>c.kind==='ask');
const clashCards=l=>liveCards(l).filter(c=>c.kind==='clash');
const dropCards=l=>l.guide.cards.filter(c=>c.dropped);
const gFirst=c=>(c.text||'').split('\n')[0].trim();
const gRest=c=>(c.text||'').split('\n').slice(1).join('\n').trim();
const starTxt=n=>'★'.repeat(n||0);
const starHtml=c=>`<span class="star ${c.stars?'':'z'}" title="${c.stars?STAR_NAME[c.stars]:'별 없음 — 소설에 넣을지 아직 생각 중'}">${c.stars?starTxt(c.stars):'·'}</span>`;
function starWords(l){const w=(l&&l.guide&&l.guide.conf&&l.guide.conf.words)||DEF_WORDS;return{1:(w[1]||'').trim()||DEF_WORDS[1],2:(w[2]||'').trim()||DEF_WORDS[2],3:(w[3]||'').trim()||DEF_WORDS[3]};}
/* 아이디어 글에 적힌 별 낱말 가운데 가장 높은 별. "놀라움/깨달음"은 "놀라움"이나 "깨달음" 하나만 있어도 된다 */
function wordStars(l,text){const w=starWords(l);const t=String(text||'');for(const n of [3,2,1]){if(w[n].split('/').map(x=>x.trim()).filter(Boolean).some(x=>t.includes(x)))return n;}return 0;}
const placeTxt=(l,c,sep)=>(c.cats||[]).map(p=>{const ct=catBy(l,p.c);if(!ct)return '';const it=itemBy(ct,p.i);return ct.name+(it?(sep||' > ')+it.name:'');}).filter(Boolean).join(' ; ');
const cardsAt=(l,catId,itemId)=>mCards(l).filter(c=>(c.cats||[]).some(p=>p.c===catId&&(p.i||null)===(itemId||null)));
const loose=l=>mCards(l).filter(c=>!(c.cats||[]).some(p=>catBy(l,p.c)));
const byStars=(l,cs)=>cs.slice().sort((a,b)=>(b.stars||0)-(a.stars||0)||l.guide.cards.indexOf(a)-l.guide.cards.indexOf(b));
function place(c,catId,itemId){c.cats=c.cats||[];if(!c.cats.some(p=>p.c===catId&&(p.i||null)===(itemId||null)))c.cats.push({c:catId,i:itemId||null});}
function findItem(cat,name){name=String(name||'').trim();if(!name)return null;return cat.items.find(i=>i.name===name)||null;}
function addItem(cat,name){const it={id:uid(),name:String(name||'').trim(),born:null};cat.items.push(it);return it;}
/* 연보 — 사건 카테고리의 카드 가운데 때가 적힌 것을 tord 순서로. 때는 아무 글이나 되고, 연도가 들어 있으면 나이를 셈한다 */
const yearOf=s=>{const m=String(s||'').match(/(\d{3,4})\s*년/)||String(s||'').match(/(?:^|\D)(\d{4})(?:\D|$)/);return m?+m[1]:null;};
const hasWhen=c=>{const w=(c.when||'').trim();return !!w&&w!=='?';};
const timeCards=l=>mCards(l).filter(c=>isEvent(l,c)&&hasWhen(c)).sort((a,b)=>(a.tord||0)-(b.tord||0)||l.guide.cards.indexOf(a)-l.guide.cards.indexOf(b));
function tRenum(arr){arr.forEach((c,i)=>{c.tord=i+1;});}
/* 새로 때가 붙은 사건을 연보에 세운다 — 같은 때의 묶음 뒤, 없으면 연도 순서, 그것도 없으면 맨 끝 */
function tPlace(l,c){const arr=timeCards(l).filter(x=>x!==c&&x.tord>0); /* 아직 순서를 받지 않은 카드(tord 0)는 제 차례에 세운다 */let at=arr.length;const w=(c.when||'').trim();let j=-1;arr.forEach((x,i)=>{if((x.when||'').trim()===w)j=i;});
  if(j>=0)at=j+1;else{const y=yearOf(w);if(y!=null){let k=-1;arr.forEach((x,i)=>{const xy=yearOf(x.when);if(xy!=null&&xy<=y)k=i;});if(k>=0)at=k+1;else{const f=arr.findIndex(x=>yearOf(x.when)!=null);if(f>=0)at=f;}}}
  arr.splice(at,0,c);tRenum(arr);}
function tTouch(l,c){if(!isEvent(l,c)||!hasWhen(c))return;const same=timeCards(l).some(x=>x!==c&&x.when.trim()===c.when.trim());if(!c.tord||same)tPlace(l,c);}
const ageOf=(born,y)=>y-born+1; /* 세는 나이(태어난 해를 한 살로) — 4판과 같다 */
const bornItems=l=>{const out=[];cats(l).forEach(ct=>ct.items.forEach(it=>{if(it.born)out.push({cat:ct,it});}));return out;};
function agesTxt(l,c){const y=yearOf(c.when);if(y==null)return '';const out=[];const seen=new Set();
  const add=it=>{if(it&&it.born&&!seen.has(it.id)){seen.add(it.id);out.push(`${it.name} ${ageOf(it.born,y)}살`);}};
  (c.cats||[]).forEach(p=>add(itemBy(catBy(l,p.c),p.i)));const sel=l.guide.ageOf;if(sel)cats(l).forEach(ct=>add(itemBy(ct,sel)));return out.join(' · ');}
/* 자료 링크 — 카드 한 장에 여러 개(srcs: [{u,n}]). dt는 첫 링크 */
const isWeb=u=>/^https?:/i.test(String(u||'').trim());
const tgt=u=>isWeb(u)?' target="_blank" rel="noopener"':'';
const openTip=u=>isWeb(u)?'새 탭에서 열기':'데본씽크에서 열기';
const srcSync=c=>{c.srcs=c.srcs||[];c.dt=((c.srcs.find(x=>(x.u||'').trim())||{u:''}).u||'').trim();};
const srcN=c=>(c.srcs||[]).filter(x=>(x.u||'').trim()).length;
const linkBase=u=>String(u||'').trim().split('?')[0].split('#')[0];
function addSrc(c,u,n){u=String(u||'').trim();if(!u)return;c.srcs=c.srcs||[];if(!c.srcs.some(x=>(x.u||'').trim()===u))c.srcs.push({u,n:n||''});srcSync(c);}
/* 대목 카드의 자료 링크가 자료 카드의 링크와 같은 항목(쪽 번호만 다름)이면 그 자료 카드에 잇는다 */
function autoBook(l,c){if(c.book||isSrcCard(l,c)||c.kind)return;const bs=(c.srcs||[]).map(x=>linkBase(x.u)).filter(Boolean);if(!bs.length)return;
  const b=mCards(l).find(x=>x!==c&&isSrcCard(l,x)&&(x.srcs||[]).some(y=>bs.includes(linkBase(y.u))));if(b)c.book=b.id;}
const excerptsOf=(l,c)=>mCards(l).filter(x=>x.book===c.id);
/* 이어진 카드 — 한쪽에만 적고(links) 양쪽에서 보인다 */
function gLinks(l,c){const ids=new Set(c.links||[]);(l.guide.cards||[]).forEach(x=>{if(x!==c&&(x.links||[]).includes(c.id))ids.add(x.id);});ids.delete(c.id);return [...ids].map(id=>gById(l,id)).filter(Boolean);}
function gUnlink(a,b){a.links=(a.links||[]).filter(x=>x!==b.id);b.links=(b.links||[]).filter(x=>x!==a.id);}
function gLink(l,a,b){if(!a||!b||a===b)return;if(!gLinks(l,a).includes(b)){a.links=a.links||[];a.links.push(b.id);}}
function gDrop(c,why){c.dropped=true;c.why=why||'';c.dropAt=Date.now();}
/* 자료 찾기 — 검색어 창을 띄운다. 처음엔 카드 첫 줄, 다음부터는 그 카드에서 마지막으로 찾은 말(c.dtq) */
function dtFind(l,c){const q=prompt('데본씽크에서 찾을 말',c.dtq||gFirst(c));if(q===null)return;const t=q.trim();if(!t)return;
  if(c.dtq!==t){c.dtq=t;save();}
  const a=document.createElement('a');a.href='x-devonthink://search?query='+encodeURIComponent(t);document.body.appendChild(a);a.click();a.remove();}
const gAddr=(l,c)=>location.href.split('#')[0]+'#소설='+encodeURIComponent(l.id)+'&카드='+encodeURIComponent(c.id);

/* ---------- 아이디어 — 소설 줄과 따로, 한 줄에 하나. 새것(new) → 보냄(sent) → 정리됨(done) ---------- */
const ideasOf=(l,st)=>db.ideas.filter(i=>i.story_id===l.id&&!i.deleted&&(!st||i.state===st)).sort((a,b)=>a.created_at-b.created_at);
const ideaById=id=>db.ideas.find(i=>i.id===id);
function newIdea(storyId,text,o){const i=Object.assign({id:uid(),story_id:storyId,text:String(text||'').trim(),src_link:'',ms_link:'',origin:'mac',state:'new',meta:{},created_at:Date.now(),updated_at:Date.now(),deleted:false},o||{});i._d=1;db.ideas.push(i);return i;}

  let n=0;arr.forEach(x=>{if(!x||!String(x.text||'').trim()||!x.story_id)return;if(x.id&&ideaById(x.id))return;if(!db.stories.some(s=>s.id===x.story_id))return;

function counts(l){const cs=mCards(l);let tpn=0;cs.forEach(c=>{if(tpRowFor(c,l))tpn++;});return{n:cs.length,tp:tpn,ni:ideasOf(l,'new').length,si:ideasOf(l,'sent').length,ev:timeCards(l).length,ask:askCards(l).length,clash:clashCards(l).length,drop:dropCards(l).length};}
function tpTotal(l){const seen=new Set();let n=0,hit=0;mCards(l).forEach(c=>{const r=tpRowFor(c,l);if(r&&!seen.has(r.id)){seen.add(r.id);hit++;n+=chars(r.text);}});return{n,hit};}
function tpSum(l,cs){const seen=new Set();let n=0,hit=0;cs.forEach(c=>{const r=tpRowFor(c,l);if(r&&!seen.has(r.id)){seen.add(r.id);hit++;n+=chars(r.text);}});return{n,hit};}

      ${ask||src?'':`<span>나온 자료</span><select data-gf="book" data-id="${c.id}" title="이 대목이 어느 책·자료에서 왔는지. 자료 카테고리의 카드 가운데서 고릅니다">${`<option value="">(없음)</option>`+books.map(b=>`<option value="${b.id}" ${c.book===b.id?'selected':''}>${esc(gFirst(b).slice(0,50))}</option>`).join('')}</select>`}
      ${src?`<span>나온 대목</span><div class="lks">${exs.length?`<div class="lkl">${exs.map(x=>`<span class="lk"><span data-act="gGo" data-id="${x.id}" title="이 카드 열기">${esc(gFirst(x).slice(0,40))}</span></span>`).join('')}</div>`:'<span class="muted small" style="padding-top:5px">이 자료에서 나온 대목 카드가 아직 없습니다. 대목 카드의 "나온 자료"에서 이 카드를 고르면 여기에 보입니다.</span>'}</div>`:''}
      <span>이어진 카드</span><div class="lks">${linkRowsHtml(l,c)}<div class="with"><input data-lkq="${c.id}" placeholder="이을 카드를 말로 찾기" autocomplete="off"></div><div class="lkres" id="lkres-${c.id}"></div></div>
      ${ask?'':`<span>타이핑 원고</span><div class="tpbox"><div class="with"><input data-gf="tp" data-id="${c.id}" value="${esc(c.tp||'')}" placeholder="타이핑 원고 주소나 원고 id. 비워 두면 작품 이름·원고 이름이 소설 제목·카드 첫 줄과 같은 것을 찾습니다"><span id="tpgo-${c.id}">${tpLinkHtml(c,l)}</span></div><div class="tpinfo" id="tpi-${c.id}">${tpInfoHtml(l,c)}</div><div id="tpx-${c.id}">${tpTextHtml(l,c)}</div></div>`}
      ${froms.length?`<span>출처 아이디어</span><details class="from"><summary class="small" style="cursor:pointer;padding-top:5px">아이디어 ${froms.length}개 — 원래 적은 문장 보기</summary>${froms.map(i=>`<div>${l.guide.ideaNo[i.id]?'#'+l.guide.ideaNo[i.id]+' ':''}${esc(i.text)}</div>`).join('')}</details>`:''}
      ${(c.hist||[]).length?`<span>고친 내역</span><details class="hist"><summary class="small" style="cursor:pointer;padding-top:5px">${c.hist.length}번 고침 — 예전 글 보기</summary>${c.hist.slice().reverse().map(h=>`<div><span class="muted">${fmtWhen(h.at)}까지</span> ${esc(h.text)}</div>`).join('')}</details>`:''}
    </div>
    ${ask?'':helpBarHtml(c)}
    <div class="tools">${at==='time'?`<button data-act="tUp" data-id="${c.id}" title="연보에서 한 칸 앞으로">↑</button><button data-act="tDown" data-id="${c.id}" title="연보에서 한 칸 뒤로">↓</button>`:''}<button data-act="gAddr" data-id="${c.id}" title="타이핑 원고의 '카드 링크 넣기'나 데본씽크 항목의 URL 칸에 붙여 두면 거기서 이 카드로 옵니다">주소 복사</button>${ask?`<button data-act="askDone" data-id="${c.id}" title="이 물음이 풀렸습니다. 버린 카드로 옮깁니다">풀렸음</button>`:`<button data-act="cDrop" data-id="${c.id}" title="이 카드를 쓰지 않기로 합니다. 지우지 않고 버린 카드에 둡니다">버림</button>`}<button class="danger" data-act="gDel" data-id="${c.id}">지우기</button></div>
  </div>`;
}
/* 목록 줄 — 찾기 · 먼저 할 일 · 버린 카드에서 함께 쓴다 */
function cItemHtml(l,c,o){o=o||{};const r=tpRowFor(c,l);const pt=placeTxt(l,c,' › ');
  return `<div class="gi ${gCls(l,c)}" data-act="gGo" data-id="${c.id}" title="카드 열기">${c.kind==='ask'?'<span class="glyph" style="color:var(--warn);font-weight:600">?</span>':starHtml(c)}<span class="gt">${esc(gFirst(c))||'빈 카드'}${gRest(c)?`<div class="muted small">${esc(gRest(c))}</div>`:''}${pt?`<div class="muted small">${esc(pt)}</div>`:''}${o.sub||''}</span>${r?`<span class="muted small" style="flex:none" title="${tpState(r)}">${gGlyph(l,c)} ${fmtN(chars(r.text))}자</span>`:''}${c.dt?`<a href="${esc(c.dt)}"${tgt(c.dt)} title="${openTip(c.dt)}">↗</a>`:''}${o.tail||''}</div>`;}

/* ---------- 게시판 — 카테고리 › 항목 › 카드 ---------- */
function renderBoard(){
  const l=cur();const d=document.getElementById('detail');if(!l||!d)return;const k=counts(l);const only=ui.cat?catBy(l,ui.cat):null;if(ui.cat&&!only)ui.cat=null;
  const tt=tpTotal(l);
  const secMae=cs=>{const t=tpSum(l,cs);return t.hit?` <span class="muted" title="이어진 타이핑 원고 ${t.hit}개 · ${fmtN(t.n)}자">· 타이핑 ${maeTxt(t.n)}</span>`:'';};
  const catHtml=ct=>{
    if(ct.fixed==='ask'){const as=askCards(l);return `<div class="gsec cat"><span><b>${esc(ct.name)}</b> <span class="muted">${as.length||''}</span></span><button data-act="addAsk" title="물음 카드를 하나 만듭니다">+ 물음</button></div><div class="gtree">${as.map(c=>cRowHtml(l,c,ct.id+'|',{places:true})).join('')||'<div class="muted small gnone">물음이 없습니다.</div>'}</div>`;}
    const all=mCards(l).filter(c=>inCat(c,ct.id));const top=byStars(l,cardsAt(l,ct.id,null));
    let h=`<div class="gsec cat"><span><b>${esc(ct.name)}</b> <span class="muted">${all.length||''}</span>${secMae(all)}${ct.fixed==='event'?' <span class="muted">· 때를 적으면 연보에 섭니다</span>':ct.fixed==='src'?' <span class="muted">· 책·기사 같은 자료 하나마다 카드 하나</span>':''}</span><span><button data-act="addItem" data-cat="${ct.id}" title="이 카테고리에 항목을 하나 만듭니다">+ 항목</button> <button data-act="addCard" data-cat="${ct.id}" data-item="" title="이 카테고리에 카드를 하나 만듭니다">+ 카드</button></span></div>`;
    if(top.length||!ct.items.length)h+=`<div class="gtree">${top.map(c=>cRowHtml(l,c,ct.id+'|',{when:ct.fixed==='event'})).join('')||'<div class="muted small gnone">이 카테고리의 카드가 아직 없습니다.</div>'}</div>`;
    ct.items.forEach(it=>{const cs=byStars(l,cardsAt(l,ct.id,it.id));
      h+=`<div class="gsec item"><span><b data-act="itemGo" data-cat="${ct.id}" data-item="${it.id}" title="이 항목을 한 편의 글로 읽기">${esc(it.name)}</b> <span class="muted">${cs.length||''}${it.born?` · ${it.born}년생`:''}</span>${secMae(cs)}</span><span><button data-act="itemGo" data-cat="${ct.id}" data-item="${it.id}">읽기</button> <button data-act="addCard" data-cat="${ct.id}" data-item="${it.id}" title="이 항목에 카드를 하나 만듭니다">+ 카드</button></span></div><div class="gtree bitem">${cs.map(c=>cRowHtml(l,c,ct.id+'|'+it.id,{when:ct.fixed==='event'})).join('')||'<div class="muted small gnone">이 항목의 카드가 아직 없습니다.</div>'}</div>`;});
    return h;};
  const ls=only?[]:loose(l);
  d.innerHTML=`<div class="ghead"><div class="ttl">${only?esc(only.name):'게시판'} <span class="muted small" style="font-weight:400">${k.n?`모두 ${k.n}장${k.tp?` · 타이핑 원고 이어짐 ${k.tp}장 · <b title="이어진 타이핑 원고의 글자 수를 모두 더해 200으로 나눈 원고지 매수 · ${fmtN(tt.n)}자">전체 ${maeTxt(tt.n)}</b>`:''}`:''}</span></div><div class="gsw"><button data-act="pane" data-p="cats">카테고리 다듬기</button></div></div>
    <p class="muted small" style="margin:0 0 12px">카테고리 › 항목 › 카드로 쌓이는 소설의 매뉴얼입니다. 카드 한 장은 문장 하나이고, 여러 항목에 함께 놓일 수 있습니다. 카드를 누르면 별, 자리, 자료, 타이핑 원고를 고칩니다. 항목 이름을 누르면 그 항목을 한 편의 글로 읽습니다.</p>
    ${(only?[only]:cats(l)).map(catHtml).join('')}
    ${ls.length?`<div class="gsec cat"><span><b>분류 없음</b> <span class="muted">${ls.length} · 아직 어느 카테고리에도 놓이지 않은 카드</span></span></div><div class="gtree">${byStars(l,ls).map(c=>cRowHtml(l,c,'|')).join('')}</div>`:''}
    <button class="addcard" data-act="addCard" data-cat="${only?only.id:''}" data-item="" style="margin-top:18px">+ 카드 추가</button>`;
}
/* 항목 읽기 — 그 항목의 카드 문장을 이어 한 편의 글로. 매뉴얼의 한 쪽 */
function renderRead(){
  const l=cur();const d=document.getElementById('detail');if(!l||!d)return;const ct=catBy(l,ui.cat);const it=itemBy(ct,ui.item);
  if(!ct||!it){ui.pane='board';return renderBoard();}
  const cs=byStars(l,cardsAt(l,ct.id,it.id));const as=askCards(l).filter(c=>(c.cats||[]).some(p=>p.c===ct.id&&p.i===it.id));
  d.innerHTML=`<div class="ghead"><div class="ttl">${esc(ct.name)} › ${esc(it.name)} <span class="muted small" style="font-weight:400">카드 ${cs.length}장${it.born?` · ${it.born}년생`:''}</span></div><div class="gsw"><button data-act="catGo" data-id="${ct.id}">← ${esc(ct.name)}</button><button data-act="readCopy" title="이 쪽의 글을 복사합니다">글 복사</button><button data-act="addCard" data-cat="${ct.id}" data-item="${it.id}">+ 카드</button></div></div>
    <p class="muted small" style="margin:0 0 14px">이 항목의 카드를 별이 많은 것부터 이어 놓았습니다. 문장을 누르면 그 카드가 열립니다.</p>
    <div class="read">${cs.map(c=>`<span class="s" data-act="gGo" data-id="${c.id}" title="${esc(placeTxt(l,c,' › '))}${hasWhen(c)?' · '+esc(c.when):''}">${esc(oneLine(c.text))}</span>${c.stars||c.dt?`<sup>${starTxt(c.stars)}${c.dt?`<a href="${esc(c.dt)}"${tgt(c.dt)} title="${openTip(c.dt)}">↗</a>`:''}</sup>`:''} `).join('')||'<span class="muted">이 항목의 카드가 아직 없습니다.</span>'}</div>
    ${as.length?`<div class="muted small" style="margin:22px 0 6px">이 항목에 남은 물음 ${as.length}</div><div class="glist">${as.map(c=>cItemHtml(l,c)).join('')}</div>`:''}`;
}

/* ---------- 연보와 중심 글 ---------- */
function renderTime(){
  const l=cur();const d=document.getElementById('detail');if(!l||!d)return;const all=timeCards(l);const f=ui.tfilter||0;const cs=all.filter(c=>(c.stars||0)>=f);
  const t=cCur(l);const olds=l.cores.slice(0,-1).reverse();const ev=catFixed(l,'event');const none=mCards(l).filter(c=>isEvent(l,c)&&!hasWhen(c));const bi=bornItems(l);
  const fb=(n,label,tip)=>`<button class="${f===n?'on':''}" data-act="tFilter" data-n="${n}" title="${tip}">${label}</button>`;
  let last=null;
  const rows=cs.map(c=>{const w=c.when.trim();const first=w!==last;last=w;const ag=agesTxt(l,c);
    return `<div class="trw" data-tid="${c.id}"><span class="wh" draggable="true" data-tid="${c.id}" title="끌어서 순서를 바꿉니다">${first?esc(w):''}${ag?`<span class="ag">${esc(ag)}</span>`:''}</span>${cRowHtml(l,c,'time')}</div>`;}).join('');
  d.innerHTML=`<div class="ghead"><div class="ttl">연보 <span class="muted small" style="font-weight:400">${all.length?`사건 ${all.length}${f?` 가운데 ${cs.length}`:''}`:''}</span></div>
      <div class="gsw">${fb(0,'전체','모든 사건')}${fb(2,'★★까지','터닝포인트와 놀라움/깨달음 — 더 촘촘한 줄거리')}${fb(3,'★★★만','터닝포인트만 — 이야기의 뼈대')}
      ${bi.length?`<label title="고른 인물의 나이를 연도가 적힌 사건마다 보입니다(세는 나이). 태어난 해는 카테고리 다듬기에서 항목마다 적습니다">나이 <select data-gb="ageOf" style="width:auto;padding:3px 6px;font-size:12px"><option value="">(사건에 놓인 인물만)</option>${bi.map(x=>`<option value="${x.it.id}" ${l.guide.ageOf===x.it.id?'selected':''}>${esc(x.it.name)}</option>`).join('')}</select></label>`:''}</div></div>
    <div class="core"><div class="lbl" style="margin-top:0"><span>중심 글 — 이 소설이 무엇에 대한 이야기인지 서너 문장으로 <span id="coreCnt">${t&&t.text.trim()?`· ${l.cores.length}판 · ${dateTxt(t.at)}`:''}</span></span></div>
      <textarea data-core="text" placeholder="예: 전쟁 전의 아름다움을 기억하는 사람이 전쟁 뒤를 어떻게 사는가.">${esc(t?t.text:'')}</textarea>
      ${olds.length?`<details class="rold"><summary>지난 판 ${olds.length}</summary>${olds.map(o=>`<div class="round old"><div class="rh"><b>${l.cores.indexOf(o)+1}판 · ${dateTxt(o.at)}</b><button data-act="coreRestore" data-id="${o.id}" style="padding:1px 8px;font-size:11px" title="이 판의 글을 새 판으로 복사합니다">되살리기</button></div><div style="white-space:pre-wrap;font-size:14px;color:var(--ink2)">${esc(o.text)}</div></div>`).join('')}</details>`:''}</div>
    <p class="muted small" style="margin:14px 0 10px">사건 카테고리의 카드 가운데 때가 적힌 것을 이야기 속 세계에서 일어난 순서로 봅니다. 소설에서 서술하는 순서가 아닙니다. 때는 "전쟁 전", "전쟁 3년째"처럼 느슨해도 되고, 순서는 왼쪽의 때를 끌어 옮기거나 카드의 ↑↓로 맞춥니다.</p>
    <div class="bar" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px"><button data-act="addEvent">+ 사건 카드</button><button data-act="checkCopy" ${all.length?'':'disabled'} title="중심 글과 연보를 보내, 어긋난 곳과 빈 구간을 목록으로 받습니다. 고쳐 쓰는 것은 작가가 합니다">연보 점검 프롬프트 복사</button><button data-act="checkImport">점검 답 가져오기</button></div>
    <div class="gtree tl">${rows||`<div class="muted small gnone">${all.length?'이 별의 사건이 없습니다.':'연보가 비어 있습니다. 사건 카드를 만들고 때를 적으면 여기에 섭니다. 아이디어를 정리받으면 클로드가 사건을 연보 줄로 제안합니다.'}</div>`}</div>
    ${none.length&&!f?`<div class="muted small" style="margin:18px 0 6px">때가 없는 사건 카드 ${none.length}장 — 때를 적으면 연보에 섭니다</div><div class="gtree">${none.map(c=>cRowHtml(l,c,ev.id+'|')).join('')}</div>`:''}`;
}

/* ---------- 먼저 할 일 · 물음과 충돌 · 버린 카드 ---------- */
function renderTodo(){
  const l=cur();const d=document.getElementById('detail');if(!l||!d)return;
  const cs=mCards(l).filter(c=>c.stars>0&&!isSrcCard(l,c)).map(c=>{const r=tpRowFor(c,l);return{c,n:r?chars(r.text):0,r};}).sort((a,b)=>b.c.stars-a.c.stars||a.n-b.n||l.guide.cards.indexOf(a.c)-l.guide.cards.indexOf(b.c));
  const hd=[3,2,1].map(s=>{const x=cs.filter(o=>o.c.stars===s);return x.length?`<span><span class="star">${starTxt(s)}</span> ${STAR_NAME[s]} ${x.length}장 중 ${x.filter(o=>o.n>0).length}장 씀</span>`:'';}).join('');
  d.innerHTML=`<div class="todo"><div class="ghead"><div class="ttl">먼저 할 일</div></div>
    <p class="muted small" style="margin:0 0 10px">별이 붙은 카드를 별이 많은 것부터, 그 안에서는 아직 타이핑과 잇지 않았거나 글자 수가 적은 것부터 봅니다. ${tpConf.on?'':'타이핑 읽기가 꺼져 있어 글자 수를 알 수 없습니다(설정).'}</p>
    <div class="hd3">${hd||'<span class="muted">별이 붙은 카드가 아직 없습니다. 카드를 열어 별을 고르면 여기에 옵니다.</span>'}</div>
    <div class="glist">${cs.map(o=>cItemHtml(l,o.c,{tail:o.r?'':'<span class="muted small" style="flex:none">아직 안 씀</span>'})).join('')}</div></div>`;
}
/* 충돌 — 한쪽을 고르려면 버릴 카드의 "이 카드를 버림"을 누른다. 새 아이디어 하나에서 카드가 여럿 나왔을 수 있어 카드마다 고른다 */
const clashKids=(l,c)=>{const x=c.clash||{};return x.idea?l.guide.cards.filter(k=>!k.kind&&!k.dropped&&k.id!==x.card&&(k.from||[]).includes(x.idea)):[];};
function clashHtml(l,c){const x=c.clash||{};const card=x.card?gById(l,x.card):null;const ks=clashKids(l,c);
  const one=(k,lab)=>`<div class="sd"><span class="k">${lab}${k.stars?' · '+starTxt(k.stars):''}${placeTxt(l,k,' › ')?' · '+esc(placeTxt(l,k,' › ')):''}${k.dropped?' · 버림':''}</span><span style="display:flex;gap:8px;align-items:flex-start"><span data-act="gGo" data-id="${k.id}" style="cursor:pointer;flex:1" title="이 카드 열기">${esc(k.text)}</span>${k.dropped?'':`<button data-act="clashDrop" data-id="${c.id}" data-c="${k.id}" style="padding:1px 8px;font-size:11px;flex:none" title="이 카드를 버린 카드로 옮기고(다른 쪽을 따름) 충돌 표시를 지웁니다">이 카드를 버림</button>`}</span></div>`;
  return `<div class="clash"><div><b style="font-weight:500">어긋남</b> ${esc(c.text)}</div>
    ${card?one(card,'이미 있는 카드'):`<div class="sd"><span class="k">이미 있는 카드 (찾지 못함)</span>${esc(x.cardText||'')}</div>`}

/* ---------- 찾기 — 위의 찾기 칸, 또는 타이핑에서 #소설제목=…&찾기=… 로 온다. 카드, 항목, 아이디어, 중심 글에서 찾는다 ---------- */
function findWords(q){return String(q||'').toLowerCase().split(/\s+/).filter(Boolean);}
function findCards(l,q){const ws=findWords(q);if(!ws.length)return[];return (l.guide.cards||[]).filter(c=>{const t=((c.text||'')+' '+(c.when||'')).toLowerCase();return ws.every(w=>t.includes(w));});}
function findLines(text,q,max){const ws=findWords(q);const out=[];if(!ws.length)return out;String(text||'').split('\n').forEach(line=>{const t=line.toLowerCase();if(line.trim()&&ws.every(w=>t.includes(w))&&out.length<max)out.push(line.trim());});return out;}
function findItems(l,q){const ws=findWords(q);const out=[];if(!ws.length)return out;cats(l).forEach(ct=>{if(ws.every(w=>ct.name.toLowerCase().includes(w)))out.push({ct,it:null});ct.items.forEach(it=>{if(ws.every(w=>it.name.toLowerCase().includes(w)))out.push({ct,it});});});return out;}
/* 찾았지만 카드가 없던 말 — 타이핑에서 '카드 찾기'로 왔거나 찾기 칸에서 ⏎로 찾았는데 맞는 카드가 없던 말을 모아 둔다. 그 말이 든 카드가 생기면 저절로 빠진다 */
function missLog(l,q){q=String(q||'').trim().slice(0,60);if(!l||!q)return;if(findCards(l,q).some(c=>!c.dropped)||findItems(l,q).length)return;
  l.misses=l.misses||[];const k=normKey(q);const m=l.misses.find(x=>normKey(x.q)===k);if(m){m.n=(m.n||1)+1;m.at=Date.now();}else l.misses.push({q,at:Date.now(),n:1});save();}
const missLive=l=>(l.misses||[]).filter(m=>!findCards(l,m.q).some(c=>!c.dropped)&&!findItems(l,m.q).length);
function renderFind(){
  const l=cur();const d=document.getElementById('detail');if(!l||!d)return;const q=(ui.find||'').trim();
  const all=q?findCards(l,q):[];const live=all.filter(c=>!c.dropped&&c.kind!=='clash'),dr=all.filter(c=>c.dropped);const its=q?findItems(l,q):[];
  const ws=findWords(q);const ids=q?ideasOf(l).filter(i=>i.state!=='done'&&ws.every(w=>(i.text||'').toLowerCase().includes(w))).slice(0,12):[];const ts=q?findLines(coreText(l),q,6):[];
  d.innerHTML=`<div class="ghead"><div class="ttl">찾기 <span class="muted small" style="font-weight:400">${q?`"${esc(q)}" · 카드 ${live.length}장${its.length?` · 항목 ${its.length}`:''}`:''}</span></div></div>
    ${!q?`<div class="empty">위의 "찾기" 칸에 찾을 말을 넣고 ⏎를 누르세요.<br>타이핑의 "카드 찾기"로 오면 고른 말이 여기에 들어옵니다.</div>`:`
    ${its.length?`<div class="muted small" style="margin:0 0 6px">카테고리와 항목 — 누르면 그 쪽을 읽습니다</div><div class="glist" style="margin-bottom:14px">${its.map(x=>`<div class="gi" ${x.it?`data-act="itemGo" data-cat="${x.ct.id}" data-item="${x.it.id}"`:`data-act="catGo" data-id="${x.ct.id}"`}><span class="glyph" style="width:auto">${x.it?'항목':'카테고리'}</span><span class="gt">${esc(x.ct.name)}${x.it?' › '+esc(x.it.name):''}<div class="muted small">카드 ${x.it?cardsAt(l,x.ct.id,x.it.id).length:mCards(l).filter(c=>inCat(c,x.ct.id)).length}장</div></span></div>`).join('')}</div>`:''}
    <div class="glist">${live.map(c=>cItemHtml(l,c)).join('')||`<div class="muted small" style="padding:8px">"${esc(q)}"이(가) 든 카드가 없습니다. 아직 준비하지 않은 자리입니다.</div>`}</div>
    <div class="findbar"><button data-act="findIdea" title="이 말을 입력창에 넣습니다. 이어서 적고 저장하면 아이디어가 됩니다">이 말로 아이디어 적기</button><button data-act="findNew" title="이 말을 글로 하는 카드를 바로 만듭니다(분류 없음)">+ 이 말로 카드 만들기</button><a href="${esc('x-devonthink://search?query='+encodeURIComponent(q))}" title="이 말로 데본씽크를 검색합니다"><button type="button">데본씽크에서 찾기 ↗</button></a></div>

app.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='ideaIn'){ui.ideaDraft=el.value;autogrow(el);return;}
  if(el.id==='ideaLink'){ui.ideaLink=el.value;return;}
  const l=cur();if(!l)return;
  if(el.dataset.lf){const k=el.dataset.lf;l[k]=el.value;save();if(k==='title'){clearTimeout(tp.titleT);tp.titleT=setTimeout(()=>tpLoad(l,true).then(()=>tpPaint(l)),800);}return;}
  if(el.dataset.find){ui.find=el.value;if(ui.pane==='find')renderFind();return;}

/* ---------- 연보 점검 — 클로드는 어긋난 곳과 빈 곳을 목록으로만 준다. 고쳐 쓰는 것은 작가가 한다 ---------- */
function checkPrompt(l){
  const core=coreText(l);const s3=mCards(l).filter(c=>c.stars===3&&!(isEvent(l,c)&&hasWhen(c)));
  return `아래는 제가 쓰려는 소설의 중심 글과 연보입니다. 연보는 이야기 속 세계에서 일어난 순서로 늘어놓은 사건입니다(소설에서 서술하는 순서가 아닙니다). 연보를 점검해 주세요.

고쳐 쓰지 마시고, 제가 고칠 곳을 목록으로만 알려 주세요. 고쳐 쓰는 것은 제가 제 말로 합니다.

소설 제목: ${l.title||'(미정)'}
한 줄 요약: ${l.logline||'(미정)'}

- 사건을 지어내지 마세요. 소설 문장을 쓰지 마세요.
- 꼭 짚어야 할 것만, 열 개 안쪽으로. 문제가 없으면 "점검 | 없음"이라고만 적습니다.

답은 아래 형식의 줄만, 앞뒤 설명 없이 적어 주세요.

점검 | 어긋남 | 무엇이 문제인지 한 줄 | 사건: 관련된 사건의 글
점검 | 빈 구간 | 무엇이 문제인지 한 줄
점검 | 이어지지 않음 | 무엇이 문제인지 한 줄 | 사건: 관련된 사건의 글
점검 | 중심 글 | 무엇이 문제인지 한 줄

---
중심 글:

${core||'(아직 없음)'}

연보:

${timeBlock(l)||'(아직 없음)'}
${s3.length?`\n---\n연보에 없는 ★★★ 카드:\n\n${s3.map(c=>`- ${oneLine(c.text)}${placeTxt(l,c)?' — '+placeTxt(l,c):''}`).join('\n')}\n`:''}`;
}
function parseCheck(text){const out=[];String(text||'').replace(/\r/g,'').split('\n').forEach(raw=>{const t=raw.replace(/\*\*/g,'').replace(/`/g,'').trim().replace(/^(?:[-*•]|\d+[.)])\s+/,'');if(!t)return;const f=t.split('|').map(x=>x.trim());if(!/^(점검|물음)$/.test(f[0])||f.length<2)return;if(f[1]==='없음')return;
  let ev='';const body=f.slice(1);const m=(body[body.length-1]||'').match(/^사건\s*[:：]\s*(.+)$/);if(m){ev=m[1].trim();body.pop();}
  const kind=body.length>1?body[0]:'';const note=(body.length>1?body.slice(1):body).join(' | ').trim();if(note)out.push({kind,note,ev});});return out;}

    <textarea id="importText" placeholder="점검 | 어긋남 | 무엇이 문제인지 | 사건: 관련된 사건의 글"></textarea>
    <div class="prev" id="importPrev"><span class="muted">붙여 넣으면 무엇이 들어오는지 여기에 보입니다.</span></div>
    <div class="acts"><button data-m="cancel">취소</button><button class="primary" data-m="apply" id="importApply" disabled>물음으로 받기</button></div></div>`;
  document.body.appendChild(bg);const ta=bg.querySelector('#importText');ta.focus();let plan=null;
  ta.addEventListener('input',()=>{const ps=parseCheck(ta.value);const pv=bg.querySelector('#importPrev');
    if(!ps.length){pv.innerHTML='<span class="muted">"점검 | …"처럼 적힌 줄을 찾지 못했습니다.</span>';plan=null;bg.querySelector('#importApply').disabled=true;return;}

    bg.querySelector('#importApply').disabled=false;});
  bg.addEventListener('change',e=>{const el=e.target;if(plan&&el.dataset&&el.dataset.i!=null)plan[+el.dataset.i].on=el.checked;});
  bg.addEventListener('click',e=>{if(e.target===bg)return;const b=e.target.closest('[data-m]');if(!b)return;if(b.dataset.m==='cancel'){bg.remove();return;}if(!plan)return;
    let n=0;plan.filter(p=>p.on).forEach(p=>{const c=newCard({kind:'ask',text:p.text});place(c,ev.id,null);if(p.card)c.links=[p.card.id];l.guide.cards.push(c);n++;});

const paras=t=>{t=String(t||'').trim();if(!t)return[];const ps=t.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);return ps.length>1?ps:t.split('\n').map(x=>x.trim()).filter(Boolean);};
function tpRow4(l,c){if(!tpConf.on||tp.story!==l.id)return null;const id=tpId(c.tp);if(id)return tp.rows.get(id)||null;const wt=(l.title||'').trim(),tt=gFirst(c);if(!wt||!tt)return null;for(const r of tp.rows.values())if((r.work_title||'').trim()===wt&&(r.title||'').trim()===tt)return r;return null;}
function old4Plan(l){const g=l.guide;const out=[];const all=g.cards4||[];

  old4Cards(l).forEach(c=>{if(movedCard.has(c.id))return;const p=c.parent?all.find(x=>x.id===c.parent):null;const what=[c.kind==='src'?'자료 카드':'집필 카드',c.shelved?'서랍':''].filter(Boolean).join(' · ');
    const srcs=(c.srcs||[]).filter(x=>(x.u||'').trim()).map(x=>({u:x.u.trim(),n:x.n||''}));if(!srcs.length&&(c.dt||'').trim())srcs.push({u:c.dt.trim(),n:''});

    l.guide.moved4=Date.now();save(true);ideaFlushSoon();bg.remove();ui.pane='idea';ui.itab='new';renderDetail();
    toast(`아이디어 ${n}개로 옮겼습니다. "정리 프롬프트 복사"로 ${l.guide.conf.batch}개씩 보내 정리받으세요.`);});
}

function leadsHtml(c){return (c.leads||[]).map(x=>{const d=new Date(x.at||Date.now());return `<div class="lead"><div class="lh"><span>클로드가 찾은 것 · ${esc(x.title||'답')} · ${d.getMonth()+1}월 ${d.getDate()}일 (확인 전. 맞는 것은 아이디어로 직접 옮겨 적으세요)</span><button data-act="gLeadDel" data-id="${c.id}" data-lid="${x.id}" title="이 글을 지웁니다">✕</button></div><div class="lb">${linkify(x.text)}</div></div>`;}).join('');}

/* 카드별 도움의 답 → 절마다 글 줄(실마리)과 카드 줄. "- [자료] 첫 줄" 아래의 "풀이:"·"주소:"는 그 카드에 붙는다 */
const URL_RE=/https?:\/\/[^\s<)\]]+/g;
function parseHelp(text){
  const secs=[];let sec={title:'',lines:[],cards:[]};secs.push(sec);let c=null;
  String(text||'').replace(/\r/g,'').split('\n').forEach(raw=>{
    const t=raw.replace(/\*\*/g,'').replace(/`/g,'').trim();if(!t||/^---+$/.test(t))return;
    if(/^#{1,6}\s/.test(t)){sec={title:t.replace(/^#+\s*/,'').trim(),lines:[],cards:[]};secs.push(sec);c=null;return;}
    const m=t.match(/^(?:[-*•]|\d+[.)])?\s*\[\s*(자료|조사)\s*\]\s*(.+)$/);
    if(m){c={kind:m[1],text:m[2].trim(),note:'',urls:[]};sec.cards.push(c);return;}
    if(c){const n=t.match(/^(?:[-*•]\s*)?풀이\s*[:：]\s*(.+)$/);if(n){c.note=(c.note?c.note+'\n':'')+n[1].trim();return;}
      const a=t.match(/^(?:[-*•]\s*)?(?:주소|출처|링크)\s*[:：]\s*(.+)$/);if(a){(a[1].match(URL_RE)||[]).forEach(u=>c.urls.push(u));if(!(a[1].match(URL_RE)||[]).length)c.note=(c.note?c.note+'\n':'')+a[1].trim();return;}
      if(/^\s/.test(raw)){c.note=(c.note?c.note+'\n':'')+t;return;}}
    c=null;if(t==='없음'||t==='- 없음')return;sec.lines.push(/^(?:[-*•]|\d+[.)])\s/.test(t)?t.replace(/^(?:[-*•]|\d+[.)])\s*/,'- '):t);
  });
  return secs.filter(x=>x.lines.length||x.cards.length);
}
function planHelp(l,target,secs){
  const exist=(l.guide.cards||[]).filter(c=>c!==target&&gFirst(c));const cards=[];
  secs.forEach(sc=>sc.cards.forEach(p=>{
    if(cards.some(o=>similar(o.text,p.text)>=.9))return;
    let dup=null,v0=0;exist.forEach(c=>{const v=similar(p.text,gFirst(c));if(v>v0){v0=v;dup=c;}});
    cards.push(Object.assign({},p,{sec:sc.title,dup:v0>=.6?dup:null,on:v0<.6}));
  }));
  const lead=secs.filter(sc=>sc.lines.length).map(sc=>(sc.title?`【${sc.title}】\n`:'')+sc.lines.join('\n')).join('\n\n');
  const urls=[];(lead.match(URL_RE)||[]).forEach(u=>{u=u.replace(/[.,;]+$/,'');if(!urls.includes(u))urls.push(u);});
  return{cards,lead,urls:urls.slice(0,10)};
}

    <textarea id="importText" placeholder="## 알아낸 것&#10;- 사실 하나 (출처: 주소)&#10;&#10;## 더 읽어 볼 자료&#10;- [자료] 제목 — 저자, 펴낸 해&#10;  주소: ..."></textarea>
    <div class="prev" id="importPrev"><span class="muted">붙여 넣으면 무엇이 들어오는지 여기에 보입니다.</span></div>
    <div class="acts"><span class="muted small" id="importCnt" style="margin-right:auto;align-self:center"></span><button data-m="cancel">취소</button><button class="primary" data-m="apply" id="importApply" disabled>가져오기</button></div></div>`;

  const preview=()=>{

    if(!secs.length){pv.innerHTML='<span class="muted">가져올 것을 찾지 못했습니다. 클로드의 답 전체를 붙여 넣어 보세요.</span>';plan=null;count();return;}
    plan=planHelp(l,target,secs);
    pv.innerHTML=(plan.lead?`<div class="muted small">이 카드에 "확인 전"으로 붙는 글${plan.urls.length?` · 주소 ${plan.urls.length}개는 자료 링크 줄에도 "확인 전"으로 쌓입니다`:''}</div><div style="white-space:pre-wrap;word-break:break-word;margin:4px 0 12px">${linkify(plan.lead)}</div>`:'')
      +plan.cards.map((p,i)=>`<label class="prop"><input type="checkbox" data-i="${i}" ${p.on?'checked':''}><span class="kd">${esc(p.kind)}</span><span class="pt">${esc(p.text)}${p.note?`<div class="muted small">${esc(p.note)}</div>`:''}${p.urls.length?`<div class="muted small">${linkify(p.urls.join(' '))}</div>`:''}<div class="muted small">↳ ${p.kind==='자료'?'자료 카테고리의 카드로, 이 카드와 이어집니다':'물음 카드로, 이 카드와 이어집니다'}</div>${p.dup?`<div class="small" style="color:var(--warn)">비슷한 카드 있음: ${esc(gFirst(p.dup))}${p.dup.dropped?' (버림)':''}</div>`:''}</span></label>`).join('');
    count();
  };
  ta.addEventListener('input',preview);
  bg.addEventListener('change',e=>{const el=e.target;if(el.dataset&&el.dataset.i!=null&&plan){plan.cards[+el.dataset.i].on=el.checked;count();}});
  bg.addEventListener('click',e=>{
    if(e.target===bg)return;
    const b=e.target.closest('[data-m]');if(!b)return;

    if(!plan)return;
    let made=0;const srcCat=catFixed(l,'src');
    plan.cards.filter(p=>p.on).forEach(p=>{
      const c=p.kind==='자료'?newCard({text:p.text+(p.note?'\n'+p.note:''),draft:true}):newCard({kind:'ask',text:p.text+(p.note?'\n'+p.note:''),cats:(target.cats||[]).map(x=>({...x}))});
      if(p.kind==='자료')place(c,srcCat.id,null);
      p.urls.forEach(u=>addSrc(c,u,'확인 전'));c.links=[target.id];
      l.guide.cards.push(c);made++;
    });
    if(plan.lead){
      target.leads=(target.leads||[]).concat([{id:uid(),at:Date.now(),title:mode?HELP[mode].name:'클로드의 답',text:plan.lead}]);
      plan.urls.forEach(u=>addSrc(target,u,'확인 전'));
    }
    save(true);bg.remove();renderDetail();
    toast(`${plan.lead?'찾은 글을 카드에 붙였습니다. ':''}${made?`카드 ${made}장을 만들어 이었습니다. `:''}확인하는 일이 남았습니다.`);
  });
}

/* ---------- backup to a chosen file ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('storyM.handles',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function hGet(k){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('h','readonly').objectStore('h').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}
async function hSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('h','readwrite').objectStore('h').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}
async function saveJsonBackup(l,chooseNew){
  const name=safeName(l.title)+'.storyM.json';/* 아이디어는 소설 줄과 따로 있으므로 백업에 함께 넣는다 */
  const text=JSON.stringify(Object.assign({},l,{ideas:ideasOf(l).map(i=>{const o={...i};delete o._d;return o;})}),null,2);
  if(typeof window.showSaveFilePicker!=='function'){download(name,text,'application/json');toast('다운로드 폴더에 저장했습니다. 이 브라우저는 저장 위치 지정을 지원하지 않습니다.');return;}
  try{
    let h=chooseNew?null:await hGet(l.id).catch(()=>null);
    if(h){let perm='denied';try{perm=await h.queryPermission({mode:'readwrite'});if(perm!=='granted')perm=await h.requestPermission({mode:'readwrite'});}catch(e){}if(perm!=='granted')h=null;}
    if(!h){h=await window.showSaveFilePicker({suggestedName:name,types:[{description:'storyM 백업 (JSON)',accept:{'application/json':['.json']}}]});await hSet(l.id,h).catch(()=>{});}
    const w=await h.createWritable();await w.write(text);await w.close();
    toast(`"${h.name}"에 저장했습니다.`);
  }catch(e){
    if(e&&e.name==='AbortError')return;
    download(name,text,'application/json');toast('저장 창을 열 수 없어 다운로드 폴더에 저장했습니다.');
  }
}



/* ---------- markdown ---------- */
function toMarkdown(l){
  const out=[];out.push(`# ${l.title||'제목 없음'} — 매뉴얼`,'');
  if(l.logline)out.push(`한 줄 요약: ${l.logline}`,'');
  const core=coreText(l);if(core)out.push('## 중심 글','',core,'');
  const tc=timeCards(l);if(tc.length){out.push('## 연보','');tc.forEach(c=>out.push(`- [${c.when.trim()}] ${c.stars?starTxt(c.stars)+' ':''}${oneLine(c.text)}${agesTxt(l,c)?` (${agesTxt(l,c)})`:''}`));out.push('');}
  const card=c=>{const r=tpRowFor(c,l);out.push(`- ${c.stars?starTxt(c.stars)+' ':''}${gFirst(c)||'(빈 카드)'}${hasWhen(c)?` [${c.when.trim()}]`:''}${c.draft?' (초안)':''}${r?` — 타이핑 ${chars(r.text)}자 · ${tpState(r)}`:''}`);
    if(gRest(c))out.push('  '+gRest(c).replace(/\n/g,'\n  '));
    (c.srcs||[]).filter(x=>(x.u||'').trim()).forEach(x=>out.push(`  - [자료](${x.u.trim()})${x.n?' '+x.n:''}`));
    const b=c.book?gById(l,c.book):null;if(b)out.push(`  - 나온 자료: ${gFirst(b)}`);
    if(tpId(c.tp))out.push(`  - 타이핑 원고: ${c.tp.trim()}`);
    const ls=gLinks(l,c).filter(x=>!x.dropped&&!x.kind);if(ls.length)out.push('  - 이어짐: '+ls.map(x=>gFirst(x)||'(빈 카드)').join(' · '));};
  cats(l).forEach(ct=>{if(ct.fixed==='ask')return;if(!mCards(l).some(c=>inCat(c,ct.id)))return;out.push(`## ${ct.name}`,'');
    const top=byStars(l,cardsAt(l,ct.id,null));top.forEach(card);if(top.length)out.push('');
    ct.items.forEach(it=>{const cs=byStars(l,cardsAt(l,ct.id,it.id));if(!cs.length)return;out.push(`### ${it.name}${it.born?` (${it.born}년생)`:''}`,'');cs.forEach(card);out.push('');});});
  const lo=loose(l);if(lo.length){out.push('## 분류 없음','');byStars(l,lo).forEach(card);out.push('');}
  const as=askCards(l);if(as.length){out.push('## 물음','');as.forEach(c=>out.push(`- ${oneLine(c.text)}${placeTxt(l,c)?` — ${placeTxt(l,c)}`:''}`));out.push('');}
  const cl=clashCards(l);if(cl.length){out.push('## 충돌','');cl.forEach(c=>{const x=c.clash||{};const o=x.card?gById(l,x.card):null;out.push(`- ${oneLine(c.text)}`,`  - 이미 있는 카드: ${oneLine(o?o.text:x.cardText)}`,`  - 새 아이디어: ${oneLine(x.ideaText)}`);});out.push('');}
  const dr=dropCards(l);if(dr.length){out.push('## 버린 카드','');dr.forEach(c=>out.push(`- ${oneLine(c.text)||'(빈 카드)'}${c.why?' — 까닭: '+c.why:''}`));out.push('');}
  const ni=ideasOf(l).filter(i=>i.state!=='done');if(ni.length){out.push('## 아직 정리하지 않은 아이디어','');ni.forEach(i=>out.push(`- ${oneLine(i.text)}${ideaLinks(i).map(x=>` [자료](${x.u})`).join('')}`));out.push('');}
  return out.join('\n');
}

/* 넘치는 카드 처리: 본문이 카드에 안 들어가면 글자 배율을 0.04씩 0.72(약 9pt)까지 줄이고,
   그래도 안 들어가는 토막 카드는 자연스러운 경계(빈 줄 > 문장 끝 > 띄어쓰기)에서 둘로 나눠 "이어서" 카드를 만든다.
   화면에서 재지만 카드 크기(mm)와 글자(pt)가 모두 절대 단위라 인쇄와 같은 배치가 된다. */
function fitA6Cards(){
  const MIN=0.72,STEP=0.04,SLACK=2;
  const contentH=el=>{const r=document.createRange();r.selectNodeContents(el);return r.getBoundingClientRect().height;};
  const fits=el=>contentH(el)<=el.clientHeight-SLACK;
  printRoot.classList.add('measuring');
  const queue=[...printRoot.querySelectorAll('.pcard')];
  let guard=0;
  while(queue.length&&guard++<2000){
    const card=queue.shift();const pb=card.querySelector('.pb');const box=pb||card;
    let f=1;card.style.setProperty('--fs',f);
    while(!fits(box)&&f-STEP>=MIN-1e-9){f=+(f-STEP).toFixed(2);card.style.setProperty('--fs',f);}
    if(fits(box)||!pb)continue;
    const text=pb.textContent;const cut=splitPoint(text);
    if(cut<=0||cut>=text.length)continue;
    const next=card.cloneNode(true);
    pb.textContent=text.slice(0,cut).replace(/\s+$/,'');
    next.querySelector('.pb').textContent=text.slice(cut).replace(/^\s+/,'');
    const hs=next.querySelectorAll('.ph span');if(hs[1]&&!/이어서$/.test(hs[1].textContent))hs[1].textContent+=' · 이어서';
    card.after(next);
    queue.unshift(card,next);
  }
  let n=0;printRoot.querySelectorAll('.pcard .pf span:last-child').forEach(s=>{s.textContent=++n;});
  printRoot.classList.remove('measuring');
}
function splitPoint(text){
  const mid=text.length/2,win=text.length*0.3;
  const pats=[/\n\s*\n/g,/\n/g,/[.!?。]\s+/g,/\s+/g];
  for(const re of pats){
    let best=-1,m;
    while((m=re.exec(text))){const at=m.index+m[0].length;if(Math.abs(at-mid)<=win&&(best<0||Math.abs(at-mid)<Math.abs(best-mid)))best=at;}
    if(best>0&&best<text.length)return best;
  }
  return Math.floor(mid);
}

  isync.busy=true;let changed=false;
  /* 수파베이스는 한 번에 1,000줄까지만 준다. 나중에 고친 것부터 받고, 다 받았을 때(1,000줄 미만)만 "저쪽에 없는 줄"을 올릴 것으로 친다 */
  try{const rows=await rest(`/${IDEA_TABLE}?select=*&order=updated_at.desc&limit=1000`);isync.lastPull=Date.now();setIdeaTable('ok');
    const seen=new Set();
    for(const r of rows){seen.add(r.id);delete r.user_id;const loc=ideaById(r.id);
      if(!loc){db.ideas.push(r);changed=true;}
      else if(r.updated_at>(loc.updated_at||0)){for(const k of Object.keys(loc))delete loc[k];Object.assign(loc,r);changed=true;}
      else if(r.updated_at<(loc.updated_at||0))loc._d=1;}
    if(rows.length<1000)db.ideas.forEach(i=>{if(!seen.has(i.id))i._d=1;});
    if(changed){persist(true);ideasChanged();}
  }catch(e){isync.lastCheck=Date.now();if(e.noTable)setIdeaTable('none');}
  finally{isync.busy=false;}
  if(db.ideas.some(i=>i._d))flushIdeas();
}
function syncPanelHtml(compact){
  if(sess)return `<h3 style="font-size:13px;font-weight:500;margin:0 0 6px">동기화 · ${esc(sess.email)}</h3>
    <div class="syncform ${compact?'compact':''}"><button data-act="syncNow">지금 동기화</button><button class="ghost" data-act="syncOut">로그아웃</button></div>
    <div class="syncstat ${sync.err?'err':''}">${esc(sync.msg)}</div>`;
  return `<h3 style="font-size:13px;font-weight:500;margin:0 0 6px">동기화</h3>
    <div class="syncform ${compact?'compact':''}"><input type="email" class="syncEmail" placeholder="이메일" autocomplete="username" style="width:${compact?'100%':'200px'}"><input type="password" class="syncPw" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" style="width:${compact?'100%':'180px'}"><button data-act="syncIn">로그인</button><button class="ghost" data-act="syncUp">가입</button></div>
    <div class="syncstat ${sync.err?'err':''}">${esc(sync.msg)||'로그인하면 이 브라우저의 소설·아이디어와 수파베이스의 것을 서로 맞춥니다. 같은 소설을 두 기기에서 고치면 나중에 저장한 쪽이 남습니다. lecture 앱과 같은 계정을 써도 됩니다.'}</div>`;
}
function renderSyncPanels(){document.querySelectorAll('.syncbox').forEach(e=>e.innerHTML=syncPanelHtml(false));const m=document.querySelector('details.menu .syncform');if(m)m.parentElement.innerHTML=syncPanelHtml(true);const s=document.getElementById('ideaStat');if(s)s.innerHTML=ideaStatHtml();}
app.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(!/^sync(In|Up|Out|Now)$/.test(act))return;
  const box=b.closest('.syncbox,details.menu')||app;
  const email=(box.querySelector('.syncEmail')||{}).value||'',pw=(box.querySelector('.syncPw')||{}).value||'';
  try{
    if(act==='syncOut'){setSess(null);sync.dirty.clear();setSyncMsg('');renderSyncPanels();return;}
    if(act==='syncNow'){setSyncMsg('동기화 중…');await pullStories(true);await pullIdeas(true);return;}
    if(!email||!pw){setSyncMsg('이메일과 비밀번호를 넣으세요.',true);return;}
    if(pw.length<6){setSyncMsg('비밀번호는 6자 이상이어야 합니다.',true);return;}
    b.disabled=true;setSyncMsg(act==='syncUp'?'가입 중…':'로그인 중…');
    if(act==='syncUp'){const ok=await sbSignUp(email,pw);if(!ok){setSyncMsg('확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 여기서 로그인하세요.');b.disabled=false;return;}}
    else await sbSignIn(email,pw);
    setSyncMsg('로그인했습니다. 동기화 중…');renderSyncPanels();
    db.stories.forEach(l=>sync.dirty.add(l.id));(db.deleted||[]).forEach(d=>sync.dirty.add(d.id));
    await pullStories(true);await pullIdeas(true);renderSyncPanels();
  }catch(err){setSyncMsg(err.message||String(err),true);b.disabled=false;}
});
window.addEventListener('focus',()=>{drainInbox();pullStories(false).then(()=>pullIdeas(false));const l=cur();if(l&&ui.view==='editor')tpLoad(l).then(()=>tpPaint(l));});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){drainInbox();pullStories(false).then(()=>pullIdeas(false));}else{if(sync.dirty.size)flushSync();flushIdeas();}});
window.addEventListener('beforeunload',()=>{if(sync.dirty.size)flushSync(true);flushIdeas(true);});
window.addEventListener('storage',e=>{if(e.key===IDEA_IN_KEY&&e.newValue)drainInbox();});

/* ---------- 밖에서 오기 — #소설=ID&카드=ID, #소설제목=제목, 거기에 &찾기=말 (타이핑의 "카드 찾기") ---------- */
let hashPending=false;
function readHash(){let h='';try{h=decodeURIComponent((location.hash||'').slice(1));}catch(e){h=(location.hash||'').slice(1);}if(!h)return null;const o={};h.split('&').forEach(p=>{const i=p.indexOf('=');if(i>0)o[p.slice(0,i)]=p.slice(i+1);});return{story:o['소설']||o.story,scene:o['장면']||o.scene,card:o['카드']||o.card,title:o['소설제목']||o.title,find:o['찾기']!=null?o['찾기']:o.find};}
function applyHash(){const q=readHash();if(!q||(!q.story&&!q.title))return false;const l=q.story?db.stories.find(x=>x.id===q.story):db.stories.find(x=>(x.title||'').trim()===q.title.trim());if(!l)return false;ensure(l);ui.storyId=l.id;ui.view='editor';ui.cardOpen=null;ui.cat=null;ui.item=null;
  const c=q.card?gById(l,q.card):null;let lost=false;
  if(c){ui.cardOpen=c.id;ui.cardAt='';if(c.dropped){ui.pane='drop';ui.cardOpen=null;}else if(c.kind)ui.pane='ask';else ui.pane='board';}
  else if(q.find!=null){ui.pane='find';ui.find=q.find;
    /* 같은 주소를 새로 고친 것은 다시 세지 않는다 */
    const key=l.id+'|'+q.find;let seen='';try{seen=sessionStorage.getItem('storyM.miss')||'';}catch(e){}
    if(seen!==key){missLog(l,q.find);try{sessionStorage.setItem('storyM.miss',key);}catch(e){}}}
  else if(q.card){lost=true;ui.pane=(l.guide.cards4||[]).some(x=>x.id===q.card)?(l.guide.moved4===''?'idea':'old'):defaultPane(l);}
  else{ui.pane=defaultPane(l);}
  render();
  if(lost)toast((l.guide.cards4||[]).some(x=>x.id===q.card)?'이 주소의 카드는 4판의 카드입니다. 새 아이디어로 옮겨 정리받으면 다시 이어집니다.':'주소의 카드를 찾지 못했습니다.');
  return true;}
window.addEventListener('hashchange',()=>{applyHash();});
/* 창 하나로(2026년 11월 14일 밤) — 타이핑을 늘 같은 창으로 연다. 두 앱이 자기 창 이름을 'appwin.<앱>'에 적고(이름이 없으면 앱 이름. 시작이 연 창은 sijak_write 그대로),
   data-win 링크는 누르는 순간 상대 앱의 그 창 이름으로 연다. 내 창 이름과 같으면 앱 이름으로(나 자신을 덮지 않게) */
function winMine(){try{if(!window.name||window.name==='taiping')window.name='storyM';localStorage.setItem('appwin.storyM',window.name);}catch(e){}}
function winOf(app){let n='';try{n=localStorage.getItem('appwin.'+app)||'';}catch(e){}if(!n||n===window.name)n=app;return n===window.name?app+'2':n;}
winMine();window.addEventListener('focus',winMine);
document.addEventListener('click',e=>{const a=e.target&&e.target.closest?e.target.closest('a[data-win]'):null;if(a){a.target=winOf(a.dataset.win);a.removeAttribute('rel');}},true);
render();
drainInbox();
hashPending=!!readHash()&&!applyHash();
if(sess){setSyncMsg('동기화 확인 중…');pullStories(true).then(()=>pullIdeas(true));}
</script>
