<style>
:root{
  --hanji:#efe9dc;
  --meok:#23201c;
  --meok-2:#6b6259;
  --meok-3:#9a9084;
  --seon:#d6cdba;
  --inju:#a8322d;
  --jongi:#fcfcfa;
  --ui:'Gowun Dodum',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  --top:env(safe-area-inset-top);
  --bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--hanji);color:var(--meok);
  font-family:var(--ui);font-size:16px;line-height:1.8;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;font-size:inherit}

header{
  position:fixed;top:0;left:0;right:0;z-index:10;
  padding:calc(var(--top) + .8rem) 1.1rem .7rem;
  background:var(--hanji);border-bottom:1px solid var(--seon);
  display:flex;align-items:baseline;gap:.8rem;
}
header .ttl{font-size:1rem;flex:1;min-width:1.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .act{font-size:.85rem;color:var(--meok-2)}
header .act:active{color:var(--inju)}
#state{font-size:.75rem;color:var(--meok-3);white-space:nowrap}
#cnt{font-size:.75rem;color:var(--meok-2);white-space:nowrap;font-variant-numeric:tabular-nums}
#cnt:empty{display:none}
#state.warn{color:var(--inju)}

main{height:100%;padding-top:calc(var(--top) + 3.1rem);overflow:hidden}
.view{display:none;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view.on{display:block}
.pad{padding:1.2rem 1.1rem calc(var(--bot) + 3rem)}

.card{
  display:block;width:100%;text-align:left;
  padding:1rem 0;border-bottom:1px solid var(--seon);
}
.card:first-child{border-top:1px solid var(--seon)}
.card .nm{font-size:1rem;margin-bottom:.15rem}
.card .sub{font-size:.78rem;color:var(--meok-3)}
.card .mark{color:var(--inju)}
.blank{color:var(--meok-3);font-size:.9rem;text-align:center;padding:4rem 1rem;line-height:2}

#edit{background:var(--jongi)}
#paper{
  display:block;width:100%;min-height:100%;
  border:0;background:transparent;resize:none;
  font-family:'Gowun Batang',serif;
  font-size:var(--fz,17px);line-height:var(--lh,1.95);color:var(--meok);
  padding:1.4rem 1.2rem calc(var(--bot) + 6rem);
  -webkit-user-select:text;
}
#paper:focus{outline:none}

.fld{display:flex;align-items:center;gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--seon);font-size:.85rem;color:var(--meok-2)}
.fld span:first-child{flex:1}
.fld input{width:5rem;text-align:right}
.fld .u{font-size:.75rem;color:var(--meok-3);width:1.8rem}
label{display:block;font-size:.8rem;color:var(--meok-2);margin:1.4rem 0 .35rem}
input[type=number]{
  font-family:var(--ui);font-size:16px;color:var(--meok);
  background:var(--jongi);border:1px solid var(--seon);border-radius:2px;
  padding:.45rem .55rem;
}
input[type=text],input[type=password]{
  width:100%;font-family:var(--ui);font-size:16px;color:var(--meok);
  background:var(--jongi);border:1px solid var(--seon);border-radius:2px;
  padding:.6rem .7rem;
}
input:focus{outline:none;border-color:var(--inju)}
.note{font-size:.78rem;color:var(--meok-3);line-height:1.8;margin:.7rem 0 0}
.btn{
  display:inline-block;margin-top:1.4rem;font-size:.9rem;color:var(--meok-2);
  border-bottom:1px solid var(--seon);padding-bottom:1px;
}
.btn:active{color:var(--inju);border-bottom-color:var(--inju)}
.btn + .btn{margin-left:1.4rem}
pre{
  background:var(--jongi);border:1px solid var(--seon);border-radius:2px;
  padding:.8rem;font-size:11px;line-height:1.6;overflow-x:auto;
  color:var(--meok-2);white-space:pre;margin:.6rem 0 0;
}
#toast{
  position:fixed;left:50%;bottom:calc(var(--bot) + 1.6rem);transform:translateX(-50%);
  background:var(--meok);color:var(--jongi);padding:.5rem 1rem;border-radius:2px;
  font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;
}
#toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <button class="act" id="back" hidden>목록</button>
  <span class="ttl" id="title">보태기</span>
  <span id="cnt"></span>
  <span id="state"></span>
  <button class="act" id="gear">설정</button>
</header>

<main>
  <section id="list" class="view on"><div class="pad" id="listPad"></div></section>

  <section id="edit" class="view">
    <textarea id="paper" spellcheck="false" autocorrect="off" autocapitalize="sentences"></textarea>
  </section>

  <section id="setup" class="view"><div class="pad">
    <label for="url">수파베이스 주소</label>
    <input type="text" id="url" placeholder="https://xxxx.supabase.co" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="key">열쇠</label>
    <input type="password" id="key" placeholder="sb_publishable_..." autocomplete="off" autocapitalize="off" spellcheck="false">
    <p class="note">기기에만 저장됩니다. 이 열쇠로 원고를 읽고 쓸 수 있으니 이 파일을 공개된 곳에 두지 마세요.</p>

    <button class="btn" id="save">저장하고 불러오기</button>

    <label>글 보기</label>
    <div class="fld"><span>글자 크기</span><input type="number" id="fz" min="13" max="28" step="1"><span class="u">px</span></div>
    <div class="fld"><span>줄 간격</span><input type="number" id="lh" min="1.2" max="3" step="0.05"><span class="u">배</span></div>
    <p class="note">보이는 그대로가 보태기 원고가 됩니다. 엔터 한 번은 새 문단, 빈 줄은 빈 줄입니다. 스크리브너에서 쓴 글을 통째로 붙여 넣어도 문단이 그대로 맞습니다.</p>
    <p class="note">맥에서 원고를 새로 보내면, 그 전 원고를 보고 손본 것은 버려집니다. 목록을 다시 불러와 새 원고에서 손보세요.</p>

    <label>표 만들기</label>
    <p class="note">수파베이스의 SQL 편집기에 아래를 한 번 실행해두세요.</p>
    <pre id="sql"></pre>
    <button class="btn" id="copySql">복사</button>
  </div></section>
</main>

<div id="toast"></div>

<script>
(function(){
"use strict";

var KEY = "botaegi-phone-v1";
var TABLE = "botaegi_ms";
var DEF_URL = "https://pvunctdbsdcgvbqloslg.supabase.co";
var DEF_KEY = "sb_publishable_Prt0uDw-FOCDfgrczhHa_w_6uj6OhKY";
var SQL = [
"create table if not exists botaegi_ms (",
"  id           text primary key,",
"  title        text not null,",
"  text         text not null default '',",
"  piece        int,",
"  updated_at   timestamptz not null default now(),",
"  review       text,",
"  review_at    timestamptz,",
"  review_base  timestamptz",
");",
"",
"alter table botaegi_ms enable row level security;",
"drop policy if exists botaegi_all on botaegi_ms;",
"create policy botaegi_all on botaegi_ms",
"  for all to anon using (true) with check (true);"
].join("\n");

var S = load();
function fresh(){ return { url:DEF_URL, key:DEF_KEY, rows:[], drafts:{}, fz:17, lh:1.95 }; }
function load(){
  var d = fresh();
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var p = JSON.parse(raw);
      for(var k in d) if(p[k]!==undefined && p[k]!==null) d[k]=p[k];
    }
  }catch(e){}
  if(!Array.isArray(d.rows)) d.rows = [];
  if(!d.drafts || typeof d.drafts !== "object") d.drafts = {};
  return d;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

var $ = function(s){ return document.querySelector(s); };
var elList=$("#listPad"), elPaper=$("#paper"), elTitle=$("#title"),
    elBack=$("#back"), elGear=$("#gear"), elState=$("#state"), elToast=$("#toast"),
    elCnt=$("#cnt");
var openId = null, saveT = null, pushT = null;

function toast(m){
  elToast.textContent = m;
  elToast.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(function(){ elToast.classList.remove("on"); }, 1600);
}
function state(t, warn){
  elState.textContent = t || "";
  elState.classList.toggle("warn", !!warn);
}
function show(v){
  ["list","edit","setup"].forEach(function(x){
    document.getElementById(x).classList.toggle("on", x===v);
  });
  elBack.hidden = (v === "list");
  elGear.hidden = (v !== "list");
}
function mae(n){ return (n/200).toFixed(1); }
function curRow(){
  return S.rows.filter(function(x){ return x.id===openId; })[0] || null;
}
function renderCnt(){
  var r = curRow();
  if(!r){ elCnt.textContent = ""; return; }
  var n = paperGet().replace(/\n/g, "").length;
  var base = r.piece || 0;
  elCnt.textContent = mae(n) + "매" + (base ? " · " + Math.round(n/base*100) + "%" : "");
}
function stamp(t){
  var d = new Date(t), z = function(n){ return (n<10?"0":"")+n; };
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 "+z(d.getHours())+":"+z(d.getMinutes());
}

/* 화면에서는 문단 사이를 한 줄 벌려 보여주고, 올릴 때 도로 붙인다 */
/* 보이는 그대로가 원고다 — 엔터 한 번은 새 문단, 빈 줄은 빈 줄.
   스크리브너에서 쓴 글을 붙여 넣어도 그대로 맞는다. 줄 앞뒤 공백과 글 앞뒤의 빈 줄만 걷어낸다 */
function spread(t){ return t; }
function tighten(t){
  var x = t.replace(/\r\n?/g, "\n").split("\n").map(function(l){ return l.trim(); }).join("\n");
  return x.replace(/^\n+|\n+$/g, "");
}

function paperSet(t){ elPaper.value = spread(t); }
function paperGet(){ return tighten(elPaper.value); }

function applyLook(){
  var r = document.documentElement.style;
  r.setProperty("--fz", (S.fz||17) + "px");
  r.setProperty("--lh", String(S.lh||1.95));
}

/* ---------- 서버 ---------- */
function ready(){ return !!(S.url && S.key); }
function api(path, opt){
  opt = opt || {};
  opt.headers = Object.assign({
    "apikey": S.key,
    "Authorization": "Bearer " + S.key,
    "Content-Type": "application/json"
  }, opt.headers || {});
  return fetch(S.url.replace(/\/+$/,"") + "/rest/v1/" + path, opt);
}

function same(a, b){ return !!a && !!b && Date.parse(a) === Date.parse(b); }
/* 손본 글이 지금 원고를 보고 고친 것인가 */
function reviewFits(r){ return r.review != null && r.review !== "" && same(r.review_base, r.updated_at); }

function pull(){
  if(!ready()){ state("설정 필요", true); return Promise.resolve(); }
  state("불러오는 중");
  return api(TABLE + "?select=*&order=updated_at.desc")
    .then(function(r){
      if(!r.ok) throw new Error(r.status + "");
      return r.json();
    })
    .then(function(rows){
      S.rows = rows.filter(function(r){ return r.text && r.text.trim(); });
      var gone = 0;
      Object.keys(S.drafts).forEach(function(id){
        var d = S.drafts[id];
        var r = S.rows.filter(function(x){ return x.id===id; })[0];
        if(!r){ delete S.drafts[id]; return; }
        /* 맥에서 원고를 새로 보냈으면 옛 원고를 보고 손본 것은 버린다 */
        if(!same(d.base, r.updated_at)){ delete S.drafts[id]; if(!d.sent) gone++; return; }
        var sv = r.review_at ? Date.parse(r.review_at) : 0;
        if(d.sent && sv >= d.at) delete S.drafts[id];
      });
      save(); renderList(); state("");
      if(gone) toast("맥에서 원고가 바뀌어 손본 것 " + gone + "편을 버렸습니다");
      return pushAll();
    })
    .catch(function(e){
      state("연결 안 됨", true);
      renderList();
    });
}

function pushOne(id){
  var d = S.drafts[id];
  if(!d || !ready()) return Promise.resolve();
  var at = new Date(d.at).toISOString();
  /* 맥의 원고가 그대로일 때만 쓴다 */
  return api(TABLE + "?id=eq." + encodeURIComponent(id) + "&updated_at=eq." + encodeURIComponent(new Date(Date.parse(d.base)).toISOString()), {
    method: "PATCH",
    headers: { "Prefer": "return=representation" },
    body: JSON.stringify({ review: d.text, review_at: at, review_base: d.base })
  }).then(function(r){
    if(!r.ok) throw new Error(r.status + "");
    return r.json();
  }).then(function(out){
    if(!out || !out.length){
      delete S.drafts[id]; save();
      toast("맥에서 원고가 바뀌어 손본 것을 올리지 못했습니다");
      if(openId === id){ openId = null; elCnt.textContent = ""; show("list"); }
      pull();
      return;
    }
    d.sent = true;
    var row = S.rows.filter(function(x){ return x.id===id; })[0];
    if(row){ row.review = d.text; row.review_at = at; row.review_base = d.base; }
    save(); state("");
  }).catch(function(){
    state("저장 대기", true);
  });
}
function pushAll(){
  var ids = Object.keys(S.drafts).filter(function(id){ return !S.drafts[id].sent; });
  return ids.reduce(function(chain, id){
    return chain.then(function(){ return pushOne(id); });
  }, Promise.resolve());
}

/* ---------- 화면 ---------- */
function bodyOf(r){
  var d = S.drafts[r.id];
  if(d) return d.text;
  return reviewFits(r) ? r.review : r.text;
}
function touched(r){
  return bodyOf(r) !== r.text;
}

function renderList(){
  elTitle.textContent = "보태기";
  elList.innerHTML = "";
  if(!ready()){
    elList.innerHTML = '<p class="blank">설정에서 수파베이스 주소와<br>익명 열쇠를 넣어주세요.</p>';
    return;
  }
  if(!S.rows.length){
    elList.innerHTML = '<p class="blank">아직 올라온 원고가 없습니다.</p>';
    return;
  }
  S.rows.forEach(function(r){
    var b = document.createElement("button");
    b.className = "card";
    var nm = document.createElement("div");
    nm.className = "nm"; nm.textContent = r.title;
    var sub = document.createElement("div");
    sub.className = "sub";
    var t = bodyOf(r);
    var n = t.replace(/\n/g, "").length;
    sub.textContent = mae(n) + "매" + (r.piece ? " · " + Math.round(n/r.piece*100) + "%" : "") + " · " + stamp(r.updated_at);
    b.appendChild(nm); b.appendChild(sub);
    if(touched(r)){
      var m = document.createElement("span");
      m.className = "sub mark"; m.textContent = " · 손봄";
      sub.appendChild(m);
    }
    b.onclick = function(){ openVersion(r.id); };
    elList.appendChild(b);
  });
}

function openVersion(id){
  var r = S.rows.filter(function(x){ return x.id===id; })[0];
  if(!r) return;
  openId = id;
  elTitle.textContent = r.title;
  paperSet(bodyOf(r));
  renderCnt();
  show("edit");
  elPaper.scrollTop = 0;
}

function stash(){
  if(!openId) return;
  var r = S.rows.filter(function(x){ return x.id===openId; })[0];
  if(!r) return;
  var t = paperGet();
  var prev = S.drafts[openId];
  if(t === bodyOf(r) && !prev) return;
  if(prev && prev.text === t) return;
  /* 원문으로 되돌려 놓아도 올려서 서버의 손본 글을 비운다 */
  S.drafts[openId] = { text:t, at:Date.now(), sent:false, base:r.updated_at };
  save();
}

elPaper.addEventListener("input", function(){
  renderCnt();
  state("쓰는 중");
  clearTimeout(saveT); clearTimeout(pushT);
  saveT = setTimeout(function(){ stash(); state("저장됨"); }, 600);
  pushT = setTimeout(function(){ stash(); pushOne(openId); }, 2600);
});

elBack.addEventListener("click", function(){
  if(document.getElementById("edit").classList.contains("on")){
    clearTimeout(saveT); clearTimeout(pushT);
    stash();
    pushOne(openId);
  }
  openId = null;
  elCnt.textContent = "";
  renderList();
  show("list");
});

elGear.addEventListener("click", function(){
  $("#url").value = S.url;
  $("#key").value = S.key;
  $("#sql").textContent = SQL;
  $("#fz").value = S.fz;
  $("#lh").value = S.lh;

  elTitle.textContent = "설정";
  elCnt.textContent = "";
  show("setup");
});

function num(el, key, min, max, fb){
  el.addEventListener("change", function(){
    var n = parseFloat(this.value);
    S[key] = (!isNaN(n) && n>=min && n<=max) ? n : fb;
    this.value = S[key];
    save(); applyLook();
  });
}
num($("#fz"), "fz", 13, 28, 17);
num($("#lh"), "lh", 1.2, 3, 1.95);

$("#save").addEventListener("click", function(){
  S.url = $("#url").value.trim();
  S.key = $("#key").value.trim();
  save();
  show("list");
  pull().then(function(){ toast("불러왔습니다"); });
});

$("#copySql").addEventListener("click", function(){
  var t = SQL;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){ toast("복사했습니다"); }, fb);
  }else fb();
  function fb(){
    var ta = document.createElement("textarea");
    ta.value = t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
    toast("복사했습니다");
  }
});

window.addEventListener("online", function(){ pull(); });
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible"){
    if(openId){ pushAll(); }
    else pull();
  }else{
    stash(); pushAll();
  }
});
window.addEventListener("pagehide", function(){ stash(); });

/* 시작 */
applyLook();
renderList();
show("list");
if(ready()) pull();
else state("설정 필요", true);

})();
</script>
</body>
</html>
