<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>초고</title>
<style>
:root{
  --paper:#F2F2ED;
  --paper-deep:#EAEAE3;
  --ink:#2A2B30;
  --ink-soft:#55565C;
  --muted:#8B8E94;
  --line:#D9D9CF;
  --dawn:#5C6E8E;
  --dawn-faint:#DCE1E9;
  --vermilion:#A93A2B;
  --vermilion-faint:#F2E2DE;
  --serif:"Noto Serif KR","Source Han Serif K",AppleMyungjo,"Nanum Myeongjo",Batang,serif;
  --sans:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  line-height:1.9;
}
button{font-family:var(--sans);cursor:pointer;background:none;border:none;color:inherit}
button:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--dawn);outline-offset:2px}

/* ---------- frame ---------- */
.wrap{max-width:700px;margin:0 auto;padding:0 24px 120px}
header.top{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:28px 0 10px;font-family:var(--sans);
}
.brand{font-size:13px;letter-spacing:.35em;color:var(--muted)}
.top-actions{display:flex;gap:14px;font-size:12.5px;color:var(--ink-soft);flex-wrap:wrap;justify-content:flex-end}
.top-actions button{padding:2px 0;border-bottom:1px solid transparent}
.top-actions button:hover{border-bottom-color:var(--ink-soft)}
.top-actions button.on{color:var(--dawn);border-bottom-color:var(--dawn)}

/* ---------- horizon progress (signature) ---------- */
.horizon{
  position:relative;height:3px;background:var(--line);border-radius:2px;
  margin:6px 0 34px;overflow:hidden;
}
.horizon .sun{
  position:absolute;inset:0;width:0%;
  background:linear-gradient(90deg,var(--dawn) 0%,#8496B3 70%,#C8A15A 100%);
  transition:width .4s ease;
}
.horizon.done .sun{background:linear-gradient(90deg,#C8A15A,#D9B35E)}

/* ---------- title heading ---------- */
.titlehead{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
input#titleInput{
  flex:1;min-width:0;border:none;background:transparent;color:var(--ink);
  font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.02em;
  border-bottom:1px solid var(--line);padding:2px 0 6px;
}
input#titleInput::placeholder{color:#B4B6B0;font-weight:400}
.titlehead .sub{font-family:var(--sans);font-size:12px;color:var(--muted);white-space:nowrap}

/* pages indicator: 세 쪽 */
.pages{display:flex;gap:8px;align-items:center;margin:14px 0 22px;font-family:var(--sans)}
.page{
  width:22px;height:30px;border:1px solid var(--line);border-radius:2px;
  background:linear-gradient(to top,var(--dawn-faint) var(--fill,0%),transparent var(--fill,0%));
  position:relative;transition:background .3s;
}
.page.full{border-color:var(--dawn);background:linear-gradient(to top,var(--dawn) 100%,transparent 0)}
.pages .count{font-size:12.5px;color:var(--ink-soft);margin-left:6px}
.pages .count b{color:var(--ink);font-weight:600}

/* ---------- writing area ---------- */
textarea#editor{
  width:100%;min-height:52vh;resize:vertical;
  border:none;background:transparent;color:var(--ink);
  font-family:var(--serif);font-size:17px;line-height:2.05;
  padding:4px 0;
}
textarea#editor::placeholder{color:#B4B6B0}

.statusline{
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--sans);font-size:12px;color:var(--muted);
  border-top:1px solid var(--line);padding-top:10px;margin-top:8px;
}
.saverow{
  display:flex;justify-content:flex-end;align-items:center;gap:10px;
  margin-top:16px;font-family:var(--sans);
}
.saverow .hint{font-size:12px;color:var(--muted);margin-right:auto}
.saverow button{font-size:13px;padding:8px 18px;border-radius:3px}
.saverow .ghost{color:var(--muted);border:1px solid var(--line)}
.saverow .ghost:hover{color:var(--ink);border-color:var(--muted)}
.saverow .primary{background:var(--dawn);color:#fff}
.saverow .primary:disabled{background:var(--line);color:#fff;cursor:not-allowed;opacity:.75}

/* completion banner */
.doneNote{
  display:none;margin:26px 0 8px;padding:18px 20px;
  border-left:3px solid #C8A15A;background:var(--paper-deep);
  font-size:15px;color:var(--ink-soft);
}
.doneNote.show{display:block}
.doneNote b{color:var(--ink);font-weight:600}
.doneNote button{
  margin-top:10px;font-size:13px;color:var(--dawn);
  border-bottom:1px solid var(--dawn);padding-bottom:1px;
}

/* ---------- board (지난 초고) ---------- */
#boardView,#readView{display:none}
.boardbar{
  display:flex;align-items:center;gap:16px;margin:2px 0 18px;font-family:var(--sans);
}
.boardbar input{
  flex:1;min-width:0;font-family:var(--sans);font-size:13px;color:var(--ink);
  background:transparent;border:none;border-bottom:1px solid var(--line);padding:6px 2px;
}
.boardbar input::placeholder{color:var(--muted)}
.boardbar select{
  font-family:var(--sans);font-size:12px;color:var(--ink-soft);
  background:transparent;border:none;border-bottom:1px solid var(--line);padding:6px 2px;
}

/* grid keeps head + rows aligned */
.boardhead,.item{
  display:grid;
  grid-template-columns:minmax(0,1fr) 56px 62px 84px 84px;
  gap:16px;align-items:baseline;
}
.boardhead{
  font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;color:var(--muted);
  border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:9px 2px;
}
.boardhead span{text-align:right}
.boardhead span:first-child{text-align:left}
.board{border-bottom:1px solid var(--line)}
.item{padding:16px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.item:hover{background:var(--paper-deep)}
.item .t{min-width:0}
.item .t .tt{font-size:17px;font-weight:600;line-height:1.5;word-break:break-word}
.item .t .peek{
  display:block;font-family:var(--sans);font-size:12px;font-weight:400;line-height:1.6;
  color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;
}
.item .col{font-family:var(--sans);font-size:12px;color:var(--ink-soft);white-space:nowrap;text-align:right}
.item .col.c b{color:var(--vermilion);font-weight:600}
.item .col.d{color:var(--muted)}
.item .col.x{display:flex;gap:10px;justify-content:flex-end}
.item .act{font-family:var(--sans);font-size:11.5px;color:var(--muted);border-bottom:1px dotted var(--muted)}
.item .act:hover{color:var(--ink);border-bottom-color:var(--ink)}
.item .act.del:hover{color:var(--vermilion);border-bottom-color:var(--vermilion)}
.boardfoot{
  font-family:var(--sans);font-size:12px;color:var(--muted);
  padding-top:12px;display:flex;justify-content:space-between;gap:12px;
}

/* ---------- read view ---------- */
.nav{
  display:flex;align-items:center;justify-content:space-between;
  margin:2px 0 26px;font-family:var(--sans);
}
.nav button.arrow{
  font-size:20px;line-height:1;padding:8px 14px;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:3px;background:var(--paper-deep);
}
.nav button.arrow:hover:not(:disabled){color:var(--ink);border-color:var(--muted)}
.nav button.arrow:disabled{opacity:.3;cursor:default}
.nav .navmid{text-align:center;flex:1;min-width:0;padding:0 12px}
.nav .navmid .ago{font-size:12px;letter-spacing:.2em;color:var(--vermilion)}
.nav .navmid h2{font-size:18px;font-weight:600;font-family:var(--serif);word-break:break-word}
select#draftJump{
  font-family:var(--sans);font-size:12px;color:var(--ink-soft);
  background:transparent;border:none;border-bottom:1px solid var(--line);
  margin-top:4px;max-width:220px;
}

.entryBody{font-size:16.5px;line-height:2.1;white-space:pre-wrap;word-break:break-word}
.entryBody .hl{
  background:var(--vermilion-faint);
  border-bottom:1px solid var(--vermilion);
}
.entryBody .cmt{
  color:var(--vermilion);font-size:15px;
  white-space:normal;
}
.entryBody .cmt .cmark{font-family:var(--sans);font-size:12px;opacity:.85}
.entryBody .cmt .cdate{
  font-family:var(--sans);font-size:11px;letter-spacing:.05em;
  color:var(--vermilion);opacity:.75;
}
.entryBody .cmt .cdel{
  font-family:var(--sans);font-size:11px;color:var(--muted);
  margin-left:6px;border-bottom:1px dotted var(--muted);
}
.entryBody .cmt .cdel:hover{color:var(--vermilion)}

.emptyDay{
  padding:60px 0;text-align:center;color:var(--muted);
  font-family:var(--sans);font-size:14px;line-height:2;
}
.emptyDay button{color:var(--dawn);border-bottom:1px solid var(--dawn);font-size:13px}

.archMeta{
  font-family:var(--sans);font-size:12px;color:var(--muted);
  border-top:1px solid var(--line);padding-top:10px;margin-top:34px;
}
.readActions{
  display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;
  font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);
}
.readActions button{border-bottom:1px solid var(--line);padding-bottom:1px}
.readActions button:hover{border-bottom-color:var(--ink-soft)}
.readActions button.danger{color:var(--vermilion);border-bottom-color:var(--vermilion-faint)}
.readActions button.danger:hover{border-bottom-color:var(--vermilion)}

/* selection popover */
#cmtPop{
  position:absolute;display:none;z-index:20;
  background:var(--ink);color:var(--paper);
  font-family:var(--sans);font-size:12.5px;
  padding:6px 12px;border-radius:3px;
}
#cmtPop:after{
  content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
  border:5px solid transparent;border-bottom:none;border-top-color:var(--ink);
}

/* comment input dialog */
#cmtBox{
  display:none;position:fixed;inset:0;z-index:30;
  background:rgba(42,43,48,.35);
  align-items:center;justify-content:center;padding:20px;
}
#cmtBox.show{display:flex}
#cmtBox .card{
  background:var(--paper);width:100%;max-width:520px;
  padding:26px 28px;border-top:3px solid var(--vermilion);
  box-shadow:0 12px 40px rgba(0,0,0,.18);
}
#cmtBox .quoted{
  font-size:14px;color:var(--ink-soft);border-left:2px solid var(--line);
  padding-left:12px;margin-bottom:14px;max-height:90px;overflow:auto;
}
#cmtBox textarea{
  width:100%;min-height:90px;resize:vertical;
  font-family:var(--serif);font-size:15px;line-height:1.9;color:var(--vermilion);
  background:transparent;border:1px solid var(--line);border-radius:3px;padding:10px 12px;
}
#cmtBox .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-family:var(--sans)}
#cmtBox .row .today{font-size:12px;color:var(--muted)}
#cmtBox .row .btns button{font-size:13px;padding:7px 16px;border-radius:3px}
#cmtBox .row .btns .save{background:var(--vermilion);color:#fff}
#cmtBox .row .btns .cancel{color:var(--muted);margin-right:6px}

/* ---------- sync ---------- */
.top-actions #btnSync{display:inline-flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.dot.ok{background:#5C8E6E}
.dot.warn{background:#C8A15A}
.dot.err{background:var(--vermilion)}
.dot.busy{background:var(--dawn);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}

#syncBox{
  display:none;position:fixed;inset:0;z-index:35;
  background:rgba(42,43,48,.35);
  align-items:center;justify-content:center;padding:20px;
}
#syncBox.show{display:flex}
#syncBox .card{
  background:var(--paper);width:100%;max-width:460px;
  padding:26px 28px;border-top:3px solid var(--dawn);
  box-shadow:0 12px 40px rgba(0,0,0,.18);font-family:var(--sans);
}
#syncBox h3{font-family:var(--serif);font-size:18px;font-weight:600;margin-bottom:4px}
#syncBox .sline{font-size:12.5px;color:var(--muted);line-height:1.9;margin-bottom:16px}
#syncBox input{
  width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);
  background:transparent;border:none;border-bottom:1px solid var(--line);padding:8px 2px;margin-bottom:14px;
}
#syncBox .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#syncBox .row button{font-size:13px;padding:7px 16px;border-radius:3px}
#syncBox .row .primary{background:var(--dawn);color:#fff}
#syncBox .row .ghost{color:var(--muted);border:1px solid var(--line)}
#syncBox .row .ghost:hover{color:var(--ink);border-color:var(--muted)}
#syncBox .note{font-size:12px;color:var(--muted);line-height:1.9;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}

#remoteBanner{
  display:none;margin:0 0 18px;padding:14px 18px;
  border-left:3px solid var(--dawn);background:var(--dawn-faint);
  font-family:var(--sans);font-size:13px;color:var(--ink-soft);line-height:1.9;
}
#remoteBanner.show{display:block}
#remoteBanner .btns{margin-top:8px;display:flex;gap:14px}
#remoteBanner button{font-size:12.5px;color:var(--dawn);border-bottom:1px solid var(--dawn);padding-bottom:1px}
#remoteBanner button.ghost{color:var(--muted);border-bottom-color:var(--line)}

/* toast */
#toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:13px;
  padding:10px 20px;border-radius:3px;opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;z-index:40;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
}
@media (max-width:600px){
  .boardhead,.item{grid-template-columns:minmax(0,1fr) 52px 56px 76px;gap:10px}
  .boardhead .d,.item .col.d{display:none}
}
@media (max-width:520px){
  .wrap{padding:0 16px 100px}
  textarea#editor{font-size:16px}
  input#titleInput{font-size:19px}
  .item .t .tt{font-size:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">초고</div>
    <nav class="top-actions">
      <button id="btnWrite" class="on">초고 쓰기</button>
      <button id="btnBoard">지난 초고</button>
      <button id="btnSync" title="기기 사이 동기화"><span class="dot" id="syncDot"></span>동기화</button>
      <button id="btnSound" title="750단어 도달 시 알림음">🔔</button>
      <button id="btnExport">내보내기</button>
      <button id="btnImport">가져오기</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </nav>
  </header>
  <div class="horizon" id="horizon"><div class="sun" id="sun"></div></div>

  <!-- ===== 초고 쓰기 ===== -->
  <section id="writeView">
    <div class="titlehead">
      <input id="titleInput" type="text" placeholder="제목을 붙여 주세요" spellcheck="false" autocomplete="off">
      <span class="sub">단숨에 750단어</span>
    </div>
    <div id="remoteBanner">
      <span id="remoteMsg"></span>
      <span class="btns">
        <button id="remoteTake">이어받기</button>
        <button class="ghost" id="remoteSkip">무시하기</button>
      </span>
    </div>
    <div class="pages" id="pagesInd">
      <div class="page" data-i="0"></div>
      <div class="page" data-i="1"></div>
      <div class="page" data-i="2"></div>
      <span class="count"><b id="wc">0</b> / 750 단어</span>
    </div>
    <textarea id="editor" placeholder="고치지 말고, 멈추지 말고, 그냥 쓰세요." spellcheck="false"></textarea>
    <div class="doneNote" id="doneNote">
      <b>초고 한 편이 다 찼습니다.</b> 750단어를 넘겼으니 이제 제목을 붙여 저장하세요.<br>
      <button id="goSave">제목 붙여 저장하기 →</button>
    </div>
    <div class="statusline">
      <span id="saveStat">아직 저장된 초고 없음</span>
      <span id="charStat"></span>
    </div>
    <div class="saverow">
      <span class="hint" id="saveHint"></span>
      <button class="ghost" id="btnNew">새 초고</button>
      <button class="primary" id="btnSave" disabled>제목으로 저장</button>
    </div>
  </section>

  <!-- ===== 지난 초고 (게시판) ===== -->
  <section id="boardView">
    <div class="boardbar">
      <input id="q" type="text" placeholder="제목으로 찾기" autocomplete="off">
      <select id="sortSel">
        <option value="new">최근에 쓴 순</option>
        <option value="old">오래된 순</option>
        <option value="title">제목 순</option>
        <option value="cmt">코멘트 많은 순</option>
      </select>
    </div>
    <div class="boardhead">
      <span>제목</span>
      <span class="w">단어</span>
      <span class="c">코멘트</span>
      <span class="d">쓴 날</span>
      <span class="x"></span>
    </div>
    <div class="board" id="boardList"></div>
    <div class="boardfoot">
      <span id="boardCount"></span>
      <span>제목을 누르면 초고가 펼쳐집니다</span>
    </div>
  </section>

  <!-- ===== 초고 읽기 · 코멘트 ===== -->
  <section id="readView">
    <div class="nav">
      <button class="arrow" id="navPrev" title="이전 초고">←</button>
      <div class="navmid">
        <div class="ago" id="readAgo"></div>
        <h2 id="readTitle"></h2>
        <select id="draftJump" title="저장된 다른 초고로 이동"></select>
      </div>
      <button class="arrow" id="navNext" title="다음 초고">→</button>
    </div>
    <div id="entryHost"></div>
    <div class="archMeta" id="archMeta"></div>
    <div class="readActions">
      <button id="backList">← 목록으로</button>
      <button id="btnCopyRead">복사</button>
      <button id="btnContinue">이어 쓰기</button>
      <button class="danger" id="btnDelete">이 초고 지우기</button>
    </div>
  </section>
</div>

<div id="cmtPop"><button id="cmtPopBtn">코멘트 달기</button></div>

<div id="cmtBox" role="dialog" aria-modal="true">
  <div class="card">
    <div class="quoted" id="cmtQuoted"></div>
    <textarea id="cmtText" placeholder="이 대목에 남길 말."></textarea>
    <div class="row">
      <span class="today" id="cmtToday"></span>
      <span class="btns">
        <button class="cancel" id="cmtCancel">취소</button>
        <button class="save" id="cmtSave">코멘트 저장</button>
      </span>
    </div>
  </div>
</div>

<div id="syncBox" role="dialog" aria-modal="true">
  <div class="card">
    <h3>기기 사이 동기화</h3>
    <div class="sline" id="syncState">준비 중…</div>
    <div id="syncSignedOut">
      <input id="syncEmail" type="email" placeholder="이메일 주소" autocomplete="email" inputmode="email">
      <div class="row">
        <span></span>
        <span>
          <button class="ghost" id="syncClose1">닫기</button>
          <button class="primary" id="syncLogin">로그인 링크 받기</button>
        </span>
      </div>
      <div class="note">메일로 온 링크를 누르면 이 기기가 연결됩니다. 맥·아이패드·아이폰에서 한 번씩 하시면 됩니다.</div>
    </div>
    <div id="syncSignedIn" style="display:none">
      <div class="row">
        <button class="ghost" id="syncOut">로그아웃</button>
        <span>
          <button class="ghost" id="syncClose2">닫기</button>
          <button class="primary" id="syncNowBtn">지금 동기화</button>
        </span>
      </div>
      <div class="note" id="syncNote"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

function migrate(){
  if(!db.tombstones) db.tombstones = {};
  if(!db.working) db.working = { id:null, title:"", text:"", updatedAt:null };
  Object.values(db.drafts).forEach(d=>{
    if(!d.comments) d.comments = d.revisions || [];
    delete d.revisions;
    if(!d.updatedAt) d.updatedAt = d.createdAt || new Date().toISOString();
    if(!d.createdAt) d.createdAt = d.updatedAt;
  });
}

/* ================= dates ================= */
const pad = n => String(n).padStart(2,"0");
const WD = ["일","월","화","수","목","금","토"];
function fmtShort(d){ return d.getFullYear()+". "+(d.getMonth()+1)+". "+d.getDate()+"."; }
function fmtTiny(d){ return String(d.getFullYear()).slice(2)+". "+(d.getMonth()+1)+". "+d.getDate()+"."; }
function timeNow(){ const n=new Date(); return pad(n.getHours())+":"+pad(n.getMinutes())+":"+pad(n.getSeconds()); }
const today = new Date();
const todayKey = today.getFullYear()+"-"+pad(today.getMonth()+1)+"-"+pad(today.getDate());
function uid(){ return Date.now()+"-"+Math.random().toString(36).slice(2,7); }

/* ================= word count ================= */
function countWords(t){
  const m = (t||"").trim().match(/\S+/g);
  return m ? m.length : 0;
}
const GOAL = 750;

/* ================= smart quotes ================= */
const LQ="\u201C", RQ="\u201D", LS="\u2018", RS="\u2019";
const OPENERS = /[\s(\[{\u201C\u2018\u2014\u2013\-—–「『]/;
function smartifyText(s){
  return String(s)
    .replace(/(^|[\s(\[{\u201C\u2018\u2014\u2013\-])"/gm, "$1"+LQ)
    .replace(/"/g, RQ)
    .replace(/(^|[\s(\[{\u201C\u2018\u2014\u2013\-])'/gm, "$1"+LS)
    .replace(/'/g, RS);
}
/* live conversion while typing */
function smartQuoteField(el){
  el.addEventListener("input", e=>{
    if(e.inputType && e.inputType.indexOf("insert") !== 0) return;
    const p = el.selectionStart;
    if(p < 1) return;
    const ch = el.value[p-1];
    if(ch !== '"' && ch !== "'") return;
    const prev = p >= 2 ? el.value[p-2] : "";
    const open = !prev || OPENERS.test(prev);
    const rep = ch === '"' ? (open?LQ:RQ) : (open?LS:RS);
    const v = el.value;
    el.value = v.slice(0,p-1) + rep + v.slice(p);
    el.setSelectionRange(p,p);
  });
}

function chime(){
  if(!soundOn) return;
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [[523.25,0],[783.99,.28]].forEach(([f,t])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(0,ctx.currentTime+t);
      g.gain.linearRampToValueAtTime(.18,ctx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+1.4);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+1.5);
    });
  }catch(e){}
}

/* ================= toast ================= */
let toastT;
function toast(msg){
  const el=$("toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2600);
}

/* ================= clipboard ================= */
function copyToClipboard(text){
  const done = ()=>toast("클립보드에 복사했습니다");
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done, ()=>fallback());
  } else fallback();
  function fallback(){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position="fixed"; ta.style.top="-1000px";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); done(); }
    catch(e){ toast("복사하지 못했습니다"); }
    document.body.removeChild(ta);
  }
}
/* 코멘트를 단 자리는 ‘…’, 코멘트는 (…) 안에 */
function draftToPlain(d){
  const cs = (d.comments||[]).slice().sort((a,b)=>a.start-b.start);
  let out = "", pos = 0;
  cs.forEach(c=>{
    out += d.text.slice(pos, c.start);
    out += LS + d.text.slice(c.start, c.end) + RS + "(" + c.note + ")";
    pos = c.end;
  });
  out += d.text.slice(pos);
  return smartifyText((d.title ? d.title + "\n\n" : "") + out);
}

function canSave(){
  if(db.working.id && db.drafts[db.working.id]) return true;   /* 이미 저장한 초고를 이어 쓰는 중 */
  return countWords(editor.value) >= GOAL;
}
function refreshProgress(live){
  const n = countWords(editor.value);
  wc.textContent = n;
  charStat.textContent = editor.value.length ? editor.value.length.toLocaleString()+"자" : "";
  const ratio = Math.min(n/GOAL, 1);
  sun.style.width = (ratio*100)+"%";
  horizon.classList.toggle("done", n>=GOAL);
  document.querySelectorAll(".page").forEach((p,i)=>{
    const seg = Math.max(0, Math.min(1, (n - i*250)/250));
    p.style.setProperty("--fill", (seg*100)+"%");
    p.classList.toggle("full", seg>=1);
  });
  document.title = n>=GOAL ? "초고 · 완성" : (n>0 ? "초고 · "+n+"/750" : "초고");
  const done = n>=GOAL;
  doneNote.classList.toggle("show", done);
  if(done && !reached){ reached=true; if(live){ chime(); toast("750단어. 초고 한 편이 끝났습니다."); } }
  if(!done) reached=false;

  const ok = canSave();
  btnSave.disabled = !ok;
  btnSave.title = ok ? "" : "750단어를 채우면 저장할 수 있습니다";
  saveHint.textContent = ok ? "" : (GOAL-n)+"단어를 더 쓰면 저장할 수 있습니다";
}

/* ================= 제목으로 저장 ================= */
function remapComments(cs, oldText, newText){
  const out=[];
  (cs||[]).forEach(c=>{
    const q = c.quote != null ? c.quote : oldText.slice(c.start, c.end);
    if(!q) return;
    let s;
    if(newText.slice(c.start, c.end) === q) s = c.start;
    else { const i = newText.indexOf(q); if(i < 0) return; s = i; }
    out.push(Object.assign({}, c, { start:s, end:s+q.length, quote:q }));
  });
  out.sort((a,b)=>a.start-b.start);
  const clean=[]; let last=-1;
  out.forEach(c=>{ if(c.start>=last){ clean.push(c); last=c.end; } });
  return clean;
}

function saveDraft(){
  if(!canSave()){
    toast("750단어를 채우면 저장할 수 있습니다");
    editor.focus();
    return;
  }
  const title = titleInput.value.trim();
  const text = editor.value;
  if(!text.trim()){ toast("아직 쓴 내용이 없습니다"); editor.focus(); return; }
  if(!title){ toast("제목을 붙여 주세요"); titleInput.focus(); return; }
  const now = new Date().toISOString();
  let id = db.working.id;

  if(id && db.drafts[id]){
    const d = db.drafts[id];
    if(d.text !== text) d.comments = remapComments(d.comments, d.text, text);
    d.title = title; d.text = text; d.words = countWords(text); d.updatedAt = now;
  } else {
    const dup = Object.values(db.drafts).find(d => d.title === title);
    if(dup){
      const over = confirm("같은 제목의 초고가 있습니다.\n\n확인 = 그 초고에 덮어쓰기\n취소 = 다른 초고로 따로 저장");
      if(over){
        id = dup.id;
        const d = db.drafts[id];
        if(d.text !== text) d.comments = remapComments(d.comments, d.text, text);
        d.text = text; d.words = countWords(text); d.updatedAt = now;
      }
    }
    if(!id || !db.drafts[id]){
      id = uid();
      db.drafts[id] = { id, title, text, words:countWords(text), createdAt:now, updatedAt:now, comments:[] };
    }
  }
  db.working.id = id; db.working.title = title; db.working.text = text;
  db.working.updatedAt = now;
  persist();
  scheduleSync(300);
  saveStat.textContent = "「"+title+"」 저장됨 · "+timeNow();
  refreshProgress(false);
  toast("「"+title+"」 초고를 저장했습니다");
}

/* ================= board (지난 초고) ================= */
function listDrafts(useFilter){
  let arr = Object.values(db.drafts);
  if(useFilter){
    const q = ($("q").value||"").trim().toLowerCase();
    if(q) arr = arr.filter(d => (d.title||"").toLowerCase().includes(q) || (d.text||"").toLowerCase().includes(q));
  }
  const s = $("sortSel").value;
  arr.sort((a,b)=>{
    if(s==="old") return (a.createdAt||"").localeCompare(b.createdAt||"");
    if(s==="title") return (a.title||"").localeCompare(b.title||"","ko");
    if(s==="cmt") return ((b.comments||[]).length - (a.comments||[]).length) || (b.createdAt||"").localeCompare(a.createdAt||"");
    return (b.createdAt||"").localeCompare(a.createdAt||"");
  });
  return arr;
}

function renderBoard(){
  const host = $("boardList");
  host.innerHTML = "";
  const arr = listDrafts(true);
  const total = Object.keys(db.drafts).length;

  if(!arr.length){
    const div = document.createElement("div");
    div.className = "emptyDay";
    div.innerHTML = total ? "찾는 제목의 초고가 없습니다.<br><br>" : "아직 저장된 초고가 없습니다.<br><br>";
    const b = document.createElement("button");
    b.textContent = total ? "찾기 지우기" : "첫 초고를 쓰러 가기 →";
    b.onclick = ()=>{ if(total){ $("q").value=""; renderBoard(); } else show("write"); };
    div.appendChild(b);
    host.appendChild(div);
    $("boardCount").textContent = total ? "저장된 초고 "+total+"편" : "";
    return;
  }

  arr.forEach(d=>{
    const row = document.createElement("div");
    row.className = "item";
    row.onclick = ()=>openDraft(d.id);

    const t = document.createElement("div");
    t.className = "t";
    const tt = document.createElement("div");
    tt.className = "tt";
    tt.textContent = d.title || "제목 없음";
    t.appendChild(tt);
    const peek = document.createElement("span");
    peek.className = "peek";
    peek.textContent = (d.text||"").replace(/\s+/g," ").trim().slice(0,90);
    t.appendChild(peek);
    row.appendChild(t);

    const w = document.createElement("span");
    w.className = "col w";
    w.textContent = (d.words != null ? d.words : countWords(d.text))+"단어";
    row.appendChild(w);

    const c = document.createElement("span");
    c.className = "col c";
    const cn = (d.comments||[]).length;
    c.innerHTML = cn ? "<b>"+cn+"</b>" : "—";
    row.appendChild(c);

    const dt = document.createElement("span");
    dt.className = "col d";
    dt.textContent = d.createdAt ? fmtTiny(new Date(d.createdAt)) : "";
    row.appendChild(dt);

    const x = document.createElement("span");
    x.className = "col x";
    const cp = document.createElement("button");
    cp.className = "act";
    cp.textContent = "복사";
    cp.title = "코멘트까지 포함해 플레인텍스트로 복사";
    cp.onclick = ev=>{ ev.stopPropagation(); copyToClipboard(draftToPlain(d)); };
    x.appendChild(cp);
    const del = document.createElement("button");
    del.className = "act del";
    del.textContent = "지움";
    del.onclick = ev=>{ ev.stopPropagation(); deleteDraft(d.id); };
    x.appendChild(del);
    row.appendChild(x);

    host.appendChild(row);
  });
  $("boardCount").textContent = "저장된 초고 "+total+"편"+(arr.length!==total ? " · 찾은 것 "+arr.length+"편" : "");
}

function deleteDraft(id){
  const d = db.drafts[id];
  if(!d) return;
  if(!confirm("「"+(d.title||"제목 없음")+"」 초고를 지울까요?\n달아 놓은 코멘트까지 함께 사라지고, 되돌릴 수 없습니다.")) return;
  delete db.drafts[id];
  db.tombstones[id] = new Date().toISOString();
  if(db.working.id === id){ db.working.id = null; refreshProgress(false); }
  persist();
  scheduleSync(300);
  toast("초고를 지웠습니다");
  if(readView.style.display==="block") show("board");
  else renderBoard();
}

/* ================= read & comment ================= */
let curId = null;

function openDraft(id){
  const d = db.drafts[id];
  if(!d) return;
  curId = id;
  renderRead();
  show("read");
}

function renderRead(){
  const d = db.drafts[curId];
  if(!d){ show("board"); return; }
  const created = d.createdAt ? new Date(d.createdAt) : null;
  $("readAgo").textContent = created ? "쓴 날 · "+fmtShort(created) : "초고";
  $("readTitle").textContent = d.title || "제목 없음";
  const order = listDrafts(false).map(x=>x.id);
  const i = order.indexOf(curId);
  $("navPrev").disabled = i <= 0;
  $("navNext").disabled = i < 0 || i >= order.length-1;
  buildJump();
  renderEntry($("entryHost"), curId, d);
  const w = d.words != null ? d.words : countWords(d.text);
  const cn = (d.comments||[]).length;
  $("archMeta").textContent = w+"단어 · 코멘트 "+cn+"개 · 본문은 그대로 두고, 고칠 대목을 표시해 코멘트를 답니다. 문장을 드래그해 보세요.";
}

function buildJump(){
  const sel = $("draftJump");
  sel.innerHTML = "";
  const opt0 = document.createElement("option");
  opt0.value=""; opt0.textContent="저장된 초고로 이동…";
  sel.appendChild(opt0);
  listDrafts(false).forEach(d=>{
    const o = document.createElement("option");
    o.value = d.id;
    const cn = (d.comments||[]).length;
    o.textContent = (d.title||"제목 없음")+" ("+(cn ? "코멘트 "+cn : (d.words!=null?d.words:countWords(d.text))+"단어")+")";
    if(d.id===curId) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = ()=>{ if(sel.value) openDraft(sel.value); };
}

$("navPrev").onclick = ()=>{
  const order = listDrafts(false).map(x=>x.id);
  const i = order.indexOf(curId);
  if(i>0) openDraft(order[i-1]);

$("navNext").onclick = ()=>{

/* ================= entry rendering with comments ================= */
function renderEntry(host, id, d){
  host.innerHTML = "";
  const body = document.createElement("div");
  body.className = "entryBody";
  body.dataset.id = id;

  const text = d.text;
  const cs = (d.comments||[]).slice().sort((a,b)=>a.start-b.start);
  let pos = 0;
  cs.forEach(c=>{
    if(c.start > pos) body.appendChild(document.createTextNode(text.slice(pos, c.start)));
    const hl = document.createElement("span");
    hl.className = "hl";
    hl.appendChild(document.createTextNode(text.slice(c.start, c.end)));
    body.appendChild(hl);

    const cmt = document.createElement("span");
    cmt.className = "cmt";
    cmt.contentEditable = "false";
    const mark = document.createElement("span");
    mark.className = "cmark";
    mark.textContent = " (";
    cmt.appendChild(mark);
    cmt.appendChild(document.createTextNode(c.note));
    const mark2 = document.createElement("span");
    mark2.className = "cmark";
    mark2.textContent = ") ";
    cmt.appendChild(mark2);
    const cd = document.createElement("span");
    cd.className = "cdate";
    cd.textContent = "〔"+c.date+"〕";
    cmt.appendChild(cd);
    const del = document.createElement("button");
    del.className = "cdel";
    del.textContent = "지움";
    del.onclick = ev=>{
      ev.stopPropagation();
      if(confirm("이 코멘트를 지울까요?")){
        d.comments = (d.comments||[]).filter(x=>x.id!==c.id);
        d.updatedAt = new Date().toISOString();
        persist(); scheduleSync(300); renderRead();
      }
    };
    cmt.appendChild(del);
    body.appendChild(cmt);
    pos = c.end;
  });
  if(pos < text.length) body.appendChild(document.createTextNode(text.slice(pos)));
  host.appendChild(body);

  body.addEventListener("mouseup", ()=>maybeShowPop(body));
  body.addEventListener("touchend", ()=>setTimeout(()=>maybeShowPop(body),10));
}

/* --- selection offset relative to original text (skip .cmt contents) --- */
function offsetInBody(body, node, nodeOffset){
  let acc = 0;
  const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      return n.parentElement && n.parentElement.closest(".cmt")
        ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
    }
  });
  let cur;
  while((cur = walker.nextNode())){
    if(cur === node) return acc + nodeOffset;
    acc += cur.nodeValue.length;
  }
  return null;
}

let pendingSel = null;
function maybeShowPop(body){
  const pop = $("cmtPop");
  const sel = window.getSelection();
  pop.style.display = "none";
  pendingSel = null;
  if(!sel || sel.isCollapsed || sel.rangeCount===0) return;
  const range = sel.getRangeAt(0);
  if(!body.contains(range.startContainer) || !body.contains(range.endContainer)) return;
  if(range.startContainer.nodeType!==3 || range.endContainer.nodeType!==3) return;
  if(range.startContainer.parentElement.closest(".cmt") || range.endContainer.parentElement.closest(".cmt")) return;

  const s = offsetInBody(body, range.startContainer, range.startOffset);
  const eo = offsetInBody(body, range.endContainer, range.endOffset);
  if(s==null || eo==null || eo<=s) return;

  const id = body.dataset.id;
  const d = db.drafts[id];
  const overlap = (d.comments||[]).some(c => s < c.end && eo > c.start);
  if(overlap){ toast("이미 코멘트를 단 부분과 겹칩니다"); return; }

  pendingSel = { id, start:s, end:eo, text: d.text.slice(s,eo) };
  const rect = range.getBoundingClientRect();
  pop.style.display = "block";
  pop.style.left = Math.max(12, rect.left + rect.width/2 - pop.offsetWidth/2 + window.scrollX) + "px";
  pop.style.top = (rect.top + window.scrollY - pop.offsetHeight - 10) + "px";
}
document.addEventListener("mousedown", e=>{
  if(!e.target.closest("#cmtPop")) $("cmtPop").style.display="none";
});

$("cmtPopBtn").onclick = ()=>{
  if(!pendingSel) return;
  $("cmtPop").style.display="none";
  $("cmtQuoted").textContent = LS + (pendingSel.text.length>160 ? pendingSel.text.slice(0,160)+"…" : pendingSel.text) + RS;
  $("cmtText").value = "";
  $("cmtToday").textContent = "코멘트한 날 · "+fmtShort(new Date());
  $("cmtBox").classList.add("show");
  setTimeout(()=>$("cmtText").focus(), 30);
};
$("cmtCancel").onclick = ()=>$("cmtBox").classList.remove("show");
$("cmtBox").addEventListener("mousedown", e=>{ if(e.target===$("cmtBox")) $("cmtBox").classList.remove("show"); });
$("cmtSave").onclick = ()=>{
  if(!pendingSel) return;
  const note = $("cmtText").value.trim();
  if(!note){ $("cmtText").focus(); return; }
  const d = db.drafts[pendingSel.id];
  if(!d) return;
  if(!d.comments) d.comments = [];
  d.comments.push({
    id: uid(),
    start: pendingSel.start, end: pendingSel.end,
    quote: pendingSel.text,
    note, date: fmtShort(new Date())
  });
  d.updatedAt = new Date().toISOString();
  persist();
  scheduleSync(300);
  $("cmtBox").classList.remove("show");
  renderRead();
  toast("코멘트를 달았습니다");
  pendingSel = null;
};

/* ================= export / import ================= */
$("btnExport").onclick = ()=>{
  const blob = new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "초고_백업_"+todayKey+".json";

  URL.revokeObjectURL(a.href);

$("btnImport").onclick = ()=>$("importFile").click();
$("importFile").addEventListener("change", ev=>{
  const f = ev.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!data.drafts) throw 0;
      const mode = confirm("확인 = 합치기(기존 초고 유지, 새 초고만 추가)\n취소 = 전체 덮어쓰기");
      if(mode){
        Object.keys(data.drafts).forEach(k=>{ if(!db.drafts[k]) db.drafts[k]=data.drafts[k]; });
      } else {
        db = Object.assign({ drafts:{}, working:{id:null,title:"",text:""}, soundOn:true }, data);
        if(!db.drafts) db.drafts={};
        if(!db.working) db.working={id:null,title:"",text:""};
        titleInput.value = db.working.title||"";
        editor.value = db.working.text||"";
      }
      migrate();
      persist();
      refreshProgress(false);
      toast("가져오기 완료");
      if(boardView.style.display==="block") renderBoard();
      if(readView.style.display==="block"){ if(db.drafts[curId]) renderRead(); else show("board"); }
    }catch(e){ alert("올바른 백업 파일이 아닙니다."); }
  };
  r.readAsText(f);
  ev.target.value = "";
});

/* ================= 동기화 (Supabase) ================= */
const SB = (window.supabase && SUPA_URL) ? window.supabase.createClient(SUPA_URL, SUPA_KEY, {
  auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:"chogo_auth" }
}) : null;

let session = null, syncing = false, lastPushAt = 0, lastSyncAt = null, chan = null;
let workT = null, syncT = null, remotePending = null, skipWorkingTs = 0;

const DEVICE = (function(){
  const u = navigator.userAgent;
  if(/iPad/.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1)) return "아이패드";
  if(/iPhone/.test(u)) return "아이폰";
  if(/Macintosh|Mac OS X/.test(u)) return "맥";
  if(/Android/.test(u)) return "안드로이드";
  return "다른 기기";
})();

const T = x => x ? Date.parse(x) : 0;
function fmtClock(iso){ const d=new Date(iso); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function setDot(cls){ $("syncDot").className = "dot" + (cls ? " "+cls : ""); }

function updateSyncUI(){
  if(!SB){
    $("syncState").textContent = "동기화 라이브러리를 불러오지 못했습니다. 인터넷에 연결된 상태에서 https 주소로 열어 주세요.";
    $("syncSignedOut").style.display="none"; $("syncSignedIn").style.display="none";
    setDot("err"); return;
  }
  if(session){
    $("syncSignedOut").style.display="none";
    $("syncSignedIn").style.display="block";
    $("syncState").textContent = session.user.email + " · 이 기기는 " + DEVICE +
      (lastSyncAt ? " · 마지막 동기화 " + fmtClock(lastSyncAt) : "");
    $("syncNote").textContent = "저장한 초고와 코멘트는 곧바로 올라가고, 다른 기기의 변화는 실시간으로 내려옵니다. 쓰는 중인 원고는 덮어쓰지 않고 이어받을지 물어봅니다.";
    setDot(navigator.onLine ? "ok" : "warn");
  } else {
    $("syncSignedOut").style.display="block";
    $("syncSignedIn").style.display="none";
    $("syncState").textContent = "아직 연결되지 않았습니다. 지금은 이 브라우저 안에만 저장됩니다.";
    setDot("");
  }
}

/* ---- row mapping ---- */
function toRow(d){
  return { id:d.id, title:d.title||"", body:d.text||"",
    words: d.words!=null ? d.words : countWords(d.text),
    comments: d.comments||[], created_at:d.createdAt, updated_at:d.updatedAt, deleted:false };
}
function fromRow(r){
  return { id:r.id, title:r.title||"", text:r.body||"",
    words: r.words!=null ? r.words : countWords(r.body||""),
    comments: r.comments||[], createdAt:r.created_at, updatedAt:r.updated_at };
}
function refreshLive(){
  if(boardView.style.display==="block") renderBoard();
  if(readView.style.display==="block"){ if(db.drafts[curId]) renderRead(); else show("board"); }
}

/* ---- 초고 동기화 ---- */
function scheduleSync(ms){
  if(!SB || !session) return;
  clearTimeout(syncT);
  syncT = setTimeout(()=>syncNow(true), ms||900);
}

async function syncNow(quiet){
  if(!SB || !session || syncing) return;
  if(!navigator.onLine){ setDot("warn"); return; }
  syncing = true; setDot("busy");
  try{
    const { data:rows, error } = await SB.from("drafts").select("*");
    if(error) throw error;
    const remote = {};
    (rows||[]).forEach(r => remote[r.id] = r);

    let changed = false;
    (rows||[]).forEach(r=>{
      const local = db.drafts[r.id];
      const rt = T(r.updated_at);
      if(r.deleted){
        if(local && T(local.updatedAt) <= rt){ delete db.drafts[r.id]; changed = true; }
        db.tombstones[r.id] = r.updated_at;
        return;
      }
      if(db.tombstones[r.id] && T(db.tombstones[r.id]) >= rt) return;
      if(!local || T(local.updatedAt) < rt){ db.drafts[r.id] = fromRow(r); changed = true; }
    });

    const up = [];
    Object.values(db.drafts).forEach(d=>{
      const r = remote[d.id];
      if(!r || r.deleted || T(r.updated_at) < T(d.updatedAt)) up.push(toRow(d));
    });
    Object.keys(db.tombstones).forEach(id=>{
      const r = remote[id], ts = db.tombstones[id];
      if(!r || (!r.deleted && T(r.updated_at) <= T(ts))){
        up.push({ id, title:"", body:"", words:0, comments:[], created_at:ts, updated_at:ts, deleted:true });
      }
    });
    if(up.length){
      lastPushAt = Date.now();
      const { error:e2 } = await SB.from("drafts").upsert(up);
      if(e2) throw e2;
    }

    await syncWorking();

    persist();
    if(changed) refreshLive();
    lastSyncAt = new Date().toISOString();
    setDot(navigator.onLine ? "ok" : "warn");
    updateSyncUI();
    if(!quiet) toast("동기화했습니다 · 초고 " + Object.keys(db.drafts).length + "편");
  }catch(e){
    setDot("err");
    $("syncState").textContent = "동기화하지 못했습니다 · " + (e.message || e);
    if(!quiet) toast("동기화하지 못했습니다");
  }finally{
    syncing = false;
  }
}

/* ---- 쓰는 중인 원고 ---- */
function schedulePushWorking(){
  if(!SB || !session) return;
  clearTimeout(workT);
  workT = setTimeout(pushWorking, 2500);
}
async function pushWorking(){
  if(!SB || !session || !navigator.onLine) return;
  try{
    lastPushAt = Date.now();
    await SB.from("working").upsert({
      user_id: session.user.id,
      draft_id: db.working.id,
      title: db.working.title || "",
      body: db.working.text || "",
      device: DEVICE,
      updated_at: db.working.updatedAt || new Date().toISOString()
    });
  }catch(e){}
}
async function syncWorking(){
  const { data, error } = await SB.from("working").select("*").maybeSingle();
  if(error) return;
  if(!data){ if((db.working.text||"").trim()) pushWorking(); return; }
  const rt = T(data.updated_at), lt = T(db.working.updatedAt);
  if(rt <= lt){ if(rt < lt) pushWorking(); return; }
  if((data.body||"") === (db.working.text||"") && (data.title||"") === (db.working.title||"")){
    db.working.updatedAt = data.updated_at; return;
  }
  const localEmpty = !(db.working.text||"").trim();
  const focused = document.activeElement === editor || document.activeElement === titleInput;
  if(localEmpty && !focused){ applyRemoteWorking(data); return; }
  if(skipWorkingTs >= rt) return;
  remotePending = data;
  showRemoteBanner(data);
}
function showRemoteBanner(r){
  const w = countWords(r.body||"");
  $("remoteMsg").textContent = (r.device||"다른 기기") + "에서 쓰던 원고가 있습니다 · " + w + "단어 · " +
    fmtShort(new Date(r.updated_at)) + " " + fmtClock(r.updated_at) +
    ". 이어받으면 지금 이 화면의 글이 그것으로 바뀝니다.";
  $("remoteBanner").classList.add("show");
}
function hideRemoteBanner(){ $("remoteBanner").classList.remove("show"); remotePending = null; }
function applyRemoteWorking(r){
  db.working = { id: r.draft_id || null, title: r.title || "", text: r.body || "", updatedAt: r.updated_at };
  titleInput.value = db.working.title;
  editor.value = db.working.text;
  reached = countWords(editor.value) >= GOAL;
  persist();
  refreshProgress(false);
  saveStat.textContent = (r.device || "다른 기기") + "에서 쓰던 원고를 이어받았습니다 · " + fmtClock(r.updated_at);
  hideRemoteBanner();
}
$("remoteTake").onclick = ()=>{ if(remotePending) applyRemoteWorking(remotePending); };
$("remoteSkip").onclick = ()=>{ if(remotePending) skipWorkingTs = T(remotePending.updated_at); hideRemoteBanner(); };

/* ---- 실시간 구독 ---- */
function subscribeRealtime(){
  if(!SB || !session) return;
  unsubscribeRealtime();
  chan = SB.channel("chogo-"+session.user.id)
    .on("postgres_changes", { event:"*", schema:"public", table:"drafts" },
        ()=>{ if(Date.now()-lastPushAt > 2500) scheduleSync(900); })
    .on("postgres_changes", { event:"*", schema:"public", table:"working" },
        ()=>{ if(Date.now()-lastPushAt > 2500) scheduleSync(900); })
    .subscribe();
}
function unsubscribeRealtime(){ if(chan){ SB.removeChannel(chan); chan = null; } }

/* ---- 다이얼로그 ---- */
$("btnSync").onclick = ()=>{ updateSyncUI(); $("syncBox").classList.add("show"); if(session) syncNow(true); };
$("syncClose1").onclick = ()=>$("syncBox").classList.remove("show");
$("syncClose2").onclick = ()=>$("syncBox").classList.remove("show");
$("syncBox").addEventListener("mousedown", e=>{ if(e.target===$("syncBox")) $("syncBox").classList.remove("show"); });
$("syncNowBtn").onclick = ()=>syncNow(false);
$("syncLogin").onclick = async ()=>{
  if(!SB) return;
  const email = $("syncEmail").value.trim();
  if(!email){ $("syncEmail").focus(); return; }
  $("syncState").textContent = "링크를 보내는 중…";
  try{
    const { error } = await SB.auth.signInWithOtp({
      email,
      options:{ emailRedirectTo: location.origin + location.pathname }
    });
    $("syncState").textContent = error
      ? ("보내지 못했습니다 · " + error.message)
      : (email + " 로 링크를 보냈습니다. 같은 기기에서 그 링크를 눌러 주세요.");
  }catch(e){ $("syncState").textContent = "보내지 못했습니다 · " + (e.message||e); }
};
$("syncEmail").addEventListener("keydown", e=>{ if(e.key==="Enter") $("syncLogin").click(); });
$("syncOut").onclick = async ()=>{
  if(!SB) return;
  if(!confirm("이 기기의 연결을 끊을까요?\n브라우저에 저장된 초고는 그대로 남습니다.")) return;
  await SB.auth.signOut();
  session = null; unsubscribeRealtime(); updateSyncUI();
  toast("연결을 끊었습니다");
};

/* ---- 되풀이 조건 ---- */
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) scheduleSync(200); });
window.addEventListener("focus", ()=>scheduleSync(400));
window.addEventListener("online", ()=>{ updateSyncUI(); scheduleSync(300); });
window.addEventListener("offline", ()=>setDot("warn"));
window.addEventListener("beforeunload", ()=>{ if(db.working.text) pushWorking(); });
setInterval(()=>{ if(!document.hidden) scheduleSync(100); }, 120000);

/* ---- 시작 ---- */
(async function initSync(){
  if(!SB){ updateSyncUI(); return; }
  try{
    const { data } = await SB.auth.getSession();
    session = data.session || null;
  }catch(e){}
  if(location.hash.indexOf("access_token") > -1 || location.hash.indexOf("error=") > -1){
    history.replaceState(null, "", location.pathname + location.search);
  }
  SB.auth.onAuthStateChange((ev, s)=>{
    const had = !!session;
    session = s || null;
    updateSyncUI();
    if(session && !had){ subscribeRealtime(); syncNow(true); toast("동기화가 연결되었습니다"); }
    if(!session && had) unsubscribeRealtime();
  });
  updateSyncUI();
  if(session){ subscribeRealtime(); syncNow(true); }
})();
</script>
