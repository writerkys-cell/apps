<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다녀올게</title>
<style>
  :root{
    --bg:#020603;
    --g:#39ff7a;          /* 형광 초록 */
    --g2:#7dffa6;         /* 밝은 줄 */
    --gd:#1f9e4a;         /* 흐린 줄 */
    --gx:#0f4a24;         /* 아주 흐림 */
    --fs:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{
    font-family:"D2Coding","Menlo","Apple SD Gothic Neo",monospace;
    font-size:var(--fs);line-height:1.7;color:var(--g);
    -webkit-font-smoothing:antialiased;
  }

  /* ── 브라운관 ───────────────────── */
  .crt{
    position:fixed;inset:0;padding:5vh 6vw 4vh;
    background:radial-gradient(ellipse at center,#06140a 0%,var(--bg) 70%,#000 100%);
    display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:"head head" "setup setup" "screen side" "bottom side";column-gap:3vw;
    text-shadow:0 0 2px currentColor,0 0 10px rgba(57,255,122,.35);
  }
  .crt::before{ /* 주사선 */
    content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.28) 3px);
  }
  .crt::after{ /* 유리 가장자리 어둠 */
    content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
    box-shadow:inset 0 0 120px 30px #000;border-radius:18px;
  }

  header{display:flex;justify-content:space-between;color:var(--gd);font-size:.75em;letter-spacing:.06em;
         border-bottom:1px dashed var(--gx);padding-bottom:.6em}

  /* 쌓이는 줄 */
  #screen{overflow-y:auto;scrollbar-width:none;padding-right:1em}
  #screen::-webkit-scrollbar{display:none}
  .ln{white-space:pre-wrap;word-break:keep-all}
  .ln .t{color:var(--gd);margin-right:1.2em}
  .ln.dim{color:var(--gd)}
  .ln.dim .t{color:#1a7a3c}
  .ln.big{font-size:1.75em;line-height:1.45;color:var(--g2);margin:.35em 0 .5em;
          text-shadow:0 0 3px currentColor,0 0 18px rgba(125,255,166,.45)}
  .ln.rule{color:var(--gx);overflow:hidden;white-space:nowrap}
  .ln.gap{height:.8em}
  .ln.new{animation:on .5s ease-out}
  @keyframes on{from{opacity:0;filter:brightness(2.5)}to{opacity:1;filter:none}}

  /* 아래 입력줄 */
  footer{display:flex;align-items:flex-end;gap:1.2em;border-top:1px dashed var(--gx);padding-top:1em}
  .prompt{flex:1;display:flex;gap:.6em;align-items:flex-start;min-width:0}
  .prompt .ps{color:var(--gd);white-space:nowrap}
  textarea{
    flex:1;background:transparent;border:0;outline:0;resize:none;
    font:inherit;color:var(--g2);text-shadow:inherit;caret-color:var(--g);
    line-height:1.7;min-height:1.7em;
  }
  textarea::placeholder{color:var(--gx)}
  .msg{flex:1;color:var(--gd)}

  button{
    font:inherit;font-size:.9em;color:var(--bg);background:var(--g);border:0;cursor:pointer;
    padding:.35em 1.1em;letter-spacing:.08em;white-space:nowrap;
    box-shadow:0 0 14px rgba(57,255,122,.55);text-shadow:none;
  }
  button:hover{background:var(--g2)}
  button:active{transform:translateY(1px)}
  button.ghost{background:transparent;color:var(--g);box-shadow:inset 0 0 0 1px var(--g),0 0 14px rgba(57,255,122,.3);
               text-shadow:inherit}
  .key{color:var(--gx);font-size:.65em;margin-left:.6em}

  .cursor{display:inline-block;width:.6em;height:1.1em;background:var(--g);vertical-align:-.15em;
          animation:blink 1.1s steps(1) infinite;box-shadow:0 0 8px var(--g)}
  @keyframes blink{50%{opacity:0}}
  header a{color:var(--gd);text-decoration:none;border-bottom:1px dotted var(--gx)}
  header a.on{color:var(--g)}
  header a:hover{color:var(--g2)}
  header{grid-area:head;margin-bottom:2.2vh}
  #setup{grid-area:setup;margin-bottom:2.2vh}
  #screen{grid-area:screen}
  .bottom{grid-area:bottom;margin-top:2.2vh}

  /* ── 오른쪽 루틴 칸 ── */
  #side{grid-area:side;width:clamp(240px,21vw,340px);border-left:1px dashed var(--gx);padding-left:2.4vw;
        display:flex;flex-direction:column;gap:.35em;font-size:.85em;overflow:hidden}
  #side .hd{display:flex;justify-content:space-between;color:var(--gd);letter-spacing:.06em;margin-bottom:.4em}
  #side .hd b{color:var(--g2);font-weight:normal}
  #side .grp{color:var(--gd);font-size:.8em;margin-top:.9em;letter-spacing:.1em}
  #side .r{display:grid;grid-template-columns:1.3em minmax(0,1fr) auto;gap:.4em;align-items:baseline}
  #side .r .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #side .r .st{font-size:.8em;color:var(--gd);white-space:nowrap}
  #side .r.todo{color:var(--g2)}
  #side .r.todo .mk{color:var(--g)}
  #side .r.done{color:var(--gd)}
  #side .r.done .mk{color:var(--gd)}
  #side .r.part .mk,#side .r.part .st{color:#c9ff5a}
  #side .r.miss .mk,#side .r.miss .st{color:#ffb347}
  #side .empty,#side .foot{color:var(--gx);font-size:.8em}
  #side .foot{margin-top:auto;padding-top:1em}
  @media (max-width:1099px){
    .crt{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "setup" "screen" "bottom"}
    #side{display:none}
  }
  #setup{display:grid;gap:.5em;font-size:.85em;border:1px dashed var(--gx);padding:1em 1.2em}
  #setup label{display:flex;gap:1em;color:var(--gd)}
  #setup input{flex:1;background:transparent;border:0;border-bottom:1px solid var(--gx);outline:0;
               font:inherit;color:var(--g2);text-shadow:inherit;caret-color:var(--g)}
  #setup input::placeholder{color:var(--gx)}
  .src{color:var(--gd)}
  .ln .tag{color:var(--g2)}
  .now{color:var(--gd);font-size:.8em;margin-bottom:.4em}
  .now b{color:var(--g);font-weight:normal}
  .btns{display:flex;gap:.6em}
  /* 일어서는 이유 */
  #why{position:relative;display:grid;gap:.7em;border:1px dashed var(--gd);padding:1em 1.2em;margin-bottom:.4em}
  #why .q{color:var(--g2)}
  #why .chips{display:flex;flex-wrap:wrap;gap:.5em}
  #why .chips button{font-size:.85em;background:transparent;color:var(--g);box-shadow:inset 0 0 0 1px var(--gx);text-shadow:inherit}
  #why .chips button.sel{background:var(--g);color:var(--bg);text-shadow:none;box-shadow:0 0 14px rgba(57,255,122,.55)}
  #why .chips button i{font-style:normal;opacity:.6;margin-right:.4em}
  #why .sub{color:var(--gx);font-size:.75em}
  .bottom{display:grid}
  /* ── 화면 보호 ── */
  #dark{position:fixed;inset:0;background:#000;z-index:50;opacity:0;pointer-events:none;transition:opacity 1s linear}
  #dark.on{pointer-events:auto;cursor:none}
  #float{position:absolute;left:10vw;top:30vh;max-width:62vw;opacity:0;transition:opacity 2s linear;
         font-family:"D2Coding","Menlo","Apple SD Gothic Neo",monospace;color:var(--g);
         text-shadow:0 0 3px currentColor,0 0 14px rgba(57,255,122,.4)}
  #float .f1{font-size:calc(var(--fs)*2);line-height:1.35;word-break:keep-all}
  #float .f2{font-size:var(--fs);color:var(--g);opacity:.75;margin-top:.4em}
  #modeLbl{cursor:pointer;user-select:none}
  #modeLbl.th{color:#c9ff5a}
  #wl{color:var(--gx)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="crt">
  <header>
    <span>다녀올게 · 자리 비움 기록기 v4</span>
    <span><a id="bjLink" href="#">방점 연결 없음</a> &nbsp; <span id="wl"></span> <span id="clock"></span></span>
  </header>

  <form id="setup" hidden>
    <div class="ln">방점 연결 — 방점의 기록은 읽기만 하고, 메모와 자리 비움만 방점의 요청 표(bangjeom_act)에 보냅니다.</div>
    <label>주소 <input id="cfUrl" placeholder="https://xxxx.supabase.co" autocomplete="off"></label>
    <label>키 &nbsp; <input id="cfKey" type="password" placeholder="방점 설정에 넣은 것과 같은 키" autocomplete="off"></label>
    <label>목록 <input id="cfList" placeholder="bangjeom" autocomplete="off"></label>
    <div class="ln dim">비워 두면 같은 브라우저 주소에 있는 방점의 설정을 빌립니다 (깃허브에 올렸을 때만 해당).</div>
    <div><button type="submit">저장하고 읽어 오기</button> <button type="button" class="ghost" id="cfClose">닫기</button></div>
  </form>

  <main id="screen"></main>

  <aside id="side"></aside>

  <div class="bottom">
    <footer>
      <div style="flex:1;min-width:0" id="here">
        <div class="now" id="nowLine"></div>
        <div class="prompt">
          <span class="ps" id="modeLbl" title="Tab으로 바꾸기">메모 &gt;</span>
          <textarea id="what" rows="1" placeholder="" autofocus></textarea>
        </div>
      </div>
      <div class="msg" id="away" hidden>돌아오면 단추를 누르세요 <span class="cursor"></span></div>
      <div class="btns">
        <button class="ghost" id="memoBtn">적기</button>
        <button id="btn">다녀올게</button>
      </div>
    </footer>
  </div>
</div>
<div id="dark"><div id="float"><div class="f1" id="f1"></div><div class="f2" id="f2"></div></div></div>

<script>
/* ═════════ 저장 (v1부터 같은 자리) ═════════
   S.state 'here'|'away' · S.current 비운 중인 것 · S.log 지난 자리 비움 · S.notes 내가 적은 메모·자리 비움(화면용) · S.out 아직 못 보낸 것 */
const KEY = 'danyeo.v1';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null } catch { return null } };
let S = Object.assign({ state:'here', current:null, log:[], notes:[], out:[] }, load() || {});
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const $ = id => document.getElementById(id);

/* ═════════ 시간 말 ═════════ */
const pad = n => String(n).padStart(2,'0');
const hm  = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}` };
const md  = t => { const d = new Date(t); return `${d.getMonth()+1}.${pad(d.getDate())}` };
const sameDay = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
const dur = ms => {
  const m = Math.floor(ms/60000);
  if (m < 1) return '1분이 안 되게';
  if (m < 60) return `${m}분`;
  const h = Math.floor(m/60), r = m%60;
  return r ? `${h}시간 ${r}분` : `${h}시간`;
};
const one = s => String(s || '').replace(/\s+/g,' ').trim();
const taskOf = c => one(c.text) || '(적지 않고 떠남)';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ═════════ 방점 연결 ═════════
   읽기: bangjeom 표(data.tasks의 최근에 끝낸 일, data.pick 지금 고른 일), bangjeom_act의 최근 cont·line·done·now(포모·주머니가 보낸 것) — select만.
   쓰기: bangjeom_act에 memo·away 줄을 넣기만 한다(포모와 같은 길). 방점이 열릴 때 받아 일지용 글에 넣는다. */
const BJ_KEY = 'danyeo.bj';
const RECENT_H = 12;
let recent = [], pick = null, fomoNow = null, bjData = null, bjState = 'none', bjAt = 0;
/* 지금 하는 일: 포모가 돌고 있거나 막 끝낸 지 30분 안이면 포모의 일, 아니면 방점이 고른 일 */
const cur = () => fomoNow ? { id:fomoNow.id, name:fomoNow.name, src:'포모' } : pick ? { ...pick, src:'방점' } : null;
const lastEnd = () => recent.find(e => !e.start);   // '시작' 줄을 뺀 가장 최근 기록
function bjCfg(){
  let own = {}, b = {};
  try{ own = JSON.parse(localStorage.getItem(BJ_KEY) || '{}') || {}; }catch(e){}
  try{ b = JSON.parse(localStorage.getItem('bangjeom.cfg') || '{}') || {}; }catch(e){}
  const url = own.url || b.url || '', key = own.key || b.key || '', list = own.list || b.list || 'bangjeom';
  return url && key ? { url:String(url).replace(/\/+$/,''), key, list } : null;
}
const hdr = c => ({ apikey:c.key, Authorization:'Bearer ' + c.key });
const stripStamp = s => one(String(s||'').replace(/^—?\s*\d{1,2}\/\d{1,2}\s+\d{1,2}:\d{2}\s*·?\s*/, ''));
const SRC = { fomo:'포모', jumeoni:'주머니', final:'final', typing:'타이핑', taiping:'타이핑' };

async function pullRecent(){
  const c = bjCfg();
  if (!c){ bjState = 'none'; recent = []; pick = null; fomoNow = null; bjData = null; paint(); return; }
  const since = new Date(Date.now() - RECENT_H*3600000).toISOString();
  try{
    const r = await fetch(`${c.url}/rest/v1/bangjeom?select=data&id=eq.${encodeURIComponent(c.list)}`, { headers:hdr(c) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = await r.json(), data = (rows[0] && rows[0].data) || {}, tasks = data.tasks || [];
    bjData = data;
    const byId = id => tasks.find(t => t && String(t.id) === String(id));
    const name = id => { const t = byId(id); return t ? one(t.text) : ''; };
    const p = data.pick && byId(data.pick.id);
    pick = p && !p.done ? { id:String(p.id), name:one(p.text) } : null;
    const ev = [];
    for (const t of tasks){
      const at = t && t.done && t.doneAt ? Date.parse(t.doneAt) : 0;
      if (at && Date.now() - at < RECENT_H*3600000) ev.push({ at, src:'방점', text:`끝냄 · ${one(t.text)}`, task:one(t.text) });
    }
    try{
      const q = `${c.url}/rest/v1/bangjeom_act?select=kind,target,text,device,created_at&list=eq.${encodeURIComponent(c.list)}` +
                `&kind=in.(cont,line,done,now)&created_at=gte.${encodeURIComponent(since)}&order=created_at.desc&limit=60`;
      const a = await fetch(q, { headers:hdr(c) });
      const acts = a.ok ? await a.json() : [];
      // 포모의 now(포모도로 시작) — 가장 최근 것 뒤에 멈춤(무효)·끝냄이 없고, 끝날 시각 + 30분 안이면 지금 포모의 일
      fomoNow = null;
      const nows = acts.filter(x => x.kind === 'now').map(x => { let o = {}; try{ o = JSON.parse(x.text) || {}; }catch(e){} return { id:String(x.target), at:+o.at || Date.parse(x.created_at), end:+o.end || 0, name: name(x.target) || one(o.t) }; }).sort((a,b) => b.at - a.at);
      const n = nows[0];
      if (n && n.end && Date.now() < n.end + 30*60000){
        const after = acts.filter(x => String(x.target) === n.id && Date.parse(x.created_at) > n.at);
        const killed = after.some(x => x.kind === 'done' || (x.kind === 'line' && /포모도로 무효/.test(x.text || '')));
        if (!killed) fomoNow = { ...n, focus: Date.now() < n.end && !after.some(x => x.kind === 'cont') };
      }
      for (const x of acts){
        let at = Date.parse(x.created_at), body = '';
        if (x.kind === 'now'){
          let o = {}; try{ o = JSON.parse(x.text) || {}; }catch(e){}
          const task = name(x.target) || one(o.t);
          ev.push({ at:+o.at || at, src:'포모', text:`${task} · 포모도로 시작`, task, act:true, start:true });
          continue;
        }
        if (x.kind === 'cont'){ let o = null; try{ o = JSON.parse(x.text); }catch(e){} body = stripStamp(o && o.l ? o.l : x.text); if (o && +o.at) at = +o.at; }
        else if (x.kind === 'line') body = stripStamp(x.text);
        else body = '끝냄';
        const task = name(x.target);
        if (!body && !task) continue;
        ev.push({ at, src: SRC[x.device] || x.device || '요청', text: task ? `${task} · ${body}` : body, task, act:true });
      }
    }catch(e){}
    // 포모가 보낸 것을 방점이 받아 만든 '끝낸 사본'은 같은 분(±1)의 같은 일이면 뺀다
    const actKeys = new Set(ev.filter(e => e.act).flatMap(e => [-1,0,1].map(d => `${e.task}|${Math.round(e.at/60000)+d}`)));
    recent = ev.filter(e => e.act || !actKeys.has(`${e.task}|${Math.round(e.at/60000)}`)).sort((a,b) => b.at - a.at).slice(0, 12);
    bjState = 'on'; bjAt = Date.now();
  }catch(e){ bjState = 'err'; }
  paint(); render(); flush();
}

/* ═════════ 오른쪽 칸: 오늘의 오전타이핑과 루틴 ═════════
   방점의 판정(ojCompute·rtCompute, 2026년 11월 26~27일)을 그대로 옮겼다. 방점의 규칙이 바뀌면 여기도 고친다.
   - 오전타이핑: 제목에 '오전타이핑'이 든 반복 일 중 오늘 차례인 것. 끝낸 시각이 12시 전 am · 18시 전 pm · 그 뒤 eve,
     안 끝냈으면 페이지에 오늘 줄이 있으면 touch, 없으면 오전엔 wait · 오후부터 open.
   - 루틴: 반복 주기가 '매일'(rep.type 'daily')인 일(오전타이핑 빼고). done · touch · open.
   - 끝냄은 반복 일이 남기는 기록 사본(echo)의 끝낸 시각으로 본다(data.log의 그날 items + data.tasks의 끝낸 것). */
const OJ_RE = /오전\s*타이핑/;
const LOG_RE = /^— (\d{1,2}\/\d{1,2}(?: \d{2}:\d{2})?) · (.*)$/;
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayKey = t => keyOf(new Date(t == null ? Date.now() : t));          // 방점의 DAY_H = 0(자정)
const dateOf = iso => iso ? dayKey(Date.parse(iso)) : dayKey();
const normTitle = v => String(v || '').replace(/\s+/g,' ').trim().toLowerCase();
function routines(){
  const D = bjData; if (!D || !Array.isArray(D.tasks)) return null;
  const k = dayKey(), md0 = `${+k.slice(5,7)}/${+k.slice(8,10)} `, wd = new Date().getDay();
  const lg = (D.log || []).find(x => x && x.date === k);
  const echoes = ((lg && lg.items) || []).filter(i => i.echo).map(i => ({ text:i.text, at:i.at }))
    .concat(D.tasks.filter(t => t && t.done && t.echo && t.doneAt && dateOf(t.doneAt) === k).map(t => ({ text:t.text, at:t.doneAt })));
  const doneAt = t => { const d = echoes.filter(i => normTitle(i.text) === normTitle(t.text)).sort((a,b) => String(a.at).localeCompare(String(b.at)))[0]; return d ? Date.parse(d.at) : 0; };
  const touched = t => String(t.note || '').split('\n').some(l => { const m = l.trim().match(LOG_RE); return m && (m[1] + ' ').startsWith(md0); });
  const born = t => !(t.createdAt && dateOf(t.createdAt) > k);
  const live = D.tasks.filter(t => t && t.rep && !t.done && born(t));
  const byName = (a,b) => normTitle(a.text).localeCompare(normTitle(b.text));
  const oj = live.filter(t => OJ_RE.test(t.text) && (t.rep.type === 'week' ? (t.rep.days || []).includes(wd) : true)).sort(byName).map(t => {
    const at = doneAt(t);
    if (at){ const h = new Date(at).getHours(); return { name:t.text, st:h < 12 ? 'am' : h < 18 ? 'pm' : 'eve', at }; }
    if (touched(t)) return { name:t.text, st:'touch' };
    return { name:t.text, st:new Date().getHours() < 12 ? 'wait' : 'open' };
  });
  const rt = live.filter(t => t.rep.type === 'daily' && !OJ_RE.test(t.text)).sort(byName).map(t => {
    const at = doneAt(t);
    return at ? { name:t.text, st:'done', at } : touched(t) ? { name:t.text, st:'touch' } : { name:t.text, st:'open' };
  });
  return { oj, rt };
}
function paintSide(){
  const el = $('side'), R = routines();
  if (!R){ el.innerHTML = `<div class="hd"><span>오늘의 루틴</span></div><div class="empty">${bjCfg() ? '방점을 읽는 중…' : '방점에 연결하면 여기 보입니다.'}</div>`; return; }
  const row = (cls, mk, name, st) => `<div class="r ${cls}"><span class="mk">${mk}</span><span class="nm">${esc(name)}</span><span class="st">${st}</span></div>`;
  const ojName = n => { const v = one(n).replace(OJ_RE, '').trim(); return v ? `오전타이핑 ${v}` : '오전타이핑'; };
  const OJ = {
    am:   x => row('done', '✓', ojName(x.name), hm(x.at)),
    pm:   x => row('done miss', '✓', ojName(x.name), `늦게 ${hm(x.at)}`),
    eve:  x => row('done miss', '✓', ojName(x.name), `늦게 ${hm(x.at)}`),
    touch:x => row('part', '◐', ojName(x.name), '손댐'),
    wait: x => row('todo', '○', ojName(x.name), '아직'),
    open: x => row('todo miss', '✕', ojName(x.name), '오전에 못 끝냄'),
  };
  const RT = {
    done: x => row('done', '✓', x.name, hm(x.at)),
    touch:x => row('part', '◐', x.name, '손댐'),
    open: x => row('todo', '○', x.name, ''),
  };
  // 아직인 것을 위로, 끝낸 것을 아래로
  const order = { open:0, touch:1, done:2 };
  const rt = R.rt.slice().sort((a,b) => order[a.st] - order[b.st]);
  const n = R.rt.filter(x => x.st === 'done').length;
  let h = `<div class="hd"><span>오늘의 루틴</span><b>${n} / ${R.rt.length}</b></div>`;
  if (R.oj.length) h += R.oj.map(x => OJ[x.st](x)).join('') + (R.rt.length ? '<div class="grp">매일</div>' : '');
  h += R.rt.length ? rt.map(x => RT[x.st](x)).join('') : (R.oj.length ? '' : '<div class="empty">매일 반복하는 일이 없습니다.</div>');
  h += `<div class="foot">방점 ${hm(bjAt)} 기준 · 1분마다 새로</div>`;
  el.innerHTML = h;
}

/* 보내기 — 못 보낸 것은 S.out에 남겨 다시(열 때, 창이 앞으로 올 때, 1분마다) */
let flushing = false;
function send(kind, target, obj){
  S.out.push({ kind, target: target || null, text: JSON.stringify(obj) }); save(); flush();
}
async function flush(){
  const c = bjCfg();
  if (flushing || !S.out.length || !c){ paint(); return; }
  flushing = true;
  try{
    while (S.out.length){
      const x = S.out[0];
      const r = await fetch(`${c.url}/rest/v1/bangjeom_act`, { method:'POST',
        headers:{ ...hdr(c), 'Content-Type':'application/json', Prefer:'return=minimal' },
        body: JSON.stringify({ list:c.list, kind:x.kind, target:x.target, text:x.text, device:'danyeo' }) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      S.out.shift(); save();
    }
  }catch(e){}
  finally{ flushing = false; paint(); }
}

function paint(){
  paintSide();
  const a = $('bjLink'), n = S.out.length;
  a.className = bjState === 'on' && !n ? 'on' : '';
  a.textContent = (bjState === 'on' ? `방점 ${hm(bjAt)}에 읽음` : bjState === 'err' ? '방점 못 읽음 — 연결 확인' : '방점 연결 없음')
                + (n ? ` · 못 보낸 것 ${n}개` : '');
  const c = cur();
  const who = !c ? '' : c.src === '포모' ? (fomoNow.focus ? `포모가 하는 일 (${hm(fomoNow.end)}까지)` : '포모로 하던 일') : '방점이 고른 일';
  if ($('nowLine').dataset.hint) return;
  $('nowLine').innerHTML = c ? `${who} <b>${esc(c.name)}</b>` : '지금 하는 일 모름 — 메모는 그날의 기록으로만, 생각은 적을 곳이 없습니다';
}

/* ═════════ 메모 ═════════
   '전화: 출판사 교정 일정'처럼 앞에 말머리를 붙이면 종류로 묶인다 */
const TAGS = ['전화','메일','문자','연락','손님','약속','발견','할일','메모'];   // '생각'은 따로(Tab)
function parseMemo(v){
  const m = one(v).match(/^([^\s:：]{1,3})\s*[:：]\s*(.+)$/);
  return m && TAGS.includes(m[1]) ? { tag:m[1], text:m[2] } : { tag:'메모', text:one(v) };
}
/* 적기에는 두 가지(2026년 11월 27일, 작가가 정함). Tab으로 바꾼다. 고른 채로 남는다.
   메모: 일지(다녀올게 기록)에도, 지금 하는 일의 페이지에도.
   생각: 지금 하는 일의 페이지에만 — bangjeom_act의 line으로 '11/27 10:12 [생각] …'을 보낸다. 방점이 일지용 글을 만들 때 [생각] 줄은 뺀다 */
let writeMode = 'memo';
function setMode(m){
  writeMode = m;
  $('modeLbl').textContent = m === 'memo' ? '메모 >' : '생각 >';
  $('modeLbl').classList.toggle('th', m === 'thought');
  $('what').placeholder = m === 'memo' ? '메모는 일지에도 들어갑니다 · Enter · Tab은 생각 · 일어설 땐 ⌘Enter'
                                       : '생각은 지금 하는 일의 페이지에만 붙습니다 · Enter · Tab은 메모';
}
$('modeLbl').onclick = () => { setMode(writeMode === 'memo' ? 'thought' : 'memo'); $('what').focus(); };
function write(){ writeMode === 'thought' ? thought() : memo(); }
let toastT = 0;
function hint(msg){ const l = $('nowLine'); l.dataset.hint = msg; l.innerHTML = `<b>${esc(msg)}</b>`; clearTimeout(toastT); toastT = setTimeout(() => { delete l.dataset.hint; paint(); }, 3500); }
function thought(){
  const v = one($('what').value); if (!v) return;
  const c = cur();
  if (!c){ hint('지금 하는 일이 없어서 생각을 붙일 페이지가 없습니다. 메모로 적으려면 Tab.'); return; }
  const d = new Date(), at = d.getTime();
  S.notes.push({ kind:'thought', at, text:v, task:c.name }); S.notes = S.notes.slice(-400);
  S.out.push({ kind:'line', target:c.id, text:`${d.getMonth()+1}/${d.getDate()} ${hm(at)} [생각] ${v}` }); save(); flush();
  $('what').value = ''; grow(); render(); $('what').focus();
}
function memo(){
  const v = $('what').value; if (!one(v)) return;
  const { tag, text } = parseMemo(v), at = Date.now();
  const c = cur(), task = c ? c.name : '';
  S.notes.push({ kind:'memo', at, tag, text, task }); S.notes = S.notes.slice(-400);
  send('memo', c && c.id, { at, tag, t:text, task });
  $('what').value = ''; grow(); render(); $('what').focus();
}

/* ═════════ 비운 동안 쌓일 말 ═════════ */
const SCRIPT = [
  [0,   '저장했습니다. 천천히 다녀오세요.'],
  [3,   '화면은 켜 둔 채로 기다립니다.'],

  [45,  '돌아오면 마지막 문장 하나만 다시 읽으세요. 금방 이어집니다.'],
  [60,  '한 시간. 하던 일은 그대로 여기 있습니다 ▸ {일}'],

  [240, '네 시간. 돌아오면 할 일 ▸ {일}'],
  [360, '여섯 시간. 오늘은 여기까지였을 수도 있겠습니다.'],
  [480, '여덟 시간. 내일의 당신에게 남겨 둡니다 ▸ {일}'],
  [720, '열두 시간. 새 하루, 같은 자리. 시작은 ▸ {일}'],
];
function awayLines(c, now){
  const el = now - c.left, out = [];
  const say = (min, text, cls='') => out.push({ at: c.left + min*60000, text, cls });
  say(0, `${hm(c.left)}에 자리를 비웠습니다.`);
  out.push({ at:null, text: taskOf(c), cls:'big' });
  if (c.recent && c.recent.length){
    out.push({ at:null, text:'그 전에 한 일', cls:'dim' });
    for (const e of c.recent.slice(0,5)) out.push({ at:e.at, text:`[${e.src}] ${e.text}`, cls:'dim' });
    out.push({ at:null, text:'', cls:'gap' });
  }
  for (const [m, t] of SCRIPT) if (el >= m*60000) say(m, t.replace('{일}', taskOf(c)));
  for (let m = 1080; el >= m*60000; m += 360) say(m, `${m/60}시간째. 하던 일 ▸ ${taskOf(c)}`);
  return out;
}

/* ═════════ 적는 화면 ═════════
   위에서 아래로: 지난 자리 비움(어제까지) → 오늘 한 일(방점·포모·내 메모·자리 비움을 시각 순으로) → 방금 돌아왔으면 그 안내 */
function hereLines(){
  const L = [], now = Date.now();
  const old = S.log.filter(e => !sameDay(e.left, now)).slice(0, 8).reverse();
  if (old.length){
    L.push({ at:null, text:'지난 자리 비움', cls:'dim' });
    for (const e of old) L.push({ at:null, text:`${md(e.left)} ${hm(e.left)}–${hm(e.back)}  (${dur(e.back-e.left)})  ${taskOf(e)}`, cls:'dim' });
    L.push({ at:null, text:'', cls:'gap' });
  }
  const today = [];
  for (const e of recent) if (sameDay(e.at, now)) today.push({ at:e.at, html:`<span class="src">[${esc(e.src)}]</span> ${esc(e.text)}` });
  for (const n of S.notes) if (sameDay(n.at, now) && n.kind === 'thought')
    today.push({ at:n.at, html:`<span class="tag" style="color:#c9ff5a">[생각]</span> ${esc(n.text)} <span class="src">· ${esc(n.task)} 페이지에만</span>` });
  for (const n of S.notes) if (sameDay(n.at, now) && n.kind === 'memo')
    today.push({ at:n.at, html:`<span class="tag">[${esc(n.tag)}]</span> ${esc(n.text)}${n.task ? ` <span class="src">· ${esc(n.task)} 하던 중</span>` : ''}` });
  for (const e of S.log) if (sameDay(e.left, now))
    today.push({ at:e.left, html:`<span class="src">[자리 비움]</span> ${hm(e.left)}–${hm(e.back)} · ${dur(e.back-e.left)}`, dim:true });
  today.sort((a,b) => a.at - b.at);
  L.push({ at:null, text:`오늘 — ${new Date().getMonth()+1}월 ${new Date().getDate()}일`, cls:'dim' });
  if (!today.length) L.push({ at:null, text:'아직 없음. 메모는 Enter, 자리를 뜰 땐 ⌘Enter.', cls:'dim' });
  for (const t of today) L.push({ at:t.at, html:t.html, cls:t.dim ? 'dim' : '' });

  const r = S.returned;
  if (r && now - r.back < 30*60000){
    L.push({ at:null, text:'', cls:'gap' });
    L.push({ at:r.back, text:`돌아왔습니다. ${dur(r.back - r.left)} 동안 비웠습니다.` });
    L.push({ at:null, text:'아까 하던 일 ▸' });
    L.push({ at:null, text: taskOf(r), cls:'big' });
  }
  return L;
}

let shown = 0, mode = null;
const line = o => `<div class="ln ${o.cls||''}">${o.at ? `<span class="t">${hm(o.at)}</span>` : ''}${o.html != null ? o.html : esc(o.text)}</div>`;
function render(){
  const away = S.state === 'away';
  if (mode !== S.state){ shown = 0; mode = S.state; $('screen').innerHTML = ''; $('screen').dataset.last = ''; }
  $('here').hidden = away; $('away').hidden = !away; $('memoBtn').hidden = away;
  $('btn').textContent = away ? '돌아왔어' : '다녀올게';
  $('btn').classList.toggle('ghost', away);
  const scr = $('screen');
  if (!away){
    const html = hereLines().map(line).join('');
    if (html !== scr.dataset.last){ scr.innerHTML = html; scr.dataset.last = html; scr.scrollTop = scr.scrollHeight; }
    return;
  }
  const L = awayLines(S.current, Date.now());
  if (L.length < shown){ scr.innerHTML = ''; shown = 0; }
  if (L.length > shown){
    scr.insertAdjacentHTML('beforeend', L.slice(shown).map(line).join(''));
    if (shown > 0) [...scr.children].slice(shown).forEach(el => el.classList.add('new'));
    shown = L.length; scr.scrollTop = scr.scrollHeight;
  }
}

function leave(){

  const le = lastEnd(), now = cur();

  const auto = fresh || (now ? now.name : '') || (le ? le.text : '');
  S.state = 'away';
  S.current = { text: typed || auto, task: now ? now.name : '', taskId: now ? now.id : null,
                left: Date.now(), recent: recent.slice(0,5).map(({at,src,text}) => ({at,src,text})) };

/* ═════════ 화면 보호 (2026년 11월 27일, 작가가 정함) ═════════
   손대지 않은 지 IDLE이 지나면 OUT초에 걸쳐 검정이 되고, 검은 화면에 글 한 덩어리만 흐리게 떠 있다:
     자리 비움 중 — 하던 일 / '09:12에 일어섬 · 23분째'
     적는 화면   — 지금 하는 일 / '마지막으로 손댄 때 09:40 · 25분 전'(단추를 안 누르고 일어섰을 때)
   덩어리는 MOVE초마다 FADE초에 걸쳐 사라졌다가 다른 자리에서 나타난다(같은 자리에 오래 있지 않게).
   잠든 동안의 첫 입력(키·누르기)은 깨우기만 한다. 맥의 입력기 표시(「한」)가 남지 않게 입력창에서 커서를 뺐다가 깨면 돌려놓는다. */
const SAVER = { IDLE:5*60, OUT:30, MOVE:60, FADE:2, DIM:0.45 };   // 초 · 덩어리 밝기
let lastInput = Date.now(), saverPhase = 'awake', swallowUntil = 0, refocus = null, floatShown = false, floatNext = 0;
const sleeping = () => saverPhase === 'sleep';
function floatText(){
  const now = Date.now();
  if (S.state === 'away' && S.current){
    const el = now - S.current.left;
    return [taskOf(S.current), el < 60000 ? `${hm(S.current.left)}에 일어섬 · 방금` : `${hm(S.current.left)}에 일어섬 · ${dur(el)}째`];
  }
  const c = cur();
  return [c ? c.name : '하던 일 모름', `마지막으로 손댄 때 ${hm(lastInput)} · ${dur(now - lastInput)} 전`];
}
function placeFloat(){
  const f = $('float'), m = 0.06;
  const w = f.offsetWidth, h = f.offsetHeight;
  const x = innerWidth*m + Math.random() * Math.max(0, innerWidth*(1-2*m) - w);
  const y = innerHeight*m + Math.random() * Math.max(0, innerHeight*(1-2*m) - h);
  f.style.left = Math.round(x) + 'px'; f.style.top = Math.round(y) + 'px';
}
function saverTick(){
  const ph = (Date.now() - lastInput) / 1000 < SAVER.IDLE ? 'awake' : 'sleep';
  const d = $('dark'), f = $('float');
  if (ph !== saverPhase){
    if (ph === 'sleep'){
      const a = document.activeElement;
      if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')){ refocus = a; a.blur(); }
      d.style.transitionDuration = SAVER.OUT + 's'; d.style.opacity = 1; d.classList.add('on');
      floatShown = false; floatNext = Date.now() + SAVER.OUT*1000;   // 검정이 다 된 뒤에 처음 나타난다
    }else{
      d.style.transitionDuration = '.25s'; d.style.opacity = 0; d.classList.remove('on');
      f.style.transitionDuration = '.2s'; f.style.opacity = 0; floatShown = false;
      if (refocus && !refocus.closest('[hidden]')) refocus.focus();
      refocus = null;
    }
    saverPhase = ph;
  }
  if (ph !== 'sleep') return;
  const [a, b] = floatText();
  if ($('f1').textContent !== a) $('f1').textContent = a;
  if ($('f2').textContent !== b) $('f2').textContent = b;
  if (Date.now() < floatNext) return;
  f.style.transitionDuration = SAVER.FADE + 's';
  if (floatShown){ f.style.opacity = 0; floatShown = false; floatNext = Date.now() + SAVER.FADE*1000 + 300; }
  else { placeFloat(); f.style.opacity = SAVER.DIM; floatShown = true; floatNext = Date.now() + SAVER.MOVE*1000; }
}
function wake(e){
  const was = sleeping();
  lastInput = Date.now();
  if (was){ swallowUntil = Date.now() + 600; saverTick(); }   // 이어 오는 click까지 삼킨다
  if (was || Date.now() < swallowUntil){
    if (e.type !== 'mousemove' && e.type !== 'wheel'){ e.preventDefault(); e.stopImmediatePropagation(); }
  }
}
['keydown','mousedown','click','touchstart'].forEach(t => addEventListener(t, wake, true));
['mousemove','wheel'].forEach(t => addEventListener(t, () => { const was = sleeping(); lastInput = Date.now(); if (was){ swallowUntil = Date.now() + 600; saverTick(); } }, { capture:true, passive:true }));
setInterval(saverTick, 500);

/* 화면 꺼짐 막기 — 크롬의 Wake Lock. 다녀올게 창이 보이는 동안만. 안 되면 조용히 넘어간다(맥 설정을 쓴다) */
let wakeLock = null;
async function keepScreen(){
  if (!('wakeLock' in navigator) || document.hidden) { $('wl').textContent = ''; return; }
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    $('wl').textContent = '· 화면 켜 둠';
    wakeLock.addEventListener('release', () => { $('wl').textContent = ''; });
  }catch(e){ $('wl').textContent = ''; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) keepScreen(); });
keepScreen();

setMode('memo'); paint(); tick(); setInterval(tick, 15000);
pullRecent();
</script>
