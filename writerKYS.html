<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>writerKYS</title>
<meta name="theme-color" content="#f2ede1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
/* writerKYS — 글쓰기 대시보드(2026년 11월 18일). 시작에서 열어, 원고 쓰기·구상·자료 읽기를 여기서 시작한다.
   타이핑(taiping-v1)과 storyM(storyM.v1)의 저장소는 읽기만 한다. 쓰는 곳은 자기 설정(writerKYS.v1)과 storyM의 아이디어 받은편지함(storyM.ideas.in)뿐. */
:root{
  --paper:#f2ede1; --paper-2:#e8e0cf; --ink:#23201c; --ink-soft:#736a59; --line:#d6ccb6;
  --seal:#9b3b32; --deep:#3f5566; --moss:#5f6f49; --void:#8c8577; --radius:2px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Gowun Batang","Apple SD Gothic Neo",serif;font-size:16px;line-height:1.7}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 80px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
header h1{font-size:24px;margin:0;letter-spacing:.02em}
header .date{font-size:13.5px;color:var(--ink-soft)}
header .sp{flex:1}
.linkish{background:none;border:none;padding:0;font-size:13.5px;color:var(--ink-soft);border-bottom:1px solid var(--line)}
.linkish:hover{color:var(--ink)}
section{margin-top:34px}
section>h2{font-size:13.5px;font-weight:400;color:var(--ink-soft);margin:0 0 10px;letter-spacing:.08em}
.note{font-size:13.5px;color:var(--ink-soft);margin:6px 0 0}

/* 오늘 */
.today{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:16px;font-size:14.5px;color:var(--ink-soft)}
.today b{color:var(--ink);font-weight:700;font-size:17px}
.today .hit{color:var(--seal)}

/* 원고 */
.work{padding:16px 0 18px;border-bottom:1px solid var(--line)}
.work:first-child{border-top:1px solid var(--line)}
.work .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.work .name{font-size:21px;font-weight:700;border-bottom:1px solid transparent}
.work a.name:hover{border-bottom-color:var(--ink)}
.work .kind{font-size:12.5px;color:var(--ink-soft);border:1px solid var(--line);border-radius:var(--radius);padding:0 6px}
.work .num{margin-left:auto;font-size:15px;color:var(--ink-soft);white-space:nowrap}
.work .num b{font-size:20px;color:var(--ink)}
.bar{height:5px;background:var(--paper-2);margin-top:10px;border-radius:var(--radius);overflow:hidden}
.bar i{display:block;height:100%;background:var(--deep)}
.bar.done i{background:var(--moss)}
.work .sub{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:13.5px;color:var(--ink-soft)}
.work .sub .late{color:var(--seal)}
.work .last{margin-top:8px;font-size:14.5px;line-height:1.65}
.work .last .t{color:var(--ink-soft);font-size:13px}
.work .flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.work .flags span{font-size:12.5px;color:var(--seal);border:1px solid var(--seal);border-radius:var(--radius);padding:0 7px}
.work.miss .name{color:var(--void)}

/* 아이디어 */
.idea{display:flex;flex-wrap:wrap;gap:8px}
.idea select,.idea input{background:none;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px}
.idea input{flex:1;min-width:180px}
.idea select{max-width:100%}
.btn{background:none;border:1px solid var(--line);border-radius:var(--radius);padding:8px 16px}
.btn:hover{border-color:var(--ink-soft)}
.btn.go{border-color:var(--deep);color:var(--deep)}

/* 도구·책·자료 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{display:block;border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px;font-size:17px;background:rgba(255,255,255,.18)}
.card:hover{border-color:var(--ink-soft)}
.card small{display:block;font-size:12px;color:var(--void);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.list li:first-child{border-top:1px solid var(--line)}
.list a{display:flex;align-items:baseline;gap:10px;padding:10px 2px}
.list a:hover .n{border-bottom-color:var(--ink)}
.list .n{border-bottom:1px solid transparent}
.list .u{margin-left:auto;font-size:12px;color:var(--void);max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{border:1px solid var(--line);border-radius:var(--radius);padding:6px 14px;font-size:15px}
.chips a:hover{border-color:var(--ink-soft)}

/* 설정 */
.set h3{font-size:16px;margin:30px 0 4px}
.srow{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.srow input,.srow select{background:none;border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;min-width:0}
.srow .nm{flex:1 1 150px}
.srow .url{flex:2 1 220px}
.srow .tg{width:6.5em}
.srow button{background:none;border:1px solid var(--line);border-radius:var(--radius);padding:6px 9px;font-size:13px;color:var(--ink-soft)}
.srow button:hover{color:var(--ink)}
.srow .st{flex-basis:100%;font-size:12.5px;color:var(--ink-soft);margin:-2px 0 4px 2px}
.srow .st.bad{color:var(--seal)}
.add{margin-top:10px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:var(--radius);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
@media (max-width:520px){
  .work .num{margin-left:0;flex-basis:100%}
  .list .u{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>writerKYS</h1><span class="date" id="date"></span><span class="sp"></span>
    <button class="linkish" id="setBtn">설정</button>
  </header>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script>
'use strict';
/* ---------- 저장소 ----------
   writerKYS.v1 — 이 앱의 설정만. 진행 상황은 저장하지 않고 열 때마다 타이핑에서 읽는다.
   works:[{name, unit:'mae'|'page', target}]  이름은 타이핑의 작품 이름과 같아야 한다. unit은 매수(글자 수 ÷ 200) 또는 쪽수(타이핑의 개정 회차 기록)
   apps·books·refs:[{name, url}]  책의 url을 비우면 서가의 그 책(seoga.html#책=이름 — 서가에서 그 책이 펼쳐지고 쪽수를 적을 수 있다) */
const KEY='writerKYS.v1', TP_KEY='taiping-v1', SM_KEY='storyM.v1', IDEA_IN='storyM.ideas.in';
const DEF={
  works:[],
  apps:[{name:'스토리엠',url:'./storyM.html'},{name:'타이핑',url:'./taiping.html'},{name:'타자기',url:'https://writerkys-cell.github.io/apps/typewriter.html'},{name:'떠들기',url:'./tteodeulgi.html'}],
  books:[], refs:[],
  taipingUrl:'./taiping.html', seogaUrl:'./seoga.html'
};
function loadCfg(){
  let c=null; try{ c=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  const d=JSON.parse(JSON.stringify(DEF));
  if(!c||typeof c!=='object') return d;
  ['works','apps','books','refs'].forEach(k=>{ if(Array.isArray(c[k])) d[k]=c[k].filter(x=>x&&typeof x==='object'); });
  if(c.taipingUrl) d.taipingUrl=String(c.taipingUrl);
  if(c.seogaUrl) d.seogaUrl=String(c.seogaUrl);
  return d;
}
let cfg=loadCfg(), view='home', ideaDraft='', ideaStory='';
function saveCfg(){ try{ localStorage.setItem(KEY,JSON.stringify(cfg)); }catch(e){ toast('설정을 저장하지 못했습니다'); } }
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s||'').replace(/\s+/g,' ').trim(); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600); }
function z2(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate()); }
function num(n,d){ return (+n.toFixed(d==null?1:d)).toLocaleString('ko-KR'); }

/* ---------- 타이핑 읽기(읽기만 한다. 계산은 타이핑과 같게) ---------- */
function readTp(){ try{ const s=JSON.parse(localStorage.getItem(TP_KEY)); return s&&typeof s==='object'?s:null; }catch(e){ return null; } }
/* 서가에 담긴 책(내놓지 않은 것) — 설정에서 책 이름을 적을 때 제목으로 찾게 한다(2026년 11월 19일: 자료 딱지와 상관없이 모든 책). 서가 저장소(seoga.v1)는 읽기만 한다 */
function seogaRefs(){
  try{ const d=JSON.parse(localStorage.getItem('seoga.v1')); return ((d&&d.books)||[]).filter(b=>b&&!b.jar&&!b.discarded&&norm(b.title)).map(b=>({title:norm(b.title),author:norm(b.author),page:b.page||0})); }
  catch(e){ return []; }
}
function readSm(){ try{ const d=JSON.parse(localStorage.getItem(SM_KEY)); return d&&Array.isArray(d.stories)?d.stories:[]; }catch(e){ return []; } }
function tpDayKey(S,t){ const d=new Date(t); if(d.getHours()<(S.dayStart||0)) d.setDate(d.getDate()-1); return ymd(d); }
function len(t){ return (t||'').replace(/\n/g,'').length; }                 /* 공백 포함, 줄바꿈은 뺀다(타이핑의 len) */
function nowChars(m){ return m.folded?(m.folded.chars||0):m.cleared?(m.cleared.chars||0):len(m.text); }
function revsOf(w){ return (w&&w.revs)||[]; }
function curRev(w){ const rs=revsOf(w), r=rs[rs.length-1]; return r||null; }  /* 지금 회차, 없으면 마지막 회차 */
function revLog(r){ return (r.log||[]).slice().sort((a,b)=>(a.t||0)-(b.t||0)); }
function revPages(r){ const l=revLog(r); return l.length?l[l.length-1].p:(r.from||0); }
function workActive(w){ const rs=revsOf(w), r=rs[rs.length-1]; return !w.finishedAt||(r&&!r.doneAt); }
function findWork(S,name){
  const k=norm(name); if(!k||!S||!Array.isArray(S.works)) return null;
  const ws=S.works.filter(w=>norm(w.title)===k);
  return ws.filter(workActive)[0]||ws[0]||null;
}
function unitsOf(S,w){ return (S.mss||[]).filter(m=>m.workId===w.id&&!m.folded); }
function lastUnit(S,w){ let b=null; unitsOf(S,w).forEach(m=>{ const t=m.editedAt||m.createdAt||0; if(!b||t>(b.editedAt||b.createdAt||0)) b=m; }); return b; }
function lastLine(m){ const ls=(m.text||'').split('\n').map(x=>x.trim()).filter(Boolean); const s=ls[ls.length-1]||''; return s.length>70?'…'+s.slice(-70):s; }
function linkPart(link,key){ const m=String(link||'').match(new RegExp('[#&]'+key+'=([^&]+)')); if(!m) return ''; try{ return decodeURIComponent(m[1]); }catch(e){ return m[1]; } }
function manualChanged(stories,m){
  if(!m.storyLink) return false;
  const sid=linkPart(m.storyLink,'소설'), cid=linkPart(m.storyLink,'카드'); if(!sid||!cid) return false;
  const s=stories.filter(x=>x.id===sid)[0], c=((s&&s.guide&&s.guide.cards)||[]).filter(x=>x.id===cid)[0];
  return !!(c&&c.tpChanged&&!c.dropped);
}
/* 다른 앱의 창 이름 — 타이핑과 storyM은 자기 창 이름을 appwin.<앱>에 적어 둔다. 그 창을 다시 써야 타이핑 창이 둘이 되어 서로 덮는 일이 없다 */
function winName(app){ let n=''; try{ n=localStorage.getItem('appwin.'+app)||''; }catch(e){} if(!n||n===window.name) n=app; return n===window.name?app+'2':n; }
/* 대시보드는 늘 떠 있어야 한다(2026년 11월 18일) — 시작이 이 창을 닫는 때로 글쓰기 끝을 잡는다. 그래서 여기서 여는 것은 모두 다른 창으로 간다.
   시작은 '글쓰기' 링크를 sijak_write라는 창에 여는데, 전에는 그 창에 storyM이나 타이핑이 떠서 appwin.<앱>에 그 이름이 남아 있을 수 있다.
   그대로 두면 타이핑·storyM을 여는 링크(여기서든, 두 앱이 서로를 부를 때든)가 이 창을 차지해 대시보드가 사라진다. 이 창 이름과 같은 appwin.<앱>은 지운다. */
function claimWin(){
  try{
    if(!window.name) window.name='writerKYS';
    ['taiping','storyM'].forEach(a=>{ if(localStorage.getItem('appwin.'+a)===window.name) localStorage.removeItem('appwin.'+a); });
    localStorage.setItem('appwin.writerKYS',window.name);
  }catch(e){}
}
function targetFor(url,i){
  if(!/^(https?:|\.\/|\.\.\/|\/)/.test(url)) return '';                /* 데본씽크·씽즈·단축어 같은 주소 — 창을 만들지 않는다 */
  if(/taiping\.html/.test(url)) return winName('taiping');
  if(/storyM\.html/.test(url)) return winName('storyM');
  if(/seoga\.html/.test(url)) return window.name==='wk_seoga'?'wk_seoga2':'wk_seoga';
  const n='wk_'+i; return n===window.name?n+'_2':n;
}
function aTag(url,cls,inner,i){ const t=targetFor(url,i); return '<a class="'+cls+'" href="'+esc(url)+'"'+(t?' target="'+esc(t)+'" rel="opener"':'')+'>'+inner+'</a>'; }

/* ---------- 원고 ---------- */
function workHTML(S,stories,cw){
  const w=findWork(S,cw.name);
  if(!w) return '<div class="work miss"><div class="head"><span class="name">'+esc(cw.name||'이름 없음')+'</span></div><p class="note">타이핑에 이 이름의 작품이 없습니다 — 설정에서 이름을 타이핑의 작품 이름과 똑같이 적으세요.</p></div>';
  const us=unitsOf(S,w), lu=lastUnit(S,w), kind=w.kind==='개정'?'개정':'초고';
  const base=cfg.taipingUrl||DEF.taipingUrl, href=lu?base+'#'+encodeURIComponent('원고')+'='+encodeURIComponent(lu.id):base;
  let now=0, target=0, unit='매', from=0, extra='';
  if(cw.unit==='page'){
    const r=curRev(w); unit='쪽';
    if(r){ now=revPages(r); from=r.from||0; target=+cw.target||r.total||0; extra='개정 '+r.no+'차'+(r.doneAt?' · 마침':''); }
    else { target=+cw.target||0; extra='타이핑에 개정 회차가 없습니다'; }
  } else {
    now=us.reduce((a,m)=>a+nowChars(m),0)/200; target=+cw.target||+w.targetMae||0;
  }
  const span=Math.max(0,target-from), pct=span?Math.max(0,Math.min(100,Math.round((now-from)/span*100))):null;
  const sub=[];
  if(extra) sub.push('<span>'+esc(extra)+'</span>');
  if(cw.unit!=='page') sub.push('<span>원고 '+us.length+'개</span>');
  if(target){ const left=target-now; sub.push('<span>'+(left>0?'남은 '+num(left,cw.unit==='page'?0:1)+unit:'목표를 채웠습니다')+'</span>'); }
  if(w.due&&!w.finishedAt){
    const d=Math.round((new Date(w.due+'T00:00:00')-new Date(ymd(new Date())+'T00:00:00'))/86400000);
    sub.push('<span class="'+(d<0?'late':'')+'">마감 '+esc(w.due.replace(/-/g,'.'))+' · '+(d>0?'D-'+d:d===0?'오늘':'D+'+(-d))+'</span>');
    if(target&&target>now&&d>=0) sub.push('<span>하루 '+num((target-now)/(d+1),1)+unit+'</span>');   /* 오늘을 넣어 남은 날로 나눈다 */
  }
  if(w.finishedAt) sub.push('<span>완성한 작품</span>');
  const flags=[], nScr=us.filter(m=>m.phoneAt).length, nMan=us.filter(m=>manualChanged(stories,m)).length;
  if(nScr) flags.push('<span>스크리브너에 아직 없음 '+nScr+'</span>');
  if(nMan) flags.push('<span>매뉴얼이 바뀜 '+nMan+'</span>');
  const ll=lu?lastLine(lu):'';
  return '<div class="work"><div class="head">'+aTag(href,'name',esc(w.title),0)+'<span class="kind">'+kind+'</span>'
    +'<span class="num"><b>'+num(now,cw.unit==='page'?0:1)+'</b>'+(target?' / '+num(target,cw.unit==='page'?0:1):'')+unit+(pct!=null?' · '+pct+'%':'')+'</span></div>'
    +(pct!=null?'<div class="bar'+(pct>=100?' done':'')+'"><i style="width:'+pct+'%"></i></div>':'')
    +(sub.length?'<div class="sub">'+sub.join('')+'</div>':'')
    +(lu?'<div class="last"><span class="t">이어 쓸 곳 · '+esc(lu.title||'제목 없음')+'</span>'+(ll?'<br>'+esc(ll):'')+'</div>':'<p class="note">아직 원고가 없습니다.</p>')
    +(flags.length?'<div class="flags">'+flags.join('')+'</div>':'')+'</div>';
}
function todayHTML(S){
  if(!S) return '';
  const k=tpDayKey(S,Date.now()), adv=(S.adv&&S.adv[k])||0, goal=S.daily||0, out=[];
  out.push('<span>오늘 <b'+(goal&&adv>=goal?' class="hit"':'')+'>'+num(adv/200,1)+'</b>매'+(goal?' / '+num(goal/200,1)+'매':'')+'</span>');
  let pg=0; (S.works||[]).forEach(w=>revsOf(w).forEach(r=>{ let before=r.from||0, upto=null; revLog(r).forEach(x=>{ const kk=tpDayKey(S,x.t); if(kk<k) before=x.p; else if(kk===k) upto=x.p; }); if(upto!=null) pg+=Math.max(0,upto-before); }));
  if(pg||S.dailyPg) out.push('<span>고친 쪽 <b'+(S.dailyPg&&pg>=S.dailyPg?' class="hit"':'')+'>'+pg+'</b>쪽'+(S.dailyPg?' / '+S.dailyPg+'쪽':'')+'</span>');
  const ms=(S.days&&S.days[k])||0; if(ms>=60000) out.push('<span>몰입 <b>'+Math.round(ms/60000)+'</b>분</span>');
  return '<div class="today">'+out.join('')+'</div>';
}
function topHTML(){
  const S=readTp(), stories=readSm();
  let h=todayHTML(S)+'<section><h2>원고</h2>';
  if(!S) h+='<p class="note">이 브라우저에 타이핑의 저장소가 없습니다. 시작 웹 앱 안에서 열어야 실제 작업이 보입니다.</p>';
  else if(!cfg.works.length) h+='<p class="note">설정에서 지금 작업 중인 작품의 이름을 적으세요. 타이핑의 작품 이름과 같아야 합니다.</p>';
  else h+=cfg.works.map(cw=>workHTML(S,stories,cw)).join('');
  return h+'</section>';
}

/* ---------- 아이디어 한 줄 — storyM의 받은편지함에 적는다(타이핑의 '아이디어 보내기'와 같은 길). storyM이 열릴 때 가져가 아이디어로 만든다 ---------- */
function ideaHTML(){
  const ss=readSm();
  if(!ss.length) return '<section><h2>구상</h2><p class="note">이 브라우저에 storyM의 소설이 없습니다 — storyM을 한 번 열면 여기서 아이디어를 보낼 수 있습니다.</p></section>';
  if(!ideaStory||!ss.some(s=>s.id===ideaStory)){
    const names=cfg.works.map(w=>norm(w.name)); const hit=ss.filter(s=>names.includes(norm(s.title)))[0];
    ideaStory=(hit||ss[0]).id;
  }
  return '<section><h2>구상 · 떠오른 것 한 줄</h2><div class="idea">'
    +'<select id="ideaStory" aria-label="소설">'+ss.map(s=>'<option value="'+esc(s.id)+'"'+(s.id===ideaStory?' selected':'')+'>'+esc(s.title||'제목 없음')+'</option>').join('')+'</select>'
    +'<input id="ideaText" placeholder="storyM의 아이디어로 보냅니다" aria-label="아이디어" value="'+esc(ideaDraft)+'">'
    +'<button class="btn go" id="ideaSend">보내기</button></div></section>';
}
function sendIdea(){
  const el=$('ideaText'), v=norm(el.value), sid=$('ideaStory').value; if(!v){ el.focus(); return; }
  const s=readSm().filter(x=>x.id===sid)[0]; if(!s){ toast('그 소설을 찾지 못했습니다'); return; }
  let arr=[]; try{ arr=JSON.parse(localStorage.getItem(IDEA_IN))||[]; }catch(e){} if(!Array.isArray(arr)) arr=[];
  arr.push({id:'wk'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),story_id:s.id,text:v,ms_link:'',ms_title:'',created_at:Date.now()});
  try{ localStorage.setItem(IDEA_IN,JSON.stringify(arr)); el.value=''; ideaDraft=''; toast("storyM '"+(s.title||'제목 없음')+"'의 아이디어로 보냈습니다"); }
  catch(e){ toast('보내지 못했습니다'); }
}

/* ---------- 도구·책·자료 ---------- */
function bookUrl(b){ return norm(b.url)||((cfg.seogaUrl||DEF.seogaUrl)+'#'+encodeURIComponent('책')+'='+encodeURIComponent(norm(b.name))); }
function restHTML(){
  let h='<section><h2>도구</h2>';
  h+=cfg.apps.length?'<div class="grid">'+cfg.apps.map((a,i)=>a.url?aTag(a.url,'card',esc(a.name||a.url),'app'+i):'').join('')+'</div>':'<p class="note">설정에서 글쓰기 앱을 더하세요.</p>';
  h+='</section>'+ideaHTML()+'<section><h2>책</h2>';
  h+=cfg.books.length?'<ul class="list">'+cfg.books.filter(b=>norm(b.name)).map((b,i)=>'<li>'+aTag(bookUrl(b),'','<span class="n">'+esc(b.name)+'</span><span class="u">'+(norm(b.url)?esc(b.url):'서가 · 자료로 읽기')+'</span>','book'+i)+'</li>').join('')+'</ul>':'<p class="note">설정에서 글쓰기와 관련해 읽는 책을 더하세요. 주소를 비우면 서가의 그 책이 열립니다.</p>';
  h+='</section><section><h2>자료</h2>';
  h+=cfg.refs.length?'<div class="chips">'+cfg.refs.filter(r=>r.url).map((r,i)=>aTag(r.url,'',esc(r.name||r.url),'ref'+i)).join('')+'</div>':'<p class="note">설정에서 데본씽크·씽즈·단축어 같은 자료의 주소를 더하세요.</p>';
  return h+'</section>';
}

/* ---------- 설정 ---------- */
const SECS=[
  ['works','원고','지금 작업 중인 초고·개정. 이름은 타이핑의 작품 이름과 똑같이. 목표를 비우면 타이핑에 적어 둔 목표 매수(쪽수는 개정 회차의 전체 쪽수)를 씁니다.'],
  ['apps','도구','가운데에 보일 글쓰기 앱. 이름과 주소.'],
  ['books','책','글쓰기와 관련해 읽는 책. 주소를 비우면 서가의 그 책이 \'자료로 읽기\'로 열립니다(이름은 서가의 책 제목과 같게).'],
  ['refs','자료','데본씽크(x-devonthink-item://…), 씽즈(things:///…), 단축어(shortcuts://run-shortcut?name=…) 같은 주소.']
];
function rowHTML(sec,x,i,S){
  const mv='<button data-act="up" data-sec="'+sec+'" data-i="'+i+'" aria-label="위로">↑</button><button data-act="del" data-sec="'+sec+'" data-i="'+i+'">빼기</button>';
  if(sec==='works'){
    const w=S?findWork(S,x.name):null;
    const st=!norm(x.name)?'':!S?'<div class="st bad">타이핑 저장소가 없습니다</div>':!w?'<div class="st bad">타이핑에 이 이름의 작품이 없습니다</div>'
      :'<div class="st">타이핑의 '+(w.kind==='개정'?'개정':'초고')+' 작품'+(w.targetMae?' · 목표 '+w.targetMae+'매':'')+(w.due?' · 마감 '+esc(w.due):'')+(x.unit==='page'&&!revsOf(w).length?' · 개정 회차가 없어 쪽수를 읽을 수 없습니다':'')+'</div>';
    return '<div class="srow"><input class="nm" list="tpWorks" placeholder="작품 이름" value="'+esc(x.name||'')+'" data-sec="works" data-i="'+i+'" data-k="name">'
      +'<select data-sec="works" data-i="'+i+'" data-k="unit" aria-label="세는 법"><option value="mae"'+(x.unit!=='page'?' selected':'')+'>매수</option><option value="page"'+(x.unit==='page'?' selected':'')+'>쪽수</option></select>'
      +'<input class="tg" type="number" min="0" inputmode="numeric" placeholder="목표" value="'+esc(x.target||'')+'" data-sec="works" data-i="'+i+'" data-k="target">'+mv+st+'</div>';
  }
  return '<div class="srow"><input class="nm"'+(sec==='books'?' list="sgRefs"':'')+' placeholder="'+(sec==='books'?'책 이름':'이름')+'" value="'+esc(x.name||'')+'" data-sec="'+sec+'" data-i="'+i+'" data-k="name">'
    +'<input class="url" placeholder="'+(sec==='books'?'주소(비우면 서가)':'주소')+'" value="'+esc(x.url||'')+'" data-sec="'+sec+'" data-i="'+i+'" data-k="url" autocapitalize="off" autocorrect="off" spellcheck="false">'+mv+'</div>';
}
function setHTML(){
  const S=readTp();
  let h='<div class="set"><datalist id="tpWorks">'+((S&&S.works)||[]).filter(workActive).map(w=>'<option value="'+esc(w.title)+'">').join('')+'</datalist>';
  const refs=seogaRefs();
  h+='<datalist id="sgRefs">'+refs.map(r=>'<option value="'+esc(r.title)+'">').join('')+'</datalist>';
  SECS.forEach(([sec,name,note])=>{
    h+='<h3>'+name+'</h3><p class="note">'+esc(note)+'</p>'+cfg[sec].map((x,i)=>rowHTML(sec,x,i,S)).join('')
      +'<div class="add"><button class="btn" data-act="add" data-sec="'+sec+'">'+name+' 더하기</button></div>';
    if(sec==='books') h+='<p class="note" style="margin-top:14px">책 이름 칸에 제목을 적으면 서가에 담긴 책 '+refs.length+'권에서 찾아 줍니다.</p>';
  });
  h+='<h3>주소</h3><p class="note">원고 이름을 누르면 여는 타이핑, 책을 여는 서가의 주소. 깃허브 apps/에 함께 올려 두면 그대로 두면 됩니다.</p>'
    +'<div class="srow"><input class="nm" value="타이핑" disabled><input class="url" data-top="taipingUrl" value="'+esc(cfg.taipingUrl)+'" autocapitalize="off" spellcheck="false"></div>'
    +'<div class="srow"><input class="nm" value="서가" disabled><input class="url" data-top="seogaUrl" value="'+esc(cfg.seogaUrl)+'" autocapitalize="off" spellcheck="false"></div>'
    +'<div class="add" style="margin-top:28px"><button class="btn go" id="setDone">돌아가기</button></div></div>';
  return h;
}

/* ---------- 그리기 ---------- */
function render(){
  const d=new Date(); $('date').textContent=d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+'일월화수목금토'[d.getDay()]+'요일';
  $('setBtn').textContent=view==='set'?'돌아가기':'설정';
  $('main').innerHTML=view==='set'?setHTML():'<div id="top">'+topHTML()+'</div><div id="rest">'+restHTML()+'</div>';
}
/* 타이핑에서 돌아오면 숫자만 다시 읽는다 — 적던 아이디어는 그대로 둔다 */
function refreshTop(){ if(view!=='home') return; const t=$('top'); if(t) t.innerHTML=topHTML(); }
$('setBtn').onclick=()=>{ view=view==='set'?'home':'set'; render(); window.scrollTo(0,0); };
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='ideaSend'){ sendIdea(); return; }
  if(b.id==='setDone'){ view='home'; render(); window.scrollTo(0,0); return; }
  const act=b.dataset.act, sec=b.dataset.sec, i=+b.dataset.i; if(!act||!cfg[sec]) return;
  if(act==='pick'){ if(!cfg.books.some(x=>norm(x.name)===norm(b.dataset.name))) cfg.books.push({name:b.dataset.name,url:''}); }
  else if(act==='add') cfg[sec].push(sec==='works'?{name:'',unit:'mae',target:''}:{name:'',url:''});
  else if(act==='del'){ const x=cfg[sec][i]; if(x&&(norm(x.name)||norm(x.url))&&!confirm("'"+(x.name||x.url)+"'을(를) 뺍니다.")) return; cfg[sec].splice(i,1); }
  else if(act==='up'&&i>0){ const t=cfg[sec][i-1]; cfg[sec][i-1]=cfg[sec][i]; cfg[sec][i]=t; }
  saveCfg(); render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='ideaStory'){ ideaStory=t.value; return; }
  if(t.dataset.top){ cfg[t.dataset.top]=norm(t.value)||DEF[t.dataset.top]; saveCfg(); return; }
  const sec=t.dataset.sec, k=t.dataset.k, i=+t.dataset.i; if(!sec||!k||!cfg[sec]||!cfg[sec][i]) return;
  cfg[sec][i][k]=k==='url'?t.value.trim():k==='target'?(t.value>0?+t.value:''):k==='unit'?t.value:norm(t.value);
  saveCfg(); if(sec==='works') render();
});
document.addEventListener('input',e=>{ if(e.target.id==='ideaText') ideaDraft=e.target.value; });
document.addEventListener('keydown',e=>{ if(e.target.id==='ideaText'&&e.key==='Enter'&&!e.isComposing){ e.preventDefault(); sendIdea(); } });
window.addEventListener('focus',()=>{ claimWin(); refreshTop(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') refreshTop(); });
window.addEventListener('storage',e=>{ if(e.key===TP_KEY||e.key===SM_KEY) refreshTop(); else if(e.key==='seoga.v1'&&view==='set'&&!(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName))) render(); else if(e.key===KEY){ cfg=loadCfg(); render(); } });
claimWin();
render();
</script>
</body>
</html>
