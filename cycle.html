<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>순환 — 손글씨·타이핑·교정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F5F1;
  --card:#FCFBF8;
  --ink:#17181A;
  --muted:#7C7D77;
  --faint:#A9A9A2;
  --grid:#C6CFBD;          /* 원고지 격자 */
  --carry:#C9C7BE;         /* 이어받은 원고 */
  --line:#E2E0D8;
  --s1:#6E7175;            /* 연필 */
  --s2:#4F6B4C;            /* 원고지 초록 */
  --s3:#A8322A;            /* 교정 주묵 */
  --s4:#3E5A6E;            /* 재타이핑 청람 */
  --sans:'Apple SD Gothic Neo','애플 SD 산돌고딕 Neo',-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;
  --serif:'Gowun Batang','고운바탕','Apple SD Gothic Neo',serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141513; --card:#1B1C19; --ink:#EDEBE4; --muted:#918F86; --faint:#6A6961;
    --grid:#3D473A; --carry:#4A4A44; --line:#2C2D29;
    --s1:#9A9DA1; --s2:#7FA07A; --s3:#D4695E; --s4:#7FA0BC;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding:0 18px calc(48px + env(safe-area-inset-bottom));
}
.wrap{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--s2);outline-offset:2px}

/* ── 머리 ── */
header{padding:26px 0 16px}
.brandrow{display:flex;align-items:baseline;gap:10px;margin-bottom:18px}
.brand{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.14em}
.brandsub{font-size:11.5px;color:var(--faint);letter-spacing:.02em}
.projrow{display:flex;gap:8px;align-items:center;margin-bottom:20px}
select.proj{
  flex:1;min-width:0;appearance:none;background:transparent;
  border:none;border-bottom:1px solid var(--line);
  padding:5px 20px 5px 0;font-size:14.5px;font-weight:600;
  background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 9px) 14px,calc(100% - 5px) 14px;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
.cyclebox{display:flex;align-items:baseline;gap:14px;margin-bottom:24px}
.cycle{font-family:var(--serif);line-height:1}
.cycle b{font-size:40px;font-weight:700;letter-spacing:-.02em}
.cycle span{font-size:15px;color:var(--muted);margin:0 3px}
.cyclemeta{margin-left:auto;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.5}
.cyclemeta b{color:var(--ink);font-size:13px;font-weight:600}

/* ── 원고지 게이지 ── */
.gwrap{position:relative;margin-bottom:7px}
.gseg{display:flex;gap:1px;height:22px}
.gseg div{
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  font-family:var(--mono);font-size:10px;letter-spacing:.02em;
  transition:background .4s ease;
}
.gwrap.solo .gseg{display:none}
.gwrap.solo .gbar{margin-top:0;height:16px}
.gbar{margin-top:4px;height:11px;background:var(--line);overflow:hidden;position:relative}
.gbar i{display:block;height:100%;transition:width .5s ease;box-shadow:1px 0 0 var(--s3)}
.qtick{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--s3);opacity:.55;pointer-events:none}
.qtick b{
  position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:9px;font-weight:500;color:var(--s3);opacity:.9;
}
.gaugecap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.02em}

/* ── 탭 ── */
nav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 24px}
nav button{
  padding:9px 14px;font-size:13.5px;color:var(--muted);font-weight:500;
  border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:.01em;
}
nav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}

/* ── 단계 표시 ── */
.steps{display:flex;gap:0;margin-bottom:18px}
.steps div{
  flex:1;padding:7px 0 0;border-top:2px solid var(--line);
  font-size:11px;color:var(--faint);letter-spacing:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px;
}
.steps div.on{border-top-color:var(--sc);color:var(--sc);font-weight:600}
.steps div.done{border-top-color:var(--line);color:var(--muted)}

/* ── 카드 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:24px 22px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;color:var(--sc);font-weight:600;margin-bottom:9px}
h2.t{font-family:var(--serif);font-size:25px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
p.guide{font-family:var(--serif);font-size:16px;line-height:1.85;color:var(--ink);margin:0 0 20px}
p.note{font-family:var(--serif);font-size:14px;line-height:1.8;color:var(--muted);margin:0 0 18px}
.hintcard{
  border-left:2px solid var(--s3);background:color-mix(in srgb,var(--s3) 6%,transparent);
  padding:12px 14px;margin:0 0 20px;
}
.hintcard .lb{font-size:11px;letter-spacing:.12em;color:var(--s3);font-weight:600;margin-bottom:5px}
.hintcard .tx{font-family:var(--serif);font-size:15.5px;line-height:1.75;white-space:pre-wrap}

.tailcard{
  border-left:2px solid var(--s4);background:color-mix(in srgb,var(--s4) 5%,transparent);
  padding:13px 15px;margin:0 0 20px;max-height:240px;overflow-y:auto;
}
.tailcard .lb{font-size:11px;letter-spacing:.12em;color:var(--s4);font-weight:600;margin-bottom:6px}
.tailcard .tx{font-family:var(--serif);font-size:15.5px;line-height:1.85;white-space:pre-wrap}

label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin:0 0 7px}
textarea,input[type=text],input[type=number],input[type=url]{
  width:100%;background:transparent;border:1px solid var(--line);border-radius:2px;
  padding:11px 12px;font-family:var(--serif);font-size:15.5px;line-height:1.75;
  resize:vertical;
}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px}
textarea:focus,input:focus{border-color:var(--sc,var(--s2));outline:none}
.field{margin-bottom:20px}
.field:last-of-type{margin-bottom:22px}

/* 보조 버튼 */
.ghost{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:2px;padding:11px 15px;
  font-size:13.5px;font-weight:600;width:100%;justify-content:center;
  background:var(--paper);
}
.ghost:hover{border-color:var(--sc)}
.ghost small{font-weight:400;color:var(--muted);font-size:12px}
.ghost.fin{border-color:color-mix(in srgb,var(--s3) 45%,var(--line));color:var(--s3)}
.ghost.fin:hover{border-color:var(--s3);background:color-mix(in srgb,var(--s3) 6%,var(--paper))}

/* 칩 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);border-radius:2px;padding:7px 11px;font-size:13px;color:var(--muted);
}
.chip[aria-pressed="true"]{border-color:var(--sc);color:var(--sc);font-weight:600;background:color-mix(in srgb,var(--sc) 7%,transparent)}

/* 계산 표시 */
.calc{
  display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-family:var(--mono);
  font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);
}
.calc b{display:block;font-size:20px;color:var(--ink);font-weight:600;letter-spacing:-.02em;margin-top:2px}
.calc .up b{color:var(--s2)} .calc .down b{color:var(--s3)}

/* 주 버튼 */
.done{
  width:100%;background:var(--sc);color:#fff;border-radius:2px;
  padding:19px 20px;font-size:16px;font-weight:700;letter-spacing:.01em;
  display:flex;align-items:center;justify-content:center;gap:12px;
  transition:filter .15s;
}
@media (prefers-color-scheme: dark){.done{color:#141513}}
.done:hover{filter:brightness(1.12)}
.done kbd{font-family:var(--mono);font-size:11.5px;font-weight:500;opacity:.65;letter-spacing:0}

/* ── 로그 ── */
.today{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:2px;margin-bottom:26px}
.today div{background:var(--card);padding:13px 12px}
.today dt{font-size:11px;color:var(--muted);letter-spacing:.02em}
.today dd{margin:3px 0 0;font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.today dd small{font-size:11px;font-weight:400;color:var(--faint);margin-left:1px}
.today dd em{font-style:normal;font-size:13px;font-weight:500;color:var(--faint);margin-left:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;font-size:11px;letter-spacing:.06em;color:var(--faint);font-weight:600;
  padding:0 8px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:11px 8px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.d{color:var(--s2);font-size:11.5px} .d.m{color:var(--s3)}
td .rs{font-size:12px;color:var(--muted);display:block;margin-top:2px;font-family:var(--serif)}
.del{color:var(--faint);font-size:15px;line-height:1;padding:2px 4px}
.del:hover{color:var(--s3)}
.lnk{font-family:var(--mono);font-size:13px;border-bottom:1px dashed var(--line);padding-bottom:1px}
.lnk:hover{border-bottom-color:var(--s2);color:var(--s2)}
.empty{font-family:var(--serif);color:var(--muted);text-align:center;padding:44px 20px;font-size:15px;line-height:1.9}

/* ── 설정 ── */
.sec{border-top:1px solid var(--line);padding:22px 0}
.sec:first-of-type{border-top:none;padding-top:0}
h3{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:600;margin:0 0 14px}
.row{display:flex;gap:8px;align-items:flex-start}
.row .ghost{width:auto;flex:0 0 auto;padding:11px 14px}
.plist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:2px;margin-bottom:12px}
.pitem{background:var(--card);padding:11px 13px;display:flex;align-items:center;gap:10px}
.pitem.on{background:color-mix(in srgb,var(--s2) 8%,var(--card))}
.pitem span{flex:1;font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem em{font-family:var(--mono);font-size:11px;color:var(--muted);font-style:normal}
.pitem button{font-size:12px;color:var(--muted)}
.pitem button:hover{color:var(--ink)}
.hint{font-family:var(--serif);font-size:13.5px;color:var(--muted);line-height:1.75;margin:9px 0 0}
.gatewrap{margin-bottom:22px}
.gaterow{display:flex;gap:8px;align-items:stretch}
.gaterow .gate{flex:1;min-width:0}
.gaterow .ghost{width:auto;flex:0 0 auto;padding:0 15px;text-align:center;line-height:1.35}
.gate{
  display:flex;align-items:center;gap:12px;cursor:pointer;
  border:1px solid var(--sc);border-radius:2px;padding:16px;
  background:color-mix(in srgb,var(--sc) 6%,transparent);
}
.gate input{width:18px;height:18px;accent-color:var(--sc);margin:0;cursor:pointer;flex:0 0 auto}
.gate span{font-family:var(--serif);font-size:16.5px;font-weight:700;line-height:1.4}
.gate.on{border-color:var(--line);background:transparent;padding:10px 13px}
.gate.on span{font-size:14px;font-weight:400;color:var(--muted)}
.gate.on input{width:15px;height:15px}
.gatehint{font-family:var(--serif);font-size:13.5px;color:var(--muted);margin:10px 0 0}

label.sw{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;font-weight:600}
label.sw input{width:16px;height:16px;accent-color:var(--s2);margin:0;cursor:pointer}

/* 토스트 */
#alert{
  display:none;background:var(--s3);color:#fff;padding:13px 18px;
  font-size:13.5px;line-height:1.6;text-align:center;margin:0 -18px 0;
}
#alert.on{display:block}
#alert button{
  border:1px solid rgba(255,255,255,.55);border-radius:2px;padding:4px 10px;
  font-size:12.5px;font-weight:600;margin-left:8px;color:#fff;
}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
  background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:2px;
  font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:9;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .today{grid-template-columns:repeat(2,1fr)}
  table,thead,tbody,tr,td{display:block}
  thead{display:none}
  tr{border-bottom:1px solid var(--line);padding:13px 0;position:relative}
  td{border:none;padding:1px 34px 1px 0}
  td.n{display:inline-block;margin-right:14px}
  td.act{position:absolute;right:0;top:11px;padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="alert">
  <b>저장 공간이 가득 찼습니다.</b> 지금부터의 기록이 저장되지 않습니다. 백업을 내려받고, 완료한 원고를 보관해 자리를 비우세요.
  <button data-act="export">백업 내려받기</button>
</div>
<div class="wrap">
  <header>
    <div class="brandrow"><div class="brand">순 환</div><div class="brandsub">손글씨 → 타이핑 → 종이 교정</div></div>
    <div class="projrow"><select class="proj" id="projSel"></select></div>
    <div class="cyclebox">
      <div class="cycle" id="cycleNo"></div>
      <div class="cyclemeta" id="cycleMeta"></div>
    </div>
    <div class="gwrap" id="gWrap">
      <div class="gseg" id="gSeg"></div>
      <div class="gbar"><i id="gFill"></i></div>
      <div class="qtick" style="left:25%"><b>¼</b></div>
      <div class="qtick" style="left:50%"><b>½</b></div>
      <div class="qtick" style="left:75%"><b>¾</b></div>
    </div>
    <div class="gaugecap" id="gaugeCap"></div>
  </header>

  <nav>
    <button data-tab="cycle" aria-selected="true">글쓰기 순환</button>
    <button data-tab="log" aria-selected="false">로그</button>
    <button data-tab="set" aria-selected="false">설정</button>
  </nav>

  <main id="view"></main>
</div>
<div id="toast"></div>

<script>
"use strict";
const KEY = "sunhwan.v1";
const FEELS = ["잘 풀린다","나쁘지 않다","모르겠다","미덥잖다","안 될 것 같다"];
const feelScore = f => { const i = FEELS.indexOf(f); return i < 0 ? null : 5 - i; };
const feelOf = e => e.feel || (e.tags || []).join(", ") || "";
const GATES = { 2:"손으로 쓴 노트 한 장이 준비됐습니까?", 3:"원고를 프린트했습니까?", 4:"원고를 교열했습니까?" };
const MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const CMD = MAC ? "⌘↵" : "Ctrl+↵";
const SC = ["", "var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)"];

/* ── 상태 ── */
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36);
const blankDraft = () => ({ insight:"", chars:"", feel:"", proof:"", plan:"", final:"", feel2:"", hint:"", tail:"", gate:{} });
const newProject = (name) => ({
  id: uid(), name: name || "새 원고", goalPages: 80, scrivenerUrl: "", startChars: 0, use2667: true,
  cycle: 1, stage: 1, carryHint: "", carryTail: "", draft: blankDraft(), entries: []
});

let S = load(), tab = "cycle", logLimit = 50, projQ = "", arcQ = "";
const LIST_MAX = 12;

function load(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY));
    if (r && Array.isArray(r.projects) && r.projects.length) return migrate(r);
  }catch(e){}
  const p = newProject("첫 원고");
  return { version:1, activeId:p.id, projects:[p], archives:[] };
}
function migrate(r){
  r.archives = Array.isArray(r.archives) ? r.archives : [];
  r.projects.forEach(x => {
    x.draft = x.draft || blankDraft(); x.draft.gate = x.draft.gate || {};
    x.carryTail = x.carryTail || "";
    x.entries = x.entries || [];
    x.stage = x.stage || 1; x.cycle = x.cycle || 1;
    x.startChars = Math.max(0, parseInt(x.startChars, 10) || 0);
    x.use2667 = x.use2667 !== false;
  });
  if (!r.projects.some(x => x.id === r.activeId)) r.activeId = r.projects[0].id;
  return r;
}
let saveFailed = false;
function usage(){ try{ return (localStorage.getItem(KEY) || "").length * 2; }catch(e){ return 0; } }
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(S));
    if (saveFailed){ saveFailed = false; document.getElementById("alert").classList.remove("on"); }
  }catch(e){
    saveFailed = true;
    document.getElementById("alert").classList.add("on");
  }
}
function P(){ return S.projects.find(p => p.id === S.activeId) || S.projects[0]; }

function rows(p){
  const list = [...p.entries].sort((a,b) => a.cycle - b.cycle || a.ts - b.ts);
  let prev = p.startChars || 0;
  return list.map(e => {
    const mid = (typeof e.mid === "number") ? e.mid : e.chars;
    const d = e.chars - prev, grew = mid - prev, trim = e.chars - mid;
    prev = e.chars;
    return { ...e, delta:d, grew, trim };
  });
}
const totalChars = p => { const r = rows(p); return r.length ? r[r.length-1].chars : (p.startChars || 0); };
const pagesOf = c => c / 200;
const fmt = n => n.toLocaleString("ko-KR");
const pg = c => (c/200).toFixed(1);

/* ── 공용 ── */
let toastT;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2000);
}
async function copy(text, msg){
  if (!text.trim()){ toast("복사할 내용이 아직 없습니다"); return false; }
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); }catch(_){ document.body.removeChild(ta); toast("복사하지 못했습니다"); return false; }
    document.body.removeChild(ta);
  }
  toast(msg || "복사했습니다"); return true;
}
function openScrivener(p){
  if (!p.scrivenerUrl){ toast("설정에서 스크리브너 주소를 등록하세요"); return; }
  window.open(p.scrivenerUrl, "_blank");
}
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const sameDay = (a,b) => { const x = new Date(a), y = new Date(b);
  return x.getFullYear()===y.getFullYear() && x.getMonth()===y.getMonth() && x.getDate()===y.getDate(); };
function stamp(ts){
  const d = new Date(ts), p = n => String(n).padStart(2,"0");
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ── 머리 그리기 ── */
function renderHead(){
  const p = P();
  p.lastUsed = p.lastUsed || 0;
  const opts = [...S.projects].sort((a,b) => (b.lastUsed||0) - (a.lastUsed||0));
  document.getElementById("projSel").innerHTML =
    opts.map(x => `<option value="${x.id}"${x.id===p.id?" selected":""}>${esc(x.name)}</option>`).join("");

  document.getElementById("cycleNo").innerHTML = `<span>제</span><b>${p.cycle}</b><span>회차</span>`;

  const c = totalChars(p), pgs = pagesOf(c), goal = p.goalPages || 80;
  const start = p.startChars || 0, spg = pagesOf(start), diff = pgs - spg;
  document.getElementById("cycleMeta").innerHTML =
    `<b>${pgs.toFixed(1)}매</b> / ${goal}매<br>${fmt(c)}자 · ${p.entries.length}회 완주`
    + (start ? `<br>이 순환으로 ${diff >= 0 ? "+" : "−"}${Math.abs(diff).toFixed(1)}매` : "");

  const UNIT = 2667, goalChars = goal * 200, on2667 = p.use2667 !== false;
  const n = Math.max(1, Math.ceil(goalChars / UNIT));
  const cur = Math.max(1, Math.min(n, Math.floor(c / UNIT) + 1));
  const inSeg = Math.max(0, c - (cur - 1) * UNIT);

  document.getElementById("gWrap").className = "gwrap" + (on2667 ? "" : " solo");
  document.getElementById("gSeg").innerHTML = !on2667 ? "" :
    Array.from({length:n}, (_,i) => {
      const w = Math.min(UNIT, goalChars - i * UNIT);
      const fi = Math.max(0, Math.min(1, (c - i * UNIT) / w));
      const on = (i + 1) === cur;
      const ink = i % 2 ? "var(--s2)" : "color-mix(in srgb,var(--s2) 78%,var(--ink))";
      const pale = `color-mix(in srgb,var(--s2) ${i % 2 ? 15 : 26}%,var(--paper))`;
      const f = (fi * 100).toFixed(1);
      const fg = fi >= .55 ? "var(--paper)" : "color-mix(in srgb,var(--ink) 45%,transparent)";
      return `<div style="flex:${w} 0 0;color:${fg}${on?";font-weight:700":""};`
        + `background:linear-gradient(to right,${ink} 0 ${f}%,${pale} ${f}% 100%)">${i+1}</div>`;
    }).join("");

  const pct = Math.max(0, Math.min(100, c / goalChars * 100));
  const cPct = Math.max(0, Math.min(pct, start / goalChars * 100));
  const rel = pct > 0 ? (cPct / pct * 100).toFixed(1) : 0;
  document.getElementById("gFill").style.cssText =
    `width:${pct.toFixed(2)}%;background:linear-gradient(to right,color-mix(in srgb,var(--ink) 32%,var(--line)) 0 ${rel}%,var(--ink) ${rel}% 100%)`;

  const q = Math.max(1, Math.min(4, Math.floor(pct / 25) + 1));
  document.getElementById("gaugeCap").innerHTML = on2667
    ? `<span>${cur}구간 · 이 구간에서 ${fmt(Math.min(inSeg, UNIT))}자 / ${fmt(UNIT)}자</span>`
      + `<span>${Math.round(pgs / goal * 100)}% · 전체 ${n}구간</span>`
    : `<span>${q}/4 구간</span><span>${Math.round(pgs / goal * 100)}% · 목표 ${goal}매</span>`;
}

/* ── 순환 탭 ── */
/* 1단계는 앞 단계가 앱 안에서 끝나므로 확인할 물건이 없다 */
function needGate(p){ return p.stage !== 1; }
function gateOk(p){ return !needGate(p) || !!p.draft.gate[p.stage]; }

function renderCycle(){
  const p = P(), d = p.draft, s = p.stage, sc = SC[s];
  const steps = ["노트 한 장","타이핑","프린트 교정","재타이핑"]

    body = `

        <label class="f" for="i-chars">타이핑을 마친 시점의 총 글자수 <span style="font-weight:400;color:var(--faint)">· 공백 포함</span></label>
        <input type="number" id="i-chars" inputmode="numeric" min="0" step="1" placeholder="${fmt(last)}" value="${esc(d.chars)}">
        <div class="calc" id="calc"></div>
      </div>
      <div class="field">
        <label class="f">새로 쓴 대목의 느낌 <span style="font-weight:400;color:var(--faint)">· 선택</span></label>
        <div class="chips">${FEELS.map(t =>
          `<button class="chip" data-act="feel" data-t="${esc(t)}" aria-pressed="${d.feel===t}">${t}</button>`).join("")}</div>
      </div>
      <div class="field">
        <label class="f" for="i-proof">교열의 방향</label>
        <textarea id="i-proof" rows="4" placeholder="다음 프린트 교정 단계에서 무엇에 집중하고 어떻게 전개하면 좋을지를 미리 적습니다. 이 글이 원고 말미에 붙어 함께 프린트됩니다.">${esc(d.proof)}</textarea>
      </div>
      <button class="done" data-act="next">타이핑을 마쳤습니다 <kbd>${CMD}</kbd></button>`;
  } else if (s === 3){
    head = `
      <div class="eyebrow">3단계 · 주묵 · 전체 원고 교열</div>
      <h2 class="t">프린트 교정</h2>
      <p class="guide">새로 쓴 대목을 포함해 원고 전체를 프린트한 뒤, 종이 위에서 교열합니다.</p>`;
    body = `

  } else {
    head = `
      <div class="eyebrow">4단계 · 청람 · 기존 원고 다듬기</div>

      <p class="guide">교열한 종이를 옆에 놓고, 스크리브너에서 원고를 고쳐 씁니다.<br>이 단계에서는 프린트하지 않습니다.</p>`;
    body = `

        <p class="hint">종이의 교정 부호를 따라가며 원고를 고칩니다. 여기까지가 한 회차입니다.</p>

        <input type="number" id="i-final" inputmode="numeric" min="0" step="1" placeholder="${fmt(parseInt(d.chars,10) || totalChars(p))}" value="${esc(d.final)}">

      </div>
      <div class="field">
        <label class="f">고쳐 쓴 원고 전체의 느낌 <span style="font-weight:400;color:var(--faint)">· 선택</span></label>

          `<button class="chip" data-act="feel2" data-t="${esc(t)}" aria-pressed="${d.feel2===t}">${t}</button>`).join("")}</div>
        ${d.feel ? `<p class="hint">2단계에서 새로 쓴 대목에는 ‘${esc(d.feel)}’이라고 적었습니다.</p>` : ""}
      </div>
      <div class="field">
        <label class="f" for="i-hint">다음 회차 손글씨를 위한 집필 힌트</label>
        <textarea id="i-hint" rows="5" placeholder="다음 노트 한 장에 무엇을 쓸지 한두 줄로 남깁니다. 다음 회차 1단계 맨 위에 이 글이 놓입니다.">${esc(d.hint)}</textarea>

        : s===3 ? "‘스크리브너 열기’를 누르면 교열의 방향이 복사됩니다. 원고 말미에 붙인 다음 프린트하고, 종이가 손에 들어오면 확인합니다."
        : "종이 위에서 교열을 마쳤다면 확인하고 시작합니다. 교정 부호가 없는 종이라면 아직 3단계입니다."}</p>`}
    </div>`;

  document.getElementById("view").innerHTML =
    `<div style="--sc:${sc}"><div class="steps">${steps}</div><div class="card">${head}${gate}${ok ? body : ""}</div></div>`;
  if (ok && (s === 2 || s === 4)) calc();
}

function calc(){
  const el = document.getElementById("calc"); if (!el) return;
  const p = P(), d = p.draft, last = totalChars(p);

  if (p.stage === 2){
    const v = parseInt(d.chars, 10);
    if (isNaN(v)){ el.innerHTML = `<div>누적 ${fmt(last)}자 · ${pg(last)}매에서 이어 씁니다.</div>`; return; }
    const dl = v - last, cut = dl < 0;
    el.innerHTML =
      `<div>원고지<b>${pg(v)}매</b></div>
       <div class="${cut?"down":"up"}">${cut ? "덜어낸 분량" : "이번에 늘린 분량"}<b>${cut?"−":"+"}${fmt(Math.abs(dl))}자</b></div>
       <div class="${cut?"down":"up"}">&nbsp;<b>${cut?"−":"+"}${(Math.abs(dl)/200).toFixed(1)}매</b></div>`;
    return;
  }

  const mid = parseInt(d.chars, 10), base = isNaN(mid) ? last : mid;
  const v = parseInt(d.final, 10);
  if (isNaN(v)){
    el.innerHTML = `<div>2단계에서 적은 ${fmt(base)}자에서 고쳐 씁니다. 다 고친 뒤의 숫자를 넣습니다.</div>`;
    return;
  }
  const grew = base - last, trim = v - base, net = v - last;
  el.innerHTML =
    `<div>최종<b>${pg(v)}매</b></div>
     <div class="${net<0?"down":"up"}">이 회차 순증<b>${net<0?"−":"+"}${fmt(Math.abs(net))}자</b></div>
     <div class="up">늘린 양<b>${grew<0?"−":"+"}${fmt(Math.abs(grew))}자</b></div>
     <div class="down">조인 양<b>${trim>0?"+":"−"}${fmt(Math.abs(trim))}자</b></div>`;
}

/* ── 단계 넘기기 ── */
function next(){
  const p = P(), d = p.draft;
  if (!gateOk(p)){
    toast("먼저 체크포인트를 확인해 주세요");
    const g = document.getElementById("i-gate");
    if (g){ g.focus(); g.closest(".gate").scrollIntoView({block:"center",behavior:"smooth"}); }
    return;
  }
  if (p.stage === 1){
    p.carryTail = "";
    p.stage = 2;
  } else if (p.stage === 2){
    const v = parseInt(d.chars, 10);
    if (isNaN(v) || v < 0){ focus("i-chars"); toast("총 글자수를 입력해 주세요"); return; }
    p.stage = 3;
  } else if (p.stage === 3){
    p.stage = 4;
  } else {
    const mid = parseInt(d.chars, 10);
    const v = parseInt(d.final, 10);
    if (isNaN(v) || v < 0){ focus("i-final"); toast("최종 글자수를 입력해 주세요"); return; }
    p.entries.push({ id:uid(), cycle:p.cycle, ts:Date.now(), chars:v,
      mid: isNaN(mid) ? v : mid,
      feel:d.feel || "", proof:d.proof.trim(), feel2:d.feel2 || "", insight:d.insight.trim(),
      plan:d.plan.trim(), hint:d.hint.trim() });
    p.carryHint = d.hint.trim();
    p.carryTail = d.tail.trim();
    p.cycle += 1; p.stage = 1; p.draft = blankDraft(); p.lastUsed = Date.now();
    toast(`${p.cycle - 1}회차를 마쳤습니다`);
  }
  save(); renderHead(); renderCycle();
  window.scrollTo({ top:0, behavior:"smooth" });
}
function focus(id){ const e = document.getElementById(id); if (e){ e.focus(); e.scrollIntoView({block:"center",behavior:"smooth"}); } }

function allEntries(){
  const out = [];
  S.projects.forEach(p => rows(p).forEach(e => out.push({ ...e, proj: p.name })));
  return out.sort((a,b) => a.ts - b.ts);
}
function todayAll(){
  const now = Date.now();
  let cycles = 0, chars = 0;
  S.projects.forEach(p => rows(p).forEach(e => {
    if (sameDay(e.ts, now)){ cycles++; chars += e.delta; }
  }));
  return { cycles, chars };
}
const DOW = ["일","월","화","수","목","금","토"];
function dayKey(ts){
  const d = new Date(ts), p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

/* ── 로그 탭 ── */
function renderLog(){
  const p = P(), r = rows(p), now = Date.now();
  const today = r.filter(e => sameDay(e.ts, now));
  const tChars = today.reduce((a,b) => a + b.delta, 0);
  const total = totalChars(p);

  const head = (() => {
    const ta = todayAll(), multi = S.projects.length > 1;
    const par = v => multi ? ` <em>(${v})</em>` : "";
    const sign = v => (v >= 0 ? "" : "−") + fmt(Math.abs(v));
    return `
    <dl class="today">
      <div><dt>오늘 마친 회차</dt><dd>${today.length}<small>회</small>${par(ta.cycles)}</dd></div>
      <div><dt>오늘 순증</dt><dd${tChars<0?' style="color:var(--s3)"':''}>${sign(tChars)}<small>자</small>${par(sign(ta.chars))}</dd></div>
      <div><dt>오늘 매수</dt><dd${tChars<0?' style="color:var(--s3)"':''}>${tChars>=0?"":"−"}${(Math.abs(tChars)/200).toFixed(1)}<small>매</small>${par((ta.chars>=0?"":"−")+(Math.abs(ta.chars)/200).toFixed(1))}</dd></div>
      <div><dt>목표까지</dt><dd>${Math.max(0, p.goalPages - pagesOf(total)).toFixed(1)}<small>매</small></dd></div>
    </dl>
    ${multi ? '<p class="hint" style="margin:-18px 0 24px">괄호 안은 오늘 모든 원고를 합한 수치입니다.</p>' : ""}`;
  })();

  const rev = [...r].reverse(), showing = rev.slice(0, logLimit);
  const table = r.length ? `
    <table>
      <thead><tr><th>회차</th><th>적은 시각</th><th>누적 글자수</th><th>원고지 매수</th><th>느낌</th><th></th></tr></thead>
      <tbody>${showing.map(e => `
        <tr>
          <td class="n">${e.cycle}회</td>
          <td class="n" style="color:var(--muted)">${stamp(e.ts)}</td>
          <td class="n"><button class="lnk" data-act="edit" data-id="${e.id}" title="누적 글자수 고치기">${fmt(e.chars)}자</button></td>
          <td class="n">${pg(e.chars)}매 <span class="d${e.delta<0?" m":""}">${e.delta>=0?"+":"−"}${(Math.abs(e.delta)/200).toFixed(1)}</span>
              ${e.trim ? `<span class="rs">늘림 ${e.grew>=0?"+":"−"}${fmt(Math.abs(e.grew))} · 조임 ${e.trim>0?"+":"−"}${fmt(Math.abs(e.trim))}</span>` : ""}</td>
          <td>${feelOf(e) || e.feel2 ? esc([feelOf(e), e.feel2].filter(Boolean).join(" → ")) : '<span style="color:var(--faint)">—</span>'}
              ${(e.proof||e.note) ? `<span class="rs">교열 · ${esc(e.proof||e.note)}</span>` : ""}</td>
          <td class="act"><button class="del" data-act="del" data-id="${e.id}" title="삭제">×</button></td>
        </tr>`).join("")}
      </tbody>
    </table>
    ${rev.length > logLimit ? `<button class="ghost" data-act="more" style="margin-top:14px">이전 회차 더 보기 <small>남은 ${rev.length - logLimit}회차</small></button>` : ""}`
    : `<p class="empty">아직 마친 회차가 없습니다.<br>3단계까지 한 바퀴를 돌면 여기 한 줄이 쌓입니다.</p>`;

  document.getElementById("view").innerHTML = head + table + `
    <div class="sec" style="margin-top:26px">
      <h3>AI 분석 프롬프트</h3>
      <p class="hint" style="margin:0 0 12px">기록을 표로 정리하고 분석 질문을 붙여 만듭니다. 복사해서 대화창에 붙여 넣으면 됩니다.</p>
      <div class="row">
        <button class="ghost" data-act="prompt">이 원고의 회차 분석</button>
        <button class="ghost" data-act="promptAll">매일의 글쓰기 평가 · 전체 원고</button>
      </div>
      <div id="promptBox"></div>
    </div>`;
}

let lastPrompt = "";
function showPrompt(text){
  lastPrompt = text;
  document.getElementById("promptBox").innerHTML =
    `<textarea rows="10" readonly style="margin-top:12px;font-size:13px">${esc(text)}</textarea>
     <button class="ghost" data-act="pcopy" style="margin-top:8px">프롬프트 복사</button>`;
}

function buildPromptAll(){
  const all = allEntries();
  if (!all.length) return null;

  const days = new Map();
  all.forEach(e => {
    const k = dayKey(e.ts);
    if (!days.has(k)) days.set(k, []);
    days.get(k).push(e);
  });
  let keys = [...days.keys()].sort();
  const cut = keys.length > 60;
  if (cut) keys = keys.slice(-60);

  const body = keys.map(k => {
    const list = days.get(k).sort((a,b) => a.ts - b.ts);
    const sum = list.reduce((a,b) => a + b.delta, 0);
    const d = new Date(list[0].ts);
    const head = `${k} (${DOW[d.getDay()]}) | ${list.length}회차 | ${sum>=0?"+":"−"}${Math.abs(sum)}자 (${(Math.abs(sum)/200).toFixed(1)}매)`;
    const rows = list.map(e => {
      const t = new Date(e.ts), p = n => String(n).padStart(2,"0");
      return `  · ${e.proj} ${e.cycle}회차 ${p(t.getHours())}:${p(t.getMinutes())} `
        + `${e.delta>=0?"+":"−"}${Math.abs(e.delta)}자`
        + (e.trim ? ` (늘림 ${e.grew>=0?"+":"−"}${Math.abs(e.grew)}, 조임 ${e.trim})` : "")
        + ` / 느낌: ${[feelOf(e)||"-", e.feel2||"-"].join(" → ")}`
        + ((e.proof||e.note) ? ` / 교열 방향: ${e.proof||e.note}` : "");
    });
    return [head, ...rows].join("\n");
  }).join("\n");

  const first = new Date(days.get(keys[0])[0].ts), last = new Date();
  const span = Math.max(1, Math.round((last - first) / 86400000) + 1);
  const ta = todayAll();
  const todayKey = dayKey(Date.now());
  const wroteToday = days.has(todayKey);

  return [
    "나는 소설을 쓰는 사람입니다. 한 회차는 네 단계입니다. 1) 앞 대목에 이어 손으로 노트 한 장을 새로 쓰고 2) 스크리브너에 타이핑하며 그 대목을 다듬고 3) 원고 전체를 프린트해 종이 위에서 교열하고 4) 교열한 종이를 보며 스크리브너에서 다시 고쳐 씁니다. 1·2단계가 원고를 늘리는 일이고, 3·4단계가 이미 쓴 것을 조이는 일입니다.",
    "여러 원고를 동시에 굴리기도 합니다. 아래는 모든 원고의 기록을 날짜별로 묶은 것입니다.",
    "",
    "[원고 현황]",
    ...S.projects.map(p =>
      `- ${p.name}: ${pg(totalChars(p))}매 / 목표 ${p.goalPages}매, ${p.cycle}회차 진행 중`),
    "",
    `[기간] ${keys[0]} ~ ${todayKey} · ${keys.length}일 기록 / 달력상 ${span}일${cut ? " (최근 60일만 실었습니다)" : ""}`,
    "",
    "[오늘]",
    wroteToday
      ? `오늘 ${ta.cycles}회차, 순증 ${ta.chars>=0?"+":"−"}${Math.abs(ta.chars)}자 (${(Math.abs(ta.chars)/200).toFixed(1)}매).`
      : "오늘은 아직 마친 회차가 없습니다.",
    "",
    "[날짜별 기록]",
    "순증이 음수인 회차는 새로 쓴 분량보다 교정으로 덜어낸 분량이 많았던 회차입니다. 실패가 아니라 원고를 조인 회차로 읽어 주세요.",
    "'느낌'은 회차마다 두 번 적습니다. 앞은 2단계에서 새로 쓴 대목에 대해, 뒤는 4단계에서 고쳐 쓴 원고 전체에 대해 적은 것입니다. 좋은 쪽부터 "
      + FEELS.map((f,i) => `${f}(${5-i})`).join(" · ") + ". 적지 않고 넘어간 회차도 있습니다.",
    "",
    body,
    "",
    "[요청] 매일의 글쓰기를 평가해 주세요.",
    "1. 오늘 하루에 대한 평가. 내 평소 리듬에 견주어 오늘이 어떤 날이었는지, 분량과 느낌을 함께 근거로.",
    "2. 꾸준함. 쓴 날과 쉰 날의 분포, 연속으로 이어간 구간과 끊긴 구간. 쉬는 간격에 규칙이 있는지.",
    "3. 하루 분량의 편차. 평균과 중앙값이 얼마나 벌어지는지, 몰아 쓰는 편인지 고르게 쓰는 편인지.",
    "4. 그날을 닫은 느낌(뒤쪽 느낌)과 다음 날의 관계. 나쁘게 닫은 다음 날 책상에 앉는 일이 줄어드는지, 오히려 늘어나는지.",
    "5. 하루 안에서 느낌이 흘러가는 방향. 같은 날 여러 회차를 했을 때 뒤로 갈수록 좋아지는지 나빠지는지, 회차 안에서 앞 느낌과 뒤 느낌이 어떻게 벌어지는지.",
    "6. 여러 원고를 같은 날 건드린 날과 하나만 붙든 날의 차이. 병행이 총량과 느낌에 도움이 되는지 해가 되는지.",
    "7. 요일과 시각의 패턴. 잘 되는 날과 시간대, 무너지는 날과 시간대.",
    "8. 내일 하루를 위한 조정 한두 가지. 격려도 훈계도 말고, 이 기록에서 읽히는 것만."
  ].join("\n");
}

function arcStats(a){
  const list = [...(a.entries||[])].sort((x,y) => x.cycle - y.cycle || x.ts - y.ts);
  let prev = a.startChars || 0;
  const deltas = list.map(e => { const d = e.chars - prev; prev = e.chars; return d; });
  const final = list.length ? list[list.length-1].chars : (a.startChars || 0);
  const days = new Set(list.map(e => dayKey(e.ts))).size;
  const span = list.length ? Math.round((list[list.length-1].ts - list[0].ts) / 86400000) + 1 : 0;
  const feels = {};
  list.forEach(e => { const f = feelOf(e); if (f) feels[f] = (feels[f]||0) + 1; });
  const scores = list.map(e => feelScore(e.feel)).filter(v => v !== null);
  const scores2 = list.map(e => feelScore(e.feel2)).filter(v => v !== null);
  const avgOf = a => a.length ? +(a.reduce((x,y) => x+y, 0) / a.length).toFixed(1) : null;
  const mean = arr => arr.length ? Math.round(arr.reduce((x,y) => x+y, 0) / arr.length) : 0;
  const median = arr => {
    if (!arr.length) return 0;
    const q = [...arr].sort((x,y) => x-y), m = q.length >> 1;
    return q.length % 2 ? q[m] : Math.round((q[m-1] + q[m]) / 2);
  };
  const k = Math.ceil(deltas.length / 3);
  return {
    list, deltas, days, span, feels, final,
    avgGrew: mean(list.map(e => ((typeof e.mid === "number") ? e.mid : e.chars))
      .map((m,i) => m - (i ? list[i-1].chars : (a.startChars || 0)))),
    avgTrim: mean(list.map(e => e.chars - ((typeof e.mid === "number") ? e.mid : e.chars))),
    avgFeel: avgOf(scores), avgFeel2: avgOf(scores2),
    avg: mean(deltas), med: median(deltas), cuts: deltas.filter(d => d < 0).length,
    thirds: [mean(deltas.slice(0,k)), mean(deltas.slice(k, k*2)), mean(deltas.slice(k*2))]
  };
}

function downloadJSON(obj, filename){
  const url = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"}));
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function archiveProject(id){
  const x = S.projects.find(y => y.id === id); if (!x) return;
  const st = arcStats({ entries:x.entries, startChars:x.startChars });
  if (!confirm(
    `'${x.name}'을 완료 처리합니다.\n\n최종 ${pg(st.final)}매 · ${x.entries.length}회차 완주\n\n`
    + `전체 회차 기록은 파일로 내려받고, 앱에는 통계 요약만 남깁니다.\n`
    + `그 파일로 언제든 되살릴 수 있습니다.`)) return;

  downloadJSON({
    kind: "순환-아카이브", name:x.name, goalPages:x.goalPages, startChars:x.startChars || 0,
    use2667: x.use2667 !== false, finishedAt: Date.now(), entries: x.entries
  }, `순환-${x.name}-${dayKey(Date.now()).replace(/-/g,"")}.json`);

  S.archives.push({
    id: uid(), name: x.name, goalPages: x.goalPages, startChars: x.startChars || 0,
    cycles: st.list.length, finalChars: st.final,
    startedAt: st.list.length ? st.list[0].ts : Date.now(), finishedAt: Date.now(),
    days: st.days, span: st.span, avg: st.avg, med: st.med, cuts: st.cuts,
    thirds: st.thirds, feels: st.feels, avgFeel: st.avgFeel, avgFeel2: st.avgFeel2,
    avgGrew: st.avgGrew, avgTrim: st.avgTrim
  });

  S.projects = S.projects.filter(y => y.id !== id);
  if (!S.projects.length) S.projects.push(newProject("새 원고"));
  if (S.activeId === id) S.activeId = S.projects[0].id;
  save(); render(); toast("완료 처리하고 기록 파일을 내려받았습니다");
}

function restoreArchive(data){
  if (!data || data.kind !== "순환-아카이브" || !Array.isArray(data.entries)) return false;
  const np = newProject(data.name || "되살린 원고");
  Object.assign(np, {
    goalPages: data.goalPages || 80, startChars: data.startChars || 0,
    use2667: data.use2667 !== false, entries: data.entries,
    cycle: data.entries.length + 1
  });
  S.projects.push(np); S.activeId = np.id;
  const same = S.archives.find(a => a.name === np.name && a.cycles === data.entries.length);
  if (same) S.archives = S.archives.filter(a => a !== same);
  save(); render(); toast(`'${np.name}'을 되살렸습니다`);
  return true;
}

function buildPromptArchive(){
  if (!S.archives.length) return null;
  const all = [...S.archives].sort((a,b) => a.finishedAt - b.finishedAt);
  const CAP = 20, shown = all.slice(-CAP), cut = all.length > CAP;

  const sum = (f) => all.reduce((n,a) => n + (f(a) || 0), 0);
  const feelAll = {};
  all.forEach(a => Object.entries(a.feels || a.tags || {}).forEach(([k,v]) => feelAll[k] = (feelAll[k]||0) + v));
  const tagLine = o => Object.entries(o).sort((x,y) => y[1]-x[1]).map(([k,v]) => `${k} ${v}`).join(", ") || "-";

  const blocks = shown.map((a,i) => [
    `${all.length - shown.length + i + 1}) ${a.name}`,
    `   기간: ${dayKey(a.startedAt)} ~ ${dayKey(a.finishedAt)} (달력 ${a.span}일 가운데 ${a.days}일 집필)`,
    `   회차: ${a.cycles}회 / 최종 ${pg(a.finalChars)}매 (시작 ${pg(a.startChars)}매, 목표 ${a.goalPages}매)`,
    `   회차당 순증: 평균 ${a.avg}자, 중앙값 ${a.med ?? "-"}자 / 초반 ${a.thirds[0]} · 중반 ${a.thirds[1]} · 후반 ${a.thirds[2]}`,
    `   회차당 늘린 양 ${a.avgGrew ?? "-"}자 · 조인 양 ${a.avgTrim ?? "-"}자 / 순증이 음수였던 회차 ${a.cuts}회`,
    `   느낌 평균: 새 대목 ${a.avgFeel ?? "-"} · 전체 ${a.avgFeel2 ?? "-"} / 분포: ${tagLine(a.feels || a.tags || {})}`
  ].join("\n"));

  return [
    "나는 소설을 쓰는 사람입니다. 한 회차는 네 단계입니다. 1) 앞 대목에 이어 손으로 노트 한 장을 새로 쓰고 2) 스크리브너에 타이핑하며 그 대목을 다듬고 3) 원고 전체를 프린트해 종이 위에서 교열하고 4) 교열한 종이를 보며 스크리브너에서 다시 고쳐 씁니다. 1·2단계가 원고를 늘리는 일이고, 3·4단계가 이미 쓴 것을 조이는 일입니다.",
    `아래는 지금까지 완료한 원고 ${all.length}편의 집필 기록 요약입니다.`,
    "순증이 음수인 회차는 새로 쓴 분량보다 교정으로 덜어낸 분량이 많았던 회차입니다. 실패가 아니라 원고를 조인 회차입니다.",
    "'느낌'은 각 회차의 타이핑을 마친 순간에 적어 둔 주관적 감각입니다. 좋은 쪽부터 "
      + FEELS.map((f,i) => `${f}(${5-i})`).join(" · ") + ".",
    "",
    "[전체 집계]",
    `- 완료 ${all.length}편 / 총 ${sum(a => a.cycles)}회차 / 총 ${pg(sum(a => a.finalChars - a.startChars))}매`,
    `- 편당 평균: ${Math.round(sum(a => a.cycles)/all.length)}회차, ${pg(sum(a => a.finalChars - a.startChars)/all.length)}매, 달력 ${Math.round(sum(a => a.span)/all.length)}일 가운데 ${Math.round(sum(a => a.days)/all.length)}일 집필`,
    `- 느낌 분포 총합: ${tagLine(feelAll)}`,
    "",
    cut ? `[최근 ${CAP}편] 전체 ${all.length}편 가운데 최근 ${CAP}편만 자세히 싣습니다.` : "[편별 기록]",
    "",
    ...blocks.map(b => b + "\n"),
    "[요청] 완료한 원고들을 견주어 분석해 주세요.",
    "1. 한 편을 끝내기까지의 리듬. 편마다 걸린 기간과 집필 밀도가 어떻게 달랐는지.",
    "2. 초반·중반·후반 순증의 변화. 편마다 같은 모양으로 무너지거나 살아나는 구간이 있는지.",
    "3. 평균과 중앙값의 벌어짐. 몰아 쓰는 편인지 고르게 쓰는 편인지, 편마다 다른지.",
    "4. 느낌 평균과 실제 성과의 관계. 느낌이 좋았던 원고가 실제로 잘 나아간 원고인지, 내 감각이 믿을 만한지. 새 대목 느낌과 전체 느낌 가운데 어느 쪽이 더 정확한 예보였는지.",
    "5. 편이 바뀌어도 반복되는 나의 약점. 느낌 분포에서 읽히는 것과 수치에서 읽히는 것을 나눠서.",
    "6. 뒤에 쓴 원고일수록 나아진 지표와 오히려 나빠진 지표.",
    "7. 목표 매수와 최종 매수의 차이. 내가 분량을 어떻게 잘못 어림하는 편인지.",
    "8. 다음 원고를 시작할 때 미리 정해 두면 좋을 것 두세 가지. 이 기록에서 읽히는 것만."
  ].join("\n");
}

function projListHTML(){
  const p = P();
  const q = projQ.trim().toLowerCase();
  const hit = S.projects.filter(x => !q || x.name.toLowerCase().includes(q));
  const view = hit.slice(0, LIST_MAX);
  if (!hit.length) return `<div class="pitem"><span style="font-weight:400;color:var(--muted)">찾는 원고가 없습니다</span></div>`;
  return view.map(x => `
    <div class="pitem${x.id===p.id?" on":""}">
      <span>${esc(x.name)}</span>
      <em>${x.cycle}회차 · ${pg(totalChars(x))}매</em>
      ${x.id===p.id ? "" : `<button data-act="pick" data-id="${x.id}">열기</button>`}
      <button data-act="rename" data-id="${x.id}">이름</button>
      <button data-act="pdel" data-id="${x.id}">삭제</button>
    </div>`).join("")
    + (hit.length > LIST_MAX
      ? `<div class="pitem"><span style="font-weight:400;color:var(--muted)">${hit.length}개 가운데 ${LIST_MAX}개만 보입니다. 이름으로 찾으세요.</span></div>` : "");
}

function arcListHTML(){
  const q = arcQ.trim().toLowerCase();
  const hit = [...S.archives].sort((a,b) => b.finishedAt - a.finishedAt)
    .filter(a => !q || a.name.toLowerCase().includes(q));
  if (!hit.length) return `<div class="pitem"><span style="font-weight:400;color:var(--muted)">찾는 원고가 없습니다</span></div>`;
  return hit.slice(0, LIST_MAX).map(a => `
    <div class="pitem">
      <span>${esc(a.name)}</span>
      <em>${pg(a.finalChars)}매 · ${a.cycles}회차 · ${dayKey(a.finishedAt).slice(2)}</em>
      <button data-act="arcdel" data-id="${a.id}">삭제</button>
    </div>`).join("")
    + (hit.length > LIST_MAX
      ? `<div class="pitem"><span style="font-weight:400;color:var(--muted)">${hit.length}편 가운데 ${LIST_MAX}편만 보입니다. 이름으로 찾으세요.</span></div>` : "");
}

/* ── 그리기 ── */
function render(){
  document.querySelectorAll("nav button").forEach(b =>
    b.setAttribute("aria-selected", b.dataset.tab === tab));
  renderHead();
  if (tab === "cycle") renderCycle();
  else if (tab === "log") renderLog();
  else renderSet();
}

/* ── 이벤트 ── */
document.addEventListener("click", e => {
  const nav = e.target.closest("nav button");
  if (nav){ tab = nav.dataset.tab; logLimit = 50; projQ = ""; arcQ = ""; render(); return; }

  const b = e.target.closest("[data-act]"); if (!b) return;
  const p = P(), a = b.dataset.act;

  if (a === "next") next();
  else if (a === "pdf") exportNotePDF();
  else if (a === "scriv2"){ copy(p.draft.insight, "깨달은 것을 복사했습니다"); openScrivener(p); }
  else if (a === "scriv3"){ copy(p.draft.proof, "교열의 방향을 복사했습니다"); openScrivener(p); }
  else if (a === "scriv4"){ copy(p.draft.plan, "개작 방향을 복사했습니다"); openScrivener(p); }
  else if (a === "feel" || a === "feel2"){
    const key = a, t = b.dataset.t;
    p.draft[key] = (p.draft[key] === t) ? "" : t;
    b.closest(".chips").querySelectorAll(".chip").forEach(c =>
      c.setAttribute("aria-pressed", c.dataset.t === p.draft[key]));
    save();
  }
  else if (a === "del"){
    if (!confirm("이 회차 기록을 지울까요?")) return;
    p.entries = p.entries.filter(x => x.id !== b.dataset.id);
    save(); render(); toast("기록을 지웠습니다");
  }
  else if (a === "edit"){
    const x = p.entries.find(y => y.id === b.dataset.id); if (!x) return;
    const n = prompt(`${x.cycle}회차를 마쳤을 때의 누적 글자수 (공백 포함)\n교정으로 덜어냈다면 줄어든 숫자를 넣습니다.`, x.chars);
    if (n === null) return;
    const v = parseInt(n, 10);
    if (isNaN(v) || v < 0){ toast("숫자를 입력해 주세요"); return; }
    x.chars = v; save(); render(); toast("고쳤습니다");
  }
  else if (a === "prompt") showPrompt(buildPrompt());
  else if (a === "promptAll"){
    const t = buildPromptAll();
    if (!t){ toast("아직 기록이 없습니다"); return; }
    showPrompt(t);
  }
  else if (a === "pcopy") copy(lastPrompt, "프롬프트를 복사했습니다");
  else if (a === "pick"){ S.activeId = b.dataset.id; P().lastUsed = Date.now(); logLimit = 50; save(); render(); }
  else if (a === "padd"){
    const el = document.getElementById("i-newproj"), n = el.value.trim();
    const np = newProject(n || "새 원고");
    S.projects.push(np); S.activeId = np.id; save(); tab = "cycle"; render(); toast("원고를 만들었습니다");
  }
  else if (a === "rename"){
    const x = S.projects.find(y => y.id === b.dataset.id);
    const n = prompt("원고 이름", x.name); if (n && n.trim()){ x.name = n.trim(); save(); render(); }
  }
  else if (a === "pdel"){
    if (S.projects.length === 1){ toast("마지막 원고는 지울 수 없습니다"); return; }
    const x = S.projects.find(y => y.id === b.dataset.id);
    if (!confirm(`'${x.name}'과 그 회차 기록을 모두 지울까요?`)) return;
    S.projects = S.projects.filter(y => y.id !== x.id);
    if (S.activeId === x.id) S.activeId = S.projects[0].id;
    save(); render();
  }
  else if (a === "finish") archiveProject(b.dataset.id);
  else if (a === "restoreBtn") document.getElementById("i-arcfile").click();
  else if (a === "more"){ logLimit += 100; renderLog(); }
  else if (a === "arcdel"){
    const x = S.archives.find(y => y.id === b.dataset.id); if (!x) return;
    if (!confirm(`'${x.name}'의 완료 기록을 지울까요?\n앱에서만 지워지고, 내려받아 둔 기록 파일은 그대로 남습니다.`)) return;
    S.archives = S.archives.filter(y => y.id !== x.id);
    save(); render(); toast("지웠습니다");
  }
  else if (a === "promptArc"){
    const t = buildPromptArchive();
    if (!t){ toast("완료한 원고가 없습니다"); return; }
    showPrompt(t);
  }
  else if (a === "export"){
    downloadJSON(S, `순환-백업-${dayKey(Date.now()).replace(/-/g,"")}.json`);
    toast("백업 파일을 내려받았습니다");
  }
  else if (a === "importBtn") document.getElementById("i-file").click();
});

document.addEventListener("input", e => {
  const p = P(), id = e.target.id, v = e.target.value;
  if (id === "i-insight") p.draft.insight = v;
  else if (id === "i-tail") p.draft.tail = v;
  else if (id === "i-proof") p.draft.proof = v;
  else if (id === "i-plan") p.draft.plan = v;
  else if (id === "i-hint") p.draft.hint = v;
  else if (id === "i-chars"){ p.draft.chars = v; calc(); }
  else if (id === "i-final"){ p.draft.final = v; calc(); }
  else if (id === "i-goal"){
    p.goalPages = Math.max(1, parseInt(v,10) || 80); renderHead();
    const box = document.getElementById("i-2667");
    const b = box && box.closest(".field").querySelector(".hint b");
    if (b) b.textContent = Math.max(1, Math.ceil(p.goalPages*200/2667)) + "구간";
  }
  else if (id === "i-start"){
    p.startChars = Math.max(0, parseInt(v,10) || 0);
    renderHead();
    const h = e.target.parentNode.querySelector(".hint b");
    if (h) h.textContent = pg(p.startChars) + "매";
  }
  else if (id === "i-projq"){ projQ = v; document.getElementById("plist").innerHTML = projListHTML(); return; }
  else if (id === "i-arcq"){ arcQ = v; document.getElementById("arclist").innerHTML = arcListHTML(); return; }
  else if (id === "i-scriv"){ p.scrivenerUrl = v.trim(); }
  else return;
  save();
});

document.addEventListener("change", e => {
  if (e.target.id === "i-gate"){
    const p = P();
    p.draft.gate[p.stage] = e.target.checked;
    save(); renderCycle();
    return;
  }
  if (e.target.id === "i-2667"){ P().use2667 = e.target.checked; save(); renderHead(); return; }
  if (e.target.id === "projSel"){ S.activeId = e.target.value; P().lastUsed = Date.now(); logLimit = 50; save(); render(); return; }
  if (e.target.id === "i-arcfile"){
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        if (!restoreArchive(JSON.parse(rd.result))) toast("순환 아카이브 파일이 아닙니다");
      }catch(_){ toast("읽을 수 없는 파일입니다"); }
      e.target.value = "";
    };
    rd.readAsText(f);
    return;
  }
  if (e.target.id === "i-file"){
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const data = JSON.parse(rd.result);
        if (!data || !Array.isArray(data.projects) || !data.projects.length) throw 0;
        if (!confirm("지금 데이터를 백업 파일로 덮어씁니다. 계속할까요?")) return;
        S = migrate(data);
        save(); render(); toast("복원했습니다");
      }catch(_){ toast("읽을 수 없는 파일입니다"); }
      e.target.value = "";
    };
    rd.readAsText(f);
  }
});

document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter"){
    e.preventDefault();
    if (tab !== "cycle"){ tab = "cycle"; render(); return; }
    next();
  }
});

render();
</script>
</body>
</html>
