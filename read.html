<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2efe6">
<title>독서첩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2efe6;
  --paper2:#e9e5d8;
  --card:#f8f6ef;
  --ink:#24231f;
  --ink2:#6b665b;
  --ink3:#9a9488;
  --line:#dcd6c6;
  --seal:#a33a2b;
  --indigo:#33566b;
  --mark:#e7dfae;
  --shadow:none;
}
html[data-theme="night"]{
  --paper:#14151a;
  --paper2:#1b1d23;
  --card:#191b21;
  --ink:#e4e0d5;
  --ink2:#9d978a;
  --ink3:#6e6a61;
  --line:#2c2f37;
  --seal:#c2604c;
  --indigo:#7fa6bd;
  --mark:#3a3a24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Noto Serif KR","Gowun Batang",-apple-system,"Apple SD Gothic Neo",serif;
  font-weight:300;
  font-size:16px;
  line-height:1.75;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
h1,h2,h3,.disp{font-family:"Gowun Batang","Noto Serif KR",serif;font-weight:400;letter-spacing:-.02em;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer}
a{color:var(--indigo)}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

/* ── 머리 ── */
#top{position:sticky;top:0;z-index:40;background:var(--paper);border-bottom:1px solid var(--line)}
#top .wrap{display:flex;align-items:center;gap:12px;height:58px;padding-top:env(safe-area-inset-top)}
.seal{width:30px;height:30px;flex:0 0 auto;background:var(--seal);color:#fff;display:grid;place-items:center;
  font-family:"Gowun Batang",serif;font-size:17px;border-radius:2px}
html[data-theme="night"] .seal{color:#14151a}
.brand{font-size:19px}
.brand small{display:block;font-size:10px;letter-spacing:.35em;color:var(--ink3);margin-top:-4px}
#top .spacer{flex:1}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;color:var(--ink2);font-size:15px;border-radius:2px}
.iconbtn:active{background:var(--paper2)}

/* ── 라벨 / 눈금 ── */
.eyebrow{font-size:10px;letter-spacing:.3em;color:var(--ink3);text-transform:uppercase;margin:0 0 10px}
.rule{height:1px;background:var(--line);border:0;margin:22px 0}
.muted{color:var(--ink2)}
.dim{color:var(--ink3)}
.num{font-variant-numeric:tabular-nums}
.viewhead{padding:26px 0 14px}
.viewhead h2{font-size:26px}
.viewhead p{margin:6px 0 0;font-size:13px;color:var(--ink3)}

/* ── 책 ── */
.bookrow{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.bookrow:last-child{border-bottom:0}
.spine{width:3px;align-self:stretch;min-height:44px;background:var(--indigo);opacity:.5;flex:0 0 auto}
.bookrow.done .spine{background:var(--ink3);opacity:.35}
.bookrow.soon .spine{background:var(--line);opacity:1}
.bt{font-family:"Gowun Batang",serif;font-size:17px;line-height:1.45}
.ba{font-size:13px;color:var(--ink2);margin-top:2px}
.bm{font-size:11px;color:var(--ink3);margin-top:6px;letter-spacing:.02em}

/* ── 메모 카드 ── */
.memo{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
  padding:14px 16px 13px;margin:0 0 10px;position:relative}
.memo .page{font-family:"Gowun Batang",serif;font-size:11px;color:var(--seal);letter-spacing:.08em}
.memo .src{font-size:11px;color:var(--ink3);margin-left:8px}
.memo .q{font-family:"Gowun Batang",serif;font-size:15.5px;line-height:1.7;margin:8px 0 0;
  padding-left:11px;border-left:2px solid var(--mark)}
.memo .t{font-size:14px;color:var(--ink2);margin:9px 0 0;line-height:1.7}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.memo .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:11px}
.star{position:absolute;top:12px;right:13px;color:var(--seal);font-size:12px}

/* ── 칩 ── */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;letter-spacing:.02em;
  padding:3px 9px;border:1px solid var(--line);color:var(--ink2);background:transparent;border-radius:999px;line-height:1.6}
.chip.tag{color:var(--indigo);border-color:color-mix(in srgb,var(--indigo) 35%,transparent)}
.chip.kind{color:var(--ink2)}
.chip.on{background:var(--indigo);border-color:var(--indigo);color:var(--paper)}
.chip.count{color:var(--ink3);border:0;padding:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:7px}

/* ── 도구줄 ── */
.searchbar{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:30;background:var(--paper);
  padding:14px 0 10px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--card);padding:9px 13px}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px;font-weight:300}
.search input::placeholder{color:var(--ink3)}
.filters{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{white-space:nowrap;flex:0 0 auto}

/* ── 버튼 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--ink);
  padding:12px 18px;font-size:14px;letter-spacing:.02em;background:transparent}
.btn:active{background:var(--paper2)}
.btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.ghost{border-color:var(--line);color:var(--ink2)}
.btn.full{width:100%}
.btn.sm{padding:8px 13px;font-size:12.5px}
.btn.danger{border-color:color-mix(in srgb,var(--seal) 45%,transparent);color:var(--seal)}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

/* ── 아래 탭 ── */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:saturate(140%) blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
#tabs .inner{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabs button{padding:11px 0 12px;display:grid;justify-items:center;gap:3px;color:var(--ink3);font-size:11px;letter-spacing:.06em}
#tabs button .g{font-family:"Gowun Batang",serif;font-size:17px;line-height:1}
#tabs button[aria-current="true"]{color:var(--ink)}
#tabs button[aria-current="true"] .g{color:var(--seal)}

/* ── 시트 ── */
#sheet[hidden]{display:none}
#sheet{position:fixed;inset:0;z-index:80;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheethead{position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);z-index:5}
.sheethead .wrap{display:flex;align-items:center;height:56px;gap:10px;padding-top:env(safe-area-inset-top)}
.sheethead h3{font-size:16px;flex:1}
.sheetbody{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.field{margin:20px 0}
.field label{display:block;font-size:10px;letter-spacing:.28em;color:var(--ink3);margin-bottom:7px;text-transform:uppercase}
.field input,.field textarea,.field select{width:100%;background:var(--card);border:1px solid var(--line);
  padding:11px 13px;outline:none;font-size:16px;font-weight:300;line-height:1.7;border-radius:0;-webkit-appearance:none}
.field textarea{resize:vertical;min-height:96px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--ink2)}
.field .hint{font-size:11.5px;color:var(--ink3);margin-top:6px}
.two{display:flex;gap:12px}
.two>*{flex:1}

/* ── 메모 상세 ── */
.detail .src{font-size:12.5px;color:var(--ink2)}
.detail .pg{font-family:"Gowun Batang",serif;color:var(--seal);font-size:12.5px;letter-spacing:.08em}
.quote{font-family:"Gowun Batang",serif;font-size:18px;line-height:1.85;margin:18px 0 0;
  padding:2px 0 2px 16px;border-left:2px solid var(--seal);white-space:pre-wrap}
.thought{font-size:15.5px;line-height:1.85;margin:20px 0 0;white-space:pre-wrap}
.annot{padding:14px 0;border-bottom:1px dotted var(--line)}
.annot .at{font-size:10.5px;color:var(--ink3);letter-spacing:.06em;display:flex;gap:10px;align-items:center}
.annot .tx{font-size:14.5px;line-height:1.8;margin-top:5px;white-space:pre-wrap;color:var(--ink)}
.linkrow{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:12px 0;border-bottom:1px dotted var(--line)}
.thread{color:var(--indigo);font-size:12px;flex:0 0 auto;margin-top:2px}
mark{background:var(--mark);color:inherit;padding:0 1px}

/* ── 통계 ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stat{background:var(--card);padding:14px 12px}
.stat b{display:block;font-family:"Gowun Batang",serif;font-size:24px;font-weight:400;line-height:1.2}
.stat span{font-size:10.5px;color:var(--ink3);letter-spacing:.1em}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:14px}
.spark i{flex:1;background:var(--indigo);opacity:.45;min-height:1px}
.spark i.today{opacity:.9;background:var(--seal)}

/* 한 줄 보기 */
.densrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:11px 2px;border-bottom:1px solid var(--line);background:transparent}
.densrow:active{background:var(--paper2)}
.densrow .page{font-family:"Gowun Batang",serif;font-size:11px;color:var(--seal);letter-spacing:.06em}
.densrow .src{font-size:11px;color:var(--ink3)}

/* 맨 위로 */
#totop{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:45;
  width:40px;height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink2);
  font-size:15px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s}
#totop.show{opacity:.95;pointer-events:auto}

.bar{display:block;height:2px;background:var(--line)}
.bar i{display:block;height:2px;background:var(--indigo);opacity:.7}
.chip.bookf{color:var(--ink);border-color:var(--ink2);background:transparent}
.empty{text-align:center;padding:56px 20px;color:var(--ink3)}
.empty .g{font-family:"Gowun Batang",serif;font-size:26px;color:var(--line);display:block;margin-bottom:14px}
.empty p{margin:0 0 18px;font-size:13.5px;line-height:1.8}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(94px + env(safe-area-inset-bottom));
  z-index:90;background:var(--ink);color:var(--paper);font-size:13px;padding:9px 16px;opacity:0;
  transition:opacity .22s;pointer-events:none;max-width:80vw;text-align:center}
#toast.show{opacity:.96}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
</style>
</head>
<body>

<header id="top">
  <div class="wrap">
    <div class="seal" aria-hidden="true">採</div>
    <div class="brand">독서첩<small>讀書帖</small></div>
    <div class="spacer"></div>
    <button class="iconbtn" data-act="draw" title="오늘의 자극">籤</button>
    <button class="iconbtn" data-act="theme" title="야간 모드">◐</button>
  </div>
</header>

<main id="app" class="wrap"></main>

<nav id="tabs">
  <div class="inner">
    <button data-act="tab" data-v="desk"><span class="g">卓</span>책상</button>
    <button data-act="tab" data-v="inbox"><span class="g">帖</span>메모함</button>
    <button data-act="tab" data-v="archive"><span class="g">架</span>서재</button>
    <button data-act="tab" data-v="tags"><span class="g">籤</span>태그</button>
    <button data-act="tab" data-v="tools"><span class="g">具</span>도구</button>
  </div>
</nav>

<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="taglist"></datalist>

<script>
"use strict";

/* ═══════════ 저장소 ═══════════ */
const KEY="dokseocheop.v1", DRAFT="dokseocheop.draft";
const KINDS=["문장","이미지","구조","인물","목소리","주제","정보","형식"];
let db={v:1,books:[],memos:[],pins:[],theme:"light"};

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const p=JSON.parse(raw); db=Object.assign(db,p);}
  }catch(e){ toast("저장된 데이터를 읽지 못했습니다. 도구 → 가져오기로 백업을 불러오세요."); }
  db.books=db.books||[]; db.memos=db.memos||[]; db.pins=db.pins||[];
  db.books.forEach(b=>{                                    // 완독 기록 이어 붙이기
    if(!Array.isArray(b.reads))
      b.reads=(b.status==="done")?[b.finishedAt||b.openedAt||b.createdAt]:[];
  });
  document.documentElement.dataset.theme = db.theme==="night" ? "night" : "light";
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(db)); }
  catch(e){ toast("저장 공간이 부족합니다. 내보내기로 백업하세요."); }
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>Date.now();

/* ═══════════ 유틸 ═══════════ */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const el=s=>document.querySelector(s);
function fmt(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"."+p(d.getMonth()+1)+"."+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}
function dateVal(ts){const d=new Date(ts||now()),p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());}
function valDate(v){
  const m=String(v||"").trim().match(/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})$/);
  if(!m)return 0;
  const d=new Date(+m[1],+m[2]-1,+m[3],12,0,0);
  return isNaN(d.getTime())?0:d.getTime();}
function fmtDay(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,"0");return (d.getMonth()+1)+"."+p(d.getDate());}
function toast(msg){const t=el("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toast._i);toast._i=setTimeout(()=>t.classList.remove("show"),2200);}
const book=id=>db.books.find(b=>b.id===id);
const memo=id=>db.memos.find(m=>m.id===id);
const memosOf=id=>db.memos.filter(m=>m.bookId===id);
function pageNum(p){const n=parseInt(String(p).replace(/[^0-9]/g,""),10);return isNaN(n)?0:n;}
function allTags(){const c={};db.memos.forEach(m=>(m.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));return c;}
function parseTags(s){return Array.from(new Set(String(s||"").split(/[,\s]+/).map(t=>t.replace(/^#/,"").trim()).filter(Boolean)));}
function copy(text,msg){
  const done=()=>toast(msg||"복사했습니다");
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,()=>fallback());}
  else fallback();
  function fallback(){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity=0;
    document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){toast("복사에 실패했습니다");}ta.remove();}
}
function download(name,text,type){
  const b=new Blob([text],{type:type||"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}
function hl(text,q){
  const t=esc(text);
  const terms=String(q||"").split(/\s+/).filter(x=>x.length>0);
  if(!terms.length)return t;
  let out=t;
  terms.forEach(term=>{
    const r=new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
    out=out.replace(r,m=>"\u0001"+m+"\u0002");
  });
  return out.replace(/\u0001/g,"<mark>").replace(/\u0002/g,"</mark>");
}

/* ═══════════ 상태 ═══════════ */
const S={view:"desk",bookId:null,memoId:null,q:"",tag:null,kind:null,sort:"new",star:false,untagged:false,fromBook:null,trail:[],years:{},aq:"",groups:{},more:{},limit:40,dense:false};

/* ═══════════ 검색 ═══════════ */
function haystack(m){
  const b=book(m.bookId)||{};
  return [m.quote,m.thought,m.page,(m.tags||[]).join(" "),(m.kinds||[]).join(" "),
    (m.notes||[]).map(n=>n.text).join(" "),b.title,b.author].join("  ").toLowerCase();
}
function query(){
  let list=db.memos.slice();
  const q=S.q.trim().toLowerCase();
  if(q){const terms=q.split(/\s+/).filter(Boolean);list=list.filter(m=>{const h=haystack(m);return terms.every(t=>h.includes(t));});}
  if(S.tag)list=list.filter(m=>(m.tags||[]).includes(S.tag));
  if(S.kind)list=list.filter(m=>(m.kinds||[]).includes(S.kind));
  if(S.star)list=list.filter(m=>m.star);
  if(S.untagged)list=list.filter(m=>!(m.tags||[]).length);
  if(S.fromBook)list=list.filter(m=>m.bookId===S.fromBook);
  const by={
    new:(a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt),
    old:(a,b)=>a.createdAt-b.createdAt,
    book:(a,b)=>{const A=(book(a.bookId)||{}).title||"",B=(book(b.bookId)||{}).title||"";
      return A===B?pageNum(a.page)-pageNum(b.page):A.localeCompare(B,"ko");}
  };
  return list.sort(by[S.sort]||by.new);
}

/* ═══════════ 그리기 ═══════════ */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.v===S.view)));
  const dl=el("#taglist");
  dl.innerHTML=Object.keys(allTags()).sort().map(t=>`<option value="${esc(t)}">`).join("");
  const v={desk:vDesk,archive:vArchive,book:vBook,inbox:vInbox,memo:vMemo,tags:vTags,tools:vTools}[S.view]||vDesk;
  el("#app").innerHTML=v();
  if(S.view!=="inbox")window.scrollTo(0,0);
  if(S.view==="inbox"){
    const inp=el("#q");
    if(inp){inp.value=S.q;inp.addEventListener("input",()=>{S.q=inp.value;S.limit=40;refreshList();});}
  }
  if(S.view==="archive"){
    const aq=el("#aq");
    if(aq){aq.value=S.aq||"";aq.addEventListener("input",()=>{S.aq=aq.value;el("#alist").innerHTML=archiveList();});}
  }
}
function go(view,opt){Object.assign(S,{view:view},opt||{});render();}

/* ── 책상 · 지금 읽는 책 ── */
function vDesk(){
  const groups=[["reading","읽는 중"],["soon","읽을 예정"]];
  const open=db.books.filter(b=>(b.status||"reading")!=="done");
  const shelf=db.books.filter(b=>b.status==="done").length;
  let h=`<div class="viewhead"><h2>책상</h2><p class="num">펼쳐 둔 책 ${open.length} · 메모 ${db.memos.length}${shelf?` · 서재 ${shelf}권`:""}</p></div>
  <div class="btnrow"><button class="btn sm" data-act="bookform">책 추가</button>
  <button class="btn sm ghost" data-act="memoform">메모 바로 쓰기</button></div>`;
  if(!open.length)return h+`<div class="empty"><span class="g">卓</span><p>책상이 비었습니다.<br>지금 펼친 책을 올려 두세요.</p>
    <button class="btn" data-act="bookform">책 올리기</button></div>`;
  groups.forEach(([st,label])=>{
    const bs=db.books.filter(b=>(b.status||"reading")===st)
      .sort((a,b)=>(b.openedAt||b.createdAt)-(a.openedAt||a.createdAt));
    if(!bs.length)return;
    h+=`<hr class="rule"><p class="eyebrow">${label} <span class="num">${bs.length}</span></p>`;
    bs.forEach(b=>{
      const ms=memosOf(b.id);
      const pct=b.total&&b.current?Math.min(100,Math.round(b.current/b.total*100)):0;
      const where=b.current?`지금 p.${b.current}${b.total?` / ${b.total}`:""}${pct?` · ${pct}%`:""}`:(b.total?`${b.total}쪽`:"");
      h+=`<button class="bookrow ${st}" data-act="openbook" data-id="${b.id}">
        <span class="spine"></span>
        <span style="flex:1;min-width:0">
          <span class="bt" style="display:block">${esc(b.title)}</span>
          ${b.author?`<span class="ba" style="display:block">${esc(b.author)}</span>`:""}
          <span class="bm num" style="display:block">메모 ${ms.length}${where?" · "+where:""}</span>
          ${pct?`<span class="bar" style="margin-top:8px;max-width:180px"><i style="width:${pct}%"></i></span>`:""}
        </span></button>`;
    });
  });
  return h;
}

/* 서재 연도 접기 — 가장 최근 해만 기본으로 펼침 */
function isOpenYear(yr,years){
  if(S.years[yr]!==undefined)return S.years[yr];
  return years.length===1||yr===years[0];
}

/* ── 서재 · 완독 기록이 쌓이는 곳 ── */
function readEntries(){
  const out=[];
  db.books.forEach(b=>{
    const rs=(b.reads&&b.reads.length)?b.reads:(b.status==="done"?[b.finishedAt||b.openedAt||b.createdAt]:[]);
    rs.forEach(ts=>out.push({b:b,fin:ts}));
  });
  return out.sort((x,y)=>y.fin-x.fin);
}
function vArchive(){
  const all=readEntries();
  let h=`<div class="viewhead"><h2>서재</h2><p class="num">완독 ${all.length}권${
    (function(){const t=new Set(all.map(e=>e.b.id)).size;return t!==all.length?` · 서로 다른 책 ${t}권`:"";})()}</p></div>`;
  if(!all.length)return h+`<div class="empty"><span class="g">架</span><p>아직 꽂힌 책이 없습니다.<br>책상에서 책을 완독으로 표시하면<br>제목만 남아 이곳에 쌓입니다.</p></div>`;

  /* 통계 */
  const y=new Date().getFullYear(), m0=new Date().getMonth();
  const thisYear=all.filter(e=>new Date(e.fin).getFullYear()===y);
  const thisMonth=thisYear.filter(e=>new Date(e.fin).getMonth()===m0);
  const ids=Array.from(new Set(all.map(e=>e.b.id)));
  const memoTotal=ids.reduce((s,id)=>s+memosOf(id).length,0);
  const memoed=ids.filter(id=>memosOf(id).length).length;
  const first=all[all.length-1].fin, span=Math.max(1,Math.round((now()-first)/864e5));
  const pace=(all.length/span*30).toFixed(1);
  const gaps=[];
  for(let i=0;i<all.length-1;i++)gaps.push(Math.round((all[i].fin-all[i+1].fin)/864e5));
  const avgGap=gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):0;
  const firstReads={};
  all.forEach(e=>{firstReads[e.b.id]=Math.min(firstReads[e.b.id]||Infinity,e.fin);});
  const spanDays=ids.map(id=>{const b=book(id)||{};
    return Math.round((firstReads[id]-(b.startedAt||b.createdAt||firstReads[id]))/864e5);}).filter(d=>d>0);
  const avgRead=spanDays.length?Math.round(spanDays.reduce((a,b)=>a+b,0)/spanDays.length):0;
  const pages=all.reduce((s,e)=>s+(e.b.total||0),0);

  h+=`<div class="stats">
    <div class="stat"><b class="num">${all.length}</b><span>모두</span></div>
    <div class="stat"><b class="num">${thisYear.length}</b><span>${y}년</span></div>
    <div class="stat"><b class="num">${thisMonth.length}</b><span>이번 달</span></div>
    <div class="stat"><b class="num">${pace}</b><span>달마다</span></div>
    ${avgGap?`<div class="stat"><b class="num">${avgGap}</b><span>완독 간격·일</span></div>`:""}
    ${avgRead?`<div class="stat"><b class="num">${avgRead}</b><span>한 권·일</span></div>`:""}
    <div class="stat"><b class="num">${memoTotal}</b><span>남긴 메모</span></div>
    ${pages?`<div class="stat"><b class="num">${pages.toLocaleString()}</b><span>지나온 쪽</span></div>`:""}
  </div>
  <p class="dim num" style="font-size:11px;margin-top:12px">메모를 남긴 책 ${memoed}/${ids.length}권 · 권당 평균 ${(memoTotal/ids.length).toFixed(1)}장</p>`;

  /* 최근 12개월 */
  const months=[];
  for(let i=11;i>=0;i--){const d=new Date(y,m0-i,1);
    months.push({label:(d.getMonth()+1),n:all.filter(e=>{const f=new Date(e.fin);
      return f.getFullYear()===d.getFullYear()&&f.getMonth()===d.getMonth();}).length});}
  const mx=Math.max(1,...months.map(x=>x.n));
  h+=`<hr class="rule"><p class="eyebrow">최근 열두 달</p>
    <div class="spark">${months.map((x,i)=>`<i class="${i===11?"today":""}" style="height:${Math.max(2,x.n/mx*44)}px" title="${x.label}월 ${x.n}권"></i>`).join("")}</div>
    <div style="display:flex;gap:3px;margin-top:5px">${months.map(x=>`<span class="dim num" style="flex:1;text-align:center;font-size:9.5px">${x.label}</span>`).join("")}</div>`;

  /* 자주 읽은 저자 */
  const auth={};
  all.forEach(e=>{const a=(e.b.author||"").trim();if(a)auth[a]=(auth[a]||0)+1;});
  const top=Object.keys(auth).filter(a=>auth[a]>1).sort((a,b)=>auth[b]-auth[a]).slice(0,5);
  if(top.length)h+=`<hr class="rule"><p class="eyebrow">거듭 읽은 이</p><div class="chips">
    ${top.map(a=>`<span class="chip">${esc(a)} <span class="num dim">${auth[a]}</span></span>`).join("")}</div>`;

  /* 검색 + 연도별 목록 */
  h+=`<hr class="rule">
    <div class="search"><span class="dim">Q</span>
      <input id="aq" type="search" placeholder="꽂힌 책 찾기 — 제목·지은이·해" autocomplete="off" enterkeyhint="search"></div>
    <div id="alist" style="margin-top:6px">${archiveList()}</div>`;
  return h;
}
function archiveEntryRow(e,withYear){
  const n=memosOf(e.b.id).length;
  const back=e.b.status!=="done";
  return `<button class="bookrow done" data-act="openbook" data-id="${e.b.id}" style="padding:11px 0">
    <span class="dim num" style="flex:0 0 ${withYear?"66px":"42px"};font-size:11px;letter-spacing:.04em">${withYear?fmt(e.fin).slice(2,10):fmtDay(e.fin)}</span>
    <span style="flex:1;min-width:0">
      <span class="bt" style="display:block;font-size:15.5px">${hl(e.b.title,S.aq)}</span>
      ${e.b.author&&S.aq?`<span class="ba" style="display:block">${hl(e.b.author,S.aq)}</span>`:""}
    </span>
    ${back?`<span class="dim" style="flex:0 0 auto;font-size:10px;letter-spacing:.08em">책상</span>`:""}
    ${n?`<span class="dim num" style="flex:0 0 auto;font-size:11px;margin-left:8px">${n}</span>`:""}
  </button>`;
}
function archiveList(){
  const all=readEntries();
  const q=(S.aq||"").trim().toLowerCase();
  if(q){
    const terms=q.split(/\s+/).filter(Boolean);
    const hit=all.filter(e=>{
      const hay=[e.b.title,e.b.author,e.b.extra,String(new Date(e.fin).getFullYear())].join(" ").toLowerCase();
      return terms.every(t=>hay.includes(t));});
    if(!hit.length)return `<div class="empty" style="padding:38px 20px"><span class="g">空</span><p>그 제목은 서재에 없습니다.</p></div>`;
    return `<p class="eyebrow" style="margin:18px 0 8px">찾은 책 <span class="num">${hit.length}</span></p>`
      +hit.map(e=>archiveEntryRow(e,true)).join("");
  }
  const years=Array.from(new Set(all.map(e=>new Date(e.fin).getFullYear()))).sort((a,b)=>b-a);
  let h="";
  if(years.length>1){
    const allOpen=years.every(yr=>isOpenYear(yr,years));
    h+=`<div style="display:flex;align-items:center;gap:10px;margin-top:18px">
      <p class="eyebrow" style="margin:0;flex:1">쌓인 책</p>
      <button class="chip" data-act="allyears" data-open="${allOpen?"0":"1"}">${allOpen?"모두 접기":"모두 펼치기"}</button></div>`;
  }
  years.forEach((yr,i)=>{
    const es=all.filter(e=>new Date(e.fin).getFullYear()===yr);
    const open=isOpenYear(yr,years);
    const pg=es.reduce((s,e)=>s+(e.b.total||0),0);
    h+=`${i===0?"":`<hr class="rule">`}
      <button data-act="toggleyear" data-y="${yr}" style="display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:14px 0 10px">
        <span class="dim" style="font-size:11px;width:11px">${open?"▾":"▸"}</span>
        <span class="disp num" style="font-size:17px">${yr}</span>
        <span class="dim num" style="font-size:11.5px;letter-spacing:.06em">${es.length}권${pg?` · ${pg.toLocaleString()}쪽`:""}</span>
      </button>`;
    if(open)h+=es.map(e=>archiveEntryRow(e,false)).join("");
  });
  return h;
}

          style="width:88px;background:var(--card);border:1px solid var(--line);padding:9px 11px;outline:none;font-size:16px;text-align:center">

        <span style="flex:1"></span>
        <button class="btn sm" data-act="savepage" data-id="${b.id}">기록</button>
      </div>
      ${b.total?`<div class="bar" style="margin-top:12px"><i style="width:${pct}%"></i></div>`:

  }
  if(b.note)h+=`<hr class="rule"><p class="eyebrow">책에 대한 메모</p><div class="thought" style="margin-top:0">${esc(b.note)}</div>`;

/* 묶음 이름 — 정렬 방식에 따라 시기 또는 책 */
function groupKey(m){
  if(S.sort==="book"){const b=book(m.bookId)||{};return b.title||"—";}
  const ts=(S.sort==="old"?m.createdAt:(m.updatedAt||m.createdAt));
  const t0=new Date();t0.setHours(0,0,0,0);
  if(ts>=t0.getTime())return "오늘";
  if(ts>=t0.getTime()-6*864e5)return "이번 주";
  if(ts>=new Date(t0.getFullYear(),t0.getMonth(),1).getTime())return "이번 달";
  const d=new Date(ts);
  return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0");
}
const GROUP_CHUNK=40;
function isOpenGroup(k,i){return S.groups[k]!==undefined?S.groups[k]:i===0;}
function inboxList(){
  const list=query();
  if(!list.length)return `<div class="empty"><span class="g">空</span><p>걸리는 게 없습니다.<br>검색어나 조건을 바꿔 보세요.</p></div>`;

  /* 검색 중에는 묶지 않고 한 덩어리로, 끊어서 */
  if(S.q.trim()){
    const shown=list.slice(0,S.limit);
    return listHTML(shown)+(list.length>shown.length
      ? `<button class="btn ghost full" data-act="moreflat" style="margin:6px 0 10px">더 보기 · 남은 ${list.length-shown.length}장</button>`:"");
  }

  const map=new Map();
  list.forEach(m=>{const k=groupKey(m);if(!map.has(k))map.set(k,[]);map.get(k).push(m);});
  const keys=Array.from(map.keys());
  let h="";
  if(keys.length>1){
    const allOpen=keys.every((k,i)=>isOpenGroup(k,i));
    h+=`<div style="display:flex;align-items:center;gap:10px;margin:0 0 4px">
      <p class="eyebrow" style="margin:0;flex:1">${S.sort==="book"?"책별":"채집한 때"} <span class="num">${keys.length}묶음</span></p>
      <button class="chip" data-act="allgroups" data-open="${allOpen?"0":"1"}">${allOpen?"모두 접기":"모두 펼치기"}</button></div>`;
  }
  keys.forEach((k,i)=>{
    const items=map.get(k), open=isOpenGroup(k,i), lim=S.more[k]||GROUP_CHUNK;
    const g=encodeURIComponent(k);
    h+=`<button data-act="togglegroup" data-g="${g}" data-i="${i}"
      style="display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:13px 0 9px;border-top:1px solid var(--line)">
      <span class="dim" style="font-size:11px;width:11px">${open?"▾":"▸"}</span>
      <span class="disp" style="font-size:15.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span>
      <span class="dim num" style="font-size:11.5px">${items.length}장</span></button>`;
    if(!open)return;
    h+=listHTML(items.slice(0,lim),S.sort==="book");
    if(items.length>lim)h+=`<button class="btn ghost full sm" data-act="moregroup" data-g="${g}" style="margin:2px 0 14px">더 보기 · 남은 ${items.length-lim}장</button>`;
  });
  return h;
}
function refreshList(){const n=el("#list");if(n)n.innerHTML=inboxList();}
function listHTML(list,hideSrc){
  if(!list.length)return `<div class="empty"><span class="g">空</span><p>걸리는 게 없습니다.<br>검색어나 조건을 바꿔 보세요.</p></div>`;
  if(S.dense)return list.map(m=>{
    const b=book(m.bookId)||{};
    const line=(m.thought||m.quote||"").replace(/\s+/g," ").trim();
    return `<button class="densrow" data-act="openmemo" data-id="${m.id}">
      <span class="page num" style="flex:0 0 auto">p.${esc(m.page||"—")}</span>
      ${hideSrc?"":`<span class="src" style="flex:0 0 auto;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0">${esc(b.title||"—")}</span>`}
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;color:var(--ink2)">${hl(line,S.q)}</span>
      ${m.star?`<span style="color:var(--seal);font-size:10px">★</span>`:""}
      ${(m.tags||[]).length?`<span class="dim" style="font-size:10px;color:var(--indigo)">#${(m.tags||[]).length}</span>`:""}
    </button>`;}).join("");
  return list.map(m=>{
    const b=book(m.bookId)||{};
    const tags=(m.tags||[]).map(t=>`<span class="chip tag">#${esc(t)}</span>`).join("");
    const kinds=(m.kinds||[]).map(k=>`<span class="chip kind">${esc(k)}</span>`).join("");
    const marks=[];
    if((m.notes||[]).length)marks.push(`주석 ${m.notes.length}`);
    if((m.links||[]).length)marks.push(`연결 ${m.links.length}`);
    return `<button class="memo" data-act="openmemo" data-id="${m.id}">
      ${m.star?`<span class="star">★</span>`:""}
      <span class="page num">p.${esc(m.page||"—")}</span>${hideSrc?"":`<span class="src">${esc(b.title||"—")}</span>`}
      ${m.quote?`<div class="q clamp3">${hl(m.quote,S.q)}</div>`:""}
      ${m.thought?`<div class="t clamp2">${hl(m.thought,S.q)}</div>`:""}
      <div class="meta">${kinds}${tags}${marks.length?`<span class="chip count num">${marks.join(" · ")}</span>`:""}</div>
    </button>`;
  }).join("");
}

  h+= links.length?links.map(x=>{const xb=book(x.bookId)||{};
      return `<div style="display:flex;align-items:flex-start;gap:8px">
        <button class="linkrow" data-act="openmemo" data-id="${x.id}">

  return h;
}

/* ── 태그 ── */
function vTags(){
  const counts=allTags();
  const keys=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b,"ko"));
  const pinned=keys.filter(t=>db.pins.includes(t)), rest=keys.filter(t=>!db.pins.includes(t));
  const untagged=db.memos.filter(m=>!(m.tags||[]).length).length;
  const row=t=>`<div style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dotted var(--line)">
    <button data-act="ftag" data-t="${esc(t)}" style="flex:1;text-align:left;font-size:15px;color:var(--indigo)">#${esc(t)}</button>
    <span class="dim num" style="font-size:12px">${counts[t]}</span>
    <button class="chip" data-act="pin" data-t="${esc(t)}">${db.pins.includes(t)?"고정 해제":"작품으로 고정"}</button></div>`;
  let h=`<div class="viewhead"><h2>태그</h2><p class="num">${keys.length}개 · 메모 ${db.memos.length}장</p></div>`;
  if(pinned.length){h+=`<p class="eyebrow">작품 · 주제</p>`+pinned.map(row).join("")+`<hr class="rule">`;}
  h+=`<p class="eyebrow">자극의 종류</p><div class="chips">`+
    KINDS.map(k=>{const c=db.memos.filter(m=>(m.kinds||[]).includes(k)).length;
      return `<button class="chip kind" data-act="fkind" data-k="${k}">${k} <span class="num dim">${c}</span></button>`;}).join("")+
    `</div><hr class="rule">`;
  if(!keys.length)h+=`<div class="empty"><span class="g">籤</span><p>태그가 아직 없습니다.<br>쓰고 있는 작품 이름을 태그로 달면<br>메모가 작품 쪽으로 걸어옵니다.</p></div>`;
  else h+=`<p class="eyebrow">모든 태그</p>`+rest.map(row).join("");
  if(untagged)h+=`<div class="btnrow" style="margin-top:20px"><button class="btn sm ghost" data-act="funtag">태그 없는 메모 ${untagged}장 보기</button></div>`;
  return h;
}

/* ── 도구 ── */
function vTools(){
  const week=now()-7*864e5;
  const notes=db.memos.reduce((s,m)=>s+((m.notes||[]).length),0);
  const links=db.memos.reduce((s,m)=>s+((m.links||[]).length),0)/2;
  const days=[];
  for(let i=13;i>=0;i--){const d0=new Date();d0.setHours(0,0,0,0);const s=d0.getTime()-i*864e5;
    days.push({t:s,n:db.memos.filter(m=>m.createdAt>=s&&m.createdAt<s+864e5).length});}
  const max=Math.max(1,...days.map(d=>d.n));
  return `<div class="viewhead"><h2>도구</h2><p>백업하고, 꺼내 쓰고, 다시 섞습니다</p></div>
  <div class="stats">
    <div class="stat"><b class="num">${db.books.length}</b><span>책</span></div>
    <div class="stat"><b class="num">${db.memos.length}</b><span>메모</span></div>
    <div class="stat"><b class="num">${notes}</b><span>주석</span></div>
    <div class="stat"><b class="num">${Math.round(links)}</b><span>연결</span></div>
    <div class="stat"><b class="num">${db.memos.filter(m=>m.createdAt>=week).length}</b><span>이번 주</span></div>
  </div>
  <div class="spark" title="최근 14일 채집">${days.map((d,i)=>`<i class="${i===days.length-1?"today":""}" style="height:${Math.max(2,d.n/max*44)}px" title="${fmtDay(d.t)} ${d.n}장"></i>`).join("")}</div>
  <p class="dim num" style="font-size:10.5px;letter-spacing:.08em">최근 14일 · ${fmtDay(days[0].t)} ~ 오늘</p>
  <hr class="rule"><p class="eyebrow">한 장 뽑기</p>
  <p class="dim" style="font-size:13px;margin:0 0 14px">막혔을 때 무작위로 한 장을 꺼냅니다. 상관없는 메모가 길을 여는 일이 자주 있습니다.</p>
  <button class="btn full" data-act="draw">籤 오늘의 자극</button>
  <hr class="rule"><p class="eyebrow">내보내기</p>
  <div class="btnrow">
    <button class="btn sm" data-act="exp">백업 파일 저장 (JSON)</button>
    <button class="btn sm ghost" data-act="expmd">전체 마크다운 저장</button>
    <button class="btn sm ghost" data-act="expcopy">백업 클립보드로 복사</button>
  </div>
  <p class="hint dim" style="font-size:11.5px;margin-top:10px">아이폰에서는 저장한 파일이 '파일' 앱의 다운로드에 들어갑니다. 마크다운은 스크리브너·데본싱크로 그대로 옮길 수 있습니다.</p>
  <hr class="rule"><p class="eyebrow">가져오기</p>
  <div class="field"><label for="imp">백업 파일 선택</label><input id="imp" type="file" accept=".json,application/json"></div>
  <p class="hint dim" style="font-size:11.5px">같은 메모는 겹치지 않게 합쳐집니다. 합치기 전 상태는 자동으로 한 번 보관됩니다.</p>
  <hr class="rule"><p class="eyebrow">그 밖에</p>
  <div class="btnrow">
    <button class="btn sm ghost" data-act="theme">야간 모드 ${db.theme==="night"?"끄기":"켜기"}</button>
    <button class="btn sm ghost" data-act="restore">직전 보관본 되살리기</button>
    <button class="btn sm danger" data-act="wipe">전체 지우기</button>
  </div>
  <p class="hint dim" style="font-size:11.5px;margin-top:10px">데이터는 이 브라우저 안에만 있습니다. 사파리 기록·데이터 삭제를 하면 함께 사라지므로, 주마다 백업 파일을 남기세요.</p>
  <p class="dim" style="font-size:11px;margin:30px 0 0;text-align:center;letter-spacing:.1em">讀書帖 · 채집은 소유가 아니라 통과다</p>`;
}

/* ═══════════ 시트 ═══════════ */
function openSheet(title,body,onOpen){

/* ── 메모 작성/수정 ── */
function memoForm(id,bookId){
  const m=id?memo(id):null;
  let draft=null;
  if(!m){try{draft=JSON.parse(localStorage.getItem(DRAFT)||"null");}catch(e){}}
  const src=m||draft||{};
  const bid=(m&&m.bookId)||bookId||(draft&&draft.bookId)||(db.books.find(b=>(b.status||"reading")==="reading")||{}).id||"";
  const opt=b=>`<option value="${b.id}"${b.id===bid?" selected":""}>${esc(b.title)}</option>`;
  const onDesk=db.books.filter(b=>(b.status||"reading")!=="done");
  const onShelf=(function(){const c=book(bid);return c&&c.status==="done"?[c]:[];})(); // 서재 책은 그 책에 쓸 때만
  const opts=(onDesk.length?`<optgroup label="책상">${onDesk.map(opt).join("")}</optgroup>`:"")
    +(onShelf.length?`<optgroup label="서재">${onShelf.map(opt).join("")}</optgroup>`:"");
  const kinds=src.kinds||[];
  openSheet(m?"메모 고치기":"메모 채집",`
    ${!opts?`<p class="dim" style="font-size:13.5px;line-height:1.8">책상에 놓인 책이 없습니다.<br>책을 올리거나, 서재에서 다시 펼쳐 오세요.</p>
      <div class="btnrow" style="margin-top:16px"><button class="btn" data-act="bookform">책 올리기</button>
      <button class="btn ghost" data-act="tab" data-v="archive">서재 열기</button></div>`:`
    ${!m&&draft?`<p class="hint" style="color:var(--seal);font-size:12px;margin-bottom:-6px">쓰다 만 메모를 되살렸습니다 · <button data-act="cleardraft" style="text-decoration:underline">비우기</button></p>`:""}
    <div class="two">
      <div class="field" style="flex:2.2"><label for="mb">책</label><select id="mb">${opts}</select></div>
      <div class="field" style="flex:1"><label for="mp">쪽</label><input id="mp" value="${esc(src.page||(!m&&!draft&&book(bid)&&book(bid).current?book(bid).current:""))}" inputmode="numeric" placeholder="112" autocomplete="off"></div>
    </div>
    <div class="field"><label for="mq">본문 인용</label>
      <textarea id="mq" rows="5" placeholder="옮겨 적을 만큼만">${esc(src.quote||"")}</textarea></div>
    <div class="field"><label for="mt">나를 건드린 이유</label>
      <textarea id="mt" rows="6" placeholder="무엇이 걸렸는가. 왜 지금 이것이 눈에 들어왔는가.">${esc(src.thought||"")}</textarea></div>
    <div class="field"><label>자극의 종류</label><div class="chips" id="kinds">
      ${KINDS.map(k=>`<button class="chip kind ${kinds.includes(k)?"on":""}" data-act="togglekind" data-k="${k}">${k}</button>`).join("")}
    </div></div>
    <div class="field"><label for="mg">태그 · 작품</label>
      <input id="mg" list="taglist" value="${esc((src.tags||[]).join(", "))}" placeholder="운명의투구, 목소리, 어머니" autocomplete="off">
      <div class="hint">쉼표나 빈칸으로 나눕니다. 쓰고 있는 작품 이름을 넣어 두면 태그 화면에서 작품별로 묶입니다.</div></div>
    <div class="field"><label>표시</label>
      <button class="chip ${src.star?"on":""}" id="ms" data-act="togglestar">★ 중요</button></div>
    <div class="btnrow"><button class="btn solid full" data-act="savememo" data-id="${id||""}">${m?"저장":"채집하기"}</button></div>`}
  `,()=>{
    if(!el("#mp"))return;
    if(!m)el("#mp").focus();
  });
}
function readMemoForm(){
  const kinds=Array.from(document.querySelectorAll("#kinds .chip.on")).map(b=>b.dataset.k);
  return {bookId:el("#mb").value,page:el("#mp").value.trim(),quote:el("#mq").value.trim(),
    thought:el("#mt").value.trim(),tags:parseTags(el("#mg").value),kinds:kinds,
    star:el("#ms").classList.contains("on")};
}
function stashDraft(){
  if(!el("#mb")||!el("#mq"))return;                 // 메모 작성 화면이 아닐 때는 건드리지 않음
  if(el("#sheet").querySelector("[data-act='savememo'][data-id]:not([data-id=''])"))return; // 고치기는 임시저장 안 함

}

/* ── 연결 고르기 ── */
function linkForm(id){
  const m=memo(id);if(!m)return;
  openSheet("메모 연결",`
    <div class="search"><span class="dim">Q</span><input id="lq" type="search" placeholder="연결할 메모 찾기" autocomplete="off"></div>

      const inp=el("#lq");

        const q=inp.value.trim().toLowerCase();

        let list=db.memos.filter(x=>x.id!==id);
        if(terms.length)list=list.filter(x=>{const h=haystack(x);return terms.every(t=>h.includes(t));});
        list=list.sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt)).slice(0,40);
        el("#lres").innerHTML=list.length?list.map(x=>{const xb=book(x.bookId)||{};

      };
      inp.addEventListener("input",draw);draw();
    });
}

/* ═══════════ 마크다운 ═══════════ */
function md(list,title){
  const byBook={};
  list.forEach(m=>{(byBook[m.bookId]=byBook[m.bookId]||[]).push(m);});
  let out=`# ${title}\n\n`;
  Object.keys(byBook).forEach(bid=>{
    const b=book(bid)||{title:"—"};
    out+=`## ${b.title}${b.author?" — "+b.author:""}\n\n`;
    byBook[bid].sort((a,b2)=>pageNum(a.page)-pageNum(b2.page)).forEach(m=>{
      out+=`### p.${m.page||"—"}${m.star?" ★":""}\n\n`;
      if(m.quote)out+=m.quote.split("\n").map(l=>"> "+l).join("\n")+"\n\n";
      if(m.thought)out+=m.thought+"\n\n";
      (m.notes||[]).sort((a,b3)=>a.at-b3.at).forEach(n=>{out+=`- (${fmt(n.at)}) ${n.text}\n`;});
      if((m.notes||[]).length)out+="\n";
      const meta=[...(m.kinds||[]),...(m.tags||[]).map(t=>"#"+t)];
      if(meta.length)out+=`*${meta.join(" · ")}*\n\n`;
      (m.links||[]).forEach(id=>{const x=memo(id);if(x){const xb=book(x.bookId)||{};
        out+=`↔ ${xb.title||"—"} p.${x.page||"—"}\n`;}});
      if((m.links||[]).length)out+="\n";
      out+="---\n\n";
    });
  });
  return out;
}

/* ═══════════ 동작 ═══════════ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act, id=t.dataset.id;
  const inSheet=!!t.closest("#sheet");

  switch(a){
    case "tab": closeSheet(); go(t.dataset.v,{bookId:null,memoId:null,trail:[]}); break;
    case "closesheet": closeSheet(); break;
    case "back":
      closeSheet();
      if((S.trail||[]).length){const prev=S.trail.slice(0,-1),to=S.trail[S.trail.length-1];go("memo",{memoId:to,trail:prev});}
      else go(S.fromBook?"book":"inbox",{bookId:S.fromBook||S.bookId});
      break;
    case "theme":
      db.theme=db.theme==="night"?"light":"night";save();
      document.documentElement.dataset.theme=db.theme==="night"?"night":"light";
      if(S.view==="tools")render(); break;

    /* 책 */
    case "bookform": closeSheet(); bookForm(id||null); break;
    case "openbook": if(id){closeSheet();go("book",{bookId:id,fromBook:null,trail:[]});} break;
    case "savepage":{
      const b=book(id),v=el("#cp").value.trim();
      if(!b)break;
      const n=parseInt(v.replace(/[^0-9]/g,""),10);
      b.current=isNaN(n)?0:n;b.openedAt=now();
      if(b.status==="soon")b.status="reading";
      save();render();toast(b.current?`p.${b.current}까지`:"쪽 기록을 비웠습니다"); break;}
    case "toggleyear":{
      const yr=t.dataset.y;
      const years=Array.from(new Set(readEntries().map(e=>new Date(e.fin).getFullYear()))).sort((a,b)=>b-a);
      S.years[yr]=!isOpenYear(Number(yr),years);
      render(); break;}
    case "allyears":{
      const open=t.dataset.open==="1";
      readEntries().forEach(e=>{S.years[new Date(e.fin).getFullYear()]=open;});
      render(); break;}
    case "savebook":{
      const title=el("#bt").value.trim();
      if(!title)return toast("제목을 적어 주세요");
      const wasDone=id?book(id).status==="done":false;
      const data={title:title,author:el("#ba").value.trim(),extra:el("#bx").value.trim(),
        status:el("#bs").value,total:parseInt(el("#bp").value,10)||0,note:el("#bn").value.trim(),
        finishedAt:valDate(el("#bf").value)};
      if(data.status==="done"&&!data.finishedAt)data.finishedAt=now();
      if(data.status!=="done")data.finishedAt=0;
      if(id){
        const b=book(id);Object.assign(b,data,{openedAt:now()});
        b.reads=b.reads||[];
        if(data.status==="done"){
          if(wasDone&&b.reads.length)b.reads[b.reads.length-1]=data.finishedAt;  // 날짜만 고침
          else b.reads.push(data.finishedAt);
          b.reads.sort((x,y)=>x-y);
        }
      }
      else{const nb=Object.assign({id:uid(),createdAt:now(),openedAt:now(),startedAt:now(),
        reads:data.status==="done"?[data.finishedAt]:[]},data);db.books.push(nb);}
      save();closeSheet();toast(id?"저장했습니다":"책을 등록했습니다");
      go("book",{bookId:id||db.books[db.books.length-1].id}); break;}
    case "finish":{
      const b=book(id);if(!b)break;
      const input=prompt(`'${b.title}'을 완독한 날 (예: ${dateVal(now())})`,dateVal(now()));
      if(input===null)break;
      const ts=valDate(input)||now();
      b.status="done";b.finishedAt=ts;b.openedAt=now();if(b.total)b.current=b.total;
      b.reads=(b.reads||[]).concat([ts]).sort((x,y)=>x-y);
      save();go("archive");toast("서재에 꽂았습니다"); break;}
    case "reopen":{
      const b=book(id);if(!b)break;
      openSheet("다시 펼치기",`
        <p class="dim" style="font-size:13.5px;line-height:1.85;margin-top:18px">
          '${esc(b.title)}'을 책상으로 가져옵니다.<br>
          완독 기록 ${(b.reads||[]).length}번은 서재에 그대로 남습니다.</p>
        <div class="btnrow" style="margin-top:22px">
          <button class="btn solid" data-act="doreopen" data-id="${b.id}" data-reset="1">처음부터</button>
          <button class="btn" data-act="doreopen" data-id="${b.id}" data-reset="0">이어서 p.${b.current||0}</button>
        </div>`); break;}
    case "doreopen":{
      const b=book(id);if(!b)break;
      b.status="reading";b.finishedAt=0;b.openedAt=now();
      if(t.dataset.reset==="1"){b.current=0;b.startedAt=now();}
      save();closeSheet();go("book",{bookId:b.id});toast("책상에 올렸습니다"); break;}
    case "delbook":{
      const b=book(id);if(!b)break;
      const n=memosOf(id).length;
      if(!confirm(`'${b.title}'과 메모 ${n}장을 지웁니다. 되돌릴 수 없습니다.`))break;
      db.memos.filter(m=>m.bookId===id).forEach(m=>unlinkAll(m.id));
      db.memos=db.memos.filter(m=>m.bookId!==id);
      db.books=db.books.filter(x=>x.id!==id);
      save();closeSheet();go("desk");toast("지웠습니다"); break;}

    /* 메모 */
    case "memoform": closeSheet(); memoForm(id||null,t.dataset.book||S.bookId); break;
    case "togglekind": t.classList.toggle("on"); stashDraft(); break;
    case "togglestar": t.classList.toggle("on"); stashDraft(); break;
    case "cleardraft": localStorage.removeItem(DRAFT); closeSheet(); memoForm(null,S.bookId); break;
    case "savememo":{
      const d=readMemoForm();
      if(!d.bookId)return toast("책을 골라 주세요");
      if(!d.quote&&!d.thought)return toast("인용이나 생각 중 하나는 있어야 합니다");
      if(id){Object.assign(memo(id),d,{updatedAt:now()});}
      else{db.memos.push(Object.assign({id:uid(),createdAt:now(),updatedAt:now(),notes:[],links:[]},d));
        localStorage.removeItem(DRAFT);
        const b=book(d.bookId);
        if(b){b.openedAt=now();if(b.status==="soon")b.status="reading";
          const pn=pageNum(d.page);
          if(pn&&pn>(b.current||0)&&(!b.total||pn<=b.total))b.current=pn;}}
      save();closeSheet();toast(id?"저장했습니다":"채집했습니다");
      go("memo",{memoId:id||db.memos[db.memos.length-1].id,fromBook:S.view==="book"?S.bookId:S.fromBook}); break;}
    case "openmemo": if(id){
      const inSheetJump=!!t.closest("#sheet");
      const trail=(S.view==="memo"&&S.memoId&&S.memoId!==id&&!inSheetJump)
        ? (S.trail||[]).concat([S.memoId]).slice(-24) : [];
      closeSheet();
      go("memo",{memoId:id,trail:trail,fromBook:S.view==="book"?S.bookId:S.fromBook});
    } break;
    case "star":{const m=memo(id);if(m){m.star=!m.star;m.updatedAt=now();save();render();} break;}
    case "delmemo":{
      if(!confirm("이 메모를 지웁니다. 되돌릴 수 없습니다."))break;
      unlinkAll(id);db.memos=db.memos.filter(m=>m.id!==id);save();
      go(S.fromBook?"book":"inbox",{bookId:S.fromBook,memoId:null});toast("지웠습니다"); break;}
    case "copymemo":{
      const m=memo(id),b=book(m.bookId)||{};
      copy(`${m.quote||""}\n— ${b.title||""}${b.author?", "+b.author:""}, ${m.page?"p."+m.page:""}\n\n${m.thought||""}`.trim(),"인용을 복사했습니다"); break;}
    case "addnote":{
      const ta=el("#na"),tx=ta.value.trim();
      if(!tx)return toast("덧붙일 말을 적어 주세요");
      const m=memo(id);m.notes=m.notes||[];m.notes.push({id:uid(),text:tx,at:now()});m.updatedAt=now();
      save();render();toast("주석을 남겼습니다"); break;}
    case "delnote":{
      const m=memo(id);m.notes=(m.notes||[]).filter(n=>n.id!==t.dataset.n);m.updatedAt=now();save();render(); break;}
    case "tagform": tagForm(id); break;
    case "savetags":{
      const m=memo(id);m.tags=parseTags(el("#tg").value);
      m.kinds=Array.from(document.querySelectorAll("#kinds .chip.on")).map(b=>b.dataset.k);
      m.updatedAt=now();save();closeSheet();render();toast("저장했습니다"); break;}

    /* 연결 */
    case "linkform": linkForm(id); break;
    case "dolink":{
      const m=memo(id),o=memo(t.dataset.o);if(!m||!o)break;
      m.links=m.links||[];o.links=o.links||[];
      if(m.links.includes(o.id)){m.links=m.links.filter(x=>x!==o.id);o.links=o.links.filter(x=>x!==m.id);toast("연결을 풀었습니다");}
      else{m.links.push(o.id);o.links.push(m.id);toast("연결했습니다");}
      m.updatedAt=now();o.updatedAt=now();save();
      const q=el("#lq");if(q)q.dispatchEvent(new Event("input")); break;}
    case "unlink":{
      const m=memo(id),o=memo(t.dataset.o);
      if(m&&o){m.links=(m.links||[]).filter(x=>x!==o.id);o.links=(o.links||[]).filter(x=>x!==m.id);
        m.updatedAt=now();save();render();} break;}

    /* 목록 다스리기 */
    case "dense": S.dense=!S.dense;t.classList.toggle("on");refreshList(); break;
    case "togglegroup":{
      const k=decodeURIComponent(t.dataset.g);
      S.groups[k]=!isOpenGroup(k,Number(t.dataset.i));
      refreshList(); break;}
    case "allgroups":{
      const open=t.dataset.open==="1";
      query().forEach(m=>{S.groups[groupKey(m)]=open;});
      refreshList(); break;}
    case "moregroup":{
      const k=decodeURIComponent(t.dataset.g);
      S.more[k]=(S.more[k]||GROUP_CHUNK)+GROUP_CHUNK;
      refreshList(); break;}
    case "moreflat": S.limit+=40;refreshList(); break;
    case "top": window.scrollTo({top:0,behavior:"smooth"}); break;

    /* 걸러보기 */
    case "sort": S.sort={new:"old",old:"book",book:"new"}[S.sort];go("inbox"); break;
    case "fstar": S.star=!S.star;go("inbox"); break;
    case "funtag": S.untagged=!S.untagged;S.tag=null;go("inbox"); break;
    case "ftag": closeSheet();S.tag=t.dataset.t||null;S.untagged=false;go("inbox"); break;
    case "fkind": S.kind=S.kind===t.dataset.k?null:t.dataset.k;go("inbox"); break;
    case "fbook": S.fromBook=t.dataset.b||null;go("inbox"); break;

    /* 뽑기·내보내기 */
    case "draw": draw(); break;
    case "mdview": copy(md(query(),"독서첩 — 골라낸 메모"),"마크다운으로 복사했습니다"); break;
    case "mdbook":{const b=book(id);copy(md(memosOf(id),b.title),"마크다운으로 복사했습니다"); break;}
    case "exp":{
      const d=new Date(),p=n=>String(n).padStart(2,"0");
      download(`독서첩_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`,JSON.stringify(db,null,1),"application/json");
      toast("백업 파일을 저장했습니다"); break;}
    case "expmd": download("독서첩.md",md(db.memos,"독서첩")); toast("마크다운을 저장했습니다"); break;
    case "expcopy": copy(JSON.stringify(db),"백업을 복사했습니다"); break;
    case "restore":{
      const bak=localStorage.getItem(KEY+".bak");
      if(!bak)return toast("보관본이 없습니다");
      if(!confirm("지금 데이터를 직전 보관본으로 되돌립니다. 계속할까요?"))break;
      localStorage.setItem(KEY,bak);load();go("desk");toast("되살렸습니다"); break;}
    case "wipe":{
      if(!confirm("책과 메모를 모두 지웁니다. 먼저 백업했는지 확인하세요."))break;
      if(!confirm("정말 지울까요? 되돌릴 수 없습니다."))break;
      localStorage.setItem(KEY+".bak",localStorage.getItem(KEY)||"");
      db={v:1,books:[],memos:[],pins:[],theme:db.theme};save();go("desk");toast("모두 지웠습니다"); break;}
    case "pin":{
      const tg=t.dataset.t;
      db.pins=db.pins.includes(tg)?db.pins.filter(x=>x!==tg):db.pins.concat([tg]);
      save();render(); break;}
  }
});

function unlinkAll(id){db.memos.forEach(m=>{if((m.links||[]).includes(id))m.links=m.links.filter(x=>x!==id);});}

/* 맨 위로 버튼 나타내기 */
window.addEventListener("scroll",()=>{
  const b=el("#totop");if(!b)return;
  b.classList.toggle("show",window.scrollY>700);
},{passive:true});

/* 쓰다 만 메모 임시 저장 */
document.addEventListener("input",e=>{ if(e.target.closest("#sheet"))stashDraft(); });

/* 가져오기 */
document.addEventListener("change",e=>{
  if(e.target.id!=="imp")return;
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(r.result);
      if(!p||!Array.isArray(p.books)||!Array.isArray(p.memos))throw 0;
      localStorage.setItem(KEY+".bak",localStorage.getItem(KEY)||"");
      const bi=new Set(db.books.map(b=>b.id)), mi=new Set(db.memos.map(m=>m.id));
      let nb=0,nm=0;
      p.books.forEach(b=>{if(!bi.has(b.id)){db.books.push(b);nb++;}});
      p.memos.forEach(m=>{if(!mi.has(m.id)){db.memos.push(m);nm++;}});
      (p.pins||[]).forEach(t=>{if(!db.pins.includes(t))db.pins.push(t);});
      save();go("desk");toast(`책 ${nb}권, 메모 ${nm}장을 합쳤습니다`);
    }catch(err){toast("독서첩 백업 파일이 아닙니다");}
  };
  r.readAsText(f);
});

/* 단축키 (데스크톱) */
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!el("#sheet").hidden){closeSheet();return;}
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(typing)return;
  if(e.key==="n"){memoForm(null,S.bookId);}
  if(e.key==="/"){e.preventDefault();go("inbox");const q=el("#q");if(q)q.focus();}
});

load();render();
</script>
