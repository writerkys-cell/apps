<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="동그라미">
<meta name="theme-color" content="#EAE7DE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
<title>동그라미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAE7DE;
  --card:#F3F1EA;
  --ink:#1F1D1B;
  --ink-2:#4A463F;
  --ink-3:#8A8378;
  --ju:#B32430;
  --line:rgba(31,29,27,.13);
  --serif:'Gowun Batang','Nanum Myeongjo','Apple SD Gothic Neo',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Pretendard',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#131211; --card:#1C1A18; --ink:#E9E5DB; --ink-2:#BDB6A9; --ink-3:#807A70;
    --ju:#D2504B; --line:rgba(233,229,219,.14);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  min-height:100dvh; font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:480px;margin:0 auto;padding:26px 22px 44px}

/* 머리 */
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.headline{font-family:var(--serif);font-size:21px;letter-spacing:.01em}
.headline i{color:var(--ink-3);font-size:16px;margin-left:6px;font-style:normal}
.gear{border:0;background:none;color:var(--ink-3);font-family:var(--sans);font-size:13px;padding:6px 2px;cursor:pointer;letter-spacing:.02em}
.gear:active{color:var(--ink)}

/* 오늘 */
.board{position:relative;margin:28px 0 0;padding:26px 18px 24px;background:var(--card);border:1px solid var(--line);border-radius:2px;min-height:126px;display:flex;flex-direction:column;justify-content:center}
.slots{display:grid;grid-template-columns:repeat(4,52px);justify-content:center;column-gap:16px;row-gap:22px;position:relative;z-index:1}
.slot{width:52px;height:52px;padding:0;border:0;background:none;position:relative;cursor:pointer;display:grid;place-items:center;color:var(--ju);font-family:var(--serif);font-size:15px}
.slot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.slot circle{fill:none;stroke-linecap:round}
.slot .ring{stroke:var(--ju);stroke-width:2.4;stroke-dasharray:126;stroke-dashoffset:126;transform:rotate(-96deg);transform-origin:50% 50%;animation:draw .5s cubic-bezier(.3,.7,.3,1) forwards}
.slot.ghost{color:var(--ink-3);cursor:default}
.slot.ghost .ring{stroke:var(--ink-3);stroke-width:1.5;stroke-dasharray:none;stroke-dashoffset:0;animation:breathe 2.4s ease-in-out infinite}
.slot.away span{opacity:.75}
.slot.away .ring{stroke-dasharray:5 4;stroke-dashoffset:0;animation:none;opacity:.85}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:.3}50%{opacity:.85}}

.blank{text-align:center;font-family:var(--serif);font-size:16px;color:var(--ink-3)}
.closing{margin:20px 0 0;text-align:center;font-family:var(--serif);font-size:16px;color:var(--ju)}
.circled{position:absolute;inset:8px 6px;border:2.2px solid var(--ju);border-radius:50%;pointer-events:none;transform:rotate(-1.1deg) scale(1.02);opacity:.85;animation:pop .55s cubic-bezier(.2,.9,.3,1) both}
@keyframes pop{from{opacity:0;transform:rotate(-4deg) scale(.86)}to{opacity:.85;transform:rotate(-1.1deg) scale(1.02)}}

/* 단추 */
.acts{display:flex;flex-direction:column;gap:8px;margin:18px 0 0}
.acts-row{display:flex;gap:8px}
.btn.wide{width:100%}
.btn.long{letter-spacing:.02em}
.btn.due{border-width:2px;box-shadow:0 0 0 3px rgba(179,36,48,.09)}
.btn{flex:1;padding:16px 8px;border:1px solid var(--ink);background:none;color:var(--ink);font-family:var(--serif);font-size:17px;border-radius:2px;cursor:pointer;letter-spacing:.04em}
.btn:active{background:var(--ink);color:var(--paper)}
.btn.rest{border-color:var(--ju);color:var(--ju)}
.btn.rest:active{background:var(--ju);color:var(--paper)}
.btn.cancel{flex:0 0 auto;padding:16px 14px;border-color:var(--line);color:var(--ink-3);font-size:15px}
.btn.cancel:active{background:none;border-color:var(--ink-3);color:var(--ink-2)}

/* 지난 날 */
.month{margin:36px 0 0;border-top:1px solid var(--line);padding-top:18px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mtitle{font-family:var(--serif);font-size:16px}
.nav{border:0;background:none;color:var(--ink-3);font-size:18px;line-height:1;padding:6px 12px;cursor:pointer}
.nav:disabled{opacity:.25}
.cal{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:44px;width:100%}
.cal>*{min-width:0}
.wk{display:flex;align-items:center;justify-content:center;height:26px;font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.cal .wk{grid-row:1}
.cell{position:relative;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.cell.pad{visibility:hidden}
.cell .n{position:relative;z-index:1}
.cell.stamped .n{position:absolute;top:1px;left:3px;font-size:9px;opacity:.55}
.stamp{
  position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;
  border:1.6px solid currentColor;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:14px;line-height:1;
  transform:rotate(-9deg);opacity:.9
}
.cell.met{color:var(--ju)}
.cell.met .stamp{border-width:2px}
.cell.short{color:var(--ink-3)}
.cell.short .stamp{opacity:.65;border-style:dashed}
.cell.mark .n{font-weight:700;color:var(--ink)}
.mfoot{margin-top:16px;font-size:13px;color:var(--ink-3);display:flex;gap:16px;justify-content:center}
.mfoot b{color:var(--ink-2);font-weight:400}

/* 설정 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:4}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);border-radius:12px 12px 0 0;padding:22px 22px calc(28px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .3s cubic-bezier(.3,.8,.3,1);z-index:5;max-height:86dvh;overflow:auto}
.panel.on{transform:translateY(0)}
.panel h2{font-family:var(--serif);font-size:18px;font-weight:400;margin:0 0 18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row label{font-size:14px;color:var(--ink-2)}
.step{display:flex;align-items:center;gap:14px}
.step button{width:34px;height:34px;border:1px solid var(--line);background:none;color:var(--ink);font-size:17px;border-radius:50%;cursor:pointer}
.step span{font-family:var(--serif);font-size:18px;min-width:26px;text-align:center}
input[type=text],select{font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:9px 11px;width:150px;text-align:right}
.mini{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.mini button{flex:1;min-width:110px;padding:11px 8px;border:1px solid var(--line);background:none;color:var(--ink-2);font-size:13px;border-radius:2px;cursor:pointer}
.mini button.warn{color:var(--ju)}
.note{margin-top:16px;font-size:12px;color:var(--ink-3);line-height:1.7}
:focus-visible{outline:2px solid var(--ju);outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="headline" id="headline"></div>
    <button class="gear" id="openSet">설정</button>
  </div>

  <div class="board" id="board">
    <div class="slots" id="slots"></div>
    <div id="status"></div>
  </div>

  <div class="acts">
    <button class="btn wide" id="work">포모도로</button>
    <div class="acts-row">
      <button class="btn rest" id="rest">휴식</button>
      <button class="btn rest long" id="long">긴 휴식</button>
      <button class="btn cancel" id="cancel">취소</button>
    </div>
  </div>

  <div class="month">
    <div class="mhead">
      <button class="nav" id="prev" aria-label="이전 달">‹</button>
      <div class="mtitle" id="mtitle"></div>
      <button class="nav" id="next" aria-label="다음 달">›</button>
    </div>
    <div class="cal" id="cal"></div>
    <div class="mfoot" id="mfoot"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="panel" id="panel" role="dialog" aria-label="설정">
  <h2>설정</h2>
  <div class="row">
    <label>하루 포모도로 횟수</label>
    <div class="step">
      <button data-per="-1" aria-label="줄이기">−</button><span id="perVal">4</span><button data-per="1" aria-label="늘리기">+</button>
    </div>
  </div>
  <div class="row">
    <label>하루가 시작하는 시각</label>
    <select id="dayStart"></select>
  </div>
  <div class="row">
    <label>이 기기 이름</label>
    <input type="text" id="devName" autocapitalize="off" autocorrect="off">
  </div>
  <div class="row">
    <label>포모도로 단축어</label>
    <input type="text" id="scWork" autocapitalize="off" autocorrect="off">
  </div>
  <div class="row">
    <label>휴식 단축어</label>
    <input type="text" id="scRest" autocapitalize="off" autocorrect="off">
  </div>
  <div class="row">
    <label>긴 휴식 단축어</label>
    <input type="text" id="scLong" autocapitalize="off" autocorrect="off">
  </div>
  <div class="row">
    <label>취소 단축어</label>
    <input type="text" id="scCancel" autocapitalize="off" autocorrect="off">
  </div>
  <div class="mini">
    <button id="exp">이 기기 기록 내보내기</button>
    <button id="imp">다른 기기 기록 합치기</button>
    <button id="clr" class="warn">오늘 비우기</button>
  </div>
  <p class="note">아이폰에서 내보낸 파일을 아이패드에서 합치면(또는 그 반대로) 두 기기의 칸이 시간순으로 하나가 됩니다. 같은 칸은 두 번 세지 않고, 합치는 쪽의 설정은 그대로 둡니다. 기록은 이 기기의 브라우저에만 남으니 이따금 내보내 두세요.</p>
</div>

<script>
var KEY='donggeurami.v1';
var DEF={settings:{perDay:4,dayStart:4,scWork:'포모도로',scRest:'휴식',scLong:'긴휴식',scCancel:'취소',devId:'',devName:''},days:{}};
var D=load(), viewY, viewM;

function guessName(){
  var u=navigator.userAgent||'';
  if(/iPad/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)) return '아이패드';
  if(/iPhone/.test(u)) return '아이폰';
  return '기기';
}
function rnd(){ return Math.random().toString(36).slice(2,8); }
function load(){
  var d;
  try{
    var r=JSON.parse(localStorage.getItem(KEY));
    d=(r&&r.settings)?{settings:Object.assign({},DEF.settings,r.settings),days:r.days||{}}
                     :JSON.parse(JSON.stringify(DEF));
  }catch(e){ d=JSON.parse(JSON.stringify(DEF)); }
  if(!d.settings.devId) d.settings.devId=rnd();
  if(!d.settings.devName) d.settings.devName=guessName();
  for(var k in d.days) d.days[k]=normalize(d.days[k],k,d.settings.devId,d.settings.perDay);
  return d;
}
/* 예전 형식({done:n})을 칸 목록으로 옮긴다 */
function normalize(rec,k,dev,per){
  if(!rec||typeof rec!=='object') return {target:per,logs:[],pending:null};
  if(!rec.logs){
    var n=rec.done||0, logs=[];
    for(var i=0;i<n;i++) logs.push({id:dev+'-old-'+k+'-'+i,dev:dev,s:null,e:null});
    rec={target:rec.target||per,logs:logs,pending:rec.working?{id:dev+'-'+rnd(),dev:dev,s:null}:null};
  }
  if(!rec.logs) rec.logs=[];
  if(rec.pending===undefined) rec.pending=null;
  if(!rec.target) rec.target=per;
  return rec;
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(D)); }
  catch(e){ alert('저장에 실패했습니다. 브라우저 저장 공간을 확인해 주세요.'); }
}
function pad2(n){ return (n<10?'0':'')+n; }
function keyOf(d){
  var t=new Date(d.getTime()-D.settings.dayStart*3600000);
  return t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate());
}
function todayKey(){ return keyOf(new Date()); }
function day(k){
  if(!D.days[k]) D.days[k]={target:D.settings.perDay,logs:[],pending:null};
  return D.days[k];
}
function today(){
  var t=day(todayKey());
  t.target=D.settings.perDay;
  return t;
}
function hhmm(iso){
  if(!iso) return '';
  var d=new Date(iso);
  return d.getHours()+':'+pad2(d.getMinutes());
}
function runShortcut(name){ location.href='shortcuts://run-shortcut?name='+encodeURIComponent(name); }

function render(){
  var t=today(), now=new Date();
  var names=['일','월','화','수','목','금','토'];
  document.getElementById('headline').innerHTML=
    (now.getMonth()+1)+'월 '+now.getDate()+'일<i>'+names[now.getDay()]+'요일</i>';

  var box=document.getElementById('slots');
  box.innerHTML='';
  t.logs.forEach(function(g,i){
    var b=document.createElement('button');
    b.className='slot'+(g.dev!==D.settings.devId?' away':'');
    b.dataset.i=i;
    var when=(g.s||g.e)?(hhmm(g.s)+(g.e?'–'+hhmm(g.e):'')):'';
    b.title=(i+1)+'번째 칸'+(when?' · '+when:'')+(g.dev!==D.settings.devId?' · 다른 기기':'');
    b.setAttribute('aria-label',b.title);
    b.innerHTML='<svg viewBox="0 0 52 52"><circle class="ring" cx="26" cy="26" r="20"/></svg><span>'+(i+1)+'</span>';
    box.appendChild(b);
  });
  if(t.pending){
    var g2=document.createElement('div');
    g2.className='slot ghost';
    g2.innerHTML='<svg viewBox="0 0 52 52"><circle class="ring" cx="26" cy="26" r="20"/></svg><span>'+(t.logs.length+1)+'</span>';
    box.appendChild(g2);
  }

  var old=document.querySelector('.circled'); if(old) old.parentNode.removeChild(old);
  var st=document.getElementById('status'), done=t.logs.length;
  if(done===0 && !t.pending){
    st.innerHTML='<div class="blank">아직 비어 있습니다.</div>';
  }else if(done>=t.target){
    st.innerHTML='<div class="closing">오늘 몫을 채웠습니다.</div>';
    var c=document.createElement('div'); c.className='circled';
    var board=document.getElementById('board');
    board.insertBefore(c,board.firstChild);
  }else{
    st.innerHTML='';
  }

  document.getElementById('work').textContent=t.pending?'포모도로 다시':'포모도로';
  var nth=t.logs.length+(t.pending?1:0);
  document.getElementById('long').className='btn rest long'+((nth>0&&nth%4===0)?' due':'');
  document.getElementById('perVal').textContent=D.settings.perDay;
  renderMonth();
}

function renderMonth(){
  var now=new Date();
  if(viewY===undefined){ viewY=now.getFullYear(); viewM=now.getMonth(); }
  document.getElementById('mtitle').textContent=viewY+'년 '+(viewM+1)+'월';
  document.getElementById('next').disabled=(viewY===now.getFullYear()&&viewM===now.getMonth());

  var cal=document.getElementById('cal');
  cal.innerHTML='';
  var wk=['일','월','화','수','목','금','토'];
  for(var i=0;i<7;i++){
    var h=document.createElement('div');
    h.className='wk'; h.textContent=wk[i];
    cal.appendChild(h);
  }
  var first=new Date(viewY,viewM,1);
  var lastDate=new Date(viewY,viewM+1,0).getDate();
  var lead=first.getDay();
  for(var p=0;p<lead;p++){
    var e=document.createElement('div'); e.className='cell pad'; e.innerHTML='<span class="n">.</span>';
    cal.appendChild(e);
  }
  var tk=todayKey(), metDays=0;
  for(var d=1;d<=lastDate;d++){
    var k=viewY+'-'+pad2(viewM+1)+'-'+pad2(d);
    var rec=D.days[k], n=rec?rec.logs.length:0;
    var cls='cell', inner='<span class="n">'+d+'</span>';
    if(n>0){
      var met=n>=rec.target;
      if(met) metDays++;
      cls+=' stamped '+(met?'met':'short');
      inner+='<span class="stamp">'+n+'</span>';
    }
    if(k===tk) cls+=' mark';
    var cell=document.createElement('div');
    cell.className=cls;
    cell.innerHTML=inner;
    if(n>0) cell.title=n+'칸 / 목표 '+rec.target+'칸';
    cal.appendChild(cell);
  }
  document.getElementById('mfoot').innerHTML=
    '채운 날 <b>'+metDays+'일</b> · 이어 온 날 <b>'+streak()+'일</b>';
}

function isMet(k){ var r=D.days[k]; return !!r && r.logs.length>0 && r.logs.length>=r.target; }
function streak(){
  var n=0, d=new Date();
  if(!isMet(keyOf(d))) d.setDate(d.getDate()-1);
  while(isMet(keyOf(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

/* 단추 */
document.getElementById('work').onclick=function(){
  var t=today();
  t.pending={id:D.settings.devId+'-'+Date.now().toString(36)+rnd(),dev:D.settings.devId,s:new Date().toISOString()};
  save(); render();
  runShortcut(D.settings.scWork);
};
function closeSlot(shortcut){
  var t=today(), now=new Date().toISOString();
  var g=t.pending||{id:D.settings.devId+'-'+Date.now().toString(36)+rnd(),dev:D.settings.devId,s:null};
  g.e=now; t.logs.push(g); t.pending=null;
  save(); render();
  runShortcut(shortcut);
}
document.getElementById('rest').onclick=function(){ closeSlot(D.settings.scRest); };
document.getElementById('long').onclick=function(){ closeSlot(D.settings.scLong); };
document.getElementById('cancel').onclick=function(){
  var t=today(); t.pending=null; save(); render();
  runShortcut(D.settings.scCancel);
};
document.getElementById('slots').onclick=function(e){
  var b=e.target.closest ? e.target.closest('.slot') : null;
  if(!b || b.className.indexOf('ghost')>-1) return;
  var i=+b.dataset.i, t=today();
  if(i<t.logs.length && confirm((i+1)+'번째 칸부터 지울까요?')){ t.logs=t.logs.slice(0,i); save(); render(); }
};

/* 기기 사이 병합 */
function mergeInto(incoming){
  var addedLogs=0, addedDays=0;
  for(var k in incoming){
    var inc=normalize(incoming[k],k,'other',D.settings.perDay);
    if(!D.days[k]){ D.days[k]={target:inc.target,logs:[],pending:null}; addedDays++; }
    var mine=D.days[k], seen={};
    mine.logs.forEach(function(g){ seen[g.id]=1; });
    inc.logs.forEach(function(g){
      if(seen[g.id]) return;
      seen[g.id]=1; mine.logs.push(g); addedLogs++;
    });
    mine.target=Math.max(mine.target||0,inc.target||0)||D.settings.perDay;
    mine.logs.sort(function(a,b){
      var x=a.e||a.s||'', y=b.e||b.s||'';
      if(x&&y) return x<y?-1:(x>y?1:0);
      if(x&&!y) return 1;
      if(!x&&y) return -1;
      return 0;
    });
  }
  return {logs:addedLogs,days:addedDays};
}

/* 설정 */
var scrim=document.getElementById('scrim'), panel=document.getElementById('panel');
function openSet(){
  document.getElementById('scWork').value=D.settings.scWork;
  document.getElementById('scRest').value=D.settings.scRest;
  document.getElementById('scLong').value=D.settings.scLong;
  document.getElementById('scCancel').value=D.settings.scCancel;
  document.getElementById('devName').value=D.settings.devName;
  document.getElementById('dayStart').value=D.settings.dayStart;
  scrim.classList.add('on'); panel.classList.add('on');
}
function closeSet(){ scrim.classList.remove('on'); panel.classList.remove('on'); }
document.getElementById('openSet').onclick=openSet;
scrim.onclick=closeSet;
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSet(); });

var sel=document.getElementById('dayStart');
for(var h=0;h<=9;h++){
  var o=document.createElement('option');
  o.value=h; o.textContent=(h===0?'자정':'새벽 '+h+'시');
  sel.appendChild(o);
}
sel.onchange=function(){ D.settings.dayStart=+sel.value; save(); render(); };

panel.addEventListener('click',function(e){
  var per=e.target.dataset && e.target.dataset.per;
  if(per){
    D.settings.perDay=Math.min(16,Math.max(1,D.settings.perDay + (+per)));
    save(); render();
  }
});
function bindName(id,key,fallback){
  document.getElementById(id).onchange=function(e){
    D.settings[key]=e.target.value.trim()||fallback;
    e.target.value=D.settings[key]; save(); render();
  };
}
bindName('scWork','scWork','포모도로');
bindName('scRest','scRest','휴식');
bindName('scLong','scLong','긴휴식');
bindName('scCancel','scCancel','취소');
bindName('devName','devName',guessName());

document.getElementById('clr').onclick=function(){
  if(!confirm('오늘 채운 칸을 모두 비웁니다.')) return;
  var t=today(); t.logs=[]; t.pending=null; save(); render(); closeSet();
};
document.getElementById('exp').onclick=function(){
  var out={v:2,device:{id:D.settings.devId,name:D.settings.devName},settings:D.settings,days:D.days};
  var blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='동그라미-'+D.settings.devName+'-'+todayKey()+'.json';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
};
document.getElementById('imp').onclick=function(){
  var f=document.createElement('input'); f.type='file'; f.accept='application/json,.json';
  f.onchange=function(){
    var r=new FileReader();
    r.onload=function(){
      try{
        var o=JSON.parse(r.result);
        if(!o||!o.days) throw 0;
        if(o.device && o.device.id===D.settings.devId
           && !confirm('이 기기에서 내보낸 파일 같습니다. 그래도 합칠까요?')) return;
        var got=mergeInto(o.days);
        save(); render(); closeSet();
        alert(got.logs+'칸을 합쳤습니다.'+(got.days?' (새로운 날 '+got.days+'일)':''));
      }catch(e){ alert('읽을 수 없는 파일입니다. 이 앱에서 내보낸 JSON을 골라 주세요.'); }
    };
    r.readAsText(f.files[0]);
  };
  f.click();
};

document.getElementById('prev').onclick=function(){
  viewM--; if(viewM<0){ viewM=11; viewY--; } renderMonth();
};
document.getElementById('next').onclick=function(){
  viewM++; if(viewM>11){ viewM=0; viewY++; } renderMonth();
};
document.addEventListener('visibilitychange',function(){ if(!document.hidden) render(); });

save();
render();
</script>
</body>
</html>
