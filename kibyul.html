<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기별</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eae3d5;
  --paper-2:#f2ece0;
  --ink:#201e1a;
  --ink-mid:#5d574c;
  --ink-faint:#8d8579;
  --rule:#c9c0ac;
  --seal:#9c2f26;
  --seal-soft:rgba(156,47,38,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Gowun Batang',"Nanum Myeongjo",serif;
  background:var(--paper);
  background-image:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,.5) 0, transparent 42%),
    radial-gradient(circle at 82% 78%, rgba(160,148,124,.13) 0, transparent 46%);
  color:var(--ink);
  line-height:1.85;
  -webkit-font-smoothing:antialiased;
  padding:0 20px 96px;
}
.wrap{max-width:600px;margin:0 auto}

/* 머리 */
header{padding:52px 0 26px;text-align:center}
.mark{
  display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;border:1.5px solid var(--seal);color:var(--seal);
  border-radius:50%;font-size:15px;letter-spacing:0;margin-bottom:14px;
}
.today-date{font-size:20px;letter-spacing:.06em}
.today-sub{font-size:12.5px;color:var(--ink-faint);letter-spacing:.16em;margin-top:2px}

/* 길 */
nav{display:flex;justify-content:center;gap:2px;flex-wrap:wrap;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:9px 0;margin-bottom:40px}
nav button{
  font-family:inherit;font-size:13.5px;color:var(--ink-faint);
  background:none;border:none;cursor:pointer;padding:3px 11px;letter-spacing:.09em;
  transition:color .18s;
}
nav button:hover{color:var(--ink)}
nav button[aria-current="true"]{color:var(--ink);position:relative}
nav button[aria-current="true"]::after{
  content:"";position:absolute;left:11px;right:11px;bottom:-1px;height:1.5px;background:var(--seal);
}

/* 공통 */
.section{display:none}
.section.on{display:block;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
h2.head{font-size:15px;letter-spacing:.2em;color:var(--ink-mid);font-weight:400;
  margin-bottom:22px;text-align:center}
.empty{text-align:center;color:var(--ink-faint);font-size:14.5px;padding:34px 0;line-height:2.1}

/* 도래한 기별 */
.arrived{
  background:var(--paper-2);border:1px solid var(--rule);
  padding:30px 26px 24px;margin-bottom:22px;position:relative;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset;
}
.arrived .broken{
  position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  background:var(--paper);padding:0 9px;
}
.arrived .meta{font-size:11.5px;letter-spacing:.14em;color:var(--ink-faint);
  text-align:center;margin-bottom:16px}
.arrived .text{font-size:18px;line-height:2.05;text-align:center;padding:6px 4px 4px;
  word-break:keep-all}
.arrived .overdue{color:var(--seal)}
.lineage{margin-top:18px;padding-top:14px;border-top:1px dashed var(--rule)}
.lineage p{font-size:13px;color:var(--ink-faint);text-align:center;
  text-decoration:line-through;text-decoration-color:var(--rule);word-break:keep-all}
.lineage .gen{display:block;font-size:10.5px;letter-spacing:.16em;
  text-decoration:none;margin-bottom:2px;color:var(--rule)}

/* 판정 */
.verdicts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:24px}
.verdicts button{
  font-family:inherit;font-size:14.5px;letter-spacing:.1em;padding:12px 0;
  background:transparent;border:1px solid var(--rule);color:var(--ink-mid);
  cursor:pointer;transition:all .16s;
}
.verdicts button:hover{border-color:var(--ink);color:var(--ink);background:rgba(255,255,255,.42)}
.verdicts button.seal:hover{border-color:var(--seal);color:var(--seal);background:var(--seal-soft)}

/* 회고 */
.note-step{margin-top:22px;padding-top:20px;border-top:1px solid var(--rule);text-align:center}
.note-step .q{font-size:13px;color:var(--ink-faint);letter-spacing:.06em;margin-bottom:12px}
.row{display:flex;gap:8px;justify-content:center;margin-top:12px}

/* 입력 */
textarea,input[type=text]{
  width:100%;font-family:inherit;font-size:16.5px;line-height:2;color:var(--ink);
  background:var(--paper-2);border:1px solid var(--rule);padding:15px 16px;
  resize:none;outline:none;transition:border-color .16s;
}
textarea:focus,input:focus{border-color:var(--ink-mid)}
textarea::placeholder{color:var(--ink-faint)}
.terms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.terms button{
  font-family:inherit;font-size:14px;letter-spacing:.06em;padding:11px 0;cursor:pointer;
  background:transparent;border:1px solid var(--rule);color:var(--ink-mid);transition:all .16s;
}
.terms button:hover{border-color:var(--ink-mid)}
.terms button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper-2)}
.due-hint{text-align:center;font-size:12.5px;letter-spacing:.1em;color:var(--ink-faint);
  margin-top:14px;min-height:20px}
.btn{
  font-family:inherit;font-size:14.5px;letter-spacing:.14em;padding:12px 26px;cursor:pointer;
  background:transparent;border:1px solid var(--ink);color:var(--ink);transition:all .16s;
}
.btn:hover:not(:disabled){background:var(--ink);color:var(--paper-2)}
.btn:disabled{border-color:var(--rule);color:var(--rule);cursor:default}
.btn.ghost{border-color:var(--rule);color:var(--ink-faint)}
.btn.ghost:hover{background:transparent;border-color:var(--ink-mid);color:var(--ink-mid)}
.center{text-align:center;margin-top:22px}

/* 묻은 뒤 */
.buried{text-align:center;padding:56px 0 40px;animation:rise .6s ease both}
.buried .line{font-size:16.5px;letter-spacing:.06em;margin-top:20px}
.buried .sub{font-size:13px;color:var(--ink-faint);margin-top:8px;letter-spacing:.06em}

/* 목록 */
.entry{border-bottom:1px solid var(--rule);padding:20px 2px}
.entry:first-child{border-top:1px solid var(--rule)}
.entry .t{font-size:16px;line-height:1.95;word-break:keep-all}
.entry .d{font-size:11.5px;letter-spacing:.13em;color:var(--ink-faint);margin-top:8px}
.entry .n{font-size:13.5px;color:var(--ink-mid);margin-top:10px;padding-left:12px;
  border-left:2px solid var(--rule);word-break:keep-all}
.entry .past{font-size:12.5px;color:var(--ink-faint);margin-top:9px;
  text-decoration:line-through;text-decoration-color:var(--rule)}
.count{text-align:center;font-size:12px;letter-spacing:.18em;color:var(--ink-faint);margin-bottom:18px}

/* 결 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-bottom:30px}
.stat{background:var(--paper);padding:20px 12px;text-align:center}
.stat .v{font-size:26px;letter-spacing:.02em}
.stat .k{font-size:11.5px;letter-spacing:.16em;color:var(--ink-faint);margin-top:2px}
.bar-row{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:13.5px}
.bar-row .lb{width:56px;letter-spacing:.08em;color:var(--ink-mid);flex-shrink:0}
.bar-track{flex:1;height:7px;background:rgba(0,0,0,.07)}
.bar-fill{height:100%;background:var(--seal);transition:width .7s ease}
.bar-row .vl{width:64px;text-align:right;font-size:12px;color:var(--ink-faint);
  letter-spacing:.06em;flex-shrink:0}
.note-line{font-size:13px;color:var(--ink-faint);line-height:2.1;margin-top:26px;
  padding-top:18px;border-top:1px solid var(--rule);word-break:keep-all}

/* 갈무리 */
.tool{border-bottom:1px solid var(--rule);padding:22px 0}
.tool:first-of-type{border-top:1px solid var(--rule)}
.tool h3{font-size:15px;font-weight:400;letter-spacing:.1em;margin-bottom:6px}
.tool p{font-size:13px;color:var(--ink-faint);line-height:1.95;margin-bottom:14px;word-break:keep-all}
.warn{background:var(--seal-soft);border-left:2px solid var(--seal);padding:12px 14px;
  font-size:13px;color:var(--ink-mid);margin-bottom:22px;word-break:keep-all}

/* 알림 */
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);
  background:var(--ink);color:var(--paper-2);font-size:13.5px;letter-spacing:.08em;
  padding:11px 22px;opacity:0;pointer-events:none;transition:all .3s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

*:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:460px){
  .verdicts,.terms{grid-template-columns:1fr 1fr}
  .arrived{padding:28px 18px 20px}
  .arrived .text{font-size:16.5px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="mark">封</div>
  <div class="today-date" id="todayDate"></div>
  <div class="today-sub" id="todaySub"></div>
</header>

<nav>
  <button data-go="today" aria-current="true">오늘</button>
  <button data-go="fulfilled">실현</button>
  <button data-go="failed">무산</button>
  <button data-go="void">무효</button>
  <button data-go="stats">결</button>
  <button data-go="data">갈무리</button>
</nav>

<!-- 오늘 -->
<section class="section on" id="s-today"></section>

<!-- 목록 -->
<section class="section" id="s-fulfilled"></section>
<section class="section" id="s-failed"></section>
<section class="section" id="s-void"></section>

<!-- 결 -->
<section class="section" id="s-stats"></section>

<!-- 갈무리 -->
<section class="section" id="s-data">
  <h2 class="head">갈 무 리</h2>
  <div id="backupWarn"></div>
  <div class="tool">
    <h3>내보내기</h3>
    <p>묻어둔 것과 판정한 것을 하나의 파일로 저장합니다. 이 앱은 브라우저 안에만 기록을 두기 때문에, 가끔 내보내 두는 편이 안전합니다.</p>
    <button class="btn" id="btnExport">파일로 내보내기</button>
  </div>
  <div class="tool">
    <h3>불러오기</h3>
    <p>내보낸 파일을 되살립니다. 지금 기록과 겹치지 않는 것만 더해지므로, 여러 기기의 기록을 합칠 수 있습니다.</p>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
    <button class="btn" id="btnImport">파일 불러오기</button>
  </div>
  <div class="tool">
    <h3>봉인 열기</h3>
    <p>아직 도래하지 않은 기별을 미리 봅니다. 이 앱은 적어두고 잊기 위한 것이라, 권하지 않습니다.</p>
    <button class="btn ghost" id="btnPeek">그래도 열어보기</button>
    <div id="peekBox"></div>
  </div>
  <div class="tool">
    <h3>전부 지우기</h3>
    <p>이 브라우저에 남은 기록을 모두 지웁니다. 되돌릴 수 없습니다.</p>
    <button class="btn ghost" id="btnWipe">전부 지우기</button>
  </div>
</section>

</div>
<div id="toast"></div>

<script>
"use strict";
/* ───────── 저장 ───────── */
const KEY="gibyeol.v1";
const DEF={version:1,items:[],lastExport:null,exportedCount:0};
let db=load();

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return structuredClone(DEF);
    const p=JSON.parse(raw);
    return Object.assign(structuredClone(DEF),p);
  }catch(e){return structuredClone(DEF)}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db))}
  catch(e){toast("저장하지 못했습니다. 브라우저 저장 공간을 확인해 주세요")}
}

/* ───────── 날짜 ───────── */
const DAYS=["일","월","화","수","목","금","토"];
const TERMS={w1:{label:"일주일 뒤",short:"일주일"},m1:{label:"한 달 뒤",short:"한 달"},
             m3:{label:"석 달 뒤",short:"석 달"},y1:{label:"1년 뒤",short:"1년"}};

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)}
function today(){return ymd(new Date())}
function addMonths(d,n){
  const day=d.getDate(),t=new Date(d.getFullYear(),d.getMonth()+n,1);
  t.setDate(Math.min(day,new Date(t.getFullYear(),t.getMonth()+1,0).getDate()));
  return t;
}
function due(from,term){
  const d=parse(from);
  if(term==="w1"){d.setDate(d.getDate()+7);return ymd(d)}
  if(term==="m1")return ymd(addMonths(d,1));
  if(term==="m3")return ymd(addMonths(d,3));
  return ymd(addMonths(d,12));
}
function fmt(s){const d=parse(s);return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`}
function fmtShort(s){const d=parse(s);return `${d.getMonth()+1}월 ${d.getDate()}일`}
function gap(a,b){return Math.round((parse(b)-parse(a))/86400000)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ───────── 상태 ───────── */
const arrived=()=>db.items.filter(i=>i.status==="sealed"&&i.dueAt<=today())
                          .sort((a,b)=>a.dueAt.localeCompare(b.dueAt));
const sealed=()=>db.items.filter(i=>i.status==="sealed"&&i.dueAt>today())
                         .sort((a,b)=>a.dueAt.localeCompare(b.dueAt));
const byStatus=s=>db.items.filter(i=>i.status===s)
                          .sort((a,b)=>(b.resolvedAt||"").localeCompare(a.resolvedAt||""));

/* ───────── 오늘 ───────── */
let draft={text:"",term:null,editing:null,noting:null,justBuried:false};

function renderToday(){
  const el=document.getElementById("s-today");
  const list=arrived();

  if(draft.justBuried){
    el.innerHTML=`<div class="buried">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
        <circle cx="23" cy="23" r="20" fill="none" stroke="var(--seal)" stroke-width="1.5"/>
        <path d="M14 23h18M23 14v18" stroke="var(--seal)" stroke-width="1.2" opacity=".55"/>
      </svg>
      <div class="line">묻었습니다.</div>
      <div class="sub">${esc(draft.buriedOn)}에 다시 옵니다. 그때까지 어디에도 보이지 않습니다.</div>
      <div class="center"><button class="btn ghost" id="afterBury">오늘로</button></div>
    </div>`;
    document.getElementById("afterBury").onclick=()=>{draft.justBuried=false;renderToday()};
    return;
  }

  let html="";

  /* 도래한 기별 */
  if(list.length){
    html+=`<h2 class="head">도 래 한 기 별</h2>`;
    list.forEach(it=>{
      const late=gap(it.dueAt,today());
      html+=`<article class="arrived" data-id="${it.id}">
        <span class="broken">
          <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
            <circle cx="11" cy="11" r="9" fill="none" stroke="var(--seal)" stroke-width="1.3"
              stroke-dasharray="3.6 3.2"/>
          </svg>
        </span>
        <div class="meta">${esc(fmt(it.createdAt))}에 묻음 · ${TERMS[it.term].short}
          ${late>0?`<span class="overdue"> · ${late}일 지남</span>`:``}</div>
        <div class="text">${esc(it.text)}</div>
        ${it.lineage&&it.lineage.length?`<div class="lineage">${
          it.lineage.map((g,n)=>`<p><span class="gen">${n+1}대 · ${esc(fmtShort(g.createdAt))}</span>${esc(g.text)}</p>`).join("")
        }</div>`:``}
        <div class="body" data-body="${it.id}"></div>
      </article>`;
    });
  }else{
    /* 쓰기 */
    html+=`<h2 class="head">오 늘 묻 는 다</h2>
    <textarea id="wish" rows="3" maxlength="300"
      placeholder="바라는 미래를 한 문장으로. 이미 그렇게 된 것처럼 구체적으로.">${esc(draft.text)}</textarea>
    <div class="terms" id="terms">
      ${Object.entries(TERMS).map(([k,v])=>
        `<button data-term="${k}" aria-pressed="${draft.term===k}">${v.label}</button>`).join("")}
    </div>
    <div class="due-hint" id="dueHint">${draft.term?fmt(due(today(),draft.term))+"에 옵니다":""}</div>
    <div class="center"><button class="btn" id="bury" ${draft.text.trim()&&draft.term?"":"disabled"}>묻기</button></div>`;

    const n=sealed().length;
    html+=`<div class="empty" style="padding-top:44px">${
      n?`묻어둔 기별 ${n}개가 자기 날짜를 기다리는 중입니다.<br>무엇인지는 그날 알게 됩니다.`
       :`아직 묻어둔 기별이 없습니다.`}</div>`;
  }

  el.innerHTML=html;

  if(list.length){
    list.forEach(it=>renderBody(it.id));
  }else{
    const ta=document.getElementById("wish");
    ta.oninput=e=>{draft.text=e.target.value;
      document.getElementById("bury").disabled=!(draft.text.trim()&&draft.term)};
    document.getElementById("terms").onclick=e=>{
      const b=e.target.closest("[data-term]");if(!b)return;
      draft.term=b.dataset.term;
      document.querySelectorAll("#terms button").forEach(x=>
        x.setAttribute("aria-pressed",x.dataset.term===draft.term));
      document.getElementById("dueHint").textContent=fmt(due(today(),draft.term))+"에 옵니다";
      document.getElementById("bury").disabled=!(draft.text.trim()&&draft.term);
    };
    document.getElementById("bury").onclick=bury;
    ta.addEventListener("keydown",e=>{
      if((e.metaKey||e.ctrlKey)&&e.key==="Enter"&&draft.text.trim()&&draft.term)bury();
    });
    if(draft.text) ta.focus();
  }
}

function bury(){
  const t=draft.text.trim();if(!t||!draft.term)return;
  const d=due(today(),draft.term);
  db.items.push({id:uid(),text:t,term:draft.term,createdAt:today(),dueAt:d,
    status:"sealed",resolvedAt:null,note:"",lineage:[],gen:1});
  save();
  draft.buriedOn=fmt(d);
  draft.text="";draft.term=null;draft.justBuried=true;
  renderToday();refreshAll();
}

/* 카드 하단: 판정 · 회고 · 다시 */
function renderBody(id){
  const box=document.querySelector(`[data-body="${id}"]`);
  if(!box)return;
  const it=db.items.find(x=>x.id===id);
  const mode=draft.noting&&draft.noting.id===id?"note"
            :draft.editing===id?"edit":"verdict";

  if(mode==="verdict"){
    box.innerHTML=`<div class="verdicts">
      <button class="seal" data-v="fulfilled">실현</button>
      <button data-v="failed">무산</button>
      <button data-v="again">다시</button>
      <button data-v="void">무효</button></div>`;
    box.querySelector(".verdicts").onclick=e=>{
      const b=e.target.closest("[data-v]");if(!b)return;
      if(b.dataset.v==="again"){draft.editing=id;draft.editText=it.text;draft.editTerm=null;renderBody(id)}
      else{draft.noting={id,verdict:b.dataset.v};renderBody(id)}
    };
    return;
  }

  if(mode==="note"){
    const v=draft.noting.verdict;
    const q={fulfilled:"무엇이 이걸 오게 했나요?",failed:"무엇이 가로막았나요?",
             void:"왜 무의미해졌나요?"}[v];
    box.innerHTML=`<div class="note-step">
      <div class="q">${q} <span style="color:var(--rule)">— 건너뛰어도 됩니다</span></div>
      <input type="text" id="noteIn" maxlength="200" placeholder="한 줄">
      <div class="row">
        <button class="btn" id="noteSave">남기고 넘기기</button>
        <button class="btn ghost" id="noteSkip">그냥 넘기기</button>
      </div></div>`;
    const inp=box.querySelector("#noteIn");inp.focus();
    const done=note=>{
      it.status=v;it.resolvedAt=today();it.note=note.trim();
      draft.noting=null;save();renderToday();refreshAll();
      toast({fulfilled:"실현된 미래에 쌓았습니다",failed:"무산된 미래에 쌓았습니다",
             void:"무의미해진 미래에 쌓았습니다"}[v]);
    };
    box.querySelector("#noteSave").onclick=()=>done(inp.value);
    box.querySelector("#noteSkip").onclick=()=>done("");
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")done(inp.value)});
    return;
  }

  /* 다시 */
  box.innerHTML=`<div class="note-step" style="text-align:left">
    <div class="q" style="text-align:center">고쳐 말하고 다시 묻습니다</div>
    <textarea id="reText" rows="3" maxlength="300">${esc(draft.editText)}</textarea>
    <div class="terms" id="reTerms">
      ${Object.entries(TERMS).map(([k,v])=>
        `<button data-term="${k}" aria-pressed="false">${v.label}</button>`).join("")}
    </div>
    <div class="due-hint" id="reHint"></div>
    <div class="row">
      <button class="btn" id="reSave" disabled>다시 묻기</button>
      <button class="btn ghost" id="reCancel">되돌리기</button>
    </div></div>`;
  const ta=box.querySelector("#reText");
  const btn=box.querySelector("#reSave");
  const check=()=>btn.disabled=!(draft.editText.trim()&&draft.editTerm);
  ta.oninput=e=>{draft.editText=e.target.value;check()};
  box.querySelector("#reTerms").onclick=e=>{
    const b=e.target.closest("[data-term]");if(!b)return;
    draft.editTerm=b.dataset.term;
    box.querySelectorAll("#reTerms button").forEach(x=>
      x.setAttribute("aria-pressed",x.dataset.term===draft.editTerm));
    box.querySelector("#reHint").textContent=fmt(due(today(),draft.editTerm))+"에 옵니다";
    check();
  };
  box.querySelector("#reCancel").onclick=()=>{draft.editing=null;renderBody(id)};
  btn.onclick=()=>{
    it.lineage=it.lineage||[];
    it.lineage.push({text:it.text,term:it.term,createdAt:it.createdAt,dueAt:it.dueAt});
    it.text=draft.editText.trim();it.term=draft.editTerm;
    it.createdAt=today();it.dueAt=due(today(),draft.editTerm);
    it.gen=(it.gen||1)+1;
    draft.editing=null;save();
    draft.buriedOn=fmt(it.dueAt);draft.justBuried=true;
    renderToday();refreshAll();
  };
  ta.focus();
}

/* ───────── 목록 ───────── */
const TITLE={fulfilled:["실 현 된 미 래","아직 실현된 미래가 없습니다.<br>기다리는 중이거나, 아직 묻지 않았습니다."],
             failed:["무 산 된 미 래","무산된 미래가 없습니다."],
             void:["무 의 미 해 진 미 래","무의미해진 미래가 없습니다."]};
function renderList(st){
  const el=document.getElementById("s-"+st),list=byStatus(st);
  let h=`<h2 class="head">${TITLE[st][0]}</h2>`;
  if(!list.length){el.innerHTML=h+`<div class="empty">${TITLE[st][1]}</div>`;return}
  h+=`<div class="count">${list.length}개</div>`;
  list.forEach(it=>{
    const days=gap((it.lineage&&it.lineage.length?it.lineage[0].createdAt:it.createdAt),it.resolvedAt);
    h+=`<div class="entry">
      <div class="t">${esc(it.text)}</div>
      <div class="d">${esc(fmt(it.createdAt))} 묻음 → ${esc(fmt(it.resolvedAt))} 판정 · ${days}일
        ${it.gen>1?` · ${it.gen}대`:``}</div>
      ${it.note?`<div class="n">${esc(it.note)}</div>`:``}
      ${it.lineage&&it.lineage.length?it.lineage.map((g,n)=>
        `<div class="past">${n+1}대 · ${esc(g.text)}</div>`).join(""):``}
    </div>`;
  });
  el.innerHTML=h;
}

/* ───────── 결 ───────── */
function renderStats(){
  const el=document.getElementById("s-stats");
  const all=db.items,f=byStatus("fulfilled"),x=byStatus("failed"),v=byStatus("void"),s=sealed().length+arrived().length;
  if(!all.length){el.innerHTML=`<h2 class="head">결</h2>
    <div class="empty">아직 묻은 기별이 없습니다.<br>하나가 도래하고 판정되면 여기에 결이 생깁니다.</div>`;return}
  const judged=f.length+x.length;
  const rate=judged?Math.round(f.length/judged*100):0;
  let h=`<h2 class="head">결</h2>
  <div class="stat-grid">
    <div class="stat"><div class="v">${all.length}</div><div class="k">묻 은 기 별</div></div>
    <div class="stat"><div class="v">${s}</div><div class="k">봉 인 중</div></div>
    <div class="stat"><div class="v">${f.length}</div><div class="k">실 현</div></div>
    <div class="stat"><div class="v">${judged?rate+"%":"—"}</div><div class="k">실 현 율</div></div>
  </div>`;

  h+=`<div class="count">기 간 별 실 현 율</div>`;
  Object.entries(TERMS).forEach(([k,t])=>{
    const done=all.filter(i=>(i.term===k||(i.lineage||[]).some(g=>g.term===k))&&(i.status==="fulfilled"||i.status==="failed"));
    const ok=done.filter(i=>i.status==="fulfilled").length;
    const p=done.length?Math.round(ok/done.length*100):0;
    h+=`<div class="bar-row"><div class="lb">${t.short}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${done.length?p:0}%"></div></div>
      <div class="vl">${done.length?p+"% ("+ok+"/"+done.length+")":"—"}</div></div>`;
  });

  const again=all.reduce((a,i)=>a+((i.lineage||[]).length),0);
  const againDone=all.filter(i=>(i.lineage||[]).length&&i.status==="fulfilled").length;
  const againJudged=all.filter(i=>(i.lineage||[]).length&&(i.status==="fulfilled"||i.status==="failed")).length;
  const avg=f.length?Math.round(f.reduce((a,i)=>
    a+gap((i.lineage&&i.lineage.length?i.lineage[0].createdAt:i.createdAt),i.resolvedAt),0)/f.length):0;

  h+=`<div class="note-line">
    ‘다시’를 누른 횟수 ${again}번.
    ${againJudged?` 고쳐 말한 뒤 판정된 ${againJudged}개 중 ${againDone}개가 실현되었습니다.`:``}<br>
    ${f.length?`처음 묻은 날부터 실현까지 평균 ${avg}일 걸렸습니다.`:``}
    ${v.length?`<br>${v.length}개는 무의미해졌습니다. 그건 실패가 아니라 방향이 바뀐 자리입니다.`:``}
  </div>`;
  el.innerHTML=h;
}

/* ───────── 갈무리 ───────── */
function renderData(){
  const w=document.getElementById("backupWarn");
  const n=db.items.length-(db.exportedCount||0);
  const old=db.lastExport?gap(db.lastExport,today()):null;
  w.innerHTML=(n>=8||(old!==null&&old>=60)||(!db.lastExport&&db.items.length>=8))
    ? `<div class="warn">마지막 내보내기 이후 기록이 ${n>0?n+"개 ":""}늘었습니다. 한 번 내보내 두세요.</div>` : "";
}
document.getElementById("btnExport").onclick=()=>{
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=`기별_${today()}.json`;a.click();
  URL.revokeObjectURL(a.href);
  db.lastExport=today();db.exportedCount=db.items.length;save();renderData();
  toast("내보냈습니다");
};
document.getElementById("btnImport").onclick=()=>document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(r.result);
      if(!p||!Array.isArray(p.items))throw 0;
      const have=new Set(db.items.map(i=>i.id));
      let add=0;
      p.items.forEach(i=>{if(i&&i.id&&!have.has(i.id)){db.items.push(i);add++}});
      save();refreshAll();renderToday();
      toast(add?`${add}개를 되살렸습니다`:"새로 더할 것이 없었습니다");
    }catch(err){toast("읽을 수 없는 파일입니다")}
    e.target.value="";
  };
  r.readAsText(f);
};
document.getElementById("btnPeek").onclick=()=>{
  const box=document.getElementById("peekBox");
  if(box.innerHTML){box.innerHTML="";return}
  if(!confirm("봉인을 엽니다. 미리 보면 잊기 어려워집니다. 계속할까요?"))return;
  const list=sealed();
  box.innerHTML=list.length
    ? list.map(i=>`<div class="entry"><div class="t">${esc(i.text)}</div>
        <div class="d">${esc(fmt(i.dueAt))}에 도래 · ${gap(today(),i.dueAt)}일 남음</div></div>`).join("")
    : `<div class="empty">봉인된 기별이 없습니다.</div>`;
};
document.getElementById("btnWipe").onclick=()=>{
  if(!confirm("모든 기록을 지웁니다. 되돌릴 수 없습니다. 계속할까요?"))return;
  if(!confirm("정말 지울까요?"))return;
  db=structuredClone(DEF);save();refreshAll();renderToday();toast("모두 지웠습니다");
};

/* ───────── 길 ───────── */
document.querySelector("nav").onclick=e=>{
  const b=e.target.closest("[data-go]");if(!b)return;
  document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-current",x===b));
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("on"));
  document.getElementById("s-"+b.dataset.go).classList.add("on");
  window.scrollTo({top:0,behavior:"smooth"});
};

function refreshAll(){renderList("fulfilled");renderList("failed");renderList("void");renderStats();renderData()}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2400)}

/* ───────── 시작 ───────── */
(function init(){
  const d=new Date();
  document.getElementById("todayDate").textContent=
    `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
  document.getElementById("todaySub").textContent=`${DAYS[d.getDay()]}요일`;
  renderToday();refreshAll();
  const n=arrived().length;
  if(n)document.title=`기별 (${n})`;
})();

/* 날짜가 바뀌면 다시 그린다 */
let mark=today();
setInterval(()=>{if(today()!==mark){mark=today();location.reload()}},60000);
</script>
