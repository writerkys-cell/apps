<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정리</title>
<style>
:root{
  --bg:#f6f5f0; --panel:#ffffff; --panel2:#f1efe8; --ink:#1f1f1d; --ink2:#5f5e5a; --muted:#8a8984;
  --line:#e2e0d8; --line2:#c9c7bf;
  --accent:#534ab7; --accent-bg:#eeedfe;
  --ok:#0f6e56; --ok-bg:#e1f5ee; --warn:#854f0b; --warn-bg:#faeeda; --bad:#a32d2d; --bad-bg:#fcebeb;
  --radius:8px;
  --font:-apple-system,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
button:hover{background:var(--panel2)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.primary:hover{background:#3a3a37}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--panel2)}
button.danger{color:var(--bad)}
button.sm{padding:2px 9px;font-size:12px}
input,textarea,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:6px 10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
textarea{resize:none;line-height:1.7}
a{color:var(--accent);text-decoration:none}
.muted{color:var(--muted)} .small{font-size:12px}
details.menu{position:relative}
details.menu>summary{list-style:none;cursor:pointer;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:6px 12px;user-select:none}
details.menu>summary::-webkit-details-marker{display:none}
details.menu>summary:hover{background:var(--panel2)}
details.menu>div{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:8px;width:300px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.08)}
details.menu>div button{display:block;width:100%;text-align:left;margin-top:4px}
details.menu>div .sep{border-top:1px solid var(--line);margin:8px 0}
details.menu>div label{display:block;font-size:12px;color:var(--ink2);margin-top:6px}
details.menu>div input{width:100%;margin-top:3px;font-size:13px;padding:4px 8px}
.syncstat{font-size:12px;color:var(--muted);margin-top:6px}
.syncstat.err{color:var(--bad)}
.app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em;flex:none;white-space:nowrap}
.top .tagline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
details.menu>summary{white-space:nowrap}
.top .sp{flex:1}
.top input.find{width:220px}
.body{display:grid;grid-template-columns:220px minmax(0,1fr);flex:1;min-height:0}
.side{overflow:auto;border-right:1px solid var(--line);padding:12px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--line);margin-bottom:6px;background:var(--panel);font-size:13px}
.srow:hover{border-color:var(--line2)}
.srow.sel{background:var(--panel2);border-color:var(--line2)}
.srow .c{font-size:11px;color:var(--muted)}
.srow .c.w{color:var(--warn)}
.tags{margin:0 0 10px 8px;display:flex;flex-direction:column;gap:2px}
.tags .tg{display:flex;justify-content:space-between;gap:8px;padding:5px 9px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink2)}
.tags .tg:hover{background:var(--panel)}
.tags .tg.sel{background:var(--ink);color:#fff}
.tags .tg .c{font-size:11px;opacity:.7}
.detail{overflow:auto;padding:18px 24px 80px}
.ghead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.ghead .ttl{font-size:18px;font-weight:500}
.gsw{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.gsw button{padding:3px 9px;font-size:12px}
.gsw button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:var(--radius);padding:8px 12px;font-size:13px;margin:0 0 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.newbar{display:flex;gap:8px;align-items:flex-start;margin:0 0 14px}
.newbar textarea{flex:1;min-height:38px;font-size:15px}
.idea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.idea .ih{display:flex;gap:8px;align-items:flex-start}
.idea .ih input[type=checkbox]{margin-top:7px;flex:none}
.idea textarea{flex:1;border:none;background:transparent;font-size:15px;padding:0;min-height:26px}
.idea textarea:focus{outline:none}
.idea .ir{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.idea .ir .lb{font-size:12px;color:var(--muted)}
.idea .ir input.tt{flex:1;min-width:180px;font-size:13px;padding:4px 8px}
.idea .ir select{font-size:13px;padding:4px 8px;max-width:200px}
.idea .im{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center;margin-top:6px}
.idea .im .sp{flex:1}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:36px;text-align:center;color:var(--ink2)}
.crow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:var(--radius);cursor:pointer;border:1px solid transparent}
.crow:hover{background:var(--panel)}
.crow.open{background:var(--panel);border-color:var(--line2);border-bottom-left-radius:0;border-bottom-right-radius:0}
.crow .glyph{flex:none;width:14px;text-align:center;color:var(--muted);margin-top:1px}
.crow.w .glyph{color:var(--accent)} .crow.f .glyph{color:var(--ok)}
.crow .ct{flex:1;min-width:0}
.crow .ct b{font-weight:500}
.crow .ct .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .cm{flex:none;font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;text-align:right}
.kd{display:inline-block;font-size:11px;padding:0 6px;border-radius:5px;background:var(--panel2);color:var(--ink2);line-height:1.7;margin-left:6px;font-weight:400}
.kd.box{background:var(--accent-bg);color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line2);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:10px 12px;margin-bottom:8px}
.panel input.tt{width:100%;font-weight:500;font-size:15px}
.panel textarea{width:100%;min-height:64px;font-size:15px;margin-top:8px}
.panel textarea.body{min-height:46vh;font-size:16px;line-height:1.85;padding:12px 14px}
.panel .start{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:8px 12px;background:var(--panel2);border-radius:var(--radius);font-size:13px}
.panel .start b{font-weight:500}
.panel .start a.go{background:var(--ink);color:#fff;padding:5px 12px;border-radius:var(--radius);white-space:nowrap}
.panel .grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:start;margin-top:10px;font-size:12px;color:var(--muted)}
.panel .grid>span{padding-top:5px}
.panel .grid input,.panel .grid select{padding:4px 8px;font-size:13px}
.panel .with{display:flex;gap:6px;align-items:center;min-width:0}
.panel .with input{flex:1;min-width:0}
.panel .with input.sn{flex:0 0 150px}
.panel .with button{padding:4px 9px;font-size:12px;white-space:nowrap}
.panel .srcs{display:flex;flex-direction:column;gap:5px;min-width:0}
.panel .tpinfo{font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:5px}
.panel .tptext{white-space:pre-wrap;font-size:14px;line-height:1.8;background:var(--panel2);border-radius:var(--radius);padding:12px 14px;max-height:40vh;overflow:auto;margin-top:6px;word-break:keep-all;color:var(--ink)}
.panel .tools{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.panel .tools button{padding:3px 9px;font-size:12px}
.panel .tools.help{padding-top:8px;border-top:1px dashed var(--line)}
.lead{background:var(--accent-bg);border-radius:var(--radius);padding:8px 10px;margin-top:8px;font-size:13px}
.lead .lh{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--accent)}
.lead .lb{white-space:pre-wrap;word-break:break-word;margin-top:4px;line-height:1.6}
.lead button{padding:0 6px;font-size:11px;border-color:transparent;background:transparent}
.lead .lh>span:last-child{display:flex;gap:6px;align-items:center;flex:none}
.lead button.sv{border-color:var(--accent);color:var(--accent);padding:1px 8px;background:var(--panel)}
.why{font-size:12px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border-radius:12px;width:min(720px,100%);max-height:90vh;display:flex;flex-direction:column;padding:18px 20px}
.modal h2{font-size:16px;font-weight:500;margin:0 0 6px}
.modal textarea{width:100%;min-height:200px;font-size:13px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200;max-width:80vw}
#toast.show{opacity:1}
@media (max-width:760px){.top .tagline{display:none}.top input.find{width:150px}.body{grid-template-columns:1fr}.side{border-right:none;border-bottom:1px solid var(--line);max-height:36vh}}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept="application/json" hidden>
<div id="toast"></div>
<script>
'use strict';
/* 정리 — 수첩에 적은 생각을 맥에서 카드로 정리하고, 카드에서 타이핑으로 글을 키우는 앱 (파일 jeongri.html, 2026-11-19).
   storyM을 본으로 삼아 단순하게 만들었다. 클로드에게 보내 쪼개고 분류하는 단계가 없다 — 아이디어 하나가 그대로 카드 한 장이다.
   아이디어 탭: 수첩(아이폰)·이 앱의 입력칸·타이핑의 "아이디어 보내기"로 들어온 것. 제목을 달고 태그를 정한 뒤 "카드로"를 눌러야 카드가 된다.
   카드: 제목 + 글 + 태그 하나(글상자, 또는 타이핑의 작품 하나). 데본씽크 자료, 타이핑 원고, 관련서·조사 프롬프트.
   타이핑의 저장소(taiping-v1)는 읽기만 한다. storyM·문득은 건드리지 않는다(storyM으로 넘길 때 그 받은편지함에 적을 뿐) */
const STORE_KEY='jeongri.v1';
const CONF_KEY='jeongri.conf';
const IN_KEY='jeongri.in';          /* 타이핑의 "아이디어 보내기"가 적어 두는 받은편지함 */
const TP_KEY='taiping-v1';          /* 타이핑의 저장소 — 읽기만 한다 */
const SM_KEY='storyM.v1', SM_IN='storyM.ideas.in';
const BOX='글상자';
const app=document.getElementById('app');
const lsGet=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}};

/* db.ideas: 수첩 표(sucheop)의 줄과 같은 모양 {id,text,origin,state,meta,created_at,updated_at,deleted} + 올리지 못한 표시 _d.
     meta.title·meta.tag는 "카드로" 누르기 전에 적어 둔 제목과 태그, meta.ms·meta.msTitle은 적은 타이핑 원고, meta.to는 처리된 길(card·storyM·merged)
   db.cards: {id,title,text,tag:null(글상자)|{id,name},srcs:[{u,n}],dt,dtq,tp(타이핑 원고 id),leads,ms,dropped(보관),sentAt(타이핑으로 넘긴 때),kept(되살린 카드),dropAt,at,editedAt,from} */
let db=(()=>{try{const d=JSON.parse(localStorage.getItem(STORE_KEY));if(d&&typeof d==='object')return Object.assign({ideas:[],cards:[],order:'tp',updatedAt:0,cardsDirty:false},d);}catch(e){}return{ideas:[],cards:[],order:'tp',updatedAt:0,cardsDirty:false};})();
if(!Array.isArray(db.ideas))db.ideas=[];if(!Array.isArray(db.cards))db.cards=[];
let conf=(()=>{try{return Object.assign({tpBase:'https://writerkys-cell.github.io/apps/taiping.html'},JSON.parse(localStorage.getItem(CONF_KEY))||{});}catch(e){return{tpBase:'https://writerkys-cell.github.io/apps/taiping.html'};}})();
const ui={pane:'idea',tag:null,open:null,find:'',sel:{},tpShow:null,draft:'',helpMode:null,focusNew:false};
let saveT=null;
function persist(now){clearTimeout(saveT);const f=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(db));}catch(e){}};if(now)f();else saveT=setTimeout(f,250);}
/* 카드를 고쳤다 — 저장하고, 수파베이스에 올릴 것으로 표시한다 */
function saveCards(now){db.updatedAt=Date.now();db.cardsDirty=true;persist(now);cardFlushSoon();}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chars=t=>(t||'').replace(/\n/g,'').length;
const oneLine=t=>String(t||'').replace(/\s*\n\s*/g,' ').trim();
const fmtN=n=>Number(n).toLocaleString('ko-KR');
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800);}
function download(name,text,type='text/plain'){const b=new Blob([text],{type:type+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true;}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();return ok;}}
function autogrow(ta){ta.style.height='auto';ta.style.height=(ta.scrollHeight+2)+'px';}
const whenTxt=ts=>{const d=new Date(ts);return `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
const dayTxt=ts=>{const d=new Date(ts);return `${d.getMonth()+1}월 ${d.getDate()}일`;};
const norm=s=>String(s||'').replace(/\s+/g,' ').trim();
function linkPart(link,key){const m=String(link||'').match(new RegExp('[#&]'+key+'=([^&]+)'));if(!m)return '';try{return decodeURIComponent(m[1]);}catch(e){return m[1];}}

/* ---------- 타이핑 읽기 — 같은 주소의 저장소 taiping-v1을 읽기만 한다(작품 목록, 원고의 글자 수·상태). 절대 쓰지 않는다 ---------- */
let TP={works:[],mss:[],ok:false};
function readTp(){try{const d=JSON.parse(localStorage.getItem(TP_KEY));if(d&&Array.isArray(d.works)){TP={works:d.works.filter(Boolean),mss:(Array.isArray(d.mss)?d.mss:[]).filter(Boolean),ok:true};return;}}catch(e){}TP={works:[],mss:[],ok:false};}
const tpWorkById=id=>TP.works.find(w=>w.id===id)||null;
const tpBox=()=>TP.works.find(w=>w.box)||null;
const workActive=w=>{const rs=w.revs||[],r=rs[rs.length-1];return !w.finishedAt||(r&&!r.doneAt);};
/* 태그로 고를 수 있는 작품 — 손댈 수 있는 작품에서 글상자를 뺀 것 */
const tagWorks=()=>TP.works.filter(w=>!w.box&&workActive(w)&&norm(w.title));
const msChars=m=>m.folded?(m.folded.chars||0):m.cleared?(m.cleared.chars||0):chars(m.text);
const msWhen=m=>m.editedAt||m.createdAt||0;
const msState=m=>m.finishedAt?'원고 완성':m.folded?'접어 둔 원고':'쓰는 중';
/* 태그 — null이면 글상자. 같은 태그인지는 작품 id로 본다 */
const tagKey=t=>t&&t.id?t.id:'';
const tagName=t=>t&&t.id?(t.name||'이름 없는 작품'):BOX;
const tagOfWork=w=>(!w||w.box)?null:{id:w.id,name:w.title||''};
function workOfTag(t){if(!t||!t.id)return tpBox();return tpWorkById(t.id)||TP.works.find(w=>!w.box&&norm(w.title)===norm(t.name))||null;}
/* 카드에서 만든 타이핑 원고 — 기억해 둔 원고 번호, 없으면 타이핑이 원고에 적어 둔 카드 표(jrCard)로 찾는다.
   이름으로는 찾지 않는다(같은 이름의 다른 원고를 이 카드의 것으로 잘못 알면 카드가 보관으로 넘어가 버린다).
   2026년 11월 19일 낮의 판으로 만든 원고는 카드 링크(storyLink)로 이어져 있어 그것도 본다 */
function msFor(c){
  if(!TP.ok||!c)return null;
  if(c.tp){const m=TP.mss.find(x=>x.id===c.tp);if(m)return m;}
  return TP.mss.find(x=>x.jrCard===c.id)||TP.mss.find(x=>x.storyLink&&/jeongri/.test(x.storyLink)&&linkPart(x.storyLink,'카드')===c.id)||null;
}
/* 타이핑의 그 작품(글상자)에 같은 이름의 원고가 이미 있는가 — 있으면 타이핑이 새로 만들지 않고 그 원고를 열어 버리므로, 넘기기 전에 제목을 바꾸게 한다 */
function nameClash(c){if(!TP.ok)return null;const w=workOfTag(c.tag),t=norm(c.title);if(!w||!t)return null;return TP.mss.find(x=>x.workId===w.id&&!x.folded&&norm(x.title)===t&&x.jrCard!==c.id)||null;}
/* 타이핑을 읽은 뒤 카드를 맞춘다 — 타이핑에 원고가 생긴 카드는 원고 번호를 기억하고 저절로 보관으로 넘긴다(2026년 11월 19일 저녁, 작가가 정함).
   되살린 카드(kept)는 다시 넘기지 않는다. 작품 이름이 바뀌었으면 태그의 이름을 고친다 */
function linkPass(){
  if(!TP.ok)return false;let ch=false;const moved=[];
  db.cards.forEach(c=>{
    const m=msFor(c);
    if(m){if(c.tp!==m.id){c.tp=m.id;ch=true;}
      if(!c.dropped&&!c.kept){c.dropped=true;c.sentAt=Date.now();c.dropAt=c.sentAt;c.why='';ch=true;moved.push(c);if(ui.open===c.id)ui.open=null;}}
    if(c.tag&&c.tag.id){const w=tpWorkById(c.tag.id);if(w&&w.title!==c.tag.name){c.tag={id:w.id,name:w.title};ch=true;}}
  });
  db.ideas.forEach(i=>{const t=(i.meta||{}).tag;if(t&&t.id){const w=tpWorkById(t.id);if(w&&w.title!==t.name){i.meta=Object.assign({},i.meta,{tag:{id:w.id,name:w.title}});}}});
  if(ch)saveCards();
  if(moved.length)toast(moved.length===1?`"${norm(moved[0].title)||'제목 없음'}"이(가) 타이핑의 원고가 되어 보관으로 옮겼습니다.`:`카드 ${moved.length}장이 타이핑의 원고가 되어 보관으로 옮겼습니다.`);
  return ch;
}
function tpRefresh(){readTp();linkPass();}
const tpUrl=m=>conf.tpBase.split('#')[0]+'#원고='+encodeURIComponent(m.id);
/* 원고가 아직 없는 카드 — 타이핑에 이 카드 제목의 원고를 만들러 간다. 타이핑의 tpHashNew가 읽는다.
   글상자: #글상자=1&새원고=<제목>&정리카드=<카드 id>   ·   작품: #작품=<작품 이름>&작품id=<작품 id>&새원고=<제목>&정리카드=<카드 id> */
function tpNewUrl(c){const t=norm(c.title);if(!t)return '';
  const q=c.tag&&c.tag.id?[['작품',c.tag.name],['작품id',c.tag.id]]:[['글상자','1']];q.push(['새원고',t],['정리카드',c.id]);
  return conf.tpBase.split('#')[0]+'#'+q.map(x=>x[0]+'='+encodeURIComponent(x[1])).join('&');}
const cardAddr=c=>location.href.split('#')[0]+'#카드='+encodeURIComponent(c.id);

/* ---------- 아이디어 ---------- */
/* 새것이 위로. 나눈 조각들은 적은 때가 같으므로 조각 차례(meta.seq)대로 */
const seqOf=i=>(i.meta||{}).seq||0;
const liveIdeas=()=>db.ideas.filter(i=>!i.deleted&&i.state==='new').sort((a,b)=>(b.created_at-a.created_at)||(seqOf(a)-seqOf(b)));
const ideaById=id=>db.ideas.find(i=>i.id===id);
function newIdea(text,o){const i=Object.assign({id:uid(),text:String(text||'').trim(),origin:'mac',state:'new',meta:{},created_at:Date.now(),updated_at:Date.now(),deleted:false},o||{});i._d=1;db.ideas.push(i);return i;}
function touchIdea(i,now){i.updated_at=Date.now();i._d=1;persist(now);ideaFlushSoon();}
/* 제목의 처음 값 — 첫 문장의 앞부분(스무 자쯤). 끝의 문장부호는 뗀다 */
function defTitle(text){let s=norm(String(text||'').split('\n').find(x=>x.trim())||'');const m=s.match(/^(.+?)[.!?。…](\s|$)/);if(m)s=m[1];
  if(s.length>22){const cut=s.slice(0,22);const sp=cut.lastIndexOf(' ');s=sp>=10?cut.slice(0,sp):cut;}
  return s.replace(/[\s.,·:;!?'"“”‘’…\-–—~]+$/,'').trim();}
const ideaTitle=i=>norm((i.meta||{}).title)||defTitle(i.text);
const ideaTag=i=>{const t=(i.meta||{}).tag;return t&&t.id?t:null;};
/* 타이핑이 적어 둔 것을 가져온다 */
function drainInbox(){let arr=[];try{arr=JSON.parse(localStorage.getItem(IN_KEY))||[];}catch(e){}if(!Array.isArray(arr)||!arr.length)return 0;
  let n=0;arr.forEach(x=>{if(!x||!String(x.text||'').trim())return;if(x.id&&ideaById(x.id))return;newIdea(x.text,{id:x.id||uid(),origin:'taiping',created_at:x.created_at||Date.now(),meta:{ms:x.ms_link||'',msTitle:x.ms_title||''}});n++;});
  try{localStorage.removeItem(IN_KEY);}catch(e){}
  if(n){persist(true);ideaFlushSoon();if(!typing())render();}return n;}
const typing=()=>{const a=document.activeElement;return !!(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'||a.tagName==='SELECT')&&a.closest('#detail'))||!!document.querySelector('.modal-bg');};

/* ---------- 카드 ---------- */
const cardById=id=>db.cards.find(c=>c.id===id);
const liveCards=()=>db.cards.filter(c=>!c.dropped);
const dropCards=()=>db.cards.filter(c=>c.dropped);
const newCard=o=>Object.assign({id:uid(),title:'',text:'',tag:null,srcs:[],dt:'',tp:'',leads:[],ms:'',dropped:false,why:'',at:Date.now(),editedAt:Date.now()},o||{});
/* 같은 태그에 같은 제목의 카드 — 타이핑 원고와 이름으로 잇기 때문에 겹치면 한 원고에 둘이 이어진다 */
function dupCard(title,tag,exceptId){const t=norm(title);if(!t)return null;return liveCards().find(c=>c.id!==exceptId&&tagKey(c.tag)===tagKey(tag)&&norm(c.title)===t)||null;}
const isWeb=u=>/^https?:/i.test(String(u||'').trim());
const tgt=u=>isWeb(u)?' target="_blank" rel="noopener"':'';
const openTip=u=>isWeb(u)?'새 탭에서 열기':'데본씽크에서 열기';
const srcSync=c=>{c.srcs=c.srcs||[];c.dt=((c.srcs.find(x=>(x.u||'').trim())||{u:''}).u||'').trim();};
const srcN=c=>(c.srcs||[]).filter(x=>(x.u||'').trim()).length;
function addSrc(c,u,n){u=String(u||'').trim();if(!u)return;c.srcs=c.srcs||[];if(!c.srcs.some(x=>(x.u||'').trim()===u))c.srcs.push({u,n:n||''});srcSync(c);}
function dtFind(c){const q=prompt('데본씽크에서 찾을 말',c.dtq||norm(c.title));if(q===null)return;const t=q.trim();if(!t)return;if(c.dtq!==t){c.dtq=t;saveCards();}
  const a=document.createElement('a');a.href='x-devonthink://search?query='+encodeURIComponent(t);document.body.appendChild(a);a.click();a.remove();}
/* 본문이 이만큼 차야 타이핑으로 넘길 수 있다. 글자 수는 타이핑과 같게 센다(공백은 세고 줄바꿈은 세지 않는다) */
const GOAL=400;
const bodyLen=c=>chars(c.text);
const editedAt=c=>c.editedAt||c.at||0;
/* 목록의 순서 — 마지막으로 고친 날(edit) · 본문 글자 수(chars) · 만든 날(made) */
function sortCards(cs){const o=db.order;const xs=cs.map(c=>({c,n:bodyLen(c)}));
  if(o==='made')xs.sort((a,b)=>(b.c.at||0)-(a.c.at||0));
  else if(o==='chars')xs.sort((a,b)=>b.n-a.n||editedAt(b.c)-editedAt(a.c));
  else xs.sort((a,b)=>editedAt(b.c)-editedAt(a.c));
  return xs;}
/* 사이드바의 태그 — 글상자가 맨 위, 그다음 카드가 있는 작품(타이핑의 작품 순서대로) */
function tagList(){const cs=liveCards();const out=[{key:'',name:BOX,n:cs.filter(c=>!tagKey(c.tag)).length}];const seen={};
  TP.works.forEach(w=>{if(w.box)return;const n=cs.filter(c=>tagKey(c.tag)===w.id).length;if(n){out.push({key:w.id,name:w.title,n});seen[w.id]=1;}});
  cs.forEach(c=>{const k=tagKey(c.tag);if(k&&!seen[k]){seen[k]=1;out.push({key:k,name:tagName(c.tag),n:cs.filter(x=>tagKey(x.tag)===k).length});}});
  return out;}
function tagOptions(cur){const k=tagKey(cur);const ws=tagWorks();let h=`<option value="" ${k?'':'selected'}>${BOX}</option>`+ws.map(w=>`<option value="${esc(w.id)}" ${k===w.id?'selected':''}>${esc(w.title)}</option>`).join('');
  if(k&&!ws.some(w=>w.id===k))h+=`<option value="${esc(k)}" selected>${esc(tagName(cur))}</option>`;return h;}
const tagFromValue=v=>{if(!v)return null;const w=tpWorkById(v);return w?{id:w.id,name:w.title}:null;};
const storyList=()=>{try{const d=JSON.parse(localStorage.getItem(SM_KEY));return d&&Array.isArray(d.stories)?d.stories.filter(s=>s&&s.id).map(s=>({id:s.id,title:s.title||'제목 없음'})):[];}catch(e){return [];}};

        <div id="syncBox">${syncPanelHtml()}</div>

  return `<div class="idea"><div class="ih"><input type="checkbox" data-isel="${i.id}" ${ui.sel[i.id]?'checked':''} title="여러 개를 골라 합칩니다"><textarea data-if="text" data-id="${i.id}" rows="1">${esc(i.text)}</textarea></div>

      <button class="sm" data-act="split" data-id="${i.id}" title="생각이 둘이면 둘로 나눕니다. 나눌 자리에 커서를 놓고 누르세요. 커서가 없으면 첫 빈 줄에서 나눕니다">나누기</button>
      <button class="sm" data-act="toStory" data-id="${i.id}" title="storyM에서 다루는 소설의 아이디어라면 그 소설의 storyM 아이디어로 보냅니다">storyM으로</button>
      <button class="sm danger" data-act="iDel" data-id="${i.id}">지우기</button></div></div>`;}

    ${is.map(ideaHtml).join('')||'<div class="empty">처리할 아이디어가 없습니다.</div>'}`;}
/* 카드 — 본문을 고쳐 쓰고 자료를 붙이는 자리(2026년 11월 19일 저녁에 바꿈).
   본문이 400자를 넘으면 "타이핑에서 쓰기 시작"이 열리고, 타이핑에 원고가 생기면 카드는 저절로 보관으로 넘어간다.
   타이핑으로 넘어가는 것은 본문과 자료 칸의 주소들이다(카드로 돌아오는 링크는 넘기지 않는다) */
const cntTxt=n=>n>=GOAL?`${fmtN(n)}자`:`${fmtN(n)} / ${GOAL}자`;
const rowMeta=(c,n)=>`${cntTxt(n)}${srcN(c)?` · 자료 ${srcN(c)}`:''}`;
function cardRowHtml(x,showTag){const c=x.c,n=x.n;const open=ui.open===c.id;const sub=oneLine(c.text);const ok=n>=GOAL;
  return `<div class="cwrap"><div class="crow ${ok?'f':''} ${open?'open':''}" data-act="cOpen" data-id="${c.id}">
      <span class="glyph" title="${ok?'400자를 채웠습니다. 타이핑에서 쓰기 시작할 수 있습니다':'아직 400자가 되지 않았습니다'}">${ok?'■':'□'}</span>
      <span class="ct"><b>${esc(norm(c.title))||'<span class="muted">제목 없음</span>'}</b>${showTag?`<span class="kd ${tagKey(c.tag)?'':'box'}">${esc(tagName(c.tag))}</span>`:''}${sub&&!open?`<div class="sub">${esc(sub)}</div>`:''}</span>
      <span class="cm" id="cm-${c.id}">${rowMeta(c,n)}</span></div>${open?cardPanelHtml(c):''}</div>`;}
function srcRowsHtml(c){const rows=(c.srcs&&c.srcs.length)?c.srcs:[{u:'',n:''}];
  return rows.map((x,i)=>`<div class="with"><input data-sf="u" data-id="${c.id}" data-i="${i}" value="${esc(x.u)}" placeholder="데본씽크 항목(PDF는 쪽 링크)의 x-devonthink-item:// 주소나 웹 주소"><input class="sn" data-sf="n" data-id="${c.id}" data-i="${i}" value="${esc(x.n)}" placeholder="쪽수, 무엇">${(x.u||'').trim()?`<a href="${esc(x.u.trim())}"${tgt(x.u)} title="${openTip(x.u)}"><button type="button" tabindex="-1">열기 ↗</button></a>`:''}${rows.length>1||(x.u||x.n)?`<button type="button" class="ghost" data-act="srcDel" data-id="${c.id}" data-i="${i}" title="이 자료 링크를 뺍니다">✕</button>`:''}</div>`).join('');}
/* 타이핑으로 넘기는 줄 — 400자가 차기 전에는 얼마나 남았는지, 찬 뒤에는 "타이핑에서 쓰기 시작" */
function startHtml(c){const n=bodyLen(c);const m=msFor(c);
  if(m)return `<span>타이핑에 이 카드의 원고가 있습니다 · ${fmtN(msChars(m))}자 · ${msState(m)}</span><a class="go" href="${esc(tpUrl(m))}" target="taiping" data-win="taiping" title="타이핑의 그 원고 400자 탭을 엽니다">타이핑에서 이어 쓰기 ↗</a>`;
  if(n<GOAL)return `<span><b>${fmtN(n)} / ${GOAL}자</b></span><span class="muted">${fmtN(GOAL-n)}자를 더 쓰면 타이핑에서 쓰기 시작할 수 있습니다.</span>`;
  if(!norm(c.title))return `<span><b>${fmtN(n)}자</b></span><span class="muted">제목을 적으면 타이핑에서 쓰기 시작할 수 있습니다.</span>`;
  const clash=nameClash(c);

  const cs=db.cards.filter(c=>hit(c.title+' '+c.text));const live=sortCards(cs.filter(c=>!c.dropped));const dr=cs.filter(c=>c.dropped).length;const is=liveIdeas().filter(i=>hit(i.text+' '+((i.meta||{}).title||'')));

function saveNew(){const ta=document.getElementById('newIdea');if(!ta)return;const t=ta.value.trim();if(!t){toast('적은 것이 없습니다.');ta.focus();return;}
  newIdea(t,{origin:'mac'});ui.draft='';persist(true);ideaFlushSoon();ui.focusNew=true;renderDetail();toast('아이디어를 적었습니다');}
function toCard(i){
  const title=ideaTitle(i),tag=ideaTag(i);
  if(!title){toast('제목을 적어 주세요.');return;}
  const dup=dupCard(title,tag);
  if(dup){toast(`${tagName(tag)}에 같은 제목의 카드가 이미 있습니다. 제목을 바꿔 주세요.`);const el=document.querySelector(`input[data-if="title"][data-id="${i.id}"]`);if(el){if(!el.value)el.value=title;el.focus();el.select();}return;}
  const c=newCard({title,text:i.text,tag,from:i.id,ms:(i.meta||{}).ms||''});db.cards.push(c);
  i.state='done';i.meta=Object.assign({},i.meta,{to:'card',card:c.id});delete ui.sel[i.id];touchIdea(i,true);
  saveCards(true);renderDetail();
  toast(`카드로 옮겼습니다 — ${tagName(tag)}. 카드에서 본문을 400자까지 채우면 타이핑으로 넘길 수 있습니다.`);
}
function splitIdea(i){const el=document.querySelector(`textarea[data-if="text"][data-id="${i.id}"]`);const text=el?el.value:i.text;let pos=el?el.selectionStart:0;
  const ok=p=>p>0&&p<text.length&&text.slice(0,p).trim()&&text.slice(p).trim();
  if(!ok(pos)){const m=text.match(/\n\s*\n/);pos=m?m.index:-1;}
  if(!ok(pos)){toast('나눌 자리에 커서를 놓고 눌러 주세요. 또는 나눌 곳에 빈 줄을 넣어 주세요.');return;}
  const a=text.slice(0,pos).trim(),b=text.slice(pos).trim();i.text=a;i.meta=Object.assign({},i.meta);delete i.meta.title;touchIdea(i);
  /* 뒤 조각은 적은 때를 같게 두고 조각 차례만 하나 뒤로 — 목록에서 바로 아래에 놓이고, 다시 합치면 본디 순서로 이어진다 */
  const sq=seqOf(i);db.ideas.forEach(x=>{if(x!==i&&x.created_at===i.created_at&&seqOf(x)>sq){x.meta=Object.assign({},x.meta,{seq:seqOf(x)+1});x._d=1;}});
  newIdea(b,{origin:i.origin,created_at:i.created_at,meta:Object.assign({seq:sq+1},(i.meta||{}).tag?{tag:i.meta.tag}:{},(i.meta||{}).ms?{ms:i.meta.ms,msTitle:i.meta.msTitle}:{})});
  persist(true);ideaFlushSoon();renderDetail();toast('둘로 나눴습니다.');}
function mergeIdeas(){const is=liveIdeas().filter(i=>ui.sel[i.id]).sort((a,b)=>(a.created_at-b.created_at)||(seqOf(a)-seqOf(b)));if(is.length<2)return;
  const keep=is[0];keep.text=is.map(i=>i.text.trim()).filter(Boolean).join('\n\n');touchIdea(keep);
  is.slice(1).forEach(i=>{i.state='done';i.deleted=true;i.meta=Object.assign({},i.meta,{to:'merged'});touchIdea(i);});
  ui.sel={};persist(true);renderDetail();toast(`${is.length}개를 하나로 합쳤습니다.`);}
function toStory(i){const ss=storyList();if(!ss.length){toast('이 브라우저에 storyM의 소설이 없습니다. storyM을 같은 곳에서 한 번 열어 주세요.');return;}

  else{const v=prompt('어느 소설의 아이디어로 보낼까요? 번호를 적으세요. 정리의 아이디어 탭에서는 사라집니다.\n\n'+ss.map((x,k)=>`${k+1}. ${x.title}`).join('\n'),'1');if(v===null)return;s=ss[parseInt(v,10)-1];if(!s){toast('그런 번호의 소설이 없습니다.');return;}}
  let arr=[];try{arr=JSON.parse(localStorage.getItem(SM_IN))||[];}catch(e){}if(!Array.isArray(arr))arr=[];
  arr.push({id:'jr'+uid(),story_id:s.id,text:i.text.trim(),ms_link:(i.meta||{}).ms||'',ms_title:(i.meta||{}).msTitle||'',created_at:i.created_at});

  toast(`storyM "${s.title}"의 아이디어로 보냈습니다. storyM을 열면 들어와 있습니다.`);}
app.addEventListener('click',e=>{

    case 'leadSave':{const c=cardById(id);const x=c&&(c.leads||[]).find(y=>y.id===b.dataset.lid);if(!x)break;dtSave(c,x);renderDetail();toast('데본씽크 인박스에 문서를 만들고, 그 문서를 찾는 링크를 자료 칸에 붙였습니다.');break;}
    case 'cDel':case 'dropDel':{const c=cardById(id);if(!c)break;if(!confirm('이 카드를 아주 지웁니다. 되돌릴 수 없습니다. 남겨 두려면 "보관"을 쓰세요. 타이핑의 원고는 지워지지 않습니다. 지울까요?'))break;db.cards=db.cards.filter(x=>x!==c);if(ui.open===id)ui.open=null;saveCards(true);renderDetail();break;}
    case 'helpCopy':{const c=cardById(id);if(!c)break;const m=b.dataset.m;if(!norm(c.title)&&!norm(c.text)){toast('카드의 글을 먼저 적으세요.');break;}ui.helpMode={id,m};copyText(helpPrompt(c,m)).then(ok=>toast(ok?`"${HELP[m]}" 프롬프트를 복사했습니다. 웹 검색이 켜진 클로드에 붙여 넣으세요. 답은 이 카드의 "답 가져오기"에 넣습니다.`:'복사하지 못했습니다.'));break;}

async function pullIdeas(force){
  if(!sess||blocked(force))return;let changed=false;
  /* 수파베이스는 한 번에 1,000줄까지만 준다. 나중에 고친 것부터 받고, 다 받았을 때만 "저쪽에 없는 줄"을 올릴 것으로 친다 */
  /* 처리가 끝난 지 한 달이 넘은 줄은 이 맥의 저장소에 두지 않는다(표에는 남는다) */
  const old=Date.now()-30*86400000;const stale=r=>(r.state!=='new'||r.deleted)&&(r.updated_at||0)<old;
  try{const rows=await rest(`/${T_IDEA}?select=*&order=updated_at.desc&limit=1000`);setTable('ok');const seen=new Set();
    for(const r of rows){seen.add(r.id);delete r.user_id;const loc=ideaById(r.id);
      if(!loc){if(stale(r))continue;db.ideas.push(r);changed=true;}
      else if(r.updated_at>(loc.updated_at||0)){for(const k of Object.keys(loc))delete loc[k];Object.assign(loc,r);changed=true;}
      else if(r.updated_at<(loc.updated_at||0))loc._d=1;}
    if(rows.length<1000)db.ideas.forEach(i=>{if(!seen.has(i.id))i._d=1;});
    const n0=db.ideas.length;db.ideas=db.ideas.filter(i=>i._d||!stale(i));if(db.ideas.length!==n0)changed=true;
    if(changed){persist(true);if(!typing())render();else renderSide();}
  }catch(e){failed(e);}
  if(db.ideas.some(i=>i._d))await flushIdeas();
}
async function pushCards(unloading){
  if(!sess||!db.cardsDirty||(sy.table==='none'&&(unloading||Date.now()-sy.lastCheck<60000)))return;
  const at=db.updatedAt||Date.now();
  try{const body=JSON.stringify([{id:'main',user_id:sess.user,data:{cards:db.cards,order:db.order},updated_at:at}]);const keepalive=!!unloading&&new Blob([body]).size<=KEEPALIVE_MAX;
    await rest(`/${T_CARD}?on_conflict=user_id,id`,{method:'POST',keepalive,headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body});
    if(db.updatedAt===at||!db.updatedAt){db.cardsDirty=false;persist();}setTable('ok');setMsg(`맞췄습니다 ${fmtTime(Date.now())}`);}
  catch(e){failed(e);}
}
async function pullCards(force){
  if(!sess||blocked(force))return;
  try{const rows=await rest(`/${T_CARD}?select=data,updated_at&id=eq.main`);setTable('ok');const r=rows&&rows[0];
    if(r&&r.data&&Array.isArray(r.data.cards)&&r.updated_at>(db.updatedAt||0)&&!db.cardsDirty){db.cards=r.data.cards;if(r.data.order)db.order=r.data.order;db.updatedAt=r.updated_at;persist(true);linkPass();if(!typing())render();}
    else if(db.cardsDirty||(!r&&db.cards.length)||(r&&r.updated_at<(db.updatedAt||0))){db.cardsDirty=true;if(!db.updatedAt)db.updatedAt=Date.now();await pushCards();}
    else setMsg(`맞췄습니다 ${fmtTime(Date.now())}`);
  }catch(e){failed(e);}
}
async function syncAll(force){if(!sess||sy.busy)return;if(!force&&Date.now()-sy.lastPull<10000)return;sy.busy=true;sy.lastPull=Date.now();try{await pullIdeas(force);await pullCards(force);}finally{sy.busy=false;}}
function syncPanelHtml(){
  if(sess)return `<div class="small"><b style="font-weight:500">맞추기</b> · ${esc(sess.email||'')}</div><button data-act2="syncNow">지금 맞추기</button><button data-act2="syncOut">로그아웃</button><div class="syncstat ${sy.err?'err':''}">${esc(sy.msg)}</div>`;
  return `<div class="small"><b style="font-weight:500">맞추기</b></div><input type="email" id="syncEmail" placeholder="이메일" autocomplete="username"><input type="password" id="syncPw" placeholder="비밀번호" autocomplete="current-password"><button data-act2="syncIn">로그인</button><div class="syncstat ${sy.err?'err':''}">${esc(sy.msg)||'storyM과 같은 계정으로 로그인합니다. storyM·문득·수첩과 로그인을 함께 씁니다(한쪽에서 로그아웃하면 이 맥의 다른 쪽도 로그아웃됩니다).'}</div>`;}
function paintSync(){const b=document.getElementById('syncBox');if(b)b.innerHTML=syncPanelHtml();}
app.addEventListener('click',async e=>{const b=e.target.closest('[data-act2]');if(!b)return;const act=b.dataset.act2;
  try{
    if(act==='syncOut'){setSess(null);setMsg('');paintSync();if(!typing())renderDetail();return;}
    if(act==='syncNow'){setMsg('맞추는 중…');await syncAll(true);return;}
    const email=(document.getElementById('syncEmail')||{}).value||'',pw=(document.getElementById('syncPw')||{}).value||'';
    if(!email||!pw){setMsg('이메일과 비밀번호를 넣으세요.',true);return;}
    b.disabled=true;setMsg('로그인 중…');await sbSignIn(email,pw);setMsg('로그인했습니다. 맞추는 중…');paintSync();await syncAll(true);paintSync();if(!typing())renderDetail();
  }catch(err){setMsg(err.message||String(err),true);b.disabled=false;}
});

/* ---------- 밖에서 오기 — #카드=<id> (타이핑의 "카드 ↗"), #찾기=<말> (타이핑의 "카드 찾기 ↗") ---------- */
function applyHash(){let h='';try{h=decodeURIComponent((location.hash||'').slice(1));}catch(e){h=(location.hash||'').slice(1);}if(!h)return false;
  const o={};h.split('&').forEach(p=>{const k=p.indexOf('=');if(k>0)o[p.slice(0,k)]=p.slice(k+1);});
  if(o['카드']){const c=cardById(o['카드']);if(!c){toast('주소의 카드를 찾지 못했습니다.');return false;}ui.open=c.id;ui.focusCard=true;if(c.dropped){ui.pane='drop';}else{ui.pane='card';ui.tag=null;}renderDetail();return true;}
  if(o['찾기']!=null){ui.find=o['찾기'];ui.pane='find';ui.open=null;const f=document.getElementById('find');if(f)f.value=ui.find;renderDetail();return true;}
  return false;}
window.addEventListener('hashchange',applyHash);
/* 창 하나로 — 타이핑·storyM과 같은 약속. 자기 창 이름을 appwin.jeongri에 적고, data-win 링크는 누르는 순간 상대 앱의 그 창 이름으로 연다 */
function winMine(){try{if(!window.name||window.name==='taiping'||window.name==='storyM')window.name='jeongri';localStorage.setItem('appwin.jeongri',window.name);}catch(e){}}
function winOf(a){let n='';try{n=localStorage.getItem('appwin.'+a)||'';}catch(e){}if(!n||n===window.name)n=a;return n===window.name?a+'2':n;}
winMine();
document.addEventListener('click',e=>{const a=e.target&&e.target.closest?e.target.closest('a[data-win]'):null;if(a){a.target=winOf(a.dataset.win);a.removeAttribute('rel');}},true);
let tpT=null;
window.addEventListener('storage',e=>{
  if(e.key===IN_KEY&&e.newValue)drainInbox();
  /* 타이핑이 저장했다 — 조금 기다렸다가 다시 읽는다(글을 치는 중이면 목록만) */
  if(e.key===TP_KEY){clearTimeout(tpT);tpT=setTimeout(()=>{tpRefresh();if(!typing())renderDetail();else renderSide();},1200);}
});
window.addEventListener('focus',()=>{winMine();tpRefresh();drainInbox();if(!typing())renderDetail();syncAll(false);});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tpRefresh();drainInbox();syncAll(false);}else{flushIdeas();pushCards();}});
window.addEventListener('beforeunload',()=>{persist(true);flushIdeas(true);pushCards(true);});
readTp();linkPass();
render();
drainInbox();
applyHash();
if(sess){setMsg('맞추는 중…');syncAll(true);}
</script>
