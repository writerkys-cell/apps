<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세간</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --hanji:#EDEAE3;
  --soban:#E4DFD5;
  --card:#F5F3ED;
  --meok:#201E1C;
  --jae:#6E6A63;
  --hoi:#9C978D;
  --line:#D3CDC1;
  --jjok:#2E4A5C;
  --nott:#9A7B3C;
  --sp:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--hanji);
  color:var(--meok);
  font-family:'Gowun Batang',serif;
  font-size:16px;line-height:1.75;
  letter-spacing:.01em;
  padding-bottom:80px;
}
.wrap{max-width:660px;margin:0 auto;padding:0 var(--sp)}

/* ── 머리 ── */
header{padding:38px 0 0}
.title{
  font-size:15px;font-weight:700;letter-spacing:.9em;
  text-indent:.9em;color:var(--meok);
}
.tagline{font-size:12.5px;color:var(--hoi);letter-spacing:.03em;margin-top:4px}
.ledger{
  display:flex;gap:26px;flex-wrap:wrap;
  margin:20px 0 0;padding:12px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
}
.ledger div{display:flex;flex-direction:column;gap:1px}
.ledger dt{font-size:10.5px;letter-spacing:.18em;color:var(--hoi)}
.ledger dd{font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:-.01em}

nav{display:flex;gap:2px;margin:0 0 30px;padding-top:14px}
nav button{
  flex:1;background:none;border:none;border-bottom:1px solid var(--line);
  font-family:inherit;font-size:14px;color:var(--hoi);
  padding:7px 0 9px;cursor:pointer;letter-spacing:.28em;text-indent:.28em;
  transition:color .18s,border-color .18s;
}
nav button:hover{color:var(--jae)}
nav button[aria-current="true"]{color:var(--meok);border-bottom:1.5px solid var(--meok)}

/* ── 공통 ── */
h2.sec{font-size:13px;letter-spacing:.24em;color:var(--jae);font-weight:400;margin:0 0 14px}
.hr{height:1px;background:var(--line);margin:30px 0}
.muted{color:var(--hoi);font-size:13.5px}
.empty{padding:46px 0;color:var(--hoi);font-size:14.5px;line-height:2}
.mono{font-family:'IBM Plex Mono',monospace}

button.act{
  font-family:inherit;font-size:13.5px;background:none;
  border:1px solid var(--line);color:var(--jae);
  padding:7px 15px;cursor:pointer;border-radius:2px;
  transition:border-color .18s,color .18s,background .18s;
}
button.act:hover{border-color:var(--jae);color:var(--meok)}
button.act.solid{background:var(--meok);border-color:var(--meok);color:var(--hanji)}
button.act.solid:hover{background:#000}
button.act.quiet{border-color:transparent;color:var(--hoi)}
button.act.quiet:hover{color:var(--jjok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
:focus-visible{outline:2px solid var(--jjok);outline-offset:2px}

/* ── 검토 카드 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:26px 24px}
.card .cat{font-size:10.5px;letter-spacing:.2em;color:var(--hoi)}
.card h3{font-size:25px;font-weight:400;line-height:1.4;margin:5px 0 2px}
.card .brand{font-size:13.5px;color:var(--jae)}
.thumb{width:100%;height:190px;object-fit:cover;border-radius:2px;margin:16px 0 4px;filter:saturate(.9)}

/* 하루값 — 이 앱의 중심 */
.daily{margin:24px 0 6px;display:flex;align-items:flex-end;gap:14px}
.daily .num{
  font-family:'IBM Plex Mono',monospace;font-weight:500;
  font-size:44px;line-height:.95;color:var(--nott);letter-spacing:-.03em;
}
.daily .unit{font-size:13px;color:var(--jae);padding-bottom:6px}
.decay{width:100%;height:54px;display:block;margin-top:10px}
.decay .curve{fill:none;stroke:var(--nott);stroke-width:1.2}
.decay .ghost{fill:none;stroke:var(--line);stroke-width:1}
.decay .now{fill:var(--nott)}
.decaycap{font-size:12.5px;color:var(--hoi);margin-top:4px}

.facts{margin:20px 0 0;border-top:1px solid var(--line)}
.facts div{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.facts dt{width:74px;flex:none;color:var(--hoi);font-size:12.5px;letter-spacing:.06em;padding-top:2px}
.facts dd{flex:1;word-break:break-word}

/* ── 목록 ── */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{
  font-family:inherit;font-size:12.5px;background:none;border:1px solid var(--line);
  color:var(--hoi);padding:4px 11px;border-radius:2px;cursor:pointer;
}
.chip[aria-pressed="true"]{border-color:var(--meok);color:var(--meok)}
.search{
  width:100%;font-family:inherit;font-size:14.5px;background:none;
  border:none;border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:20px;color:var(--meok);
}
.search:focus{outline:none;border-bottom-color:var(--jae)}
ul.list{list-style:none}
ul.list li{border-bottom:1px solid var(--line)}
ul.list button{
  width:100%;display:flex;align-items:baseline;gap:12px;text-align:left;
  background:none;border:none;font-family:inherit;color:inherit;
  padding:13px 0;cursor:pointer;
}
ul.list button:hover .nm{color:var(--jjok)}
ul.list .nm{font-size:16px;flex:1;transition:color .16s}
ul.list .sub{font-size:12px;color:var(--hoi);letter-spacing:.04em}
ul.list .val{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--nott);flex:none}
.mark{color:var(--jjok);font-size:11.5px;letter-spacing:.12em;margin-left:2px}
li.gone .nm,li.gone .val{color:var(--hoi);text-decoration:line-through;text-decoration-thickness:.5px}

/* ── 폼 ── */
label{display:block;margin-bottom:16px}
label span{display:block;font-size:11.5px;letter-spacing:.16em;color:var(--hoi);margin-bottom:5px}
input,select,textarea{
  width:100%;font-family:inherit;font-size:15px;color:var(--meok);
  background:var(--card);border:1px solid var(--line);border-radius:2px;
  padding:9px 11px;
}
input[type=number],input[type=date]{font-family:'IBM Plex Mono',monospace;font-size:14px}
textarea{resize:vertical;min-height:76px;line-height:1.7}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--jae)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
input[type=file]{background:none;border:none;padding:0;font-size:13px;color:var(--jae)}

/* ── 후보 ── */
.cand{border-left:2px solid var(--line);padding:2px 0 2px 13px;margin-bottom:14px}
.cand .cn{font-size:15px}
.cand .cp{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--nott)}
.cand a{color:var(--jjok);font-size:12.5px;word-break:break-all}
.cand .cm{font-size:13.5px;color:var(--jae);line-height:1.7}

/* ── 프롬프트 ── */
.prompt{
  background:var(--soban);border:1px solid var(--line);border-radius:2px;
  padding:16px 17px;font-size:13.5px;line-height:1.85;color:var(--jae);
  white-space:pre-wrap;max-height:210px;overflow:auto;margin-bottom:10px;
}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:var(--meok);color:var(--hanji);font-size:13.5px;
  padding:9px 20px;border-radius:2px;opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:50;letter-spacing:.04em;
}
.toast.on{opacity:1}
footer{padding:44px 0 10px;font-size:11.5px;color:var(--hoi);letter-spacing:.06em}
@media (max-width:480px){
  :root{--sp:18px}
  .daily .num{font-size:38px}
  .card h3{font-size:22px}
  nav button{font-size:13px;letter-spacing:.18em;text-indent:.18em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">세간</div>
    <div class="tagline">적게 두고, 오래 쓴다</div>
    <dl class="ledger" id="ledger"></dl>
    <nav id="nav">
      <button data-v="review" aria-current="true">검토</button>
      <button data-v="list">세간</button>
      <button data-v="add">들임</button>
      <button data-v="keep">갈무리</button>
    </nav>
  </header>
  <main id="app"></main>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ────────── 저장 ────────── */
const DB="segan-db", ST="state";
let db=null, memoryOnly=false;
let S={items:[],version:1};
let view="review", curId=null, editId=null, queue=[], filter={q:"",cat:"",flag:""};

function openDB(){
  return new Promise(res=>{
    if(!window.indexedDB){memoryOnly=true;return res();}
    let r;
    try{ r=indexedDB.open(DB,1); }catch(e){ memoryOnly=true; return res(); }
    r.onupgradeneeded=e=>{ const d=e.target.result; if(!d.objectStoreNames.contains(ST)) d.createObjectStore(ST); };
    r.onsuccess=e=>{ db=e.target.result; res(); };
    r.onerror=()=>{ memoryOnly=true; res(); };
    setTimeout(()=>{ if(!db&&!memoryOnly){memoryOnly=true;res();} },2500);
  });
}
function load(){
  return new Promise(res=>{
    if(!db) return res();
    try{
      const t=db.transaction(ST,"readonly").objectStore(ST).get("main");
      t.onsuccess=()=>{ if(t.result&&Array.isArray(t.result.items)) S=t.result; res(); };
      t.onerror=()=>res();
    }catch(e){res();}
  });
}
let saveTimer=null;
function save(){
  if(!db) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ db.transaction(ST,"readwrite").objectStore(ST).put(JSON.parse(JSON.stringify(S)),"main"); }catch(e){}
  },120);
}

/* ────────── 도구 ────────── */
const CATS=["옷","신발","가방","주방","가구","전자","문구","연장","침구","몸","그 밖"];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won=n=>"₩"+Math.round(Number(n)||0).toLocaleString("ko-KR");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);

function daysHeld(it){
  if(!it.date) return 1;
  const d=Math.floor((Date.now()-new Date(it.date+"T00:00:00").getTime())/86400000);
  return Math.max(1,d);
}
function heldText(it){
  const d=daysHeld(it);
  if(d<31) return d+"일째";
  const m=Math.floor(d/30.44);
  if(m<12) return m+"달째";
  const y=Math.floor(d/365.25), r=Math.round((d%365.25)/30.44);
  return y+"년"+(r?" "+r+"달":"")+"째";
}
const daily=it=>(Number(it.price)||0)/daysHeld(it);
const live=()=>S.items.filter(i=>!i.gone);

function toast(m){
  const t=$("#toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),1700);
}
function copy(text,msg){
  const done=()=>toast(msg||"옮겨 담았습니다");
  if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(text).then(done,fallback); }
  else fallback();
  function fallback(){
    const ta=document.createElement("textarea");
    ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy");done();}catch(e){toast("복사하지 못했습니다");}
    ta.remove();
  }
}

/* ────────── 하루값 곡선 ────────── */
function decaySVG(it){
  const p=Number(it.price)||0, d=daysHeld(it);
  if(!p) return "";
  const W=560,H=54,end=Math.max(d*2.4,730);
  const at=x=>p/Math.max(x,1);
  const top=at(Math.max(d*0.18,1)), lo=at(end);
  const X=x=>(x/end)*W, Y=v=>H-2-((v-lo)/Math.max(top-lo,.0001))*(H-8);
  let path="";
  for(let i=0;i<=110;i++){
    const x=Math.max(end*(i/110),1);
    path+=(i?"L":"M")+X(x).toFixed(1)+" "+Math.min(H-1,Math.max(1,Y(at(x)))).toFixed(1)+" ";
  }
  const nx=X(d).toFixed(1), ny=Math.min(H-2,Math.max(2,Y(at(d)))).toFixed(1);
  return '<svg class="decay" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<path class="ghost" d="M0 '+(H-1)+' L'+W+' '+(H-1)+'"/>'+
    '<path class="curve" d="'+path+'"/>'+
    '<circle class="now" cx="'+nx+'" cy="'+ny+'" r="3"/></svg>';
}
function decayCaption(it){
  const p=Number(it.price)||0; if(!p) return "값을 적어두면 하루값이 셈해집니다.";
  const d=daysHeld(it);
  const y1=p/(d+365);
  if(d<30) return "들인 지 얼마 되지 않아 하루값이 아직 높습니다. 한 해를 더 쓰면 하루 "+won(y1)+".";
  return "한 해를 더 쓰면 하루 "+won(y1)+", 세 해를 더 쓰면 하루 "+won(p/(d+1095))+".";
}

/* ────────── 프롬프트 ────────── */
function buildPrompt(it){
  const p=Number(it.price)||0;
  const lo=p?won(Math.round(p*0.8)):"(예산 미정)", hi=p?won(Math.round(p*2.2)):"";
  const lines=[
"나는 물건을 적게 두고 오래 쓰는 쪽으로 살림을 꾸리고 있습니다. 지금 쓰는 물건 하나를 두고, 다음에 옮겨 갈 만한 물건을 찾고 있습니다.",
"",
"[지금 쓰는 것]",
"· 물건: "+(it.name||"(이름 없음)")+(it.brand?" ("+it.brand+")":""),
"· 갈래: "+(it.cat||"미분류"),
"· 들인 때: "+(it.date||"미상")+" · "+heldText(it),
"· 들인 곳: "+(it.place||"미상"),
"· 치른 값: "+(p?won(p):"미상")+(p?" · 지금 하루값 "+won(daily(it)):""),
(it.note?"· 쓰면서 느낀 점: "+it.note:"")+(it.wish?"\n· 아쉬운 점: "+it.wish:""),
"",
"[찾아주었으면 하는 것]",
"같은 쓰임의 물건 가운데, 다음 세 가지를 함께 갖춘 것을 3~5개 골라 주세요.",
"1. 디자인이 군더더기 없고, 유행을 타지 않아 십 년 뒤에 보아도 낡아 보이지 않을 것",
"2. 소재와 만듦새가 좋아 오래 견디고, 고쳐 쓰거나 부품을 갈아 끼울 수 있을 것",
"3. 값이 그 만듦새에 값할 것. 비싸도 좋지만, 이름값만 얹힌 물건은 빼 주세요.",
"예산은 "+lo+(hi?" ~ "+hi:"")+" 언저리로 봅니다. 더 좋은 선택이 있다면 넘어도 괜찮습니다.",
"",
"[답의 모양]",
"물건마다 이렇게 적어 주세요.",
"· 이름과 만든 곳 (나라, 만든 방식)",
"· 값의 범위와 살 수 있는 곳",
"· 왜 좋은가 — 소재, 구조, 만듦새를 들어 구체적으로",
"· 약점 — 무게, 손질, 값, 구하기 어려움 등 실제로 걸리는 점",
"· 얼마나 오래 쓸 수 있는가, 고쳐 쓸 길이 있는가",
"· 이 물건을 여러 해 써 본 사람들이 실제로 하는 말",
"",
"홍보 문구를 옮기지 말고, 오래 써 본 사람들의 평가에 기대어 답해 주세요. 마지막에, 지금 쓰는 물건을 그냥 계속 쓰는 편이 나은지도 솔직하게 말해 주세요."
  ];
  return lines.filter(l=>l!=="").join("\n").replace(/\n{3,}/g,"\n\n");
}

/* ────────── 그리기 ────────── */
function renderLedger(){
  const L=live();
  const sum=L.reduce((a,i)=>a+(Number(i.price)||0),0);
  const dsum=L.reduce((a,i)=>a+daily(i),0);
  $("#ledger").innerHTML=
    '<div><dt>품목</dt><dd>'+L.length+(S.items.length>L.length?' <span style="color:var(--hoi)">/ '+S.items.length+'</span>':'')+'</dd></div>'+
    '<div><dt>들인 값</dt><dd>'+won(sum)+'</dd></div>'+
    '<div><dt>하루값 합</dt><dd style="color:var(--nott)">'+won(dsum)+'</dd></div>';
  $("#foot").textContent = memoryOnly
    ? "이 브라우저에 저장할 수 없습니다. 갈무리에서 내보내 두세요."
    : "이 브라우저 안에만 담깁니다. 이따금 갈무리에서 내보내 두세요.";
}
function setView(v){ view=v; curId=null; render(); window.scrollTo(0,0); }
document.addEventListener("click",e=>{
  const n=e.target.closest("#nav button"); if(!n) return;
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b===n?"true":"false"));
  if(v_edit_guard(n.dataset.v)) return;
  editId=null; setView(n.dataset.v);
});
function v_edit_guard(){return false;}

function render(){
  renderLedger();
  const a=$("#app");
  if(curId){ a.innerHTML=viewDetail(curId); return; }
  if(view==="review") a.innerHTML=viewReview();
  else if(view==="list") a.innerHTML=viewList();
  else if(view==="add") a.innerHTML=viewForm();
  else a.innerHTML=viewKeep();
}

/* 검토 */
function nextInQueue(){
  const L=live();
  if(!L.length) return null;
  queue=queue.filter(id=>L.some(i=>i.id===id));
  if(!queue.length){
    queue=L.map(i=>i.id);
    for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]];}
  }
  return L.find(i=>i.id===queue[0])||null;
}
function viewReview(){
  const it=nextInQueue();
  if(!it) return '<div class="empty">아직 들인 것이 없습니다.<br>들임에서 지금 쓰고 있는 물건부터 하나씩 적어 보세요.</div>';
  return '<h2 class="sec">오늘 다시 보는 것</h2>'+cardHTML(it)+
    '<div class="row" style="margin-top:20px">'+
      '<button class="act solid" data-a="keep" data-id="'+it.id+'">그대로 좋다</button>'+
      '<button class="act" data-a="flag" data-id="'+it.id+'">'+(it.wantUp?"손볼 것에서 빼기":"손볼 때가 됐다")+'</button>'+
      '<button class="act quiet" data-a="skip">다음 것</button>'+
      '<button class="act quiet" data-a="open" data-id="'+it.id+'">자세히</button>'+
    '</div>'+
    (it.keeps?'<p class="muted" style="margin-top:14px">여태 '+it.keeps+'번 다시 보고, 그대로 두기로 했습니다.</p>':'');
}
function cardHTML(it){
  const p=Number(it.price)||0;
  return '<div class="card">'+
    '<div class="cat">'+esc(it.cat||"미분류")+(it.wantUp?' <span class="mark">손볼 것</span>':'')+'</div>'+
    '<h3>'+esc(it.name)+'</h3>'+
    (it.brand?'<div class="brand">'+esc(it.brand)+'</div>':'')+
    (it.photo?'<img class="thumb" src="'+it.photo+'" alt="">':'')+
    (p?'<div class="daily"><span class="num">'+won(daily(it)).replace("₩","")+'</span><span class="unit">원 · 하루</span></div>'+
        decaySVG(it)+'<p class="decaycap">'+decayCaption(it)+'</p>':'')+
    '<dl class="facts">'+
      '<div><dt>들인 때</dt><dd>'+esc(it.date||"—")+(it.date?' <span class="muted">· '+heldText(it)+'</span>':'')+'</dd></div>'+
      '<div><dt>들인 곳</dt><dd>'+esc(it.place||"—")+'</dd></div>'+
      '<div><dt>치른 값</dt><dd class="mono">'+(p?won(p):"—")+'</dd></div>'+
      (it.note?'<div><dt>메모</dt><dd>'+esc(it.note)+'</dd></div>':'')+
      (it.wish?'<div><dt>아쉬운 점</dt><dd>'+esc(it.wish)+'</dd></div>':'')+
    '</dl></div>';
}

/* 목록 */
function viewList(){
  if(!S.items.length) return '<div class="empty">세간이 비어 있습니다.<br>들임에서 첫 물건을 적어 보세요.</div>';
  const cats=CATS.filter(c=>S.items.some(i=>i.cat===c));
  let arr=S.items.slice();
  if(filter.cat) arr=arr.filter(i=>i.cat===filter.cat);
  if(filter.flag==="up") arr=arr.filter(i=>i.wantUp&&!i.gone);
  if(filter.flag==="gone") arr=arr.filter(i=>i.gone);
  else if(filter.flag!=="gone") arr=arr.filter(i=>!i.gone||filter.flag==="");
  if(filter.q){
    const q=filter.q.toLowerCase();
    arr=arr.filter(i=>[i.name,i.brand,i.place,i.note,i.cat].join(" ").toLowerCase().includes(q));
  }
  arr.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const chip=(k,v,l)=>'<button class="chip" data-a="filter" data-k="'+k+'" data-v="'+v+'" aria-pressed="'+((filter[k]===v)+"")+'">'+l+'</button>';
  return '<h2 class="sec">세간</h2>'+
    '<input class="search" id="q" placeholder="이름, 만든 곳, 들인 곳으로 찾기" value="'+esc(filter.q)+'">'+
    '<div class="chips">'+chip("cat","","전체")+cats.map(c=>chip("cat",c,esc(c))).join("")+
      chip("flag","up","손볼 것")+chip("flag","gone","보낸 것")+'</div>'+
    (arr.length?'<ul class="list">'+arr.map(i=>
      '<li class="'+(i.gone?"gone":"")+'"><button data-a="open" data-id="'+i.id+'">'+
        '<span class="nm">'+esc(i.name)+(i.wantUp&&!i.gone?' <span class="mark">손볼 것</span>':'')+
          '<br><span class="sub">'+esc(i.cat||"미분류")+(i.date?" · "+heldText(i):"")+'</span></span>'+
        '<span class="val">'+(Number(i.price)?won(daily(i))+"/일":"")+'</span></button></li>').join("")+'</ul>'
      :'<div class="empty">해당하는 것이 없습니다.</div>');
}

/* 상세 */
function viewDetail(id){
  const it=S.items.find(i=>i.id===id);
  if(!it) return '<div class="empty">찾을 수 없습니다.</div>';
  if(editId===id) return viewForm(it);
  const cands=(it.cands||[]);
  return '<div class="row" style="margin-bottom:16px"><button class="act quiet" data-a="back">← 돌아가기</button></div>'+
    cardHTML(it)+
    '<div class="row" style="margin-top:18px">'+
      '<button class="act" data-a="edit" data-id="'+it.id+'">고치기</button>'+
      '<button class="act" data-a="flag" data-id="'+it.id+'">'+(it.wantUp?"손볼 것에서 빼기":"손볼 때가 됐다")+'</button>'+
      '<button class="act quiet" data-a="gone" data-id="'+it.id+'">'+(it.gone?"다시 쓰는 중으로":"보냈다고 표시")+'</button>'+
      '<button class="act quiet" data-a="del" data-id="'+it.id+'">지우기</button>'+
    '</div>'+
    '<div class="hr"></div>'+
    '<h2 class="sec">다음에 옮겨 갈 것</h2>'+
    (cands.length?cands.map((c,ix)=>
      '<div class="cand"><div class="cn">'+esc(c.name)+'</div>'+
      (c.price?'<div class="cp">'+won(c.price)+'</div>':'')+
      (c.url?'<div><a href="'+esc(c.url)+'" target="_blank" rel="noopener">'+esc(c.url)+'</a></div>':'')+
      (c.note?'<div class="cm">'+esc(c.note)+'</div>':'')+
      '<button class="act quiet" style="padding:2px 0;font-size:12px" data-a="delcand" data-id="'+it.id+'" data-ix="'+ix+'">빼기</button></div>').join("")
      :'<p class="muted" style="margin-bottom:16px">아직 적어둔 후보가 없습니다. 평소에 눈에 띄는 것을 미리 담아 두세요.</p>')+
    '<div style="margin-top:16px">'+
      '<div class="two"><label><span>이름</span><input id="cn" placeholder="물건 이름"></label>'+
      '<label><span>값</span><input id="cp" type="number" inputmode="numeric" placeholder="0"></label></div>'+
      '<label><span>링크</span><input id="cu" placeholder="https://"></label>'+
      '<label><span>메모</span><textarea id="cm" placeholder="왜 눈에 들었는지, 무엇이 걸리는지"></textarea></label>'+
      '<button class="act solid" data-a="addcand" data-id="'+it.id+'">후보 담기</button>'+
    '</div>'+
    '<div class="hr"></div>'+
    '<h2 class="sec">AI에게 물어보기</h2>'+
    '<div class="prompt" id="pp">'+esc(buildPrompt(it))+'</div>'+
    '<div class="row"><button class="act solid" data-a="copyp" data-id="'+it.id+'">프롬프트 복사</button>'+
    '<span class="muted">복사해서 대화창에 붙여 넣으세요.</span></div>';
}

/* 들임 / 고치기 */
function viewForm(it){
  const e=it||{};
  return (it?'<div class="row" style="margin-bottom:16px"><button class="act quiet" data-a="back">← 돌아가기</button></div>':'')+
    '<h2 class="sec">'+(it?"고치기":"들임")+'</h2>'+
    '<label><span>이름</span><input id="f_name" value="'+esc(e.name)+'" placeholder="무엇인지"></label>'+
    '<div class="two">'+
      '<label><span>갈래</span><select id="f_cat">'+["",...CATS].map(c=>'<option value="'+esc(c)+'"'+(e.cat===c?" selected":"")+'>'+(c||"고르기")+'</option>').join("")+'</select></label>'+
      '<label><span>만든 곳</span><input id="f_brand" value="'+esc(e.brand)+'" placeholder="상표, 만든 이"></label>'+
    '</div>'+
    '<div class="two">'+
      '<label><span>들인 때</span><input id="f_date" type="date" value="'+esc(e.date||today())+'"></label>'+
      '<label><span>치른 값</span><input id="f_price" type="number" inputmode="numeric" value="'+esc(e.price)+'" placeholder="0"></label>'+
    '</div>'+
    '<label><span>들인 곳</span><input id="f_place" value="'+esc(e.place)+'" placeholder="가게, 사이트, 받은 이"></label>'+
    '<label><span>메모</span><textarea id="f_note" placeholder="어떤 점이 좋은지, 왜 골랐는지">'+esc(e.note)+'</textarea></label>'+
    '<label><span>아쉬운 점</span><textarea id="f_wish" placeholder="다음에 옮겨 간다면 무엇이 나아졌으면 하는지">'+esc(e.wish)+'</textarea></label>'+
    '<label><span>사진</span><input id="f_photo" type="file" accept="image/*">'+
      (e.photo?'<img class="thumb" style="height:150px;margin-top:10px" src="'+e.photo+'" alt=""><button class="act quiet" style="padding:2px 0;font-size:12px" data-a="rmphoto">사진 빼기</button>':'')+'</label>'+
    '<div class="row" style="margin-top:8px"><button class="act solid" data-a="save" data-id="'+(it?it.id:"")+'">'+(it?"고친 대로 두기":"세간에 넣기")+'</button>'+
    (it?'':'<span class="muted">지금 쓰고 있는 것부터 적으면 됩니다.</span>')+'</div>';
}
let pendingPhoto=null;

/* 갈무리 */
function viewKeep(){
  const L=live();
  const by={};
  L.forEach(i=>{const c=i.cat||"미분류";by[c]=by[c]||{n:0,s:0};by[c].n++;by[c].s+=Number(i.price)||0;});
  const rows=Object.entries(by).sort((a,b)=>b[1].s-a[1].s);
  const old=L.slice().sort((a,b)=>daily(a)-daily(b)).slice(0,3);
  return '<h2 class="sec">갈래별</h2>'+
    (rows.length?'<dl class="facts" style="border-top:1px solid var(--line)">'+rows.map(([c,v])=>
      '<div><dt>'+esc(c)+'</dt><dd class="mono">'+v.n+'개 · '+won(v.s)+'</dd></div>').join("")+'</dl>'
      :'<p class="muted">아직 셈할 것이 없습니다.</p>')+
    (old.length?'<div class="hr"></div><h2 class="sec">가장 값을 하고 있는 것</h2><dl class="facts" style="border-top:1px solid var(--line)">'+
      old.map(i=>'<div><dt>'+esc(i.cat||"—")+'</dt><dd>'+esc(i.name)+' <span class="muted mono">· 하루 '+won(daily(i))+' · '+heldText(i)+'</span></dd></div>').join("")+'</dl>':'')+
    '<div class="hr"></div><h2 class="sec">내보내고 불러오기</h2>'+
    '<p class="muted" style="margin-bottom:16px">모든 기록을 파일 하나로 내보냅니다. 다른 기기에서 불러오면 그대로 이어집니다.</p>'+
    '<div class="row"><button class="act solid" data-a="export">파일로 내보내기</button>'+
    '<button class="act" data-a="importbtn">파일에서 불러오기</button>'+
    '<input type="file" id="imp" accept="application/json,.json" style="display:none">'+
    '<button class="act quiet" data-a="wipe">모두 지우기</button></div>';
}

/* ────────── 동작 ────────── */
document.addEventListener("input",e=>{
  if(e.target.id==="q"){ filter.q=e.target.value; const p=e.target.selectionStart; render(); const q=$("#q"); if(q){q.focus();q.setSelectionRange(p,p);} }
  if(e.target.id==="f_photo"){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=760, sc=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement("canvas");
        cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        pendingPhoto=cv.toDataURL("image/jpeg",0.72);
        toast("사진을 담았습니다");
      };
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  }
  if(e.target.id==="imp"){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result);
        if(!d||!Array.isArray(d.items)) throw 0;
        const have=new Set(S.items.map(i=>i.id));
        let add=0;
        d.items.forEach(i=>{ if(i&&i.id&&!have.has(i.id)){S.items.push(i);add++;} });
        save(); render(); toast(add+"개를 불러왔습니다");
      }catch(err){ toast("읽을 수 없는 파일입니다"); }
    };
    rd.readAsText(f);
  }
});

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a, id=b.dataset.id;
  const it=id?S.items.find(i=>i.id===id):null;

  if(a==="skip"){ queue.shift(); render(); }
  else if(a==="keep"&&it){ it.keeps=(it.keeps||0)+1; it.lastSeen=today(); queue.shift(); save(); render(); toast("그대로 두기로 했습니다"); }
  else if(a==="flag"&&it){ it.wantUp=!it.wantUp; save(); render(); toast(it.wantUp?"손볼 것으로 표시했습니다":"표시를 뺐습니다"); }
  else if(a==="open"){ curId=id; editId=null; render(); window.scrollTo(0,0); }
  else if(a==="back"){ if(editId){editId=null;render();} else {curId=null;render();} window.scrollTo(0,0); }
  else if(a==="edit"){ editId=id; pendingPhoto=null; render(); window.scrollTo(0,0); }
  else if(a==="rmphoto"){ if(it){it.photo="";} pendingPhoto=null; save(); render(); }
  else if(a==="filter"){ filter[b.dataset.k]=filter[b.dataset.k]===b.dataset.v?"":b.dataset.v; if(b.dataset.k==="cat"&&b.dataset.v==="")filter.cat=""; render(); }
  else if(a==="save"){ doSave(id); }
  else if(a==="gone"&&it){ it.gone=!it.gone; if(it.gone)it.goneAt=today(); save(); render(); toast(it.gone?"보낸 것으로 옮겼습니다":"다시 쓰는 중입니다"); }
  else if(a==="del"&&it){
    if(confirm('"'+it.name+'"을(를) 기록에서 지웁니다. 되돌릴 수 없습니다.')){
      S.items=S.items.filter(i=>i.id!==id); curId=null; save(); render(); toast("지웠습니다");
    }
  }
  else if(a==="addcand"&&it){
    const n=$("#cn").value.trim(); if(!n) return toast("이름을 적어 주세요");
    it.cands=it.cands||[];
    it.cands.push({name:n,price:$("#cp").value,url:$("#cu").value.trim(),note:$("#cm").value.trim(),at:today()});
    save(); render(); toast("후보에 담았습니다");
  }
  else if(a==="delcand"&&it){ it.cands.splice(Number(b.dataset.ix),1); save(); render(); }
  else if(a==="copyp"&&it){ copy(buildPrompt(it),"프롬프트를 복사했습니다"); }
  else if(a==="export"){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const u=URL.createObjectURL(blob), l=document.createElement("a");
    l.href=u; l.download="세간-"+today()+".json"; l.click();
    setTimeout(()=>URL.revokeObjectURL(u),1000); toast("내보냈습니다");
  }
  else if(a==="importbtn"){ $("#imp").click(); }
  else if(a==="wipe"){
    if(confirm("모든 기록을 지웁니다. 먼저 내보내 두었나요?")){ S={items:[],version:1}; queue=[]; save(); render(); toast("모두 지웠습니다"); }
  }
});

function doSave(id){
  const g=x=>{const el=$("#f_"+x);return el?el.value.trim():"";};
  const name=g("name");
  if(!name) return toast("이름을 적어 주세요");
  const data={
    name, cat:g("cat"), brand:g("brand"), date:g("date"),
    price:g("price"), place:g("place"), note:g("note"), wish:g("wish")
  };
  if(id){
    const it=S.items.find(i=>i.id===id);
    Object.assign(it,data);
    if(pendingPhoto) it.photo=pendingPhoto;
    editId=null; pendingPhoto=null; save(); render(); toast("고쳐 두었습니다");
  }else{
    const it=Object.assign({id:uid(),keeps:0,cands:[],gone:false,wantUp:false,photo:pendingPhoto||""},data);
    S.items.unshift(it); pendingPhoto=null; queue=[];
    curId=it.id; save(); render();
    document.querySelectorAll("#nav button").forEach(x=>x.setAttribute("aria-current",x.dataset.v==="list"?"true":"false"));
    view="list"; toast("세간에 넣었습니다");
  }
  window.scrollTo(0,0);
}

/* ────────── 시작 ────────── */
(async function(){ await openDB(); await load(); render(); })();
</script>
</body>
