<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCFBF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dream">
<title>Dream</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #FCFBF7;
    --paper-card: #FFFFFF;
    --ink: #35322C;
    --ink-soft: #857F72;
    --accent: #3E8E7E;
    --accent-soft: #A6CFC5;
    --line: #E9E5DA;
    --font-serif: 'Gowun Batang', 'Noto Serif KR', serif;
    --font-sans: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    min-height:100vh;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing: antialiased;
  }
  #app{
    width:100%;
    max-width: 560px;
    min-height:100vh;
    overflow-x: hidden;
    padding: max(18px, env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
  }
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 22px;
    color: var(--ink-soft);
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .topbar .date-home{
    background:none; border:none; padding:4px 0; margin:0;
    font-family: inherit; font-size:13px; color: var(--ink-soft);
    letter-spacing:0.02em; font-variant-numeric: tabular-nums;
    cursor:pointer; border-bottom:1px dotted var(--line);
  }
  .topbar .date-home:active{ opacity:0.6; }
  .topbar .icons{ display:flex; gap:14px; }
  .icon-btn{
    background:none; border:none; cursor:pointer;
    font-size:17px; color: var(--ink-soft); padding:4px;
    line-height:1;
  }
  .icon-btn:active{ opacity:0.6; }

  main{ flex:1; display:flex; flex-direction:column; }

  .eyebrow{
    font-family: var(--font-serif);
    color: var(--accent);
    font-size: 13px;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }
  h1.q{
    font-family: var(--font-serif);
    font-weight: 400;
    font-size: 26px;
    line-height:1.45;
    margin: 0 0 6px;
  }
  p.sub{
    color: var(--ink-soft);
    font-size: 14.5px;
    line-height:1.6;
    margin: 0 0 26px;
  }

  textarea{
    display:block;
    width:100%;
    max-width:100%;
    min-width:0;
    min-height: 140px;
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    font-family: var(--font-serif);
    font-size: 16.5px;
    line-height:1.7;
    color: var(--ink);
    resize: vertical;
    outline:none;
    -webkit-appearance:none;
    appearance:none;
  }
  textarea:focus{ border-color: var(--accent-soft); }
  textarea::placeholder{ color:#B9B4A8; }

  .btn-row{ display:flex; gap:10px; margin-top:18px; }
  .btn{
    flex:1;
    border:none; border-radius:10px;
    padding:14px 16px;
    font-size:15px;
    font-family: var(--font-sans);
    font-weight:600;
    cursor:pointer;
    text-align:center;
  }
  .btn:active{ transform: translateY(1px); }
  .btn.primary{ background: var(--ink); color: var(--paper-card); }
  .btn.primary:disabled{ background:#E4E0D6; color:#A9A49A; cursor:default; }
  .btn.secondary{ background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .btn.accent{ background: var(--accent); color:#fff; }
  .btn.full{ flex:none; width:100%; }
  .btn.ghost{ background:none; color:var(--ink-soft); border:1px solid var(--line); }
  .btn.danger{ background:none; color:#B4553F; border:1px solid #E7CFC6; }

  .schedule-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:10px;
    margin-top: 6px;
  }
  .schedule-opt{
    background: var(--paper-card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 10px;
    text-align:center;
    font-family: var(--font-serif);
    font-size:16px;
    cursor:pointer;
  }
  .schedule-opt:active{ background:#F4F2EB; }
  .custom-days{
    grid-column: 1 / -1;
    display:flex;
    align-items:center;
    gap:8px;
    background: var(--paper-card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    margin-top: 2px;
  }
  .custom-days input[type=number]{
    width:76px; min-width:0; border:1px solid var(--line); border-radius:6px;
    padding:9px 8px; font-size:16px; font-family: var(--font-sans);
    background:#fff; color:var(--ink);
    -webkit-appearance:none; appearance:none; margin:0;
  }
  .custom-days input[type=number]::-webkit-inner-spin-button,
  .custom-days input[type=number]::-webkit-outer-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .custom-days span{ color:var(--ink-soft); font-size:14px; }
  .custom-days button{
    margin-left:auto;
    background: var(--ink); color:#fff; border:none;
    border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer;
  }

  .wish-input{ min-height: 260px; }
  .counter{
    text-align:right; font-size:12px; color:var(--ink-soft);
    margin-top:8px; font-variant-numeric:tabular-nums;
    letter-spacing:0.02em;
  }
  .counter.done{ color: var(--accent); }

  .progress{
    font-size:12.5px; color: var(--ink-soft);
    margin-bottom: 14px; letter-spacing:0.02em;
  }
  .worry-card{
    background: var(--paper-card);
    border:1px solid var(--line);
    border-radius: 10px;
    padding: 15px 16px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .worry-card:active{ background:#F7F5EF; }
  .worry-card .preview{
    font-family: var(--font-serif);
    font-size:15.5px;
    line-height:1.6;
    color: var(--ink);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .worry-card .meta{
    margin-top:8px; font-size:12px; color: var(--ink-soft);
    display:flex; gap:10px;
  }

  .detail-text{
    font-family: var(--font-serif);
    font-size:17px; line-height:1.8;
    background: var(--paper-card);
    border:1px solid var(--line); border-radius:10px;
    padding:18px; margin-bottom: 14px;
    white-space:normal;
  }
  .detail-date{ font-size:12.5px; color:var(--ink-soft); margin-bottom:8px; }
  .history-item{
    border-left:2px solid var(--line);
    padding: 2px 0 10px 12px; margin-left:4px;
    font-size:14px; line-height:1.6;
  }
  .history-item .h-date{ color: var(--accent); font-size:12px; margin-bottom:2px; }
  .history-title{ font-size:13px; color:var(--ink-soft); margin: 18px 0 8px; }

  .unlocked-title{
    font-family: var(--font-serif); text-align:center; font-size:20px;
    margin: 30px 0 6px;
  }

  .archive-tabs{ display:flex; gap:8px; margin-bottom:14px; }
  .archive-tab{
    flex:1; text-align:center; padding:10px; border-radius:8px;
    font-size:14px; cursor:pointer; color:var(--ink-soft);
    border:1px solid var(--line); background:transparent;
  }
  .archive-tab.active{ background: var(--ink); color: var(--paper-card); border-color:var(--ink); }
  .empty{ text-align:center; color:var(--ink-soft); font-size:14px; padding: 50px 10px; line-height:1.7; }

  .field-label{ font-size:13px; color:var(--ink-soft); margin: 20px 0 8px; }
  .text-input{
    display:block;
    width:100%; max-width:100%; min-width:0;
    border:1px solid var(--line); border-radius:8px;
    padding:13px 12px; font-size:16px; font-family: var(--font-sans);
    line-height:1.3;
    background:#fff; color:var(--ink);
    -webkit-appearance:none; appearance:none;
    outline:none;
  }
  .text-input:focus{ border-color: var(--accent-soft); }
  input.text-input[type=date]{
    min-height:50px; height:50px;
    text-align:left;
  }
  input[type=date]::-webkit-date-and-time-value{
    text-align:left; margin:0; padding:0; min-height:1.3em;
  }
  input[type=date]::-webkit-datetime-edit{ padding:0; line-height:1.3; }
  input[type=date]::-webkit-calendar-picker-indicator{
    margin-left:auto; opacity:0.45;
  }
  .settings-actions{ display:flex; flex-direction:column; gap:10px; margin-top:22px; }
  .toast{
    position:fixed; bottom: 26px; left:50%; transform:translateX(-50%);
    background: var(--ink); color: var(--paper-card);
    padding:10px 18px; border-radius: 20px; font-size:13.5px;
    opacity:0; pointer-events:none; transition: opacity .25s ease;
    z-index: 10;
  }
  .toast.show{ opacity:1; }
  .back-row{ margin-bottom:16px; }
  .back-link{ background:none; border:none; color:var(--ink-soft); font-size:14px; cursor:pointer; padding:4px 0; }

  .upcoming{ margin-top: 34px; padding-top: 20px; border-top: 1px solid var(--line); }
  .upcoming-title{ font-size:13px; color:var(--ink-soft); margin-bottom:8px; letter-spacing:0.02em; }
  .upcoming-item{
    display:flex; align-items:baseline; gap:10px;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;
  }
  .upcoming-item:last-child{ border-bottom:none; }
  .upcoming-item .u-date{
    color:var(--accent); font-size:12px; flex-shrink:0;
    font-variant-numeric:tabular-nums;
  }
  .upcoming-item .u-content{ flex:1; color:var(--ink); font-family: var(--font-serif); font-size:15px; }
  .upcoming-item .u-del{
    background:none; border:none; color:var(--ink-soft); font-size:15px;
    cursor:pointer; padding:2px 4px; line-height:1;
  }

  .browsing-wrap{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    text-align:center; padding: 10px 4px 20px;
  }
  .browsing-label{ font-size:12.5px; color:var(--ink-soft); letter-spacing:0.04em; margin-bottom:14px; }
  .browsing-purpose{
    font-family: var(--font-serif); font-size:19px; line-height:1.7;
    padding: 18px; border:1px solid var(--line); border-radius:10px;
    background: var(--paper-card); margin-bottom:20px; text-align:left;
  }
  .browsing-elapsed{ font-size:14px; color:var(--ink-soft); }
  .browsing-elapsed strong{ color:var(--accent); font-weight:500; font-size:16px; }

  .session-item{
    padding:12px 0; border-bottom:1px solid var(--line);
    display:flex; gap:10px; align-items:baseline;
  }
  .session-item:last-child{ border-bottom:none; }
  .session-item .s-body{ flex:1; }
  .session-item .s-meta{ font-size:12px; color:var(--ink-soft); margin-bottom:3px; }
  .session-item .s-meta b{ color:var(--accent); font-weight:500; }
  .session-item .s-purpose{ font-family: var(--font-serif); font-size:15px; line-height:1.6; }
  .session-item .s-del{
    background:none; border:none; color:var(--ink-soft); font-size:15px;
    cursor:pointer; padding:2px 4px; line-height:1;
  }
  .stat-row{
    display:flex; gap:6px; margin-bottom:18px;
  }
  .stat-box{
    flex:1; min-width:0; border:1px solid var(--line); border-radius:8px;
    padding:11px 4px; text-align:center; background: var(--paper-card);
  }
  .stat-box .s-num{ font-size:13.5px; font-family: var(--font-serif); line-height:1.35; }
  .stat-box .s-cap{ font-size:10.5px; color:var(--ink-soft); margin-top:3px; }
  #promptArea{
    width:100%; min-height:150px; font-size:12.5px; line-height:1.6;
    font-family: var(--font-sans);
    background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:12px; color:var(--ink); resize:vertical;
  }
  #templateArea{
    width:100%; min-height:340px; font-size:13px; line-height:1.7;
    font-family: var(--font-sans);
    background:#fff; border:1px solid var(--line); border-radius:8px;
    padding:14px; color:var(--ink); resize:vertical; outline:none;
  }
  #templateArea:focus{ border-color: var(--accent-soft); }
  .ph-hint{
    font-size:12.5px; color:var(--ink-soft); line-height:1.7;
    background: var(--paper-card); border:1px solid var(--line);
    border-radius:8px; padding:12px; margin-bottom:14px;
  }
  .ph-hint code{
    font-family: ui-monospace, monospace; color: var(--accent);
    background:#fff; padding:1px 5px; border-radius:4px; font-size:12px;
  }

  .opt-row{ display:flex; gap:8px; margin-top:4px; }
  .opt{
    flex:1; text-align:center; padding:14px 6px;
    border:1px solid var(--line); border-radius:9px;
    background: var(--paper-card); cursor:pointer;
    font-size:14px; font-family: var(--font-serif);
  }
  .opt.sel{ background: var(--ink); color: var(--paper-card); border-color: var(--ink); }
  .check-row{
    display:flex; align-items:flex-start; gap:11px;
    border:1px solid var(--line); border-radius:9px;
    background: var(--paper-card); padding:14px; margin-top:6px;
    cursor:pointer;
  }
  .check-row input{
    width:20px; height:20px; margin:0; flex-shrink:0;
    accent-color: var(--accent); cursor:pointer;
  }
  .check-row .c-text{ font-size:14.5px; line-height:1.5; }
  .check-row .c-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.5; }
  .review-purpose{
    font-family: var(--font-serif); font-size:16px; line-height:1.7;
    padding:15px; border:1px solid var(--line); border-radius:9px;
    background: var(--paper-card);
  }

  .trend-note{
    font-size:13px; color:var(--ink); margin: 2px 0 14px;
    font-family: var(--font-serif);
  }
  .trend-row{
    display:flex; align-items:center; gap:8px;
    font-size:11.5px; color:var(--ink-soft); margin-bottom:7px;
  }
  .trend-row .t-label{ width:64px; flex-shrink:0; }
  .trend-row .t-bar-wrap{
    flex:1; height:9px; background:#EDEAE1; border-radius:5px; overflow:hidden;
  }
  .trend-row .t-bar{ height:100%; background: var(--accent-soft); border-radius:5px; }
  .trend-row .t-bar.cur{ background: var(--accent); }
  .trend-row .t-val{ width:74px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums; }

  .fold{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    background:none; border:none; border-top:1px solid var(--line);
    padding:15px 2px; margin-top:6px; cursor:pointer;
    font-family: var(--font-sans); font-size:13.5px; color:var(--ink);
    text-align:left;
  }
  .fold:active{ opacity:0.6; }
  .fold .f-arrow{ color:var(--ink-soft); font-size:11px; }
  .fold-note{ font-size:11.5px; color:var(--ink-soft); margin: 12px 0 0; line-height:1.6; }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept="application/json" style="display:none">
<div class="toast" id="toast"></div>

<script>
/* ---------- storage ---------- */
const STORE_KEY = 'dream_data_v1';

const DEFAULT_PROMPT_TEMPLATE = `저는 인터넷 사용을 줄이려고 하는 중입니다. 인터넷을 열기 전에 매번 "왜 지금 인터넷을 쓰려는가"를 적고, 사용을 마친 뒤에는 목표대로 썼는지 점검해서 기록하고 있습니다. 아래가 그 기록입니다.

[요약]
{{요약}}

[개별 기록]
{{기록}}

이 기록을 바탕으로 다음을 분석해주세요.

1. 제가 적은 '목적'들을 성격별로 분류해주세요. 그중 실제로 필요한 용무와, 목적이 모호하거나 습관적으로 열었던 것으로 보이는 것을 구분해주세요.
2. 주별 추세를 봐주세요. 사용 시간과 횟수가 줄고 있는지 늘고 있는지, 그 변화가 의미 있는 것인지 아니면 그냥 주간 편차인지 판단해주세요.
3. 시간대, 요일, 세션 길이에서 반복되는 패턴이 보이면 짚어주세요. 특히 목적과 실제 사용이 어긋난 세션(점검에서 '벗어남'으로 적은 것)에 공통점이 있는지 봐주세요.
4. 에고서치 기록을 따로 분석해주세요. 얼마나 자주, 어떤 상황이나 시간대에 하는지, 그리고 그것이 세션 길이나 목표 이탈과 관련이 있는지 알려주세요.
5. 위 분석에 근거해, 제가 이번 주부터 바로 실행할 수 있는 구체적인 방법을 3~5개 제안해주세요. '적게 쓰세요' 같은 일반론이 아니라, 제 기록에 나타난 특정 패턴을 겨냥한 실제적인 조치여야 합니다. 각 제안마다 그것을 제안한 근거가 되는 기록을 함께 언급해주세요.
6. 인터넷을 여는 대신 그 자리를 대신할 수 있는 행동을, 제 기록에 나타난 상황에 맞춰 제안해주세요.

기록이 적어서 판단하기 어려운 부분이 있으면, 단정하지 말고 무엇을 더 기록하면 좋을지 알려주세요.`;

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { worries: [], schedules: [], sessions: [], activeSession: null, settings: { startUrl: 'https://www.google.com' } };
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }catch(e){ toast('저장 실패: 저장공간을 확인해주세요'); } }

let DATA = load();
if(!DATA.settings) DATA.settings = { startUrl: 'https://www.google.com' };
if(!DATA.schedules) DATA.schedules = [];
if(!DATA.sessions) DATA.sessions = [];
if(DATA.activeSession === undefined) DATA.activeSession = null;
if(!DATA.settings.promptTemplate) DATA.settings.promptTemplate = DEFAULT_PROMPT_TEMPLATE;

let STATE = {
  screen: 'loading',
  pendingNewWorryText: null,
  pendingUnresolveNote: null,
  scheduleContext: null,
  currentDueQueue: [],
  dueQueueTotal: 0,
  currentDetailId: null,
  archiveTab: 'resolved',
  navStack: [],
  review: null,
  sessionsOpen: false,
  promptOpen: false
};

/* ---------- date helpers ---------- */
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function parseYMD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtYMD(dt){ return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0'); }
function computeReappear(baseStr, unit, n){
  const dt = parseYMD(baseStr);
  if(unit === 'd') dt.setDate(dt.getDate() + n);
  else if(unit === 'm') dt.setMonth(dt.getMonth() + n);
  else if(unit === 'y') dt.setFullYear(dt.getFullYear() + n);
  return fmtYMD(dt);
}
function formatDateKR(s){
  const dt = parseYMD(s);
  const wd = ['일','월','화','수','목','금','토'][dt.getDay()];
  return dt.getFullYear() + '년 ' + (dt.getMonth()+1) + '월 ' + dt.getDate() + '일 (' + wd + ')';
}
function daysAgoLabel(s){
  const diff = Math.round((parseYMD(todayStr()) - parseYMD(s)) / 86400000);
  if(diff <= 0) return '오늘';
  if(diff === 1) return '어제';
  return diff + '일 전';
}
function uid(){ return 'w_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---------- schedule chooser (shared) ---------- */
function confirmSchedule(unit, n){
  if(!n || n <= 0) return;
  const today = todayStr();
  const reappearDate = computeReappear(today, unit, n);

  if(STATE.scheduleContext === 'new'){
    const worry = {
      id: uid(),
      text: STATE.pendingNewWorryText,
      createdDate: today,
      reappearDate: reappearDate,
      history: [],
      resolved: false,
      resolvedDate: null,
      resolvedNote: null
    };
    DATA.worries.push(worry);
    save();
    STATE.pendingNewWorryText = null;
    advanceToDue();
  } else if(STATE.scheduleContext === 'unresolve'){
    const w = DATA.worries.find(w => w.id === STATE.currentDetailId);
    w.history.push({ date: today, note: STATE.pendingUnresolveNote });
    w.reappearDate = reappearDate;
    save();
    STATE.pendingUnresolveNote = null;
    STATE.currentDueQueue = STATE.currentDueQueue.filter(id => id !== STATE.currentDetailId);
    STATE.currentDetailId = null;
    if(STATE.currentDueQueue.length > 0){ STATE.screen = 'dueList'; render(); }
    else { finishRitual(); render(); }
  }
}

/* ---------- usage log → AI prompt ---------- */
const RETAIN_DAYS = 30;

function pruneSessions(){
  const cutoff = Date.now() - RETAIN_DAYS * 86400000;
  const before = DATA.sessions.length;
  DATA.sessions = DATA.sessions.filter(s => s.startedAt >= cutoff);
  if(DATA.sessions.length !== before) save();
}

function weeklyBuckets(){
  const now = Date.now(), day = 86400000;
  const ranges = [
    { label: '최근 7일', from: 0,  to: 7  },
    { label: '8–14일 전',  from: 7,  to: 14 },
    { label: '15–21일 전', from: 14, to: 21 },
    { label: '22–30일 전', from: 21, to: 30 }
  ];
  return ranges.map(r => {
    const items = DATA.sessions.filter(s => {
      const age = now - s.startedAt;
      return age >= r.from * day && age < r.to * day;
    });
    return {
      label: r.label,
      count: items.length,
      minutes: items.reduce((a,b) => a + b.minutes, 0),
      ego: items.filter(s => s.egoSearch).length,
      off: items.filter(s => s.onTarget === 'off' || s.onTarget === 'partly').length
    };
  });
}

function trendSentence(buckets){
  const cur = buckets[0], prev = buckets[1];
  if(!prev.count) return '비교할 지난주 기록이 아직 없어요.';
  const diff = cur.minutes - prev.minutes;
  if(diff === 0) return '지난주와 사용 시간이 같아요.';
  return diff > 0
    ? '지난주보다 ' + formatMinutes(diff) + ' 늘었어요.'
    : '지난주보다 ' + formatMinutes(-diff) + ' 줄었어요.';
}

function buildUsagePrompt(){
  const sessions = DATA.sessions.slice().sort((a,b) => a.startedAt - b.startedAt);
  if(!sessions.length) return '';

  const totalMin = sessions.reduce((s,x) => s + x.minutes, 0);
  const days = new Set(sessions.map(s => s.date)).size;
  const avgPerSession = Math.round(totalMin / sessions.length);
  const egoCount = sessions.filter(s => s.egoSearch).length;
  const egoPct = Math.round(egoCount / sessions.length * 100);
  const offCount = sessions.filter(s => s.onTarget === 'off' || s.onTarget === 'partly').length;

  const summary = [
    '- 보관 기간: 최근 ' + RETAIN_DAYS + '일 (그 이전 기록은 자동 삭제됨)',
    '- 기록된 세션 수: ' + sessions.length + '회',
    '- 기록된 날짜 수: ' + days + '일',
    '- 총 사용 시간: ' + formatMinutes(totalMin),
    '- 세션당 평균: ' + formatMinutes(avgPerSession),
    '- 목표에서 벗어난 세션: ' + offCount + '회',
    '- 에고서치를 한 세션: ' + egoCount + '회 (전체의 ' + egoPct + '%)',
    '',
    '[주별 추세]',
    weeklyBuckets().map(b =>
      '- ' + b.label + ': ' + b.count + '회 · ' + formatMinutes(b.minutes)
      + ' · 목표이탈 ' + b.off + '회 · 에고서치 ' + b.ego + '회'
    ).join('\n')
  ].join('\n');

  const lines = sessions.map(s => {
    const d = new Date(s.startedAt);
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    let line = '- ' + s.date + ' ' + hh + ':' + mm + ' 시작 · ' + formatMinutes(s.minutes)
      + ' · 목적: ' + s.purpose;
    if(s.onTarget) line += ' · 점검: ' + (TARGET_LABELS[s.onTarget] || s.onTarget);
    line += ' · 에고서치: ' + (s.egoSearch ? '함' : '안 함');
    if(s.note) line += ' · 메모: ' + s.note;
    return line;
  }).join('\n');

  const tpl = DATA.settings.promptTemplate || DEFAULT_PROMPT_TEMPLATE;
  return tpl.split('{{요약}}').join(summary).split('{{기록}}').join(lines);
}

function mergeImport(imported){
  if(!imported || !Array.isArray(imported.worries)) throw new Error('bad file');
  const map = new Map(DATA.worries.map(w => [w.id, w]));
  function richer(a,b){
    if(a.resolved !== b.resolved) return a.resolved ? a : b;
    return (a.history||[]).length >= (b.history||[]).length ? a : b;
  }
  imported.worries.forEach(iw => {
    const existing = map.get(iw.id);
    map.set(iw.id, existing ? richer(existing, iw) : iw);
  });
  DATA.worries = Array.from(map.values());

  if(Array.isArray(imported.schedules)){
    const smap = new Map(DATA.schedules.map(s => [s.id, s]));
    imported.schedules.forEach(is => { if(!smap.has(is.id)) smap.set(is.id, is); });
    DATA.schedules = Array.from(smap.values());
  }

  if(Array.isArray(imported.sessions)){
    const semap = new Map(DATA.sessions.map(s => [s.id, s]));
    imported.sessions.forEach(is => { if(!semap.has(is.id)) semap.set(is.id, is); });
    DATA.sessions = Array.from(semap.values());
    const cutoff = Date.now() - RETAIN_DAYS * 86400000;
    DATA.sessions = DATA.sessions.filter(s => s.startedAt >= cutoff);
  }

  if(!DATA.settings.startUrl && imported.settings && imported.settings.startUrl){
    DATA.settings.startUrl = imported.settings.startUrl;
  }
  if(imported.settings && imported.settings.promptTemplate
     && (!DATA.settings.promptTemplate || DATA.settings.promptTemplate === DEFAULT_PROMPT_TEMPLATE)){
    DATA.settings.promptTemplate = imported.settings.promptTemplate;
  }
  save();
  init();
}

  }

  else if(STATE.screen === 'detail'){
    const w = DATA.worries.find(x => x.id === STATE.currentDetailId);
    const history = w.history.map(h => `
      <div class="history-item">
        <div class="h-date">${esc(formatDateKR(h.date))}</div>
        <div>${nl2br(h.note)}</div>
      </div>`).join('');
    html = topBar() + `<main>
      <div class="back-row"><button class="back-link" onclick="backToDueList()">← 목록으로</button></div>
      <div class="detail-date">${esc(formatDateKR(w.createdDate))}에 맡김</div>
      <div class="detail-text">${nl2br(w.text)}</div>
      ${history ? `<div class="history-title">그동안 남긴 것</div>${history}` : ''}
      <div class="btn-row" style="margin-top:22px;">
        <button class="btn secondary" onclick="markUnresolved()">아직이에요</button>
        <button class="btn accent" onclick="markResolved()">실현됐어요</button>
      </div>
    </main>`;
  }

  else if(STATE.screen === 'resolveForm'){
    html = topBar() + `<main>
      <h1 class="q">어떻게 실현됐나요?</h1>
      <p class="sub">적은 대로 일어난 일을 기록해두세요.</p>
      <textarea id="resolveInput" placeholder="무엇이 어떻게 이루어졌는지 적어보세요…" autofocus
        oninput="document.getElementById('resolveBtn').disabled = !this.value.trim();"></textarea>
      <button class="btn accent full" id="resolveBtn" disabled style="margin-top:18px;" onclick="submitResolve()">실현 · 기록에 남기기</button>
    </main>`;
  }

  else if(STATE.screen === 'unresolveForm'){
    html = topBar() + `<main>
      <div class="eyebrow">${esc(formatDateKR(todayStr()))}</div>
      <h1 class="q">지금은 어디까지 왔나요?</h1>
      <p class="sub">오늘 날짜로 남겨두고, 다시 맡길 시간을 정할 거예요.</p>
      <textarea id="unresolveInput" placeholder="지금 상태를 적어보세요…" autofocus
        oninput="document.getElementById('unresolveBtn').disabled = !this.value.trim();"></textarea>
      <button class="btn primary full" id="unresolveBtn" disabled style="margin-top:18px;" onclick="submitUnresolve()">다음</button>
    </main>`;
  }

  else if(STATE.screen === 'unresolveSchedule'){
    html = topBar() + `<main>
      ${scheduleChooserHTML('언제 다시 확인해볼까요?')}
    </main>`;
  }

  else if(STATE.screen === 'unlocked'){
    html = topBar() + `<main>
      <div class="unlocked-title">오늘의 기록을 마쳤어요</div>
      <button class="btn accent full" onclick="startInternetFlow()" style="padding:16px; font-size:16px; margin-top:14px;">🌐 인터넷 열기</button>
      <div class="settings-actions">
        <button class="btn ghost" onclick="startAddPlan()">+ 일정 추가</button>
        <button class="btn ghost" onclick="openArchive()">지난 기록 보기</button>
      </div>
    </main>`;
  }

  else if(STATE.screen === 'internetPurpose'){
    html = topBar() + `<main>
      <div class="eyebrow">인터넷을 열기 전에</div>
      <h1 class="q">지금 무엇을 하려고 하나요?</h1>
      <p class="sub">어떤 상황에서, 어떤 목적으로 인터넷을 쓰려는지 적어주세요.</p>
      <textarea id="purposeInput" placeholder="예: 원고에 필요한 자료를 찾으려고" autofocus
        oninput="document.getElementById('beginBtn').disabled = !this.value.trim();"></textarea>
      <div class="btn-row">
        <button class="btn secondary" onclick="cancelInternetFlow()">취소</button>
        <button class="btn accent" id="beginBtn" disabled onclick="beginSession()">열기</button>
      </div>
    </main>`;
  }

  else if(STATE.screen === 'browsing'){
    const s = DATA.activeSession;
    if(!s){ STATE.screen = 'newWorryPrompt'; return render(); }
    const started = new Date(s.startedAt);
    const hh = String(started.getHours()).padStart(2,'0');
    const mm = String(started.getMinutes()).padStart(2,'0');
    html = topBar() + `<main>
      <div class="browsing-wrap">
        <div class="browsing-label">인터넷 사용 중</div>
        <div class="browsing-purpose">${nl2br(s.purpose)}</div>
        <div class="browsing-elapsed">
          ${hh}:${mm} 시작 · <strong id="elapsedLabel">${esc(formatMinutes(elapsedMinutesNow()))}</strong> 지남
        </div>
      </div>
      <button class="btn primary full" onclick="endSession()" style="padding:16px; font-size:16px;">인터넷 끝</button>
      <div class="settings-actions">
        <button class="btn ghost" onclick="reopenInternet()">창을 닫았다면 다시 열기</button>
      </div>
    </main>`;
  }

  else if(STATE.screen === 'sessionReview'){
    const s = DATA.activeSession;
    const r = STATE.review;
    if(!s || !r){ return init(); }
    html = topBar() + `<main>
      <div class="eyebrow">인터넷 사용을 마치며</div>
      <h1 class="q">목표대로 사용했나요?</h1>
      <p class="sub">${esc(formatMinutes(r.minutes))} 사용했어요. 처음에 적은 목적과 비교해보세요.</p>

      <div class="field-label" style="margin-top:0;">처음에 적은 목적</div>
      <div class="review-purpose">${nl2br(s.purpose)}</div>

      <div class="field-label">점검</div>
      <div class="opt-row">
        <div class="opt" onclick="pickTarget(this,'kept')">목표대로 함</div>
        <div class="opt" onclick="pickTarget(this,'partly')">조금 벗어남</div>
        <div class="opt" onclick="pickTarget(this,'off')">많이 벗어남</div>
      </div>

      <div class="field-label">에고서치</div>
      <label class="check-row">
        <input type="checkbox" onchange="toggleEgo(this)">
        <span>
          <span class="c-text">검색 중 에고서치를 했어요</span>
          <span class="c-sub">내 이름, 내 책, 내 글에 대한 반응을 찾아본 경우</span>
        </span>
      </label>

      <div class="field-label">실제로 무엇을 했나요 (선택)</div>
      <textarea id="reviewNote" style="min-height:90px;" placeholder="목적에서 벗어났다면 무엇을 하다 그렇게 됐는지 적어두면 나중에 도움이 돼요"></textarea>

      <div class="btn-row">
        <button class="btn secondary" onclick="backToBrowsing()">더 쓸게요</button>
        <button class="btn primary" id="reviewSaveBtn" disabled onclick="saveSessionReview()">기록하고 끝내기</button>
      </div>
    </main>`;
  }

  else if(STATE.screen === 'promptEdit'){
    html = topBar() + `<main>
      <div class="back-row"><button class="back-link" onclick="cancelPromptEdit()">← 돌아가기</button></div>
      <h1 class="q" style="font-size:20px;">프롬프트 편집</h1>
      <div class="ph-hint">
        <code>{{요약}}</code> 자리에 통계가, <code>{{기록}}</code> 자리에 개별 기록이 자동으로 채워져요.
        두 표시를 남겨두면 프롬프트를 복사할 때마다 최신 기록이 들어가요.
      </div>
      <textarea id="templateArea" spellcheck="false">${esc(DATA.settings.promptTemplate || DEFAULT_PROMPT_TEMPLATE)}</textarea>
      <div class="btn-row">
        <button class="btn secondary" onclick="resetPromptTemplate()">기본값</button>
        <button class="btn primary" onclick="savePromptTemplate()">저장</button>
      </div>
    </main>`;
  }

  else if(STATE.screen === 'planForm'){
    html = topBar() + `<main>
      <div class="back-row"><button class="back-link" onclick="cancelPlan()">← 돌아가기</button></div>
      <h1 class="q" style="font-size:20px;">일정 추가</h1>
      <p class="sub">다가오는 일정을 적어두면, 초기 화면에서 날짜순으로 보여드려요.</p>
      <div class="field-label">날짜</div>
      <input class="text-input" type="date" id="planDateInput" value="${todayStr()}" onchange="checkPlanValid()">
      <div class="field-label">내용</div>
      <input class="text-input" type="text" id="planContentInput" placeholder="어떤 일정인가요?" oninput="checkPlanValid()" autofocus>
      <button class="btn primary full" id="planSubmitBtn" disabled style="margin-top:22px;" onclick="submitPlan()">추가</button>
    </main>`;
  }

  else if(STATE.screen === 'archive'){
    const resolved = DATA.worries.filter(w => w.resolved).sort((a,b) => (b.resolvedDate||'').localeCompare(a.resolvedDate||''));
    const waiting = DATA.worries.filter(w => !w.resolved).sort((a,b) => a.reappearDate.localeCompare(b.reappearDate));
    let list = '';
    if(STATE.archiveTab === 'resolved'){
      list = resolved.length ? resolved.map(w => `
        <div class="worry-card" style="cursor:default;">
          <div class="preview" style="-webkit-line-clamp:3;">${nl2br(w.text)}</div>
          <div class="history-item" style="margin-top:10px;">
            <div class="h-date">${esc(formatDateKR(w.resolvedDate))} 실현</div>
            <div>${nl2br(w.resolvedNote || '')}</div>
          </div>
        </div>`).join('') : `<div class="empty">아직 실현으로 기록한 것이 없어요.</div>`;
    } else if(STATE.archiveTab === 'waiting'){
      list = waiting.length ? waiting.map(w => `
        <div class="worry-card" style="cursor:default;">
          <div class="preview">${nl2br(w.text)}</div>
          <div class="meta">
            <span>${esc(formatDateKR(w.reappearDate))} 확인 예정</span>
            ${w.history.length ? `<span>${w.history.length}번 다시 맡김</span>` : ''}
          </div>
        </div>`).join('') : `<div class="empty">맡겨둔 것이 없어요.</div>`;
    } else {
      const sessions = DATA.sessions.slice().sort((a,b) => b.startedAt - a.startedAt);
      if(!sessions.length){
        list = `<div class="empty">아직 인터넷 사용 기록이 없어요.<br>인터넷을 열고 닫을 때마다 여기에 쌓여요.</div>`;
      } else {
        const totalMin = sessions.reduce((s,x) => s + x.minutes, 0);
        const days = new Set(sessions.map(s => s.date)).size;
        const avg = Math.round(totalMin / sessions.length);
        const egoCount = sessions.filter(s => s.egoSearch).length;
        const buckets = weeklyBuckets();
        const maxMin = Math.max.apply(null, buckets.map(b => b.minutes).concat([1]));

        const trendRows = buckets.map((b,i) => `
          <div class="trend-row">
            <span class="t-label">${esc(b.label)}</span>
            <span class="t-bar-wrap"><span class="t-bar${i===0?' cur':''}" style="width:${Math.round(b.minutes/maxMin*100)}%"></span></span>
            <span class="t-val">${b.count}회 ${esc(formatMinutes(b.minutes))}</span>
          </div>`).join('');

        const items = sessions.map(s => {
          const d = new Date(s.startedAt);
          const hh = String(d.getHours()).padStart(2,'0');
          const mm = String(d.getMinutes()).padStart(2,'0');
          const tags = [];
          if(s.onTarget) tags.push(TARGET_LABELS[s.onTarget] || s.onTarget);
          if(s.egoSearch) tags.push('에고서치');
          return `<div class="session-item">
            <div class="s-body">
              <div class="s-meta">${esc(formatDateKR(s.date))} ${hh}:${mm} · <b>${esc(formatMinutes(s.minutes))}</b>${tags.length ? ' · ' + esc(tags.join(' · ')) : ''}</div>
              <div class="s-purpose">${nl2br(s.purpose)}</div>
              ${s.note ? `<div class="s-meta" style="margin-top:5px;">→ ${nl2br(s.note)}</div>` : ''}
            </div>
            <button class="s-del" onclick="deleteSession('${s.id}')" title="삭제">×</button>
          </div>`;
        }).join('');

        list = `
          <div class="stat-row">
            <div class="stat-box"><div class="s-num">${sessions.length}회</div><div class="s-cap">사용 횟수</div></div>
            <div class="stat-box"><div class="s-num">${esc(formatMinutes(totalMin))}</div><div class="s-cap">총 시간</div></div>
            <div class="stat-box"><div class="s-num">${esc(formatMinutes(avg))}</div><div class="s-cap">평균</div></div>
            <div class="stat-box"><div class="s-num">${egoCount}회</div><div class="s-cap">에고서치</div></div>
          </div>

          <div class="upcoming-title">주별 추세</div>
          <div class="trend-note">${esc(trendSentence(buckets))}</div>
          ${trendRows}

          <button class="fold" onclick="toggleSessions()">
            <span>기록 ${sessions.length}개 · ${days}일간</span>
            <span class="f-arrow">${STATE.sessionsOpen ? '접기 ▲' : '펼치기 ▼'}</span>
          </button>
          ${STATE.sessionsOpen ? items : ''}

          <button class="fold" onclick="togglePrompt()">
            <span>AI에게 물어볼 프롬프트</span>
            <span class="f-arrow">${STATE.promptOpen ? '접기 ▲' : '펼치기 ▼'}</span>
          </button>
          ${STATE.promptOpen ? `
            <p class="sub" style="margin:10px 0;">복사해서 AI에게 붙여넣으면 추세와 패턴을 분석해줘요. 질문 내용은 편집할 수 있어요.</p>
            <textarea id="promptArea" readonly>${esc(buildUsagePrompt())}</textarea>
            <div class="btn-row" style="margin-top:10px;">
              <button class="btn secondary" onclick="openPromptEdit()">프롬프트 편집</button>
              <button class="btn primary" onclick="copyUsagePrompt()">복사하기</button>
            </div>` : `
            <div class="btn-row" style="margin-top:10px;">
              <button class="btn secondary" onclick="openPromptEdit()">프롬프트 편집</button>
              <button class="btn primary" onclick="copyUsagePrompt()">복사하기</button>
            </div>`}

          <p class="fold-note">기록은 최근 ${RETAIN_DAYS}일치만 보관하고, 그보다 오래된 것은 자동으로 지워져요.</p>
        `;
      }
    }
    html = topBar() + `<main>
      <div class="back-row"><button class="back-link" onclick="closeArchive()">← 돌아가기</button></div>
      <div class="archive-tabs">
        <div class="archive-tab ${STATE.archiveTab==='resolved'?'active':''}" onclick="switchArchiveTab('resolved')">실현 (${resolved.length})</div>
        <div class="archive-tab ${STATE.archiveTab==='waiting'?'active':''}" onclick="switchArchiveTab('waiting')">맡겨둠 (${waiting.length})</div>
        <div class="archive-tab ${STATE.archiveTab==='internet'?'active':''}" onclick="switchArchiveTab('internet')">인터넷 (${DATA.sessions.length})</div>
      </div>
      ${list}
    </main>`;
  }

  else if(STATE.screen === 'settings'){
    html = topBar() + `<main>
      <div class="back-row"><button class="back-link" onclick="closeSettings()">← 돌아가기</button></div>
      <h1 class="q" style="font-size:20px;">설정</h1>

      <div class="field-label">인터넷 열기 버튼이 열 페이지 주소</div>
      <input class="text-input" id="startUrlInput" type="url" value="${esc(DATA.settings.startUrl || '')}"
        placeholder="https://..." onchange="updateStartUrl(this)">

      <div class="field-label">기기 간 데이터 공유</div>
      <p class="sub" style="margin-bottom:14px;">맥과 아이폰의 저장공간은 서로 자동으로 연결되지 않아요. 내보내기한 파일을 에어드랍이나 아이클라우드 드라이브로 옮긴 뒤, 다른 기기에서 가져오기 해주세요.</p>
      <div class="settings-actions" style="margin-top:0;">
        <button class="btn secondary" onclick="exportData()">내보내기 (백업 파일 저장)</button>
        <button class="btn secondary" onclick="triggerImport()">가져오기 (백업 파일 불러오기)</button>
      </div>

      <div class="field-label">전체 지우기</div>
      <p class="sub" style="margin-bottom:14px;">맡겨둔 것과 인터넷 기록을 모두 지우고 처음 상태로 되돌려요. 되돌릴 수 없으니 먼저 내보내기로 백업해두세요.</p>
      <button class="btn danger full" onclick="resetAllData()">모든 기록 지우기</button>
    </main>`;
  }

  else {
    html = `<main><div class="empty">불러오는 중…</div></main>`;
  }

  app.innerHTML = html;
  if(STATE.screen === 'browsing') startElapsedTimer();
}
</script>
</body>
</html>
