<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>초안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#efe9dc;
  --plank:#f7f4ec;
  --ink:#221f1c;
  --muted:#7d766c;
  --faint:#a49c90;
  --rule:#d8cfbd;
  --rule-soft:#e5ddcd;
  --seal:#a33b2c;
  --ok:#4a6b52;
  --hold:#8a7a45;
  --r:3px;
  --serif:'Noto Serif KR',serif;
  --display:'Gowun Batang','Noto Serif KR',serif;
  --util:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--serif);
  font-size:15px;
  line-height:1.7;
  -webkit-text-size-adjust:100%;
  padding-bottom:64px;
}
#app{max-width:720px;margin:0 auto;padding:0 24px}

/* ── utility type ── */
.u{font-family:var(--util);font-size:11px;letter-spacing:.09em;color:var(--muted)}
.u-b{font-family:var(--util);font-size:11px;letter-spacing:.09em}
button{font-family:var(--util);color:var(--ink);background:none;border:none;padding:0;cursor:pointer;font-size:12px}
input,textarea,select{font-family:var(--serif);font-size:15px;color:var(--ink);background:#fdfbf6;border:1px solid var(--rule);border-radius:var(--r);padding:9px 10px;width:100%;line-height:1.6}
textarea{resize:vertical;min-height:80px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--seal);outline-offset:-1px;border-color:transparent}
button:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
label.f{display:block;margin:14px 0 0}
label.f > .u{display:block;margin-bottom:5px}

/* ── masthead ── */
.mast{display:flex;align-items:baseline;gap:10px;padding:22px 0 10px;border-bottom:1px solid var(--ink)}
.mast h1{font-family:var(--display);font-weight:700;font-size:23px;margin:0;letter-spacing:.22em;text-indent:.22em}
.mast .sp{flex:1}
.mast button{color:var(--muted)}
.projbar{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--rule)}
.projbar select{border:none;background:none;padding:2px 0;width:auto;max-width:52%;font-family:var(--display);font-size:16px;font-weight:700;border-radius:0}
.tally{margin-left:auto;display:flex;align-items:baseline;gap:2px;font-family:var(--util)}
.tally b{font-family:var(--display);font-size:20px;font-weight:700;color:var(--seal);letter-spacing:0}
.tally span{font-size:11px;color:var(--muted);letter-spacing:.06em}

/* ── panels ── */
.panel{border-bottom:1px solid var(--rule)}
.phead{display:flex;align-items:center;gap:8px;padding:13px 0;cursor:pointer}
.phead h2{font-family:var(--display);font-size:14px;font-weight:700;margin:0;letter-spacing:.16em}
.phead .cnt{margin-left:auto;font-family:var(--util);font-size:11px;color:var(--faint);letter-spacing:.06em}
.caret{width:9px;height:9px;border-right:1.5px solid var(--faint);border-bottom:1.5px solid var(--faint);transform:rotate(45deg);transition:transform .18s;flex:0 0 auto;margin-bottom:3px}
.open > .phead .caret{transform:rotate(225deg);margin-bottom:0;margin-top:3px}
.pbody{display:none;padding:0 0 20px}
.open > .pbody{display:block}

/* ── plot spine (signature) ── */
.spine{position:relative;padding-left:26px}
.spine:before{content:'';position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--rule)}
.station{position:relative;padding:0 0 16px}
.station:before{content:'';position:absolute;left:-25px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--faint)}
.station.turn:before{border-color:var(--seal);background:var(--seal)}
.sthead{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.station.turn .u{color:var(--seal)}
.station .txt{font-size:14.5px;white-space:pre-wrap;color:var(--ink);min-height:1.7em}
.station .txt.empty{color:var(--faint)}
button.lk{font-size:11px;color:var(--faint);line-height:1}
.card button.lk{font-size:13px;padding:2px 4px;align-self:center}

/* ── character cards ── */
.chars{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.card{background:var(--plank);border:1px solid var(--rule-soft);border-radius:var(--r);padding:10px 12px}
.card .nm{display:flex;align-items:baseline;gap:9px}
button.who{font-family:var(--display);font-weight:700;font-size:16px;display:flex;align-items:baseline;gap:7px;line-height:1.4}
.card .age{font-family:var(--util);font-size:11.5px;letter-spacing:.05em;color:var(--muted)}
.card .role{font-family:var(--util);font-size:10.5px;letter-spacing:.06em;color:var(--seal);border:1px solid #e0c4be;border-radius:2px;padding:1px 5px}
.card .sp{flex:1}
.card .caret.sm{width:7px;height:7px;border-width:1.2px;margin-bottom:4px}
.card.exp .caret.sm{transform:rotate(225deg);margin-bottom:0;margin-top:3px}
.card dl{display:none;margin:10px 0 0;grid-template-columns:74px 1fr;gap:5px 10px;font-size:14px;border-top:1px solid var(--rule-soft);padding-top:10px}
.card.exp dl{display:grid}
.card dt{font-family:var(--util);font-size:11px;letter-spacing:.06em;color:var(--muted);padding-top:3px}
.card dd{margin:0;white-space:pre-wrap}
.card dd.empty{color:var(--faint)}
.card .acts{display:none}
.card.exp .acts{display:flex}
.cnts{font-family:var(--util);font-size:11.5px;letter-spacing:.06em;color:var(--faint);margin-right:2px}
.row3{display:grid;grid-template-columns:1.4fr .7fr 1.4fr;gap:10px}

/* ── 인물 고르기 ── */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:32px;margin-bottom:8px}
.chip{border:1px solid var(--rule);background:#fdfbf6;border-radius:14px;padding:4px 12px;font-size:12.5px;letter-spacing:.03em;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.addrow button{white-space:nowrap;color:var(--seal);font-weight:600;border:1px solid var(--rule);border-radius:var(--r);padding:0 13px}
@media (hover:hover){
  .chip:hover{border-color:var(--faint);color:var(--ink)}
  .chip.on:hover{background:var(--seal);border-color:var(--seal);color:var(--paper)}
  .addrow button:hover{border-color:var(--seal)}
}

/* ── draft folder header ── */
.folder{display:flex;align-items:center;gap:10px;padding:16px 0 14px;border-bottom:1px solid var(--rule)}
.folder .tab{flex:0 0 auto;width:26px;height:20px;border:1px solid var(--faint);border-radius:1px 4px 1px 1px;position:relative}
.folder .tab:before{content:'';position:absolute;left:3px;right:3px;top:-4px;height:4px;border:1px solid var(--faint);border-bottom:none;border-radius:2px 2px 0 0}
.folder .nm{font-family:var(--display);font-size:15px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder a.nm{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--seal);padding-bottom:1px}
.folder .nolink{color:var(--faint);font-family:var(--util);font-size:11.5px;letter-spacing:.06em}

/* ── toolbar ── */
.tools{display:flex;align-items:center;gap:14px;padding:12px 0}
.tools .sp{flex:1}
.tools button{color:var(--muted)}
.tools button.pri{color:var(--seal);font-weight:600}

/* ── floors (signature stack) ── */
.stack{display:flex;flex-direction:column;gap:9px;padding-bottom:8px}
.floor{background:var(--plank);border:1px solid var(--rule-soft);border-left:3px solid var(--faint);border-radius:0 var(--r) var(--r) 0;padding:11px 13px 10px}
.floor.done{border-left-color:var(--ok)}
.floor.hold{border-left-color:var(--hold);opacity:.72}
.floor.wip{border-left-color:var(--seal)}
.floor.sel{outline:2px solid var(--seal);outline-offset:1px}
.frow1{display:flex;align-items:baseline;gap:8px}
.meta{font-family:var(--util);font-size:11px;letter-spacing:.05em;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta em{font-style:normal;color:var(--ink)}
.mae{font-family:var(--display);font-size:13px;font-weight:700;color:var(--faint);flex:0 0 auto;letter-spacing:0}
.floor.done .mae,.floor.wip .mae{color:var(--ink)}
.desc{margin:5px 0 0;font-size:14.5px;line-height:1.65;white-space:pre-wrap}
.desc.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc.empty{color:var(--faint)}
.kinds{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.kinds button{border:1px solid var(--rule);background:#fdfbf6;border-radius:var(--r);padding:5px 10px;font-size:12px;letter-spacing:.04em}
.kinds button:active{background:var(--rule-soft)}
.kinds button.fin{margin-left:auto;border-color:var(--seal);color:var(--seal);font-weight:600}
.more{display:none;margin-top:11px;padding-top:11px;border-top:1px solid var(--rule-soft)}
.floor.exp .more{display:block}
.more dl{margin:0;display:grid;grid-template-columns:58px 1fr;gap:4px 10px;font-size:14px}
.more dt{font-family:var(--util);font-size:11px;letter-spacing:.06em;color:var(--muted);padding-top:3px}
.more dd{margin:0;white-space:pre-wrap;min-width:0;word-break:break-all}
.more dd.empty{color:var(--faint)}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.acts button{color:var(--muted);font-size:11.5px;letter-spacing:.06em}
.acts button.del{color:var(--seal)}
.log{margin-top:12px;border-top:1px solid var(--rule-soft);padding-top:10px}
.log > .u{display:block;margin-bottom:7px}
.logitem{display:flex;gap:9px;padding:5px 0;border-bottom:1px dotted var(--rule);font-size:14px}
.logitem:last-child{border-bottom:none}
.logitem .k{flex:0 0 auto;font-family:var(--util);font-size:10.5px;letter-spacing:.06em;color:var(--seal);border:1px solid var(--rule);border-radius:2px;padding:1px 5px;height:19px;line-height:17px;margin-top:2px}
.logitem .t{flex:1;white-space:pre-wrap}
.logitem .d{flex:0 0 auto;font-family:var(--util);font-size:10px;color:var(--faint)}
.logitem button{color:var(--faint);font-size:14px;line-height:1}
.chk{flex:0 0 auto;width:17px;height:17px;border:1px solid var(--faint);border-radius:2px;margin-right:2px;position:relative;background:#fdfbf6}
.floor.sel .chk{background:var(--seal);border-color:var(--seal)}
.floor.sel .chk:after{content:'';position:absolute;left:4px;top:1px;width:6px;height:10px;border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(40deg)}
.status{flex:0 0 auto;font-family:var(--util);font-size:10.5px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--rule);border-radius:2px;padding:1px 5px}
.floor.wip .status{color:var(--seal);border-color:#e0c4be}
.floor.done .status{color:var(--ok);border-color:#c9d6cb}
.floor.hold .status{color:var(--hold)}

/* ── empty states ── */
.empty-state{padding:38px 4px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.9}
.empty-state b{display:block;font-family:var(--display);font-size:17px;color:var(--ink);font-weight:700;margin-bottom:6px}
.empty-state button{color:var(--seal);font-weight:600;font-size:13px;margin-top:10px;border-bottom:1px solid var(--seal);padding-bottom:1px}

/* ── modal ── */
.veil{position:fixed;inset:0;background:rgba(34,31,28,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.sheet{background:var(--paper);width:100%;max-width:600px;max-height:86vh;overflow-y:auto;border-radius:5px;padding:24px 24px 22px;box-shadow:0 14px 44px rgba(34,31,28,.26);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(10px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.caret{transition:none}}

/* ── 마우스 어포던스 ── */
@media (hover:hover){
  .kinds button:hover{background:var(--rule-soft);border-color:var(--faint)}
  .kinds button.fin:hover{background:var(--seal);color:var(--paper)}
  .acts button:hover,.tools button:hover,.mast button:hover,.foot button:hover{color:var(--ink)}
  .acts button.del:hover{color:var(--seal);text-decoration:underline}
  .station:hover .txt.empty{color:var(--muted)}
  .station:hover .u{color:var(--ink)}
  .floor:hover{border-color:var(--rule)}
  .sbtns .go:hover{background:var(--seal)}
  .card .nm button:hover{color:var(--ink)}
  button.who:hover{color:var(--seal)}
  button.lk:hover{color:var(--seal)}
  .logitem button:hover{color:var(--seal)}
}
.station{cursor:pointer}
.meta,.desc{cursor:pointer}
.sheet h3{font-family:var(--display);font-size:18px;font-weight:700;margin:0 0 3px;letter-spacing:.04em}
.sheet .sub{font-family:var(--util);font-size:11.5px;color:var(--muted);letter-spacing:.05em;margin-bottom:14px}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet input:not([type=file]),.sheet select{height:40px;padding:0 11px;line-height:1.2}
.sheet select{-webkit-appearance:none;appearance:none;padding-right:32px;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 10 7'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%237d766c' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center}
.sbtns{display:flex;gap:10px;margin-top:20px;align-items:center}
.sbtns .sp{flex:1}
.sbtns button{font-size:13px;letter-spacing:.06em;padding:10px 16px;border-radius:var(--r)}
.sbtns .go{background:var(--ink);color:var(--paper);font-weight:600}
.sbtns .cx{color:var(--muted)}
.hint{font-family:var(--util);font-size:11.5px;line-height:1.75;color:var(--muted);background:var(--plank);border:1px solid var(--rule-soft);border-radius:var(--r);padding:10px 11px;margin-top:14px}
.hint b{color:var(--ink)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;background:#fdfbf6;border:1px solid var(--rule);border-radius:var(--r);padding:10px;max-height:38vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:var(--util);font-size:12.5px;letter-spacing:.05em;padding:10px 18px;border-radius:20px;z-index:80;box-shadow:0 4px 18px rgba(0,0,0,.22)}
.foot{padding:26px 0 10px;text-align:center}
.foot button{color:var(--faint);font-size:11px;letter-spacing:.08em;margin:0 9px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ═══════════════ 상수 ═══════════════ */
const KEY='chodan.v1';
const KINDS=['대화','묘사','이벤트','독백','기능'];
const PLOT=[
  {k:'p1',    n:'1',              turn:false},
  {k:'bridge',n:'돌아올 수 없는 다리',turn:true},
  {k:'p2a',   n:'2-1',            turn:false},
  {k:'abyss', n:'가장 깊은 심연',   turn:true},
  {k:'p2b',   n:'2-2',            turn:false},
  {k:'face',  n:'다시 직면하기・에피파니', turn:true},
  {k:'p3',    n:'3',              turn:false}
];
const ROLES=['주인공','대적자','섭동자','그림자','조력자'];
const CF=[
  {k:'wants', n:'원하는 것'},
  {k:'fears', n:'두려워하는 것'},
  {k:'anta',  n:'대적자'},
  {k:'shadow',n:'그림자'},
  {k:'pert',  n:'섭동자'}
];
const STATUS=['진행중','완료','보류'];
const SCLS={'진행중':'wip','완료':'done','보류':'hold'};
const PER=200; // 1매 = 공백 포함 200자

/* ═══════════════ 상태 ═══════════════ */
let db=load();
function freshUI(){return {dash:false,cast:false,exp:{},cexp:{},selMode:false,sel:{}};}
let ui=freshUI();

function load(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.projects)return migrate(d);}}catch(e){}
  return {v:2,projects:[],currentId:null};
}
function migrate(d){
  (d.projects||[]).forEach(p=>{
    p.plot=p.plot||{};
    if(p.plot.p2!==undefined){p.plot.p2a=p.plot.p2;delete p.plot.p2;}   // 2부 → 2-1
    p.plotLinks=p.plotLinks||{};
    PLOT.forEach(x=>{if(p.plot[x.k]===undefined)p.plot[x.k]='';if(p.plotLinks[x.k]===undefined)p.plotLinks[x.k]='';});
    p.chars=p.chars||[];
    p.chars.forEach(c=>['age','job','role','link'].forEach(k=>{if(c[k]===undefined)c[k]='';}));
    p.floors=p.floors||[];
  });
  d.v=2;
  return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('저장 공간이 꽉 찼습니다. 백업 후 정리하세요');}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function now(){return Date.now();}
function cur(){return db.projects.find(p=>p.id===db.currentId)||null;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function blankPlot(){const o={};PLOT.forEach(p=>o[p.k]='');return o;}
function mae(c){return Math.round((c||0)/PER*10)/10;}
function fmtMae(c){const m=mae(c);return (Number.isInteger(m)?m:m.toFixed(1))+'매';}
function stamp(t){const d=new Date(t);const p=n=>String(n).padStart(2,'0');return `${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}

function newProject(title){
  const p={id:uid(),title:title||'제목 없는 프로젝트',link:'',folderName:title||'제목 없는 프로젝트',
    plot:blankPlot(),plotLinks:blankPlot(),chars:[],floors:[],createdAt:now()};
  db.projects.unshift(p);db.currentId=p.id;save();return p;
}
function sorted(p){return p.floors.slice().sort((a,b)=>b.touchedAt-a.touchedAt);}
function touch(f){f.touchedAt=now();}

/* ═══════════════ 클립보드 ═══════════════ */
async function copy(text){
  try{
    if(navigator.clipboard&&window.isSecureContext!==false){await navigator.clipboard.writeText(text);return true;}
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=text;ta.style.position='fixed';ta.style.top='-1000px';ta.setAttribute('readonly','');
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
    const ok=document.execCommand('copy');document.body.removeChild(ta);
    if(ok)return true;
  }catch(e){}
  return false;
}
function manualCopy(text,after){
  openSheet(`
    <h3>직접 복사해 주세요</h3>
    <div class="sub">이 브라우저에서 자동 복사가 막혔습니다. 아래 내용을 길게 눌러 전체 선택하세요.</div>
    <div class="mono" id="mtext">${esc(text)}</div>
    <div class="sbtns"><div class="sp"></div><button class="go" data-act="closeAfter">복사했습니다</button></div>`,
    {closeAfter:()=>{closeSheet();if(after)after();}});
  setTimeout(()=>{const el=document.getElementById('mtext');if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}},60);
}
function openLink(url){
  if(!url)return;
  const a=document.createElement('a');a.href=url;a.rel='noopener';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
let tt;
function toast(msg){
  const el=document.getElementById('toast');
  el.innerHTML=`<div class="toast">${esc(msg)}</div>`;
  clearTimeout(tt);tt=setTimeout(()=>el.innerHTML='',2300);
}

/* ═══════════════ 렌더 ═══════════════ */
function render(){
  ui=Object.assign(freshUI(),ui);   /* 상태 키 누락 방어 */
  const p=cur();
  let h='';

  h+=`<div class="mast">
    <h1>초안</h1><div class="sp"></div>
    <button data-act="backup">백업</button>
    <button data-act="restore">복원</button>
  </div>`;

  if(!db.projects.length){
    h+=`<div class="empty-state">
      <b>아직 프로젝트가 없습니다</b>
      바닥을 하나씩 놓아 이야기의 윤곽을 세웁니다.<br>
      먼저 프로젝트를 만드세요.
      <div><button data-act="newProj">프로젝트 만들기</button></div>
    </div>`;
    document.getElementById('app').innerHTML=h;return;
  }

  const total=p?p.floors.reduce((s,f)=>s+(f.count||0),0):0;
  h+=`<div class="projbar">
    <select data-act="switchProj" aria-label="프로젝트">
      ${db.projects.map(x=>`<option value="${x.id}"${x.id===db.currentId?' selected':''}>${esc(x.title)}</option>`).join('')}
    </select>
    <button data-act="projMenu" aria-label="프로젝트 설정">⋯</button>
    <div class="tally"><b>${fmtMae(total).replace('매','')}</b><span>매 · 바닥 ${p.floors.length}</span></div>
  </div>`;

  /* 시놉시스 */
  const filled=PLOT.filter(x=>(p.plot[x.k]||'').trim()).length;
  h+=`<section class="panel${ui.dash?' open':''}">
    <div class="phead" data-act="toggleDash"><div class="caret"></div>
      <h2>시놉시스</h2>
      <div class="cnt">${filled}/${PLOT.length}</div>
    </div>
    <div class="pbody">
      <div class="spine">
        ${PLOT.map(x=>{const v=(p.plot[x.k]||'').trim();const lk=(p.plotLinks&&p.plotLinks[x.k])||'';return `
          <div class="station${x.turn?' turn':''}" data-act="editPlot" data-k="${x.k}" role="button" tabindex="0">
            <div class="sthead"><span class="u">${x.n}</span>${
              lk?`<button class="lk" data-act="openPlotLink" data-k="${x.k}" aria-label="스크리브너에서 열기">↗</button>`:''
            }</div>
            <div class="txt${v?'':' empty'}">${v?esc(v):'무슨 일이 벌어지는지 씁니다'}</div>
          </div>`}).join('')}
      </div>
    </div>
  </section>`;

  /* 인물들 */
  h+=`<section class="panel${ui.cast?' open':''}">
    <div class="phead" data-act="toggleCast"><div class="caret"></div>
      <h2>인물들</h2>
      <div class="cnt">${p.chars.length}</div>
    </div>
    <div class="pbody">
      ${p.chars.length?`<div class="chars">${p.chars.map(c=>charHTML(c)).join('')}</div>`:
        `<div class="empty-state" style="padding:20px 4px">바닥에 쉼표로 인물을 적으면 여기에 자동으로 올라옵니다.</div>`}
      <div class="tools"><button class="pri" data-act="addChar">＋ 인물 추가</button></div>
    </div>
  </section>`;

  /* 초안 폴더 헤더 */
  h+=`<div class="folder">
    <div class="tab"></div>
    ${p.link
      ? `<a class="nm" href="${esc(p.link)}" data-act="openFolder">${esc(p.folderName||p.title)}</a>`
      : `<div class="nm nolink">초안 폴더가 아직 연결되지 않았습니다</div>`}
    <button data-act="editFolder">${p.link?'수정':'연결'}</button>
  </div>`;

  /* 바닥들 */
  const list=sorted(p);
  const selN=list.filter(f=>ui.sel[f.id]).length;
  h+=`<div class="tools">
    <span class="u-b" style="color:var(--ink);font-weight:600">바닥들</span>
    <div class="sp"></div>
    ${ui.selMode
      ? `<button data-act="selAll">${selN===list.length&&list.length?'전체 해제':'전체 선택'}</button>
         <button class="pri" data-act="copySel">${selN}개 복사</button>
         <button data-act="selOff">취소</button>`
      : `<button data-act="selOn">모아 복사</button>
         <button class="pri" data-act="newFloor">＋ 새 바닥</button>`}
  </div>`;

  if(!list.length){
    h+=`<div class="empty-state">
      <b>첫 바닥을 놓으세요</b>
      시간과 장소, 인물, 그리고 무슨 일이 벌어지는지.<br>
      그것만으로 한 층이 됩니다.
      <div><button data-act="newFloor">새 바닥 만들기</button></div>
    </div>`;
  }else{
    h+=`<div class="stack">${list.map(f=>floorHTML(f,p)).join('')}</div>`;
  }

  h+=`<div class="foot">
    <button data-act="newProj">새 프로젝트</button>
    <button data-act="help">사용법</button>
  </div>`;

  document.getElementById('app').innerHTML=h;
}

function charHTML(c){
  const exp=ui.cexp[c.id];
  const age=(c.age||'').trim();
  const line=[/^\d+$/.test(age)?age+'세':age,(c.job||'').trim()].filter(Boolean);
  return `<div class="card${exp?' exp':''}">
    <div class="nm">
      <button class="who" data-act="toggleChar" data-id="${c.id}" aria-expanded="${exp?'true':'false'}">
        ${esc(c.name||'이름 없음')}<span class="caret sm"></span>
      </button>
      ${line.length?`<span class="age">${esc(line.join(' · '))}</span>`:''}
      ${(c.role||'').trim()?`<span class="role">${esc(c.role)}</span>`:''}
      <span class="sp"></span>
      ${(c.link||'').trim()?`<button class="lk" data-act="openCharLink" data-id="${c.id}" title="스크리브너에서 열기">↗</button>`:''}
    </div>
    <dl>${CF.map(f=>`<dt>${f.n}</dt><dd class="${(c[f.k]||'').trim()?'':'empty'}">${(c[f.k]||'').trim()?esc(c[f.k]):'—'}</dd>`).join('')}</dl>
    <div class="acts">
      <button data-act="editChar" data-id="${c.id}">수정</button>
      <button class="del" data-act="delChar" data-id="${c.id}">삭제</button>
    </div>
  </div>`;
}

function floorHTML(f,p){
  const exp=ui.exp[f.id];
  const sel=ui.sel[f.id];
  const meta=[f.time,f.place,f.cast].filter(x=>(x||'').trim());
  return `<article class="floor ${SCLS[f.status]||'wip'}${exp?' exp':''}${sel?' sel':''}" data-id="${f.id}">
    <div class="frow1">
      ${ui.selMode?`<div class="chk" data-act="toggleSel" data-id="${f.id}" role="checkbox" aria-checked="${sel?'true':'false'}"></div>`:''}
      <div class="meta" data-act="toggleExp" data-id="${f.id}">${
        meta.length?meta.map((x,i)=>i===0?`<em>${esc(x)}</em>`:esc(x)).join(' · '):'<em>시간 · 장소 · 인물</em>'
      }</div>
      <button class="status" data-act="cycleStatus" data-id="${f.id}">${f.status}</button>
      <div class="mae">${f.count?fmtMae(f.count):'—'}</div>
    </div>
    <div class="desc${exp?'':' clamp'}${(f.desc||'').trim()?'':' empty'}" data-act="toggleExp" data-id="${f.id}">${
      (f.desc||'').trim()?esc(f.desc):'설명이 비어 있습니다'
    }</div>
    <div class="kinds">
      ${KINDS.map(k=>`<button data-act="work" data-id="${f.id}" data-k="${k}">${k}</button>`).join('')}
      <button class="fin" data-act="finish" data-id="${f.id}">끝</button>
    </div>
    <div class="more">
      <div class="acts">
        <span class="cnts">${f.count?esc(f.count)+'자 · '+fmtMae(f.count):'글자수 없음'}</span>
        ${f.link?`<button data-act="openFloorLink" data-id="${f.id}">파일 열기</button>`:''}
        <button data-act="editFloor" data-id="${f.id}">수정</button>
        <button data-act="copyOne" data-id="${f.id}">이 바닥 복사</button>
        <button class="del" data-act="delFloor" data-id="${f.id}">삭제</button>
      </div>
      ${f.logs&&f.logs.length?`<div class="log"><span class="u">작업 기록 ${f.logs.length}</span>
        ${f.logs.slice().reverse().map(l=>`<div class="logitem">
          <span class="k">${esc(l.kind)}</span>
          <span class="t">${esc(l.text)}</span>
          <span class="d">${stamp(l.at)}</span>
          <button data-act="delLog" data-id="${f.id}" data-lid="${l.id}" aria-label="기록 삭제">×</button>
        </div>`).join('')}</div>`:''}
    </div>
  </article>`;
}

/* ═══════════════ 시트 ═══════════════ */
let handlers={};
function openSheet(html,acts){
  handlers=acts||{};
  document.getElementById('modal').innerHTML=`<div class="veil" data-act="veil"><div class="sheet">${html}</div></div>`;
  document.body.style.overflow='hidden';
  const first=document.querySelector('.sheet input,.sheet textarea');
  if(first)setTimeout(()=>{first.focus();},80);
}
function closeSheet(){handlers={};document.getElementById('modal').innerHTML='';document.body.style.overflow='';}
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function raw(id){const e=document.getElementById(id);return e?e.value:'';}

/* ── 클립보드 텍스트 조립 ── */
function workText(f,p,kind,ask){
  const L=[];
  L.push(`【${kind}】 ${p.title}`);
  L.push('');
  L.push(`시간: ${f.time||'—'}`);
  L.push(`장소: ${f.place||'—'}`);
  L.push(`인물: ${f.cast||'—'}`);
  if((f.desc||'').trim()){L.push('');L.push(`바닥: ${f.desc.trim()}`);}
  L.push('');
  L.push('─────────────');
  L.push(ask);
  L.push('─────────────');
  return L.join('\n');
}
function floorText(f,p,i,withLogs){
  const L=[];
  L.push(`── ${i}. ${f.time||'—'} · ${f.place||'—'}${f.count?'   '+fmtMae(f.count):''}${f.status!=='진행중'?'   '+f.status:''}`);
  L.push(`인물: ${f.cast||'—'}`);
  L.push('');
  L.push((f.desc||'').trim()||'(설명 없음)');
  if(withLogs&&f.logs&&f.logs.length){
    L.push('');
    f.logs.forEach(l=>L.push(`  [${l.kind}] ${l.text}`));
  }
  return L.join('\n');
}

A.openCharLink=(el)=>{const c=cur().chars.find(x=>x.id===el.dataset.id);if(c)openLink(c.link);};

function charSheet(c){
  const isNew=!c;
  const d=c||{id:uid(),name:'',age:'',job:'',role:'',wants:'',fears:'',anta:'',shadow:'',pert:'',link:''};
  openSheet(`
  <h3>${isNew?'인물 추가':'인물 수정'}</h3><div class="sub">겉면 셋, 안쪽 다섯</div>
  <div class="row3">
    <label class="f"><span class="u">이름</span><input id="name" value="${esc(d.name)}"></label>
    <label class="f"><span class="u">나이</span><input id="age" value="${esc(d.age)}" placeholder="11"></label>
    <label class="f"><span class="u">직업</span><input id="job" value="${esc(d.job)}" placeholder="국민학생"></label>
  </div>
  <label class="f"><span class="u">역할</span>
    <input id="role" value="${esc(d.role)}" list="roles" placeholder="주인공 · 대적자 · 섭동자 · 그림자">
    <datalist id="roles">${ROLES.map(r=>`<option>${r}</option>`).join('')}</datalist></label>
  ${CF.map(f=>`<label class="f"><span class="u">${f.n}</span><textarea id="${f.k}" rows="2">${esc(d[f.k]||'')}</textarea></label>`).join('')}
  <label class="f"><span class="u">스크리브너 주소${(d.link||'').trim()?' — 연결됨':''}</span>
    <input id="link" placeholder="${(d.link||'').trim()?'붙여넣으면 새 주소로 바꿉니다':''}"></label>
  <div class="sbtns">
    ${(d.link||'').trim()?`<button data-act="unlink" style="color:var(--muted)">연결 해제</button>`:''}
    <div class="sp"></div><button class="cx" data-act="cancel">취소</button><button class="go" data-act="ok">저장</button></div>`,
  {cancel:closeSheet,
   unlink:()=>{d.link='';save();closeSheet();render();toast('연결을 해제했습니다');},
   ok:()=>{
    const p=cur();
    d.name=val('name');d.age=val('age');d.job=val('job');d.role=val('role');
    CF.forEach(f=>d[f.k]=raw(f.k).trim());
    const nl=val('link');if(nl)d.link=nl;
    if(isNew){p.chars.push(d);ui.cexp[d.id]=true;ui.cast=true;}
    save();closeSheet();render();
  }});
}
A.addChar=()=>charSheet(null);
A.editChar=(el)=>{const c=cur().chars.find(x=>x.id===el.dataset.id);if(c)charSheet(c);};
A.delChar=(el)=>{const p=cur();const c=p.chars.find(x=>x.id===el.dataset.id);

/* ── 바닥 ── */
function floorSheet(f){
  const p=cur();const isNew=!f;
  const d=f||{id:uid(),time:'',place:'',cast:'',desc:'',link:'',count:0,status:'진행중',logs:[],createdAt:now(),touchedAt:now()};
  let picked=(d.cast||'').split(/[,、]/).map(s=>s.trim()).filter(Boolean);

  const chips=()=>{
    const known=p.chars.map(c=>(c.name||'').trim()).filter(Boolean);
    const all=known.concat(picked.filter(n=>!known.includes(n)));
    if(!all.length)return `<span class="u">아직 인물이 없습니다. 아래에 이름을 적어 만드세요.</span>`;
    return all.map(n=>{
      const on=picked.includes(n);
      return `<button class="chip${on?' on':''}" data-act="pickChar" data-n="${esc(n)}" aria-pressed="${on}">${esc(n)}</button>`;
    }).join('');
  };
  const paint=()=>{const el=document.getElementById('castbox');if(el)el.innerHTML=chips();};

  openSheet(`
  <h3>${isNew?'새 바닥':'바닥 수정'}</h3><div class="sub">시간 · 장소 · 인물 · 설명</div>
  ${isNew&&p.link?`<div class="hint"><b>먼저 파일을 만드세요.</b> 아래 ‘초안 폴더 열기’로 스크리브너에 들어가 새 파일을 만들고, 그 파일의 링크를 복사해 이 아래 주소 칸에 붙여넣습니다.
    <div style="margin-top:8px"><button data-act="openF" style="color:var(--seal);font-weight:600;border-bottom:1px solid var(--seal)">초안 폴더 열기 ↗</button></div></div>`:''}
  <div class="row">
    <label class="f"><span class="u">시간</span><input id="time" value="${esc(d.time)}" placeholder="1981년 여름, 해질 무렵"></label>
    <label class="f"><span class="u">장소</span><input id="place" value="${esc(d.place)}" placeholder="학교 운동장"></label>
  </div>
  <div class="f"><span class="u">인물 — 눌러서 고릅니다</span>
    <div class="chips" id="castbox">${chips()}</div>
    <div class="addrow"><input id="newname" placeholder="여기 없는 인물의 이름"><button data-act="addName">＋ 만들기</button></div>
  </div>
  <label class="f"><span class="u">설명</span><textarea id="desc" rows="5" placeholder="이 바닥에서 무슨 일이 벌어지나">${esc(d.desc)}</textarea></label>
  <label class="f"><span class="u">스크리브너 파일 주소${(d.link||'').trim()?' — 연결됨':''}</span>
    <input id="link" placeholder="${(d.link||'').trim()?'붙여넣으면 새 주소로 바꿉니다':''}"></label>
  ${isNew?'':`<label class="f"><span class="u">상태</span><select id="status">${STATUS.map(s=>`<option${s===d.status?' selected':''}>${s}</option>`).join('')}</select></label>`}
  <div class="sbtns">
    ${!isNew&&(d.link||'').trim()?`<button data-act="unlink" style="color:var(--muted)">연결 해제</button>`:''}
    <div class="sp"></div><button class="cx" data-act="cancel">취소</button><button class="go" data-act="ok">${isNew?'놓기':'저장'}</button></div>`,
  {cancel:closeSheet,
   openF:()=>openLink(p.link),
   unlink:()=>{d.link='';save();closeSheet();render();toast('연결을 해제했습니다');},
   pickChar:(el)=>{
     const n=el.dataset.n;const i=picked.indexOf(n);
     if(i<0)picked.push(n);else picked.splice(i,1);
     paint();
   },
   addName:()=>{
     const box=document.getElementById('newname');
     const n=box.value.trim();
     if(!n){box.focus();return;}
     if(!picked.includes(n))picked.push(n);
     box.value='';paint();box.focus();
   },
   ok:()=>{
     d.time=val('time');d.place=val('place');d.desc=raw('desc').trim();
     d.cast=picked.join(', ');
     const nl=val('link');if(nl)d.link=nl;
     if(!isNew){const s=document.getElementById('status');if(s)d.status=s.value;}
     touch(d);
     if(isNew)p.floors.push(d);
     const added=syncCast(p,d.cast);
     save();closeSheet();render();
     if(added.length)toast(`인물에 ${added.join(', ')} 올렸습니다`);
   }});
}
/* 바닥에 적힌 이름 가운데 인물들에 없는 것은 새로 만든다 */
function syncCast(p,cast){
  const added=[];
  (cast||'').split(/[,、]/).map(s=>s.trim()).filter(Boolean).forEach(n=>{
    if(!p.chars.some(c=>(c.name||'').trim()===n)){
      p.chars.push({id:uid(),name:n,age:'',job:'',role:'',wants:'',fears:'',anta:'',shadow:'',pert:'',link:''});
      added.push(n);
    }
  });
  return added;
}
A.newFloor=()=>floorSheet(null);
A.editFloor=(el)=>{const f=find(el.dataset.id);if(f)floorSheet(f);};
function find(id){const p=cur();return p?p.floors.find(f=>f.id===id):null;}

A.toggleExp=(el)=>{const id=el.dataset.id;ui.exp[id]=!ui.exp[id];render();};
A.toggleSel=(el)=>{const id=el.dataset.id;ui.sel[id]=!ui.sel[id];render();};
A.selOn=()=>{ui.selMode=true;render();};
A.selOff=()=>{ui.selMode=false;ui.sel={};render();};
A.selAll=()=>{const list=sorted(cur());const all=list.every(f=>ui.sel[f.id]);ui.sel={};if(!all)list.forEach(f=>ui.sel[f.id]=true);render();};

A.cycleStatus=(el)=>{const f=find(el.dataset.id);if(!f)return;
  f.status=STATUS[(STATUS.indexOf(f.status)+1)%STATUS.length];save();render();};

A.delFloor=(el)=>{const p=cur();const f=find(el.dataset.id);if(!f)return;
  if(!confirm('이 바닥을 지웁니다. 되돌릴 수 없습니다.'))return;
  p.floors=p.floors.filter(x=>x.id!==f.id);delete ui.exp[f.id];delete ui.sel[f.id];save();render();};

A.delLog=(el)=>{const f=find(el.dataset.id);if(!f)return;
  f.logs=f.logs.filter(l=>l.id!==el.dataset.lid);save();render();};

A.openFloorLink=(el)=>{const f=find(el.dataset.id);if(f)openLink(f.link);};

/* ── 작업 버튼 ── */
A.work=(el)=>{
  const f=find(el.dataset.id);const kind=el.dataset.k;const p=cur();
  if(!f)return;
  const last=(f.logs||[]).filter(l=>l.kind===kind).slice(-1)[0];
  openSheet(`
  <h3>${kind}</h3>
  <div class="sub">${[f.time,f.place,f.cast].filter(x=>(x||'').trim()).join(' · ')||'시간 · 장소 · 인물이 비어 있습니다'}</div>
  <label class="f"><span class="u">무엇을 쓰려고 하나</span>
    <textarea id="ask" rows="5" placeholder="${esc(kind)}에서 하려는 것을 한두 문장으로">${last?'':''}</textarea></label>
  ${last?`<div class="hint">지난 ${esc(kind)}: ${esc(last.text)}</div>`:''}
  ${f.link?'':`<div class="hint"><b>이 바닥에 파일 링크가 없습니다.</b> 복사만 하고 스크리브너는 열리지 않습니다. ‘수정’에서 링크를 연결하세요.</div>`}
  <div class="sbtns"><div class="sp"></div><button class="cx" data-act="cancel">취소</button><button class="go" data-act="ok">복사하고 열기</button></div>`,
  {cancel:closeSheet,ok:async()=>{
    const ask=raw('ask').trim();
    if(!ask){toast('무엇을 쓸지 한 줄 적어주세요');return;}
    const text=workText(f,p,kind,ask);
    f.logs=f.logs||[];
    f.logs.push({id:uid(),kind,text:ask,at:now()});
    touch(f);save();
    const ok=await copy(text);
    closeSheet();render();
    if(ok){toast('복사했습니다'+(f.link?' · 스크리브너를 엽니다':''));if(f.link)openLink(f.link);}
    else manualCopy(text,()=>{if(f.link)openLink(f.link);});
  }});
};

/* ── 끝 ── */
A.finish=(el)=>{
  const f=find(el.dataset.id);if(!f)return;
  openSheet(`
  <h3>끝</h3><div class="sub">쓴 것을 보고 설명을 고칩니다</div>
  <label class="f"><span class="u">설명</span><textarea id="desc" rows="7">${esc(f.desc||'')}</textarea></label>
  <div class="row">
    <label class="f"><span class="u">스크리브너 글자수</span><input id="count" type="number" inputmode="numeric" value="${f.count||''}" placeholder="0"></label>
    <label class="f"><span class="u">상태</span><select id="status">${STATUS.map(s=>`<option${s===f.status?' selected':''}>${s}</option>`).join('')}</select></label>
  </div>
  <div class="hint">공백 포함 200자를 1매로 환산합니다.${f.count?` 지금 ${f.count}자 · ${fmtMae(f.count)}`:''}</div>
  <div class="sbtns"><div class="sp"></div><button class="cx" data-act="cancel">취소</button><button class="go" data-act="ok">저장</button></div>`,
  {cancel:closeSheet,ok:()=>{
    f.desc=raw('desc').trim();
    const c=parseInt(val('count'),10);f.count=isNaN(c)||c<0?0:c;
    const s=document.getElementById('status');if(s)f.status=s.value;
    touch(f);save();closeSheet();render();
    toast(f.count?fmtMae(f.count)+' 기록했습니다':'저장했습니다');
  }});
};

/* ── 복사 ── */
A.copyOne=async(el)=>{
  const f=find(el.dataset.id);const p=cur();if(!f)return;
  const t=`${p.title}\n\n`+floorText(f,p,1,true);
  const ok=await copy(t);
  if(ok)toast('이 바닥을 복사했습니다');else manualCopy(t);
};
A.copySel=async()=>{
  const p=cur();const list=sorted(p).filter(f=>ui.sel[f.id]);
  if(!list.length){toast('바닥을 먼저 선택하세요');return;}
  const sum=list.reduce((s,f)=>s+(f.count||0),0);
  const head=[p.title,`바닥 ${list.length}개 · ${fmtMae(sum)}`,''];
  const plot=PLOT.filter(x=>(p.plot[x.k]||'').trim());
  if(plot.length){
    head.push('【플롯】');
    plot.forEach(x=>head.push(`${x.n}: ${p.plot[x.k].trim()}`));
    head.push('');
  }
  const t=head.join('\n')+'\n'+list.map((f,i)=>floorText(f,p,i+1,false)).join('\n\n\n');
  const ok=await copy(t);
  if(ok){toast(`${list.length}개를 복사했습니다`);}
  else manualCopy(t);
};

/* ── 백업 / 복원 ── */
A.backup=async()=>{
  const t=JSON.stringify(db,null,1);
  try{
    const blob=new Blob([t],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`초안-백업-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('백업 파일을 내려받았습니다');
  }catch(e){
    const ok=await copy(t);if(ok)toast('백업 내용을 복사했습니다');else manualCopy(t);
  }
};
A.restore=()=>openSheet(`
  <h3>복원</h3><div class="sub">백업 파일을 고르거나 내용을 붙여넣습니다</div>
  <label class="f"><span class="u">백업 파일</span><input id="file" type="file" accept=".json,application/json"></label>
  <label class="f"><span class="u">또는 붙여넣기</span><textarea id="json" rows="5" placeholder='{"v":2,"projects":[...]}'></textarea></label>
  <div class="hint">복원하면 <b>지금 저장된 내용을 모두 덮어씁니다.</b> 먼저 백업해 두세요.</div>
  <div class="sbtns"><div class="sp"></div><button class="cx" data-act="cancel">취소</button><button class="go" data-act="ok">덮어쓰기</button></div>`,
  {cancel:closeSheet,ok:()=>{
    const fi=document.getElementById('file');
    const apply=(txt)=>{
      let d;
      try{d=JSON.parse(String(txt).replace(/^\uFEFF/,''));}
      catch(e){toast('JSON 형식이 깨져 있습니다');return;}
      if(!d||!Array.isArray(d.projects)){toast('초안 백업 파일이 아닙니다');return;}
      db=migrate(d);
      if(!cur()&&db.projects.length)db.currentId=db.projects[0].id;
      ui=freshUI();
      save();closeSheet();render();
      toast(`복원했습니다 · 프로젝트 ${db.projects.length}`);
    };
    if(fi&&fi.files&&fi.files[0]){
      const r=new FileReader();
      r.onload=()=>apply(r.result);
      r.onerror=()=>toast('파일을 읽지 못했습니다');
      r.readAsText(fi.files[0]);return;
    }
    const t=raw('json').trim();
    if(!t){toast('파일을 고르거나 내용을 붙여넣으세요');return;}
    apply(t);
  }});

A.help=()=>openSheet(`
  <h3>사용법</h3><div class="sub">바닥을 놓고, 쓰고, 끝을 누른다</div>
  <div class="hint" style="margin-top:4px">
    <b>1. 초안 폴더를 연결합니다.</b> 스크리브너에서 초안 폴더의 링크를 복사해 붙여넣습니다.<br><br>
    <b>2. 새 바닥.</b> ‘초안 폴더 열기’로 스크리브너에 들어가 새 파일을 만들고, 그 파일 링크를 바닥에 붙여넣습니다. 시간·장소·인물·설명을 채웁니다.<br><br>
    <b>3. 대화 · 묘사 · 이벤트 · 독백 · 기능.</b> 무엇을 쓸지 한 줄 적으면 시간·장소·인물과 함께 클립보드에 담기고 그 파일이 열립니다. 붙여넣고 씁니다.<br><br>
    <b>4. 끝.</b> 돌아와 설명을 고치고 글자수를 적습니다. 200자가 1매입니다. 방금 만진 바닥이 맨 위로 올라옵니다.<br><br>
    <b>5. 모아 복사.</b> 고른 바닥들을 시간·장소·인물·설명만 담은 플레인 텍스트로 복사합니다. 붙여넣어 인쇄한 뒤 순서를 바꿔가며 초안을 세웁니다. 작업 기록까지 보려면 바닥을 펼쳐 ‘이 바닥 복사’를 쓰세요.<br><br>
    <b>인물.</b> 바닥을 만들 때 저장된 인물을 눌러 고르고, 없으면 이름을 적어 그 자리에서 만듭니다. 새로 만든 인물은 인물들에 이름만 올라가니 나이·직업·다섯 축은 나중에 채우면 됩니다. 카드를 누르면 원하는 것·두려워하는 것·대적자·그림자·섭동자가 펼쳐집니다.<br><br>
    <b>더 깊은 편집.</b> 시놉시스의 각 단계와 인물마다 스크리브너 주소를 걸 수 있습니다. ↗를 누르면 그 문서로 건너가 길게 씁니다.<br><br>
    <b>단축키.</b> n 새 바닥 · d 시놉시스 · c 인물들 · ⌘Return 저장 · esc 닫기<br><br>
    <b>백업.</b> 이 앱은 브라우저 안에만 저장됩니다. 이따금 백업 파일을 내려받아 두세요.
  </div>
  <div class="sbtns"><div class="sp"></div><button class="go" data-act="cancel">닫기</button></div>`,
  {cancel:closeSheet});

/* ═══════════════ 이벤트 위임 ═══════════════ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){return;}
  /* 셀렉트·입력창은 스스로 동작하게 둔다 (change 이벤트가 받는다) */
  if(/^(SELECT|INPUT|TEXTAREA|OPTION)$/.test(e.target.tagName))return;
  const act=el.dataset.act;
  if(act==='veil'){if(e.target===el)closeSheet();return;}
  if(act==='openFolder')return; // 앵커 기본 동작
  if(handlers[act]){e.preventDefault();handlers[act](el);return;}
  if(A[act]){e.preventDefault();A[act](el);}
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]');
  if(el&&el.dataset.act==='switchProj')A.switchProj(el);
});
document.addEventListener('keydown',e=>{
  const openSheetNow=!!document.getElementById('modal').innerHTML;
  if(e.key==='Escape'&&openSheetNow){closeSheet();return;}
  if(e.key==='Enter'||e.key===' '){
    const el=e.target.closest('.station[data-act]');
    if(el){e.preventDefault();A.editPlot(el);return;}
  }
  if(openSheetNow&&e.key==='Enter'&&!e.metaKey&&!e.ctrlKey&&e.target.id==='newname'&&handlers.addName){
    e.preventDefault();handlers.addName();return;
  }
  if(openSheetNow&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){
    const go=document.querySelector('.sheet .sbtns .go');
    if(go){e.preventDefault();go.click();}
    return;
  }
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
  if(!openSheetNow&&!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
    if(e.key==='n'&&cur()){e.preventDefault();A.newFloor();}
    if(e.key==='d'&&cur()){e.preventDefault();A.toggleDash();}
    if(e.key==='c'&&cur()){e.preventDefault();A.toggleCast();}
  }
});

render();
</script>
