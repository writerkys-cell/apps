<style>
:root{
  --baek:#fbfcfd;      /* 살짝 푸른 기가 도는 흰 바탕 */
  --meok:#1f2d40;      /* 글자 — 짙은 남색 */
  --meok-2:#5a6b7f;
  --meok-3:#8c99a8;
  --seon:#dde3ea;
  --puleun:#4a6fa5;    /* 차오르는 파랑 */
  --jongi:#ffffff;
  --ui:'Gowun Dodum',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--baek);color:var(--meok);
  font-family:var(--ui);font-size:15px;line-height:1.8;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  display:flex;flex-direction:column;
}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;font-size:inherit}
:focus-visible{outline:2px solid var(--puleun);outline-offset:2px}

header{
  display:flex;align-items:center;gap:.7rem;
  padding:.9rem 1rem .6rem;border-bottom:1px solid var(--seon);
}
#sel{
  appearance:none;background:transparent;border:0;flex:1;min-width:0;
  font-family:var(--ui);font-size:.85rem;color:var(--meok-2);
  padding:0 1rem 0 0;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--meok-3) 50%),linear-gradient(135deg,var(--meok-3) 50%,transparent 50%);
  background-position:right 4px center,right 0px center;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
#sel:hover{color:var(--puleun)}
header .gear{font-size:.8rem;color:var(--meok-3)}
header .gear:hover{color:var(--puleun)}

main{flex:1;min-height:0;overflow-y:auto}
.view{display:none;height:100%}
.view.on{display:flex}

#face{
  position:relative;flex-direction:column;align-items:center;justify-content:center;
  padding:1rem;text-align:center;overflow:hidden;
}
#fill{
  position:absolute;left:0;right:0;bottom:0;height:0;
  background:var(--puleun);opacity:.15;
  transition:height .25s linear;pointer-events:none;
}
@media (prefers-reduced-motion:reduce){#fill{transition:none}}
#stack{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
#phase{font-size:.72rem;color:var(--meok-3);letter-spacing:.3em}
.acts{display:flex;gap:1.4rem;margin-top:.9rem;font-size:.9rem}
.acts button{color:var(--meok-2);border-bottom:1px solid var(--seon);padding-bottom:1px}
.acts button:hover{color:var(--puleun);border-bottom-color:var(--puleun)}
.acts button[hidden]{display:none}
#clock{
  position:absolute;left:.7rem;bottom:.5rem;z-index:1;
  font-size:.75rem;color:var(--meok-3);font-variant-numeric:tabular-nums;
}
#today{
  position:absolute;right:.7rem;bottom:.5rem;z-index:1;
  font-size:.75rem;color:var(--meok-3);font-variant-numeric:tabular-nums;
}
#today.met{color:var(--puleun)}

#set{flex-direction:column}
.pad{padding:1rem 1.1rem 2rem;width:100%;overflow-y:auto}
.row{display:flex;align-items:center;gap:.6rem;padding:.6rem 0;border-bottom:1px solid var(--seon)}
.row label{flex:1;color:var(--meok-2);font-size:.85rem}
.row .unit{color:var(--meok-3);font-size:.75rem;width:1.8rem}
.row input[type=number],.row input[type=text]{
  font-family:var(--ui);font-size:.9rem;color:var(--meok);
  background:var(--jongi);border:1px solid var(--seon);border-radius:2px;
  padding:.3rem .5rem;width:4.4rem;text-align:right;
}
.row input[type=text]{width:9rem;text-align:left}
.row select{
  font-family:var(--ui);font-size:.9rem;color:var(--meok);
  background:var(--jongi);border:1px solid var(--seon);border-radius:2px;
  padding:.3rem .5rem;
}
h2{font-size:.85rem;font-weight:400;color:var(--meok-2);margin:1.6rem 0 .1rem}
h2:first-child{margin-top:0}
.note{font-size:.72rem;color:var(--meok-3);line-height:1.7;margin:.6rem 0 0}

#rest{
  position:fixed;inset:0;z-index:60;background:#15202e;
  display:none;flex-direction:column;align-items:center;justify-content:center;
}
#rest.on{display:flex}
#restNum{font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums;color:#eef3f8}
#restWord{color:#6b7a8c;font-size:.8rem;letter-spacing:.3em;margin-top:.9rem}

#toast{
  position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);
  background:var(--meok);color:#fff;padding:.4rem 1rem;border-radius:2px;
  font-size:.8rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:70;
}
#toast.on{opacity:1}
</style>
</head>
<body>

<header>
  <select id="sel" aria-label="몰입 시간">
    <option value="5">5분</option><option value="10">10분</option><option value="15">15분</option>
    <option value="25">25분</option><option value="50">50분</option>
    <option value="54">타이핑1</option><option value="69">타이핑2</option>
  </select>
  <button class="gear" id="gear">설정</button>
  <button class="gear" id="back" hidden>닫기</button>
</header>

<main>
  <section id="face" class="view on">
    <div id="fill"></div>
    <div id="stack">
      <div id="phase">기다리는 중</div>
      <div class="acts">
        <button id="go">시작</button>
        <button id="stop" hidden>중단</button>
      </div>
    </div>
    <div id="clock">15:00</div>
    <div id="today"></div>
  </section>

  <section id="set" class="view"><div class="pad">
    <h2>시간</h2>
    <div class="row"><label for="rmin">휴식</label><select id="rmin"><option value="5">5분</option><option value="10">10분</option><option value="15">15분</option></select></div>
    <div class="row">
      <label for="goalH">하루 목표</label>
      <input type="number" id="goalH" min="0" max="16" step="1"><span class="unit">시간</span>
      <input type="number" id="goalM" min="0" max="59" step="1"><span class="unit">분</span>
    </div>
    <p class="note">0시간 0분으로 두면 목표 없이 누적만 보입니다. 하루의 경계는 새벽 4시입니다.</p>

    <h2>단축어</h2>
    <div class="row"><label for="cStart">몰입을 시작할 때</label><input type="text" id="cStart"></div>
    <div class="row"><label for="cRest">휴식에 들어갈 때</label><input type="text" id="cRest"></div>
    <div class="row"><label for="cStop">몰입을 중단할 때</label><input type="text" id="cStop"></div>
    <p class="note">타이핑1·타이핑2를 고르면 시작할 때 '오전타이핑1'·'오전타이핑2'가 대신 실행됩니다. 각각 분 단위 숫자가 입력으로 함께 갑니다. 비워두면 실행하지 않습니다.</p>

    <h2>기록</h2>
    <div class="row"><label>오늘까지 쌓인 날</label><span id="dayCount" class="unit" style="width:auto;color:var(--meok-2)"></span></div>
    <p class="note" id="recent"></p>
  </div></section>
</main>

<div id="rest">
  <div id="restNum">00:00</div>
  <div id="restWord">휴식</div>
</div>

<div id="toast"></div>

<script>
(function(){
"use strict";

var KEY = "dasi-timer-v1";
var FOCUS_SET = [5,10,15,25,50,54,69];
var MORNING = { 54:"오전타이핑1", 69:"오전타이핑2" };

function fresh(){
  return {
    focusMin:15, restMin:15,
    goalH:3, goalM:0,
    cStart:"", cRest:"휴식끝", cStop:"중단",
    days:{},
    phase:"idle", endsAt:null, startedAt:null
  };
}
function load(){
  var d = fresh();
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var p = JSON.parse(raw);
      for(var k in d) if(p[k]!==undefined && p[k]!==null) d[k]=p[k];
    }
  }catch(e){}
  if(!d.days || typeof d.days !== "object") d.days = {};
  if(FOCUS_SET.indexOf(d.focusMin) < 0) d.focusMin = 15;
  return d;
}
var S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

var $ = function(s){ return document.querySelector(s); };
var elClock=$("#clock"), elPhase=$("#phase"), elToday=$("#today"), elGo=$("#go"), elStop=$("#stop"), elFill=$("#fill"), elRest=$("#rest"), elRestNum=$("#restNum"),
    elSel=$("#sel"), elToast=$("#toast");

function toast(m){
  elToast.textContent = m;
  elToast.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(function(){ elToast.classList.remove("on"); }, 1600);
}

/* 하루의 경계는 새벽 4시 */
function dayKey(t){
  var d = new Date(t);
  if(d.getHours() < 4) d.setDate(d.getDate() - 1);
  var z = function(n){ return (n<10?"0":"")+n; };
  return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
}
function spanText(ms){
  var m = Math.round(ms/60000);
  if(m < 1) return "0분";
  if(m < 60) return m+"분";
  var h = Math.floor(m/60), r = m%60;
  return r ? h+"시간 "+r+"분" : h+"시간";
}
function mmss(ms){
  var s = Math.max(0, Math.ceil(ms/1000));
  var m = Math.floor(s/60); s = s%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function todayMs(){
  var base = S.days[dayKey(Date.now())] || 0;
  /* 도는 동안에는 화면에만 더해 보여준다. 기록은 끝날 때 한 번 */
  if(S.phase === "focus" && S.startedAt) base += Date.now() - S.startedAt;
  return base;
}

function runShortcut(name, input){
  if(!name || !String(name).trim()) return;
  var url = "shortcuts://run-shortcut?name=" + encodeURIComponent(String(name).trim());
  if(input != null && input !== "") url += "&input=text&text=" + encodeURIComponent(String(input));
  try{ window.location.href = url; }catch(e){}
}

/* 몰입한 만큼을 그날 기록에 더한다 */
function bank(){
  if(!S.startedAt) return 0;
  var ms = Date.now() - S.startedAt;
  if(ms < 0) ms = 0;
  var k = dayKey(S.startedAt);
  S.days[k] = (S.days[k] || 0) + ms;
  S.startedAt = null;
  return ms;
}

function startFocus(){
  S.phase = "focus";
  S.startedAt = Date.now();
  S.endsAt = S.startedAt + S.focusMin*60000;
  save(); draw();
  runShortcut(MORNING[S.focusMin] || S.cStart, S.focusMin);
}
function startRest(){
  bank(); save();
  S.phase = "rest";
  S.endsAt = Date.now() + S.restMin*60000;
  save(); draw();
  elRest.classList.add("on");
  runShortcut(S.cRest, S.restMin);
}
function stopFocus(){
  var ms = bank();
  S.phase = "idle"; S.endsAt = null;
  save(); draw();
  elRest.classList.remove("on");
  runShortcut(S.cStop, Math.round(ms/60000));
  toast("몰입을 중단했습니다");
}
function goIdle(){
  S.phase = "idle"; S.endsAt = null; S.startedAt = null;
  save(); draw();
  elRest.classList.remove("on");
}

function draw(){
  var goal = ((S.goalH||0)*60 + (S.goalM||0)) * 60000;
  var ms = todayMs();
  elToday.textContent = goal
    ? "오늘 " + spanText(ms) + " / " + spanText(goal)
    : (ms >= 30000 ? "오늘 " + spanText(ms) : "");
  elToday.classList.toggle("met", !!goal && ms >= goal);

  elSel.value = String(S.focusMin);
  elSel.disabled = (S.phase === "focus");

  if(S.phase === "idle"){
    elClock.textContent = mmss(S.focusMin*60000);
    elPhase.textContent = "기다리는 중";
    elFill.style.height = "0%";
    elGo.hidden = false; elStop.hidden = true;
    return;
  }

  var left = S.endsAt - Date.now();
  if(left < 0) left = 0;
  var span = (S.phase==="focus" ? S.focusMin : S.restMin) * 60000;

  if(S.phase === "focus"){
    elClock.textContent = mmss(left);
    elPhase.textContent = "몰입";
    elFill.style.height = (100 - left/span*100).toFixed(1) + "%";
    elGo.hidden = true; elStop.hidden = false;
  }else{
    elClock.textContent = mmss(left);
    elPhase.textContent = "휴식";
    elFill.style.height = "0%";
    elGo.hidden = true; elStop.hidden = true;
    elRestNum.textContent = mmss(left);
  }
}

function tick(){
  if(S.phase !== "idle" && S.endsAt && Date.now() >= S.endsAt){
    if(S.phase === "focus") startRest();
    else goIdle();
    return;
  }
  draw();
}

function restore(){
  if(S.phase === "focus" && S.endsAt){
    if(Date.now() < S.endsAt) return;             /* 이어서 돈다 */
    /* 창이 닫힌 사이 몰입이 끝났다 */
    S.startedAt = S.startedAt || (S.endsAt - S.focusMin*60000);
    var restEnd = S.endsAt + S.restMin*60000;
    var end = S.endsAt;
    var k = dayKey(S.startedAt);
    S.days[k] = (S.days[k] || 0) + Math.max(0, end - S.startedAt);
    S.startedAt = null;
    if(Date.now() < restEnd){
      S.phase = "rest"; S.endsAt = restEnd; save();
      elRest.classList.add("on");
    }else goIdle();
  }else if(S.phase === "rest" && S.endsAt){
    if(Date.now() < S.endsAt) elRest.classList.add("on");
    else goIdle();
  }else goIdle();
}

/* ---------- 설정 ---------- */
function drawSet(){
  $("#rmin").value = String(S.restMin);
  $("#goalH").value = S.goalH;
  $("#goalM").value = S.goalM;
  $("#cStart").value = S.cStart || "";
  $("#cRest").value = S.cRest || "";
  $("#cStop").value = S.cStop || "";

  var keys = Object.keys(S.days).sort().reverse();
  $("#dayCount").textContent = keys.length + "일";
  var lines = keys.slice(0, 7).map(function(k){
    return k.slice(5).replace("-", "월 ") + "일 · " + spanText(S.days[k]);
  });
  $("#recent").textContent = lines.length ? lines.join("\n") : "아직 기록이 없습니다.";
  $("#recent").style.whiteSpace = "pre-line";
}
function show(v){
  ["face","set"].forEach(function(x){
    document.getElementById(x).classList.toggle("on", x===v);
  });
  $("#gear").hidden = (v === "set");
  $("#back").hidden = (v !== "set");
  if(v === "set") drawSet();
}

function num(el, key, min, max, fb){
  el.addEventListener("change", function(){
    var n = parseInt(this.value, 10);
    S[key] = (!isNaN(n) && n>=min && n<=max) ? n : fb;
    this.value = S[key];
    save(); draw();
  });
}
num($("#goalH"), "goalH", 0, 16, 3);
num($("#goalM"), "goalM", 0, 59, 0);
$("#rmin").addEventListener("change", function(){ S.restMin = parseInt(this.value,10); save(); });
["cStart","cRest","cStop"].forEach(function(k){
  $("#"+k).addEventListener("change", function(){ S[k] = this.value; save(); });
});

elSel.addEventListener("change", function(){
  S.focusMin = parseInt(this.value, 10);
  save(); draw();
});
elGo.addEventListener("click", function(){ if(S.phase==="idle") startFocus(); });
elStop.addEventListener("click", function(){ if(S.phase==="focus") stopFocus(); });
$("#gear").addEventListener("click", function(){ show("set"); });
$("#back").addEventListener("click", function(){ show("face"); });

window.addEventListener("beforeunload", save);
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible") draw();
  else save();
});

/* 시작 */
restore();
draw();
setInterval(tick, 250);

})();
</script>
</body>
</html>
