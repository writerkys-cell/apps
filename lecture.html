<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lecture</title>
<style>
:root{
  --bg:#f6f5f0; --panel:#ffffff; --panel2:#f1efe8; --ink:#1f1f1d; --ink2:#5f5e5a; --muted:#8a8984;
  --line:#e2e0d8; --line2:#c9c7bf;
  --accent:#534ab7; --accent-bg:#eeedfe;
  --ok:#0f6e56; --ok-bg:#e1f5ee; --warn:#854f0b; --warn-bg:#faeeda; --bad:#a32d2d; --bad-bg:#fcebeb;
  --radius:8px;
  --font:-apple-system,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:6px 12px;cursor:pointer}
button:hover{background:var(--panel2)}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.primary:hover{background:#3a3a37}
button.ghost{border-color:transparent;background:transparent}
button.ghost:hover{background:var(--panel2)}
button.danger{color:var(--bad)}
input,textarea,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:6px 10px}
input:focus,textarea:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
textarea{resize:none;line-height:1.7}
.muted{color:var(--muted)}
.small{font-size:12px}
details.menu{position:relative}
details.menu>summary{list-style:none;cursor:pointer;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:6px 12px;user-select:none}
details.menu>summary::-webkit-details-marker{display:none}
details.menu>summary:hover{background:var(--panel2)}
details.menu>div{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:6px;min-width:220px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.08)}
details.menu>div button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:8px 10px;border-radius:6px}
details.menu>div button:hover{background:var(--panel2)}
details.menu>div .sep{border-top:1px solid var(--line);margin:6px 0}
details.menu>div label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;font-size:13px}
details.menu>div label input{width:72px;padding:3px 6px}

/* home */
.home{max-width:880px;margin:0 auto;padding:48px 24px}
.home h1{font-size:28px;font-weight:500;margin:0 0 6px;letter-spacing:-.01em}
.home .lead{color:var(--ink2);margin:0 0 28px}
.home-actions{display:flex;gap:8px;margin-bottom:24px}
.lect-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lect{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;position:relative}
.lect:hover{border-color:var(--line2)}
.lect h3{margin:0 0 6px;font-size:16px;font-weight:500}
.lect .meta{color:var(--ink2);font-size:13px}
.lect .del{position:absolute;top:10px;right:10px;opacity:0;font-size:12px}
.lect:hover .del{opacity:1}
.syncbox{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.syncbox h3{font-size:14px;font-weight:500;margin:0 0 8px}
.syncform{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.syncform input{width:200px}
.syncform.compact{flex-direction:column;align-items:stretch}
.syncform.compact input{width:100%}
.syncstat{font-size:12px;color:var(--muted);margin-top:6px}
.syncstat.err{color:var(--bad)}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:40px;text-align:center;color:var(--ink2)}

/* editor */
.editor{display:flex;flex-direction:column;height:100vh}
.ed-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.ed-head .title{font-size:17px;font-weight:500;border:1px solid transparent;background:transparent;min-width:260px;flex:1}
.ed-head .title:hover{border-color:var(--line2)}
.ed-head .title:focus{background:var(--panel)}
.ed-meta{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--ink2);flex-wrap:wrap}
.ed-meta label{display:flex;align-items:center;gap:6px}
.ed-meta input{padding:4px 8px;font-size:13px}
.ed-meta input.n{width:60px}
.ed-meta input.t{width:110px}
.ed-meta .spacer{flex:1}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.timebar{display:flex;gap:2px;height:8px;margin:10px 16px 0;border-radius:4px;overflow:hidden}
.timebar div{min-width:2px}
.timebar .rest{background:transparent;border:1px dashed var(--line2);border-radius:4px}
.timebar .over{background:var(--bad)}
.ed-body{display:grid;grid-template-columns:300px minmax(0,1fr);flex:1;min-height:0}
.sidebar{overflow:auto;border-right:1px solid var(--line);padding:12px}
.sidebar .hd{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin:4px 6px 8px}
.trow{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-radius:var(--radius);cursor:pointer;border:1px solid transparent;margin-bottom:4px;background:var(--panel)}
.trow:hover{border-color:var(--line)}
.trow.sel{border-color:var(--line2);background:var(--panel2)}
.trow.dragover{border-top:2px solid var(--accent)}
.trow .dot{width:8px;height:8px;border-radius:2px;margin-top:6px;flex:none}
.trow .mins{color:var(--muted);font-size:12px;min-width:34px;margin-top:2px}
.trow .tt{flex:1;min-width:0}
.trow .tt .name{font-size:13px;line-height:1.4;word-break:break-word}
.trow .tt .name.ph{color:var(--muted)}
.trow .tt .st{font-size:11px;margin-top:2px}
.srow{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--line);margin-bottom:12px;background:var(--panel);font-size:13px}
.srow:hover{border-color:var(--line2)}
.srow.sel{background:var(--panel2);border-color:var(--line2)}
.srow .c{font-size:11px;color:var(--warn)}
.scratch textarea{width:100%;min-height:46vh;font-size:15px}
.scratch .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.card.draft{border-left:3px solid #c9b8ff}
.tag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:11px;background:var(--accent-bg);color:var(--accent);margin-left:6px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border-radius:12px;width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column;padding:18px 20px}
.modal h2{font-size:16px;font-weight:500;margin:0 0 6px}
.modal textarea{width:100%;min-height:180px;flex:none;font-size:13px}
.modal .prev{overflow:auto;flex:1;margin:12px 0;font-size:13px;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--panel2);min-height:56px}
.modal .prev li{margin:3px 0}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.st-empty{color:var(--muted)} .st-memo{color:var(--warn)} .st-wip{color:var(--warn)} .st-done{color:var(--ok)}
.detail{overflow:auto;padding:18px 24px 80px}
.detail .row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.detail .ttl{font-size:18px;font-weight:500;flex:1;min-width:0}
.detail .lbl{font-size:12px;color:var(--muted);margin:14px 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.detail input.full{width:100%}
.detail textarea.memo{width:100%;min-height:64px;background:var(--panel2);border-color:transparent}
.detail textarea.memo:focus{background:var(--panel)}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px 8px}
.card.over{border-color:#e9b56a}
.card textarea{width:100%;min-height:72px;border:none;padding:2px 0;font-size:15px;background:transparent}
.card textarea:focus{outline:none}
.card .ft{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.card .ft .tools{display:flex;gap:2px;opacity:0}
.card:hover .ft .tools,.card:focus-within .ft .tools{opacity:1}
.card .ft .tools button{padding:2px 7px;font-size:12px;border-color:transparent}
.card .ft .warn{color:var(--warn)}
.addcard{border:1px dashed var(--line2);background:transparent;color:var(--ink2);width:100%;padding:10px}
.detail .bottom{display:flex;justify-content:space-between;margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}
.nodetail{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;padding:40px}
kbd{font:inherit;font-size:11px;border:1px solid var(--line2);border-radius:4px;padding:0 5px;background:var(--panel)}
#present kbd{background:transparent;border-color:currentColor;opacity:.75;font-size:.85em}

/* presentation */
#present{position:fixed;inset:0;background:#141412;color:#f3f1ea;display:flex;flex-direction:column;z-index:100;--ps:1}
#present[hidden]{display:none}
#present.light{background:#faf9f5;color:#1f1f1d}
.pr-top{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;font-size:15px;color:#a9a69d;gap:16px}
#present.light .pr-top{color:#6a6964}
.pr-top .tm{display:flex;gap:22px;font-variant-numeric:tabular-nums}
.pr-top .late{color:#f09595}
.pr-top .tools{display:flex;gap:4px}
.pr-top .tools button{background:transparent;border-color:#3a3a37;color:inherit;padding:3px 9px;font-size:13px}
#present.light .pr-top .tools button{border-color:#c9c7bf}
.pr-main{flex:1;display:flex;align-items:center;justify-content:center;padding:0 9vw;overflow:hidden}
.pr-text{white-space:pre-wrap;line-height:1.65;max-width:1100px;font-size:calc(30px * var(--ps));word-break:keep-all}
.pr-cover{text-align:center;max-width:1000px}
.pr-cover .k{font-size:calc(16px * var(--ps));color:#a9a69d;margin-bottom:14px;letter-spacing:.04em}
.pr-cover h2{font-size:calc(44px * var(--ps));font-weight:500;margin:0 0 16px;line-height:1.3;word-break:keep-all}
.pr-cover p{font-size:calc(22px * var(--ps));color:#c9c7bf;margin:0;line-height:1.5}
#present.light .pr-cover p{color:#5f5e5a}
.pr-memo{margin-top:28px;font-size:calc(15px * var(--ps));color:#8f8c83;white-space:pre-wrap;text-align:left;border-left:2px solid #3a3a37;padding-left:14px;max-width:900px}
.pr-next{padding:10px 28px;font-size:14px;color:#8f8c83;border-top:1px solid #2a2a27;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#present.light .pr-next{border-color:#e2e0d8}
.pr-bar{display:flex;gap:2px;padding:0 28px 14px}
.pr-bar div{height:6px;opacity:.35;border-radius:2px}
.pr-bar div.cur{opacity:1}
.pr-bar div.done{opacity:.7}

/* print */
#print-root{display:none}
@media print{
  body>*:not(#print-root){display:none !important}
  #print-root{display:block}
  html,body{margin:0;padding:0;height:auto;background:#fff;color:#000}
}
/* A6 가로는 148×105mm. Safari는 @page를 무시하고 자기 기본 여백(약 12.7mm)을 쓰기도 하므로, 그 안(약 122×79mm)에도 들어가게 카드를 120×78mm로 잡는다. 1mm라도 넘치면 카드마다 빈 장이 끼어든다. */
.a6 .pcard{width:120mm;height:78mm;margin:0 auto;overflow:hidden;display:flex;flex-direction:column;page-break-after:always;break-after:page;page-break-inside:avoid;break-inside:avoid;font-size:12.5pt;line-height:1.55;color:#000}
.a6 .pcard:last-child{page-break-after:auto;break-after:auto}
.a6 .ph{display:flex;justify-content:space-between;font-size:8.5pt;color:#666;border-bottom:.5pt solid #999;padding-bottom:1.5mm;margin-bottom:3mm}
.a6 .pb{flex:1;white-space:pre-wrap;word-break:keep-all;overflow:hidden}
.a6 .pf{display:flex;justify-content:space-between;align-items:flex-end;font-size:8pt;color:#777;margin-top:2mm}
.a6 .pf .m{white-space:pre-wrap;max-width:85%;font-size:8.5pt;color:#555}
.a6 .cover{justify-content:center;text-align:center}
.a6 .cover .k{font-size:9pt;color:#666;letter-spacing:.06em;margin-bottom:3mm}
.a6 .cover h2{font-size:19pt;font-weight:600;margin:0 0 3mm;line-height:1.3;word-break:keep-all}
.a6 .cover p{font-size:12pt;color:#333;margin:0;line-height:1.45}
.a6 .cover .m{font-size:9pt;color:#555;white-space:pre-wrap;margin-top:5mm;text-align:left}
.a6 .cover .pf{position:absolute;left:0;right:0;bottom:0}
.a6 .pcard.cover{position:relative}
.a6 .title{justify-content:center;text-align:center}
.a6 .title h1{font-size:22pt;font-weight:600;margin:0 0 4mm;line-height:1.3;word-break:keep-all}
.a6 .title p{margin:0;font-size:10pt;color:#555}
.a4{font-size:11pt;line-height:1.75;color:#000}
.a4 h1{font-size:20pt;font-weight:600;margin:0 0 2mm;line-height:1.3}
.a4 .meta{color:#555;font-size:10pt;margin-bottom:8mm}
.a4 h3{font-size:11pt;color:#444;margin:0 0 2mm;font-weight:600}
.a4 table{width:100%;border-collapse:collapse;font-size:10pt;margin-bottom:4mm}
.a4 th,.a4 td{border-bottom:.5pt solid #aaa;padding:1.6mm 2mm;text-align:left;vertical-align:top}
.a4 th{border-bottom:1pt solid #333;font-weight:600;color:#333}
.a4 td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.a4 .sec{display:grid;grid-template-columns:24mm minmax(0,1fr);column-gap:6mm;margin-top:9mm}
.a4 .sec .lt{font-size:9pt;color:#555;border-top:1pt solid #333;padding-top:2mm;line-height:1.5}
.a4 .sec .rt{border-top:1pt solid #333;padding-top:2mm;min-width:0}
.a4 .sec h2{font-size:14pt;font-weight:600;margin:0 0 1mm;line-height:1.3}
.a4 .sec .sum{color:#444;margin:0 0 3mm;font-size:10.5pt}
.a4 .sec .memo{font-size:9.5pt;color:#555;background:#f3f2ee;padding:2mm 3mm;margin:0 0 3mm;white-space:pre-wrap;border-left:1pt solid #999}
.a4 p{margin:0 0 3mm;white-space:pre-wrap;word-break:keep-all;page-break-inside:avoid;break-inside:avoid}
.a4 .none{color:#888;font-style:italic}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:200}
#toast.show{opacity:1}
@media (max-width:760px){
  .ed-body{grid-template-columns:1fr}
  .sidebar{border-right:none;border-bottom:1px solid var(--line);max-height:40vh}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="present" hidden></div>
<div id="print-root"></div>
<style id="pageStyle"></style>
<input type="file" id="importFile" accept="application/json" hidden>
<div id="toast"></div>

<script>
'use strict';
const STORE_KEY='lecture.v1';
const COLORS=['#7F77DD','#5DCAA5','#F0997B','#85B7EB','#FAC775','#ED93B1','#97C459','#B4B2A9'];
const app=document.getElementById('app');
const presentEl=document.getElementById('present');
const printRoot=document.getElementById('print-root');
const pageStyle=document.getElementById('pageStyle');

let db=load();
const ui={view:'home',lectureId:null,topicId:null,pane:'topic',a4memo:false,prTheme:'dark'};
let pres=null;

/* ---------- data ---------- */
function load(){try{const r=localStorage.getItem(STORE_KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.lectures)){d.deleted=d.deleted||[];return d;}}}catch(e){}return{lectures:[],deleted:[]};}
let saveT=null;
function save(now){
  const l=cur();if(l){l.updatedAt=Date.now();markDirty(l.id);}
  clearTimeout(saveT);
  const f=()=>localStorage.setItem(STORE_KEY,JSON.stringify(db));
  if(now)f();else saveT=setTimeout(f,250);
}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const newLecture=(title='')=>({id:uid(),title,totalMinutes:60,date:'',place:'',startTime:'',audience:'',cpm:280,cardChars:200,scratch:'',topics:[],createdAt:Date.now(),updatedAt:Date.now()});
const newTopic=()=>({id:uid(),title:'',summary:'',memo:'',minutes:10,cards:[newCard()]});
const newCard=()=>({id:uid(),text:''});
const cur=()=>db.lectures.find(l=>l.id===ui.lectureId);
const DIV_SRC='── .*? 정리에 보냄 ──';
const cleanScratch=s=>s.split('\n').filter(x=>!/^›/.test(x.trim())&&!/^──.*──$/.test(x.trim())).join('\n').replace(/\n{3,}/g,'\n\n').trim();
function scratchBatches(l){return (l.scratch||'').split(new RegExp(DIV_SRC)).map(cleanScratch);}
function unsentScratch(l){const b=scratchBatches(l);return b[b.length-1];}
function lastSentScratch(l){const b=scratchBatches(l);for(let i=b.length-2;i>=0;i--)if(b[i])return b[i];return '';}
function freshForPrompt(l){const u=unsentScratch(l);if(u)return{text:u,resend:false};return{text:lastSentScratch(l),resend:true};}
const stampNow=()=>{const n=new Date();return `${n.getMonth()+1}월 ${n.getDate()}일 ${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;};
const hasContent=l=>l.topics.some(t=>t.title.trim()||t.cards.some(c=>c.text.trim()));
const curTopic=()=>{const l=cur();return l&&l.topics.find(t=>t.id===ui.topicId);};

function sample(){
  const l=newLecture('글쓰기는 왜 어려운가');
  l.totalMinutes=60;l.startTime='14:00';l.place='시민도서관 강당';
  const mk=(title,summary,minutes,memo,cards)=>{const t=newTopic();Object.assign(t,{title,summary,minutes,memo});t.cards=cards.map(x=>({id:uid(),text:x}));return t;};
  l.topics=[
    mk('도입: 빈 페이지 앞의 공포','누구나 첫 문장 앞에서 멈춘다',5,'청중에게 손 들게 하기',[
      '여러분, 글을 쓰려고 앉았는데 한 글자도 못 쓴 경험 있으시죠. 저도 그렇습니다. 오늘 이 자리에 오신 분들 중 그런 경험이 한 번도 없는 분은 아마 안 계실 겁니다.',
      '그런데 어느 날 깨달았어요. 문제는 글이 아니라 "시작"이라는 걸요. 오늘은 그 시작을 어떻게 가볍게 만들 수 있는지 이야기해 보려 합니다.']),
    mk('어려움의 정체는 판단의 과부하','쓰기 전에 너무 많은 것을 동시에 결정하려 한다',15,'· 첫 책 쓸 때 경험\n· 편집자의 말',[
      '글을 쓴다는 건 사실 수십 가지 판단을 동시에 하는 일입니다. 무엇을 말할지, 어떤 순서로, 어떤 말투로, 누구에게. 이걸 한꺼번에 하려니 손이 멈추는 거죠.']),
    mk('작게 시작하는 세 가지 방법','시작의 문턱은 생각보다 낮출 수 있다',20,'· 1분짜리 단계 예시\n· 청중에게 질문 던지기',[
      '첫 번째 방법은 "한 문장만 쓰기"입니다. 좋은 문장이 아니어도 됩니다. 오늘 쓸 글의 가장 못난 문장을 먼저 쓴다고 생각해 보세요.',
      '두 번째는 "말로 먼저 하기"입니다. 친구에게 설명한다고 생각하고 녹음을 켜 보세요. 글보다 말이 훨씬 관대합니다.',
      '']),
    mk('마무리와 질의응답','',8,'',['']),
  ];

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chars=t=>(t||'').replace(/\n/g,'').length;
const estMin=(l,t)=>chars(t)/(l.cpm||280);
const topicChars=t=>t.cards.reduce((a,c)=>a+chars(c.text),0);
const topicEst=(l,t)=>topicChars(t)/(l.cpm||280);
const allocated=l=>l.topics.reduce((a,t)=>a+(+t.minutes||0),0);
const lectEst=l=>l.topics.reduce((a,t)=>a+topicEst(l,t),0);
const col=i=>COLORS[i%COLORS.length];
function fmtDur(m){if(!m||m<=0)return'0분';const s=Math.round(m*60);if(s<60)return s+'초';const mm=Math.floor(s/60),ss=s%60;return ss?`${mm}분 ${ss}초`:`${mm}분`;}
function fmtClock(ms){const s=Math.max(0,Math.floor(ms/1000));const m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function clockAt(l,off){if(!l.startTime)return'';const p=l.startTime.split(':').map(Number);if(p.length<2||isNaN(p[0]))return'';const t=p[0]*60+p[1]+Math.round(off);return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(((t%60)+60)%60).padStart(2,'0');}
function topicStart(l,i){let s=0;for(let k=0;k<i;k++)s+=(+l.topics[k].minutes||0);return s;}
function topicStatus(l,t){
  const filled=t.cards.filter(c=>c.text.trim()).length;
  if(!filled)return t.memo.trim()?{label:'메모만',cls:'st-memo'}:{label:'비어 있음',cls:'st-empty'};
  if(t.cards.some(c=>c.draft&&c.text.trim()))return{label:'초안 다듬는 중',cls:'st-wip'};
  const est=topicEst(l,t);
  if(t.minutes>0&&est>=t.minutes*0.8)return{label:'대본 완료',cls:'st-done'};
  return{label:'작성 중',cls:'st-wip'};
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function download(name,text,type='text/plain'){const b=new Blob([text],{type:type+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true;}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();return ok;}}
function autogrow(ta){ta.style.height='auto';ta.style.height=(ta.scrollHeight+2)+'px';}
const safeName=s=>(s||'lecture').replace(/[\\/:*?"<>|]+/g,'_').trim()||'lecture';

function cardFoot(l,c){const text=c.text;const n=chars(text);return`${n}자 · 약 ${fmtDur(estMin(l,text))}`+(n>l.cardChars?` <span class="warn">카드 한 장(${l.cardChars}자)을 넘깁니다</span>`:'')+(c.draft?`<span class="tag" title="클로드가 쓴 초안입니다. 고치면 표시가 사라집니다.">클로드 초안</span>`:'');}

    if(h){flush();let title=h[1].trim();let minutes=0;const m=title.match(/[(（]([^()（）]*)[)）]\s*$/);if(m){const mm=m[1].match(/(\d+)\s*분/);if(mm){minutes=+mm[1];title=title.slice(0,m.index).trim();}}title=title.replace(/^\d+[.)]\s*/,'').replace(/\*\*/g,'').trim();
      t={title,minutes,summary:'',memo:'',cards:[],short:[],note:/^(제안|시간 조정 제안|조정 제안|타임라인)$/.test(title)||(!minutes&&/(청중|질문|제안|빠지|빠진|보충|사례|비유|피드백|지적)/.test(title))};out.topics.push(t);mode='';continue;}
    const h1=line.match(/^#\s+(.+)$/);if(h1){if(!t)out.title=h1[1].replace(/\*\*/g,'').trim();continue;}
    if(!t)continue;
    if(line.startsWith('|')||/^(-{3,}|\*{3,})$/.test(line.trim()))continue;
    const ref=line.trim().match(/^\[기존\s*(\d+)\]$/);if(ref){flush();mode='';t.cards.push({ref:+ref[1]});continue;}
    if(/^>\s?/.test(line)){t.summary=(t.summary?t.summary+' ':'')+line.replace(/^>\s?/,'').trim();mode='';continue;}
    if(/^\*{0,2}메모\*{0,2}\s*[:：]/.test(line.trim())){flush();mode='memo';const rest=line.trim().replace(/^\*{0,2}메모\*{0,2}\s*[:：]\s*/,'');if(rest)t.memo+=rest.replace(/^[-*•·]\s*/,'· ')+'\n';continue;}
    if(mode==='memo'){if(!line.trim()){mode='';continue;}t.memo+=line.trim().replace(/^[-*•·]\s*/,'· ')+'\n';continue;}
    if(/^\(재료 부족[^)]*\)\s*$/.test(line.trim())){flush();t.short.push(line.trim());continue;}
    if(!line.trim()){flush();continue;}

}
const normTitle=s=>String(s||'').toLowerCase().replace(/^\d+[.)]\s*/,'').replace(/[\s\p{P}\p{S}]/gu,'');
const memoLines=m=>(m||'').split('\n').map(x=>x.trim()).filter(Boolean);
function planImport(l,parsed){
  const plan={adds:[],news:[],notes:parsed.notes,title:(!l.title.trim()&&parsed.title)?parsed.title:''};
  for(const p of parsed.topics){
    const key=normTitle(p.title);
    const ex=key?l.topics.find(t=>normTitle(t.title)===key):null;
    if(ex){
      const have=new Set(memoLines(ex.memo).map(x=>x.replace(/^[·\-•*]\s*/,'')));
      const newMemo=memoLines(p.memo).filter(x=>!have.has(x.replace(/^[·\-•*]\s*/,'')));
      const newCards=p.cards.filter(c=>typeof c==='string');
      plan.adds.push({topic:ex,p,cards:p.cards,newCards,refs:p.cards.some(c=>typeof c==='object'),fillSummary:!ex.summary.trim()&&!!p.summary,newMemo,short:p.short});
    }else plan.news.push(p);
  }
  return plan;
}
function applyImport(l,plan){
  if(plan.title)l.title=plan.title;
  if(plan.notes.length){const block=plan.notes.map(n=>`› [${n.title}]\n`+n.text.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>'› '+x).join('\n')).join('\n\n');l.scratch=(l.scratch||'').replace(/\s+$/,'')+`\n\n── ${stampNow()} 클로드 제안 ──\n${block}\n\n`;}
  l.topics=l.topics.filter(t=>t.title.trim()||t.summary.trim()||t.memo.trim()||t.cards.some(c=>c.text.trim()));
  let first=null;
  for(const a of plan.adds){const t=a.topic;if(!l.topics.includes(t))continue;
    if(a.fillSummary)t.summary=a.p.summary;
    if(a.newMemo.length)t.memo=[...memoLines(t.memo),...a.newMemo].join('\n');
    if(a.short.length)t.memo=[...memoLines(t.memo),...a.short.map(x=>'· '+x)].join('\n');
    const existing=t.cards.filter(c=>c.text.trim());
    if(a.refs){const used=new Set();const seq=[];for(const x of a.cards){if(typeof x==='object'){const c=existing[x.ref-1];if(c&&!used.has(c)){seq.push(c);used.add(c);}}else seq.push({id:uid(),text:x,draft:true});}existing.forEach(c=>{if(!used.has(c))seq.push(c);});t.cards=seq;}
    else{t.cards=existing;a.newCards.forEach(x=>t.cards.push({id:uid(),text:x,draft:true}));}
    if(!t.cards.length)t.cards.push(newCard());first=first||t;}
  for(const p of plan.news){const t=newTopic();t.title=p.title;t.minutes=p.minutes||5;t.summary=p.summary;t.memo=[...memoLines(p.memo),...p.short.map(x=>'· '+x)].join('\n');t.cards=p.cards.filter(c=>typeof c==='string').map(x=>({id:uid(),text:x,draft:true}));if(!t.cards.length)t.cards=[newCard()];l.topics.push(t);first=first||t;}
  return first;
}

/* ---------- backup to a chosen file ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('lecture.handles',1);r.onupgradeneeded=()=>r.result.createObjectStore('h');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function hGet(k){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('h','readonly').objectStore('h').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error);});}
async function hSet(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('h','readwrite').objectStore('h').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}
async function saveJsonBackup(l,chooseNew){
  const name=safeName(l.title)+'.lecture.json';const text=JSON.stringify(l,null,2);
  if(typeof window.showSaveFilePicker!=='function'){download(name,text,'application/json');toast('다운로드 폴더에 저장했습니다. 이 브라우저는 저장 위치 지정을 지원하지 않습니다.');return;}
  try{
    let h=chooseNew?null:await hGet(l.id).catch(()=>null);
    if(h){let perm='denied';try{perm=await h.queryPermission({mode:'readwrite'});if(perm!=='granted')perm=await h.requestPermission({mode:'readwrite'});}catch(e){}if(perm!=='granted')h=null;}
    if(!h){h=await window.showSaveFilePicker({suggestedName:name,types:[{description:'lecture 백업 (JSON)',accept:{'application/json':['.json']}}]});await hSet(l.id,h).catch(()=>{});}
    const w=await h.createWritable();await w.write(text);await w.close();
    toast(`"${h.name}"에 저장했습니다.`);
  }catch(e){
    if(e&&e.name==='AbortError')return;
    download(name,text,'application/json');toast('저장 창을 열 수 없어 다운로드 폴더에 저장했습니다.');
  }
}

function toMarkdown(l,withMemo){
  const out=[];out.push(`# ${l.title||'제목 없음'}`,'');
  const meta=[`총 ${l.totalMinutes}분`];if(l.date)meta.push(l.date);if(l.startTime)meta.push(`${l.startTime} 시작`);if(l.place)meta.push(l.place);if(l.audience)meta.push(`청중: ${l.audience}`);
  out.push(meta.join(' · '),'','## 타임라인','','| 시작 | 배정 | 요지 | 한 줄 요지 |','|---|---|---|---|');
  l.topics.forEach((t,i)=>{const s=clockAt(l,topicStart(l,i));out.push(`| ${s||`+${topicStart(l,i)}분`} | ${t.minutes}분 | ${t.title||'(제목 없음)'} | ${t.summary||''} |`);});
  out.push('');
  l.topics.forEach((t,i)=>{const s=clockAt(l,topicStart(l,i));out.push(`## ${i+1}. ${t.title||'(제목 없음)'} (${t.minutes}분${s?', '+s:''})`,'');if(t.summary)out.push(`> ${t.summary}`,'');if(withMemo&&t.memo.trim())out.push('메모:',t.memo.trim().split('\n').map(x=>'  '+x).join('\n'),'');const cs=t.cards.filter(c=>c.text.trim());if(!cs.length)out.push('(대본 없음)','');cs.forEach(c=>out.push(c.text.trim(),''));});
  return out.join('\n');
}

/* ---------- presentation ---------- */
function buildSlides(l){
  const s=[{type:'title'}];
  l.topics.forEach((t,ti)=>{s.push({type:'cover',ti});const cs=t.cards.filter(c=>c.text.trim());cs.forEach((c,ci)=>s.push({type:'card',ti,ci,n:cs.length,text:c.text.trim()}));});
  s.push({type:'end'});return s;
}
function startPresent(){
  const l=cur();if(!l)return;
  pres={l,slides:buildSlides(l),idx:0,startedAt:null,spent:{},enter:null,ti:null,scale:1,paused:false,pauseAt:null};
  presentEl.hidden=false;presentEl.className=ui.prTheme==='light'?'light':'';
  document.addEventListener('keydown',presKey);
  pres.timer=setInterval(drawTimers,500);
  drawSlide();
}
function stopPresent(){
  if(!pres)return;clearInterval(pres.timer);document.removeEventListener('keydown',presKey);presentEl.hidden=true;presentEl.innerHTML='';pres=null;
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
}
function presNow(){return pres.paused?pres.pauseAt:Date.now();}
function presGo(i){
  if(!pres)return;i=Math.max(0,Math.min(pres.slides.length-1,i));
  const sl=pres.slides[i];const now=presNow();
  if(pres.startedAt==null&&sl.type!=='title')pres.startedAt=now;
  const nti=sl.ti??null;
  if(nti!==pres.ti){if(pres.ti!=null&&pres.enter!=null)pres.spent[pres.ti]=(pres.spent[pres.ti]||0)+(now-pres.enter);pres.ti=nti;pres.enter=nti==null?null:now;}
  pres.idx=i;drawSlide();
}
function presKey(e){
  if(!pres)return;const k=e.key;
  if(k==='Escape'){e.preventDefault();stopPresent();return;}
  if(k==='ArrowRight'||k===' '||k==='ArrowDown'||k==='PageDown'||k==='Enter'){e.preventDefault();presGo(pres.idx+1);}
  else if(k==='ArrowLeft'||k==='ArrowUp'||k==='PageUp'||k==='Backspace'){e.preventDefault();presGo(pres.idx-1);}
  else if(k==='Home'){presGo(0);}else if(k==='End'){presGo(pres.slides.length-1);}
  else if(k==='+'||k==='='){pres.scale=Math.min(2,pres.scale+0.1);presentEl.style.setProperty('--ps',pres.scale);}
  else if(k==='-'||k==='_'){pres.scale=Math.max(0.6,pres.scale-0.1);presentEl.style.setProperty('--ps',pres.scale);}
  else if(k==='f'||k==='F'){toggleFs();}
  else if(k==='t'||k==='T'){ui.prTheme=ui.prTheme==='dark'?'light':'dark';presentEl.className=ui.prTheme==='light'?'light':'';}
  else if(k==='p'||k==='P'){togglePause();}
  else if(/^[1-9]$/.test(k)){const n=+k-1;const i=pres.slides.findIndex(s=>s.type==='cover'&&s.ti===n);if(i>=0)presGo(i);}
}
function toggleFs(){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else document.documentElement.requestFullscreen().catch(()=>toast('전체 화면을 열 수 없습니다. 브라우저의 전체 화면 기능을 써 주세요.'));}
function togglePause(){if(!pres)return;if(pres.paused){const d=Date.now()-pres.pauseAt;if(pres.startedAt!=null)pres.startedAt+=d;if(pres.enter!=null)pres.enter+=d;pres.paused=false;}else{pres.paused=true;pres.pauseAt=Date.now();}drawTimers();}
function drawSlide(){
  const {l,slides,idx}=pres;const sl=slides[idx];let main='',top='';
  const t=sl.ti!=null?l.topics[sl.ti]:null;
  if(sl.type==='title'){main=`<div class="pr-cover"><div class="k">강연</div><h2>${esc(l.title)||'제목 없음'}</h2><p>총 ${l.totalMinutes}분${l.startTime?' · '+esc(l.startTime)+' 시작':''}</p><p style="margin-top:28px;font-size:calc(15px * var(--ps))">→ 또는 스페이스로 시작 · <kbd>F</kbd> 전체 화면 · <kbd>T</kbd> 밝은 화면 · <kbd>+</kbd><kbd>-</kbd> 글자 크기 · <kbd>P</kbd> 일시정지 · 숫자 키로 요지 이동 · <kbd>Esc</kbd> 종료</p></div>`;top='시작 전';}
  else if(sl.type==='cover'){main=`<div class="pr-cover"><div class="k">요지 ${sl.ti+1} / ${l.topics.length} · ${t.minutes}분</div><h2>${esc(t.title)||'제목 없는 요지'}</h2>${t.summary?`<p>${esc(t.summary)}</p>`:''}${t.memo.trim()?`<div class="pr-memo">${esc(t.memo.trim())}</div>`:''}</div>`;top=`요지 ${sl.ti+1} 시작`;}
  else if(sl.type==='card'){main=`<div class="pr-text">${esc(sl.text)}</div>`;top=`${sl.ti+1}. ${esc(t.title)||'제목 없는 요지'} · ${sl.ci+1} / ${sl.n}`;}
  else{main=`<div class="pr-cover"><h2>끝</h2><p>질의응답 · <kbd>Esc</kbd>로 나가기</p></div>`;top='끝';}
  const next=slides[idx+1];let nx='';
  if(next){if(next.type==='cover')nx='다음 요지: '+(l.topics[next.ti].title||'제목 없는 요지');else if(next.type==='card')nx='다음: '+next.text.replace(/\s+/g,' ');else nx='다음: 끝';}
  const bar=l.topics.map((tp,i)=>`<div style="flex:${+tp.minutes||1};background:${col(i)}" class="${sl.ti===i?'cur':sl.ti!=null&&i<sl.ti?'done':''}"></div>`).join('');
  presentEl.innerHTML=`<div class="pr-top"><span class="where">${top}</span><span class="tm" id="prTm"></span><span class="tools"><button data-p="fs">전체 화면</button><button data-p="theme">밝기</button><button data-p="pause">일시정지</button><button data-p="exit">나가기</button></span></div>
    <div class="pr-main">${main}</div><div class="pr-next">${esc(nx)}</div><div class="pr-bar">${bar}</div>`;
  drawTimers();
}
presentEl.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b){return;}const a=b.dataset.p;if(a==='exit')stopPresent();else if(a==='fs')toggleFs();else if(a==='pause')togglePause();else if(a==='theme'){ui.prTheme=ui.prTheme==='dark'?'light':'dark';presentEl.className=ui.prTheme==='light'?'light':'';}});
presentEl.addEventListener('click',e=>{if(!pres||e.target.closest('[data-p]'))return;const r=presentEl.getBoundingClientRect();if(e.clientY<r.top+70)return;presGo(pres.idx+(e.clientX<r.left+r.width*0.25?-1:1));});
function drawTimers(){
  if(!pres)return;const el=document.getElementById('prTm');if(!el)return;const {l}=pres;const now=presNow();
  const elapsed=pres.startedAt==null?0:now-pres.startedAt;
  let parts=[`경과 ${fmtClock(elapsed)} / ${l.totalMinutes}분`];
  if(pres.ti!=null){const t=l.topics[pres.ti];const used=(pres.spent[pres.ti]||0)+(pres.enter!=null?now-pres.enter:0);const rem=t.minutes*60000-used;parts.push(rem>=0?`이 요지 남음 ${fmtClock(rem)}`:`<span class="late">이 요지 ${fmtClock(-rem)} 초과</span>`);
    const planned=topicStart(l,pres.ti)*60000;const diff=elapsed-used-planned;if(Math.abs(diff)>=60000)parts.push(diff>0?`<span class="late">예정보다 ${Math.round(diff/60000)}분 늦음</span>`:`예정보다 ${Math.round(-diff/60000)}분 빠름`);}
  if(pres.paused)parts.push('일시정지');
  el.innerHTML=parts.map(p=>`<span>${p}</span>`).join('');
}

/* ---------- sync (Supabase) ---------- */
const SB_URL='https://bmuslkayijcgosmgvnah.supabase.co';
const SB_KEY='sb_publishable_sEHvPL_9_RHCZK4Fpw3zoA_VM7j9pyt';
const SESS_KEY='lecture.session';
let sess=(()=>{try{return JSON.parse(localStorage.getItem(SESS_KEY))||null;}catch(e){return null;}})();
const sync={dirty:new Set(),timer:null,busy:false,last:0,lastPull:0,msg:'',err:false};
function setSess(x){sess=x;if(x)localStorage.setItem(SESS_KEY,JSON.stringify(x));else localStorage.removeItem(SESS_KEY);}
function jwtExp(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000;}catch(e){return 0;}}
async function sbFetch(path,opt={}){
  const r=await fetch(SB_URL+path,{...opt,headers:{apikey:SB_KEY,'Content-Type':'application/json',...(opt.headers||{})}});
  const text=await r.text();let j=null;try{j=text?JSON.parse(text):null;}catch(e){}
  if(!r.ok){let msg=(j&&(j.msg||j.message||j.error_description||j.error))||text||String(r.status);
    if(/relation .*lectures.* does not exist|PGRST205|Could not find the table/i.test(msg))msg='수파베이스에 lectures 표가 없습니다. supabase-setup.sql을 SQL Editor에서 실행하세요.';
    else if(/Invalid login credentials/i.test(msg))msg='이메일 또는 비밀번호가 맞지 않습니다.';
    else if(/Email not confirmed/i.test(msg))msg='이메일 확인이 아직입니다. 받은 메일의 링크를 누른 뒤 다시 로그인하세요.';
    else if(/User already registered/i.test(msg))msg='이미 가입된 이메일입니다. 로그인하세요.';
    else if(/rate limit/i.test(msg))msg='요청이 너무 잦습니다. 잠시 뒤 다시 하세요.';
    const e=new Error(msg);e.status=r.status;throw e;}
  return j;
}
async function sbSignUp(email,password){const j=await sbFetch('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});if(j&&j.access_token){setSess({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user.id,email});return true;}return false;}
async function sbSignIn(email,password){const j=await sbFetch('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});setSess({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user.id,email});}
async function sbToken(){if(!sess)return null;if(jwtExp(sess.access_token)-Date.now()<60000){let j;try{j=await sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:sess.refresh_token})});}catch(e){if(e.status===400||e.status===401){setSess(null);setSyncMsg('로그인이 풀렸습니다. 다시 로그인하세요.',true);renderSyncPanels();}throw e;}setSess({...sess,access_token:j.access_token,refresh_token:j.refresh_token});}return sess.access_token;}
async function rest(path,opt={}){const tok=await sbToken();if(!tok)throw new Error('로그인이 필요합니다.');return sbFetch('/rest/v1'+path,{...opt,headers:{Authorization:'Bearer '+tok,...(opt.headers||{})}});}
function setSyncMsg(m,err){sync.msg=m;sync.err=!!err;document.querySelectorAll('.syncstat').forEach(e=>{e.textContent=m;e.classList.toggle('err',!!err);});}
function fmtTime(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function markDirty(id){if(!id)return;sync.dirty.add(id);if(!sess)return;clearTimeout(sync.timer);sync.timer=setTimeout(flushSync,1500);}
async function pushLectures(ids){
  const rows=[];for(const id of ids){const l=db.lectures.find(x=>x.id===id);if(l)rows.push({id:l.id,user_id:sess.user,data:l,updated_at:l.updatedAt||Date.now(),deleted:false});else{const d=(db.deleted||[]).find(x=>x.id===id);if(d)rows.push({id,user_id:sess.user,data:{},updated_at:d.at,deleted:true});}}
  if(!rows.length)return;
  await rest('/lectures?on_conflict=user_id,id',{method:'POST',keepalive:true,headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});
}
async function flushSync(){
  if(!sess||sync.busy)return;const ids=[...sync.dirty];if(!ids.length)return;sync.dirty.clear();sync.busy=true;
  try{await pushLectures(ids);sync.last=Date.now();setSyncMsg(`동기화됨 ${fmtTime(sync.last)}`);}
  catch(e){ids.forEach(i=>sync.dirty.add(i));setSyncMsg('보내기 실패: '+e.message,true);}
  finally{sync.busy=false;}
}
async function pullLectures(force){
  if(!sess||sync.busy)return;if(!force&&Date.now()-sync.lastPull<10000)return;sync.busy=true;
  try{
    const rows=await rest('/lectures?select=id,data,updated_at,deleted');sync.lastPull=Date.now();
    let changed=false;const toPush=new Set();const seen=new Set();db.deleted=db.deleted||[];
    for(const r of rows){seen.add(r.id);const local=db.lectures.find(x=>x.id===r.id);const tomb=db.deleted.find(d=>d.id===r.id);
      if(r.deleted){if(local){if((local.updatedAt||0)<=r.updated_at){db.lectures=db.lectures.filter(x=>x.id!==r.id);changed=true;}else toPush.add(r.id);}continue;}
      if(tomb){if(tomb.at>=r.updated_at){toPush.add(r.id);continue;}db.deleted=db.deleted.filter(d=>d.id!==r.id);}
      if(!r.data||!Array.isArray(r.data.topics))continue;
      if(!local){db.lectures.push(r.data);changed=true;}
      else if(r.updated_at>(local.updatedAt||0)){for(const k of Object.keys(local))delete local[k];Object.assign(local,r.data);changed=true;}
      else if(r.updated_at<(local.updatedAt||0))toPush.add(r.id);}
    for(const l of db.lectures)if(!seen.has(l.id))toPush.add(l.id);
    for(const d of db.deleted)if(!seen.has(d.id))toPush.add(d.id);
    if(changed){localStorage.setItem(STORE_KEY,JSON.stringify(db));if(!pres&&!document.querySelector('.modal-bg'))render();}
    sync.busy=false;
    if(toPush.size){toPush.forEach(i=>sync.dirty.add(i));await flushSync();}
    else{sync.last=Date.now();setSyncMsg(`동기화됨 ${fmtTime(sync.last)}`);}
  }catch(e){setSyncMsg('받기 실패: '+e.message,true);}
  finally{sync.busy=false;}
}
function syncPanelHtml(compact){
  if(sess)return `<h3 style="font-size:13px;font-weight:500;margin:0 0 6px">동기화 · ${esc(sess.email)}</h3>
    <div class="syncform ${compact?'compact':''}"><button data-act="syncNow">지금 동기화</button><button class="ghost" data-act="syncOut">로그아웃</button></div>
    <div class="syncstat ${sync.err?'err':''}">${esc(sync.msg)}</div>`;
  return `<h3 style="font-size:13px;font-weight:500;margin:0 0 6px">동기화</h3>
    <div class="syncform ${compact?'compact':''}"><input type="email" class="syncEmail" placeholder="이메일" autocomplete="username" style="width:${compact?'100%':'200px'}"><input type="password" class="syncPw" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" style="width:${compact?'100%':'200px'}"><button data-act="syncIn">로그인</button><button class="ghost" data-act="syncUp">처음이면 가입</button></div>
    <div class="syncstat ${sync.err?'err':''}">${esc(sync.msg)||'로그인하면 이 브라우저의 강연과 수파베이스의 강연을 서로 맞춥니다. 같은 강연을 두 기기에서 고치면 나중에 저장한 쪽이 남습니다.'}</div>`;
}
function renderSyncPanels(){document.querySelectorAll('.syncbox').forEach(e=>e.innerHTML=syncPanelHtml(false));const m=document.querySelector('details.menu .syncform');if(m)m.parentElement.innerHTML=syncPanelHtml(true);}
app.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(!/^sync(In|Up|Out|Now)$/.test(act))return;
  const box=b.closest('.syncbox,details.menu')||app;
  const email=(box.querySelector('.syncEmail')||{}).value||'',pw=(box.querySelector('.syncPw')||{}).value||'';
  try{
    if(act==='syncOut'){setSess(null);sync.dirty.clear();setSyncMsg('');renderSyncPanels();return;}
    if(act==='syncNow'){setSyncMsg('동기화 중…');await pullLectures(true);return;}
    if(!email||!pw){setSyncMsg('이메일과 비밀번호를 넣으세요.',true);return;}
    if(pw.length<6){setSyncMsg('비밀번호는 6자 이상이어야 합니다.',true);return;}
    b.disabled=true;setSyncMsg(act==='syncUp'?'가입 중…':'로그인 중…');
    if(act==='syncUp'){const ok=await sbSignUp(email,pw);if(!ok){setSyncMsg('확인 메일을 보냈습니다. 메일의 링크를 누른 뒤 여기서 로그인하세요.');b.disabled=false;return;}}
    else await sbSignIn(email,pw);
    setSyncMsg('로그인했습니다. 동기화 중…');renderSyncPanels();
    db.lectures.forEach(l=>sync.dirty.add(l.id));(db.deleted||[]).forEach(d=>sync.dirty.add(d.id));
    await pullLectures(true);renderSyncPanels();
  }catch(err){setSyncMsg(err.message||String(err),true);b.disabled=false;}
});
window.addEventListener('focus',()=>pullLectures(false));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullLectures(false);else if(sync.dirty.size)flushSync();});
window.addEventListener('beforeunload',()=>{if(sync.dirty.size)flushSync();});

render();
if(sess){setSyncMsg('동기화 확인 중…');pullLectures(true);}
</script>
