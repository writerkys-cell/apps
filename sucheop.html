<title>수첩</title>
<style>
:root{
  --bg:#f6f5f0; --panel:#ffffff; --panel2:#f1efe8; --ink:#1f1f1d; --ink2:#5f5e5a; --muted:#8a8984;
  --line:#e2e0d8; --line2:#c9c7bf; --accent:#534ab7; --accent-bg:#eeedfe; --star:#c98a1b;
  --warn:#854f0b; --warn-bg:#faeeda; --bad:#a32d2d; --ok:#0f6e56;
  --font:-apple-system,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 14px);max-width:640px;margin:0 auto}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:9px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.small{padding:3px 10px;font-size:13px;border-radius:8px}
button.danger{color:var(--bad)}
button:disabled{opacity:.5}
input,textarea{font:inherit;font-size:16px;color:inherit;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
textarea{resize:none;line-height:1.7;display:block}
.head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.head h1{font-size:19px;font-weight:600;margin:0;flex:1;letter-spacing:-.01em}
.head .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--line2)}
.head .dot.ok{background:var(--ok)} .head .dot.wait{background:var(--star)} .head .dot.off{background:var(--bad)}
#text{min-height:156px;font-size:17px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row .grow{flex:1}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:14px;margin-top:12px}
.sec{font-size:13px;color:var(--muted);margin:22px 2px 8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.item .t{white-space:pre-wrap;word-break:break-word}
.item .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.item .m .sp{flex:1}
.item.wait{border-style:dashed}
.item.done .t{color:var(--ink2)}
.item textarea{font-size:16px;min-height:60px}
.login{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)} .smalltxt{font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.foot{margin-top:26px;font-size:12px;color:var(--muted);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
'use strict';
/* 수첩 — 떠오른 생각을 아이폰에서 적기만 하는 작은 앱 (파일 sucheop.html, 2026-11-19). 문득(storyS.html)을 본으로 삼았다.
   작품을 고르지 않는다. 적은 것은 수파베이스의 sucheop 표에 한 줄씩 보태고, 맥의 "정리"(jeongri.html)가 읽어 아이디어 탭에 보인다.
   연결이 없거나 표가 아직 없으면 이 기기에 두었다가(queue) 연결되면 올린다.
   저장소 열쇠는 sucheop.v1. 로그인은 같은 주소의 storyM·문득·정리와 함께 쓴다(storyM.session) */
const STORE_KEY='sucheop.v1';
const SESS_KEY='storyM.session';
const TABLE='sucheop';
const lsGet=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}};
/* 주소와 열쇠는 storyM과 같다. 시험할 때만 저장소의 storyM.sbUrl·storyM.sbKey로 가짜 서버를 가리킨다 */
const SB_URL=lsGet('storyM.sbUrl')||'https://bmuslkayijcgosmgvnah.supabase.co';
const SB_KEY=lsGet('storyM.sbKey')||'sb_publishable_sEHvPL_9_RHCZK4Fpw3zoA_VM7j9pyt';
const app=document.getElementById('app');
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400);}
function autogrow(ta){ta.style.height='auto';ta.style.height=(ta.scrollHeight+2)+'px';}

/* S.queue: 아직 올리지 못한 것 [{op:'add',row} | {op:'patch',id,fields}]. S.recent: 아직 정리하지 않은 것(읽어 온 것)
   목록에는 맥의 정리에서 아직 처리하지 않은 메모(state 'new')만 보인다. 카드가 됐거나 storyM으로 보낸 것은 바로 사라진다(2026년 11월 19일, 작가가 정함). 표에는 그대로 남는다 */
let S=(()=>{try{const d=JSON.parse(localStorage.getItem(STORE_KEY));if(d&&typeof d==='object')return Object.assign({queue:[],recent:[],noTable:false},d);}catch(e){}return{queue:[],recent:[],noTable:false};})();
const persist=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify(S));}catch(e){}};
let sess=(()=>{try{return JSON.parse(localStorage.getItem(SESS_KEY))||null;}catch(e){return null;}})();
function setSess(x){sess=x;try{if(x)localStorage.setItem(SESS_KEY,JSON.stringify(x));else localStorage.removeItem(SESS_KEY);}catch(e){}}
const ui={draft:'',edit:null,busy:false,net:''};

/* ---------- 수파베이스 ---------- */
function jwtExp(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000;}catch(e){return 0;}}
async function sbFetch(path,opt={}){
  const r=await fetch(SB_URL+path,{...opt,headers:{apikey:SB_KEY,'Content-Type':'application/json',...(opt.headers||{})}});
  const text=await r.text();let j=null;try{j=text?JSON.parse(text):null;}catch(e){}
  if(!r.ok){let msg=(j&&(j.msg||j.message||j.error_description||j.error))||text||String(r.status);
    const noTable=/relation .* does not exist|PGRST205|Could not find the table/i.test(msg+' '+((j&&j.code)||''));
    if(/Invalid login credentials/i.test(msg))msg='이메일 또는 비밀번호가 맞지 않습니다.';
    else if(/Email not confirmed/i.test(msg))msg='이메일 확인이 아직입니다.';
    const e=new Error(msg);e.status=r.status;e.noTable=noTable;throw e;}
  return j;
}
async function signIn(email,password){const j=await sbFetch('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});setSess({access_token:j.access_token,refresh_token:j.refresh_token,user:j.user.id,email});}
/* 토큰 — 같은 주소의 다른 앱이 같은 로그인을 함께 쓴다. 저쪽이 먼저 새로 받았으면 그것을 쓰고, 새로 받기는 한 번에 하나만 */
let tokP=null;
async function token(){if(!sess)return null;
  try{const s=JSON.parse(localStorage.getItem(SESS_KEY));if(s&&s.access_token&&s.user===sess.user&&jwtExp(s.access_token)>jwtExp(sess.access_token))sess=s;}catch(e){}
  if(jwtExp(sess.access_token)-Date.now()<60000){
    if(!tokP)tokP=(async()=>{let j;try{j=await sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:sess.refresh_token})});}catch(e){if(e.status===400||e.status===401){setSess(null);render();}throw e;}setSess({...sess,access_token:j.access_token,refresh_token:j.refresh_token});})().finally(()=>{tokP=null;});
    await tokP;}
  return sess?sess.access_token:null;}
async function rest(path,opt={}){const tok=await token();if(!tok)throw new Error('로그인이 필요합니다.');return sbFetch('/rest/v1'+path,{...opt,headers:{Authorization:'Bearer '+tok,...(opt.headers||{})}});}

/* ---------- 최근 적은 것 · 올리기 ---------- */
async function loadRecent(){
  if(!sess)return;
  try{const rows=await rest(`/${TABLE}?select=id,text,state,origin,meta,created_at,updated_at&deleted=eq.false&state=eq.new&order=created_at.desc&limit=50`);
    S.recent=rows||[];S.noTable=false;ui.net='ok';persist();paintList();paintHead();}
  catch(e){if(e.noTable){S.noTable=true;persist();paintList();}else ui.net=navigator.onLine===false?'off':'err';paintHead();}
}
/* 올리기 — 보태기(add)는 새 id라 다른 것을 덮지 않는다. 고치기(patch)는 아직 "새것"인 줄만 고친다(맥에서 이미 카드로 만든 것은 건드리지 않는다) */
async function flush(){
  if(!sess||ui.busy||!S.queue.length)return;ui.busy=true;paintHead();
  try{
    while(S.queue.length){const q=S.queue[0];
      if(q.op==='add'){await rest(`/${TABLE}?on_conflict=user_id,id`,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([Object.assign({user_id:sess.user},q.row)])});}
      else{const got=await rest(`/${TABLE}?id=eq.${encodeURIComponent(q.id)}&state=eq.new`,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(q.fields)});
        if(Array.isArray(got)&&!got.length)toast('맥에서 이미 정리한 메모라 고치지 않았습니다.');}
      S.queue.shift();persist();}
    S.noTable=false;ui.net='ok';persist();
    await loadRecent();
  }catch(e){if(e.noTable){S.noTable=true;persist();}else ui.net=navigator.onLine===false?'off':'err';}
  finally{ui.busy=false;paintHead();paintList();}
}
function saveNote(){
  const ta=document.getElementById('text');const text=(ta.value||'').trim();
  if(!text){toast('적은 것이 없습니다.');ta.focus();return;}
  const now=Date.now();
  S.queue.push({op:'add',row:{id:uid(),text,origin:'phone',state:'new',meta:{},created_at:now,updated_at:now,deleted:false}});
  ui.draft='';ta.value='';autogrow(ta);persist();
  paintList();paintHead();toast('적었습니다');ta.focus();
  flush();
}

/* ---------- 화면 ---------- */
function render(){
  if(!sess){
    app.innerHTML=`<div class="head"><h1>수첩</h1></div>
      <p class="muted">떠오른 생각을 적어 두면 맥의 "정리"에서 카드로 만듭니다. storyM과 같은 계정으로 로그인해 주세요. 한 번만 하면 됩니다.</p>
      <div class="login"><input type="email" id="email" placeholder="이메일" autocomplete="username"><input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password"><button class="primary" data-act="login">로그인</button><div class="smalltxt" id="loginMsg" style="color:var(--bad)"></div></div>
      ${S.queue.length?`<div class="note">이 기기에 적어 둔 메모 ${S.queue.length}개가 있습니다. 로그인하면 올립니다.</div>`:''}`;
    return;}
  app.innerHTML=`<div class="head"><h1>수첩</h1><span class="dot" id="dot"></span></div>
    <textarea id="text" placeholder="떠오른 생각" autofocus>${esc(ui.draft)}</textarea>
    <div class="row"><span class="grow"></span><button class="primary" data-act="save" style="min-width:96px">저장</button></div>
    <div id="notes"></div>
    <div id="list"></div>
    <div class="foot"><span>${esc(sess.email||'')}</span><span><button class="small" data-act="reload">다시 읽기</button> <button class="small" data-act="logout">로그아웃</button></span></div>`;
  paintHead();paintList();
  const ta=document.getElementById('text');autogrow(ta);
  /* 열자마자 적을 수 있게 — 아이폰은 화면을 한 번 건드려야 자판이 올라오는 때가 있다 */
  if(!ui.edit){try{ta.focus({preventScroll:true});}catch(e){ta.focus();}}
}
function paintHead(){
  const d=document.getElementById('dot');if(d){const st=ui.busy?'wait':S.queue.length?(ui.net==='off'||ui.net==='err'?'off':'wait'):(ui.net==='ok'?'ok':ui.net==='off'||ui.net==='err'?'off':'');d.className='dot '+st;d.title=st==='ok'?'모두 올렸습니다':st==='wait'?'올리는 중이거나 올릴 것이 있습니다':st==='off'?'연결이 없습니다':'';}
  const n=document.getElementById('notes');if(n){const out=[];
    if(S.noTable)out.push('<div class="note">수첩의 표가 아직 없습니다. 맥의 정리 설정에서 "표 SQL 복사"로 복사해 수파베이스에서 실행해 주세요. 그때까지 적은 것은 이 기기에 쌓아 둡니다.</div>');
    else if(S.queue.length&&!ui.busy)out.push(`<div class="note">아직 올리지 못한 것 ${S.queue.length}개. 연결되면 올립니다. <button class="small" data-act="flush">지금 올리기</button></div>`);
    n.innerHTML=out.join('');}
}
const whenTxt=ts=>{const d=new Date(ts);return `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
function paintList(){
  const box=document.getElementById('list');if(!box)return;
  const patch={};S.queue.forEach(q=>{if(q.op==='patch')patch[q.id]=Object.assign(patch[q.id]||{},q.fields);});
  const waits=S.queue.filter(q=>q.op==='add'&&!q.row.deleted).map(q=>Object.assign({},q.row,{_wait:true})).reverse();
  const got=(S.recent||[]).filter(r=>!waits.some(w=>w.id===r.id)).map(r=>Object.assign({},r,patch[r.id]||{})).filter(r=>!r.deleted&&r.state==='new');
  const rows=waits.concat(got);
  const one=r=>{const edit=ui.edit===r.id;const can=r.state==='new';const to=(r.meta||{}).to;
    return `<div class="item ${r._wait?'wait':''} ${can?'':'done'}">${edit?`<textarea id="ed-${r.id}">${esc(r.text)}</textarea>`:`<div class="t">${esc(r.text)}</div>`}
      <div class="m"><span>${whenTxt(r.created_at)}</span>${r._wait?'<span>아직 올리지 못함</span>':''}${can?'':`<span>${to==='storyM'?'storyM으로 보냄':to==='merged'?'다른 메모와 합침':'카드가 됨'}</span>`}${r.origin&&r.origin!=='phone'?`<span>${r.origin==='taiping'?'타이핑에서':'맥에서'}</span>`:''}<span class="sp"></span>
        ${edit?`<button class="small" data-act="edSave" data-id="${r.id}">고친 것 저장</button><button class="small" data-act="edCancel">그만</button>`:can?`<button class="small" data-act="ed" data-id="${r.id}">고치기</button><button class="small danger" data-act="del" data-id="${r.id}">지우기</button>`:''}</div></div>`;};
  box.innerHTML=`<div class="sec">아직 정리하지 않은 것${rows.length?' '+rows.length:''}</div>${rows.map(one).join('')||'<div class="muted smalltxt" style="padding:4px 2px">정리하지 않은 메모가 없습니다.</div>'}`;
  const ed=ui.edit&&document.getElementById('ed-'+ui.edit);if(ed){autogrow(ed);ed.focus();}
}
/* 고치기·지우기 — 아직 올리지 못한 것은 이 기기에서 바로, 올린 것은 "새것"일 때만 */
function changeNote(id,fields){
  const q=S.queue.find(x=>x.op==='add'&&x.row.id===id);
  if(q){Object.assign(q.row,fields,{updated_at:Date.now()});if(fields.deleted)S.queue=S.queue.filter(x=>x!==q);}
  else S.queue.push({op:'patch',id,fields:Object.assign({},fields,{updated_at:Date.now()})});
  persist();paintList();paintHead();flush();
}
app.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=b.dataset.id;
  if(act==='login'){const em=document.getElementById('email').value.trim(),pw=document.getElementById('pw').value;const m=document.getElementById('loginMsg');
    if(!em||!pw){m.textContent='이메일과 비밀번호를 넣어 주세요.';return;}b.disabled=true;m.textContent='';
    try{await signIn(em,pw);render();await flush();await loadRecent();}catch(err){m.textContent=err.message||String(err);b.disabled=false;}return;}
  if(act==='save'){saveNote();return;}
  if(act==='flush'){flush();return;}
  if(act==='reload'){await flush();await loadRecent();toast('다시 읽었습니다');return;}
  if(act==='logout'){if(S.queue.length&&!confirm(`아직 올리지 못한 것 ${S.queue.length}개가 이 기기에 남습니다. 로그아웃할까요?`))return;setSess(null);render();return;}
  if(act==='ed'){ui.edit=id;paintList();return;}
  if(act==='edCancel'){ui.edit=null;paintList();return;}
  if(act==='edSave'){const ta=document.getElementById('ed-'+id);const t=(ta.value||'').trim();ui.edit=null;if(!t){paintList();return;}changeNote(id,{text:t});toast('고쳤습니다');return;}
  if(act==='del'){if(!confirm('이 메모를 지울까요?'))return;changeNote(id,{deleted:true});return;}
});
app.addEventListener('input',e=>{const el=e.target;if(el.id==='text'){ui.draft=el.value;autogrow(el);}else if(el.tagName==='TEXTAREA')autogrow(el);});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&e.target.id==='text'){e.preventDefault();saveNote();}});
window.addEventListener('online',()=>{ui.net='';flush().then(loadRecent);});
window.addEventListener('offline',()=>{ui.net='off';paintHead();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&sess){flush().then(loadRecent);}});
setInterval(()=>{if(sess&&S.queue.length&&document.visibilityState==='visible')flush();},30000);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sucheop-sw.js',{scope:'./sucheop'}).catch(()=>{});}
render();
if(sess){flush().then(loadRecent);}
</script>
</body>
</html>
