<style>
:root{ --paper:#f2ede1; --paper-2:#e8e0cf; --ink:#23201c; --ink-soft:#736a59; --line:#d6ccb6; --seal:#9b3b32; --deep:#3f5566; --void:#8c8577; --radius:2px; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:'Gowun Batang',"Apple SD Gothic Neo",Batang,serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:21px;margin:0;letter-spacing:.14em;font-weight:700}
header .st{font-size:12.5px;color:var(--ink-soft)}
header .st.err{color:var(--seal)}
.seg{display:flex;margin-left:auto}
.seg button{background:none;border:1px solid var(--line);padding:6px 16px;font-size:14.5px;color:var(--ink-soft);border-radius:var(--radius)}
.seg button+button{margin-left:-1px}
.seg button.on{background:var(--seal);border-color:var(--seal);color:var(--paper)}
.seg button.on.c{background:var(--deep);border-color:var(--deep)}
main{max-width:600px;margin:0 auto;padding:34px 20px calc(60px + env(safe-area-inset-bottom))}
.q{font-size:22px;line-height:1.85;letter-spacing:.01em;word-break:keep-all;overflow-wrap:anywhere;margin:0 0 18px;white-space:pre-wrap}
.q.long{font-size:19px;line-height:1.8}
.m{font-size:13.5px;color:var(--ink-soft);line-height:1.7}
.m b{font-weight:400;color:var(--ink)}
.rowbtns{display:flex;gap:12px;align-items:center;margin-top:34px;flex-wrap:wrap}
.primary{background:var(--ink);color:var(--paper);border:none;padding:13px 30px;border-radius:var(--radius);font-size:17px;letter-spacing:.1em;min-width:55%}
.linkish{background:none;border:none;color:var(--ink-soft);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:4px}
a.linkish{display:inline-block}
.note{font-size:14.5px;color:var(--ink-soft);line-height:1.8}
.foot{margin-top:46px;display:flex;gap:14px;flex-wrap:wrap}
.field{margin-top:22px}
.field label{display:block;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;margin-bottom:5px}
input[type=text],input[type=password]{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);padding:8px 2px;font-size:18px;border-radius:0}
input:focus{outline:none;border-bottom-color:var(--seal)}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:var(--radius);font-size:14.5px;z-index:80;opacity:0;pointer-events:none;transition:opacity .18s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>밑줄 뽑기</h1><span class="st" id="st"></span>
  <div class="seg" id="seg"><button id="m-q" onclick="setMode('quote')">밑줄</button><button id="m-c" class="c" onclick="setMode('comment')">코멘트</button></div></header>
<main id="view"></main>
<div id="toast"></div>
<script>
"use strict";
/* 밑줄 뽑기 — 서가(seoga.html)의 아이폰 클라이언트(2026년 11월 19일).
   서가에 저장된 밑줄에서 하나를 무작위로 뽑아 크게 보여 준다. 글쓰기를 시작할 때의 자극이다. 기본은 밑줄, 고르면 코멘트.
   읽기만 한다. 서가의 표에 아무것도 쓰지 않고, 뽑은 것도 저장하지 않는다.
   2026년 11월 20일부터 "수첩에 적기" — 뽑힌 글을 수첩(sucheop.html)의 입력창에 넣은 채로 연다(toNote). 글로 쓰고 싶은 밑줄에 생각을 덧붙여 정리로 보내는 길이다. 여기서는 주소만 만들고 아무 데도 쓰지 않는다.
     · 밑줄: seoga_reads에서 『밑줄들』(bookId 'underlines')의 kind:'mark' 줄과, 책에 적으며 밑줄로 고른 줄(quote:true, kind 'mark'|'scan') — 서가 한눈에 탭의 밑줄 뽑기(drawPool)와 같다.
     · 코멘트: 책에 적은 코멘트(kind 'mark'|'scan', quote가 아니고 『밑줄들』이 아닌 것).
     · gone인 줄과 글이 없는 줄은 뺀다. 책 제목·지은이는 seoga_books에서 붙인다(처분한 책도 남아 있다).
   서가에서 밑줄·코멘트의 모양(kind, quote, bookId, text, page, date, gone)을 바꾸면 이 파일의 build()도 고친다.
   연결 정보는 서가와 같은 localStorage 'seoga.sb'({url,key}). 받아온 것은 'seoga.draw.cache'에 두어 끊겨 있어도 뽑힌다. */
const SBKEY='seoga.sb', CACHEKEY='seoga.draw.cache', MODEKEY='seoga.draw.mode', JAR='underlines';
const NOTE_URL='./sucheop.html', CURKEY='seoga.draw.cur';   /* 수첩(같은 폴더), 수첩에 다녀오는 동안 뽑혀 있던 것을 기억하는 자리(이 창에서만) */
const lsGet=(k,d)=>{ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
let cfg=lsGet(SBKEY,{}), C=lsGet(CACHEKEY,{quote:[],comment:[],at:''});
let mode='quote', cur=null, setup=false, loading=false;   /* 열 때마다 밑줄부터 */
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }
function setState(s){ const el=document.getElementById('st'); el.textContent={busy:'받는 중',err:'연결 안 됨'}[s]||''; el.classList.toggle('err',s==='err'); }
async function rest(path){
  const r=await fetch(cfg.url+'/rest/v1/'+path,{headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key}});
  if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
}
async function getAll(path){ let all=[], off=0;
  for(;;){ const rows=await rest(path+(path.includes('?')?'&':'?')+'order=id&limit=1000&offset='+off)||[]; all=all.concat(rows); if(rows.length<1000) break; off+=1000; }
  return all; }
/* 줄들 → 뽑을 거리 둘 */
function build(reads,books){
  const by=new Map(books.map(b=>[b.id,b])), quote=[], comment=[];
  reads.forEach(x=>{ if(!x||x.gone||!(x.kind==='mark'||x.kind==='scan')) return; const t=(x.text||'').trim(); if(!t) return;
    const jar=x.bookId===JAR, b=jar?null:by.get(x.bookId);
    const it={id:x.id,t,title:jar?'':((b&&b.title)||x.title||''),author:(b&&b.author)||'',page:x.page||0,date:x.date||''};
    if(jar){ if(x.kind==='mark') quote.push(it); } else if(x.quote) quote.push(it); else comment.push(it); });
  return {quote,comment};
}
async function load(){
  if(!cfg.url||!cfg.key||loading) return; loading=true; setState('busy');
  try{
    const [rd,bk]=await Promise.all([getAll('seoga_reads?select=id,data&data->>kind=in.(mark,scan)'),getAll('seoga_books?select=id,data')]);
    const p=build(rd.map(r=>r.data),bk.map(r=>r.data).filter(b=>b&&!b.purged));
    C={quote:p.quote,comment:p.comment,at:new Date().toISOString()}; lsSet(CACHEKEY,C); setState('');
  }catch(e){ setState('err'); }
  loading=false;
  if(!cur||!C[mode].some(x=>x.id===cur.id)){ cur=null; draw(); } else render();
}
function md(d){ return /^\d{4}-\d{2}-\d{2}/.test(d)?(+d.slice(0,4))+'년 '+(+d.slice(5,7))+'월 '+(+d.slice(8,10))+'일':''; }
/* 순수한 무작위. 둘 이상이면 바로 앞의 것만 피한다(서가와 같다). */
function draw(){
  const pool=C[mode]||[]; if(!pool.length){ cur=null; render(); return; }
  const rest=pool.length>1&&cur?pool.filter(x=>x.id!==cur.id):pool;
  cur=rest[Math.floor(Math.random()*rest.length)]; render(); window.scrollTo(0,0);
}
function setMode(m){ if(mode===m) return; mode=m; cur=null; draw(); }
/* 수첩에 적기 — 뽑힌 글과 출처(『제목』, 지은이, 쪽)를 수첩의 입력창에 넣은 채로 같은 창에서 연다. 수첩이 주소의 #적기= 를 읽는다.
   돌아왔을 때 같은 글이 보이도록 뽑혀 있던 것을 이 창의 sessionStorage에 적어 둔다 */
function noteText(x){ const src=[x.title?'『'+x.title+'』':'',x.author,x.page?x.page+'쪽':''].filter(Boolean).join(', '); return x.t+(src?'\n'+src:'')+'\n\n'; }
function toNote(){ if(!cur) return;
  try{ sessionStorage.setItem(CURKEY,JSON.stringify({mode,id:cur.id})); }catch(e){}
  location.href=NOTE_URL+'#적기='+encodeURIComponent(noteText(cur))+'&돌아갈곳=seoga-draw.html'; }
function restoreCur(){ let k=null; try{ k=JSON.parse(sessionStorage.getItem(CURKEY)); sessionStorage.removeItem(CURKEY); }catch(e){}
  if(!k||!(k.mode==='quote'||k.mode==='comment')) return false;
  const x=(C[k.mode]||[]).find(y=>y.id===k.id); if(!x) return false; mode=k.mode; cur=x; render(); return true; }
function render(){
  document.getElementById('m-q').classList.toggle('on',mode==='quote'); document.getElementById('m-c').classList.toggle('on',mode==='comment');
  document.getElementById('seg').style.display=(setup||!cfg.url)?'none':'';
  const el=document.getElementById('view'), name=mode==='quote'?'밑줄':'코멘트';
  if(setup||!cfg.url||!cfg.key){ el.innerHTML=`<p class="note" style="margin-top:0">서가 설정에 넣은 Supabase 주소와 anon 키를 넣으면 밑줄을 받아옵니다. 이 기기에만 저장됩니다.</p>
    <div class="field"><label>프로젝트 주소</label><input type="text" id="s-url" value="${esc(cfg.url||'')}" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label>anon 키</label><input type="password" id="s-key" value="${esc(cfg.key||'')}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="rowbtns"><button class="primary" onclick="saveCfg()">연결하기</button>${cfg.url?`<button class="linkish" onclick="setup=false;render()">그만두기</button>`:''}</div>`; return; }
  const foot=`<div class="foot"><span class="m">${name} ${(C[mode]||[]).length}개</span><a class="linkish" href="./seoga.html">서가 열기</a><button class="linkish" onclick="load()">다시 받기</button><button class="linkish" onclick="setup=true;render()">연결 고치기</button></div>`;
  if(!cur){ el.innerHTML=`<p class="note">${C.at?(mode==='quote'?'아직 밑줄이 없습니다. 서가의 한눈에 탭 ‘밑줄 적기’나, 책에 글을 적을 때 ‘밑줄’을 골라 적으면 여기서 뽑힙니다.':'아직 코멘트가 없습니다.'):'받아오는 중입니다.'}</p>${foot}`; return; }
  const meta=[cur.title?'<b>'+esc(cur.title)+'</b>':'',esc(cur.author),cur.page?cur.page+'쪽':'',md(cur.date)].filter(Boolean).join(' · ');
  el.innerHTML=`<p class="q${cur.t.length>160?' long':''}">${esc(cur.t)}</p><div class="m">${meta}</div>
    <div class="rowbtns"><button class="primary" onclick="draw()">다시 뽑기</button><button class="linkish" onclick="toNote()">수첩에 적기</button></div>${foot}`;
}
function saveCfg(){
  const u=document.getElementById('s-url').value.trim().replace(/\/+$/,''), k=document.getElementById('s-key').value.trim();
  if(!/^https?:\/\/\S+$/.test(u)||!k){ toast('주소와 키를 모두 넣어주세요'); return; }
  cfg={url:u,key:k}; lsSet(SBKEY,cfg); setup=false; render(); load();
}
if(!restoreCur()) draw();          /* 수첩에 다녀왔으면 그 글을, 아니면 받아 둔 것에서 먼저 하나 뽑고 */
load();          /* 새로 받아온다(뽑힌 것은 그대로 둔다) */
window.addEventListener('online',()=>load());
</script>
</body>
</html>
