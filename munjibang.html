<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCFBF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="문지방">
<title>문지방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FCFBF7;
    --card:#FFFFFF;
    --ink:#35322C;
    --ink-soft:#857F72;
    --ink-faint:#B9B4A8;
    --accent:#3E8E7E;
    --accent-soft:#A6CFC5;
    --line:#E9E5DA;
    --serif:'Gowun Batang','Noto Serif KR',serif;
    --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); min-height:100vh;
    display:flex; justify-content:center; -webkit-font-smoothing:antialiased;
  }
  #app{
    width:100%; max-width:560px; min-height:100vh; overflow-x:hidden;
    padding:max(18px,env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
  }
  main{ flex:1; display:flex; flex-direction:column; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:26px; color:var(--ink-soft); font-size:13px; letter-spacing:.02em;
  }
  .topbar .date-home{
    background:none; border:none; padding:4px 0; margin:0; font-family:inherit;
    font-size:13px; color:var(--ink-soft); letter-spacing:.02em;
    font-variant-numeric:tabular-nums; cursor:pointer; border-bottom:1px dotted var(--line);
  }
  .topbar .icons{ display:flex; gap:14px; }
  .icon-btn{ background:none; border:none; cursor:pointer; font-size:16px; color:var(--ink-soft); padding:4px; line-height:1; font-family:inherit; }
  .icon-btn:active,.topbar .date-home:active{ opacity:.6; }

  .eyebrow{ font-family:var(--serif); color:var(--accent); font-size:13px; letter-spacing:.08em; margin-bottom:8px; }
  h1.q{ font-family:var(--serif); font-weight:400; font-size:24px; line-height:1.45; margin:0 0 6px; }
  p.sub{ color:var(--ink-soft); font-size:14px; line-height:1.65; margin:0 0 22px; }

  /* 관문 */
  main.centered{ justify-content:center; }
  .gate-wrap{ display:flex; flex-direction:column; padding:6px 0 0; }
  .gate-line{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .gate-cat{ font-family:var(--serif); font-size:14px; letter-spacing:.1em; color:var(--accent); }
  .gate-re{ background:none; border:none; font-family:inherit; font-size:12.5px; color:var(--ink-faint); cursor:pointer; padding:2px 0; }
  .gate-re:active{ opacity:.6; }
  .gate-text{
    font-family:var(--serif); font-size:20px; line-height:1.85;
    border-left:2px solid var(--accent-soft); padding:2px 0 2px 16px;
    margin-bottom:24px; white-space:pre-wrap;
  }
  textarea{
    display:block; width:100%; max-width:100%; min-width:0; min-height:130px;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:15px; font-family:var(--serif); font-size:16.5px; line-height:1.8;
    color:var(--ink); resize:vertical; outline:none; -webkit-appearance:none; appearance:none;
  }
  textarea:focus{ border-color:var(--accent-soft); }
  textarea::placeholder{ color:var(--ink-faint); }
  .counter{ text-align:right; font-size:12px; color:var(--ink-faint); margin-top:7px; font-variant-numeric:tabular-nums; }
  .counter.done{ color:var(--accent); }

  .btn-row{ display:flex; gap:10px; margin-top:16px; }
  .btn{
    flex:1; border:none; border-radius:10px; padding:14px 14px; font-size:15px;
    font-family:var(--sans); font-weight:500; cursor:pointer; text-align:center;
  }
  .btn:active{ transform:translateY(1px); }
  .btn.primary{ background:var(--ink); color:#fff; }
  .btn.primary:disabled{ background:#E4E0D6; color:#A9A49A; cursor:default; transform:none; }
  .btn.accent{ background:var(--accent); color:#fff; }
  .btn.secondary{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn.danger{ background:none; color:#B4553F; border:1px solid #E7CFC6; }
  .btn.full{ flex:none; width:100%; }
  .quiet-row{ text-align:center; margin-top:12px; }
  .quiet{ background:none; border:none; font-family:inherit; font-size:13px; color:var(--ink-faint); cursor:pointer; padding:6px 8px; }
  .quiet:active{ opacity:.6; }

  /* 연결 대기 */
  .ready-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; }
  .ready-card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:22px 20px; text-align:left; font-family:var(--serif);
    font-size:17px; line-height:1.8; white-space:pre-wrap; margin-bottom:8px;
  }
  .ready-note{ font-size:12.5px; color:var(--ink-faint); margin-bottom:26px; }

  /* 접속 중 */
  .browsing-wrap{ flex:1; display:flex; flex-direction:column; justify-content:center; text-align:center; padding:6px 0 16px; }
  .b-label{ font-size:12.5px; color:var(--ink-soft); letter-spacing:.04em; margin-bottom:12px; }
  .b-anchor{
    font-family:var(--serif); font-size:17px; line-height:1.8; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:18px; margin-bottom:22px; white-space:pre-wrap;
  }
  .b-clock{ font-family:var(--serif); font-size:38px; color:var(--accent); line-height:1.2; font-variant-numeric:tabular-nums; }
  .b-since{ font-size:12.5px; color:var(--ink-faint); margin-top:6px; }
  .b-chimes{ font-size:12.5px; color:var(--ink-soft); margin-top:14px; }

  /* 마무리 */
  .chip-row{ display:flex; flex-wrap:wrap; gap:7px; margin-top:8px; }
  .chip{
    border:1px solid var(--line); background:var(--card); color:var(--ink-soft);
    border-radius:20px; padding:9px 13px; font-size:13px; font-family:var(--sans); cursor:pointer;
  }
  .chip.sel{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .field-label{ font-size:13px; color:var(--ink-soft); margin:22px 0 8px; }
  .b-rule{ font-size:12.5px; color:var(--ink-faint); margin-top:18px; letter-spacing:.02em; }
  .todo{ border-top:1px solid var(--line); margin-top:20px; padding-top:8px; }
  .todo-item{ display:flex; align-items:flex-start; gap:10px; padding:7px 0; }
  .todo-item input[type=checkbox]{
    width:15px; height:15px; margin:4px 0 0; flex-shrink:0;
    accent-color:var(--accent); cursor:pointer; opacity:.75;
  }
  .todo-item .t-text{ flex:1; min-width:0; font-family:var(--serif); font-size:15px; line-height:1.6; word-break:break-word; }
  .todo-item.done .t-text{ color:var(--ink-faint); text-decoration:line-through; }
  .t-del{ background:none; border:none; color:#DCD8CD; font-size:14px; cursor:pointer; padding:0 2px; line-height:1.5; font-family:inherit; }
  .t-del:hover{ color:var(--ink); }
  .todo-plus{ background:none; border:none; color:var(--ink-faint); font-size:17px; line-height:1; cursor:pointer; padding:8px 4px; font-family:inherit; }
  .todo-plus:hover{ color:var(--ink); }
  .todo-new{ padding:4px 0 2px; }
  .todo-new input{
    width:100%; border:none; border-bottom:1px solid var(--line); background:none;
    font-family:var(--serif); font-size:15px; line-height:1.6; color:var(--ink);
    padding:5px 0; outline:none; -webkit-appearance:none; appearance:none;
  }
  .todo-new input:focus{ border-bottom-color:var(--accent-soft); }
  .link-row{ display:flex; gap:7px; align-items:stretch; }
  .link-row .text-input{ flex:1; min-width:0; }
  .btn.l-paste,.btn.l-add{ flex:none; padding:0 13px; font-size:13.5px; border-radius:8px; }
  .link-list{ margin-top:10px; }
  .link-item{ display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid #F3F1EA; }
  .link-item:last-child{ border-bottom:none; }
  .l-url{
    flex:1; min-width:0; color:var(--accent); font-size:13.5px; text-decoration:none;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .l-url:hover{ text-decoration:underline; }
  .gain-plus{
    display:block; width:100%; background:none; border:1px dashed var(--line); border-radius:10px;
    color:var(--ink-faint); font-size:13.5px; font-family:inherit; cursor:pointer;
    padding:12px; margin-bottom:14px;
  }
  .gain-plus:hover{ color:var(--accent); border-color:var(--accent-soft); }
  .gain-form{ border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:18px; background:var(--card); }
  .mini-add{ background:none; border:none; color:var(--ink-faint); font-size:11.5px; cursor:pointer; padding:0 1px; font-family:inherit; }
  .mini-add:hover{ color:var(--accent); }
  .g-links{ margin-top:8px; display:flex; flex-direction:column; gap:4px; }
  .g-links a{ color:var(--accent); font-size:12.5px; text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .g-links a:hover{ text-decoration:underline; }
  .text-input{
    display:block; width:100%; max-width:100%; min-width:0;
    border:1px solid var(--line); border-radius:8px; padding:13px 12px;
    font-size:16px; font-family:var(--sans); line-height:1.3;
    background:#fff; color:var(--ink); -webkit-appearance:none; appearance:none; outline:none;
  }
  .text-input:focus{ border-color:var(--accent-soft); }
  select.text-input{ height:48px; }

  /* 업데이트(10개) */
  .cat{ border-top:1px solid var(--line); padding:20px 0; }
  .cat:last-of-type{ border-bottom:1px solid var(--line); }
  .cat-row{ display:flex; align-items:center; gap:12px; }
  .cat-name{ font-family:var(--serif); font-size:16.5px; flex:1; }
  .cat-count{ font-size:12.5px; color:var(--ink-faint); margin-right:2px; font-variant-numeric:tabular-nums; }
  .txt-btn{ background:none; border:none; cursor:pointer; font-family:var(--sans); font-size:14px; color:var(--ink); padding:6px 0; }
  .txt-btn:active{ opacity:.5; }
  .txt-btn.dim{ color:var(--ink-faint); }
  .add-area{ margin-top:14px; }
  .add-actions{ margin-top:10px; text-align:right; }
  .add-actions .txt-btn{ margin-left:18px; }

  .sess-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:40px; }
  .sess-cat{ font-size:13px; color:var(--ink-soft); letter-spacing:.06em; }
  .sess-prog{ font-size:13px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .sess-original{ font-family:var(--serif); font-size:18px; line-height:1.9; margin-bottom:30px; white-space:pre-wrap; }
  #sessInput{ min-height:150px; }
  .sess-actions{ margin-top:18px; display:flex; justify-content:space-between; align-items:center; }

  /* 기록 */
  .sec-title{ font-size:13px; color:var(--ink-soft); margin:24px 0 8px; letter-spacing:.02em; }
  .gain-item{ border-bottom:1px solid var(--line); padding:14px 0; display:flex; gap:10px; align-items:flex-start; }
  .gain-item:last-child{ border-bottom:none; }
  .g-body{ flex:1; min-width:0; }
  .g-meta{ font-size:12px; color:var(--ink-soft); margin-bottom:4px; }
  .g-meta b{ color:var(--accent); font-weight:500; }
  .g-text{ font-family:var(--serif); font-size:15.5px; line-height:1.7; white-space:pre-wrap; }
  .g-del{ background:none; border:none; color:var(--ink-faint); font-size:15px; cursor:pointer; padding:2px 4px; line-height:1; }
  .empty{ text-align:center; color:var(--ink-soft); font-size:14px; padding:44px 10px; line-height:1.8; }
  .back-row{ margin-bottom:16px; }
  .back-link{ background:none; border:none; color:var(--ink-soft); font-size:14px; cursor:pointer; padding:4px 0; font-family:inherit; }

  details.cat-group{ margin-bottom:6px; }
  details.cat-group summary{ font-size:14px; cursor:pointer; list-style:none; padding:11px 0; user-select:none; border-bottom:1px solid var(--line); }
  details.cat-group summary::-webkit-details-marker{ display:none; }
  details.cat-group summary::before{ content:'+'; color:var(--ink-faint); display:inline-block; width:18px; }
  details.cat-group[open] summary::before{ content:'−'; }
  .sent-body{ padding:6px 0 18px 18px; }
  .sent-item{ display:flex; gap:10px; align-items:flex-start; padding:11px 0; border-bottom:1px solid #F3F1EA; font-size:14px; }
  .sent-item span{ flex:1; white-space:pre-wrap; font-family:var(--serif); line-height:1.7; }
  .sent-del{ background:none; border:none; cursor:pointer; color:var(--ink-faint); font-size:14px; padding:0 2px; font-family:inherit; }
  .settings-actions{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px;
    font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:10; max-width:86%;
  }
  .toast.show{ opacity:1; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 상수 ===================== */
const CATS = ['씨앗 뿌리기','내면정화','새로운 말','새로운 생활'];
const STORE_KEY = 'munjibang-v1';
const ROUNDS = 10;
const MIN_TYPE = 2;

/* ===================== 데이터 ===================== */
function defaultData(){
  return {
    sentences: [], bags: {}, nextId: 1,
    todos: [], graveyard: {},
    sessions: [], activeSession: null,
    settings: { startUrl:'https://www.google.com', alarmMin:5 }
  };
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return defaultData();
}
let DATA = load();
(function normalize(){
  const d = defaultData();
  if(!Array.isArray(DATA.sentences)) DATA.sentences = [];
  if(!DATA.bags) DATA.bags = {};
  if(!DATA.nextId) DATA.nextId = Math.max(0, ...DATA.sentences.map(s=>s.id||0)) + 1;
  if(!DATA.graveyard) DATA.graveyard = {};
  DATA.sessions = DATA.sessions.filter(x=> x.gain || (x.links && x.links.length));
  if(!Array.isArray(DATA.todos)) DATA.todos = [];
  DATA.sentences.forEach(x=>{
    if(!x.uid) x.uid = legacyUid(x.cat, x.text);
    if(!x.updatedAt) x.updatedAt = 0;
  });
  DATA.todos.forEach(x=>{ if(!x.updatedAt) x.updatedAt = 0; });
  (function pruneGraveyard(){
    const cut = Date.now() - 180*86400000;
    for(const k in DATA.graveyard){ if(DATA.graveyard[k] < cut) delete DATA.graveyard[k]; }
  })();
  DATA.todos.forEach(t=>{ if(t.done && !t.doneDate) t.doneDate = todayStr(); });
  if(!Array.isArray(DATA.sessions)) DATA.sessions = [];
  if(DATA.activeSession === undefined) DATA.activeSession = null;
  if(!DATA.settings) DATA.settings = d.settings;
  if(!DATA.settings.startUrl) DATA.settings.startUrl = d.settings.startUrl;
  if(!DATA.settings.alarmMin) DATA.settings.alarmMin = 5;
})();
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); }
  catch(e){ toast('저장하지 못했어요. 저장공간을 확인해주세요'); }
}

let STATE = {
  screen:'gate',
  gate:null,           // {cat, id, text}
  sess:null,           // 업데이트 세션
  review:null,         // 마무리
  addOpen:null,
  gateDraft:'',
  todoAdd:false,
  gainAdd:null,
  focusNext:null,
  navStack:[]
};

/* ===================== 도우미 ===================== */
function uid(){ return 'x_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
/* 예전 데이터(고유 표시가 없던 시절)의 문장을 두 기기가 똑같이 알아보도록, 내용에서 표시를 만든다 */
function legacyUid(cat, text){
  const str = cat + '|' + String(text||'').trim();
  let h = 5381;
  for(let i=0;i<str.length;i++){ h = ((h*33) ^ str.charCodeAt(i)) >>> 0; }
  return 'L' + h.toString(36);
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYMD(s){ const p=String(s).split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function formatDateKR(s){
  const dt = parseYMD(s);
  const wd = ['일','월','화','수','목','금','토'][dt.getDay()];
  return dt.getFullYear()+'년 '+(dt.getMonth()+1)+'월 '+dt.getDate()+'일 ('+wd+')';
}
function formatMinutes(m){
  if(m < 60) return m+'분';
  const h=Math.floor(m/60), r=m%60;
  return r ? h+'시간 '+r+'분' : h+'시간';
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function catSentences(cat){ return DATA.sentences.filter(s=>s.cat===cat); }
function totalSentences(){ return DATA.sentences.length; }
function alarmMin(){ return DATA.settings.alarmMin || 5; }

let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'), 2300);
}

/* 문장 뽑기 — 한 바퀴 다 돌기 전에 같은 문장이 다시 나오지 않는 방식 */
function drawId(cat){
  const ids = catSentences(cat).map(s=>s.id);
  if(!ids.length) return null;
  let bag = (DATA.bags[cat]||[]).filter(id=>ids.indexOf(id)>=0);
  if(!bag.length) bag = shuffle(ids);
  const id = bag.pop();
  DATA.bags[cat] = bag;
  return id;
}
function insertSentence(cat, text){
  const id = DATA.nextId++;
  DATA.sentences.push({ id, uid: uid(), cat, text, updatedAt: Date.now() });
  const bag = DATA.bags[cat];
  if(bag && bag.length) bag.splice(Math.floor(Math.random()*(bag.length+1)), 0, id);
  return id;
}

/* ===================== 관문 ===================== */
function pickGate(){
  const live = CATS.filter(c=>catSentences(c).length);
  if(!live.length){ STATE.gate=null; return; }
  const cat = live[Math.floor(Math.random()*live.length)];
  const id = drawId(cat);
  const s = DATA.sentences.find(x=>x.id===id);
  DATA.bags && save();
  STATE.gate = { cat, id, text: s ? s.text : '' };
  STATE.gateDraft = '';
}
function reshuffleGate(){ pickGate(); render(); }

function countGate(el){
  const len = el.value.trim().length;
  const c = document.getElementById('gateCounter');
  const btn = document.getElementById('gateBtn');
  if(c){
    c.textContent = len + ' / ' + (STATE.gate ? STATE.gate.text.length : 0) + '자';
    c.classList.toggle('done', len >= MIN_TYPE);
  }
  if(btn) btn.disabled = len < MIN_TYPE;
}
function submitGate(){
  const el = document.getElementById('gateInput');
  if(!el) return;
  const typed = el.value.trim();
  if(typed.length < MIN_TYPE) return;
  const s = DATA.sentences.find(x=>x.id===STATE.gate.id);
  if(s){ s.text = typed; s.updatedAt = Date.now(); }
  STATE.gate.text = typed;
  STATE.gateDraft = '';
  save();
  STATE.screen = 'ready';
  render();
}

/* ===================== 할 일 ===================== */
function stashGate(){
  const el = document.getElementById('gateInput');
  if(el) STATE.gateDraft = el.value;
}
function sortedTodos(){
  const t = DATA.todos || [];
  return t.filter(x=>!x.done).concat(t.filter(x=>x.done));
}
/* 체크한 일은 그날까지만 남고 다음 날 사라진다 */
function pruneTodos(){
  const today = todayStr();
  const before = DATA.todos.length;
  DATA.todos = DATA.todos.filter(x => !(x.done && x.doneDate && x.doneDate < today));
  if(DATA.todos.length !== before) save();
}
let todoBusy = false;
function openTodoAdd(){
  stashGate();
  STATE.todoAdd = true;
  STATE.focusNext = 'todoInput';
  render();
}
function closeTodoAdd(){
  if(todoBusy) return;
  stashGate();
  STATE.todoAdd = false;
  render();
}
function addTodo(){

function normalizeUrl(u){
  u = String(u||'').trim();
  if(!u) return '';
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(u)){
    if(/^[\w-]+(\.[\w-]+)+/.test(u)) u = 'https://' + u;
    else return '';
  }
  try{ new URL(u); }catch(e){ return ''; }
  return u;
}
function hostLabel(u){
  try{
    const h = new URL(u).hostname.replace(/^www\./,'');
    const p = new URL(u).pathname;
    return h + (p && p !== '/' ? p.slice(0,18) + (p.length>18?'…':'') : '');
  }catch(e){ return u; }
}

/* ===================== 5분 종소리 ===================== */
let audioCtx=null, nodes=[], notifyTimer=null, tickTimer=null, chimeFlashUntil=0;
function ensureAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
  }catch(e){ audioCtx=null; }
  return audioCtx;
}
function chimeAt(ctx, t, times){
  for(let i=0;i<times;i++){
    const st = t + i*0.45;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(680, st);
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(0.20, st+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, st+0.55);
    o.connect(g); g.connect(ctx.destination);
    o.start(st); o.stop(st+0.6);
    nodes.push(o);
  }
}
function clearChimes(){
  nodes.forEach(o=>{ try{ o.stop(0); o.disconnect(); }catch(e){} });
  nodes = [];
}
/* 오디오는 미리 예약해 두어 다른 탭에 가 있어도 울린다 */
function scheduleChimes(){
  clearChimes();
  const ctx = ensureAudio();
  if(!ctx || !DATA.activeSession) return;
  const gap = alarmMin()*60000;
  const elapsed = Date.now() - DATA.activeSession.startedAt;
  for(let k=1;k<=48;k++){
    const due = k*gap - elapsed;
    if(due <= 800) continue;
    if(due > 4*3600000) break;
    chimeAt(ctx, ctx.currentTime + due/1000, (k%6===0) ? 3 : 1);
  }
}
function scheduleNotify(){
  clearTimeout(notifyTimer);
  if(!DATA.activeSession) return;
  const gap = alarmMin()*60000;
  const elapsed = Date.now() - DATA.activeSession.startedAt;
  const k = Math.floor(elapsed/gap) + 1;
  const wait = Math.max(1000, k*gap - elapsed);
  notifyTimer = setTimeout(()=>{
    if(!DATA.activeSession) return;
    DATA.activeSession.chimes = Math.floor((Date.now()-DATA.activeSession.startedAt)/gap);
    save();
    chimeFlashUntil = Date.now() + 60000;
    updateTitle();
    const mins = formatMinutes(elapsedMin());
    try{
      if(window.Notification && Notification.permission==='granted'){
        new Notification('문지방 · '+mins+' 지났어요', {
          body: DATA.activeSession.anchorText ? DATA.activeSession.anchorText.slice(0,60) : '지금 무엇을 얻고 있나요?',
          tag: 'munjibang'
        });
      }
    }catch(e){}
    try{ if(navigator.vibrate) navigator.vibrate([120,80,120]); }catch(e){}
    if(STATE.screen==='browsing') render();
    scheduleNotify();
  }, wait);
}
function updateTitle(){
  if(!DATA.activeSession){ document.title = '문지방'; return; }
  const mark = Date.now() < chimeFlashUntil ? '🔔 ' : '◍ ';
  document.title = mark + formatMinutes(elapsedMin()) + ' · 문지방';
}
function startTick(){
  clearInterval(tickTimer);
  tickTimer = setInterval(()=>{
    if(!DATA.activeSession){ clearInterval(tickTimer); document.title='문지방'; return; }
    const m = elapsedMin();
    updateTitle();
    const el = document.getElementById('clockLabel');
    if(el) el.textContent = formatMinutes(m);
    const ch = document.getElementById('chimeLabel');
    if(ch) ch.textContent = String(Math.floor(m/alarmMin()));
  }, 10000);
  updateTitle();
}
function stopAll(){
  clearChimes();

  document.title = '문지방';
}

function replaceData(d){
  DATA.sentences = d.sentences;
  DATA.bags = d.bags || {};
  DATA.nextId = d.nextId || Math.max(0, ...d.sentences.map(s=>s.id||0))+1;
  DATA.sessions = (Array.isArray(d.sessions) ? d.sessions : []).filter(x=> x.gain || (x.links && x.links.length));
  DATA.todos = Array.isArray(d.todos) ? d.todos : [];
  DATA.graveyard = d.graveyard || {};
  if(d.settings){
    DATA.settings.startUrl = d.settings.startUrl || DATA.settings.startUrl;
    DATA.settings.alarmMin = d.settings.alarmMin || DATA.settings.alarmMin;
  }
  DATA.sentences.forEach(x=>{
    if(!x.uid) x.uid = legacyUid(x.cat, x.text);
    if(!x.updatedAt) x.updatedAt = 0;
  });
  save();
  toast('파일 내용으로 바꿨어요');

/* 두 기기의 기록을 합친다. 같은 것은 나중에 고친 쪽을, 지운 것은 지운 채로 둔다 */
function mergeData(d){
  const rep = { sAdd:0, sUpd:0, tAdd:0, tUpd:0, xAdd:0 };

  /* 묘비 합치기 */
  const grave = DATA.graveyard;
  const inGrave = d.graveyard || {};
  for(const k in inGrave){ grave[k] = Math.max(grave[k]||0, inGrave[k]||0); }

  /* --- 문장 --- */
  const byUid = {};
  DATA.sentences.forEach(x=>{ byUid[x.uid] = x; });
  (d.sentences||[]).forEach(r=>{
    const ru = r.uid || legacyUid(r.cat, r.text);
    const rt = r.updatedAt || 0;
    const cur = byUid[ru];
    if(!cur){
      const g = grave['s:'+ru];
      if(g && g >= rt) return;                 /* 여기서 지운 문장은 되살리지 않는다 */
      const copy = { id: DATA.nextId++, uid: ru, cat: r.cat, text: r.text, updatedAt: rt };
      DATA.sentences.push(copy); byUid[ru] = copy; rep.sAdd++;
    } else if(rt > (cur.updatedAt||0) && (cur.text !== r.text || cur.cat !== r.cat)){
      cur.text = r.text; cur.cat = r.cat; cur.updatedAt = rt; rep.sUpd++;
    }
  });
  /* 저쪽에서 지운 문장은 여기서도 지운다 (그 뒤에 여기서 고친 게 아니라면) */
  DATA.sentences = DATA.sentences.filter(x=>{
    const g = grave['s:'+x.uid];
    return !(g && g >= (x.updatedAt||0));
  });

  /* --- 할 일 --- */
  const tById = {};
  DATA.todos.forEach(x=>{ tById[x.id] = x; });
  (d.todos||[]).forEach(r=>{
    if(!r.id) return;
    const rt = r.updatedAt || 0;
    const cur = tById[r.id];
    if(!cur){
      const g = grave['t:'+r.id];
      if(g && g >= rt) return;
      DATA.todos.push({ id:r.id, text:r.text, done:!!r.done, doneDate:r.doneDate||null, updatedAt:rt });
      rep.tAdd++;
    } else if(rt > (cur.updatedAt||0) && (cur.done !== !!r.done || cur.text !== r.text)){
      cur.text = r.text; cur.done = !!r.done; cur.doneDate = r.doneDate||null; cur.updatedAt = rt;
      rep.tUpd++;                              /* 한쪽에서 체크했으면 체크된 상태로 */
    }
  });
  DATA.todos = DATA.todos.filter(x=>{
    const g = grave['t:'+x.id];
    return !(g && g >= (x.updatedAt||0));
  });

  /* --- 접속 기록: 지운 것 빼고 모두 모은다 --- */
  const xById = {};
  DATA.sessions.forEach(x=>{ xById[x.id] = x; });
  (d.sessions||[]).forEach(r=>{
    if(!r.id || xById[r.id]) return;
    if(grave['x:'+r.id]) return;
    if(!(r.gain || (r.links && r.links.length))) return;
    DATA.sessions.push(r); xById[r.id] = r; rep.xAdd++;
  });
  DATA.sessions.sort((a,b)=>a.startedAt-b.startedAt);

  DATA.nextId = Math.max(DATA.nextId, ...DATA.sentences.map(x=>x.id||0)) + 1;
  save();
  pruneTodos();

  const parts = [];
  if(rep.sAdd) parts.push('문장 +'+rep.sAdd);
  if(rep.sUpd) parts.push('문장 고침 '+rep.sUpd);
  if(rep.tAdd) parts.push('할 일 +'+rep.tAdd);
  if(rep.tUpd) parts.push('할 일 바뀜 '+rep.tUpd);
  if(rep.xAdd) parts.push('기록 +'+rep.xAdd);
  toast(parts.length ? parts.join(' · ') : '새로 합칠 것이 없었어요');
  render();
}

  }).catch(()=>{
    toast('주소를 직접 붙여넣어 주세요');
    const el=document.getElementById('newLinkInput'); if(el) el.focus();
  });
}
function delGainLink(i){ stashGainAdd(); STATE.gainAdd.links.splice(i,1); render(); }
function pickGainPlant(cat){
  stashGainAdd();
  STATE.gainAdd.plantCat = (STATE.gainAdd.plantCat === cat) ? null : cat;
  render();
}
function saveGainAdd(){
  const g = STATE.gainAdd; if(!g) return;
  stashGainAdd();
  const text = (g.text||'').trim();
  const links = g.links.slice();
  const u = normalizeUrl(g.linkDraft||'');
  if(u && links.indexOf(u) < 0) links.push(u);
  if(!text && !links.length){
    const ta = document.getElementById('newGainInput'); if(ta) ta.focus();
    return;
  }
  const now = Date.now();
  let planted = null;
  if(text && g.plantCat) planted = insertSentence(g.plantCat, text);
  DATA.sessions.push({
    id: uid(), date: todayStr(), startedAt: now, endedAt: now, minutes: 0,
    anchorCat: null, anchorText: '',
    gain: text, links: links,
    plantedCat: text && g.plantCat ? g.plantCat : null,
    chimes: 0, direct: true
  });
  save();
  STATE.gainAdd = null;
  toast(planted ? '「'+g.plantCat+'」에도 심었어요' : '수확을 담았어요');
  render();
}

function addLinkTo(id){
  const s = DATA.sessions.find(x=>x.id===id);
  if(!s) return;
  const v = window.prompt('이 수확에 붙일 주소');
  if(v === null) return;
  const u = normalizeUrl(v);
  if(!u){ toast('주소를 확인해주세요'); return; }
  if(!s.links) s.links = [];
  if(s.links.indexOf(u) < 0) s.links.push(u);
  save();
  toast('링크를 붙였어요');
  render();
}
function linkBlock(s){
  if(!s.links || !s.links.length) return '';
  return '<div class="g-links">' + s.links.map(u=>
    '<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer" title="'+esc(u)+'">↗ '+esc(hostLabel(u))+'</a>'
  ).join('') + '</div>';
}

function topBar(){
  return '<div class="topbar">'
    + '<button class="date-home" onclick="goHome()">'+esc(formatDateKR(todayStr()))+'</button>'
    + '<div class="icons">'
      + '<button class="icon-btn" onclick="openUpdate()" title="문장 업데이트">✎</button>'
      + '<button class="icon-btn" onclick="openArchive()" title="기록">🗂</button>'
      + '<button class="icon-btn" onclick="openSettings()" title="설정">⚙</button>'
    + '</div></div>';
}

function render(){
  const app = document.getElementById('app');
  let html = '';

  /* ---- 관문 ---- */
  if(STATE.screen==='gate'){
    if(!STATE.gate){
      html = topBar() + '<main class="centered"><div class="gate-wrap">'
        + '<div class="eyebrow">문지방</div>'
        + '<h1 class="q">먼저 문장을 한 줄 심어주세요</h1>'
        + '<p class="sub">인터넷을 열기 전에, 여기 적힌 문장 하나를 손으로 다시 씁니다. 씨앗 뿌리기 · 내면정화 · 새로운 말 · 새로운 생활 중 어디든 좋아요.</p>'
        + '<div class="btn-row"><button class="btn primary" onclick="openUpdate()">문장 넣기</button></div>'
        + '<div class="quiet-row"><button class="quiet" onclick="connectWithoutGate()">문장 없이 인터넷 열기</button></div>'
        + '</div>' + todoBlock() + '</main>';
    } else {
      const g = STATE.gate;
      const draftLen = (STATE.gateDraft||'').trim().length;
      html = topBar() + '<main class="centered"><div class="gate-wrap">'
        + '<div class="gate-line"><span class="gate-cat">'+esc(g.cat)+'</span>'
        + '<button class="gate-re" onclick="reshuffleGate()">다른 문장 ↻</button></div>'
        + '<div class="gate-text">'+nl2br(g.text)+'</div>'
        + '<textarea id="gateInput" placeholder="여기에 다시 옮겨 적으세요. 오늘의 말로 고쳐 써도 좋습니다." oninput="countGate(this)" spellcheck="false">'+esc(STATE.gateDraft||'')+'</textarea>'
        + '<div class="counter'+(draftLen>=MIN_TYPE?' done':'')+'" id="gateCounter">'+draftLen+' / '+g.text.length+'자</div>'
        + '<div class="btn-row"><button class="btn primary full" id="gateBtn"'+(draftLen<MIN_TYPE?' disabled':'')+' onclick="submitGate()">옮겨 적기</button></div>'
        + '<div class="quiet-row"><button class="quiet" onclick="openUpdate()">10개씩 업데이트하기</button></div>'
        + '</div>' + todoBlock() + '</main>';
    }
  }

  /* ---- 연결 대기 ---- */
  else if(STATE.screen==='ready'){
    const g = STATE.gate || {cat:'',text:''};
    html = topBar() + '<main><div class="ready-wrap">'
      + '<div class="eyebrow">'+esc(g.cat)+'</div>'
      + '<h1 class="q" style="margin-bottom:18px;">오늘의 문장으로 저장했습니다</h1>'
      + '<div class="ready-card">'+nl2br(g.text)+'</div>'
      + '<div class="ready-note">'+alarmMin()+'분마다 종이 한 번 울립니다. 얻은 것이 생기면 그 자리에서 닫고, 링크와 함께 적어주세요.</div>'
      + '<button class="btn accent full" onclick="connect()">인터넷 연결</button>'
      + '<div class="quiet-row"><button class="quiet" onclick="goHome()">열지 않고 닫기</button>'
      + '<button class="quiet" onclick="openUpdate()">한 줄 더 쓰기</button></div>'
      + '</div></main>';
  }

  /* ---- 접속 중 ---- */
  else if(STATE.screen==='browsing'){
    if(!DATA.activeSession){ goHome(); return; }
    const s = DATA.activeSession;
    const st = new Date(s.startedAt);
    const hh=String(st.getHours()).padStart(2,'0'), mm=String(st.getMinutes()).padStart(2,'0');
    const m = elapsedMin();
    html = topBar() + '<main><div class="browsing-wrap">'
      + (s.anchorText ? '<div class="b-label">'+esc(s.anchorCat||'')+'</div><div class="b-anchor">'+nl2br(s.anchorText)+'</div>' : '<div class="b-label">문장 없이 열었습니다</div>')
      + '<div class="b-clock" id="clockLabel">'+esc(formatMinutes(m))+'</div>'
      + '<div class="b-since">'+hh+':'+mm+'에 열었어요</div>'
      + '<div class="b-chimes">종 <span id="chimeLabel">'+Math.floor(m/alarmMin())+'</span>번 울림 · '+alarmMin()+'분 간격</div>'
      + '<div class="b-rule">얻은 것이 생기면 그 자리에서 닫습니다</div>'
      + '<button class="btn accent full" style="margin-top:22px;" onclick="endSession(true)">수확하고 끝내기</button>'
      + '<div class="btn-row" style="margin-top:10px;">'
      + '<button class="btn secondary" onclick="openStartUrl()">창 다시 열기</button>'
      + '<button class="btn secondary" onclick="endSession(false)">그냥 끝내기</button>'
      + '</div></div></main>';
  }

  /* ---- 마무리 ---- */
  else if(STATE.screen==='review'){
    const r = STATE.review;
    const chips = ['<button class="chip'+(!r.plantCat?' sel':'')+'" onclick="pickPlant(this,null)">심지 않기</button>']
      .concat(CATS.map(c=>'<button class="chip'+(r.plantCat===c?' sel':'')+'" onclick="pickPlant(this,\''+c+'\')">'+esc(c)+'</button>')).join('');
    const links = (r.links||[]).map((u,i)=>'<div class="link-item">'
      + '<a class="l-url" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer" title="'+esc(u)+'">'+esc(hostLabel(u))+'</a>'
      + '<button class="g-del" onclick="delLink('+i+')">×</button></div>').join('');
    html = topBar() + '<main>'
      + '<div class="eyebrow">'+esc(formatMinutes(r.minutes))+' 머물렀습니다</div>'
      + '<h1 class="q">무엇을 얻었나요?</h1>'
      + '<p class="sub">문장 하나, 이름 하나, 장면 하나여도 좋습니다. 오래 있었는지가 아니라 무엇에 부딪혔는지가 남습니다.</p>'
      + '<textarea id="gainInput" placeholder="본 것, 알게 된 것, 마음이 움직인 것" spellcheck="false" style="min-height:150px;">'+esc(r.gainText||'')+'</textarea>'
      + '<div class="field-label">관련 링크</div>'
      + '<div class="link-row">'
      + '<input class="text-input" id="linkInput" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="주소를 붙여넣으세요" value="'+esc(r.linkDraft||'')+'" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addLink();}">'
      + '<button class="btn secondary l-paste" onclick="pasteLink()">붙여넣기</button>'
      + '<button class="btn primary l-add" onclick="addLink()">담기</button>'
      + '</div>'
      + (links ? '<div class="link-list">'+links+'</div>' : '')
      + '<div class="field-label">이 수확을 문장으로 심을까요?</div>'
      + '<div class="chip-row">'+chips+'</div>'
      + '<div class="btn-row" style="margin-top:24px;">'
      + '<button class="btn secondary" onclick="saveReview(false)">이번엔 없음</button>'
      + '<button class="btn primary" onclick="saveReview(true)">기록하기</button>'
      + '</div></main>';
  }

  /* ---- 업데이트 홈 ---- */
  else if(STATE.screen==='updateHome'){
    const rows = CATS.map((cat,i)=>{
      const n = catSentences(cat).length;
      let block = '<div class="cat"><div class="cat-row">'
        + '<span class="cat-name">'+esc(cat)+'</span>'
        + '<span class="cat-count">'+n+'</span>'
        + '<button class="txt-btn dim" onclick="toggleAdd('+i+')">추가</button>'
        + (n ? '<button class="txt-btn" onclick="startUpdateSession(\''+cat+'\')">업데이트</button>' : '<span class="cat-count">—</span>')
        + '</div>';
      if(STATE.addOpen===i){
        block += '<div class="add-area"><textarea id="addInput" style="min-height:90px;" spellcheck="false"></textarea>'
          + '<div class="add-actions"><button class="txt-btn dim" onclick="toggleAdd('+i+')">취소</button>'
          + '<button class="txt-btn" onclick="addOne(\''+cat+'\')">저장</button></div></div>';
      }
      return block + '</div>';
    }).join('');
    html = topBar() + '<main>'
      + '<div class="back-row"><button class="back-link" onclick="goHome()">← 관문으로</button></div>'
      + '<h1 class="q" style="font-size:20px;">문장 업데이트</h1>'
      + '<p class="sub">한 갈래를 골라 10개를 이어서 다시 씁니다. 오늘의 말로 조금씩 바뀌어도 좋아요.</p>'
      + rows + '</main>';
  }

  /* ---- 업데이트 세션 ---- */
  else if(STATE.screen==='updateSession'){
    const s = DATA.sentences.find(x=>x.id===STATE.sess.currentId);
    if(!s){ endUpdateSession(); return; }
    html = topBar() + '<main>'
      + '<div class="sess-top"><span class="sess-cat">'+esc(STATE.sess.cat)+'</span>'
      + '<span class="sess-prog">'+STATE.sess.round+' / '+ROUNDS+'</span></div>'
      + '<div class="sess-original">'+nl2br(s.text)+'</div>'
      + '<textarea id="sessInput" spellcheck="false"></textarea>'
      + '<div class="sess-actions">'
      + '<button class="txt-btn dim" onclick="endUpdateSession()">그만두기</button>'
      + '<span><button class="txt-btn dim" onclick="deleteCurrent()" style="margin-right:24px">삭제</button>'
      + '<button class="txt-btn" onclick="nextRound()">다음</button></span>'
      + '</div></main>';
  }

  /* ---- 기록 ---- */
  else if(STATE.screen==='archive'){
    const gains = DATA.sessions.slice()
      .filter(s=>s.gain || (s.links && s.links.length))
      .sort((a,b)=>b.startedAt-a.startedAt);
    const body = gains.length ? gains.map(s=>{
      const d=new Date(s.startedAt);
      const hh=String(d.getHours()).padStart(2,'0'), mm=String(d.getMinutes()).padStart(2,'0');
      return '<div class="gain-item"><div class="g-body">'
        + '<div class="g-meta">'+esc(formatDateKR(s.date))+' '+hh+':'+mm
        + (s.plantedCat ? ' · '+esc(s.plantedCat)+'에 심음' : '')
        + ' · <button class="mini-add" onclick="addLinkTo(\''+s.id+'\')">＋링크</button></div>'
        + (s.gain ? '<div class="g-text">'+nl2br(s.gain)+'</div>' : '')
        + linkBlock(s)
        + '</div><button class="g-del" onclick="delSession(\''+s.id+'\')">×</button></div>';
    }).join('') : '<div class="empty">아직 담아둔 수확이 없어요.<br>인터넷을 끝낼 때 한 줄씩 쌓입니다.</div>';

    let adder;
    if(STATE.gainAdd){
      const g = STATE.gainAdd;
      const chips = ['<button class="chip'+(!g.plantCat?' sel':'')+'" onclick="pickGainPlant(null)">심지 않기</button>']
        .concat(CATS.map(c=>'<button class="chip'+(g.plantCat===c?' sel':'')+'" onclick="pickGainPlant(\''+c+'\')">'+esc(c)+'</button>')).join('');
      const links = g.links.map((u,i)=>'<div class="link-item">'
        + '<a class="l-url" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer" title="'+esc(u)+'">'+esc(hostLabel(u))+'</a>'
        + '<button class="g-del" onclick="delGainLink('+i+')">×</button></div>').join('');
      adder = '<div class="gain-form">'
        + '<textarea id="newGainInput" placeholder="본 것, 알게 된 것, 마음이 움직인 것" spellcheck="false" style="min-height:110px;">'+esc(g.text||'')+'</textarea>'
        + '<div class="link-row" style="margin-top:10px;">'
        + '<input class="text-input" id="newLinkInput" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="주소를 붙여넣으세요" value="'+esc(g.linkDraft||'')+'" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addGainLink();}">'
        + '<button class="btn secondary l-paste" onclick="pasteGainLink()">붙여넣기</button>'
        + '<button class="btn primary l-add" onclick="addGainLink()">담기</button></div>'
        + (links ? '<div class="link-list">'+links+'</div>' : '')
        + '<div class="chip-row" style="margin-top:14px;">'+chips+'</div>'
        + '<div class="btn-row" style="margin-top:14px;">'
        + '<button class="btn secondary" onclick="closeGainAdd()">취소</button>'
        + '<button class="btn primary" onclick="saveGainAdd()">담기</button></div></div>';
    } else {
      adder = '<button class="gain-plus" onclick="openGainAdd()">＋ 직접 담기</button>';
    }

    html = topBar() + '<main>'
      + '<div class="back-row"><button class="back-link" onclick="back()">← 돌아가기</button></div>'
      + '<div class="sec-title" style="margin-top:0;">수확'+(gains.length?' '+gains.length:'')+'</div>'
      + adder + body + '</main>';
  }

  /* ---- 설정 ---- */
  else if(STATE.screen==='settings'){
    const groups = CATS.map(cat=>{
      const items = catSentences(cat);
      const inner = items.length
        ? items.map(s=>'<div class="sent-item"><span>'+esc(s.text)+'</span><button class="sent-del" onclick="delSentence('+s.id+')">×</button></div>').join('')
        : '<div class="sent-item" style="color:var(--ink-faint)">—</div>';
      return '<details class="cat-group"><summary>'+esc(cat)+' <span class="cat-count">'+items.length+'</span></summary>'
        + '<div class="sent-body">'+inner+'</div></details>';
    }).join('');
    const opts = [3,5,10,15,20].map(v=>'<option value="'+v+'"'+(alarmMin()===v?' selected':'')+'>'+v+'분마다</option>').join('');
    html = topBar() + '<main>'
      + '<div class="back-row"><button class="back-link" onclick="back()">← 돌아가기</button></div>'
      + '<h1 class="q" style="font-size:20px;">설정</h1>'

      + '<div class="field-label">인터넷 연결이 열 페이지</div>'
      + '<input class="text-input" id="startUrlInput" type="url" value="'+esc(DATA.settings.startUrl||'')+'" placeholder="https://..." onchange="updateStartUrl(this)">'

      + '<div class="field-label">종소리 간격</div>'
      + '<select class="text-input" onchange="updateAlarm(this)">'+opts+'</select>'
      + '<div class="btn-row" style="margin-top:10px;"><button class="btn secondary full" onclick="testChime()">소리 들어보기</button></div>'

      + '<div class="field-label">한 번에 넣기 — 한 줄에 한 문장</div>'
      + '<select class="text-input" id="bulkCat">'+CATS.map(c=>'<option value="'+esc(c)+'">'+esc(c)+'</option>').join('')+'</select>'
      + '<textarea id="bulkInput" style="min-height:150px; margin-top:10px;" spellcheck="false"></textarea>'
      + '<div class="add-actions"><button class="txt-btn" onclick="bulkAdd()">추가</button></div>'

      + '<div class="field-label">모든 문장 ('+totalSentences()+')</div>'
      + groups

      + '<div class="field-label">기기 간 옮기기</div>'
      + '<p class="sub">맥과 아이폰의 저장공간은 서로 이어지지 않아요. 한쪽에서 내보낸 파일을 에어드랍이나 아이클라우드로 옮긴 뒤, 다른 쪽에서 합치기를 누르세요. 새로 쓴 문장과 할 일, 수확 기록이 양쪽 것을 모아 하나가 되고, 같은 문장은 나중에 고친 쪽이 남습니다. 합친 뒤 다시 내보내 반대쪽에도 넣어주면 두 기기가 같아집니다.</p>'
      + '<div class="settings-actions" style="margin-top:0;">'
      + '<button class="btn secondary" onclick="exportData()">내보내기 (이 기기의 파일 저장)</button>'
      + '<button class="btn primary" onclick="triggerImport(\'merge\')">합치기 (다른 기기 파일과 병합)</button>'
      + '<button class="btn secondary" onclick="triggerImport(\'replace\')">덮어쓰기 (통째로 바꾸기)</button></div>'

      + '<div class="field-label">전체 지우기</div>'
      + '<p class="sub">문장과 기록을 모두 지웁니다. 먼저 내보내기로 백업해두세요.</p>'
      + '<button class="btn danger full" onclick="resetAll()">모든 기록 지우기</button>'
      + '</main>';
  }

  app.innerHTML = html;

  if(STATE.screen==='browsing'){ scheduleChimes(); scheduleNotify(); startTick(); }
  else if(STATE.screen!=='review'){ if(!DATA.activeSession) stopAll(); }

  const focusMap = { gate:'gateInput', updateSession:'sessInput', review:'gainInput' };
  const fid = STATE.focusNext || focusMap[STATE.screen];
  STATE.focusNext = null;
  if(fid){
    const el = document.getElementById(fid);
    if(el) setTimeout(()=>{
      el.focus();
      try{ const n = el.value.length; if(el.setSelectionRange) el.setSelectionRange(n,n); }catch(e){}
    }, 30);
  }
}

/* ===================== 시작 ===================== */
if(DATA.activeSession){
  STATE.screen = 'browsing';
  render();
  /* 새로고침 뒤에는 첫 클릭에서 소리를 다시 켠다 */
  document.addEventListener('click', function once(){ ensureAudio(); scheduleChimes(); document.removeEventListener('click', once); });
} else {
  goHome();
}
</script>
</body>
</html>
