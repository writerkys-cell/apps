<style>
:root{ --paper:#f2ede1; --paper-2:#e8e0cf; --ink:#23201c; --ink-soft:#736a59; --line:#d6ccb6; --seal:#9b3b32; --deep:#3f5566; --moss:#5f6f49; --void:#8c8577; --radius:2px; }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Gowun Batang',"Apple SD Gothic Neo",Batang,serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:baseline;gap:10px}
header h1{font-size:21px;margin:0;letter-spacing:.14em;font-weight:700}
header .st{font-size:12.5px;color:var(--ink-soft)}
header .st.err{color:var(--seal)}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(80px + env(safe-area-inset-bottom))}
h2.sec{font-size:14.5px;font-weight:400;color:var(--ink-soft);letter-spacing:.12em;margin:0 0 8px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--deep)}
.dot.none{background:var(--void)}
ul.books{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.books li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);font-size:17px;line-height:1.45;cursor:pointer}
ul.books li:active{background:rgba(63,85,102,.07)}
ul.books li .m{font-size:13.5px;color:var(--ink-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
details{margin-top:30px}
details summary{font-size:14.5px;color:var(--ink-soft);letter-spacing:.12em;padding:6px 0;cursor:pointer}
.empty{color:var(--ink-soft);font-size:15px;padding:22px 0;border-bottom:1px solid var(--line)}
.note{font-size:14px;color:var(--ink-soft);line-height:1.8}
.hint{font-size:13px;color:var(--ink-soft);margin-top:6px}
.bt{font-size:23px;line-height:1.4;margin:2px 0 4px}
.ba{font-size:14px;color:var(--ink-soft)}
.field{margin-top:24px}
.field label{display:block;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;margin-bottom:5px}
input[type=text],input[type=number],input[type=password],input[type=date],textarea{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);padding:8px 2px;font-size:18px;border-radius:0}
input:focus,textarea:focus{outline:none;border-bottom-color:var(--seal)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pg{display:flex;align-items:baseline;gap:10px}
.pg input{width:5.2em;font-size:30px;text-align:center;font-variant-numeric:tabular-nums}
.pg span{color:var(--ink-soft)}
textarea{resize:none;line-height:1.6}
.seg{display:flex;margin-bottom:8px}
.seg button{background:none;border:1px solid var(--line);padding:6px 18px;font-size:14.5px;color:var(--ink-soft);border-radius:var(--radius)}
.seg button+button{margin-left:-1px}
.seg button.on{background:var(--deep);border-color:var(--deep);color:var(--paper)}
.seg button.on.q{background:var(--seal);border-color:var(--seal)}
.toggle{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);padding:8px 14px;border-radius:var(--radius);font-size:14.5px;color:var(--ink-soft);background:none;margin-top:18px}
.toggle.on{border-color:var(--moss);color:var(--moss)}
.toggle .box{width:13px;height:13px;border:1px solid currentColor;display:inline-block;border-radius:1px}
.toggle.on .box{background:var(--moss)}
.rowbtns{display:flex;gap:12px;align-items:center;margin-top:26px;flex-wrap:wrap}
.primary{background:var(--ink);color:var(--paper);border:none;padding:13px 30px;border-radius:var(--radius);font-size:17px;letter-spacing:.1em;min-width:55%}
.ghost{background:none;border:1px solid var(--line);padding:11px 18px;border-radius:var(--radius);font-size:15px}
.linkish{background:none;border:none;color:var(--ink-soft);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:4px}
a.linkish{display:inline-block}
.foot{margin-top:40px;display:flex;gap:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:var(--radius);font-size:14.5px;z-index:80;opacity:0;pointer-events:none;transition:opacity .18s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>쪽 적기</h1><span class="st" id="st"></span></header>
<main id="view"></main>
<div id="toast"></div>
<script>
"use strict";
/* 쪽 적기 — 서가(seoga.html)의 아이폰 클라이언트(2026년 11월 19일).
   읽는 책을 고르고, 쪽을 적고, 코멘트를 바로 적는다. 완독·그만 읽기·견주기·담기는 서가에서 한다.
   서가의 Supabase 표(미래 프로젝트)에 서가와 똑같은 모양으로 적는다 — 서가_인계문서.md 0절의 쪽수 기록 규칙(logPage)과 같아야 한다:
     · 현재 쪽: seoga_books 그 책 줄의 data.page / pageAt / updated
     · 쪽수 기록: seoga_reads의 kind:'page' {id, kind, bookId, title, date, at, from, page, updated}. 같은 날 같은 책은 한 줄(id 'pg-<책id>-<날짜>')을 덮어쓴다.
       끝 표시(end)가 붙은 줄은 덮어쓰지 않고 새 줄을 만든다.
     · 코멘트: seoga_reads의 kind:'mark'(스캔을 켜면 'scan') {id, kind, bookId, title, page, text, date, at, updated}
     · 밑줄: 코멘트와 같은 줄에 quote:true만 더 붙는다(책의 문장). 서가 한눈에 탭의 밑줄 뽑기에 나온다.
   서가의 규칙을 바꾸면 이 파일의 apply()도 함께 고친다.
   연결 정보는 서가와 같은 localStorage 'seoga.sb'({url,key})를 쓴다. 적을 것은 먼저 'seoga.phone.out'에 담아 두고 보낸다(끊겨 있으면 이어질 때 보낸다). */
const SBKEY='seoga.sb', OUTKEY='seoga.phone.out', CACHEKEY='seoga.phone.cache';
const lsGet=(k,d)=>{ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} };
let cfg=lsGet(SBKEY,{}), out=lsGet(OUTKEY,[]), C=lsGet(CACHEKEY,{reading:[],wait:[],at:''});
let view='list', cur=null, draft=null, scanOn=null, quoteOn=false, setup=false, busy=false, loading=false, state='';

const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const enc=encodeURIComponent;
/* 하루는 자정에 바뀐다(서가와 같게, 기기 시간) */
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2400); }
function setState(s){ state=s; const el=document.getElementById('st'); if(!el) return;
  el.textContent={busy:'맞추는 중',err:'연결 안 됨'+(out.length?' · 보낼 것 '+out.length:''),on:out.length?'보낼 것 '+out.length:''}[s]||''; el.classList.toggle('err',s==='err'); }

/* ── Supabase(REST) ── */
async function rest(path,opt){
  const r=await fetch(cfg.url+'/rest/v1/'+path,Object.assign({headers:{apikey:cfg.key,Authorization:'Bearer '+cfg.key,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'}},opt||{}));
  if(!r.ok){ const e=new Error('HTTP '+r.status); e.status=r.status; throw e; }
  const t=await r.text(); return t?JSON.parse(t):null;
}
async function getAll(path){ let all=[], off=0;
  for(;;){ const rows=await rest(path+(path.includes('?')?'&':'?')+'order=id&limit=1000&offset='+off)||[]; all=all.concat(rows); if(rows.length<1000) break; off+=1000; }
  return all; }
const upsert=(t,rows)=>rest(t,{method:'POST',body:JSON.stringify(rows),keepalive:true});

/* ── 받아오기: 읽는 중(쪽이 적힌 책, 마지막으로 적은 책이 맨 위)과 읽기 대기(읽을 책 가운데 쪽이 없는 책, 순위대로) — 서가의 readingBooks·waitBooks와 같다 ── */
async function load(){
  if(!cfg.url||!cfg.key||loading) return; loading=true; setState('busy');
  try{
    await flush();
    const [bk,rd,mt]=await Promise.all([getAll('seoga_books?select=id,data'),
      getAll('seoga_reads?select=id,data&data->>kind=in.(page,mark,scan)'),
      rest('seoga_meta?select=id,data&id=eq.order')]);
    const books=bk.map(r=>r.data).filter(b=>b&&!b.purged&&!b.jar&&!b.discarded&&!b.held&&!b.binAt);
    const last=new Map();
    rd.forEach(r=>{ const x=r.data; if(!x||x.gone||!(x.kind==='page'||x.kind==='mark'||x.kind==='scan')) return; const t=x.at||''; if(t>(last.get(x.bookId)||'')) last.set(x.bookId,t); });
    const slim=b=>({id:b.id,title:b.title||'',author:b.author||'',page:b.page||0,total:b.total||0,lent:!!b.borrowed&&!b.returnedAt,last:last.get(b.id)||b.pageAt||''});
    const reading=books.filter(b=>b.page>0).map(slim).sort((a,z)=>z.last.localeCompare(a.last)||a.title.localeCompare(z.title,'ko'));
    const ord=((mt&&mt[0]&&mt[0].data&&mt[0].data.next)||[]), by=new Map(books.map(b=>[b.id,b]));
    /* 순위에 아직 없는 읽을 책(이 앱에서 막 담은 책)은 맨 아래에 붙인다 — 서가의 reconcile과 같다 */
    const inOrd=new Set(ord), tail=books.filter(b=>b.category==='next'&&!inOrd.has(b.id)).sort((a,z)=>(a.added||'').localeCompare(z.added||''));
    const wait=ord.map(id=>by.get(id)).concat(tail).filter(b=>b&&b.category==='next'&&!(b.page>0)&&!b.keep&&!b.ref).map(slim);
    const titles=bk.map(r=>r.data).filter(b=>b&&!b.purged&&!b.jar&&b.title).map(b=>({t:b.title.trim(),s:b.discarded?'폐기함':b.held?'보류':b.category==='best'?'베스트':b.category==='next'?'읽을 책':'미정'}));
    C={reading,wait,titles,at:new Date().toISOString()}; lsSet(CACHEKEY,C);
    setState('on');
  }catch(e){ setState('err'); }
  loading=false;
  if(view==='list') render();   /* 책 화면에서는 다시 그리지 않는다 — 적던 글이 지워지지 않게 */
}

/* ── 적기: 적을 것 하나 {bookId, mid, to, text, scan, date, at}. 서가의 쪽수 적기·코멘트 적기와 같은 줄을 남긴다 ──
   쪽이 현재 쪽과 다르면 현재 쪽을 그 쪽으로 고친다. 다만 코멘트와 함께 적은 쪽이 현재 쪽보다 앞이면 현재 쪽은 그대로 둔다(앞쪽에 단 코멘트). */
async function apply(it){
  if(it.type==='add'){ const now=new Date().toISOString(); it.book.updated=now;   /* 새 책 한 줄. 순위(seoga_meta의 order)는 건드리지 않는다 — 서가가 받아서 읽기 대기 맨 아래에 붙인다 */
    await upsert('seoga_books',[{id:it.book.id,data:it.book,updated_at:now}]); return; }
  const got=await rest('seoga_books?select=id,data&id=eq.'+enc(it.bookId));
  const b=got&&got[0]&&got[0].data; if(!b||b.purged) return;          /* 그사이 지워진 책 */
  const now=new Date().toISOString(), d=it.date, at=it.at||now, was=b.page||0, to=it.to||0, rows=[];
  const setPage=to>0&&to!==was&&(to>was||!it.text);
  if(setPage){
    const pr=await rest('seoga_reads?select=id,data&data->>kind=eq.page&data->>bookId=eq.'+enc(b.id)+'&data->>date=eq.'+enc(d))||[];
    const day=pr.map(r=>r.data).filter(x=>x&&x.kind==='page'&&x.bookId===b.id&&x.date===d);
    let x=day.find(x=>!x.end&&!x.gone);
    if(x) x.page=to;
    else { const base='pg-'+b.id+'-'+d; x={id:day.some(x=>x.id===base)?base+'-'+uid():base,kind:'page',bookId:b.id,title:b.title,date:d,from:was,page:to}; }
    x.at=at; x.updated=now; rows.push(x);
    b.page=to; b.pageAt=d; b.updated=now;
  }
  if(it.text){ const m={id:it.mid,kind:it.scan?'scan':'mark',bookId:b.id,title:b.title,page:to,text:it.text,date:d,at,updated:now}; if(it.quote) m.quote=true; rows.push(m); }
  if(rows.length) await upsert('seoga_reads',rows.map(x=>({id:x.id,data:x,updated_at:now})));
  if(setPage) await upsert('seoga_books',[{id:b.id,data:b,updated_at:now}]);
}
async function flush(){
  if(busy||!out.length||!cfg.url) return; busy=true;
  try{ while(out.length){ await apply(out[0]); out.shift(); lsSet(OUTKEY,out); } }
  finally{ busy=false; }
}

/* ── 화면 ── */
function render(){
  const el=document.getElementById('view');
  if(setup||!cfg.url||!cfg.key){ el.innerHTML=setupHTML(); return; }
  el.innerHTML=view==='add'&&draft?addHTML():view==='book'&&cur?bookHTML():listHTML();
  setState(state);
}
function setupHTML(){
  return `<p class="note" style="margin-top:0">서가 설정에 넣은 Supabase 주소와 anon 키를 넣으면 읽는 책을 받아옵니다. 이 기기에만 저장됩니다.</p>
    <div class="field"><label>프로젝트 주소</label><input type="text" id="s-url" value="${esc(cfg.url||'')}" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label>anon 키</label><input type="password" id="s-key" value="${esc(cfg.key||'')}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="rowbtns"><button class="primary" onclick="saveCfg()">연결하기</button>${cfg.url?`<button class="linkish" onclick="setup=false;render()">그만두기</button>`:''}</div>`;
}
function saveCfg(){
  const u=document.getElementById('s-url').value.trim().replace(/\/+$/,''), k=document.getElementById('s-key').value.trim();
  if(!/^https?:\/\/\S+$/.test(u)||!k){ toast('주소와 키를 모두 넣어주세요'); return; }
  cfg={url:u,key:k}; lsSet(SBKEY,cfg); setup=false; render(); load();
}
function li(b,reading){ return `<li onclick="openBook('${b.id}')"><span>${esc(b.title)}</span>${reading?`<span class="m">${b.page}쪽</span>`:''}</li>`; }
function listHTML(){
  const r=C.reading, w=C.wait;
  return `<section><h2 class="sec"><span class="dot"></span>읽는 중${r.length?' · '+r.length+'권':''}</h2>
      ${r.length?`<ul class="books">${r.map(b=>li(b,true)).join('')}</ul>`:`<div class="empty">${C.at?'쪽수를 적기 시작한 책이 여기에 놓입니다.':'책을 받아오는 중입니다.'}</div>`}</section>
    ${w.length?`<details><summary>읽기 대기 · ${w.length}권</summary><ul class="books">${w.map(b=>li(b,false)).join('')}</ul></details>`:''}
    <div class="rowbtns"><button class="ghost" onclick="openAdd()">새 책 담기</button></div>
    <div class="foot"><a class="linkish" href="./seoga.html#read">서가 열기 · 완독은 서가에서</a><button class="linkish" onclick="load()">다시 받기</button><button class="linkish" onclick="setup=true;render()">연결 고치기</button></div>`;
}
/* ── 새 책 담기: 읽을 책으로, 자리 없이. 서가의 addSave가 만드는 책과 같은 모양이다. 견주기는 하지 않고 읽기 대기 맨 아래에 놓인다(순위는 서가에서 '견주기'로).
   증정본·빌린 책 표시는 서가처럼 함께 켤 수 없다. 읽은 책·자료는 서가에서 담는다. ── */
function plusDays(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function openAdd(){ draft={title:'',author:'',publisher:'',total:'',gift:false,received:today(),borrowed:false,library:'',due:plusDays(14)}; view='add'; render(); window.scrollTo(0,0); }
function dupHint(){ const t=(draft.title||'').trim(); if(!t) return ''; const h=(C.titles||[]).find(x=>x.t===t); return h?'이미 ‘'+h.t+'’('+h.s+')이 담겨 있습니다.':''; }
function addHTML(){
  const d=draft, f=(id,k,label,type,ph)=>`<div class="field"><label for="${id}">${label}</label><input type="${type||'text'}"${type==='number'?' inputmode="numeric"':''} id="${id}" value="${esc(String(d[k]||''))}" placeholder="${ph||''}" oninput="draft.${k}=this.value${k==='title'?";document.getElementById('a-dup').textContent=dupHint()":''}"></div>`;
  return `<h2 class="sec">새 책 담기 · 읽을 책</h2>
    ${f('a-title','title','제목','text','표지에 적힌 그대로')}<div class="hint" id="a-dup" style="color:var(--seal)">${esc(dupHint())}</div>
    ${f('a-author','author','지은이','text','옮긴이가 있으면 함께')}${f('a-pub','publisher','펴낸곳')}${f('a-total','total','총 쪽수','number','비워둬도 됩니다')}
    <div><button class="toggle${d.gift?' on':''}" onclick="draft.gift=!draft.gift;if(draft.gift)draft.borrowed=false;render()"><span class="box"></span>증정본으로 받은 책</button></div>
    ${d.gift?f('a-recv','received','받은 날짜','date'):''}
    <div><button class="toggle${d.borrowed?' on':''}" onclick="draft.borrowed=!draft.borrowed;if(draft.borrowed)draft.gift=false;render()"><span class="box"></span>도서관에서 빌린 책</button></div>
    ${d.borrowed?f('a-lib','library','도서관','text','예: 마두도서관')+f('a-due','due','반납일','date'):''}
    <div class="rowbtns"><button class="primary" onclick="saveAdd()">담기</button><button class="linkish" onclick="draft=null;back()">뒤로</button></div>
    <p class="hint">자리 없이 읽기 대기 맨 아래에 담깁니다. 순위는 서가에서 그 책을 펼쳐 ‘견주기’로 정합니다. 담으면 바로 쪽을 적을 수 있습니다.</p>`;
}
function saveAdd(){
  const d=draft, title=(d.title||'').trim(); if(!title){ toast('제목을 적어주세요'); const t=document.getElementById('a-title'); if(t) t.focus(); return; }
  const now=new Date().toISOString();
  const b={id:uid(),title,author:(d.author||'').trim(),publisher:(d.publisher||'').trim(),category:'next',ref:false,
    gift:!!d.gift,received:d.gift?(d.received||today()):'',location:'',
    borrowed:!!d.borrowed,library:d.borrowed?(d.library||'').trim():'',due:d.borrowed?(d.due||''):'',returnedAt:'',
    discarded:false,toDiscard:false,discardedAt:'',page:0,pageAt:'',total:Math.max(0,parseInt(d.total,10)||0),added:now,updated:now,note:''};
  out.push({type:'add',book:b}); lsSet(OUTKEY,out);
  C.wait.push({id:b.id,title:b.title,author:b.author,page:0,total:b.total,lent:b.borrowed,last:''}); (C.titles=C.titles||[]).push({t:title,s:'읽을 책'}); lsSet(CACHEKEY,C);
  draft=null; toast('담았습니다 · 읽기 대기 맨 아래'); openBook(b.id);
  setState('busy'); flush().then(()=>load(),()=>setState('err'));
}
function findB(id){ return C.reading.find(b=>b.id===id)||C.wait.find(b=>b.id===id); }
function scanWanted(b){ return scanOn===null? !!(b&&b.lent) : scanOn; }
function bookHTML(){
  const b=findB(cur); if(!b){ view='list'; return listHTML(); }
  return `<div class="bt">${esc(b.title)}</div><div class="ba">${[b.author,b.page?'지금 '+b.page+'쪽':'아직 적은 쪽이 없습니다'].filter(Boolean).map(esc).join(' · ')}</div>
    <div class="field"><label for="pg">몇 쪽</label><div class="pg"><input type="number" inputmode="numeric" id="pg" value="${b.page||''}" placeholder="쪽"><span>쪽</span></div></div>
    <div class="field"><div class="seg"><button class="${quoteOn?'':'on'}" onclick="setQuote(false)">코멘트</button><button class="${quoteOn?'on q':''}" onclick="setQuote(true)">밑줄</button></div>
      <textarea id="tx" rows="4" placeholder="${quoteOn?'책의 문장':'이 쪽에 대한 코멘트 · 비워도 됩니다'}" aria-label="${quoteOn?'밑줄':'코멘트'}"></textarea></div>
    <button class="toggle${scanWanted(b)?' on':''}" onclick="toggleScan()"><span class="box"></span>이 쪽을 스캔한다${b.lent?' · 빌린 책':''}</button>
    <div class="rowbtns"><button class="primary" onclick="save()">적기</button><button class="linkish" onclick="back()">뒤로</button></div>
    <p class="hint">쪽만 적으면 현재 쪽이 바뀌고, 글만 적으면 그 쪽의 코멘트나 밑줄로 남습니다. 글과 함께 적은 쪽이 현재 쪽보다 앞이면 현재 쪽은 그대로 둡니다. 밑줄은 서가의 밑줄 뽑기에 나옵니다.</p>`;
}
function openBook(id){ cur=id; view='book'; scanOn=null; quoteOn=false; render(); window.scrollTo(0,0); }
function back(){ view='list'; cur=null; render(); window.scrollTo(0,0); }
function keepInputs(fn){ const p=document.getElementById('pg').value, t=document.getElementById('tx').value; fn(); render(); document.getElementById('pg').value=p; document.getElementById('tx').value=t; }
function toggleScan(){ keepInputs(()=>{ scanOn=!scanWanted(findB(cur)); }); }
/* 코멘트 / 밑줄: 코멘트가 기본. 밑줄은 책의 문장이고 서가의 밑줄 뽑기에 나온다. 적고 나면 코멘트로 돌아간다. */
function setQuote(on){ keepInputs(()=>{ quoteOn=!!on; }); document.getElementById('tx').focus(); }
function scanName(){ const r=lsGet('seoga.read.v1',null); return (r&&r.settings&&r.settings.sc&&r.settings.sc.scan)||'스캔'; }
function save(){
  const b=findB(cur); if(!b) return;
  const v=parseInt(document.getElementById('pg').value,10), to=v>0?v:0, text=document.getElementById('tx').value.trim();
  const scan=!!text&&scanWanted(b), was=b.page||0, setPage=to>0&&to!==was&&(to>was||!text);
  if(!text&&!setPage){ toast(to?'쪽이 그대로입니다 · 코멘트를 적거나 쪽을 바꿔 주세요':'쪽이나 코멘트를 적어주세요'); return; }
  const now=new Date().toISOString();
  const quote=!!text&&quoteOn; quoteOn=false;
  out.push({bookId:b.id,mid:uid(),to,text,scan,quote,date:today(),at:now}); lsSet(OUTKEY,out);
  /* 화면은 먼저 고쳐 둔다 */
  if(setPage) b.page=to; b.last=now;
  C.wait=C.wait.filter(x=>x.id!==b.id||!(x.page>0)); if(b.page>0&&!C.reading.includes(b)) C.reading.push(b);
  C.reading.sort((a,z)=>z.last.localeCompare(a.last)); lsSet(CACHEKEY,C);
  toast([setPage?to+'쪽':'',text?(quote?'밑줄을 적었습니다':'코멘트를 적었습니다'):''].filter(Boolean).join(' · '));
  /* 적은 뒤에도 그 책의 화면에 머문다(이어서 다음 쪽·다음 코멘트를 적는다). 쪽 칸은 새 현재 쪽, 코멘트 칸은 비운다. 목록은 '뒤로'로 간다. */
  render(); window.scrollTo(0,0);
  setState('busy'); flush().then(()=>load(),()=>setState('err'));
  if(scan){ /* 서가와 같은 입력: 띄어쓰기·문장부호를 뺀 제목|쪽 */
    const tag=(b.title||'').replace(/[^\p{L}\p{N}_-]/gu,'');
    location.href='shortcuts://x-callback-url/run-shortcut?name='+enc(scanName())+'&input=text&text='+enc(tag+'|'+(to||''))+'&x-success='+enc(location.href.split('#')[0]);
  }
}
render(); setState(out.length?'on':'');
load();
window.addEventListener('online',()=>load());
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') load(); });
</script>
</body>
</html>
