<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게이트</title>
<style>
  :root{
    --bg:#12100e;
    --bg2:#1a1714;
    --ink:#f0ebe4;
    --dim:#8a8178;
    --line:#2e2925;
    --accent:#d9a441;
    --warn:#c9633f;
    --ok:#6f8f5a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:32px;
    line-height:1.6;
  }
  .wrap{width:100%;max-width:680px}
  .screen{display:none}
  .screen.on{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .eyebrow{
    font-size:12px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--dim);margin-bottom:20px;
  }
  h1{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-bottom:10px}
  .sub{color:var(--dim);font-size:15px;margin-bottom:28px}

  textarea{
    width:100%;background:var(--bg2);border:1px solid var(--line);
    border-radius:12px;color:var(--ink);padding:18px 20px;
    font:inherit;font-size:18px;line-height:1.5;resize:none;height:130px;
    transition:border-color .2s;
  }
  textarea:focus{outline:none;border-color:var(--accent)}
  textarea::placeholder{color:#5c554e}

  .check{
    display:flex;gap:12px;align-items:flex-start;
    margin-top:18px;padding:16px 18px;
    background:var(--bg2);border:1px solid var(--line);border-radius:12px;
    cursor:pointer;transition:border-color .2s;
  }
  .check:hover{border-color:#3d3630}
  .check input{
    appearance:none;width:20px;height:20px;flex:none;margin-top:2px;
    border:1.5px solid #4a433c;border-radius:5px;cursor:pointer;transition:.15s;
  }
  .check input:checked{background:var(--accent);border-color:var(--accent)}
  .check input:checked::after{
    content:"✓";display:block;text-align:center;color:#12100e;
    font-size:14px;font-weight:700;line-height:17px;
  }
  .check-body{font-size:15px}
  .check-note{color:var(--dim);font-size:13px;margin-top:2px}

  .alert{
    margin-top:14px;padding:14px 18px;border-radius:12px;
    font-size:14px;display:none;
  }
  .alert.on{display:block}
  .alert.warn{background:rgba(201,99,63,.12);border:1px solid rgba(201,99,63,.35);color:#e29470}
  .alert.ok{background:rgba(111,143,90,.12);border:1px solid rgba(111,143,90,.3);color:#9dbb86}

  .row{display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}
  button{
    font:inherit;font-size:16px;font-weight:500;
    padding:14px 28px;border-radius:11px;border:1px solid var(--line);
    background:var(--bg2);color:var(--ink);cursor:pointer;transition:.15s;
  }
  button:hover:not(:disabled){border-color:#4a433c;background:#221e1a}
  button.primary{background:var(--accent);border-color:var(--accent);color:#12100e;font-weight:600}
  button.primary:hover:not(:disabled){background:#e6b455;border-color:#e6b455}
  button:disabled{opacity:.35;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--dim);border-color:transparent;padding:14px 12px}
  button.ghost:hover{color:var(--ink);background:transparent}

  /* ── 세션 화면 ── */
  .purpose-label{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:16px}
  .purpose{
    font-size:34px;font-weight:600;line-height:1.35;letter-spacing:-.02em;
    padding:28px 0 32px;border-bottom:1px solid var(--line);
    white-space:pre-wrap;word-break:keep-all;
  }
  .clock{
    font-size:64px;font-weight:300;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;margin:32px 0 4px;
  }
  .clock-note{color:var(--dim);font-size:14px}

  /* ── 알람 오버레이 ── */
  .overlay{
    position:fixed;inset:0;background:rgba(18,16,14,.97);
    display:none;align-items:center;justify-content:center;
    padding:32px;z-index:100;
  }
  .overlay.on{display:flex;animation:pulse .5s ease}
  @keyframes pulse{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  .overlay-inner{max-width:640px;text-align:center}
  .overlay .mark{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:24px}
  .overlay .q{font-size:22px;color:var(--dim);margin-bottom:18px}
  .overlay .purpose-big{
    font-size:38px;font-weight:600;line-height:1.35;letter-spacing:-.02em;
    margin-bottom:12px;white-space:pre-wrap;word-break:keep-all;
  }
  .overlay .elapsed{font-size:16px;color:var(--dim);margin-bottom:36px}
  .overlay .row{justify-content:center}

  /* ── 기록 ── */
  .summary{
    background:var(--bg2);border:1px solid var(--line);border-radius:14px;
    padding:26px 28px;margin-bottom:28px;
  }
  .summary-top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .big-num{font-size:52px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .big-num.over{color:var(--warn)}
  .big-num.good{color:var(--ok)}
  .goal{color:var(--dim);font-size:15px}
  .summary-note{margin-top:12px;font-size:14px;color:var(--dim)}
  .stats{display:flex;gap:28px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
  .stat-l{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .stat-v{font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}

  .daygroup{margin-bottom:24px}
  .daylabel{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  .entry{
    display:flex;gap:16px;align-items:flex-start;
    padding:14px 0;border-bottom:1px solid var(--line);
  }
  .entry-time{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none;width:52px;padding-top:2px}
  .entry-body{flex:1;min-width:0}
  .entry-p{font-size:15px;word-break:keep-all}
  .entry-meta{font-size:13px;color:var(--dim);margin-top:4px}
  .tag{
    display:inline-block;font-size:11px;letter-spacing:.08em;
    padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:1px;
    background:rgba(201,99,63,.15);color:#e29470;border:1px solid rgba(201,99,63,.3);
  }
  .empty{color:var(--dim);font-size:15px;padding:24px 0}
  .foot{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
  @media (max-width:520px){
    h1{font-size:24px}.purpose{font-size:26px}.clock{font-size:48px}
    .overlay .purpose-big{font-size:28px}.big-num{font-size:42px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ══ 1. 게이트 ══ -->
  <section id="s-gate" class="screen on">
    <div class="eyebrow">들어가기 전에</div>
    <h1>무엇을 하러 들어가나요?</h1>
    <p class="sub">적어야 문이 열립니다. 구체적일수록 돌아오기 쉬워요.</p>

    <textarea id="purpose" placeholder="예) 다음 주 워크숍 자료용 논문 두 편 찾기" autofocus></textarea>

    <label class="check">
      <input type="checkbox" id="ego-pre">
      <span class="check-body">
        이번엔 에고서치 · SNS 검색을 할 예정
        <span class="check-note">내 이름·작품 검색, SNS 반응 확인 등</span>
      </span>
    </label>

    <div id="week-alert" class="alert"></div>

    <div class="row">
      <button class="primary" id="btn-start" disabled>문 열기</button>
      <button class="ghost" id="btn-log-1">기록 보기</button>
    </div>
  </section>

  <!-- ══ 2. 세션 ══ -->
  <section id="s-run" class="screen">
    <div class="purpose-label">지금 하려던 것</div>
    <div class="purpose" id="run-purpose"></div>
    <div class="clock" id="clock">0:00</div>
    <div class="clock-note" id="run-note">5분마다 확인할게요.</div>
    <div class="row">
      <button class="primary" id="btn-end">끝</button>
    </div>
  </section>

  <!-- ══ 3. 종료 확인 ══ -->
  <section id="s-end" class="screen">
    <div class="eyebrow">마무리</div>
    <h1 id="end-title">0분 있었어요</h1>
    <p class="sub" id="end-purpose"></p>

    <label class="check">
      <input type="checkbox" id="ego-post">
      <span class="check-body">
        실제로 에고서치 · SNS 검색을 했다
        <span class="check-note">계획엔 없었어도 했다면 체크해주세요</span>
      </span>
    </label>

    <div id="end-alert" class="alert"></div>

    <div class="row">
      <button class="primary" id="btn-save">기록하고 닫기</button>
    </div>
  </section>

  <!-- ══ 4. 기록 ══ -->
  <section id="s-log" class="screen">
    <div class="eyebrow">기록</div>
    <h1 style="margin-bottom:24px">에고서치 · SNS 검색</h1>

    <div class="summary">
      <div class="summary-top">
        <span class="big-num" id="week-count">0</span>
        <span class="goal">이번 주 / 목표 주 1회</span>
      </div>
      <div class="summary-note" id="week-note"></div>
      <div class="stats">
        <div><div class="stat-l">이번 주 세션</div><div class="stat-v" id="week-sessions">0</div></div>
        <div><div class="stat-l">이번 주 총 시간</div><div class="stat-v" id="week-time">0분</div></div>
        <div><div class="stat-l">평균 체류</div><div class="stat-v" id="week-avg">0분</div></div>
      </div>
    </div>

    <div id="log-list"></div>

    <div class="foot">
      <button id="btn-back">돌아가기</button>
      <button class="ghost" id="btn-export">기록 내려받기</button>
      <button class="ghost" id="btn-clear">전체 삭제</button>
    </div>
  </section>
</div>

<!-- ══ 알람 오버레이 ══ -->
<div class="overlay" id="overlay">
  <div class="overlay-inner">
    <div class="mark" id="ov-mark">5분 경과</div>
    <div class="q">아직 이걸 하는 중인가요?</div>
    <div class="purpose-big" id="ov-purpose"></div>
    <div class="elapsed" id="ov-elapsed"></div>
    <div class="row">
      <button class="primary" id="ov-continue">계속할게요</button>
      <button id="ov-end">여기서 끝</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var KEY = "gate.sessions.v1";
  var INTERVAL = 5 * 60 * 1000;   // 5분

  var $ = function(id){ return document.getElementById(id); };

  /* ─────────── 저장소 ─────────── */
  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch(e){ return []; }
  }
  function save(list){
    try { localStorage.setItem(KEY, JSON.stringify(list)); }
    catch(e){ alert("기록을 저장하지 못했습니다. 브라우저의 사생활 보호 모드인지 확인해주세요."); }
  }

  /* ─────────── 주 계산 (월요일 시작) ─────────── */
  function weekStart(d){
    var x = new Date(d);
    x.setHours(0,0,0,0);
    var day = (x.getDay() + 6) % 7;   // 월=0 … 일=6
    x.setDate(x.getDate() - day);
    return x.getTime();
  }
  function thisWeek(list){
    var from = weekStart(new Date());
    return list.filter(function(s){ return s.start >= from; });
  }
  function egoCountThisWeek(list){
    return thisWeek(list).filter(function(s){ return s.ego; }).length;
  }

  /* ─────────── 포맷 ─────────── */
  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function clockText(ms){
    var t = Math.floor(ms/1000);
    var h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = t%60;
    return h > 0 ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s);
  }
  function minutesText(ms){
    var m = Math.round(ms/60000);
    if (m < 1) return "1분 미만";
    if (m < 60) return m + "분";
    return Math.floor(m/60) + "시간 " + (m%60) + "분";
  }
  function dayLabel(ts){
    var d = new Date(ts);
    var names = ["일","월","화","수","목","금","토"];
    var today = new Date(); today.setHours(0,0,0,0);
    var that = new Date(ts); that.setHours(0,0,0,0);
    var diff = Math.round((today - that) / 86400000);
    var base = (d.getMonth()+1) + "월 " + d.getDate() + "일 " + names[d.getDay()] + "요일";
    if (diff === 0) return base + " · 오늘";
    if (diff === 1) return base + " · 어제";
    return base;
  }
  function timeLabel(ts){
    var d = new Date(ts);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  /* ─────────── 화면 전환 ─────────── */
  function show(id){
    ["s-gate","s-run","s-end","s-log"].forEach(function(x){
      $(x).classList.toggle("on", x === id);
    });
    window.scrollTo(0,0);
  }

  /* ─────────── 알람음 ─────────── */
  var audioCtx = null;
  function beep(){
    try{
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      [0, 0.42, 0.84].forEach(function(offset){
        var t0 = audioCtx.currentTime + offset;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(660, t0);
        osc.frequency.exponentialRampToValueAtTime(495, t0 + 0.3);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.28, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.34);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + 0.36);
      });
    }catch(e){}
  }

  /* ─────────── 세션 상태 ─────────── */
  var session = null;   // {purpose, egoPre, start}
  var ticker = null;
  var lastAlarm = 0;    // 몇 번째 5분 구간까지 알렸는지
  var baseTitle = "게이트";

  function elapsed(){ return Date.now() - session.start; }

  function tick(){
    var ms = elapsed();
    $("clock").textContent = clockText(ms);
    document.title = clockText(ms) + " · " + baseTitle;

    var slot = Math.floor(ms / INTERVAL);
    if (slot > lastAlarm){
      lastAlarm = slot;
      fireAlarm(slot);
    }
  }

  function fireAlarm(slot){
    beep();
    $("ov-mark").textContent = (slot * 5) + "분 경과";
    $("ov-purpose").textContent = session.purpose;
    $("ov-elapsed").textContent = "들어온 지 " + minutesText(elapsed()) + " 지났어요.";
    $("overlay").classList.add("on");
    document.title = "⏰ 확인 · " + baseTitle;
  }

  function closeOverlay(){
    $("overlay").classList.remove("on");
  }

  function startSession(){
    var p = $("purpose").value.trim();
    if (!p) return;
    session = { purpose: p, egoPre: $("ego-pre").checked, start: Date.now() };
    lastAlarm = 0;
    $("run-purpose").textContent = p;
    $("clock").textContent = "0:00";
    $("run-note").textContent = session.egoPre
      ? "에고서치 예정으로 표시됨 · 5분마다 확인할게요."
      : "5분마다 확인할게요.";
    show("s-run");
    beep();                      // 오디오 잠금 해제 겸 시작음
    if (ticker) clearInterval(ticker);
    ticker = setInterval(tick, 1000);
    tick();
  }

  function endSession(){
    closeOverlay();
    if (ticker){ clearInterval(ticker); ticker = null; }
    document.title = baseTitle;
    var ms = elapsed();
    $("end-title").textContent = minutesText(ms) + " 있었어요";
    $("end-purpose").textContent = "“" + session.purpose + "”";
    $("ego-post").checked = session.egoPre;
    session.duration = ms;
    updateEndAlert();
    show("s-end");
  }

  function updateEndAlert(){
    var el = $("end-alert");
    var checked = $("ego-post").checked;
    if (!checked){ el.className = "alert"; el.textContent = ""; return; }
    var already = egoCountThisWeek(load());
    el.className = "alert " + (already >= 1 ? "warn" : "ok");
    el.textContent = already >= 1
      ? "이번 주 " + (already + 1) + "번째 에고서치가 됩니다. 목표는 주 1회였어요."
      : "이번 주 첫 에고서치입니다. 목표 안이에요.";
  }

  function saveSession(){
    var list = load();
    list.push({
      start: session.start,
      duration: session.duration,
      purpose: session.purpose,
      ego: $("ego-post").checked,
      egoPlanned: session.egoPre
    });
    save(list);
    session = null;
    $("purpose").value = "";
    $("ego-pre").checked = false;
    $("btn-start").disabled = true;
    renderLog();
    show("s-log");
  }

  /* ─────────── 게이트 주간 경고 ─────────── */
  function updateWeekAlert(){
    var el = $("week-alert");
    if (!$("ego-pre").checked){ el.className = "alert"; el.textContent = ""; return; }
    var n = egoCountThisWeek(load());
    el.className = "alert " + (n >= 1 ? "warn" : "ok");
    el.textContent = n >= 1
      ? "이번 주에 이미 " + n + "번 했어요. 목표는 주 1회입니다. 다음 주로 미뤄볼까요?"
      : "이번 주 첫 번째예요. 목표 안입니다.";
  }

  /* ─────────── 기록 렌더 ─────────── */
  function renderLog(){
    var list = load().sort(function(a,b){ return b.start - a.start; });
    var wk = thisWeek(list);
    var ego = wk.filter(function(s){ return s.ego; }).length;
    var total = wk.reduce(function(a,s){ return a + (s.duration||0); }, 0);

    var num = $("week-count");
    num.textContent = ego;
    num.className = "big-num " + (ego > 1 ? "over" : "good");
    $("week-note").textContent = ego === 0
      ? "이번 주엔 아직 없어요."
      : ego === 1
        ? "목표를 지키고 있어요."
        : "목표보다 " + (ego - 1) + "번 많습니다.";

    $("week-sessions").textContent = wk.length;
    $("week-time").textContent = wk.length ? minutesText(total) : "0분";
    $("week-avg").textContent = wk.length ? minutesText(total / wk.length) : "0분";

    var box = $("log-list");
    box.innerHTML = "";
    if (!list.length){
      box.innerHTML = '<p class="empty">아직 기록이 없습니다.</p>';
      return;
    }

    var groups = [], cur = null;
    list.forEach(function(s){
      var key = new Date(s.start).toDateString();
      if (!cur || cur.key !== key){ cur = {key:key, ts:s.start, items:[]}; groups.push(cur); }
      cur.items.push(s);
    });

    groups.forEach(function(g){
      var wrap = document.createElement("div");
      wrap.className = "daygroup";
      var h = document.createElement("div");
      h.className = "daylabel";
      h.textContent = dayLabel(g.ts);
      wrap.appendChild(h);

      g.items.forEach(function(s){
        var row = document.createElement("div");
        row.className = "entry";

        var t = document.createElement("div");
        t.className = "entry-time";
        t.textContent = timeLabel(s.start);

        var body = document.createElement("div");
        body.className = "entry-body";

        var p = document.createElement("div");
        p.className = "entry-p";
        p.textContent = s.purpose;
        if (s.ego){
          var tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = "에고서치";
          p.appendChild(tag);
        }

        var meta = document.createElement("div");
        meta.className = "entry-meta";
        var bits = [minutesText(s.duration||0)];
        if (s.ego && !s.egoPlanned) bits.push("계획엔 없었음");
        if (!s.ego && s.egoPlanned) bits.push("하려다 안 함");
        meta.textContent = bits.join(" · ");

        body.appendChild(p); body.appendChild(meta);
        row.appendChild(t); row.appendChild(body);
        wrap.appendChild(row);
      });
      box.appendChild(wrap);
    });
  }

  /* ─────────── 내려받기 ─────────── */
  function exportLog(){
    var list = load().sort(function(a,b){ return a.start - b.start; });
    var lines = ["날짜,시각,목적,소요(분),에고서치,사전계획"];
    list.forEach(function(s){
      var d = new Date(s.start);
      lines.push([
        d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()),
        timeLabel(s.start),
        '"' + String(s.purpose).replace(/"/g,'""') + '"',
        Math.round((s.duration||0)/60000),
        s.ego ? "O" : "",
        s.egoPlanned ? "O" : ""
      ].join(","));
    });
    var blob = new Blob(["﻿" + lines.join("\n")], {type:"text/csv;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "게이트기록.csv";
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  }

  /* ─────────── 이벤트 ─────────── */
  $("purpose").addEventListener("input", function(){
    $("btn-start").disabled = !this.value.trim();
  });
  $("purpose").addEventListener("keydown", function(e){
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && this.value.trim()) startSession();
  });
  $("ego-pre").addEventListener("change", updateWeekAlert);
  $("ego-post").addEventListener("change", updateEndAlert);

  $("btn-start").addEventListener("click", startSession);
  $("btn-end").addEventListener("click", endSession);
  $("btn-save").addEventListener("click", saveSession);
  $("ov-continue").addEventListener("click", closeOverlay);
  $("ov-end").addEventListener("click", endSession);
  $("btn-log-1").addEventListener("click", function(){ renderLog(); show("s-log"); });
  $("btn-back").addEventListener("click", function(){ updateWeekAlert(); show("s-gate"); $("purpose").focus(); });
  $("btn-export").addEventListener("click", exportLog);
  $("btn-clear").addEventListener("click", function(){
    if (confirm("모든 기록을 지웁니다. 되돌릴 수 없어요. 계속할까요?")){
      save([]); renderLog();
    }
  });

  window.addEventListener("beforeunload", function(e){
    if (session){ e.preventDefault(); e.returnValue = ""; }
  });

  document.addEventListener("visibilitychange", function(){
    if (!document.hidden && session) tick();   // 탭 복귀 시 즉시 보정
  });

  updateWeekAlert();
  $("purpose").focus();
})();
</script>
