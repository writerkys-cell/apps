<meta name="theme-color" content="#f2ede1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2ede1; --paper-2:#e8e0cf; --ink:#23201c; --ink-soft:#736a59; --faint:#a39a88; --line:#d6ccb6;
  --seal:#9b3b32; --seal-faint:#efd9d2; --deep:#3f5566; --walk:#8597a4; --gold:#b8904a;
  --serif:'Gowun Batang',AppleMyungjo,"Apple SD Gothic Neo",Batang,serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
a{color:inherit;text-decoration:none}

/* ── 머리 ── */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:16px 20px 0}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;padding-bottom:10px}
.brand h1{margin:0;font-size:22px;letter-spacing:.3em;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block;transform:translateY(-3px)}
.dot.ok{background:#6f8a5c}.dot.busy{background:var(--gold)}.dot.err{background:var(--seal)}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{border-bottom:2px solid transparent;padding:6px 11px 9px;color:var(--ink-soft);font-size:15px;letter-spacing:.04em}
nav button.on{color:var(--ink);border-bottom-color:var(--seal)}
main{max-width:720px;margin:0 auto;padding:26px 20px 110px}
section[data-v]{display:none}
section[data-v].on{display:block}
h3{font-size:16px;font-weight:700;margin:34px 0 8px;letter-spacing:.06em}
.note{font-size:13.5px;color:var(--ink-soft);line-height:1.8;margin:6px 0 0}
.empty{color:var(--ink-soft);font-size:15px;padding:18px 0}
.err{color:var(--seal)}
.linkish{color:var(--seal);border-bottom:1px solid var(--seal)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{border:1px solid var(--ink-soft);border-radius:2px;padding:7px 14px;font-size:14px;background:transparent}
.btn.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.warn{color:var(--seal);border-color:var(--seal)}
.btn.big{padding:10px 22px;font-size:15.5px}
.field{margin:0}
.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:3px}
.field input,.field select,.field textarea,textarea.paste{width:100%;background:#f8f5ec;border:1px solid var(--line);border-radius:2px;padding:8px 10px;font-size:15px;font-variant-numeric:tabular-nums}
.field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.field textarea{min-height:5.5em;line-height:1.6;resize:vertical}
.field input.calc{color:var(--ink-soft)}
.field .hint{font-size:12px;color:var(--faint);margin-top:2px}
pre.sql{background:var(--paper-2);border:1px solid var(--line);padding:12px;font-size:12px;line-height:1.5;overflow-x:auto;white-space:pre}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);
  background:var(--ink);color:var(--paper);font-size:13.5px;padding:10px 18px;border-radius:2px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:50;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ── 적기 ── */
.today{margin:4px 0 22px}
.today .d{font-size:30px;line-height:1.25;letter-spacing:.04em}
.today .w{font-size:15px;color:var(--ink-soft);margin-left:10px;letter-spacing:.1em}
.today .s{display:block;margin-top:6px;font-size:14.5px;color:var(--ink-soft)}
.import{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0 20px;margin-bottom:8px}
.import ol{margin:6px 0 0;padding-left:1.3em;font-size:14.5px;line-height:1.9}
.import ol li::marker{color:var(--seal)}
textarea.paste{min-height:4.2em;margin-top:12px;font-size:13.5px;line-height:1.5}
.pasteMsg{font-size:14px;margin-top:8px;line-height:1.7}
.pasteMsg:empty{display:none}
.kinds{display:flex;gap:0;margin:22px 0 4px}
.kinds button{flex:0 0 auto;border:1px solid var(--line);padding:8px 22px;font-size:16px;letter-spacing:.2em;color:var(--ink-soft);background:#f8f5ec}
.kinds button+button{border-left:none}
.kinds button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kinds button.on.walk{background:var(--deep);border-color:var(--deep)}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 12px;margin-top:16px}
.fgrid .w2{grid-column:span 2}.fgrid .w4{grid-column:1/-1}
.fgrid .sep{grid-column:1/-1;border-top:1px dotted var(--line);margin:6px 0 0;padding-top:4px;font-size:13px;color:var(--ink-soft);letter-spacing:.06em}
.calcline{font-size:17px;margin:20px 0 0;font-variant-numeric:tabular-nums}
.calcline small{font-size:14px;color:var(--ink-soft)}
.kindWhy{font-size:13px;color:var(--ink-soft);min-height:1.5em}
.kindWhy:empty{min-height:0}
.rpe{display:flex;gap:4px;flex-wrap:wrap}

<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>달리기</h1><span class="dot" id="dot"></span></div>
    <nav id="nav">
      <button data-go="write">적기</button>
      <button data-go="flow">흐름</button>
      <button data-go="list">기록</button>
      <button data-go="weight">몸무게</button>
      <button data-go="set">설정</button>
    </nav>
  </div>
</header>
<main>
  <section data-v="write" id="vWrite"></section>
  <section data-v="flow" id="vFlow"></section>
  <section data-v="list" id="vList"></section>
  <section data-v="one" id="vOne"></section>
  <section data-v="weight" id="vWeight"></section>
  <section data-v="set" id="vSet" class="set"></section>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ═════════ 달리기 ═════════
   나이키 런 클럽에서 잰 달리기·걷기를 옮겨 적고, 흐름을 본다.
   - 적는 것: 운동(act), 몸무게(weight), 코스(course), 신발(shoe), 기준선(conf). 모두 미래 프로젝트의 run_log 표 한 곳에.
   - '나에 대해'(나이·키·목적 같은 것)는 이 기기의 localStorage에만 둔다. 표에도, 이 파일에도 적지 않는다.
   - 하루는 새벽 4시에 바뀐다(시작·서가·미래·보태기와 같음). 운동의 하루(day)는 시작 시각으로 정한다. */

const DAY_H = 4;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['일','월','화','수','목','금','토'];
function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayKey(t){ return keyOf(new Date((t==null?Date.now():t) - DAY_H*3600000)); }
function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); }
function daysBetween(a,b){ return Math.round((parseKey(b)-parseKey(a))/86400000); }
function kLabel(k){ const d=parseKey(k); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }
function kLabelW(k){ return kLabel(k)+' ('+WD[parseKey(k).getDay()]+')'; }
function kLabelY(k){ return k.slice(0,4)+'년 '+kLabel(k); }
function monthAdd(m,n){ const [y,mo]=m.split('-').map(Number); const d=new Date(y,mo-1+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function monthLabel(m){ const [y,mo]=m.split('-').map(Number); return y+'년 '+mo+'월'; }
function weekOf(k){ const w=(parseKey(k).getDay()+6)%7; return addDays(k,-w); }   /* 월요일 시작 */
let toastT; function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2800); }
function lsGet(k,fb){ try{ const v=localStorage.getItem(k); return v==null?fb:JSON.parse(v); }catch(e){ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function copyText(t,msg){ return navigator.clipboard.writeText(t).then(()=>toast(msg||'복사했습니다'),()=>toast('복사하지 못했습니다')); }
function myDevice(){
  const s=lsGet('sijak.device',''); if(s) return s;
  const u=navigator.userAgent;
  if(/iPhone/.test(u)) return '아이폰';
  if(/iPad/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)) return '아이패드';
  if(/Macintosh/.test(u)) return '맥북';
  return '이 기기';
}
const newId = p => p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ─────────── 수치 ─────────── */
/* 시간·페이스: "30:08", "1:02:10", 5'56", 5'56'', "5:56" → 초. 숫자만 있으면 분 */
function parseDur(s){
  s=String(s??'').trim(); if(!s||s==='--') return null;
  s=s.replace(/\/\s*km/i,'').replace(/''/g,'').replace(/[″"]/g,'').replace(/[′'’]/g,':').replace(/\s+/g,'').replace(/:+$/,'');
  if(/^\d+(\.\d+)?$/.test(s)) return Math.round(parseFloat(s)*60);
  const p=s.split(':'); if(p.length<2||p.length>3||p.some(x=>!/^\d+(\.\d+)?$/.test(x))) return null;
  const v=p.length===2 ? (+p[0])*60+(+p[1]) : (+p[0])*3600+(+p[1])*60+(+p[2]);
  return v>0?Math.round(v):null;
}
function parseNum(s){ s=String(s??'').replace(/,/g,'').trim(); if(!s||s==='--') return null; const m=s.match(/[-+]?\d+(\.\d+)?/); return m?parseFloat(m[0]):null; }
function fmtDur(sec){ if(!(sec>0)) return '–'; sec=Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return h?h+':'+pad(m)+':'+pad(s):m+':'+pad(s); }
function fmtDurK(sec){ if(!(sec>0)) return '0분'; const m=Math.round(sec/60); return m<60?m+'분':Math.floor(m/60)+'시간'+(m%60?' '+(m%60)+'분':''); }
function fmtPace(sec){ if(sec==null||!isFinite(sec)) return '–'; sec=Math.round(sec); return Math.floor(sec/60)+"'"+pad(sec%60)+'"'; }
function fmtKm(v,d){ return (Math.round(v*100)/100).toFixed(d==null?2:d); }
const km1 = v => (Math.round(v*10)/10).toFixed(1);
function paceOf(a){ return a&&a.km>0&&a.sec>0 ? a.sec/a.km : null; }
function speedOf(a){ return a&&a.km>0&&a.sec>0 ? a.km/(a.sec/3600) : null; }
function secDiff(v){ v=Math.round(Math.abs(v)); return v<60?v+'초':Math.floor(v/60)+'분 '+v%60+'초'; }
/* 걷기인지 달리기인지 — 케이던스가 있으면 140걸음/분, 없으면 1km 8분을 가른다 */
const WALK_CAD=140, WALK_PACE=480;
function guessKind(a){
  if(a.cad>0) return {kind:a.cad<WALK_CAD?'walk':'run', why:'케이던스 '+Math.round(a.cad)};
  const p=paceOf(a); if(p) return {kind:p>WALK_PACE?'walk':'run', why:'평균 페이스 '+fmtPace(p)};
  return null;
}
const KIND = {run:'달리기', walk:'걷기'};
const RPE_TXT = ['','아주 쉬움','쉬움','쉬움','조금 편함','보통','조금 힘듦','힘듦','꽤 힘듦','아주 힘듦','최대'];

/* ─────────── 설정(연결) ─────────── */
const CFG_KEY='dalligi.cfg';
let cfg=Object.assign({url:'',key:''}, lsGet(CFG_KEY,{}));
let autoNote='';
/* 같은 주소 아래의 다른 앱이 이 기기에 남긴 미래 프로젝트 연결 정보를 빌려 온다(비어 있을 때만) */
(function borrow(){
  if(cfg.url&&cfg.key) return;
  let u='',k='',from='';
  const sj=lsGet('sijak.cfg',null);
  if(sj&&sj.mr&&sj.mr.url&&sj.mr.key){ u=sj.mr.url; k=sj.mr.key; from='시작'; }
  if(!u){ const s=lsGet('seoga.sb',null); if(s&&s.url&&s.key){ u=s.url; k=s.key; from='서가'; } }
  if(!u){ try{ u=localStorage.getItem('mirae.url')||''; k=localStorage.getItem('mirae.key')||''; from='미래'; }catch(e){} }
  if(u&&k){ cfg={url:u,key:k}; lsSet(CFG_KEY,cfg); autoNote='이 기기의 '+from+' 설정에서 미래 프로젝트 연결 정보를 찾아 넣었습니다.'; }
})();
const sbOn=()=>!!(cfg.url&&cfg.key);

async function rest(path,opt){
  opt=opt||{};
  const r=await fetch(cfg.url.replace(/\/+$/,'')+'/rest/v1/'+path,{
    method:opt.method||'GET', body:opt.body,
    headers:Object.assign({apikey:cfg.key, Authorization:'Bearer '+cfg.key, 'Content-Type':'application/json'}, opt.headers||{})
  });
  const t=await r.text();
  if(!r.ok){ let m=t; try{ const j=JSON.parse(t); m=j.message||j.hint||t; }catch(e){} const er=new Error(m||('HTTP '+r.status)); er.status=r.status; throw er; }
  return t?JSON.parse(t):null;
}
const enc=encodeURIComponent;
function missingTable(e){ return e && (e.status===404 || /does not exist|schema cache|Could not find the table/i.test(e.message||'')); }

let dotState={};
function setDot(part,state,msg){
  dotState[part]={state,msg};
  const vals=Object.values(dotState), d=$('dot');
  d.className='dot '+(vals.some(v=>v.state==='err')?'err':vals.some(v=>v.state==='busy')?'busy':vals.length?'ok':'');
  d.title=vals.filter(v=>v.msg).map(v=>v.msg).join(' / ');
}

/* ═════════ 저장 — run_log 한 줄 = 하나. 나중에 고친 쪽이 이기고, 이 기기에서 못 올린 줄은 덮지 않는다 ═════════
   act    : { id:'a…', type:'act', kind:'run'|'walk', date(화면의 날짜), start, end, day(4시 기준), km, sec(러닝 시간), elapsed(경과 시간),
            best(최고 페이스, 초/km), kcal, cad, up, down, hrA, hrM, splits:[{n, km, pace, elev}], rpe, course, shoe, temp, weather, memo }
   weight : { id:'w'+날짜, type:'weight', date, kg }
   course : { id:'c…', type:'course', name, km }
   shoe   : { id:'s…', type:'shoe', name, startKm(이 앱 전에 신은 거리), limit, retired }
   conf   : { id:'conf', type:'conf', goal(하루 평균 기준선, km) }
   모두 deleted, updatedAt, device를 가진다. 지우면 deleted:true로 남긴다. */
const RUN_SQL=`create table if not exists run_log (id text primary key, data jsonb not null, updated_at timestamptz not null default now());
alter table run_log enable row level security;
drop policy if exists "run open" on run_log;
create policy "run open" on run_log for all using (true) with check (true);`;
const ST_KEY='dalligi.store', GOAL_DEF=4, SHOE_LIMIT=700;
let ST=Object.assign({rows:{}, dirty:{}, since:''}, lsGet(ST_KEY,{}));
if(!ST.rows) ST.rows={}; if(!ST.dirty) ST.dirty={};
let tableMissing=false, pushT=null, pushing=false;
function persist(){ lsSet(ST_KEY,ST); }
function live(type){ return Object.values(ST.rows).filter(r=>r&&r.type===type&&!r.deleted); }
function touch(r){
  r.updatedAt=new Date().toISOString(); r.device=myDevice();
  ST.rows[r.id]=r; ST.dirty[r.id]=1; persist();
  clearTimeout(pushT); pushT=setTimeout(push,800);
}
function goal(){ const c=ST.rows.conf; return (c&&+c.goal>0)?+c.goal:GOAL_DEF; }
async function push(){
  if(!sbOn()||pushing) return;
  const ids=Object.keys(ST.dirty).filter(id=>ST.rows[id]); if(!ids.length) return;
  pushing=true; setDot('sync','busy','올리는 중');
  try{
    for(let i=0;i<ids.length;i+=100){
      const part=ids.slice(i,i+100), sent={};
      part.forEach(id=>sent[id]=ST.rows[id].updatedAt);
      await rest('run_log',{method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
        body:JSON.stringify(part.map(id=>({id, data:ST.rows[id], updated_at:ST.rows[id].updatedAt||new Date().toISOString()})))});
      part.forEach(id=>{ if(ST.rows[id]&&ST.rows[id].updatedAt===sent[id]) delete ST.dirty[id]; });
      persist();
    }
    tableMissing=false; setDot('sync','ok','');
  }catch(er){
    tableMissing=missingTable(er);
    setDot('sync','err', tableMissing?'Supabase에 run_log 표가 없습니다 · 설정에서 SQL을 실행하세요':'올리지 못했습니다 · '+er.message);
  }
  pushing=false;
  if(Object.keys(ST.dirty).length && !tableMissing){ clearTimeout(pushT); pushT=setTimeout(push,15000); }
}
async function pull(){
  if(!sbOn()){ setDot('sync','',''); return false; }
  setDot('sync','busy','받는 중');
  try{
    let q='run_log?select=id,data,updated_at&order=updated_at.asc';
    if(ST.since) q+='&updated_at=gte.'+enc(new Date(Date.parse(ST.since)-10*60000).toISOString());
    let off=0, max=ST.since||'', changed=false;
    for(;;){
      const rows=await rest(q+'&limit=500&offset='+off);
      (rows||[]).forEach(r=>{
        if(r.updated_at>max) max=r.updated_at;
        const rem=r.data; if(!rem||!rem.id||ST.dirty[r.id]) return;
        const loc=ST.rows[r.id];
        if(!loc||(rem.updatedAt||'')>(loc.updatedAt||'')){ ST.rows[r.id]=rem; changed=true; }
      });
      if(!rows||rows.length<500) break; off+=500;
    }
    ST.since=max; persist(); tableMissing=false;
    if(Object.keys(ST.dirty).length) push(); else setDot('sync','ok','');
    return changed;
  }catch(er){
    tableMissing=missingTable(er);
    if(tableMissing && !Object.keys(ST.rows).length) setDot('sync','','');
    else setDot('sync','err', tableMissing?'Supabase에 run_log 표가 없습니다 · 설정에서 SQL을 실행하세요':'받지 못했습니다 · '+er.message);
    return false;
  }
}

/* ═════════ Claude가 돌려준 글 읽기 ═════════
   운동기록 v1
   날짜: 2026-08-08 / 시작: 05:24 / … / 구간: 다음 줄부터 '거리 페이스 고도' */
const PASTE_KEYS={ '날짜':'date','시작':'start','끝':'end','거리km':'km','거리':'km','러닝시간':'sec','경과시간':'elapsed',
  '평균페이스':'pace','최고페이스':'best','칼로리':'kcal','케이던스':'cad','평균케이던스':'cad','고도상승m':'up','고도상승':'up',
  '고도하강m':'down','고도하강':'down','평균심박':'hrA','평균심박수':'hrA','최대심박':'hrM','최대심박수':'hrM','종류':'kind' };
function parseSplitLine(l){
  const p=l.trim().split(/\s+/); if(p.length<2) return null;
  const a=parseFloat(p[0]), pace=parseDur(p[1]); if(!(a>0)||!pace) return null;
  const elev=p.length>2?parseNum(p.slice(2).join('')):null;
  return a>=1 && Number.isInteger(a) ? {n:a, km:1, pace, elev} : {n:null, km:a, pace, elev};
}
function parsePaste(text){
  const lines=String(text||'').replace(/```[a-z]*/gi,'').split(/\r?\n/);
  const f={}, splits=[]; let inSplit=false, seen=0, header=false;
  for(let l of lines){
    l=l.trim(); if(!l) continue;
    if(/^운동\s*기록/.test(l)){ header=true; continue; }
    const m=l.match(/^([^\d:：][^:：]*)[:：]\s*(.*)$/);
    if(m){
      const k=m[1].replace(/\s/g,''), v=m[2].trim();
      if(k==='구간'){ inSplit=true; if(v){ const s=parseSplitLine(v); if(s) splits.push(s); } continue; }
      inSplit=false;
      if(PASTE_KEYS[k]){ f[PASTE_KEYS[k]]=v; seen++; }
      continue;
    }
    if(inSplit){ const s=parseSplitLine(l); if(s) splits.push(s); }
  }
  /* 1 이상 정수가 아닌 첫 칸은 마지막 짧은 구간 */
  let n=0; splits.forEach(s=>{ if(s.n) n=s.n; else s.n=n+1; });
  return {ok:seen>=2, header, f, splits};
}
function splitsText(sp){ return (sp||[]).map(s=>(s.km>=0.999?s.n:s.km)+' '+fmtPace(s.pace).replace(/"$/,'').replace("'",':')+(s.elev!=null?' '+s.elev:'')).join('\n'); }
/* 화면 날짜와 시작 시각으로 4시 기준의 하루를 정한다 */
function dayOf(date,start){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')) return '';
  const m=/^(\d{1,2}):(\d{2})/.exec(start||'');
  return m && +m[1]<DAY_H ? addDays(date,-1) : date;
}

/* ═════════ 셈 ═════════ */
function acts(){ return live('act').filter(a=>a.day&&a.km>0).sort((a,b)=>(a.day+(a.start||'')).localeCompare(b.day+(b.start||''))); }
function courses(){ return live('course').sort((a,b)=>a.name.localeCompare(b.name,'ko')); }
function shoes(){ return live('shoe').sort((a,b)=>(a.retired?1:0)-(b.retired?1:0)||a.name.localeCompare(b.name,'ko')); }
function nameOf(id){ const r=id&&ST.rows[id]; return r&&!r.deleted?r.name:''; }
/* 날마다: { day: {run, walk, runSec, walkSec} } */
function dayMap(list){
  const m={};
  (list||acts()).forEach(a=>{ const d=m[a.day]||(m[a.day]={run:0,walk:0,runSec:0,walkSec:0});
    if(a.kind==='walk'){ d.walk+=a.km; d.walkSec+=a.sec||0; } else { d.run+=a.km; d.runSec+=a.sec||0; } });
  return m;
}
function firstDay(){ const a=acts(); return a.length?a[0].day:null; }
/* 오늘(4시 기준)을 넣은 최근 30일. 쉰 날도 나눈다. 기록이 30일이 안 되면 있는 날만큼 */
function avg30(m,first,end){
  const k0=end||dayKey(); let run=0,walk=0,days=0,n=0;
  for(let i=0;i<30;i++){ const k=addDays(k0,-i); if(first&&k<first) break; const d=m[k]; n++;
    if(d){ run+=d.run; walk+=d.walk; if(d.run+d.walk>0) days++; } }
  n=Math.max(1,n);
  return {v:(run+walk)/n, run:run/n, walk:walk/n, days, n, from:addDays(k0,-(n-1)), to:k0};
}
function shoeKm(s){ return (+s.startKm||0)+acts().filter(a=>a.shoe===s.id).reduce((t,a)=>t+a.km,0); }
function shoeNear(s){ const lim=+s.limit||SHOE_LIMIT; return shoeKm(s)>=lim-100; }
/* 구간 — 1km를 다 채운 구간만으로 처음과 끝을 견준다 */
function splitInfo(sp){
  const full=(sp||[]).filter(s=>s.km>=0.999&&s.pace>0);
  if(full.length<2) return null;
  const h=Math.floor(full.length/2), A=full.slice(0,h), B=full.slice(full.length-h);
  const mean=x=>x.reduce((t,s)=>t+s.pace,0)/x.length;
  let fast=full[0], slow=full[0]; full.forEach(s=>{ if(s.pace<fast.pace) fast=s; if(s.pace>slow.pace) slow=s; });
  return {first:mean(A), last:mean(B), diff:mean(B)-mean(A), fast, slow, spread:slow.pace-fast.pace, n:full.length, odd:full.length%2===1};
}

function fillFromPaste(text){
  const r=parsePaste(text), msg=$('pasteMsg');
  if(!r.ok){ msg.innerHTML='<span class="err">읽을 수 있는 수치가 없습니다. Claude가 돌려준 코드 블록 안의 글을 통째로 붙여 넣으세요.</span>'; return; }
  const f=r.f, v=draft.v, set=(id,val)=>{ if(val!=null&&String(val).trim()!=='') v[id]=String(val).trim(); else v[id]=''; };
  set('fDate', /^\d{4}-\d{2}-\d{2}$/.test(f.date||'')?f.date:v.fDate);
  set('fStart', (f.start||'').match(/^\d{1,2}:\d{2}/)?f.start.match(/^(\d{1,2}):(\d{2})/).slice(1).map((x,i)=>i?x:pad(+x)).join(':'):'');
  set('fEnd', (f.end||'').match(/^\d{1,2}:\d{2}/)?f.end.match(/^(\d{1,2}):(\d{2})/).slice(1).map((x,i)=>i?x:pad(+x)).join(':'):'');
  const kmv=parseNum(f.km); set('fKm', kmv>0?String(kmv):'');
  const d=parseDur(f.sec), e=parseDur(f.elapsed), b=parseDur(f.best);
  set('fSec', d?fmtDur(d):''); set('fEl', e?fmtDur(e):''); set('fBest', b?fmtPace(b).replace(/"$/,'').replace("'",':'):'');
  ['kcal:fKcal','cad:fCad','up:fUp','down:fDown','hrA:fHrA','hrM:fHrM'].forEach(p=>{ const [a,id]=p.split(':'); const n=parseNum(f[a]); set(id, n==null?'':String(n)); });
  set('fSplits', splitsText(r.splits));
  draft.kindSet=false;
  if(f.kind&&/걷/.test(f.kind)){ draft.kind='walk'; draft.kindSet=true; } else if(f.kind&&/달|뛰|run/i.test(f.kind)){ draft.kind='run'; draft.kindSet=true; }
  draft.srcPace=parseDur(f.pace)||null;
  saveDraft(); renderWrite();
  const notes=[];
  notes.push('칸을 채웠습니다'+(r.splits.length?' · 구간 '+r.splits.length+'개':'')+'. 종류를 확인하고, 힘든 정도와 코스·신발을 고른 뒤 저장하세요.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f.date||'')) notes.push('<span class="err">날짜를 읽지 못해 오늘로 두었습니다.</span>');
  $('pasteMsg').innerHTML=notes.join('<br>');
}

function formAct(){
  const v=draft.v, n=id=>parseNum(v[id]);
  const splits=String(v.fSplits||'').split(/\r?\n/).map(parseSplitLine).filter(Boolean);
  let c=0; splits.forEach(s=>{ if(s.km>=0.999) c=s.n; else s.n=c+1; });
  return { kind:draft.kind, date:v.fDate||'', start:v.fStart||'', end:v.fEnd||'', day:dayOf(v.fDate,v.fStart),
    km:n('fKm'), sec:parseDur(v.fSec), elapsed:parseDur(v.fEl), best:parseDur(v.fBest), kcal:n('fKcal'), cad:n('fCad'),
    up:n('fUp'), down:n('fDown'), hrA:n('fHrA'), hrM:n('fHrM'), splits, rpe:draft.rpe||null,
    course:v.fCourse||'', shoe:v.fShoe||'', temp:n('fTemp'), weather:(v.fWeather||'').trim(), memo:(v.fMemo||'').trim() };
}
function refreshCalc(){
  let a=formAct(); const gk=guessKind(a), why=$('kindWhy');
  if(!draft.kindSet&&gk&&gk.kind!==draft.kind){ draft.kind=gk.kind; saveDraft(); a=formAct();
    document.querySelectorAll('#vWrite .kinds button').forEach(x=>x.classList.toggle('on',x.dataset.kind===draft.kind)); }
  if(why) why.textContent = !draft.kindSet&&gk ? KIND[draft.kind]+'로 골랐습니다('+gk.why+'). 틀렸으면 위에서 바꾸세요.' : '';
  const p=paceOf(a), s=speedOf(a), el=$('calc'), w=[];
  el.innerHTML = p ? `평균 페이스 ${fmtPace(p)} <small>/km</small> · 시속 ${km1(s)}km` : `<small>거리와 러닝 시간을 넣으면 평균 페이스와 속도를 셉니다.</small>`;
  if(p&&draft.srcPace&&Math.abs(draft.srcPace-p)>2) w.push(`나이키 앱의 평균 페이스는 ${fmtPace(draft.srcPace)}인데, 거리와 러닝 시간으로 세면 ${fmtPace(p)}입니다. 거리나 시간을 잘못 옮겼는지 보세요.`);
  if(a.splits.length&&a.km>0){ const t=a.splits.reduce((x,y)=>x+y.km,0); if(Math.abs(t-a.km)>0.06) w.push(`구간 거리를 더하면 ${fmtKm(t)}km인데, 거리는 ${fmtKm(a.km)}km입니다.`); }
  if(a.day&&a.date&&a.day!==a.date) w.push(`새벽 4시 전에 시작해서 ${kLabel(a.day)}의 운동으로 셉니다.`);
  if(a.shoe&&ST.rows[a.shoe]){ const sh=ST.rows[a.shoe]; if(shoeNear(sh)) w.push(`${esc(sh.name)}은(는) ${Math.round(shoeKm(sh))}km를 신었습니다. 바꿀 때(${+sh.limit||SHOE_LIMIT}km)가 가깝습니다.`); }
  const dup=acts().find(x=>x.id!==draft.editId&&x.day===a.day&&x.kind===a.kind&&((a.start&&x.start===a.start)||(!a.start&&a.km&&Math.abs(x.km-a.km)<0.005)));
  if(dup) w.push(`${kLabel(dup.day)}에 같은 ${KIND[a.kind]} 기록(${fmtKm(dup.km)}km${dup.start?', '+dup.start+' 시작':''})이 이미 있습니다.`);
  $('warns').innerHTML=w.map(x=>`<p>${x}</p>`).join('');
}
function saveAct(){
  const a=formAct();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(a.date)){ toast('날짜를 넣으세요'); return; }
  if(!(a.km>0)){ toast('거리를 km로 넣으세요'); $('fKm').focus(); return; }
  if(!(a.sec>0)){ toast('러닝 시간을 넣으세요 (예 30:08)'); $('fSec').focus(); return; }
  if(a.km>100||a.sec>24*3600){ toast('거리나 시간이 너무 큽니다'); return; }
  const old=draft.editId&&ST.rows[draft.editId];
  const r=Object.assign({}, old||{}, a, {id:old?old.id:newId('a'), type:'act', deleted:false});
  touch(r);
  draft=blankDraft(); draft.v.fShoe=r.shoe||draft.v.fShoe; saveDraft();
  toast(old?'고쳤습니다':kLabel(r.day)+' '+KIND[r.kind]+' '+fmtKm(r.km)+'km를 적었습니다');
  $('vWrite').innerHTML='';   /* 화면을 떠날 때 옛 칸 값을 새 칸으로 다시 읽어 들이지 않게 */
  openOne(r.id);
}
function editAct(id){
  const a=ST.rows[id]; if(!a) return;
  draft={editId:id, kind:a.kind||'run', kindSet:true, rpe:a.rpe||null, srcPace:null, v:{
    fDate:a.date||a.day, fStart:a.start||'', fEnd:a.end||'', fKm:a.km?String(a.km):'', fSec:a.sec?fmtDur(a.sec):'', fEl:a.elapsed?fmtDur(a.elapsed):'',
    fBest:a.best?fmtPace(a.best).replace(/"$/,'').replace("'",':'):'', fKcal:a.kcal??'', fCad:a.cad??'', fUp:a.up??'', fDown:a.down??'', fHrA:a.hrA??'', fHrM:a.hrM??'',
    fSplits:splitsText(a.splits), fCourse:a.course||'', fShoe:a.shoe||'', fTemp:a.temp??'', fWeather:a.weather||'', fMemo:a.memo||'' }};
  Object.keys(draft.v).forEach(k=>draft.v[k]=draft.v[k]==null?'':String(draft.v[k]));
  saveDraft(); go('write');
}

/* ═════════ 그림 ═════════ */
const C_RUN='#23201c', C_WALK='#8597a4', C_SEAL='#9b3b32', C_LINE='#d6ccb6', C_SOFT='#736a59';
const narrow=()=>window.innerWidth<520;
/* 쌓은 막대 — items: [{a(달리기), b(걷기), tip, lab, hi}] */
function stackSVG(items,o){
  const W_=narrow()?360:640, H=o.h||(narrow()?150:165), L=4, R=o.r||4, T=16, B=26, w=W_-L-R, h=H-T-B, bw=w/items.length;
  const top=Math.max(o.min||0.1, ...items.map(x=>x.a+x.b), o.ref||0)*1.15;
  let s=`<svg viewBox="0 0 ${W_} ${H}" role="img" aria-label="${esc(o.label)}"><line x1="${L}" x2="${L+w}" y1="${T+h}" y2="${T+h}" stroke="${C_LINE}"/>`;
  items.forEach((it,i)=>{ const x=L+i*bw, bx=x+bw*(o.gap||0.18), bwid=bw*(1-2*(o.gap||0.18));
    const ha=it.a/top*h, hb=it.b/top*h;
    if(it.a>0) s+=`<rect x="${bx}" y="${T+h-ha}" width="${bwid}" height="${Math.max(1.5,ha)}" fill="${it.hi?C_SEAL:C_RUN}"/>`;
    if(it.b>0) s+=`<rect x="${bx}" y="${T+h-ha-hb}" width="${bwid}" height="${Math.max(1.5,hb)}" fill="${C_WALK}"/>`;
    s+=`<rect x="${x}" y="${T}" width="${bw}" height="${h}" fill="transparent"><title>${esc(it.tip)}</title></rect>`;
    if(it.lab) s+=`<text x="${x+bw/2}" y="${H-8}" font-size="11.5" fill="${C_SOFT}" text-anchor="middle">${esc(it.lab)}</text>`;
    if(it.top) s+=`<text x="${x+bw/2}" y="${T+h-ha-hb-4}" font-size="11" fill="${C_SOFT}" text-anchor="middle">${esc(it.top)}</text>`;
  });
  if(o.ref>0){ const y=T+h-o.ref/top*h; s+=`<line x1="${L}" x2="${L+w}" y1="${y}" y2="${y}" stroke="${C_SEAL}" stroke-dasharray="4 4"/>`;
    if(o.refLab) s+=`<text x="${L+w+6}" y="${y+4}" font-size="11.5" fill="${C_SEAL}">${esc(o.refLab)}</text>`; }
  return s+'</svg>';
}
/* 선 — pts: [{v, lab, tip}] · invert면 위가 빠름(페이스) */
function lineSVG(pts,o){
  if(pts.length<2) return `<p class="note">${o.few||'점이 둘 이상 모이면 그립니다.'}</p>`;
  const W_=narrow()?360:640, H=o.h||(narrow()?180:200), L=8, R=narrow()?66:72, T=18, B=28, w=W_-L-R, h=H-T-B;
  const vs=pts.map(p=>p.v).concat(o.goal!=null?[o.goal]:[]);
  let lo=Math.min(...vs), hi=Math.max(...vs); const padv=(hi-lo)*0.18||(o.invert?10:hi*0.1||1); lo-=padv; hi+=padv; if(!o.invert&&o.zero) lo=Math.max(0,lo);
  const x=i=>L+i*w/(pts.length-1), y=v=>o.invert ? T+(v-lo)/(hi-lo)*h : T+h-(v-lo)/(hi-lo)*h;
  let s=`<svg viewBox="0 0 ${W_} ${H}" role="img" aria-label="${esc(o.label)}"><line x1="${L}" x2="${L+w}" y1="${T+h}" y2="${T+h}" stroke="${C_LINE}"/>`;
  pts.forEach((p,i)=>{ if(p.lab) s+=`<line x1="${x(i)}" x2="${x(i)}" y1="${T+h}" y2="${T+h+4}" stroke="${C_LINE}"/><text x="${x(i)}" y="${H-7}" font-size="11.5" fill="${C_SOFT}" text-anchor="${x(i)-L<20?'start':x(i)>L+w-20?'end':'middle'}">${esc(p.lab)}</text>`; });
  if(o.goal!=null){ const gy=y(o.goal); s+=`<line x1="${L}" x2="${L+w}" y1="${gy}" y2="${gy}" stroke="${C_SEAL}" stroke-dasharray="4 4"/><text x="${L+w+6}" y="${gy+4}" font-size="11.5" fill="${C_SEAL}">${esc(o.goalLab)}</text>`; }
  s+=`<polyline fill="none" stroke="${o.color||C_RUN}" stroke-width="${pts.length>120?1.5:1.8}" stroke-linejoin="round" points="${pts.map((p,i)=>x(i).toFixed(1)+','+y(p.v).toFixed(1)).join(' ')}"/>`;
  if(o.dots) pts.forEach((p,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="${pts.length>40?2.2:3}" fill="${p.c||o.color||C_RUN}"><title>${esc(p.tip||'')}</title></circle>`; });
  const lp=pts[pts.length-1], ly=y(lp.v);
  s+=`<circle cx="${x(pts.length-1)}" cy="${ly}" r="4" fill="${o.lastColor||o.color||C_RUN}"><title>${esc(lp.tip||'')}</title></circle>`;
  s+=`<text x="${x(pts.length-1)+8}" y="${ly+4}" font-size="13" fill="${C_RUN}">${esc(o.fmt(lp.v))}</text>`;
  return s+'</svg>';
}
const legend=(walk)=>`<div class="legend"><span><i style="background:${C_RUN}"></i>달리기</span>${walk?`<span><i style="background:${C_WALK}"></i>걷기</span>`:''}<span><i style="background:${C_SEAL}"></i>오늘</span></div>`;

/* ═════════ 흐름 ═════════ */
let barMode=lsGet('dalligi.barMode','km');
function weekRows(n){
  const all=acts(), k0=dayKey(), w0=weekOf(k0), out=[];
  for(let i=n-1;i>=0;i--){ const ws=addDays(w0,-7*i), we=addDays(ws,6);
    const xs=all.filter(a=>a.day>=ws&&a.day<=we);
    out.push({ws, we, run:xs.filter(a=>a.kind!=='walk').reduce((t,a)=>t+a.km,0), walk:xs.filter(a=>a.kind==='walk').reduce((t,a)=>t+a.km,0),
      runSec:xs.filter(a=>a.kind!=='walk').reduce((t,a)=>t+(a.sec||0),0), part:we>=k0}); }
  return out;
}
/* 달리기 주간 거리가 앞선 4주 평균보다 10% 넘게 늘었나 — 지난주(끝난 주)와 이번 주(지금까지)를 본다 */
function weekWarn(){
  const first=firstDay(); if(!first) return null;
  const ws=weekRows(6), res=[];
  [ws[5], ws[4]].forEach((cur,j)=>{ const idx=5-j, prev=ws.slice(idx-4,idx).filter(x=>x.we>=first);
    if(prev.length<2) return; const avg=prev.reduce((t,x)=>t+x.run,0)/prev.length; if(!(avg>0)) return;
    const r=cur.run/avg-1; res.push({cur, avg, r, part:cur.part}); });
  return res;
}
function sameEffort(){
  const k0=dayKey(), runs=acts().filter(a=>a.kind!=='walk'&&a.rpe&&a.sec>0);
  const bands=[['쉬움 (1–4)',1,4],['보통 (5–6)',5,6],['힘듦 (7–10)',7,10]];
  return bands.map(([name,lo,hi])=>{
    const xs=runs.filter(a=>a.rpe>=lo&&a.rpe<=hi), pick=(a,b)=>xs.filter(x=>x.day>addDays(k0,-a)&&x.day<=addDays(k0,-b));
    const P=l=>{ const km=l.reduce((t,x)=>t+x.km,0), s=l.reduce((t,x)=>t+x.sec,0); return km>0?s/km:null; };
    const A=pick(28,0), B=pick(56,28);
    return {name, now:P(A), nowN:A.length, before:P(B), beforeN:B.length, all:P(xs), allN:xs.length};
  });
}
function courseStats(){
  const k0=dayKey();
  return courses().map(c=>{ const xs=acts().filter(a=>a.course===c.id&&a.kind!=='walk'&&a.sec>0);
    if(!xs.length) return {c, n:0};
    let best=xs[0]; xs.forEach(a=>{ if(paceOf(a)<paceOf(best)) best=a; });
    const rec=xs.slice(-5), rp=rec.reduce((t,a)=>t+a.sec,0)/rec.reduce((t,a)=>t+a.km,0);
    return {c, n:xs.length, best, recent:rp, recentN:rec.length};
  }).filter(x=>x.n);
}
function renderFlow(){
  const host=$('vFlow'), all=acts();
  if(!all.length){ host.innerHTML=`<p class="empty">아직 적은 운동이 없습니다. <button class="linkish" onclick="go('write')">적기</button>에서 첫 기록을 넣으세요.</p>`+askBlock(); bindAsk(); return; }
  const m=dayMap(all), first=all[0].day, g=goal(), a=avg30(m,first), k0=dayKey(), w0=weekOf(k0);
  const tw=weekRows(1)[0], met=a.v>=g, cmp=a.v-g;
  let h=`<div class="top-num${met?' met':''}">
    <div class="lbl">최근 ${a.n}일 하루 평균</div>
    <div class="big">${fmtKm(a.v)}km<small>운동한 날 ${a.days}일</small></div>
    <div class="sub">달리기 ${fmtKm(a.run)}km · 걷기 ${fmtKm(a.walk)}km · ${Math.abs(cmp)<0.005?'기준선 '+g+'km와 같습니다':'기준선 '+g+'km보다 '+fmtKm(Math.abs(cmp))+'km '+(cmp>0?'많습니다':'적습니다')}</div>
    <div class="now">이번 주(${kLabel(w0)}부터) 지금까지 달리기 ${fmtKm(tw.run)}km${tw.walk?' · 걷기 '+fmtKm(tw.walk)+'km':''}</div>
  </div>
  <p class="note">하루 평균은 쉰 날도 나눕니다. 새벽 4시에 하루가 바뀝니다.</p>`;

  /* 최근 30일 날마다 */
  const items=[]; for(let i=29;i>=0;i--){ const k=addDays(k0,-i), d=m[k]||{run:0,walk:0,runSec:0,walkSec:0}, dt=parseKey(k);
    const A=barMode==='km'?d.run:d.runSec/60, B=barMode==='km'?d.walk:d.walkSec/60;
    items.push({a:A, b:B, hi:k===k0&&A>0, lab:(i===29||dt.getDate()===1)?(dt.getMonth()+1)+'/'+dt.getDate():(i%(narrow()?7:5)===0&&i>2?String(dt.getDate()):''),
      tip:kLabelW(k)+' · '+(d.run||d.walk?[d.run?'달리기 '+fmtKm(d.run)+'km '+fmtDurK(d.runSec):'', d.walk?'걷기 '+fmtKm(d.walk)+'km '+fmtDurK(d.walkSec):''].filter(Boolean).join(' · '):'쉼')}); }
  h+=`<h3>최근 30일 날마다 <span class="toggle"><button data-bm="km" class="${barMode==='km'?'on':''}">거리</button> <button data-bm="min" class="${barMode==='min'?'on':''}">시간</button></span></h3>
    <div class="chart">${stackSVG(items,{label:'최근 30일 날마다', min:barMode==='km'?1:10})}</div>${legend(all.some(x=>x.kind==='walk'))}`;

  /* 평균의 흐름 */
  const start=addDays(first,29);
  if(start<=k0){ let from=addDays(k0,-364); if(from<start) from=start; const pts=[];
    for(let k=from;k<=k0;k=addDays(k,1)){ const dt=parseKey(k), long=daysBetween(from,k0)>70;
      pts.push({v:avg30(m,first,k).v, tip:kLabel(k)+'까지 30일 평균', lab:(dt.getDate()===1&&(!long||dt.getMonth()%(narrow()?3:2)===0))?(dt.getMonth()===0?String(dt.getFullYear()).slice(2)+'년 ':'')+(dt.getMonth()+1)+'월':''}); }
    h+=`<h3>평균의 흐름</h3><div class="chart">${lineSVG(pts,{label:'최근 30일 하루 평균의 흐름', goal:g, goalLab:'기준 '+g+'km', fmt:v=>fmtKm(v,1)+'km', zero:true, lastColor:pts[pts.length-1].v>=g?C_SEAL:C_RUN, few:'내일부터 흐름을 그립니다.'})}</div>`;
  } else h+=`<h3>평균의 흐름</h3><p class="note">기록이 30일 쌓이면(${kLabel(start)}부터) 날마다의 30일 평균을 선으로 그립니다.</p>`;

      tip:kLabel(x.ws)+'–'+kLabel(x.we)+(x.part?' (진행 중)':'')+' · 달리기 '+fmtKm(x.run)+'km'+(x.walk?' · 걷기 '+fmtKm(x.walk)+'km':'')}; }),{label:'주마다 거리', gap:0.14, min:5})}</div>
    <p class="note">월요일에 시작하는 주. 막대 위 숫자는 달리기 거리입니다.</p>`;
  if(warn&&warn.length){ const bad=warn.filter(x=>x.r>0.1);
    if(bad.length) h+=bad.map(x=>`<p class="alert">${x.part?'이번 주는 지금까지':'지난주'} 달리기 ${fmtKm(x.cur.run)}km로, 앞선 4주 평균 ${fmtKm(x.avg)}km보다 ${Math.round(x.r*100)}% 많습니다. 다치는 일은 대개 거리를 빨리 늘릴 때 생깁니다. 한 주에 10% 안팎으로 늘리는 것이 흔한 기준입니다.</p>`).join('');
    else h+=`<p class="calm">달리기 거리가 앞선 4주 평균보다 크게 늘지 않았습니다.</p>`; }

    h+=`<h3>달리기 페이스</h3><div class="chart">${lineSVG(runs.map((a,i)=>({v:paceOf(a), lab:lab(a,i), tip:kLabel(a.day)+' · '+fmtKm(a.km)+'km · '+fmtPace(paceOf(a)), c:a.day===k0?C_SEAL:C_RUN})),{label:'달리기마다의 평균 페이스', invert:true, dots:true, fmt:v=>fmtPace(v), few:'달리기가 둘 이상 쌓이면 그립니다.'})}</div>

    if(cr.length>=2) h+=`<h3>케이던스</h3><div class="chart">${lineSVG(cr.map((a,i)=>({v:a.cad, lab:i===0||parseKey(cr[i-1].day).getMonth()!==parseKey(a.day).getMonth()?(parseKey(a.day).getMonth()+1)+'월':'', tip:kLabel(a.day)+' · '+a.cad+' spm'})),{label:'케이던스', dots:true, h:narrow()?140:150, fmt:v=>Math.round(v)+' spm'})}</div>`;
  }

  /* 같은 힘에 얼마나 빨랐나 */

  else{ h+=`<div class="tw"><table class="t"><thead><tr><th>힘든 정도</th><th>최근 4주</th><th>그전 4주</th><th>달라진 것</th></tr></thead><tbody>`+
    se.filter(x=>x.allN).map(x=>{ const d=x.now!=null&&x.before!=null?x.now-x.before:null;
      return `<tr><td>${x.name}</td><td>${x.now!=null?fmtPace(x.now)+' <span class="lo">('+x.nowN+')</span>':'–'}</td><td>${x.before!=null?fmtPace(x.before)+' <span class="lo">('+x.beforeN+')</span>':'–'}</td><td class="${d!=null&&d<-1?'hi':''}">${d==null?'–':Math.abs(d)<1?'같음':secDiff(Math.abs(d))+(d<0?' 빨라짐':' 느려짐')}</td></tr>`; }).join('')+
    `</tbody></table></div><p class="note">거리를 달린 시간으로 나눈 평균 페이스. 괄호는 달린 횟수입니다.</p>`; }

  /* 코스마다 */

    cs.map(x=>`<tr><td>${esc(x.c.name)}</td><td>${x.n}번</td><td><button class="linkish" onclick="openOne('${x.best.id}')">${fmtPace(paceOf(x.best))}</button> <span class="lo">${kLabel(x.best.day)}</span></td><td>${fmtPace(x.recent)}</td></tr>`).join('')+`</tbody></table></div>`;

  if(sh.length) h+=`<h3>신발</h3><ul class="items">`+sh.map(s=>{ const kmv=shoeKm(s), lim=+s.limit||SHOE_LIMIT;
    return `<li><div style="flex:1">${esc(s.name)}<div class="shoebar${shoeNear(s)?' near':''}"><i style="width:${Math.min(100,kmv/lim*100)}%"></i></div></div><span class="r">${Math.round(kmv)} / ${lim}km</span></li>`; }).join('')+`</ul>`
    + (sh.some(shoeNear)?`<p class="alert">${sh.filter(shoeNear).map(s=>esc(s.name)).join(', ')} — 바꿀 때가 가깝습니다. 쿠션이 닳은 신발은 무릎과 정강이에 부담을 줍니다.</p>`:'');

  /* 달마다 */
  const ms=[]; for(let mo=first.slice(0,7); mo<=k0.slice(0,7); mo=monthAdd(mo,1)){
    let run=0,walk=0,sec=0,rs=0,days=0,n=0; for(let k=mo+'-01'; k.slice(0,7)===mo&&k<=k0; k=addDays(k,1)){ if(k<first) continue; n++; const d=m[k]; if(d){ run+=d.run; walk+=d.walk; sec+=d.runSec+d.walkSec; rs+=d.runSec; if(d.run+d.walk>0) days++; } }
    ms.push({mo, run, walk, sec, rp:run>0?rs/run:null, days, n, part:mo===k0.slice(0,7)}); }
  ms.reverse();
  const row=r=>`<tr${r.part?' class="part"':''}><td>${monthLabel(r.mo)}${r.part?' (진행 중)':''}</td><td>${fmtKm(r.run,1)}</td><td>${fmtKm(r.walk,1)}</td><td>${fmtDurK(r.sec)}</td><td>${r.days}일</td><td class="${!r.part&&(r.run+r.walk)/r.n>=g?'hi':''}">${fmtKm((r.run+r.walk)/Math.max(1,r.n))}</td><td>${r.rp?fmtPace(r.rp):'–'}</td></tr>`;
  const th=`<table class="t"><thead><tr><th>달</th><th>달리기 km</th><th>걷기 km</th><th>시간</th><th>운동한 날</th><th>하루 평균</th><th>달리기 페이스</th></tr></thead><tbody>`;
  h+=`<h3>달마다</h3><div class="tw">`+th+ms.slice(0,12).map(row).join('')+`</tbody></table></div>`;
  if(ms.length>12) h+=`<details class="old"><summary>이전 ${ms.length-12}달 보기</summary><div class="tw">`+th+ms.slice(12).map(row).join('')+`</tbody></table></div></details>`;
  h+=`<p class="note">하루 평균은 그달의 날 수로 나눕니다(첫 달은 첫 기록부터, 이번 달은 오늘까지).</p>`;

  host.innerHTML=h+askBlock();
  host.querySelectorAll('[data-bm]').forEach(b=>b.onclick=()=>{ barMode=b.dataset.bm; lsSet('dalligi.barMode',barMode); renderFlow(); });
  bindAsk();
}

/* ═════════ 기록 ═════════ */
function renderList(){

  if(!all.length){ host.innerHTML=`<p class="empty">아직 적은 운동이 없습니다.</p>`; return; }
  let h='', cur='';
  all.forEach(a=>{ const mo=a.day.slice(0,7);
    if(mo!==cur){ cur=mo; const xs=all.filter(x=>x.day.slice(0,7)===mo);
      const r=xs.filter(x=>x.kind!=='walk').reduce((t,x)=>t+x.km,0), w=xs.filter(x=>x.kind==='walk').reduce((t,x)=>t+x.km,0);
      h+=`<div class="mhead">${monthLabel(mo)} · 달리기 ${fmtKm(r,1)}km${w?' · 걷기 '+fmtKm(w,1)+'km':''}</div>`; }

      <span class="k ${a.kind==='walk'?'walk':''}">${KIND[a.kind]}</span>
      <span class="m">${fmtKm(a.km)}km<small>${fmtDur(a.sec)}</small></span>
      <span class="p">${fmtPace(p)}${cn?' · '+esc(cn):''}${a.rpe?' · 힘 '+a.rpe:''}</span></button>`;
  });

}

/* ═════════ 한 번의 기록 ═════════ */
let oneId=null;
function splitSVG(sp,avgP){
  const W_=narrow()?360:640, H=narrow()?190:200, L=4, R=narrow()?62:66, T=22, B=28, w=W_-L-R, h=H-T-B, bw=w/sp.length;
  const ps=sp.map(s=>s.pace), slow=Math.max(...ps)+15, fast=Math.min(...ps)-15;
  const y=p=>T+h-(slow-p)/(slow-fast)*h;   /* 빠를수록 막대가 높다 */
  let s=`<svg viewBox="0 0 ${W_} ${H}" role="img" aria-label="구간 페이스"><line x1="${L}" x2="${L+w}" y1="${T+h}" y2="${T+h}" stroke="${C_LINE}"/>`;
  sp.forEach((x,i)=>{ const part=x.km<0.999, bx=L+i*bw+bw*0.16, bwid=bw*0.68, yy=y(x.pace);
    s+=`<rect x="${bx}" y="${yy}" width="${bwid}" height="${T+h-yy}" fill="${C_RUN}" opacity="${part?0.25:1}"><title>${part?fmtKm(x.km)+'km':x.n+'km'} · ${fmtPace(x.pace)}${x.elev!=null?' · 고도 '+x.elev+'m':''}</title></rect>`;
    if(sp.length<=16||i%2===0) s+=`<text x="${bx+bwid/2}" y="${yy-5}" font-size="${sp.length>10?10.5:12}" fill="${part?C_SOFT:C_RUN}" text-anchor="middle">${fmtPace(x.pace)}</text>`;
    s+=`<text x="${bx+bwid/2}" y="${H-8}" font-size="11.5" fill="${C_SOFT}" text-anchor="middle">${part?fmtKm(x.km):x.n}</text>`; });
  if(avgP){ const ay=y(avgP); s+=`<line x1="${L}" x2="${L+w}" y1="${ay}" y2="${ay}" stroke="${C_SEAL}" stroke-dasharray="4 4"/><text x="${L+w+6}" y="${ay+4}" font-size="11.5" fill="${C_SEAL}">평균 ${fmtPace(avgP)}</text>`; }
  return s+'</svg>';
}
function renderOne(){
  const a=ST.rows[oneId], host=$('vOne');
  if(!a||a.deleted){ host.innerHTML=`<p class="empty">이 기록은 지워졌습니다. <button class="linkish" onclick="go('list')">기록으로</button></p>`; return; }
  const p=paceOf(a), sp=speedOf(a), cell=(lab,val,unit,main)=>val==null||val===''||(typeof val==='number'&&!isFinite(val))?'':`<div${main?' class="main"':''}><b>${val}${unit?'<small>'+unit+'</small>':''}</b><span>${lab}</span></div>`;
  let h=`<div class="one-head"><div class="d">${kLabelY(a.day)} <span style="font-size:17px;color:var(--ink-soft)">${WD[parseKey(a.day).getDay()]}요일</span><span class="k ${a.kind==='walk'?'walk':''}">${KIND[a.kind]}</span></div>
    <div class="s">${a.start?a.start+(a.end?'–'+a.end:'')+' · ':''}${a.course?esc(nameOf(a.course))+' · ':''}${a.shoe?esc(nameOf(a.shoe))+' · ':''}${a.temp!=null?a.temp+'°C ':''}${esc(a.weather||'')}</div></div>
    <div class="nums">${cell('거리',fmtKm(a.km),'km',1)}${cell('평균 페이스',fmtPace(p),'/km',1)}${cell('러닝 시간',fmtDur(a.sec),'',1)}
    ${cell('시속',km1(sp),'km')}${cell('최고 페이스',a.best?fmtPace(a.best):null,'')}${cell('케이던스',a.cad,'spm')}
    ${cell('경과 시간',a.elapsed?fmtDur(a.elapsed):null,'')}${cell('고도',a.up!=null||a.down!=null?(a.up!=null?'+'+Math.abs(a.up):'')+(a.down!=null?' −'+Math.abs(a.down):''):null,'m')}${cell('칼로리',a.kcal,'kcal')}
    ${cell('평균 심박',a.hrA,'bpm')}${cell('최대 심박',a.hrM,'bpm')}${cell('힘든 정도',a.rpe?a.rpe+' <small>'+RPE_TXT[a.rpe]+'</small>':null,'')}</div>`;
  if(a.splits&&a.splits.length){
    h+=`<h3>구간</h3><div class="chart">${splitSVG(a.splits,p)}</div>`;
    const si=splitInfo(a.splits);
    if(si){ const d=si.diff, word=Math.abs(d)<3?'고르게 달렸습니다':'뒤로 갈수록 '+secDiff(d)+(d<0?' 빨라졌습니다':' 느려졌습니다');
      h+=`<p class="para">처음 ${Math.floor(si.n/2)}km는 평균 ${fmtPace(si.first)}, 마지막 ${Math.floor(si.n/2)}km는 ${fmtPace(si.last)}로 ${word}. 가장 빠른 구간은 ${si.fast.n}km(${fmtPace(si.fast.pace)}), 가장 느린 구간은 ${si.slow.n}km(${fmtPace(si.slow.pace)})로 ${secDiff(si.spread)} 차이입니다.</p>`;
      if(a.splits.some(s=>s.km<0.999)) h+=`<p class="note">1km에 못 미치는 마지막 구간은 옅게 그리고, 견줄 때는 뺐습니다.</p>`; }
  }
  /* 같은 코스 */
  if(a.course&&a.kind!=='walk'&&p){ const xs=acts().filter(x=>x.course===a.course&&x.kind!=='walk'&&x.sec>0);
    if(xs.length>1){ const sorted=xs.slice().sort((x,y)=>paceOf(x)-paceOf(y)), rank=sorted.findIndex(x=>x.id===a.id)+1, best=sorted[0];
      const before=xs.filter(x=>(x.day+(x.start||''))<(a.day+(a.start||''))).slice(-5), bp=before.length?before.reduce((t,x)=>t+x.sec,0)/before.reduce((t,x)=>t+x.km,0):null;
      h+=`<h3>${esc(nameOf(a.course))}에서</h3><p class="para">이 코스를 ${xs.length}번 달렸고, 이번이 ${rank===1?'가장 빨랐습니다':rank+'번째로 빨랐습니다'}.${rank!==1?' 가장 빠른 날은 '+kLabelY(best.day)+'('+fmtPace(paceOf(best))+')입니다.':''}${bp?' 바로 앞선 '+before.length+'번의 평균 '+fmtPace(bp)+'보다 '+(Math.abs(p-bp)<1?'같았습니다':secDiff(Math.abs(p-bp))+' '+(p<bp?'빨랐습니다':'느렸습니다'))+'.':''}</p>`; } }
  if(a.memo) h+=`<h3>메모</h3><div class="memo">${esc(a.memo)}</div>`;
  h+=`<div class="saverow"><button class="btn" onclick="editAct('${a.id}')">고치기</button><button class="btn warn" id="delOne">지우기</button><button class="btn" onclick="go('list')">기록으로</button></div>
    <p class="note" style="margin-top:14px">${esc(a.device||'')}${a.updatedAt?' · '+new Date(a.updatedAt).toLocaleString('ko-KR'):''}에 적음</p>`;
  host.innerHTML=h;
  $('delOne').onclick=()=>{ if(!confirm(kLabel(a.day)+' '+KIND[a.kind]+' '+fmtKm(a.km)+'km 기록을 지울까요?')) return; touch(Object.assign({},a,{deleted:true})); toast('지웠습니다'); go('list'); };
}
function openOne(id){ oneId=id; go('one'); }

/* ═════════ 몸무게 ═════════ */
function weights(){ return live('weight').filter(w=>w.kg>0&&/^\d{4}-\d{2}-\d{2}$/.test(w.date)).sort((a,b)=>a.date.localeCompare(b.date)); }
function wAvg(list,k){ const xs=list.filter(w=>w.date>addDays(k,-7)&&w.date<=k); return xs.length?xs.reduce((t,w)=>t+w.kg,0)/xs.length:null; }
function renderWeight(){
  const ws=weights(), k0=dayKey(), host=$('vWeight');
  let h=`<div class="wform"><div class="field"><label for="wDate">날짜</label><input id="wDate" type="date" value="${k0}"></div>
    <div class="field"><label for="wKg">몸무게 (kg)</label><input id="wKg" inputmode="decimal" placeholder="68.4"></div><button class="btn solid" id="wSave">적기</button></div>
    <p class="note">하루에 한 번만 남습니다. 같은 날 다시 적으면 바뀝니다.</p>`;
  if(ws.length){
    const now=wAvg(ws,k0), last=ws[ws.length-1], ago=wAvg(ws,addDays(k0,-30));
    h+=`<div class="top-num" style="margin-top:26px"><div class="lbl">최근 7일 평균</div><div class="big">${now!=null?now.toFixed(1)+'kg':'–'}<small>마지막 ${kLabel(last.date)} ${last.kg.toFixed(1)}kg</small></div>
      <div class="sub">${now!=null&&ago!=null?'30일 전 7일 평균 '+ago.toFixed(1)+'kg보다 '+(Math.abs(now-ago)<0.05?'같습니다':Math.abs(now-ago).toFixed(1)+'kg '+(now>ago?'늘었습니다':'줄었습니다')):'30일 넘게 쌓이면 한 달 전과 견줍니다'}</div></div>`;
    const from=addDays(k0,-179), xs=ws.filter(w=>w.date>=from);
    if(xs.length>=2){ const pts=xs.map((w,i)=>{ const d=parseKey(w.date); return {v:wAvg(ws,w.date), tip:kLabel(w.date)+' '+w.kg.toFixed(1)+'kg', lab:i===0||parseKey(xs[i-1].date).getMonth()!==d.getMonth()?(d.getMonth()+1)+'월':''}; });
      h+=`<h3>최근 180일</h3><div class="chart">${lineSVG(pts,{label:'몸무게 7일 평균', fmt:v=>v.toFixed(1)+'kg'})}</div><p class="note">잰 날마다 그날까지의 7일 평균을 잇습니다.</p>`; }
    h+=`<h3>적은 것</h3><ul class="wlist">`+ws.slice().reverse().slice(0,40).map(w=>`<li><span class="d">${kLabelY(w.date)}</span><span>${w.kg.toFixed(1)}kg</span><button data-wdel="${w.id}">지우기</button></li>`).join('')+`</ul>`;
  } else h+=`<p class="empty" style="margin-top:20px">아직 적은 몸무게가 없습니다.</p>`;
  host.innerHTML=h;
  $('wSave').onclick=()=>{ const d=$('wDate').value, kg=parseNum($('wKg').value);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ toast('날짜를 넣으세요'); return; }
    if(!(kg>20&&kg<300)){ toast('몸무게를 kg으로 넣으세요'); return; }
    touch(Object.assign({}, ST.rows['w'+d]||{}, {id:'w'+d, type:'weight', date:d, kg:Math.round(kg*10)/10, deleted:false})); toast(kLabel(d)+' '+kg.toFixed(1)+'kg'); renderWeight(); };
  host.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{ const r=ST.rows[b.dataset.wdel]; if(r&&confirm(kLabel(r.date)+' 몸무게를 지울까요?')){ touch(Object.assign({},r,{deleted:true})); renderWeight(); } });
}

/* ═════════ Claude에게 조언 구하기 ═════════
   '나에 대해'는 이 기기에만 둔다 */
const ME_KEY='dalligi.me';
const ME_DEF={birth:'', height:'', place:'', why:'몸과 머리를 맑게 하는 매일의 일과. 기록 경신보다 오래, 다치지 않고 계속 달리는 것이 중요하다.', aim:'', body:''};
function me(){ return Object.assign({}, ME_DEF, lsGet(ME_KEY,{})); }
let askWeeks=lsGet('dalligi.askWeeks',4);
function askBlock(){ return `<div class="ask"><h3>Claude에게 조언 구하기</h3>
  <p class="note">고른 기간의 기록을 조언을 부탁하는 글과 함께 복사합니다. Claude 대화에 붙여 넣으세요. 나이·목적 같은 것은 <button class="linkish" onclick="go('set')">설정</button>의 ‘나에 대해’에서 채웁니다.</p>
  <div class="btnrow"><select id="askW">${[4,8,12,26].map(n=>`<option value="${n}"${n===askWeeks?' selected':''}>최근 ${n}주</option>`).join('')}</select><button class="btn solid" id="askCopy">조언을 구하는 글 복사</button></div></div>`; }
function bindAsk(){ if(!$('askCopy')) return; $('askW').onchange=()=>{ askWeeks=+$('askW').value; lsSet('dalligi.askWeeks',askWeeks); }; $('askCopy').onclick=()=>copyText(advicePrompt(askWeeks),'조언을 구하는 글을 복사했습니다'); }
function advicePrompt(nw){
  const k0=dayKey(), from=addDays(k0,-7*nw+1), M=me(), age=/^\d{4}$/.test(M.birth)?(new Date().getFullYear()-(+M.birth))+'세':'(적지 않음)';
  const xs=acts().filter(a=>a.day>=from);
  const rows=xs.map(a=>[a.day, KIND[a.kind], fmtKm(a.km), fmtDur(a.sec), fmtPace(paceOf(a)), a.cad??'', a.up??'', a.hrA??'', a.rpe??'', nameOf(a.course), nameOf(a.shoe),
    (a.splits||[]).map(s=>(s.km<0.999?fmtKm(s.km)+'km:':'')+fmtPace(s.pace)).join(' '), (a.memo||'').replace(/\s+/g,' ').slice(0,80)].join(' | '));
  const wk=weekRows(nw).map(w=>`${w.ws}~${w.we}${w.part?'(진행 중)':''}: 달리기 ${fmtKm(w.run)}km, 걷기 ${fmtKm(w.walk)}km`);
  const wt=weights().filter(w=>w.date>=addDays(from,-7)), wl=[];
  for(let k=weekOf(from); k<=k0; k=addDays(k,7)){ const ys=wt.filter(w=>w.date>=k&&w.date<=addDays(k,6)); if(ys.length) wl.push(`${k} 주: ${(ys.reduce((t,w)=>t+w.kg,0)/ys.length).toFixed(1)}kg (${ys.length}번 잼)`); }
  const sh=shoes().filter(s=>!s.retired).map(s=>`${s.name}: ${Math.round(shoeKm(s))}km`);
  return `너는 오래 달려 온 사람들을 가르쳐 온 러닝 코치다. 아래는 내 달리기·걷기 기록이다. 기록을 읽고 조언해 달라.

## 나에 대해
- 나이: ${age}, 키: ${M.height?M.height+'cm':'(적지 않음)'}
- 주로 달리는 곳: ${M.place||'(적지 않음)'}
- 달리기의 목적: ${M.why||'(적지 않음)'}
- 지금의 목표: ${M.aim||'하루 평균 '+goal()+'km(달리기와 걷기를 합쳐)'}
- 요즘 몸 상태에서 알아 둘 것: ${M.body||'없음'}

## 기록 설명
- 기간: ${from}~${k0} (최근 ${nw}주)
- 각 줄은 한 번의 운동이다. 날짜는 새벽 4시 기준.
- 칸: 날짜 | 종류 | 거리km | 러닝시간 | 평균페이스(분'초"/km) | 케이던스(걸음/분) | 고도상승m | 평균심박 | 힘든정도(1 아주 쉬움~10 최대) | 코스 | 신발 | 구간페이스(1km마다, 짧은 마지막 구간은 거리 표시) | 메모
- 빈 칸은 재지 않은 것이지 0이 아니다.

## 부탁하는 것
1. 이 기간을 세 문장 안으로 요약해 달라. 거리·횟수·평균 페이스의 흐름을 숫자로.
2. 잘 되고 있는 것 두세 가지.
3. 걱정되는 신호가 있으면 짚어 달라. 예를 들어 주간 거리가 너무 빨리 늘었는지, 같은 페이스인데 힘든 정도가 올라갔는지, 구간 페이스가 뒤로 갈수록 크게 처지는지, 케이던스가 바뀌었는지, 쉬는 날이 너무 적은지, 신발이 많이 닳았는지.
4. 다음 2주를 어떻게 달리면 좋을지 구체적으로. 요일별로 거리와 대략의 페이스나 힘든 정도를 적어 달라.
5. 판단에 필요한데 기록에 없는 정보가 있으면 마지막에 물어봐 달라.

## 지켜 줄 것
- 기록에 있는 숫자에 근거해서 말하고, 추측은 추측이라고 밝혀라.
- 통증이나 몸의 이상이 의심되면 달리기 조언보다 진료를 먼저 권해라.
- 길게 늘어놓지 말고, 내가 내일 아침 바로 쓸 수 있게 써라.

${rows.length?rows.join('\n'):'(이 기간에는 기록이 없다)'}

${wk.join('\n')}

## 몸무게 (주 평균)
${wl.length?wl.join('\n'):'(재지 않음)'}

## 신발 누적 거리
${sh.length?sh.join('\n'):'(적지 않음)'}`;
}

/* ═════════ 설정 ═════════ */
function renderSet(){
  const M=me(), host=$('vSet');
  let h=`<h3>미래 프로젝트 연결</h3>
  <p class="note">시작·서가·미래가 쓰는 미래 프로젝트에 run_log 표를 두고 맥·아이폰·아이패드 사이에 맞춥니다. 주소와 키는 이 기기에만 남습니다.${autoNote?' '+esc(autoNote):''}</p>
  <div class="grid2" style="margin-top:8px"><div class="field w2"><label for="sUrl">주소</label><input id="sUrl" value="${esc(cfg.url)}" autocapitalize="off" spellcheck="false" placeholder="https://….supabase.co"></div>
  <div class="field w2"><label for="sKey">키</label><input id="sKey" value="${esc(cfg.key)}" autocapitalize="off" spellcheck="false" type="password"></div></div>
  <div class="btnrow"><button class="btn solid" id="sSave">저장하고 확인</button></div><div id="probe"></div>
  <p class="note" style="margin-top:14px">처음 한 번, Supabase의 SQL Editor에서 이것을 실행하세요.</p>
  <pre class="sql">${esc(RUN_SQL)}</pre><div class="btnrow"><button class="btn" id="sSql">SQL 복사</button></div>
  <p class="note">${acts().length}건의 운동, ${weights().length}번의 몸무게가 있고, ${Object.keys(ST.dirty).length?Object.keys(ST.dirty).length+'줄을 아직 올리지 못했습니다':'모두 올라가 있습니다'}.</p>

  <h3>기준선</h3>
  <p class="note">흐름 화면(그리고 나중에 시작의 운동 칸)에서 최근 30일 하루 평균을 견주는 선입니다. 달리기와 걷기를 합친 거리입니다.</p>
  <div class="btnrow"><div class="field" style="width:9em"><label for="sGoal">하루 평균 (km)</label><input id="sGoal" inputmode="decimal" value="${goal()}"></div><button class="btn" id="sGoalSave" style="align-self:flex-end">저장</button></div>

  <h3>코스</h3>
  <p class="note">코스를 고르면 거리가 비어 있을 때 채워지고, 같은 코스의 기록끼리 견줍니다.</p>
  <ul class="items">${courses().map(c=>`<li><span>${esc(c.name)}</span><span class="r">${c.km?fmtKm(c.km)+'km':''} · ${acts().filter(a=>a.course===c.id).length}번<button data-cdel="${c.id}">지우기</button></span></li>`).join('')||'<li class="gone">아직 없습니다</li>'}</ul>
  <div class="grid2" style="margin-top:10px"><div class="field"><label for="cName">이름</label><input id="cName" placeholder="호수 한 바퀴"></div><div class="field"><label for="cKm">거리 (km)</label><input id="cKm" inputmode="decimal"></div></div>
  <div class="btnrow"><button class="btn" id="cAdd">코스 더하기</button></div>

  <h3>신발</h3>
  <p class="note">신발마다 신은 거리를 쌓습니다. 바꿀 때까지 100km가 남으면 알립니다. 흔히 600–800km를 바꿀 때로 봅니다.</p>
  <ul class="items">${shoes().map(s=>{ const kmv=shoeKm(s), lim=+s.limit||SHOE_LIMIT; return `<li class="${s.retired?'gone':''}"><div style="flex:1">${esc(s.name)}${s.retired?' (그만 신음)':''}${s.retired?'':`<div class="shoebar${shoeNear(s)?' near':''}"><i style="width:${Math.min(100,kmv/lim*100)}%"></i></div>`}</div><span class="r">${Math.round(kmv)} / ${lim}km<button data-sret="${s.id}">${s.retired?'다시 신기':'그만 신기'}</button></span></li>`; }).join('')||'<li class="gone">아직 없습니다</li>'}</ul>
  <div class="grid2" style="margin-top:10px"><div class="field w2"><label for="shName">이름</label><input id="shName" placeholder="페가수스 41"></div>
  <div class="field"><label for="shStart">이 앱 전에 신은 거리 (km)</label><input id="shStart" inputmode="decimal" placeholder="0"></div><div class="field"><label for="shLim">바꿀 때 (km)</label><input id="shLim" inputmode="numeric" placeholder="${SHOE_LIMIT}"></div></div>
  <div class="btnrow"><button class="btn" id="shAdd">신발 더하기</button></div>

  <h3>나에 대해</h3>
  <p class="note">Claude에게 조언을 구하는 글에 들어갑니다. 이 기기에만 남고, Supabase에도 이 파일에도 올라가지 않습니다. 기기마다 따로 적어야 합니다.</p>
  <div class="grid2" style="margin-top:8px">
    <div class="field"><label for="mBirth">태어난 해</label><input id="mBirth" inputmode="numeric" placeholder="예 1980" value="${esc(M.birth)}"></div>
    <div class="field"><label for="mHeight">키 (cm)</label><input id="mHeight" inputmode="numeric" value="${esc(M.height)}"></div>
    <div class="field w2"><label for="mPlace">주로 달리는 곳</label><input id="mPlace" value="${esc(M.place)}"></div>
    <div class="field w2"><label for="mWhy">달리기의 목적</label><textarea id="mWhy">${esc(M.why)}</textarea></div>
    <div class="field w2"><label for="mAim">지금의 목표</label><input id="mAim" placeholder="비우면 하루 평균 기준선" value="${esc(M.aim)}"></div>
    <div class="field w2"><label for="mBody">요즘 몸 상태에서 알아 둘 것</label><textarea id="mBody">${esc(M.body)}</textarea></div>
  </div>
  <div class="btnrow"><button class="btn" id="mSave">저장</button></div>

  <h3>내보내기</h3>
  <div class="btnrow"><button class="btn" id="exCsv">운동 기록 CSV</button></div>`;
  host.innerHTML=h;
  $('sSave').onclick=async()=>{ cfg={url:$('sUrl').value.trim(), key:$('sKey').value.trim()}; lsSet(CFG_KEY,cfg); await probe(); };
  $('sSql').onclick=()=>copyText(RUN_SQL);
  $('sGoalSave').onclick=()=>{ const v=parseNum($('sGoal').value); if(!(v>0&&v<=100)){ toast('기준선을 km로 적으세요'); return; } const g=Math.round(v*10)/10;
    touch(Object.assign({}, ST.rows.conf||{}, {id:'conf', type:'conf', goal:g, deleted:false})); toast('기준선을 하루 '+g+'km로 두었습니다'); };
  $('cAdd').onclick=()=>{ const n=$('cName').value.trim(), k=parseNum($('cKm').value); if(!n){ toast('코스 이름을 적으세요'); return; }
    touch({id:newId('c'), type:'course', name:n, km:k>0?k:null, deleted:false}); toast('코스를 더했습니다'); renderSet(); };
  host.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{ const c=ST.rows[b.dataset.cdel]; if(c&&confirm(c.name+' 코스를 지울까요? 이 코스로 적은 기록은 남고 코스 이름만 빠집니다.')){ touch(Object.assign({},c,{deleted:true})); renderSet(); } });
  $('shAdd').onclick=()=>{ const n=$('shName').value.trim(); if(!n){ toast('신발 이름을 적으세요'); return; }
    touch({id:newId('s'), type:'shoe', name:n, startKm:parseNum($('shStart').value)||0, limit:parseNum($('shLim').value)||SHOE_LIMIT, retired:false, deleted:false}); toast('신발을 더했습니다'); renderSet(); };
  host.querySelectorAll('[data-sret]').forEach(b=>b.onclick=()=>{ const s=ST.rows[b.dataset.sret]; if(s){ touch(Object.assign({},s,{retired:!s.retired})); renderSet(); } });
  $('mSave').onclick=()=>{ const y=$('mBirth').value.trim(); if(y&&!/^\d{4}$/.test(y)){ toast('태어난 해를 네 자리로 적으세요'); return; }
    lsSet(ME_KEY,{birth:y, height:$('mHeight').value.trim(), place:$('mPlace').value.trim(), why:$('mWhy').value.trim(), aim:$('mAim').value.trim(), body:$('mBody').value.trim()}); toast('이 기기에 저장했습니다'); };
  $('exCsv').onclick=exportCsv;
}
async function probe(){
  const p=$('probe'); p.textContent='확인하는 중…';
  if(!sbOn()){ p.textContent='· 주소와 키가 비어 있습니다'; return; }
  try{ await rest('run_log?select=id&limit=1'); p.textContent='✓ run_log 표를 읽을 수 있습니다'; ST.since=''; await pull(); push(); render(); }
  catch(e){ p.textContent='✕ '+(missingTable(e)?'run_log 표가 없습니다. 위의 SQL을 실행한 뒤 다시 누르세요':e.message); }
}
function exportCsv(){
  const q=v=>{ v=v==null?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const head=['날짜','하루','종류','시작','끝','거리km','러닝시간','경과시간','평균페이스','최고페이스','케이던스','칼로리','고도상승','고도하강','평균심박','최대심박','힘든정도','코스','신발','기온','날씨','구간','메모'];
  const rows=acts().map(a=>[a.date,a.day,KIND[a.kind],a.start,a.end,a.km,fmtDur(a.sec),a.elapsed?fmtDur(a.elapsed):'',fmtPace(paceOf(a)),a.best?fmtPace(a.best):'',a.cad,a.kcal,a.up,a.down,a.hrA,a.hrM,a.rpe,nameOf(a.course),nameOf(a.shoe),a.temp,a.weather,splitsText(a.splits).replace(/\n/g,' / '),a.memo].map(q).join(','));
  const b=new Blob(['\ufeff'+head.join(',')+'\n'+rows.join('\n')],{type:'text/csv'}), el=document.createElement('a');
  el.href=URL.createObjectURL(b); el.download='달리기_'+dayKey()+'.csv'; el.click(); setTimeout(()=>URL.revokeObjectURL(el.href),2000);
}

/* ═════════ 오가기 ═════════ */
const VIEWS=['write','flow','list','one','weight','set'];
let view='write';
function go(v){
  if(!VIEWS.includes(v)) v='write';
  if(view==='write'&&v!=='write'&&$('fDate')) readForm();
  view=v;
  document.querySelectorAll('section[data-v]').forEach(s=>s.classList.toggle('on',s.dataset.v===v));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===(v==='one'?'list':v)));
  const hash=v==='one'?'#one/'+oneId:'#'+v; if(location.hash!==hash){ try{ history.replaceState(null,'',hash); }catch(e){} }   /* 미리보기 창처럼 주소를 바꿀 수 없는 곳에서도 화면은 그린다 */
  render(); window.scrollTo(0,0);
}
function render(){
  if(view==='write'){ if($('fDate')&&document.activeElement&&$('vWrite').contains(document.activeElement)) return; renderWrite(); }
  else if(view==='flow') renderFlow();
  else if(view==='list') renderList();
  else if(view==='one') renderOne();
  else if(view==='weight') renderWeight();
  else if(view==='set'){ if(!$('vSet').contains(document.activeElement)) renderSet(); }
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));
let lastPull=0;
async function refresh(force){
  if(!force&&Date.now()-lastPull<1500) return; lastPull=Date.now();
  const ch=await pull(); push(); if(ch) render();
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) refresh(); });
window.addEventListener('focus',()=>refresh());
window.addEventListener('pageshow',e=>{ if(e.persisted) refresh(); });
setInterval(()=>{ if(!document.hidden) refresh(); },120000);
window.addEventListener('resize',()=>{ clearTimeout(window._rz); window._rz=setTimeout(()=>{ if(view==='flow'||view==='one'||view==='weight') render(); },200); });

(function start(){
  const m=location.hash.match(/^#(\w+)(?:\/(.+))?$/);
  if(m&&m[1]==='one'&&m[2]&&ST.rows[m[2]]){ oneId=m[2]; go('one'); }
  else go(m&&VIEWS.includes(m[1])&&m[1]!=='one'?m[1]:'write');
  if(sbOn()) refresh(true); else setDot('sync','err','미래 프로젝트 연결이 비어 있습니다 · 설정에서 넣으세요');
})();
</script>
