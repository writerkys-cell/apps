<style>
:root{
  --paper:#f2ede1; --paper-2:#e8e0cf; --ink:#23201c; --ink-soft:#736a59; --faint:#a39a88; --line:#d6ccb6;
  --seal:#9b3b32; --seal-faint:#efd9d2;
  --serif:'Gowun Batang',AppleMyungjo,"Apple SD Gothic Neo",Batang,serif;
  --lh:32px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
main{max-width:640px;margin:0 auto;padding:18px 20px 90px}

.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.head h1{margin:0;font-size:19px;letter-spacing:.3em;font-weight:700}
.head .r{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-soft)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.dot.ok{background:#6f8a5c}.dot.busy{background:#b8904a}.dot.err{background:var(--seal)}

/* 적는 자리 — 줄 친 종이 */
.pad{border-top:1px solid var(--ink);padding-top:2px}
#in{display:block;width:100%;min-height:calc(var(--lh)*4);resize:none;border:none;outline:none;padding:0 2px;margin:0;
  font-size:17px;line-height:var(--lh);background-color:transparent;
  background-image:linear-gradient(transparent calc(var(--lh) - 1px), var(--line) calc(var(--lh) - 1px));
  background-size:100% var(--lh);background-attachment:local;overflow:hidden}
#in::placeholder{color:var(--faint)}
.pad-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}
.pad-foot .hint{font-size:13px;color:var(--faint)}
#add{border:1.5px solid var(--seal);color:var(--seal);padding:6px 22px;font-size:16px;letter-spacing:.2em;border-radius:2px}
#add:disabled{border-color:var(--line);color:var(--faint);cursor:default}
#add:not(:disabled):active{background:var(--seal);color:var(--paper)}

.warn{margin:18px 0 0;padding:10px 12px;border-left:3px solid var(--seal);background:var(--seal-faint);font-size:14px}
.warn button{border-bottom:1px solid currentColor}

/* 목록 */
.count{margin:34px 0 4px;font-size:14px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:12px}
.count button{border-bottom:1px solid var(--line)}
.dayh{margin:22px 0 2px;font-size:14px;color:var(--ink-soft);letter-spacing:.08em}
ul.notes{list-style:none;margin:0;padding:0}
.note{border-top:1px solid var(--line);padding:12px 2px 12px}
.note .txt{white-space:pre-wrap;word-break:break-word;font-size:16px;cursor:pointer}
.note .meta{font-size:13px;color:var(--faint);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.note .meta .to{color:var(--ink-soft)}
.note .acts{display:none;gap:18px;margin-top:8px;font-size:14px}
.note.sel .acts{display:flex}
.note .acts button{color:var(--ink-soft);border-bottom:1px solid var(--line)}
.note .acts button.del{color:var(--seal);border-bottom-color:var(--seal-faint)}
.note .acts button.del.sure{background:var(--seal);color:var(--paper);padding:0 6px;border:none}
.note.done .txt{color:var(--ink-soft)}
.note textarea{display:block;width:100%;border:1px solid var(--line);background:rgba(255,255,255,.35);padding:6px 8px;font-size:17px;line-height:1.6;resize:vertical;min-height:5em;border-radius:2px}
.empty{margin:14px 0;color:var(--faint);font-size:14px}

/* 연결 */
details.conn{margin-top:46px;border-top:1px solid var(--line);padding-top:12px;font-size:14px;color:var(--ink-soft)}
details.conn summary{cursor:pointer;list-style:none}
details.conn summary::-webkit-details-marker{display:none}
details.conn label{display:block;margin-top:12px}
details.conn input{display:block;width:100%;margin-top:4px;padding:7px 8px;border:1px solid var(--line);background:rgba(255,255,255,.35);font-size:16px;border-radius:2px;color:var(--ink)}
details.conn .row{display:flex;gap:16px;align-items:center;margin-top:14px;flex-wrap:wrap}
details.conn .row button{border:1px solid var(--ink-soft);padding:4px 14px;border-radius:2px;color:var(--ink)}
details.conn pre{white-space:pre-wrap;word-break:break-all;background:var(--paper-2);padding:10px;font-size:12px;line-height:1.5;margin:8px 0 0}
details.conn p{margin:10px 0 0}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--ink);color:var(--paper);padding:8px 16px;font-size:14px;border-radius:2px;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main>
  <div class="head">
    <h1>적바림</h1>
    <div class="r"><span id="today"></span><span class="dot" id="dot" title=""></span></div>
  </div>

  <div class="pad">
    <textarea id="in" rows="4" placeholder="떠오른 것을 적습니다" autocomplete="off" autocapitalize="off"></textarea>
    <div class="pad-foot">
      <span class="hint" id="hint"></span>
      <button id="add" disabled>적기</button>
    </div>
  </div>

  <div id="warn"></div>

  <div class="count"><span id="cnt"></span><button id="showDone">처리한 것 보기</button></div>
  <div id="list"></div>
  <div id="doneWrap" hidden>
    <div class="dayh">처리한 것 · 최근 50개</div>
    <ul class="notes" id="doneList"></ul>
  </div>

  <details class="conn" id="conn">
    <summary>연결 설정</summary>
    <p>시작과 같은 Supabase(미래 프로젝트)의 주소와 키를 넣습니다. 홈 화면에 둔 앱은 사파리와 저장 공간이 따로라서 한 번은 직접 넣어야 합니다.</p>
    <label>주소<input id="cUrl" placeholder="https://….supabase.co" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label>키 (anon)<input id="cKey" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="row"><button id="cSave">저장하고 확인</button><span id="cMsg"></span></div>
    <p>표가 없으면 Supabase의 SQL 편집기에서 아래를 한 번 실행합니다.</p>
    <pre id="sql"></pre>
    <div class="row"><button id="cCopy">SQL 복사</button></div>
  </details>
</main>
<div id="toast"></div>

<script>
"use strict";
/* ═════════ 적바림 ═════════
   떠오른 생각을 빠르게 적는 곳. 미래 프로젝트의 memo_notes 표에 한 메모 한 줄로 올린다.
   시작(sijak.html)의 메모 탭이 같은 표를 읽고, 아이폰 단축어도 같은 표에 곧장 올린다.
   data: { id, text, createdAt, updatedAt, device, state:'open'|'done', doneAt?, to?, deleted? }
   하루는 새벽 4시에 바뀐다(날짜 묶음만 그렇고, 적은 시각은 그대로 둔다). */

const DAY_H=4;
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD=['일','월','화','수','목','금','토'];
function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayKey(t){ return keyOf(new Date((t==null?Date.now():t)-DAY_H*3600000)); }
function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function lsGet(k,fb){ try{ const v=localStorage.getItem(k); return v==null?fb:JSON.parse(v); }catch(e){ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
let toastT; function toast(m){ const el=$('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2400); }
function myDevice(){
  const s=lsGet('sijak.device',''); if(s) return s;
  const u=navigator.userAgent;
  if(/iPhone/.test(u)) return '아이폰';
  if(/iPad/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)) return '아이패드';
  if(/Macintosh/.test(u)) return '맥북';
  return '이 기기';
}
const isTouch=/iPhone|iPad|Android/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);

/* ─────────── 연결 ─────────── */
const CFG_KEY='jeokbarim.cfg';
let cfg=Object.assign({url:'',key:''},lsGet(CFG_KEY,{}));
(function borrow(){
  if(cfg.url&&cfg.key) return;
  const sj=lsGet('sijak.cfg',null);
  if(sj&&sj.mr&&sj.mr.url&&sj.mr.key){ cfg={url:sj.mr.url,key:sj.mr.key}; }
  else{
    const s=lsGet('seoga.sb',null);
    if(s&&s.url&&s.key) cfg={url:s.url,key:s.key};
    else{ try{ const u=localStorage.getItem('mirae.url')||'', k=localStorage.getItem('mirae.key')||''; if(u&&k) cfg={url:u,key:k}; }catch(e){} }
  }
  if(cfg.url&&cfg.key) lsSet(CFG_KEY,cfg);
})();
const on=()=>!!(cfg.url&&cfg.key);

async function rest(path,opt){
  opt=opt||{};
  const r=await fetch(cfg.url.replace(/\/+$/,'')+'/rest/v1/'+path,{
    method:opt.method||'GET', body:opt.body,
    headers:Object.assign({apikey:cfg.key, Authorization:'Bearer '+cfg.key, 'Content-Type':'application/json'},opt.headers||{})
  });
  const t=await r.text();
  if(!r.ok){ let m=t; try{ const j=JSON.parse(t); m=j.message||j.hint||t; }catch(e){} const er=new Error(m||('HTTP '+r.status)); er.status=r.status; throw er; }
  return t?JSON.parse(t):null;
}
const enc=encodeURIComponent;
function missingTable(e){ return e&&(e.status===404||/does not exist|schema cache|Could not find the table/i.test(e.message||'')); }

const SQL=`create table if not exists memo_notes (id text primary key, data jsonb not null, updated_at timestamptz not null default now());
alter table memo_notes enable row level security;
drop policy if exists "memo open" on memo_notes;
create policy "memo open" on memo_notes for all using (true) with check (true);`;

/* ─────────── 이 기기의 사본과 동기화 ─────────── */
const LS='jeokbarim';
let S=Object.assign({notes:{},dirty:{},since:''},lsGet(LS,{}));
if(!S.notes) S.notes={}; if(!S.dirty) S.dirty={};
let tableMissing=false, pushT=null, pushing=false, lastErr='';
function persist(){ lsSet(LS,S); }
function setDot(state,msg){ const d=$('dot'); d.className='dot '+(state||''); d.title=msg||''; }
function live(){ return Object.values(S.notes).filter(n=>n&&n.id&&!n.deleted&&String(n.text||'').trim()); }

function touch(n){
  n.updatedAt=new Date().toISOString(); n.device=n.device||myDevice();
  S.notes[n.id]=n; S.dirty[n.id]=1; persist();
  clearTimeout(pushT); pushT=setTimeout(push,600);
}
async function push(){
  if(!on()||pushing) return;
  const ids=Object.keys(S.dirty); if(!ids.length) return;
  pushing=true; setDot('busy','올리는 중');
  try{
    for(let i=0;i<ids.length;i+=100){
      const part=ids.slice(i,i+100), sent={};
      part.forEach(id=>sent[id]=S.notes[id].updatedAt);
      await rest('memo_notes',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
        body:JSON.stringify(part.map(id=>({id,data:S.notes[id],updated_at:S.notes[id].updatedAt||new Date().toISOString()})))});
      part.forEach(id=>{ if(S.notes[id]&&S.notes[id].updatedAt===sent[id]) delete S.dirty[id]; });
      persist();
    }
    tableMissing=false; lastErr=''; setDot('ok','');
  }catch(er){
    tableMissing=missingTable(er); lastErr=er.message||'';
    setDot('err',tableMissing?'Supabase에 memo_notes 표가 없습니다':'올리지 못했습니다 · '+lastErr);
  }
  pushing=false; renderWarn();
  if(Object.keys(S.dirty).length&&!tableMissing){ clearTimeout(pushT); pushT=setTimeout(push,15000); }
}
/* 더 나중에 고친 쪽이 이긴다. 이 기기에서 아직 못 올린 메모는 덮지 않는다. */
async function pull(){
  if(!on()){ renderWarn(); return; }
  setDot('busy','받는 중');
  try{
    let q='memo_notes?select=id,data,updated_at&order=updated_at.asc';
    if(S.since) q+='&updated_at=gte.'+enc(new Date(Date.parse(S.since)-10*60000).toISOString());
    let off=0,max=S.since||'',changed=false;
    for(;;){
      const rows=await rest(q+'&limit=500&offset='+off);
      (rows||[]).forEach(r=>{
        if(r.updated_at>max) max=r.updated_at;
        const rem=r.data; if(!rem||!rem.id||S.dirty[r.id]) return;
        /* 단축어로 올린 것은 시각이 '+09:00' 꼴이거나 없을 수 있다 — 글자 비교가 맞도록 Z 꼴로 고른다 */
        const iso=v=>{ const t=Date.parse(v); return isNaN(t)?'':new Date(t).toISOString(); };
        rem.updatedAt=iso(rem.updatedAt)||iso(r.updated_at);
        rem.createdAt=iso(rem.createdAt)||rem.updatedAt;
        const loc=S.notes[r.id];
        if(!loc||(rem.updatedAt||'')>(loc.updatedAt||'')){ S.notes[r.id]=rem; changed=true; }
      });
      if(!rows||rows.length<500) break; off+=500;
    }
    S.since=max; persist(); tableMissing=false; lastErr='';
    if(Object.keys(S.dirty).length) push(); else setDot('ok','');
    if(changed&&!editId) render();
  }catch(er){
    tableMissing=missingTable(er); lastErr=er.message||'';
    setDot('err',tableMissing?'Supabase에 memo_notes 표가 없습니다':'받지 못했습니다 · '+lastErr);
  }
  renderWarn();
}

/* ─────────── 화면 ─────────── */
function fmtTime(iso){
  const d=new Date(iso); if(isNaN(d)) return '';
  const h=d.getHours(), m=d.getMinutes();
  return (h<12?'오전 ':'오후 ')+((h%12)||12)+':'+pad(m);
}
function dayLabel(k){
  const t=dayKey();
  if(k===t) return '오늘';
  const y=keyOf(new Date(parseKey(t).getTime()-86400000));
  if(k===y) return '어제';
  const d=parseKey(k), now=parseKey(t);
  return (d.getFullYear()!==now.getFullYear()?d.getFullYear()+'년 ':'')+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')';
}
const TO={todo:'할 일로 옮김',cal:'일정으로 옮김',write:'글로 옮김'};
let selId='', editId='', sureId='';
function noteHTML(n){
  const done=n.state==='done';
  const meta=[fmtTime(n.createdAt), n.device?esc(n.device):''].filter(Boolean).map(s=>'<span>'+s+'</span>').join('')
    +(n.to&&TO[n.to]?'<span class="to">'+TO[n.to]+'</span>':'');
  const body= editId===n.id
    ? '<textarea data-edit="'+esc(n.id)+'">'+esc(n.text)+'</textarea>'
    : '<div class="txt" data-sel="'+esc(n.id)+'">'+esc(n.text)+'</div>';
  const acts= editId===n.id
    ? '<button data-act="save">고치기 끝</button><button data-act="cancel">그만두기</button>'
    : (done?'<button data-act="open">되살리기</button>':'<button data-act="done">처리함</button><button data-act="edit">고치기</button>')
      +'<button data-act="copy">복사</button>'
      +'<button data-act="del" class="del'+(sureId===n.id?' sure':'')+'">'+(sureId===n.id?'한 번 더 누르면 지웁니다':'지우기')+'</button>';
  return '<li class="note'+(done?' done':'')+((selId===n.id||editId===n.id)?' sel':'')+'" data-id="'+esc(n.id)+'">'
    +body+'<div class="meta">'+meta+'</div><div class="acts">'+acts+'</div></li>';
}
function render(){
  const t=new Date(Date.now()-DAY_H*3600000);
  $('today').textContent=(t.getMonth()+1)+'월 '+t.getDate()+'일 ('+WD[t.getDay()]+')';
  const all=live();
  const open=all.filter(n=>n.state!=='done').sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const done=all.filter(n=>n.state==='done').sort((a,b)=>(b.doneAt||b.updatedAt||'').localeCompare(a.doneAt||a.updatedAt||'')).slice(0,50);
  $('cnt').textContent= open.length?'열린 메모 '+open.length+'개':'열린 메모가 없습니다';
  let html='', cur='';
  open.forEach(n=>{
    const k=dayKey(Date.parse(n.createdAt)||Date.now());
    if(k!==cur){ if(cur) html+='</ul>'; html+='<div class="dayh">'+dayLabel(k)+'</div><ul class="notes">'; cur=k; }
    html+=noteHTML(n);
  });
  if(cur) html+='</ul>';
  $('list').innerHTML= html || '<p class="empty">적은 것은 여기에 날짜별로 쌓이고, 맥북의 시작에서 처리합니다.</p>';
  $('doneList').innerHTML= done.map(noteHTML).join('') || '<li class="empty">아직 처리한 메모가 없습니다.</li>';
  const ta=document.querySelector('textarea[data-edit]');
  if(ta&&document.activeElement!==ta){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); }
}
function renderWarn(){
  const w=$('warn');
  const nDirty=Object.keys(S.dirty).length;
  let m='';
  if(!on()) m='아직 연결되지 않았습니다. 적은 것은 이 기기에만 남습니다. <button data-go="conn">연결 설정 열기</button>';
  else if(tableMissing) m='Supabase에 memo_notes 표가 없습니다. 연결 설정의 SQL을 한 번 실행하세요. <button data-go="conn">열기</button>';
  else if(nDirty&&lastErr) m='아직 올리지 못한 메모 '+nDirty+'개가 이 기기에 있습니다. 연결되면 올립니다.';
  w.innerHTML= m?'<p class="warn">'+m+'</p>':'';
}

/* ─────────── 적기 ─────────── */
const inp=$('in');
function grow(){ inp.style.height='auto'; const lh=parseFloat(getComputedStyle(inp).lineHeight)||32; inp.style.height=Math.max(lh*4,Math.ceil(inp.scrollHeight/lh)*lh)+'px'; }
inp.addEventListener('input',()=>{ $('add').disabled=!inp.value.trim(); grow(); lsSet('jeokbarim.draft',inp.value); });
inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); add(); } });
$('add').onclick=add;
function newId(){ return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function add(){
  const text=inp.value.replace(/\s+$/,'');
  if(!text.trim()) return;
  const now=new Date().toISOString();
  touch({id:newId(),text,createdAt:now,state:'open',device:myDevice()});
  inp.value=''; lsSet('jeokbarim.draft',''); $('add').disabled=true; grow();
  render(); toast('적었습니다'); inp.focus();
}

/* ─────────── 목록 다루기 ─────────── */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){ $('conn').open=true; $('conn').scrollIntoView({behavior:'smooth'}); return; }
  const sel=e.target.closest('[data-sel]');
  if(sel){ const id=sel.dataset.sel; selId= selId===id?'':id; sureId=''; render(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const li=b.closest('.note'); const n=li&&S.notes[li.dataset.id]; if(!n) return;
  const a=b.dataset.act;
  if(a!=='del') sureId='';
  if(a==='done'){ n.state='done'; n.doneAt=new Date().toISOString(); touch(n); selId=''; toast('처리함으로 접었습니다'); }
  else if(a==='open'){ n.state='open'; delete n.doneAt; touch(n); selId=''; toast('되살렸습니다'); }
  else if(a==='edit'){ editId=n.id; }
  else if(a==='cancel'){ editId=''; }
  else if(a==='save'){
    const ta=li.querySelector('textarea'); const v=ta?ta.value.replace(/\s+$/,''):'';
    if(v.trim()&&v!==n.text){ n.text=v; touch(n); toast('고쳤습니다'); }
    editId='';
  }
  else if(a==='copy'){
    (navigator.clipboard?navigator.clipboard.writeText(n.text):Promise.reject()).then(()=>toast('복사했습니다'),()=>toast('복사하지 못했습니다'));
    return;
  }
  else if(a==='del'){
    if(sureId!==n.id){ sureId=n.id; }
    else{ n.deleted=true; touch(n); sureId=''; selId=''; toast('지웠습니다'); }
  }
  render();
});
$('showDone').onclick=()=>{ const w=$('doneWrap'); w.hidden=!w.hidden; $('showDone').textContent=w.hidden?'처리한 것 보기':'처리한 것 접기'; };

/* ─────────── 연결 설정 ─────────── */
$('sql').textContent=SQL;
$('cUrl').value=cfg.url; $('cKey').value=cfg.key;
if(!on()) $('conn').open=true;
$('cSave').onclick=async()=>{
  cfg={url:$('cUrl').value.trim(),key:$('cKey').value.trim()}; lsSet(CFG_KEY,cfg);
  const m=$('cMsg');
  if(!on()){ m.textContent='주소와 키를 모두 넣으세요.'; renderWarn(); return; }
  m.textContent='확인하는 중…';
  try{ await rest('memo_notes?select=id&limit=1'); tableMissing=false; m.textContent='연결됐습니다.'; S.since=''; await pull(); push(); }
  catch(er){ tableMissing=missingTable(er); m.textContent= tableMissing?'연결은 됐지만 memo_notes 표가 없습니다. 아래 SQL을 실행하세요.':'연결하지 못했습니다 · '+er.message; }
  renderWarn();
};
$('cCopy').onclick=()=>{ (navigator.clipboard?navigator.clipboard.writeText(SQL):Promise.reject()).then(()=>toast('SQL을 복사했습니다'),()=>toast('복사하지 못했습니다')); };

/* ─────────── 시작 ─────────── */
$('hint').textContent= isTouch?'':'⌘ + Enter로도 적습니다';
inp.value=lsGet('jeokbarim.draft','')||''; $('add').disabled=!inp.value.trim();
render(); renderWarn(); grow();
pull(); push();
let lastBack=0;
function back(){ if(Date.now()-lastBack<1500) return; lastBack=Date.now(); if(!editId) render(); pull(); push(); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) back(); });
window.addEventListener('focus',back);
window.addEventListener('pageshow',e=>{ if(e.persisted) back(); });
window.addEventListener('online',()=>push());
setInterval(()=>{ if(!document.hidden) pull(); },120000);
</script>
</body>
</html>
