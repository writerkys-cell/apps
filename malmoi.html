<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>말모이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9E8E1;
  --paper-2:#F1F0EA;
  --ink:#17191B;
  --ink-2:#5F625E;
  --ink-3:#8E918B;
  --hair:#CBCAC1;
  --mark:#2F5D53;
  --mark-rgb:47,93,83;
  --amber:#8A6A2F;
  --danger:#8C3B32;
  --serif:'Gowun Batang','Apple SD Gothic Neo','Nanum Myeongjo',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#15171A; --paper-2:#1C1F22; --ink:#E7E6DF; --ink-2:#A0A39D;
    --ink-3:#71746F; --hair:#33373B; --mark:#7FB3A4; --mark-rgb:127,179,164; --amber:#C9A15C; --danger:#D08078;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--serif);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; min-height:100vh;
}
button,input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
button{cursor:pointer}
::selection{background:var(--mark);color:var(--paper)}
:focus-visible{outline:1.5px solid var(--mark);outline-offset:3px}
input:focus-visible,textarea:focus-visible{outline:none}
.catchline:focus-within,.searchrow:focus-within,.dayline:focus-within{border-bottom-color:var(--mark)}
.card input.wt:focus{border-bottom-color:var(--mark)}

/* ── 머리 ── */
header{
  display:flex;align-items:baseline;gap:28px;
  padding:26px 40px 0; max-width:820px; width:100%; margin:0 auto;
}
.brand{font-size:15px;letter-spacing:.34em;font-weight:700}
nav{display:flex;gap:20px;margin-left:auto}
nav button{
  font-family:var(--sans);font-size:12px;letter-spacing:.14em;color:var(--ink-3);
  padding-bottom:4px;border-bottom:1.5px solid transparent;transition:color .2s;
}
nav button:hover{color:var(--ink-2)}
nav button.on{color:var(--ink);border-bottom-color:var(--mark)}
nav button .k{opacity:.45;margin-left:5px;font-size:10px}

main{
  flex:1; max-width:820px; width:100%; margin:0 auto; padding:0 40px 80px;
}
.view{display:none;animation:in .35s ease both}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ── 채집 ── */
.catchline{position:relative;margin:52px 0 0;border-bottom:1px solid var(--ink)}
.catchline input{
  width:100%;font-size:30px;line-height:1.5;padding:0 0 12px;
}
.catchline input::placeholder{color:var(--ink-3)}
.hint{
  font-family:var(--sans);font-size:11px;letter-spacing:.05em;color:var(--ink-3);
  margin-top:10px;display:flex;justify-content:space-between;
}
.hint b{font-weight:400;color:var(--mark)}

.today{margin-top:44px}
.daylabel{
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-3);
  display:flex;align-items:center;gap:12px;margin-bottom:14px;
}
.daylabel::after{content:'';flex:1;height:1px;background:var(--hair)}
.daylabel .n{color:var(--ink-3)}

.specimens{display:flex;flex-direction:column}
.sp{
  display:flex;align-items:baseline;gap:14px;padding:9px 4px 9px 0;
  border-bottom:1px solid transparent;text-align:left;width:100%;
  transition:border-color .18s,padding-left .18s;
}
.sp:hover{border-bottom-color:var(--hair);padding-left:6px}
.sp .no{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);min-width:44px;letter-spacing:.04em}
.sp .w{font-size:19px;flex:1}
.sp.used .w{color:var(--ink-2)}
.sp.used .w::after{content:'';display:block;height:1px;background:var(--ink-3);margin-top:-11px;opacity:.55}
.sp .memo{font-size:13px;color:var(--ink-3);flex:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp .flag{font-family:var(--mono);font-size:10px;color:var(--amber);letter-spacing:.06em}
.sp .tm{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.03em;
  min-width:38px;text-align:right}
.sp.grp .cnt{font-family:var(--mono);font-size:11px;color:var(--mark);min-width:44px;letter-spacing:.04em}
.sp.grp.open{border-bottom-color:var(--hair)}
.sp.grp .caret{font-family:var(--mono);font-size:10px;color:var(--ink-3);width:12px;text-align:center}
.insts{margin:2px 0 14px;padding-left:18px;border-left:1px solid var(--hair)}
.sp.inst{padding-top:6px;padding-bottom:6px}
.sp.inst .idate{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--ink-2);flex:1}
.sp.inst .idate i{font-style:normal;color:var(--ink-3);margin-left:6px}
.sp.inst .gap{color:var(--mark)}
.cycle{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.sp.line{display:block;padding:11px 4px 13px 0}
.sp.line .lmeta{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.sp.line .lmeta .tm{margin-left:auto}
.sp.line .w{display:block;font-size:16.5px;line-height:1.78}
.sp.line.used .w{text-decoration:line-through;text-decoration-color:var(--ink-3);opacity:.72}
.sp.line.used .w::after{display:none}
.sp.line .lnote{display:block;font-size:13px;color:var(--ink-3);margin-top:6px}
.sp .rep{font-family:var(--mono);font-size:10px;color:var(--mark)}
.new{animation:pop .5s ease both}
@keyframes pop{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}

.empty{color:var(--ink-3);font-size:14.5px;padding:14px 0}

.diary{margin-top:56px}
.diary textarea,#dayNote textarea{
  width:100%;min-height:120px;resize:vertical;font-size:16px;line-height:1.9;
  padding:14px 0 10px;border-bottom:1px solid var(--hair);
}
.diary textarea:focus,#dayNote textarea:focus,.card textarea:focus{border-bottom-color:var(--mark)}
.diary textarea::placeholder,#dayNote textarea::placeholder{color:var(--ink-3)}
#dayNote{margin-top:46px}

/* ── 서랍 ── */
.calhead{display:flex;align-items:center;gap:10px;margin:44px 0 18px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3)}
.calhead .m{font-family:var(--serif);font-size:19px;letter-spacing:.05em;color:var(--ink);
  min-width:104px;text-align:center}
.calhead .arw{font-size:15px;color:var(--ink-3);padding:0 6px;line-height:1}
.calhead .arw:hover{color:var(--mark)}
.calhead .jump{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);
  border:1px solid var(--hair);border-radius:999px;padding:3px 11px;margin-left:6px}
.calhead .jump:hover{color:var(--mark);border-color:var(--mark)}
.calhead .tot{margin-left:auto}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calgrid .wd{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);
  text-align:center;padding-bottom:7px}
.cell{position:relative;aspect-ratio:1/.8;border:1px solid transparent;
  padding:5px 6px;text-align:left;transition:.15s}
.cell .dn{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.cell .dc{position:absolute;right:6px;bottom:4px;font-family:var(--mono);font-size:10px;color:var(--ink-2)}
.cell.l0{border-color:var(--hair);opacity:.5}
.cell.l1{background:rgba(var(--mark-rgb),.10)}
.cell.l2{background:rgba(var(--mark-rgb),.22)}
.cell.l3{background:rgba(var(--mark-rgb),.38)}
.cell.l1 .dn,.cell.l2 .dn,.cell.l3 .dn{color:var(--ink-2)}
.cell:hover{border-color:var(--ink-3)}
.cell.now .dn{color:var(--mark);font-weight:700}
.cell.sel{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cell.hit{box-shadow:inset 0 0 0 1.5px var(--mark)}
.resline{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);margin-bottom:20px}
#panel{min-height:100px}
#dayHead{margin-top:6px}
#panel .dtitle,#dayHead .dtitle{font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  color:var(--ink-2);display:flex;align-items:center;gap:12px;margin-bottom:10px}
#panel .dtitle::after,#dayHead .dtitle::after{content:'';flex:1;height:1px;background:var(--hair)}
.dayline{border-bottom:1px solid var(--hair);margin-bottom:20px;padding-bottom:8px}
.dayline input{width:100%;font-size:17px}
.dayline input::placeholder{color:var(--ink-3)}
.sp.gone .w{opacity:.42}
.sp .gonemark{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.06em}
.card .row .restore{color:var(--mark)}
#scope{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--ink-3);align-self:center}
.searchrow{display:flex;align-items:center;gap:14px;margin:30px 0 8px;border-bottom:1px solid var(--hair);padding-bottom:10px}
.searchrow input{flex:1;font-size:19px}
.searchrow input::placeholder{color:var(--ink-3)}
.searchrow .clr{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 34px}
.filters button{
  font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;color:var(--ink-3);
  border:1px solid var(--hair);border-radius:999px;padding:4px 13px;transition:.18s;
}
.filters button:hover{color:var(--ink-2);border-color:var(--ink-3)}
.filters button.on{color:var(--paper);background:var(--mark);border-color:var(--mark)}
.group{margin-bottom:38px}
.group .dtitle{
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--ink-2);
  display:flex;align-items:center;gap:12px;margin-bottom:10px;
}
.group .dtitle::after{content:'';flex:1;height:1px;background:var(--hair)}
.group .dnote{
  font-size:14.5px;color:var(--ink-2);line-height:1.85;margin-top:12px;padding-left:58px;
  border-left:1px solid var(--hair);white-space:pre-wrap;
}
mark{background:none;color:var(--mark);font-weight:700}

/* ── 소환 ── */
.summon{padding-top:40px}
.modes{display:flex;gap:8px;margin-bottom:8px}
.modes button{
  font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;color:var(--ink-3);
  border:1px solid var(--hair);border-radius:999px;padding:4px 13px;
}
.modes button.on{color:var(--paper);background:var(--ink);border-color:var(--ink)}
.stage{
  min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;padding:44px 0;text-align:center;
}
.drawn{font-size:46px;line-height:1.3;letter-spacing:-.01em;font-family:var(--serif);
  border-bottom:1px solid transparent;padding-bottom:2px;transition:border-color .18s}
button.drawn:hover{border-bottom-color:var(--hair)}
.drawn.s2{font-size:29px;line-height:1.5}
.drawn.s3{font-size:20px;line-height:1.7;max-width:30em;text-align:center;letter-spacing:0}
.drawnrow{display:flex;flex-wrap:wrap;gap:4px 30px;justify-content:center;align-items:baseline}
.drawn.blur{opacity:.25;filter:blur(2px)}
.pair{display:flex;flex-direction:column;align-items:center;gap:16px}
.pair .x{width:34px;height:1px;background:var(--hair)}
.placard{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);
  line-height:2;
}
.placard .m{font-family:var(--serif);font-size:14.5px;letter-spacing:0;color:var(--ink-2);display:block;margin-top:8px;max-width:460px}
.summonbar{display:flex;gap:22px;justify-content:center;margin-top:6px}
.summonbar button{font-family:var(--sans);font-size:12px;letter-spacing:.1em;color:var(--ink-2);border-bottom:1px solid var(--hair);padding-bottom:3px}
.summonbar button:hover{color:var(--ink);border-color:var(--mark)}
.scratch{margin-top:58px}
.lres{max-height:340px;overflow:auto;margin:2px 0 12px}
.pick{display:flex;align-items:baseline;gap:12px;width:100%;padding:7px 2px;text-align:left;
  border-bottom:1px solid transparent;transition:border-color .15s}
.pick:hover{border-bottom-color:var(--hair)}
.pick .bx{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:14px;flex:none}
.pick.on .bx{color:var(--mark)}
.pick .pbody{flex:1;min-width:0}
.pick .pt{display:block;font-size:15.5px;line-height:1.6}
.pick .pn{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.6;margin-top:3px;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pick .pd{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:none}
.pick.done{opacity:.4;cursor:default}
.card .links{margin-top:20px;padding-top:14px;border-top:1px solid var(--hair)}
.card .links .lh{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink-3);margin-bottom:6px}
.lrow{display:flex;align-items:baseline;gap:10px;padding:5px 0}
.lrow .lgo{flex:1;text-align:left;overflow:hidden}
.lrow .lt{font-size:15px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  border-bottom:1px solid transparent;padding-bottom:1px}
.lrow .lgo:hover .lt{border-bottom-color:var(--mark)}
.lrow .ld{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:none}
.lkbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lk{font-family:var(--sans);font-size:11px;letter-spacing:.04em;color:var(--mark);
  border:1px solid var(--hair);border-radius:999px;padding:3px 10px;white-space:nowrap}
.lk:hover{border-color:var(--mark)}
.placard .lkbar{justify-content:center;margin-top:14px}
.lcut{font-family:var(--mono);font-size:12px;color:var(--hair);flex:none;padding:0 2px}
.lcut:hover{color:var(--danger)}
.todaystrip{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-3);line-height:2.1}
.todaystrip b{font-family:var(--serif);font-size:14.5px;font-weight:400;color:var(--ink-2);letter-spacing:0}

.sectlabel{font-family:var(--sans);font-size:11px;letter-spacing:.18em;color:var(--ink-3)}

/* ── 발 ── */
footer{
  border-top:1px solid var(--hair);padding:14px 40px 22px;max-width:820px;width:100%;margin:0 auto;
  display:flex;gap:20px;align-items:center;flex-wrap:wrap;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;color:var(--ink-3);
}
footer .acts{margin-left:auto;display:flex;gap:16px}
footer button{font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;color:var(--ink-3)}
footer button:hover{color:var(--mark)}
footer .warn{color:var(--amber)}

/* ── 표본 카드 ── */
.scrim{
  position:fixed;inset:0;background:rgba(10,11,12,.34);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;padding:24px;z-index:20;
}
.scrim.on{display:flex}
.card{
  background:var(--paper-2);border:1px solid var(--hair);width:100%;max-width:430px;
  padding:26px 26px 20px;animation:in .2s ease both;
}
.card .cno{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--ink-3);margin-bottom:16px}
.card input.wt{font-size:26px;width:100%;border-bottom:1px solid var(--hair);padding-bottom:8px}
.card textarea{width:100%;min-height:76px;resize:vertical;font-size:15px;line-height:1.8;
  margin-top:16px;padding-bottom:8px;border-bottom:1px solid var(--hair)}
.card .toggles{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.card .toggles button{
  font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;color:var(--ink-3);
  border:1px solid var(--hair);border-radius:999px;padding:4px 12px;white-space:nowrap;
}
.card .toggles button.on{color:var(--paper);background:var(--mark);border-color:var(--mark)}
.card .toggles button[data-src].on{color:var(--paper);background:var(--ink);border-color:var(--ink)}
.sp .src{font-family:var(--mono);font-size:9.5px;color:var(--ink-2);letter-spacing:.04em;
  border:1px solid var(--hair);border-radius:999px;padding:1px 6px;white-space:nowrap}
.card .row{display:flex;align-items:center;margin-top:22px;padding-top:14px;border-top:1px solid var(--hair)}
.card .row button{font-family:var(--sans);font-size:12px;letter-spacing:.08em;color:var(--ink-2)}
.card .row .del{color:var(--danger);margin-right:auto}

#toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);
  background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:12.5px;
  letter-spacing:.04em;padding:9px 18px;opacity:0;pointer-events:none;transition:.24s;z-index:30;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){
  header,main,footer{padding-left:20px;padding-right:20px}
  .catchline input{font-size:24px}
  .drawn{font-size:34px}
  .sp .memo{display:none}
  nav{gap:14px}
  nav button .k{display:none}
}
</style>
</head>
<body>

<header>
  <div class="brand">말모이</div>
  <nav>
    <button data-v="collect" class="on">채집<span class="k">1</span></button>
    <button data-v="drawer">서랍<span class="k">2</span></button>
    <button data-v="summon">소환<span class="k">3</span></button>
  </nav>
</header>

<main>
  <!-- 채집 -->
  <section class="view on" id="v-collect">
    <div class="catchline">
      <input id="catch" placeholder="지금 여기의 단어와 문장" autocomplete="off" spellcheck="false">
    </div>
    <div class="hint">
      <span>엔터로 하나씩 넣습니다. 들어온 그대로 한 표본이 됩니다.</span>
      <span id="dupnote"></span>
    </div>

    <div class="today">
      <div class="daylabel"><span id="todayDate"></span><span class="n" id="todayCount"></span></div>
      <div class="specimens" id="todayList"></div>
    </div>

    <div class="diary">
      <div class="sectlabel">오늘의 몇 줄</div>
      <textarea id="diary" placeholder="위의 말들을 보면서, 남길 것이 있다면."></textarea>
    </div>
  </section>

  <!-- 서랍 -->
  <section class="view" id="v-drawer">
    <div class="calhead">
      <button class="arw" id="calPrev" aria-label="이전 달">‹</button>
      <span class="m" id="calMonth"></span>
      <button class="arw" id="calNext" aria-label="다음 달">›</button>
      <button class="jump" id="calToday">오늘</button>
      <span class="tot" id="calCount"></span>
    </div>
    <div class="calgrid" id="calGrid"></div>

    <div class="searchrow">
      <input id="search" placeholder="찾기" autocomplete="off" spellcheck="false">
      <button class="clr" id="clearSearch">지움</button>
    </div>
    <div class="filters">
      <button data-f="all" class="on">전체</button>
      <button data-f="star">표시한 것</button>
      <button data-f="unused">아직 안 쓴 것</button>
      <button data-f="rep">되풀이되는 것</button>
      <button data-f="note">메모 있는 것</button>
      <button data-f="src">들은·읽은 것</button>
      <button data-f="lk">주소 있는 것 ↗</button>
      <button data-f="ln">이어진 것 ↔</button>
      <button data-f="del">버린 것</button>
    </div>
    <div id="dayHead" hidden>
      <div class="dtitle" id="dayTitle"></div>
      <div class="dayline"><input id="dayCatch" autocomplete="off" spellcheck="false"></div>
    </div>
    <div id="panel"></div>
    <div id="dayNote" hidden>
      <div class="sectlabel" id="dayNoteLabel">그날의 몇 줄</div>
      <textarea id="dayText" placeholder="이 날이 어떤 날이었는지. 여기 적어두면 놓친 단어가 따라옵니다."></textarea>
    </div>
  </section>

  <!-- 소환 -->
  <section class="view summon" id="v-summon">
    <div class="modes"><span id="scope"></span></div>
    <div class="stage" id="stage"></div>
    <div class="summonbar">
      <button id="redraw">다시 뽑기 <span style="opacity:.45">R</span></button>

<div id="toast"></div>

<script>
'use strict';
const KEY='chaejip.v1';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

/* ── 저장소 ── */
let S={v:1,seq:0,words:[],diary:{},meta:{lastExport:null}};
function load(){
  try{const r=localStorage.getItem(KEY); if(r){const p=JSON.parse(r); S=Object.assign(S,p); S.meta=Object.assign({lastExport:null},p.meta||{});}}
  catch(e){toast('저장된 내용을 읽지 못했습니다. 새로 시작합니다.');}
  bust();
}
let saveTimer=null,lastBytes=0,storeFail=false;
function save(){bust();clearTimeout(saveTimer);saveTimer=setTimeout(flush,500);}
function flush(){
  clearTimeout(saveTimer);
  try{const str=JSON.stringify(S);localStorage.setItem(KEY,str);lastBytes=str.length;storeFail=false;}
  catch(e){storeFail=true;toast('저장 공간이 찼습니다. 내보내기로 백업한 뒤 버린 것을 정리하세요.');}
  renderStore();
}
function renderStore(){
  const el=$('#statStore');if(!el)return;
  if(storeFail){el.textContent='저장 실패';el.className='warn';return;}
  const pct=Math.round(lastBytes*2/5242880*100);
  el.textContent=pct>=55?'저장소 '+pct+'%':'';
  el.className=pct>=80?'warn':'';
}

/* ── 도구 ── */
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const WD=['일','월','화','수','목','금','토'];
function dLabel(s){const[y,m,d]=s.split('-').map(Number);const dt=new Date(y,m-1,d);
  return `${y}. ${pad(m)}. ${pad(d)} ${WD[dt.getDay()]}`;}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2000);}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const no=n=>'No.'+String(n).padStart(4,'0');
const norm=t=>t.trim().toLowerCase().replace(/\s+/g,' ');
/* 버린 표본은 배열에 남되 모든 셈과 화면에서 빠진다. 번호는 회수하지 않는다. */
/* 표본이 만 개를 넘어도 한 줄 그릴 때마다 전체를 훑지 않도록 색인을 둔다.
   색인은 상태가 바뀔 때(save) 통째로 버려지고 다음 요청에 다시 선다. */
let _live=null,_rep=null,_days=null,_byId=null;
function bust(){_live=_rep=_days=_byId=null;}
function byId(id){
  if(!_byId){_byId=new Map();S.words.forEach(w=>_byId.set(w.id,w));}
  return _byId.get(id);
}
/* 이어두기는 양쪽에 함께 적는다. 한쪽만 적으면 반대편에서 영영 보이지 않는다. */
function linkWord(a,b){
  if(!a||!b||a.id===b.id)return false;
  a.ln=a.ln||[];b.ln=b.ln||[];
  if(a.ln.includes(b.id))return false;
  a.ln.push(b.id);b.ln.push(a.id);return true;
}
function unlinkWord(a,b){
  if(!a||!b)return;
  if(a.ln){a.ln=a.ln.filter(x=>x!==b.id);if(!a.ln.length)delete a.ln;}
  if(b.ln){b.ln=b.ln.filter(x=>x!==a.id);if(!b.ln.length)delete b.ln;}
}
function live(){return _live||(_live=S.words.filter(w=>!w.del));}
function repMap(){
  if(_rep)return _rep;
  const m=new Map();
  live().forEach(w=>{const k=norm(w.text);m.set(k,(m.get(k)||0)+1);});
  return _rep=m;
}
function repCount(t){return repMap().get(norm(t))||0;}
/* 설명 안의 주소를 알아본다. scheme:// 꼴이면 무엇이든 잡고, 아는 것은 이름을 붙인다. */
const SCHEMES={
  scrivener:'스크리브너','x-devonthink-item':'데본씽크','x-devonthink':'데본씽크',
  devonthink:'데본씽크',shortcuts:'단축어',things:'Things',omnifocus:'옴니포커스',
  obsidian:'옵시디언',bear:'베어',ulysses:'율리시스',craftdocs:'크래프트',
  'x-apple-reminderkit':'미리알림',notes:'메모',message:'메시지',file:'파일',ftp:'FTP'
};
const LK_RE=/\b[a-z][a-z0-9+.\-]*:\/\/[^\s<>"'()]+/gi;
function parseLinks(t){
  if(!t)return [];
  const out=[],seen=new Set();
  (t.match(LK_RE)||[]).forEach(m=>{
    const url=m.replace(/[.,;:!?]+$/,'');
    if(seen.has(url))return;seen.add(url);
    const sc=url.slice(0,url.indexOf(':')).toLowerCase();
    let label=SCHEMES[sc]||sc;
    if(sc==='http'||sc==='https'){
      try{label=new URL(url).hostname.replace(/^www\./,'');}catch(e){label='웹';}
    }
    out.push({url,label});
  });
  return out;
}
function lkChips(t,cls){
  const ls=parseLinks(t);
  if(!ls.length)return '';
  return `<span class="lkbar${cls?' '+cls:''}">${ls.map(l=>
    `<button class="lk" data-lk="${esc(l.url)}">${esc(l.label)} ↗</button>`).join('')}</span>`;
}
/* 웹은 새 탭으로, 앱 주소는 숨은 틀로 넘긴다. 그래야 이 화면을 떠나지 않는다. */
function openLink(url){
  if(/^https?:/i.test(url)){window.open(url,'_blank','noopener');return;}
  const f=document.createElement('iframe');
  f.style.display='none';f.src=url;document.body.appendChild(f);
  setTimeout(()=>f.remove(),1500);
}
const dayNum=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5;};
/* 같은 말의 채집 이력에서 주기를 뽑는다. 같은 날 두 번은 한 번으로 센다. */
function cycleOf(list){
  const ds=[...new Set(list.map(w=>w.date))].sort();
  const since=Math.round(dayNum(today())-dayNum(ds[ds.length-1]));
  if(ds.length<2)return {avg:null,since};
  return {avg:Math.round((dayNum(ds[ds.length-1])-dayNum(ds[0]))/(ds.length-1)),since};
}
function cycleLabel(list){
  const c=cycleOf(list);
  const last=c.since===0?'오늘':c.since+'일 전';
  return (c.avg===null?'같은 날':'평균 '+c.avg+'일')+' · 마지막 '+last;
}
function gapLabel(cur,prev){
  if(!prev)return '처음';
  const g=Math.round(dayNum(cur.date)-dayNum(prev.date));
  return g===0?'같은 날':'+'+g+'일';
}
function tmLabel(w){
  if(!w.ts)return '';
  const d=new Date(w.ts);
  return ymd(d)===w.date?pad(d.getHours())+':'+pad(d.getMinutes()):'뒤늦게';
}

/* ── 채집 ── */
/* 한 번에 하나. 들어온 그대로 한 표본이 된다. */
function splitEntry(raw){
  const t=raw.replace(/\s+/g,' ').trim();
  return t?[t]:[];
}
const LONG=18;
const isLine=t=>t.length>LONG;
function addWords(raw,date){
  const parts=splitEntry(raw);
  if(!parts.length)return;
  const d=date||today(),now=Date.now();let msg='';
  const added=[];
  parts.forEach((t,i)=>{
    const prior=repCount(t);
    S.seq++;
    const w={id:'w'+now+'_'+i+'_'+Math.random().toString(36).slice(2,6),
      no:S.seq,text:t,note:'',date:d,ts:now+i,star:false,used:false,fresh:true};
    S.words.push(w);added.push(w);bust();
    if(prior>0)msg=`‘${t}’ ${prior+1}번째`;
  });
  setTimeout(()=>{added.forEach(w=>{delete w.fresh;});},700);
  save();renderAll();
  if(msg&&$('#v-collect').classList.contains('on')){
    $('#dupnote').innerHTML=`<b>${esc(msg)}</b>`;
    setTimeout(()=>{$('#dupnote').innerHTML='';},4000);
  }else if(msg)toast(msg);
  else if(d!==today())toast(dLabel(d)+'에 넣었습니다');
}
/* 한글 IME: 조합을 끝내는 엔터와 입력을 확정하는 엔터를 가려낸다 */
function bindCatch(inp,getDate){
  let composing=false,pending=false,timer=null;
  function commit(){
    clearTimeout(timer);pending=false;
    const v=inp.value;
    if(!v.trim())return;
    addWords(v,getDate());inp.value='';inp.focus();
  }
  inp.addEventListener('compositionstart',()=>{composing=true;});
  inp.addEventListener('compositionend',()=>{
    composing=false;
    if(!pending)return;
    /* 조합 중 눌린 엔터였다. 뒤이어 진짜 엔터가 오는 브라우저(Chrome·Safari)면
       그쪽이 처리하고, 오지 않는 브라우저면 여기서 처리한다. */
    clearTimeout(timer);
    timer=setTimeout(commit,50);
  });
  inp.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.keyCode!==13)return;
    if(composing||e.isComposing||e.keyCode===229||e.which===229){pending=true;return;}
    e.preventDefault();
    commit();
  });
}

function spRow(w,q,showDate){
  const rc=repCount(w.text);
  const txt=q?hi(w.text,q):esc(w.text);
  const right=showDate?w.date.slice(5).replace('-','.'):tmLabel(w);
  const marks=(w.src?`<span class="src">${w.src==='heard'?'들은':'읽은'}</span>`:'')
    +(w.del?'<span class="gonemark">버림</span>':'')
    +(rc>1?`<span class="rep">×${rc}</span>`:'')
    +(w.star?'<span class="flag">✻</span>':'');
  const cls=`${w.used?' used':''}${w.del?' gone':''}${w.fresh?' new':''}`;
  if(isLine(w.text))
    return `<button class="sp line${cls}" data-id="${w.id}">
      <span class="lmeta"><span class="no">${no(w.no)}</span>${marks}
        <span class="tm">${right}</span></span>
      <span class="w">${txt}</span>
      ${w.note?`<span class="lnote">${esc(w.note)}</span>`:''}
    </button>`;
  return `<button class="sp${cls}" data-id="${w.id}">
    <span class="no">${no(w.no)}</span>
    <span class="w">${txt}</span>
    <span class="memo">${w.note?esc(w.note):''}</span>
    <span class="tm">${right}</span>
    ${marks}
  </button>`;
}
function hi(t,q){if(!q)return esc(t);const i=t.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(t);return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));}

function renderCollect(){
  const d=today();
  const list=live().filter(w=>w.date===d).sort((a,b)=>b.ts-a.ts);
  $('#todayDate').textContent=dLabel(d);
  $('#todayCount').textContent=list.length?list.length+'단어':'';
  $('#todayList').innerHTML=list.length?list.map(w=>spRow(w)).join('')
    :'<div class="empty">아직 비어 있습니다. 지금 여기의 단어나 문장 하나를 넣어 보세요.</div>';
  const t=$('#diary'); if(document.activeElement!==t) t.value=S.diary[d]||'';
}
function setNote(d,v){
  if(v.trim())S.diary[d]=v; else delete S.diary[d];
  save();
}
$('#diary').addEventListener('input',e=>{
  const v=e.target.value;setNote(today(),v);
  if(selDate===today()&&document.activeElement!==$('#dayText'))$('#dayText').value=v;
});
$('#dayText').addEventListener('input',e=>{
  const v=e.target.value;setNote(selDate,v);
  if(selDate===today()&&document.activeElement!==$('#diary'))$('#diary').value=v;
});

/* ── 서랍 ── */
let filter='all',query='';
let calY=new Date().getFullYear(),calM=new Date().getMonth(),selDate=today();
const RESULT_CAP=300,DAY_CAP=400;
const expanded=new Set();

function pool(){
  let ws=filter==='del'?S.words.filter(w=>w.del):live();
  if(filter==='star')ws=ws.filter(w=>w.star);
  if(filter==='unused')ws=ws.filter(w=>!w.used);
  if(filter==='note')ws=ws.filter(w=>w.note);
  if(filter==='src')ws=ws.filter(w=>w.src);
  if(filter==='rep')ws=ws.filter(w=>repCount(w.text)>1);
  if(filter==='lk')ws=ws.filter(w=>parseLinks(w.note).length);
  if(filter==='ln')ws=ws.filter(w=>(w.ln||[]).length);
  if(query){const q=query.toLowerCase();
    ws=ws.filter(w=>w.text.toLowerCase().includes(q)||(w.note||'').toLowerCase().includes(q));}
  return ws;
}
const sifting=()=>!!(query||filter!=='all');
function scopeLabel(){
  const names={star:'표시한 것',unused:'아직 안 쓴 것',rep:'되풀이되는 것',note:'메모 있는 것',
    src:'들은·읽은 것',lk:'주소 있는 것',ln:'이어진 것',del:'버린 것'};
  const p=[];if(filter!=='all')p.push(names[filter]);if(query)p.push('‘'+query+'’');
  return p.length?'범위 '+p.join(' · '):'';
}
function dayCounts(){
  if(_days)return _days;
  const m={};live().forEach(w=>{m[w.date]=(m[w.date]||0)+1});return _days=m;
}
function diaryHits(){
  if(!query)return [];
  const q=query.toLowerCase();
  return Object.entries(S.diary).filter(([d,t])=>t&&t.toLowerCase().includes(q))
    .sort((a,b)=>b[0].localeCompare(a[0]));
}
function snip(t,q){
  const i=t.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(t.slice(0,60));
  const a=Math.max(0,i-28),b=Math.min(t.length,i+q.length+40);
  return (a>0?'…':'')+esc(t.slice(a,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'
       +esc(t.slice(i+q.length,b))+(b<t.length?'…':'');
}

/* 달력 */
function renderCalendar(){
  const c=dayCounts(),t=today();
  const start=new Date(calY,calM,1).getDay(),days=new Date(calY,calM+1,0).getDate();
  const key=i=>calY+'-'+pad(calM+1)+'-'+pad(i);
  let max=1,total=0;
  for(let i=1;i<=days;i++){const n=c[key(i)]||0;total+=n;if(n>max)max=n;}
  const hits=new Set(),sift=sifting();
  if(sift){pool().forEach(w=>hits.add(w.date));diaryHits().forEach(([d])=>hits.add(d));}
  let g=WD.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<start;i++)g+='<div></div>';
  for(let i=1;i<=days;i++){
    const k=key(i),n=c[k]||0;
    const lv=n===0?0:n<=Math.max(1,Math.round(max*.25))?1:n<=Math.round(max*.6)?2:3;
    g+=`<button class="cell l${lv}${k===selDate&&!sift?' sel':''}${k===t?' now':''}`
      +`${sift&&hits.has(k)?' hit':''}" data-d="${k}">`
      +`<span class="dn">${i}</span>${n?`<span class="dc">${n}</span>`:''}</button>`;
  }
  $('#calGrid').innerHTML=g;
  $('#calMonth').textContent=calY+'. '+pad(calM+1);
  $('#calCount').textContent=total?total+'단어':'';
}
function shiftMonth(d){
  const t=new Date(calY,calM+d,1);calY=t.getFullYear();calM=t.getMonth();renderCalendar();
}
function goDay(d){
  query='';$('#search').value='';
  filter='all';$$('.filters button').forEach(x=>x.classList.toggle('on',x.dataset.f==='all'));
  selDate=d;const[y,m]=d.split('-').map(Number);calY=y;calM=m-1;
  renderDrawer();$('#panel').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* 아래 판 */
function renderPanel(){
  const el=$('#panel');
  if(sifting()){
    $('#dayHead').hidden=true;$('#dayNote').hidden=true;
    const ws=pool(),dh=diaryHits();
    if(!ws.length&&!dh.length){el.innerHTML='<div class="empty">해당하는 단어가 없습니다.</div>';return;}
    /* 같은 말은 한 줄로 접는다. 펼치면 그 말의 채집 이력과 간격이 나온다. */
    const gm=new Map();
    ws.forEach(w=>{const k=norm(w.text);let a=gm.get(k);if(!a)gm.set(k,a=[]);a.push(w);});
    const groups=[...gm.entries()].map(([k,a])=>[k,a.sort((x,y)=>y.ts-x.ts)]);
    groups.sort((a,b)=>b[1][0].ts-a[1][0].ts);
    const shown=groups.slice(0,RESULT_CAP);
    let h=`<div class="resline">${ws.length}단어 · ${groups.length}가지`
      +` · ${new Set(ws.map(w=>w.date)).size}일${dh.length?' · 몇 줄 '+dh.length:''}</div>`;
    h+='<div class="specimens">';
    shown.forEach(([k,a])=>{
      if(a.length===1){h+=spRow(a[0],query,true);return;}
      const open=expanded.has(k);
      h+=`<button class="sp grp${open?' open':''}" data-k="${esc(k)}">
        <span class="cnt">×${a.length}</span>
        <span class="w">${hi(a[0].text,query)}</span>
        <span class="memo cycle">${cycleLabel(a)}</span>
        <span class="caret">${open?'▾':'▸'}</span></button>`;
      if(open){
        const list=a.slice(0,200);
        h+='<div class="insts">'+list.map((w,i)=>
          `<button class="sp inst${w.del?' gone':''}" data-id="${w.id}">
            <span class="no">${no(w.no)}</span>
            <span class="idate">${dLabel(w.date)}<i>${tmLabel(w)}</i></span>
            <span class="memo">${w.note?esc(w.note):''}</span>
            ${w.star?'<span class="flag">✻</span>':''}
            <span class="tm gap">${gapLabel(w,a[i+1])}</span></button>`).join('')
          +(a.length>200?`<div class="empty">외 ${a.length-200}번</div>`:'')+'</div>';
      }
    });
    h+='</div>';
    if(groups.length>RESULT_CAP)
      h+=`<div class="empty">외 ${groups.length-RESULT_CAP}가지. 검색어를 좁히거나 달력에서 날을 고르세요.</div>`;
    if(dh.length)h+=`<div class="group"><div class="dtitle">몇 줄 안에서</div><div class="specimens">`
      +dh.map(([d,t])=>`<button class="sp" data-day="${d}"><span class="no">${d.slice(5)}</span>`
      +`<span class="w" style="font-size:15px">${snip(t,query)}</span></button>`).join('')+`</div></div>`;
    el.innerHTML=h;
  }else{
    const all=live().filter(w=>w.date===selDate).sort((a,b)=>b.ts-a.ts);
    const ws=all.slice(0,DAY_CAP);
    const[y,m,d]=selDate.split('-').map(Number),isToday=selDate===today();
    $('#dayHead').hidden=false;
    $('#dayTitle').textContent=dLabel(selDate)+(all.length?' · '+all.length+'단어':'');
    $('#dayCatch').placeholder=(isToday?'오늘':m+'월 '+d+'일')+'에 더하기';
    let h=ws.length?`<div class="specimens">${ws.map(w=>spRow(w)).join('')}</div>`
      :'<div class="empty">이 날은 비어 있습니다. 뒤늦게 떠오른 말을 여기에 넣을 수 있습니다.</div>';
    if(all.length>DAY_CAP)h+=`<div class="empty">외 ${all.length-DAY_CAP}단어는 검색으로 찾으세요.</div>`;
    el.innerHTML=h;
    $('#dayNote').hidden=false;
    $('#dayNoteLabel').textContent=isToday?'오늘의 몇 줄':'그날의 몇 줄';
    const ta=$('#dayText');
    if(document.activeElement!==ta)ta.value=S.diary[selDate]||'';
  }
}
function renderDrawer(){renderCalendar();renderPanel();}

$('#calGrid').addEventListener('click',e=>{
  const c=e.target.closest('.cell');if(c)goDay(c.dataset.d);
});
$('#calPrev').addEventListener('click',()=>shiftMonth(-1));
$('#calNext').addEventListener('click',()=>shiftMonth(1));
$('#calToday').addEventListener('click',()=>goDay(today()));
$('#search').addEventListener('input',e=>{query=e.target.value.trim();renderDrawer();});
$('#clearSearch').addEventListener('click',()=>{query='';$('#search').value='';$('#search').focus();renderDrawer();});
$$('.filters button').forEach(b=>b.addEventListener('click',()=>{
  $$('.filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  filter=b.dataset.f;renderDrawer();
}));

/* ── 소환 ── */
let drawn=[];
function draw(){
  const ws=sifting()&&pool().length?pool():live();
  if(!ws.length){$('#stage').innerHTML='<div class="empty">서랍이 비었습니다.</div>';drawn=[];$('#scope').textContent='';return;}
  /* 먼저 '어떤 말'을 고르고, 그다음 그 말의 채집 사례 하나를 고른다.
     그러지 않으면 열두 번 걸린 '빨래'가 한 번뿐인 말보다 열두 배 자주 나온다. */
  const gm=new Map();
  ws.forEach(w=>{const k=norm(w.text);let a=gm.get(k);if(!a)gm.set(k,a=[]);a.push(w);});
  const keys=[...gm.keys()];
  const a=gm.get(keys[Math.floor(Math.random()*keys.length)]);
  drawn=[a[Math.floor(Math.random()*a.length)]];
  picked.clear();lq='';$('#linkSearch').value='';renderLinkResults();
  $('#scope').textContent=scopeLabel();
  const st=$('#stage');
  let flips=0;
  const spin=setInterval(()=>{
    const t=ws[Math.floor(Math.random()*ws.length)].text;
    st.innerHTML=`<div class="drawn blur${t.length>34?' s3':t.length>16?' s2':''}">${esc(t)}</div>`;
    if(++flips>4){clearInterval(spin);paint();}
  },70);
}
function paint(){
  if(!drawn.length)return;
  const w=drawn[0],st=$('#stage');
  const sz=t=>t.length>34?' s3':t.length>16?' s2':'';
  const rc=repCount(w.text),all=live().filter(x=>norm(x.text)===norm(w.text));
  const src=w.src?(w.src==='heard'?' · 들은 것':' · 읽은 것'):'';
  const ln=(w.ln||[]).length?' · 이어진 말 '+w.ln.length:'';
  st.innerHTML=`<div><button class="drawn${sz(w.text)}" data-id="${w.id}">${esc(w.text)}</button></div>
    <div class="placard">${no(w.no)} · ${dLabel(w.date)} ${tmLabel(w)}${src}${ln}
    ${rc>1?'<br>채집 '+rc+'회 · '+cycleLabel(all):''}
    ${w.note?`<span class="m">${esc(w.note)}</span>`:''}
    ${lkChips(w.note)}</div>`;
}
/* 소환 아래의 검색은 서랍 검색(query)과 변수를 나눈다.
   섞으면 뽑기 후보까지 좁혀져, 검색한 말만 되풀이 소환되는 굴레에 빠진다. */
let lq='';const picked=new Set();
function renderLinkResults(){
  const el=$('#linkResults');if(!el)return;
  const cur=drawn[0];
  if(!lq||!cur){el.innerHTML='';renderLinkBar();return;}
  const q=lq.toLowerCase();
  const hits=live().filter(w=>w.id!==cur.id&&
      (w.text.toLowerCase().includes(q)||(w.note||'').toLowerCase().includes(q)))
    .sort((a,b)=>b.ts-a.ts).slice(0,40);
  if(!hits.length){el.innerHTML='<div class="empty">찾은 것이 없습니다.</div>';renderLinkBar();return;}
  const done=new Set(cur.ln||[]);
  el.innerHTML='<div class="lres">'+hits.map(w=>{
    const d=done.has(w.id),on=picked.has(w.id);
    const mark=parseLinks(w.note).length?' <span style="color:var(--mark)">↗</span>':'';
    return `<button class="pick${on?' on':''}${d?' done':''}" data-pick="${w.id}"${d?' disabled':''}>
      <span class="bx">${d?'✓':on?'■':'□'}</span>
      <span class="pbody"><span class="pt">${hi(w.text,lq)}</span>
        ${w.note?`<span class="pn">${hi(w.note,lq)}${mark}</span>`:''}</span>
      <span class="pd">${d?'이어짐':w.date.slice(2).replace(/-/g,'.')}</span></button>`;
  }).join('')+'</div>';
  renderLinkBar();
}
function renderLinkBar(){
  const bar=$('#linkBar');if(!bar)return;
  bar.hidden=!picked.size;
  $('#linkSave').textContent=picked.size?picked.size+'개 이어두기':'';
}
$('#linkSearch').addEventListener('input',e=>{lq=e.target.value.trim();renderLinkResults();});
$('#linkClear').addEventListener('click',()=>{picked.clear();renderLinkResults();});
$('#linkSave').addEventListener('click',()=>{
  const cur=drawn[0];if(!cur||!picked.size)return;
  let c=0;picked.forEach(id=>{if(linkWord(cur,byId(id)))c++;});
  picked.clear();save();renderAll();renderLinkResults();
  toast(c?c+'개를 이었습니다':'이미 이어져 있습니다');
});
$('#redraw').addEventListener('click',draw);


/* ── 표본 카드 ── */
let editing=null,cardStack=[];
document.addEventListener('click',e=>{
  const lk=e.target.closest('[data-lk]');
  if(lk){e.preventDefault();e.stopPropagation();openLink(lk.dataset.lk);return;}
  const pk=e.target.closest('[data-pick]');
  if(pk){
    const id=pk.dataset.pick;
    picked.has(id)?picked.delete(id):picked.add(id);
    renderLinkResults();return;
  }
  const gt=e.target.closest('[data-go]');
  if(gt){
    commitCard();
    const w=byId(gt.dataset.go);
    if(w){cardStack.push(editing.id);openCard(w);}
    return;
  }
  const ct=e.target.closest('[data-cut]');
  if(ct){
    unlinkWord(editing,byId(ct.dataset.cut));
    save();renderCardLinks();renderAll();return;
  }
  const dr=e.target.closest('button.drawn');
  if(dr&&dr.dataset.id){openCard(S.words.find(w=>w.id===dr.dataset.id));return;}
  const b=e.target.closest('.sp'); if(!b)return;
  if(b.dataset.day){goDay(b.dataset.day);return;}
  if(b.dataset.k!==undefined){
    const k=b.dataset.k;
    expanded.has(k)?expanded.delete(k):expanded.add(k);
    renderPanel();return;
  }
  openCard(S.words.find(w=>w.id===b.dataset.id));
});
function openCard(w){
  if(!w)return; editing=w;
  $('#cardNo').textContent=`${no(w.no)} · ${dLabel(w.date)} ${tmLabel(w)}`
    +(w.del?' · 버린 것':` · 채집 ${repCount(w.text)}회`);
  $('#cardDel').textContent=w.del?'되살리기':'버리기';
  $('#cardDel').classList.toggle('restore',!!w.del);
  $('#cardPurge').hidden=!w.del;
  $('#cardWord').value=w.text; $('#cardNote').value=w.note||'';
  $('#tStar').classList.toggle('on',!!w.star);
  $('#tUsed').classList.toggle('on',!!w.used);
  $$('.card [data-src]').forEach(b=>b.classList.toggle('on',w.src===b.dataset.src));
  renderCardLinks();renderCardOut();
  $('#cardBack').hidden=!cardStack.length;
  $('#scrim').classList.add('on'); $('#cardNote').focus();
}
function commitCard(){
  if(!editing)return;
  const t=$('#cardWord').value.trim();
  if(t)editing.text=t;
  editing.note=$('#cardNote').value.trim();
  save();
}
function closeCard(){
  commitCard();editing=null;cardStack=[];
  $('#scrim').classList.remove('on');renderAll();
}
function renderCardOut(){
  $('#cardOut').innerHTML=lkChips($('#cardNote').value);
}
$('#cardNote').addEventListener('input',renderCardOut);
function renderCardLinks(){
  const el=$('#cardLinks'),ids=(editing&&editing.ln)||[];
  const rows=ids.map(id=>byId(id)).filter(Boolean);
  if(!rows.length){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  el.innerHTML=`<div class="lh">이어진 말 ${rows.length}</div>`+rows.map(w=>
    `<div class="lrow">
      <button class="lgo" data-go="${w.id}"><span class="lt">${esc(w.text)}</span></button>
      <span class="ld">${w.del?'버림 · ':''}${w.date.slice(2).replace(/-/g,'.')}</span>
      <button class="lcut" data-cut="${w.id}" title="끊기">×</button>
    </div>`).join('');
}
$('#cardBack').addEventListener('click',()=>{
  commitCard();
  const w=byId(cardStack.pop());
  if(w)openCard(w);else closeCard();
});
$('#cardDone').addEventListener('click',closeCard);
$('#scrim').addEventListener('click',e=>{if(e.target===$('#scrim'))closeCard();});
$('#tStar').addEventListener('click',e=>{editing.star=!editing.star;e.target.classList.toggle('on',editing.star);save();});
$('#tUsed').addEventListener('click',e=>{editing.used=!editing.used;e.target.classList.toggle('on',editing.used);save();});
/* 남의 말과 제 말을 갈라둔다. 아무것도 고르지 않으면 제 말이다. */
$$('.card [data-src]').forEach(b=>b.addEventListener('click',()=>{
  editing.src=editing.src===b.dataset.src?undefined:b.dataset.src;
  if(!editing.src)delete editing.src;
  $$('.card [data-src]').forEach(x=>x.classList.toggle('on',editing.src===x.dataset.src));
  save();
}));
$('#cardDel').addEventListener('click',()=>{
  /* 버리기는 되돌릴 수 있다. 다만 번호는 회수하지 않는다. */
  const back=!!editing.del;
  if(back)delete editing.del; else editing.del=Date.now();
  editing=null;save();$('#scrim').classList.remove('on');renderAll();
  toast(back?'되살렸습니다':'버린 것으로 옮겼습니다');
});
$('#cardPurge').addEventListener('click',()=>{
  if(!confirm(`‘${editing.text}’을(를) 아주 지웁니다. 되돌릴 수 없습니다.\n번호 ${no(editing.no)}는 비워둔 채로 남습니다.`))return;
  (editing.ln||[]).forEach(id=>{const o=byId(id);if(o&&o.ln){
    o.ln=o.ln.filter(x=>x!==editing.id);if(!o.ln.length)delete o.ln;}});
  S.words=S.words.filter(w=>w.id!==editing.id);editing=null;cardStack=[];save();
  $('#scrim').classList.remove('on');renderAll();toast('지웠습니다');
});

/* ── 통계 · 백업 ── */
function streak(){
  const set=new Set(live().map(w=>w.date));
  let n=0,d=new Date();
  if(!set.has(ymd(d)))d.setDate(d.getDate()-1);
  while(set.has(ymd(d))){n++;d.setDate(d.getDate()-1);}
  return n;
}
function renderFooter(){
  const m=today().slice(0,7);
  const L=live();renderStore();
  $('#statTotal').textContent='표본 '+L.length+' / '+no(S.seq);
  $('#statMonth').textContent='이달 '+L.filter(w=>w.date.startsWith(m)).length;
  const s=streak();
  $('#statStreak').textContent=s?'이어온 날 '+s:'';
  const b=$('#statBackup'),le=S.meta.lastExport;
  if(!le){b.textContent=S.words.length>30?'아직 백업 없음':'';b.className=S.words.length>30?'warn':'';}
  else{const days=Math.floor((Date.now()-le)/864e5);
    b.textContent='백업 '+(days===0?'오늘':days+'일 전');b.className=days>=14?'warn':'';}
}

function renderAll(){
  renderCollect();renderDrawer();renderFooter();
  if(editing)renderCardLinks();
  drawn=drawn.filter(w=>S.words.includes(w));
  if(drawn.length)paint();
  else if($('#v-summon').classList.contains('on'))draw();
}

/* ── 내보내기 · 불러오기 ── */
function dl(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('#exJson').addEventListener('click',()=>{
  dl(`말모이_${today()}.json`,JSON.stringify(S,null,1),'application/json');
  S.meta.lastExport=Date.now();save();renderFooter();toast('내보냈습니다');
});
$('#exText').addEventListener('click',()=>{
  const by={};live().forEach(w=>{(by[w.date]=by[w.date]||[]).push(w)});
  const dates=[...new Set([...Object.keys(by),...Object.keys(S.diary)])].sort().reverse();
  let out=`# 말모이\n\n`;
  dates.forEach(d=>{
    out+=`## ${dLabel(d)}\n\n`;
    (by[d]||[]).sort((a,b)=>a.ts-b.ts).forEach(w=>{
      out+=`- ${w.text}${w.src?' ['+(w.src==='heard'?'들은 것':'읽은 것')+']':''}`
        +`${w.note?' — '+w.note:''}${w.star?' ✻':''}${w.used?' (씀)':''}\n`;});
    if(S.diary[d])out+=`\n${S.diary[d]}\n`;
    out+=`\n`;
  });
  dl(`말모이_${today()}.md`,out,'text/markdown');
  toast('글로 뽑았습니다');
});
$('#imp').addEventListener('click',()=>$('#file').click());
$('#file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const p=JSON.parse(r.result);
      if(!Array.isArray(p.words))throw 0;
      const have=new Set(S.words.map(w=>w.id));
      let add=0;
      p.words.forEach(w=>{if(!have.has(w.id)){S.words.push(w);add++;}});
      let dn=0;
      Object.entries(p.diary||{}).forEach(([d,t])=>{
        if(!S.diary[d]){S.diary[d]=t;dn++;}
        else if(S.diary[d]!==t){S.diary[d]+='\n\n— 합침 —\n'+t;dn++;}
      });
      S.seq=Math.max(S.seq,p.seq||0,...S.words.map(w=>w.no||0));
      save();renderAll();
      toast(`말 ${add}개, 날 ${dn}개를 합쳤습니다`);
    }catch(err){toast('읽을 수 없는 파일입니다');}
    e.target.value='';
  };
  r.readAsText(f);
});

/* ── 화면 전환 · 단축키 ── */
function go(v){
  $$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $$('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  if(v==='collect')setTimeout(()=>$('#catch').focus(),40);
  if(v==='drawer')renderDrawer();
  if(v==='summon'&&!drawn.length)draw();
}
$$('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));

document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.metaKey||e.ctrlKey)&&e.key==='e'){e.preventDefault();$('#exJson').click();return;}
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();go('drawer');setTimeout(()=>$('#search').focus(),40);return;}
  if(e.key==='Escape'){
    if($('#scrim').classList.contains('on')){closeCard();return;}
    if(typing){document.activeElement.blur();return;}
    go('collect');return;
  }
  if(typing)return;
  if(e.key==='1')go('collect');
  if(e.key==='2')go('drawer');
  if(e.key==='3')go('summon');
  if(e.key==='r'||e.key==='R'){if($('#v-summon').classList.contains('on'))draw();else{go('summon');draw();}}
  if(e.key==='/'){e.preventDefault();go('drawer');setTimeout(()=>$('#search').focus(),40);}
  if($('#v-drawer').classList.contains('on')){
    if(e.key==='ArrowLeft'){e.preventDefault();shiftMonth(-1);}
    if(e.key==='ArrowRight'){e.preventDefault();shiftMonth(1);}
  }
});

window.addEventListener('beforeunload',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();});

bindCatch($('#catch'),today);
bindCatch($('#dayCatch'),()=>selDate);
load();renderAll();$('#catch').focus();
</script>
