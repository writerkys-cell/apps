<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Reading Lens</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Pretendard", "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body { 
      background-color: #f2f2f7; 
      color: #1c1c1e; 
      padding: calc(env(safe-area-inset-top, 20px) + 10px) 16px calc(env(safe-area-inset-bottom, 20px) + 20px) 16px;
      display: flex;
      justify-content: center;
    }
    .container { 
      width: 100%; 
      max-width: 480px; 
      background: #ffffff; 
      padding: 24px 18px; 
      border-radius: 24px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    h1 { 
      font-size: 1.35rem; 
      font-weight: 700; 
      color: #000000; 
      letter-spacing: -0.4px;
    }
    .badge {
      font-size: 0.75rem;
      background: #e5e5ea;
      color: #636366;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .input-group { 
      margin-bottom: 14px; 
    }
    label { 
      display: block; 
      font-size: 0.8rem; 
      font-weight: 600; 
      margin-bottom: 6px; 
      color: #8e8e93; 
      text-transform: uppercase;
      letter-spacing: 0.2px;
    }
    input, textarea { 
      width: 100%; 
      padding: 12px 14px; 
      border: 1px solid #e5e5ea; 
      border-radius: 12px; 
      font-size: 16px; /* iOS 자동 줌 방지 */
      outline: none; 
      background-color: #f9f9fb;
      transition: all 0.2s ease;
      -webkit-appearance: none;
    }
    input:focus, textarea:focus { 
      border-color: #007aff; 
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(0,122,255,0.12);
    }
    textarea { 
      resize: none; 
      height: 80px; 
      line-height: 1.45; 
    }
    .section-title { 
      font-size: 0.8rem; 
      font-weight: 600; 
      color: #8e8e93; 
      margin: 20px 0 10px; 
      text-transform: uppercase;
      letter-spacing: 0.2px;
    }
    .lens-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button.lens-card { 
      background: #f9f9fb; 
      border: 1px solid #e5e5ea; 
      padding: 14px 12px; 
      border-radius: 14px; 
      text-align: left;
      cursor: pointer; 
      transition: all 0.12s ease;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    button.lens-card:active {
      transform: scale(0.97);
      background: #007aff;
      border-color: #007aff;
    }
    button.lens-card:active .lens-title,
    button.lens-card:active .lens-desc {
      color: #ffffff;
    }
    .lens-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #1c1c1e;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .lens-desc {
      font-size: 0.72rem;
      color: #8e8e93;
    }
    /* Toast Popup */
    .toast { 
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 20px) + 24px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 25px;
      font-size: 0.88rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      white-space: nowrap;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📖 Reading Lens</h1>
    <span class="badge">Tap to Copy</span>
  </header>

  <div class="input-group">
    <label for="bookTitle">책 제목</label>
    <input type="text" id="bookTitle" placeholder="예: 안나 카레니나, 눈먼 자들의 도시...">
  </div>

  <div class="input-group">
    <label for="bookQuery">질문 / 인용구 / 의문점</label>
    <textarea id="bookQuery" placeholder="궁금한 개념, 인물의 선택, 분석할 장면 등을 적어주세요."></textarea>
  </div>

  <div class="section-title">분석 렌즈 선택 (터치 시 프롬프트 복사)</div>
  <div class="lens-grid">
    <button class="lens-card" onclick="triggerCopy('storyAnalyst', '🖋️ 서사 아키텍트')">
      <span class="lens-title">🖋️ 서사 아키텍트</span>
      <span class="lens-desc">플롯, 혁신성, 복선, 문체</span>
    </button>

    <button class="lens-card" onclick="triggerCopy('infographic', '📊 인포그래픽')">
      <span class="lens-title">📊 인포그래픽</span>
      <span class="lens-desc">연대기, 인물도, 개념 트리</span>
    </button>

    <button class="lens-card" onclick="triggerCopy('deep', '🔍 문학 평론가')">
      <span class="lens-title">🔍 문학 평론가</span>
      <span class="lens-desc">숨은 상징과 주제의식</span>
    </button>

    <button class="lens-card" onclick="triggerCopy('analogy', '💡 쉬운 비유')">
      <span class="lens-title">💡 쉬운 비유</span>
      <span class="lens-desc">일상 사례로 개념 해설</span>
    </button>

    <button class="lens-card" onclick="triggerCopy('character', '👤 인물/심리')">
      <span class="lens-title">👤 인물/심리</span>
      <span class="lens-desc">결핍과 미니 바이오그래피</span>
    </button>

    <button class="lens-card" onclick="triggerCopy('critique', '⚖️ 비판적 사상가')">
      <span class="lens-title">⚖️ 비판적 사상가</span>
      <span class="lens-desc">반론과 논리적 맹점</span>
    </button>

    <button class="lens-card" onclick="triggerCopy('context', '🏛️ 시대/맥락')">
      <span class="lens-title">🏛️ 시대/맥락</span>
      <span class="lens-desc">저자 생애와 사상사 배경</span>
    </button>

    <button class="lens-card" onclick="triggerCopy('nextBooks', '📚 도서 큐레이터')">
      <span class="lens-title">📚 도서 큐레이터</span>
      <span class="lens-desc">실존 심화서 및 대척점 추천</span>
    </button>
  </div>
</div>

<div class="toast" id="toast">✓ 프롬프트가 복사되었습니다!</div>

<script>
  const templates = {
    storyAnalyst: (title, query) =>
`[역할 부여]
당신은 서사의 구조, 플롯 역학, 문학적 혁신성과 작법 메커니즘을 날카롭게 해부하는 '수석 스토리 분석가이자 서사 아키텍트(Senior Story Analyst & Narrative Architect)'입니다.

[대상 도서 및 분석 구간]
- 작품명: [${title}]
- 집중 분석할 장면/플롯/의문점:
${query}

[요청 사항]
작가의 서사적 설계와 작법 기술을 아래 5가지 관점에서 다층적으로 분석해줘:
1. 서사적 혁신성: 기존 클리셰나 전통적 서사 관습 탈피 및 실험성
2. 플롯 역학 및 복선: 인과관계 정밀도와 복선(Setup)-회수(Payoff) 메커니즘
3. 입체적 캐릭터 아크: 인물의 내적 결함과 서사적 변곡점
4. 반전 및 변곡점의 완성도: 맥락 재정의 및 구조적 깊이
5. 문체와 호흡: 문장 템포, 비유의 결, 서술 어조(Tone)`,

    infographic: (title, query) =>
`[역할 부여]
당신은 방대한 텍스트의 맥락을 직관적인 다이어그램과 도표로 요약해내는 '지식 정보 시각화 전문가(Information Architect)'입니다.

[대상 도서 및 분석 대상]
- 책 제목: [${title}]
- 정리할 주제/내용:
${query}

[요청 사항]
위 내용을 바탕으로 텍스트형 인포그래픽 구조를 작성해줘. 질문의 맥락에 맞추어 아래 3가지 형태 중 가장 적합한 방식을 골라 표현해줘:
1. 사건/서사 연대기: 주요 사건 인과관계와 시간 순서 전개
2. 등장인물 관계도: 인물 간 대립/동맹/애증 역학 매트릭스
3. 핵심 개념 구조도: 중심 개념과 하위 요소의 계층형 트리`,

    deep: (title, query) =>
`[역할 부여]
당신은 작품의 숨은 상징과 작가의 의도를 날카롭게 짚어내는 '수석 문학/학술 평론가'입니다.

[대상 도서 및 질문]
- 책 제목: [${title}]
- 질문/의문점:
${query}

[요청 사항]
1. 저자가 이 대목에서 전달하고자 한 핵심 메시지와 의도를 짚어줘.
2. 이 부분이 책 전체의 주제의식이나 클라이맥스와 어떻게 유기적으로 연결되는지 심층 해설해줘.`,

    analogy: (title, query) =>
`[역할 부여]
당신은 가장 난해한 이론도 일상의 언어로 쉽고 명쾌하게 풀어내는 '탁월한 과학/철학 커뮤니케이터'입니다.

[대상 도서 및 질문]
- 책 제목: [${title}]
- 질문/어려운 내용:
${query}

[요청 사항]
1. 친숙한 일상적 비유나 현실의 구체적 사례를 들어 설명해줘.
2. 전문 용어나 추상적인 표현을 직관적인 언어로 치환해줘.`,

    character: (title, query) =>
`[역할 부여]
당신은 인물의 무의식적 결핍과 내면 갈등을 집요하게 추적하는 '임상심리학자이자 서사 분석가'입니다.

[대상 도서 및 질문]
- 책 제목: [${title}]
- 인물/행동:
${query}

[요청 사항]
1. 내면 결핍과 무의식적 동기 분석
2. 작중 핵심 변곡점을 짚은 미니 바이오그래피(Mini Biography)
3. 작가가 이 인물을 통해 드러내고자 한 서사적 상징성 (스포일러 주의)`,

    critique: (title, query) =>
`[역할 부여]
당신은 지적 도전을 즐기며 논리의 빈틈을 날카롭게 검증하는 '소크라테스식 비판적 사상가'입니다.

[대상 도서 및 질문]
- 책 제목: [${title}]
- 검토할 주장:
${query}

[요청 사항]
1. 저자가 내세우는 주장의 전제와 논리적 맹점을 분석해줘.
2. 반대 진영이나 다른 학파에서 제기할 수 있는 가장 강력한 반론 2~3가지를 입체적으로 제시해줘.`,

    context: (title, query) =>
`[역할 부여]
당신은 텍스트 이면의 시대상과 저자의 생애를 꿰뚫어 보는 '역사학자이자 사상사 연구자'입니다.

[대상 도서 및 질문]
- 책 제목: [${title}]
- 분석할 대목:
${query}

[요청 사항]
1. 집필 당시의 시대적/역사적 사건, 사회적 분위기와 철학적 사조 설명
2. 저자의 개인적 생애나 지적 여정이 이 구절에 미친 맥락 복원`,

    nextBooks: (title, query) =>
`[역할 부여]
당신은 출판 데이터베이스를 정확히 파악하고 있는 '전문 도서관 수석 사서 및 독서 큐레이터'입니다.

[대상 도서 및 질문]
- 책 제목: [${title}]
- 확장할 관심사/주제:
${query}

[요청 사항]
* 반드시 웹 검색을 통해 실제로 출판되어 유통 중인 실존 도서만 추천할 것 (환각 엄격 금지)
1. 심화서: 이 질문/주제를 한 단계 더 깊고 학술적으로 파고드는 도서 1권
2. 대척점 도서: 정반대의 시각이나 다른 관점을 제시하는 도서 1권`
  };

  let toastTimer;

  function triggerCopy(lensKey, lensName) {
    const title = document.getElementById('bookTitle').value.trim() || '(책 제목)';
    const query = document.getElementById('bookQuery').value.trim() || '(구체적인 질문이나 인용구)';
    const promptText = templates[lensKey](title, query);

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(promptText).then(() => showToast(lensName));
    } else {
      const tempArea = document.createElement('textarea');
      tempArea.value = promptText;
      document.body.appendChild(tempArea);
      tempArea.select();
      document.execCommand('copy');
      document.body.removeChild(tempArea);
      showToast(lensName);
    }
  }

  function showToast(lensName) {
    const toast = document.getElementById('toast');
    toast.textContent = `✓ [${lensName}] 프롬프트 복사 완료!`;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, 1800);
  }
</script>

</body>
</html>
