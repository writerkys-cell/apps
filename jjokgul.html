  --lfs:16; --llh:1.9; --lmw:544; --lpad:40; --lind:1; --rfs:16;
  --gothic:'Gowun Dodum',-apple-system,'Apple SD Gothic Neo',sans-serif;
  --batang:'Gowun Batang','AppleMyungjo',serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--hanji);color:var(--meok);font-family:var(--gothic);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none !important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:1px dotted var(--inju);outline-offset:3px}

/* 몰입 띠 */
#bar{position:fixed;top:0;left:0;right:0;height:2px;z-index:50;pointer-events:none}
#bar i{display:block;height:100%;width:0;background:var(--inju)}

/* 밑줄 버튼 */
.link{color:var(--meok-2);border-bottom:1px solid var(--seon);padding:1px 0;line-height:1.4}
.link:hover{color:var(--inju);border-bottom-color:var(--inju)}

/* 머리줄 */
header{flex:0 0 auto;height:46px;display:flex;align-items:center;gap:22px;padding:0 22px;border-bottom:1px solid var(--seon);font-size:13px;white-space:nowrap}
header select{appearance:none;-webkit-appearance:none;background:transparent;border:0;border-bottom:1px solid var(--seon);border-radius:0;font:inherit;color:var(--meok);padding:2px 16px 2px 0;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--meok-3) 50%),linear-gradient(-45deg,transparent 50%,var(--meok-3) 50%);
  background-size:4px 4px,4px 4px;background-position:calc(100% - 6px) 55%,calc(100% - 2px) 55%;background-repeat:no-repeat}
header select:hover{border-bottom-color:var(--inju);color:var(--inju)}
#pieceSel{max-width:220px;text-overflow:ellipsis}
#remain{font-variant-numeric:tabular-nums;color:var(--meok-3);cursor:default;border-bottom:1px solid transparent;padding:1px 0}
body.focusing #remain{color:var(--meok);cursor:pointer;border-bottom-color:var(--seon)}
body.focusing #remain:hover{color:var(--inju);border-bottom-color:var(--inju)}
#today{color:var(--meok-2)}
header nav{margin-left:auto;display:flex;gap:18px}
.tab.on{color:var(--inju);border-bottom-color:var(--inju)}

/* 쓰기 */
#write{flex:1;display:flex;min-height:0}
#leftPane{flex:0 0 50%;display:flex;flex-direction:column;background:var(--jongi);min-width:0}
#divider{flex:0 0 9px;cursor:col-resize;background:linear-gradient(to right,transparent 4px,var(--seon) 4px,var(--seon) 5px,transparent 5px);touch-action:none}
#divider:hover,#divider.drag{background:linear-gradient(to right,transparent 4px,var(--inju) 4px,var(--inju) 5px,transparent 5px)}
#rightPane{flex:1;display:flex;flex-direction:column;background:var(--sheet);min-width:0}

.lhead,.rfoot{flex:0 0 auto;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:12px;color:var(--meok-3)}
.lhead{border-bottom:1px solid var(--seon)}
.rfoot{border-top:1px solid var(--seon)}
.meta span+span{margin-left:14px}
.acts{display:flex;gap:16px;font-size:12px}

#leftBody{flex:1;overflow-y:auto;padding:36px calc(var(--lpad)*1px) 80vh}
#leftText{max-width:calc(var(--lmw)*1px);margin:0 auto;font-family:var(--batang);font-size:calc(var(--lfs)*1px);line-height:var(--llh);color:var(--meok)}
#leftText p{margin:0;text-indent:calc(var(--lind)*1em);text-align:justify;text-justify:inter-character;word-break:break-all}
#leftText p.empty{text-indent:0;color:var(--meok-3);font-family:var(--gothic);font-size:13px;text-align:left}

#rbox{flex:1;position:relative;overflow:hidden}
#ta,#mirror{
  position:absolute;inset:0;margin:0;border:0;border-radius:0;
  padding:25vh 56px 62vh 64px;
  font-family:var(--batang);font-size:calc(var(--rfs)*1px);font-weight:400;
  line-height:calc(var(--rfs)*1.9px);letter-spacing:0;word-spacing:0;tab-size:4;
  white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;text-align:left;
}
#ta{z-index:1;width:100%;height:100%;resize:none;outline:none;background:transparent;color:var(--meok);caret-color:var(--inju);overflow-y:auto;scrollbar-width:none}
#ta::-webkit-scrollbar{display:none}
#mirror{z-index:0;overflow:hidden;visibility:hidden;pointer-events:none;color:rgba(35,32,28,.24);user-select:none}
body.oneline #mirror{visibility:visible}
body.oneline #ta{color:transparent}
body.oneline #ta::selection{color:transparent;background:rgba(168,50,45,.16)}
.ln{position:relative}
.ln::before{content:attr(data-n);position:absolute;right:100%;top:0;margin-right:18px;font-family:var(--gothic);font-size:10px;line-height:inherit;color:rgba(154,144,132,.45);font-variant-numeric:tabular-nums}
.ln.cur{color:var(--meok)}
.ln.cur::before{color:var(--meok-2)}

/* 설정 */
#settings{flex:1;overflow-y:auto;padding:40px 22px 120px}
.set{max-width:520px;margin:0 auto;font-size:14px}
.set section{padding:22px 0;border-bottom:1px solid var(--seon)}
.set section:last-child{border-bottom:0}
.set h2{font-size:13px;font-weight:400;color:var(--inju);margin:0 0 14px}
.row{display:flex;align-items:center;gap:10px;min-height:36px}
.row>span:first-child{flex:0 0 180px;color:var(--meok-2)}
.row em{font-style:normal;color:var(--meok-3);font-size:12px}
.set input[type=number],.set input[type=text],.set select{font:inherit;color:var(--meok);background:transparent;border:0;border-bottom:1px solid var(--seon);border-radius:0;padding:3px 0;outline:none}
.set input[type=number]{width:72px}
.set input[type=text]{width:200px}
.set input:focus,.set select:focus{border-bottom-color:var(--inju)}
.set input[type=checkbox]{accent-color:var(--inju);width:15px;height:15px;margin:0}
.set .acts{font-size:13px;gap:20px;margin-top:10px}
.note{font-size:12px;color:var(--meok-3);margin:8px 0 0;line-height:1.6}

/* 휴식 */
#rest{position:fixed;inset:0;z-index:100;background:#2a2622;display:flex;align-items:center;justify-content:center;font-family:var(--gothic);color:#efe9dc;user-select:none}
#restTime{font-size:clamp(72px,15vw,168px);font-variant-numeric:tabular-nums;letter-spacing:.02em;color:rgba(239,233,220,.88)}
#ticker{position:absolute;left:0;right:0;bottom:12vh;overflow:hidden;white-space:nowrap;font-size:18px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
#track{display:inline-block;will-change:transform}
#track .unit{display:inline-block;padding-right:6em}
#track .dim{color:rgba(239,233,220,.28)}
#track .lit{color:rgba(239,233,220,.85)}

/* 인쇄 */
#printHead{display:none}
@page{size:A5 portrait;margin:20mm 30mm}
@media print{
  html,body{height:auto;overflow:visible;background:#fff;display:block}
  #bar,header,#divider,#rightPane,.lhead,#settings,#rest{display:none !important}
  #write,#leftPane{display:block;background:#fff}
  #leftBody{overflow:visible;padding:0;height:auto}
  #printHead{display:block;margin:0 0 8mm}
  #pTitle{font-family:var(--batang);font-weight:400;font-size:14pt;line-height:1.4;color:#000;margin:0 0 2mm}
  #pMeta{font-family:var(--gothic);font-size:8pt;color:#555;margin:0}
  #pMeta span+span{margin-left:4mm}
  #leftText{max-width:none;margin:0;font-size:10pt;color:#000}
  #leftText p{orphans:2;widows:2}
}

@media (max-width:760px){
  #write{flex-direction:column}
  #leftPane{flex:0 0 42% !important}
  #divider{display:none}
  #rightPane{border-top:1px solid var(--seon)}
  header{gap:14px;padding:0 14px;overflow-x:auto}
  #ta,#mirror{padding-left:44px;padding-right:24px}
  .row>span:first-child{flex-basis:130px}
}
</style>
</head>
<body class="oneline">
<div id="bar"><i></i></div>

<header>
  <select id="pieceSel" aria-label="조각글"></select>
  <select id="durSel" aria-label="몰입 시간"></select>
  <button id="remain" title="누르면 몰입을 멈춥니다"></button>
  <span id="today"></span>
  <nav>
    <button class="link tab on" data-tab="write">쓰기</button>
    <button class="link tab" data-tab="settings">설정</button>
  </nav>
</header>

<main id="write">
  <section id="leftPane">
    <div class="lhead">
      <span class="meta" id="lmeta"></span>
      <span class="acts">
        <button class="link" id="printBtn">프린트</button>
        <button class="link" id="scrivBtn">스크리브너</button>
        <button class="link" id="delBtn">지우기</button>
      </span>
    </div>
    <div id="leftBody"><div id="printHead"><h1 id="pTitle"></h1><p id="pMeta"></p></div><div id="leftText"></div></div>
  </section>
  <div id="divider" title="끌어서 폭 조절 · 두 번 누르면 반반"></div>
  <section id="rightPane">
    <div id="rbox">
      <div id="mirror" aria-hidden="true"></div>
      <textarea id="ta" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" aria-label="쓰는 곳"></textarea>
    </div>
    <div class="rfoot">
      <span class="meta" id="rmeta"></span>
      <button class="link" id="sendBtn">왼쪽으로 보내기</button>
    </div>

</main>

<main id="settings" hidden>
  <div class="set">
    <section>
      <h2>시간</h2>
      <label class="row"><span>휴식</span>
        <select data-k="breakMin" data-type="int"><option value="5">5분</option><option value="10">10분</option><option value="15">15분</option></select>
      </label>
    </section>
    <section>
      <h2>왼쪽 화면</h2>
      <label class="row"><span>글자 크기</span><input type="number" data-k="lfs" min="11" max="32" step="1"><em>px</em></label>
      <label class="row"><span>줄 간격</span><input type="number" data-k="llh" min="1.2" max="3" step="0.1"><em>배</em></label>
      <label class="row"><span>본문 최대 너비</span><input type="number" data-k="lmw" min="280" max="1400" step="8"><em>px</em></label>
      <label class="row"><span>좌우 여백</span><input type="number" data-k="lpad" min="0" max="200" step="4"><em>px</em></label>
      <label class="row"><span>문단 들여쓰기</span><input type="number" data-k="lind" min="0" max="4" step="0.5"><em>자</em></label>
    </section>
    <section>
      <h2>오른쪽 화면</h2>
      <label class="row"><span>글자 크기</span><input type="number" data-k="rfs" min="11" max="32" step="1"><em>px</em></label>

    <section>
      <h2>쓰기</h2>
      <label class="row"><span>한 줄씩 집중해서 쓰기</span><input type="checkbox" data-k="oneLine"></label>
      <label class="row"><span>스마트 문장부호</span><input type="checkbox" data-k="smart"></label>
      <p class="note">문장부호는 왼쪽으로 보낼 때만 바뀝니다.</p>
    </section>
    <section>
      <h2>단축어</h2>
      <label class="row"><span>스크리브너로 보낼 때</span><input type="text" data-k="scScriv" spellcheck="false"></label>
      <label class="row"><span>몰입을 시작할 때</span><input type="text" data-k="scStart" spellcheck="false"></label>
      <label class="row"><span>휴식에 들어갈 때</span><input type="text" data-k="scBreak" spellcheck="false"></label>
      <label class="row"><span>몰입을 중단할 때</span><input type="text" data-k="scStop" spellcheck="false"></label>
      <p class="note">이름을 비워 두면 실행하지 않습니다. 타이핑1·타이핑2로 시작하면 ‘오전타이핑1’·‘오전타이핑2’를 엽니다.</p>
    </section>
    <section>
      <h2>조각글</h2>
      <label class="row"><span>지금 조각글 이름</span><input type="text" id="nameInput" spellcheck="false"></label>
      <div class="acts">
        <button class="link" id="renameBtn">이름 바꾸기</button>
        <button class="link" id="delBtn2">지우기</button>
        <button class="link" id="newBtn">새로 만들기</button>
      </div>
    </section>
    <section>
      <h2>백업</h2>
      <div class="acts">
        <button class="link" id="exportBtn">파일로 내보내기</button>
        <button class="link" id="importBtn">파일에서 불러오기</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <p class="note">불러오면 지금 있는 조각글·설정·시간 기록이 모두 파일의 것으로 바뀝니다.</p>
    </section>
  </div>
</main>

<div id="rest" hidden>
  <div id="restTime"></div>
  <div id="ticker"><div id="track"></div></div>
</div>

<script>
(() => {
'use strict';

/* ───────── 기본값 ───────── */
const KEY = 'jogakgeul.v1';
const DUR = [['5','5분',5],['10','10분',10],['15','15분',15],['25','25분',25],['50','50분',50],['t1','타이핑1',54],['t2','타이핑2',69]];
const durMin = k => (DUR.find(d => d[0] === k) || DUR[3])[2];
const DEF_SET = {
  breakMin:15, lfs:16, llh:1.9, lmw:544, lpad:40, lind:1, rfs:16,
  oneLine:true, smart:true,
  scScriv:'스크리브너', scStart:'', scBreak:'휴식끝', scStop:'중단'
};

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const newPiece = name => ({ id:uid(), name:(name && name.trim()) || '이름 없음', left:'', leftAt:0, right:'' });

/* ───────── 저장 ───────── */
let S;
let frozen = false;

function load(){
  try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e){ S = null; }
  if (!S || typeof S !== 'object') S = {};
  S.settings = Object.assign({}, DEF_SET, S.settings || {});
  if (!Array.isArray(S.pieces) || !S.pieces.length) S.pieces = [newPiece()];
  if (!S.pieces.some(p => p.id === S.currentId)) S.currentId = S.pieces[0].id;
  if (!DUR.some(d => d[0] === S.focusKey)) S.focusKey = '25';
  if (typeof S.split !== 'number') S.split = 0.5;
  S.timer = Object.assign({ phase:'idle' }, S.timer || {});
  S.log = S.log || {};
}
function save(){
  if (frozen) return;
  try {
    const p = cur();
    if (p) p.right = ta.value;
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch(e){}
}
let saveT = 0;
const saveSoon = () => { clearTimeout(saveT); saveT = setTimeout(save, 400); };
const cur = () => S.pieces.find(p => p.id === S.currentId);
load();

/* ───────── 요소 ───────── */
const ta = $('#ta'), mirror = $('#mirror');
const leftBody = $('#leftBody'), leftText = $('#leftText');
const pieceSel = $('#pieceSel'), durSel = $('#durSel');
const remainEl = $('#remain'), todayEl = $('#today'), barEl = $('#bar i');
const restEl = $('#rest'), restTime = $('#restTime'), ticker = $('#ticker'), track = $('#track');

/* ───────── 도움 ───────── */
const countChars = t => [...t.replace(/\n/g,'')].length;
const mae = n => (n / 200).toFixed(1);
const pad2 = n => String(n).padStart(2,'0');
const fmtClock = sec => { sec = Math.max(0, Math.ceil(sec)); return pad2(Math.floor(sec/60)) + ':' + pad2(sec % 60); };
const dayKey = t => { const d = new Date(t - 4*3600e3); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); };
function fmtStamp(t){
  const d = new Date(t), n = new Date();
  const hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  return d.toDateString() === n.toDateString() ? hm : (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + hm;
}

/* ───────── 애플 단축어 ───────── */
function runShortcut(name, input){
  name = (name || '').trim();
  if (!name) return;
  let u = 'shortcuts://run-shortcut?name=' + encodeURIComponent(name);
  if (input !== undefined && input !== null && input !== '') u += '&input=text&text=' + encodeURIComponent(String(input));
  const a = document.createElement('a');
  a.href = u; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ───────── 설정 반영 ───────── */
function applySettings(){
  const st = S.settings, r = document.documentElement.style;
  ['lfs','llh','lmw','lpad','lind','rfs'].forEach(k => r.setProperty('--' + k, st[k]));
  document.body.classList.toggle('oneline', !!st.oneLine);
  schedule(true);
}
function applySplit(){
  $('#leftPane').style.flexBasis = (S.split * 100) + '%';
}

/* ───────── 조각글 ───────── */
function renderPieceSel(){
  pieceSel.innerHTML = '<option value="__new">새 글 쓰기…</option>' +
    S.pieces.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  pieceSel.value = S.currentId;
  $('#nameInput').value = cur().name;
}

// 입력창 값을 바꿔야 할 때(보낸 뒤 비우기, 조각글 바꾸기)는 먼저 포커스를 빼서
// macOS 자동수정 패널이 붙잡고 있는 문자열을 놓게 한 뒤 바꾼다.
function setTa(v){
  const had = document.activeElement === ta;
  if (had) ta.blur();
  ta.value = v;
  try { ta.setSelectionRange(v.length, v.length); } catch(e){}
  if (had) requestAnimationFrame(() => ta.focus());
  updateRMeta();
  schedule(true);
}

function switchTo(id, focus){
  const p = cur();
  if (p) p.right = ta.value;
  S.currentId = id;
  renderPieceSel();
  setTa(cur().right || '');
  renderLeft();
  leftBody.scrollTop = 0;
  save();
  if (focus) setTimeout(() => ta.focus(), 0);
}
function createPiece(name){
  const p = cur();
  if (p) p.right = ta.value;
  const np = newPiece(name);
  S.pieces.unshift(np);
  switchTo(np.id, true);
}
function askNew(){
  const name = prompt('새 조각글의 이름', '');
  if (name === null) { pieceSel.value = S.currentId; return false; }
  createPiece(name);
  return true;
}
function deletePiece(){
  const p = cur();
  if (!confirm(`‘${p.name}’을(를) 목록에서 지웁니다. 되돌릴 수 없습니다.`)) return;
  S.pieces = S.pieces.filter(x => x !== p);
  if (!S.pieces.length) S.pieces.push(newPiece());
  S.currentId = S.pieces[0].id;
  renderPieceSel();
  setTa(S.pieces[0].right || '');
  renderLeft();
  leftBody.scrollTop = 0;
  save();
}

pieceSel.addEventListener('change', () => {
  if (pieceSel.value === '__new') askNew();
  else switchTo(pieceSel.value, true);
});

/* ───────── 왼쪽 표시창 ───────── */
function renderLeft(){
  const p = cur();
  if (!p.left){
    leftText.innerHTML = '<p class="empty">오른쪽에 쓰고 보내면 여기에 놓입니다.</p>';
    $('#lmeta').innerHTML = '';
    return;
  }
  leftText.innerHTML = p.left.split('\n').map(l => l.trim() ? `<p>${esc(l)}</p>` : '<p><br></p>').join('');
  const n = countChars(p.left);
  $('#lmeta').innerHTML = `<span>${n.toLocaleString()}자</span><span>${mae(n)}매</span>` + (p.leftAt ? `<span>${fmtStamp(p.leftAt)}</span>` : '');
}
function updateRMeta(){
  const n = countChars(ta.value);
  $('#rmeta').innerHTML = `<span>${n.toLocaleString()}자</span><span>${mae(n)}매</span>`;
}

/* ───────── 문장부호 ───────── */
const OPENERS = ' \t\n\u00a0([{<「『《〈（“‘';
function smartPunct(s){
  let o = '';
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (c === '.' && s[i+1] === '.' && s[i+2] === '.'){
      o += '⋯'; i += 2;
      while (s[i+1] === '.') i++;
      continue;
    }
    if (c === '-' && s[i+1] === '-'){
      o += '—'; i++;
      while (s[i+1] === '-') i++;
      continue;
    }
    if (c === '"' || c === "'"){
      const prev = o.slice(-1);
      const open = !prev || OPENERS.includes(prev);
      o += c === '"' ? (open ? '“' : '”') : (open ? '‘' : '’');
      continue;
    }
    o += c;
  }
  return o;
}

/* ───────── 보내기 ───────── */
function send(){
  let t = ta.value.replace(/\r/g,'');
  if (!t.trim()) return;
  if (S.settings.oneLine){
    t = t.replace(/[ \t]+\n/g,'\n').replace(/\n[ \t]+/g,'\n');
    t = t.replace(/\n{2,}/g,'\u0000').replace(/\n/g,' ').replace(/\u0000/g,'\n');
  }
  t = t.replace(/^\s+|\s+$/g,'');
  if (S.settings.smart) t = smartPunct(t);
  const p = cur();
  p.left = t; p.leftAt = Date.now(); p.right = '';
  setTa('');
  renderLeft();
  leftBody.scrollTop = 0;
  save();
}
$('#sendBtn').addEventListener('click', send);

/* ───────── 겹화면과 쓰는 자리 ───────── */
let rafR = 0, followNext = false, pauseUntil = 0, pointerActive = false, pendingSend = false;

function caretPos(){
  return ta.selectionDirection === 'backward' ? ta.selectionStart : ta.selectionEnd;
}
function renderMirror(){
  const v = ta.value, pos = caretPos() || 0;
  const lineStart = v.lastIndexOf('\n', pos - 1) + 1;
  let ci = 0;
  for (let i = 0; i < lineStart; i++) if (v.charCodeAt(i) === 10) ci++;
  const lines = v.split('\n');
  let n = 0, html = '';
  for (let i = 0; i < lines.length; i++){
    const s = lines[i];
    const num = s.trim() ? ++n : '';
    let inner;
    if (!s) inner = '\u200b';
    else if (i === ci){
      const k = pos - lineStart;
      const b = s.slice(0, k), a = s.slice(k);
      inner = (b ? `<span class="cb">${esc(b)}</span>` : '') + esc(a);
    } else inner = esc(s);
    html += `<div class="ln${i === ci ? ' cur' : ''}" data-n="${num}">${inner}</div>`;
  }
  mirror.innerHTML = html;
}
function lineH(){ return S.settings.rfs * 1.9; }
function caretY(){
  const el = mirror.querySelector('.ln.cur');
  if (!el) return 0;
  const mr = mirror.getBoundingClientRect();
  const sp = el.querySelector('.cb');
  let mid;
  if (sp){
    const rs = sp.getClientRects();
    const r = rs[rs.length - 1];
    mid = r ? (r.top + r.bottom) / 2 : el.getBoundingClientRect().top + lineH() / 2;
  } else {
    mid = el.getBoundingClientRect().top + lineH() / 2;
  }
  return mid - mr.top + mirror.scrollTop;
}
function follow(){
  if (Date.now() < pauseUntil) return;
  const ratio = S.settings.oneLine ? 2/3 : 1/2;
  ta.scrollTop = Math.max(0, caretY() - ta.clientHeight * ratio);
}
function syncScroll(){ mirror.scrollTop = ta.scrollTop; }
function schedule(doFollow){
  if (doFollow) followNext = true;
  if (rafR) return;
  rafR = requestAnimationFrame(() => {
    rafR = 0;
    renderMirror();
    syncScroll();
    if (followNext){ followNext = false; follow(); }
    syncScroll();
  });
}

ta.addEventListener('input', e => {
  if (S.timer.phase === 'idle' && e.inputType && e.inputType.startsWith('insert')) startFocus();
  updateRMeta();
  schedule(true);
  saveSoon();
});
ta.addEventListener('scroll', syncScroll);
ta.addEventListener('wheel', () => { pauseUntil = Date.now() + 2500; }, { passive:true });
ta.addEventListener('mousedown', () => { pointerActive = true; });
ta.addEventListener('keydown', e => {
  pointerActive = false;
  if (S.timer.phase === 'break'){ e.preventDefault(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
    e.preventDefault();
    if (e.isComposing || e.keyCode === 229){ pendingSend = true; return; }
    send();
  }
});
ta.addEventListener('compositionend', () => {
  if (pendingSend){ pendingSend = false; setTimeout(send, 0); }
});
document.addEventListener('selectionchange', () => {
  if (document.activeElement === ta) schedule(!pointerActive);
});
window.addEventListener('resize', () => schedule(true));

/* ───────── 가운데 선 ───────── */
(() => {
  const dv = $('#divider'), main = $('#write');
  let drag = false;
  dv.addEventListener('pointerdown', e => { drag = true; dv.setPointerCapture(e.pointerId); dv.classList.add('drag'); e.preventDefault(); });
  dv.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = main.getBoundingClientRect();
    S.split = Math.min(.75, Math.max(.25, (e.clientX - r.left) / r.width));
    applySplit(); schedule(true);
  });
  const end = () => { if (!drag) return; drag = false; dv.classList.remove('drag'); save(); };
  dv.addEventListener('pointerup', end);
  dv.addEventListener('pointercancel', end);
  dv.addEventListener('dblclick', () => { S.split = .5; applySplit(); schedule(true); save(); });
})();

/* ───────── 스크리브너 · 지우기 ───────── */
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){
    const x = document.createElement('textarea');
    x.value = t; x.style.position = 'fixed'; x.style.opacity = '0';
    document.body.appendChild(x); x.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(_){}
    x.remove(); return ok;
  }
}
$('#scrivBtn').addEventListener('click', async () => {
  const t = cur().left;
  if (!t) return;
  await copyText(t);
  runShortcut(S.settings.scScriv);
});
$('#printBtn').addEventListener('click', () => {
  const p = cur();
  if (!p.left) return;
  const n = countChars(p.left);
  const d = new Date(p.leftAt || Date.now());
  $('#pTitle').textContent = p.name;
  $('#pMeta').innerHTML = `<span>${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일</span><span>200자 원고지 ${mae(n)}매</span>`;
  window.print();
});
$('#delBtn').addEventListener('click', deletePiece);
$('#delBtn2').addEventListener('click', deletePiece);

/* ───────── 타이머 ───────── */
function todayMs(now){
  let ms = S.log[dayKey(now)] || 0;
  if (S.timer.phase === 'focus') ms += Math.max(0, Math.min(now, S.timer.end) - S.timer.start);
  return ms;
}
function addFocus(ms, at){
  if (ms <= 0) return;
  const k = dayKey(at);
  S.log[k] = (S.log[k] || 0) + ms;
}
function startFocus(){
  const m = durMin(S.focusKey), now = Date.now();
  S.timer = { phase:'focus', start:now, end:now + m*60000, key:S.focusKey };
  save();
  updateHeader();
  const name = S.focusKey === 't1' ? '오전타이핑1' : S.focusKey === 't2' ? '오전타이핑2' : S.settings.scStart;
  runShortcut(name, m);
}
function endFocus(auto){
  const t = S.timer, now = Date.now();
  const endAt = Math.min(now, t.end);
  addFocus(endAt - t.start, t.start);
  if (auto){
    const bm = S.settings.breakMin;
    const breakEnd = t.end + bm*60000;
    if (now < breakEnd){
      S.timer = { phase:'break', breakEnd };
      enterRest();
      if (now - t.end < 60000) runShortcut(S.settings.scBreak, bm);
    } else {
      S.timer = { phase:'idle' };
    }
  } else {
    S.timer = { phase:'idle' };
    runShortcut(S.settings.scStop, Math.round((endAt - t.start) / 60000));
  }
  save();
  updateHeader();
}
remainEl.addEventListener('click', () => { if (S.timer.phase === 'focus') endFocus(false); });

durSel.innerHTML = DUR.map(d => `<option value="${d[0]}">${d[1]}</option>`).join('');
durSel.addEventListener('change', () => { S.focusKey = durSel.value; save(); updateHeader(); });

function updateHeader(){
  const now = Date.now(), t = S.timer;
  document.body.classList.toggle('focusing', t.phase === 'focus');
  let p = 0;
  if (t.phase === 'focus'){
    remainEl.textContent = fmtClock((t.end - now) / 1000);
    p = Math.min(1, (now - t.start) / (t.end - t.start));
  } else if (t.phase === 'break'){
    remainEl.textContent = fmtClock((t.breakEnd - now) / 1000);
    restTime.textContent = fmtClock((t.breakEnd - now) / 1000);
    p = 1;
  } else {
    remainEl.textContent = fmtClock(durMin(S.focusKey) * 60);
  }
  barEl.style.width = (p * 100) + '%';
  const m = Math.floor(todayMs(now) / 60000), h = Math.floor(m / 60), mm = m % 60;
  todayEl.textContent = '오늘 ' + (h ? h + '시간' + (mm ? ' ' + mm + '분' : '') : mm + '분');
}
function tick(){
  const now = Date.now();
  if (S.timer.phase === 'focus' && now >= S.timer.end) endFocus(true);
  if (S.timer.phase === 'break' && now >= S.timer.breakEnd) exitRest();
  updateHeader();
}
setInterval(tick, 250);

/* ───────── 휴식 화면 ───────── */
let tickRaf = 0;
function tickerSentences(){
  const src = (ta.value.trim() ? ta.value : (cur().left || ''));
  const m = src.match(/[^.?!…⋯\n]+[.?!…⋯]*/g) || [];
  return m.map(s => s.trim()).filter(Boolean).slice(-3);
}
function startTicker(){
  cancelAnimationFrame(tickRaf);
  track.innerHTML = ''; track.style.transform = '';
  const ss = tickerSentences();
  if (!ss.length) return;
  const seg = ss.map((s, i) => `<span class="${i === ss.length - 1 ? 'lit' : 'dim'}">${esc(s)}</span>`).join(' ');
  const unit = document.createElement('span');
  unit.className = 'unit'; unit.innerHTML = seg;
  track.appendChild(unit);
  const w = unit.offsetWidth || 1;
  const need = Math.ceil(ticker.clientWidth / w) + 1;
  for (let i = 0; i < need; i++) track.appendChild(unit.cloneNode(true));
  let off = 0, last = performance.now();
  const loop = t => {
    off -= 55 * (t - last) / 1000; last = t;
    while (off <= -w) off += w;
    track.style.transform = `translateX(${off}px)`;
    tickRaf = requestAnimationFrame(loop);
  };
  tickRaf = requestAnimationFrame(loop);
}
function enterRest(){
  ta.blur();
  ta.readOnly = true;
  restEl.hidden = false;
  updateHeader();
  startTicker();
}
function exitRest(){
  cancelAnimationFrame(tickRaf);
  restEl.hidden = true;
  ta.readOnly = false;
  S.timer = { phase:'idle' };
  save();
  updateHeader();
  if (!$('#write').hidden) ta.focus();
}

/* ───────── 탭 ───────── */
$$('.tab').forEach(b => b.addEventListener('click', () => {
  const tab = b.dataset.tab;
  $$('.tab').forEach(x => x.classList.toggle('on', x === b));
  $('#write').hidden = tab !== 'write';
  $('#settings').hidden = tab !== 'settings';
  if (tab === 'write'){ schedule(true); ta.focus(); }
  else $('#nameInput').value = cur().name;
}));
function showWrite(){ $('.tab[data-tab="write"]').click(); }

/* ───────── 설정 ───────── */
$$('[data-k]').forEach(el => {
  const k = el.dataset.k;
  if (el.type === 'checkbox') el.checked = !!S.settings[k];
  else el.value = S.settings[k];
  const read = () => {
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'number'){
      v = parseFloat(el.value);
      if (isNaN(v)) return null;
      v = Math.min(parseFloat(el.max), Math.max(parseFloat(el.min), v));
    }
    else if (el.dataset.type === 'int') v = parseInt(el.value, 10);
    else v = el.value;
    return v;
  };
  const onEdit = () => {
    const v = read();
    if (v === null) return;
    S.settings[k] = v;
    applySettings();
    saveSoon();
  };
  el.addEventListener(el.tagName === 'SELECT' || el.type === 'checkbox' ? 'change' : 'input', onEdit);
  if (el.type === 'number') el.addEventListener('change', () => { el.value = S.settings[k]; });
});

$('#renameBtn').addEventListener('click', () => {
  const v = $('#nameInput').value.trim();
  if (!v) { $('#nameInput').value = cur().name; return; }
  cur().name = v;
  renderPieceSel();
  save();
});
$('#newBtn').addEventListener('click', () => { if (askNew()) showWrite(); });

/* ───────── 백업 ───────── */
$('#exportBtn').addEventListener('click', () => {
  save();
  const d = new Date();
  const stamp = d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate()) + '-' + pad2(d.getHours()) + pad2(d.getMinutes());
  const data = JSON.stringify({ app:'조각글', version:1, exportedAt:d.toISOString(), state:S }, null, 2);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type:'application/json' }));
  a.download = `조각글-백업-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let st;
    try {
      const obj = JSON.parse(rd.result);
      st = obj && obj.state ? obj.state : obj;
      if (!st || !Array.isArray(st.pieces)) throw 0;
    } catch(_){
      alert('불러올 수 없는 파일입니다. 조각글 백업 파일(JSON)인지 확인해 주세요.');
      return;
    }
    if (!confirm(`이 파일에는 조각글이 ${st.pieces.length}개 있습니다.\n지금 있는 조각글·설정·시간 기록을 모두 지우고 이것으로 바꿉니다.`)) return;
    frozen = true;                       // 새로고침 중 자동 저장이 덮어쓰지 못하게 잠근다
    st.timer = { phase:'idle' };
    localStorage.setItem(KEY, JSON.stringify(st));
    location.reload();
  };
  rd.readAsText(f);
});

/* ───────── 닫힐 때 저장 ───────── */
window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') save(); else tick();
});

/* ───────── 시작 ───────── */
durSel.value = S.focusKey;
applySplit();
applySettings();
renderPieceSel();
ta.value = cur().right || '';
renderLeft();
updateRMeta();
if (S.timer.phase === 'break'){
  if (Date.now() < S.timer.breakEnd) enterRest();
  else S.timer = { phase:'idle' };
}
tick();
if (S.timer.phase !== 'break'){
  ta.focus();
  try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch(e){}
}
schedule(true);
})();
</script>
