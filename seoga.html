<style>
:root{
  --paper:#f2ede1; --paper-2:#e8e0cf; --ink:#23201c; --ink-soft:#736a59; --line:#d6ccb6;
  --seal:#9b3b32; --deep:#3f5566; --moss:#5f6f49; --void:#8c8577; --radius:2px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Gowun Batang',"Apple SD Gothic Neo",Batang,serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

.top{border-bottom:1px solid var(--line);padding:18px 20px 0;position:sticky;top:0;background:var(--paper);z-index:20}
.top-in{max-width:820px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-size:26px;margin:0;letter-spacing:.22em;font-weight:700}
.brand .count{font-size:13px;color:var(--ink-soft)}
nav{display:flex;gap:2px;margin-top:14px;flex-wrap:wrap}
nav button{background:none;border:none;border-bottom:2px solid transparent;padding:8px 14px 10px;color:var(--ink-soft);font-size:15px;letter-spacing:.06em}
nav button.on{color:var(--ink);border-bottom-color:var(--seal)}
nav button:focus-visible{outline:2px solid var(--seal);outline-offset:-2px}
main{max-width:820px;margin:0 auto;padding:24px 20px 96px}
h2.sec{font-size:15px;font-weight:400;color:var(--ink-soft);letter-spacing:.14em;margin:0 0 10px}
.hr{height:1px;background:var(--line);margin:30px 0 22px;border:none}
.note{font-size:14px;color:var(--ink-soft);line-height:1.8}

.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:rgba(155,59,50,.04)}
.rank{font-size:22px;color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}
.row.b1 .rank,.row.b2 .rank,.row.b3 .rank{color:var(--seal)}
.title{font-size:17px;line-height:1.45}
.meta{font-size:13px;color:var(--ink-soft);margin-top:2px}
.place{font-size:12.5px;letter-spacing:.04em;white-space:nowrap;border:1px solid var(--line);padding:2px 8px;border-radius:var(--radius);color:var(--ink-soft);background:var(--paper-2)}
.place.none{border-style:dashed;background:none;color:var(--void)}
button.place{font-family:inherit;cursor:pointer;line-height:inherit}
button.place:active{border-color:var(--seal)}
.badge{font-size:11.5px;padding:1px 5px;border-radius:var(--radius);margin-left:7px;white-space:nowrap;vertical-align:2px;border:1px solid}
.b-gift{border-color:var(--moss);color:var(--moss)}
.b-ref{border-color:var(--ink);color:var(--ink)}
.b-read{border-color:var(--deep);color:var(--deep)}
.b-cand{border-color:var(--seal);color:var(--seal)}
.b-keep{border-color:var(--deep);color:var(--deep)}
.judge .now-book{cursor:default}
.judge .now-book:hover{background:none}
.b-gone{border-color:var(--void);color:var(--void)}
.tagdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.d-best{background:var(--seal)} .d-next{background:var(--deep)} .d-gift{background:var(--moss)} .d-none{background:var(--void)}
.row.gone .title,.row.gone .meta{color:var(--void)}
.hits{padding:0 2px 0 44px;margin:-4px 0 10px}
.hits .lines{margin-top:0;border-top:none}
.hits .lines li:first-child{padding-top:2px}
.lines .lt mark{background:none;color:var(--seal);font-weight:600}
.lines .lr.where{margin-top:3px}
.empty{color:var(--ink-soft);font-size:15px;padding:26px 0;border-bottom:1px solid var(--line)}
.empty b{font-weight:400;color:var(--ink)}

.detail{padding:14px 2px 18px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.015)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts button{background:none;border:1px solid var(--line);padding:6px 12px;border-radius:var(--radius);font-size:14px}
.acts button:hover{border-color:var(--ink-soft)}
.acts button.warn{color:var(--seal);border-color:rgba(155,59,50,.35)}
.acts button.gift{color:var(--moss);border-color:rgba(95,111,73,.4)}

.now-book{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 2px 18px;cursor:pointer}
.now-book:hover{background:rgba(63,85,102,.05)}
.now-t{font-size:26px;line-height:1.4}
.now-a{font-size:15px;color:var(--ink-soft);margin-top:8px}
.now-p{margin-top:12px}

  <div class="top-in">
    <div class="brand"><h1>서가</h1><div class="count" id="brandCount"></div><div class="count" id="syncMark"></div></div>

      <button data-v="list">목록</button>
      <button data-v="shelf">자리</button>
      <button data-v="data">설정</button>
    </nav>
  </div>

<main id="view"></main>
<div id="toast"></div>

<script>
"use strict";
const KEY='seoga.v1', BEST_MAX=365, PAGE=100;
const CAT={
  best:{name:'베스트',dot:'d-best',ask:'어느 책이 더 좋습니까?',sub:'좋은 쪽을 고르면 그 책이 위로 갑니다.'},
  next:{name:'다음 읽을 책',dot:'d-next',ask:'어느 책을 먼저 읽고 싶습니까?',sub:'먼저 읽고 싶은 쪽을 고르면 그 책이 위로 갑니다.'},
  '':{name:'미정',dot:'d-none'}
};

let S=load();
let orderSig=JSON.stringify(S.order);
const RKEY='seoga.read.v1';
let R=loadR(), holdId=null, scanAsk=null; /* scanAsk: 내보내기 전 스캔 확인 시트 {id, after:'bin'|'hold'|'out'|'none', reason} */
/* 주소 끝 #read: 읽기 탭으로 연다(시작의 독서 칸). #solo: 탭 줄 없이 읽기 화면 하나만(홈 화면 '읽기' 아이콘). */
let SOLO=location.hash==='#solo';
let view=(SOLO||location.hash==='#read'||matchMedia('(max-width:600px)').matches)?'read':'home',openId=null,listTab='best',q='',sq='',shown=PAGE,cmp=null,editId=null,composing=false;
let openShelves=new Set(), homeOpen=false, pageFor=null;
let draft=blankDraft();
function blankDraft(loc){ return {title:'',author:'',publisher:'',total:'',category:null,ref:false,gift:false,received:today(),borrowed:false,library:'',due:'',location:loc||'',step:1}; }

/* ── 저장 ── */
function load(){
  let r=null; try{ r=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  const s={books:(r&&r.books)||[],order:{best:r?.order?.best||[],next:r?.order?.next||[]},lastLocation:r?.lastLocation||'',
    orderUpdated:r?.orderUpdated||((r?.order?.best?.length||r?.order?.next?.length)?'2000-01-01T00:00:00.000Z':''),tomb:r?.tomb||{}};
  s.books.forEach(normBook);
  const alive=new Set(s.books.filter(b=>!b.discarded&&!b.held&&!b.binAt).map(b=>b.id));
  s.order.best=s.order.best.filter(id=>alive.has(id));
  s.order.next=s.order.next.filter(id=>alive.has(id));
  return s;
}
function normBook(b){
    if(b.category==='gift'){ b.category=''; b.gift=true; }
    if(typeof b.gift!=='boolean') b.gift=!!b.received;
    if(typeof b.ref!=='boolean') b.ref=false;   /* 자료 딱지(2026년 11월 18일) — 글쓰기 자료로 읽는 책. 분류·순위와 따로 붙는다 */
    if(b.category!=='best'&&b.category!=='next') b.category='';
    if(typeof b.discarded!=='boolean') b.discarded=false;
    b.toDiscard=false;
    if(typeof b.keep!=='boolean') b.keep=false;
    if(!b.binAt) b.binAt='';
    if(!b.prevLocation) b.prevLocation='';
    if(!b.discardedAt) b.discardedAt='';
    if(typeof b.held!=='boolean') b.held=false;
    if(!b.heldAt) b.heldAt='';
    if(typeof b.heldPage!=='number') b.heldPage=0;
    if(!b.heldReason) b.heldReason='';
    if(!b.judgedAt) b.judgedAt='';
    if(typeof b.borrowed!=='boolean') b.borrowed=false;
    if(!b.library) b.library='';
    if(!b.due) b.due='';
    if(!b.returnedAt) b.returnedAt='';
    if(!b.updated) b.updated=b.added||new Date().toISOString();
    if(typeof b.page!=='number') b.page=0;
    if(!b.pageAt) b.pageAt='';
    if(typeof b.total!=='number') b.total=0;
  return b;
}
function save(){
  const sig=JSON.stringify(S.order);
  if(sig!==orderSig){ S.orderUpdated=new Date().toISOString(); orderSig=sig; }
  localStorage.setItem(KEY,JSON.stringify({books:S.books,order:S.order,lastLocation:S.lastLocation,orderUpdated:S.orderUpdated,tomb:S.tomb}));
  queueSync();
}
function touch(b){ b.updated=new Date().toISOString(); }
/* 하루는 자정에 바뀐다(2026년 11월 15일부터, 전에는 새벽 4시. 시작·보태기·달리기·방점과 같게). 상수로 빼지 말 것: today()가 파일 앞부분에서 먼저 불린다. */
function dayDate(t){ const d=new Date(t==null?Date.now():t); return d; }
function dayOf(t){ const d=dayDate(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return dayOf(Date.now()); }
function dayOfYear(){ const d=dayDate(), s=new Date(d.getFullYear(),0,0); return Math.min(365,Math.floor((d-s)/86400000)); }
function fullDayLabel(){ const d=dayDate(), w=['일','월','화','수','목','금','토'][d.getDay()];
  return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+w+'요일'; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function book(id){ return S.books.find(b=>b.id===id); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }

/* ── 갈래 ── */
function ordered(cat){ return S.order[cat].map(book).filter(Boolean); }
/* 『밑줄들』(jar): 서가에 없는 책의 밑줄을 담는 그릇. 앱이 만들고 모든 목록·집계에서 뺀다. */
const JAR='underlines';
function live(){ return S.books.filter(b=>!b.jar&&!b.discarded&&!b.held); }
/* 보류: 읽다가 놓은 책의 기록. 실제 책은 서가에서 치우고, 쪽과 이유만 남긴다. */
function heldBooks(){ return S.books.filter(b=>b.held).sort((a,b)=>(b.heldAt||'').localeCompare(a.heldAt||'')||(b.updated||'').localeCompare(a.updated||'')); }
function holdLine(b){ if(!b.total) return 0; return b.total>=300?100:Math.ceil(b.total/3); }
/* 자료(2026년 11월 19일): 순위 밖으로 밀려 판단 대기에서 ‘자료’로 정한 책(keep — 예전의 ‘보관’)과 담을 때 자료로 정한 책(ref). 화면에서는 모두 ‘자료’다.
   견주기에 나오지 않고(keep은 견줄 때 맨 뒤로 뺀다, ref는 분류가 없어 순위에 없다) 판단 대기에 다시 오르지 않는다. */
function isRef(b){ return !!(b&&(b.ref||b.keep)); }
/* 자료 책 — 자리 순서 */
function refs(){ return live().filter(isRef).sort((a,b)=>locKey(a.location).localeCompare(locKey(b.location),'ko')||(a.title||'').localeCompare(b.title||'','ko')); }
/* 자료 책을 폐기·내놓기 전에 한 번 더 묻는다 */
function refOK(b,what){
  if(!isRef(b)) return true;
  const n=R.reads.filter(x=>!x.gone&&x.bookId===b.id&&(x.kind==='mark'||x.kind==='scan')).length;
  return confirm('‘'+b.title+'’은 자료로 남긴 책입니다'+(b.page?' · '+b.page+'쪽까지':'')+(n?' · 코멘트 '+n+'개':'')+'.\n\n그래도 '+what+'?');
}
function toggleRef(id){
  const b=book(id); if(!b) return;
  b.ref=false; b.keep=false; touch(b); save(); toast('자료 표시를 뗐습니다'); render();
}
function gifts(){ return live().filter(b=>b.gift).sort((a,b)=>(b.received||'').localeCompare(a.received||'')||(b.added||'').localeCompare(a.added||'')); }
function undecided(){ return live().filter(b=>!b.category&&!b.ref)   /* 자료로 정한 책은 미정이 아니다 */
 .sort((a,b)=>(b.added||'').localeCompare(a.added||'')); }
/* 빌린 책: 도서관에서 빌려 와 집에 둔 책. 가진 책이 아니므로 폐기 판단에 끼지 않는다. 반납하면 자리를 비우고 기록으로 남는다. */
function borrowedNow(b){ return !!b.borrowed&&!b.returnedAt; }
function plusDays(n){ const d=dayDate(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function libText(b){ if(!b.borrowed) return '';
  if(b.returnedAt) return '빌려 읽음'+(b.library?' · '+b.library:'');
  return (b.library||'빌린 책')+(b.due?' · '+mdLabel(b.due)+'까지':''); }
function isLate(b){ return borrowedNow(b)&&!!b.due&&b.due<today(); }
function borrowingBooks(){ return live().filter(borrowedNow).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||a.title.localeCompare(b.title,'ko')); }
function returnedBooks(){ return S.books.filter(b=>b.borrowed&&b.returnedAt&&!b.discarded).sort((a,b)=>(b.returnedAt||'').localeCompare(a.returnedAt||'')||(b.updated||'').localeCompare(a.updated||'')); }
function borrowBooks(){ return borrowingBooks().concat(returnedBooks()); }
/* 한 줄·코멘트가 남은 책. 렌더할 때마다 한 번 만든다. */
let TRACE=null;
function traces(){ if(TRACE) return TRACE; const m=new Map();
  R.reads.forEach(x=>{ if(x.gone) return; const k=x.kind==='read'&&x.memory?'l':(x.kind==='mark'||x.kind==='scan')?'m':''; if(!k) return;
    const o=m.get(x.bookId)||m.set(x.bookId,{l:0,m:0}).get(x.bookId); o[k]++; }); return TRACE=m; }
function hasTrace(b){ return traces().has(b.id); }
function traceText(b){ const t=traces().get(b.id); if(!t) return ''; return [t.l?'한 줄 '+t.l:'',t.m?'코멘트 '+t.m:''].filter(Boolean).join(' · '); }
function homeless(){ return live().filter(b=>!b.location&&!(b.borrowed&&b.returnedAt)).sort((a,b)=>(b.added||'').localeCompare(a.added||'')); }
function rankOf(b){ return b.category&&!b.discarded&&!b.held? S.order[b.category].indexOf(b.id)+1 : 0; }
/* 폐기 판단: 순위 밖으로 밀려난 책은 판단을 기다린다. 폐기(처분)하면 폐기 서가로, 자료로 두면 제자리에 라벨(keep)만 붙는다. */
function nextMax(){ return R.settings.nextMax||100; }
function graceDays(){ return R.settings.grace??30; }
function binName(){ return R.settings.binName||'폐기 서가'; }
function inBin(b){ return !b.discarded&&!!b.binAt; }
function outOfRank(b){
  if(b.discarded||b.held||b.binAt||!b.category) return false;
  const r=rankOf(b); return r>0 && r>(b.category==='best'?BEST_MAX:nextMax());
}
function inGrace(b){ const g=graceDays(); if(!g||!b.added) return false; return daysBetween(b.added.slice(0,10),today())<g; }
/* 읽을 책(읽기 대기)은 자리가 없어도 판단을 기다린다(2026년 11월 19일 — 자리 없는 읽을 책은 정상이다). 읽는 중인 책과 자료는 묻지 않는다. */
function isWaiting(b){ return outOfRank(b)&&!b.borrowed&&!isRef(b)&&!(b.page>0)&&(!!b.location||b.category==='next')&&!inGrace(b); }
/* 기록: 순위 밖으로 밀려난, 가지고 있지 않은 책 가운데 한 줄·코멘트를 남겼거나 빌려 읽은 책. 지우지 않고 남긴다. */
function isRecord(b){ return outOfRank(b)&&!b.location&&!borrowedNow(b)&&(b.borrowed||hasTrace(b))&&(b.category!=='next'||b.borrowed); }
function isRemovable(b){ return outOfRank(b)&&!b.location&&!b.borrowed&&!hasTrace(b)&&!inGrace(b)&&b.category!=='next'; }
function recordBooks(){ return live().filter(isRecord).sort((a,b)=>(a.category==='best'?0:1)-(b.category==='best'?0:1)||rankOf(a)-rankOf(b)); }
const locKey=l=>(l||'').replace(/\d+/g,n=>n.padStart(4,'0'));
let skipQ=(()=>{ try{ return JSON.parse(localStorage.getItem('seoga.skip'))||{}; }catch(e){ return {}; } })();
function waiting(){ return live().filter(isWaiting).sort((a,b)=>(skipQ[a.id]||'').localeCompare(skipQ[b.id]||'')||locKey(a.location).localeCompare(locKey(b.location),'ko')||rankOf(b)-rankOf(a)); }
function keptBooks(){ return live().filter(b=>b.keep&&outOfRank(b)).sort((a,b)=>locKey(a.location).localeCompare(locKey(b.location),'ko')); }
function binBooks(){ return live().filter(inBin).sort((a,b)=>(a.binAt||'').localeCompare(b.binAt||'')); }
function dueBooks(){ return binBooks().filter(b=>daysBetween(b.binAt,today())>=7); }
function removables(){ return live().filter(isRemovable).sort((a,b)=>rankOf(b)-rankOf(a)); }
/* 자료(keep)는 저절로 떼지 않는다(2026년 11월 19일). 한 번 자료가 된 책은 다시 판단 대기로 돌아오지 않는다. 직접 뗄 때만 떨어진다. */
function sweepKeep(){}
function discardedBooks(){ return S.books.filter(b=>b.discarded).sort((a,b)=>(b.discardedAt||'').localeCompare(a.discardedAt||'')); }
function locations(){ const m=new Map(); live().forEach(b=>{ if(b.location) m.set(b.location,(m.get(b.location)||0)+1); }); return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ko')); }
function recentLocations(){ const seen=[]; [...live()].sort((a,b)=>(b.added||'').localeCompare(a.added||'')).forEach(b=>{ if(b.location&&!inBin(b)&&!seen.includes(b.location)&&seen.length<6) seen.push(b.location); }); return seen; }
function fieldValues(f){ const m=new Map(); S.books.forEach(b=>{ const v=(b[f]||'').trim(); if(v) m.set(v,(m.get(v)||0)+1); });
  return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko')).map(e=>e[0]); }
function stateLabel(b){
  if(inBin(b)) return `<span class="tagdot d-none"></span>${esc(binName())} · ${esc(b.binAt)}`;
  if(b.discarded) return `<span class="tagdot d-none"></span>폐기함${b.discardedAt?' · '+esc(b.discardedAt):''}`;
  if(b.held) return `<span class="tagdot d-none"></span>보류${b.heldAt?' · '+esc(b.heldAt):''}${b.heldPage?' · '+b.heldPage+'쪽에서':''}`;
  if(!b.category) return '<span class="tagdot d-none"></span>'+(b.ref?'자료 · 순위 없음':'분류 미정');
  return `<span class="tagdot ${CAT[b.category].dot}"></span>${CAT[b.category].name} ${rankOf(b)}위`;
}
function badges(b,rank){
  let s='';
  if(isReading(b)) s+='<span class="badge b-read">읽는 중</span>';
  if(b.gift) s+='<span class="badge b-gift">증정본</span>';
  if(isRef(b)) s+='<span class="badge b-ref">자료</span>';
  if(b.borrowed) s+=`<span class="badge b-lib">${b.returnedAt?'빌려 읽음':'빌린 책'}</span>`;
  if(b.discarded) s+='<span class="badge b-gone">폐기함</span>';
  else if(b.held) s+='<span class="badge b-gone">보류</span>';
  else if(inBin(b)) s+='<span class="badge b-cand">폐기 서가</span>';
  else if(isWaiting(b)) s+='<span class="badge b-cand">판단 대기</span>';
  else if(isRecord(b)) s+='<span class="badge b-gone">기록</span>';
  else if(isRemovable(b)) s+='<span class="badge b-gone">지울 책</span>';
  return s;
}
/* 검색: 제목·지은이·펴낸곳·자리에 더해 한 줄과 코멘트도 본다. 읽기 기록은 검색 한 번에 한 번만 훑는다. 색인은 책별 {t:글, x:기록}. */
let NIDX=null;
function noteIndex(){ const m=new Map(); R.reads.forEach(x=>{ if(x.gone) return; const t=x.kind==='read'?x.memory:(x.kind==='mark'||x.kind==='scan')?x.text:''; if(!t) return; (m.get(x.bookId)||m.set(x.bookId,[]).get(x.bookId)).push({t,x}); }); return m; }
function matches(b,k){ if(!k) return true; if([b.title,b.author,b.publisher,b.location,b.library].some(v=>(v||'').toLowerCase().includes(k))) return true;
  if(!NIDX) NIDX=noteIndex(); return (NIDX.get(b.id)||[]).some(e=>e.t.toLowerCase().includes(k)); }
/* 검색어를 굵게. k가 없으면 그냥 이스케이프. */
function hl(t,k){ t=t||''; if(!k) return esc(t).replace(/\n/g,'<br>'); const lo=t.toLowerCase(), out=[]; let i=0;
  for(;;){ const j=lo.indexOf(k,i); if(j<0){ out.push(esc(t.slice(i))); break; } out.push(esc(t.slice(i,j)),'<mark>'+esc(t.slice(j,j+k.length))+'</mark>'); i=j+k.length; }
  return out.join('').replace(/\n/g,'<br>'); }
/* 검색에 맞는 한 줄과 코멘트를 모두, 쪽 순서로 전문으로. 책 줄 아래에 붙는다. */
function noteHitsHTML(b,k){ if(!k||!NIDX) return ''; const hs=(NIDX.get(b.id)||[]).filter(e=>e.t.toLowerCase().includes(k)).map(e=>e.x); if(!hs.length) return '';
  const lines=hs.filter(x=>x.kind==='read'), marks=hs.filter(x=>x.kind!=='read').sort((a,z)=>((a.page||0)-(z.page||0))||(a.at||'').localeCompare(z.at||''));
  return `<div class="hits"><ul class="lines">${lines.map(x=>`<li><div class="lr">한 줄 · ${rangeText(x)} · ${mdLabel(x.date)}</div><div class="lt">${hl(x.memory,k)}</div></li>`).join('')}${marks.map(x=>markLI(x,k)).join('')}</ul></div>`; }

/* ── 순위 ── */
function removeFromOrder(id){ for(const c of['best','next']) S.order[c]=S.order[c].filter(x=>x!==id); }
/* 견줄 상대에서 빼는 책: 자료로 정한 책(keep)은 맨 뒤로, 읽기 대기 견주기에서는 읽는 중인 책(쪽이 적힌 책)을 맨 앞으로 따로 둔다. */
function cmpSplit(cat,ids){ const pre=[], list=[], post=[];
  ids.forEach(x=>{ const o=book(x); if(o&&o.keep) post.push(x); else if(o&&cat==='next'&&o.page>0) pre.push(x); else list.push(x); });
  return {pre,list,post}; }
function startCompare(id){
  const b=book(id); if(!b||!b.category||b.discarded||b.held) return false;
  const cat=b.category, {pre,list,post}=cmpSplit(cat,S.order[cat].filter(x=>x!==id));
  if(!list.length){ S.order[cat]=pre.concat(id,post); save(); return false; }
  cmp={id,cat,list,pre,post,lo:0,hi:list.length}; render(); return true;
}
function answer(better){ const mid=(cmp.lo+cmp.hi)>>1; if(better) cmp.hi=mid; else cmp.lo=mid+1;
  if(cmp.lo>=cmp.hi) finishCompare(cmp.lo); else render(); }
function finishCompare(pos){
  const {id,cat,list,pre,post}=cmp;
  S.order[cat]=pre.concat(list.slice(0,pos),id,list.slice(pos),post); cmp=null; save();
  let m=CAT[cat].name+' '+(pos+1)+'번째에 놓았습니다';
  if(pre.length+pos+1>(cat==='best'?BEST_MAX:nextMax())) m+=' · 순위 밖이라 판단을 기다리게 됩니다';
  toast(m);
  if(S._queue&&S._queue.length){ nextQueued(); return; }
  view='list'; listTab=cat; shown=PAGE; render(true);
}
function cancelCompare(){
  const {id,cat,list,pre,post}=cmp; S.order[cat]=pre.concat(list,id,post); cmp=null; delete S._queue; save();
  toast('맨 아래에 두었습니다. 나중에 견주기로 자리를 정할 수 있습니다');
  view='list'; listTab=cat; shown=PAGE; render(true);
}
function nextQueued(){
  while(S._queue&&S._queue.length){ const id=S._queue.shift(); removeFromOrder(id); if(startCompare(id)) return; }
  delete S._queue; save(); render();
}

/* ── 그리기 ── */
function render(reset){
  if(SOLO&&view!=='read') leaveSolo();
  document.body.classList.toggle('solo',SOLO);
  const y=window.scrollY;
  TRACE=null;
  if(!cmp) sweepKeep();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const n=live().length;
  document.getElementById('brandCount').textContent = S.books.length? n+'권 · 꽂힌 책 '+live().filter(b=>b.location&&!b.borrowed).length+'권'+(discardedBooks().length?' · 폐기 '+discardedBooks().length+'권':'') : '';
  document.getElementById('view').innerHTML = cmp? '' : ({read:vRead,home:vHome,add:vAdd,list:vList,shelf:vShelf,data:vData}[view])();
  document.querySelectorAll('.veil').forEach(v=>v.remove());
  if(cmp) document.body.insertAdjacentHTML('beforeend',compareHTML());
  if(editId){ document.body.insertAdjacentHTML('beforeend',editHTML()); bindEdit(); }
  if(holdId&&!editId&&!cmp){ document.body.insertAdjacentHTML('beforeend',holdHTML()); const t=document.getElementById('h-reason'); if(t) t.focus(); }
  if(scanAsk&&!editId&&!cmp&&!holdId) document.body.insertAdjacentHTML('beforeend',scanSheetHTML());
  if(leaveAsk&&!editId&&!cmp&&!holdId&&!scanAsk){ document.body.insertAdjacentHTML('beforeend',leaveHTML()); const t=document.getElementById('lv-loc'); if(t) t.focus(); }
  document.querySelectorAll('.pagebar').forEach(p=>p.remove());
  if(pageFor&&!cmp&&!editId&&!holdId&&!scanAsk&&!leaveAsk){
    document.body.insertAdjacentHTML('beforeend',pageBarHTML());
    const i=document.getElementById('pg');
    if(i){ i.focus(); i.select(); i.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); savePage(); } }); }
  }
  if(view==='add') bindAdd();
  window.scrollTo(0, reset?0:y);
}

/* 한눈에 */
/* 밑줄 뽑기: 한눈에 탭 날짜 아래. 저장하지 않는다(뽑힌 것은 메모리에만). 『밑줄들』의 밑줄만 뽑는다(책에 적은 코멘트는 뽑지 않는다, 2026-11-03). */
let drawId=null;
/* 2026년 11월 19일: 책에 적으며 ‘밑줄’로 고른 것(quote:true — 읽기 탭과 아이폰 앱 ‘쪽 적기’의 코멘트/밑줄 선택)도 함께 뽑는다. 책에 붙은 밑줄은 제목·지은이·쪽이 함께 나온다. */
function isQuote(x){ return !!x.quote&&(x.kind==='mark'||x.kind==='scan'); }
function drawPool(){ return R.reads.filter(x=>((x.kind==='mark'&&x.bookId===JAR)||isQuote(x))&&!x.gone&&(x.text||'').trim()); }
function drawHTML(){
  const pool=drawPool(); if(!pool.length){ drawId=null; return ''; }
  const x=drawId&&pool.find(m=>m.id===drawId);
  if(!x){ drawId=null; return `<section class="draw"><button class="ghost" onclick="drawMark()">밑줄 뽑기</button></section>`; }
  const b=book(x.bookId);
  const meta=x.bookId===JAR?mdLabel(x.date):[esc(b?b.title:(x.title||'')),b&&b.author?esc(b.author):'',x.page?x.page+'쪽':'',mdLabel(x.date)].filter(Boolean).join(' · ');
  return `<section class="draw"><p class="dq">${esc(x.text.trim()).replace(/\n/g,'<br>')}</p><div class="dm">${meta}</div>
    <div class="drawbtns"><button class="ghost" onclick="drawMark()">다시 뽑기</button>
    <button class="linkish" onclick="editMark('${x.id}')">고치기</button><button class="linkish" onclick="dropMark('${x.id}',true)">지우기</button></div></section>`;
}
function drawMark(){
  const pool=drawPool(); if(!pool.length) return;
  const rest=pool.length>1?pool.filter(m=>m.id!==drawId):pool;
  drawId=rest[Math.floor(Math.random()*rest.length)].id;
  render();
}
/* 밑줄 적기: 밑줄 뽑기 아래. 여기 적는 밑줄은 모두 『밑줄들』에 들어간다. 쪽은 없다. */
let jarLast=null; /* 방금 적은 밑줄. 다른 화면으로 가면 지운다. */
function jarBook(){ return S.books.find(b=>b.id===JAR); }
function ensureJar(){
  let b=jarBook(); if(b) return b;
  const now=new Date().toISOString();
  b=normBook({id:JAR,title:'밑줄들',author:'',jar:true,category:'',location:'',added:now,updated:now});
  S.books.push(b); save(); return b;
}
function jarHTML(){
  const j=jarBook(), n=j?markItems(JAR).length:0;
  return `<section class="jar"><label for="jar-text">밑줄 적기</label>
    <textarea id="jar-text" rows="2" placeholder="문장 · 저자나 책 제목을 함께 적어도 됩니다" onkeydown="jarKey(event)"></textarea>
    <div class="markfoot">${n?`<button class="linkish" onclick="copyMarks(JAR)">밑줄들 복사 · ${n}개</button>`:'<span></span>'}
      <button class="ghost" style="padding:7px 16px" onclick="addJar()">적기</button></div>
    ${jarLastHTML()}</section>`;
}
function jarLastHTML(){
  const x=jarLast&&R.reads.find(r=>r.id===jarLast&&!r.gone); if(!x) return '';
  return `<ul class="lines"><li><div class="lr">방금 적은 밑줄</div><div class="lt">${esc(x.text).replace(/\n/g,'<br>')}</div>
    <div class="la"><button class="linkish" onclick="editMark('${x.id}')">고치기</button><button class="linkish" onclick="dropMark('${x.id}')">지우기</button></div></li></ul>`;
}
function jarKey(e){ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&!e.isComposing){ e.preventDefault(); addJar(); } }
function addJar(){
  const i=document.getElementById('jar-text'); if(!i) return; const t=i.value.trim();
  if(!t){ toast('밑줄 문장을 적어주세요'); i.focus(); return; }
  ensureJar(); const now=new Date().toISOString();
  const id=uid(); R.reads.push({id,kind:'mark',bookId:JAR,title:'밑줄들',page:0,text:t,date:today(),at:now,updated:now}); jarLast=id;

/* 코멘트 찾기: 내가 쓴 글(코멘트·스캔한 코멘트·한 줄)만 찾는다. 『밑줄들』은 빼고, 책 글자(제목·지은이)도 보지 않는다. 결과는 코멘트가 주인이고 그 아래 책·자리·쪽 한 줄. 누르면 목록에서 그 책이 펼쳐져 그 기록이 표시된다. */
let cq='', cShown=20, hiMark=null;
function cfHits(k){ if(!k) return [];
  return R.reads.filter(x=>!x.gone&&x.bookId!==JAR&&!x.quote&&((x.kind==='read'&&x.memory)||((x.kind==='mark'||x.kind==='scan')&&x.text)))
    .filter(x=>((x.kind==='read'?x.memory:x.text)||'').toLowerCase().includes(k))
    .sort((a,z)=>((z.at||z.start||z.date||'')).localeCompare(a.at||a.start||a.date||'')); }
function cfPlace(b){ if(!b) return '<span class="place none">책 없음</span>';
  const t=b.location?esc(b.location):b.discarded?'폐기':b.held?'보류':b.borrowed&&b.returnedAt?'반납':b.borrowed?'빌린 책':'자리 없음';
  return `<span class="${b.location?'place':'place none'}">${t}</span>`; }
function cfLI(x,k){ const b=book(x.bookId), read=x.kind==='read';
  const pg=read?rangeText(x):(x.page?x.page+'쪽':'쪽 없음');
  return `<li><div class="lt">${hl(read?x.memory:x.text,k)}</div>
    <button class="linkish cfw" onclick="goMark('${x.bookId}','${x.id}')"><b>${esc(b?b.title:(x.title||''))}</b>${b&&b.author?' · '+esc(b.author):''} · ${cfPlace(b)} · ${pg} · ${mdLabel(x.date)}${read?' · 한 줄':x.kind==='scan'?' · 스캔':''}</button>${x.kind==='scan'?scanWhere(x):''}</li>`; }
function cfindHTML(){
  return `<section class="cfind"><label for="cq">코멘트 찾기</label>
    <input type="text" id="cq" value="${esc(cq)}" placeholder="내가 적은 코멘트와 한 줄에서 찾기" oninput="onCfind(this)" autocomplete="off">
    <div id="cfbody">${cfindBody()}</div></section>`;
}
function cfindBody(){
  const k=cq.trim().toLowerCase(); if(!k) return '';
  const h=cfHits(k), part=h.slice(0,cShown);
  if(!h.length) return `<p class="hint" style="margin:12px 0 0">‘${esc(cq.trim())}’이(가) 든 코멘트가 없습니다.</p>`;
  return `<p class="hint" style="margin:12px 0 0">${h.length}개를 찾았습니다.</p><ul class="lines">${part.map(x=>cfLI(x,k)).join('')}</ul>
    ${h.length>part.length?`<div class="rowbtns" style="margin-top:10px"><button class="ghost" onclick="cShown+=20;refreshCfind()">더 보기 · 남은 ${h.length-part.length}개</button></div>`:''}`;
}
function onCfind(t){ cq=t.value; cShown=20; refreshCfind(); }
function refreshCfind(){ const el=document.getElementById('cfbody'); if(el) el.innerHTML=cfindBody(); }

function attachSuggest(id,pool,set){
  const inp=document.getElementById(id), box=document.getElementById(id+'-sugg');
  if(!inp||!box) return;
  const draw=()=>{
    const k=inp.value.trim().toLowerCase();
    if(!k){ box.innerHTML=''; return; }
    const list=pool().filter(v=>v.toLowerCase().includes(k)&&v.toLowerCase()!==k).slice(0,6);
    box.innerHTML=list.length?`<span class="lead">이미 적은 것</span>`+list.map(v=>`<button type="button">${esc(v)}</button>`).join(''):'';
    [...box.querySelectorAll('button')].forEach((el,i)=>{
      el.onpointerdown=ev=>{ ev.preventDefault(); inp.value=list[i]; set(list[i]); box.innerHTML=''; inp.focus(); };
    });
  };
  inp.addEventListener('input',draw);
  inp.addEventListener('blur',()=>setTimeout(()=>{ box.innerHTML=''; },150));
}
function bindAdd(){

    e.addEventListener('keydown',ev=>{ if(ev.key!=='Enter'||ev.isComposing) return; ev.preventDefault();
      if(id==='f-title') document.getElementById('f-author').focus();
      else if(id==='f-author') document.getElementById('f-pub').focus();
      else if(id==='f-pub') document.getElementById('f-total').focus(); else addStep1(); });
  });
  const r=document.getElementById('f-recv'); if(r) r.addEventListener('input',()=>draft.received=r.value);

  attachSuggest('f-lib',()=>fieldValues('library'),v=>draft.library=v);
}

/* ── 내보내기 전 스캔 (2026-11-03) ──
   가진 책의 코멘트는 스캔 없이 적는다. 그 책이 서가를 떠날 때(폐기 서가로, 보류로, 내놓을 때)가 본문을 남길 마지막 기회라

function scanPage(pg){

/* 책을 아주 지울 때 그 책의 한 줄과 코멘트도 지운다. 시간과 쪽 기록은 남긴다. */
function dropTraces(ids){
  const set=new Set(ids), now=new Date().toISOString(); let n=0;

      <span class="note">서가 ${locs.length}칸</span>
    </div>

function shelfBody(){
  const k=sq.trim().toLowerCase(), searching=!!k; NIDX=null;
  const groups=locations().map(([l,c])=>({name:l,count:c,items:live().filter(b=>b.location===l&&matches(b,k)).sort((a,b)=>a.title.localeCompare(b.title,'ko'))}));
  const none=homeless().filter(b=>matches(b,k));
  const gone=searching?discardedBooks().filter(b=>matches(b,k)):[];
  const held=searching?heldBooks().filter(b=>matches(b,k)):[];
  const rec=searching?recordBooks().filter(b=>matches(b,k)):[];
  const ret=searching?live().filter(b=>b.borrowed&&b.returnedAt&&!isRecord(b)&&matches(b,k)):[];
  let found=none.length+gone.length+held.length+rec.length+ret.length; groups.forEach(g=>found+=g.items.length);
  if(searching&&!found) return `<div class="empty">‘${esc(sq)}’와 맞는 책이 어느 자리에도 없습니다.</div>`;
  const li=b=>`<li onclick="findBook('${b.id}')"><span class="tagdot ${b.category?CAT[b.category].dot:'d-none'}"></span>${esc(b.title)}${badges(b)}<span class="m"> ${esc(b.author||'')}</span></li>`;
  const bar=items=>{
    const t=items.length||1, n=c=>items.filter(b=>b.category===c).length;
    return `<div class="propbar">
      <span style="width:${n('best')/t*100}%;background:var(--seal)"></span>
      <span style="width:${n('next')/t*100}%;background:var(--deep)"></span>
      <span style="width:${n('')/t*100}%;background:var(--void)"></span></div>`;
  };
  const block=(key,name,items,tail,all)=>{
    const open=searching||openShelves.has(key);
    return `<div class="shelfrow" onclick="toggleShelf('${esc(key).replace(/'/g,'&#39;')}')">
        <div class="sname"><span class="mark">${open?'−':'+'}</span>${name}</div>
        ${bar(all||items)}
        <div class="n">${tail}</div></div>
      ${open?`<div class="shelf-body"><ul>${items.map(li).join('')}</ul></div>`:''}`;
  };
  let out='';
  groups.forEach(g=>{ if(searching&&!g.items.length) return;
    out+=block(g.name,esc(g.name),g.items, searching?`${g.items.length}권 찾음 · 모두 ${g.count}권`:`${g.count}권`,
      live().filter(b=>b.location===g.name)); });
  if(none.length) out+=block('__none__','자리 없음',none, searching?`${none.length}권 찾음`:`${homeless().length}권`,none);
  if(ret.length) out+=block('__ret__','빌려 읽음',ret,`${ret.length}권 찾음`,ret);
  if(held.length) out+=block('__hold__','보류',held,`${held.length}권 찾음`,held);
  if(rec.length) out+=block('__rec__','기록',rec,`${rec.length}권 찾음`,rec);
  if(gone.length) out+=block('__gone__','폐기함',gone,`${gone.length}권 찾음`,gone);
  return (searching?`<p class="note" style="margin:0 0 10px">${found}권을 찾았습니다.</p>`:'')+out;
}

/* 계산에 쓰는 읽기는 시작한 날부터. 그 전의 기록은 한 줄 목록에만 남는다. */
function sessions(){ const sd=R.settings.startDate||''; return sessionsAll().filter(x=>(x.date||'')>=sd); }
/* 코멘트(mark)와 스캔한 코멘트(scan): 읽는 중에 책에 붙여 두는 기록. 지우면 gone 표시만 남긴다(다른 기기에 지움을 전하려고). */
function markItems(id){ return R.reads.filter(x=>(x.kind==='mark'||x.kind==='scan')&&x.bookId===id&&!x.gone)
  .sort((a,b)=>((a.page||0)-(b.page||0))||(a.at||'').localeCompare(b.at||'')); }
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function runShortcut(name,text){
  let url='shortcuts://'+(R.settings.back?'x-callback-url/':'')+'run-shortcut?name='+encodeURIComponent(name)
    +'&input=text&text='+encodeURIComponent(text);
  if(R.settings.back) url+='&x-success='+encodeURIComponent(location.href.split('#')[0]+(SOLO?'#solo':''));
  location.href=url;
}
/* ── 읽기 (2026년 11월 19일: 시간 측정을 빼고 쪽수 기록으로) ──
   독서에는 시작도 끝도 없다. 쪽수가 적힌 책이 읽는 중인 책이고, 읽을 책 가운데 쪽이 아직 없는 책이 읽기 대기다.
   현재 쪽이 바뀔 때마다 쪽수 기록(kind:'page') 한 줄을 남긴다: {id, kind, bookId, title, date, at, from(적기 전 쪽), page(적은 뒤 쪽), end, updated}.
   같은 날 같은 책은 한 줄을 덮어쓴다(from은 그대로 — 잘못 적은 쪽을 같은 날 고치면 바로잡힌다).
   하루 읽은 쪽수 = 그날 줄들의 (page-from) 합이고 0 아래로는 내려가지 않는다. 옛 읽기 기록(kind:'read')은 지우지 않고, toPage-fromPage로 함께 센다.
   시작·방점이 이 줄들을 읽는다(서가_시작연결.md). 필드 이름을 바꾸면 두 앱도 고친다. */
function isReading(b){ return !!b&&!b.jar&&!b.discarded&&!b.held&&!b.binAt&&b.page>0; }
function logPage(b,to,end){
  const d=today(), now=new Date().toISOString();
  let x=R.reads.find(r=>r.kind==='page'&&r.bookId===b.id&&r.date===d&&!r.end&&!r.gone);
  if(x) x.page=to;
  else { const base='pg-'+b.id+'-'+d;
    x={id:R.reads.some(r=>r.id===base)?base+'-'+uid():base,kind:'page',bookId:b.id,title:b.title,date:d,from:b.page||0,page:to}; R.reads.push(x); }
  x.at=now; x.updated=now; if(end) x.end=end;
  b.page=to; b.pageAt=to?d:''; touch(b);
}
function setPageOf(b,to){ if(to===(b.page||0)) return false; logPage(b,to); save(); saveR(); return true; }
/* 읽는 중 목록에서 뺀다. 완독이면 마지막 쪽까지 올려 적는다. 오늘 줄에 끝 표시(end)를 남기고 책의 쪽은 0으로 돌린다 — 다시 읽으면 0쪽에서 새로 출발한다. */
function closeOut(b,kind){
  if(kind==='done'&&b.total&&b.page!==b.total) logPage(b,b.total);
  const d=today(), now=new Date().toISOString();
  let x=R.reads.find(r=>r.kind==='page'&&r.bookId===b.id&&r.date===d&&!r.end&&!r.gone);
  if(!x){ x={id:'pg-'+b.id+'-'+d+'-'+uid(),kind:'page',bookId:b.id,title:b.title,date:d,from:b.page||0,page:b.page||0}; R.reads.push(x); }
  x.end=kind; x.at=now; x.updated=now;
  b.page=0; b.pageAt=''; touch(b);
}
function dayPages(){ const m=new Map();
  R.reads.forEach(x=>{ if(x.gone||!x.date) return; let d;
    if(x.kind==='page') d=(x.page||0)-(x.from||0); else if(x.kind==='read') d=Math.max(0,(x.toPage||0)-(x.fromPage||0)); else return;
    m.set(x.date,(m.get(x.date)||0)+d); });
  return m; }
/* 하루 평균: 오늘까지 최근 14일 동안 읽은 쪽수의 합 ÷ 날수. 읽지 않은 날도 날수에 든다. 서가를 쓰기 시작한 날(startDate) 전의 날은 세지 않는다. */
function avgPages(){
  const m=dayPages(), d=dayDate(), sd=R.settings.startDate||''; let sum=0, n=0;
  for(let i=0;i<14;i++){ const k=dstr(d); if(sd&&k<sd) break; sum+=Math.max(0,m.get(k)||0); n++; d.setDate(d.getDate()-1); }
  return Math.round(sum/Math.max(1,n));
}
/* 읽는 중: 마지막으로 쪽수나 코멘트를 적은 책이 맨 위 */
function lastActs(){ const m=new Map();
  R.reads.forEach(x=>{ if(x.gone||!(x.kind==='page'||x.kind==='mark'||x.kind==='scan')) return; const t=x.at||''; if(t>(m.get(x.bookId)||'')) m.set(x.bookId,t); });
  return m; }
function readingBooks(){ const m=lastActs(), k=b=>m.get(b.id)||b.pageAt||'';
  return S.books.filter(isReading).sort((a,z)=>k(z).localeCompare(k(a))||a.title.localeCompare(z.title,'ko')); }
/* 읽기 대기: 읽을 책 가운데 아직 쪽이 없는 책. 읽고 싶은 책 견주기의 순위대로. */
function waitBooks(){ return ordered('next').filter(b=>!(b.page>0)&&!isRef(b)); }

let readOpen=null, readScan=null, readQuote=false, waitShown=20, leaveAsk=null; /* leaveAsk: 완독·그만 읽기 시트 {id, kind:'done'|'quit', step:'ask'|'loc'|'ref'} */
function vRead(){
  const rs=readingBooks(), ws=waitBooks();
  let out=soloSbHTML();
  if(!rs.length&&!ws.length) return out+`<div class="empty" style="border:none;padding-top:0"><b>읽는 책이 없습니다.</b><br>읽을 책을 담고 쪽수를 적으면 여기에 놓입니다.
      <div class="rowbtns"><button class="primary" onclick="go('add')">읽을 책 담기</button></div></div>`+tailHTML();
  out+=`<p class="avgline">하루 평균<b>${avgPages()}</b>쪽</p>`;
  out+=`<section><h2 class="sec"><span class="tagdot d-next"></span>읽는 중${rs.length?' · '+rs.length+'권':''}</h2>
      ${rs.length?`<ul class="plain rlist">${rs.map(b=>readLI(b,true)).join('')}</ul>`:`<div class="empty">쪽수를 적기 시작한 책이 여기에 놓입니다.</div>`}</section>`;
  if(ws.length){ const part=ws.slice(0,waitShown);
    out+=`<section class="para"><h2 class="sec"><span class="tagdot d-none"></span>읽기 대기 · ${ws.length}권</h2>
      <ul class="plain rlist">${part.map(b=>readLI(b,false)).join('')}</ul>
      ${ws.length>part.length?`<div class="rowbtns"><button class="ghost" onclick="waitShown+=20;render()">더 보기 · 남은 ${ws.length-part.length}권</button></div>`:''}</section>`; }
  return out+tailHTML();
}
function readLI(b,reading){
  const open=readOpen===b.id;
  return `<li onclick="toggleRead('${b.id}')"><span>${esc(b.title)}</span>${reading?`<span class="m">${b.page}쪽</span>`:''}</li>${open?readPanel(b,reading):''}`;
}
function readScanWanted(b){ return readScan===null? !!(b&&borrowedNow(b)) : readScan; }
function readPanel(b,reading){
  const ent=fn=>"if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();"+fn+"('"+b.id+"')}";
  return `<li class="rpanel" onclick="event.stopPropagation()">
    <div class="rrow"><label for="rp-page">쪽수 적기</label>
      <input type="number" inputmode="numeric" id="rp-page" value="${b.page||''}" placeholder="쪽" aria-label="현재 쪽" onkeydown="${ent('readSetPage')}"><span>쪽</span>
      <button class="ghost" onclick="readSetPage('${b.id}')">적기</button></div>
    <div class="markbox"><div class="choices seg"><button class="choice${readQuote?'':' on'}" data-c="next" onclick="setReadQuote(false)">코멘트</button><button class="choice${readQuote?' on':''}" data-c="best" onclick="setReadQuote(true)">밑줄</button></div>
      <div class="markrow"><div class="pg"><input type="number" inputmode="numeric" id="rm-page" placeholder="쪽" aria-label="쪽"></div>
        <div class="tx"><textarea id="rm-text" rows="2" placeholder="${readQuote?'책의 문장':'이 쪽에 대한 코멘트'}" aria-label="${readQuote?'밑줄':'코멘트'}" onkeydown="${ent('readAddMark')}"></textarea></div></div>
      <div class="markfoot"><div class="hint">적은 쪽이 현재 쪽보다 뒤이면 현재 쪽도 함께 올라갑니다</div>
        <button class="ghost" style="padding:7px 16px" onclick="readAddMark('${b.id}')">적기</button></div>
      <div class="markscan"><button class="toggle${readScanWanted(b)?' on':''}" onclick="toggleReadScan('${b.id}')"><span class="box"></span>이 쪽을 스캔한다${borrowedNow(b)?' · 빌린 책':''}</button></div></div>
    ${reading?`<div class="acts"><button onclick="finishRead('${b.id}')">완독</button><button onclick="quitRead('${b.id}')">그만 읽기</button></div>`:''}
  </li>`;
}
function toggleRead(id){ readOpen=readOpen===id?null:id; readScan=null; readQuote=false; render(); }
/* 코멘트 / 밑줄 선택(2026년 11월 19일): 밑줄은 책의 문장이다. 같은 기록(kind:'mark'|'scan')에 quote:true만 더 붙고, 한눈에 탭의 밑줄 뽑기에 나온다. 적고 나면 코멘트로 돌아간다. */
function keepReadInputs(fn){ const p=document.getElementById('rm-page'), t=document.getElementById('rm-text'), pv=p?p.value:'', tv=t?t.value:''; fn();
  const p2=document.getElementById('rm-page'), t2=document.getElementById('rm-text'); if(p2) p2.value=pv; if(t2){ t2.value=tv; t2.focus(); } }
function setReadQuote(on){ keepReadInputs(()=>{ readQuote=!!on; render(); }); }
function readSetPage(id){
  const b=book(id), el=document.getElementById('rp-page'); if(!b||!el) return;
  const v=parseInt(el.value,10), to=v>0?v:0;
  if(!setPageOf(b,to)){ toast('쪽이 그대로입니다'); return; }
  if(!to) readOpen=null;
  toast(to?to+'쪽':'쪽을 지웠습니다 · 원래 있던 곳으로 돌아갑니다'); render();
}
function toggleReadScan(id){
  const p=document.getElementById('rm-page'), t=document.getElementById('rm-text'), pv=p?p.value:'', tv=t?t.value:'';
  readScan=!readScanWanted(book(id)); render();
  const p2=document.getElementById('rm-page'), t2=document.getElementById('rm-text'); if(p2) p2.value=pv; if(t2){ t2.value=tv; t2.focus(); }
}
/* 읽기 탭에서 적는 코멘트: 목록 탭의 '코멘트 적기'와 같은 기록(kind:'mark'|'scan')을 남기고, 적은 쪽이 현재 쪽보다 뒤이면 현재 쪽도 올린다.
   목록 탭에서 적는 코멘트(addMarkTo)는 지금처럼 쪽을 건드리지 않는다(훑으며 적는 것은 독서가 아니다). */
function readAddMark(id){
  const b=book(id), i=document.getElementById('rm-text'); if(!b||!i) return; const t=i.value.trim();
  const qt=readQuote, what=qt?'밑줄':'코멘트';
  if(!t){ toast(qt?'밑줄 문장을 적어주세요':'코멘트를 적어주세요'); i.focus(); return; }
  const page=pageVal('rm-page'), now=new Date().toISOString(), scan=readScanWanted(b);
  const rec={id:uid(),kind:scan?'scan':'mark',bookId:b.id,title:b.title,page,text:t,date:today(),at:now,updated:now}; if(qt) rec.quote=true;
  R.reads.push(rec); readQuote=false;
  if(page>(b.page||0)){ logPage(b,page); save(); }
  saveR(); render();
  if(!scan){ toast(what+'을 책에 저장했습니다'); return; }
  toast(what+'을 저장했습니다 · 스캔 단축어를 엽니다');
  runShortcut(R.settings.sc.scan||'스캔',scanTag(b.title)+'|'+(page||''));
}
/* 완독 · 그만 읽기: 읽는 중 목록에서 빼면서 남기기와 처분 가운데 하나를 묻는다.
   남기기 — 자리를 정하고(이미 있으면 묻지 않는다) 베스트 견주기에 올린다. 자료로 남긴 책이면 자료로 둘지 견주기에 올릴지만 묻는다.
   처분 — 폐기 서가로 보낸다(toBin: 7일 뒤 내놓으라고 알린다. 내보내기 전 스캔 시트도 그대로 뜬다). 책 기록과 코멘트는 남는다.
   빌린 책은 가진 책이 아니라 묻지 않는다: 완독이면 베스트 견주기로, 그만 읽기면 보류(반납)로. */
function finishRead(id){
  const b=book(id); if(!b) return;
  if(!b.total){ const v=prompt('‘'+b.title+'’의 마지막 쪽은 몇 쪽입니까',b.page?String(b.page):''); if(v===null) return;
    const n=parseInt(v,10); if(!(n>0)){ toast('마지막 쪽을 숫자로 적어주세요'); return; }
    b.total=n; touch(b); save(); }
  leaveStart(b,'done');
}
function quitRead(id){ const b=book(id); if(b) leaveStart(b,'quit'); }
function leaveStart(b,kind){
  if(b.borrowed){
    if(kind==='quit'){ startHold(b.id); return; }
    closeOut(b,'done'); saveR(); readOpen=null; toBest(b,borrowedNow(b)?' · 도서관에 갖다주면 ‘반납했다’를 누르세요':''); return;
  }
  leaveAsk={id:b.id,kind,step:'ask'}; render();
}
function leaveHTML(){
  const a=leaveAsk, b=book(a.id); if(!b) return '';
  const head=`<h2 class="sec">${a.kind==='done'?'완독':'그만 읽기'}</h2><p class="ask" style="margin:0 0 6px">${esc(b.title)}</p>`;
  const cancel=`<button class="linkish" onclick="leaveAsk=null;render()">그만두기</button>`;
  let body;
  if(a.step==='loc'){ const rec=recentLocations();
    body=`<p class="note" style="margin:0 0 18px">남길 자리(서가와 칸)를 정합니다.</p>
      <div class="field"><label>서가 위치</label><input type="text" id="lv-loc" placeholder="예: A-3" onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();leaveKeep()}">
        ${rec.length?`<div class="recent">${rec.map(l=>`<button onclick="document.getElementById('lv-loc').value=this.textContent">${esc(l)}</button>`).join('')}</div>`:''}</div>
      <div class="rowbtns"><button class="primary" onclick="leaveKeep()">남기기</button>
        <button class="linkish" onclick="leaveAsk.step='ask';render()">뒤로</button>${cancel}</div>`; }
  else if(a.step==='ref'){
    body=`<p class="note" style="margin:0 0 18px">자료로 남긴 책입니다${b.location?' · '+esc(b.location):''}. 자료로 그대로 둘지, 베스트 견주기에 올릴지 고릅니다.</p>
      <div class="rowbtns"><button class="primary" onclick="leaveDo('ref')">자료로 둔다</button>
        <button class="ghost" onclick="leaveDo('best')">견주기에 올린다</button>
        <button class="linkish" onclick="leaveAsk.step='ask';render()">뒤로</button>${cancel}</div>`; }
  else {
    body=`<p class="note" style="margin:0 0 18px">${a.kind==='done'?b.total+'쪽까지 읽은 것으로 적고 ':''}읽는 중 목록에서 뺍니다.${a.kind==='quit'?' 지금까지 적은 쪽수는 평균에 그대로 남습니다.':''} 이 책을 남길지 처분할지 고릅니다.</p>
      <div class="rowbtns"><button class="primary" onclick="leavePick('keep')">남기기</button>
        <button class="ghost" onclick="leavePick('bin')">처분</button>${cancel}</div>
      <p class="hint">남기면 ${isRef(b)?'자료로 둘지 견주기에 올릴지 묻습니다':b.location?'지금 자리('+esc(b.location)+') 그대로 베스트 견주기에 올립니다':'자리를 정해 베스트 견주기에 올립니다'}. 처분하면 폐기 서가로 가고 7일 뒤 내놓으라고 알립니다. 코멘트는 그대로 남습니다.</p>`; }
  return `<div class="veil"><div class="sheet" style="max-width:520px">${head}${body}</div></div>`;
}
function leavePick(w){
  const a=leaveAsk, b=a&&book(a.id); if(!b){ leaveAsk=null; render(); return; }
  if(w==='bin'){ leaveAsk=null; readOpen=null;
    if(a.kind==='done'&&b.total&&b.page!==b.total){ logPage(b,b.total); save(); saveR(); }
    toBin(b.id); return; }
  if(isRef(b)){ a.step='ref'; render(); return; }
  if(!b.location){ a.step='loc'; render(); return; }
  leaveDo('best');
}
function leaveKeep(){
  const a=leaveAsk, b=a&&book(a.id), el=document.getElementById('lv-loc'); if(!b||!el) return;
  const v=el.value.trim(); if(!v){ toast('자리를 적어주세요'); el.focus(); return; }
  b.location=v; S.lastLocation=v; leaveDo('best');
}
function leaveDo(w){
  const a=leaveAsk, b=a&&book(a.id); leaveAsk=null; if(!b){ render(); return; }
  readOpen=null; closeOut(b,a.kind); saveR();
  if(w==='ref'){ save(); toast('자료로 두었습니다'+(b.location?' · '+b.location:'')); render(); return; }
  toBest(b,'');
}
/* 남긴 책을 베스트 견주기에 올린다. 이미 베스트에 있는 책(다시 읽은 책)은 순위를 그대로 둔다. */
function toBest(b,tail){
  if(b.category==='best'&&!isRef(b)){ save(); toast('읽는 중에서 뺐습니다 · 베스트 '+rankOf(b)+'위 그대로'+tail); render(); return; }
  b.category='best'; b.ref=false; b.keep=false; touch(b); removeFromOrder(b.id); S.order.best.push(b.id); save();
  if(!startCompare(b.id)){ toast('베스트에 올렸습니다'+tail); render(); }
  else { S.order.best=S.order.best.filter(x=>x!==b.id); if(tail) toast(tail.replace(/^ · /,'')); }
}
/* 읽기 첫 화면의 아래쪽: 읽기 전용 화면(#solo)에서는 밑줄 뽑기. 서가에서는 아무것도 두지 않는다(달력과 통계는 2026년 11월 19일에 없앴다). */
function tailHTML(){ if(!SOLO) return ''; return `<div class="solo-draw">${drawHTML()}${jarHTML()}${cfindHTML()}</div>`; }
function soloSbHTML(){
  if(!SOLO||sbCfg.url) return '';
  return `<section class="solo-sb"><p class="note" style="margin-top:0">이 화면은 아직 서가 기록과 이어지지 않았습니다. 서가 설정에 넣은 Supabase 주소와 anon 키를 넣으면 책과 기록을 받아옵니다.</p>
    <div class="field"><label>프로젝트 주소</label><input type="text" id="s-url" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label>anon 키</label><input type="password" id="s-key" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="rowbtns"><button class="primary" onclick="sbSave()">연결하기</button></div></section><hr class="hr">`;
}
function markHint(a){ const n=(a.marks||0)+(a.scans||0); return n?'이번에 적은 코멘트 '+n+'개'+(a.scans?' · 스캔 '+a.scans:''):'여기에 적으면 책에 저장됩니다'; }
function pageVal(id){ const n=parseInt((document.getElementById(id)||{}).value,10); return n>0?n:0; }


/* 읽기 설정 · 동기화 화면 (보관 탭 아래) */
function vSettings(){
  const st=R.settings;
  return `<hr class="hr"><h2 class="sec">읽기</h2>

function saveDiscardSet(){
  const st=R.settings, g=id=>document.getElementById(id);
  const nm=parseInt(g('s-nmax').value,10), gr=parseInt(g('s-grace').value,10), bn=g('s-bin').value.trim()||'폐기 서가';
  if(!(nm>0)){ toast('다음 읽을 책 순위를 권수로 적어주세요'); return; }
  if(!(gr>=0)){ toast('유예 기간을 날수로 적어주세요'); return; }
  const before=waiting().length+removables().length, old=[st.nextMax,st.grace];
  st.nextMax=nm; st.grace=gr;
  const after=waiting().length+removables().length;
  if(after>before&&!confirm('이렇게 바꾸면 '+(after-before)+'권이 새로 판단을 기다리게 됩니다. 저장할까요?')){ st.nextMax=old[0]; st.grace=old[1]; render(); return; }
  if(bn!==st.binName){ const was=st.binName; live().forEach(b=>{ if(inBin(b)&&b.location===was){ b.location=bn; touch(b); } }); st.binName=bn; save(); }
  st.updated=new Date().toISOString(); saveR(); toast('저장했습니다'); render();
}

/* ── 동기화 ── 책·읽기 기록은 한 줄씩, 순서와 최소 시간은 따로 둔다. 더 나중에 고친 쪽이 이긴다. */
const SQL=`create table if not exists seoga_books (id text primary key, data jsonb not null, updated_at timestamptz not null default now());
create table if not exists seoga_reads (id text primary key, data jsonb not null, updated_at timestamptz not null default now());
create table if not exists seoga_meta  (id text primary key, data jsonb not null, updated_at timestamptz not null default now());

alter table seoga_books enable row level security;
alter table seoga_reads enable row level security;
alter table seoga_meta  enable row level security;

drop policy if exists "seoga open" on seoga_books;
drop policy if exists "seoga open" on seoga_reads;
drop policy if exists "seoga open" on seoga_meta;
create policy "seoga open" on seoga_books for all using (true) with check (true);
create policy "seoga open" on seoga_reads for all using (true) with check (true);
create policy "seoga open" on seoga_meta  for all using (true) with check (true);

do $$
declare t text;
begin
  foreach t in array array['seoga_books','seoga_reads','seoga_meta'] loop
    if not exists (select 1 from pg_publication_tables
      where pubname='supabase_realtime' and schemaname='public' and tablename=t) then
      execute format('alter publication supabase_realtime add table public.%I', t);
    end if;
  end loop;
end $$;`;
const SBKEY='seoga.sb', MKEY='seoga.mark';
let sbCfg=(()=>{ try{ return JSON.parse(localStorage.getItem(SBKEY))||{}; }catch(e){ return {}; } })();
let MARK=(()=>{ try{ return JSON.parse(localStorage.getItem(MKEY))||null; }catch(e){ return null; } })()||{b:{},r:{},order:'',min:''};
let SB=null, syncTimer=null, syncing=false, syncAgain=false, syncState='', syncErr='';
function saveMark(){ try{ localStorage.setItem(MKEY,JSON.stringify(MARK)); }catch(e){} }
function syncLabel(){
  if(!sbCfg.url) return '연결하지 않았습니다. 기록은 이 기기에만 있습니다.';
  return {on:'동기화되어 있습니다.',busy:'맞추는 중입니다.',err:'동기화하지 못했습니다. '+(syncErr||'인터넷이 끊겼다면 이어지는 대로 다시 맞춥니다.'),'':'연결을 기다리는 중입니다.'}[syncState];
}
function setSync(st){
  syncState=st;
  const el=document.getElementById('syncMark');
  if(el){ el.textContent=sbCfg.url?({on:'· 동기화됨',busy:'· 맞추는 중',err:'· 동기화 안 됨'}[st]||''):''; el.classList.toggle('err',st==='err'); }
  const s=document.getElementById('sync-st'); if(s) s.textContent=syncLabel();
}
function queueSync(){ if(!SB) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>pushDirty(),900); }
async function sbConnect(loud){
  if(!sbCfg.url||!sbCfg.key){ setSync(''); return false; }
  setSync('busy');
  try{
    const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    SB=mod.createClient(sbCfg.url,sbCfg.key);
  }catch(e){ SB=null; syncErr='Supabase를 불러오지 못했습니다.'; setSync('err'); if(loud) toast('연결하지 못했습니다 · 인터넷을 확인하세요'); return false; }
  const ok=await syncAll(loud);
  SB.channel('seoga-'+uid())
    .on('postgres_changes',{event:'*',schema:'public',table:'seoga_books'},p=>applyRows('b',[p.new]))
    .on('postgres_changes',{event:'*',schema:'public',table:'seoga_reads'},p=>applyRows('r',[p.new]))
    .on('postgres_changes',{event:'*',schema:'public',table:'seoga_meta'},p=>applyRows('m',[p.new]))
    .subscribe();
  return ok;
}
async function fetchAll(t){
  let out=[], from=0;
  for(;;){ const {data,error}=await SB.from(t).select('id,data').range(from,from+999); if(error) throw error;
    out=out.concat(data); if(data.length<1000) break; from+=1000; }
  return out;
}
async function syncAll(loud){
  if(!SB){ if(sbCfg.url) return sbConnect(loud); return false; }
  if(syncing){ syncAgain=true; return true; }
  syncing=true; setSync('busy'); let ok=true;
  try{
    const [bk,rd,mt]=await Promise.all(['seoga_books','seoga_reads','seoga_meta'].map(fetchAll));
    const c1=applyRows('b',bk,true), c2=applyRows('r',rd,true), c3=applyRows('m',mt,true);
    afterApply(c1||c2||c3);
    await pushDirty(true);
    syncErr=''; setSync('on');
    if(loud) toast('맞췄습니다');
  }catch(e){
    ok=false;
    const miss=e&&(e.code==='42P01'||e.code==='PGRST205'||/does not exist|schema cache/i.test(e.message||''));
    syncErr=miss?'Supabase에 서가 표가 없습니다. 아래 SQL을 먼저 실행하세요.':'';
    setSync('err'); if(loud) toast(miss?'서가 표가 없습니다 · SQL을 먼저 실행하세요':'동기화하지 못했습니다');
  }
  syncing=false;
  if(syncAgain){ syncAgain=false; syncAll(); }
  return ok;
}
function applyRows(kind,rows,bulk){
  let changed=false;
  rows.forEach(row=>{
    if(!row||!row.data) return; const d=row.data, id=row.id, up=d.updated||'';
    if(kind==='b'){
      const loc=S.books.find(x=>x.id===id), tomb=S.tomb[id]||'';
      if(up>(MARK.b[id]||'')) MARK.b[id]=up;
      if(d.purged){
        if(loc&&(loc.updated||'')<=up){ S.books=S.books.filter(x=>x.id!==id); removeFromOrder(id); changed=true; }
        if(up>tomb) S.tomb[id]=up; return;
      }
      if(tomb&&tomb>=up) return;
      if(!loc){ S.books.push(normBook(Object.assign({},d))); changed=true; }
      else if(up>(loc.updated||'')){ Object.keys(loc).forEach(k=>delete loc[k]); Object.assign(loc,normBook(Object.assign({},d))); changed=true; }
    } else if(kind==='r'){
      if(up>(MARK.r[id]||'')) MARK.r[id]=up;
      const i=R.reads.findIndex(x=>x.id===id);
      if(i<0){ R.reads.push(d); changed=true; }
      else if(up>(R.reads[i].updated||'')){ R.reads[i]=d; changed=true; }
    } else if(id==='order'){
      if(up>(MARK.order||'')) MARK.order=up;
      if(up>(S.orderUpdated||'')){ S.order={best:d.best||[],next:d.next||[]}; S.orderUpdated=up; orderSig=JSON.stringify(S.order); changed=true; }
    } else if(id==='active'){
      if(up>(MARK.active||'')) MARK.active=up;
      if(up>(R.activeUpdated||'')){ R.active=d.active||null; R.activeUpdated=up; activeSig=JSON.stringify(R.active); changed=true; }
    } else if(id==='settings'){
      if(up>(MARK.min||'')) MARK.min=up;
      if(up>(R.settings.updated||'')){
        if(d.target>0) R.settings.target=d.target; if(d.min>0) R.settings.min=d.min;
        if(d.adjustedAt) R.settings.adjustedAt=d.adjustedAt;
        if(d.nextMax>0) R.settings.nextMax=d.nextMax; if(d.grace>=0) R.settings.grace=d.grace; if(d.binName) R.settings.binName=d.binName; if(d.startDate) R.settings.startDate=d.startDate;
        R.settings.updated=up; changed=true; }
    }
  });
  saveMark();
  if(!bulk) afterApply(changed);
  return changed;
}
/* 받아온 뒤 한 번만 정리한다. 순서를 손본 것은 이 기기의 결정이 아니므로 시각을 올리지 않는다. */
function afterApply(changed){
  if(!changed) return;
  reconcile(); orderSig=JSON.stringify(S.order);
  localStorage.setItem(KEY,JSON.stringify({books:S.books,order:S.order,lastLocation:S.lastLocation,orderUpdated:S.orderUpdated,tomb:S.tomb}));
  try{ localStorage.setItem(RKEY,JSON.stringify(R)); }catch(e){}
  const ae=document.activeElement;
  if(!(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName))&&!cmp&&!editId&&!pageFor&&!leaveAsk) render();
}
/* 순서와 분류가 어긋나지 않게: 분류에 없는 책은 순서에서 빼고, 순서에 빠진 책은 맨 아래에 붙인다 */
function reconcile(){
  if(cmp) return;
  for(const c of ['best','next']){
    const seen=new Set();
    S.order[c]=S.order[c].filter(id=>{ const b=book(id); if(!b||b.discarded||b.held||b.binAt||b.category!==c||seen.has(id)) return false; seen.add(id); return true; });
    S.books.forEach(b=>{ if(!b.discarded&&!b.held&&!b.binAt&&b.category===c&&!seen.has(b.id)){ S.order[c].push(b.id); seen.add(b.id); } });
  }
}
async function pushDirty(inner){
  if(!SB) return;
  const at=new Date().toISOString(), bR=[], rR=[], mR=[];
  S.books.forEach(b=>{ if((b.updated||'')>(MARK.b[b.id]||'')) bR.push({id:b.id,data:b,updated_at:at}); });
  Object.entries(S.tomb).forEach(([id,t])=>{ if(t>(MARK.b[id]||'')&&!book(id)) bR.push({id,data:{id,purged:true,updated:t},updated_at:at}); });
  R.reads.forEach(x=>{ if((x.updated||'')>(MARK.r[x.id]||'')) rR.push({id:x.id,data:x,updated_at:at}); });
  if(S.orderUpdated&&S.orderUpdated>(MARK.order||'')) mR.push({id:'order',data:{best:S.order.best,next:S.order.next,updated:S.orderUpdated},updated_at:at});
  if(R.activeUpdated&&R.activeUpdated>(MARK.active||'')) mR.push({id:'active',data:{active:R.active||null,updated:R.activeUpdated},updated_at:at});
  const st=R.settings;
  if(st.updated&&st.updated>(MARK.min||'')) mR.push({id:'settings',data:{target:st.target,min:st.min,adjustedAt:st.adjustedAt,nextMax:st.nextMax,grace:st.grace,binName:st.binName,startDate:st.startDate,updated:st.updated},updated_at:at});
  if(!bR.length&&!rR.length&&!mR.length){ if(!inner&&syncState!=='on') setSync('on'); return; }
  if(!inner) setSync('busy');
  try{
    for(const [t,rows] of [['seoga_books',bR],['seoga_reads',rR],['seoga_meta',mR]])
      for(let i=0;i<rows.length;i+=500){ const {error}=await SB.from(t).upsert(rows.slice(i,i+500)); if(error) throw error; }
    bR.forEach(r=>MARK.b[r.id]=r.data.updated); rR.forEach(r=>MARK.r[r.id]=r.data.updated);
    mR.forEach(r=>{ if(r.id==='order') MARK.order=r.data.updated; else if(r.id==='active') MARK.active=r.data.updated; else MARK.min=r.data.updated; });
    saveMark(); if(!inner){ syncErr=''; setSync('on'); }
  }catch(e){ if(inner) throw e; setSync('err'); }
}
function sbSave(){
  const u=document.getElementById('s-url').value.trim().replace(/\/+$/,''), k=document.getElementById('s-key').value.trim();
  if(!/^https:\/\/\S+$/.test(u)||!k){ toast('주소와 키를 모두 넣어주세요'); return; }
  if(u!==sbCfg.url){ MARK={b:{},r:{},order:'',min:''}; saveMark(); }
  sbCfg={url:u,key:k}; localStorage.setItem(SBKEY,JSON.stringify(sbCfg));

  sbConnect(true).then(ok=>{ if(ok) toast('연결했습니다'); render(); });
}
function sbOff(){

  if(SB){ try{ SB.removeAllChannels(); }catch(e){} } SB=null;
  localStorage.removeItem(SBKEY); sbCfg={}; setSync(''); render();
}

/* 이동·입력 */
/* 읽기 전용 화면에서 다른 탭이 필요한 동작(다른 책 고르기, 견주기 끝 등)을 하면 같은 자리에서 원래 서가로 넘어간다. */

window.addEventListener('beforeunload',()=>{ try{ localStorage.setItem(KEY,JSON.stringify({books:S.books,order:S.order,lastLocation:S.lastLocation,orderUpdated:S.orderUpdated,tomb:S.tomb})); }catch(e){} });
activeSig=JSON.stringify(R.active||null);
render();
/* 책 주소(2026년 11월 18일) — seoga.html#책=<책 제목 또는 id>로 오면 목록에서 그 책을 펼친다(writerKYS의 책 링크가 쓴다).
   제목이 똑같은 책을 먼저, 없으면 제목에 그 말이 든 책. 펼친 뒤에는 주소에서 지워 새로 고쳐도 다시 뛰지 않는다. 동기화로 책이 늦게 오는 기기에서는 못 찾을 수 있다. */
function hashBook(){
  let k=''; try{ const m=/^#책=(.+)$/.exec(decodeURIComponent(location.hash)); if(m) k=m[1].replace(/\s+/g,' ').trim(); }catch(e){}
  if(!k) return;
  const n=t=>String(t||'').replace(/\s+/g,' ').trim();
  const b=book(k)||S.books.find(x=>n(x.title)===k)||S.books.find(x=>n(x.title).includes(k));
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  if(!b){ toast('서가에서 ‘'+k+'’을 찾지 못했습니다'); return; }
  if(SOLO) leaveSolo();
  /* findBook은 폐기 서가에 놓인 책처럼 탭 목록에 없는 책을 못 펼친다 — goMark처럼 제목 검색으로 연다(검색에는 어느 상태의 책이든 나온다) */
  view='list'; q=b.title; shown=PAGE; openId=b.id; hiMark=null; cq=''; cShown=20;
  sideId=b.discarded?null:b.id; markAdd=null;   /* 자료로 읽기 칸을 연다 — 내놓은 책은 기록만 보여 준다 */
  render(true);
}
/* 읽기 주소(2026년 11월 22일) — seoga.html#읽기=<책 id>로 오면 읽기 탭에서 그 책을 펼친다(방점의 읽기 일이 연다).
   읽는 중이거나 읽기 대기인 책만 펼친다. 아니면 읽기 탭만 열고 알린다. 펼친 뒤에는 주소에서 지운다. */
function hashRead(){
  let k=''; try{ const m=/^#읽기=(.+)$/.exec(decodeURIComponent(location.hash)); if(m) k=m[1].trim(); }catch(e){}
  if(!k) return;
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  if(SOLO) leaveSolo();
  const b=book(k), ws=waitBooks(), ok=b&&(isReading(b)||ws.some(x=>x.id===b.id));
  readScan=null; readQuote=false; go('read');
  if(!ok){ toast(b?'‘'+b.title+'’은 읽는 중인 책이 아닙니다':'서가에서 그 책을 찾지 못했습니다'); return; }
  const i=ws.findIndex(x=>x.id===b.id); if(i>=waitShown) waitShown=i+1;   /* 읽기 대기의 뒤쪽 책이면 거기까지 보이게 */
  readOpen=b.id; render(true);
}
hashBook();
hashRead();
window.addEventListener('hashchange',hashBook);
window.addEventListener('hashchange',hashRead);
if(sbCfg.url&&sbCfg.key) sbConnect(false);
window.addEventListener('online',()=>{ if(sbCfg.url) syncAll(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible') return;
  if(sbCfg.url) syncAll(); });
</script>
