<style>
:root{
  --paper:#f2ede1;
  --paper-2:#e8e0cf;
  --ink:#23201c;
  --ink-soft:#736a59;
  --line:#d6ccb6;
  --seal:#9b3b32;        /* 베스트 */
  --deep:#3f5566;        /* 다음 읽을 책 */
  --moss:#5f6f49;        /* 증정본 */
  --void:#8c8577;        /* 미정·자리 없음 */
  --radius:2px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:'Gowun Batang',"Apple SD Gothic Neo",Batang,serif;
  font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

.top{border-bottom:1px solid var(--line);padding:18px 20px 0;position:sticky;top:0;background:var(--paper);z-index:20}
.top-in{max-width:820px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-size:26px;margin:0;letter-spacing:.22em;font-weight:700}
.brand .count{font-size:13px;color:var(--ink-soft)}
nav{display:flex;gap:2px;margin-top:14px;flex-wrap:wrap}
nav button{background:none;border:none;border-bottom:2px solid transparent;padding:8px 14px 10px;color:var(--ink-soft);font-size:15px;letter-spacing:.06em}
nav button.on{color:var(--ink);border-bottom-color:var(--seal)}
nav button:focus-visible{outline:2px solid var(--seal);outline-offset:-2px}
main{max-width:820px;margin:0 auto;padding:24px 20px 96px}
h2.sec{font-size:15px;font-weight:400;color:var(--ink-soft);letter-spacing:.14em;margin:0 0 10px}
.hr{height:1px;background:var(--line);margin:30px 0 22px;border:none}

.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:rgba(155,59,50,.04)}
.rank{font-size:22px;color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}
.row.b1 .rank,.row.b2 .rank,.row.b3 .rank{color:var(--seal)}
.title{font-size:17px;line-height:1.45}
.meta{font-size:13px;color:var(--ink-soft);margin-top:2px}
.place{font-size:12.5px;letter-spacing:.04em;white-space:nowrap;border:1px solid var(--line);padding:2px 8px;border-radius:var(--radius);color:var(--ink-soft);background:var(--paper-2)}
.place.none{border-style:dashed;background:none;color:var(--void)}
.gifted{border:1px solid var(--moss);color:var(--moss);font-size:11.5px;padding:1px 5px;border-radius:var(--radius);margin-left:7px;white-space:nowrap;vertical-align:2px}
.tagdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.d-best{background:var(--seal)} .d-next{background:var(--deep)} .d-gift{background:var(--moss)} .d-none{background:var(--void)}
.now-book{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 2px 18px;cursor:pointer}
.now-book:hover{background:rgba(63,85,102,.05)}
.now-t{font-size:26px;line-height:1.4}
.now-a{font-size:15px;color:var(--ink-soft);margin-top:8px}
.now-p{margin-top:12px}
.reading{border:1px solid var(--deep);color:var(--deep);font-size:11.5px;padding:1px 5px;border-radius:var(--radius);margin-left:7px;white-space:nowrap;vertical-align:2px}
.empty{color:var(--ink-soft);font-size:15px;padding:26px 0;border-bottom:1px solid var(--line)}
.empty b{font-weight:400;color:var(--ink)}

.detail{padding:14px 2px 18px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.015)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts button{background:none;border:1px solid var(--line);padding:6px 12px;border-radius:var(--radius);font-size:14px}
.acts button:hover{border-color:var(--ink-soft)}
.acts button.warn{color:var(--seal);border-color:rgba(155,59,50,.35)}
.acts button.gift{color:var(--moss);border-color:rgba(95,111,73,.4)}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;margin-bottom:5px}
input[type=text],input[type=date]{width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);padding:7px 2px;font-size:17px;border-radius:0}
input:focus{outline:none;border-bottom-color:var(--seal)}
.hint{font-size:13px;color:var(--ink-soft);margin-top:6px}
.hint b{font-weight:400;color:var(--ink)}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choice{border:1px solid var(--line);background:none;padding:9px 16px;border-radius:var(--radius);font-size:15px;color:var(--ink-soft)}
.choice.on{color:var(--paper);border-color:transparent}
.choice.on[data-c=best]{background:var(--seal)}
.choice.on[data-c=next]{background:var(--deep)}
.choice.on[data-c=gift]{background:var(--moss)}
.choice.on[data-c=undecided],.choice.on[data-c=none]{background:var(--void)}
.toggle{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);padding:9px 15px;border-radius:var(--radius);font-size:15px;color:var(--ink-soft);background:none}
.toggle.on{border-color:var(--moss);color:var(--moss)}
.toggle .box{width:13px;height:13px;border:1px solid currentColor;display:inline-block;border-radius:1px}
.toggle.on .box{background:var(--moss);border-color:var(--moss)}
.primary{background:var(--ink);color:var(--paper);border:none;padding:12px 26px;border-radius:var(--radius);font-size:16px;letter-spacing:.1em}
.primary:disabled{background:var(--line);color:var(--paper);cursor:default}
.ghost{background:none;border:1px solid var(--line);padding:11px 18px;border-radius:var(--radius);font-size:15px}
.rowbtns{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.recent{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.recent button{font-size:13px;border:1px solid var(--line);background:var(--paper-2);padding:4px 10px;border-radius:var(--radius);color:var(--ink-soft)}
.search{display:flex;align-items:center;gap:10px;margin-bottom:18px}

.shelf{margin-bottom:26px}
.shelf-h{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.shelf-h .name{font-size:18px}
.shelf-h .n{font-size:13px;color:var(--ink-soft)}
.shelf ul{list-style:none;margin:0;padding:0}
.shelf li{padding:7px 2px;border-bottom:1px solid var(--line);font-size:15.5px;cursor:pointer}
.shelf li:hover{background:rgba(155,59,50,.04)}
.shelf li .m{font-size:13px;color:var(--ink-soft)}

.veil{position:fixed;inset:0;background:rgba(35,32,28,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:18px}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:var(--radius);padding:26px 24px 22px}
.ask{text-align:center;font-size:19px;margin:0 0 4px}
.ask-sub{text-align:center;font-size:13px;color:var(--ink-soft);margin:0 0 22px}
.duel{display:grid;grid-template-columns:1fr 1px 1fr}
.duel .bar{background:var(--line)}
.pick{background:none;text-align:left;padding:18px 16px;width:100%;border:1px solid transparent;border-radius:var(--radius)}
.pick:hover{background:rgba(155,59,50,.06);border-color:var(--line)}
.pick .t{font-size:19px;line-height:1.45}
.pick .a{font-size:14px;color:var(--ink-soft);margin-top:6px}
.pick .p{font-size:12.5px;color:var(--ink-soft);margin-top:8px}
.duel-foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;flex-wrap:wrap}
.linkish{background:none;border:none;color:var(--ink-soft);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:4px}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:var(--radius);font-size:14.5px;z-index:80;opacity:0;pointer-events:none;transition:opacity .18s;max-width:90vw;text-align:center}
#toast.on{opacity:1}

.stat{display:flex;gap:26px;flex-wrap:wrap}
.stat div span{display:block;font-size:13px;color:var(--ink-soft);letter-spacing:.08em}
.stat div b{font-size:26px;font-weight:400}
.note{font-size:14px;color:var(--ink-soft);line-height:1.8}

@media (max-width:600px){
  .brand h1{font-size:22px}
  .duel{grid-template-columns:1fr}
  .duel .bar{height:1px;width:100%}
  main{padding:20px 16px 90px}
  .top{padding:14px 16px 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>서가</h1><div class="count" id="brandCount"></div></div>
    <nav>
      <button data-v="home">한눈에</button>
      <button data-v="add">담기</button>
      <button data-v="list">목록</button>
      <button data-v="shelf">자리</button>
      <button data-v="data">보관</button>
    </nav>
  </div>
</header>

<main id="view"></main>
<div id="toast"></div>

<script>
"use strict";
const KEY='seoga.v1';
const CAT={
  best:{name:'베스트',dot:'d-best',ask:'어느 책이 더 좋습니까?',sub:'좋은 쪽을 고르면 그 책이 위로 갑니다.'},
  next:{name:'다음 읽을 책',dot:'d-next',ask:'어느 책을 먼저 읽고 싶습니까?',sub:'먼저 읽고 싶은 쪽을 고르면 그 책이 위로 갑니다.'},
  '':{name:'미정',dot:'d-none'}
};

let S=load();
let view='home',openId=null,listTab='best',q='',cmp=null,editId=null;
let draft=blankDraft();
function blankDraft(loc){ return {title:'',author:'',publisher:'',category:null,gift:false,received:today(),location:loc||'',step:1}; }

function load(){
  let r=null;
  try{ r=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  const s={books:(r&&r.books)||[],order:{best:r?.order?.best||[],next:r?.order?.next||[]},lastLocation:r?.lastLocation||''};
  s.books.forEach(b=>{                        /* 예전 기록 옮기기: 증정본 분류 → 증정본 표시 */
    if(b.category==='gift'){ b.category=''; b.gift=true; }
    if(typeof b.gift!=='boolean') b.gift=!!b.received;
    if(b.category!=='best'&&b.category!=='next') b.category='';
  });
  return s;
}
function save(){ localStorage.setItem(KEY,JSON.stringify(S)); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function book(id){ return S.books.find(b=>b.id===id); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1900); }

function ordered(cat){ return S.order[cat].map(book).filter(Boolean); }
function gifts(){ return S.books.filter(b=>b.gift).sort((a,b)=>(b.received||'').localeCompare(a.received||'')||(b.added||'').localeCompare(a.added||'')); }
function undecided(){ return S.books.filter(b=>!b.category).sort((a,b)=>(b.added||'').localeCompare(a.added||'')); }
function homeless(){ return S.books.filter(b=>!b.location).sort((a,b)=>(b.added||'').localeCompare(a.added||'')); }
function rankOf(b){ return b.category? S.order[b.category].indexOf(b.id)+1 : 0; }
function locations(){ const m=new Map(); S.books.forEach(b=>{ if(b.location) m.set(b.location,(m.get(b.location)||0)+1); }); return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ko')); }
function recentLocations(){ const seen=[]; [...S.books].sort((a,b)=>(b.added||'').localeCompare(a.added||'')).forEach(b=>{ if(b.location&&!seen.includes(b.location)&&seen.length<6) seen.push(b.location); }); return seen; }
function stateLabel(b){
  if(!b.category) return '<span class="tagdot d-none"></span>분류 미정';
  return `<span class="tagdot ${CAT[b.category].dot}"></span>${CAT[b.category].name} ${rankOf(b)}위`;
}

/* ── 순위 ── */
function removeFromOrder(id){ for(const c of['best','next']) S.order[c]=S.order[c].filter(x=>x!==id); }
function startCompare(id){
  const b=book(id); if(!b||!b.category) return false;
  const cat=b.category, list=S.order[cat].filter(x=>x!==id);
  if(!list.length){ S.order[cat]=[id]; save(); return false; }
  cmp={id,cat,list,lo:0,hi:list.length}; render(); return true;
}
function answer(better){ const mid=(cmp.lo+cmp.hi)>>1; if(better) cmp.hi=mid; else cmp.lo=mid+1;
  if(cmp.lo>=cmp.hi) finishCompare(cmp.lo); else render(); }
function finishCompare(pos){
  const {id,cat,list}=cmp;
  S.order[cat]=list.slice(0,pos).concat(id,list.slice(pos)); cmp=null; save();
  toast(CAT[cat].name+' '+(pos+1)+'번째에 놓았습니다');
  if(S._queue&&S._queue.length){ nextQueued(); return; }
  view='list'; listTab=cat; render();
}
function cancelCompare(){
  const {id,cat,list}=cmp; S.order[cat]=list.concat(id); cmp=null; delete S._queue; save();
  toast('맨 아래에 두었습니다. 나중에 견주기로 자리를 정할 수 있습니다');
  view='list'; listTab=cat; render();
}

/* ── 화면 ── */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  document.getElementById('brandCount').textContent = S.books.length? S.books.length+'권 · 꽂힌 책 '+(S.books.length-homeless().length)+'권' : '';
  document.getElementById('view').innerHTML = cmp? '' : ({home:vHome,add:vAdd,list:vList,shelf:vShelf,data:vData}[view])();
  document.querySelectorAll('.veil').forEach(v=>v.remove());
  if(cmp) document.body.insertAdjacentHTML('beforeend',compareHTML());
  if(editId) document.body.insertAdjacentHTML('beforeend',editHTML());
  if(view==='add') bindAdd();
}

/* 한눈에 */
function vHome(){
  if(!S.books.length) return `<div class="empty" style="border:none;padding-top:40px">
    <b>아직 담긴 책이 없습니다.</b><br>‘담기’에서 책을 적고, 읽은 책인지 읽을 책인지 고른 뒤 꽂을 자리를 적으면 됩니다. 증정본이면 그 자리에서 표시해 둘 수 있습니다.
    <div class="rowbtns"><button class="primary" onclick="go('add')">첫 책 담기</button></div></div>`;
  const sec=(label,dot,list,rank,more)=>`<section style="margin-bottom:34px">
      <h2 class="sec"><span class="tagdot ${dot}"></span>${label}</h2>
      ${list.length?`<div class="rows">${list.map((b,i)=>rowHTML(b,rank?i+1:null,!rank)).join('')}</div>`:`<div class="empty">아직 없습니다.</div>`}
      ${more?`<div class="rowbtns"><button class="ghost" onclick="go('list','${more}')">모두 보기</button></div>`:''}
    </section>`;
  const b=ordered('best'),n=ordered('next'),g=gifts(),u=undecided();
  return nowReading(n)
    + sec(`좋은 책 차례${b.length>10?` · ${b.length}권 중 10권`:''}`,'d-best',b.slice(0,10),true,b.length>10?'best':'')
    + sec(`최근에 받은 증정본${g.length>5?` · ${g.length}권 중 5권`:''}`,'d-gift',g.slice(0,5),false,g.length>5?'gift':'')
    + (u.length?sec(`분류하지 않은 책 ${u.length}권`,'d-none',u.slice(0,5),false,'undecided'):'');
}
function nowReading(n){
  const b=n[0];
  const foot=`<div class="rowbtns"><button class="ghost" onclick="go('list','next')">모두 보기${n.length>1?` · 뒤에 ${n.length-1}권`:''}</button></div>`;
  if(!b) return `<section class="now">
      <h2 class="sec"><span class="tagdot d-next"></span>지금 읽는 책</h2>
      <div class="empty">다음 읽을 책의 1위가 여기 놓입니다. 읽을 책을 담고 견주어 보세요.</div>
      ${n.length?foot:''}</section><hr class="hr">`;
  return `<section class="now">
      <h2 class="sec"><span class="tagdot d-next"></span>지금 읽는 책</h2>
      <div class="now-book" onclick="findBook('${b.id}')">
        <div class="now-t">${esc(b.title)}${b.gift?'<span class="gifted">증정본</span>':''}</div>
        <div class="now-a">${[b.author,b.publisher].filter(Boolean).map(esc).join(' · ')}</div>
        <div class="now-p"><span class="${b.location?'place':'place none'}">${b.location?esc(b.location):'자리 없음'}</span></div>
      </div>
      <div class="acts" style="margin-top:14px">
        <button onclick="moveTo('${b.id}','best')">다 읽었다</button>
        <button onclick="reRank('${b.id}')">견주기</button>
      </div>
      ${foot}</section><hr class="hr">`;
}

/* 담기 */
function vAdd(){
  const d=draft;
  const step1=`
    <h2 class="sec">첫째 · 책</h2>
    <div class="field"><label>제목</label><input type="text" id="f-title" value="${esc(d.title)}" placeholder="표지에 적힌 그대로"></div>
    <div class="field"><label>지은이</label><input type="text" id="f-author" value="${esc(d.author)}" placeholder="옮긴이가 있으면 함께"></div>
    <div class="field"><label>펴낸곳</label><input type="text" id="f-pub" value="${esc(d.publisher)}"></div>
    ${dupWarning(d.title)}
    <div class="rowbtns"><button class="primary" id="btn-step1" ${d.title.trim()?'':'disabled'} onclick="addStep1()">다음 · 분류</button></div>`;
  if(d.step===1) return `<div style="max-width:560px">${step1}</div>`;

  const step2=`
    <hr class="hr">
    <h2 class="sec">둘째 · 분류</h2>
    <div class="choices">
      <button class="choice ${d.category==='best'?'on':''}" data-c="best" onclick="pickCat('best')">읽은 책</button>
      <button class="choice ${d.category==='next'?'on':''}" data-c="next" onclick="pickCat('next')">읽을 책</button>
      <button class="choice ${d.category===''?'on':''}" data-c="undecided" onclick="pickCat('')">아직 정하지 않음</button>
    </div>
    <div class="hint">읽은 책은 <b>베스트</b>로, 읽을 책은 <b>다음 읽을 책</b>으로 들어가 견주기로 순서를 정합니다. 미뤄두면 ‘미정’에 모였다가 나중에 옮길 수 있습니다.</div>
    <div style="margin-top:18px">
      <button class="toggle ${d.gift?'on':''}" onclick="toggleGift()"><span class="box"></span>증정본으로 받은 책</button>
      ${d.gift?`<div class="field" style="margin-top:12px;max-width:220px"><label>받은 날짜</label><input type="date" id="f-recv" value="${esc(d.received)}"></div>`:''}
      <div class="hint">증정본은 분류와 상관없이 따로 모여, 받은 날짜가 최근인 것부터 놓입니다.</div>
    </div>
    ${d.step===2?`<div class="rowbtns"><button class="primary" ${d.category===null?'disabled':''} onclick="draft.step=3;render()">다음 · 자리</button></div>`:''}`;
  if(d.step===2) return `<div style="max-width:560px">${summary()}${step2}</div>`;

  const rec=recentLocations();
  const step3=`
    <hr class="hr">
    <h2 class="sec">셋째 · 자리</h2>
    <div class="field">
      <label>서가 위치</label>
      <input type="text" id="f-loc" value="${esc(d.location)}" placeholder="예: 거실 3단 왼쪽" list="locs">
      <datalist id="locs">${locations().map(([l])=>`<option value="${esc(l)}">`).join('')}</datalist>
      ${rec.length?`<div class="recent">${rec.map(l=>`<button onclick="setLoc(this.textContent)">${esc(l)}</button>`).join('')}</div>`:''}
      <div class="hint">비워두면 <b>가지고 있지 않은 책</b>으로 기록됩니다. 읽었지만 손에 없는 책, 사려고 적어둔 책이 여기 들어갑니다.</div>
    </div>
    <div class="rowbtns">
      <button class="primary" onclick="addSave()">담기</button>
      <button class="ghost" onclick="addSave(true)">담고 이어서 한 권 더</button>
      <button class="linkish" onclick="draft.step=2;render()">뒤로</button>
    </div>`;
  return `<div style="max-width:560px">${summary()}${step2}${step3}</div>`;
}
function summary(){
  const d=draft;
  return `<div style="border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px">
    <div class="title">${esc(d.title)||'(제목 없음)'}${d.gift?'<span class="gifted">증정본</span>':''}</div>
    <div class="meta">${[d.author,d.publisher].filter(Boolean).map(esc).join(' · ')||'&nbsp;'}</div>
    <button class="linkish" onclick="draft.step=1;render()">고치기</button></div>`;
}
function dupWarning(t){
  const t2=(t||'').trim(); if(!t2) return '';
  const hit=S.books.find(b=>b.title.trim()===t2); if(!hit) return '';
  return `<div class="hint" style="color:var(--seal)">이미 ‘${esc(hit.title)}’(${hit.category?CAT[hit.category].name:'미정'}${hit.gift?' · 증정본':''}${hit.location?' · '+esc(hit.location):''})이 담겨 있습니다. 다른 판본이면 그대로 담아도 됩니다.</div>`;
}
function bindAdd(){
  const map={'f-title':'title','f-author':'author','f-pub':'publisher'};
  Object.keys(map).forEach(id=>{
    const e=document.getElementById(id); if(!e) return;
    e.addEventListener('input',()=>{ draft[map[id]]=e.value; const b=document.getElementById('btn-step1'); if(b) b.disabled=!draft.title.trim(); });
    e.addEventListener('keydown',ev=>{ if(ev.key!=='Enter') return; ev.preventDefault();
      if(id==='f-title') document.getElementById('f-author').focus();
      else if(id==='f-author') document.getElementById('f-pub').focus();
      else addStep1(); });
  });
  const r=document.getElementById('f-recv'); if(r) r.addEventListener('input',()=>draft.received=r.value);
  const l=document.getElementById('f-loc');
  if(l){ l.addEventListener('input',()=>draft.location=l.value);
    l.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ev.preventDefault();addSave(true);} });
    l.focus(); }
  else if(draft.step===1&&!draft.title){ const t=document.getElementById('f-title'); if(t) t.focus(); }
}
function addStep1(){ if(!draft.title.trim()) return; draft.step=2; render(); }
function pickCat(c){ draft.category=c; if(draft.step===2&&(c==='best'||c==='next'||c==='')) draft.step=3; render(); }
function toggleGift(){ draft.gift=!draft.gift; if(draft.gift&&!draft.received) draft.received=today(); render(); }
function setLoc(l){ draft.location=l; const e=document.getElementById('f-loc'); if(e) e.value=l; }
function addSave(again){
  const d=draft;
  if(!d.title.trim()||d.category===null){ toast('제목과 분류가 필요합니다'); return; }
  const b={id:uid(),title:d.title.trim(),author:d.author.trim(),publisher:d.publisher.trim(),
    category:d.category,gift:d.gift,received:d.gift?(d.received||today()):'',
    location:d.location.trim(),added:new Date().toISOString(),note:''};
  S.books.push(b);
  if(b.location) S.lastLocation=b.location;
  const cat=b.category, loc=b.location;
  if(cat) S.order[cat].push(b.id);
  save();
  draft=blankDraft(again?loc:'');
  if(cat){
    const list=S.order[cat].filter(x=>x!==b.id);
    if(list.length){ S.order[cat]=list; startCompare(b.id); return; }
  }
  toast('담았습니다'+(loc?' · '+loc:' · 자리 없음'));
  if(!again) view='home';
  render();
}

/* 목록 */
function tabList(c){
  if(c==='gift') return gifts();
  if(c==='undecided') return undecided();
  if(c==='none') return homeless();
  return ordered(c);
}
function vList(){
  const tabs=[['best','베스트'],['next','다음 읽을 책'],['gift','증정본'],['undecided','미정'],['none','자리 없음']];
  let list=tabList(listTab);
  if(q.trim()){ const k=q.trim().toLowerCase();
    list=list.filter(b=>[b.title,b.author,b.publisher,b.location].some(v=>(v||'').toLowerCase().includes(k))); }
  const ranked=(listTab==='best'||listTab==='next')&&!q.trim();
  return `
  <div class="search"><input type="text" id="q" value="${esc(q)}" placeholder="제목·지은이·펴낸곳·자리로 찾기">
    ${q?`<button class="linkish" onclick="q='';render()">지우기</button>`:''}</div>
  <div class="choices" style="margin-bottom:16px">
    ${tabs.map(([c,n])=>`<button class="choice ${listTab===c?'on':''}" data-c="${c}" onclick="go('list','${c}')">${n} ${tabList(c).length}</button>`).join('')}
  </div>
  ${list.length?`<div class="rows">${list.map((b,i)=>rowHTML(b,ranked?i+1:null,!ranked)).join('')}</div>`
   :`<div class="empty">${q?'찾는 책이 없습니다.':'아직 없습니다.'}</div>`}
  ${ranked&&list.length>1?`<div class="rowbtns"><button class="ghost" onclick="reorderAll('${listTab}')">순서 처음부터 다시 정하기</button></div>`:''}`;
}
function rowHTML(b,rank,showState){
  const open=openId===b.id, cls=rank&&rank<=3?' b'+rank:'';
  const dot=b.category?CAT[b.category].dot:'d-none';
  const meta=[[b.author,b.publisher].filter(Boolean).map(esc).join(' · ')];
  if(showState) meta.push(stateLabel(b));
  if(b.gift&&b.received) meta.push(esc(b.received)+' 받음');
  return `<div class="row${cls}" data-id="${b.id}" onclick="toggle('${b.id}')">
    <div class="rank">${rank?rank:`<span class="tagdot ${dot}" style="margin:0"></span>`}</div>
    <div><div class="title">${esc(b.title)}${rank===1&&b.category==='next'?'<span class="reading">지금 읽는 책</span>':''}${b.gift?'<span class="gifted">증정본</span>':''}</div>
      <div class="meta">${meta.filter(Boolean).join('&nbsp;&nbsp;·&nbsp;&nbsp;')}</div></div>
    <div class="${b.location?'place':'place none'}">${b.location?esc(b.location):'자리 없음'}</div>
  </div>${open?detailHTML(b):''}`;
}
function detailHTML(b){
  return `<div class="detail">
    <div class="meta">${stateLabel(b)}${b.gift?' · 증정본'+(b.received?' '+esc(b.received)+' 받음':''):''} · ${b.location?esc(b.location):'가지고 있지 않음'}${b.note?'<br>'+esc(b.note):''}</div>
    <div class="acts">
      ${b.category?`<button onclick="reRank('${b.id}')">견주기</button>`:''}
      ${b.category==='next'?`<button onclick="moveTo('${b.id}','best')">다 읽었다</button>`:''}
      ${b.category!=='best'&&b.category!=='next'?`<button onclick="moveTo('${b.id}','best')">읽은 책으로</button><button onclick="moveTo('${b.id}','next')">읽을 책으로</button>`:''}
      ${b.category==='best'?`<button onclick="moveTo('${b.id}','next')">읽을 책으로</button>`:''}
      ${b.category?`<button onclick="moveTo('${b.id}','')">분류 미루기</button>`:''}
      <button class="gift" onclick="toggleGiftOn('${b.id}')">${b.gift?'증정본 표시 떼기':'증정본으로 표시'}</button>
      <button onclick="edit('${b.id}')">고치기</button>
      <button class="warn" onclick="del('${b.id}')">지우기</button>
    </div></div>`;
}
function toggle(id){ openId=openId===id?null:id; render(); }
function reRank(id){ removeFromOrder(id); if(!startCompare(id)){ save(); toast('견줄 상대가 아직 없습니다'); render(); } }
function moveTo(id,cat){
  const b=book(id); b.category=cat; removeFromOrder(id); save();
  if(!cat){ openId=null; toast('미정으로 옮겼습니다'); listTab='undecided'; render(); return; }
  S.order[cat].push(id); save();
  if(!startCompare(id)){ save(); listTab=cat; openId=null; toast(CAT[cat].name+'의 첫 책이 되었습니다'); render(); }
  else { S.order[cat]=S.order[cat].filter(x=>x!==id); }
}
function toggleGiftOn(id){
  const b=book(id);
  if(b.gift){ b.gift=false; b.received=''; toast('증정본 표시를 뗐습니다'); }
  else { b.gift=true; b.received=b.received||today(); toast('증정본으로 표시했습니다 · '+b.received); }
  save(); render();
}
function del(id){
  const b=book(id); if(!confirm('‘'+b.title+'’을 목록에서 지웁니다. 되돌릴 수 없습니다.')) return;
  S.books=S.books.filter(x=>x.id!==id); removeFromOrder(id); openId=null; save(); toast('지웠습니다'); render();
}
function reorderAll(cat){
  if(!confirm(CAT[cat].name+'의 순서를 지우고 한 권씩 다시 견줍니다. 이어서 하시겠습니까?')) return;
  const ids=[...S.order[cat]]; S.order[cat]=[ids[0]]; S._queue=ids.slice(1); save(); nextQueued();
}
function nextQueued(){
  while(S._queue&&S._queue.length){ const id=S._queue.shift(); removeFromOrder(id); if(startCompare(id)) return; }
  delete S._queue; save(); render();
}

/* 자리 */
function vShelf(){
  const locs=locations(), none=homeless();
  if(!locs.length&&!none.length) return `<div class="empty" style="border:none">아직 자리가 없습니다.</div>`;
  const block=(name,items,count)=>`<section class="shelf">
    <div class="shelf-h"><div class="name">${name}</div><div class="n">${count}권</div></div>
    <ul>${items.map(b=>`<li onclick="findBook('${b.id}')">
      <span class="tagdot ${b.category?CAT[b.category].dot:'d-none'}"></span>${esc(b.title)}${b.gift?'<span class="gifted">증정본</span>':''}
      <span class="m"> ${esc(b.author||'')}</span></li>`).join('')}</ul></section>`;
  return locs.map(([l,c])=>block(esc(l),S.books.filter(b=>b.location===l).sort((a,b)=>a.title.localeCompare(b.title,'ko')),c)).join('')
    + (none.length?block('자리 없음 <span class="n">· 가지고 있지 않은 책</span>',none,none.length):'');
}
function findBook(id){
  const b=book(id); view='list'; q='';
  listTab = !b.location?'none' : (b.category||'undecided');
  openId=id; render();
  setTimeout(()=>{ const el=document.querySelector('.row[data-id="'+id+'"]'); if(el) el.scrollIntoView({block:'center'}); },30);
}

/* 보관 */
function vData(){
  return `<div class="stat">
      <div><span>담은 책</span><b>${S.books.length}</b></div>
      <div><span>베스트</span><b>${ordered('best').length}</b></div>
      <div><span>다음 읽을 책</span><b>${ordered('next').length}</b></div>
      <div><span>증정본</span><b>${gifts().length}</b></div>
      <div><span>미정</span><b>${undecided().length}</b></div>
      <div><span>서가</span><b>${locations().length}</b></div>
      <div><span>자리 없는 책</span><b>${homeless().length}</b></div>
    </div>
  <hr class="hr">
  <h2 class="sec">파일로 옮기기</h2>
  <p class="note">기록은 이 브라우저 안에 저장됩니다. 기기를 옮기거나 여벌을 남기려면 파일로 내보낸 뒤 다른 기기에서 불러오면 됩니다.</p>
  <div class="rowbtns">
    <button class="primary" onclick="expJSON()">파일로 내보내기</button>
    <button class="ghost" onclick="document.getElementById('imp').click()">파일에서 불러오기</button>
    <input type="file" id="imp" accept="application/json" style="display:none" onchange="impJSON(this)">
    <button class="ghost" onclick="expText()">목록을 글로 복사</button>
  </div>
  <hr class="hr">
  <h2 class="sec">모두 지우기</h2>
  <div class="rowbtns"><button class="ghost" style="color:var(--seal);border-color:rgba(155,59,50,.35)" onclick="wipe()">기록 전부 지우기</button></div>`;
}
function expJSON(){
  const blob=new Blob([JSON.stringify({books:S.books,order:S.order,lastLocation:S.lastLocation},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='서가-'+today()+'.json'; a.click();
  URL.revokeObjectURL(a.href); toast('내보냈습니다');
}
function impJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result); if(!d.books) throw 0;
      if(!confirm('지금 기록을 덮어씁니다. 이어서 하시겠습니까?')) return;
      localStorage.setItem(KEY,JSON.stringify(d)); S=load(); save(); toast('불러왔습니다'); render();
    }catch(e){ toast('읽을 수 없는 파일입니다'); } };
  r.readAsText(f); inp.value='';
}
function expText(){
  const line=b=>`${b.title}${b.author?' / '+b.author:''}${b.publisher?' / '+b.publisher:''} — ${b.location||'자리 없음'}${b.gift?' [증정본'+(b.received?' '+b.received:'')+']':''}`;
  const t=['[베스트]',...ordered('best').map((b,i)=>(i+1)+'. '+line(b)),'',
           '[다음 읽을 책]',...ordered('next').map((b,i)=>(i+1)+'. '+line(b)),'',
           '[증정본 · 받은 날짜순]',...gifts().map(b=>(b.received||'')+' '+line(b)),'',
           '[미정]',...undecided().map(b=>line(b))].join('\n');
  navigator.clipboard.writeText(t).then(()=>toast('복사했습니다'),()=>toast('복사할 수 없습니다'));
}
function wipe(){ if(!confirm('담은 책과 순서를 모두 지웁니다. 되돌릴 수 없습니다.')) return;
  S={books:[],order:{best:[],next:[]},lastLocation:''}; save(); view='home'; render(); toast('모두 지웠습니다'); }

/* 견주기 */
function compareHTML(){
  const nb=book(cmp.id), mid=(cmp.lo+cmp.hi)>>1, ob=book(cmp.list[mid]);
  const left=Math.max(1,Math.ceil(Math.log2(Math.max(2,cmp.hi-cmp.lo+1))));
  const card=(b,fn,label)=>`<button class="pick" onclick="${fn}">
      <div class="p">${label}</div>
      <div class="t">${esc(b.title)}${b.gift?'<span class="gifted">증정본</span>':''}</div>
      <div class="a">${[b.author,b.publisher].filter(Boolean).map(esc).join(' · ')}</div>
      <div class="p">${b.location?esc(b.location):'자리 없음'}</div></button>`;
  return `<div class="veil"><div class="sheet">
    <p class="ask">${CAT[cmp.cat].ask}</p>
    <p class="ask-sub">${CAT[cmp.cat].sub} 앞으로 최대 ${left}번이면 자리가 정해집니다.${S._queue&&S._queue.length?' 남은 책 '+S._queue.length+'권.':''}</p>
    <div class="duel">${card(nb,'answer(true)','자리를 정하는 책')}<div class="bar"></div>${card(ob,'answer(false)','지금 '+(mid+1)+'위')}</div>
    <div class="duel-foot">
      <button class="linkish" onclick="answer(false)">고르기 어렵다면 아래쪽으로</button>
      <button class="linkish" onclick="cancelCompare()">그만두고 맨 아래에 두기</button>
    </div></div></div>`;
}

/* 고치기 */
function edit(id){ editId=id; render(); }
function editHTML(){
  const b=book(editId);
  return `<div class="veil"><div class="sheet" style="max-width:520px">
    <h2 class="sec">책 고치기</h2>
    <div class="field"><label>제목</label><input type="text" id="e-title" value="${esc(b.title)}"></div>
    <div class="field"><label>지은이</label><input type="text" id="e-author" value="${esc(b.author)}"></div>
    <div class="field"><label>펴낸곳</label><input type="text" id="e-pub" value="${esc(b.publisher)}"></div>
    <div class="field"><label>서가 위치 · 비우면 가지고 있지 않은 책</label>
      <input type="text" id="e-loc" value="${esc(b.location)}" list="locs2">
      <datalist id="locs2">${locations().map(([l])=>`<option value="${esc(l)}">`).join('')}</datalist></div>
    ${b.gift?`<div class="field" style="max-width:220px"><label>받은 날짜</label><input type="date" id="e-recv" value="${esc(b.received||today())}"></div>`:''}
    <div class="field"><label>메모</label><input type="text" id="e-note" value="${esc(b.note||'')}" placeholder="누구에게 받았는지, 빌려준 사람 등"></div>
    <div class="rowbtns"><button class="primary" onclick="saveEdit()">고친 대로 저장</button>
      <button class="linkish" onclick="editId=null;render()">그만두기</button></div>
  </div></div>`;
}
function saveEdit(){
  const b=book(editId);
  b.title=document.getElementById('e-title').value.trim()||b.title;
  b.author=document.getElementById('e-author').value.trim();
  b.publisher=document.getElementById('e-pub').value.trim();
  b.location=document.getElementById('e-loc').value.trim();
  b.note=document.getElementById('e-note').value.trim();
  const r=document.getElementById('e-recv'); if(r) b.received=r.value;
  if(b.location) S.lastLocation=b.location;
  editId=null; save(); toast('고쳤습니다'); render();
}

function go(v,tab){ view=v; if(tab) listTab=tab; openId=null; if(v==='add'&&!draft.title) draft=blankDraft(draft.location); render(); }
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
document.addEventListener('input',e=>{ if(e.target.id==='q'){ q=e.target.value; const p=e.target.selectionStart;
  render(); const n=document.getElementById('q'); if(n){ n.focus(); n.setSelectionRange(p,p); } }});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&editId){ editId=null; render(); }});
window.addEventListener('beforeunload',save);
render();
</script>
</body>
</html>
