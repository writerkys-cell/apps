<style>
:root{
  --paper:#f2ede1; --paper-2:#e8e0cf; --ink:#23201c; --ink-soft:#736a59; --line:#d6ccb6;
  --seal:#9b3b32; --deep:#3f5566; --moss:#5f6f49; --void:#8c8577; --radius:2px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Gowun Batang',"Apple SD Gothic Neo",Batang,serif;font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

.top{border-bottom:1px solid var(--line);padding:18px 20px 0;position:sticky;top:0;background:var(--paper);z-index:20}
.top-in{max-width:820px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-size:26px;margin:0;letter-spacing:.22em;font-weight:700}
.brand .count{font-size:13px;color:var(--ink-soft)}
nav{display:flex;gap:2px;margin-top:14px;flex-wrap:wrap}
nav button{background:none;border:none;border-bottom:2px solid transparent;padding:8px 14px 10px;color:var(--ink-soft);font-size:15px;letter-spacing:.06em}
nav button.on{color:var(--ink);border-bottom-color:var(--seal)}
nav button:focus-visible{outline:2px solid var(--seal);outline-offset:-2px}
main{max-width:820px;margin:0 auto;padding:24px 20px 96px}
h2.sec{font-size:15px;font-weight:400;color:var(--ink-soft);letter-spacing:.14em;margin:0 0 10px}
.hr{height:1px;background:var(--line);margin:30px 0 22px;border:none}
.note{font-size:14px;color:var(--ink-soft);line-height:1.8}

.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:rgba(155,59,50,.04)}
.rank{font-size:22px;color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}
.row.b1 .rank,.row.b2 .rank,.row.b3 .rank{color:var(--seal)}
.title{font-size:17px;line-height:1.45}
.meta{font-size:13px;color:var(--ink-soft);margin-top:2px}
.place{font-size:12.5px;letter-spacing:.04em;white-space:nowrap;border:1px solid var(--line);padding:2px 8px;border-radius:var(--radius);color:var(--ink-soft);background:var(--paper-2)}
.place.none{border-style:dashed;background:none;color:var(--void)}
.badge{font-size:11.5px;padding:1px 5px;border-radius:var(--radius);margin-left:7px;white-space:nowrap;vertical-align:2px;border:1px solid}
.b-gift{border-color:var(--moss);color:var(--moss)}
.b-read{border-color:var(--deep);color:var(--deep)}
.b-cand{border-color:var(--seal);color:var(--seal)}
.b-keep{border-color:var(--deep);color:var(--deep)}
.judge .now-book{cursor:default}
.judge .now-book:hover{background:none}
.b-gone{border-color:var(--void);color:var(--void)}
.tagdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.d-best{background:var(--seal)} .d-next{background:var(--deep)} .d-gift{background:var(--moss)} .d-none{background:var(--void)}
.row.gone .title,.row.gone .meta{color:var(--void)}
.row .hit{display:block;margin-top:3px;color:var(--ink-soft);font-size:13px}
.row.gone .hit{color:var(--void)}
.empty{color:var(--ink-soft);font-size:15px;padding:26px 0;border-bottom:1px solid var(--line)}
.empty b{font-weight:400;color:var(--ink)}

.detail{padding:14px 2px 18px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.015)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts button{background:none;border:1px solid var(--line);padding:6px 12px;border-radius:var(--radius);font-size:14px}
.acts button:hover{border-color:var(--ink-soft)}
.acts button.warn{color:var(--seal);border-color:rgba(155,59,50,.35)}
.acts button.gift{color:var(--moss);border-color:rgba(95,111,73,.4)}

.now-book{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 2px 18px;cursor:pointer}
.now-book:hover{background:rgba(63,85,102,.05)}
.now-t{font-size:26px;line-height:1.4}
.now-a{font-size:15px;color:var(--ink-soft);margin-top:8px}
.now-p{margin-top:12px}
.today-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.today-day{font-size:15px;color:var(--seal)}
.datehead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:24px}
.datehead .day{font-size:19px;letter-spacing:.02em}

<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><h1>서가</h1><div class="count" id="brandCount"></div><div class="count" id="syncMark"></div></div>
    <nav>
      <button data-v="read">읽기</button>
      <button data-v="home">한눈에</button>
      <button data-v="add">담기</button>
      <button data-v="list">목록</button>
      <button data-v="shelf">자리</button>
      <button data-v="data">설정</button>
    </nav>
  </div>
</header>

<main id="view"></main>
<div id="toast"></div>

<script>
"use strict";
const KEY='seoga.v1', BEST_MAX=365, PAGE=100;
const CAT={
  best:{name:'베스트',dot:'d-best',ask:'어느 책이 더 좋습니까?',sub:'좋은 쪽을 고르면 그 책이 위로 갑니다.'},
  next:{name:'다음 읽을 책',dot:'d-next',ask:'어느 책을 먼저 읽고 싶습니까?',sub:'먼저 읽고 싶은 쪽을 고르면 그 책이 위로 갑니다.'},
  '':{name:'미정',dot:'d-none'}
};

let S=load();
let orderSig=JSON.stringify(S.order);
const RKEY='seoga.read.v1';
let R=loadR(), finishFor=null, askFor=null, holdId=null;
let view=(R.active||matchMedia('(max-width:600px)').matches)?'read':'home',openId=null,listTab='best',q='',sq='',shown=PAGE,cmp=null,editId=null,composing=false;
let openShelves=new Set(), homeOpen=false, pageFor=null;
let draft=blankDraft();
function blankDraft(loc){ return {title:'',author:'',publisher:'',total:'',category:null,gift:false,received:today(),location:loc||'',step:1}; }

/* ── 저장 ── */
function load(){
  let r=null; try{ r=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  const s={books:(r&&r.books)||[],order:{best:r?.order?.best||[],next:r?.order?.next||[]},lastLocation:r?.lastLocation||'',
    orderUpdated:r?.orderUpdated||((r?.order?.best?.length||r?.order?.next?.length)?'2000-01-01T00:00:00.000Z':''),tomb:r?.tomb||{}};
  s.books.forEach(normBook);
  const alive=new Set(s.books.filter(b=>!b.discarded&&!b.held&&!b.binAt).map(b=>b.id));
  s.order.best=s.order.best.filter(id=>alive.has(id));
  s.order.next=s.order.next.filter(id=>alive.has(id));
  return s;
}
function normBook(b){
    if(b.category==='gift'){ b.category=''; b.gift=true; }
    if(typeof b.gift!=='boolean') b.gift=!!b.received;
    if(b.category!=='best'&&b.category!=='next') b.category='';
    if(typeof b.discarded!=='boolean') b.discarded=false;
    b.toDiscard=false;
    if(typeof b.keep!=='boolean') b.keep=false;
    if(!b.binAt) b.binAt='';
    if(!b.prevLocation) b.prevLocation='';
    if(!b.discardedAt) b.discardedAt='';
    if(typeof b.held!=='boolean') b.held=false;
    if(!b.heldAt) b.heldAt='';
    if(typeof b.heldPage!=='number') b.heldPage=0;
    if(!b.heldReason) b.heldReason='';
    if(!b.judgedAt) b.judgedAt='';
    if(!b.updated) b.updated=b.added||new Date().toISOString();
    if(typeof b.page!=='number') b.page=0;
    if(!b.pageAt) b.pageAt='';
    if(typeof b.total!=='number') b.total=0;
  return b;
}
function save(){
  const sig=JSON.stringify(S.order);
  if(sig!==orderSig){ S.orderUpdated=new Date().toISOString(); orderSig=sig; }
  localStorage.setItem(KEY,JSON.stringify({books:S.books,order:S.order,lastLocation:S.lastLocation,orderUpdated:S.orderUpdated,tomb:S.tomb}));
  queueSync();
}
function touch(b){ b.updated=new Date().toISOString(); }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayOfYear(){ const d=new Date(), s=new Date(d.getFullYear(),0,0); return Math.min(365,Math.floor((d-s)/86400000)); }
function fullDayLabel(){ const d=new Date(), w=['일','월','화','수','목','금','토'][d.getDay()];
  return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 '+w+'요일'; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function book(id){ return S.books.find(b=>b.id===id); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }

/* ── 갈래 ── */
function ordered(cat){ return S.order[cat].map(book).filter(Boolean); }
function live(){ return S.books.filter(b=>!b.discarded&&!b.held); }
/* 보류: 읽다가 놓은 책의 기록. 실제 책은 서가에서 치우고, 쪽과 이유만 남긴다. */
function heldBooks(){ return S.books.filter(b=>b.held).sort((a,b)=>(b.heldAt||'').localeCompare(a.heldAt||'')||(b.updated||'').localeCompare(a.updated||'')); }
function holdLine(b){ if(!b.total) return 0; return b.total>=300?100:Math.ceil(b.total/3); }
function gifts(){ return live().filter(b=>b.gift).sort((a,b)=>(b.received||'').localeCompare(a.received||'')||(b.added||'').localeCompare(a.added||'')); }
function undecided(){ return live().filter(b=>!b.category).sort((a,b)=>(b.added||'').localeCompare(a.added||'')); }
function homeless(){ return live().filter(b=>!b.location).sort((a,b)=>(b.added||'').localeCompare(a.added||'')); }
function rankOf(b){ return b.category&&!b.discarded&&!b.held? S.order[b.category].indexOf(b.id)+1 : 0; }
/* 폐기 판단: 순위 밖으로 밀려난 책은 판단을 기다린다. 폐기하면 폐기 서가로, 보관하면 제자리에 라벨만 붙는다. */
function nextMax(){ return R.settings.nextMax||100; }
function graceDays(){ return R.settings.grace??30; }
function binName(){ return R.settings.binName||'폐기 서가'; }
function inBin(b){ return !b.discarded&&!!b.binAt; }
function outOfRank(b){
  if(b.discarded||b.held||b.binAt||!b.category) return false;
  const r=rankOf(b); return r>0 && r>(b.category==='best'?BEST_MAX:nextMax());
}
function inGrace(b){ const g=graceDays(); if(!g||!b.added) return false; return daysBetween(b.added.slice(0,10),today())<g; }
function isWaiting(b){ return outOfRank(b)&&!b.keep&&!!b.location&&!inGrace(b); }
function isRemovable(b){ return outOfRank(b)&&!b.location&&!inGrace(b); }
const locKey=l=>(l||'').replace(/\d+/g,n=>n.padStart(4,'0'));
let skipQ=(()=>{ try{ return JSON.parse(localStorage.getItem('seoga.skip'))||{}; }catch(e){ return {}; } })();
function waiting(){ return live().filter(isWaiting).sort((a,b)=>(skipQ[a.id]||'').localeCompare(skipQ[b.id]||'')||locKey(a.location).localeCompare(locKey(b.location),'ko')||rankOf(b)-rankOf(a)); }
function keptBooks(){ return live().filter(b=>b.keep&&outOfRank(b)).sort((a,b)=>locKey(a.location).localeCompare(locKey(b.location),'ko')); }
function binBooks(){ return live().filter(inBin).sort((a,b)=>(a.binAt||'').localeCompare(b.binAt||'')); }
function dueBooks(){ return binBooks().filter(b=>daysBetween(b.binAt,today())>=7); }
function removables(){ return live().filter(isRemovable).sort((a,b)=>rankOf(b)-rankOf(a)); }
/* 보관 라벨은 순위 안으로 돌아오면 저절로 뗀다 */
function sweepKeep(){ let n=0; live().forEach(b=>{ if(b.keep&&!outOfRank(b)){ b.keep=false; touch(b); n++; } }); if(n) save(); }
function discardedBooks(){ return S.books.filter(b=>b.discarded).sort((a,b)=>(b.discardedAt||'').localeCompare(a.discardedAt||'')); }
function locations(){ const m=new Map(); live().forEach(b=>{ if(b.location) m.set(b.location,(m.get(b.location)||0)+1); }); return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ko')); }
function recentLocations(){ const seen=[]; [...live()].sort((a,b)=>(b.added||'').localeCompare(a.added||'')).forEach(b=>{ if(b.location&&!seen.includes(b.location)&&seen.length<6) seen.push(b.location); }); return seen; }
function fieldValues(f){ const m=new Map(); S.books.forEach(b=>{ const v=(b[f]||'').trim(); if(v) m.set(v,(m.get(v)||0)+1); });
  return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ko')).map(e=>e[0]); }
function stateLabel(b){
  if(inBin(b)) return `<span class="tagdot d-none"></span>${esc(binName())} · ${esc(b.binAt)}`;
  if(b.discarded) return `<span class="tagdot d-none"></span>폐기함${b.discardedAt?' · '+esc(b.discardedAt):''}`;
  if(b.held) return `<span class="tagdot d-none"></span>보류${b.heldAt?' · '+esc(b.heldAt):''}${b.heldPage?' · '+b.heldPage+'쪽에서':''}`;
  if(!b.category) return '<span class="tagdot d-none"></span>분류 미정';
  return `<span class="tagdot ${CAT[b.category].dot}"></span>${CAT[b.category].name} ${rankOf(b)}위`;
}
function badges(b,rank){
  let s='';
  if(rank===1&&b.category==='next'&&!b.discarded) s+='<span class="badge b-read">지금 읽는 책</span>';
  if(b.gift) s+='<span class="badge b-gift">증정본</span>';
  if(b.discarded) s+='<span class="badge b-gone">폐기함</span>';
  else if(b.held) s+='<span class="badge b-gone">보류</span>';
  else if(inBin(b)) s+='<span class="badge b-cand">폐기 서가</span>';
  else if(b.keep&&outOfRank(b)) s+='<span class="badge b-keep">보관</span>';
  else if(isWaiting(b)) s+='<span class="badge b-cand">판단 대기</span>';
  else if(isRemovable(b)) s+='<span class="badge b-gone">지울 책</span>';
  return s;
}
/* 검색: 제목·지은이·펴낸곳·자리에 더해 한 줄과 밑줄·스캔 설명도 본다. 읽기 기록은 검색 한 번에 한 번만 훑는다. */
let NIDX=null;
function noteIndex(){ const m=new Map(); R.reads.forEach(x=>{ if(x.gone) return; const t=x.kind==='read'?x.memory:(x.kind==='mark'||x.kind==='scan')?x.text:''; if(!t) return; (m.get(x.bookId)||m.set(x.bookId,[]).get(x.bookId)).push(t); }); return m; }
function matches(b,k){ if(!k) return true; if([b.title,b.author,b.publisher,b.location].some(v=>(v||'').toLowerCase().includes(k))) return true;
  if(!NIDX) NIDX=noteIndex(); return (NIDX.get(b.id)||[]).some(t=>t.toLowerCase().includes(k)); }
function noteHit(b,k){ if(!k||!NIDX) return ''; const t=(NIDX.get(b.id)||[]).find(t=>t.toLowerCase().includes(k)); if(!t) return '';
  const i=t.toLowerCase().indexOf(k), a=Math.max(0,i-18), z=Math.min(t.length,i+k.length+40); return (a?'…':'')+t.slice(a,z)+(z<t.length?'…':''); }

/* ── 순위 ── */
function removeFromOrder(id){ for(const c of['best','next']) S.order[c]=S.order[c].filter(x=>x!==id); }
function startCompare(id){
  const b=book(id); if(!b||!b.category||b.discarded||b.held) return false;
  const cat=b.category, list=S.order[cat].filter(x=>x!==id);
  if(!list.length){ S.order[cat]=[id]; save(); return false; }
  cmp={id,cat,list,lo:0,hi:list.length}; render(); return true;
}
function answer(better){ const mid=(cmp.lo+cmp.hi)>>1; if(better) cmp.hi=mid; else cmp.lo=mid+1;
  if(cmp.lo>=cmp.hi) finishCompare(cmp.lo); else render(); }
function finishCompare(pos){
  const {id,cat,list}=cmp;
  S.order[cat]=list.slice(0,pos).concat(id,list.slice(pos)); cmp=null; save();
  let m=CAT[cat].name+' '+(pos+1)+'번째에 놓았습니다';
  if(pos+1>(cat==='best'?BEST_MAX:nextMax())) m+=' · 순위 밖이라 판단을 기다리게 됩니다';
  toast(m);
  if(S._queue&&S._queue.length){ nextQueued(); return; }
  view='list'; listTab=cat; shown=PAGE; render(true);
}
function cancelCompare(){
  const {id,cat,list}=cmp; S.order[cat]=list.concat(id); cmp=null; delete S._queue; save();
  toast('맨 아래에 두었습니다. 나중에 견주기로 자리를 정할 수 있습니다');
  view='list'; listTab=cat; shown=PAGE; render(true);
}
function nextQueued(){
  while(S._queue&&S._queue.length){ const id=S._queue.shift(); removeFromOrder(id); if(startCompare(id)) return; }
  delete S._queue; save(); render();
}

/* ── 그리기 ── */
function render(reset){
  const y=window.scrollY;
  if(!cmp) sweepKeep();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const n=live().length;
  document.getElementById('brandCount').textContent = S.books.length? n+'권 · 꽂힌 책 '+(n-homeless().length)+'권'+(discardedBooks().length?' · 폐기 '+discardedBooks().length+'권':'') : '';
  document.getElementById('view').innerHTML = cmp? '' : ({read:vRead,home:vHome,add:vAdd,list:vList,shelf:vShelf,data:vData}[view])();
  document.querySelectorAll('.veil').forEach(v=>v.remove());
  if(cmp) document.body.insertAdjacentHTML('beforeend',compareHTML());
  if(editId){ document.body.insertAdjacentHTML('beforeend',editHTML()); bindEdit(); }
  if(holdId&&!editId&&!cmp){ document.body.insertAdjacentHTML('beforeend',holdHTML()); const t=document.getElementById('h-reason'); if(t) t.focus(); }
  document.querySelectorAll('.pagebar').forEach(p=>p.remove());
  if(pageFor&&!cmp&&!editId&&!holdId){
    document.body.insertAdjacentHTML('beforeend',pageBarHTML());
    const i=document.getElementById('pg');
    if(i){ i.focus(); i.select(); i.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); savePage(); } }); }
  }
  if(view==='add') bindAdd();
  if(view==='read') bindRead();
  window.scrollTo(0, reset?0:y);
}

function noticeLine(){

function dupWarning(t){
  const t2=(t||'').trim(); if(!t2) return '';
  const hit=S.books.find(b=>b.title.trim()===t2); if(!hit) return '';
  return `<div class="hint" style="color:var(--seal)">이미 ‘${esc(hit.title)}’(${hit.discarded?'폐기함':hit.held?'보류':(hit.category?CAT[hit.category].name:'미정')}${hit.gift?' · 증정본':''}${hit.location?' · '+esc(hit.location):''})이 담겨 있습니다.</div>`;
}
function attachSuggest(id,pool,set){
  const inp=document.getElementById(id), box=document.getElementById(id+'-sugg');
  if(!inp||!box) return;
  const draw=()=>{
    const k=inp.value.trim().toLowerCase();
    if(!k){ box.innerHTML=''; return; }
    const list=pool().filter(v=>v.toLowerCase().includes(k)&&v.toLowerCase()!==k).slice(0,6);
    box.innerHTML=list.length?`<span class="lead">이미 적은 것</span>`+list.map(v=>`<button type="button">${esc(v)}</button>`).join(''):'';
    [...box.querySelectorAll('button')].forEach((el,i)=>{
      el.onpointerdown=ev=>{ ev.preventDefault(); inp.value=list[i]; set(list[i]); box.innerHTML=''; inp.focus(); };
    });
  };
  inp.addEventListener('input',draw);
  inp.addEventListener('blur',()=>setTimeout(()=>{ box.innerHTML=''; },150));
}
function bindAdd(){
  const map={'f-title':'title','f-author':'author','f-pub':'publisher','f-total':'total'};
  Object.keys(map).forEach(id=>{
    const e=document.getElementById(id); if(!e) return;
    e.addEventListener('input',()=>{ draft[map[id]]=e.value; const b=document.getElementById('btn-step1'); if(b) b.disabled=!draft.title.trim(); });
    e.addEventListener('keydown',ev=>{ if(ev.key!=='Enter'||ev.isComposing) return; ev.preventDefault();
      if(id==='f-title') document.getElementById('f-author').focus();
      else if(id==='f-author') document.getElementById('f-pub').focus();
      else if(id==='f-pub') document.getElementById('f-total').focus(); else addStep1(); });
  });
  const r=document.getElementById('f-recv'); if(r) r.addEventListener('input',()=>draft.received=r.value);
  const l=document.getElementById('f-loc');
  if(l){ l.addEventListener('input',()=>draft.location=l.value);
    l.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&!ev.isComposing){ev.preventDefault();addSave(true);} });
    l.focus(); }
  else if(draft.step===1&&!draft.title){ const t=document.getElementById('f-title'); if(t) t.focus(); }
  attachSuggest('f-author',()=>fieldValues('author'),v=>draft.author=v);
  attachSuggest('f-pub',()=>fieldValues('publisher'),v=>draft.publisher=v);
  attachSuggest('f-loc',()=>locations().map(l=>l[0]),v=>draft.location=v);
}
function bindEdit(){
  attachSuggest('e-author',()=>fieldValues('author'),()=>{});
  attachSuggest('e-pub',()=>fieldValues('publisher'),()=>{});
  attachSuggest('e-loc',()=>locations().map(l=>l[0]),()=>{});
}
function addStep1(){ if(!draft.title.trim()) return; draft.step=2; render(); }
function pickCat(c){ draft.category=c; if(draft.step===2) draft.step=3; render(); }
function toggleGift(){ draft.gift=!draft.gift; if(draft.gift&&!draft.received) draft.received=today(); render(); }
function setLoc(l){ draft.location=l; const e=document.getElementById('f-loc'); if(e) e.value=l; }
function addSave(again){
  const d=draft;
  if(!d.title.trim()||d.category===null){ toast('제목과 분류가 필요합니다'); return; }
  const now=new Date().toISOString();
  const b={id:uid(),title:d.title.trim(),author:d.author.trim(),publisher:d.publisher.trim(),
    category:d.category,gift:d.gift,received:d.gift?(d.received||today()):'',location:d.location.trim(),
    discarded:false,toDiscard:false,discardedAt:'',page:0,pageAt:'',total:Math.max(0,parseInt(d.total,10)||0),added:now,updated:now,note:''};
  S.books.push(b);
  if(b.location) S.lastLocation=b.location;
  const cat=b.category, loc=b.location;
  if(cat) S.order[cat].push(b.id);
  save();
  if(d.readNow&&cat==='next'){
    S.order.next=[b.id,...S.order.next.filter(x=>x!==b.id)]; save();
    draft=blankDraft(loc); view='read'; toast('지금 읽는 책으로 담았습니다'); render(true); return;
  }
  draft=blankDraft(again?loc:'');
  if(cat){ const list=S.order[cat].filter(x=>x!==b.id);
    if(list.length){ S.order[cat]=list; startCompare(b.id); return; } }
  toast('담았습니다'+(loc?' · '+loc:' · 자리 없음'));
  if(!again) view='home';
  render();
}

/* 목록 */
const TABS=[['best','베스트'],['next','다음 읽을 책'],['gift','증정본'],['undecided','미정'],['none','자리 없음'],['wait','판단 대기'],['keep','보관본'],['bin','폐기 서가'],['remove','지울 책'],['hold','보류'],['gone','폐기함']];
function tabList(c){
  if(c==='gift') return gifts();
  if(c==='undecided') return undecided();
  if(c==='none') return homeless();
  if(c==='wait') return waiting();
  if(c==='keep') return keptBooks();
  if(c==='bin') return binBooks();
  if(c==='remove') return removables();
  if(c==='hold') return heldBooks();
  if(c==='gone') return discardedBooks();
  return ordered(c);
}
function vList(){
  return `<div class="search"><input type="text" id="q" value="${esc(q)}" placeholder="모든 책에서 찾기 · 한 줄·밑줄도 함께">
      <button class="linkish" id="qclear" onclick="q='';shown=PAGE;render()" ${q?'':'hidden'}>지우기</button></div>
    <div class="choices" style="margin-bottom:16px">
      ${TABS.map(([c,n])=>`<button class="choice ${listTab===c?'on':''}" data-c="${c}" onclick="go('list','${c}')">${n} ${tabList(c).length}</button>`).join('')}
    </div>
    <div id="listbody">${listBody()}</div>`;
}
function listBody(){
  const k=q.trim().toLowerCase();
  const searching=!!k;
  NIDX=null;
  let list = searching? S.books.filter(b=>matches(b,k)) : tabList(listTab);
  if(searching) list=list.sort((a,b)=>((a.discarded||a.held)?1:0)-((b.discarded||b.held)?1:0)||a.title.localeCompare(b.title,'ko'));
  const ranked=!searching&&(listTab==='best'||listTab==='next');
  const total=list.length, part=list.slice(0,shown);
  if(!total) return `<div class="empty">${searching?'‘'+esc(q)+'’와 맞는 책이 없습니다.':'아직 없습니다.'}</div>`;
  return (searching?`<p class="note" style="margin:0 0 10px">모든 책에서 ${total}권을 찾았습니다.</p>`:'')

    + (total>part.length?`<div class="rowbtns"><button class="ghost" onclick="shown+=PAGE;refreshList()">${
        Math.min(PAGE,total-part.length)}권 더 보기 · 남은 ${total-part.length}권</button></div>`:'')
    + (!searching&&listTab==='bin'&&dueBooks().length?`<div class="rowbtns"><button class="ghost" onclick="outAll()">폐기 서가에 7일 넘게 있는 ${dueBooks().length}권 모두 내놓았다</button></div>`:'')

    + (ranked&&total>1?`<div class="rowbtns"><button class="ghost" onclick="reorderAll('${listTab}')">순서 처음부터 다시 정하기</button></div>`:'');

function refreshList(){ const el=document.getElementById('listbody'); if(el) el.innerHTML=listBody(); }

/* 한 줄: 읽기 기록마다 남긴 한 줄을 책별로 모은다 */
let linesFor=null;

  let a=x.fromPage||1, z=x.toPage||0;
  if(!z) return a+'쪽부터';
  if(a>z){ const t=a; a=z; z=t; }
  return a===z? z+'쪽' : a+'–'+z+'쪽';
}
function linesBtn(b){ const n=memLines(b.id).length; return n?`<button onclick="toggleLines('${b.id}')">${linesFor===b.id?'한 줄 접기':'한 줄 '+n+'개'}</button>`:''; }

function editLine(rid){

function dropLine(rid){

function copyLines(id){

/* 밑줄: 책별로 쪽 순서로 모은다. 스캔 기록도 함께. */

function toggle(id){ openId=openId===id?null:id; if(view==='list') refreshList(); else render(); }

function toggleGiftOn(id){

function unKeep(id){ const b=book(id); b.keep=false; touch(b); save(); toast('보관 라벨을 뗐습니다 · 다시 판단을 기다립니다'); render(); }

function unBin(id){

/* 자리 */
function vShelf(){
  const locs=locations();
  if(!locs.length&&!homeless().length) return `<div class="empty" style="border:none">아직 자리가 없습니다.</div>`;
  return `<div class="search"><input type="text" id="sq" value="${esc(sq)}" placeholder="자리·자리 없음·폐기함에서 책 찾기">
      <button class="linkish" id="sqclear" onclick="sq='';render()" ${sq?'':'hidden'}>지우기</button></div>
    <div class="rowbtns" style="margin:0 0 10px">
      <button class="linkish" onclick="allShelves(true)">모두 펼치기</button>
      <button class="linkish" onclick="allShelves(false)">모두 접기</button>
      <span class="note">서가 ${locs.length}칸</span>
    </div>
    <div id="shelfbody">${shelfBody()}</div>`;
}
function shelfBody(){
  const k=sq.trim().toLowerCase(), searching=!!k; NIDX=null;
  const groups=locations().map(([l,c])=>({name:l,count:c,items:live().filter(b=>b.location===l&&matches(b,k)).sort((a,b)=>a.title.localeCompare(b.title,'ko'))}));
  const none=homeless().filter(b=>matches(b,k));
  const gone=searching?discardedBooks().filter(b=>matches(b,k)):[];
  const held=searching?heldBooks().filter(b=>matches(b,k)):[];
  let found=none.length+gone.length+held.length; groups.forEach(g=>found+=g.items.length);
  if(searching&&!found) return `<div class="empty">‘${esc(sq)}’와 맞는 책이 어느 자리에도 없습니다.</div>`;
  const li=b=>`<li onclick="findBook('${b.id}')"><span class="tagdot ${b.category?CAT[b.category].dot:'d-none'}"></span>${esc(b.title)}${badges(b)}<span class="m"> ${esc(b.author||'')}</span></li>`;
  const bar=items=>{
    const t=items.length||1, n=c=>items.filter(b=>b.category===c).length;
    return `<div class="propbar">
      <span style="width:${n('best')/t*100}%;background:var(--seal)"></span>
      <span style="width:${n('next')/t*100}%;background:var(--deep)"></span>
      <span style="width:${n('')/t*100}%;background:var(--void)"></span></div>`;
  };
  const block=(key,name,items,tail,all)=>{
    const open=searching||openShelves.has(key);
    return `<div class="shelfrow" onclick="toggleShelf('${esc(key).replace(/'/g,'&#39;')}')">
        <div class="sname"><span class="mark">${open?'−':'+'}</span>${name}</div>
        ${bar(all||items)}
        <div class="n">${tail}</div></div>
      ${open?`<div class="shelf-body"><ul>${items.map(li).join('')}</ul></div>`:''}`;
  };
  let out='';
  groups.forEach(g=>{ if(searching&&!g.items.length) return;
    out+=block(g.name,esc(g.name),g.items, searching?`${g.items.length}권 찾음 · 모두 ${g.count}권`:`${g.count}권`,
      live().filter(b=>b.location===g.name)); });
  if(none.length) out+=block('__none__','자리 없음',none, searching?`${none.length}권 찾음`:`${homeless().length}권`,none);
  if(held.length) out+=block('__hold__','보류',held,`${held.length}권 찾음`,held);
  if(gone.length) out+=block('__gone__','폐기함',gone,`${gone.length}권 찾음`,gone);
  return (searching?`<p class="note" style="margin:0 0 10px">${found}권을 찾았습니다.</p>`:'')+out;
}

function myDevice(){
  try{ const d=localStorage.getItem('seoga.device'); if(d) return d; }catch(e){}
  const u=navigator.userAgent;
  if(/iPhone/.test(u)) return '아이폰';

  if(/Macintosh/.test(u)) return '맥북';
  return '이 기기';
}
function elsewhere(a){ return a&&a.device&&a.device!==myDevice(); }
function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function mdLabel(d){ return (+d.slice(5,7))+'월 '+(+d.slice(8,10))+'일'; }
function fmtMin(n){ n=Math.round(n); return n>=60? Math.floor(n/60)+'시간'+(n%60?' '+n%60+'분':'') : n+'분'; }
function fmtClock(ms){ const s=Math.max(0,Math.floor(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h? h+':'+String(m).padStart(2,'0') : String(m))+':'+String(x).padStart(2,'0'); }
function sessionsAll(){ return R.reads.filter(x=>x.kind==='read').sort((a,b)=>(a.start||'').localeCompare(b.start||'')); }
/* 계산에 쓰는 읽기는 시작한 날부터. 그 전의 기록은 한 줄 목록에만 남는다. */
function sessions(){ const sd=R.settings.startDate||''; return sessionsAll().filter(x=>(x.date||'')>=sd); }
/* 밑줄과 스캔: 읽는 중에 책에 붙여 두는 기록. 지우면 gone 표시만 남긴다(다른 기기에 지움을 전하려고). */
function markItems(id){ return R.reads.filter(x=>(x.kind==='mark'||x.kind==='scan')&&x.bookId===id&&!x.gone)
  .sort((a,b)=>((a.page||0)-(b.page||0))||(a.at||'').localeCompare(b.at||'')); }
function dayMinutes(){ const m=new Map(); sessions().forEach(s=>m.set(s.date,(m.get(s.date)||0)+s.minutes)); return m; }
/* 오늘 읽을 시간은 일주일에 한 번, 최근 14일 하루 평균(읽지 않은 날은 0분, 처음 읽기 전의 날은 빼고)을 보고 조정한다.
   평균이 목표의 90~110%면 그대로 두고, 그 밖이면 차이의 25%만큼 옮긴다. 한 번에 ±15%까지, 5분 단위, 최소 시간 아래로는 내려가지 않는다. */
function daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000); }
function avgWindow(){
  const first=R.settings.startDate||'', m=dayMinutes(), d=new Date(); d.setDate(d.getDate()-1);
  if(!first||!sessions().length&&dstr(d)<first) return null;
  let n=0, sum=0;
  for(let i=0;i<14;i++){ const k=dstr(d); if(k<first) break; sum+=m.get(k)||0; n++; d.setDate(d.getDate()-1); }
  return n? {avg:sum/n,n} : null;
}
function nextTarget(){
  const st=R.settings, w=avgWindow(); if(!w||w.n<7) return st.target;
  const r=w.avg/st.target; if(r>=0.9&&r<=1.1) return st.target;
  const cap=st.target*0.15; let d=(w.avg-st.target)*0.25; d=Math.max(-cap,Math.min(cap,d));
  return Math.max(st.min,Math.round((st.target+d)/5)*5);
}
function adjustTarget(){
  const st=R.settings, t=today();
  if(st.startDate&&(st.adjustedAt||'')<st.startDate) st.adjustedAt=st.startDate;
  if(!st.adjustedAt){ st.adjustedAt=t; try{ localStorage.setItem(RKEY,JSON.stringify(R)); }catch(e){} return; }
  if(daysBetween(st.adjustedAt,t)<7) return;
  const w=avgWindow(); if(!w||w.n<7) return;
  const nt=nextTarget(), was=st.target;
  st.target=nt; st.adjustedAt=t; st.updated=new Date().toISOString(); saveR();
  if(nt!==was) toast('최근 14일 하루 평균 '+fmtMin(w.avg)+' · 오늘 읽을 시간을 '+fmtMin(nt)+'으로 바꿨습니다');
}
function dayTargets(){ const m=new Map(); sessions().forEach(s=>{ if(s.target) m.set(s.date,s.target); }); return m; }
function runShortcut(name,text){
  let url='shortcuts://'+(R.settings.back?'x-callback-url/':'')+'run-shortcut?name='+encodeURIComponent(name)
    +'&input=text&text='+encodeURIComponent(text);
  if(R.settings.back) url+='&x-success='+encodeURIComponent(location.href.split('#')[0]);
  location.href=url;
}
function speed(id){
  const s=sessions().filter(x=>x.bookId===id&&x.minutes>0&&x.toPage>x.fromPage).slice(-5);
  if(s.length<2) return 0;
  const p=s.reduce((a,x)=>a+x.toPage-x.fromPage,0), mi=s.reduce((a,x)=>a+x.minutes,0);
  return mi? p/mi : 0;
}

      ${memLines(f.id).length?`<h2 class="sec" style="margin-top:22px">이 책에 남긴 한 줄 ${memLines(f.id).length}개</h2>${linesList(f)}`:''}
      ${markItems(f.id).length?`<h2 class="sec" style="margin-top:22px">이 책에 친 밑줄 ${markItems(f.id).length}개</h2>${marksList(f)}`:''}
      <p class="note" style="margin-top:18px">서가에서 읽은 책으로 옮기면 베스트 가운데 자리를 견주어 정합니다.</p>
      <div class="rowbtns"><button class="primary" onclick="finishMove()">읽은 책으로 옮기기</button>
        <button class="linkish" onclick="finishFor=null;render()">나중에</button></div></section><hr class="hr">`;
  }
  if(askFor&&book(askFor)&&!book(askFor).held&&!book(askFor).judgedAt){
    const a=book(askFor);
    out+=`<section style="margin-bottom:30px"><p class="rd-m" style="margin:0">‘${esc(a.title)}’, ${a.page}쪽까지 읽었습니다. 계속 읽을까요?</p>
      <p class="note" style="margin-top:14px">${holdLine(a)}쪽까지 읽어도 끌리지 않으면 놓아도 됩니다. 보류하면 책은 서가에서 치우고 쪽과 이유만 기록으로 남습니다. 한 번만 묻습니다.</p>
      <div class="rowbtns"><button class="primary" onclick="keepReading('${a.id}')">계속 읽기</button>
        <button class="ghost" onclick="startHold('${a.id}')">보류</button></div></section><hr class="hr">`;
  } else askFor=null;
  if(!b) return out+`<div class="empty" style="border:none;padding-top:0"><b>지금 읽는 책이 없습니다.</b><br>다음 읽을 책의 1위가 여기 놓입니다.
      <div class="rowbtns"><button class="primary" onclick="addForReading()">읽을 책 담기</button>
      <button class="ghost" onclick="go('list','best')">읽은 책 보기</button></div></div>`+statsHTML();
  const mem=lastMemory(b.id), mine=sessions().filter(x=>x.bookId===b.id);
  const tg=R.settings.target, todayMin=dayMinutes().get(today())||0, left=Math.max(0,tg-todayMin);
  const sp=speed(b.id), page=b.page||0;
  const todayPages=sessions().filter(x=>x.date===today()).reduce((a,x)=>a+Math.max(0,x.toPage-x.fromPage),0);
  const q = mem? `<div class="rd-q"><div class="rd-m">“${esc(mem.s.memory)}”</div>
        <div class="rd-ask">${QS[(mem.n-1)%QS.length]}</div>
        <div class="rd-when">${mdLabel(mem.s.date)}, ${mem.s.toPage}쪽까지 읽고 남긴 한 줄</div></div>`
    : `<p class="note" style="margin:0 0 28px">${mine.length?'':'이 책을 처음 펴는 날입니다. '}덮을 때 남긴 한 줄이 다음에 여기서 기다립니다.</p>`;
  const prog = b.total? `<div class="prog"><i style="width:${Math.min(100,page/b.total*100)}%"></i></div>
      <div class="hint" style="margin-top:0">${page} / ${b.total}쪽 · ${Math.min(100,Math.floor(page/b.total*100))}%${sp&&page<b.total?` · 지금 속도면 ${Math.max(1,Math.ceil((b.total-page)/(sp*tg)))}일 뒤 다 읽습니다`:''}</div>`
    : `<div class="field" style="margin-top:16px;max-width:260px"><label>이 책은 모두 몇 쪽입니까</label>
        <div style="display:flex;gap:8px;align-items:flex-end"><input type="number" inputmode="numeric" id="r-total" placeholder="쪽">
        <button class="ghost" style="padding:6px 12px;white-space:nowrap" onclick="setTotal('${b.id}')">적기</button></div>
        <div class="hint">한 번만 적으면 됩니다. 비워둬도 읽을 수 있습니다.</div></div>`;
  const plan=`<div class="plan">
      <div><span>${todayMin&&left?'오늘 남은 시간':'오늘 읽을 시간'}</span><b>${left?fmtMin(left):'채움'}</b></div>
      ${todayMin?`<div><span>오늘 읽은 분량</span><b>${todayPages}쪽</b></div>`:''}
      ${todayMin?`<div><span>오늘 읽은 시간</span><b>${fmtMin(todayMin)}</b></div>`:''}</div>
    <p class="hint" style="margin-top:2px">${left?`${todayMin?`오늘 읽을 시간 ${fmtMin(tg)} 가운데 남은 시간입니다. `:''}시작하면 ${R.settings.min}분 타이머를 겁니다.`:`오늘 읽을 시간 ${fmtMin(tg)}을 채웠습니다. 더 읽어도 좋습니다.`}</p>`;
  return out+q+`<section><h2 class="sec"><span class="tagdot d-next"></span>지금 읽는 책</h2>
      <div class="now-t">${esc(b.title)}</div>
      <div class="now-a">${[b.author,b.publisher].filter(Boolean).map(esc).join(' · ')}</div>${prog}</section>`
    + plan
    + `<div class="rowbtns"><button class="primary" style="min-width:62%" onclick="startReading()">읽기 시작</button></div>
      <div class="rowbtns" style="margin-top:10px"><button class="linkish" onclick="go('list','next')">다른 책 고르기</button>
      <button class="linkish" onclick="addForReading()">새 책 담아 읽기</button>
      <button class="linkish" onclick="startHold('${b.id}')">이 책 보류</button></div>`
    + statsHTML();
}
function vReading(){

  return `<div style="text-align:center;padding-top:8px">
      <div class="now-t" style="font-size:21px">${esc(b?b.title:(a.title||''))}</div>
      <div class="now-a">${a.fromPage?a.fromPage+'쪽부터':'처음부터'}${elsewhere(a)?' · '+esc(a.device)+'에서 시작':''}</div></div>
    ${Date.now()-a.startedAt>6*3600000?`<p class="hint" style="text-align:center;color:var(--seal);margin:18px 0 0">끝내지 않은 읽기가 있습니다. 읽기 끝을 누르면 실제로 읽은 시간을 고칠 수 있습니다.</p>`:''}
    <div class="clock" id="clock">${fmtClock(Date.now()-a.startedAt)}</div>

    <div class="markbox"><label>밑줄을 적다</label>
      <div class="markrow"><div class="pg"><input type="number" inputmode="numeric" id="mk-page" value="${markPage(a)}" placeholder="쪽" aria-label="쪽"></div>
        <div class="tx"><textarea id="mk-text" rows="2" placeholder="밑줄 친 문장" aria-label="밑줄 친 문장"></textarea></div></div>
      <div class="markfoot"><div class="hint" id="markn">${a.marks?'이번에 적은 밑줄 '+a.marks+'개':'여기에 적으면 책에 저장됩니다'}</div>
        <button class="ghost" style="padding:7px 16px" onclick="addMark()">적기</button></div></div>
    ${scanOpen?`<div class="scanbox"><label>스캔할 부분</label>
      <div class="markrow"><div class="pg"><input type="number" inputmode="numeric" id="sc-page" value="${markPage(a)}" placeholder="쪽" aria-label="쪽"></div>
        <div class="tx"><input type="text" id="sc-text" placeholder="어떤 부분인지 짧게 · 비워도 됩니다" aria-label="스캔 설명" autocomplete="off"></div></div>
      <div class="hint" style="margin:8px 0 0">쪽과 설명은 책에 저장되고, 스캔은 단축어로 넘어갑니다.</div>
      <div class="markfoot" style="justify-content:flex-end"><button class="linkish" onclick="scanOpen=false;render()">닫기</button><button class="ghost" style="padding:7px 16px" onclick="runScan()">스캔하기</button></div></div>`:''}
    <div class="rowbtns" style="justify-content:space-between;margin-top:34px">
      <button class="ghost" onclick="openScan()">스캔${a.scans?' · '+a.scans:''}</button>
      <button class="primary" onclick="closeBook()">읽기 끝</button></div>
    <div class="rowbtns" style="margin-top:28px"><button class="linkish" onclick="abandon()">기록하지 않고 그만두기</button></div>`;
}
function vClosing(){
  const a=R.active, b=book(a.bookId), el=(a.endedAt-a.startedAt)/60000, sp=b?speed(b.id):0;
  let guess=sp? Math.round((a.fromPage||0)+sp*el) : '';
  if(guess&&b&&b.total) guess=Math.min(b.total,guess);
  return `<div style="max-width:560px">
    <p class="hint" style="margin:0 0 20px">${esc(b?b.title:'')} · ${fmtMin(Math.max(1,el))} 읽었습니다${elsewhere(a)?' · '+esc(a.device)+'에서 시작':''}</p>
    <div class="field" style="max-width:220px"><label>몇 쪽까지 읽었습니까</label>
      <input type="number" inputmode="numeric" id="r-page" value="${guess}" placeholder="${a.fromPage?a.fromPage+'쪽에서 시작':'쪽'}"></div>
    ${el>Math.max(180,R.settings.target*1.5)?`<div class="field" style="max-width:220px"><label>실제로 읽은 시간(분)</label>
      <input type="number" inputmode="numeric" id="r-min" value="${Math.round(el)}"><div class="hint">읽기 끝을 늦게 누르셨다면 고쳐주세요.</div></div>`:''}
    <div class="field" style="margin-top:22px"><label>무엇이 기억에 남습니까</label>
      <textarea id="r-mem" rows="2" placeholder="한 줄이면 됩니다. 비워둬도 됩니다."></textarea></div>
    <div class="rowbtns"><button class="primary" onclick="stamp()">도장 찍기</button></div></div>`;
}
function statsHTML(){
  const s=sessions();
  if(!s.length) return `<hr class="hr"><p class="note">읽은 날마다 여기 달력에 도장이 찍힙니다.</p>`;
  const m=dayMinutes(), dt=dayTargets(), t=today(), ym=t.slice(0,7), y=t.slice(0,4), tg=R.settings.target;
  const sum=f=>s.filter(f).reduce((a,x)=>{ a.mi+=x.minutes; a.p+=Math.max(0,x.toPage-x.fromPage); return a; },{mi:0,p:0});
  const mo=sum(x=>x.date.startsWith(ym)), yr=sum(x=>x.date.startsWith(y));
  let streak=0; const d=new Date(); if(!m.get(t)) d.setDate(d.getDate()-1);
  while(m.get(dstr(d))){ streak++; d.setDate(d.getDate()-1); }
  const now=new Date(), first=new Date(now.getFullYear(),now.getMonth(),1).getDay(), last=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  let cal=['일','월','화','수','목','금','토'].map(w=>`<div class="h">${w}</div>`).join('')+'<div></div>'.repeat(first);
  for(let i=1;i<=last;i++){ const k=ym+'-'+String(i).padStart(2,'0'), v=m.get(k)||0;
    cal+=`<div class="d${v>=(dt.get(k)||tg)?' full':v?' part':''}${k===t?' today':''}"${v?` title="${fmtMin(v)}"`:''}>${i}</div>`; }
  const fin=[], seen=new Set();
  [...s].reverse().forEach(x=>{ if(!x.finished||!x.date.startsWith(y)||seen.has(x.bookId)) return; seen.add(x.bookId);
    const f=s.find(z=>z.bookId===x.bookId), days=Math.round((new Date(x.date)-new Date(f.date))/86400000)+1;
    fin.push(`<li><span>${esc(x.title)}</span><span class="m">${mdLabel(x.date)} · ${days}일</span></li>`); });
  return `<hr class="hr"><h2 class="sec">${now.getMonth()+1}월</h2>
    <div class="cal">${cal}</div>
    <p class="hint">● 그날의 읽을 시간을 채운 날 · ○ 조금이라도 읽은 날</p>
    <div class="stat" style="margin-top:22px">
      <div><span>이어 읽은 날</span><b>${streak}일</b></div>
      ${(w=>w?`<div><span>최근 ${w.n}일 하루 평균</span><b>${fmtMin(w.avg)}</b></div>`:'')(avgWindow())}
      <div><span>이달</span><b>${fmtMin(mo.mi)}</b></div>
      <div><span>이달 쪽수</span><b>${mo.p}</b></div>
      <div><span>올해</span><b>${fmtMin(yr.mi)}</b></div>
      <div><span>올해 쪽수</span><b>${yr.p}</b></div>
      ${(()=>{ const all=sum(()=>true); return all.mi>=1? `<div><span>시간당 쪽수</span><b>${Math.round(all.p/(all.mi/60))}</b></div>`:''; })()}</div>
    ${fin.length?`<h2 class="sec" style="margin-top:32px">올해 다 읽은 책 ${fin.length}권</h2><ul class="plain">${fin.join('')}</ul>`:''}`;
}
function bindRead(){
  const mk=document.getElementById('mk-text');
  if(mk) mk.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); addMark(); } });
  const sc=document.getElementById('sc-text');
  if(sc) sc.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); runScan(); } });
  const t=document.getElementById('r-total');
  if(t) t.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); const b=ordered('next')[0]; if(b) setTotal(b.id); } });
  const p=document.getElementById('r-page'); if(p){ p.focus(); p.select(); }
  updClock();
}
function updClock(){
  const a=R.active; if(!a||a.closing) return;
  const c=document.getElementById('clock'); if(!c) return;
  const ms=Date.now()-a.startedAt; c.textContent=fmtClock(ms);
  const s=document.getElementById('clocksub'); if(!s) return;
  const left=(a.need||0)-ms/60000;
  if(left<=0){ s.textContent='오늘 읽을 시간을 채웠습니다 · 계속 읽어도 됩니다'; s.classList.add('done'); }
  else { s.textContent='오늘 목표까지 '+fmtMin(Math.ceil(left)); s.classList.remove('done'); }
}
function setTotal(id){
  const b=book(id), v=parseInt((document.getElementById('r-total')||{}).value,10);
  if(!b) return; if(!(v>0)){ toast('쪽수를 숫자로 적어주세요'); return; }
  b.total=v; touch(b); save(); render();
}
function startReading(){
  const b=ordered('next')[0]; if(!b) return;
  const t=document.getElementById('r-total'); if(t&&t.value){ const v=parseInt(t.value,10); if(v>0){ b.total=v; touch(b); save(); } }
  const need=Math.max(0,R.settings.target-(dayMinutes().get(today())||0));
  R.active={bookId:b.id,title:b.title,startedAt:Date.now(),fromPage:b.page||0,need,scans:0,marks:0,device:myDevice()};
  finishFor=null; scanOpen=false; saveR(); render(true);
  runShortcut(R.settings.sc.read||'읽기',String(R.settings.min));
}
function closeBook(){
  const a=R.active, b=book(a.bookId);
  a.endedAt=Date.now(); a.closing=true; saveR(); render(true);
  runShortcut(R.settings.sc.end||'읽기끝',b?b.title:(a.title||''));
}
function abandon(){ if(!confirm('이번 읽기를 기록하지 않고 그만둡니다.')) return; R.active=null; saveR(); render(true); }
function stamp(){
  const a=R.active, b=book(a.bookId), g=id=>document.getElementById(id);
  const to=parseInt(g('r-page').value,10), mem=g('r-mem').value.trim();
  if(isNaN(to)||to<0){ toast('몇 쪽까지 읽었는지 적어주세요'); g('r-page').focus(); return; }
  let minutes=Math.max(1,Math.round((a.endedAt-a.startedAt)/60000));
  if(g('r-min')){ const v=parseInt(g('r-min').value,10); if(v>0) minutes=v; }
  const now=new Date().toISOString(), st=new Date(a.startedAt);
  const rec={id:uid(),kind:'read',bookId:a.bookId,title:b?b.title:(a.title||''),date:dstr(st),start:st.toISOString(),minutes,target:R.settings.target,
    fromPage:a.fromPage||0,toPage:to,memory:mem,scans:a.scans||0,finished:!!(b&&b.total&&to>=b.total),updated:now};
  R.reads.push(rec);
  if(b){ b.page=to; b.pageAt=today(); touch(b); }
  R.active=null; save(); saveR();
  if(rec.finished) finishFor=b.id;
  else if(b&&!b.judgedAt){ const h=holdLine(b); if(h&&to>=h) askFor=b.id; }
  toast(fmtMin(minutes)+' · '+to+'쪽까지'); render(true);
}
let scanOpen=false;
function markPage(a){ return a.markPage||a.fromPage||''; }
function pageVal(id){ const n=parseInt((document.getElementById(id)||{}).value,10); return n>0?n:0; }
function addMark(){
  const i=document.getElementById('mk-text'); if(!i) return; const t=i.value.trim();
  const a=R.active; if(!a) return;
  if(!t){ toast('밑줄 친 문장을 적어주세요'); i.focus(); return; }
  const b=book(a.bookId), page=pageVal('mk-page'), now=new Date().toISOString();
  R.reads.push({id:uid(),kind:'mark',bookId:a.bookId,title:b?b.title:(a.title||''),page,text:t,date:today(),at:now,updated:now});
  a.marks=(a.marks||0)+1; if(page) a.markPage=page; saveR(); i.value=''; i.blur();
  const n=document.getElementById('markn'); if(n) n.textContent='이번에 적은 밑줄 '+a.marks+'개';
  toast('밑줄을 책에 저장했습니다');
}
function openScan(){ scanOpen=true; render(); const t=document.getElementById('sc-text'); if(t) t.focus(); }
function runScan(){
  const a=R.active; if(!a) return; const b=book(a.bookId), now=new Date().toISOString();
  const page=pageVal('sc-page'), note=((document.getElementById('sc-text')||{}).value||'').trim();
  R.reads.push({id:uid(),kind:'scan',bookId:a.bookId,title:b?b.title:(a.title||''),page,text:note,date:today(),at:now,updated:now});
  a.scans=(a.scans||0)+1; if(page) a.markPage=page; scanOpen=false; saveR();
  const text=(b?b.title:(a.title||'')).replace(/[^\p{L}\p{N}_-]/gu,'');   // 애플 메모 태그로 쓰도록 글자·숫자·_·-만 남긴다
  runShortcut(R.settings.sc.scan||'스캔',text);
  setTimeout(render,300);
}
function finishMove(){ const id=finishFor; finishFor=null; if(book(id)) moveTo(id,'best'); else render(); }
function addForReading(){ view='add'; openId=null; draft=blankDraft(draft.location); draft.category='next'; draft.readNow=true; render(true); }
function readNow(id){ S.order.next=[id,...S.order.next.filter(x=>x!==id)]; save(); openId=null; view='read'; toast('지금 읽는 책으로 올렸습니다'); render(true); }

/* 읽기 설정 · 동기화 화면 (보관 탭 아래) */
function vSettings(){
  const st=R.settings, w=avgWindow(), nt=nextTarget(), wait=Math.max(0,7-daysBetween(st.adjustedAt||today(),today()));
  return `<hr class="hr"><h2 class="sec">읽기</h2>
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <div class="field" style="width:170px"><label>오늘 읽을 시간(분)</label><input type="number" inputmode="numeric" id="s-target" value="${st.target}"></div>
      <div class="field" style="width:170px"><label>최소 읽을 시간(분)</label><input type="number" inputmode="numeric" id="s-min" value="${st.min}"></div>

    <p class="note">오늘 읽을 시간은 일주일에 한 번, 최근 14일 하루 평균을 보고 조정됩니다. 읽지 않은 날은 0분으로 치고, 시작한 날 전의 날은 빼고 셉니다. 평균이 목표의 90~110%면 그대로 두고, 그 밖이면 차이의 4분의 1만큼 옮기되 한 번에 15%를 넘지 않게 5분 단위로 바꿉니다. 최소 읽을 시간 아래로는 내려가지 않습니다.
      ${w?`<br>지금 최근 ${w.n}일 하루 평균은 ${fmtMin(w.avg)}입니다.${w.n<7?' 7일이 쌓여야 조정을 시작합니다.':(wait?` ${wait}일 뒤에 ${nt===st.target?'그대로 둘':fmtMin(nt)+'으로 바꿀'} 예정입니다.`:'')}`:''}</p>
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:18px">
      <div class="field" style="width:150px"><label>시작 단축어</label><input type="text" id="s-sc-read" value="${esc(st.sc.read)}" autocapitalize="off"></div>
      <div class="field" style="width:150px"><label>끝 단축어</label><input type="text" id="s-sc-end" value="${esc(st.sc.end)}" autocapitalize="off"></div>
      <div class="field" style="width:150px"><label>스캔 단축어</label><input type="text" id="s-sc-scan" value="${esc(st.sc.scan)}" autocapitalize="off"></div></div>
    <p class="hint" style="margin-top:0">시작 단축어에는 최소 읽을 시간이 숫자로, 끝 단축어에는 책 제목이 그대로, 스캔 단축어에는 띄어쓰기와 문장부호를 뺀 책 제목이 넘어갑니다.</p>
    <div class="field" style="width:200px;margin-top:6px"><label>이 기기 이름</label><input type="text" id="s-dev" value="${esc(myDevice())}"></div>
    <p class="hint" style="margin-top:0">다른 기기에서 읽는 중일 때 “아이폰에서 읽는 중”처럼 보이는 이름입니다. 이 기기에만 저장됩니다.</p>
    <button class="toggle ${st.back?'on':''}" onclick="toggleBack()"><span class="box"></span>단축어가 끝나면 서가로 돌아오기</button>
    <div class="hint">홈 화면에 둔 서가로 돌아오지 않고 사파리에서 따로 열리면 이 표시를 떼세요. 이 기기에만 적용됩니다.</div>
    <div class="rowbtns"><button class="ghost" onclick="saveReadSet()">읽기 설정 저장</button></div>
    <hr class="hr"><h2 class="sec">동기화</h2>
    <p class="note">Supabase 주소와 anon 키를 넣으면 아이폰과 맥이 같은 서가와 읽기 기록을 봅니다. 미래와 같은 프로젝트를 써도 됩니다. 서가는 seoga_로 시작하는 표만 씁니다. 주소와 키는 이 기기에만 저장되고 파일에는 들어가지 않습니다.</p>
    <div class="field"><label>프로젝트 주소</label><input type="text" id="s-url" value="${esc(sbCfg.url||'')}" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label>anon 키</label><input type="password" id="s-key" value="${esc(sbCfg.key||'')}" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="rowbtns"><button class="primary" onclick="sbSave()">연결하기</button>
      ${sbCfg.url?`<button class="ghost" onclick="syncAll(true)">지금 맞추기</button><button class="linkish" onclick="sbOff()">연결 끊기</button>`:''}</div>
    <p class="hint" id="sync-st">${syncLabel()}</p>
    <h2 class="sec" style="margin-top:26px">표 만들기</h2>
    <p class="note">처음 한 번, Supabase의 SQL Editor에 붙여 넣고 실행하세요. 여러 번 실행해도 탈이 없고, 미래의 표는 건드리지 않습니다.</p>
    <pre class="sql" id="sqltext">${esc(SQL)}</pre>
    <div class="rowbtns"><button class="ghost" onclick="copySQL()">SQL 복사</button></div>`;
}
function saveReadSet(){
  const st=R.settings, g=id=>document.getElementById(id);
  const tg=parseInt(g('s-target').value,10), mn=parseInt(g('s-min').value,10);
  if(!(tg>0&&tg<=720)){ toast('오늘 읽을 시간을 분으로 적어주세요'); return; }
  if(!(mn>0&&mn<=180)){ toast('최소 읽을 시간을 분으로 적어주세요'); return; }
  if(tg<mn){ toast('오늘 읽을 시간이 최소 읽을 시간보다 짧습니다'); return; }
  const sd=g('s-start').value||st.startDate;
  if(tg!==st.target||mn!==st.min||sd!==st.startDate){
    if(tg!==st.target) st.adjustedAt=today();
    st.target=tg; st.min=mn; st.startDate=sd; if((st.adjustedAt||'')<sd) st.adjustedAt=sd; st.updated=new Date().toISOString();
  }
  const dv=g('s-dev').value.trim(); try{ if(dv) localStorage.setItem('seoga.device',dv); else localStorage.removeItem('seoga.device'); }catch(e){}
  st.sc={read:g('s-sc-read').value.trim()||'읽기',end:g('s-sc-end').value.trim()||'읽기끝',scan:g('s-sc-scan').value.trim()||'스캔'};
  saveR(); toast('저장했습니다'); render();
}
function saveDiscardSet(){
  const st=R.settings, g=id=>document.getElementById(id);
  const nm=parseInt(g('s-nmax').value,10), gr=parseInt(g('s-grace').value,10), bn=g('s-bin').value.trim()||'폐기 서가';
  if(!(nm>0)){ toast('다음 읽을 책 순위를 권수로 적어주세요'); return; }
  if(!(gr>=0)){ toast('유예 기간을 날수로 적어주세요'); return; }
  const before=waiting().length+removables().length, old=[st.nextMax,st.grace];
  st.nextMax=nm; st.grace=gr;
  const after=waiting().length+removables().length;
  if(after>before&&!confirm('이렇게 바꾸면 '+(after-before)+'권이 새로 판단을 기다리게 됩니다. 저장할까요?')){ st.nextMax=old[0]; st.grace=old[1]; render(); return; }
  if(bn!==st.binName){ const was=st.binName; live().forEach(b=>{ if(inBin(b)&&b.location===was){ b.location=bn; touch(b); } }); st.binName=bn; save(); }
  st.updated=new Date().toISOString(); saveR(); toast('저장했습니다'); render();
}
function toggleBack(){ R.settings.back=!R.settings.back; saveR(); render(); }
function copySQL(){ navigator.clipboard.writeText(SQL).then(()=>toast('복사했습니다'),()=>toast('복사할 수 없습니다')); }

/* ── 동기화 ── 책·읽기 기록은 한 줄씩, 순서와 최소 시간은 따로 둔다. 더 나중에 고친 쪽이 이긴다. */
const SQL=`create table if not exists seoga_books (id text primary key, data jsonb not null, updated_at timestamptz not null default now());
create table if not exists seoga_reads (id text primary key, data jsonb not null, updated_at timestamptz not null default now());
create table if not exists seoga_meta  (id text primary key, data jsonb not null, updated_at timestamptz not null default now());

alter table seoga_books enable row level security;
alter table seoga_reads enable row level security;
alter table seoga_meta  enable row level security;

drop policy if exists "seoga open" on seoga_books;
drop policy if exists "seoga open" on seoga_reads;
drop policy if exists "seoga open" on seoga_meta;
create policy "seoga open" on seoga_books for all using (true) with check (true);
create policy "seoga open" on seoga_reads for all using (true) with check (true);
create policy "seoga open" on seoga_meta  for all using (true) with check (true);

do $$
declare t text;
begin
  foreach t in array array['seoga_books','seoga_reads','seoga_meta'] loop
    if not exists (select 1 from pg_publication_tables
      where pubname='supabase_realtime' and schemaname='public' and tablename=t) then
      execute format('alter publication supabase_realtime add table public.%I', t);
    end if;
  end loop;
end $$;`;
const SBKEY='seoga.sb', MKEY='seoga.mark';
let sbCfg=(()=>{ try{ return JSON.parse(localStorage.getItem(SBKEY))||{}; }catch(e){ return {}; } })();
let MARK=(()=>{ try{ return JSON.parse(localStorage.getItem(MKEY))||null; }catch(e){ return null; } })()||{b:{},r:{},order:'',min:''};
let SB=null, syncTimer=null, syncing=false, syncAgain=false, syncState='', syncErr='';
function saveMark(){ try{ localStorage.setItem(MKEY,JSON.stringify(MARK)); }catch(e){} }
function syncLabel(){
  if(!sbCfg.url) return '연결하지 않았습니다. 기록은 이 기기에만 있습니다.';
  return {on:'동기화되어 있습니다.',busy:'맞추는 중입니다.',err:'동기화하지 못했습니다. '+(syncErr||'인터넷이 끊겼다면 이어지는 대로 다시 맞춥니다.'),'':'연결을 기다리는 중입니다.'}[syncState];
}
function setSync(st){
  syncState=st;
  const el=document.getElementById('syncMark');
  if(el){ el.textContent=sbCfg.url?({on:'· 동기화됨',busy:'· 맞추는 중',err:'· 동기화 안 됨'}[st]||''):''; el.classList.toggle('err',st==='err'); }
  const s=document.getElementById('sync-st'); if(s) s.textContent=syncLabel();
}
function queueSync(){ if(!SB) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>pushDirty(),900); }
async function sbConnect(loud){
  if(!sbCfg.url||!sbCfg.key){ setSync(''); return false; }
  setSync('busy');
  try{
    const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    SB=mod.createClient(sbCfg.url,sbCfg.key);
  }catch(e){ SB=null; syncErr='Supabase를 불러오지 못했습니다.'; setSync('err'); if(loud) toast('연결하지 못했습니다 · 인터넷을 확인하세요'); return false; }
  const ok=await syncAll(loud);
  SB.channel('seoga-'+uid())
    .on('postgres_changes',{event:'*',schema:'public',table:'seoga_books'},p=>applyRows('b',[p.new]))
    .on('postgres_changes',{event:'*',schema:'public',table:'seoga_reads'},p=>applyRows('r',[p.new]))
    .on('postgres_changes',{event:'*',schema:'public',table:'seoga_meta'},p=>applyRows('m',[p.new]))
    .subscribe();
  return ok;
}
async function fetchAll(t){
  let out=[], from=0;
  for(;;){ const {data,error}=await SB.from(t).select('id,data').range(from,from+999); if(error) throw error;
    out=out.concat(data); if(data.length<1000) break; from+=1000; }
  return out;
}
async function syncAll(loud){
  if(!SB){ if(sbCfg.url) return sbConnect(loud); return false; }
  if(syncing){ syncAgain=true; return true; }
  syncing=true; setSync('busy'); let ok=true;
  try{
    const [bk,rd,mt]=await Promise.all(['seoga_books','seoga_reads','seoga_meta'].map(fetchAll));
    const c1=applyRows('b',bk,true), c2=applyRows('r',rd,true), c3=applyRows('m',mt,true);
    afterApply(c1||c2||c3);
    await pushDirty(true);
    syncErr=''; setSync('on');
    if(loud) toast('맞췄습니다');
  }catch(e){
    ok=false;
    const miss=e&&(e.code==='42P01'||e.code==='PGRST205'||/does not exist|schema cache/i.test(e.message||''));
    syncErr=miss?'Supabase에 서가 표가 없습니다. 아래 SQL을 먼저 실행하세요.':'';
    setSync('err'); if(loud) toast(miss?'서가 표가 없습니다 · SQL을 먼저 실행하세요':'동기화하지 못했습니다');
  }
  syncing=false;
  if(syncAgain){ syncAgain=false; syncAll(); }
  return ok;
}
function applyRows(kind,rows,bulk){
  let changed=false;
  rows.forEach(row=>{
    if(!row||!row.data) return; const d=row.data, id=row.id, up=d.updated||'';
    if(kind==='b'){
      const loc=S.books.find(x=>x.id===id), tomb=S.tomb[id]||'';
      if(up>(MARK.b[id]||'')) MARK.b[id]=up;
      if(d.purged){
        if(loc&&(loc.updated||'')<=up){ S.books=S.books.filter(x=>x.id!==id); removeFromOrder(id); changed=true; }
        if(up>tomb) S.tomb[id]=up; return;
      }
      if(tomb&&tomb>=up) return;
      if(!loc){ S.books.push(normBook(Object.assign({},d))); changed=true; }
      else if(up>(loc.updated||'')){ Object.keys(loc).forEach(k=>delete loc[k]); Object.assign(loc,normBook(Object.assign({},d))); changed=true; }
    } else if(kind==='r'){
      if(up>(MARK.r[id]||'')) MARK.r[id]=up;
      const i=R.reads.findIndex(x=>x.id===id);
      if(i<0){ R.reads.push(d); changed=true; }
      else if(up>(R.reads[i].updated||'')){ R.reads[i]=d; changed=true; }
    } else if(id==='order'){
      if(up>(MARK.order||'')) MARK.order=up;
      if(up>(S.orderUpdated||'')){ S.order={best:d.best||[],next:d.next||[]}; S.orderUpdated=up; orderSig=JSON.stringify(S.order); changed=true; }
    } else if(id==='active'){
      if(up>(MARK.active||'')) MARK.active=up;
      if(up>(R.activeUpdated||'')){ R.active=d.active||null; R.activeUpdated=up; activeSig=JSON.stringify(R.active); changed=true; }
    } else if(id==='settings'){
      if(up>(MARK.min||'')) MARK.min=up;
      if(up>(R.settings.updated||'')){
        if(d.target>0) R.settings.target=d.target; if(d.min>0) R.settings.min=d.min;
        if(d.adjustedAt) R.settings.adjustedAt=d.adjustedAt;
        if(d.nextMax>0) R.settings.nextMax=d.nextMax; if(d.grace>=0) R.settings.grace=d.grace; if(d.binName) R.settings.binName=d.binName; if(d.startDate) R.settings.startDate=d.startDate;
        R.settings.updated=up; changed=true; }
    }
  });
  saveMark();
  if(!bulk) afterApply(changed);
  return changed;
}
/* 받아온 뒤 한 번만 정리한다. 순서를 손본 것은 이 기기의 결정이 아니므로 시각을 올리지 않는다. */
function afterApply(changed){
  if(!changed) return;
  reconcile(); orderSig=JSON.stringify(S.order);
  localStorage.setItem(KEY,JSON.stringify({books:S.books,order:S.order,lastLocation:S.lastLocation,orderUpdated:S.orderUpdated,tomb:S.tomb}));
  try{ localStorage.setItem(RKEY,JSON.stringify(R)); }catch(e){}
  const ae=document.activeElement;
  if(!(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName))&&!cmp&&!editId&&!pageFor) render();
}
/* 순서와 분류가 어긋나지 않게: 분류에 없는 책은 순서에서 빼고, 순서에 빠진 책은 맨 아래에 붙인다 */
function reconcile(){
  if(cmp) return;
  for(const c of ['best','next']){
    const seen=new Set();
    S.order[c]=S.order[c].filter(id=>{ const b=book(id); if(!b||b.discarded||b.held||b.binAt||b.category!==c||seen.has(id)) return false; seen.add(id); return true; });
    S.books.forEach(b=>{ if(!b.discarded&&!b.held&&!b.binAt&&b.category===c&&!seen.has(b.id)){ S.order[c].push(b.id); seen.add(b.id); } });
  }
}
async function pushDirty(inner){
  if(!SB) return;
  const at=new Date().toISOString(), bR=[], rR=[], mR=[];
  S.books.forEach(b=>{ if((b.updated||'')>(MARK.b[b.id]||'')) bR.push({id:b.id,data:b,updated_at:at}); });
  Object.entries(S.tomb).forEach(([id,t])=>{ if(t>(MARK.b[id]||'')&&!book(id)) bR.push({id,data:{id,purged:true,updated:t},updated_at:at}); });
  R.reads.forEach(x=>{ if((x.updated||'')>(MARK.r[x.id]||'')) rR.push({id:x.id,data:x,updated_at:at}); });
  if(S.orderUpdated&&S.orderUpdated>(MARK.order||'')) mR.push({id:'order',data:{best:S.order.best,next:S.order.next,updated:S.orderUpdated},updated_at:at});
  if(R.activeUpdated&&R.activeUpdated>(MARK.active||'')) mR.push({id:'active',data:{active:R.active||null,updated:R.activeUpdated},updated_at:at});
  const st=R.settings;
  if(st.updated&&st.updated>(MARK.min||'')) mR.push({id:'settings',data:{target:st.target,min:st.min,adjustedAt:st.adjustedAt,nextMax:st.nextMax,grace:st.grace,binName:st.binName,startDate:st.startDate,updated:st.updated},updated_at:at});
  if(!bR.length&&!rR.length&&!mR.length){ if(!inner&&syncState!=='on') setSync('on'); return; }
  if(!inner) setSync('busy');
  try{
    for(const [t,rows] of [['seoga_books',bR],['seoga_reads',rR],['seoga_meta',mR]])
      for(let i=0;i<rows.length;i+=500){ const {error}=await SB.from(t).upsert(rows.slice(i,i+500)); if(error) throw error; }
    bR.forEach(r=>MARK.b[r.id]=r.data.updated); rR.forEach(r=>MARK.r[r.id]=r.data.updated);
    mR.forEach(r=>{ if(r.id==='order') MARK.order=r.data.updated; else if(r.id==='active') MARK.active=r.data.updated; else MARK.min=r.data.updated; });
    saveMark(); if(!inner){ syncErr=''; setSync('on'); }
  }catch(e){ if(inner) throw e; setSync('err'); }
}
function sbSave(){
  const u=document.getElementById('s-url').value.trim().replace(/\/+$/,''), k=document.getElementById('s-key').value.trim();
  if(!/^https:\/\/\S+$/.test(u)||!k){ toast('주소와 키를 모두 넣어주세요'); return; }
  if(u!==sbCfg.url){ MARK={b:{},r:{},order:'',min:''}; saveMark(); }
  sbCfg={url:u,key:k}; localStorage.setItem(SBKEY,JSON.stringify(sbCfg));
  if(SB){ try{ SB.removeAllChannels(); }catch(e){} } SB=null;
  sbConnect(true).then(ok=>{ if(ok) toast('연결했습니다'); render(); });
}
function sbOff(){
  if(!confirm('이 기기의 동기화를 끕니다. 기록은 이 기기에 그대로 남습니다.')) return;
  if(SB){ try{ SB.removeAllChannels(); }catch(e){} } SB=null;
  localStorage.removeItem(SBKEY); sbCfg={}; setSync(''); render();
}

/* 이동·입력 */
function go(v,tab){ view=v; if(tab) listTab=tab; openId=null; shown=PAGE;
  if(v==='add'&&!draft.title) draft=blankDraft(draft.location); render(true); }
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function onSearch(t){
  if(t.id==='q'){ q=t.value; shown=PAGE; const c=document.getElementById('qclear'); if(c) c.hidden=!q; refreshList(); }
  else { sq=t.value; const c=document.getElementById('sqclear'); if(c) c.hidden=!sq; refreshShelf(); }
}
document.addEventListener('compositionstart',()=>{ composing=true; });
document.addEventListener('compositionend',e=>{ composing=false; if(e.target.id==='q'||e.target.id==='sq') onSearch(e.target); });
document.addEventListener('input',e=>{
  const id=e.target.id; if(id!=='q'&&id!=='sq') return;
  if(composing||e.isComposing){ if(id==='q') q=e.target.value; else sq=e.target.value; return; }
  onSearch(e.target);
});
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return; if(editId){ editId=null; render(); } else if(holdId){ holdId=null; render(); } });
window.addEventListener('beforeunload',()=>{ try{ localStorage.setItem(KEY,JSON.stringify({books:S.books,order:S.order,lastLocation:S.lastLocation,orderUpdated:S.orderUpdated,tomb:S.tomb})); }catch(e){} });
activeSig=JSON.stringify(R.active||null);
adjustTarget();
render();
setInterval(updClock,1000);
if(sbCfg.url&&sbCfg.key) sbConnect(false);
window.addEventListener('online',()=>{ if(sbCfg.url) syncAll(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState!=='visible') return;
  adjustTarget();
  if(R.active&&!elsewhere(R.active)&&view!=='read'){ view='read'; render(true); } else updClock();
  if(sbCfg.url) syncAll(); });
</script>
