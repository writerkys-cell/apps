<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쪽글 · Local Outliner</title>
<style>
/* ===========================================================
   쪽글 — 로컬 아웃라이너
   팔레트: 한지(paper) / 먹(ink) / 쪽빛(indigo) / 인주(cinnabar)
   =========================================================== */
:root{
  --paper:#F7F5F0;
  --paper-2:#EFECE4;
  --paper-3:#E5E1D6;
  --ink:#1C1E22;
  --ink-2:#4A4E56;
  --ink-3:#8A8F98;
  --indigo:#2E4F7D;
  --indigo-soft:#5B7CA8;
  --cinnabar:#B23A2E;
  --line:#DAD5C8;
  --line-soft:#E7E3D8;
  --sel:#DDE5EF;
  --radius:5px;
  --sidebar:250px;
  --serif:"Iowan Old Style","Apple Garamond",Garamond,Georgia,"AppleMyungjo","Batang","Nanum Myeongjo",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --paper:#16181B;
  --paper-2:#1D2024;
  --paper-3:#262A2F;
  --ink:#E6E3DC;
  --ink-2:#B3AFA6;
  --ink-3:#7C8189;
  --indigo:#8FB3DE;
  --indigo-soft:#6E90BB;
  --cinnabar:#D96A5C;
  --line:#31353B;
  --line-soft:#272B30;
  --sel:#2A3543;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:3px}
::selection{background:var(--sel)}

/* ---------- 레이아웃 ---------- */
#app{display:flex;height:100vh;overflow:hidden}

/* ---------- 사이드바 ---------- */
#sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);
  background:var(--paper-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
}
.brand{padding:18px 18px 12px;display:flex;align-items:baseline;gap:8px}
.brand h1{
  margin:0;font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:.06em;
}
.brand .sub{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.side-nav{padding:4px 10px 10px;display:flex;flex-direction:column;gap:1px}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:6px 8px;border-radius:var(--radius);color:var(--ink-2);font-size:13.5px;
}
.nav-item:hover{background:var(--paper-3);color:var(--ink)}
.nav-item.active{background:var(--paper-3);color:var(--ink);font-weight:600}
.nav-item .ico{width:15px;text-align:center;color:var(--ink-3);font-size:13px}
.nav-item .kbd{margin-left:auto;font-size:10px;color:var(--ink-3);font-family:var(--mono)}
.side-label{
  padding:14px 18px 6px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);display:flex;justify-content:space-between;align-items:center;
}
.side-label button{font-size:15px;line-height:1;color:var(--ink-3);padding:0 2px}
.side-label button:hover{color:var(--indigo)}
#page-list{flex:1;overflow-y:auto;padding:0 10px 10px}
.page-chip{
  display:block;width:100%;text-align:left;padding:5px 8px;border-radius:var(--radius);
  font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.page-chip:hover{background:var(--paper-3);color:var(--ink)}
.page-chip.active{color:var(--indigo);font-weight:600}
.page-chip .cnt{float:right;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.side-foot{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:2px}
.side-foot .row{display:flex;gap:6px}
.side-foot .row .nav-item{flex:1;justify-content:center;font-size:12.5px;padding:6px 4px}
.status{
  display:flex;align-items:center;gap:6px;padding:6px 8px 2px;
  font-size:11px;color:var(--ink-3);font-family:var(--mono);
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);transition:background .25s}
.dot.saving{background:var(--cinnabar)}
.dot.saved{background:var(--indigo-soft)}

/* ---------- 메인 ---------- */
#main{flex:1;overflow-y:auto;position:relative}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--paper);
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:10px;padding:10px 28px;
}
.crumb{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crumb button{color:var(--ink-3);font-size:12.5px}
.crumb button:hover{color:var(--indigo);text-decoration:underline}
.crumb .sep{opacity:.5}
.topbar .spacer{flex:1}
.icon-btn{
  padding:4px 8px;border-radius:var(--radius);color:var(--ink-3);font-size:13px;
  border:1px solid transparent;
}
.icon-btn:hover{background:var(--paper-2);color:var(--ink);border-color:var(--line)}
.wrap{max-width:740px;margin:0 auto;padding:26px 28px 45vh}

/* ---------- 페이지 헤더 ---------- */
.page-head{margin:0 0 4px}
.page-title{
  font-family:var(--serif);font-size:31px;line-height:1.25;font-weight:600;
  letter-spacing:-.005em;margin:0;padding:2px 0;outline:none;
}
.page-title:empty::before{content:"제목 없음";color:var(--ink-3)}
.page-meta{
  font-size:11.5px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.04em;
  margin:2px 0 18px;display:flex;gap:10px;align-items:center;
}
.page-meta .tick{color:var(--cinnabar)}
.section-head{
  display:flex;align-items:baseline;gap:8px;margin:38px 0 10px;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);
}
.section-head::after{content:"";flex:1;height:1px;background:var(--line)}
.feed-page{margin-bottom:38px;padding-bottom:6px}
.feed-page + .feed-page{border-top:1px solid var(--line-soft);padding-top:26px}
.feed-title{
  font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 2px;cursor:pointer;
}
.feed-title:hover{color:var(--indigo)}
.feed-sub{font-size:11px;font-family:var(--mono);color:var(--ink-3);margin-bottom:10px}

/* ---------- 아웃라이너 ---------- */
.children{margin-left:19px;position:relative}
.children::before{
  content:"";position:absolute;left:-8px;top:2px;bottom:6px;width:1px;background:var(--line);
}
.block{position:relative}
.block-row{
  display:flex;align-items:flex-start;gap:2px;position:relative;padding:1px 0;border-radius:3px;
}
.block-row.drop-before{box-shadow:0 -2px 0 -1px var(--indigo)}
.block-row.drop-after{box-shadow:0 2px 0 -1px var(--indigo)}
.block-row.drop-child{background:var(--sel)}
.arrow{
  width:15px;flex:0 0 15px;height:26px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);font-size:9px;opacity:0;transition:opacity .12s,transform .12s;cursor:pointer;
  user-select:none;
}
.block:hover > .block-row > .arrow.has{opacity:1}
.arrow.open{transform:rotate(90deg)}
.arrow.collapsed-marker{opacity:1;color:var(--indigo-soft)}
.bullet{
  width:19px;flex:0 0 19px;height:26px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;
}
.bullet .dot-b{
  width:6px;height:6px;border-radius:50%;background:var(--ink-2);transition:transform .12s;
}
.bullet:hover .dot-b{transform:scale(1.35);background:var(--indigo)}
.bullet.has-collapsed::before{
  content:"";position:absolute;width:16px;height:16px;border-radius:50%;
  background:var(--paper-3);
}
.bullet .dot-b{position:relative}
.content{
  flex:1;min-width:0;padding:2px 2px 2px 3px;min-height:26px;
  white-space:pre-wrap;word-break:break-word;cursor:text;
}
.content.empty::before{content:"";display:inline-block}
.editor{
  flex:1;min-width:0;padding:2px 2px 2px 3px;min-height:26px;
  font:inherit;line-height:1.6;color:var(--ink);background:transparent;border:none;
  resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-word;outline:none;
  font-family:inherit;
}

/* ---------- 오른쪽 사이드 ---------- */
#rightbar{
  width:360px;flex:0 0 360px;background:var(--paper-2);border-left:1px solid var(--line);
  display:none;flex-direction:column;overflow:hidden;
}
body.rb-open #rightbar{display:flex}
.rb-head{
  display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
}
.rb-head .grow{flex:1}
.rb-head button{color:var(--ink-3);font-size:11.5px;letter-spacing:0;text-transform:none;padding:2px 6px;border-radius:4px}
.rb-head button:hover{color:var(--indigo);background:var(--paper-3)}
#side-body{flex:1;overflow-y:auto;padding:12px 14px 40vh}
.rb-card{border-bottom:1px solid var(--line);padding:6px 0 16px;margin-bottom:14px}
.rb-card:last-child{border-bottom:none}
.rb-card-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.rb-card-head .t{
  font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;
  flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.rb-card-head .t:hover{color:var(--indigo)}
.rb-card-head .kind{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.rb-card-head .x{color:var(--ink-3);font-size:13px;padding:0 4px;border-radius:3px}
.rb-card-head .x:hover{color:var(--cinnabar);background:var(--paper-3)}
.rb-card .content,.rb-card .editor{font-size:14px}
.rb-card .children{margin-left:16px}
.rb-empty{color:var(--ink-3);font-size:13px;line-height:1.7;padding:10px 2px}
@media (max-width:1100px){ body.rb-open #rightbar{display:none} }

/* ---------- 블록 다중 선택 ---------- */
body.selecting{user-select:none;-webkit-user-select:none;cursor:default}
.block.is-sel > .block-row{background:var(--sel);border-radius:4px}
.block.is-sel > .block-row .content{cursor:default}
#selbar{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:120;
  display:flex;align-items:center;gap:8px;padding:7px 10px 7px 15px;
  background:var(--paper);border:1px solid var(--line);border-radius:99px;
  box-shadow:0 8px 26px rgba(0,0,0,.16);font-size:13px;white-space:nowrap;
}
#selbar b{color:var(--indigo)}
#selbar .s{color:var(--ink-3);font-size:11.5px;font-family:var(--mono);margin-right:4px}
#selbar button{
  border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12px;color:var(--ink-2);
}
#selbar button:hover{border-color:var(--indigo);color:var(--indigo)}
body.has-selbar #toast{bottom:84px}

/* ---------- 도움말 ---------- */
.doc{font-size:14.5px;line-height:1.8;color:var(--ink-2);max-width:100%}
.doc h2{
  font-family:var(--serif);font-size:20px;color:var(--ink);font-weight:600;
  margin:34px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);
}
.doc h3{font-size:14px;color:var(--ink);font-weight:600;margin:20px 0 4px}
.doc p{margin:8px 0}
.doc ul{margin:8px 0;padding-left:20px}
.doc li{margin:4px 0}
.doc code{
  font-family:var(--mono);font-size:.85em;background:var(--paper-3);
  padding:1px 5px;border-radius:3px;color:var(--ink);white-space:nowrap;
}
.doc table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13.5px}
.doc td{padding:6px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.doc td:first-child{width:180px;white-space:nowrap;color:var(--ink)}
.doc .lead{
  font-family:var(--serif);font-size:16px;color:var(--ink);line-height:1.75;
  border-left:2px solid var(--indigo);padding-left:14px;margin:14px 0 6px;
}
.doc .todo-card{
  border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:10px 0;background:var(--paper-2);
}
.doc .todo-card h4{margin:0 0 3px;font-size:14px;color:var(--ink);font-weight:600}
.doc .todo-card p{margin:0;font-size:13px;color:var(--ink-2)}
.doc button{
  border:1px solid var(--line);border-radius:99px;padding:4px 13px;font-size:12.5px;
  color:var(--ink-2);margin:6px 0;
}
.doc button:hover{border-color:var(--indigo);color:var(--indigo)}
.doc button.on{
  border-color:var(--indigo);color:var(--indigo);background:var(--paper-2);font-weight:600;
}
.doc .choose{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.doc .todo-card .where{
  display:block;margin-top:5px;font-family:var(--mono);font-size:11px;color:var(--ink-3);
}

/* ---------- 인라인 문법 ---------- */
.page-link{color:var(--indigo);cursor:pointer;border-radius:2px}
.page-link:hover{background:var(--sel);text-decoration:underline}
.page-link .brk{color:var(--ink-3);opacity:.55}
body.hide-brackets .page-link .brk{display:none}
body.hide-brackets .page-link{
  background-image:linear-gradient(var(--sel),var(--sel));
  background-size:100% 0;background-repeat:no-repeat;background-position:0 100%;
}
.page-link.ghost{color:var(--indigo-soft);border-bottom:1px dashed var(--indigo-soft)}
.tag{color:var(--indigo-soft);cursor:pointer;font-size:.93em}
.tag:hover{text-decoration:underline}
.content code,.ref-body code{
  font-family:var(--mono);font-size:.86em;background:var(--paper-3);
  padding:1px 4px;border-radius:3px;
}
.content mark,.ref-body mark{background:#F2E3A8;color:var(--ink);padding:0 2px;border-radius:2px}
html[data-theme="dark"] .content mark{background:#5C5326}
.content a,.ref-body a{color:var(--indigo);text-decoration:underline;text-underline-offset:2px}
.ext-link{cursor:pointer}
.ext-link .ext-mark{
  font-size:.72em;opacity:.55;margin-left:2px;text-decoration:none;display:inline-block;
  vertical-align:.15em;
}
.ext-link.app{border-bottom:1px solid var(--indigo-soft);text-decoration:none}
.ext-link.app:hover{text-decoration:underline}
.todo{cursor:pointer;user-select:none;color:var(--ink-3);font-family:var(--mono)}
.todo.done{color:var(--indigo-soft)}
.done-text{color:var(--ink-3);text-decoration:line-through}

/* ---------- 달력 ---------- */
.cal-bar{display:flex;align-items:center;gap:8px;margin:6px 0 18px}
.cal-bar .mon{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--ink);min-width:150px}
.cal-bar .grow{flex:1}
.cal-bar button{
  border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12.5px;color:var(--ink-2);
}
.cal-bar button:hover{border-color:var(--indigo);color:var(--indigo)}
.cal-bar .arrow-b{padding:3px 10px;font-size:13px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-wd{
  text-align:center;font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);
  padding-bottom:4px;font-family:var(--mono);
}
.cal-wd.sun{color:var(--cinnabar)}
.cal-cell{
  position:relative;aspect-ratio:1/.82;border:1px solid var(--line-soft);border-radius:6px;
  padding:6px 7px;display:flex;flex-direction:column;gap:3px;cursor:pointer;
  background:transparent;text-align:left;transition:border-color .12s,background .12s;
}
.cal-cell:hover{border-color:var(--indigo);background:var(--paper-2)}
.cal-cell.pad{border:none;cursor:default;background:none;padding:0}
.cal-cell.pad:hover{background:none}
.cal-cell .n{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);line-height:1}
.cal-cell.sun .n{color:var(--cinnabar)}
.cal-cell.sat .n{color:var(--indigo-soft)}
.cal-cell.has{background:var(--paper-2);border-color:var(--line)}
.cal-cell.has .n{color:var(--ink);font-weight:600}
.cal-cell.today{border-color:var(--indigo);box-shadow:inset 0 0 0 1px var(--indigo)}
.cal-cell .peek{
  font-size:10.5px;line-height:1.35;color:var(--ink-3);overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;
}
.cal-cell .cnt{
  position:absolute;right:6px;bottom:5px;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
}
.cal-foot{margin-top:14px;font-size:12px;font-family:var(--mono);color:var(--ink-3)}
@media (max-width:620px){
  .cal-cell{aspect-ratio:1/1;padding:4px}
  .cal-cell .peek{display:none}
}

/* ---------- 쪽글(태그 셔플) ---------- */
.shuffle-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:7px;background:var(--paper-2);
  padding:8px 12px;margin-bottom:22px;
}
.shuffle-bar .tagname{font-family:var(--mono);font-size:12.5px;color:var(--indigo)}
.shuffle-bar .meta{font-size:11.5px;font-family:var(--mono);color:var(--ink-3)}
.shuffle-bar .grow{flex:1}
.shuffle-bar button{
  font-size:12.5px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);
}
.shuffle-bar button:hover{border-color:var(--indigo);color:var(--indigo);background:var(--paper)}
.shuffle-bar button.primary{border-color:var(--indigo);color:var(--indigo);font-weight:600}
.shuffle-bar button.primary:hover{background:var(--indigo);color:var(--paper)}
.blank-note{
  border:1px dashed var(--line);border-radius:8px;padding:26px 22px;color:var(--ink-2);
  font-size:14px;line-height:1.75;
}
.blank-note code{font-family:var(--mono);font-size:.88em;background:var(--paper-3);padding:1px 5px;border-radius:3px}

/* ---------- 백링크 ---------- */
.ref-group{border-top:1px solid var(--line-soft);padding:14px 0 6px}
.ref-group:first-of-type{border-top:none}
.ref-page{
  font-family:var(--serif);font-size:16px;font-weight:600;color:var(--ink);cursor:pointer;
  margin-bottom:4px;display:inline-block;
}
.ref-page:hover{color:var(--indigo)}
.ref-item{
  border-left:2px solid var(--line);padding:3px 0 3px 12px;margin:3px 0;cursor:pointer;
  border-radius:0 3px 3px 0;
}
.ref-row{display:flex;align-items:flex-start;gap:10px}
.ref-row .ref-body{flex:1;min-width:0}
.link-btn{
  flex:0 0 auto;margin-top:1px;font-size:11.5px;padding:1px 9px;border-radius:99px;
  border:1px solid var(--line);color:var(--ink-3);
}
.link-btn:hover{border-color:var(--indigo);color:var(--indigo);background:var(--paper)}
.section-head.foldable{cursor:pointer;user-select:none}
.section-head.foldable::after{content:none}
.section-head .rule{flex:1;height:1px;background:var(--line)}
.section-head .fold{
  display:inline-block;width:9px;font-size:8px;color:var(--ink-3);
  transition:transform .12s;transform-origin:50% 50%;
}
.section-head .fold.open{transform:rotate(90deg)}
.section-head.foldable:hover .fold,.section-head.foldable:hover .label{color:var(--indigo)}
.section-head .link-all{
  font-size:11px;letter-spacing:0;text-transform:none;color:var(--ink-3);
  border:1px solid var(--line);border-radius:99px;padding:1px 9px;
}
.section-head .link-all:hover{border-color:var(--indigo);color:var(--indigo)}
.ref-item:hover{border-left-color:var(--indigo);background:var(--paper-2)}
.ref-path{font-size:11px;color:var(--ink-3);font-family:var(--mono);margin-bottom:1px}
.ref-body{white-space:pre-wrap;word-break:break-word}
.count-pill{
  font-family:var(--mono);font-size:11px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:99px;padding:0 7px;
}
.empty-note{color:var(--ink-3);font-size:13.5px;padding:6px 0}

/* ---------- 전체 페이지 목록 ---------- */
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{
  text-align:left;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);
}
.table td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}

<script>
"use strict";
/* ============================================================
   1. 유틸
   ============================================================ */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const uid = p => p + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const pad = n => String(n).padStart(2, "0");
const WD = ["일","월","화","수","목","금","토"];

function dateKey(d = new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function isDailyTitle(t){ return /^\d{4}-\d{2}-\d{2}$/.test(t); }
function weekdayOf(title){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(title);
  if(!m) return "";
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return `${+m[2]}월 ${+m[3]}일 ${WD[d.getDay()]}요일`;
}
function fmtTime(ts){
  if(!ts) return "—";
  const d = new Date(ts), t = new Date();
  const sameDay = d.toDateString() === t.toDateString();
  return sameDay ? `오늘 ${pad(d.getHours())}:${pad(d.getMinutes())}`
                 : `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function toast(msg){
  const el = $("#toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>el.classList.remove("show"), 2200);
}

/* ============================================================
   2. 저장소 — IndexedDB (그래프 전체를 하나의 레코드로)
   ============================================================ */
const DB_NAME = "jjokgeul-db", STORE = "graph", KEY = "main";
const SNAPS = "snaps", DB_VER = 2, SNAP_KEEP = 14;
const LEGACY_DB = "meoksil-db";        // 이전 이름으로 저장된 그래프를 한 번 옮겨온다
let _db = null;

function openDB(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      if(!db.objectStoreNames.contains(SNAPS)) db.createObjectStore(SNAPS);
    };
    r.onsuccess = e => res(e.target.result);
    r.onerror  = () => rej(r.error);
  });
}
/** 보관함(snaps) 저장소 다루기 */
async function snapTx(mode, fn){
  if(!_db) _db = await openDB();
  return new Promise((res, rej) => {
    let out;
    const tx = _db.transaction(SNAPS, mode);
    const rq = fn(tx.objectStore(SNAPS));
    if(rq) rq.onsuccess = () => { out = rq.result; };
    tx.oncomplete = () => res(out);
    tx.onerror   = () => rej(tx.error);
  });
}
const snapPut  = (k, v) => snapTx("readwrite", os => os.put(v, k));
const snapGet  = k      => snapTx("readonly",  os => os.get(k));
const snapDel  = k      => snapTx("readwrite", os => os.delete(k));
const snapKeys = ()     => snapTx("readonly",  os => os.getAllKeys());
async function dbGet(){
  if(!_db) _db = await openDB();
  return new Promise((res, rej) => {
    const rq = _db.transaction(STORE, "readonly").objectStore(STORE).get(KEY);
    rq.onsuccess = () => res(rq.result || null);
    rq.onerror  = () => rej(rq.error);
  });
}
async function dbPut(data){
  if(!_db) _db = await openDB();
  return new Promise((res, rej) => {
    const tx = _db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(data, KEY);
    tx.oncomplete = () => res();
    tx.onerror   = () => rej(tx.error);
  });
}

/** 이전 이름(meoksil-db)에 남아 있는 그래프를 읽어온다. 없으면 null. */
function legacyGet(){
  return new Promise(res => {
    let req;
    try{ req = indexedDB.open(LEGACY_DB, 1); }catch{ return res(null); }
    req.onupgradeneeded = e => { try{ e.target.result.createObjectStore(STORE); }catch{} };
    req.onerror = () => res(null);
    req.onsuccess = e => {
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE)) return res(null);
      try{
        const g = db.transaction(STORE, "readonly").objectStore(STORE).get(KEY);
        g.onsuccess = () => res(g.result || null);
        g.onerror  = () => res(null);
      }catch{ res(null); }
    };
  });
}

/* ============================================================
   3. 데이터 모델
   G = { version, pages:{id:Page}, blocks:{id:Block}, meta:{} }
   Page  = { id, title, children:[blockId], createdAt, updatedAt }
   Block = { id, content, children:[blockId], parent, collapsed, createdAt, updatedAt }
   ============================================================ */
let G = null;
let view = { type:"daily" };     // daily | page | zoom | all
let editing = null;              // 편집 중인 블록 id
let composing = false;           // IME(한글 등) 조합 중 여부
let saveTimer = null;

function emptyGraph(){ return { version:1, pages:{}, blocks:{}, meta:{ createdAt: now() } }; }

function isPage(id){ return !!(G.pages[id]); }
function node(id){ return G.pages[id] || G.blocks[id]; }
function childrenOf(id){ const n = node(id); return n ? n.children : []; }

function pageOf(blockId){
  let cur = G.blocks[blockId];
  let guard = 0;
  while(cur && guard++ < 500){
    if(G.pages[cur.parent]) return G.pages[cur.parent];
    cur = G.blocks[cur.parent];
  }
  return null;
}
function ancestors(blockId){
  const out = []; let cur = G.blocks[blockId], guard = 0;
  while(cur && guard++ < 500){
    const p = cur.parent;
    if(G.pages[p]){ out.unshift({ type:"page", id:p, label:G.pages[p].title }); break; }
    if(G.blocks[p]){ out.unshift({ type:"block", id:p, label:plainText(G.blocks[p].content) }); cur = G.blocks[p]; }
    else break;
  }
  return out;
}
function isAncestorOf(a, b){                       // a가 b의 조상인가
  let cur = G.blocks[b], guard = 0;
  while(cur && guard++ < 500){
    if(cur.parent === a) return true;
    cur = G.blocks[cur.parent];
  }
  return false;
}
function touch(id){
  const n = node(id); if(!n) return;
  n.updatedAt = now();
  if(G.blocks[id]){ const pg = pageOf(id); if(pg) pg.updatedAt = now(); }
}

function findPageByTitle(title){
  const k = title.trim().toLowerCase();
  for(const p of Object.values(G.pages)) if(p.title.trim().toLowerCase() === k) return p;
  return null;
}
function createPage(title, withBlock = true){
  const id = uid("p-");
  const p = { id, title: title.trim(), children: [], createdAt: now(), updatedAt: now() };
  G.pages[id] = p;
  if(withBlock) newBlock(id, "");
  scheduleSave();
  return p;
}
function getOrCreatePage(title){ return findPageByTitle(title) || createPage(title); }

function newBlock(parentId, content = "", index = -1){
  const id = uid("b-");
  const b = { id, content, children: [], parent: parentId, collapsed:false, createdAt: now(), updatedAt: now() };
  G.blocks[id] = b;
  const arr = childrenOf(parentId);
  if(index < 0 || index > arr.length) arr.push(id); else arr.splice(index, 0, id);
  touch(parentId);
  scheduleSave();
  return b;
}
function detach(id){
  const b = G.blocks[id]; if(!b) return;
  const arr = childrenOf(b.parent);
  const i = arr.indexOf(id); if(i >= 0) arr.splice(i, 1);
}
function deleteBlockDeep(id){
  const b = G.blocks[id]; if(!b) return;
  b.children.slice().forEach(deleteBlockDeep);
  detach(id);
  delete G.blocks[id];
}
function siblingsOf(id){ const b = G.blocks[id]; return b ? childrenOf(b.parent) : []; }

/* ============================================================
   4. 인라인 문법 파서
   [[페이지]] · #태그 · **굵게** · __기울임__ · ~~취소~~ · ^^형광^^ · `코드` · TODO/DONE · URL
   ============================================================ */
const LINK_RE = /\[\[([^\[\]\n]+)\]\]/g;
/** [보일 글자](주소) — 앞에 [ 가 붙은 [[페이지]] 와 헷갈리지 않도록 뒤돌아보기를 쓴다 */
const EXT_RE  = /(?<!\[)\[([^\[\]\n]+)\]\(([^\s)]+)\)/g;
/** 스크립트를 실어 나르는 스킴만 막고 나머지는 통과시킨다 */
function safeHref(u){
  const t = String(u).trim();
  return /^(javascript|data|vbscript):/i.test(t) ? null : t;
}
function isWebUrl(u){ return /^https?:\/\//i.test(u); }
const TAG_RE  = /(^|[\s(])#([^\s#\[\]()]+)/g;

function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}
function plainText(s){
  return String(s || "").replace(LINK_RE, "$1").replace(/\{\{(TODO|DONE)\}\}\s*/g, "").trim();
}
/** 블록 본문이 참조하는 페이지 제목 목록 (소문자) */
function linksIn(content){
  const out = new Set();
  let m;
  LINK_RE.lastIndex = 0;
  while((m = LINK_RE.exec(content))) out.add(m[1].trim().toLowerCase());
  TAG_RE.lastIndex = 0;
  while((m = TAG_RE.exec(content))) out.add(m[2].trim().toLowerCase());
  return out;
}
/** 본문 → 표시용 HTML */
function renderInline(text, blockId){
  if(!text) return "";
  let done = false, body = text;
  const todo = /^\{\{(TODO|DONE)\}\}\s?/.exec(text);
  let prefix = "";
  if(todo){
    done = todo[1] === "DONE";
    body = text.slice(todo[0].length);
    prefix = `<span class="todo ${done?"done":""}" data-todo="${blockId||""}">[${done?"×":" "}]</span> `;
  }
  let h = esc(body);
  h = h.replace(EXT_RE, (m, label, url) => {
    const safe = safeHref(url);
    if(!safe) return label;                       // 위험한 스킴이면 글자만 남긴다
    const web = isWebUrl(safe);
    return `<a class="ext-link${web ? "" : " app"}" href="${safe}" title="${safe}"`
         + (web ? ` target="_blank" rel="noopener"` : ` data-app="1"`)
         + `>${label}<span class="ext-mark">↗</span></a>`;
  });
  h = h.replace(LINK_RE, (m, t) =>
    `<span class="page-link${findPageByTitle(t.trim())?"":" ghost"}" data-title="${t.trim()}"><span class="brk">[[</span>${t}<span class="brk">]]</span></span>`);
  h = h.replace(TAG_RE, (m, pre, t) => `${pre}<span class="tag" data-title="${t}">#${t}</span>`);
  h = h.replace(/(^|[^"=\w])(https?:\/\/[^\s<"]+)/g, (m, pre, url) =>
    `${pre}<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
  h = h.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/__([^_\n]+)__/g, "<em>$1</em>");
  h = h.replace(/~~([^~\n]+)~~/g, "<del>$1</del>");
  h = h.replace(/\^\^([^^\n]+)\^\^/g, "<mark>$1</mark>");
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\n/g, "<br>");
  if(done) h = `<span class="done-text">${h}</span>`;
  return prefix + h;
}
/** 표시 텍스트 오프셋 → 원본 텍스트 오프셋 (클릭 위치에 캐럿을 놓기 위함) */
function renderedToRaw(raw, rOff){
  const marks = ["**","__","~~","^^"];
  let r = 0, i = 0;
  const todo = /^\{\{(TODO|DONE)\}\}\s?/.exec(raw);
  if(todo){ i = todo[0].length; r = 4; }            // "[ ] " 4글자로 표시됨
  while(i < raw.length && r < rOff){
    const two = raw.substr(i, 2);
    if(marks.includes(two)){ i += 2; continue; }
    if(raw[i] === "`"){ i += 1; continue; }
    i++; r++;
  }
  return Math.min(i, raw.length);
}

/* ============================================================
   5-b. 보관함 — 하루 한 번 스냅숏 · 폴더로 자동 내보내기
   ============================================================ */
let snapBusy = false;
let dirHandle = null;                 // 폴더를 연결해 둔 경우의 손잡이
const KIND_LABEL = { daily:"하루 한 번", manual:"손으로", "pre-restore":"되돌리기 직전" };

function snapList(){
  if(!G.meta.snapshots) G.meta.snapshots = [];
  return G.meta.snapshots;
}
/** 지금 그래프를 통째로 떠서 보관함에 넣는다. */
async function takeSnapshot(kind){
  const at = now(), key = "snap-" + at;
  const clone = JSON.parse(JSON.stringify(G));
  if(clone.meta) delete clone.meta.snapshots;        // 목록이 겹겹이 쌓이지 않게
  const bytes = JSON.stringify(clone).length;
  await snapPut(key, { at, kind, graph: clone });
  snapList().unshift({
    key, at, kind, bytes,
    pages: Object.keys(G.pages).length,
    blocks: Object.keys(G.blocks).length
  });
  while(snapList().length > SNAP_KEEP){
    const old = snapList().pop();
    try{ await snapDel(old.key); }catch{}
  }
  G.meta.lastSnapDate = dateKey();
  await dbPut(G);
  return key;
}
/** 하루가 바뀌었으면 한 번 뜬다. 앱을 열어 두기만 해도 걸린다. */
async function dailySnapshot(){
  if(snapBusy || !G || G.meta.lastSnapDate === dateKey()) return;
  snapBusy = true;
  try{
    await takeSnapshot("daily");
    await folderBackup();
    if(view.type === "backup") render();
  }catch(e){ console.warn("스냅숏 실패", e); }
  finally{ snapBusy = false; }
}
async function restoreSnapshot(key){
  const rec = await snapGet(key);
  if(!rec || !rec.graph){ toast("그 스냅숏을 찾지 못했습니다"); return; }
  const when = fmtStamp(rec.at);
  if(!confirm(`${when} 상태로 되돌립니다.\n지금 글은 모두 그때 것으로 바뀝니다.\n`
            + `되돌리기 직전 상태는 보관함에 따로 남겨 두니, 잘못되면 다시 돌아올 수 있습니다.\n\n계속할까요?`)) return;
  await takeSnapshot("pre-restore");
  const keepList = snapList().slice();
  exitEdit();
  G = rec.graph;
  repair();
  if(!G.meta) G.meta = {};
  G.meta.snapshots = keepList;
  G.meta.lastSnapDate = dateKey();
  editing = null;
  view = { type:"backup" };
  render();
  await dbPut(G);
  toast(`${when} 상태로 되돌렸습니다`);
}
async function downloadSnapshot(key){
  const rec = await snapGet(key);
  if(!rec){ toast("그 스냅숏을 찾지 못했습니다"); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(rec.graph, null, 2)], { type:"application/json" }));
  a.download = `roam-${fmtStamp(rec.at).replace(/[^\d]/g, "").slice(0, 12)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}
async function dropSnapshot(key){
  const i = snapList().findIndex(x => x.key === key);
  if(i < 0) return;
  if(!confirm("이 스냅숏을 지웁니다. 계속할까요?")) return;
  snapList().splice(i, 1);
  try{ await snapDel(key); }catch{}
  await dbPut(G);
  render();
}
/** 목록과 실제 저장소가 어긋나면 맞춘다(수동으로 지웠거나 옮겨 온 경우) */
async function reconcileSnaps(){
  try{
    const keys = new Set(await snapKeys());
    const before = snapList().length;
    G.meta.snapshots = snapList().filter(x => keys.has(x.key));
    if(G.meta.snapshots.length !== before) await dbPut(G);
  }catch{}
}
function fmtStamp(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtBytes(n){
  if(n < 1024) return n + " B";
  if(n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}
function daysSince(ts){ return ts ? Math.floor((now() - ts) / 86400000) : null; }

/* ---- 폴더에 파일로 자동 내보내기 (지원하는 브라우저에서) ---- */
const canFolder = () => typeof window !== "undefined" && typeof window.showDirectoryPicker === "function";
async function loadDirHandle(){
  if(!canFolder()) return;
  try{ dirHandle = (await snapGet("dirHandle")) || null; }catch{ dirHandle = null; }
}
async function linkFolder(){
  if(!canFolder()){ toast("이 브라우저는 폴더 연결을 지원하지 않습니다"); return; }
  try{
    const h = await window.showDirectoryPicker({ mode:"readwrite" });
    dirHandle = h;
    await snapPut("dirHandle", h);
    G.meta.folderName = h.name;
    await dbPut(G);
    const okNow = await folderBackup(true);
    render();
    toast(okNow ? `‘${h.name}’ 폴더에 하루 한 번 내보냅니다` : `‘${h.name}’ 폴더를 연결했습니다`);
  }catch(e){ /* 사용자가 취소 */ }
}
async function unlinkFolder(){
  dirHandle = null;
  try{ await snapDel("dirHandle"); }catch{}
  delete G.meta.folderName;
  delete G.meta.folderAt;
  await dbPut(G);
  render();
  toast("폴더 연결을 풀었습니다");
}
async function folderPerm(request){
  if(!dirHandle) return "none";
  try{
    const opts = { mode:"readwrite" };
    let p = await dirHandle.queryPermission(opts);
    if(p !== "granted" && request) p = await dirHandle.requestPermission(opts);
    return p;
  }catch{ return "denied"; }
}
/** 오늘 것이 아직 없으면 폴더에 roam-날짜.json 을 쓴다. */
async function folderBackup(request){
  if(!dirHandle) return false;
  if((await folderPerm(request)) !== "granted") return false;
  try{
    const name = `roam-${dateKey()}.json`;
    const fh = await dirHandle.getFileHandle(name, { create:true });
    const wr = await fh.createWritable();
    await wr.write(JSON.stringify(G, null, 2));
    await wr.close();
    G.meta.folderAt = now();
    await dbPut(G);
    return true;
  }catch(e){ console.warn("폴더 내보내기 실패", e); return false; }
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(G, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `roam-${dateKey()}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);

  toast("JSON 파일을 내려받았습니다");
}
function importJSON(file){
  const fr = new FileReader();
  fr.onload = () => {
    let data;
    try{ data = JSON.parse(fr.result); }
    catch{ toast("JSON을 읽지 못했습니다. 파일 형식을 확인하세요"); return; }
    if(!data || typeof data !== "object" || !data.pages || !data.blocks){
      toast("pages / blocks 항목이 없는 파일입니다"); return;
    }
    const pc = Object.keys(data.pages).length, bc = Object.keys(data.blocks).length;
    if(!confirm(`페이지 ${pc}개, 블록 ${bc}개를 불러옵니다.\n현재 그래프는 대체됩니다.\n`
              + `직전 상태는 보관함에 사본으로 남겨 둡니다. 계속할까요?`)) return;
    const keepList = snapList().slice();
    takeSnapshot("pre-restore").catch(()=>{});
    G = { version:data.version||1, pages:data.pages, blocks:data.blocks, meta:data.meta||{} };
    if(!G.meta.snapshots) G.meta.snapshots = keepList;
    repair();
    view = { type:"daily" };
    editing = null;
    render(); scheduleSave();
    toast(`불러왔습니다 · 페이지 ${pc} / 블록 ${bc}`);
  };
  fr.readAsText(file);
}
/** 깨진 참조 정리 (외부 파일 대비) */
function repair(){
  for(const b of Object.values(G.blocks)){
    b.children = (b.children||[]).filter(c => G.blocks[c]);
    if(typeof b.content !== "string") b.content = "";
    if(!node(b.parent)) { delete G.blocks[b.id]; }
  }
  for(const p of Object.values(G.pages)) p.children = (p.children||[]).filter(c => G.blocks[c]);
  for(const b of Object.values(G.blocks)) b.children.forEach(c => { if(G.blocks[c]) G.blocks[c].parent = b.id; });
  for(const p of Object.values(G.pages)) p.children.forEach(c => { if(G.blocks[c]) G.blocks[c].parent = p.id; });
}

function countBlocks(pid){

  const walk = ids => ids.forEach(id => { const b=G.blocks[id]; if(!b) return; if(b.content.trim()) n++; walk(b.children); });
  walk(childrenOf(pid));
  return n;
}

/* ---- 아웃라인 트리 ---- */
function outline(parentId){
  const wrap = document.createElement("div");
  wrap.className = "children";
  childrenOf(parentId).forEach(id => wrap.appendChild(blockEl(id)));
  return wrap;
}
function blockEl(id){
  const b = G.blocks[id];
  const el = document.createElement("div");
  el.className = "block"; el.dataset.id = id;

  const row = document.createElement("div");
  row.className = "block-row";

  const arrow = document.createElement("span");
  arrow.className = "arrow" + (b.children.length ? " has" : "") + (b.children.length && !b.collapsed ? " open" : "")
                  + (b.collapsed && b.children.length ? " collapsed-marker" : "");
  arrow.textContent = b.children.length ? "▶" : "";
  arrow.title = b.collapsed ? "펼치기" : "접기";
  arrow.onclick = () => { b.collapsed = !b.collapsed; touch(id); scheduleSave(); render(); };

  const bullet = document.createElement("span");
  bullet.className = "bullet" + (b.collapsed && b.children.length ? " has-collapsed" : "");
  bullet.innerHTML = `<span class="dot-b"></span>`;
  bullet.title = "클릭: 이 블록만 확대 · Shift+클릭: 오른쪽에 두기";
  bullet.draggable = true;
  bullet.onclick = e => {
    if(e.shiftKey) sideAdd({ type:"block", id });
    else go({ type:"zoom", id });
  };
  bullet.addEventListener("dragstart", e => {
    dragId = id; e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", id);
  });
  bullet.addEventListener("dragend", () => { dragId = null; clearDropMarks(); });

  const content = document.createElement("div");
  content.className = "content" + (b.content ? "" : " empty");
  content.innerHTML = renderInline(b.content, id);
  content.addEventListener("mousedown", e => {
    if(e.button !== 0) return;
    if(e.target.closest(".page-link,.tag,a,.todo")) return;
    e.preventDefault();
    const off = renderedToRaw(b.content, caretOffsetFromPoint(content, e.clientX, e.clientY));
    beginPointerSelect(id, off, e);
  });

  row.append(arrow, bullet, content);
  attachDrop(row, id);
  el.appendChild(row);

  if(b.children.length && !b.collapsed) el.appendChild(outline(id));
  return el;
}
function caretOffsetFromPoint(container, x, y){
  let range = null;
  if(document.caretRangeFromPoint) range = document.caretRangeFromPoint(x, y);
  else if(document.caretPositionFromPoint){
    const p = document.caretPositionFromPoint(x, y);
    if(p){ range = document.createRange(); range.setStart(p.offsetNode, p.offset); }
  }
  if(!range || !container.contains(range.startContainer)) return container.textContent.length;
  const r = document.createRange();
  r.setStart(container, 0); r.setEnd(range.startContainer, range.startOffset);
  return r.toString().length;
}

/* ---- 페이지 / 데일리 / 확대 / 목록 뷰 ---- */
function pageHeader(p, editableTitle = true){
  const head = document.createElement("div");
  head.className = "page-head";
  const h = document.createElement("div");
  h.className = "page-title";
  h.textContent = p.title;
  h.title = "Shift+클릭하면 이 페이지를 오른쪽에 둡니다";
  h.addEventListener("mousedown", e => {
    if(!e.shiftKey) return;
    e.preventDefault();                       // 제목 편집으로 들어가지 않게
    h.blur();
    sideAdd({ type:"page", id:p.id });
  });
  if(editableTitle){
    h.contentEditable = "true"; h.spellcheck = false;
    h.addEventListener("keydown", e => {
      if(e.key === "Enter"){ e.preventDefault(); h.blur(); }
      if(e.key === "Escape"){ h.textContent = p.title; h.blur(); }
    });
    h.addEventListener("blur", () => {
      const nt = h.textContent.trim();
      if(!nt || nt === p.title){ h.textContent = p.title; return; }
      const clash = findPageByTitle(nt);
      if(clash && clash.id !== p.id){ toast("같은 제목의 페이지가 이미 있습니다"); h.textContent = p.title; return; }
      renamePage(p.id, nt);
    });
  }
  const meta = document.createElement("div");
  meta.className = "page-meta";
  const wd = weekdayOf(p.title);
  meta.innerHTML = `${wd ? `<span class="tick">${wd}</span>` : ""}<span>수정 ${fmtTime(p.updatedAt)}</span><span>블록 ${countBlocks(p.id)}</span>`;
  head.append(h, meta);
  return head;
}
function renderPageView(pid){
  const p = G.pages[pid];
  const frag = document.createDocumentFragment();
  if(!p){ const d=document.createElement("div"); d.className="empty-note"; d.textContent="페이지를 찾을 수 없습니다."; frag.appendChild(d); return frag; }
  if(!p.children.length) newBlock(pid, "");
  frag.appendChild(pageHeader(p));
  frag.appendChild(outline(pid));
  frag.appendChild(referencesSection(p.title, pid));
  return frag;
}
function renderZoomView(bid){
  const b = G.blocks[bid];
  const frag = document.createDocumentFragment();
  if(!b){ const d=document.createElement("div"); d.className="empty-note"; d.textContent="블록을 찾을 수 없습니다."; frag.appendChild(d); return frag; }
  const h = document.createElement("div");
  h.className = "page-title";
  h.innerHTML = renderInline(b.content, bid) || "빈 블록";
  h.style.fontSize = "24px";
  h.title = "Shift+클릭: 이 블록을 오른쪽에 두기";

/** 데일리 노트를 오래된 날짜부터 모은다. month가 null이면 전부. */
function dailyPagesOf(year, month){
  const prefix = month == null ? null : `${year}-${pad(month + 1)}-`;
  return Object.values(G.pages)
    .filter(p => isDailyTitle(p.title))
    .filter(p => !prefix || p.title.indexOf(prefix) === 0)
    .sort((a, b) => a.title.localeCompare(b.title));
}
/** 부른 페이지를 어떻게 다룰지 — footnote(하단 주석) · inline(본문 사이) · none(제목만) */
function linkMode(){
  const m = G.meta && G.meta.linkMode;
  if(m === "footnote" || m === "inline" || m === "none") return m;
  if(G.meta && G.meta.expandLinks === false) return "none";   // 예전 설정 이어받기
  return "footnote";
}
function expandLinksOn(){ return linkMode() !== "none"; }
const NOTE_RULE = "────────";
/** [[제목]] 뒤에 주석 번호를 달아 준다. #[[..]] 꼴 태그는 건드리지 않는다. */
function markLinks(content, assign){
  return String(content).replace(/(#?)\[\[([^\[\]\n]+)\]\]/g, (m, hash, t) => {
    if(hash) return m;
    const n = assign(t.trim());
    return n ? `[[${t}]][${n}]` : `[[${t}]]`;
  });
}
/** 블록이 [[ ]]로 부른 페이지의 본문을 줄 배열로 돌려준다.
 *  · #태그로 부른 것은 인식용이므로 끌어오지 않는다
 *  · 데일리 노트는 그 자체로 따로 뽑히므로 건너뛴다
 *  · 같은 페이지는 처음 부른 날에만 (seen 으로 걸러낸다)
 *  · 태그만 적힌 줄은 toPlain 을 거치며 빈 줄이 되어 저절로 빠진다 */
function linkedBodies(content, seen){
  const out = [];
  const titles = [];
  let m; LINK_RE.lastIndex = 0;
  while((m = LINK_RE.exec(content))) titles.push(m[1].trim());
  titles.forEach(t => {
    const p = findPageByTitle(t);
    if(!p || seen.has(p.id) || isDailyTitle(p.title)) return;
    seen.add(p.id);
    const body = serializePlain(treeOf(p.children)).trim();
    if(body) out.push.apply(out, body.split("\n"));
  });
  return out;
}
/** 하루치 본문을 줄 배열로. 주석 방식이면 번호를 달고 주석거리를 따로 모아 돌려준다. */
function dailyBodyLines(page, seen){
  const out = [], notes = [];
  const mode = linkMode();
  let no = 0;                                     // 번호는 하루마다 1번부터
  const assign = title => {
    const p = findPageByTitle(title);
    if(!p || seen.has(p.id) || isDailyTitle(p.title)) return null;
    seen.add(p.id);
    const body = serializePlain(treeOf(p.children)).trim();
    if(!body) return null;                        // 태그만 있는 페이지는 주석거리가 없다
    no++;
    notes.push({ n:no, title:p.title, body: body.split("\n") });
    return no;
  };
  const walk = (ids, depth) => {
    ids.forEach(id => {
      const b = G.blocks[id];
      if(!b) return;
      const raw = mode === "footnote" ? markLinks(b.content, assign) : b.content;
      const body = toPlain(raw);
      const pad = plainIndentOn() ? "\t".repeat(depth) : "";
      if(body) body.split("\n").forEach(l => out.push(pad + l));
      if(mode === "inline")
        linkedBodies(b.content, seen).forEach(l => out.push(pad + l));
      walk(b.children, body ? depth + 1 : depth);
    });
  };
  walk(page.children, 0);
  return { lines: out, notes };
}
/** 날짜 머리글 + 플레인 텍스트 본문. 빈 날은 건너뛴다. */
function dailyPlainText(pages){
  const out = [];
  const seen = new Set();
  let days = 0, chars = 0, pulled = 0;
  pages.forEach(p => {
    const mark = seen.size;
    const r = dailyBodyLines(p, seen);
    const body = r.lines.join("\n").trim();
    if(!body && !r.notes.length){ return; }
    days++;
    pulled += seen.size - mark;
    const wd = (weekdayOf(p.title).split(" ").pop() || "");
    out.push(p.title + (wd ? " " + wd : ""), "", body);
    chars += body.replace(/\s/g, "").length;
    if(r.notes.length){
      out.push("", NOTE_RULE);
      r.notes.forEach(nt => {
        out.push(`[${nt.n}] ${nt.title}`);
        nt.body.forEach(l => out.push(l));
        out.push("");
        chars += nt.body.join("").replace(/\s/g, "").length;
      });
    }else{
      out.push("");
    }
  });
  return { text: out.join("\n").replace(/\n+$/, "\n"), days, chars, pulled };
}
function copyDailies(year, month, label){
  const r = dailyPlainText(dailyPagesOf(year, month));
  if(!r.days){ toast(`${label}에는 옮길 글이 없습니다`); return; }
  writeClipboard(r.text);
  toast(`${label} ${r.days}일치`
    + (r.pulled ? ` · 부른 페이지 ${r.pulled}편` : "")
    + ` · ${r.chars.toLocaleString()}자를 복사했습니다`);
}

/** 그날 노트의 첫 줄을 짧게 미리 보여 준다 */
function firstLineOf(page){
  for(const id of page.children){

    if(t) return t.slice(0, 24);
  }
  return "";
}

/* ---- 쪽글: 특정 태그가 붙은 페이지를 무작위로 순회 ---- */
let shuffleQueue = [];
function shuffleTag(){ return (G.meta && G.meta.shuffleTag) || "쪽글"; }
/** 태그가 달린 페이지 id 목록. 블록 어딘가에 #태그 또는 [[태그]]가 있으면 그 페이지가 포함된다. */
function pagesWithTag(tag){
  const key = String(tag || "").trim().toLowerCase();
  if(!key) return [];
  const set = new Set();
  for(const b of Object.values(G.blocks)){
    if(!linksIn(b.content).has(key)) continue;
    const pg = pageOf(b.id);
    if(pg && pg.title.trim().toLowerCase() !== key) set.add(pg.id);
  }
  return Array.from(set);
}
function nextShuffle(){
  const all = pagesWithTag(shuffleTag());
  exitEdit();
  if(!all.length){ view = { type:"shuffle", id:null }; render(); $("#main").scrollTop = 0; closeSidebarMobile(); return; }
  shuffleQueue = shuffleQueue.filter(id => all.includes(id));
  if(!shuffleQueue.length){
    shuffleQueue = all.slice();
    for(let i = shuffleQueue.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [shuffleQueue[i], shuffleQueue[j]] = [shuffleQueue[j], shuffleQueue[i]];
    }
    // 방금 본 쪽글이 곧바로 또 나오지 않도록 맨 뒤로 돌린다
    if(shuffleQueue.length > 1 && shuffleQueue[shuffleQueue.length - 1] === view.id)
      shuffleQueue.unshift(shuffleQueue.pop());
  }
  const id = shuffleQueue.pop();
  view = { type:"shuffle", id, total: all.length };
  render();
  $("#main").scrollTop = 0;
  closeSidebarMobile();
}

  if(!p){ nextShuffle(); return frag; }

  cards.appendChild(card("오늘 사본", todayDone ? "떠 두었습니다" : "아직입니다",
    todayDone ? "" : "글을 고치면 곧 뜹니다", !todayDone));
  cards.appendChild(card("보관 중", list.length + "개",
    list.length ? fmtStamp(list[0].at) + " 가 가장 최근" : "아직 없습니다"));
  cards.appendChild(card("파일로 내보내기",
    gap === null ? "한 번도 없음" : (gap === 0 ? "오늘" : gap + "일 전"),
    gap === null || gap >= 7 ? "가끔 파일로도 빼 두세요" : "", gap === null || gap >= 7));
  if(canFolder())
    cards.appendChild(card("연결한 폴더", G.meta.folderName || "없음",
      G.meta.folderAt ? fmtStamp(G.meta.folderAt) + " 에 씀" : "", !G.meta.folderName));
  frag.appendChild(cards);

  // 단추
  const acts = document.createElement("div");
  acts.className = "bk-acts";
  const mk = (label, fn, cls) => {
    const b = document.createElement("button");
    if(cls) b.className = cls;
    b.textContent = label; b.onclick = fn;
    return b;
  };
  acts.appendChild(mk("지금 사본 뜨기", async () => {
    commit();
    await takeSnapshot("manual");
    render();
    toast("사본을 떠 두었습니다");
  }, "primary"));
  acts.appendChild(mk("JSON 파일로 내보내기", () => { commit(); exportJSON(); setTimeout(render, 50); }));
  if(canFolder()){
    if(G.meta.folderName){
      acts.appendChild(mk("지금 폴더에 쓰기", async () => {
        const ok = await folderBackup(true);
        render();
        toast(ok ? "폴더에 썼습니다" : "폴더에 쓰지 못했습니다. 권한을 다시 허용해 주세요");
      }));
      acts.appendChild(mk("폴더 연결 풀기", unlinkFolder));
    }else{
      acts.appendChild(mk("폴더 연결하기", linkFolder));
    }
  }
  frag.appendChild(acts);

  const note = document.createElement("div");
  note.className = "bk-note";
  note.innerHTML = canFolder()
    ? "<b>사본은 이 브라우저 안에 있습니다.</b> 방문 기록을 지우면서 사이트 데이터까지 함께 지우면 사본도 같이 사라집니다. "
      + "폴더를 한 번 연결해 두면 하루 한 번 그 폴더에 <code>roam-날짜.json</code> 을 씁니다. "
      + "브라우저가 세션마다 권한을 다시 물을 수 있는데, 그때는 위 <b>지금 폴더에 쓰기</b>를 한 번 눌러 주세요."
    : "<b>사본은 이 브라우저 안에 있습니다.</b> 방문 기록을 지우면서 사이트 데이터까지 함께 지우면 사본도 같이 사라집니다. "
      + "이 브라우저는 폴더 자동 내보내기를 지원하지 않으니, 가끔 <b>JSON 파일로 내보내기</b>로 밖에 빼 두세요.";
  frag.appendChild(note);

  // 목록
  const head = document.createElement("div");
  head.className = "section-head";
  head.innerHTML = `<span>사본 목록</span><span class="count-pill">${list.length}</span>`;
  frag.appendChild(head);

  if(!list.length){
    const e = document.createElement("div");
    e.className = "empty-note";
    e.textContent = "아직 사본이 없습니다. 글을 고치면 오늘 것이 저절로 떠집니다.";
    frag.appendChild(e);
    return frag;
  }
  const table = document.createElement("table");
  table.className = "table";
  table.innerHTML = `<thead><tr><th>뜬 때</th><th>어떻게</th><th>페이지</th><th>블록</th><th>크기</th><th></th></tr></thead>`;
  const tb = document.createElement("tbody");
  list.forEach(it => {
    const tr = document.createElement("tr");
    const td = (html, cls) => { const x = document.createElement("td"); if(cls) x.className = cls; x.innerHTML = html; return x; };
    tr.appendChild(td(esc(fmtStamp(it.at))));
    tr.appendChild(td(`<span class="kind-pill">${KIND_LABEL[it.kind] || it.kind}</span>`));
    tr.appendChild(td(String(it.pages), "num"));
    tr.appendChild(td(String(it.blocks), "num"));
    tr.appendChild(td(fmtBytes(it.bytes), "num"));
    const acts2 = document.createElement("td");
    const box = document.createElement("div");
    box.className = "bk-row-acts";
    box.appendChild(mk("내려받기", () => downloadSnapshot(it.key)));
    box.appendChild(mk("되돌리기", () => restoreSnapshot(it.key)));
    const del = mk("지우기", () => dropSnapshot(it.key));
    del.className = "danger";
    box.appendChild(del);
    acts2.appendChild(box);
    tr.appendChild(acts2);
    tb.appendChild(tr);
  });
  table.appendChild(tb);
  frag.appendChild(table);
  return frag;
}

/* ---- 페이지 삭제 ---- */
function deletePage(pid, after){
  const p = G.pages[pid];
  if(!p) return false;
  const n = countBlocks(pid);
  const msg = `"${p.title}" 페이지를 지웁니다.\n안에 든 블록 ${n}개가 함께 사라지고, 되돌릴 수 없습니다.\n`
            + `다른 글에 적힌 [[${p.title}]] 표시는 그대로 남습니다.\n\n계속할까요?`;
  if(!confirm(msg)) return false;
  exitEdit();
  p.children.slice().forEach(deleteBlockDeep);
  delete G.pages[pid];
  shuffleQueue = shuffleQueue.filter(x => x !== pid);
  scheduleSave();
  toast(`"${p.title}" 페이지를 지웠습니다`);
  if(typeof after === "function") after(); else render();
  return true;
}

function renderHelp(){
  const frag = document.createDocumentFragment();
  const h = document.createElement("div");
  h.className = "page-title"; h.textContent = "도움말";
  const m = document.createElement("div");
  m.className = "page-meta";
  m.innerHTML = '<span>쪽글 · roam.html</span><span>서버 없이 브라우저에서만 도는 아웃라이너</span>';
  frag.append(h, m);
  const doc = document.createElement("div");
  doc.className = "doc";
  doc.innerHTML = HELP_HTML;
  const modeBtns = doc.querySelectorAll("[data-linkmode]");
  const syncMode = () => modeBtns.forEach(b =>
    b.classList.toggle("on", b.dataset.linkmode === linkMode()));
  syncMode();
  modeBtns.forEach(b => b.onclick = () => {
    G.meta.linkMode = b.dataset.linkmode;
    delete G.meta.expandLinks;
    scheduleSave(); syncMode();
    toast({ footnote:"하단 주석으로 모읍니다", inline:"본문 사이에 넣습니다", none:"제목만 남깁니다" }[linkMode()]);
  });
  doc.querySelectorAll("[data-toggle='plainindent']").forEach(el => {
    const sync = () => el.textContent = plainIndentOn()
      ? "지금은 계층을 탭으로 남깁니다 — 펴기" : "지금은 계층을 펴서 붙입니다 — 탭으로 남기기";
    sync();
    el.onclick = () => {
      G.meta.plainIndent = !plainIndentOn();
      scheduleSave(); sync();
      toast(plainIndentOn() ? "계층을 탭으로 남깁니다" : "계층을 펴서 붙입니다");
    };
  });
  doc.querySelectorAll("[data-toggle='brackets']").forEach(el => {
    const sync = () => el.textContent = bracketsShown()
      ? "지금은 괄호가 보입니다 — 감추기" : "지금은 괄호가 숨어 있습니다 — 보이기";
    sync();
    el.onclick = () => { toggleBrackets(); sync(); };
  });
  doc.querySelectorAll("[data-jump]").forEach(el => {
    el.style.cursor = "pointer";
    el.onclick = () => go({ type: el.dataset.jump });
  });
  frag.appendChild(doc);
  return frag;
}

"<li><code>⌘⇧C</code> <b>플레인 복사</b> — 원고로 넘길 때. 글머리표를 떼고, <code>[[제목]]</code>은 제목 글자만 남기고, <code>#태그</code>와 <code>**</code> <code>__</code> <code>~~</code> <code>^^</code> <code>`</code> 같은 기호, <code>{{TODO}}</code> 표시를 모두 지웁니다. 블록 하나가 한 문단이 되도록 줄바꿈 하나로만 이어서, 스크리브너에 붙이면 문단 하나씩 정확히 들어갑니다. 태그만 적힌 블록은 빈 줄이 되므로 아예 빠집니다.</li>",
"</ul>",
"<p>선택 알약의 <b>플레인 복사</b> 단추도 같은 일을 합니다.</p>",
"<h3>플레인 복사에서 계층을 남기려면</h3>",
"<p>기본은 계층을 펴서 문단만 이어 붙입니다. 자료 정리용으로 옮길 때처럼 깊이를 탭으로 남기고 싶다면 아래에서 바꿉니다.</p>",
"<p><button data-toggle='plainindent'></button></p>",

"<h2>4. 페이지 잇기와 백링크</h2>",
"<ul>",
"<li><code>[[제목]]</code> — 페이지 링크. <code>[[</code>를 치면 있는 페이지 목록이 뜨고, 없는 이름이면 맨 위에 '새 페이지'로 제안됩니다. 블록을 빠져나가는 순간 실제 페이지가 만들어집니다.</li>",
"<li><code>#태그</code> — 같은 링크입니다. 짧게 쓰고 싶을 때.</li>",
"<li><b>연결된 참조</b> — 페이지 아래에, 다른 곳에서 그 제목을 <code>[[ ]]</code>로 부른 블록이 모입니다. 어느 페이지에서 왔는지, 어떤 블록 아래에 있었는지까지 보여 줍니다. 눌러 가면 그 자리에서 바로 고칠 수 있습니다.</li>",
"<li><b>언급됨 · 링크 없음</b> — 괄호 없이 제목만 적힌 블록. 오른쪽 <b>잇기</b>를 누르면 그 블록 안에서 제목을 찾아 <code>[[ ]]</code>로 둘러 줍니다. 이미 묶여 있는 자리는 건드리지 않고, 한 블록에 여러 번 나오면 모두 묶습니다. 머리글의 <b>모두 잇기</b>는 목록 전체에 같은 일을 합니다(확인을 한 번 받습니다).</li>",
"<li>두 절 모두 머리글을 눌러 <b>접었다 펼</b> 수 있습니다. 접힘 상태는 저장되어 다음에 열 때도 그대로입니다. 처음에는 「언급됨」 쪽이 접혀 있습니다.</li>",
"<li><b>괄호는 평소에 숨어 있습니다.</b> 화면에는 제목만 남고, 그 블록을 눌러 편집에 들어가면 <code>[[ ]]</code>가 다시 나타납니다. 읽을 때는 문장이 끊기지 않고, 고칠 때는 괄호를 정확히 다룰 수 있습니다.</li>",
"<li>페이지 제목을 누르면 바로 고칠 수 있고, 고치면 다른 글에 적힌 <code>[[옛 제목]]</code>까지 함께 바뀝니다.</li>",
"<li>글머리 점을 누르면 그 블록만 확대해서 봅니다. 위쪽 이름표를 눌러 되돌아옵니다.</li>",
"</ul>",

"<h3>괄호를 늘 보이게 하려면</h3>",
"<p>편집 중이 아닐 때도 <code>[[ ]]</code>를 드러내 두는 편이 편하다면 아래 단추로 바꿉니다. 왼쪽 아래 사이드바에도 같은 단추가 있습니다. 고른 값은 그래프에 함께 저장되고, JSON을 내보내고 다시 불러와도 유지됩니다.</p>",
"<p><button data-toggle='brackets'></button></p>",

"<h2>4-b. 오른쪽에 두기</h2>",
"<p>글을 쓰면서 다른 페이지를 곁눈질해야 할 때가 있습니다. <code>Shift</code>+클릭하면 오른쪽에 쌓입니다. 누를 수 있는 자리는 네 군데입니다.</p>",
"<ul>",
"<li><b>페이지 제목</b> — 지금 보고 있는 페이지를 통째로. 쪽글을 넘기다 건진 글을 남겨 둘 때 씁니다.</li>",
"<li><b>본문 속 <code>[[링크]]</code>와 <code>#태그</code></b> — 자리를 뜨지 않고 가리킨 페이지만 옆에 폅니다.</li>",
"<li><b>글머리 점</b> — 페이지 전체가 아니라 그 블록 하나만.</li>",
"<li><b>백링크의 출처 제목</b> — 참조가 온 페이지를 옆에.</li>",
"</ul>",
"<p>위쪽 <b>옆에</b> 단추도 지금 보는 페이지를 보냅니다. 왼쪽과 오른쪽에 같은 페이지가 겹쳐 떠도 괜찮습니다. 한쪽에서 고치면 편집을 마치는 순간 다른 쪽도 같이 바뀝니다.</p>",
"<ul>",
"<li>오른쪽에 놓인 글도 <b>그대로 고칠 수 있습니다.</b> 본문과 오른쪽에 같은 블록이 함께 떠 있으면, 편집을 마치는 순간 양쪽이 같이 갱신됩니다.</li>",
"<li>카드 제목을 누르면 본문 자리로 옮겨 열립니다. <code>✕</code>로 하나씩 치우고, 머리의 <b>비우기</b>로 전부 내립니다.</li>",
"<li>여덟 장까지 쌓이고, 새로 넣은 것이 맨 위로 옵니다. 무엇을 놓아 두었는지는 저장되어 다음에 열 때도 그대로입니다.</li>",
"<li>화면 너비가 1100px보다 좁으면 자리를 아끼려고 감춥니다.</li>",
"</ul>",

"<h3 id='linkmode'>부른 페이지의 글까지 함께</h3>",
"<p>일기에 <code>[[뉴욕제과점 단편]]</code>처럼 실마리만 적고 정작 글은 그 페이지에 쓰셨다면, 제목만 옮겨 봐야 소용이 없습니다. 그래서 달력 복사는 <b>그날 노트가 <code>[[ ]]</code>로 부른 페이지의 본문을 그 줄 바로 뒤에 이어 붙입니다.</b> 규칙은 넷입니다.</p>",
"<ul>",
"<li><code>[[ ]]</code>로 부른 것만 끌어옵니다. <code>#쪽글</code> 같은 <b>태그로 부른 것은 인식표일 뿐이므로 건드리지 않습니다.</b> <code>#[[두 낱말]]</code> 꼴도 태그로 봅니다.</li>",
"<li>부른 페이지 안에서 <b>태그만 적힌 줄은 빠집니다.</b> 맨 위에 <code>#쪽글</code>만 달아 두는 표시줄이 원고에 섞여 들지 않습니다. 태그와 글이 한 줄에 같이 있으면 태그만 지우고 글은 남깁니다.</li>",
"<li>같은 페이지를 여러 날에서 불렀다면 <b>처음 부른 날에만</b> 한 번 들어갑니다.</li>",
"<li>부른 페이지가 또 다른 페이지를 부르더라도 <b>거기까지 따라가지는 않습니다.</b> 한 겹만 폅니다. 날짜 페이지를 불렀을 때도 그날은 따로 뽑히므로 겹쳐 넣지 않습니다.</li>",
"</ul>",
"<p><b>기본은 하단 주석입니다.</b> 본문에는 번호만 남고, 그날 일기가 끝난 자리에 가는 줄을 긋고 부른 글을 모읍니다. 번호는 하루마다 1번부터 다시 셉니다. 두 번째로 부른 날은 주석 짝이 없으므로 번호 없이 제목만 남습니다.</p>",
"<pre style='font-family:var(--mono);font-size:12px;line-height:1.6;background:var(--paper-2);border:1px solid var(--line-soft);border-radius:6px;padding:12px 14px;overflow-x:auto;white-space:pre'>2026-06-01 월요일\n\n아침에 한서린[1]을 만났다.\n뉴욕제과점 단편[2]\n\n────────\n[1] 한서린\n1974년생. 목소리가 낮다.\n\n[2] 뉴욕제과점 단편\n제과점 유리문에 김이 서려 있었다.</pre>",
"<p>세 가지 중에서 고릅니다. <b>하단 주석</b>은 원고로 옮길 때, <b>본문 사이</b>는 자료를 한 흐름으로 읽을 때, <b>제목만</b>은 목차처럼 훑을 때 씁니다.</p>",
"<p class='choose'>"
  + "<button data-linkmode='footnote'>하단 주석</button>"
  + "<button data-linkmode='inline'>본문 사이</button>"
  + "<button data-linkmode='none'>제목만</button></p>",

"<h2>5. 쪽글</h2>",
"<p>페이지 안 아무 블록에나 <code>#쪽글</code>을 적어 두면 그 페이지가 <span data-jump='shuffle' style='color:var(--indigo)'>쪽글</span> 목록에 들어갑니다. 누를 때마다 하나씩 무작위로 올라오되, <b>한 바퀴를 다 돌기 전에는 같은 글이 다시 나오지 않습니다.</b> 위쪽 띠에 남은 편수가 보입니다. '태그 바꾸기'로 <code>#초고</code>, <code>#버릴것</code> 같은 다른 묶음을 돌릴 수도 있습니다.</p>",
"<p><b>옆에 두고 다음 →</b> 단추는 지금 쪽글을 오른쪽에 남긴 채 다음 편으로 넘어갑니다. 무작위로 넘기다 쓸 만한 조각이 걸리면 오른쪽에 쌓아 두고 계속 돌리다가, 다 고른 뒤 모아 놓은 것들을 한자리에서 보는 식으로 씁니다. 제목을 <code>Shift</code>+클릭해도 같습니다.</p>",
"<p>짧은 글 하나에 페이지 하나씩 두고 태그를 달아 두는 쓰임을 생각하고 만들었습니다. 제목은 나중에 찾을 실마리만 되면 충분합니다.</p>",

"<h2>6. 찾기</h2>",
"<p><code>⌘K</code>로 페이지 제목과 블록 본문을 한꺼번에 훑습니다. <code>↑↓</code>로 고르고 <code>↵</code>로 엽니다. 없는 제목을 치면 맨 아래에 '새 페이지 만들기'가 붙습니다. 블록을 고르면 그 블록에 캐럿이 놓인 채로 페이지가 열립니다.</p>",

"<h2>6-b. <code>/</code> 명령</h2>",
"<p>블록 안에서 줄 첫머리나 빈칸 뒤에 <code>/</code>를 치면 작은 차림표가 뜹니다. <code>↑↓</code>로 오가다 <code>↵</code>나 <code>Tab</code>으로 고르고, <code>Esc</code>로 닫습니다. 글자를 더 치면 좁혀지는데 한글 자모와 영문 모두 걸립니다 — <code>/ㄴ</code>이든 <code>/d</code>든 <code>/date</code>든 날짜로 갑니다. <code>2026/08/16</code>이나 <code>https://</code> 속의 <code>/</code>에서는 뜨지 않습니다.</p>",
"<table><tbody>",
"<tr><td><code>/날짜</code></td><td>작은 달력이 펼쳐집니다. <code>←→</code>로 하루씩, <code>↑↓</code>로 한 주씩, <code>PageUp/PageDown</code>으로 한 달씩 옮기고 <code>↵</code>로 넣습니다. 고른 날은 <code>[[2026-08-16]]</code> 형태로 들어가 그날 노트와 이어집니다. 글이 있는 날은 아래에 점이 찍히고 오늘은 테두리로 표시되니, 달력을 훑다가 지난 기록으로 바로 이을 수 있습니다.</td></tr>",
"<tr><td><code>/시각</code></td><td>지금 시각을 <code>14:32</code>로 찍습니다.</td></tr>",
"<tr><td><code>/옆에</code></td><td>쓰고 있던 블록을 오른쪽에 둡니다. 편집은 끝나고 그 블록이 오른쪽 카드로 올라갑니다.</td></tr>",
"<tr><td><code>/쪽글</code></td><td>블록 끝에 <code>#쪽글</code>을 붙입니다. 이미 붙어 있으면 겹쳐 넣지 않습니다.</td></tr>",
"<tr><td><code>/링크</code></td><td><code>[]()</code> 틀을 깔고 대괄호 안에 캐럿을 둡니다.</td></tr>",
"</tbody></table>",
"<p>한글로 명령을 칠 때 마지막 글자가 아직 조합 중이면 <code>↵</code>가 먼저 글자를 굳힙니다. 한 번 더 누르거나, <code>Tab</code>으로 고르거나, 영문 별칭(<code>/d</code> <code>/t</code> <code>/s</code> <code>/j</code>)을 쓰면 한 번에 끝납니다.</p>",

"<h2>6-d. 고른 글자로 새 페이지 만들기</h2>",
"<p><i>오늘은 구름이 많은 날이었다.</i> 에서 <b>구름이 많은 날</b>만 끌어 고르고 <code>⌘L</code>을 누르면, 그 자리가 <code>오늘은 [[구름이 많은 날]]이었다.</code> 가 되고 곧바로 그 페이지가 열립니다. 캐럿이 이어 쓸 자리에 놓이니 바로 적어 나가면 됩니다. 돌아올 때는 새 페이지 아래 <b>연결된 참조</b>에 그날 문장이 있으니 눌러서 오면 됩니다.</p>",
"<ul>",
"<li>같은 이름의 페이지가 이미 있으면 새로 만들지 않고 그리로 갑니다. 같은 표현을 여러 날에 쓰면 저절로 한자리에 모입니다.</li>",
"<li>끌다 보면 앞뒤 빈칸까지 딸려 오기 쉬운데, <b>양끝 빈칸은 링크 밖으로 밀어냅니다.</b> 제목에 군더더기가 붙지 않습니다.</li>",
"<li>이미 <code>[[ ]]</code> 안에 든 자리를 고른 채 눌러도 겹쳐 감싸지 않고 그 페이지로만 갑니다.</li>",
"<li>아무것도 고르지 않은 채 누르면 아무 일도 하지 않습니다. 그때 <code>⌘L</code>은 브라우저 주소창으로 그냥 넘어갑니다.</li>",
"</ul>",
"<h3>마우스로도</h3>",
"<p>블록 안에서 글자를 끌어 고르면 그 위에 작은 막대가 뜹니다. <b>새 페이지</b> 단추가 <code>⌘L</code>과 같은 일을 하고, 옆에 <b>굵게 · 기울임 · 형광 · 주소</b>가 함께 있습니다. 손이 이미 마우스에 있을 때 쓰는 길입니다. 블록과 블록 사이를 끌어 여러 블록을 고를 때는 뜨지 않습니다 — 그때는 아래쪽 알약이 대신 뜹니다.</p>",
"<p><b>주소</b>는 물어보는 창을 띄워 받습니다. 스크리브너나 데본씽크에서 링크를 복사해 오셨다면, 물음창에 붙여 넣는 대신 그냥 고른 채로 <code>⌘V</code> 하는 편이 빠릅니다(6-c절).</p>",

"<h2>6-c. 글자에 주소 달기</h2>",
"<p>글자 뒤에 주소를 숨겨 답니다. 문법은 마크다운과 같습니다.</p>",
"<table><tbody>",
"<tr><td><code>[유튜브](https://youtube.com)</code></td><td>웹 주소. 새 탭에서 열립니다.</td></tr>",
"<tr><td><code>[그 장면](x-scrivener-item://…)</code></td><td>스크리브너의 그 문서로.</td></tr>",
"<tr><td><code>[자료](x-devonthink-item://…)</code></td><td>데본씽크의 그 항목으로.</td></tr>",
"<tr><td><code>[아침 루틴](shortcuts://run-shortcut?name=아침)</code></td><td>애플 단축어 실행.</td></tr>",
"</tbody></table>",
"<p>스킴을 미리 정해 두지 않았습니다. <code>mailto:</code> <code>obsidian://</code> <code>file:///</code> 무엇이든 그대로 넘깁니다. 다만 스크립트를 실어 나르는 <code>javascript:</code> <code>data:</code> <code>vbscript:</code>만은 막고 글자만 남깁니다.</p>",
"<h3>손으로 치지 않는 두 가지 길</h3>",
"<ul>",
"<li><b>글자를 고른 채 주소를 붙여넣기</b> — 스크리브너나 데본씽크에서 링크를 복사해 와, 감쌀 글자를 끌어 고른 다음 <code>⌘V</code> 하면 저절로 <code>[고른 글자](주소)</code>가 됩니다. 실제로 가장 자주 쓰실 길입니다.</li>",
"<li><code>/링크</code> — <code>[]()</code> 틀을 깔고 대괄호 안에 캐럿을 놓습니다.</li>",
"</ul>",
"<h3>어떻게 보이고 어떻게 열리나</h3>",

/* ---- 백링크 ---- */
function buildRefIndex(){
  const idx = new Map();                       // 소문자제목 -> [blockId]
  for(const b of Object.values(G.blocks)){
    linksIn(b.content).forEach(t => {
      if(!idx.has(t)) idx.set(t, []);
      idx.get(t).push(b.id);
    });
  }
  return idx;
}
function refFold(key){
  if(!G.meta.refFold) G.meta.refFold = { linked:false, unlinked:true };
  return !!G.meta.refFold[key];
}
function toggleRefFold(key){
  refFold(key);
  G.meta.refFold[key] = !G.meta.refFold[key];
  scheduleSave();
  render();
}
/** 접었다 펼 수 있는 머리글을 만든다. */
function foldHead(key, label, count, extra){
  const head = document.createElement("div");
  head.className = "section-head foldable";
  const folded = refFold(key);
  const arrow = document.createElement("span");
  arrow.className = "fold" + (folded ? "" : " open");
  arrow.textContent = "▶";
  const lab = document.createElement("span");
  lab.className = "label"; lab.textContent = label;
  const pill = document.createElement("span");
  pill.className = "count-pill"; pill.textContent = count;
  const rule = document.createElement("span");
  rule.className = "rule";
  head.append(arrow, lab, pill, rule);
  if(extra) head.appendChild(extra);
  head.addEventListener("click", e => {
    if(e.target.closest(".link-all")) return;
    toggleRefFold(key);
  });
  return head;
}
/** 블록 본문에서 아직 묶이지 않은 제목을 찾아 [[ ]]로 두른다. 두른 곳 수를 돌려준다. */
function linkMentions(blockId, title){
  const b = G.blocks[blockId];
  const key = String(title || "").trim().toLowerCase();
  if(!b || !key) return 0;
  const src = b.content, low = src.toLowerCase();
  const spans = [];
  let m; LINK_RE.lastIndex = 0;
  while((m = LINK_RE.exec(src))) spans.push([m.index, m.index + m[0].length]);
  const inside = i => spans.some(sp => i >= sp[0] && i < sp[1]);
  let out = "", i = 0, n = 0;
  while(i <= src.length){
    const at = low.indexOf(key, i);
    if(at < 0){ out += src.slice(i); break; }
    if(inside(at)){ out += src.slice(i, at + key.length); i = at + key.length; continue; }
    out += src.slice(i, at) + "[[" + src.substr(at, key.length) + "]]";
    i = at + key.length; n++;
  }
  if(n){ b.content = out; touch(blockId); scheduleSave(); }
  return n;
}

function referencesSection(title, pageId){
  const frag = document.createDocumentFragment();
  const key = title.trim().toLowerCase();
  const idx = buildRefIndex();
  const linked = (idx.get(key) || []).filter(bid => G.blocks[bid] && pageOf(bid)?.id !== pageId);

  frag.appendChild(foldHead("linked", "연결된 참조", linked.length));
  if(!refFold("linked")){
    if(!linked.length){
      const e = document.createElement("div");
      e.className = "empty-note";
      e.textContent = `다른 블록에서 [[${title}]] 을 적으면 이 자리에 모입니다.`;
      frag.appendChild(e);
    }else{
      frag.appendChild(groupRefs(linked));
    }
  }

  // 언급됨(링크 없음)
  const unlinked = [];
  const low = key;
  if(low.length >= 2){
    for(const b of Object.values(G.blocks)){
      if(pageOf(b.id)?.id === pageId) continue;
      if(linked.includes(b.id)) continue;
      if(b.content.toLowerCase().includes(low)) unlinked.push(b.id);
    }
  }
  let all = null;
  if(unlinked.length){
    all = document.createElement("button");
    all.className = "link-all";
    all.textContent = `모두 잇기 ${unlinked.length}`;
    all.onclick = e => {
      e.stopPropagation();
      if(!confirm(`${unlinked.length}개 블록에서 "${title}"을(를) 찾아 [[ ]]로 두릅니다.\n계속할까요?`)) return;
      let n = 0;
      unlinked.forEach(id => { n += linkMentions(id, title); });
      render();
      toast(n ? `${n}곳을 이었습니다` : "이을 곳을 찾지 못했습니다");
    };
  }
  frag.appendChild(foldHead("unlinked", "언급됨 · 링크 없음", unlinked.length, all));
  if(!refFold("unlinked")){
    if(!unlinked.length){
      const e = document.createElement("div");
      e.className = "empty-note"; e.textContent = "괄호 없이 이 제목을 쓴 블록이 아직 없습니다.";
      frag.appendChild(e);
    }else{
      frag.appendChild(groupRefs(unlinked.slice(0, 60), { linkTitle: title }));
    }
  }
  return frag;
}
function groupRefs(blockIds, opts){
  const wrap = document.createElement("div");
  const byPage = new Map();
  blockIds.forEach(bid => {
    const pg = pageOf(bid); if(!pg) return;
    if(!byPage.has(pg.id)) byPage.set(pg.id, []);
    byPage.get(pg.id).push(bid);
  });
  for(const [pid, ids] of byPage){
    const g = document.createElement("div");
    g.className = "ref-group";
    const t = document.createElement("div");
    t.className = "ref-page"; t.textContent = G.pages[pid].title;
    t.title = "Shift+클릭: 오른쪽에 두기";
    t.onclick = e => e.shiftKey ? sideAdd({ type:"page", id:pid }) : openPage(pid);
    g.appendChild(t);
    ids.forEach(bid => {
      const b = G.blocks[bid];
      const item = document.createElement("div");
      item.className = "ref-item";
      const path = ancestors(bid).filter(a => a.type === "block").map(a => a.label.slice(0,20)).join(" › ");
      item.innerHTML = (path ? `<div class="ref-path">${esc(path)}</div>` : "") +
                       `<div class="ref-row"><div class="ref-body">${renderInline(b.content)}</div></div>`;
      if(opts && opts.linkTitle){
        const btn = document.createElement("button");
        btn.className = "link-btn";
        btn.textContent = "잇기";
        btn.title = `이 블록의 "${opts.linkTitle}"에 [[ ]]를 두릅니다`;
        btn.addEventListener("mousedown", e => e.stopPropagation());
        btn.onclick = e => {
          e.stopPropagation();
          const n = linkMentions(bid, opts.linkTitle);
          render();
          toast(n ? `${n}곳을 이었습니다` : "이을 곳을 찾지 못했습니다");
        };
        item.querySelector(".ref-row").appendChild(btn);
      }
      item.addEventListener("mousedown", e => {
        if(e.target.closest(".page-link,.tag,a,.link-btn")) return;
        openPage(pid, bid);
      });
      g.appendChild(item);
    });
    wrap.appendChild(g);
  }
  return wrap;
}
