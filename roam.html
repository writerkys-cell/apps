function go(v){
  if(v.type === "shuffle"){ nextShuffle(); return; }
  if(v.type === "calendar" && !v.keep){ const d = new Date(); calCursor = { y:d.getFullYear(), m:d.getMonth() }; }
  exitEdit(); view = v; render(); $("#main").scrollTop = 0; closeSidebarMobile();
}
function openPage(id, focusBlock){
  exitEdit(); view = { type:"page", id }; render();
  $("#main").scrollTop = 0;
  closeSidebarMobile();
  if(focusBlock){
    const el = document.querySelector(`.block[data-id="${focusBlock}"]`);
    if(el){ el.scrollIntoView?.({ block:"center" }); enterEdit(focusBlock); }
  }
}
function openPageByTitle(title){
  const p = getOrCreatePage(title);
  scheduleSave();
  openPage(p.id);
}
function renamePage(pid, newTitle){
  const old = G.pages[pid].title;
  G.pages[pid].title = newTitle;
  G.pages[pid].updatedAt = now();
  const re = new RegExp(`\\[\\[\\s*${old.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}\\s*\\]\\]`, "gi");
  let n = 0;
  for(const b of Object.values(G.blocks)){
    if(re.test(b.content)){ b.content = b.content.replace(re, `[[${newTitle}]]`); b.updatedAt = now(); n++; }
    re.lastIndex = 0;
  }
  scheduleSave(); render();
  toast(n ? `제목을 바꾸고 링크 ${n}곳을 함께 고쳤습니다` : "제목을 바꿨습니다");
}
/** 무작위 페이지로 이동. 내용이 있는 일반 페이지를 우선하고,
 *  없으면 링크로만 만들어진 빈 페이지, 그래도 없으면 데일리 노트까지 넓힌다. */
function randomPage(){
  const currentId = view.type === "page" ? view.id : null;
  const all = Object.values(G.pages).filter(p => p.id !== currentId);
  const normal = all.filter(p => !isDailyTitle(p.title));
  const withText = normal.filter(p => countBlocks(p.id) > 0);
  const pool = withText.length ? withText : (normal.length ? normal : all);
  if(!pool.length){ toast("아직 옮겨 갈 페이지가 없습니다"); return; }
  const p = pool[Math.floor(Math.random() * pool.length)];
  openPage(p.id);
  toast("무작위 · " + p.title);
}
function closeSidebarMobile(){ if(window.innerWidth <= 760) $("#sidebar").classList.remove("open"); }

/* ============================================================
   8. 편집 (블록 하나에만 textarea를 붙였다 뗀다)
   ============================================================ */
function autosize(ta){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

function enterEdit(id, pos = null, root = null){
  const scope = (root && document.contains(root)) ? root : (editRoot && document.contains(editRoot) ? editRoot : $("#view"));
  if(editing === id && scope.contains(currentTA())){
    const ta = currentTA();
    if(ta && pos != null){ ta.focus(); ta.setSelectionRange(pos, pos); }
    return;
  }
  if(editing) exitEdit();
  const blockEl = scope.querySelector(`.block[data-id="${id}"]`) || document.querySelector(`.block[data-id="${id}"]`);
  editRoot = paneOf(blockEl);
  if(!blockEl || !G.blocks[id]) return;
  const row = blockEl.querySelector(":scope > .block-row");
  const content = row.querySelector(".content");
  content.style.display = "none";
  const ta = document.createElement("textarea");
  ta.className = "editor";
  ta.rows = 1;
  ta.spellcheck = false;
  ta.value = G.blocks[id].content;
  row.appendChild(ta);
  editing = id;
  composing = false;
  selAnchor = id;
  clearSel();
  autosize(ta);
  ta.focus();
  const p = pos == null ? ta.value.length : Math.max(0, Math.min(pos, ta.value.length));
  ta.setSelectionRange(p, p);
  ta.addEventListener("input", onInput);
  ta.addEventListener("keydown", onKeydown);
  ta.addEventListener("blur", onBlur);
  ta.addEventListener("click", () => updateAutocomplete(ta));
  ta.addEventListener("paste", onPaste);
  ta.addEventListener("select", tbarSync);
  ta.addEventListener("keyup", tbarSync);
  ta.addEventListener("compositionstart", () => { composing = true; });
  ta.addEventListener("compositionend", () => {
    composing = false;
    commit(); autosize(ta); scheduleSave(); updateAutocomplete(ta);
  });
}
function currentTA(){ return document.querySelector(".editor"); }
/** 편집기가 붙은 창. 본문(#view)과 오른쪽 사이드(#side-body)에 같은 블록이 동시에 그려질 수 있어
 *  블록을 찾을 때는 항상 어느 창인지부터 정한다. */
let editRoot = null;
function paneOf(el){ return el && el.closest("#side-body") ? $("#side-body") : $("#view"); }
function commit(){
  const ta = currentTA();
  if(ta && editing && G.blocks[editing]){
    if(G.blocks[editing].content !== ta.value){
      G.blocks[editing].content = ta.value;
      touch(editing);
    }
  }
}
function exitEdit(){
  const ta = currentTA();
  if(!ta || !editing){ editing = null; closeAC(); return; }
  const id = editing;
  commit();
  const b = G.blocks[id];
  if(b) ensureLinkedPages(b.content);
  const row = ta.parentElement;
  ta.remove();
  if(b){
    // 본문과 오른쪽 사이드에 같은 블록이 있으면 양쪽 다 새로 그린다
    $$(`.block[data-id="${id}"] > .block-row > .content`).forEach(el => {
      el.style.display = "";
      el.className = "content" + (b.content ? "" : " empty");
      el.innerHTML = renderInline(b.content, id);
    });
  }else if(row){
    row.querySelector(".content")?.style.removeProperty("display");
  }
  editing = null;
  composing = false;
  closeAC(); closeDP(); tbarHide();
  scheduleSave();
}
/** [[..]] 로 언급된 페이지는 실제 노드로 만들어 둔다 (Roam과 같은 동작) */
function ensureLinkedPages(content){
  let created = 0;
  linksIn(content).forEach(t => {
    if(!t) return;
    if(!findPageByTitle(t)){ createPage(t, false); created++; }
  });
  if(created) renderSidebar();
}
function onInput(e){
  const ta = e.target;
  tbarHide();
  autosize(ta);
  commit();
  scheduleSave();
  updateAutocomplete(ta);
}
function onBlur(){
  setTimeout(() => {
    if(ac.open && ac.hovering) return;
    if(dp.open && dp.hovering) return;
    if(tbar.hovering) return;
    if(dp.open) closeDP();
    if(document.activeElement && document.activeElement.classList?.contains("editor")) return;
    exitEdit();
  }, 0);
}

/* ---- 구조 조작 ---- */
function afterStructure(focusId, caret){
  scheduleSave();
  const keep = $("#main").scrollTop;
  const keepSide = $("#side-body").scrollTop;
  const root = editRoot;
  editing = null;
  render();
  $("#main").scrollTop = keep;
  $("#side-body").scrollTop = keepSide;
  if(focusId) enterEdit(focusId, caret, root);
}
function visibleOrder(){
  const scope = (editRoot && document.contains(editRoot)) ? editRoot : $("#view");
  const ids = $$(".block", scope).map(el => el.dataset.id);
  return ids.length ? ids : $$(".block").map(el => el.dataset.id);
}
function prevVisible(id){ const o = visibleOrder(), i = o.indexOf(id); return i > 0 ? o[i-1] : null; }
function nextVisible(id){ const o = visibleOrder(), i = o.indexOf(id); return i >= 0 && i < o.length-1 ? o[i+1] : null; }

function splitBlock(id, pos, value){
  const b = G.blocks[id];
  const before = value.slice(0, pos), after = value.slice(pos);
  b.content = before; touch(id);
  let nb;
  if(b.children.length && !b.collapsed) nb = newBlock(id, after, 0);
  else {
    const arr = siblingsOf(id);
    nb = newBlock(b.parent, after, arr.indexOf(id) + 1);
  }
  ensureLinkedPages(before);
  afterStructure(nb.id, 0);
}
function indent(id){
  const b = G.blocks[id];
  const arr = siblingsOf(id);
  const i = arr.indexOf(id);
  if(i <= 0) return false;
  const prev = G.blocks[arr[i-1]];
  const caret = currentTA()?.selectionStart ?? null;
  detach(id);
  prev.collapsed = false;
  prev.children.push(id);
  b.parent = prev.id;
  touch(id);
  afterStructure(id, caret);
  return true;
}
function outdent(id){
  const b = G.blocks[id];
  const parent = G.blocks[b.parent];
  if(!parent) return false;                       // 이미 최상위
  const gpId = parent.parent;
  const gpArr = childrenOf(gpId);
  const caret = currentTA()?.selectionStart ?? null;
  detach(id);
  gpArr.splice(gpArr.indexOf(parent.id) + 1, 0, id);
  b.parent = gpId;
  touch(id);
  afterStructure(id, caret);
  return true;
}
function mergeBackwards(id){
  const b = G.blocks[id];
  const arr = siblingsOf(id);
  const prevId = prevVisible(id);
  // 페이지의 첫 블록이고 형제도 없다면 아무것도 하지 않는다
  if(!prevId){ return; }
  if(pageOf(prevId)?.id !== pageOf(id)?.id){ enterEdit(prevId); return; }
  if(isAncestorOf(id, prevId)) return;
  const prev = G.blocks[prevId];
  if(prev.children.length && !prev.collapsed && b.children.length) return;  // 애매한 병합은 막는다
  const caret = prev.content.length;
  prev.content += b.content;
  b.children.slice().forEach(cid => {
    detach(cid); prev.children.push(cid); G.blocks[cid].parent = prev.id;
  });
  detach(id); delete G.blocks[id];
  touch(prevId);
  afterStructure(prevId, caret);
}
function mergeForwards(id){
  const nextId = nextVisible(id);
  if(!nextId) return;
  if(pageOf(nextId)?.id !== pageOf(id)?.id) return;
  const b = G.blocks[id], nx = G.blocks[nextId];
  if(nx.children.length) return;
  const caret = b.content.length;
  b.content += nx.content;
  detach(nextId); delete G.blocks[nextId];
  touch(id);
  afterStructure(id, caret);
}
function moveBlock(id, dir){
  const arr = siblingsOf(id);
  const i = arr.indexOf(id);
  const j = i + dir;
  const caret = currentTA()?.selectionStart ?? null;
  if(j < 0 || j >= arr.length){
    // 형제 밖으로: 위로면 부모 앞, 아래면 부모 뒤
    const b = G.blocks[id], parent = G.blocks[b.parent];
    if(!parent) return;
    const gpArr = childrenOf(parent.parent);
    detach(id);
    gpArr.splice(gpArr.indexOf(parent.id) + (dir < 0 ? 0 : 1), 0, id);
    b.parent = parent.parent;
  }else{
    arr.splice(i, 1); arr.splice(j, 0, id);
  }
  touch(id);
  afterStructure(id, caret);
}
/** 드래그앤드롭 이동 */
function relocate(id, targetId, mode){
  if(id === targetId || isAncestorOf(id, targetId)) return;
  const b = G.blocks[id];
  detach(id);
  if(mode === "child"){
    const t = G.blocks[targetId];
    t.collapsed = false;
    t.children.unshift(id);
    b.parent = targetId;
  }else{
    const t = G.blocks[targetId];
    const arr = childrenOf(t.parent);
    arr.splice(arr.indexOf(targetId) + (mode === "after" ? 1 : 0), 0, id);
    b.parent = t.parent;
  }
  touch(id); scheduleSave();
  editing = null; render();
}

/* ---- 키 입력 ---- */
function onKeydown(e){
  const ta = e.target, id = editing;
  // 한글·일본어·중국어 조합 중에는 Enter/Tab/Backspace를 IME가 먼저 쓰게 둔다.
  // (Safari는 조합을 끝내는 keydown에서 isComposing이 false로 오므로 자체 플래그도 함께 본다)
  if(composing || e.isComposing || e.keyCode === 229) return;
  if(!id || !G.blocks[id]) return;
  const b = G.blocks[id];
  const mod = e.metaKey || e.ctrlKey;

  if(dp.open){
    e.preventDefault();
    if(e.key === "Escape"){ closeDP(); return; }
    if(e.key === "Enter" || e.key === "Tab"){ dpAccept(); return; }
    if(e.key === "ArrowLeft"){ dpMove(-1); return; }
    if(e.key === "ArrowRight"){ dpMove(1); return; }
    if(e.key === "ArrowUp"){ dpMove(-7); return; }
    if(e.key === "ArrowDown"){ dpMove(7); return; }
    if(e.key === "PageUp"){ dpMonth(-1); return; }
    if(e.key === "PageDown"){ dpMonth(1); return; }
    return;                                  // 그 밖의 글쇠는 달력이 삼킨다
  }
  if(ac.open){
    if(e.key === "ArrowDown"){ e.preventDefault(); acMove(1); return; }
    if(e.key === "ArrowUp"){ e.preventDefault(); acMove(-1); return; }
    if(e.key === "Enter" || e.key === "Tab"){ e.preventDefault(); acAccept(); return; }
    if(e.key === "Escape"){ e.preventDefault(); closeAC(); return; }
  }

  if(e.key === "Enter" && !e.shiftKey && !mod){
    e.preventDefault(); commit();
    splitBlock(id, ta.selectionStart, ta.value);
    return;
  }
  if(e.key === "Tab"){
    e.preventDefault(); commit();
    e.shiftKey ? outdent(id) : indent(id);
    return;
  }
  if(mod && e.shiftKey && (e.key === "ArrowUp" || e.key === "ArrowDown")){
    e.preventDefault(); commit();
    moveBlock(id, e.key === "ArrowUp" ? -1 : 1);
    return;
  }
  if(mod && e.key === "." ){            // 접기/펼치기
    e.preventDefault(); commit();
    if(b.children.length){ b.collapsed = !b.collapsed; afterStructure(id, ta.selectionStart); }
    return;
  }
  if(mod && !e.shiftKey && e.key.toLowerCase() === "l"){
    // 고른 글자가 있을 때만 가로챈다. 없으면 브라우저 주소창으로 그냥 넘긴다.
    if(ta.selectionEnd > ta.selectionStart){ e.preventDefault(); commit(); linkSelection(); }
    return;
  }
  if(mod && e.key.toLowerCase() === "b"){ e.preventDefault(); wrapSel(ta, "**"); return; }
  if(mod && e.key.toLowerCase() === "i"){ e.preventDefault(); wrapSel(ta, "__"); return; }
  if(mod && e.key === "Enter"){         // TODO 토글
    e.preventDefault(); toggleTodo(id); return;
  }
  if(e.key === "Backspace" && ta.selectionStart === 0 && ta.selectionEnd === 0){
    e.preventDefault(); commit();
    mergeBackwards(id);
    return;
  }
  if(e.key === "Delete" && ta.selectionStart === ta.value.length && ta.selectionEnd === ta.value.length){
    e.preventDefault(); commit(); mergeForwards(id); return;
  }
  if(e.shiftKey && !mod && (e.key === "ArrowDown" || e.key === "ArrowUp")){
    const down = e.key === "ArrowDown";
    // 여러 줄 블록이면 줄 끝에 닿았을 때만 블록 선택으로 넘어간다
    const atEdge = down
      ? ta.value.indexOf("\n", ta.selectionEnd) === -1
      : ta.value.lastIndexOf("\n", ta.selectionStart - 1) === -1;
    if(atEdge){
      e.preventDefault();
      e.stopPropagation();      // 편집기에서 처리한 키가 전역 선택 핸들러로 다시 올라가지 않게
      commit();
      extendSelBy(down ? 1 : -1);
      return;
    }
  }
  if(e.key === "ArrowUp" && !mod){
    const upto = ta.value.lastIndexOf("\n", ta.selectionStart - 1);
    if(upto === -1){
      const p = prevVisible(id);
      if(p){ e.preventDefault(); commit(); exitEdit(); enterEdit(p); }
    }
    return;
  }
  if(e.key === "ArrowDown" && !mod){
    const nl = ta.value.indexOf("\n", ta.selectionStart);
    if(nl === -1){
      const n = nextVisible(id);
      if(n){ e.preventDefault(); commit(); exitEdit(); enterEdit(n, 0); }
    }
    return;
  }
  if(e.key === "Escape"){ e.preventDefault(); exitEdit(); }
}
function wrapSel(ta, mark){
  const s = ta.selectionStart, en = ta.selectionEnd;
  const sel = ta.value.slice(s, en) || "텍스트";
  ta.value = ta.value.slice(0, s) + mark + sel + mark + ta.value.slice(en);
  ta.setSelectionRange(s + mark.length, s + mark.length + sel.length);
  commit(); autosize(ta); scheduleSave();
}
function toggleTodo(id){
  const b = G.blocks[id];
  const ta = currentTA();
  let v = ta ? ta.value : b.content;
  if(/^\{\{TODO\}\}\s?/.test(v))      v = v.replace(/^\{\{TODO\}\}\s?/, "{{DONE}} ");
  else if(/^\{\{DONE\}\}\s?/.test(v)) v = v.replace(/^\{\{DONE\}\}\s?/, "");
  else                                v = "{{TODO}} " + v;
  b.content = v; touch(id);
  if(ta){ ta.value = v; autosize(ta); ta.setSelectionRange(v.length, v.length); }
  scheduleSave();
}

/* ============================================================
   8-b. 블록 여러 개 선택 · 잘라내기 · 복사 · 붙여넣기
   ============================================================ */
let sel = new Set();        // 선택된 "최상위" 블록 id (하위는 따라온다)
let selDrag = null;         // 드래그 중 상태
let selAnchor = null;       // 범위의 붙박이 끝 (shift+클릭·shift+화살표의 기준점)
let selFocus  = null;       // 범위의 움직이는 끝
let clip = null;            // 앱 내부 클립보드 (계층 그대로)

function selWithDescendants(){
  const out = new Set();
  const walk = id => { out.add(id); (G.blocks[id]?.children || []).forEach(walk); };
  sel.forEach(walk);
  return out;
}
function paintSel(){
  sel = new Set(Array.from(sel).filter(id => G.blocks[id]));
  const marked = selWithDescendants();
  $$(".block").forEach(el => el.classList.toggle("is-sel", marked.has(el.dataset.id)));
  updateSelBar();
}
function clearSel(){ if(!sel.size) return; sel.clear(); selFocus = null; paintSel(); }
/** 같은 페이지 안에서, 화면에 보이는 순서대로 두 블록 사이를 선택 */
function setRange(aId, bId){
  const order = visibleOrder();
  let i = order.indexOf(aId), j = order.indexOf(bId);
  if(i < 0 || j < 0) return;
  if(i > j){ const t = i; i = j; j = t; }
  const pg = pageOf(aId)?.id;
  const ids = order.slice(i, j + 1).filter(id => pageOf(id)?.id === pg);
  sel = new Set(topLevelOf(ids));
  paintSel();
}
/** 조상이 함께 뽑힌 블록은 빼서, 겹치지 않는 뿌리들만 남긴다 */
function topLevelOf(ids){
  const set = new Set(ids);
  return ids.filter(id => {
    let p = G.blocks[id]?.parent;
    while(p && G.blocks[p]){ if(set.has(p)) return false; p = G.blocks[p].parent; }
    return true;
  });
}
function selOrdered(){
  const order = visibleOrder();
  return Array.from(sel).sort((a, b) => order.indexOf(a) - order.indexOf(b));
}
function updateSelBar(){
  let bar = $("#selbar");
  if(!sel.size){ bar?.remove(); document.body.classList.remove("has-selbar"); return; }
  if(!bar){ bar = document.createElement("div"); bar.id = "selbar"; document.body.appendChild(bar); }
  document.body.classList.add("has-selbar");
  const total = selWithDescendants().size;
  bar.innerHTML = `<span><b>${sel.size}</b>개 선택</span>`
    + (total > sel.size ? `<span class="s">하위 포함 ${total}</span>` : `<span class="s"></span>`)
    + `<button data-a="copy">복사</button><button data-a="plain">플레인 복사</button>`
    + `<button data-a="cut">잘라내기</button><button data-a="del">삭제</button>`
    + `<button data-a="clear">해제</button>`;
  bar.querySelectorAll("button").forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    const n = selWithDescendants().size;
    if(a === "copy"){ const t = copySel(); if(t){ writeClipboard(t); toast(`블록 ${n}개를 복사했습니다`); } }
    else if(a === "plain"){ const t = copySel(true); if(t){ writeClipboard(t); toast(`플레인 텍스트로 복사했습니다`); } }
    else if(a === "cut"){ const t = copySel(); if(t) writeClipboard(t); deleteSel(); }
    else if(a === "del") deleteSel();
    else clearSel();
  });
}

/** Shift+↑↓ 로 범위를 넓히거나 좁힌다. 편집 중이었다면 그 블록을 기준점 삼아 선택으로 넘어간다. */
function extendSelBy(dir){
  if(!sel.size){
    const start = editing || selAnchor;
    if(!start || !G.blocks[start]) return false;
    commit();
    exitEdit();
    selAnchor = start;
    selFocus  = start;
  }
  const order = visibleOrder();
  let i = order.indexOf(selFocus);
  if(i < 0) i = order.indexOf(selAnchor);
  if(i < 0) return false;
  const j = i + dir;
  if(j >= 0 && j < order.length && pageOf(order[j])?.id === pageOf(selAnchor)?.id)
    selFocus = order[j];
  else
    selFocus = order[i];
  setRange(selAnchor, selFocus);
  scrollBlockIntoView(selFocus);
  return true;
}
function scrollBlockIntoView(id){
  const scope = (editRoot && document.contains(editRoot)) ? editRoot : document;
  scope.querySelector(`.block[data-id="${id}"]`)?.scrollIntoView?.({ block:"nearest" });
}

/* ---- 마우스 드래그 ---- */
function beginPointerSelect(id, startOff, ev){
  editRoot = paneOf(ev.target);
  if(ev.shiftKey && selAnchor && G.blocks[selAnchor]){
    exitEdit(); selFocus = id; setRange(selAnchor, id); return;
  }
  clearSel();
  selAnchor = id; selFocus = id;
  selDrag = { id, startOff, x: ev.clientX, y: ev.clientY, mode: "text" };
  document.addEventListener("mousemove", onSelMove);
  document.addEventListener("mouseup", onSelUp);
}
function blockIdAtPoint(x, y){
  const el = document.elementFromPoint(x, y);
  return el?.closest(".content")?.closest(".block")?.dataset.id || null;
}
function onSelMove(e){
  if(!selDrag) return;
  const overId = blockIdAtPoint(e.clientX, e.clientY);
  if(overId && overId !== selDrag.id){
    if(selDrag.mode !== "block"){
      selDrag.mode = "block";
      exitEdit();
      document.body.classList.add("selecting");
      window.getSelection()?.removeAllRanges();
    }
    selFocus = overId;
    setRange(selDrag.id, overId);
  }else if(selDrag.mode === "block" && overId === selDrag.id){
    setRange(selDrag.id, selDrag.id);
  }
}
function onSelUp(e){
  document.removeEventListener("mousemove", onSelMove);
  document.removeEventListener("mouseup", onSelUp);
  document.body.classList.remove("selecting");
  const dr = selDrag; selDrag = null;
  if(!dr) return;
  if(dr.mode === "block") return;               // 블록 선택 상태 유지
  clearSel();
  const scope = (editRoot && document.contains(editRoot)) ? editRoot : document;
  const el = scope.querySelector(`.block[data-id="${dr.id}"] > .block-row > .content`);
  let endOff = dr.startOff;
  if(el && G.blocks[dr.id])
    endOff = renderedToRaw(G.blocks[dr.id].content, caretOffsetFromPoint(el, e.clientX, e.clientY));
  enterEdit(dr.id, dr.startOff, editRoot);
  const ta = currentTA();
  if(ta && endOff !== dr.startOff){
    ta.setSelectionRange(Math.min(dr.startOff, endOff), Math.max(dr.startOff, endOff));
    tbarSync();                       // 한 블록 안에서 고른 때만 막대가 뜬다
  }
}

/* ---- 계층을 글로, 글을 계층으로 ---- */
function treeOf(ids){
  return ids.map(id => {
    const b = G.blocks[id];
    return { content: b.content, children: treeOf(b.children) };
  });
}
function countTree(tree){ return tree.reduce((n, x) => n + 1 + countTree(x.children), 0); }
function serializeTree(tree, depth){
  const out = [];
  tree.forEach(n => {
    const pad = "  ".repeat(depth);
    const lines = String(n.content).split("\n");
    out.push(pad + "- " + lines[0]);
    lines.slice(1).forEach(l => out.push(pad + "  " + l));
    out.push.apply(out, serializeTree(n.children, depth + 1));
  });
  return out;
}
const serialize = tree => serializeTree(tree, 0).join("\n");
/** 들여쓴 글줄을 계층으로 되돌린다. 글머리표(- * + 1.)가 하나라도 있으면 그것만 블록으로 본다. */
function parseOutline(text){
  const lines = String(text).replace(/\r/g, "").split("\n");
  const hasBullet = lines.some(l => /^\s*(?:[-*+]|\d+\.)\s+/.test(l));
  const indentOf = str => str.replace(/\t/g, "    ").length;
  const roots = [], stack = [];
  let last = null;
  for(const raw of lines){
    if(!raw.trim()) continue;
    const m = /^(\s*)(?:([-*+]|\d+\.)\s+)?([\s\S]*)$/.exec(raw);
    const ind = indentOf(m[1]), bullet = !!m[2], content = m[3];
    if(hasBullet && !bullet && last){ last.content += "\n" + content; continue; }
    const n = { content, children: [] };
    while(stack.length && stack[stack.length - 1].indent >= ind) stack.pop();
    if(stack.length) stack[stack.length - 1].node.children.push(n);
    else roots.push(n);
    stack.push({ indent: ind, node: n });
    last = n;
  }
  return roots;
}
function insertTree(tree, parentId, index){
  const made = [];
  tree.forEach((n, i) => {
    const b = newBlock(parentId, n.content, index < 0 ? -1 : index + i);
    made.push(b.id);
    if(n.children.length) insertTree(n.children, b.id, -1);
  });
  return made;
}
function lastDescendant(id){
  const b = G.blocks[id];
  if(!b || !b.children.length) return id;
  return lastDescendant(b.children[b.children.length - 1]);
}

/* ---- 원고용 플레인 텍스트 ----
   [[제목]]은 제목만 남기고, #태그와 강조 기호·할 일 표시는 지운다.
   블록 하나가 한 문단이 되도록 줄바꿈 하나로만 잇는다(스크리브너에서 문단 하나로 들어온다). */
function toPlain(text){
  let t = String(text || "");
  t = t.replace(/\{\{(TODO|DONE)\}\}\s*/g, "");       // 줄 어디에 있든 지운다
  t = t.replace(EXT_RE, "$1 ($2)");                     // [유튜브](주소) → 유튜브 (주소)
  t = t.replace(/(^|[\s(])#\[\[[^\]\n]+\]\]/g, "$1");   // #[[여러 낱말]] 꼴 태그는 통째로
  t = t.replace(LINK_RE, "$1");
  t = t.replace(TAG_RE, "$1");
  t = t.replace(/\*\*([^*\n]+)\*\*/g, "$1");
  t = t.replace(/__([^_\n]+)__/g, "$1");
  t = t.replace(/~~([^~\n]+)~~/g, "$1");
  t = t.replace(/\^\^([^^\n]+)\^\^/g, "$1");
  t = t.replace(/`([^`\n]+)`/g, "$1");
  return t.replace(/[ \t]+$/g, "").trim();
}
function plainIndentOn(){ return !!(G.meta && G.meta.plainIndent); }
function plainTree(tree, depth){
  const out = [];
  tree.forEach(n => {
    const body = toPlain(n.content);
    if(body){
      const pad = plainIndentOn() ? "\t".repeat(depth) : "";
      body.split("\n").forEach(line => out.push(pad + line));
    }
    out.push.apply(out, plainTree(n.children, body ? depth + 1 : depth));
  });
  return out;
}
const serializePlain = tree => plainTree(tree, 0).join("\n");

/* ---- 복사 / 잘라내기 / 삭제 / 붙여넣기 ---- */
function copySel(plain){
  const ids = selOrdered();
  if(!ids.length) return null;
  clip = treeOf(ids);
  return plain ? serializePlain(clip) : serialize(clip);
}
/** 클립보드에 직접 쓴다(단추로 누를 때). 실패하면 숨은 textarea로 대신한다. */
function writeClipboard(text){
  if(navigator.clipboard?.writeText) return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  fallbackCopy(text);
}
function fallbackCopy(text){
  const t = document.createElement("textarea");
  t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t); t.select();
  try{ document.execCommand("copy"); }catch{}
  t.remove();
}
function deleteSel(){
  const ids = selOrdered();
  if(!ids.length) return;
  const marked = selWithDescendants();
  const order = visibleOrder();
  const before = order.slice(0, order.indexOf(ids[0])).reverse().find(id => !marked.has(id));
  const n = marked.size;
  ids.forEach(deleteBlockDeep);
  sel.clear();
  scheduleSave();
  editing = null;
  render();
  if(before && G.blocks[before]) enterEdit(before);
  toast(`블록 ${n}개를 지웠습니다`);
}
/** 선택한 블록들을 한꺼번에 들여쓴다. 부모가 같은 것끼리 묶어,
 *  그 묶음의 첫 블록 바로 앞 형제 밑으로 순서대로 넣는다. */
function indentGroup(){
  const ids = selOrdered();
  if(!ids.length) return;
  const groups = new Map();
  ids.forEach(id => {
    const p = G.blocks[id].parent;
    if(!groups.has(p)) groups.set(p, []);
    groups.get(p).push(id);
  });
  let moved = 0;
  for(const [parent, members] of groups){
    const arr = childrenOf(parent);
    const firstIdx = Math.min.apply(null, members.map(id => arr.indexOf(id)));
    if(firstIdx <= 0) continue;                       // 앞에 기댈 형제가 없다
    const target = G.blocks[arr[firstIdx - 1]];
    if(!target || sel.has(target.id)) continue;
    members.sort((a, b) => arr.indexOf(a) - arr.indexOf(b)).forEach(id => {
      detach(id);
      target.children.push(id);
      G.blocks[id].parent = target.id;
      touch(id); moved++;
    });
    target.collapsed = false;
  }
  if(!moved){ toast("더 들여쓸 수 없습니다"); return; }
  scheduleSave(); editing = null; render();
}
/** 선택한 블록들을 한꺼번에 내어쓴다. 부모 바로 뒤로 순서대로 빠져나온다. */
function outdentGroup(){
  const ids = selOrdered();
  if(!ids.length) return;
  const groups = new Map();
  ids.forEach(id => {
    const p = G.blocks[id].parent;
    if(!groups.has(p)) groups.set(p, []);
    groups.get(p).push(id);
  });
  let moved = 0;
  for(const [parentId, members] of groups){
    const parent = G.blocks[parentId];
    if(!parent) continue;                             // 이미 페이지 바로 아래
    const arr = childrenOf(parentId);
    members.sort((a, b) => arr.indexOf(a) - arr.indexOf(b));
    const gp = childrenOf(parent.parent);
    let at = gp.indexOf(parentId) + 1;
    members.forEach(id => {
      detach(id);
      gp.splice(at++, 0, id);
      G.blocks[id].parent = parent.parent;
      touch(id); moved++;
    });
  }
  if(!moved){ toast("더 내어쓸 수 없습니다"); return; }
  scheduleSave(); editing = null; render();
}

function onPaste(e){
  const text = (e.clipboardData || window.clipboardData)?.getData("text/plain");
  if(!text) return;
  const norm = text.replace(/\r/g, "").replace(/\s+$/, "");

  // 글자를 골라 둔 채 주소를 붙여넣으면 [고른 글자](주소) 로 감싼다
  const ta0 = e.target;
  if(ta0 && ta0.selectionEnd > ta0.selectionStart &&
     /^[a-z][a-z0-9+.-]*:[^\s]+$/i.test(norm) && !/\s/.test(norm) && safeHref(norm)){
    e.preventDefault();
    const s0 = ta0.selectionStart, s1 = ta0.selectionEnd;
    const label = ta0.value.slice(s0, s1);
    replaceRange(ta0, s0, s1, `[${label}](${norm})`);
    toast("고른 글자에 주소를 달았습니다");
    return;
  }
  const tree = (clip && serialize(clip) === norm) ? clip : parseOutline(norm);
  if(!tree.length) return;
  const multi = tree.length > 1 || tree[0].children.length > 0;
  if(!multi) return;                                  // 한 줄이면 그냥 기본 붙여넣기
  e.preventDefault();
  const id = editing, b = G.blocks[id];
  if(!b) return;
  commit();
  let made;
  if(!b.content.trim()){
    b.content = tree[0].content; touch(id);
    insertTree(tree[0].children, id, -1);
    made = insertTree(tree.slice(1), b.parent, siblingsOf(id).indexOf(id) + 1);
    made.unshift(id);
  }else{
    made = insertTree(tree, b.parent, siblingsOf(id).indexOf(id) + 1);
  }
  (function walk(list){ list.forEach(n => { ensureLinkedPages(n.content); walk(n.children); }); })(tree);
  afterStructure(made.length ? lastDescendant(made[made.length - 1]) : id, null);
  toast(`블록 ${countTree(tree)}개를 붙여넣었습니다`);
}

/* ---- 드래그앤드롭 ---- */
let dragId = null;
function clearDropMarks(){ $$(".block-row").forEach(r => r.classList.remove("drop-before","drop-after","drop-child")); }
function attachDrop(row, id){
  row.addEventListener("dragover", e => {
    if(!dragId || dragId === id) return;
    e.preventDefault(); e.dataTransfer.dropEffect = "move";
    const r = row.getBoundingClientRect();
    const ratio = (e.clientY - r.top) / r.height;
    clearDropMarks();
    row.classList.add(ratio < 0.3 ? "drop-before" : ratio > 0.7 ? "drop-after" : "drop-child");
  });
  row.addEventListener("dragleave", () => row.classList.remove("drop-before","drop-after","drop-child"));
  row.addEventListener("drop", e => {
    if(!dragId || dragId === id) return;
    e.preventDefault();
    const mode = row.classList.contains("drop-before") ? "before"
               : row.classList.contains("drop-after") ? "after" : "child";
    clearDropMarks();
    relocate(dragId, id, mode);
    dragId = null;
  });
}

/* ============================================================
   9. 자동완성 — [[페이지]] 와 / 명령
   ============================================================ */
const ac = { open:false, mode:"page", el:null, items:[], sel:0, start:-1, hovering:false };

/* / 를 쳤을 때 뜨는 명령. alias 는 앞글자만 맞아도 걸린다(한글 자모·영문 모두). */
const SLASH = [
  { key:"date", name:"날짜",      hint:"작은 달력에서 골라 넣기",
    alias:["날짜","ㄴㅉ","date","dt","d","cal"] },
  { key:"time", name:"시각",      hint:"지금 시각 " + hhmm(),
    alias:["시각","시간","ㅅㄱ","time","t"] },
  { key:"side", name:"옆에 두기", hint:"이 블록을 오른쪽에",
    alias:["옆에","오른쪽","ㅇㅍ","side","s"] },
  { key:"jjok", name:"쪽글",      hint:"이 블록에 #쪽글 붙이기",
    alias:["쪽글","ㅉㄱ","jjok","tag","태그","j"] },
  { key:"link", name:"링크",      hint:"[글자](주소) 틀 넣기",
    alias:["링크","ㄹㅋ","link","url","l"] }
];
function hhmm(){ const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function slashMatch(q){
  const s = String(q || "").trim().toLowerCase();
  if(!s) return SLASH.slice();
  return SLASH.filter(it =>
    it.name.toLowerCase().indexOf(s) >= 0 ||
    it.alias.some(a => a.toLowerCase().indexOf(s) === 0));
}

function closeAC(){
  ac.open = false; ac.start = -1; ac.mode = "page";
  if(ac.el){ ac.el.remove(); ac.el = null; }
}
function updateAutocomplete(ta){
  if(dp.open) return;
  const pos = ta.selectionStart;
  const before = ta.value.slice(0, pos);

  // 1) [[페이지
  const open = before.lastIndexOf("[[");
  if(open !== -1 && before.indexOf("]]", open) === -1 && !before.slice(open).includes("\n")){
    const q = before.slice(open + 2);
    const ql = q.trim().toLowerCase();
    let list = Object.values(G.pages)
      .filter(p => !ql || p.title.toLowerCase().includes(ql))
      .sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0))
      .slice(0, 8)
      .map(p => ({ title: p.title, isNew:false }));
    // 있는 페이지가 먼저. '새 페이지'는 맨 아래에 둔다.
    // (위에 두면 이름을 줄여 치고 ↵ 를 눌렀을 때 엉뚱한 페이지가 생긴다)
    if(q.trim() && !list.some(i => i.title.toLowerCase() === ql))
      list.push({ title: q.trim(), isNew:true });
    if(!list.length){ closeAC(); return; }
    setAC("page", open, list, ta);
    return;
  }

  // 2) / 명령 — 줄 첫머리나 빈칸 뒤의 / 에서만 연다(2026/08/16, https:// 등은 지나친다)
  const m = /(?:^|[\s(])\/([^\s/]*)$/.exec(before);
  if(m){
    const list = slashMatch(m[1]);
    if(list.length){ setAC("slash", pos - m[1].length - 1, list, ta); return; }
  }
  closeAC();
}
function setAC(mode, start, list, ta){
  const fresh = !ac.open || ac.mode !== mode;
  ac.mode = mode; ac.start = start; ac.items = list;
  ac.sel = fresh ? 0 : Math.min(ac.sel, list.length - 1);
  ac.open = true;
  drawAC(ta);
}
function drawAC(ta){
  if(!ac.el){
    ac.el = document.createElement("div");
    ac.el.className = "ac";
    ac.el.addEventListener("mouseenter", () => ac.hovering = true);
    ac.el.addEventListener("mouseleave", () => ac.hovering = false);
    document.body.appendChild(ac.el);
  }
  ac.el.innerHTML = "";
  if(ac.mode === "slash"){
    const h = document.createElement("div");
    h.className = "ac-head"; h.textContent = "명령";
    ac.el.appendChild(h);
  }
  ac.items.forEach((it, i) => {
    const d = document.createElement("div");
    d.className = "ac-item" + (i === ac.sel ? " sel" : "");
    d.innerHTML = ac.mode === "slash"
      ? `<span class="cmd">/${esc(it.name)}</span><span class="hint">${esc(it.hint)}</span>`
      : (it.isNew ? `<span class="new">새 페이지</span>` : "") + esc(it.title);
    d.addEventListener("mousedown", e => { e.preventDefault(); ac.sel = i; acAccept(); });
    ac.el.appendChild(d);
  });
  const r = ta.getBoundingClientRect();
  ac.el.style.top  = Math.min(r.bottom + 4, window.innerHeight - 260) + "px";
  ac.el.style.left = Math.min(r.left, window.innerWidth - 350) + "px";
}
function acMove(d){
  ac.sel = (ac.sel + d + ac.items.length) % ac.items.length;
  const ta = currentTA(); if(ta) drawAC(ta);
}
function acAccept(){
  const ta = currentTA(); if(!ta || ac.start < 0) return;
  const it = ac.items[ac.sel]; if(!it) return;
  if(ac.mode === "slash"){ const cmd = it; const a = ac.start, b = ta.selectionStart; closeAC(); runSlash(cmd, ta, a, b); return; }
  const ins = `[[${it.title}]]`;
  const a = ac.start, b = ta.selectionStart;
  closeAC();
  replaceRange(ta, a, b, ins);
}
/** 편집기의 [a,b) 구간을 글자로 바꾸고 캐럿을 그 뒤에 둔다. */
function replaceRange(ta, a, b, text){
  ta.value = ta.value.slice(0, a) + text + ta.value.slice(b);
  const c = a + text.length;
  ta.focus();
  ta.setSelectionRange(c, c);
  commit(); autosize(ta); scheduleSave();
}

/* ---- / 명령 실행 ---- */
function runSlash(it, ta, a, b){
  if(it.key === "date"){ openDP(ta, a, b); return; }
  if(it.key === "time"){ replaceRange(ta, a, b, hhmm()); return; }
  if(it.key === "link"){
    replaceRange(ta, a, b, "[]()");
    ta.setSelectionRange(a + 1, a + 1);            // 대괄호 안에 캐럿을 둔다
    return;
  }
  if(it.key === "jjok"){
    replaceRange(ta, a, b, "");
    let v = ta.value.replace(/\s+$/, "");
    if(!/(^|\s)#쪽글(\s|$)/.test(v)) v = (v ? v + " " : "") + "#쪽글";
    ta.value = v;
    ta.setSelectionRange(v.length, v.length);
    commit(); autosize(ta); scheduleSave();
    toast("이 블록에 #쪽글 을 붙였습니다");
    return;
  }
  if(it.key === "side"){
    replaceRange(ta, a, b, "");
    const trimmed = ta.value.replace(/[ \t]+$/, "");
    if(trimmed !== ta.value){ ta.value = trimmed; ta.setSelectionRange(trimmed.length, trimmed.length); }
    const id = editing;
    commit(); exitEdit();
    if(id && G.blocks[id]) sideAdd({ type:"block", id });
    return;
  }
}

const tbar = { el:null, hovering:false };
function tbarHide(){

}
function tbarSync(){

function tbarShow(ta){

    const mk = (label, fn, cls) => {

}
/** 고른 구간이 이미 [[ ]] 안이면 그 제목을 돌려준다 */
function insideLink(v, a, b){
  let m; LINK_RE.lastIndex = 0;
  while((m = LINK_RE.exec(v))){
    const s0 = m.index, e0 = s0 + m[0].length;
    if(a >= s0 && b <= e0) return m[1].trim();
  }
  return null;
}
/** 고른 글자를 [[ ]]로 감싸고 그 페이지를 열어, 이어 쓸 자리에 캐럿을 놓는다. */
function linkSelection(){
  const ta = currentTA();
  if(!ta || !editing) return;
  let a = ta.selectionStart, b = ta.selectionEnd;
  if(b <= a) return;                                   // 고른 게 없으면 아무 일도 하지 않는다
  const v = ta.value;
  while(a < b && /\s/.test(v[a])) a++;                 // 양끝 빈칸은 링크 밖으로 민다
  while(b > a && /\s/.test(v[b - 1])) b--;
  if(b <= a) return;
  const already = insideLink(v, a, b);
  const label = v.slice(a, b);
  const title = already || label;
  if(!already){
    if(/[\[\]]/.test(label)){ toast("대괄호가 든 글자는 감쌀 수 없습니다"); return; }
    const ins = `[[${label}]]`;
    ta.value = v.slice(0, a) + ins + v.slice(b);
    const c = a + ins.length;
    ta.setSelectionRange(c, c);
    commit(); autosize(ta); scheduleSave();
  }
  tbarHide();
  exitEdit();
  const p = getOrCreatePage(title);
  scheduleSave();
  openPage(p.id);
  const kids = p.children;
  const last = kids.length ? kids[kids.length - 1] : null;
  if(last && G.blocks[last]) enterEdit(last, G.blocks[last].content.length);
}
/** 고른 글자에 주소를 단다 */
function linkAddress(){
  const ta = currentTA();
  if(!ta || ta.selectionEnd <= ta.selectionStart) return;
  const a = ta.selectionStart, b = ta.selectionEnd;
  const label = ta.value.slice(a, b);
  const u = prompt(`"${label}" 에 달 주소를 넣으세요`, "");
  if(u === null) return;
  const url = String(u).trim();
  if(!url) return;
  if(!safeHref(url)){ toast("그 스킴은 쓸 수 없습니다"); return; }
  replaceRange(ta, a, b, `[${label}](${url})`);
  tbarHide();
}

let searchState = { open:false, sel:0, results:[] };

  searchState.open = true; searchState.sel = 0;
  const ov = document.createElement("div");
  ov.className = "overlay"; ov.id = "search-overlay";
  ov.innerHTML = `
    <div class="modal">
      <input id="q" placeholder="페이지와 블록 검색…" autocomplete="off" spellcheck="false">
      <div class="results" id="results"></div>
      <div class="modal-foot"><span>↑↓ 이동</span><span>↵ 열기</span><span>esc 닫기</span></div>
    </div>`;
  ov.addEventListener("mousedown", e => { if(e.target === ov) closeSearch(); });
  document.body.appendChild(ov);
  const q = $("#q");
  q.addEventListener("input", () => { searchState.sel = 0; runSearch(q.value); });
  q.addEventListener("keydown", e => {
    if(e.key === "ArrowDown"){ e.preventDefault(); searchState.sel = Math.min(searchState.sel+1, searchState.results.length-1); paintResults(); }
    if(e.key === "ArrowUp"){ e.preventDefault(); searchState.sel = Math.max(searchState.sel-1, 0); paintResults(); }
    if(e.key === "Enter"){ e.preventDefault(); pickResult(searchState.results[searchState.sel]); }
    if(e.key === "Escape"){ e.preventDefault(); closeSearch(); }
  });
  q.focus();
  runSearch("");
}
function closeSearch(){
  searchState.open = false;
  $("#search-overlay")?.remove();
}
function runSearch(term){
  const t = term.trim().toLowerCase();
  const res = [];
  if(!t){
    Object.values(G.pages).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,8)
      .forEach(p => res.push({ kind:"page", id:p.id, text:p.title, where:"최근" }));
  }else{
    Object.values(G.pages).forEach(p => {
      if(p.title.toLowerCase().includes(t))
        res.push({ kind:"page", id:p.id, text:p.title, where:`블록 ${countBlocks(p.id)}` });
    });
    res.sort((a,b) => a.text.length - b.text.length);
    let n = 0;
    for(const b of Object.values(G.blocks)){
      if(n >= 40) break;
      if(!b.content.trim()) continue;
      if(b.content.toLowerCase().includes(t)){
        const pg = pageOf(b.id); if(!pg) continue;
        res.push({ kind:"block", id:b.id, pageId:pg.id, text:plainText(b.content), where:pg.title });
        n++;
      }
    }
    if(!findPageByTitle(term.trim()))
      res.push({ kind:"new", text:term.trim(), where:"새 페이지 만들기" });
  }
  searchState.results = res.slice(0, 50);
  paintResults(t);
}
function paintResults(term = ""){
  const box = $("#results"); if(!box) return;
  box.innerHTML = "";
  if(!searchState.results.length){
    box.innerHTML = `<div class="empty-note" style="padding:14px">찾는 결과가 없습니다.</div>`;
    return;
  }
  searchState.results.forEach((r, i) => {
    const d = document.createElement("div");
    d.className = "res" + (i === searchState.sel ? " sel" : "");
    const label = r.kind === "page" ? "페이지" : r.kind === "block" ? "블록" : "새로";
    d.innerHTML = `<span class="kind">${label}</span>
                   <span class="txt">${highlight(r.text, term)}</span>
                   <span class="where">${esc(r.where||"")}</span>`;
    d.addEventListener("mousedown", e => { e.preventDefault(); pickResult(r); });
    box.appendChild(d);
  });
  box.querySelector(".res.sel")?.scrollIntoView?.({ block:"nearest" });
}
function highlight(text, term){
  const s = esc(text.slice(0, 140));
  if(!term) return s;
  const i = s.toLowerCase().indexOf(term.toLowerCase());
  if(i < 0) return s;
  return s.slice(0,i) + "<b>" + s.slice(i, i+term.length) + "</b>" + s.slice(i+term.length);
}
function pickResult(r){
  if(!r) return;
  closeSearch();
  if(r.kind === "page") openPage(r.id);
  else if(r.kind === "block") openPage(r.pageId, r.id);
  else { openPageByTitle(r.text); }
}

/* ============================================================
   11. 전역 이벤트
   ============================================================ */
document.addEventListener("click", e => {
  // 다른 앱으로 넘어가는 링크는 자리를 뜨기 전에 한 번 저장해 둔다
  const app = e.target.closest("a.ext-link[data-app]");
  if(app){ commit(); doSave(); return; }
  const link = e.target.closest(".page-link, .tag");
  if(link){
    e.preventDefault();
    const p = getOrCreatePage(link.dataset.title);
    if(e.shiftKey) sideAdd({ type:"page", id:p.id }); else openPage(p.id);
    return;
  }
  const todo = e.target.closest(".todo");
  if(todo && todo.dataset.todo){
    const id = todo.dataset.todo;
    toggleTodo(id);
    const content = todo.closest(".content");
    if(content) content.innerHTML = renderInline(G.blocks[id].content, id);
    return;
  }
});
document.addEventListener("copy", e => {
  if(!sel.size || editing) return;
  const t = copySel();
  if(!t) return;
  e.preventDefault();
  e.clipboardData.setData("text/plain", t);
  toast(`블록 ${selWithDescendants().size}개를 복사했습니다`);
});
document.addEventListener("cut", e => {
  if(!sel.size || editing) return;
  const t = copySel();
  if(!t) return;
  e.preventDefault();
  e.clipboardData.setData("text/plain", t);
  deleteSel();
});
document.addEventListener("mousedown", e => {
  if(!sel.size) return;
  if(e.target.closest("#selbar, .content, .bullet")) return;
  clearSel();
});
document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  // 블록이 선택된 상태(편집 중이 아님)
  if(sel.size && !editing){
    if(e.key === "Escape"){ e.preventDefault(); clearSel(); return; }
    if(e.key === "Backspace" || e.key === "Delete"){ e.preventDefault(); deleteSel(); return; }
    if(mod && e.key.toLowerCase() === "a"){
      e.preventDefault();
      const pg = pageOf(selOrdered()[0])?.id;
      const ids = visibleOrder().filter(id => pageOf(id)?.id === pg);
      sel = new Set(topLevelOf(ids)); paintSel(); return;
    }
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      const dir = e.key === "ArrowDown" ? 1 : -1;
      if(e.shiftKey){ extendSelBy(dir); return; }
      const go2 = selFocus && G.blocks[selFocus] ? selFocus : selOrdered()[dir > 0 ? sel.size - 1 : 0];
      clearSel();
      if(go2) enterEdit(go2);
      return;
    }
    if(e.key === "Tab"){
      e.preventDefault();
      e.shiftKey ? outdentGroup() : indentGroup();
      return;
    }
    if(mod && e.shiftKey && e.key.toLowerCase() === "c"){
      e.preventDefault();
      const t = copySel(true);
      if(t){ writeClipboard(t); toast("플레인 텍스트로 복사했습니다"); }
      return;
    }
    if(e.key === "Enter"){
      e.preventDefault();
      const first = selOrdered()[0]; clearSel(); if(first) enterEdit(first); return;
    }
  }
  if(mod && e.key.toLowerCase() === "k"){ e.preventDefault(); searchState.open ? closeSearch() : openSearch(); return; }
  if(mod && e.key.toLowerCase() === "s"){ e.preventDefault(); commit(); doSave(); toast("저장했습니다"); return; }
  if(e.key === "Escape" && searchState.open){ closeSearch(); return; }
  if(mod && e.shiftKey && e.key.toLowerCase() === "d"){ e.preventDefault(); go({type:"daily"}); }
});
window.addEventListener("beforeunload", () => { commit(); if(G) dbPut(G); });
document.addEventListener("visibilitychange", () => { if(document.hidden){ commit(); doSave(); } });

$("#btn-random").onclick  = randomPage;

async function boot(){
  document.documentElement.dataset.theme = localStorage.getItem("jjokgeul-theme") || localStorage.getItem("meoksil-theme") || "light";
  syncMobile();
  let data = null;
  try{ data = await dbGet(); }catch(e){ console.warn("IndexedDB 사용 불가", e); }
  let migrated = false;
  if(!(data && data.pages && data.blocks)){
    try{
      const old = await legacyGet();
      if(old && old.pages && old.blocks){ data = old; migrated = true; }
    }catch(e){ /* 이전 저장소 없음 */ }
  }
  if(data && data.pages && data.blocks){
    G = data; repair();
    if(!G.meta) G.meta = {};
    if(migrated){ await dbPut(G).catch(()=>{}); setTimeout(()=>toast("이전 이름으로 저장돼 있던 글을 그대로 옮겨 왔습니다"), 400); }
    setStatus("saved", migrated ? "이관 완료" : "불러옴");
  }else{
    seed();
    await dbPut(G).catch(()=>{});
    setStatus("saved", "새 그래프");
  }
  if(!G.meta.snapshots) G.meta.snapshots = [];
  render();
  const first = $$(".block")[0];
  if(first) enterEdit(first.dataset.id);
  // 보관 일감은 화면을 띄운 뒤에 조용히
  await loadDirHandle();
  await reconcileSnaps();
  dailySnapshot();
}
boot();
